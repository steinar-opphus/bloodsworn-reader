      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 13</summary><h2>A feast interrupted</h2><p>Sergei says Jaromir has the right to be escorted by two druzhina.</p></details><details><summary>The Shadow of the Gods · 18</summary><h2>New weapons and an attack at the docks</h2><p>In B01-C018, Jaromir leads mounted warriors in plumed iron helmets and long lamellar coats, with Ilia beside him. They loose arrows and charge with lances; more riders attack the Bloodsworn from the rear. Varg penetrates one rider’s lamellar coat through a gap near its fastenings and unhorses the wounded rider.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>Svik says Jaromir and his druzhina are from northern Iskidan, contrasting their origin with the southern Bruised Men. No common skin-colour measurement or Sulich birthplace is established by that statement.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>Glornir reports that two additional druzhina parties joined Jaromir at Liga before his departure two days earlier. His reported fleet comprises three drakkar and two knarr carrying horses. The Bloodsworn depart in pursuit to Iskidan; they do not directly see or intercept that fleet here.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>At the island pool Varg recognises captive druzhina by shaved heads and thick braids, drooping moustaches, lamellar armour and baggy breeches. Some stare slackly while others struggle. A giant tongue-eater swallows one unnamed captive whole; a greying survivor says it infected others with slime.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>The survivor confirms service to Jaromir and says their horse-carrying knarr separated from his drakkar in sea-mist before being attacked. He recognises Glornir as Bloodsworn chief and reports Jaromir taking Vol to Valdai. No named individual identity, new skin-colour description, cure or execution of the remaining captives is established.</p></details></noscript>
