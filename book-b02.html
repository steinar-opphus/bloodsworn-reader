ring with bear-head terminals as a token, claiming it came from Oskutreð’s Battle-Plain and might once have belonged to Berser or his children. Gunnar says they do not know Glornir’s location; Darl is only his guess. Orka promises delivery, and Elvar names Snakavik as the desired meeting place.</p></details><details><summary>The Hunger of the Gods · 46</summary><h2>Chapter 46 - Guðvarr</h2><p>Early after the shield-dance feast, Guðvarr wakes hungover in The Dead Drengr’s roof-space with Vilja. He remembers drinking and returning with her, but not whether they had sex. He dresses, goes through the storeroom into the yard and hears Hakon before the inn has opened.</p></details><details><summary>The Hunger of the Gods · 46</summary><h2>Chapter 46 - Guðvarr</h2><p>Hakon is meeting a hooded man whom he names Kalv. The visitor says Drekr requires proof of commitment before his message. Hakon lifts his hair, and Guðvarr sees a short-regrowth strip and an under-skin shadow resembling the tattoo lines worn by Helka’s Úlfhéðnar. The view does not establish a design, ancestry or power.</p></details><details><summary>The Hunger of the Gods · 46</summary><h2>Chapter 46 - Guðvarr</h2><p>Kalv relays Drekr’s message that the job is done, the day is coming and the prince should be ready. Hakon pales and asks whether she is free; Kalv agrees, without naming her in this exchange. Hakon asks when, and Kalv whispers privately. The whisper’s content remains unnarrated.</p></details><details><summary>The Hunger of the Gods · 46</summary><h2>Chapter 46 - Guðvarr</h2><p>As Rog approaches, Guðvarr enters the room. Hakon’s drengr Gudrun immediately puts a sword point at his throat. The prince recognises the shield-dancer and cloak-giver, then orders the blade lowered and has Rog serve him ale. Guðvarr sits at the prince’s table; Kalv’s glower seems disapproving to him.</p></details><details><summary>The Hunger of the Gods · 46</summary><h2>Chapter 46 - Guðvarr</h2><p>Hakon questions Guðvarr about Sigrún and Skalk, recalling the talon errand. Guðvarr gives a selective account of being commandeered by the Galdurman while Kalv rests a hand on a lap-held seax. Hakon offers friendship and breakfast. Guðvarr feels at home among princes and plans to conceal his Skalk connection, although the prince has already recalled it.</p></details><details><summary>The Hunger of the Gods · 46</summary><h2>Chapter 46 - Guðvarr</h2><p>Rog admits two hooded visitors and calls them more friends of Hakon. They reveal themselves as Skapti and Hrolf from Grimholt. Both are alive outside their former tower cell, but their release, the other prisoners’ fates and the ensuing meeting are not explained before the chapter ends.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Chapter 47 - Varg</h2><p>Two days into the Sea-Wolf’s open-sea passage, Varg is repeatedly sick while Svik and Røkia laugh. Glornir directs the crew’s tacking against a strong south-easterly wind. Røkia estimates land in a day or perhaps a day and a half; this remains a forecast.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Chapter 47 - Varg</h2><p>When Varg asks about Svik’s quietness since Grimholt, Røkia attributes it to Orka. Rejecting Svik’s colourful joining stories, she says Orka found him a ten-year-old runaway thrall, cold, lash-bloodied and hiding under a bush. Orka was chief and decided to take him in and train him, restoring his dignity in Røkia’s account.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Chapter 47 - Varg</h2><p>Røkia recalls three longships attacking the Sea-Wolf as it left a bay. Orka and Thorkel disappeared, and searches of beaches and seabed failed to find them. She says Svik loved Orka like a mother and guesses that seeing her alive reopened the hurt of her departure despite their oath. Varg challenges Røkia’s stone-hearted answer to such pain. This is her testimony and interpretation, not a new battle or Svik’s own explanation.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Chapter 47 - Varg</h2><p>Refna wipes Varg’s chin and brings fresh water. The narration confirms that she kept pace through the first rowing shift out of Liga despite her very thin build. Asked about the older brother whose advice she quotes, she says Kel is dead and that their parents were killed when they were taken.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Chapter 47 - Varg</h2><p>Refna says Kel repeatedly tried to flee. On their last attempt she hurt her ankle and he stayed with her. After capture, she says, Brák nailed him to a wagon and cut his throat as an example. Varg asks about the name Troll-Slayer and she agrees, then names Drekr as the raiders’ chief. The account is testimony, not a witnessed execution; the epithet differs from the earlier Trolls-Bane wording. Røkia expects that this connection will bring them across Orka’s path again.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Chapter 47 - Varg</h2><p>Sulich, his eyes flecked gold, notices something out to sea. Røkia points south and Varg sees two strips of colour which he first hopes are land, then recognises as sails. Glornir passes the tiller to Æsa and orders weapons. The vessels and their intentions remain unidentified, and no engagement or landfall follows before the chapter ends.</p></details><details><summary>The Hunger of the Gods · 48</summary><h2>Chapter 48 - Guðvarr</h2><p>At breakfast in The Dead Drengr, Skapti warns Hakon about Skalk and fixes his gaze on Guðvarr. Believing himself exposed, Guðvarr overturns the table into the prince, throws ale at Kalv and flees through the provisions room and rear courtyard. Falling barrels trip Gudrun, but she resumes pursuit.</p></details><details><summary>The Hunger of the Gods · 48</summary><h2>Chapter 48 - Guðvarr</h2><p>With pursuers behind and to either side, Guðvarr dives into the foul canal, frees an arm caught by his weapons belt and swims to the opposite bank. Hrolf brings a rowing boat for the others. Guðvarr runs through Darl’s alleys and a tannery, then climbs towards the Galdur tower, hoping Skalk will save him.</p></details><details><summary>The Hunger of the Gods · 48</summary><h2>Chapter 48 - Guðvarr</h2><p>Near the gateway he is knocked into a cart, kicks free of Kalv’s ankle-grip and throws a black-bearded trapper into his pursuer. He sees Kalv push a body away with a red seax; the bystander’s fate is unconfirmed. A head blow drops Guðvarr, and Hrolf retrieves a bloody-poll axe. At an unnamed voice’s urging Hrolf raises it, but a spear kills him before the stroke. Its thrower is not identified.</p></details><details><summary>The Hunger of the Gods · 48</summary><h2>Chapter 48 - Guðvarr</h2><p>Tower guards run out with Skalk behind them. Kalv’s eyes turn ink-dark, his neck and shoulders thicken and teeth curl from his lower jaw. Guðvarr recognises him as Tainted and freezes in fear as Kalv charges with his seax. An unnamed voice cries Bindið hann, and a fiery net coils around Kalv, tightens and burns him. Eight or ten guards surround him with spears.</p></details><details><summary>The Hunger of the Gods · 48</summary><h2>Chapter 48 - Guðvarr</h2><p>Skalk is no longer bandaged: he has one eye, raw scars across face and head and exposed patches of skull. He says struggling tightens the net. Guðvarr identifies Kalv as Drekr’s messenger to Hakon, arousing Skalk’s interest, then interprets Kalv’s pressing into the net as an attempt to kill himself.</p></details><details><summary>The Hunger of the Gods · 48</summary><h2>Chapter 48 - Guðvarr</h2><p>Skalk strikes Kalv’s head twice with his staff until he goes limp. After Skalk says Eldur slökktur, steam rises and the net becomes thin cord. Skalk orders the guards to bring Kalv and tells Guðvarr to follow. No interrogation or confirmed death of Kalv follows before the chapter ends.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Chapter 49 - Elvar</h2><p>At first light after a night of conversation in the barn, Elvar bids Orka farewell. She hesitates, then passes on Ulfrir’s wish for good hunting and his prediction that he will see Orka again. Orka’s response is a grunt; Elvar later reports that she gave no answer to the message. Sighvat and Halja exchange sexual jokes, drawing laughter from both groups.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Chapter 49 - Elvar</h2><p>Sæunn answers Orka’s call, sniffs the two bloodstained rags and sets off at a loping run. Orka follows on horseback, her group carrying shields on their backs and leading packhorses laden with sacks and barrels through Starl. Elvar reminds Orka of their bargain; Orka promises the Bloodsworn will hear the offer but leaves acceptance to them. Sighvat says he will miss the group and would welcome them in a shield wall, while Sólín teases him.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Chapter 49 - Elvar</h2><p>Back at the Wave-Jarl, provisions bought by Uspa are stowed aboard. Elvar feels herself growing into chiefship. Asked about his tension since meeting Orka, Grend calls her dangerous and speaks of the scent of death. He explains his contrasting response to Ulfrir and Lik-Rifa through his concern for Elvar’s safety, then admits he may be overprotective. His words are an assessment, not proof of a new sensing power.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Chapter 49 - Elvar</h2><p>Elvar assigns Sighvat the tiller while the Battle-Grim prepare their kit and oars. She finds Uspa, Ulfrir and Skuld at the prow. Uspa says she once ran a farm and compares provisioning the ship favourably with stocking a longhouse. Elvar orders all three back to the stern; Skuld glares. Ulfrir laughs at the lack of an answer from Orka, and Skuld says she liked her. Elvar privately agrees that she would not want Orka as an enemy.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Chapter 49 - Elvar</h2><p>Their attention is on a line of riders along the track between Lake Horndal and the wooded slopes of the Boneback Mountains. Elvar identifies Orka’s group and Ulfrir confirms it. The riders stop, and Elvar feels they are looking back; no exchange is confirmed. Ulfrir stands unnaturally still, then says they will see Orka again. Elvar believes him, but no meeting is arranged.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Chapter 49 - Elvar</h2><p>At Elvar’s order the mooring rope comes aboard, Sólín leaps onto the top-rail and starboard oars push the ship away from the pier. The Wave-Jarl gains speed through bright water and white foam, Elvar’s hand on its carved serpent’s head. Sighvat steers towards the southern river mouth. Elvar names the River Hvítá and then Snakavik, thinking of her father. The chapter ends before arrival.</p></details><details><summary>The Hunger of the Gods · 50</summary><h2>Chapter 50 - Orka</h2><p>Mounted on Trúr beside Lake Horndal, Orka allows a flicker of her wolf to sharpen her sight and smell. Across the water she sees Ulfrir, Skuld and Uspa at the Wave-Jarl’s prow, then hears Ulfrir in her head. He proclaims a wolf and sword age of bloodshed, says he is no passing dream and promises to see her again. His withdrawal leaves her briefly fearful and desolate. She tells him to stay out of her way and head but does not know whether he hears; the ship is moving away.</p></details><details><summary>The Hunger of the Gods · 50</summary><h2>Chapter 50 - Orka</h2><p>An unnamed voice asks why the party has stopped. Orka restrains the wolf within her while Sæunn returns from farther along the track. Orka whistles, bringing Spert dripping from the lake and Vesli hovering from the trees with Breca’s spear. They had expected to watch for a ship; Orka announces the changed plan, and Lif explains that Myrk has been allowed to escape so they can follow her. Vesli praises the ruse, but Spert’s grinding jaws and twitching antennae prompt questions.</p></details><details><summary>The Hunger of the Gods · 50</summary><h2>Chapter 50 - Orka</h2><p>Vesli reports that their maker called in the darkness, and Spert identifies Lik-Rifa. Both say they heard her in their heads; Spert does not know how. Orka finds the account uncomfortably like her own experience with Ulfrir. Vesli says Lik-Rifa made them or their ancestors and describes a song-like call while she slept, ordering them to come and promising great and terrible deeds. These are their reports, without proof that every vaesen heard or obeyed.</p></details><details><summary>The Hunger of the Gods · 50</summary><h2>Chapter 50 - Orka</h2><p>Orka questions whether she can trust them and asks why they remained. Spert cites his oath and pact, rejecting Orka’s reminder that she released him. Vesli cites gratitude to Orka and Breca and says their oath and rescue pact helped her resist a difficult call. Orka recognises the parallel with her own compulsion towards Ulfrir, resisted through her promise to find Breca and avenge Thorkel. Their explanations do not establish a universal protective rule for oaths.</p></details><details><summary>The Hunger of the Gods · 50</summary><h2>Chapter 50 - Orka</h2><p>Orka nods acceptance, and Revna welcomes the pair’s continued presence but worries about the summons. Revna infers that Lik-Rifa is calling all vaesen and asks why. After a silence Orka answers: war. This is their conclusion, not a newly witnessed battle or completed muster.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>Chapter 51 - Varg</h2><p>As two longships approach the Sea-Wolf, Glornir orders the sail furled and the Bloodsworn prepare their weapons. Røkia explains that the wind favours the approaching ships, making flight impractical, and warns of pirates in these waters. Varg is distracted by Refna’s account of Brák until Svik urges him to move. Brák is remembered, not seen.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>Chapter 51 - Varg</h2><p>Svik combs and braids his beard, unrolls oil-protected mail from sheepskin and explains choosing armour against weapons despite its danger at sea. Varg says he feels better, and sees everyone armoured, including Sulich in the gifted lamellar coat. He dresses in his own oil-dark mail, weapons, cap and helm, noting the helm’s imbalance with one ear and freeing his caught beard, then takes shield and uncovered spear.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>Chapter 51 - Varg</h2><p>The two ships are smaller, with perhaps thirty to forty oars each; a raven-haired, fur-clad warrior stands in the nearer prow. Glornir and Æsa welcome the fight. Glornir orders the company to leave the grappling ropes intact, appear vulnerable and then release their beasts, intending no survivors. The company forms back-to-back lines while Einar shelters the children between them. The ships row to opposite flanks. Røkia takes Sulich’s place beside Varg, and an arrow hits Varg’s raised shield before Svik breaks it.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>Chapter 51 - Varg</h2><p>Grapples catch on the higher-riding Sea-Wolf and the attackers climb aboard. Varg resolves to work with his inner wolf while still restraining it. His shield locks with Røkia’s and Svik’s, his underhand spear ready; Røkia tells him to trust the rear line, where he glimpses Ingmar. The boarders are men and women in wool, leather and some tattered mail, strangely silent and dead-eyed. They advance in a stumbling rush, and Glornir chops through a shield into one of them.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>Chapter 51 - Varg</h2><p>A woman keeps attacking after Varg spears her neck; Røkia saves him from her next thrust. Varg survives a blow to his helm while Svik fights beside him. The same woman later grips Varg’s ankle until repeated stabs leave her still and release her hand. Røkia tells him to fight until opponents are down. Exhausted, Varg loses his spear in a man’s chest, is dragged out of the wall and has his shield torn away and seax pinned. A pockmarked assailant opens a foul-smelling mouth whose slimy tongue-tip parts like a toothed mouth of its own.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>Chapter 51 - Varg</h2><p>Varg deliberately tells his wolf to be free and save him. His senses and strength surge, his hands become claws and he tears loose, attacking with teeth, claws and seax. At the end no attackers remain immediately before him: he stands on a mound of corpses and howls beneath slate-grey skies. The whole battle’s outcome, the other flank, the children and Varg’s return to his usual state are not shown.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Chapter 52 - Guðvarr</h2><p>In a chamber of the Galdur tower, Guðvarr stands beside Skalk and Sturla while the burned Kalv is chained to a floor-fixed chair. Tools and a heated knife await on the table and brazier. Guðvarr’s arm has a white-ridged hyrndur scar. Sturla repeatedly smashes Kalv’s toes, but he refuses answers. Skalk asks whether he carries Svin’s blood and threatens worse torture, including his staff; the ancestry question goes unanswered.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Chapter 52 - Guðvarr</h2><p>Yrsa brings Helka, Hakon and the Úlfhéðnar, including Frek. Hakon denies knowing Kalv and calls Guðvarr a liar. Helka demands evidence against her eldest son and heir. Guðvarr points to the hidden mark; Frek restrains Hakon while Helka shaves the patch beneath his hair. A fresh dragon tattoo is exposed, matching Kalv’s shoulder-and-chest design. Helka strikes Hakon and demands answers without maternal protection.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Chapter 52 - Guðvarr</h2><p>Skalk brings the hot knife close enough to singe Hakon’s cheek hairs. Hakon says he fears Drekr, then identifies the risen figure as Lik-Rifa, released from Oskutreð. Kalv confirms it. Asked for corroboration, Frek reports that the Úlfhéðnar have dreamed of a storm-winged dragon. Hakon claims to have seen Drekr and other dragon-born with widespread servants. These statements and dreams are received in the interrogation, rather than new witnessed events.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Chapter 52 - Guðvarr</h2><p>Hakon attributes the release to a Galdrabok found in Rotta’s chamber and a spell requiring Tainted children. Skalk connects this with the copied pages, his tentative Raudskinna identification and earlier testimony about Drekr’s child transport under Hakon’s protection. Kalv threatens Helka, then partly breaks his chair when trying to stop Hakon speaking. At Helka’s command Frek cuts his throat, killing him. Hakon reports Kalv’s destination as Nastrandir, at the north-eastern Bonebacks, three days north of Svelgarth. Skalk’s thoughts about the hall’s survival remain hypothesis.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Chapter 52 - Guðvarr</h2><p>Guðvarr thinks he has fulfilled his assignment and hopes for hyrndur removal, then fears being discarded. Hakon says Lik-Rifa’s return made joining her safer than opposing her and that fear of Helka’s treatment of god-worshippers kept him silent. Helka refuses his proposal to kneel to Lik-Rifa. Skalk suggests that a pact with Orlyg might open the quickest route north; no pact is concluded.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Chapter 52 - Guðvarr</h2><p>Skalk proposes another answer: resurrect Orna, bind her with his link of Ulfrir’s chain and use her against the dragon. He says her skeleton is complete and the copied Raudskinna fragments contain resurrection spells. Helka is interested, but he cannot give an exact timetable: checking gaps, testing runes and forging a god’s collar would take many days. She worries Lik-Rifa may move first. No resurrection, collar or enthralment is performed.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Chapter 52 - Guðvarr</h2><p>Seeking a reason to remain useful, Guðvarr proposes going to Nastrandir as Hakon’s replacement messenger, truthfully saying Kalv was caught and slain, then bringing back intelligence about Drekr’s plans. Skalk praises the idea. No explicit commission, departure or removal of the hyrndur follows before the chapter ends.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>Chapter 53 - Varg</h2><p>After the boarding fight Svik calms Varg, who orders the wolf back and is left exhausted. Svik’s eyes fade from green to blue and Glornir’s bear aspect recedes. Ingmar and Edel finish opponents on deck while one attacking longship escapes.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>Chapter 53 - Varg</h2><p>Glornir pulls a long, hooked, branching creature from a still-moving mortally wounded boarder; the host stops moving. Sulich names it a tungumatur, or tongue-eater. He describes young parasites in stagnant water, oral entry, tongue replacement, numbing and food-sharing, then growth into the thought-cage and control of a short-lived host. He admits not knowing the control mechanism. Varg interprets the pockmarked man’s earlier lunge as attempted transfer. Sulich gives possible spread routes and claims the parasites are common in Iskidan. These lifecycle details are his account, alongside the observed specimen.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>Chapter 53 - Varg</h2><p>Glornir crushes the extracted creature and orders pursuit. Bodies and blood are cleared from the Sea-Wolf, and the company row from before noon towards sunset. Sheltering islands ease the wind and waves as they close on the fugitive, which beaches near an unnamed settlement. The Bloodsworn anchor and go ashore; Einar orders Refna and the children to remain aboard.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>Chapter 53 - Varg</h2><p>The settlement has animal pens, turf-roofed buildings around a well and a beechwood beyond. Varg regards killing the infected as mercy. Einar saves Svik from an attacker chewing at his helm, and Varg directly destroys another host’s mouth parasite. Æsa pursues fugitives into the wood, followed by Varg and Einar. Her scream draws them to a stagnant, algae-covered pool.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>Chapter 53 - Varg</h2><p>At least a dozen infected surround the pool, some binding Æsa, while captured druzhina are tied to trees. A giant tongue-eater, green and mucus-coated, taller and wider than Einar, swallows a druzhina whole. When the infected drag Æsa forward, Varg and Einar charge.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>Chapter 53 - Varg</h2><p>Varg kills an emerging parasite with his cleaver. Einar frees Æsa, who is speared in the thigh. The giant coils around Einar, then throws him into a tree as Varg hacks its body. Æsa strikes it with a spear and Glornir arrives with reinforcements. The giant throws Varg into the pool, but Glornir kills it with his long-axe. Varg scrambles out after holding his mouth shut and breath, without any proved infection or immunity.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>Chapter 53 - Varg</h2><p>Einar is breathing but unconscious, bleeding from the head with an unnaturally angled arm and bone visible. Svik assesses a cracked skull and broken arm, possibly other bones. Røkia takes over care, requests clean water from the ship and linen, and dabs the wound while Ingmar runs for supplies. Edel and her hounds leave to search for remaining parasites; neither recovery nor a completed all-clear is shown.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>Chapter 53 - Varg</h2><p>A greying bound druzhina begs for death and reports the giant infected some captives with slime while eating others. He confirms serving Jaromir, says their horse-carrying knarr became separated in mist, and recognises Glornir’s search for Vol. Pressed for the destination, he says Jaromir is taking her to Valdai. This is testimony, without a new sighting or rescue of Vol, a confirmed arrival or the captives’ final fate.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Chapter 54 - Biórr</h2><p>In Nastrandir’s entrance hall, Biórr and Storolf teach the children with padded practice weapons under Ilska’s war-training regime. Storolf’s acted death demonstrates closing within a long-axe’s reach. Breca identifies the shield opening and insists on sword-craft, inferring Biórr won his sword in combat. His stated intention to win one and glance towards the sparring Brák draw Storolf’s warning to let it go. The children then pair up for practice. Rotta arrives armed and advocates striking unprotected body parts.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Chapter 54 - Biórr</h2><p>Rotta’s approach excites Biórr’s rat nature, which he restrains. The children’s sparring becomes more aggressive and painful, without an established magical cause. Rotta praises the teaching and makes Biórr proud. Seeing Tainted and non-Tainted people working together, Biórr regards the hall as the safe new world he hoped for.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Chapter 54 - Biórr</h2><p>Storolf is quiet and tearful despite his joking. He tells Fain he has dreamed darkly of his brother Kalv and can no longer feel him; Fain shares his worry and embraces him. Biórr thinks Kalv has probably died. This remains a kin-sense report and inference, without an explicit identification with the messenger killed in Darl.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Chapter 54 - Biórr</h2><p>Horns and opening doors admit rain and more than a score of frost-spiders. Other vaesen have already answered Lik-Rifa’s call: tennúr overhead, armed skraeling around her, spiders’ webs and a hyrndur nest on columns, trolls around porridge and a coven of night-hags in a dark chamber. The narration gives the gathered creatures’ pit origins before Eldrafell’s breaking. Lik-Rifa kneels to greet the spiders, then a skraeling horn summons the council. Among the assembled crowd are a few spertus, with no individual identified as Orka’s Spert.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Chapter 54 - Biórr</h2><p>Lik-Rifa says she feels stronger and rested, pleased by her followers and Rotta’s return. She promises punishment for wrongs to the gods’ bloodlines. Biórr imagines freedom from Tainted enslavement and feels his sacrifices justified, while Agnar’s face remains in his memory. Lik-Rifa names Ulfrir as the other reason to act; she does not know his location and intends to tear Vigrið apart until he is found. Ilska pledges to fight.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Chapter 54 - Biórr</h2><p>Ilska describes Svelgarth to the south and ranks Orlyg, Helka and Störr, outlining the Slågen boundary. Her geography and political judgments remain attributed reports. Rejecting Helka’s queenship, Lik-Rifa announces the order of attack: Orlyg at Svelgarth, then Helka, then Störr, freeing Tainted and taking warbands along the way before killing Ulfrir. No march or conquest begins before the chapter ends.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Chapter 55 - Orka</h2><p>After two days Sæunn’s tracking has led Orka north beside Lake Horndal and east along the northern Bonebacks, corroborating Elvar’s warning about Myrk’s false western trail. At camp Spert finishes porridge and Vesli weighs her diminishing teeth bag. The pair agree Vesli is the better flier. Orka asks her to carry Elvar’s silver ring and a message to Glornir, but Vesli’s carrying range is unknown. Orka defers the message and takes the ring back before mounting Trúr and following Sæunn.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Chapter 55 - Orka</h2><p>Pinewoods open into green meadows with black boulders, where Sæunn finds a torn track. Other recent skraeling, troll and faunir trails have all led east. Sæunn smells fine hairs and identifies many frost-spiders, while Lif scans the branches and Orka sees ice-tinged web. Spert says the vaesen answer Lik-Rifa. The narration contrasts the sparsely settled north, where vaesen roam openly, with the human-dominated south; Orka keeps her thoughts on Breca.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Chapter 55 - Orka</h2><p>The track returns to the trees, where Sæunn says the spiders climbed into the canopy. Orka sharpens her wolf senses but detects none. The narration identifies Halja’s Orna ancestry and keen sight; her eyes become tawny-gold flecked as she reports loose webs and spiders long gone. Orka urges vigilance and keeps Sæunn protected by the forward watch.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Chapter 55 - Orka</h2><p>Riding beside Lif, Orka praises Mord for defending his poisoned brother despite fear. Lif remembers none of the fight before the tower and cries at her respect for Mord. Orka recalls Thorkel’s counsel about courage and privately fears failing Breca. Asked why she rescued the ravens, she explains Breca’s example of saving a moth rather than standing by its death.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Chapter 55 - Orka</h2><p>Lif admits loneliness and, beyond revenge against Guðvarr, an interest in Halja. Orka suggests shared grief as common ground; Revna says Halja likes his singing and offers help. Gunnar and Revna trade inconsistent anecdotes about Halja’s partners and a killing in Liga, with Revna admitting uncertainty. The talk establishes Lif’s interest and their advice, without confirming Halja’s feelings or the personal anecdotes.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Chapter 55 - Orka</h2><p>Revna identifies a foul mound as skraeling dung. A horn then draws the party’s attention north across another meadow to a stockaded farm, with screams and black smoke. Long past midday, Halja urges a look. Orka agrees partly to avoid leaving danger behind them at night. The chapter ends before arrival or intervention, with the cause and inhabitants unknown.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Chapter 56 - Elvar</h2><p>Elvar chooses her old oar-chest over the tiller: rowing occupies her, while steering leaves her isolated with thoughts of Lik-Rifa, her blood oath and the approaching encounter. Sighvat handles the tiller and rotating half-crews keep twenty-four oars working from dawn to night camp, making good time down the Hvítá without exhausting the Battle-Grim. Grend lends her his carved leather bottle; she wraps herself in the bear-cloak she now thinks of as hers. Ulfrir sits cloaked among the cargo while Skuld watches the land.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Chapter 56 - Elvar</h2><p>Below Horndal the widened river runs through plains, woods and settlements in Störr’s realm, then curls west towards the Bonebacks and Elvar’s birthplace, Snakavik. An upriver merchant knarr takes the far bank to avoid the Wave-Jarl. Elvar orders Sighvat to intercept it; a dozen spear-armed, mailed guards form along its side. She sees a slim, richly dressed merchant woman in a fur-trimmed hat, with gold-worked belt and pouch. An arrow splashes into the river without an identified archer or victim.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Chapter 56 - Elvar</h2><p>Skuld invokes her birth from Ulfrir and Orna and threatens to kill the strangers. Elvar orders her to wait for commands and asks for Snakavik news. The merchant threatens resistance, but Elvar says she wants information rather than cargo and throws her a silver arm ring. The merchant bites and examines it. Elvar guesses its value may match the cargo and threatens to take it back if unanswered; the ring is not identified as the bear-head ring left with Orka.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Chapter 56 - Elvar</h2><p>The merchant reports that Störr gathers drengrs for war against Helka: Orlyg is said to be bound for Darl, Störr suspects an alliance and intends to strike before Helka is ready. She explicitly attributes this to drengrs’ whispers to whores. Elvar thanks her and resumes the course to Snakavik, thinking of war. No pact, arrival or battle is confirmed by this hearsay.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Chapter 56 - Elvar</h2><p>Grend points out thirty or forty men and women approaching a wooden bridge on the western bank. Their ox-drawn wagons carry stores, with children among the crowd, and they cross east away from Snakavik. Their mail is tattered and rusty, their spear blades dull; shields show a grey dragon in a white sky. Ulfrir sniffs and says they serve his sister. Elvar identifies them as dragon-worshippers, remembers the cages at Snakavik and imagines her father’s rage at their open defiance.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Chapter 56 - Elvar</h2><p>Grend proposes landing to kill them, but Elvar lets them pass, saying to take one battle at a time. The Wave-Jarl passes beneath the bridge and rounds the bend. Ulfrir says Father as the distant silhouette of Snaka’s skull and the fortress upon it comes into view. The chapter ends before docking or meeting Störr.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>Chapter 57 - Orka</h2><p>From a pine ridge Orka sees the farm’s broken gates, hacked stream entrance, burning barn and screaming longhouse. Skraeling skin and strip bodies beside a giant horn and a strange timber mound. Memories of her own home briefly urge her forward, but she refuses Lif’s appeal to Breca’s compassion, blaming the earlier intervention for Mord’s death and warning of the risk to their quests. Lif asks what if someone could have saved her family. She grabs him in anger, then releases him at Halja’s touch, denies being chief and says everyone has a choice.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>Chapter 57 - Orka</h2><p>Gunnar wants fewer enemies before finding Breca, Halja wants vengeance for Vali and Revna prefers fighting now to a possible night attack. Orka agrees. Gunnar demonstrates improved leg use and credits Vesli’s spit. Orka sends him and Revna to the stream entrance while taking Halja and Lif through the gate. Spert and Vesli volunteer; Sæunn catches a spare spear deftly and stays with the horses. The fighters ready shields and helms, Orka checking her seaxes beneath a nasal helm and mail curtain. She warns Lif about skraeling strength, has him scout the courtyard and privately asks the vaesen to keep him alive.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>Chapter 57 - Orka</h2><p>Calling on her wolf, Orka sharpens her senses and charges. She and Halja strike down the first attackers. When her long-axe sticks in a corpse, she fights with hand-axe, seax and teeth; Gunnar intervenes with green-glinting eyes and bared sharp teeth. All seven courtyard skraeling fall. Lif has a splintered shield and facial claw marks, his spear bloody; Spert hovers over a twitching enemy with black swollen veins, while Vesli hammers its teeth. The cause of those veins and exact individual kill credits are not stated.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>Chapter 57 - Orka</h2><p>Gunnar and Revna climb onto the longhouse roof while Orka, Halja and Lif enter past corpses and a burning hearth victim. A few defenders hold locked shields and a boar spear at the far end. Flank attacks and the roof pair’s descent break into the skraeling. Lif spears an attacker dragging Orka by her helm. Afterwards Halja catches him as he sinks to one knee, while Orka pursues fugitives, tumbles down the steps and loses her hand-axe. A skraeling raises an axe over her, but two giant ravens intervene, lifting and tearing attackers apart.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>Chapter 57 - Orka</h2><p>Orka washes in icy water and recovers her weapons. Vesli binds Lif’s deep cheek gash with kneaded mucus while Halja stays close and Spert lies at his feet. Bodies brought out so far number fourteen skraeling and seven people; this is not a final toll. The barn is burned out and Orka recognises the timber mound as a giant nest. Gunnar and Revna return with Sæunn and the horses. Prompted by Revna, Halja acknowledges Lif’s survival and dead enemies; he blushes and smiles, without a romantic declaration from her.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>Chapter 57 - Orka</h2><p>The white-haired survivor introduces himself as Gudleif Arnesson, tall, lean and wiry, limping, with a chin scar and grief-reddened eyes. Orka credits Lif for helping. Gudleif explains that the residents feed the ravens and give them a safe resting place for news and protection; Revna questions the delay, but he points to their arrival. A raven speaks of friendship, startling Gunnar. The birds deny being vaesen and claim Snaka made them as he did giants, Froa and the person addressed, whereas Lik-Rifa made vaesen. Their creation account remains attributed.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>Chapter 57 - Orka</h2><p>The raven beside Orka names herself Kló and identifies Grok, her mate, as the raven saved from frost-web near Grimholt. Grok joins them and thanks Orka. He says they were Snaka’s messengers, eyes, ears and spies, with more ravens once; Kló says Lik-Rifa disliked that. Grok calls their rescue a returned favour. Orka says she needs a favour, but its content is not disclosed before the ending.</p></details><details><summary>The Hunger of the Gods · 58</summary><h2>Chapter 58 - Biórr</h2><p>At Nastrandir’s docks, Biórr feels newly at home after Rotta’s arrival, despite memories of Agnar and Elvar. His rat sharpens hearing and smell and lets his skeleton compress into a narrow hiding place. He catches Kráka preparing a snekke to return Bjarn to his mother.</p></details><details><summary>The Hunger of the Gods · 58</summary><h2>Chapter 58 - Biórr</h2><p>Kráka exposes her damaged arm and says the blóð svarið punishes thoughts of breaking the earlier bargain. She explains why Bjarn’s spell and the frozen journey delayed escape. A rune begins to form when Biórr blocks her, but Bjarn’s longing for his mother changes his mind. Biórr gives Kráka his spear and has her strike him to conceal his assistance.</p></details><details><summary>The Hunger of the Gods · 58</summary><h2>Chapter 58 - Biórr</h2><p>Storolf tends the injured Biórr, who denies knowing his assailant. Rotta privately warns him about loyalty; Biórr thinks the god knows. At dawn the fugitives are brought back bound. Rotta examines the oath wounds, hears Uspa’s name, and says only quick death can free Kráka. Ilska shows her scar while describing Uspa’s refusal.</p></details><details><summary>The Hunger of the Gods · 58</summary><h2>Chapter 58 - Biórr</h2><p>Breca intervenes for Bjarn and attacks Brák after being slapped, showing green-brown eyes and sharp teeth. Rotta subdues him with a partial facial change and a command to control his beast. Bjarn is freed. Brák then challenges Biórr’s story and makes Kráka’s killing a loyalty test. Ilska orders it, Drekr invokes the crew oath, and a voice associated with Rotta urges survival. Biórr drives his spear into Kráka’s throat; the chapter stops at that act.</p></details><details><summary>The Hunger of the Gods · 59</summary><h2>Chapter 59 - Varg</h2><p>The Sea-Wolf reaches vast Ulaz, passing bull and scorpion monuments before heading inland. The company has left the still-unconscious, feverish Einar with Æsa and all the children on the island, providing a third of its stores and water precautions. Varg continues anxious mouth inspections without a confirmed infection.</p></details><details><summary>The Hunger of the Gods · 59</summary><h2>Chapter 59 - Varg</h2><p>Svik trims Varg&#x27;s beard and adds a silver ring, then shaves his back and sides while leaving the top. Røkia adopts the haircut. Svik tells an explicitly uncertain saga of three brothers and the Shadow-Walker founding Iskidan&#x27;s unified rule; Røkia supplies Kirill&#x27;s claimed descent but calls the supernatural story a tale.</p></details><details><summary>The Hunger of the Gods · 59</summary><h2>Chapter 59 - Varg</h2><p>On the Reka, Røkia teaches axe-and-shield coordination and dangerous counters, then demonstrates a covered-axe face strike which Varg says loosens a tooth. Edel and Sulich return with news of Jaromir&#x27;s departure and Vol&#x27;s reported abuse. They propose a possible footpath interception on the route to Valdai. Glornir cracks the rail in anguish and orders rowing for Vol, leaving the mystery of Ulaz&#x27;s restricted eastern harbour unresolved.</p></details><details><summary>The Hunger of the Gods · 60</summary><h2>Chapter 60 - Guðvarr</h2><p>Guðvarr&#x27;s frozen journey with Frek reaches the Nastrandir approach. Frek sends him alone using Hakon&#x27;s directions. His horse bolts when he catches on a web, and a frost-spider and tennúr take him captive. He wakes web-bound before Drekr.</p></details><details><summary>The Hunger of the Gods · 60</summary><h2>Chapter 60 - Guðvarr</h2><p>His report of Kalv&#x27;s death draws grief and threats against Skalk from Fain and Storolf; the precise family connection remains his inference. He presents himself as an ambitious follower of Hakon, and Drekr frees him from the web.</p></details><details><summary>The Hunger of the Gods · 60</summary><h2>Chapter 60 - Guðvarr</h2><p>Lik-Rifa returns with a whale in her talons, drops it in the crowded hall and appears in human form. Guðvarr delivers the rehearsed cover story about the messenger&#x27;s suicide, then shows his dragon tattoo under suspicion from Ilska. Lik-Rifa threatens those without her mark. Guðvarr concludes that she believes him, but no further task is assigned before the ending.</p></details><details><summary>The Hunger of the Gods · 61</summary><h2>Chapter 61 - Elvar</h2><p>The Wave-Jarl reaches crowded Snakavik as snow begins. Elvar returns Skuld&#x27;s ornate sword and belt while restricting its use. Grend recounts becoming her childhood weapons teacher and reassures her about her current plan; she responds with affection after snapping at him.</p></details><details><summary>The Hunger of the Gods · 61</summary><h2>Chapter 61 - Elvar</h2><p>Elvar presents the Battle-Grim as muster recruits, gaining waived harbour fees and a fortress pass for everyone. The crew arms and disembarks, Ulfrir hooded and Skuld&#x27;s wings concealed. Uspa casts an untested ward over the treasure left aboard. They walk towards Störr&#x27;s fortress to seek Uspa&#x27;s husband; no confrontation or rescue occurs before the ending.</p></details><details><summary>The Hunger of the Gods · 62</summary><h2>Chapter 62 - Biórr</h2><p>The army prepares to leave Nastrandir for Svelgarth through the southern tunnels. Biórr, assigned behind the wagons and children, prepares his kit and urges Storolf to turn grief for his brother Kalv into vengeance. Kráka&#x27;s blood and the narrator&#x27;s description of Biórr as her executioner confirm the consequence of the prior strike; he now feels empty.</p></details><details><summary>The Hunger of the Gods · 62</summary><h2>Chapter 62 - Biórr</h2><p>Myrk arrives wounded and weakened, reporting the mine force dead and Varg responsible for her father&#x27;s death. She names Orka as her captor and eye&#x27;s destroyer, identifies Drekr as Orka&#x27;s quarry and says she sent Orka towards Iskalt. Breca responds with hope and a taunt; Drekr strikes him. Myrk wants him dead, but collapses. Rotta argues that Breca should remain alive as bait for his mother.</p></details><details><summary>The Hunger of the Gods · 63</summary><h2>Chapter 63 - Varg</h2><p>After two days&#x27; hard rowing, all fifty-four travelling Bloodsworn leave the hidden Sea-Wolf and run Sulich&#x27;s mountain shortcut. Varg scouts with Edel, Røkia and the hounds, drawing strength and senses from his wolf. Sulich labours under lamellar armour and says he has hawk blood.</p></details><details><summary>The Hunger of the Gods · 63</summary><h2>Chapter 63 - Varg</h2><p>Sulich identifies the road and Valdai and says they have arrived ahead of Jaromir. He explicitly calls Jaromir his half-brother and predicts that arrogance will prevent advance scouts. Glornir chooses the constricted vale, sends Edel along the road and Røkia towards the fortress, and begins preparing an ambush. No enemy contact or rescue occurs yet.</p></details><details><summary>The Hunger of the Gods · 64</summary><h2>Chapter 64 - Orka</h2><p>Sæunn tracks Myrk through snow to a coastal cliff. Orka cuts a frost-spider strand; Spert identifies Lik-Rifa&#x27;s Nastrandir and opens concealed serpent-carved doors by saying Opinn. Orka charges in hoping for Breca, but the chamber is empty. Spert cannot explain his knowledge and Halja attributes it to Lik-Rifa&#x27;s summons.</p></details><details><summary>The Hunger of the Gods · 64</summary><h2>Chapter 64 - Orka</h2><p>The hall holds evidence of recent occupation, with Halja estimating the troll dung at a day old or less. Orka has sent Vesli with Kló and Grok towards Darl to seek Glornir, though no arrival is confirmed. Lif&#x27;s cheek heals and his confidence has grown. The throne&#x27;s serpents rear when he approaches, prompting Halja to shield him. Sæunn then finds Myrk&#x27;s onward trail.</p></details><details><summary>The Hunger of the Gods · 65</summary><h2>Chapter 65 - Elvar</h2><p>Elvar uses the bark pass to lead the Battle-Grim through Snaka&#x27;s bone tunnel into the snowbound muster camp. She and Grend raise their hoods and present the crew as recruits, but the gate guard requires Störr&#x27;s personal approval and assigns Syr as escort.</p></details><details><summary>The Hunger of the Gods · 65</summary><h2>Chapter 65 - Elvar</h2><p>Barracks and busy armourers show large preparations for war; Elvar&#x27;s question about Lik-Rifa is not yet answered. Nervous beneath an idle pose, she takes only Grend, Sighvat, Uspa and Ulfrir into her father&#x27;s hall. The chapter ends before the meeting.</p></details><details><summary>The Hunger of the Gods · 66</summary><h2>Chapter 66 - Varg</h2><p>Waiting at the ambush, Varg tends and ties back his new haircut. Sulich explicitly acknowledges Kirill as his father and Jaromir as his paternal half-brother. He names Hauker as his bloodline and Rurik as Jaromir&#x27;s twin, while uncertainty remains over the real motive for their pursuit of him.</p></details><details><summary>The Hunger of the Gods · 66</summary><h2>Chapter 66 - Varg</h2><p>Røkia returns with an estimated garrison count and Valdai layout; Edel warns of Jaromir&#x27;s approach. Glornir sets two ranks at the bottleneck, with Varg behind Røkia. Jaromir arrives, threatens them and orders Iva forward beside a huge collared man. Vol is directly visible behind them, shackled and abused, and recognises Glornir. His body swells as he roars and calls the shield wall; combat has not yet begun.</p></details><details><summary>The Hunger of the Gods · 67</summary><h2>Chapter 67 - Elvar</h2><p>Entering the hall evokes Elvar&#x27;s memories of her mother&#x27;s death and Grend&#x27;s grief. She sees Gytha watching Grend, Silrið beside Störr, Hjalmar Peacemaker of the Fell-Hearted, her brothers Thorun and Broðir, collared Berserkir including living Berak, and Hrung sleeping on his pedestal.</p></details><details><summary>The Hunger of the Gods · 67</summary><h2>Chapter 67 - Elvar</h2><p>Störr assumes Agnar has brought the Battle-Grim to serve him and insults his daughter. Elvar declares Agnar dead, says the company has a new chief and pushes back her hood to greet her father. The chapter ends before his response.</p></details><details><summary>The Hunger of the Gods · 68</summary><h2>Chapter 68 - Varg</h2><p>Arrows interrupt Iva&#x27;s spell and the huge collared man catches her. The mounted charge strikes the concealed shallow ditch; Ilia leads a smaller surviving attack, but Glornir wounds and unhorses her. The wall advances as hidden Bloodsworn attack from the slopes, and Varg applies Røkia&#x27;s shield-hook tactic.</p></details><details><summary>The Hunger of the Gods · 68</summary><h2>Chapter 68 - Varg</h2><p>The swelling bull-like man leaves Iva beneath trees and smashes through the formation. He breaks Ingmar&#x27;s spear; Varg intervenes and loses his seax in the man&#x27;s thigh, while Røkia and Svik are thrown aside. Ingmar unleashes his bear and fights with the spear halves until the opponent collapses. Ingmar lives but is badly hurt.</p></details><details><summary>The Hunger of the Gods · 68</summary><h2>Chapter 68 - Varg</h2><p>During the melee Jaromir escapes with Vol tied to her horse and about a dozen riders. The Bloodsworn win the local battle, not the rescue, and Glornir orders pursuit.</p></details><details><summary>The Hunger of the Gods · 69</summary><h2>Chapter 69 - Elvar</h2><p>Störr explains his intended pre-emptive war against Helka and Orlyg and initially doubts Elvar&#x27;s dragon news. She offers to buy Berak for twice his price, then to hire the Berserkir with a larger second chest to rescue Bjarn. Silrið calls the treasure ancient and powerful. Störr punishes Berak through the collar when he asks about his son.</p></details><details><summary>The Hunger of the Gods · 69</summary><h2>Chapter 69 - Elvar</h2><p>Störr refuses to transfer collar control and tries instead to recruit Elvar and threaten the treasure aboard her ship. She refuses. Grend and Sighvat arm to protect her, Gytha challenges Grend, and Störr orders the Berserkir forward. Elvar summons Ulfrir to the front; no clash, sale, release or ship seizure is completed here.</p></details><details><summary>The Hunger of the Gods · 70</summary><h2>Chapter 70 - Varg</h2><p>The pursuing Bloodsworn reach Valdai. One of Edel&#x27;s hounds falls to arrows, while Røkia and Sulich get inside before the gates close. Varg vaults over Ingmar using a lodged spear, fights onto the walkway and is joined by others; the gates open to the company. Røkia protects him after he suffers a facial wound.</p></details><details><summary>The Hunger of the Gods · 70</summary><h2>Chapter 70 - Varg</h2><p>Jaromir threatens Vol, but her headbutt and Ingmar&#x27;s intervention break his hold. He kills Ingmar with sabre blows and trampling before fleeing into the hall. Vol is alive: Glornir removes her lip stitches, and she burns away her own manacles. They force entry, withstand arrows and pursue Jaromir below. Vol kills him with the door&#x27;s splinters despite his threat that Rurik will avenge him.</p></details><details><summary>The Hunger of the Gods · 70</summary><h2>Chapter 70 - Varg</h2><p>They find a rune-marked map of Vigrið whose purpose they cannot yet explain. A call behind the tapestry leads Sulich to a barred prison, where he recognises Kirill&#x27;s Tainted children as his siblings. Their physical release is not shown before the chapter ends.</p></details><details><summary>The Hunger of the Gods · 71</summary><h2>Chapter 71 - Elvar</h2><p>Elvar names Ulfrir and orders Berak spared. Hrung recognises the god; Störr drives the Berserkir forward with collar fire. Ulfrir fully becomes a giant wolf and wrecks the hall, killing despite the restraint order. Uspa shields Elvar against Silrið, while Grend, Sighvat and arriving Battle-Grim protect her. Skuld captures Störr and, at Elvar&#x27;s nod, delivers him to Ulfrir&#x27;s jaws.</p></details><details><summary>The Hunger of the Gods · 71</summary><h2>Chapter 71 - Elvar</h2><p>Thorun inherits and exercises collar control, ordering Elvar killed. Hjalmar refuses to intervene. Silrið binds Thorun and switches to addressing Elvar as jarl; Elvar kills her brother and successfully halts the Berserkir through their collars. She spares the submitting Broðir. The Battle-Grim acclaim her, Uspa reunites with still-collared Berak, and many outside warriors flee or kneel before Ulfrir. This is acquired coercive control, not demonstrated emancipation or a universal oath.</p></details><details><summary>The Hunger of the Gods · 72</summary><h2>Chapter 72 - Orka</h2><p>Orka&#x27;s group overlooks Svelgarth as a mixed human/vaesen army approaches and begins camping. Halja confirms children at the wagons, but Breca and Drekr are not individually sighted: Orka believes both must be present. Lif steadies her and they withdraw to prepare.</p></details><details><summary>The Hunger of the Gods · 72</summary><h2>Chapter 72 - Orka</h2><p>In a pine dell they ready kit, horses and water while Sæunn watches and Spert rests in the stream. Orka offers the others a choice to stay out, but they volunteer. She sets a new plan focused on extracting Breca and killing only those who stop her. No rescue attempt is yet shown.</p></details><details><summary>The Hunger of the Gods · 73</summary><h2>Chapter 73 - Biórr</h2><p>At Svelgarth Biórr remains haunted by Elvar and the people he betrayed despite intimacy with Myrk. She explains the dusk delay, tells him how thoughts of him sustained her journey and leaves for rune-work at the wall.</p></details><details><summary>The Hunger of the Gods · 73</summary><h2>Chapter 73 - Biórr</h2><p>He joins the rearguard around the children and supply wagons, with Breca and Harek visible but Bjarn not found in his glance. Tannbursta eats a refused tooth while Storolf grieves. The attack begins at darkness, but some vaesen continue guarding camp. Ilmur fears Brák&#x27;s cruelty and wrong smell; Fain and Biórr resist Storolf&#x27;s desire to leave Rotta&#x27;s guard assignment.</p></details><details><summary>The Hunger of the Gods · 74</summary><h2>Chapter 74 - Orka</h2><p>Fiery ropes and trolls tear down Svelgarth&#x27;s gate tower. Orka frees Sæunn outright, removes her collar and offers her a choice; Sæunn elects to take the horses to a southern lake rendezvous. Halja, Lif and Spert make a counterattack distraction while Orka, Gunnar and Revna approach the wagons. Orka instructs Lif in a night-hag striking phrase before they separate.</p></details><details><summary>The Hunger of the Gods · 74</summary><h2>Chapter 74 - Orka</h2><p>After killing spider and skraeling guards, Orka finds and embraces Breca. He learns his father will not return. Bjarn agrees to accompany them towards Uspa, and Breca sends other children fleeing with supplies. Orka recognises Harek as Asgrim&#x27;s boy, but he refuses to join them and shouts an alarm. The chapter stops before they escape the camp.</p></details><details><summary>The Hunger of the Gods · 75</summary><h2>Chapter 75 - Biórr</h2><p>Biórr identifies the rescuers and, fearing punishment after Bjarn&#x27;s escape, leads pursuit despite briefly wishing to let them go. Ilmur&#x27;s hound-driven rush ends in a neck wound from Revna, and Biórr spears Revna through the chest. Gunnar defends her as Orka knocks Biórr away and fights Fain and Storolf.</p></details><details><summary>The Hunger of the Gods · 75</summary><h2>Chapter 75 - Biórr</h2><p>Fain is left gravely wounded but wheezing, Storolf tackles Orka, and Revna lies still in blood without a separate final death statement here. Gunnar fights and disarms Biórr before returning guards overpower him. Rotta captures Gunnar under spear threat and approaches Orka and Storolf; Breca&#x27;s and Bjarn&#x27;s final escape is not accounted for.</p></details><details><summary>The Hunger of the Gods · 76</summary><h2>Chapter 76 - Orka</h2><p>Rotta holds Breca and forces Orka and Gunnar into capture. Breca shows wolf-like traits plus something Orka cannot identify; Revna is directly confirmed dead. Storolf, explicitly Svin-blooded, tends his still-breathing father. Rotta scents Ulfrir on Orka and threatens Breca with Storolf&#x27;s axe to force the god&#x27;s location from her.</p></details><details><summary>The Hunger of the Gods · 76</summary><h2>Chapter 76 - Orka</h2><p>Spert&#x27;s apparent threat turns into an intervention: he stings Storolf and blasts Rotta with a black cloud, followed by an unidentified spear throw. Rotta grows into a giant rat, throwing captives and guards aside. Lif cuts Orka free, Halja covers them and Spert brings Breca. Gunnar emerges with Revna&#x27;s body, and Orka leads them running into the trees. Rotta, Storolf and Fain have no final outcome confirmed here; Bjarn&#x27;s position is unaccounted for.</p></details><details><summary>The Hunger of the Gods · 77</summary><h2>Chapter 77 - Guðvarr</h2><p>At Darl&#x27;s public ceremony, Skalk and his apprentices use blood, ground runes and an expanded collar to raise Orna bodily. She speaks and questions the collar as Helka claims ownership, but Lik-Rifa immediately attacks and the gods fight over the fortress. Hakon accuses Guðvarr of a false timetable.</p></details><details><summary>The Hunger of the Gods · 77</summary><h2>Chapter 77 - Guðvarr</h2><p>Dragon followers infiltrate the courtyard behind Drekr and Ilska. Sigrún first calls for protection, then stabs Helka and sends her out of view. The Úlfhéðnar answer Hakon before Guðvarr kills him; Estrid claims their protection and fights Guðvarr until crashing gods interrupt. Her later location is not seen.</p></details><details><summary>The Hunger of the Gods · 77</summary><h2>Chapter 77 - Guðvarr</h2><p>Guðvarr admits betrayal and reports that Lik-Rifa removed the hyrndur after exposing the cover story. Skalk&#x27;s recall fails, but Yrsa intervenes before Guðvarr can kill him. Vaesen swarm the battle. Lik-Rifa kills the resurrected Orna, leaving torn remains; Guðvarr survives, while Skalk, Yrsa, Estrid and the full city&#x27;s outcome remain outside his final view.</p></details><details><summary>The Hunger of the Gods · 78</summary><h2>Chapter 78 - Orka</h2><p>Spert guides the fugitives along a stream into a river valley. They split to confuse pursuit and plan to meet at the lake; Gunnar carries Revna and receives Orka&#x27;s promise of revenge. Running beside Breca, Orka learns that his blood holds both wolf and bear, recognising herself and Thorkel in him.</p></details><details><summary>The Hunger of the Gods · 78</summary><h2>Chapter 78 - Orka</h2><p>Frost-spiders attack. Orka and Breca kill their attackers, but a neck bite poisons Orka and suppresses her wolf strength. Breca tries to carry her until she can no longer move. Surrounded, she throws him into the river, sees him resurface and watches the current carry him away. She kills two more spiders before further bites and a night-hag overwhelm her. The chapter ends as darkness takes her, without confirming her death or Breca&#x27;s destination.</p></details></noscript>
