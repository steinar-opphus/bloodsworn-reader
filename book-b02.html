      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 1</summary><h2>Introduction</h2><p>The second book resumes with Orka and the Bloodsworn in the burned hall at Grimholt. The summaries below follow the opening chapters only as far as you have read.</p></details><details><summary>The Hunger of the Gods · 1</summary><h2>CHAPTER ONE / ORKA</h2><p>After a nightmare about her family, Orka wakes among the Bloodsworn in the burned hall at Grimholt and nearly attacks Lif before restraining herself. Lif is alive but still affected by frost-spider venom. She bathes and changes into clean clothes he supplies.</p></details><details><summary>The Hunger of the Gods · 1</summary><h2>CHAPTER ONE / ORKA</h2><p>Orka admits her Tainted nature and says Breca carries her wolf-blood. She tells Lif that she and Thorkel left the Bloodsworn while she was pregnant, swimming ashore during a sea battle and allowing the company to believe them dead. She now accepts the return of her Skullsplitter identity in the search for Breca.</p></details><details><summary>The Hunger of the Gods · 1</summary><h2>CHAPTER ONE / ORKA</h2><p>Orka and Lif recover Mord&#x27;s body from the ruined tower for burial. Svik confronts her over abandoning her oath. Glornir tells her of Vol&#x27;s abduction; Orka identifies Skalk and says his party fled by snekke.</p></details><details><summary>The Hunger of the Gods · 1</summary><h2>CHAPTER ONE / ORKA</h2><p>Vesli warns that Lik-Rifa is free, supported by Spert. Glornir initially dismisses the reports as bad dreams; these responses do not undo the release already witnessed in book one.</p></details><details><summary>The Hunger of the Gods · 2</summary><h2>CHAPTER TWO / ELVAR</h2><p>The surviving Battle-Grim bury Agnar at Oskutreð. Little more than thirty remain, and Sighvat agrees they will collect treasure. Elvar vows vengeance on Biórr; Vörn lies blackened, while the red-winged gaoler remains bound and unconscious.</p></details><details><summary>The Hunger of the Gods · 2</summary><h2>CHAPTER TWO / ELVAR</h2><p>Uspa demands fulfilment of the oath to recover Bjarn. Elvar&#x27;s scars burn when she considers abandonment and cool when she recommits; Sighvat suffers a similar reaction. Uspa says even thoughts of breaking it are punished. Elvar plans to seek the whole company&#x27;s support after their treasure hunt.</p></details><details><summary>The Hunger of the Gods · 2</summary><h2>CHAPTER TWO / ELVAR</h2><p>Orv finds the white-winged gaoler&#x27;s bow, though the source of its apparent power is uncertain. Elvar gives Grend an ancient wolf-decorated axe and receives replacement mail recovered from the remains.</p></details><details><summary>The Hunger of the Gods · 2</summary><h2>CHAPTER TWO / ELVAR</h2><p>The winged captive awakens, breaks her bonds and attacks. Elvar collars her and uses blood and spoken commands to force submission. The woman names herself Skuld; Elvar declares her a thrall. Told her sisters are dead, Skuld grieves, then says the real treasure is below Oskutreð.</p></details><details><summary>The Hunger of the Gods · 3</summary><h2>CHAPTER THREE / VARG</h2><p>Varg and the Bloodsworn help Orka and Lif bury Mord. Varg comforts Lif with his grief for Torvik and Frøya; Jökul promises vengeance for Torvik. Lif seals a blood feud against Guðvarr and anyone who blocks his revenge.</p></details><details><summary>The Hunger of the Gods · 3</summary><h2>CHAPTER THREE / VARG</h2><p>Glornir calls Breca his nephew. Orka says Breca is ten and recounts her family&#x27;s loss, naming the dragon-born Drekr as her target. Varg reveals a captured seax whose hilt matches her recovered blades; Røkia suggests a shared maker, while Orka suspects the events are connected.</p></details><details><summary>The Hunger of the Gods · 3</summary><h2>CHAPTER THREE / VARG</h2><p>Glornir puts Vol&#x27;s rescue first. Lif reports Skalk&#x27;s shoulder wound and destroyed staff. Orka believes he is heading for Darl but did not see Vol aboard; Vesli describes a mailed woman carrying a blue-marked person. Glornir chooses Darl as their destination.</p></details><details><summary>The Hunger of the Gods · 4</summary><h2>CHAPTER FOUR / ELVAR</h2><p>Skuld identifies herself as Orna and Ulfrir&#x27;s daughter. Elvar claims control through the collar, learned from overheard binding words in Störr&#x27;s hall, and offers shared vengeance. Skuld compares their situations as forms of bondage. Elvar cannot wear her new mail because of her shoulder wound.</p></details><details><summary>The Hunger of the Gods · 4</summary><h2>CHAPTER FOUR / ELVAR</h2><p>Twenty Battle-Grim descend with a wagon while ten guard the surface treasure. A wagon-wide torch-lined ledge spirals into immense root-filled caverns containing chests and the sisters&#x27; living quarters. Skuld recounts their oath to their father and their failed attempts to kill or starve Lik-Rifa.</p></details><details><summary>The Hunger of the Gods · 4</summary><h2>CHAPTER FOUR / ELVAR</h2><p>At a forge they find white-feathered arrows; Uspa senses power and Skuld credits Verdani. Orv receives arrows for the recovered bow. In Vergelmir they encounter a pale rat-like creature, then see a luminous procession Uspa calls the soul road, passing through the Corpse-Gate. Skuld says Lik-Rifa fed on passing souls, but does not know the halls beyond.</p></details><details><summary>The Hunger of the Gods · 4</summary><h2>CHAPTER FOUR / ELVAR</h2><p>Deeper inside, a black-bound book stands protected by red runes. Huld crosses the boundary and triggers a blast that knocks them down and extinguishes the torches. As light returns, an unidentified grey slime-covered creature attacks.</p></details><details><summary>The Hunger of the Gods · 5</summary><h2>CHAPTER FIVE / BIÓRR</h2><p>Biórr returns to the Raven-Feeders, who reward his infiltration of Agnar’s band. Despite his welcome, he feels awkward and ashamed of how he killed Agnar.</p></details><details><summary>The Hunger of the Gods · 5</summary><h2>CHAPTER FIVE / BIÓRR</h2><p>Myrk, Ilska’s sister, envisages a new hierarchy under Lik-Rifa. Biórr finds Kráka and Ilmur without collars, but Bjarn and the other children remain collared and affected by what Myrk calls a calming spell.</p></details><details><summary>The Hunger of the Gods · 5</summary><h2>CHAPTER FIVE / BIÓRR</h2><p>Lik-Rifa returns with a huge bear, feeds and takes human form. She intends to recover and gather her people at Nastrandir. Ilska sends Myrk to bring their father and finds from Rotta’s chamber to the eastern Bonebacks.</p></details><details><summary>The Hunger of the Gods · 6</summary><h2>CHAPTER SIX / ELVAR</h2><p>The Battle-Grim face a swarm of creatures beneath Oskutreð. Grend rescues Elvar, Orv’s arrows burst into flame on impact, and Skuld fights under Elvar’s command. Uspa produces a bright light that kills or drives back the attackers; some of the company have died.</p></details><details><summary>The Hunger of the Gods · 6</summary><h2>CHAPTER SIX / ELVAR</h2><p>Uspa passes the rune-door as its runes vanish. Elvar forces Skuld to kneel, beats her and threatens her against further betrayal. Uspa identifies the black-bound book as a Galdrabok written by Lik-Rifa and says it contains resurrection spells.</p></details><details><summary>The Hunger of the Gods · 6</summary><h2>CHAPTER SIX / ELVAR</h2><p>Skuld begs for her father’s return. Elvar proposes raising Ulfrir to fight Lik-Rifa and recovering Bjarn, then controlling him with a collar forged from his old chain. Uspa agrees, accepting Elvar’s promise to try to free Berak and Grend’s assent; she claims the book can enable both the collar and resurrection.</p></details><details><summary>The Hunger of the Gods · 6</summary><h2>CHAPTER SIX / ELVAR</h2><p>Huld wants to leave with the treasure, while Orv opposes raising another god. Elvar permits those outside the oath to leave but appeals to their desire for fame. Neither the company’s final decision nor Ulfrir’s resurrection occurs here.</p></details><details><summary>The Hunger of the Gods · 7</summary><h2>CHAPTER SEVEN / ORKA</h2><p>At Grimholt, Orka cleans her mail. Glornir offers her a return to the Bloodsworn, although not as chief. She refuses, choosing the search for Breca and vengeance for Thorkel. The narration explicitly identifies Thorkel as Glornir’s younger brother.</p></details><details><summary>The Hunger of the Gods · 7</summary><h2>CHAPTER SEVEN / ORKA</h2><p>Orka plans to go west to the mine where the company fought a dragon-born. Glornir assigns Edel to guide her while returning to the Sea-Wolf, which he says waits on the River Slågen. He agrees to take the rescued children as far as Darl and offers Lif passage, conditionally on trust.</p></details><details><summary>The Hunger of the Gods · 7</summary><h2>CHAPTER SEVEN / ORKA</h2><p>Lif asks to stay with Orka and continue learning weapons craft. He blames Guðvarr for Mord’s death but says he is not ready for a fair fight. Orka tells him to gather equipment and supplies; he subsequently rides out with mail, weapons and a spare provision-laden horse. He asks Glornir to leave Guðvarr alive for his revenge.</p></details><details><summary>The Hunger of the Gods · 7</summary><h2>CHAPTER SEVEN / ORKA</h2><p>Røkia and Varg lead the departing scouts; Einar drives the children’s wagon after Glornir’s company. Edel and nine companions form Orka’s separate escort, and Edel starts towards the gates. Breca’s whereabouts and Vol’s recovery remain unresolved.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>CHAPTER EIGHT / ELVAR</h2><p>Elvar, Uspa, Grend and Sighvat forge a collar for Ulfrir. Uspa and Elvar add blood; Elvar’s spoken commands make it open and shut. On returning above ground they find the Battle-Grim have chosen to join the dragon-slaying effort.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>CHAPTER EIGHT / ELVAR</h2><p>Uspa consults Lik-Rifa’s Galdrabok and carves an eight-spoked runic-stave around Ulfrir’s remains. Sighvat lifts her while Elvar commands the collar to grow around the skeleton and close. Elvar recalls learning the binding language by overhearing Silrið.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>CHAPTER EIGHT / ELVAR</h2><p>Uspa leads the company in a blood ritual. A glowing rune settles over Ulfrir’s bones and flesh regrows, but his body remains lifeless until she strikes his chest and repeats her command. He gasps, stands and howls, shaking the ground.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>CHAPTER EIGHT / ELVAR</h2><p>Still wounded and exhausted, Ulfrir collapses and changes into a man in torn mail and a wolf-pelt cloak. Skuld cradles his head and tells him her mother and sisters are dead. His grief and bloody coughing leave Sighvat questioning how he can slay a dragon; control of the living god and his fighting ability remain untested.</p></details><details><summary>The Hunger of the Gods · 9</summary><h2>CHAPTER NINE / BIÓRR</h2><p>Biórr watches Myrk ride south with fifteen warriors and spare horses. Red Fain, whom he remembers for early kindness, brings him to a meal with Storolf Wartooth. Their welcome eases some of his unease. Storolf identifies a group of new warriors as Drekr’s companions.</p></details><details><summary>The Hunger of the Gods · 9</summary><h2>CHAPTER NINE / BIÓRR</h2><p>Lik-Rifa wakes speaking of Ulfrir and insists he is alive, despite Ilska’s denial. She transforms, kills and swallows a guard, while Drekr rescues Ilska. He then stands with his axe between his sister and the dragon. Lik-Rifa returns to human form and praises his loyalty while threatening defiance.</p></details><details><summary>The Hunger of the Gods · 9</summary><h2>CHAPTER NINE / BIÓRR</h2><p>Ilska confirms using the Raudskinna and finding the chamber of the brother whom Lik-Rifa identifies as its owner. Lik-Rifa says she sensed her spell restoring Ulfrir and blames the use of her own protected book. Her account does not identify the resurrection book as the Raudskinna.</p></details><details><summary>The Hunger of the Gods · 9</summary><h2>CHAPTER NINE / BIÓRR</h2><p>Lik-Rifa orders haste south across Isbrún Bridge, warning that sólstöður’s end will trap them north of the pit. A threat to eat someone else sends the camp into hurried movement; no crossing occurs here.</p></details><details><summary>The Hunger of the Gods · 10</summary><h2>CHAPTER TEN / ORKA</h2><p>Orka wakes to danger in a moonlit woodland camp. Her sharpened wolf senses reveal attackers and Lif’s absence. A night-hag grips her with its hair; an ordinary axe stroke passes through it, but speaking the words Uspa taught her lets her strike and disperse it.</p></details><details><summary>The Hunger of the Gods · 10</summary><h2>CHAPTER TEN / ORKA</h2><p>She finds a second hag choking Lif and disperses it with the same spoken attack. Lif recovers his breath and admits falling asleep on watch. Edel rebukes him and assigns Ingmar the next watch.</p></details><details><summary>The Hunger of the Gods · 10</summary><h2>CHAPTER TEN / ORKA</h2><p>Orka later wakes from a vivid dream of a wolf or man calling her name, resisted by invoking her oath and her family. The caller’s identity and the dream’s external reality are not established.</p></details><details><summary>The Hunger of the Gods · 10</summary><h2>CHAPTER TEN / ORKA</h2><p>Edel warns that Lif is a burden and a danger to the Bloodsworn’s secret. Orka has not told him their collective nature, although the women reason he may deduce it. When Edel suggests it might have been better if the hag had taken him, Orka declares him under her protection. Edel challenges her former oath-breaking; Orka acknowledges leaving but keeps her regrets and reasons private. Spert interrupts asking for food.</p></details><details><summary>The Hunger of the Gods · 11</summary><h2>CHAPTER ELEVEN / VARG</h2><p>Røkia trains Varg on a grassy plateau above the Bloodsworn’s woodland camp. After his fall and a blow from his own shield, she urges him to exploit his spear’s reach and learn weapons craft rather than rely on his wolf-blood.</p></details><details><summary>The Hunger of the Gods · 11</summary><h2>CHAPTER ELEVEN / VARG</h2><p>Varg has slept poorly, dreaming of an enormous pack of howling wolves and an amber-eyed, wolf-grey man calling to him. The dream’s caller is not identified.</p></details><details><summary>The Hunger of the Gods · 11</summary><h2>CHAPTER ELEVEN / VARG</h2><p>The company is three days south of Grimholt in the Boneback Mountains, pursuing Skalk. Glornir has forbidden fires and orders them to prepare to leave. Røkia is now chief scout.</p></details><details><summary>The Hunger of the Gods · 11</summary><h2>CHAPTER ELEVEN / VARG</h2><p>Varg is wearing his captured mail but has left his loose helm on his belt. Røkia briefly changes her eyes and teeth, bites a new hole in its leather strap, and returns to normal; the adjusted helm fits him. Svik urges mastery of the beast in his blood. Røkia compares controlled release to a stream instead of a flood, and Varg asks her to teach him.</p></details><details><summary>The Hunger of the Gods · 12</summary><h2>CHAPTER TWELVE / GUÐVARR</h2><p>Guðvarr rows with the Grimholt fugitives along the River Drammur in two overcrowded snekkes. Four days after his flight, he nurses his shame and fears returning to Sigrún without Orka’s head. Arild offers him food. They have left the steep mountain valley, and Skapti estimates one more day to Darl.</p></details><details><summary>The Hunger of the Gods · 12</summary><h2>CHAPTER TWELVE / GUÐVARR</h2><p>Vol is aboard, bound and collared. Yrsa gives her water and food. Vol threatens pursuit by the Bloodsworn; Skalk dismisses her value and Glornir’s reputation. She challenges his diminished power and missing staff, an assessment he does not answer.</p></details><details><summary>The Hunger of the Gods · 12</summary><h2>CHAPTER TWELVE / GUÐVARR</h2><p>Skalk threatens to fit a collar of his own making in Darl and make Vol permanently his thrall. Guðvarr notices fear in her eyes before she insults Skalk again. Yrsa strikes and re-gags her on his order. No new collar is fitted here.</p></details><details><summary>The Hunger of the Gods · 12</summary><h2>CHAPTER TWELVE / GUÐVARR</h2><p>A gravely wounded royal drengr beside Guðvarr is still breathing and has a pulse. Guðvarr steals his brooch, declares him dead and enlists Arild to lift him. Concealing his fluttering eyelids, Guðvarr throws him into the river and enjoys the extra room. The man’s eventual fate is not shown.</p></details><details><summary>The Hunger of the Gods · 13</summary><h2>CHAPTER THIRTEEN / VARG</h2><p>Glornir sends Svik and Varg to gather news at an unnamed river village. Njal reports that two crowded snekkes stopped three or four days earlier, left dead for burial and stole food; he cannot confirm seeing Vol.</p></details><details><summary>The Hunger of the Gods · 13</summary><h2>CHAPTER THIRTEEN / VARG</h2><p>A thrall, Terna, recognises Varg. She says Frøya was alive when Brimil sold Terna to Njal, and that Brimil beat Frøya for repeated escape attempts. Njal places Brimil at Darl’s thrall-market. Svik promises to help find him. Varg also tells Terna he killed Kolskegg and ran; this is his admission, not a reconstruction of the earlier memory gap.</p></details><details><summary>The Hunger of the Gods · 13</summary><h2>CHAPTER THIRTEEN / VARG</h2><p>A dragon preacher proclaims Lik-Rifa’s coming. Svik knocks him from his cart with a thrown cheese round, and the preacher’s companions attack. Varg joins in rage, tries the pack-leader teaching, and batters an attacker with his helm. Svik stops a final blow; Varg gradually reins in the wolf. The repaired helm strap is torn again.</p></details><details><summary>The Hunger of the Gods · 13</summary><h2>CHAPTER THIRTEEN / VARG</h2><p>The Bloodsworn inspect a buried warrior whose torn face Varg associates with an animal attack. The corpse is not Skalk; Røkia explains Glornir’s desire to kill him personally. Varg looks towards Darl anticipating both Skalk and Brimil.</p></details><details><summary>The Hunger of the Gods · 14</summary><h2>CHAPTER FOURTEEN / BIÓRR</h2><p>Biórr crosses Isbrún Bridge with the company. Ilmur thanks him for freedom, and Biórr says he escaped slavery as a child and was found by Red Fain. He remains troubled by memories of Elvar.</p></details><details><summary>The Hunger of the Gods · 14</summary><h2>CHAPTER FOURTEEN / BIÓRR</h2><p>Beyond the bridge he recognises a tennúr nest and warns Ilska. Lik-Rifa lands and calls out; tennúr swarm from the hill. Fain and Storolf form a shield wall while Ilska and the dragon-born raise a fire-rune dome. Lik-Rifa stops their intervention: the creatures swarm affectionately rather than attack her.</p></details><details><summary>The Hunger of the Gods · 14</summary><h2>CHAPTER FOURTEEN / BIÓRR</h2><p>Lik-Rifa changes to human form and claims the vaesen as her creations and children. A tennúr promises obedience. When Ilska shows disgust, Lik-Rifa threatens her and demands respect for their vaesen allies; Ilska submits.</p></details><details><summary>The Hunger of the Gods · 14</summary><h2>CHAPTER FOURTEEN / BIÓRR</h2><p>The tennúr return underground. Lik-Rifa speaks at the bridge boulder, white veins spread through the stone, and steam clears to leave the bridge invisible to Biórr. She takes Ilska’s black mare and says the tennúr will follow after a task. The company rides east towards Nastrandir; neither that task’s outcome nor arrival is shown.</p></details><details><summary>The Hunger of the Gods · 15</summary><h2>CHAPTER FIFTEEN / ORKA</h2><p>Orka and Lif reach the excavation called Rotta’s chamber with Edel’s escort. The clearing holds decomposing bodies and four barrows. Orka recognises the dead dragon-born and finds a winged dragon tattoo matching Drekr’s and an oath stone, but its wider meaning is unknown. Spert offers distinctions after tasting several corpses.</p></details><details><summary>The Hunger of the Gods · 15</summary><h2>CHAPTER FIFTEEN / ORKA</h2><p>Gunnar Prow and Revna Hare-Legs guide them underground. A scarred slab has four broken restraints; Gunnar and Revna recount Rotta’s punishment and ask how he escaped. Their accounts of Valkyrie’s murder and Raudskinna remain saga-tales.</p></details><details><summary>The Hunger of the Gods · 15</summary><h2>CHAPTER FIFTEEN / ORKA</h2><p>A parchment heading identifies copies from Rotta’s Galdrabok fragments. Orka asks for the scrolls to be gathered for Glornir and Vol. Revna says Skalk took a chest containing more scrolls and Orna’s talon.</p></details><details><summary>The Hunger of the Gods · 15</summary><h2>CHAPTER FIFTEEN / ORKA</h2><p>In a room filled with child-sized mattresses, Spert and Vesli single out one where Spert says Breca was held. Orka kneels and renews her resolve to find him. She refers camp decisions to Edel, recommends the woods because the chambers have only one entrance, and stays to search further.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>CHAPTER SIXTEEN / GUÐVARR</h2><p>The fugitives reach Darl. Skalk makes Guðvarr carry the chest. In the market they pass seven cages of bodies labelled dragon-worshippers.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>CHAPTER SIXTEEN / GUÐVARR</h2><p>Sturla and armed companions confront Skapti when he wants to report to Hakon. Skalk insists on controlling the report and hiding his knowledge of Hakon’s dealings with Drekr. Skapti yields; he, Arild and the other companions are sent towards the tower while Guðvarr follows Skalk.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>CHAPTER SIXTEEN / GUÐVARR</h2><p>Before Helka, Hakon, Sigrún, Jaromir and other jarls, Skalk blames Störr and accuses the Bloodsworn of betrayal and theft. Jaromir recognises Vol and presses his grievance; Helka conditionally offers to help hunt the Bloodsworn. These accusations are Skalk’s account, not established guilt.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>CHAPTER SIXTEEN / GUÐVARR</h2><p>Skalk opens the chest with spoken magic and displays bones, tools and copied manuscripts. He identifies the former bone weapon as Orna’s missing talon and fits it into the skeletal foot, where flame marks its attachment. Helka calls Orna complete. Skalk tentatively identifies the copies as Raudskinna fragments; Guðvarr sees opportunity.</p></details><details><summary>The Hunger of the Gods · 17</summary><h2>CHAPTER SEVENTEEN / ELVAR</h2><p>The weary Battle-Grim approach the bridge with four loaded wagons. Ulfrir remains badly weakened and resents his collar. Skuld warns him against disobedience; Elvar proposes common cause against Lik-Rifa, which he cautiously acknowledges.</p></details><details><summary>The Hunger of the Gods · 17</summary><h2>CHAPTER SEVENTEEN / ELVAR</h2><p>Huld challenges Elvar’s authority and presses for rest and choosing a new chief. Grend prevents Elvar from drawing her sword. Uspa warns of losing the crossing, and the group agrees to continue. The succession remains unresolved.</p></details><details><summary>The Hunger of the Gods · 17</summary><h2>CHAPTER SEVENTEEN / ELVAR</h2><p>Elvar steps where the bridge should be and falls; Grend and Sighvat save her. Uspa’s blood ritual fails to restore the bridge. Ulfrir then uses his blood and words; mist forms like wolf and dragon clash, the bridge reappears, and the entire party and four carts cross.</p></details><details><summary>The Hunger of the Gods · 17</summary><h2>CHAPTER SEVENTEEN / ELVAR</h2><p>Tennúr erupt from the nest beyond the pit. Elvar forms a shield wall, but the creatures fly over it to Ulfrir’s wagon. He fights in wolf form, Skuld joins him, and Uspa’s flaming rune-shield and the warriors break the swarm. A handful flee; Ulfrir is bleeding but standing, and Skuld rises to one knee.</p></details><details><summary>The Hunger of the Gods · 18</summary><h2>CHAPTER EIGHTEEN / ORKA</h2><p>In the rainy camp Orka says the chambers yielded no onward clue to Breca. Edel must leave to bring the Sea-Wolf to Darl, but speaks warmly of Orka’s return and wishes her success.</p></details><details><summary>The Hunger of the Gods · 18</summary><h2>CHAPTER EIGHTEEN / ORKA</h2><p>Orka trains Lif with Gunnar and Ingmar Ice. Lif reiterates his desire for revenge; Halja tells him she lost her brother. After Edel’s insistence, Lif fetches a grey shield, and Orka demonstrates its defensive and striking uses, then knocks Ingmar down with a concealed punch.</p></details><details><summary>The Hunger of the Gods · 18</summary><h2>CHAPTER EIGHTEEN / ORKA</h2><p>Vesli warns of riders. The Bloodsworn conceal themselves and see Raven-Feeders led by an unnamed dark-haired woman. She grieves at a corpse as her companions search the site. Ingmar tries to stop Orka, but she steps out to ask where her son was taken. No answer or fight is shown before the chapter ends.</p></details><details><summary>The Hunger of the Gods · 19</summary><h2>CHAPTER NINETEEN / VARG</h2><p>Varg and Røkia scout across a recently repaired bridge ahead of the Bloodsworn and the children’s cart. Varg deliberately calls on the wolf to sharpen his senses; Røkia warns that his changing eyes could expose him to the untouched. He feels safe among friends.</p></details><details><summary>The Hunger of the Gods · 19</summary><h2>CHAPTER NINETEEN / VARG</h2><p>They look down on Darl beside the widening Drammur. Through wolf vision Varg studies its fortress, four courtyard building groups and central longhouse. Røkia identifies the skeleton as Orna and the bone-sword as one of its talons.</p></details><details><summary>The Hunger of the Gods · 19</summary><h2>CHAPTER NINETEEN / VARG</h2><p>The company camps outside town. Einar feeds and plays with the children, deliberately letting them win at dodge-the-troll; Røkia joins competitively, knocks children down and is baffled by his explanation.</p></details><details><summary>The Hunger of the Gods · 19</summary><h2>CHAPTER NINETEEN / VARG</h2><p>Glornir refuses to wait for the Sea-Wolf and plans to follow the river south to meet it once Vol is recovered. He proposes leaving the children at camp to enter Darl the following day. Einar warns they risk enslavement, but Glornir insists they have slowed the company. Svik stops Einar’s further protest. Varg thinks of destroying collars and confronting Brimil first; no rescue, departure or confrontation is shown.</p></details><details><summary>The Hunger of the Gods · 20</summary><h2>CHAPTER TWENTY / ORKA</h2><p>Lif follows Orka into the glade, where she plans to leave only one enemy alive. A warrior explicitly names the leader Myrk Sharp-Claw. Myrk asks who killed her father; Orka denies killing him. Orka gets no location for Breca, but interprets Myrk’s reaction to Drekr’s name as familiarity. Myrk orders them seized.</p></details><details><summary>The Hunger of the Gods · 20</summary><h2>CHAPTER TWENTY / ORKA</h2><p>Orka releases the wolf, her eyes and teeth changing, and kills three attackers. Vesli helps Lif against an axewoman while Orka protects Vesli with a thrown axe. Revna and the Bloodsworn join the battle as Orka fights Myrk.</p></details><details><summary>The Hunger of the Gods · 20</summary><h2>CHAPTER TWENTY / ORKA</h2><p>An attacker whom Orka identifies as Berserkir pins and throttles her. Spert intervenes, followed by a hound. Freed, Orka grapples Myrk, suffers a bite through her mail and wrenches Myrk’s arm until bone cracks. Myrk casts rune-fire that burns Orka’s cheek; Orka ducks beneath it and strikes her jaw. Myrk falls and the fire vanishes; her death is not established.</p></details><details><summary>The Hunger of the Gods · 20</summary><h2>CHAPTER TWENTY / ORKA</h2><p>Orka calms the wolf and gets up with head and shoulder wounds. Halja kills a remaining Raven-Feeder. Gunnar is bloodied below the knee and Revna hurries to him. Edel rebukes Orka, while Lif stands shaken with damaged gear and Vesli delights in the teeth.</p></details><details><summary>The Hunger of the Gods · 21</summary><h2>CHAPTER TWENTY-ONE / GUÐVARR</h2><p>Guðvarr dreams of being made a jarl and marrying Helka, before she becomes Orka and bites his throat. He wakes hungover beside an unnamed woman in The Dead Drengr’s hayloft. Yrsa summons him to the queen.</p></details><details><summary>The Hunger of the Gods · 21</summary><h2>CHAPTER TWENTY-ONE / GUÐVARR</h2><p>At Helka’s door the guard Frek sniffs him with amber-flickering eyes, recalling the nightmare. Jaromir leaves angrily after a muffled conversation whose meaning Guðvarr cannot establish. Inside, Helka and Skalk are joined by Estrid, Helka’s youngest child. Guðvarr’s imagined betrothal is only speculation.</p></details><details><summary>The Hunger of the Gods · 21</summary><h2>CHAPTER TWENTY-ONE / GUÐVARR</h2><p>Yrsa corroborates his rescue of Skalk, and Helka gives him a gold arm ring in thanks. Estrid asks to leave for weapons practice with Frek, and Helka permits it. Asked about Orka, Guðvarr gives a selective account, omitting the Oath Rock Althing and his duel with Virk. Helka speaks of Vafri’s loss and her value as a gift to Sigrún; Skalk describes Orka’s search for her stolen son.</p></details><details><summary>The Hunger of the Gods · 21</summary><h2>CHAPTER TWENTY-ONE / GUÐVARR</h2><p>Helka wants Orka brought before her, but declines Guðvarr’s quickly regretted offer to fetch her. Instead she offers him an unspecified task closer to home. He agrees, and Skalk tells him to follow; the task is not yet revealed.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>CHAPTER TWENTY-TWO / ORKA</h2><p>Vesli tends Orka’s head and shoulder wounds, removing broken mail links and applying green material that leaves the injuries numb. Orka sees that Myrk’s seax shares the craftsmanship of the blades she recovered from Thorkel. The Bloodsworn have survived, though all except Edel are wounded; Lif is shaken and vomiting. Vesli also treats Gunnar’s thigh wound.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>CHAPTER TWENTY-TWO / ORKA</h2><p>Myrk is alive, bound and gagged. Orka takes her coin and silver arm rings, keeps linen stained with her blood, then wakes and questions her. Myrk invokes Lik-Rifa, recognises the Bloodsworn as Tainted and says Drekr told her about Orka’s attack at The Dead Drengr. She gives no location for Breca. Orka loses her temper and beats her until Edel, Halja and Revna intervene; Myrk remains alive.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>CHAPTER TWENTY-TWO / ORKA</h2><p>As the group prepares to leave, Orka and Lif wear captured sealskin cloaks. Ingmar shares porridge and speaks warmly of Orka and Thorkel; Orka feeds Spert porridge mixed with her blood and spit. She plans to track the riders and question Myrk again. Edel suggests the north-western path towards Lake Horndal and Starl, without confirming where the riders began.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>CHAPTER TWENTY-TWO / ORKA</h2><p>Edel must return to the Sea-Wolf but authorises Halja, Gunnar and Revna to go with Orka. Halja seeks vengeance for her brother; Gunnar jokes about avoiding rowing, and Revna wants a place in Skullsplitter’s saga-song. Orka accepts them after warning of the danger. Their departure is still being prepared. Vesli ends the chapter complaining that her collected teeth need a bigger bag.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>CHAPTER TWENTY-THREE / GUÐVARR</h2><p>Skalk leads Guðvarr and Yrsa through a secret tunnel from Helka’s chamber area to the Galdur tower of Darl. He flatters Guðvarr, threatens him and demonstrates a palm flame. The task is to befriend Hakon, whom Skalk suspects of concealing dangerous matters from Helka. At the tower threshold Guðvarr is immobilised until Skalk speaks.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>CHAPTER TWENTY-THREE / GUÐVARR</h2><p>Sturla returns wounded with apprentices and a wooden female form Skalk identifies as a Froa-spirit whose tree they killed. She fears Kuru may die. Inside, Guðvarr sees Skapti and Hrolf imprisoned. Vol is alive but badly injured, shackled and with her lips stitched shut; apprentices drag her to the workroom.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>CHAPTER TWENTY-THREE / GUÐVARR</h2><p>The workroom contains rune-copying, recovered bones and manuscripts, cages, a pool and a nest. Skalk identifies a faunir, a Näcken in the pool and the nest of hyrndur. He calls the central iron link a shard of Ulfrir’s chain and claims shavings go into every Tainted collar. He plans a new staff from the Froa before replacing Vol’s collar; neither act is completed.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>CHAPTER TWENTY-THREE / GUÐVARR</h2><p>Skalk has Guðvarr strapped to the table and summons a hyrndur to his palm. He claims the creature will burrow near Guðvarr’s heart, detect betrayal and later leave on command. The insect begins tearing into Guðvarr’s arm and is half-buried when the chapter ends; the claimed surveillance and eventual outcome are unproven. Guðvarr sees a hawk watching from a beam, without learning its identity or role.</p></details><details><summary>The Hunger of the Gods · 24</summary><h2>CHAPTER TWENTY-FOUR / VARG</h2><p>Varg enters Darl from the west with Svik, Jökul and Æsa, amid small Bloodsworn bands approaching separately. The crowded streets lead from foul-smelling canals and workshops through the traders’ ring. Æsa shares a biscuit. Varg asks about the thrall-market but Svik keeps him focused on the rescue.</p></details><details><summary>The Hunger of the Gods · 24</summary><h2>CHAPTER TWENTY-FOUR / VARG</h2><p>They have left shields and helmets with the wagon, concealing mail and weapons beneath cloaks. Glornir’s orders are to gather at the tower by sunset while Helka feasts. Svik stresses speed, staying together, waiting for Glornir and concealing their Tainted nature. Entry, finding Vol and overcoming Galdur-users remain anticipated difficulties.</p></details><details><summary>The Hunger of the Gods · 24</summary><h2>CHAPTER TWENTY-FOUR / VARG</h2><p>As they check equipment, Æsa says pain sharpens her. Jökul rubs mud into his hands and explains his saga-based reminder of mortality and its practical value for grip. He reassures the frightened Varg as a brother, then speaks of avenging Torvik if they encounter Yrsa. Varg tells the stirring wolf to wait and removes the cover from his spear.</p></details><details><summary>The Hunger of the Gods · 24</summary><h2>CHAPTER TWENTY-FOUR / VARG</h2><p>Beyond the trading ring, the smiths’ steam startles Varg. With only a few rows of buildings left before the tower, they hear a scream, fighting, horses and a concussive explosion. The group runs; the cause, their entry and the rescue’s outcome are not shown.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>CHAPTER TWENTY-FIVE / GUÐVARR</h2><p>Guðvarr survives the hyrndur’s passage into his chest, still exhausted and bound. A collared bull-like man breaks through the workroom wall and mounted archers pour in. Skalk and the apprentices raise flame shields and throw fire; the Näcken drags a horse and rider beneath the pool.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>CHAPTER TWENTY-FIVE / GUÐVARR</h2><p>Skalk sends the hyrndur swarm at the attackers. The hawk tears his face and injures one eye, after which the swarm becomes disorganised. Jaromir arrives with the tattooed Seiðr-woman Iva; he recalls the hawk to his arm. Iva extinguishes the flames with mist and opens a ground fissure. Sturla falls, Skalk falls and Yrsa leaps after him; the table splinters above the chasm.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>CHAPTER TWENTY-FIVE / GUÐVARR</h2><p>Iva rusts an iron restraint and frees Vol from the table. Jaromir takes Vol over his saddle and Ilia retrieves the chest, whose bones Jaromir calls those of great Hraeg. They ride out. The badly burned bull-like man is named Taras and leaves with Iva. Their departure does not recover Vol for the Bloodsworn.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>CHAPTER TWENTY-FIVE / GUÐVARR</h2><p>Guðvarr frees himself from the broken table and finds Arild dead in a barrel. He leaves Skapti, Hrolf and other prisoners locked up. More fighters enter the courtyard; Guðvarr kills an unnamed hammer-wielder, prompting an unnamed cleaver-wielder to throw an axe that kills a tower guard. Pursued, Guðvarr escapes through the tunnel without being stopped by its ward. The unnamed fighters’ possible identities remain unconfirmed.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>CHAPTER TWENTY-SIX / VARG</h2><p>Varg and Svik’s group reach the tower amid fighting between Jaromir’s druzhina and the guards. Glornir enters through the gate while Svik sends his band over the stockade. Varg briefly keeps the wolf’s strength under control, but sees Jökul killed with his own hammer. He finds the corpse at the threshold, retrieves his axe and pursues the dark-haired killer towards a tunnel.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>CHAPTER TWENTY-SIX / VARG</h2><p>After the searchers fail to find Vol, Glornir guesses Skalk may be with Helka and leads the Bloodsworn through the tunnel. He uses a brief clawed change to smash the trapdoor, then returns to normal. Røkia kills the chamber guard and the group interrupts Hakon with an unnamed woman. He claims not to know where Skalk and Vol are; Glornir orders him taken, and Røkia forces him out.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>CHAPTER TWENTY-SIX / VARG</h2><p>In Darl’s feast hall, Varg’s head pain intensifies beneath Orna’s bones. He recognises Jökul’s killer holding the hammer before Helka, but Svik restrains him. Glornir attacks the queen’s Úlfhéðnar guards. An attacker tears off Varg’s ear before dying; Sulich removes her body and helps him upright.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>CHAPTER TWENTY-SIX / VARG</h2><p>The Bloodsworn are being pushed back by superior numbers while hiding their Tainted blood. Helka orders the fighting stopped and her Úlfhéðnar disengage. The chapter ends with Røkia holding the naked Hakon in front of her, a seax at his throat; no bargain or escape is shown.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>CHAPTER TWENTY-SEVEN / GUÐVARR</h2><p>Guðvarr watches the halted confrontation, learning Glornir’s identity. When Glornir threatens Hakon’s life over Vol, Guðvarr reveals that Jaromir took her and the chest, repeating the claimed Hraeg identification. He drops Jökul’s hammer; Varg accuses him of the killing, but Glornir stops his advance.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>CHAPTER TWENTY-SEVEN / GUÐVARR</h2><p>Helka bargains over her son while Estrid says he should die. Yrsa and Sturla bring the injured Skalk into the hall alive. Varg demands Yrsa too for Torvik’s death; Glornir again holds him back. Helka refuses to surrender Skalk and instead proposes hiring the Bloodsworn to pursue Jaromir.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>CHAPTER TWENTY-SEVEN / GUÐVARR</h2><p>Glornir defers killing Skalk and accepts a bargain: Hakon stays as surety until they are clear of Darl, payment is split between now and delivery of Jaromir or his head, and Helka supplies a drakkar. One of her Úlfhéðnar is to accompany them as Hakon’s guardian. The agreement and provisioning orders do not yet amount to payment, boarding, departure or Hakon’s release.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>CHAPTER TWENTY-SEVEN / GUÐVARR</h2><p>After an internal pinch that he attributes to the hyrndur, Guðvarr remembers his assignment to befriend Hakon. With permission he covers the prince in a dead drengr’s cloak. Varg grips him, confirms his name and warns that Lif is coming for him. Helka forbids further bloodshed; Glornir orders Varg to let go, giving Guðvarr the name of his adversary.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>CHAPTER TWENTY-EIGHT / ELVAR</h2><p>After making a new camp beyond the tennúr hill, Elvar prepares before dawn; Uspa has tended the wounded gods, who sleep through the night. At sunrise Huld calls an Althing to choose Agnar’s successor. Sighvat and Grend decline nomination. Elvar puts herself forward against Huld, refusing Grend’s offer to fight in her place.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>CHAPTER TWENTY-EIGHT / ELVAR</h2><p>The Battle-Grim mark a spear-bounded holmganga square. Grend seconds Elvar and Urt seconds Huld. Both candidates choose death as the terms, with no later blood feud or weregild permitted. Huld presses Elvar’s apparent shield-side weakness, but Elvar traps her sword, cuts her face and kills her with a throat thrust.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>CHAPTER TWENTY-EIGHT / ELVAR</h2><p>Elvar then reports no pain, crediting Uspa’s pre-dawn Seiðr-runes; the chapter does not establish complete or permanent healing. Sighvat puts Agnar’s bearskin cloak around her, pins it with gold and proclaims her Elvar Fire-Fist, chief of the Battle-Grim. Ulfrir and Skuld have awakened to watch, and Ulfrir acknowledges her with a smile and nod.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>CHAPTER TWENTY-EIGHT / ELVAR</h2><p>Her first order is a barrow for Huld. Considering Ulfrir’s incomplete recovery and a company she judges fewer than forty spears, she orders a return south towards the Wave-Jarl, rather than immediately pursuing the recalled eastward tracks. Burial, travel, arrival and Bjarn’s rescue remain uncompleted here.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>CHAPTER TWENTY-NINE / VARG</h2><p>The morning after the fight, Varg is bandaged after his ear wound was cauterised. The Bloodsworn have received a chest of silver and taken dockside barracks rather than lodging in Helka’s fortress. Four companions have died, including Jökul, and Hakon remains their hostage.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>CHAPTER TWENTY-NINE / VARG</h2><p>With Svik, Røkia and Einar, Varg visits Darl’s slave market. He sees the people Svik calls Bruised Men; Svik distinguishes their southern Iskidan origin from the northern origin of Jaromir’s druzhina. Wearing his old collar as a disguise, Varg is taken to The Dead Drengr to question Brimil.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>CHAPTER TWENTY-NINE / VARG</h2><p>Varg attacks Brimil, then questions him about Frøya. Brimil admits punishing her and invokes sexual abuse; Varg loses control and has to be restrained. Under coercion Brimil says he sold her to Brák Trolls-Bane, a trapper and hired hunter now out of town. This gives a new lead without explaining her death. Svik kills Brimil, while Røkia and Einar kill his guards; Svik says the slaver saw Varg’s changing eyes. Røkia helps Varg remove the collar and warns him about the cost of another loss of control.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>CHAPTER TWENTY-NINE / VARG</h2><p>The company loads supplies and its four dead aboard Helka’s loaned drakkar. Glornir promises help finding Brák. Frek boards as Hakon’s guardian, Helka repeats the promised later payment and demands her son’s safe return, and the Bloodsworn cast off into the Drammur. Hakon is not yet released. Sulich says Jaromir’s ships are at Liga and predicts they can intercept his flight towards Iskidan; no interception is shown.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>CHAPTER THIRTY / BIÓRR</h2><p>Biórr marches east with the Raven-Feeders beside the warmth of the vaesen pit. He overhears Ilska giving Lik-Rifa her account of the history and politics she has missed. The Raven-Feeders praise him for killing Agnar, but he feels guilt; memories of Elvar and doubts about enslaving Tainted children trouble him.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>CHAPTER THIRTY / BIÓRR</h2><p>Kráka and Ilmur help organise the children, with Bjarn still apparently disoriented. Lik-Rifa orders their collars off; Ilska and the dragon-born chant and unlock them. When the crying children do not fall silent, Lik-Rifa briefly develops dragon features and returns human. She commands loyalty, calls herself their queen and mother, and declares their parents and past superseded. Biórr and children join the acclamation, without establishing freely chosen allegiance or safety.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>CHAPTER THIRTY / BIÓRR</h2><p>At dawn Ilmur returns from what he calls his first tracking job. A member of Drekr’s crew drags back an escaped boy, who bites him and runs again. The man knocks him down with a still-sheathed knife, beats him and breaks his nose. Biórr objects, but the violence continues. The boy draws the thrown knife and cuts his captor’s arm; his captor punches him and breaks bones in his knife-hand.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>CHAPTER THIRTY / BIÓRR</h2><p>The boy insists on the name Breca Thorkelsson, resisting an order to abandon his father’s name. The man pins him, cuts deeply beneath an eye and names himself Brák Trolls-Bane, promising the cut will scar as punishment for running. Breca remains alive and defiant in Lik-Rifa’s camp. No escape, rescue or healing is shown, and Orka does not learn this location in the chapter.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>CHAPTER THIRTY-ONE / ORKA</h2><p>After days of riding, Orka and her companions follow Myrk’s trail north-west through the Boneback foothills towards Lake Horndal. At the evening camp Myrk remains bound and swollen-faced. Revna trains Lif with spears while the Bloodsworn continue calling Orka chief despite her denials.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>CHAPTER THIRTY-ONE / ORKA</h2><p>Halja proposes trading the name of Myrk’s father’s killer for Breca’s location. Orka, after obtaining Gunnar’s and Revna’s assent, cuts her palm and swears on her son’s life: if Myrk talks, she will keep her alive until she finds her son, then release her for a holmganga. Myrk accepts, but no release or duel takes place.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>CHAPTER THIRTY-ONE / ORKA</h2><p>Myrk claims that the Raudskinna supplied a way to free Lik-Rifa using Tainted blood. Orka imagines Breca killed and destroys one of Myrk’s eyes with her seax hilt. Myrk then says none of the children died, while admitting she does not know whether one was Orka’s. She describes failed attempts with older Tainted and a blend of Seiðr and Galdur used to control children; these are her claims, not independently verified mechanisms.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>CHAPTER THIRTY-ONE / ORKA</h2><p>Myrk names Uspa as the witch enslaved to the Battle-Grim who opened Isbrún Bridge; Orka recognises Vol’s sister. Myrk professes uncertainty about the survivors after Oskutreð and gives a past rendezvous plan west towards the coast off the Iskalt Islands, where she was to bring her father. Orka gains a destination to aim for but doubts its truth. Halja names Varg as the father’s killer, and Myrk threatens him. Breca is neither located directly by Orka nor rescued.</p></details><details><summary>The Hunger of the Gods · 32</summary><h2>CHAPTER THIRTY-TWO / VARG</h2><p>At dusk the drakkar anchors in the river. Glornir opens a barrel and discovers a child; Einar has concealed the rescued children in the barrels brought from the wagon. Glornir tells him to bring them all out, and Varg helps. The children receive herring and hard bread as the company prepares to sleep aboard under an awning.</p></details><details><summary>The Hunger of the Gods · 32</summary><h2>CHAPTER THIRTY-TWO / VARG</h2><p>Hakon objects to the cold food and expects release the next day. Glornir refuses, claiming Helka has warriors on land and drakkars following them; Hakon has seen no drakkars. After a calm warning from Frek, Glornir promises release at Liga and no harm unless the prince tries to escape. Frek says he will test that word. Glornir dismisses Hakon’s complaint about fairness and points him towards Frek’s iron collar.</p></details><details><summary>The Hunger of the Gods · 32</summary><h2>CHAPTER THIRTY-TWO / VARG</h2><p>Einar asks Svik to entertain the children. Svik tells a fable whose characters borrow the names Helka, Einar, Frek and Hakon. In the tale a widow rescues a troll who then wants to eat her; after an old hound and lame horse endorse that unfairness, a wolf bargains for sheep and tricks the troll back under the stone. The wolf later overstays his bargain, is beaten and faces death, but the widow’s son carries him away and rejects the supposed inevitability of the way of the world. These are the tale’s events, not the real namesakes’ history.</p></details><details><summary>The Hunger of the Gods · 32</summary><h2>CHAPTER THIRTY-TWO / VARG</h2><p>The children struggle to distinguish Einar from the fictional troll, while Hakon laughs at one use of his mother’s name and protests the tale’s unfairness. The ending brings smiles, nods and Sulich’s praise, but Hakon says he does not understand. Varg sees Frek sitting in shadow, looking at his clenched fists; his reason is not stated.</p></details><details><summary>The Hunger of the Gods · 33</summary><h2>CHAPTER THIRTY-THREE / GUÐVARR</h2><p>Less than two days after the Bloodsworn leave Darl, Yrsa and Sturla summon Guðvarr from the hayloft of The Dead Drengr, where he is with Vilja. Still in pain and troubled by nightmares, he is taken through the damaged, busy Galdur tower. The cell that held Skapti and the other travellers stands open, but their fate is not shown.</p></details><details><summary>The Hunger of the Gods · 33</summary><h2>CHAPTER THIRTY-THREE / GUÐVARR</h2><p>In a higher circular chamber, Skalk has completed a replacement ash-wood staff, which Guðvarr recognises as made from the captured Froa. Skalk’s hawk-injured eye is now a red hole. He points the staff at Guðvarr and commands the hyrndur: its movement causes sharp chest pain and weakness until he commands it to sleep again. He threatens worse if Guðvarr displeases him. The control is demonstrated, while loyalty detection and safe removal remain unproved.</p></details><details><summary>The Hunger of the Gods · 33</summary><h2>CHAPTER THIRTY-THREE / GUÐVARR</h2><p>Skalk tells Guðvarr to exploit Hakon’s expected gratitude for the cloak when he returns. He reports inquiries suggesting repeated visits by Hakon to The Dead Drengr at night or before opening and directs Guðvarr to become closer to him there. Guðvarr agrees and leaves; neither the prince’s return nor successful spying occurs.</p></details><details><summary>The Hunger of the Gods · 33</summary><h2>CHAPTER THIRTY-THREE / GUÐVARR</h2><p>Fearing Skalk will kill him when the task is done, Guðvarr instead enters Darl’s fortress using Helka’s gold arm ring and seeks Sigrún. She accuses him of avoiding her; he knows that he has, first over his flight from Orka and later over the tower ordeal. At his request she dismisses the others. He says he has got himself into trouble, but the chapter ends before his explanation or her response.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>CHAPTER THIRTY-FOUR / ELVAR</h2><p>Elvar leads the Battle-Grim south to Lake Horndal and back to the Wave-Jarl, where its guards await news. She tells Grend that responsibility for route, provisions and the company’s survival has displaced her thoughts of fame; he laughs that she is growing up. She reflects on her enjoyment of the victory over Huld and the burden of command, then remembers Störr’s abuse of her mother and renews her conditional threat against Biórr.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>CHAPTER THIRTY-FOUR / ELVAR</h2><p>Uspa brings food and explains that she and Berak once travelled with Ilska before rejecting what she judges a path of vengeance. Their attempt to destroy the Graskinna aimed to thwart that path and save others from slavery. She confronts Elvar with the Battle-Grim’s treatment of her family and argues that people choose how the world works. Elvar cannot bring herself to apologise and protests the scale of ending thralldom; she adopts no reform plan.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>CHAPTER THIRTY-FOUR / ELVAR</h2><p>Around the fire, Ketil questions the gods about sagas. Skuld corrects the numbers and participants in several exploits, credits Orna with luring Lik-Rifa through her fascination with the soul road, and says Rotta exposed a hidden vaesen army. Ulfrir corrects a giant tale and names Skuggar as Snaka’s shadow-loving sister and the unmaker. These are attributed accounts, rather than newly witnessed ancient events.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>CHAPTER THIRTY-FOUR / ELVAR</h2><p>Grend warns of an approaching Froa. Ketil spears her and other warriors attack; she sweeps some aside. Ulfrir transforms into a giant wolf, kills and partly eats Ketil, then forbids harm to the Froa. She kneels, greets him as a friend of the woods, pledges her kind’s loyalty and leaves.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>CHAPTER THIRTY-FOUR / ELVAR</h2><p>Elvar confronts Ulfrir over her dead crewman and uses the collar to punish him. He returns to human form but remains defiant. She then orders Skuld to gouge out an eye, punishes Ulfrir when he intervenes and waits for his plea before stopping Skuld’s hand. No eye is removed. After Elvar ends his pain, Skuld urges their shared purpose against Lik-Rifa and Ulfrir promises to eat no more Battle-Grim. The collars’ coercion is demonstrated, but neither willing loyalty nor the dragon’s defeat is achieved.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>CHAPTER THIRTY-FIVE / BIÓRR</h2><p>Biórr leaves the warm vaesen pit with Lik-Rifa and Ilska, following Vigrið’s eastern crags south towards the eastern Bonebacks. Breca travels beside Bjarn and Kráka, his broken hand now bandaged and splinted. Biórr feels guilty for arranging Bjarn’s abduction and later approaches the children with his tafl pieces. No children have tried to flee since Breca’s beating, but Biórr cannot tell whether that means acceptance or fear.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>CHAPTER THIRTY-FIVE / BIÓRR</h2><p>Bjarn recognises Biórr but remains distracted and unresponsive. Kráka hopes lingering Seiðr effects will fade, without knowing they will. Breca offers to play, chooses the jarl to practise escaping and cries when Kráka’s warning reminds him of his father. Biórr wins and advises strategy rather than aggression; Breca asks to play again. Elsewhere Ilmur sits with Brák and Drekr, which worries Biórr.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>CHAPTER THIRTY-FIVE / BIÓRR</h2><p>Lik-Rifa addresses the children, condemns the term Tainted and teaches that different divine bloodlines give different abilities. Ilska demonstrates red eyes, claws and sharp teeth. Lik-Rifa directs the children to relive their abductions and identify the animal within them: Bjarn says bear, a broad boy called Harek says boar, and Breca says wolf and bear. The narration explains that sensing both parental bloodlines is rare and highly valued; Biórr’s forecast of Breca’s future power remains a prediction. This boy Harek is not explicitly identified as Asgrim’s missing son.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>CHAPTER THIRTY-FIVE / BIÓRR</h2><p>Lik-Rifa blames the children’s parents for hiding their nature and claims to replace their family. Then Lik-Rifa looks west as flying creatures approach. The dragon-born prepare rune-fire, but Lik-Rifa welcomes the tennúr and listens to voices Biórr cannot decipher. Her expression turns to rage and she declares that her brother has crossed Isbrún Bridge. No retaliation follows before the chapter ends.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>CHAPTER THIRTY-SIX / ORKA</h2><p>Orka reaches Starl on Lake Horndal’s southern shore with her companions and the bound Myrk. Myrk says her company sailed across the lake on a knarr; Halja reports tracks entering town rather than circling the shore, but Orka remains wary. She sends Spert and Vesli to watch the lake from outside town and enters the merchant-governed settlement.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>CHAPTER THIRTY-SIX / ORKA</h2><p>At an inn she pays for stabling and food with Myrk’s silver, keeps Myrk under guard and takes a linen sample of blood from the prisoner’s bay gelding. She and Halja then buy provisions and seek passage. After hearing rumours of a northern dragon, they visit the thrall market, where Orka negotiates with Haga despite both companions’ distaste. Her precise request is whispered and unrevealed.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>CHAPTER THIRTY-SIX / ORKA</h2><p>Orka leaves with a key and the emaciated, collared Sæunn, whose bloodline and intended task remain unstated. Near the docks an unnamed preacher promises dragon judgment and liberation; her associates move towards a heckler, but no attack is shown. Orka buys Sæunn warm clothes. The woman’s confused public changing reveals many old and fresh scars.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>CHAPTER THIRTY-SIX / ORKA</h2><p>Looking over the vast lake beneath Snaka’s rib, Orka feels a pulse in her head and then a wolf howl. It grows louder as a freshly pitched drakkar approaches, lowers its sail and mast and rows towards a pier. Orka sees black crossed spear-and-axe shields on red, and Halja identifies the Battle-Grim. The chapter ends before any passengers are recognised or a meeting takes place.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Hunger of the Gods - chapter 37: Varg</h2><p>Varg and the Bloodsworn reach Liga on Helka’s loaned drakkar. Glornir assaults harbour official Palrun while demanding Jaromir’s whereabouts, but no pitched battle follows. Edel and Ingmar arrive from the newly docked Sea-Wolf. Logur supports his friend Glornir and reports that Jaromir has already restocked and sailed.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Hunger of the Gods - chapter 37: Varg</h2><p>Logur agrees to provision the Sea-Wolf and take Helka’s drakkar. Glornir entrusts Hakon to him for later return to Helka; the prince leaves with the jarl’s guards, followed by Frek. Varg tells Frek he once expected never to escape thralldom. Frek looks despairing to Varg but follows Hakon without stating a response or gaining freedom.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Hunger of the Gods - chapter 37: Varg</h2><p>Røkia advises Varg to stow his mail for the expected sea passage. Reopening his oar-chest, he finds the druzhina spoils he left behind and recognises their meaning as battle-fame. He offers the kit to Sulich to repay his rescue in Darl, apologising for the earlier insulting offer. With Einar’s encouragement Sulich accepts, then goes ashore seeking a bowstring. Varg stows his own mail and weapons as the Sea-Wolf receives provisions and repair supplies.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Hunger of the Gods - chapter 37: Varg</h2><p>Edel reports that Gunnar, Revna and Halja remain alive with Orka, prompting Svik’s concern and quiet relief. She tells Varg the old man he struck with his cleaver was Ilska and Myrk’s father, and relays Myrk’s account of Lik-Rifa’s involvement. Varg recalls Halja’s brother Vali Horse-Breath dying beneath the troll’s club and thinks of his own sister and blood feud. These reports do not reveal Orka’s present Starl events to the Liga group.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Hunger of the Gods - chapter 37: Varg</h2><p>Einar sets the rescued children to work carrying stores. Glornir conditionally tolerates their presence, and calls the fair-haired Refna Strong-Hands when she offers to row and shows her calloused palms. Glornir reports Jaromir left two days earlier with three drakkar and two horse-carrying knarr after waiting for more druzhina. He orders pursuit to Iskidan; the Sea-Wolf casts off and Varg rows. The chapter ends in the fjord, before a completed ocean crossing or recovery of Vol.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The Hunger of the Gods - chapter 38: Elvar</h2><p>The Wave-Jarl crosses Lake Horndal towards Starl, low and sluggish under the gold and silver carried from Oskutreð. The hoard lies beneath a spare-sail awning. Elvar must restock nearly exhausted food and drink instead of sailing straight down the Hvítá. She feels a clearer sense of purpose in chiefship and her obligations, including her promise to try to free Berak, while hoping to rid herself of the Seiðr in her blood.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The Hunger of the Gods - chapter 38: Elvar</h2><p>Wearing her Oskutreð mail and Agnar’s bearskin, Elvar compares the mail’s comfortable fit to her growing sense that leadership is hers. To prevent loose talk about the hoard and gods, she orders only Sighvat, Orv and Urt ashore. Sólín steers the ship into the pier and Sighvat throws a mooring line. No purchase or renewed river departure is shown.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The Hunger of the Gods - chapter 38: Elvar</h2><p>Three women approach: two mailed warriors and an unnamed, better-clothed collared companion. The red-haired warrior names herself Halja of the Bloodsworn after Elvar tells her Agnar is dead and she is chief. Elvar knows the Bloodsworn’s reputation; Sighvat introduces her as Troll-Slayer and Fire-Fist. The older, taller warrior’s hard stare unsettles Elvar, and Grend reaches towards his new axe.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The Hunger of the Gods - chapter 38: Elvar</h2><p>The older warrior demands Uspa, while Halja and Sighvat trade threats. Uspa greets Halja with joy, then sees the other woman, names her Orka and expresses shock because she thought her dead. Elvar hears the name with only a dim sense of familiarity; full recognition of Skullsplitter is not stated.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The Hunger of the Gods - chapter 38: Elvar</h2><p>Orka asks Uspa to come with them. Elvar refuses, freeing her right arm and sword, and Orka lifts her long-axe. Ulfrir calls for a halt and approaches with Skuld, her wings covered by a wool cloak. He looks at Orka, takes a deep breath and greets her as wolf-child. The confrontation remains unresolved, and he does not explicitly identify himself as the source of the earlier dreams or calls.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>The Hunger of the Gods - chapter 39: Orka</h2><p>Orka recognises the collared Ulfrir and his wolf-call. He calls her his child and invites her aboard; she feels drawn towards him but stops herself, objecting to Uspa’s enslavement. Elvar asserts command and initially refuses to release Uspa. News of the dragon-born prisoner persuades her to grant conditional safe passage under a truce. Orka, Halja and the now explicitly named Sæunn board, facing the watchful Grend. Introductions name Ulfrir, Skuld, Sighvat and Grend for the visitors.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>The Hunger of the Gods - chapter 39: Orka</h2><p>Elvar admits raising and thralling the god. Uspa vouches for the visitors, and the parties agree to share information. The mothers exchange news of their abducted sons; Orka concludes Breca and Bjarn are together. Uspa shows the four oath-takers’ white scars and refuses to leave Elvar’s rescue plan. Ulfrir urges Orka to stay beside him, but she refuses for Breca’s sake. She says her human father abused her and she killed him and left home at twelve. Halja and Sighvat trade jokes, while Uspa acknowledges Halja’s grief and vengeance for Vali.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>The Hunger of the Gods - chapter 39: Orka</h2><p>Halja recounts the excavation. Ulfrir identifies Rotta’s chamber and claims he hunted and chained Rotta for his treatment of Valkyrie, then watched serpent venom burn him. Halja tentatively identifies the copied writings as Raudskinna material; Uspa infers their connection to Lik-Rifa’s release. News of Orna’s talon prompts Skuld to ask Elvar to raise her mother, but Elvar ignores the request. Orka hears Ulfrir say Daughter within her head. Halja then tells Uspa of Vol’s abduction by Skalk, guessing Glornir has caught up; this is not a new rescue or updated knowledge of Jaromir’s later involvement.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>The Hunger of the Gods - chapter 39: Orka</h2><p>Orka identifies her prisoner as Myrk, Ilska’s sister, and repeats the westward rendezvous lead near the Iskalt Islands. Elvar calls Myrk a liar: she and Sighvat report the Raven-Feeders’ eastward tracks at Isbrún Bridge. Ulfrir proposes the eastern hall Nastrandir as Lik-Rifa’s likely refuge, without knowing whether it still stands. The group lacks directions; Elvar judges Orka’s westward trail unusable. Deliberate deceit, changed plans and exact present coordinates remain unproved.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>The Hunger of the Gods - chapter 39: Orka</h2><p>Orka imagines killing Myrk but restrains herself because she still needs the prisoner to find Breca. She asks Elvar for help and agrees to a favour-for-favour exchange. Neither service is specified or fulfilled before the chapter ends.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>The Hunger of the Gods - chapter 40: Biórr</h2><p>Biórr marches towards the Bonebacks after worsening cold and a night blizzard. Ilska and the dragon-born melt a route through deep snow with Galdur-rune powers, while Lik-Rifa remains on horseback. Many children walk to spare the struggling carts and keep warm. Breca walks with the camp boy Harek, his hand still splinted and linen-bandaged; a smile later moves the red-wealed scar beneath his eye.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>The Hunger of the Gods - chapter 40: Biórr</h2><p>At the midday halt Bjarn looks clearer and brighter to Biórr and speaks of hunger. Kráka thinks the Seiðr has left him, a tentative explanation rather than proof of complete recovery. She distributes apples and cheese while Storolf helps with a barrel and jokes with her and the children. His boar imitation is playful, and the group laughs. The narration describes continuing evening lessons and smaller groups, with Storolf teaching children assigned to Svin’s line. He mentions his brother Kalv’s hoped-for return.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>The Hunger of the Gods - chapter 40: Biórr</h2><p>The surviving tennúr return to Lik-Rifa, and Kráka says they have found something without a decoded report. The column reaches an icy, serpent-shaped peninsula beside the Icebound Sea, where huge waves strike cloud-wreathed cliffs. Lik-Rifa dismounts and walks alone ahead, stopping Ilska and Drekr from following.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>The Hunger of the Gods - chapter 40: Biórr</h2><p>Lik-Rifa fully transforms into a dragon. Biórr sees improved scars and a less wasted body and judges her stronger than at her release, without proving full recovery. Her roar shakes the ground and sends rock into the sea. Calling Nastrandir, she sings repeated words; the cliff shimmers and erupts in rock and dust, throwing Biórr down and enveloping the travellers.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>The Hunger of the Gods - chapter 40: Biórr</h2><p>As the dust clears, huge black-granite doors edged in silver stand revealed, taller and wider than the dragon. Vast carved stone serpents writhe, hiss and bow before her. Lik-Rifa welcomes the company to her home. The doors are not shown opening, and the interior is not inspected.</p></details><details><summary>The Hunger of the Gods · 41</summary><h2>The Hunger of the Gods - chapter 41: Guðvarr</h2><p>In a rear chamber of Sigrún’s longhouse at Darl, Guðvarr apologises for failing to bring back Orka’s head. Sigrún says her chief concern was the weakness Orka made her appear to show. She believes Helka and the petty jarls Glunn, Svard and Illur covet her lands. When Guðvarr threatens to kill them, she checks him and advocates guile.</p></details><details><summary>The Hunger of the Gods · 41</summary><h2>The Hunger of the Gods - chapter 41: Guðvarr</h2><p>Guðvarr asks his aunt to demand his release from Skalk through Helka. Sigrún fears the queen would choose Skalk over her and refuses the immediate appeal. She attributes Arild’s and other drengrs’ deaths to Skalk. She also says Helka has asked the jarls to remain in Darl for a meeting with Orlyg of Svelgarth, whose messengers say he is coming. Sigrún and Guðvarr speculate about a peace or pact that could free Helka to move against her other enemy, Störr.</p></details><details><summary>The Hunger of the Gods · 41</summary><h2>The Hunger of the Gods - chapter 41: Guðvarr</h2><p>Horns draw them outside, where two score of Helka’s drengrs escort the returning Hakon and Frek. Hakon is clothed and still wears the cloak Guðvarr gave him. After Sigrún elbows him, Guðvarr welcomes the prince and receives a curt nod; he believes he sees recognition. Frek gives him a flat, dead-eyed look.</p></details><details><summary>The Hunger of the Gods · 41</summary><h2>The Hunger of the Gods - chapter 41: Guðvarr</h2><p>A crowd follows the procession beneath Orna’s skeletal wings into Helka’s hall. Helka leaves her audience with merchants, welcomes her son and permits him to kiss her hand. She announces a feast for that night to celebrate his safe return, to the crowd’s cheers and Guðvarr’s satisfaction.</p></details><details><summary>The Hunger of the Gods · 42</summary><h2>The Hunger of the Gods - chapter 42: Biórr</h2><p>Biórr, Fain and Storolf pass beneath Nastrandir’s moving granite serpents into the dark hall. Lik-Rifa, already human again, speaks and huge braziers ignite. Serpent-carved pillars rise into darkness above a dry stone floor, high fissures admit daylight and tables surround empty ash-filled hearth pits. The great doors close after the last of the company enters.</p></details><details><summary>The Hunger of the Gods · 42</summary><h2>The Hunger of the Gods - chapter 42: Biórr</h2><p>Lik-Rifa sits in a stone throne whose high back shifts into smaller serpents. She promises safety, rest and recovery, but pauses as a serpent hovers beside her ear. After appearing to listen, she rises and declares that someone has been there. More braziers ignite as she leads the company onwards, with tennúr overhead and Biórr taking his shield and spear ready.</p></details><details><summary>The Hunger of the Gods · 42</summary><h2>The Hunger of the Gods - chapter 42: Biórr</h2><p>They pass through dragon-sized tunnels and chambers, including a stone pier where two serpent-prowed drakkars and several snekkes lie on ice-touched water. Lik-Rifa’s command throws a pair of internal doors inwards, revealing a smaller dragon-sized chamber with roasting deer and boar, food-laden tables and about twenty attendants. Lyre and mouth-harp music fades as the occupants stare.</p></details><details><summary>The Hunger of the Gods · 42</summary><h2>The Hunger of the Gods - chapter 42: Biórr</h2><p>A remarkably tall, lean man with long brown braids fixed by a silver pin, a close-cropped beard, dark eyes and protruding tooth tips rises from a bench, grinning, and welcomes Lik-Rifa as sister. She names him Rotta. He says he has been looking after the place while she was away. His escape from punishment and the purpose of his reception are not explained.</p></details><details><summary>The Hunger of the Gods · 43</summary><h2>The Hunger of the Gods - chapter 43: Guðvarr</h2><p>At Hakon’s welcome feast in Darl, Guðvarr drinks despite Sigrún’s frown. Leif Kolskeggson appears with the pale-eyed warrior Sterkur death-in-the-eye and asks Helka for permission to hunt Varg. He renews accusations of murder and theft and says he has hired Sterkur’s mercenaries. Helka blesses the hunt, declares her hostility to the Bloodsworn now Hakon is back and reports their departure from Liga after Jaromir. Their arrival in Iskidan remains her suspicion.</p></details><details><summary>The Hunger of the Gods · 43</summary><h2>The Hunger of the Gods - chapter 43: Guðvarr</h2><p>Hakon chooses the shield-dance as the feast challenge. Guðvarr pushes through the volunteers and calls to him; the prince touches his cloak and chooses him. Estrid joins with Helka’s backing. Contestants drink ale and leap between shields held on warriors’ shoulders, taking more horns on each circuit. The practice prepares young warriors for the oar-dance.</p></details><details><summary>The Hunger of the Gods · 43</summary><h2>The Hunger of the Gods - chapter 43: Guðvarr</h2><p>Vilja fills Guðvarr’s horn and whispers about a winner’s prize. He races well, briefly wobbling when Skalk’s glare reminds him of the hyrndur. He passes another falling contestant and overtakes Glunn. As Estrid closes on Hakon, Guðvarr leaps into her and they both fall; Glunn also loses his footing. Estrid accuses him of deliberately helping Hakon. Guðvarr privately thinks of the monster in his chest, but publicly calls it an accident.</p></details><details><summary>The Hunger of the Gods · 43</summary><h2>The Hunger of the Gods - chapter 43: Guðvarr</h2><p>Hakon wins, Estrid stands second and Glunn compliments Guðvarr’s move. Guðvarr flatters the prince and receives thanks. Helka toasts the winner; an anonymous shout of Hakon the Humper prompts laughter and Hakon’s grin. Guðvarr wonders whether the prince will visit The Dead Drengr that night, then turns his attention to Vilja. No further inn meeting or acquisition of Hakon’s secrets occurs.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>The Hunger of the Gods - chapter 44: Biórr</h2><p>In Nastrandir, Lik-Rifa presses Rotta about abandoning her. He says he escaped during Guðfalla but feared being chained again. A word and gesture make his handsome face become ruined and weeping; he attributes his suffering to Orna and Ulfrir’s venom punishment, then restores his handsome appearance with another utterance. He says fear of her three gaolers kept him away from Oskutreð. Lik-Rifa accuses him of killing and flaying their sister to make his Galdrabok, and he acknowledges their cause to hate him.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>The Hunger of the Gods - chapter 44: Biórr</h2><p>Lik-Rifa reports two gaolers dead but cannot recall Skuld’s fate. She tells Rotta Ulfrir lives and says her own Galdrabok fell into the wrong hands. Rotta promises to stand with her against their brother. His embrace, at first met rigidly, becomes mutual, and she whispers that she missed him too.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>The Hunger of the Gods - chapter 44: Biórr</h2><p>Biórr feasts beside Fain and Storolf, delighted to be near the god he regards as father of his bloodline. Kráka quietly speaks to a serious Bjarn. A tennúr complains that the food has no teeth. Storolf defends his right to share the feast, knocks the insulting Oleif unconscious, then gives the creature a flesh-streaked tooth. The tennúr names himself Tannbursta and crunches it, to Biórr’s laughter. His supposed leadership remains Biórr’s assumption.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>The Hunger of the Gods - chapter 44: Biórr</h2><p>Rotta approaches Biórr, claims to feel their shared blood and offers sympathy for his suffering and a promise to put things right. Biórr feels power and friendship from him and becomes tearful. Rotta’s listening-like pause and responses do not establish unrestricted mind-reading.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>The Hunger of the Gods - chapter 44: Biórr</h2><p>Lik-Rifa declares their aim to restore their bloodlines’ place and kill Ulfrir. The hall cheers, including Harek, while Breca glowers beside him. Saying their numbers are too few, she sings with overwhelming force; Biórr almost sees tendrils leaving through the doorway. Asked what happened by Ilska, Rotta says Lik-Rifa has called the vaesen she created and bred to herself. No answering arrival occurs here.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>The Hunger of the Gods - chapter 45: Orka</h2><p>Late in a stable at Starl, Orka sharpens her axe while Myrk remains bound. Orka recalls leaving Ulfrir and reaffirms her search for Breca. Myrk taunts her about Drekr, provoking jokes from Revna and the others. When Myrk’s eye-fire and Eldur sparks appear, Orka cuts a line across her neck, wipes the blood on her tunic hem and later restores the gag. Lif sings mournfully of two brothers and vengeance, moving Halja to tears as Orka falls asleep.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>The Hunger of the Gods - chapter 45: Orka</h2><p>Armed hooded figures wake Orka with an apparent horse raid. The groups fight, and Orka grapples and headbutts a huge attacker. Myrk rides away during the confusion. Orka calls a halt: her attacker is Sighvat, and Orv, Elvar and Grend are among the friendly intruders. Lif was not briefed. Orka confirms that Myrk’s escape was intended and finds the seax she left beside the hay gone.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>The Hunger of the Gods - chapter 45: Orka</h2><p>Orka calls the still-collared Sæunn, gives her the horse-blood rag and fresh Myrk-bloodied tunic hem, and identifies her as Hundur-blooded. Sæunn sniffs both samples and says she can track the horse and rider. Orka wants to wait and follow Myrk rather than recapture her, expecting the fugitive to lead them to Breca. No trail is followed yet.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>The Hunger of the Gods - chapter 45: Orka</h2><p>Elvar’s reciprocal favour is now specified: Orka must send Glornir an offer to hire the Bloodsworn at double their asking price. Elvar presents a large silver
