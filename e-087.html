      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 9</summary><h2>The serpent and the captive family</h2><p>Agnar plans to take the captives to Snakavik. Elvar calls the coming journey going home.</p></details><details><summary>The Shadow of the Gods · 21</summary><h2>Town within the skull</h2><p>Snakavik occupies the immense skull identified as Snaka’s at the western end of the Boneback Mountains. Its harbour entrance passes between the lower fangs, wide enough for twenty drakkar abreast. Town, piers and jetties spread inside and around the skull; a fortress crowns the granite plateau above.</p></details><details><summary>The Shadow of the Gods · 21</summary><h2>Town within the skull</h2><p>Little daylight enters the enclosed town except through the jaws, eye sockets and fissures. Whale- and seal-oil torches burn throughout it. Dockside cages contain remains of criminals, with one sign reading “Worshipper of a dead god”.</p></details><details><summary>The Shadow of the Gods · 21</summary><h2>Town within the skull</h2><p>A winding timber stair passes into a fissure and leads to the crown; Elvar counts 212 steps. A Galdur tower behind Störr’s mead hall houses the learning of Galdurmen. The fortress guards carry yellow serpent shields.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>Orka&#x27;s search in Starl</h2><p>The River Hvítá runs south from Horndal, carrying cargo bound for Snakavik at its mouth. The chapter supplies this river connection from Orka’s approach to Starl rather than a new visit to Snakavik.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>Elvar names Snakavik as the place where she wants Glornir and the Bloodsworn to meet her under the hire offer Orka is to convey. This is a requested future rendezvous, not a new arrival or proof the company has accepted.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>As the Wave-Jarl departs Starl and heads towards Horndal’s southern river mouth, Elvar names the Hvítá and then Snakavik ahead, privately thinking of her father. This is the intended destination and anticipated encounter, not a new arrival, reunion or completed Bloodsworn rendezvous.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Rowing and a merchant ship intercepted</h2><p>Elvar approaches her birthplace by the west-turning Hvítá. A merchant reports that Störr is gathering drengrs and intends to strike Helka before a suspected Orlyg alliance is ready; her stated source is whispered gossip, not direct confirmation of a pact or attack.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Rowing and a merchant ship intercepted</h2><p>Eastbound dragon-worshippers cross a nearby river bridge in daylight. Elvar remembers bodies in Snakavik’s cages and imagines her father’s anger at their defiance, then declines an attack. Beyond the bridge the fortress appears at a distance on Snaka’s skull, silhouetted with fangs and eye sockets. The ending does not yet show docking or an audience.</p></details><details><summary>The Hunger of the Gods · 61</summary><h2>The Battle-Grim return to Snakavik</h2><p>The docks are unusually crowded with longships at Störr&#x27;s muster. The harbour official waives fees for fighters and issues a birch-bark fortress pass; he reports full inns and requires recruits to appear before the jarl. The narration uses Slågen and later Hvítá for the approach without explaining the difference.</p></details><details><summary>The Hunger of the Gods · 65</summary><h2>Entry into Störr&#x27;s muster camp</h2><p>The skull plateau is crowded with armed retinues and mercenary camps. Barracks and forges inside the fortress turn out weapons and riveted mail. The jarl requires personal meetings with recruits; the guard Syr escorts the Battle-Grim, admitting only selected leaders to the hall.</p></details><details><summary>The Hunger of the Gods · 71</summary><h2>The wolf-god wrecks Störr&#x27;s hall</h2><p>Ulfrir&#x27;s full transformation collapses roof and wall portions of Störr&#x27;s hall. Störr and Thorun are killed and Elvar takes collar control and jarl acclamation. Many warriors gathering outside flee or kneel before the wolf; universal allegiance is not shown.</p></details><details><summary>The Hunger of the Gods · 71</summary><h2>The wolf-god wrecks Störr&#x27;s hall</h2><p>Uspa advances beside Elvar, holding a forward sheet of red Seiðr-runes against Silrið&#x27;s fire from the dais. Grend and Sighvat guard the flanks with axes and shields, fighting drengrs who move around the barrier while Ulfrir battles the Berserkir.</p></details><details><summary>The Hunger of the Gods · 71</summary><h2>Outside the ruined hall</h2><p>Outside the ruined hall, hundreds of drengrs and mercenaries gather with varied shields, trying to form a shield wall. Ulfrir pads out and snarls, showing bloodied teeth; many flee and many more kneel in the snow before the wolf.</p></details><details><summary>The Fury of the Gods · 3</summary><h2>The burden of ruling Snakavik</h2><p>Snow falls through the smashed hall onto the dais and floor while workers recover wounded people and remove bodies. Elvar sits in Störr&#x27;s throne with two treasure chests. Grend brings the captains, petty jarls and mercenary chiefs to hear her campaign against Lik-Rifa; the gathering ends in acclamation after she displays the treasure.</p></details><details><summary>The Fury of the Gods · 9</summary><h2>Training and the attempted treasury escape</h2><p>The weapons court lies on a plateau above the fjord, linked to the fortress by steps carved in Snaka&#x27;s skull; lights shine in its eye sockets.</p></details><details><summary>The Fury of the Gods · 9</summary><h2>Training and the attempted treasury escape</h2><p>After the treasury raid, fighting marks the gates, skull stairs and route through town to the docks. Gytha&#x27;s horn signal is answered, but the gates are still open when Elvar arrives. The Wave-Roamers&#x27; ship has not escaped before the pursuers reach it.</p></details><details><summary>The Fury of the Gods · 19</summary><h2>Hidden followers and the missing Grend</h2><p>Elvar moves council into the Galdur tower because the ruined feast hall, now only half a roof and two walls, is too cold for Hrung. The circular chamber has the half-buried chain link, fire pit and cold forge. Dockside questioning brings Svea’s report of Darl’s fall; the warband prepares to move but awaits the dragon’s location.</p></details><details><summary>The Fury of the Gods · 24</summary><h2>Rotta returns to Darl</h2><p>Rotta tells Lik-Rifa the wolf-god is here with Elvar and the Battle-Grim, using intelligence extracted from Orka. Lik-Rifa praises him and begins questioning Biórr. This reveals the destination to the hostile council; no fresh observation of current conditions or immediate attack is shown.</p></details><details><summary>The Fury of the Gods · 33</summary><h2>The fortress and former mercenary camps have emptied as the host moves down to the town</h2><p>The fortress and former mercenary camps have emptied as the host moves down to the town. The Bone Tunnel’s slippery timber walkway descends through Snaka’s skull to streets lit through empty sockets. The town slopes to docks among the serpent fangs and a steep fjord. Troops, traders and wagons load provisions, ship-repair stores, weapons and cloth into waiting vessels; no fleet total or completed sailing is given.</p></details><details><summary>The Fury of the Gods · 35</summary><h2>The fleet leaves Snakavik</h2><p>Elvar’s fleet actually departs its fjord: fifty longships and fifty knarr follow as the Wave-Jarl turns south along the coast into a south-easterly. Snaka’s skull recedes in mist; no synchronisation with other viewpoints’ movements is fixed.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>The roof ward opens</h2><p>Orka describes one of the immense observed fleets sailing toward Snakavik; Glornir calls the fleets Rurik’s planned invasion. This is an approach seen/reported from Wolfdales, not a witnessed landing or conquest of the settlement.</p></details><details><summary>The Fury of the Gods · 74</summary><h2>Snaka rises and Wolfdales collapses</h2><p>Snaka rises at the fjord and sheds accumulated rock into its water, raising a wave that destroys the entering fleet. The scale of damage to the town or individual residents is not separately established.</p></details><details><summary>Illustration · The Hunger of the Gods · 71</summary><p><a href="assets/60a169e02eb340.jpg">Open noncanonical illustration</a></p><p>Elvar advances through Störr&#x27;s hall beneath Uspa&#x27;s protective barrier.</p></details><details><summary>Illustration · The Fury of the Gods · 33</summary><p><a href="assets/ec66d69afcc64e.jpg">Open noncanonical illustration</a></p><p>Elvar descending the Bone Tunnel towards Snakavik.</p></details><details><summary>Illustration · The Fury of the Gods · 3</summary><p><a href="assets/bbc4e8e9ba8b3b.jpg">Open noncanonical illustration</a></p><p>Elvar opens the treasure.</p></details><details><summary>Illustration · The Fury of the Gods · 74</summary><p><a href="assets/9aca3371fbb0bb.jpg">Open noncanonical illustration</a></p><p>Snaka rising from the fjord and shedding the mountain’s rock.</p></details><details><summary>Illustration · The Shadow of the Gods · 21</summary><p><a href="assets/ffac39a08037e6.jpg">Open noncanonical illustration</a></p><p>Snakavik and Snaka&#x27;s skull seen on the approach by sea.</p></details><details><summary>Illustration · The Fury of the Gods · 9</summary><p><a href="assets/3230a389ede6fb.jpg">Open noncanonical illustration</a></p><p>The axe gift at the weapons court, before the treasury alarm.</p></details><details><summary>Illustration · The Hunger of the Gods · 71</summary><p><a href="assets/524e96482641ea.jpg">Open noncanonical illustration</a></p><p>Ulfrir grows into a vast wolf and breaks the roof of Störr&#x27;s hall.</p></details><details><summary>Illustration · The Fury of the Gods · 9</summary><p><a href="assets/f1404bf8a7493a.jpg">Open noncanonical illustration</a></p><p>Ulfrir dismissing the illusory serpents at the docks.</p></details><details><summary>Illustration · The Hunger of the Gods · 71</summary><p><a href="assets/26df0fb7b1cd66.jpg">Open noncanonical illustration</a></p><p>Warriors kneel or flee before Ulfrir outside the shattered hall.</p></details></noscript>
