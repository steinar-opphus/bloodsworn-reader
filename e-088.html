      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 9</summary><h2>The serpent and the captive family</h2><p>The narrator identifies Agnar’s command Hlýða og fá verðlaun as Galdur-tongue.</p></details><details><summary>The Shadow of the Gods · 9</summary><h2>The serpent and the captive family</h2><p>Red veins trace Kráka’s collar as he speaks.</p></details><details><summary>The Shadow of the Gods · 28</summary><h2>The Näcken at the rapids</h2><p>Orka wounds the Näcken with her seax while speaking &#x27;Járn og stál, skorið og brennt&#x27;. Orka&#x27;s next blade strike bounces off the Näcken&#x27;s wrist when she does not accompany it with spoken words. Orka wounds the Näcken&#x27;s mouth and shoulder while speaking &#x27;Skörp járn brenna og bíta&#x27;.</p></details><details><summary>The Shadow of the Gods · 39</summary><h2>A sister&#x27;s hair and an offer of help</h2><p>Skalk explains that Galdur-tongue commands control collars containing remnants of Ulfrir&#x27;s chain, and Glornir agrees with his account.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>A collar and the wolf-god&#x27;s return</h2><p>Elvar’s spoken Opinn and Loka make the new collar open and close. Further commands expand it around Ulfrir’s skeleton and close it after naming him. Elvar recalls overhearing Silrið teach Störr the words binding his Berserkirs.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>Ilska and the dragon-born chant while turning keys and removing the children’s collars. The children then stretch, speak, cry and scream. The simultaneous chant and unlocking are recorded without translating the source incantation, separating an unshown magical mechanism or asserting complete psychological restoration.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>Elvar uses Eldsverkur against Ulfrir, whose collar glows red with white heat as he howls. Later Sársauki accompanies renewed agony when he tries to stop Skuld’s commanded self-mutilation, and Sársauki endar accompanies his collar dulling to black iron. Her spoken stop also halts Skuld’s hand before an eye is gouged. These are observed effects in this encounter, without a general translation or universal rule for every collar.</p></details><details><summary>The Hunger of the Gods · 48</summary><h2>Flight from the breakfast table</h2><p>Outside Darl’s tower an unnamed voice cries Bindið hann as red light, flame and a fiery binding net appear around Kalv. Later Skalk says Eldur slökktur; steam rises and the net is seen as thin cord. These phrases and accompanying effects are recorded without literal translations, an identified initial caster or a universal spell recipe.</p></details></noscript>
