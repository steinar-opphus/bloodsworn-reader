      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 21</summary><h2>Introduction</h2><p>Sólín is named among Agnar’s companions at Snakavik. Their red shields bear the Battle-Grim’s spear-and-axe sigil.</p></details><details><summary>The Shadow of the Gods · 32</summary><h2>The promise of Oskutreð</h2><p>Sólín is a lean, grey-haired Battle-Grim warrior.</p></details><details><summary>The Shadow of the Gods · 42</summary><h2>Survivors and the family Agnar chose</h2><p>The tennúr tear out three of Sólín&#x27;s front teeth, leaving her with a lisp. She says she owes Elvar a blood-debt for saving her, and Elvar calls them shield-sisters. Sólín has swirling tattoos across one cheek and brow.</p></details><details><summary>The Hunger of the Gods · 2</summary><h2>A burial and a surviving gaoler</h2><p>She is steel-haired and wire-muscled, now gap-toothed after the tennúr encounter.</p></details><details><summary>The Hunger of the Gods · 6</summary><h2>The swarm in the depths</h2><p>During the chamber attack she uses her newly found spear, glowing silver, to cut a many-legged creature from the pony.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>A collar and the wolf-god&#x27;s return</h2><p>When Huld announces the company’s support for dragon-slaying, Sólín argues that Agnar deserves vengeance.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>A duel for the Battle-Grim</h2><p>She asks whether anyone else will put a name forward after Sighvat and Grend decline. The choice subsequently becomes a death duel between Huld and Elvar, ending in Elvar’s acclamation.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>At the Wave-Jarl camp she lisps through missing teeth while sharpening a single-edged longseax. Ketil teases her as Sólín Spittle and Sighvat repeats the name with laughter. It is a byname used in this banter, not a new person or a name retroactively assigned to earlier scenes.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The laden ship reaches Starl</h2><p>She guides the Wave-Jarl towards Starl’s empty pier and steers into position while Sighvat calls in the oars and throws the mooring rope. Elvar orders all but Sighvat, Orv and Urt to stay aboard for the planned supply stop.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>At the barn she is called Sólín Spittle in the narration and lisps while teasing Sighvat about his interest in the departing women. He ducks her swipe. At cast-off she leaps from the pier onto the Wave-Jarl’s top-rail as the rope comes aboard and the oars push the ship clear.</p></details><details><summary>The Fury of the Gods · 19</summary><h2>Hidden followers and the missing Grend</h2><p>She accompanies Elvar into the new tower council, where Sighvat pours ale for her as well as Elvar and himself. No new personal relationship or separate mission is established.</p></details><details><summary>The Fury of the Gods · 38</summary><h2>Following the Falinn to Wolfdales</h2><p>She inserts the mast-stop after Wave-Jarl’s mast is lowered to pass beneath the stone bridge on the Falinn approach, then disembarks with the Battle-Grim at Wolfdales. No invented mast-loss or separate accident occurs.</p></details><details><summary>The Fury of the Gods · 44</summary><h2>She stands at Elvar’s doorway and explains the one-note oath-seeker horn</h2><p>She stands at Elvar’s doorway and explains the one-note oath-seeker horn. Her praise of Elvar’s leadership matters to the chief, and she accompanies the descent from the high chamber with Thorguna. No new vow or role is conferred.</p></details><details><summary>The Fury of the Gods · 51</summary><h2>She wakes Elvar for Ulfrir, follows with Berak and waits at the trunk by Elvar’s order</h2><p>She wakes Elvar for Ulfrir, follows with Berak and waits at the trunk by Elvar’s order. The subsequent secrets are not shown being told to her.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>She shadows Elvar and asks why the dragon has not joined</h2><p>She shadows Elvar and asks why the dragon has not joined. Her answer is a judgment of Lik-Rifa’s fear of Ulfrir’s trap, not her direct sighting of her. She stands behind Elvar with Gytha and Berak.</p></details><details><summary>The Fury of the Gods · 65</summary><h2>She and Thorguna remain with the resting Elvar after the others leave</h2><p>She and Thorguna remain with the resting Elvar after the others leave. Praised for their fight, she urges rest and guards the rear door as she sleeps; no new wound is stated.</p></details><details><summary>The Fury of the Gods · 67</summary><h2>The attack on Elvar’s chamber</h2><p>She is now explicitly the spear defender of the prior chapter: her voice wakes Elvar and her Oskutreð spear bursts blue as she holds the rear door. She kills an unnamed warrior but a sword pierces her belly, and she falls lifeless in her blood. Her killer is not named as Biórr or another known individual. This is her explicit death, not a new pronoun revelation; her earlier established she/her wording is preserved.</p></details><details><summary>The Shadow of the Gods · 42</summary><h2>Correction history</h2><p>2026-10-25, during B03-C067 ingestion: corrected the mistakenly introduced he/his pronouns in the chapter60 and65 updates to she/her, matching the established earlier source. This is an editorial correction, not a new gender revelation; events, facts, quotations and preserved paragraphs are unchanged.</p></details><details><summary>Illustration · The Hunger of the Gods · 57</summary><p><a href="assets/e5a2bdf7b9fe29.jpg">Open noncanonical illustration</a></p><p>A composed study of Sólín&#x27;s documented appearance.</p></details><details><summary>Illustration · The Fury of the Gods · 67</summary><p><a href="assets/5bbb8859f798c8.jpg">Open noncanonical illustration</a></p><p>Sólín’s spear guarding the doorway before her fall.</p></details></noscript>
