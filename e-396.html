      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 53</summary><h2>The Fury of the Gods - chapter 53</h2><p>A newly joined rat-blood guard riding near Rotta, he is tall/wiry with straggling beard and pockmarked skin. He greets Biórr as brother and drops back to admit him to the god. Biórr does not accept shared god-blood as sufficient kinship; no biological siblinghood or oath is established.</p></details><details><summary>The Fury of the Gods · 64</summary><h2>He is last of Rotta’s hand-picked rat-blood crew to reach the hill crown after the climb</h2><p>He is last of Rotta’s hand-picked rat-blood crew to reach the hill crown after the climb. Inside the ruined tower he asks how barred entrances can be bypassed, prompting Rotta’s claim of knowledge taken from an unnamed daughter. He is not individually shown casting the successful word-working or attacking the hall.</p></details><details><summary>The Fury of the Gods · 66</summary><h2>He and another unnamed crew member kill two unnamed people in a bedchamber encountered on the route</h2><p>He and another unnamed crew member kill two unnamed people in a bedchamber encountered on the route. No identity or political allegiance of the victims is stated, and the narration does not give Skadi the final spear/bedroom role.</p></details><details><summary>Illustration · The Fury of the Gods · 53</summary><p><a href="assets/db9e5f6b7efba2.jpg">Open noncanonical illustration</a></p><p>Skadi.</p></details></noscript>
