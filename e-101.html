      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 10</summary><h2>An Althing and a challenge</h2><p>Guðvarr challenges Virk and Virk accepts.</p></details><details><summary>The Shadow of the Gods · 10</summary><h2>An Althing and a challenge</h2><p>Sigrún orders seconds chosen and hazel rods laid. Guðvarr says his public challenge cannot be withdrawn.</p></details><details><summary>The Shadow of the Gods · 10</summary><h2>An Althing and a challenge</h2><p>Virk asks Orka to be his second and keep his sons from fighting if he loses. She accepts.</p></details><details><summary>The Shadow of the Gods · 12</summary><h2>The fatal duel</h2><p>Orka calls it a ritual dispute-settling duel barring weregild or blood feud by the loser’s kin.</p></details><details><summary>The Shadow of the Gods · 12</summary><h2>The fatal duel</h2><p>She says one foot beyond the hazel rods yields and two feet count as flight. A broken shield can be replaced in a pause.</p></details><details><summary>The Shadow of the Gods · 12</summary><h2>The fatal duel</h2><p>Virk and Guðvarr agree to submission. Sigrún later rules Virk broke the duel by attempting a death-wound after submission.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>A duel for the Battle-Grim</h2><p>The Battle-Grim use spears to bound a square because no hazel tree is nearby. Each contender has a second; Urt has two spare shields ready for Huld. These are the stated arrangements of this contest.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>A duel for the Battle-Grim</h2><p>Sighvat forbids later blood feud or weregild by friend or kin and explicitly obtains Grend’s assent. The contenders may agree first wound, submission or death; Huld and Elvar both choose death. Elvar kills Huld and the leadership passes to her.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>Myrk again demands release to fight Orka. Orka makes the duel conditional on finding her son, promising release for holmganga after keeping Myrk alive until then. Her palm-blood oath seals the offered terms, but no release or duel occurs.</p></details><details><summary>Illustration · The Hunger of the Gods · 28</summary><p><a href="assets/5b44680d1a5054.jpg">Open noncanonical illustration</a></p><p>Huld presses Elvar&#x27;s shield side during their duel for the Battle-Grim&#x27;s leadership.</p></details></noscript>
