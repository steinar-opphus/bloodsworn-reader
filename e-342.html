      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 18</summary><h2>Appearance</h2><p>An unnamed individual inhabits the single ash tree in the hunters’ glade, distinct from earlier recorded Froa. After a frost-spider trespasses and falls motionless, she drops from the canopy and unfolds from a crouch: woman-like wood, long root-like hair, ash-grey rough bark skin and dark grain, covered in moss, leaves and yellow lichen.</p></details><details><summary>The Fury of the Gods · 18</summary><h2>She calls the visitors dragon’s spawn and accuses them of entering her boughs and glade</h2><p>She calls the visitors dragon’s spawn and accuses them of entering her boughs and glade. Rejecting Krúsa’s apology, she speaks a spell and raises lashing, binding vines that drag a skraeling into the earth and choke a drengr. The hunters flee; no confirmed final casualty list or further pursuit by her is shown.</p></details><details><summary>Illustration · The Fury of the Gods · 18</summary><p><a href="assets/29a90a13614491.jpg">Open noncanonical illustration</a></p><p>The ash-grey, root-haired Froa.</p></details><details><summary>Illustration · The Fury of the Gods · 18</summary><p><a href="assets/a3dffdca08899d.jpg">Open noncanonical illustration</a></p><p>The first vines erupting in the ash-tree glade.</p></details></noscript>
