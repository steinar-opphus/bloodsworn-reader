      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 12</summary><h2>The fatal duel</h2><p>Thorkel addresses Sigrún’s warrior-thrall as Ulfrir-kin.</p></details><details><summary>The Shadow of the Gods · 12</summary><h2>The fatal duel</h2><p>The thrall’s eyes turn amber and her teeth become sharp during her attack. The changes fade during Sigrún’s collar commands.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>Ulfrir claims Orka as his child and says his blood runs in her veins. She experiences a powerful attraction to follow him and be pack, but resists for her son. She also recognises his wolf-call and later hears Daughter in his voice within her head. These personal experiences and ancestral claims do not establish identical powers for every descendant or immediate biological paternity.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>The boarding battle at sea</h2><p>Røkia previously identified herself and Varg as Úlfhéðnar descended from Ulfrir. In the Sea-Wolf fight Varg first restrains his red mist, then deliberately tells the wolf to be free and save him. His senses sharpen, strength and rage surge and his hands become claws; he attacks with teeth and seax and ends howling over corpses. This particular episode does not describe a complete four-legged form, establish identical abilities for all descendants or identify the inner wolf as Ulfrir personally speaking.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>After his Sea-Wolf frenzy, Varg responds to Svik’s advice by repeatedly ordering his wolf enough until the red mist and fury subside, leaving exhaustion. Later he lets the wolf surge for speed while running to Æsa. These are demonstrated changes of control in this episode, without perfect permanent mastery or a universal ability for all kin.</p></details></noscript>
