      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 21</summary><h2>Introduction</h2><p>Ilska leads the Raven-Feeders and is also called Ilska the Cruel. Elvar knows the crew by a ruthless reputation.</p></details><details><summary>The Shadow of the Gods · 27</summary><h2>A raid and a stolen child</h2><p>Ilska has dark hair bound with silver at her nape and wears a grey wool tunic during the escape. Elvar knows the reputational names Ilska the Ruthless and Ilska the Cruel. Agnar vows that Ilska will regret stealing from him.</p></details><details><summary>The Shadow of the Gods · 48</summary><h2>The guardian of Oskutreð</h2><p>She arrives at Oskutreð with riders and many wagons while the Battle-Grim gather relics.</p></details><details><summary>The Shadow of the Gods · 50</summary><h2>A deadly holmganga</h2><p>In the chapter 50 approach, her black hair is wind-whipped behind her and deep lines show around her eyes. She wears fine mail and a dark cloak, carrying a spear with sword and helm at her belt and a round shield on her back.</p></details><details><summary>The Shadow of the Gods · 50</summary><h2>A deadly holmganga</h2><p>At Oskutreð she proposes a holmganga and supplies her brother Skrið as champion; Drekr is her other brother. She refuses to release Bjarn, then sends carts of collared children towards the dead tree after Skrið’s defeat.</p></details><details><summary>The Shadow of the Gods · 52</summary><h2>Chapter 52 — The ritual at Oskutreð</h2><p>She overcomes Vörn and Uspa, then reads from a red-hide book and uses the collared children, including Bjarn, in a blood rite at the trapdoor. Its opening frees Lik-Rifa. Ilska helps Drekr defeat the golden-winged gaoler and kneels to the dragon, explaining that her people have worked to free her.</p></details><details><summary>The Shadow of the Gods · 52</summary><h2>Chapter 52 — The ritual at Oskutreð</h2><p>Her force reloads the surviving children and follows Lik-Rifa south.</p></details><details><summary>The Hunger of the Gods · 5</summary><h2>A welcome among the Raven-Feeders</h2><p>Grey threads are visible in Ilska’s sleek black hair. She rewards Biórr with a gold arm ring, then sets guards around the sleeping Lik-Rifa.</p></details><details><summary>The Hunger of the Gods · 5</summary><h2>A welcome among the Raven-Feeders</h2><p>She directs Myrk to their father at Rotta’s chamber with ten companions, asking that he bring their finds to the Corpse-Strand gathering north of Svelgarth. These are orders and reported whereabouts; this chapter does not establish their father’s identity or show the journey.</p></details><details><summary>The Hunger of the Gods · 9</summary><h2>Old companions at the campfire</h2><p>She dismisses Lik-Rifa’s reference to Ulfrir as dark dreams and says only the dragon-god lives. This is her mistaken position after the resurrection shown in chapter 8, not a reversal of that event.</p></details><details><summary>The Hunger of the Gods · 9</summary><h2>Old companions at the campfire</h2><p>Drekr saves her from the transforming dragon’s jaws. At Lik-Rifa’s order she kneels, while Drekr stands over her with his axe. After the goddess praises his loyalty, Ilska rises, bows and reaffirms her devotion.</p></details><details><summary>The Hunger of the Gods · 9</summary><h2>Old companions at the campfire</h2><p>Asked about the Raudskinna, she confirms using it and finding the owner’s chamber. Lik-Rifa orders the company south across Isbrún Bridge, warning that the end of sólstöður will imprison them north of the pit.</p></details><details><summary>The Hunger of the Gods · 14</summary><h2>Crossing Isbrún Bridge</h2><p>She leads the crossing on her black mare and approaches the tennúr hill. When the creatures emerge, she, Drekr and the other dragon-born raise red-flamed rune-shields that join into a dome around her. She rides towards Lik-Rifa, but the dragon halts her intervention.</p></details><details><summary>The Hunger of the Gods · 14</summary><h2>Crossing Isbrún Bridge</h2><p>She dismounts and kneels, then shows disgust at the tennúr. Lik-Rifa threatens her and insists the creatures are allied children; Ilska accepts with a visible tremor in her leg. After Lik-Rifa takes her mare, Ilska mounts a replacement and rides beside her eastward.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>She answers Lik-Rifa’s questions on the eastward march, describing Tainted persecution, the chain fragments and collars, Vigrið’s competing rulers and Iskidan’s dead gods and emperor. This is her account and political assessment, not independently observed history or a new witnessed conquest.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>She signals the halt and Drekr blows the horn. At the evening assembly, she and the dragon-born chant in Galdur-tongue and unlock the children’s collars until all are removed. She starts Lik-Rifa’s acclamation after the demanded loyalty, joined by warriors and children.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>Myrk tells Orka that her son was with Ilska north of the bridge when Myrk left and reports an intended crossing and westward rendezvous near the Iskalt Islands. This is dated testimony, not a new scene of Ilska or proof she has changed the eastward course already observed.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>She and Lik-Rifa now lead the company south from the vaesen pit along Vigrið’s eastern crags towards the eastern Bonebacks. At the children’s assembly she follows the goddess like a guard. No arrival at Nastrandir or new proof of Myrk’s reported western plan is supplied.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>At Lik-Rifa’s request she demonstrates glowing red eyes, stretching claws and long sharp teeth, then steps back as the eye-fire fades. This is a partial change, without a complete dragon form. When the swarm approaches, she and the other dragon-born prepare rune-fire until Lik-Rifa stops them and welcomes the tennúr.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>Edel tells the reunited Bloodsworn the old man Varg killed was Ilska and Myrk’s father. She also relays Myrk’s report that Ilska is accompanied by Lik-Rifa. This gives Varg’s group new reported knowledge, not a direct sighting of Ilska or the god by them.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>Nastrandir revealed in the snow</h2><p>She and the other dragon-born use Galdur-rune powers to melt a route through the deep snow, while Lik-Rifa does not help. At the coastal approach she rides beside Lik-Rifa with Drekr on the other side, then is stopped from following when the god dismounts and walks alone towards the cliffs. The hall’s entrance is revealed, but no entry or new battle occurs.</p></details><details><summary>The Hunger of the Gods · 42</summary><h2>Inside Nastrandir&#x27;s great hall</h2><p>She follows human-form Lik-Rifa between the great serpent-carved pillars of Nastrandir’s first chamber, with Drekr and the Raven-Feeders at a distance behind the god. They stand before her throne as she promises protection and rest. The chapter supplies no separate order or action by Ilska during the later Rotta encounter.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>She institutes hard training from the day after the feast, saying they will soon march as Lik-Rifa’s apostles. Raven-Feeders instruct older children and dragon-worshippers and spar among themselves. No actual march follows in this chapter.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>At the council she vows to fight until Ulfrir is dead, then reports Svelgarth a few days south and characterises the three rulers. She calls Orlyg old but hale and warlike, likely weaker than his rivals, and Helka likely strongest by commanded numbers. Her Slågen border account and descriptions of Helka and Störr remain attributed political intelligence. Lik-Rifa responds with an ordered campaign plan.</p></details><details><summary>The Hunger of the Gods · 58</summary><h2>Biórr&#x27;s rat senses and a captured message</h2><p>She returns with the recaptured fugitives, shows a white-ridged neck scar while describing Uspa&#x27;s refusal, and eventually orders Biórr to kill Kráka. Drekr supports the crew-loyalty judgment.</p></details><details><summary>The Hunger of the Gods · 60</summary><h2>Guðvarr taken into Nastrandir</h2><p>She challenges Guðvarr&#x27;s dragon tattoo as a possible ruse. His view describes her dark grey-streaked hair and slim honed physique and recognises the feared name Ilska the Cruel.</p></details><details><summary>The Hunger of the Gods · 77</summary><h2>Orna raised and the battle above Darl</h2><p>She and Drekr lead the dragon-born attack through Darl&#x27;s courtyard and into the flank of Skalk&#x27;s defenders. Her final individual condition is not reported at the ending.</p></details><details><summary>The Fury of the Gods · 8</summary><h2>She urges Lik-Rifa to consolidate power while pursuing Ulfrir</h2><p>She urges Lik-Rifa to consolidate power while pursuing Ulfrir. She reports Estrid&#x27;s escape with the remaining Úlfhéðnar and drengrs, then reasons that Liga offers flight overseas while Snakavik might offer Störr&#x27;s support through earlier Thorun marriage talk. These are her hypotheses, not current sightings or renewed proof of the two men&#x27;s survival. She assigns Krúsa and her clan to join Sigrún and Guðvarr in the hunt.</p></details><details><summary>The Hunger of the Gods · 71</summary><h2>News of the change in Snakavik</h2><p>The earlier Snakavik account establishes Störr&#x27;s and Thorun&#x27;s deaths; this council proposal does not revise those events.</p></details><details><summary>The Fury of the Gods · 24</summary><h2>Rotta returns to Darl</h2><p>At Myrk’s presentation she turns pale, rigid and visibly tense, then grips Biórr’s wrist to demand the killer’s name. He names Orka and identifies her through Breca and the Darl pursuit. Lik-Rifa has already turned inside; no retaliation or public decision by Ilska is shown.</p></details><details><summary>The Fury of the Gods · 36</summary><h2>Black-oiled mail frames her beside Lik-Rifa at departure</h2><p>Black-oiled mail frames her beside Lik-Rifa at departure. She recognises Sterkur, questions Leif and welcomes the band into the column after Drekr’s endorsement. She points to scores of wagons and boasts of plentiful supplies; no inventory proves enough for all Vigrið, and no payment/oath ceremony is narrated.</p></details><details><summary>The Fury of the Gods · 41</summary><h2>Biórr sees dark eyes, deeper face lines and more grey hair as she shares grief for Myrk</h2><p>Biórr sees dark eyes, deeper face lines and more grey hair as she shares grief for Myrk. She thanks him for the body and her sister’s happiness, asks about Orka because she plans to meet her, and learns the maternal drive, skill, spertus coercion and Bloodsworn connection. She says Sterkur heard Elvar’s silver offer. Lamenting family losses, she gives Biórr a raven feather she says was Myrk’s.</p></details><details><summary>The Fury of the Gods · 41</summary><h2>Biórr sees dark eyes, deeper face lines and more grey hair as she shares grief for Myrk</h2><p>She halts the army for Sigrún/Krúsa and hears the Faunir losses, negotiation and new wolf-collar news. She calls the offered eyes/ears useful but questions trusting Estrid/Skalk. Munni’s further den report reaches the leaders; no completed oath or spy infiltration follows.</p></details><details><summary>The Fury of the Gods · 45</summary><h2>The host enters the Iron Wood</h2><p>Her chosen northern route skirts the Iron Wood’s north-eastern boundary after crossing Slågen farther upstream, reducing forest travel. She estimates five days or less to the den and sends a flock of tennúr forward. Sigrún credits her practical campaign management and support labour; this is praise rather than proof that her estimate will hold.</p></details><details><summary>The Fury of the Gods · 47</summary><h2>She helps Drekr up alive, orders pursuit and illuminates the woods with raised red runes</h2><p>She helps Drekr up alive, orders pursuit and illuminates the woods with raised red runes. After the unidentified Seiðr-woman and withdrawing warriors disappear, she cannot find them beyond the broken-off tracks. Her dragon-born form a protective rune-shield arc at Rotta’s mistaken approach. The raiders’ disappearance is observed, its mechanism explained only later as Rotta’s tunnel inference.</p></details><details><summary>The Fury of the Gods · 50</summary><h2>The burned wagons and the captive children</h2><p>She reports two mercenary bands deserted north, three/four days of food left and more Tainted arrivals. Rotta orders their care and asks to see any bearing his blood. The report does not identify the bands/newcomers or demonstrate the orders fulfilled.</p></details><details><summary>The Fury of the Gods · 53</summary><h2>A night march under false campfires</h2><p>She identifies the wounded Silrið and Broðir brought by Brák, then helps lead both away after the order to tend Broðir’s wounds supersedes immediate execution. No completed medical result or new blood oath is shown.</p></details><details><summary>The Fury of the Gods · 55</summary><h2>The siege begins at the river</h2><p>She adds rafts to the proposed ladders, preparing to cross the river instead of breaking the Seiðr-bound gate. Timber work begins but no actual crossing succeeds in the scene.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>Freedom and the approaching army</h2><p>She comes to parley mailed, with sharp features, dark grey-streaked hair braided/pinned at the nape and raven feather, sword and seax. After the failed offer she lingers to threaten Orka with death for Myrk, then leaves before the attack. This threat is not a completed revenge.</p></details><details><summary>The Fury of the Gods · 59</summary><h2>She leads the Raven-Feeders through the opened river gate beside Drekr, sword/shield ready</h2><p>She leads the Raven-Feeders through the opened river gate beside Drekr, sword/shield ready. Sigrún approaches them as the attack advances toward Elvar’s shield wall before the hillside doorway. No promised revenge against Orka is completed in this chapter.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>Elvar Chainbreaker and the hillside stand</h2><p>She organises the deeper attacking wall and leads the Raven-Feeders at front-centre, Drekr with long-axe behind her in the second rank. Spertus go ahead and the walls finally collide, no individual duel resolved.</p></details><details><summary>The Fury of the Gods · 62</summary><h2>The fighting withdrawal</h2><p>She is visible at the enemy front with Brák beside her and Drekr behind when Varg/Orka consider revenge. They retreat rather than reach her line.</p></details><details><summary>The Fury of the Gods · 69</summary><h2>Biórr’s doubts amid the fighting</h2><p>She leads the Raven-Feeders front-centre of the loosely formed entering shield host after the vaesen waves. The dragon’s arrival later pauses fighting, without a new Ilska duel or final fate shown.</p></details><details><summary>The Fury of the Gods · 70</summary><h2>She leads root-cutters to the bound dragon and chops roots with her sword, Drekr beside her</h2><p>She leads root-cutters to the bound dragon and chops roots with her sword, Drekr beside her. Orka/Bloodsworn drive the loose Raven-Feeder line to the trunk. Ilska later attacks Orka on the stair, missing with the sword before striking her face with the shield and following her upward. No final duel outcome is supplied.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>The roof ward opens</h2><p>She continues holding Orka off Drekr, kicks a Bloodsworn down the stairs and flees through the opened roof route. Her survivors reform on the hill behind the skraeling screen; no final duel or individual new injury is given.</p></details><details><summary>The Fury of the Gods · 74</summary><h2>She joins Drekr against Orka/Glornir and tries to reach Drekr when he falls</h2><p>She joins Drekr against Orka/Glornir and tries to reach Drekr when he falls. Glornir deceives her guard, stabs just above her mail, shields her down and cuts into her neck. Drekr cries her name; no final speech or further action by her is shown.</p></details><details><summary>The Fury of the Gods · 76</summary><h2>Orka now explicitly thinks Ilska is dead after Glornir’s neck strikes</h2><p>Orka now explicitly thinks Ilska is dead after Glornir’s neck strikes. This is the survivor’s assessment, without a new corpse inspection scene.</p></details><details><summary>The Fury of the Gods · 78</summary><h2>Sigrún reports her death and explicitly credits Glornir with killing her on the hill</h2><p>Sigrún reports her death and explicitly credits Glornir with killing her on the hill. This reinforces Orka’s prior assessment after the observed neck strikes.</p></details><details><summary>Illustration · The Fury of the Gods · 24</summary><p><a href="assets/17b87784ebcb2a.jpg">Open noncanonical illustration</a></p><p>Noncanonical, non-graphic interpretation of Drekr and Ilska receiving Myrk’s body.</p></details><details><summary>Illustration · The Shadow of the Gods · 53</summary><p><a href="assets/9556c706ab833e.jpg">Open noncanonical illustration</a></p><p>Ilska recites at Oskutreð before the sealed door opens.</p></details><details><summary>Illustration · The Fury of the Gods · 41</summary><p><a href="assets/5e856db37aaf63.jpg">Open noncanonical illustration</a></p><p>Ilska giving Biórr the feather she says was Myrk’s.</p></details><details><summary>Illustration · The Shadow of the Gods · 53</summary><p><a href="assets/56b2fb6d00346f.jpg">Open noncanonical illustration</a></p><p>Ilska in her parley equipment before the holmganga.</p></details></noscript>
