      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 29</summary><h2>Introduction</h2><p>Brák Trolls-Bane is the name Brimil gives, under violent questioning, for the man to whom he says he sold Frøya. Brimil calls him a trapper and hired hunter who drinks at The Dead Drengr when in Darl, and says he is currently out of town. At this first report, Brák is not directly seen, and his whereabouts and part in Frøya’s eventual fate remain unestablished.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Story and connections</h2><p>Glornir says he does not know the name but promises Varg that Brák will face a reckoning. No hunt, confrontation or revenge is completed.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>He is now directly seen among Drekr’s crew, accompanying Ilmur with a captured runaway. Of average height and slender, he has weathered skin, dark hair with a black raven feather, a necklace of curved teeth or tusks, boiled leathers and furs, many belt knives and a long slim sword. This named sighting does not merge him with the earlier unnamed tusk-wearing man by resemblance.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>The boy bites him and runs; Brák strikes him with a scabbarded knife, beats him and breaks his nose. He calls Biórr the rat from Agnar’s Battle-Grim and defends punishing a runaway. After the boy draws the knife and cuts his arm, Brák punches him and breaks bones in the knife-hand.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>He orders the boy, who insists on Breca Thorkelsson, to abandon his patronymic and past. Pinning him with a knee, he cuts the cheek below an eye, promises a lifelong scar and identifies himself as Brák Trolls-Bane. His presence and violence are established, but neither his ancestry, the original abduction route nor Brimil’s account of Frøya’s sale is independently proved here.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>Breca’s broken hand is now bandaged and splinted, and Biórr notes no further child has tried to flee since the beating. He cannot tell whether the children accept their situation or are frightened. Brák sits with Ilmur, Drekr and others at another fire; no new beating or successful recapture occurs in this chapter.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>Refna tells Varg and Røkia that Brák killed her brother Kel after failed escape attempts, nailing him to a wagon and cutting his throat as an example. Varg asks whether he was called Troll-Slayer; she agrees, identifies him as one of her captors and names Drekr as chief. This is Refna’s testimony and their reported identification, not a new direct sighting or proof of Frøya’s death circumstances.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>The chapter 47 dialogue uses Troll-Slayer, while his earlier self-naming uses Trolls-Bane. Both source wordings are retained without an explanation for the difference, a renamed earlier appearance or a merger with the separately recorded unnamed ornament-wearing man.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>Breca looks towards him after saying he intends to win a sword. In sparring Brák holds a slim blade wrapped in wool and rapidly puts an axe-wielding woman on her back with his foot on her chest and sword at her throat. Storolf tells Breca to let the hostility go. The woman is not killed and no challenge by Breca occurs.</p></details><details><summary>The Hunger of the Gods · 58</summary><h2>Biórr&#x27;s rat senses and a captured message</h2><p>He claims the fugitives&#x27; recapture, with a bleeding cheek cut. After slapping Breca he is tackled and loses his seax. He then questions Biórr&#x27;s spear cover story and proposes Kráka&#x27;s killing as proof of loyalty.</p></details><details><summary>The Fury of the Gods · 5</summary><h2>The dead and the choice of revenge</h2><p>He returns from the woods in a wolf pelt with whip and troll-tusk necklace, bringing bound children under his hunters&#x27; escort. He reports no trace of Breca beyond Orka&#x27;s capture point and guesses that he entered the river and died from drowning or cold; this remains unconfirmed. Rotta refuses his proposed punishment of the children and orders him to find Breca. After threatening Orka, he takes his crew back into the trees.</p></details><details><summary>The Fury of the Gods · 6</summary><h2>Vol&#x27;s akáll depicts him as the captor ordered by an unnamed chief to punish Frøya</h2><p>Vol&#x27;s akáll depicts him as the captor ordered by an unnamed chief to punish Frøya. The spoken order supplies his name to Varg. He overpowers her resistance, pins her hands to a tree with a nail and kills her with his seax, calling it a lesson to others. The chief remains unnamed, and the event is recorded as shown by the vision.</p></details><details><summary>The Fury of the Gods · 7</summary><h2>The chained march and its victims</h2><p>He returns from the trees with about a dozen hunters, bringing two dead adults and no recaptured children. He says he saw no attacker and first heard Svea screaming. Orka interprets the woman&#x27;s black-veined injuries as Spert&#x27;s work, but the ambush and the other killer are not directly shown.</p></details><details><summary>The Fury of the Gods · 11</summary><h2>He returns from the trees with four of the twelve hunters, bloodied and two limping</h2><p>He returns from the trees with four of the twelve hunters, bloodied and two limping. He and another carry a writhing sack suspended from a spear shaft. Its contents and the fate of the absent hunters remain unconfirmed.</p></details><details><summary>The Fury of the Gods · 13</summary><h2>The price of Spert’s loyalty</h2><p>He returns limping with blood-stained head and thigh bandages, opens the moving sack and reveals wounded Spert. Rotta later kills the captive. Breca is absent from the sack; Brák’s return does not establish the boy’s current location.</p></details><details><summary>The Fury of the Gods · 16</summary><h2>Grief and pursuit at the river</h2><p>Despite his head and thigh injuries, he fights quickly with his long thin sword beside his remaining crew and several skraeling. They surround a Berserkir and dart in to strike. His eventual outcome is not shown in this viewpoint.</p></details><details><summary>The Fury of the Gods · 24</summary><h2>He returns to Darl on foot with his reduced crew among the column</h2><p>He returns to Darl on foot with his reduced crew among the column. No names or final fates are supplied for the absent crew members, nor is a fresh encounter with Breca shown.</p></details><details><summary>The Fury of the Gods · 36</summary><h2>The dragon’s host marches out</h2><p>He and his crew ride close behind Drekr as Lik-Rifa’s host leaves the Galdur courtyard and grows through Darl. No new individual casualty tally or completed battle occurs.</p></details><details><summary>The Fury of the Gods · 53</summary><h2>He leads a small Tainted/skraeling scout crew that finds Silrið and Broðir soaked and wounded</h2><p>He leads a small Tainted/skraeling scout crew that finds Silrið and Broðir soaked and wounded. After the queen’s execution order is stayed he and Ilska lead both away under the new order to tend Broðir’s wounds. No execution or recovered Orka axe is stated.</p></details><details><summary>The Fury of the Gods · 61</summary><h2>The shield line under pressure</h2><p>Varg repeatedly hopes he is among the attacking shield wall and refuses relief for fear of missing him. None of the successive opponents is identified as Brák, and the hoped-for confrontation does not occur in the chapter.</p></details><details><summary>The Fury of the Gods · 62</summary><h2>Orka directly identifies him beside Ilska in the enemy front rank, Drekr behind</h2><p>Orka directly identifies him beside Ilska in the enemy front rank, Drekr behind. She repeats that he caused Breca’s scar under one eye; Varg names him his sister’s murderer. The companions defer the confrontation and flee rather than complete revenge here.</p></details><details><summary>The Fury of the Gods · 73</summary><h2>Brák’s hostages and Einar’s fall</h2><p>Narrow-featured and sharp-nosed with a scraggly beard/weathered skin, he wears leather, fur and mail, a troll-tusk necklace, a slim sword and knives/seaxes at belt and limbs. He boasts of his name and experience against bigger foes.</p></details><details><summary>The Fury of the Gods · 73</summary><h2>Brák’s hostages and Einar’s fall</h2><p>He threatens captive Refna and taunts Varg, answering the accusation about Varg’s sister without remorse. Refna claws his hand/wrist and escapes his grip. Fighting Einar, he cuts forearm/calf; after being knocked down he rises as another attacker wounds Einar’s leg, then thrusts through Einar’s throat. His own final fate and Einar’s subsequent condition remain unshown.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>Røkia says he ran when the world began to break</h2><p>Røkia says he ran when the world began to break. He is gone from the confrontation; his destination, death or recapture are not shown.</p></details><details><summary>The Fury of the Gods · 81</summary><h2>The charge against the gods</h2><p>Varg recognises his hunters around Taras and sees Brák slipping behind him with slim sword, then shouts his name. The confrontation has begun but no new result is supplied.</p></details><details><summary>The Fury of the Gods · 84</summary><h2>Silrið’s defeat and vengeance for Frøya</h2><p>Black eyes manifest as he duels with slim sword/needle-sharp knife; Røkia names Væsa the weasel as his blood. After cutting Taras’s calf he badly wounds Varg, but Varg reverses him, pins his foot, breaks his knife-wrist, tears his jaw/cheek and takes his sword. Pinned to a tree for Frøya, he endures Refna/the children’s reprisal for Einar and their own losses, with Røkia declaring vengeance complete.</p></details><details><summary>The Fury of the Gods · 89</summary><h2>His death is now explicit: the corpse remains pinned at the tree by his own sword as Varg walks away</h2><p>His death is now explicit: the corpse remains pinned at the tree by his own sword as Varg walks away. This confirms the previous reprisals’ outcome without inventing a burial or revising their chronology.</p></details><details><summary>Illustration · The Fury of the Gods · 73</summary><p><a href="assets/6e88b824983832.jpg">Open noncanonical illustration</a></p><p>Brák Trolls-Bane.</p></details></noscript>
