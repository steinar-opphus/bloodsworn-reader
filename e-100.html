      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 13</summary><h2>A feast interrupted</h2><p>Galinn’s song describes Orna as eagle-winged. It says Orna was torn.</p></details><details><summary>The Shadow of the Gods · 31</summary><h2>Arrival in Darl</h2><p>Orka identifies the skeleton as Orna&#x27;s remains and believes it keeps vaesen away for many leagues.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>The fugitives reach Darl</h2><p>At Darl Skalk identifies the recovered curved bone as Orna’s missing talon and fits it into the foot suspended through Helka’s chamber roof. A red-white flash accompanies its secure attachment. Helka declares Orna complete after years of searching; no resurrection or new protective effect is demonstrated.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>Skuld credits Orna, rather than Ulfrir, with luring Lik-Rifa into Oskutreð. She says her mother found the soul road and knew Lik-Rifa could not resist looking upon the road of the dead because of her fascination with life, death and their boundary. This is Skuld’s account of discovery and strategy, not proof that Orna created the road.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>Halja tells the meeting that Skalk took a bone they think is Orna’s talon. Ulfrir mourns her and Skuld asks Elvar to bring her mother back as well. Elvar ignores the request. No promise, action, demonstrated power or resurrection of Orna occurs, and the historical talon report does not identify its present location.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>During Hakon’s interrogation Helka names Orna as Lik-Rifa’s greatest enemy in saga history. Skalk says her skeleton is complete after returning the talon and that copied Raudskinna fragments discuss resurrection. He proposes raising and binding her with Ulfrir’s chain as Helka’s servant to slay the dragon. These are claims and a plan, not a new resurrection.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>Helka is attracted by a god as her thrall, but Skalk needs an uncertain many days to check spell gaps, test runes and forge a collar. The chapter ends without Orna raised or bound.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>The narration identifies Halja as carrying Orna’s eagle blood and having the keenest sight in her travelling group. Her eyes shift to tawny-gold flecks as she surveys the canopy, then she keeps the forward scout in sight. This is a particular descendant’s narrated ancestry and ability, not a uniform power assigned to all descendants.</p></details><details><summary>The Hunger of the Gods · 77</summary><h2>Orna raised and the battle above Darl</h2><p>Skalk and the apprentices restore her flesh and life and fit an enlarged collar. She asks for Ulfrir, her daughters and Lik-Rifa, while Helka claims control without a completed obedience test. She fights the attacking dragon, but Lik-Rifa finally breaks and tears her apart. The resurrection is followed by a second confirmed death, not lasting restoration.</p></details><details><summary>The Fury of the Gods · 24</summary><h2>Rotta returns to Darl</h2><p>Lik-Rifa boasts of killing her after the resurrection and admits forgetting a plan to recover her heart for power. She claims no fragment remains beyond perhaps feathers. Rotta disputes the lost opportunity, saying even a heart fragment would strengthen both siblings. No inspection here proves total annihilation or recoverability, and no heart is consumed.</p></details><details><summary>The Fury of the Gods · 35</summary><h2>The fleet leaves Snakavik</h2><p>Skuld asks for silver scissors she says were her mother’s, and Elvar returns the rune-handled pair from Oskutreð treasure. The earlier identification of Orna as her mother supplies that context; no magical power of the keepsake is demonstrated.</p></details><details><summary>The Fury of the Gods · 40</summary><h2>Councils and secrets in Wolfdales</h2><p>Ulfrir explicitly refers to the slain Orna as his wife while predicting Lik-Rifa will attack him after killing her. Skuld’s wings shudder. This adds his direct relationship wording, without a new death or witnessed replay of the earlier attack.</p></details><details><summary>The Fury of the Gods · 51</summary><h2>Ulfrir’s trust and the roof ward</h2><p>Ulfrir remembers his wife visiting from her own northern eyrie and perching in this tree, saying he crafted the rooftop ward for her passage. Hearing of her brief resurrection and renewed loss deepens his grief; Elvar responds with sympathy. This is remembered presence, not Orna newly alive in the scene.</p></details><details><summary>The Fury of the Gods · 64</summary><h2>The rat-blood climb the cliff</h2><p>Rotta says Orna and the children spent much time with Ulfrir here and the family knew his access words. This is his explanation, not a newly witnessed past family scene or identification of the daughter whose knowledge he claims to have taken.</p></details><details><summary>The Fury of the Gods · 69</summary><h2>Biórr’s doubts amid the fighting</h2><p>Lik-Rifa taunts Ulfrir by claiming she tore Orna apart and tasted her, provoking visible trembling without an immediate answer. This is the dragon’s boast about the past, not a new witnessed death scene or a newly dated attack.</p></details><details><summary>The Fury of the Gods · 83</summary><h2>Skuld invokes her mother while stabbing Lik-Rifa’s eye with the scissors</h2><p>Skuld invokes her mother while stabbing Lik-Rifa’s eye with the scissors. Orna’s already established maternal link supplies the context; this is not a new resurrection or sighting of Orna.</p></details><details><summary>Illustration · The Hunger of the Gods · 77</summary><p><a href="assets/dc6ba929023f26.jpg">Open noncanonical illustration</a></p><p>Lik-Rifa and Orna clash in the air above Darl.</p></details><details><summary>Illustration · The Hunger of the Gods · 77</summary><p><a href="assets/b0d990843850c6.jpg">Open noncanonical illustration</a></p><p>A net of runes descends over Orna&#x27;s skeleton during the resurrection ceremony.</p></details></noscript>
