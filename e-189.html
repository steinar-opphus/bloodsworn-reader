      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 43</summary><h2>The battle beneath the cliff</h2><p>The unnamed red-eyed man&#x27;s two-handed sword is curved and yellowed with grey veins like old bone. Varg perceives power, pressure and pain emanating from it. It hurls Glornir back in a weapon clash, cuts a thrown spear apart and eventually breaches Vol&#x27;s Seiðr-rune. Its origin and precise nature are not established.</p></details><details><summary>The Shadow of the Gods · 45</summary><h2>Waking among the wounded</h2><p>Torvik identifies this weapon as a talon of the eagle-god Orna. Yrsa later retrieves it in a chest; Varg senses power from the opened chest. The identification is attributed to Torvik at this stage.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>The fugitives reach Darl</h2><p>Skalk displays a sword-length curved bone with a leather grip from the chest, calls it Orna’s missing talon and removes the leather. He slots it into the skeletal foot at Darl; after spoken words and a flash of red-white flame it remains firmly fitted. This observed fit strengthens the earlier identification without renaming the historical weapon page.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>The fugitives reach Darl</h2><p>Helka declares Orna complete. No revival or other newly demonstrated power follows in this chapter.</p></details></noscript>
