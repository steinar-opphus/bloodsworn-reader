      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 15</summary><h2>Grief and the decision to leave</h2><p>Thorkel identifies Sigrún’s warrior-thrall as Úlfhéðnar. He argues she is not Hundur and that tasting blood would mean nothing to her.</p></details><details><summary>The Shadow of the Gods · 20</summary><h2>The queen&#x27;s orders</h2><p>In B01-C020, Svik identifies Helka’s collared bodyguards as Úlfhéðnar, Tainted thralls descended from Ulfrir. Their collars and coordinated movement are observed, while their ancestry remains his account.</p></details><details><summary>The Shadow of the Gods · 31</summary><h2>Arrival in Darl</h2><p>Orka identifies the disembarking warriors as Úlfhéðnar descended from Ulfrir. The arriving warriors wear mail and have shaved, tattooed sides to their heads.</p></details><details><summary>The Shadow of the Gods · 47</summary><h2>The Bloodsworn reveal their ancestry</h2><p>Røkia identifies herself and Varg as Úlfhéðnar in chapter 47, revealing their Ulfrir ancestry at this point in reading chronology. She connects Varg’s red-mist strength and speed to it.</p></details><details><summary>The Hunger of the Gods · 11</summary><h2>Controlled change — book 2, chapter 11</h2><p>Røkia demonstrates a brief change: muscles tighten, eyes gain amber flecks and canines lengthen sufficiently to pierce a leather helm strap. Her voice becomes a rasp before her eyes and teeth return to normal. This is an observed instance, not a universal limit or full transformation rule.</p></details><details><summary>The Hunger of the Gods · 11</summary><h2>Controlled change — book 2, chapter 11</h2><p>Svik urges Varg to master his wolf-blood. Røkia teaches through the analogy of a steady stream rather than a flood; Varg asks her to teach him. The advice is attributed to them, and his success remains unshown.</p></details><details><summary>The Hunger of the Gods · 13</summary><h2>News of a missing sister</h2><p>In the village fight Varg tries Røkia’s teaching by telling the wolf that they are one but that he is pack-leader. He experiences time as slowed and increased fighting strength, yet rage nearly drives him to crush a fallen opponent’s skull. Svik physically stops the blow; repeating Oathsworn obey, Varg gradually calms. This demonstrates partial control with assistance, not complete mastery or a universal technique.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>Helka’s collared guards fight with sharp claws and teeth; one amber-eyed woman attacks Varg with two seaxes and bites off his ear before dying. Varg experiences kinship and rivalry with the guards, while the Bloodsworn keep their own Tainted blood hidden.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>The guards immediately disengage when Helka orders a halt. This is an observed instance of obedience, without establishing every limit or mechanism of collars or wolf-blood.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>Varg’s changing eyes expose his loss of control while questioning Brimil. Svik says the slaver saw the change and kills him; Røkia warns that another public lapse could bring death or Galdur-collars on the company. Those are their explanation and warning, not proof that every victim saw the change.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>Helka sends the collared Frek aboard as Hakon’s guardian. He departs with the Bloodsworn; no transformation is shown during his boarding.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>Freedom and the approaching army</h2><p>Frek leads the former Helka/now Estrid Úlfhéðnar to the gate without collars, their head sides shaved and top hair braided. They credit Elvar for freedom and ask to swear to her rather than Ulfrir. She welcomes the offer and their defence; the full oath ritual is not shown.</p></details><details><summary>The Fury of the Gods · 61</summary><h2>The shield line under pressure</h2><p>Varg consciously lets his wolf-blood filter through during exhaustion and experiences sharper senses/renewed strength and speed. No full change or wound immunity is narrated.</p></details><details><summary>The Fury of the Gods · 62</summary><h2>The fighting withdrawal</h2><p>At a horn the retreating line parts and Berserkir/Úlfhéðnar charge through, bodies bunching and eyes glowing, attacking frost-spiders in a frenzy and drawing them away from retreaters. Hyrndur later sting both groups amid the flight. No full individual animal form, casualty-free charge or final fate of the counterchargers is given.</p></details><details><summary>The Fury of the Gods · 63</summary><h2>The stone doors and the retreat inside</h2><p>The Tainted counterchargers hold spiders and attack trolls before disengaging for the hall; one unnamed Berserkir is speared/hurled away. Some are still in running fights as the last Bloodsworn enter. A few score Úlfhéðnar also stand with Ulfrir inside, without a statement that every outside countercharger survived.</p></details><details><summary>The Fury of the Gods · 68</summary><h2>A warband follows Ulfrir into the hall behind the stone guardians and airborne Skuld</h2><p>A warband follows Ulfrir into the hall behind the stone guardians and airborne Skuld. This is the visible group, not a complete survival count of every countercharger.</p></details><details><summary>The Fury of the Gods · 69</summary><h2>A small host stands behind Ulfrir, and Úlfhéðnar fight in the wider hall with weapons/tooth/claw</h2><p>A small host stands behind Ulfrir, and Úlfhéðnar fight in the wider hall with weapons/tooth/claw. No full named transformation, casualty total or final god-battle result is supplied.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>Leif’s death and the tunnel escape</h2><p>The group is directly present in Ulfrir’s gathering evacuation: Skuld above, both stone wolves alongside, Úlfhéðnar beneath, Battle-Grim/drengrs with Sighvat, Orlyg’s survivors and Sulich’s mounted remnants. The gate is blocked and they turn to the tunnels. This does not establish repaired guardians or a complete survivor tally.</p></details><details><summary>Illustration · The Fury of the Gods · 62</summary><p><a href="assets/8d192bed87ec4f.jpg">Open noncanonical illustration</a></p><p>The countercharge covering the retreat.</p></details></noscript>
