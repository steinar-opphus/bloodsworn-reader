      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 23</summary><h2>Ulfrir calls the Wolfdales his den and proposes them as a base against Lik-Rifa</h2><p>Ulfrir calls the Wolfdales his den and proposes them as a base against Lik-Rifa. Skuld places them near Jarnvidr. He says more lies below ground than above, favouring concealment and confusion rather than a direct strength contest. This is the speakers’ description, not a visited layout or map. Elvar orders preparation towards Jarnvidr; no arrival here is shown.</p></details><details><summary>The Fury of the Gods · 38</summary><h2>The den is reached by the River Falinn within Jarnvidr</h2><p>The den is reached by the River Falinn within Jarnvidr. A western-bank hill bears apparent ruined towers, thorns and hundreds of wolves. Stone bridge and ancient mossy piers mark the approach. Two promontories enclose a vale towards a sheer cliff, reached by a dirt/vine-covered stone road. Ulfrir’s invocation strips away coverings, revealing snarling wolf-head-carved doors and two boulders that become animated stone wolves. His giant howl joins theirs and the hill pack’s as gates open, releasing ancient musty air. No inside halls or capacity are described yet.</p></details><details><summary>The Fury of the Gods · 39</summary><h2>Old oaths and news of the dragon</h2><p>Grok and Kló call it Wolfdale and Wolf-Dale while explaining Ulfrir’s home to Glornir, who did not know the name. Kló says she saw the fleet and heard the howling. This supplies the Bloodsworn’s new knowledge and intended Iron Wood destination without giving them the exact Falinn name, gate details or an accomplished arrival.</p></details><details><summary>The Fury of the Gods · 40</summary><h2>Inside, Elvar takes the oversized wolf-carved high chair</h2><p>Inside, Elvar takes the oversized wolf-carved high chair. A central mossy tree as thick as a mead hall bears shield-sized luminous fungi, reaching towards a high vault with fractured light seams. Wolf-carved pillars and torches lit at Ulfrir’s word flank the great hall. Ulfrir says tunnels spread below the river to many forest exits; Elvar has scouts secure them and begins organising the host. Corridors large enough for his wolf form lead to a damp lower passage and Grend’s guarded cell with cot and wall iron ring. No complete map or exact capacity is provided.</p></details><details><summary>The Fury of the Gods · 40</summary><h2>Inside, Elvar takes the oversized wolf-carved high chair</h2><p>Council’s proposed defence uses Ulfrir as bait and leaves the allies to fight Lik-Rifa’s army, based on his prediction she will take homecoming for weakness. The lure and battle remain untested; Elvar still needs current enemy intelligence.</p></details><details><summary>The Fury of the Gods · 41</summary><h2>The dragon’s party learns the wolf moved here</h2><p>The dragon’s party learns the wolf moved here. Munni says he flew to verify, saw ships on the river and the two stone guardians and concludes Ulfrir is present. No exact river name, interior survey or explicit direct god-sighting is supplied by his report.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>Arrival at the wolf-god’s hall</h2><p>The arriving Bloodsworn see both riverbanks being prepared: eastern foliage cleared, western ditches/earthworks/stakes and bridge gates/towers/palisades under construction. Open stone doors are guarded by collared Berserkir and the animated wolves. Inside, a wide-stepped spiral walkway is carved in the luminous tree; tables, fires, cooking, forge alcoves and sparring fill the hall. A wide dais holds the oversized chair and Hrung’s pedestal. These are observed arrangements without a full map, capacity or tested defence result.</p></details><details><summary>The Fury of the Gods · 43</summary><h2>Elvar receives the new allied forces in the hall while Ulfrir privately maintains it is his</h2><p>Elvar receives the new allied forces in the hall while Ulfrir privately maintains it is his. The ravens are welcomed as scouts, and rooms/food/ale are offered to the arrivals. No actual allocation or new architectural map is provided.</p></details><details><summary>The Fury of the Gods · 44</summary><h2>Ulfrir’s old chamber has a huge bed, an arch to the hall and a smaller tunnel door</h2><p>Ulfrir’s old chamber has a huge bed, an arch to the hall and a smaller tunnel door. Its platform sits halfway up the wall, reached by a stair carved in a huge branch joining the trunk’s spiral walkway. Elvar occupies it to keep power symbols from Ulfrir, though the height makes her dizzy. A new training court and breakfast cooking fill the hall below. No complete room map or definite mechanism of the tree is supplied.</p></details><details><summary>The Fury of the Gods · 46</summary><h2>The sortie reaches a vine-hung crumbling tunnel ceiling over steps</h2><p>The sortie reaches a vine-hung crumbling tunnel ceiling over steps. Vol’s red runes reveal a wood-and-stone hatch with iron bolt, which Glornir opens into the Iron Wood at dawn. This reveals one concealed exit, not a complete tunnel plan or proven return route.</p></details><details><summary>The Fury of the Gods · 48</summary><h2>Return from the sortie</h2><p>Returning raiders reach the hall by underground corridors, where cots and thrall attendants serve the wounded and a substantial meal is laid out. Logur’s force is welcomed and Kló brings new enemy news. Exact tunnel distance and the guide magic’s mechanism remain unspecified.</p></details><details><summary>The Fury of the Gods · 49</summary><h2>Building defences at the bridge gate</h2><p>Elvar inspects the completed river gate and bank works while sending further tunnel raids against supplies. A combined working lights shallow rune channels under the timber bridge gate and along the walls. Ulfrir claims protection against dragon and rat, but no siege or attack tests it here.</p></details><details><summary>The Fury of the Gods · 50</summary><h2>Rotta relays Munni’s report of built defences and unnamed internal discontent</h2><p>Rotta relays Munni’s report of built defences and unnamed internal discontent. An alleged conditional offer to open doors if Elvar died is not verified by a local scene; no informants, murder method or breached gate are identified.</p></details><details><summary>The Fury of the Gods · 51</summary><h2>Ulfrir’s trust and the roof ward</h2><p>A private upward route reveals more branch-linked chambers and a canopy opening at the hilltop, protected by a blue-rippling invisible dome with spoken access. Elvar walks on it and sees the surrounding forest/coast. Ulfrir reports all but the guarded raid tunnel sealed and collapsed tower entrances warded with different words. He begins waking the tree’s named Froa Gelta, but no response is shown yet.</p></details><details><summary>The Fury of the Gods · 52</summary><h2>A dawn dragon assault shakes the hall and brings its defenders outside</h2><p>A dawn dragon assault shakes the hall and brings its defenders outside. Bridge defences remain intact but the fleet is wrecked. No action by Gelta is narrated here.</p></details><details><summary>The Fury of the Gods · 52</summary><h2>A dawn dragon assault shakes the hall and brings its defenders outside</h2><p>Broðir, Silrið, Runa and her men attack Elvar on the walkway. She survives, Runa is subdued alive and the pair disappear into the river; no new casualty count for the whole host is supplied.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>Salvage and a choice about freedom</h2><p>The hall hosts Runa’s public execution followed by Ulfrir’s witnessed oath and a coalition-wide release of Tainted. The chair’s four runes mediate the god’s ritual scar; other releases use keys/words without separate blood rites. Some hulls and a barrel are salvaged; celebrations follow, while Grend is separately freed in his room.</p></details><details><summary>The Fury of the Gods · 55</summary><h2>The main host now camps at dawn across the river and sees the ready defences</h2><p>The main host now camps at dawn across the river and sees the ready defences. Siege timber-cutting brings Froa attacks in the surrounding forest, and the dragon counterattacks the trees. These are local spirits outside the hall, not identified as Gelta, and no main breach is shown.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>Freedom and the approaching army</h2><p>The defenders receive Frek’s testimony that Estrid, Skalk and Hjalmar plotted then fled, and Gytha orders a search. Bridge parley fails over surrendering the now-free Ulfrir. Rafts and ladders begin the attack while defensive archery, combined runes and close combat hold the depicted gate encounter unresolved.</p></details><details><summary>The Fury of the Gods · 58</summary><h2>Holding the gate walkway</h2><p>The river defences suffer an actual breach under spertus poison, raft attacks, climbing trolls and tennúr. Orka announces it and Elvar orders retreat; the fate of the hall and entire settlement is not resolved here.</p></details><details><summary>The Fury of the Gods · 59</summary><h2>Retreating defenders form joining shield groups along the hill-side track</h2><p>Retreating defenders form joining shield groups along the hill-side track. Skraeling unbar the river gate and the Raven-Feeders enter with Ilska/Drekr. From inside, Guðvarr sees the road between two steep hill spurs toward an immense arched doorway large enough for the dragon, with Elvar’s host drawn across the approach. The hall is not shown captured or entered by Lik-Rifa.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>Elvar Chainbreaker and the hillside stand</h2><p>The stone entrance admits wounded before a horn signal and closure, leaving the defending host outside before the cliff. Elvar trusts Ulfrir’s part in the plan without a narrated door operator/mechanism. A supplied archer line and shield front meet spertus; a wind after an unnamed incantation disperses poison, then the opposing shield walls crash together. The hall is not shown lost.</p></details><details><summary>The Fury of the Gods · 62</summary><h2>The fighting withdrawal</h2><p>The retreat heads toward the stone doors while a net of flame, cast by unidentified voices ahead, briefly spans the road against hyrndur. A troll tears it down. The narrative ends with Orka and companions still running for the gates; it does not yet show them open or the host safely inside.</p></details><details><summary>The Fury of the Gods · 63</summary><h2>The delayed reopening admits most defenders while Skuld, stone wolves and Tainted cover them</h2><p>The delayed reopening admits most defenders while Skuld, stone wolves and Tainted cover them. Both guardians, one visibly damaged, and Skuld pass inside before the doors slam after Ulfrir’s howl. An intruding troll kills a drengr and Ulfrir destroys it; spiders/hyrndur also enter, one biting Hrung before suddenly dying. The doors are shut, but no wholly cleared hall or final siege outcome is established.</p></details><details><summary>The Fury of the Gods · 64</summary><h2>The rat-blood climb the cliff</h2><p>The flanking rat-blood crew crosses the river, climbs the rear slope/cliff and circles the hill crown tree to a ruined tower. Physical rubble leaves a tiny seam that their powers permit them to squeeze through; below, a blue barrier bars trapdoor steps until Rotta’s words dissolve it. This is a local infiltration route, not proof every ward failed or the hall is occupied. A single reply answers his call for Skalk/Estrid.</p></details><details><summary>The Fury of the Gods · 65</summary><h2>After the retreat the hall has a wounded bay and mixed company gatherings</h2><p>After the retreat the hall has a wounded bay and mixed company gatherings. Ulfrir has his chair back while Elvar uses a smaller one, and tomorrow’s lure is discussed rather than performed. Up the tree stairs she retires to her chamber; its rear door opens to a tunnel containing Gytha’s rooms, with Thorguna at the branch entrance and Sólín at the rear door during sleep.</p></details><details><summary>The Fury of the Gods · 66</summary><h2>The infiltrators descend</h2><p>Skalk and an unnamed drengr guide rat-blood infiltrators through downward, mostly unused torchlit tunnels with heavy carved doors. Two unnamed people are killed en route. Estrid’s group/Hjalmar are sent elsewhere; Biórr opens the door Skalk calls Elvar’s, with a far arch toward the hall. The bed figure and lunging spear defender remain unnamed, and the interrupted attack has no narrated impact yet.</p></details><details><summary>The Fury of the Gods · 67</summary><h2>The attack on Elvar’s chamber</h2><p>The rear bedchamber door admits attackers while the tree-branch exit leads the duel toward the trunk stair. A staff blast throws the doorway melee inward, and Grend/Gytha arrive by that same rear route. Elvar overcomes Biórr but an unnamed assailant attacks from behind and pushes her off the stair. Neither a landing/catch nor the wider hall’s outcome is shown.</p></details><details><summary>The Fury of the Gods · 68</summary><h2>Rebel Fell-Hearted and Estrid drengrs fight the door defenders</h2><p>Rebel Fell-Hearted and Estrid drengrs fight the door defenders. Elvar’s fall confirms her death, and Bloodsworn counterattack kills Hjalmar/Sturla while survivors regroup. Ulfrir’s arrival halts the stair party, but Rotta speaks a successful stone-door command and night-hags flow in with black mist before dawn. No final conquest or cleared hall is shown.</p></details><details><summary>The Fury of the Gods · 69</summary><h2>The open stone doors admit the mixed host and the hall becomes a crowded fight</h2><p>The open stone doors admit the mixed host and the hall becomes a crowded fight. Grend attacks Rotta; Biórr frees the rat’s pinned tail with Elvar’s recovered axe. Lik-Rifa then lands inside, produces Broðir and kills him when his control attempt fails against the freed wolf. Her leap at Ulfrir ends the scene without a resolved battle or Gelta response.</p></details><details><summary>The Fury of the Gods · 70</summary><h2>The gods collide and the tree burns</h2><p>The god clash shakes the hall and the waking Gelta binds the dragon, while guardians and mortal forces fight around her. Rotta’s fire threatens the ash/Froa and Vol’s first frost fails; combat reaches the tree stair. The hall, dragon and tree outcomes remain unresolved.</p></details><details><summary>The Fury of the Gods · 71</summary><h2>Guðvarr finds Estrid</h2><p>At first dawn the joined enemy shield formation breaks, Estrid is murdered by Guðvarr and Gelta’s burning form collapses. The roots release the dragon; the wolf rolls clear of fire, and the dragon carries Rotta upward around the ash. Some frost casters/riders remain unnamed and no final escape, tree collapse or overall result is shown.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>The roof ward blocks escape until Rotta’s command dissolves it</h2><p>The roof ward blocks escape until Rotta’s command dissolves it. The companies reach the windy crown while Halja reports Gelta dead/hall burning. Vast fleets appear at sea and enter named coastal approaches, their identity attributed to Glornir. The source’s coast of Iskidan wording is retained for review. The battle resumes on the grassy crown, not a completed escape or victory for all defenders.</p></details><details><summary>The Fury of the Gods · 73</summary><h2>Fire separates the upward and floor-level parties</h2><p>Fire separates the upward and floor-level parties. Sighvat/Orlyg press skraeling toward the open doors, Ulfrir is harried, and Bloodsworn help a broken-legged stone guardian. Brák brings captive children from a corridor; Refna claws free, Leif/Sterkur intervene and Brák catastrophically wounds Einar. Neither all captives’ safety nor the final battle result is shown.</p></details><details><summary>The Fury of the Gods · 74</summary><h2>Its crown trembles as Snaka rises, then great rents drop earth/rock into the chamber</h2><p>Its crown trembles as Snaka rises, then great rents drop earth/rock into the chamber. The battle is interrupted and Glornir leads a retreat to the Falinn cliff, jumping with Vol; Orka follows with Breca. No total destruction of every route or survival tally is given.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>Falling roof/earth, fire and floor rents drive all sides toward escape</h2><p>Falling roof/earth, fire and floor rents drive all sides toward escape. One stone door collapses and blocks the gate. Ulfrir gathers allied survivors, rescues the delayed Hrung group and leads to tunnels; Snaka bursts through the far wall as the group reaches the entrance, then they enter the passage.</p></details><details><summary>The Fury of the Gods · 76</summary><h2>Surviving the plunge into the Falinn</h2><p>From the riverbank the survivors see half the hill gone and Snaka drive his head down into the hall, smashing its side to rubble. This distant devastation does not reveal the tunnel party’s fate or the exact condition of every passage.</p></details><details><summary>Illustration · The Fury of the Gods · 66</summary><p><a href="assets/1cf47a825aed2b.jpg">Open noncanonical illustration</a></p><p>Biórr at the door before entering.</p></details><details><summary>Illustration · The Fury of the Gods · 44</summary><p><a href="assets/cb33c87828879a.jpg">Open noncanonical illustration</a></p><p>The descent from Ulfrir’s former chamber.</p></details><details><summary>Illustration · The Fury of the Gods · 59</summary><p><a href="assets/26216e2f177e2d.jpg">Open noncanonical illustration</a></p><p>The shield wall before the hillside entrance.</p></details><details><summary>Illustration · The Fury of the Gods · 72</summary><p><a href="assets/146eb07fa5bcf1.jpg">Open noncanonical illustration</a></p><p>The fleets seen from the crown of Wolfdales at dawn.</p></details><details><summary>Illustration · The Fury of the Gods · 74</summary><p><a href="assets/1ea616eab4309c.jpg">Open noncanonical illustration</a></p><p>Glornir and Vol’s leap, before any landing is shown.</p></details><details><summary>Illustration · The Fury of the Gods · 71</summary><p><a href="assets/e28796c47f3fa9.jpg">Open noncanonical illustration</a></p><p>The dragon carrying the rat upward inside the hall.</p></details><details><summary>Illustration · The Fury of the Gods · 68</summary><p><a href="assets/e401e66f94ebea.jpg">Open noncanonical illustration</a></p><p>The black mist at the reopened stone doors.</p></details><details><summary>Illustration · The Fury of the Gods · 64</summary><p><a href="assets/2aae14c652974b.jpg">Open noncanonical illustration</a></p><p>Rotta catching Biórr’s slipping wrist.</p></details><details><summary>Illustration · The Fury of the Gods · 75</summary><p><a href="assets/6db2783ef006df.jpg">Open noncanonical illustration</a></p><p>Snaka appearing through the shattered hall wall as Ulfrir withdraws.</p></details><details><summary>Illustration · The Fury of the Gods · 38</summary><p><a href="assets/b18ccdbba68b24.jpg">Open noncanonical illustration</a></p><p>The stone guardians awakening before Ulfrir changes form.</p></details><details><summary>Illustration · The Fury of the Gods · 72</summary><p><a href="assets/a31ae3fafb144b.jpg">Open noncanonical illustration</a></p><p>The roof ward stopping the dragon before Rotta opens it.</p></details><details><summary>Illustration · The Fury of the Gods · 62</summary><p><a href="assets/784e4cd427e9d8.jpg">Open noncanonical illustration</a></p><p>The fire-net before it is torn down.</p></details><details><summary>Illustration · The Fury of the Gods · 52</summary><p><a href="assets/0db38c882c4a1f.jpg">Open noncanonical illustration</a></p><p>The ruined fleet seen from the intact gate.</p></details><details><summary>Illustration · The Fury of the Gods · 71</summary><p><a href="assets/43824082300f3e.jpg">Open noncanonical illustration</a></p><p>The unnamed attackers breaking the joined shield line.</p></details><details><summary>Illustration · The Fury of the Gods · 40</summary><p><a href="assets/1f6838dd4b2fd8.jpg">Open noncanonical illustration</a></p><p>Elvar walking past the great hall’s luminous tree.</p></details><details><summary>Illustration · The Fury of the Gods · 42</summary><p><a href="assets/07e832076ed195.jpg">Open noncanonical illustration</a></p><p>Noncanonical arrival view showing the spiral walkway newly described around the tree.</p></details><details><summary>Illustration · The Fury of the Gods · 63</summary><p><a href="assets/17a8a49cddc3be.jpg">Open noncanonical illustration</a></p><p>The two guardians returning, one visibly damaged.</p></details><details><summary>Illustration · The Fury of the Gods · 64</summary><p><a href="assets/d1551f7b80fc0b.jpg">Open noncanonical illustration</a></p><p>The tower ward yielding to Rotta’s words.</p></details><details><summary>Illustration · The Fury of the Gods · 75</summary><p><a href="assets/855fc6762a4e54.jpg">Open noncanonical illustration</a></p><p>Ulfrir carrying Hrung’s sailcloth and shielding the delayed party.</p></details><details><summary>Illustration · The Fury of the Gods · 69</summary><p><a href="assets/d609fc6ea53452.jpg">Open noncanonical illustration</a></p><p>The free wolf’s refusal, before Broðir’s death.</p></details><details><summary>Illustration · The Fury of the Gods · 46</summary><p><a href="assets/ac7c1b098d7483.jpg">Open noncanonical illustration</a></p><p>The concealed exit revealed before the sortie.</p></details><details><summary>Illustration · The Fury of the Gods · 55</summary><p><a href="assets/fe8aa15a09c00e.jpg">Open noncanonical illustration</a></p><p>The defended bank seen by the arriving host.</p></details><details><summary>Illustration · The Fury of the Gods · 73</summary><p><a href="assets/05f4dcba636f0f.jpg">Open noncanonical illustration</a></p><p>Æsa running the planted spear during the stone-wolf rescue.</p></details></noscript>
