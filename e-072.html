      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 9</summary><h2>Introduction</h2><p>The captured woman is Berak’s wife and the boy’s mother.</p></details><details><summary>The Shadow of the Gods · 9</summary><h2>The serpent and the captive family</h2><p>Her eyes are grey-blue, her hair fair, and blue tattoos show below her neck.</p></details><details><summary>The Shadow of the Gods · 9</summary><h2>The serpent and the captive family</h2><p>The chapter 9 description also notes her pale face and a tunic and cloak drawn close around her neck. A documented  separates those observations from artistic choices.</p></details><details><summary>The Shadow of the Gods · 9</summary><h2>The serpent and the captive family</h2><p>She sings and the attacking serpent slows and dives away.</p></details><details><summary>The Shadow of the Gods · 9</summary><h2>The serpent and the captive family</h2><p>Agnar calls her a Seiðr-witch with Snaka’s blood. He threatens her son if she uses powers against his crew.</p></details><details><summary>The Shadow of the Gods · 14</summary><h2>Blood memories at the oath stone</h2><p>Berak names his wife Uspa in B01-C014. She calls their boy Bjarn.</p></details><details><summary>The Shadow of the Gods · 14</summary><h2>Blood memories at the oath stone</h2><p>She presses her bloodied palm to the granite slab, and glowing lines burn away the moss.</p></details><details><summary>The Shadow of the Gods · 14</summary><h2>Blood memories at the oath stone</h2><p>She tells a story of jealousy, murder and blood feud causing the gods’ war. She says Lik-Rifa created the vaesen in secret.</p></details><details><summary>The Shadow of the Gods · 23</summary><h2>Kinship and a proposed marriage</h2><p>Uspa insists that she and Bjarn need to leave Snakavik.</p></details><details><summary>The Shadow of the Gods · 25</summary><h2>A choice of loyalties</h2><p>Uspa refuses to explain her need to leave Snakavik until Elvar is sober.</p></details><details><summary>The Shadow of the Gods · 27</summary><h2>A raid and a stolen child</h2><p>Burned bodies lie around Uspa, who is unconscious but breathing. Uspa blames the disaster on their failure to leave when she warned Elvar. Uspa says the attackers wanted her rather than Bjarn. Uspa claims to know the way to Oskutreð; Elvar overhears the whispered disclosure.</p></details><details><summary>The Shadow of the Gods · 29</summary><h2>The stolen book and the road to Oskutreð</h2><p>Uspa insists that Oskutreð is real. Uspa says she destroyed the Graskinna in the fire pool on Iskalt while Berak fought the troll. Uspa says she and Berak stole the Graskinna from the Raven-Feeders, who have hunted them for a long time. Uspa says she burned the book to prevent treasure-seekers finding god-remains and provoking new powers and war. Uspa offers the route for love of her son. Uspa threatens to kill herself rather than submit to Agnar&#x27;s proposed coercion by a thrall-collar. Uspa attributes the attack on Ilska&#x27;s warriors to herself. Uspa agrees to guide the group to Oskutreð first if all present swear the blóð svarið.</p></details><details><summary>The Shadow of the Gods · 38</summary><h2>Chapter 38 — Isbrún Bridge</h2><p>At the vaesen pit, Uspa applies blood to a black boulder and chants. A huge pawprint appears, and the Isbrún Bridge becomes visible beneath her feet as she steps over the edge.</p></details><details><summary>The Shadow of the Gods · 44</summary><h2>An uncertain sense of the road ahead</h2><p>In the Dark-of-Moon Hills she predicts they may see Oskutreð the next day, explicitly admitting that the feeling may be wrong. She fears that bringing the gods’ treasures south will cause violence. She says recovering Bjarn matters more to her than her principles, while arguing for love and friendship over battle-fame.</p></details><details><summary>The Shadow of the Gods · 45</summary><h2>Vol names Uspa as her missing sister</h2><p>In chapter 45 Vol names her missing sister as Uspa, revealing the reported family connection at this point in reading chronology.</p></details><details><summary>The Shadow of the Gods · 48</summary><h2>The bargain brings them to Oskutreð</h2><p>She brings the Battle-Grim to Oskutreð’s ruined stump, fulfilling the destination part of her bargain; Bjarn has not yet been recovered.</p></details><details><summary>The Shadow of the Gods · 52</summary><h2>Magic against the opening of the tree</h2><p>She joins Vörn in barring the tree with magic. Ilska’s earth-strike hurls her away and leaves her unmoving; her subsequent condition is not established in this chapter.</p></details><details><summary>The Hunger of the Gods · 2</summary><h2>A burial and a surviving gaoler</h2><p>She insists the living oath-takers must recover Bjarn and says she cannot halt its effects even by dying. Elvar&#x27;s and Sighvat&#x27;s reactions demonstrate punishment and relief, while Uspa&#x27;s broader explanation remains her claim. She agrees to Elvar&#x27;s delayed request for the company&#x27;s support.</p></details><details><summary>The Hunger of the Gods · 2</summary><h2>A burial and a surviving gaoler</h2><p>Her fair hair is braided and bound, with rune tattoos visible from neckline towards jaw.</p></details><details><summary>The Hunger of the Gods · 6</summary><h2>The swarm in the depths</h2><p>During the swarm attack, a spoken invocation is followed by a blinding light; she stands with a glowing ball in her raised hand. The creatures die or retreat beyond its reach. She then passes the rune-door as its runes vanish.</p></details><details><summary>The Hunger of the Gods · 6</summary><h2>The swarm in the depths</h2><p>She identifies the black-bound book as a Galdrabok written by Lik-Rifa, says it discusses resurrection, and eventually answers that it can raise Ulfrir.</p></details><details><summary>The Hunger of the Gods · 6</summary><h2>The swarm in the depths</h2><p>She agrees to the undertaking to save Bjarn, asking that her husband also be freed. Elvar promises to try and Grend assents; Uspa accepts their word. Her claim that the book will allow her to forge a god-binding collar and restore life to Ulfrir remains untested here.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>A collar and the wolf-god&#x27;s return</h2><p>She directs the collar’s forging and adds blood with Elvar. Elvar successfully commands it to open, close and expand around Ulfrir’s skeletal neck.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>A collar and the wolf-god&#x27;s return</h2><p>Consulting Lik-Rifa’s Galdrabok, she carves eight radiating lines and runes around the bones. She calls the design a Guldurstafir, intended to channel and focus the summoned power. Her blood and words light the lines, and Sighvat lifts her to fit the collar.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>A collar and the wolf-god&#x27;s return</h2><p>She takes a red-skinned book from her belt and reads it; Elvar thinks it is made from Skuld’s sister’s skin. These descriptions are recorded without assigning it the Raudskinna’s name or merging the two books.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>A collar and the wolf-god&#x27;s return</h2><p>At the first instant of regrowth, veins and arteries rise slowly from the soil around the old bones, after the airborne rune has settled and faded.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>A collar and the wolf-god&#x27;s return</h2><p>She leads all the Battle-Grim in giving blood. Her airborne rune settles over the bones and flesh regrows; the body remains lifeless until she strikes its chest and repeats the command. Ulfrir gasps, stands and howls, but is still wounded and soon collapses into human form.</p></details><details><summary>The Hunger of the Gods · 17</summary><h2>An uneasy bargain with Ulfrir</h2><p>She and Skuld have washed Ulfrir’s wounds and applied honey and sage-lined linen. She says he heals slowly. When Huld halts the company she warns of being stranded until the Long Night and rejects being called a thrall.</p></details><details><summary>The Hunger of the Gods · 17</summary><h2>An uneasy bargain with Ulfrir</h2><p>At the bridge she says sólstöður has not ended, but her blood and words make only the rock’s pawprint appear, not a crossing. She helps the weakened Ulfrir to the rock; after his successful magic all four carts cross. During the subsequent attack she conjures a moving flaming rune-shield that burns a path through the tennúr.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>A duel for the Battle-Grim</h2><p>Elvar wakes her before dawn and later thanks her. She has tended the wounded Ulfrir and Skuld, who sleep through the march and night. They subsequently join the duel spectators.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>A duel for the Battle-Grim</h2><p>After the duel Elvar says Uspa spoke Seiðr-runes over her shoulder before dawn and that she felt no pain. This is the stated treatment and experienced relief; it does not establish permanent anatomical repair or a general healing limit.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>Myrk tells Orka’s group that Uspa, not Kráka, was the enslaved Battle-Grim witch who opened Isbrún Bridge. Orka recognises Vol’s sister and speculates about Berak’s fate in shock. The relationship was known earlier; the reported enslavement is new to this group, not a new meeting with Uspa.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>Myrk professes ignorance of whether she and the Battle-Grim survivors are dead or alive after the hurried departure from Oskutreð. That uncertainty is Myrk’s, not a new confirmed death or a replacement for the reader’s direct scenes of Uspa.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>She brings Elvar a meal and praises her leadership before explaining that Ilska invited her and Berak to join because they were Tainted. They travelled with the Raven-Feeders for a while, then judged Ilska’s path to seek vengeance and death rather than justice. She says their effort to destroy the Graskinna aimed to stop that course and save people from slavery, torture and death. This is her account and assessment.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>She confronts Elvar with the enslavement and sale of Berak and treatment of her and Bjarn as cattle. Rejecting the way of the world as an excuse, she argues that people choose right with head and heart and can live peacefully with those they love. She believes others share that view and presses Elvar to recognise it; Elvar voices no apology or adopted reform policy.</p></details><details><summary>The Shadow of the Gods · 29</summary><h2>The stolen book and the road to Oskutreð</h2><p>Her renewed account confirms the earlier testimony of theft and destruction.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The laden ship reaches Starl</h2><p>Elvar recalls her existing promise to try to free Berak while planning the company’s course; that rescue has not occurred. At Starl, Orka and Halja approach the Wave-Jarl demanding Uspa. She climbs onto the top-rail beside the ramp and greets Halja with genuine joy.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The laden ship reaches Starl</h2><p>Seeing Orka changes her joy to shock: she names her and says she thought her dead. Orka denies being dead and asks her to come, but Elvar refuses. Orka raises her axe; Ulfrir interrupts and greets her as wolf-child. Uspa has not left the ship, been released or accepted a new arrangement when the chapter ends.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>She vouches for Orka and Halja and says a god is needed to slay a god. The truce allows conversation, not her release. She learns Thorkel was killed and Orka’s son taken, then tells Orka that Bjarn was taken too. Orka infers the boys are together, without either mother seeing them in this scene.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>She shows her coiled white wrist-and-forearm scars, with Elvar, Sighvat and Grend doing the same, and refuses to leave the Bjarn oath and Elvar’s plan. Her assessment that Orka cannot defeat the dragon-god and warband alone is advice, not a tested limit. She consoles Halja over Vali.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>She infers the copied writings’ connection to the Raudskinna and Lik-Rifa’s release, without identifying the copies as an intact original or merging the books. Halja then tells her Skalk abducted Vol and guesses Glornir has caught up. Uspa goes pale and worries. This is the news she receives, not a fresh sighting of Vol or proof of rescue; Halja does not supply the reader’s later Jaromir information.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>Elvar’s market purchases entrusted to her have now been unloaded and stowed aboard the Wave-Jarl, and Elvar praises her provisioning. Uspa says it is easier than stocking a longhouse and running a farm, then confirms she once ran a farm, almost wistfully. No farm location, date or ownership is supplied.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>She stands at the prow with Ulfrir and Skuld watching what Elvar later recognises as Orka’s riders on the lakeshore. Elvar orders all three back to seats in the stern before departure. The ship then casts off towards the southern river mouth; this does not establish that Uspa has left the company or reached Snakavik.</p></details><details><summary>The Hunger of the Gods · 61</summary><h2>The Battle-Grim return to Snakavik</h2><p>She covers the treasure aboard with an incantation and red web-like tendrils that fade, claiming thieves will receive an unpleasant surprise. No intrusion tests the effect. Elvar leads her towards Störr to recover her husband.</p></details><details><summary>The Hunger of the Gods · 67</summary><h2>Elvar returns to her father&#x27;s hall</h2><p>She sharply inhales as a Berserkir steps forward and Elvar recognises Berak alive. He remains iron-collared; the meeting&#x27;s outcome is not supplied.</p></details><details><summary>The Hunger of the Gods · 69</summary><h2>Bargaining for the Berserkir</h2><p>She starts forward when Störr punishes Berak, but Elvar checks her. The attempt to buy him and hire the Berserkir fails to secure control or release before the threatened clash.</p></details><details><summary>The Hunger of the Gods · 71</summary><h2>The wolf-god wrecks Störr&#x27;s hall</h2><p>She guards Elvar with a rune dome, later shields the Battle-Grim from the Berserkir, and finally embraces Berak after Elvar stops them. He remains collared; no formal freedom is announced.</p></details><details><summary>The Fury of the Gods · 9</summary><h2>Training and the attempted treasury escape</h2><p>Hrung reports that her ward on the chests burned thieves, though some used a body to carry one chest away. She senses Seiðr around the guards&#x27; deaths. At the docks she identifies the serpents as glamour, then uses Binddu varir hennar to wrap mist around the witch&#x27;s mouth; it parts around the woman&#x27;s fingers and reforms, preventing speech before Skuld&#x27;s strike.</p></details><details><summary>The Fury of the Gods · 19</summary><h2>The council discusses recovering Bjarn</h2><p>The council discusses recovering Bjarn. She suggests Nastrandir as a possible location, but no current sighting or message supplies her with his actual whereabouts. Stealth, force and intelligence gathering remain proposals; Elvar orders preparation without departure.</p></details><details><summary>The Fury of the Gods · 23</summary><h2>Hrung’s account and Grend’s secret</h2><p>She mediates the newcomers’ loyalty arrangement, proposing their oaths and Ulfrir’s command, which Elvar orders immediately. Afterwards she urges freeing the existing Tainted and announcing it across Vigrið to compete with Lik-Rifa’s liberation claim. She says Ulfrir too should be released. Elvar refuses, invokes Bjarn and continued need for the force; Uspa calls it wrong and leaves. Her hopes about voluntary allies remain predictions, not an accomplished emancipation.</p></details><details><summary>The Fury of the Gods · 33</summary><h2>The tide and the search for Grend</h2><p>Raven-feather-cloaked with tattooed hands and forearms, she insists the fleet must sail at noon’s tide and reminds Elvar she already delayed yesterday. Elvar finally orders the docks after Ulfrir’s warning too, but the fleet’s actual departure is not yet shown.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>Arrival at the wolf-god’s hall</h2><p>Fair-haired in her raven-feather cloak, dark tattoos on arms/jaw, she runs from Elvar’s dais to embrace Vol. Both smile and weep, an actual reunion of the already known sisters. She then embraces Glornir when he names her.</p></details><details><summary>The Fury of the Gods · 44</summary><h2>The new arrivals and Grend’s fate</h2><p>She speaks quietly with the arrivals and introduces Estrid as Queen of Darl and Skalk as Galdurman, a twist of her lips marking the latter name. The introduction is not an independent guarantee of the newcomers’ loyalty or their lost territorial control.</p></details><details><summary>The Fury of the Gods · 49</summary><h2>Building defences at the bridge gate</h2><p>She joins Vol and Iva in the carved circle behind the gate, kneeling with a rune-lit fist in the channels as Ulfrir and Skuld add blood. The visible combined working does not prove that any one participant alone could create the claimed protection.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>Her earlier freedom advocacy enters Elvar’s reasoning</h2><p>Her earlier freedom advocacy enters Elvar’s reasoning. She officiates the god’s oath, carving four runes in the chair and adding palm blood, naming the rune meanings and translating his vow. The visible ritual scars Ulfrir; Uspa is not separately shown swearing his justice oath. She supplies keys for the Berserkir’s actual releases. Her individual collar handling is not specifically narrated within the broad freedom policy.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>Freedom and the approaching army</h2><p>Vol, Uspa and Iva combine spoken invocations and runes over the bridge defenders as enemy red/blue runes descend. The spells collide and burst in heat and colour. This successful interception is observed, without proving immunity to every later spell or naming a universal magical limit.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>Vol, Uspa and Iva confer behind the shield wall before the clash</h2><p>Vol, Uspa and Iva confer behind the shield wall before the clash. Later an incantation from behind the line is followed by a wind dispersing the spertus cloud, but that passage does not individually identify its caster; no specific casting is assigned to her on that basis alone.</p></details><details><summary>The Fury of the Gods · 63</summary><h2>The stone doors and the retreat inside</h2><p>Vol, Uspa and Iva are explicitly seen using rune-spells against the hyrndur inside the hall after the doors close. This named interior action does not retroactively identify the unassigned earlier wind or fire-net casters.</p></details><details><summary>The Fury of the Gods · 65</summary><h2>Her report of the ravens’ search for Bjarn is still negative</h2><p>Her report of the ravens’ search for Bjarn is still negative. She tends the blue/cold Hrung, says Hlýju and places warming glowing hands on his face. His eyes focus and he feels relief, joking affectionately; her teasing answer does not establish romance, a complete cure or literal direct parentage from the address Snaka’s child.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>Leif’s death and the tunnel escape</h2><p>Grend leads a delayed group including Uspa, Berak and Gytha, with Berserkir/drengrs carrying Hrung in sailcloth. Varg alerts Ulfrir, who shelters the party and takes Hrung’s cloth in his jaws to the tunnel entrance; they follow into the passage.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>She helps unwrap Hrung, mourns at Elvar’s body and comforts Refna</h2><p>She helps unwrap Hrung, mourns at Elvar’s body and comforts Refna. She explains her spells released power already in Ulfrir’s god-bones and says she cannot return the non-gods Elvar/Einar. At council she requests intelligence and the ravens; Ulfrir rejects trusting them.</p></details><details><summary>The Fury of the Gods · 87</summary><h2>Biórr finds her beside an unnamed dark-contrasting Seiðr-witch and Berak</h2><p>Biórr finds her beside an unnamed dark-contrasting Seiðr-witch and Berak. Bjarn runs to her, she lifts/kisses him laughing through tears, and Berak embraces them both. The unnamed companion is not automatically identified as Vol.</p></details><details><summary>The Fury of the Gods · 88</summary><h2>Vol and Uspa are explicitly named casting against dragon-born, with Glornir/Berak defending flanks</h2><p>Vol and Uspa are explicitly named casting against dragon-born, with Glornir/Berak defending flanks. Orka’s party breaks the cultists assaulting them. This current named pair does not retrospectively name every earlier unidentified witch.</p></details><details><summary>The Fury of the Gods · 90</summary><h2>She joins Vol/Iva’s binding spells, then embraces Bjarn with Berak after the dragon dies</h2><p>She joins Vol/Iva’s binding spells, then embraces Bjarn with Berak after the dragon dies. Her son’s reunion remains complete and their future settlement is not yet supplied.</p></details><details><summary>Illustration · The Hunger of the Gods · 71</summary><p><a href="assets/60a169e02eb340.jpg">Open noncanonical illustration</a></p><p>Elvar advances through Störr&#x27;s hall beneath Uspa&#x27;s protective barrier.</p></details><details><summary>Illustration · The Fury of the Gods · 87</summary><p><a href="assets/54c50d8382e602.jpg">Open noncanonical illustration</a></p><p>Bjarn’s reunion with his parents.</p></details><details><summary>Illustration · The Fury of the Gods · 54</summary><p><a href="assets/7ac9be53d16b41.jpg">Open noncanonical illustration</a></p><p>Noncanonical detail of the four carvings prepared for the oath; the glyph shapes are artistic.</p></details><details><summary>Illustration · The Fury of the Gods · 49</summary><p><a href="assets/b260375c8f69d9.jpg">Open noncanonical illustration</a></p><p>The combined working at the river gate.</p></details><details><summary>Illustration · The Fury of the Gods · 56</summary><p><a href="assets/9d4fd81ccba6d4.jpg">Open noncanonical illustration</a></p><p>The three casters’ combined defence.</p></details><details><summary>Illustration · The Hunger of the Gods · 8</summary><p><a href="assets/c1e1851d222f75.jpg">Open noncanonical illustration</a></p><p>The first vessels rise from the earth during Ulfrir&#x27;s restoration.</p></details><details><summary>Illustration · The Fury of the Gods · 75</summary><p><a href="assets/855fc6762a4e54.jpg">Open noncanonical illustration</a></p><p>Ulfrir carrying Hrung’s sailcloth and shielding the delayed party.</p></details><details><summary>Illustration · The Shadow of the Gods · 43</summary><p><a href="assets/66374bb136ce78.jpg">Open noncanonical illustration</a></p><p>Uspa during her conversation with Elvar aboard the Wave-Jarl.</p></details><details><summary>Illustration · The Shadow of the Gods · 43</summary><p><a href="assets/339c3a71267c75.jpg">Open noncanonical illustration</a></p><p>Uspa steps onto the Isbrún Bridge as its span becomes visible over the chasm.</p></details><details><summary>Illustration · The Fury of the Gods · 65</summary><p><a href="assets/3b68c40c40405f.jpg">Open noncanonical illustration</a></p><p>Uspa warming the awake but still cold Hrung.</p></details><details><summary>Illustration · The Fury of the Gods · 42</summary><p><a href="assets/6ea1ebcad9ddc8.jpg">Open noncanonical illustration</a></p><p>The sisters’ reunion in Wolfdales.</p></details></noscript>
