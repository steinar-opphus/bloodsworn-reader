      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 13</summary><h2>Introduction</h2><p>Torvik introduces himself to Varg. He says he scouts under Edel and is apprenticed to Jökul Hammer-Hand.</p></details><details><summary>The Shadow of the Gods · 13</summary><h2>Story and connections</h2><p>He says he has not yet taken the oath and must first prove courage or loyalty.</p></details><details><summary>The Shadow of the Gods · 18</summary><h2>New weapons and an attack at the docks</h2><p>Torvik identifies Logur’s rafter relic as a Vackna Horn fragment and says it helped make Logur rich. He says the gift was made by Skullsplitter, their old chief, rather than Glornir.</p></details><details><summary>The Shadow of the Gods · 34</summary><h2>Cheese, companionship and a troll tale</h2><p>Torvik praises Svik as a tale-teller. Torvik calls Varg brother, giving Varg both guilt about Frøya and a sense of companionship; biological kinship is not established.</p></details><details><summary>The Shadow of the Gods · 39</summary><h2>A sister&#x27;s hair and an offer of help</h2><p>After Varg shows him his sister&#x27;s hair, Torvik offers to help hunt and kill her murderers once Glornir grants the akáll. He also reports Edel&#x27;s encouragement of his tracking ability.</p></details><details><summary>The Shadow of the Gods · 41</summary><h2>The approach to the excavation</h2><p>Torvik guides Svik&#x27;s group to the guarded tunnel glade. Like Varg, he has no mail and is still outside the sworn oath.</p></details><details><summary>The Shadow of the Gods · 43</summary><h2>The battle beneath the cliff</h2><p>After a skraeling scatters him and Varg, Torvik fights it and spears it through the body; Einar finishes it. Torvik then pulls Varg up before they rejoin the battle. He also throws his spear into the troll&#x27;s shoulder.</p></details><details><summary>The Shadow of the Gods · 45</summary><h2>Waking among the wounded</h2><p>He tends the wounded Varg and promises to save his life again. Yrsa then spears him in the throat during Skalk’s betrayal. He dies holding Varg’s hand, after Skalk refuses to let Varg give him a weapon.</p></details><details><summary>The Hunger of the Gods · 24</summary><h2>A rescue planned in Darl</h2><p>Before the planned rescue, Jökul remembers him as a good lad and hopes to avenge him on Yrsa. His reassurance of Varg as a brother evokes chosen companionship rather than an additional biological relationship. Varg’s recollection of the killing names a sword, whereas the original direct scene names Yrsa’s spear; this source discrepancy is recorded for review, with the original event retained.</p></details><details><summary>The Fury of the Gods · 81</summary><h2>The charge against the gods</h2><p>Varg remembers him as the first person to call him friend and explicitly names him as the friend Yrsa killed, dedicating his final axe strike to Torvik/friendship. The revenge scene adds no new version of Torvik’s original death.</p></details><details><summary>Illustration · The Fury of the Gods · 81</summary><p><a href="assets/9a85192de9d89f.jpg">Open noncanonical illustration</a></p><p>Varg’s ankle hook before the fatal follow-up.</p></details></noscript>
