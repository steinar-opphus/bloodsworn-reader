      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 2</summary><h2>Introduction</h2><p>Svik Hrulfsson is the attendant at the trial gate, where he also introduces himself as Tangle-Hair.</p></details><details><summary>The Shadow of the Gods · 2</summary><h2>Appearance</h2><p>Svik is slim, with red hair neatly braided at the gate. His beard is trimmed and oiled, his riveted mail well kept; fine knotted scrollwork decorates his seax scabbard.</p></details><details><summary>The Shadow of the Gods · 2</summary><h2>A place among the Bloodsworn</h2><p>When Varg asks for an invocation, Svik explains the word akáll but refuses him Vol&#x27;s services: she works for the Bloodsworn and is not for hire. He points out the tattooed woman as Vol and names the trial fighter Einar Half-Troll.</p></details><details><summary>The Shadow of the Gods · 4</summary><h2>Fighting Varg&#x27;s pursuers at the camp</h2><p>His intervention at Varg&#x27;s camp is more direct. He cuts fingers from a spear-bearing attacker&#x27;s hand, headbutts the man and growls at Orl&#x27;s hound.</p></details><details><summary>The Shadow of the Gods · 16</summary><h2>Help, equipment money and an apprentice</h2><p>During Varg&#x27;s training, Svik helps him stand and tells him that accepting help is not weakness. When Glornir gives the apprentice money for equipment, Svik offers to help him spend it.</p></details><details><summary>The Shadow of the Gods · 18</summary><h2>Weapons, armour and the dockside clash</h2><p>Shopping becomes a lesson in practical priorities: spear, seax and axe are starting weapons, and a helmet matters more than mail. At the docks, the danger is immediate; Svik&#x27;s warning about cavalry approaching from behind gives the rear row time to reform.</p></details><details><summary>The Shadow of the Gods · 20</summary><h2>Battle spoils and a sea-chest seat</h2><p>Svik explains why a warrior must not take the spoils of another person&#x27;s kill, then helps Varg strip his own opponent&#x27;s equipment. A sea-chest becomes both storage and rowing seat, and Varg follows Svik&#x27;s rhythm as the ship leaves Liga.</p></details><details><summary>The Shadow of the Gods · 26</summary><h2>Oar-dance victory and a story of loss</h2><p>He wins the oar-dance, but the company also carries stories of loss. Svik confirms Torvik&#x27;s account of Skullsplitter drowning after a fall from the Sea-Wolf. He calls the old chief Glornir&#x27;s brother and says Glornir still mourns him; these remain reports of the earlier fate.</p></details><details><summary>The Shadow of the Gods · 30</summary><h2>War gear and survival on the march</h2><p>On land, his advice returns to survival: Varg should wear his war gear rather than carry it in a sack, and may regret leaving armour behind if they meet a troll. At the farm he sets an outward-facing shield line while Glornir and the others search.</p></details><details><summary>The Shadow of the Gods · 34</summary><h2>The story behind the cheese</h2><p>Sharing cheese with Varg, Svik claims it once saved his life. His tale places him at fourteen or fifteen, facing a troll that threatens his older brothers. Squeezing cheese convinces the creature he can crush stone; a later eating contest is another trick, with porridge hidden in a sack beneath his tunic. When he cuts the sack as if opening his own belly, the troll imitates him fatally. The adventure is Svik&#x27;s narrated account, not independently established history.</p></details><details><summary>The Shadow of the Gods · 43</summary><h2>At the excavation</h2><p>Svik leads his group through the enemy shield wall and attacks the troll blocking their way to Glornir. While Einar and Jökul fight below, he climbs onto its back and drives his blade between neck and shoulder.</p></details><details><summary>The Shadow of the Gods · 47</summary><h2>Blood and the oath</h2><p>Svik reveals his descent from Refur the fox by briefly changing his face, eyes and teeth before restoring them. He tells Varg that control of the beast in his blood can be learned. The wider disclosure is that all the Bloodsworn are god-touched, but Svik insists that ancestry alone does not make a person one of them: trust and a kept oath matter.</p></details><details><summary>The Hunger of the Gods · 1</summary><h2>Rest and restraint in the burned hall</h2><p>He confronts Orka with grief that she left the company despite her sworn oath. His current outfit includes gleaming mail, pale-blue wool breeches and dark leg wraps; a silver ring holds his oiled beard.</p></details><details><summary>The Hunger of the Gods · 11</summary><h2>Learning to control the wolf</h2><p>Having exhausted his cheese and found none in Grimholt’s food stores, he complains about cold biscuits and pickled herring. During Røkia’s lesson he urges Varg to make the wolf in his blood serve him rather than become its slave.</p></details><details><summary>The Hunger of the Gods · 13</summary><h2>News of a missing sister</h2><p>Varg notices his unusual quiet since Grimholt and doubts his joke about cheese explains it. Sent to buy news with Varg, he uses his reputation, shield and offered silver to make contact with Njal’s village.</p></details><details><summary>The Hunger of the Gods · 13</summary><h2>News of a missing sister</h2><p>He affirms Varg is no thrall and promises to find Brimil, but insists on questioning him before revenge. He helps Varg put away his shaking axe.</p></details><details><summary>The Hunger of the Gods · 13</summary><h2>News of a missing sister</h2><p>He knocks a dragon preacher from a cart with a thrown cheese round. Dodging a retaliatory spear with extraordinary speed, his eyes show greenish-yellow to Varg. He then catches Varg’s raised wrist and urges mastery of the wolf; he releases it once Varg calms.</p></details><details><summary>The Hunger of the Gods · 19</summary><h2>Scouting beyond the repaired bridge</h2><p>Outside Darl he points out that the Sea-Wolf is still distant and asks whether they should wait. Glornir refuses. Later, Svik silences Einar’s further protest over leaving the children by squeezing his arm.</p></details><details><summary>The Hunger of the Gods · 24</summary><h2>A rescue planned in Darl</h2><p>He leads Varg, Jökul and Æsa in from western Darl, keeping them on the rescue task rather than the thrall-market. His hooded wool cloak covers his mail; the group’s shields and helmets remain at the wagon.</p></details><details><summary>The Hunger of the Gods · 24</summary><h2>A rescue planned in Darl</h2><p>He briefs them between buildings: wait for Glornir, move quickly together, end fights fast and only release the beast to avoid death, leaving no witness who sees their nature. A fallback rendezvous is known but not located for the reader. He checks beard and moustaches, binds his hair with leather and leads onward. The final disturbance makes them run.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>He sends the group over the stockade rather than into the crowded gate and boosts Jökul. During the fight he leaps behind a druzhina rider and cuts the rider’s throat, then rides the captured slim, tall horse with its braided mane to the tower entrance.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>He kneels by Jökul’s corpse, agrees to pursue the killer, and joins Glornir’s move into the fortress. With Æsa he searches an empty room; later he identifies Hakon, and at the hall restrains Varg from rushing Jökul’s killer before Glornir’s move.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>He and Sulich guard Glornir’s flanks on the dais. A wolf-thrall pushes him back while the company is being overwhelmed; the fight stops with Hakon in Røkia’s grip.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>He leads the supposed provisioning party through Darl’s slave market to Brimil. He names the Bruised Men, describes their tongues and changing skin colour, and distinguishes southern Iskidan from Jaromir’s northern origin. His scale comparisons with Vigrið, Snakavik and Gravka are humorous judgments rather than measurements.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>He has Varg wear his old collar and Røkia act as guard, then pretends to sell a runaway. He interrupts Varg’s beating to secure answers and holds Brimil in the chair after Einar restrains the later loss of control. He then kills Brimil with his seax, explaining that the slaver saw Varg’s eyes change.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>He drives the ox-wagon back, helps carry its barrels aboard. After departure he urges Varg to row for the hoped-for interception at Liga.</p></details><details><summary>The Hunger of the Gods · 32</summary><h2>Children hidden in the barrels</h2><p>He helps Sulich open food barrels for the children, then agrees to Einar’s request for a story. Seated on a barrel with mead, he looks towards Hakon and Frek and introduces the tale of the boy, widow, wolf and troll.</p></details><details><summary>The Hunger of the Gods · 32</summary><h2>Children hidden in the barrels</h2><p>He deliberately gives the fictional characters the names Helka, Einar, Frek and Hakon. The tale repeatedly invokes an unfair world before ending with a boy’s rescue of the wolf and rejection of that inevitability. The company responds with laughter, then smiles and nods; Sulich praises the telling, but Hakon says he does not understand.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>He oversees the Sea-Wolf’s restocking through Palrun, including linen-wrapped cheese rounds. He tells the official to give Logur the tally and says the Bloodsworn are good for it. Payment and the final amount are not shown.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>His smile fades at Orka’s name; he asks if she is well and what happened, then quietly welcomes Ingmar’s reassurance. This is concern and relief rather than a completed reconciliation. As the Sea-Wolf leaves to pursue Jaromir, he teases Varg about his first seafaring and calls sailing the whale road a joy.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>He laughs at Varg’s seasickness until he walks away, having offered breakfast in the hope it would help. Varg says he has otherwise been quiet since Grimholt; Røkia attributes this to Orka, without Svik explaining himself.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>Røkia rejects the monster-filled versions of his joining and says Orka found him under a bush, cold, weeping and lash-bloodied, a runaway thrall of ten winters who tried to bite her. She says Orka, then chief, took him into the company and trained him, restoring pride and dignity. This is her recollection, not a new witnessed childhood event or a full transformation description.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>She recounts his grief after Orka and Thorkel vanished in a sea battle and says he searched among the others without finding them. She describes his attachment to Orka as mother-like and guesses that her return has reopened the pain of her leaving despite the oath. The interpretation is Røkia’s; no new reunion, adoption or reconciliation occurs.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>The boarding battle at sea</h2><p>He rouses the distracted Varg, combs his red beard with a horn-carved comb and braids it with thin leather. His mail is unrolled from greasy sheepskin used against sea-rot. He agrees mail is dangerous if one falls overboard but says the approaching sharp weapons make it a choice of priorities, left to each warrior.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>The boarding battle at sea</h2><p>He stands beside Varg in the back-to-back formation, breaks an arrow in Varg’s shield with his sword and locks his own shield beside him. During the assault he laughs and stabs over its rim almost too fast for Varg to follow. Varg later hears him shout his name when pulled from the line; no final individual outcome or full animal change is shown.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>He calms Varg with brotherly address and tells him to control his wolf; the green flicker in his own eyes fades to blue. He later urges the rowing crew on. At the settlement Einar saves him from a man trying to chew through his iron helm.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>He arrives with Glornir at the giant fight and checks the fallen Einar’s neck and bleeding head wound. He says the skull is cracked and arm broken, with other fractures possible. His distress and assessment do not establish Einar’s death or recovery.</p></details><details><summary>The Hunger of the Gods · 59</summary><h2>New looks on the journey through Ulaz</h2><p>He grooms Varg with a small knife and bone comb, adds a silver beard ring and follows Varg&#x27;s requested haircut. He tells a shortened, explicitly uncertain saga of Mag, Oleg, Aslog and the Shadow-Walker; its identity remains unknown.</p></details><details><summary>The Hunger of the Gods · 68</summary><h2>The cavalry charge and the shield wall</h2><p>He stabs at the huge thrall after Varg and Røkia intervene, but is backhanded away. No full injury outcome is stated here.</p></details><details><summary>The Fury of the Gods · 10</summary><h2>He slows Varg, ensures he eats and questions Sulich about the freed riders&#x27; choice and loyalty</h2><p>He slows Varg, ensures he eats and questions Sulich about the freed riders&#x27; choice and loyalty. At Ulaz he notices the new bridge guards and eastern fleet, sends Sulich away from Rurik and stays to watch. He judges the invasion nearly ready and intends to alert Glornir, then reaches for his weapons when Varg is ambushed.</p></details><details><summary>The Fury of the Gods · 12</summary><h2>The captors reveal their purpose</h2><p>Dragged in unconscious and bound, he wakes in Sterkur and Leif&#x27;s custody to find his hair pulled loose. He mocks the captors and Leif, warning of Glornir&#x27;s retaliation without proving rescue is imminent. Selected for execution, he asks that his hair be lifted out of the axe path. When Norv complies he jerks backwards, putting Norv&#x27;s wrists beneath the blade, then kicks a holder down. The axe severs the hands and warriors rush him; his complete escape is not yet shown.</p></details><details><summary>The Fury of the Gods · 14</summary><h2>The warehouse rescue</h2><p>Freed from his holders during the rescue, he regains his sword and fights beside Edel, displaying small sharp teeth. He urges retreat to Sea-Wolf before druzhina arrive. Aboard ship he braids his hair again, promises to silence Sterkur after Røkia’s report, and identifies five hawk-marked ships as Rurik’s, guessing they are following.</p></details><details><summary>The Fury of the Gods · 21</summary><h2>Reunion in the island harbour</h2><p>He runs to embrace Einar, trades bawdy jokes with Æsa and hears that both injured companions are recovering. Later he jokes about his disrupted braids despite a continuing facial bruise, vowing revenge on Leif, Sterkur and their crew. He estimates ten days to Snakavik only with favourable wind and worries about the slower knarr; the pursuers’ reappearance makes him say they must fight.</p></details><details><summary>The Fury of the Gods · 25</summary><h2>Preparing to meet the pursuing ships</h2><p>Mail-clad with a silver-wired rope-braided red beard, he jokes during preparation and explains the ship-lashing and steering-oar plan to Varg. He attributes the serpent to Vol/Iva and says each enemy ship will carry a rune-wielder, a fleet-wide assessment beyond the single caster observed.</p></details><details><summary>The Fury of the Gods · 27</summary><h2>The ships collide</h2><p>He helps cut boarding ropes and joins the counterattack aboard the enemy drakkar, then returns with the others to Sea-Wolf. He heads towards Einar when the champion wounds him but slows when Refna and the other children intervene.</p></details><details><summary>The Fury of the Gods · 29</summary><h2>He protects Einar’s back, but a blade enters his hip and he stumbles beneath a raised sabre</h2><p>He protects Einar’s back, but a blade enters his hip and he stumbles beneath a raised sabre. Orka crashes into the attacker before the more distant companions can reach him and cuts the guards down. No treatment, recovery or final condition for his hip wound is shown before the casters’ explosion.</p></details><details><summary>The Fury of the Gods · 37</summary><h2>Life aboard Sea-Wolf</h2><p>He watches Einar and the children, approves Breca’s guard and later solemnly brings Varg from the moonlit shore into the oath circle. He steps forward after Røkia to vouch for Varg. Standing and moving do not establish full healing of his earlier hip wound.</p></details><details><summary>The Fury of the Gods · 39</summary><h2>Old oaths and news of the dragon</h2><p>After rowing he asks Orka about Varg’s oath of the previous night, then confronts her over vanishing and letting him grieve her as dead. He says he loved her “like a son”, without establishing a new biological relationship or explicitly naming the boy in her nearby memory. Hearing that she left for Breca, he asks if she is back as kin. She offers return and Glornir welcomes her. Nothing establishes that Svik’s earlier hip wound is fully healed.</p></details><details><summary>The Fury of the Gods · 48</summary><h2>Return from the sortie</h2><p>He leads Varg’s running rhythm through the return tunnel, then supports finding Brák and calls the company more than friends. He warns Varg to be careful discussing their slaver allies and cites stolen children and Thorkel’s death against the dragon. His half-smiling reversal proposal is rejected by Varg in favour of freedom for all; no new policy is agreed.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>He flanks Varg, recognises Leif/Sterkur’s company and speaks of vengeance on Sterkur</h2><p>He flanks Varg, recognises Leif/Sterkur’s company and speaks of vengeance on Sterkur. He teases Røkia’s battle-eagerness, answers Drekr’s threats and praises Varg for toppling ladders during their defence. No promised personal revenge is completed here.</p></details><details><summary>The Fury of the Gods · 61</summary><h2>The shield line under pressure</h2><p>He holds Varg’s left, staggers under the collision and later tips a foe’s shield back with his sword so Einar can strike from behind. No individual new wound or final survival is supplied.</p></details><details><summary>The Fury of the Gods · 62</summary><h2>He holds Varg’s arm to reinforce Orka’s warning against suicidal revenge</h2><p>He holds Varg’s arm to reinforce Orka’s warning against suicidal revenge. Fleeing hyrndur/trolls, he dodges a spear but trips over a fallen warrior. Varg, Røkia and Orka bring down the troll over him; he gets up, thanks them and jokes he could have managed it, then runs with them toward the gates.</p></details><details><summary>The Fury of the Gods · 68</summary><h2>Elvar’s fall and the rebellion in the hall</h2><p>He jokes about missing cheese on waking, then recognises Estrid’s drengrs among the door rebels and calls them oath-breakers. The narration gives no new wound or separate Svik kill in this passage.</p></details><details><summary>The Fury of the Gods · 73</summary><h2>He calls the dragon routed rather than finally beaten and leads the rescue of a damaged stone wolf</h2><p>He calls the dragon routed rather than finally beaten and leads the rescue of a damaged stone wolf. Brák’s crew separates him from Einar; he hacks back out of the ring and screams at the throat strike. His subsequent rescue/vengeance is not completed here.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>Leif’s death and the tunnel escape</h2><p>He kneels crying beside Einar’s corpse with Røkia’s hand on his shoulder, then insists they must leave as the hall collapses. The group follows Ulfrir toward the tunnels; Einar’s removal is not narrated.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>The survivors’ camp and reunion</h2><p>He leads the surviving Bloodsworn with Røkia/Edel/Æsa, remains grief-stricken even over cheese and represents them with Sulich at council. He calls Vesli their eyes in the sky and cheers when she brings Glornir’s group.</p></details><details><summary>The Fury of the Gods · 79</summary><h2>A night of repairs and choices</h2><p>He recalls Einar’s pleasure in his fable, welcomes Frek as Frek the Free with ale and teases Varg’s failure to recognise Røkia’s interest. The story remains a parable, not new literal history.</p></details><details><summary>The Fury of the Gods · 81</summary><h2>The charge against the gods</h2><p>Svik and Æsa follow Varg/Røkia toward Yrsa, then sweep aside the remaining guards with Edel, enabling Varg’s confrontation. No separate final enemy roster or individual new wound is given.</p></details><details><summary>The Fury of the Gods · 84</summary><h2>Silrið’s defeat and vengeance for Frøya</h2><p>He helps clear the hunters and promises the ring will prevent Brák fleeing rather than stab him from behind. After Varg and the children’s reprisals he says well fought and remains beside Varg as he weeps.</p></details><details><summary>The Fury of the Gods · 89</summary><h2>Heðin falls and the ravens seize Rotta</h2><p>He cries out at Æsa’s death, fights Heðin with the group/hound and joins the final attacks, then watches the ravens take/drop Rotta. No new individual wound or separate sole kill is given.</p></details><details><summary>The Fury of the Gods · 92</summary><h2>A home for the Bloodsworn</h2><p>He shares ale/cheese with Varg, leads the toast to Elvar and jokes that cheese-paid contracts would likely follow if he became chief. The suggestion does not amount to an appointment.</p></details><details><summary>Illustration · The Fury of the Gods · 12</summary><p><a href="assets/d0f188333e567f.jpg">Open noncanonical illustration</a></p><p>The companions’ defiance before the execution attempt.</p></details><details><summary>Illustration · The Shadow of the Gods · 35</summary><p><a href="assets/c9a6ca677ffb24.jpg">Open noncanonical illustration</a></p><p>An imagined scene from Svik&#x27;s tale of outwitting a troll with cheese.</p></details><details><summary>Illustration · The Shadow of the Gods · 43</summary><p><a href="assets/dbbf116b5d66f3.jpg">Open noncanonical illustration</a></p><p>Svik leaning against the trial gatepost at his first appearance.</p></details><details><summary>Illustration · The Shadow of the Gods · 47</summary><p><a href="assets/61b10687138050.jpg">Open noncanonical illustration</a></p><p>Svik reveals his fox-like features before changing back.</p></details></noscript>
