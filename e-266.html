      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 35</summary><h2>Introduction</h2><p>A fair-haired boy, squat and broad enough for Biórr to compare him to a boulder, sits beside Breca and Bjarn. The broad lad is called Harek when he asks Lik-Rifa how to discover his bloodline.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Earlier encounters</h2><p>He cries during the instruction to remember his abduction, then says yes when Lik-Rifa asks if he feels the beast. Asked which animal, he answers boar. No full transformation or particular inherited ability is demonstrated.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Earlier encounters</h2><p>Identity review: he shares a name with Asgrim and Idrun’s missing son, but the chapter gives no human parentage, home or explicit recognition connecting them. E-266 remains separate from E-006 pending stronger evidence. The page title distinguishes the encounter and is not another spoken name.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>Breca’s friend beside the wagons</h2><p>He walks alongside Breca by the carts and is explicitly called his squat friend. He laughs at Storolf’s boar imitation; Storolf says he has Svin’s blood and teaches a group of children assigned that ancestry. No transformation, new human parentage or recognition as Asgrim and Idrun’s missing son is supplied. E-266 remains separate from E-006.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>The children at Nastrandir’s feast</h2><p>At Nastrandir’s feast he is among the children cheering Lik-Rifa’s declared cause, while Breca glowers beside him. The response supplies no parents or home and does not merge this boy E-266 with E-006. Cheering alone is not proof of voluntary allegiance or general safety.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Fain’s lessons for the children</h2><p>He watches Biórr and Storolf’s demonstration and answers literally that the seax killed Storolf in the acted display. Breca supplies the shield-opening answer and interprets Biórr’s sword acquisition. This camp child remains E-266, distinct from the other Harek.</p></details><details><summary>The Hunger of the Gods · 74</summary><h2>The identity becomes clear</h2><p>The earlier figure is identified as Harek.</p></details></noscript>
