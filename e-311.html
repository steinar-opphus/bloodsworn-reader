      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 3</summary><h2>The Fury of the Gods - chapter 3</h2><p>She is a mouse-haired, broad, squat petty jarl in fine mail, carrying two bearded axes at her belt. At Snakavik, she speaks for Störr&#x27;s petty jarls in offering oaths to Elvar, who postpones the ceremony until the campaign is explained.</p></details><details><summary>The Fury of the Gods · 33</summary><h2>The tide and the search for Grend</h2><p>She arrives broad and squat with mouse-coloured hair, mail, back shield and two bearded belt axes, followed by crossed-axe-shielded drengrs. She gives Elvar the collared woman she calls Ákveðin, praising her tracking as unfailing; Elvar promises to remember the gift. This is the described transfer and Runa’s claim of skill, not proof the woman freely chose it or has tracked Grend.</p></details><details><summary>The Fury of the Gods · 51</summary><h2>Elvar glimpses her in the upper chamber with Silrið, Hjalmar and Estrid</h2><p>Elvar glimpses her in the upper chamber with Silrið, Hjalmar and Estrid. The presumed Grend discussion is Elvar’s inference, not overheard words or proof of conspiracy.</p></details><details><summary>The Fury of the Gods · 52</summary><h2>The choice to hide the beast</h2><p>She and a handful of her drengrs attack Elvar’s guards: Runa collides with Gytha and they fall from the walkway, while her men stab/chop to block aid. Gytha later pins her wrist on the bridge with a sword at her throat; Elvar orders her alive. Runa is captured/subdued alive while the participating drengrs on the walkway are slain, not every follower or thrall proved dead.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>Salvage and a choice about freedom</h2><p>Bound and injured after capture/interrogation, she condemns Elvar for sparing Grend and waiting in the den. When asked about allies she names her slain drengrs and the absent Broðir/Silrið; Elvar doubts the completeness. Elvar orders hanging for oath-breaking and Sighvat executes her. Her death occurs here; earlier live capture remains historical, and her denial does not exonerate or convict every suspected attendee.</p></details><details><summary>Illustration · The Fury of the Gods · 3</summary><p><a href="assets/b8b429a292dce5.jpg">Open noncanonical illustration</a></p><p>Runa Red-Axe.</p></details></noscript>
