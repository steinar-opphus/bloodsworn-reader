      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 2</summary><h2>A fugitive at the trial gate</h2><p>The Bloodsworn are mercenary warriors who hire themselves to the highest bidder. They are famed throughout Vigrið. Skálds sing tales of them around hearth fires.</p></details><details><summary>The Shadow of the Gods · 2</summary><h2>A fugitive at the trial gate</h2><p>They hunt vaesen-monsters. They seek god-relics for wealthy jarls. They fight in border disputes. They guard wealthy and powerful people.</p></details><details><summary>The Shadow of the Gods · 2</summary><h2>A fugitive at the trial gate</h2><p>The stew trader says they docked in Liga the previous day. He says they are guests of Jarl Logur at the longhouse. He says they have a Seiðr-witch thrall.</p></details><details><summary>The Shadow of the Gods · 2</summary><h2>A fugitive at the trial gate</h2><p>A woman in the queue says one of their warriors has been slain. She says a weapons trial is being held to fill the vacancy. Svik names the trial fighter Einar Half-Troll.</p></details><details><summary>The Shadow of the Gods · 2</summary><h2>A fugitive at the trial gate</h2><p>Svik says Vol uses her talents only for the Bloodsworn. He refuses to hire her out.</p></details><details><summary>The Shadow of the Gods · 4</summary><h2>The trial and the pursuing riders</h2><p>At the trial, the blonde woman announces Varg’s challenge as being for a place on their oar-bench and shield wall.</p></details><details><summary>The Shadow of the Gods · 4</summary><h2>The trial and the pursuing riders</h2><p>Einar and Svik intervene against Varg’s pursuers. At the chapter’s close, the grey-bearded rescuer declares Varg one of the Bloodsworn.</p></details><details><summary>The Shadow of the Gods · 11</summary><h2>Recovery among the Bloodsworn</h2><p>Røkia names their chief Glornir Shield-Breaker. Their shields are black with red splatters.</p></details><details><summary>The Shadow of the Gods · 11</summary><h2>Recovery among the Bloodsworn</h2><p>Svik says the trial concerned how contestants lost, since all lost to Einar.</p></details><details><summary>The Shadow of the Gods · 13</summary><h2>A feast interrupted</h2><p>Torvik reports courage or loyalty must be proven before the oath.</p></details><details><summary>The Shadow of the Gods · 13</summary><h2>A feast interrupted</h2><p>Glornir says Sulich has sworn to stand, fight, live and die with the crew. The Bloodsworn rise when Glornir is threatened.</p></details><details><summary>The Shadow of the Gods · 16</summary><h2>Apprenticeship</h2><p>Glornir clarifies in B01-C016 that Varg is an apprentice, despite his earlier declaration to Leif that Varg was Bloodsworn. He says membership requires battle skill, courage, strength, loyalty and devotion unto death. The crew will teach, feed and protect Varg; in exchange he must learn, obey and fight.</p></details><details><summary>The Shadow of the Gods · 16</summary><h2>Apprenticeship</h2><p>Glornir announces a departure with the tide that day; Logur promises provisions.</p></details><details><summary>The Shadow of the Gods · 18</summary><h2>Ships, former leadership and Liga</h2><p>Their ship is the Sea-Wolf. Torvik says Skullsplitter was their old chief and gave Logur the rafter relic; Svik says Skullsplitter is dead. Svik says they protect Liga from pirates and raiders.</p></details><details><summary>The Shadow of the Gods · 18</summary><h2>Ships, former leadership and Liga</h2><p>At the docks they shield Glornir against Jaromir’s arrows and form a wall against the cavalry; their rear row reforms when more mounted warriors attack from behind. The confrontation is interrupted by the arrival of three eagle-bannered drakkar and Helka.</p></details><details><summary>The Shadow of the Gods · 20</summary><h2>Spoils at the docks and Helka&#x27;s commission</h2><p>After the dockside battle, Bloodsworn strip fallen druzhina of gear and allow a druzhina to take the fallen Bloodsworn’s gear. Sulich calls such gear battle spoils that preserve the victor’s tale; Svik says taking another warrior’s kill is dishonourable.</p></details><details><summary>The Shadow of the Gods · 20</summary><h2>Spoils at the docks and Helka&#x27;s commission</h2><p>Glornir announces work against something eating Helka’s people in the north. Skalk and two of her warriors travel with them and are ordered to row. They leave Liga in the Sea-Wolf, initially steering south and west.</p></details><details><summary>The Shadow of the Gods · 26</summary><h2>After the storm on the Sea-Wolf</h2><p>The Sea-Wolf has survived a summer storm and enters a steep-sided fjord. Two days have passed since the Bloodsworn left Liga. Skalk says the mission goes to the River Slågen&#x27;s source at the Bonebacks, on Helka&#x27;s northwestern border. Glornir demands equal respect for Vol and every crew member who risks their life on his ship.</p></details><details><summary>The Shadow of the Gods · 30</summary><h2>Leaving the ship to march inland</h2><p>The Bloodsworn have rowed upstream for five days before continuing on foot. Fifty Bloodsworn leave the ship and ten remain to guard it. The ship guards were selected by drawing lots. Edel leads Torvik and the other scouts north through the fields, with the rest following.</p></details><details><summary>The Shadow of the Gods · 34</summary><h2>Quiet travel through the foothills</h2><p>Bloodsworn and the royal guards laugh together at Svik&#x27;s story. Eight days have passed since the Bloodsworn left the ship and deserted farm. The company now loads its kit on three ponies said to have come from the farm, whereas Chapter 30 described two; the added pony is unexplained.</p></details><details><summary>The Shadow of the Gods · 41</summary><h2>The approach to the guarded excavation</h2><p>Three days after the hanging corpses are found, Glornir splits the company into captain-led groups accompanied by scouts to approach a guarded excavation. Svik&#x27;s group prepares to fight, then advances as Glornir steps into the glade.</p></details><details><summary>The Shadow of the Gods · 47</summary><h2>The company reveals its god-touched ancestry</h2><p>Chapter 47 reveals the company’s concealed god-touched nature. Svik says all the Bloodsworn are Tainted, while Edel explains their secrecy as protection against being hunted. Svik distinguishes membership from ancestry: other Tainted warbands exist and trustworthiness must be proven.</p></details><details><summary>The Shadow of the Gods · 47</summary><h2>The company reveals its god-touched ancestry</h2><p>Glornir invites Varg to join and Varg accepts, receiving a silver bear-headed arm ring. The spoken oath is postponed while the company goes to recover Vol, whom Glornir names as his wife.</p></details><details><summary>The Shadow of the Gods · 53</summary><h2>The Bloodsworn reach Grimholt</h2><p>After two days pursuing Skalk they reach the devastated Grimholt, where Glornir recognises Orka Skullsplitter among the surviving children and vaesen. The scene does not show Vol’s recovery or Varg speaking the postponed oath.</p></details><details><summary>The Hunger of the Gods · 1</summary><h2>Rest and restraint in the burned hall</h2><p>At Grimholt Orka recounts how she and Thorkel left during a sea battle and were believed dead. Svik challenges the abandonment of her oath, while Glornir seeks Vol and receives Orka&#x27;s report that Skalk escaped by boat.</p></details><details><summary>The Hunger of the Gods · 3</summary><h2>Mord&#x27;s burial and a blood feud</h2><p>They help bury Mord. Glornir puts Vol&#x27;s recovery first and decides to head for Darl after the reports about Skalk&#x27;s escape.</p></details><details><summary>The Hunger of the Gods · 7</summary><h2>An offer to return to the Bloodsworn</h2><p>Glornir says Orka would be welcomed back, although not as chief, despite anger among some companions. She declines the return, putting Breca and vengeance first. Glornir’s statement that the company has killed to keep its secret remains his testimony.</p></details><details><summary>The Hunger of the Gods · 7</summary><h2>An offer to return to the Bloodsworn</h2><p>Orka sees forty or fifty warriors preparing to leave Grimholt, mounted and on foot. Røkia, Varg and the other scouts lead the departure, and Einar drives the rescued children in a wagon. Glornir has agreed to take the children as far as Darl; Edel’s separate party heads back towards the ship by way of the mine.</p></details><details><summary>The Hunger of the Gods · 10</summary><h2>The night-hag in the woodland camp</h2><p>Edel’s escort is attacked by night-hags while Lif has fallen asleep on watch. After Orka frees him, Edel and the others form a protective ring and Ingmar takes the next watch.</p></details><details><summary>The Hunger of the Gods · 10</summary><h2>The night-hag in the woodland camp</h2><p>Edel fears Lif can deduce the company’s secret despite Orka not disclosing it. Edel’s remark that the hag might better have killed him meets Orka’s protection vow; the difference is not resolved into an actual attack or a new secrecy rule.</p></details><details><summary>The Hunger of the Gods · 11</summary><h2>Learning to control the wolf</h2><p>The company camps among pines below a steep slope, three days south of Grimholt in the high Bonebacks. Einar sleeps beside the wagon carrying the sleeping Tainted children. Glornir prohibits fires until they catch Skalk and the fugitives; Røkia now serves as chief scout and receives the order to lead out.</p></details><details><summary>The Hunger of the Gods · 19</summary><h2>Scouting beyond the repaired bridge</h2><p>The company and the children’s cart reach the outskirts of Darl and camp under cover. Glornir intends to recover Vol before heading south along the river to meet the Sea-Wolf. He refuses to keep the children with the company, despite Einar’s warning that they risk enslavement; their departure and eventual fate remain unresolved.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>Wounds tended and seaxes compared</h2><p>None of the company falls in the mine battle, though all except Edel are described as wounded. Edel authorises Halja, Gunnar and Revna to accompany Orka; their motives are vengeance, avoiding the oar-bench and a hoped-for saga-song respectively. Orka accepts after warning of the danger. No new oath or formal rejoining by Orka occurs.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>Their tower assault follows an already ongoing fight between Jaromir’s druzhina and the guards. Jökul is killed, and the search fails to recover Vol. Glornir abandons stealth, directing the company through the tunnel into Helka’s fortress on a guess about Skalk’s location.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>They seize Hakon, attack the queen’s dais and are pushed back by superior numbers while concealing their Tainted blood. Varg loses an ear. Røkia makes Hakon a seax-point hostage and Helka halts the battle; rescue and escape remain unresolved.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>In the hall they wear mail and wool and carry weapons but no helms or allegiance shields. Glornir learns from Guðvarr that Jaromir took Vol and the chest; Skalk, Yrsa and Sturla return alive.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>Their confrontation becomes a commission from Helka to pursue Jaromir for silver. Hakon stays as surety until they are clear of Darl, with an Úlfhéðnar guardian to accompany him; Glornir requires half-pay now, half at delivery of Jaromir or his head, plus a drakkar. No completed provisioning, departure or hostage release is shown.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>Varg threatens Guðvarr but obeys Glornir’s order to release him after Helka forbids bloodshed. This pauses the feud rather than resolving the claims over Jökul or Lif’s brother.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>After the bargain they receive food and a chest of silver, lodge in dockside barracks and carry four dead companions, including Jökul. Varg’s party goes to question Brimil under the pretence of provisioning; Hakon remains guarded.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>Svik, Røkia and Einar help Varg obtain the reported Brák lead, then kill Brimil and his two guards after Varg’s loss of control. Their stated need to conceal Tainted blood does not make Røkia’s moral justification an independently established verdict. Rog’s death is not confirmed.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>They provision Helka’s smaller twenty-oared drakkar and board with their dead, Hakon and Frek. They actually cast off into the Drammur, with Einar beating rowing time. The second silver payment, Hakon’s release, Jaromir’s interception and Vol’s rescue remain pending. Sulich reports ships at Liga as the basis for the planned interception.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>At Orka’s separate camp, Halja, Gunnar and Revna call her chief informally despite her repeated denials; no formal return to chiefship or new oath to the company is shown. They agree to exchange the killer’s name for Myrk’s answers, and Halja eventually names Varg.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>Myrk’s naming of Uspa shocks the Bloodsworn present. Her claims about Uspa, Kráka, the rite and the rendezvous are heard by this subgroup, not thereby communicated to the company sailing with Glornir.</p></details><details><summary>The Hunger of the Gods · 32</summary><h2>Children hidden in the barrels</h2><p>The company anchors at dusk and prepares to sleep aboard under an awning. Einar’s wagon barrels prove to contain the rescued children, who are brought out and fed with Glornir’s permission. Their immediate whereabouts are now known; their longer-term safety is not settled.</p></details><details><summary>The Hunger of the Gods · 32</summary><h2>Children hidden in the barrels</h2><p>Glornir promises to release Hakon at Liga, claiming land and river pursuers without a direct sighting here. Most of the company gathers for Svik’s fable, except those on first watch. Laughter gives way to smiles and agreement at its ending; Hakon remains confused and Frek’s clenched fists are unexplained.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>Orka&#x27;s search in Starl</h2><p>Orka’s separate party reaches Starl with Myrk alive, upright but bound and gagged. Halja reports Raven-Feeder tracks into town. Spert and Vesli are sent outside to watch the lake, while the humans enter under shields that the narration suggests helped avoid guard questions. This does not move Glornir’s sailing party into the scene.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>Orka&#x27;s search in Starl</h2><p>At the inn Orka orders Myrk watched and takes Halja to buy provisions and seek passage. She later acquires Sæunn and provides clothes. Halja identifies the approaching ship’s shields as Battle-Grim, but no reunion or exchange of news occurs before the chapter ends.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>The returning party reunites with Edel, Ingmar and the Sea-Wolf at Liga. Logur helps provision the ship after Glornir’s confrontation with Palrun and takes responsibility for Hakon’s later return. Sulich accepts Varg’s captured kit as repayment for his rescue in Darl.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>Edel’s reports bring news of Orka’s surviving companions, Ilska and Myrk’s father, and Myrk’s Lik-Rifa claim. They do not reveal Orka’s current Starl events. The children help carry stores, Glornir conditionally tolerates them, and Refna takes a rowing place. The company leaves in the Sea-Wolf to pursue Jaromir towards Iskidan.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The laden ship reaches Starl</h2><p>Halja identifies herself as Bloodsworn to Elvar at Starl. Orka and Halja, accompanied by an unnamed collared woman, demand Uspa from the Wave-Jarl. Uspa recognises Halja and names Orka; Elvar refuses the demand and Ulfrir interrupts the threatened confrontation. This concerns Orka’s separate party and does not bring Glornir’s Sea-Wolf pursuit to Starl or establish Orka’s formal rejoining.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>Halja and Orka board the Wave-Jarl at Starl with Sæunn under a truce and recount the excavation, Vol’s abduction and Myrk’s capture. Halja’s belief that Glornir may already have caught Skalk is a guess, not a new rescue report. Orka refuses Ulfrir’s invitation to stay beside him; she and Elvar agree only to an unspecified reciprocal favour arrangement. This does not establish Orka’s formal rejoining, an oath merger or the arrival of Glornir’s separate pursuit party.</p></details><details><summary>The Hunger of the Gods · 43</summary><h2>The feast and the shield-dance</h2><p>With Hakon back, Helka declares she wishes harm on the company and authorises Leif to hunt Varg. Leif reports hiring Sterkur and his mercenaries. Helka reports the company leaving Liga after Jaromir and suspects it is now in Iskidan; no arrival or interception is directly shown. The scene does not settle the remaining Jaromir delivery or payment terms.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>The detachment with Orka at Starl takes part in the staged stable clash with Battle-Grim friends so Myrk can escape. Lif is unbriefed and only learns the plan afterward. Sæunn is then given blood samples to follow the fugitive, but no pursuit begins within the chapter.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>Elvar wants to hire Glornir’s company at double its asking price and gives Orka the task of conveying the offer, a silver bear-head ring and a Snakavik rendezvous request. Gunnar does not know the main company’s location, suggesting Darl only tentatively. This is not a delivered contract or proof the main company has returned there.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>The Sea-Wolf’s crew has been at sea two days, tacking under Glornir’s orders while Varg is sick. Refna’s first rowing shift out of Liga is now confirmed to have kept pace with the company; no oath or adoption for her is narrated.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>Røkia recounts Orka taking in and training the young runaway Svik while chief, and the company’s search after the former chief and Thorkel vanished during a sea battle. She describes shared mother-like affection and guesses at Svik’s renewed oath-related hurt. This is her retrospective perspective rather than a new current reinstatement or universal reconciliation.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>Refna reports the killing of her family, Kel’s repeated escapes and his execution by Brák, naming Drekr chief of the captors. Røkia predicts another crossing of paths with Orka. The later sighting of unidentified sails prompts Glornir’s weapons order, not a completed interception, battle or landfall.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>Orka’s local group are mounted at first light after talking through the night with Elvar’s crew. Halja and Sighvat trade jokes. Sæunn sniffs two bloodstained rags and leads at a run; Orka’s riders follow with shields on their backs and loaded packhorses through Starl. This follows this branch of the company, without relocating Glornir’s main crew.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>Orka promises Elvar that the company will hear her offer but says acceptance is their own business. Sighvat would welcome them in a shield wall; this is his preference, not recruitment. Elvar and Ulfrir later recognise Orka’s riders along the lakeshore; Ulfrir predicts seeing her again without arranging a meeting.</p></details><details><summary>The Hunger of the Gods · 50</summary><h2>The wolf&#x27;s call across the lake</h2><p>Orka’s local companions gather behind her during the lakeshore halt, with Lif present and some horses grazing. Sæunn returns from ahead. Orka whistles Spert and Vesli back from their lookout, and Lif explains the changed tracking plan. This follows Orka’s branch without relocating Glornir’s main company.</p></details><details><summary>The Hunger of the Gods · 50</summary><h2>The wolf&#x27;s call across the lake</h2><p>The pair report Lik-Rifa’s night call but explain remaining through their commitments to Orka and Breca. Revna welcomes their presence and worries that all vaesen are being summoned; Orka concludes war. Their discussion supplies concern and attributed reports, without a new oath ceremony, muster or battle.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>The boarding battle at sea</h2><p>The company furl sail and arm against two smaller longships. Røkia explains the wind disadvantage for escape. Svik frames armour as an individual priority choice, and Varg sees the company armoured, including Sulich in his gifted lamellar. Glornir intends to lure the attackers aboard and release the beasts, leaving no survivors.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>The boarding battle at sea</h2><p>Two back-to-back shield lines face both flanks, with Einar keeping the children between them. Røkia replaces Sulich beside Varg; shields catch arrows and grapples bring boarders over the higher hull. Ingmar guards behind Varg, whom Røkia tells to trust the line. The attackers are silent and endure severe wounds without an identified cause.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>The boarding battle at sea</h2><p>Varg is dragged out of the wall and deliberately releases his wolf, gaining sharpened senses, strength and claws before attacking with teeth and seax. His final mound of corpses is a local result; the whole company’s casualties, the children’s outcome, enemy survivors and the other flank are unaccounted for.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>The immediate deck fight ends with one attacker ship escaping while Ingmar and Edel finish opponents. Svik helps Varg regain control and Glornir’s bear aspect recedes. Sulich names and explains the tungumatur; Glornir destroys the extracted specimen and orders pursuit. Bodies and blood are cleared before the long rowing chase.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>The company catches the fugitive at an island settlement, leaves the children aboard by Einar’s order and pursues the infected ashore and into beechwood. Glornir kills a giant parasite at the pool. Æsa suffers a thigh wound and Einar is unconscious with severe head and arm injuries. Medical care and a search begin, without final casualty accounting or an all-clear.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>A bound druzhina says a horse-knarr separated from Jaromir in mist and was captured. Pressed for intelligence, he says the prince is taking Vol to Valdai. This supplies a reported destination, not a rescue or confirmed arrival.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>Orka’s travelling branch follows Sæunn north beside Horndal and east along the northern Bonebacks over two days. Vesli is considered for carrying Elvar’s ring and message to Glornir, but Orka defers it and retrieves the ring; the main company receives nothing here.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>The branch finds eastward vaesen tracks and frost-spider traces. Halja uses eagle-touched sight to check the canopy, Orka orders vigilance and the party later sees a distant smoking farm with horn calls and screams. They agree to look, without a new battle or rescue.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>Orka’s travelling group discovers skraeling attacking the farm. Lif’s appeal initially meets refusal and an angry confrontation, but the companions state their reasons and choose intervention. Sæunn guards the horses; Gunnar and Revna enter by the stream, Orka, Halja and Lif by the gate, with Spert and Vesli volunteering. The courtyard and longhouse attacks relieve the defenders, and two ravens intervene outside.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>Lif survives with facial wounds under Vesli’s care; Halja gives favourable acknowledgment when Revna prompts her. The horses return and Gudleif thanks Orka, who credits Lif. The ravens identify themselves as Kló and Grok and describe service to Snaka and repayment for Orka’s help. Orka’s next requested favour remains unspecified; no message is sent or Bloodsworn hiring offer received here.</p></details><details><summary>The Hunger of the Gods · 70</summary><h2>The pursuit into Valdai</h2><p>The Bloodsworn pursue Jaromir across the sun-bleached plain towards Valdai, under high hot sun and through the riders&#x27; dust. The company numbers fifty men and women. Vol rides her own horse behind Jaromir, while the mounted Røkia and Sulich pass in among the retreating druzhina before the gates close.</p></details><details><summary>The Fury of the Gods · 1</summary><h2>After the battle at Valdai</h2><p>At Valdai, the company mourns fifteen killed the previous day, including Ingmar, while tending wounds and maintaining equipment and watch. Vol frees Iva and Taras, asking them never to fight the company again. Vesli arrives on a giant raven with Orka&#x27;s message offering employment by Elvar to slay a dragon; no contract is yet accepted.</p></details><details><summary>The Fury of the Gods · 6</summary><h2>Warnings and the search for Frøya</h2><p>After Glornir consults everyone present, the company is committed to fighting the dragon, with departure for the Sea-Wolf at dawn. He promises to retrieve Einar and Æsa; their recovery and reunion are not yet shown. His personal reasons include his brother&#x27;s death and nephew&#x27;s abduction, while Vesli supplies the omitted report about Uspa and Bjarn.</p></details><details><summary>The Fury of the Gods · 27</summary><h2>The four remaining pursuers attack the lashed Sea-Wolf and knarr from all sides</h2><p>The four remaining pursuers attack the lashed Sea-Wolf and knarr from all sides. Røkia’s leap prompts a counterboarding action that clears one enemy deck, though its caster and escort have reached Sea-Wolf. The company returns to defend its ships: Einar and Glornir are wounded, the children help Einar, and Glornir fights with claws and teeth. With the knarr heavily pressed, another unidentified drakkar appears; the battle is unfinished.</p></details><details><summary>The Fury of the Gods · 28</summary><h2>Orlyg joins the sea battle</h2><p>Orlyg intervenes intending to put the company in his debt, and Gunnar argues that helping Sulich’s knarr serves the Bloodsworn. Gunnar and Halja’s passing spear casts rally Sea-Wolf’s defenders. Orka tells Breca she and Thorkel broke their oaths to raise him, but the company remains their family. Her group and Orlyg clear one boarding crew from the knarr; the other still fights, so the battle is not yet won.</p></details><details><summary>The Fury of the Gods · 29</summary><h2>The fight aboard the stern drakkar</h2><p>Glornir exploits Gunnar and Halja’s intervention to counterboard the stern attacker, then returns at Vol’s scream. Orka’s group saves the wounded Svik and breaks through the guards around him and Einar; Glornir briefly embraces Orka. Two male casters remain active, combine white-hot spells against Vol and engulf the company in sparks and boiling steam, knocking them down. The battle remains unfinished.</p></details><details><summary>The Fury of the Gods · 30</summary><h2>Vol survives the blast</h2><p>Vol survives the blast. Orka and Vol break the casters’ protection; Grok and Kló kill one, while Iva binds the other before Vol gives him to a mother serpent and its young. One juvenile remains with Vol. A last enemy drakkar withdraws south and silence replaces the fighting. Vesli reunites with Breca and learns their loss of Spert through his response; Orlyg remarks on the company’s unusual companions. No final casualty or debt settlement is recorded.</p></details><details><summary>The Fury of the Gods · 32</summary><h2>Debts, kinship and the voyage onward</h2><p>Glornir pledges the company’s rescue debt to Orlyg with his word and a wrist-grip, while refusing to sell either witch. Glornir’s kinship to Thorkel and Breca is explicitly confirmed in the reunion. Eight company dead and ten of Sulich’s kin receive named sea funerals, though the text does not list their names. The newcomers must choose collar-as-cover or hidden gifts before landing; Glornir frames this as collective survival. The ravens offer scouting, and ships prepare for Snakavik.</p></details><details><summary>The Fury of the Gods · 36</summary><h2>Leif openly joins Lik-Rifa’s side because he wants the Bloodsworn dead</h2><p>Leif openly joins Lik-Rifa’s side because he wants the Bloodsworn dead. Drekr welcomes that aim and Ilska admits Sterkur’s band to the host. This enemy recruitment is not known to be reported back to the company, and no confrontation occurs here.</p></details><details><summary>The Fury of the Gods · 37</summary><h2>Life aboard Sea-Wolf</h2><p>At a south-western cove most of the two crews form a fire-circle for Varg’s oath, a few guarding ships. All present vouch for him, Røkia first and Glornir last. Vol joins blood through her chant, and Varg speaks the kin/pack vow to fight, die if needed and avenge them until the world’s ending. He seals it by burning blood marks into the black shield, receives it and is welcomed amid cheers. This completes full spoken membership; it does not adjudicate external legal claims.</p></details><details><summary>The Fury of the Gods · 39</summary><h2>Orka remembers her old vow under Boðvar-Claw and answers Svik’s grief over her disappearance</h2><p>Orka remembers her old vow under Boðvar-Claw and answers Svik’s grief over her disappearance. She offers return for Glornir’s forgiveness; he says she never left his heart, reaccepting her without another blood rite. Grok reports the dragon’s westward march and Kló reports Elvar’s fleet in Jarnvidr. On the ravens’ den identification Glornir asks to redirect towards the Iron Wood and relay news to Orlyg, without a completed delivery or rendezvous.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>The company reaches Wolfdales with Sulich’s mounted crew and Orlyg’s following</h2><p>The company reaches Wolfdales with Sulich’s mounted crew and Orlyg’s following. Iva/Taras alone choose collar cover and have pairs/keys supplied; Vol disguises her serpent as a whip. River defences and busy mercenary quarters surround them as they enter past the stone guardians. Uspa/Vol reunite, then Glornir formally accepts Elvar’s dragon-fighting offer face to face. No payment or battle is shown.</p></details><details><summary>The Fury of the Gods · 43</summary><h2>Orka affirms her allegiance and Glornir reports the enemy march, with Grok as source</h2><p>Orka affirms her allegiance and Glornir reports the enemy march, with Grok as source. Elvar accepts Orlyg’s offered force and welcomes all arrivals with rooms/food/ale promised, adding the ravens as friends and scouts despite Ulfrir’s suspicion. No payment, new oath ceremony or actual battle occurs.</p></details><details><summary>The Fury of the Gods · 44</summary><h2>Some train alongside Orlyg’s men before Glornir’s confrontation with the new arrivals</h2><p>Some train alongside Orlyg’s men before Glornir’s confrontation with the new arrivals. He and Vol press the old grievance against Skalk, but Ulfrir stops it and Elvar forbids internal fighting at least until the dragon is slain, across origins/species. Glornir withdraws without forgiving; no new company death, oath or proven compliance beyond the moment is shown.</p></details><details><summary>The Fury of the Gods · 46</summary><h2>The hidden tunnel raid</h2><p>Following Ulfrir’s signal after a forced tunnel march, they emerge through Vol’s rune-revealed hatch with Sulich’s archers on the flanks. They attack the roadside camp at dawn, battling spiders and night-hags with taught Seiðr-words, then drengrs/skraeling amid spreading tent fires. One unnamed member is caught by a spider and aided; no complete company casualty count or enemy rout is provided.</p></details><details><summary>The Fury of the Gods · 47</summary><h2>Guðvarr sees the attackers withdraw at a horn after Lik-Rifa’s landing</h2><p>Guðvarr sees the attackers withdraw at a horn after Lik-Rifa’s landing. Warriors pass a rune-wrapped Seiðr-woman and disappear before his eyes; the woman is unnamed in his viewpoint. Pursuers find abruptly ending tracks and their tennúr fail to locate the raiders. Rotta infers tunnels, but a full safe return and exact escape mechanism are not yet observed.</p></details><details><summary>The Fury of the Gods · 48</summary><h2>Return from the sortie</h2><p>They return through tunnels to Wolfdales after the fast raid; Elvar says all Glornir’s crew are brought back with none left behind, and he agrees. Two wounded are carried while many allied casualties receive care. They eat and rest; Varg’s unfinished vengeance and challenge to slavery remain active, not a company-wide abolition decision.</p></details><details><summary>The Fury of the Gods · 52</summary><h2>The choice to hide the beast</h2><p>After a private meal conversation about kinship and collar cover, the company arms and follows Glornir at the dawn alarm. At the intact gate they see the destroyed fleet and witness the attack on Elvar. Orka and Vol help defeat it; no new company casualty total, new oath or adopted Orka collar is shown.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>The whole gathered company, including Iskidan-equipped warriors, approaches Elvar</h2><p>The whole gathered company, including Iskidan-equipped warriors, approaches Elvar. Vol/Iva/Taras remove their own collars, and Glornir says they were never his thralls. Partial eye/teeth/claw changes and his confirmation reveal the current company’s Tainted nature to Elvar. They pledge loyalty and celebrate open freedom; no precise new lineage for each member or all historical deceased members is supplied.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>Freedom and the approaching army</h2><p>The free company defends the wall while half, including Einar, waits below in reserve with other warbands. Their archers, casters and adjacent shield/spear fighters meet the first assault; the chapter supplies no final company casualty count.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>Elvar Chainbreaker and the hillside stand</h2><p>They stand with Glornir on Elvar’s right flank, with Orlyg’s force opposite on her left, as archery and poison defence precede the shield clash. No exact company casualty count or final victory is supplied.</p></details><details><summary>The Fury of the Gods · 63</summary><h2>The last of the company is seen passing through the opened stone doors before Ulfrir closes them</h2><p>The last of the company is seen passing through the opened stone doors before Ulfrir closes them. This confirms the company’s retreat inside without a new exact casualty count or a guarantee no one is injured.</p></details><details><summary>The Fury of the Gods · 65</summary><h2>Losses and plans after the retreat</h2><p>The Bloodsworn and Battle-Grim sit together after the retreat, sharing food/talk while Sighvat and Einar arm-wrestle to encouragement and wagers. These immediate survivors do not supply an exact casualty roll or final battle victory.</p></details><details><summary>The Fury of the Gods · 68</summary><h2>They wake from their chamber and face actual Fell-Hearted/Estrid rebels at the stone doors</h2><p>They wake from their chamber and face actual Fell-Hearted/Estrid rebels at the stone doors. Elvar’s corpse falls before them. Glornir forms a loose attack rather than an impractical shield wall, killing Hjalmar, while Vol kills Sturla. The fighting and subsequent night-hag entry leave the wider outcome unresolved.</p></details><details><summary>The Fury of the Gods · 69</summary><h2>They fall back and form a shield wall in the hall as enemy waves enter</h2><p>They fall back and form a shield wall in the hall as enemy waves enter. Other forces rally nearby, including unnamed mounted bow warriors; no exact Bloodsworn casualty count or final stand outcome is given.</p></details><details><summary>The Fury of the Gods · 70</summary><h2>The gods collide and the tree burns</h2><p>Their hall shield formation breaks at the dragon’s coming, then they follow Orka through the Raven-Feeders’ unformed line and drive the root-cutters to the trunk. The hall fight and named duels continue, without a final company casualty count or victory.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>They climb against the Tainted Raven-Feeders and exit after the roof ward opens</h2><p>They climb against the Tainted Raven-Feeders and exit after the roof ward opens. At the fleet revelation Glornir insists on surviving the present battle first; the company follows him/Thorguna through the skraeling screen into the enemy wall. No completed vengeance or full casualty count is supplied.</p></details><details><summary>The Fury of the Gods · 73</summary><h2>A handful remain below with Varg/Svik/Røkia/Einar/Edel/Æsa, cut off by fire from Glornir</h2><p>A handful remain below with Varg/Svik/Røkia/Einar/Edel/Æsa, cut off by fire from Glornir. They rescue a damaged stone wolf and confront Brák’s captive group. Enemies separate them; Einar suffers a sword through the throat and Varg runs at Sterkur, without a resolved company outcome.</p></details><details><summary>The Fury of the Gods · 74</summary><h2>The hilltop breakthrough is overtaken by Snaka’s return and the ground breaking into the hall</h2><p>The hilltop breakthrough is overtaken by Snaka’s return and the ground breaking into the hall. Glornir calls the company away, leads them to the cliff and jumps with Vol, followed by Orka/Breca. Thorguna is impaled, Vesli/Drekr vanish downhill and the full company’s escape remains unresolved.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>They mourn Einar’s confirmed death with Refna and the children while the hall collapses</h2><p>They mourn Einar’s confirmed death with Refna and the children while the hall collapses. Varg kills Leif, Brák is reported gone and Sterkur is unseen. Ulfrir gathers them for a tunnel escape, rescues Hrung’s party and enters the passage as Snaka breaches the wall; the final escape remains unshown.</p></details><details><summary>The Fury of the Gods · 76</summary><h2>Surviving the plunge into the Falinn</h2><p>The cliff party’s named survivors regroup at a Falinn bend: Orka/Breca, Glornir/Vol, Halja/Gunnar/Lif/Sæunn and other emerging Bloodsworn. They dry/warm before seeking friends. Vesli returns, reports Drekr escaped and is asked to scout; neither a full roster nor the other evacuation group’s fate is established.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>The survivors’ camp and reunion</h2><p>A little over a score of the floor-party Bloodsworn emerge protecting Refna/the children; Svik/Sulich speak for them at council while Glornir’s party remains unaccounted for in Varg’s view. Vesli then brings Glornir/Vol/Orka with a score-or-so others and the groups reunite. Counts remain estimates rather than an exact summed roster.</p></details><details><summary>The Fury of the Gods · 79</summary><h2>The reunited circle tends weapons, hears Vesli’s successful scout report and welcomes Frek the Free</h2><p>The reunited circle tends weapons, hears Vesli’s successful scout report and welcomes Frek the Free. Sæunn names Orka as her liberator, while Halja offers Lif friendship and a conditional brother’s place, not membership already sworn. The captains’ next plan remains undisclosed as Røkia/Varg leave together.</p></details><details><summary>The Fury of the Gods · 81</summary><h2>The reunited company charges with Glornir/Orka and the allied host, about half without shields</h2><p>The reunited company charges with Glornir/Orka and the allied host, about half without shields. Varg’s group clears Yrsa’s guards and avenges Torvik, then finds Taras/Iva threatened with Brák nearby. No full battle/casualty tally is yet given.</p></details><details><summary>The Fury of the Gods · 89</summary><h2>The group leaves Brák’s corpse and heads to the gods after Iva/Taras’s farewell</h2><p>The group leaves Brák’s corpse and heads to the gods after Iva/Taras’s farewell. Æsa is suddenly killed; Røkia/Edel/Svik/Varg and the hound kill Heðin collectively with Faunir support, then the ravens intervene against Rotta. No full company tally/final war result is supplied.</p></details><details><summary>The Fury of the Gods · 90</summary><h2>The coordinated assault kills the dragon but costs Glornir’s life after he saves Orka</h2><p>The coordinated assault kills the dragon but costs Glornir’s life after he saves Orka. The company gathers grieving with Vol and Breca; no new chief is selected in this chapter. Orka remains wounded, while the field cheers and Hrung is heard alive inside the corpse.</p></details><details><summary>The Fury of the Gods · 91</summary><h2>Return to the ruined homestead</h2><p>The survivors bring children and accompany Orka to the ruined homestead, gather around Thorkel’s barrow and begin digging for Glornir. Spert’s recovered remains are also brought; no new chief appointment or full survivor roll is supplied.</p></details><details><summary>The Fury of the Gods · 92</summary><h2>After completing the barrows and toasting Elvar, the company discusses remaining work</h2><p>After completing the barrows and toasting Elvar, the company discusses remaining work. Vol and Orka decline chiefship; Svik is suggested but no successor is appointed. All agree to Varg’s permanent-home proposal, and Vol proposes the current steading with Orka’s approval. Building a new drakkar and raiding are proposals, not completed work.</p></details><details><summary>Illustration · The Fury of the Gods · 92</summary><p><a href="assets/fbf45426dd230f.jpg">Open noncanonical illustration</a></p><p>The company sharing food and discussing a lasting home.</p></details><details><summary>Illustration · The Hunger of the Gods · 70</summary><p><a href="assets/e546af7cc877e5.jpg">Open noncanonical illustration</a></p><p>The Bloodsworn pursue their enemies through the gates of Valdai.</p></details><details><summary>Illustration · The Fury of the Gods · 76</summary><p><a href="assets/ab304df5413ea2.jpg">Open noncanonical illustration</a></p><p>Breca embracing Vesli at the riverbank regrouping.</p></details><details><summary>Illustration · The Fury of the Gods · 39</summary><p><a href="assets/f20f8d2ec0ef53.jpg">Open noncanonical illustration</a></p><p>Glornir welcoming Orka back as kin.</p></details><details><summary>Illustration · The Fury of the Gods · 81</summary><p><a href="assets/7e24dd3cc88c25.jpg">Open noncanonical illustration</a></p><p>Sulich’s mounted force entering the unprepared camp.</p></details><details><summary>Illustration · The Fury of the Gods · 77</summary><p><a href="assets/351bb7176446cb.jpg">Open noncanonical illustration</a></p><p>Glornir’s party entering the survivors’ snowy camp.</p></details><details><summary>Illustration · The Fury of the Gods · 37</summary><p><a href="assets/b872187acec541.jpg">Open noncanonical illustration</a></p><p>Varg’s welcome after the spoken oath.</p></details><details><summary>Illustration · The Fury of the Gods · 73</summary><p><a href="assets/05f4dcba636f0f.jpg">Open noncanonical illustration</a></p><p>Æsa running the planted spear during the stone-wolf rescue.</p></details></noscript>
