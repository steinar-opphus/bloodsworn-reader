      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 4</summary><h2>The descent beneath Oskutreð</h2><p>Skuld identifies the enormous chamber beyond a shattered barred doorway beneath Oskutreð as Vergelmir, Lik-Rifa&#x27;s former chamber. A pale rat-like quadruped appears there. The company sees a luminous procession Uspa calls the soul road, passing through the Corpse-Gate.</p></details><details><summary>The Hunger of the Gods · 4</summary><h2>The descent beneath Oskutreð</h2><p>The entrance is described as tall and wide as a hill, with shattered timber and twisted iron bars as thick as mead-hall posts. The slick floor is littered with bones, decaying corpses and large insect-like husks. Elvar cannot see the walls, although she experiences the chamber as suffocating; the visitors carry torches.</p></details><details><summary>The Hunger of the Gods · 4</summary><h2>The descent beneath Oskutreð</h2><p>Skuld says Lik-Rifa fed on passing souls and subterranean creatures and received things from helpers. Deeper inside stands a black-bound book protected by red runes.</p></details><details><summary>The Hunger of the Gods · 4</summary><h2>The descent beneath Oskutreð</h2><p>Huld triggers a blast, and an attacker emerges.</p></details><details><summary>The Hunger of the Gods · 6</summary><h2>The swarm in the depths</h2><p>A swarm of varied creatures attacks the visitors. Uspa’s bright light kills or drives them back, leaving both creature corpses and fallen Battle-Grim. She passes the rune-door as its runes disappear, then identifies the protected book as a Galdrabok written by Lik-Rifa.</p></details><details><summary>Illustration · The Hunger of the Gods · 4</summary><p><a href="assets/68ccbe1caadda1.jpg">Open noncanonical illustration</a></p><p>The party discovers the warded, black-bound book beneath Oskutreð.</p></details><details><summary>Illustration · The Hunger of the Gods · 4</summary><p><a href="assets/e0173b6bbed570.jpg">Open noncanonical illustration</a></p><p>The company watches the luminous procession in Vergelmir.</p></details></noscript>
