      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 20</summary><h2>Introduction</h2><p>Svik identifies Skalk as Helka’s skáld and Galdurman. He is tall, with braided blond hair and beard, a thick torc and a gnarled staff. Varg sees pewter rings and what resemble small animal skulls in his braids; knotwork tattoos cover his hands and extend up his sleeves.</p></details><details><summary>The Shadow of the Gods · 20</summary><h2>Story and connections</h2><p>Skalk accompanies Glornir back from the hall and travels aboard the Sea-Wolf with two of Helka’s warriors. Glornir orders them to row.</p></details><details><summary>The Shadow of the Gods · 26</summary><h2>Oar-dance and weapons practice</h2><p>Skalk says the mission goes to the River Slågen&#x27;s source at the Bonebacks, on Helka&#x27;s northwestern border. Skalk reports disappearances initially blamed on Störr&#x27;s raids, followed by discoveries of partly eaten remains. Skalk admits the vaesen&#x27;s identity is unknown and that there are no witnesses. Skalk estimates that the remains may represent as many as thirty dead. Skalk orders Vol not to speak without permission because she is a thrall. Skalk yields to Glornir&#x27;s demand and promises a chest of Helka&#x27;s silver for the hunt.</p></details><details><summary>The Shadow of the Gods · 36</summary><h2>A dangerous bargain and mutilated bodies</h2><p>Skalk offers to perform Varg’s akáll in return for a future debt secured by Varg’s blood oath, warning that Varg may lose his place among the Bloodsworn. During the northern expedition, Glornir accuses him of withholding that Helka had sent the drengrs found dead in the forest. Skalk replies that he meant she could send no more warriors.</p></details><details><summary>The Shadow of the Gods · 39</summary><h2>A sister&#x27;s hair and an offer of help</h2><p>Skalk demonstrates a flame in his palm with the word Eldur, extinguishing it when Glornir orders him to. He describes Galdur-magic as learned and Seiðr-magic as inherited, condemning the latter in explicitly hostile terms.</p></details><details><summary>The Shadow of the Gods · 45</summary><h2>Waking among the wounded</h2><p>He betrays the Bloodsworn, knocking Vol unconscious while Yrsa and Olvir control the sickroom. He offers Varg an akáll in exchange for an oath, plans to enslave Vol, and kicks Varg unconscious after Varg attacks Olvir.</p></details><details><summary>The Shadow of the Gods · 51</summary><h2>Captivity and violence at Grimholt</h2><p>Chapter 51 names him as the blond Galdurman from the frost-spider encounter. He compels Skapti to disclose Hakon’s orders regarding Drekr. During Orka’s escape she throws an axe into his shoulder; he later appears among those retreating to the boats.</p></details><details><summary>The Hunger of the Gods · 3</summary><h2>Mord&#x27;s burial and a blood feud</h2><p>Lif reports that Orka&#x27;s thrown hand-axe wounded his shoulder and that his abandoned staff is now ash. Orka thinks he is heading to Darl but did not witness Vol being placed aboard. Glornir chooses Darl for pursuit; Svik&#x27;s belief that a staffless Galdurman is easier to kill remains his assessment.</p></details><details><summary>The Hunger of the Gods · 12</summary><h2>Rowing away from Grimholt</h2><p>He sits hunched over a chest aboard the escaping snekke with a blood-crusted bandage on his shoulder. He is broad-shouldered, with bird and rat skulls in his blond braids. Guðvarr recalls Orka’s axe knocking him down the tower stairs after his staff ignited.</p></details><details><summary>The Hunger of the Gods · 12</summary><h2>Rowing away from Grimholt</h2><p>He dismisses Vol as a replaceable Tainted thrall and doubts the Bloodsworn would risk themselves for her. He claims to have seen Glornir fall and disparages his reputation. Vol rejects his confidence and judges his power diminished; he does not answer her question about his staff.</p></details><details><summary>The Hunger of the Gods · 12</summary><h2>Rowing away from Grimholt</h2><p>After Skapti estimates one more day to Darl, he predicts that pursuit cannot catch them first. He threatens to fit Vol with a collar of his own crafting there and make her permanently his thrall, then orders Yrsa to gag her. The arrival and replacement collar remain future events.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>The fugitives reach Darl</h2><p>At Darl he acknowledges Guðvarr’s assistance and makes him carry the chest because his shoulder remains injured. He blocks Skapti from reporting to Hakon and sends the surviving travellers with Sturla towards the tower, reserving Guðvarr. He says Hakon must not learn he knows about the prince’s dealings with Drekr.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>The fugitives reach Darl</h2><p>Before Helka he displays iron brooches and accuses Störr of the disappearances. He alleges that the Bloodsworn betrayed him and tried to steal his discoveries, calling Vol Glornir’s thrall. These are his hostile claims and do not overwrite his earlier betrayal or Vol’s disclosed status.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>The fugitives reach Darl</h2><p>He opens the chest with spoken magic, identifies the curved weapon as Orna’s missing talon and magically attaches it to the skeletal foot. He says the remaining bones cannot be Orna’s and tentatively identifies the copied manuscripts as Raudskinna, explicitly distinguishing them from originals.</p></details><details><summary>The Hunger of the Gods · 21</summary><h2>An audience with Queen Helka</h2><p>Helka says his memory of Guðvarr’s rescue is vague because he was injured; Yrsa corroborates it and Helka rewards Guðvarr. Skalk stands beside the queen, holding a drinking horn and eating grapes, and offers Guðvarr ale.</p></details><details><summary>The Hunger of the Gods · 21</summary><h2>An audience with Queen Helka</h2><p>He questions Guðvarr about Orka and why he did not recognise her as Úlfhéðnar after Vafri’s reported killing. He tells Helka that Orka said her son had been stolen and that hearing a child cry at Grimholt released her wolf. At the close of the audience, after Helka proposes an undisclosed task closer to home, he tells Guðvarr to follow.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>Secrets in the Galdur tower</h2><p>He opens access to a hidden tunnel near Helka’s chamber and takes Guðvarr to the tower under Yrsa’s watch. He praises Guðvarr’s ambition, cunning and self-preservation, then threatens him while demonstrating fire in his palm. The assignment is to befriend Hakon: Skalk alleges secrets that may threaten the realm and argues an unfamiliar ambitious warrior will gain trust where known agents cannot.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>Secrets in the Galdur tower</h2><p>His words release Guðvarr from an immobilising threshold. He praises Sturla for bringing a Froa-spirit after killing its tree. Vol is held with severe injuries and stitched lips; Skalk says he will carve a staff from the Froa, then replace her collar and have her lip stitches cut. These are intentions, not completed work.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>Secrets in the Galdur tower</h2><p>He identifies the workroom’s central link as Ulfrir’s chain and says every Tainted collar includes a shaving. He also claims everything in the room obeys him. These assertions retain his attribution.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>Secrets in the Galdur tower</h2><p>He has Guðvarr bound to the table, calls a hyrndur to his hand and sets it on the captive’s arm. He says it will burrow near the heart, monitor loyalty and return when the task is complete. It actually begins burrowing, but its alleged surveillance, promised removal and Guðvarr’s safety are not established.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>The assault on the workroom</h2><p>He tells Guðvarr he has survived the hyrndur. When the tower is breached, he and his apprentices raise flaming rune-shields and throw fire. Taras breaks gaps in the shield and is burned. Skalk then sends the hyrndur swarm at the riders.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>The assault on the workroom</h2><p>The hawk attacks his face and leaves one eye a blood-filled wound. The swarm loses coordinated formation after the injury. Sturla supports him as Iva extinguishes the flames, then opens a fissure towards them. Sturla falls and Skalk falls with a cry; Yrsa leaps after him. Neither his death nor survival is confirmed.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>He is explicitly alive after the fissure: Yrsa and Sturla support him into the feast hall. He drags one leg, his face is bloody and a strip of torn linen covers the hawk-injured eye. How the three escaped is not shown.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>Glornir confirms an intention to kill him, but Helka refuses to hand him over and instead brokers a pursuit of Jaromir. He says Jaromir’s Seiðr-witch and Tainted thrall were powerful. Glornir’s future threat remains, but Skalk is spared for now.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>He sits and looks at Guðvarr before the latter feels a painful internal shift and interprets it as the hyrndur moving. Their sequence does not establish that Skalk remotely commanded it or tested Guðvarr’s loyalty.</p></details><details><summary>The Hunger of the Gods · 33</summary><h2>A summons after the tower battle</h2><p>He works in a higher circular chamber while the tower is repaired. His bandaged face bears red hawk-talon wounds and a red hole where the injured eye was. He confirms completion of his new staff and boasts that his former attackers would fare differently if they returned; no rematch tests this claim.</p></details><details><summary>The Hunger of the Gods · 33</summary><h2>A summons after the tower battle</h2><p>Pointing the staff at Guðvarr, he commands the hyrndur to move. The staff’s eyes flare green, its mouth seems to shift, and Guðvarr suffers sharp internal pain and weakness. A second command stops the movement. Skalk calls this a reminder of ownership and threatens worse for displeasure. Deliberate activation and stopping are now demonstrated, while loyalty detection and safe removal remain unproved.</p></details><details><summary>The Hunger of the Gods · 33</summary><h2>A summons after the tower battle</h2><p>He praises the cloak gesture, predicts Hakon’s gratitude and orders Guðvarr to exploit it on the prince’s return. He says Orka told him of Hakon’s meeting with Drekr and that his inquiries indicate repeated visits to The Dead Drengr outside ordinary hours. He instructs his spy to use the inn to get closer to Hakon; these reports do not establish a new witnessed meeting or successful spying.</p></details><details><summary>The Hunger of the Gods · 41</summary><h2>Sigrún&#x27;s reckoning with Guðvarr</h2><p>In his absence Sigrún acknowledges his hold over Guðvarr and declines an immediate demand for release because she fears Helka could choose him over her. She attributes Arild’s and other drengrs’ deaths to him, interpreting his conduct as a belief that he can act with impunity. This is her accusation and political assessment; the chapter gives no new demonstration of his magic or a safe removal of the hyrndur.</p></details><details><summary>The Hunger of the Gods · 46</summary><h2>A secret meeting before dawn</h2><p>In his absence, Guðvarr obtains access to Hakon at The Dead Drengr and overhears a message attributed to Drekr. Hakon already remembers Guðvarr carrying the talon for Skalk. Guðvarr denies friendship and gives an unwilling-escort account, then privately intends to hide the connection and deal with Skalk. No report reaches the Galdurman and no release from his control is demonstrated here.</p></details><details><summary>The Hunger of the Gods · 48</summary><h2>Flight from the breakfast table</h2><p>He comes from the tower gate behind running guards, holding his new staff. No longer bandaged, he has one eye, red-raw scars across face and head and exposed patches of skull where hair no longer grows. This is his later visible condition, not complete recovery.</p></details><details><summary>The Hunger of the Gods · 48</summary><h2>Flight from the breakfast table</h2><p>Kalv is bound by a fiery net after an unnamed voice’s cry; the initial casting is not explicitly assigned to Skalk. He explains that struggling tightens it and becomes more interested when Guðvarr names Kalv as Drekr’s messenger to Hakon.</p></details><details><summary>The Hunger of the Gods · 48</summary><h2>Flight from the breakfast table</h2><p>When Guðvarr thinks Kalv is trying to kill himself, Skalk refuses to allow it, strikes him twice on the head with his staff until he goes limp and says Eldur slökktur. Steam rises and the net becomes thin cord. He orders Kalv brought and Guðvarr to follow; no interrogation is yet narrated.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>He questions the restrained Kalv while Sturla smashes toes, seeking his own account rather than only Guðvarr’s. He asks whether Kalv has Svin’s blood, without receiving confirmation. He threatens a heated knife and worse pain from his staff; these threatened steps are not performed on Kalv. With Hakon present he uses the knife as a threat, singeing cheek hairs before stepping back.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>Hakon’s disclosures make the dragon’s release plausible to him. He recalls the talon chamber, dragon-born opponent and copied pages, still qualifying their Raudskinna identification, and synthesises earlier Orka and Skapti testimony about the children. Hakon relays Kalv’s directions to Nastrandir. Skalk’s proposal of protective survival for god-built halls remains speculation.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>He advises that Orlyg’s realm offers the quickest route north if a pact permits their needed numbers. He then proposes raising Orna from the completed skeleton, using resurrection passages in copied fragments and his chain link to bind her against Lik-Rifa. He does not know the exact time needed: fragment gaps, runes and a collar must be checked or made over many days. He praises Guðvarr’s proposed messenger role without an explicit commission. No resurrection, binding, collar or hyrndur removal occurs.</p></details><details><summary>The Hunger of the Gods · 77</summary><h2>Orna raised and the battle above Darl</h2><p>His blooded staff, apprentices&#x27; blood and runes restore Orna and an expanded collar encircles her. His hawk scars are mostly healed with an empty socket. During battle his attempt to recall Guðvarr&#x27;s hyrndur fails; Yrsa intervenes before Guðvarr can strike him. He is last seen running before the crash and is absent from the final view, not confirmed dead.</p></details><details><summary>The Fury of the Gods · 31</summary><h2>Skapti says he now serves as Skalk’s messenger despite earlier imprisonment</h2><p>Skapti says he now serves as Skalk’s messenger despite earlier imprisonment. He describes Skalk and Estrid as the band’s chiefs and relays their instruction to follow the forest road without straying. His guesses about why Skalk chose him are not confirmed motives; no direct sighting of Skalk or exact meeting location follows.</p></details><details><summary>The Fury of the Gods · 34</summary><h2>He waits with Estrid, still bearing the empty-eye scar</h2><p>He waits with Estrid, still bearing the empty-eye scar. He argues allegiances can change and offers intelligence like silver, including claimed knowledge of the wolf’s location and further service to Lik-Rifa. Reported Störr news derives from travellers Frek questioned, not a witnessed event by him. Sigrún refuses a binding dragon guarantee but agrees with Krúsa to forward the offer. During the Faunir attack he and Sturla cast runes; his party retreats by its own road. No final alliance or precise location is disclosed in the narrative.</p></details><details><summary>The Fury of the Gods · 41</summary><h2>His and Estrid’s proposed service is now described as spying in Ulfrir’s camp</h2><p>His and Estrid’s proposed service is now described as spying in Ulfrir’s camp. The leaders receive their collar/den intelligence via Sigrún/Krúsa/Munni and find it useful while questioning trust. No actual entry into the enemy camp or binding new oath is narrated.</p></details><details><summary>The Fury of the Gods · 44</summary><h2>The new arrivals and Grend’s fate</h2><p>He arrives with Estrid, staff and scarred empty eye socket, accompanied by two unnamed women whose identities are not established here. Glornir advances over Vol’s abduction and the earlier killing; a fair-haired guard tries to block him and is knocked down. Skalk kindles red staff runes against Vol’s blue flames before Ulfrir halts the clash. He verbally accepts Elvar’s rule suspending feuds, but no completed oath or renunciation of the spy plan is shown.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>Freedom and the approaching army</h2><p>Frek reports to Elvar that Estrid and Skalk sent information through Lik-Rifa’s messengers and joined Broðir/Runa’s plot, with Hjalmar present. He says his group sought to bring them to Elvar but found they had fled; their destination and capture are not shown. Elvar orders a search. These details remain attributed testimony, not a newly witnessed council scene.</p></details><details><summary>The Fury of the Gods · 64</summary><h2>Below the newly bypassed tower ward Rotta calls for Skalk and Estrid</h2><p>Below the newly bypassed tower ward Rotta calls for Skalk and Estrid. One unidentified voice answers Here. This corroborates contact at the stairs without visually confirming both bodies, naming the respondent or placing Hjalmar there.</p></details><details><summary>The Fury of the Gods · 66</summary><h2>The infiltrators descend</h2><p>He physically guides the rat-blood crew downward with an unnamed fair-haired drengr, then indicates a wide-arched door as Elvar’s location. Estrid/her drengrs and Hjalmar have been sent elsewhere. His guide’s identity and the final room’s shadowed occupant are not explicitly named in this passage.</p></details><details><summary>The Fury of the Gods · 67</summary><h2>The attack on Elvar’s chamber</h2><p>A voice orders him to end the room fight; red light flares at a wooden staff and an incantation throws the doorway crowd inward. He and Rotta then enter behind more warriors. The working is closely connected to the command, without supplying a general magic rule or identifying each person struck.</p></details><details><summary>The Fury of the Gods · 69</summary><h2>Biórr’s doubts amid the fighting</h2><p>He stands on the stair with his still-unnamed fair-haired drengr beside Biórr; Grend’s charge knocks both down on his way to Rotta. No named death or later recovery for either is shown.</p></details><details><summary>The Fury of the Gods · 70</summary><h2>The gods collide and the tree burns</h2><p>He is alive on the lower tree stair with the still-unnamed fair-haired drengr after the previous knockdown. When Glornir spots him he backs up, staff held, forming words Orka cannot hear. No new identified spell, guide name or completed kill is given.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>The roof ward opens</h2><p>He continues casting as Glornir/Vol pursue up the tree, then is seen with the still-unnamed drengr behind the hilltop skraeling/Raven-Feeder line. The charge begins before his final fate or guide identity is resolved.</p></details><details><summary>The Fury of the Gods · 74</summary><h2>Snaka rises and Wolfdales collapses</h2><p>Vol destroys his Galdur-staff with blue flames and drops him with twisted limbs and a broken neck, ending his duel. His unnamed drengr’s fate is not supplied by the scene.</p></details><details><summary>The Fury of the Gods · 78</summary><h2>The shattered enemy camp</h2><p>Sigrún explicitly reports him dead, reinforcing Vol’s earlier destruction of his staff and broken-neck outcome. Guðvarr hides delight at the report.</p></details><details><summary>Illustration · The Hunger of the Gods · 25</summary><p><a href="assets/85ab51d57f85b9.jpg">Open noncanonical illustration</a></p><p>Skalk and the apprentices raise their flame shields against the workroom assault.</p></details><details><summary>Illustration · The Hunger of the Gods · 23</summary><p><a href="assets/90f46a250174ce.jpg">Open noncanonical illustration</a></p><p>Skalk and Guðvarr arrive at the tower workroom doorway.</p></details><details><summary>Illustration · The Hunger of the Gods · 23</summary><p><a href="assets/f57fe9f63e6580.jpg">Open noncanonical illustration</a></p><p>Guðvarr lies restrained as the hyrndur is lowered towards him.</p></details><details><summary>Illustration · The Hunger of the Gods · 77</summary><p><a href="assets/b0d990843850c6.jpg">Open noncanonical illustration</a></p><p>A net of runes descends over Orna&#x27;s skeleton during the resurrection ceremony.</p></details><details><summary>Illustration · The Hunger of the Gods · 36</summary><p><a href="assets/66b259d4ea7896.jpg">Open noncanonical illustration</a></p><p>Skalk after the hawk attack.</p></details><details><summary>Illustration · The Shadow of the Gods · 43</summary><p><a href="assets/a15e5d86e3c013.jpg">Open noncanonical illustration</a></p><p>Skalk as described on his arrival at Liga.</p></details><details><summary>Illustration · The Fury of the Gods · 44</summary><p><a href="assets/2c1a0be95bf6a4.jpg">Open noncanonical illustration</a></p><p>Ulfrir halting the confrontation under Elvar’s rule.</p></details></noscript>
