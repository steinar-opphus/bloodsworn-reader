      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 16</summary><h2>Introduction</h2><p>Sturla greets Skalk in Darl with similarly dressed companions and armed guards. She has a blue tattoo on the back of each hand; when Skapti resists, fire flickers over her raised palm. Her exact formal office is not supplied.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>Story and connections</h2><p>Skalk orders her to take Skapti, Arild and the other travellers to the tower. Skapti yields after the threat of fire and levelled spears. What happens to the group inside is not shown.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>Secrets in the Galdur tower</h2><p>She returns to the tower dark-haired and pale, with a purple facial bruise, among wounded riders. She drags a wooden female form by rope and chain, says the cost was heavy and fears Kuru may die. Kuru is not confirmed dead or identified with the body carried on a horse.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>Secrets in the Galdur tower</h2><p>Skalk identifies the form as a Froa-spirit whose tree she and his apprentices killed, praising her. She leads her horse into the tower with the form still dragged behind, and later helps seize Guðvarr for restraint.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>The assault on the workroom</h2><p>She supports the injured Skalk after the hawk tears his face. When Iva’s fissure widens beneath them she drops from sight with a wail. Her subsequent survival is unknown.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>She and Yrsa support the injured Skalk into Helka’s hall, establishing that she survived her fall. The route or mechanism of survival is not narrated. They steady Skalk while he reports the power of Jaromir’s allies.</p></details><details><summary>The Hunger of the Gods · 33</summary><h2>A summons after the tower battle</h2><p>Now explicitly called a Galdur-apprentice, she walks with a limp and has a blistered hand. She and Yrsa summon Guðvarr from The Dead Drengr and bring him to Skalk in a higher circular room. She sees his completed staff there.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>She stands with Guðvarr and Skalk in the interrogation chamber, then obeys Skalk by removing Kalv’s shoe and repeatedly smashing toes with a small hammer. The chair and iron bonds hold him. At approaching footsteps Skalk orders the next raised blow held before Helka’s party enters.</p></details><details><summary>The Hunger of the Gods · 77</summary><h2>Orna raised and the battle above Darl</h2><p>She carries the ritual chest and joins Skalk and the apprentices in blood-and-rune work to resurrect Orna. Later she is among his group fighting dragon followers; no final fate is individually given.</p></details><details><summary>The Fury of the Gods · 34</summary><h2>Crow-dark-haired and milk-pale, she attends Skalk at the negotiation glade</h2><p>Crow-dark-haired and milk-pale, she attends Skalk at the negotiation glade. Her voice joins his in rune-casting during the Faunir attack, with burning wood/sap in the air. Her individual retreat or injury is not separately described.</p></details><details><summary>The Fury of the Gods · 68</summary><h2>She is now explicitly present beside Estrid with an ash-wood staff, burning an unnamed defender</h2><p>She is now explicitly present beside Estrid with an ash-wood staff, burning an unnamed defender. Her red counter-flame fails to stop Vol’s ice-net; bound/frozen, she is crushed apart at Vol’s command. This establishes her death, without retroactively naming the earlier unnamed bone-haired attendant as her.</p></details><details><summary>Illustration · The Hunger of the Gods · 77</summary><p><a href="assets/b0d990843850c6.jpg">Open noncanonical illustration</a></p><p>A net of runes descends over Orna&#x27;s skeleton during the resurrection ceremony.</p></details><details><summary>Illustration · The Hunger of the Gods · 36</summary><p><a href="assets/f65b24583a7247.jpg">Open noncanonical illustration</a></p><p>A composed character study of Sturla.</p></details></noscript>
