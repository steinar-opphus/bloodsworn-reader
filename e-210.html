      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 5</summary><h2>A welcome among the Raven-Feeders</h2><p>Myrk identifies untouched warriors seated apart in the Raven-Feeders’ camp as members of the Dragon-Cult. She describes them as worshippers of Lik-Rifa and the dead gods and says the cult is spreading through the land.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>Untouched dragon-worshippers march at the rear with the children’s wagons while Lik-Rifa leads in human shape. At the evening address she calls the dragon-born her children and all the gathered people her followers. Children join the resulting acclamation, but the event does not prove free allegiance or make every follower dragon-born.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Rowing and a merchant ship intercepted</h2><p>Elvar encounters thirty or forty men and women crossing a wooden Hvítá bridge east, away from Snakavik, with ox-drawn provision wagons and children. Their mail is tattered and rusty and spear blades dull; shields show a grey dragon in a white sky. Ulfrir sniffs and says they serve his sister, while Elvar names them dragon-worshippers. No individual is identified as a known follower or captive, and their exact destination is unknown.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Rowing and a merchant ship intercepted</h2><p>Their daylight crossing of Störr’s land astonishes Elvar, who remembers Snakavik’s cages and imagines his anger. Grend proposes killing them, but she says to let them go and take one battle at a time. Her ship passes under the bridge without an attack. The scene does not establish a universal cult uniform, that these people are dragon-born, or a new policy of toleration.</p></details><details><summary>The Fury of the Gods · 55</summary><h2>The siege begins at the river</h2><p>About twelve cultists with dragon tattoos chop nearby timber; a Froa responds, crushing several with roots and attacking an axe-bearing rescuer with barbed vine hair. He is left whimpering, alive at last sight, while no final exact casualty count is given.</p></details><details><summary>The Fury of the Gods · 59</summary><h2>They attack a slowly retreating wolf-shield group on the hill-side path with skraeling</h2><p>They attack a slowly retreating wolf-shield group on the hill-side path with skraeling. Sigrún’s shield wall and flying spertus add pressure before the defenders break and retreat; the unnamed white-haired commander’s identity and individual fate remain unconfirmed here.</p></details></noscript>
