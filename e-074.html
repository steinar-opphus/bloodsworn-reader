      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 7</summary><h2>The troll beside the molten pool</h2><p>Trolls are fiercely territorial. Males are usually solitary except around mating. Newborn trolls are strong and nimble.</p></details><details><summary>The Shadow of the Gods · 7</summary><h2>The troll beside the molten pool</h2><p>A troll encountered on Iskalt has stubby antlers.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>A clan of about a dozen occupies a corner of Nastrandir around a giant cauldron of porridge, with a sharp ammonia smell of urine and dung. A handful later attend the council. This is the local group, without a named individual or a total count of all trolls.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>The party has seen troll tracks among several eastward vaesen trails north of the Bonebacks. Spert attributes the movement to Lik-Rifa’s call, but the chapter does not show these particular trolls or their arrival.</p></details><details><summary>The Fury of the Gods · 36</summary><h2>The dragon’s host marches out</h2><p>Clans of roughly twenty or thirty grey-skinned trolls join Lik-Rifa’s marching host from crude timber dwellings outside Darl. Rotta says trolls dislike sailing and jokes two bulls fighting aboard would sink a ship; no such maritime incident is witnessed here.</p></details><details><summary>The Fury of the Gods · 41</summary><h2>Ilska asks about Orka</h2><p>Biórr sees a bull bellowing at two cubs fighting on the ground, punching/kicking and using new-grown tusks. Their exact age, injuries, family relationships and any general training custom are not supplied.</p></details><details><summary>The Fury of the Gods · 50</summary><h2>The burned wagons and the captive children</h2><p>The named huge bull Heðin attends the council in a cloak of stitched bearskins, leaning on a tree-sized club. He threatens future action against deserters for Mother-Maker; this individual’s equipment and words do not establish a universal troll custom or a performed hunt.</p></details><details><summary>The Fury of the Gods · 58</summary><h2>Reinforcements gather in numbers with heavy spears and iron-banded clubs</h2><p>Reinforcements gather in numbers with heavy spears and iron-banded clubs. A handful throw spears/curved axes into the gate wall then use the embedded shafts as climbing holds; some fall under defence, others cross the walkway and scatter defenders. Orka wounds one’s thigh without a stated final outcome. No particular troll is named as Heðin.</p></details><details><summary>The Fury of the Gods · 61</summary><h2>The shield line under pressure</h2><p>Tall thick-muscled silhouettes lumber behind the frost-spider wave after the attacking shield wall parts. No individual troll is named or new troll strike shown before the chapter ends.</p></details><details><summary>The Fury of the Gods · 62</summary><h2>They charge behind the hyrndur</h2><p>They charge behind the hyrndur. One tears down the fiery rune-net with its club, burns and falls onto spiders. Another catches Svik after a trip; Varg/Røkia/Orka jointly attack until it topples, letting Svik rise and flee. Neither troll is identified as Heðin.</p></details><details><summary>The Fury of the Gods · 63</summary><h2>They press the retreat and fight both stone guardians, damaging one; Skuld/Orv shoot at them</h2><p>They press the retreat and fight both stone guardians, damaging one; Skuld/Orv shoot at them. A troll follows through the closing doors, kills a drengr and is destroyed by Ulfrir. No individual troll is named as Heðin and the outside horde’s fate is not supplied.</p></details><details><summary>The Fury of the Gods · 69</summary><h2>They lumber through behind the spider wave and strike about them with clubs/spears in the hall</h2><p>They lumber through behind the spider wave and strike about them with clubs/spears in the hall. The dragon’s landing pauses the wider fighting; no new named troll or exact casualty count is supplied.</p></details><details><summary>Illustration · The Fury of the Gods · 61</summary><p><a href="assets/ebf68832f37548.jpg">Open noncanonical illustration</a></p><p>The frost-spiders advancing after the disengagement.</p></details><details><summary>Illustration · The Shadow of the Gods · 21</summary><p><a href="assets/2ee4ca3b77e7f3.jpg">Open noncanonical illustration</a></p><p>The troll on Iskalt&#x27;s snowy plateau beside the molten pool.</p></details><details><summary>Illustration · The Fury of the Gods · 58</summary><p><a href="assets/7f4d1b6c0ed99c.jpg">Open noncanonical illustration</a></p><p>The trolls using embedded weapon shafts as climbing holds.</p></details></noscript>
