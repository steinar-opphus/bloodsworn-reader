      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 3</summary><h2>Introduction</h2><p>Sigrún is Jarl of Fellur. Guðvarr is her nephew. He is also one of her drengrs.</p></details><details><summary>The Shadow of the Gods · 10</summary><h2>An Althing and a challenge</h2><p>At the Althing she is tall, though shorter and less wide than Orka, and walks with a warrior&#x27;s strength and grace. She wears riveted mail, a silver neck torc and silver arm rings.</p></details><details><summary>The Shadow of the Gods · 3</summary><h2>Story and connections</h2><p>Virk says she went to Queen Helka’s court in Darl. He says she has been away more than two months. He changes his description of the visit from summoned to invited.</p></details><details><summary>The Shadow of the Gods · 3</summary><h2>Story and connections</h2><p>Guðvarr announces that she will return within a nine-day. He reports her calling Helka just, good and wise. He presents swearing oaths to Helka as beneficial to the village.</p></details><details><summary>The Shadow of the Gods · 3</summary><h2>Story and connections</h2><p>Guðvarr announces an Althing after her return. It is to be held on the Oath Rock.</p></details><details><summary>The Shadow of the Gods · 8</summary><h2>Oaths at the family steading</h2><p>Guðvarr says Sigrún has returned and called an Althing in six days.</p></details><details><summary>The Shadow of the Gods · 10</summary><h2>An Althing and a challenge</h2><p>Sigrún has ruled for eight years. At the Althing she announces she has sworn her blood oath to Helka and shows a cut.</p></details><details><summary>The Shadow of the Gods · 10</summary><h2>An Althing and a challenge</h2><p>She says Helka would seize Fellur if refused and will demand coin and oaths. She claims Störr is expanding and Orlyg has raided her lands.</p></details><details><summary>The Shadow of the Gods · 10</summary><h2>An Althing and a challenge</h2><p>She defends Guðvarr’s search as doing all that could be done; Virk calls it a lie.</p></details><details><summary>The Shadow of the Gods · 12</summary><h2>The fatal duel</h2><p>Sigrún says she ordered her thrall to stop Virk, not kill him. Her commands coincide with red collar fire and the fading of the thrall’s changes.</p></details><details><summary>The Shadow of the Gods · 12</summary><h2>The fatal duel</h2><p>She rules justice done because Virk broke holmganga, and suspends the Althing.</p></details><details><summary>The Shadow of the Gods · 22</summary><h2>Orka’s raid</h2><p>Lif reports that Sigrún has threatened outlawry or execution at the brothers’ coming trial. Orka enters her sleeping chamber and cuts her lover’s throat. She strikes Sigrún’s jaw and later slashes her face from forehead to chin. Sigrún attacks again but trips over the bed after Orka parries.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>The fugitives reach Darl</h2><p>At Helka’s private gathering her diagonal facial scar is still red-raw and has damaged the bridge of her nose and one side of her mouth. Guðvarr recalls her kindness and fears her reaction to his failure; she smiles on seeing him. This scene supplies her present condition, not a new injury.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>She is seated farther along Helka’s table during the hall confrontation. Guðvarr thinks he ought to have defended his aunt but remains exhausted instead; this chapter supplies no speech, injury or separate bargain for her.</p></details><details><summary>The Hunger of the Gods · 33</summary><h2>A summons after the tower battle</h2><p>Guðvarr finds her in a turf-roofed longhouse near Darl’s fortress wall, with servants, drengrs and working thralls around the central hearth. She wears a fine tablet-weave-trimmed tunic and has a belted seax across her lap; her dark hair and Orka-given facial scar catch the torchlight.</p></details><details><summary>The Hunger of the Gods · 33</summary><h2>A summons after the tower battle</h2><p>She says she has sought her nephew since before Jaromir fled and accuses him of avoiding her. He inwardly admits it, then asks to speak alone. She dismisses the others and asks what has happened. He only says he has got into trouble before the chapter ends; she has not yet heard the full explanation or promised help.</p></details><details><summary>The Hunger of the Gods · 41</summary><h2>Sigrún&#x27;s reckoning with Guðvarr</h2><p>She speaks cautiously with Guðvarr in the torchlit rear chamber of the longhouse Helka supplied. She says the pursuit of Orka chiefly answered a political appearance of weakness, and describes earning her jarldom through strength and wit. She believes Helka, Glunn Iron-Grip, Svard the Scratcher and Illur Storm-Crow covet her lands; those ambitions are her assessment. She restrains Guðvarr’s threat to kill them and teaches guile through the example of a feint.</p></details><details><summary>The Hunger of the Gods · 41</summary><h2>Sigrún&#x27;s reckoning with Guðvarr</h2><p>She now acknowledges Skalk’s hold on her nephew. She declines his proposed demand to Helka because she fears the queen might favour Skalk, and attributes Arild’s and her other drengrs’ deaths to him. Her response supplies neither release nor a promised cure. She says she must also remain because Helka has asked the jarls to attend Orlyg’s meeting. The possible peace or pact is her speculation, developed with Guðvarr against the stated two-border threat.</p></details><details><summary>The Hunger of the Gods · 41</summary><h2>Sigrún&#x27;s reckoning with Guðvarr</h2><p>Hearing horns, she leaves with guards to investigate. She elbows Guðvarr before his greeting to the returning Hakon and says good afterwards, then follows Hakon and Frek into Helka’s hall. Get the job done is Guðvarr’s internal response to the jab, rather than an audible order quoted from her.</p></details><details><summary>The Hunger of the Gods · 43</summary><h2>The feast and the shield-dance</h2><p>She sits beside bandaged Skalk at Hakon’s feast and frowns at Guðvarr’s drinking. The admonition he imagines is not spoken dialogue. Later she gives him an encouraging smile during the shield-dance. No new remedy for his predicament is offered.</p></details><details><summary>The Hunger of the Gods · 77</summary><h2>Orna raised and the battle above Darl</h2><p>She brings forty remaining Fellur drengrs to the ceremony and places Guðvarr beside Helka. After calling to protect the queen from the dragon-born, she herself stabs Helka through the back. Hakon orders the guards to kill her, but Guðvarr kills him; her subsequent position is not shown here.</p></details><details><summary>The Fury of the Gods · 2</summary><h2>The dragon’s assembly in Darl</h2><p>With a little more than thirty warriors left after battle, she urges them to trust her and seeks to remain useful to Lik-Rifa. She is shocked by the execution of Helka&#x27;s captive drengrs but recovers composure. The god credits her and Guðvarr with Helka&#x27;s death and invites them to eat; she tells her nephew to stay close as they enter the damaged hall.</p></details><details><summary>The Fury of the Gods · 8</summary><h2>She claims Helka&#x27;s killing as service to Lik-Rifa and offers herself and Guðvarr for the hunt</h2><p>She claims Helka&#x27;s killing as service to Lik-Rifa and offers herself and Guðvarr for the hunt. Ilska orders her to bring her drengrs with Krúsa&#x27;s clan and any needed vaesen to seek Estrid and Skalk. The assignment is accepted but no journey is shown.</p></details><details><summary>The Fury of the Gods · 18</summary><h2>The hunters turn towards the Slågen</h2><p>She rides with her drengrs under Krúsa’s lead, five days from Darl and three days west along a suspected fugitive trail. She hopes to catch Estrid before crossing Slågen into what she still calls Störr’s enemy territory; this wording does not reverse his established death or Elvar’s succession.</p></details><details><summary>The Fury of the Gods · 18</summary><h2>The hunters turn towards the Slågen</h2><p>At the Froa’s glade she dismounts and later tries cutting vines from a trapped drengr. More growth threatens her, and Guðvarr pulls her away and helps her onto her horse. She escapes behind him; the drengr’s final fate is not confirmed.</p></details><details><summary>The Fury of the Gods · 20</summary><h2>Scouts report the fugitives</h2><p>At the stream camp she suggests the fugitives’ woodland route protects them from a dragon above, without confirming their motive. She says she has thirty drengrs and about forty skraeling plus uncounted frost-spiders and tennúr. Privately she proposes letting Krúsa bear the enemy’s first blows, but accepts when Krúsa orders her force to lead. No eavesdropping by Krúsa is established.</p></details><details><summary>The Fury of the Gods · 20</summary><h2>Scouts report the fugitives</h2><p>She leads down the narrow forest path, warning Guðvarr that his fear spooks horses. When Skapti appears she readies her drengrs and searches the glade’s margins. He claims to be alone and offers information, whose content and reliability remain untested.</p></details><details><summary>The Fury of the Gods · 31</summary><h2>The hunters enter Jarnvidr</h2><p>She leads across the Slågen into Jarnvidr despite distrust of Skapti, explaining that apparent leadership may win fame and his message may advance them with Lik-Rifa or Ilska. She follows his straight-ahead choice at a fork and questions his past and new service to Skalk. At the disturbance she orders everyone to remain on the road. She proposes keeping the captured Faunir hostage until they leave; Krúsa agrees and it is carried on a cut birch pole. No meeting or release is yet shown.</p></details><details><summary>The Fury of the Gods · 34</summary><h2>A bargain in the forest glade</h2><p>She stops Guðvarr’s offer to pay Járn to kill the hostage, then crosses the glade stream mounted to meet Estrid/Skalk. She offers advocacy with Lik-Rifa and Ilska in return for useful news, refusing a binding promise on the dragon’s behalf. Learning the reported Störr death and collared wolf, she and Krúsa agree to carry the offer, using Munni’s people for contact. Faunir attack before departure: she mounts, is helped clear by Guðvarr, cuts a Faunir from Krúsa and guards the retreat before following him down the entry road.</p></details><details><summary>The Fury of the Gods · 41</summary><h2>Ilska asks about Orka</h2><p>Returning with fewer, bandaged followers, she reports Estrid/Skalk alive and offering oaths, explaining Störr’s death and Elvar’s collared wolf. She now specifies their proposed service as eyes and ears in Ulfrir’s camp. She trusts no one but argues the information has helped. No spy entry or performed oath is shown; Munni’s later den report is received by the leaders.</p></details><details><summary>The Fury of the Gods · 45</summary><h2>The host enters the Iron Wood</h2><p>She privately credits Ilska with running the campaign and organising supporting thrall labour, endorsing her route estimate and tennúr scouts. At her roughly thirty-drengr camp she admits terror in the Faunir attack: reputation, followers and Fellur matter enough that she fears losing them more than death. She and Guðvarr discuss courage and cowardice as responses to fear. Her encouragement recounts his past survival and rising status, without a new battle or denial of fear.</p></details><details><summary>The Fury of the Gods · 47</summary><h2>She finds Guðvarr after the landing, with roughly a dozen drengrs around her</h2><p>She finds Guðvarr after the landing, with roughly a dozen drengrs around her. Relieved at his survival, she hears him minimise painful wounds and leads him in pursuit. She later forms a loose shield-wall as a huge approaching animal, feared as Ulfrir by Guðvarr, proves Rotta. Her earlier courage advice shapes Guðvarr’s attempts not to run, without making him fearless.</p></details><details><summary>The Fury of the Gods · 55</summary><h2>The siege begins at the river</h2><p>She brings Guðvarr to the dawn council, helm at belt, then leads her drengrs to an elm for ladder/raft timber. During the woodland attack she orders a defensive circle. The elm is not the nearby ash and no individual Froa kill/rescue or new wound is assigned to her.</p></details><details><summary>The Fury of the Gods · 57</summary><h2>Rafts and ladders reach the defences</h2><p>Beside the treeline stream she gets Guðvarr’s attention with a slap to his arm, tightens her helm and calls readiness. Her drengrs lift two rafts and follow her to the river, with Guðvarr taking a slow step after them. Her skáld-song encouragement is aspiration, not proof of fame, survival or a completed crossing.</p></details><details><summary>The Fury of the Gods · 59</summary><h2>Across the wall towards the hall</h2><p>She crosses first into Guðvarr’s view, sword/shield ready, then retrieves him on the palisade and orders sword drawn. Leading around the poison cloud down the hill-side path, she locks shields with him and calls Fellur’s warriors into a ten-wide front with second line, pacing it with sword-hilt taps. Spertus help break the opposing wolf-shield wall; she advances with growing numbers toward Ilska and the Raven-Feeders inside the open gate.</p></details><details><summary>The Fury of the Gods · 71</summary><h2>At dawn she leads her drengrs inside and joins Estrid’s eagle/raven shield group</h2><p>At dawn she leads her drengrs inside and joins Estrid’s eagle/raven shield group. Both call shields; Guðvarr locks beside her as the huge unnamed bull-man and two Berserkir break the formation. Some fallen rise again, and Guðvarr wonders if a maimed drengr is Járn, but Sigrún’s own later fate is not individually shown here.</p></details><details><summary>The Fury of the Gods · 78</summary><h2>Alive at camp, she comes from Drekr/Krúsa/Glunn and reports Glornir killed Ilska and Skalk is dead</h2><p>Alive at camp, she comes from Drekr/Krúsa/Glunn and reports Glornir killed Ilska and Skalk is dead. She accepts Guðvarr’s passing account that Estrid died in the wall-breaking attack, unaware in this exchange of his deliberate murder. She predicts power/rewards under Snaka, then witnesses the gods’ arrival; this is expectation, not victory already secured.</p></details><details><summary>The Fury of the Gods · 82</summary><h2>She helps Guðvarr into mail, calls a shield wall and identifies the red-shield Battle-Grim</h2><p>She helps Guðvarr into mail, calls a shield wall and identifies the red-shield Battle-Grim. A huge unnamed red-bearded axeman wounds her shoulder and she falls. Krúsa stands over her before being killed; Guðvarr finds Sigrún alive, drags her briefly and abandons her semi-conscious. Her final survival or treatment remains unshown.</p></details><details><summary>Illustration · The Fury of the Gods · 45</summary><p><a href="assets/88de86a7eac9db.jpg">Open noncanonical illustration</a></p><p>Sigrún admitting fear and encouraging Guðvarr.</p></details><details><summary>Illustration · The Fury of the Gods · 34</summary><p><a href="assets/5e38b5ccb5545b.jpg">Open noncanonical illustration</a></p><p>The meeting before the glade is attacked.</p></details><details><summary>Illustration · The Shadow of the Gods · 53</summary><p><a href="assets/b1584eddb3300e.jpg">Open noncanonical illustration</a></p><p>Sigrún at the Althing before the duel.</p></details><details><summary>Illustration · The Fury of the Gods · 20</summary><p><a href="assets/1e9a1f0628dd52.jpg">Open noncanonical illustration</a></p><p>Skapti’s still-undisclosed offer in the boulder glade.</p></details><details><summary>Illustration · The Fury of the Gods · 18</summary><p><a href="assets/a3dffdca08899d.jpg">Open noncanonical illustration</a></p><p>The first vines erupting in the ash-tree glade.</p></details><details><summary>Illustration · The Fury of the Gods · 71</summary><p><a href="assets/43824082300f3e.jpg">Open noncanonical illustration</a></p><p>The unnamed attackers breaking the joined shield line.</p></details></noscript>
