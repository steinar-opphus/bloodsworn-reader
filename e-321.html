      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 9</summary><h2>Grend gives this Oskutreð hand-axe to Elvar during training</h2><p>Grend gives this Oskutreð hand-axe to Elvar during training. Its long, thin haft, small head with iron hammer counterweight and leather grip threaded with silver wire make a light, balanced weapon; the wire seems to tingle to her. Grend rejects the Fate-Maker comparison, and Elvar hears no voices. Exceptional sharpness is observed without establishing a named magic mechanism.</p></details><details><summary>The Fury of the Gods · 9</summary><h2>Grend gives this Oskutreð hand-axe to Elvar during training</h2><p>After Ingvild takes her shield, Elvar draws the axe left-handed and binds the enemy axe with its head while attacking with her sword. She then uses it repeatedly against the fallen Ingvild. It is distinct from Grend&#x27;s own axe in the battle.</p></details><details><summary>The Fury of the Gods · 40</summary><h2>Councils and secrets in Wolfdales</h2><p>Elvar uses the axe Grend gave her to chop apart his wrist bonds after hearing his protective oath history and denial of biological fatherhood. She puts it away and releases his tether, without cutting off the iron collar or declaring a new status.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>Elvar Chainbreaker and the hillside stand</h2><p>Elvar draws Grend’s slim-hafted gift axe, again described as from Oskutreð, and uses its haft to start the shield-beating rhythm at the hillside stand. This repeats the already established provenance without demonstrating a new power.</p></details><details><summary>The Fury of the Gods · 67</summary><h2>The attack on Elvar’s chamber</h2><p>Elvar takes the slim axe on waking, uses it in the room fight and to cut Biórr’s cheek/neck through mail, then hooks and slices behind a leg during her reversal. Side of the cut leg is unspecified; no loss/recovery after her fall is narrated.</p></details><details><summary>The Fury of the Gods · 69</summary><h2>Biórr’s doubts amid the fighting</h2><p>Biórr finds and recognises it on the hall floor after Elvar’s fall, tests its light balance and takes it. He then cuts the rat-god’s pinned tail, enabling escape. This is the gift hand-axe, distinct from Orka’s short-axe lost with Broðir earlier, and its next possession/whereabouts remain with Biórr at this cutoff.</p></details><details><summary>The Fury of the Gods · 80</summary><h2>Snaka’s heart and the interrupted feast</h2><p>Biórr brushes its top where it is thrust through his belt while discussing the rat-tail cut that saved Rotta. It remains in his possession; no recovery of his lost sword is shown.</p></details><details><summary>The Fury of the Gods · 87</summary><h2>Biórr takes it from his belt and gives it to Bjarn, who accepts before the reunion</h2><p>Biórr takes it from his belt and gives it to Bjarn, who accepts before the reunion. Ownership/possession now passes to the child; no later use or disposal is shown.</p></details><details><summary>Illustration · The Fury of the Gods · 9</summary><p><a href="assets/51ff5afa5600c4.jpg">Open noncanonical illustration</a></p><p>Noncanonical study of the hand-axe Grend gives Elvar.</p></details><details><summary>Illustration · The Fury of the Gods · 67</summary><p><a href="assets/6dd2b44918ef5a.jpg">Open noncanonical illustration</a></p><p>Elvar overcoming Biórr before the later attack.</p></details><details><summary>Illustration · The Fury of the Gods · 69</summary><p><a href="assets/ee64a1f54290d6.jpg">Open noncanonical illustration</a></p><p>The moment before Biórr frees the pinned rat.</p></details></noscript>
