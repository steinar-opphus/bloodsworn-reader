      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 51</summary><h2>Introduction</h2><p>He is the white-haired chief at Grimholt, who threatens Lif with heated tongs during interrogation. Under Skalk’s questioning he admits that Hakon ordered Drekr’s access and storage of goods at the fortress.</p></details><details><summary>The Hunger of the Gods · 12</summary><h2>Rowing away from Grimholt</h2><p>He steers the escaping snekke from the stern and tells Skalk Darl is one more day away. His face bears a purple-green bruise, an ear is partly torn away and blood is crusted in his hair and neck; an older scar crosses his bulbous nose.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>The fugitives reach Darl</h2><p>He brings the boats into Darl. When Skalk orders him to accompany Sturla, he insists he should report to Helka and Hakon and moves a hand towards his axe. Sturla shows palm fire and guards level spears; Skapti yields. Skalk sends him and the others towards the tower to control the report to Hakon. Their treatment there is unshown.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>Secrets in the Galdur tower</h2><p>Guðvarr sees him imprisoned with Hrolf in an iron-barred tower cell. Arild’s whereabouts remain a question in Guðvarr’s thoughts; she is not shown in this cell.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>The assault on the workroom</h2><p>He, Hrolf and the other Grimholt survivors still occupy the barred cell during the attack. They ask Guðvarr to release them; he claims he has no keys, says he will look and hurries away. Their release is not shown.</p></details><details><summary>The Hunger of the Gods · 46</summary><h2>A secret meeting before dawn</h2><p>He is directly alive when he and Hrolf enter The Dead Drengr, lower their hoods and are recognised by Guðvarr. Rog calls them more friends of Hakon. This establishes survival outside the former tower cell; how they left, what happened to the others and what they will say are not shown. It does not erase the earlier uncertainty or Sigrún’s separate accusation.</p></details><details><summary>The Hunger of the Gods · 48</summary><h2>Flight from the breakfast table</h2><p>He warns Hakon that Skalk is up to dark deeds, then fixes his narrowed gaze on Guðvarr. When Guðvarr flees, Skapti emerges from an alley beside the canal and is later among those who board Hrolf’s rowing boat. He is last observed in this pursuit; the later rasped axe order is not identified as his voice.</p></details><details><summary>The Fury of the Gods · 20</summary><h2>He emerges directly from the boulders at the forest glade before the Slågen</h2><p>He emerges directly from the boulders at the forest glade before the Slågen. He now has thinning hair, a white beard and the old scar across his bulbous nose, with mail, belt axe and shield on his back. Guðvarr recognises him; the route and terms by which he reached this place are not given.</p></details><details><summary>The Fury of the Gods · 20</summary><h2>He emerges directly from the boulders at the forest glade before the Slågen</h2><p>He says he is alone while Sigrún’s drengrs search the margins and Guðvarr levels his sword. He offers a proposition and information, saying knowledge is power. No bargain, actual information or confirmation of his solitude is shown.</p></details><details><summary>The Fury of the Gods · 31</summary><h2>He crosses the Slågen under Krúsa’s supervision and directs the hunters straight ahead into Jarnvidr</h2><p>He crosses the Slågen under Krúsa’s supervision and directs the hunters straight ahead into Jarnvidr. He confirms former captaincy and Hakon service, imprisonment by Skalk and now serving as his messenger, while saying Skalk does not trust him. His possible reasons for being chosen remain speculation. He says Skalk and Estrid lead the band and ordered the visitors to stay on the forest road, but he knows no exact meeting place or time. He rides between Guðvarr and Sigrún after the hostage capture; no meeting has occurred.</p></details><details><summary>Illustration · The Hunger of the Gods · 12</summary><p><a href="assets/7f173ff342f9c0.jpg">Open noncanonical illustration</a></p><p>Skapti steering the fugitives&#x27; snekke on the River Drammur.</p></details><details><summary>Illustration · The Fury of the Gods · 20</summary><p><a href="assets/1e9a1f0628dd52.jpg">Open noncanonical illustration</a></p><p>Skapti’s still-undisclosed offer in the boulder glade.</p></details></noscript>
