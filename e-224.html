      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 15</summary><h2>Introduction</h2><p>Revna is a young Bloodsworn who joined after Orka left, named for her battle speed. She and Gunnar Prow are openly lovers. She helps light torches and guide Orka underground.</p></details><details><summary>The Hunger of the Gods · 15</summary><h2>Story and connections</h2><p>She recounts Rotta’s punishment as saga lore and questions his escape. She reports Skalk’s theft of the chest, gathers remaining scrolls and shows Orka the children’s holding room.</p></details><details><summary>The Hunger of the Gods · 15</summary><h2>Story and connections</h2><p>As she remarks on trust among kin, Gunnar brushes the back of her hand with his fingertips.</p></details><details><summary>The Hunger of the Gods · 18</summary><h2>Training and an encounter in the rain</h2><p>During Lif’s training, she makes a wry remark about Gunnar’s speed after his rapid win.</p></details><details><summary>The Hunger of the Gods · 20</summary><h2>Myrk confronted in the glade</h2><p>She intervenes at the mine, splintering one of Myrk’s shield men’s shields and sending him flying as the Bloodsworn join the battle. Afterward she hurries to Gunnar, whose leg is bloodied below the knee.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>Wounds tended and seaxes compared</h2><p>She cuts away Gunnar’s breeches to inspect his wound and insists he accept Vesli’s treatment. Later she helps restrain Orka from beating Myrk further.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>Wounds tended and seaxes compared</h2><p>She volunteers to accompany Orka, accepts the risk of death and says she wants a place in the saga-song she believes the returned Skullsplitter will inspire. This is her expectation, not an already composed song. Orka accepts her, Halja and Gunnar.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>She trains Lif with a spear beside the stream. He lands a butt-strike while she agrees to the trade, then she counters and knocks him into the water.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>She keeps calling Orka chief and joins the camp’s banter. On hearing about a bridge-opening witch, she names Kráka and doubts that level of power; Myrk replies that it was Uspa and that Kráka has joined her company. Revna’s power assessment remains hers.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>She checks Gunnar’s thigh wound, mocks Myrk’s past defeat at Rotta’s chamber and answers her slaughter taunt with a sharp-teeth joke. She encourages Lif to sing. During the staged raid she and Gunnar fight shield to shield; the scene supplies no new lasting injury for her.</p></details><details><summary>The Hunger of the Gods · 50</summary><h2>The wolf&#x27;s call across the lake</h2><p>After Spert and Vesli explain resisting Lik-Rifa’s summons, she welcomes their remaining with the party but expresses concern. She extends the call’s scope to all vaesen and asks what Lik-Rifa wants them for. Orka answers war. The universal scope is Revna’s inference from the reports, not a witnessed total muster.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>She notes the frost-spiders are heading in their direction and later overhears Lif’s discussion of Halja. She says Halja likes his singing and offers to help him. Her exchange with Gunnar about Halja’s preferences, a Liga man and a killing remains unverified banter, with uncertainty about the proposed tafl-cheating motive. She also identifies a foul mound as skraeling dung, without proving responsibility for the farm emergency.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>She supports fighting the farm’s skraeling rather than riding all day or risking a night attack. She and Gunnar take the stream entrance and she stands over two fallen courtyard skraeling before joining the roof assault. Later they return with the horse guard and mounts. She prompts Halja to assess Lif’s growing skill, then winks at him after Halja’s favourable reply; this does not establish a romance.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>She questions the lateness of the ravens’ protection and asks whether they are vaesen, gods or ravens. Their reply denies being vaesen and claims creation by Snaka. When Grok describes their messenger/eyes/ears role she asks whether they were spies and he agrees. The claims remain their account.</p></details><details><summary>The Hunger of the Gods · 75</summary><h2>The rescuers pursued</h2><p>She parries Ilmur&#x27;s rush and wounds his neck, then is struck through the mail and chest by Biórr&#x27;s thrown spear. Gunnar tries to help her; later she is still in a blood pool. The chapter does not separately pronounce her final fate.</p></details><details><summary>The Hunger of the Gods · 76</summary><h2>Captives before Rotta</h2><p>Orka explicitly recognises her death, advancing the previous chapter&#x27;s stillness. Gunnar carries her lifeless body out in grief during the escape.</p></details><details><summary>The Fury of the Gods · 32</summary><h2>Gunnar reports her death at Svelgarth and burial beside the lake where Breca was rescued</h2><p>Gunnar reports her death at Svelgarth and burial beside the lake where Breca was rescued. He reaffirms her chosen risk and vows revenge; Orka identifies Biórr by name. This is a new report to Edel, not a second death or a newly performed burial.</p></details><details><summary>The Fury of the Gods · 87</summary><h2>Gunnar invokes her name in his final axe blow against Biórr, a revenge after her established death</h2><p>Gunnar invokes her name in his final axe blow against Biórr, a revenge after her established death. This does not add a new Revna death account or erase Biórr’s preceding rescue of Bjarn.</p></details><details><summary>Illustration · The Hunger of the Gods · 15</summary><p><a href="assets/0cebbca048da15.jpg">Open noncanonical illustration</a></p><p>A joint portrait of Gunnar Prow and Revna Hare-Legs.</p></details></noscript>
