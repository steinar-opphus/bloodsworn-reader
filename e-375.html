      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 38</summary><h2>Two huge vine-covered boulders flank the escarpment before Wolfdales’ doors</h2><p>Two huge vine-covered boulders flank the escarpment before Wolfdales’ doors. Ulfrir’s invocation and the scouring wind expose them; they unfold into grey stone-carved wolves with snarling faces, bared teeth, raised hackles and amber-glowing eyes. They howl with his hall-sized wolf form and the living hill pack as the gates open. No personal names, exact scale, maker or later capabilities are given.</p></details><details><summary>The Fury of the Gods · 41</summary><h2>Munni reports seeing them at the den doors during his independent scouting</h2><p>Munni reports seeing them at the den doors during his independent scouting. His account verifies the den’s visible guardians to Lik-Rifa’s party, without showing him fight them or proving a new capability.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>Varg judges each about half Sea-Wolf’s size, without a stated measurement axis</h2><p>Varg judges each about half Sea-Wolf’s size, without a stated measurement axis. He perceives wind sifting their fur; one turns its head with a grinding sound, sniffs and bares huge stone fangs. A guard tells him to keep walking, and no attack follows. Fur/stone mechanism remains unclassified rather than assuming a change to ordinary living wolves.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>Elvar Chainbreaker and the hillside stand</h2><p>The two stone guardians remain crouched and snarling beside the partly open hillside doors while wounded enter and enemies arrive through the separate river gate. Their next action after the hall doors close is not shown.</p></details><details><summary>The Fury of the Gods · 63</summary><h2>The stone doors and the retreat inside</h2><p>They leave their door stations to charge trolls, mauling them and drawing close attacks while the host enters. One loses an ear and part of its head to a club, takes a rib blow and whines, but remains mobile; side unspecified. Trolls pen both in until aerial/rune arrows aid them. Both leap through the closing stone doors, with no repair of the damaged guardian narrated.</p></details><details><summary>The Fury of the Gods · 68</summary><h2>Both accompany Ulfrir to the hall confrontation</h2><p>Both accompany Ulfrir to the hall confrontation. The prior damaged guardian’s repair is not described; their presence is not proof its missing stone has returned. No distinct new guardian strike is given before the doors reopen.</p></details><details><summary>The Fury of the Gods · 69</summary><h2>The giant guardians remain beside Ulfrir during the entering army and dragon confrontation</h2><p>The giant guardians remain beside Ulfrir during the entering army and dragon confrontation. No repair of the earlier damage or individually assigned new guardian strike is narrated.</p></details><details><summary>The Fury of the Gods · 70</summary><h2>Both leap onto the root-bound dragon’s back and attack with stone jaws</h2><p>Both leap onto the root-bound dragon’s back and attack with stone jaws. No repair of the previously damaged guardian is described, and no decisive outcome or further individual damage is given.</p></details><details><summary>The Fury of the Gods · 71</summary><h2>The guardians continue tearing at the partly bound dragon as the roots char/fail</h2><p>The guardians continue tearing at the partly bound dragon as the roots char/fail. No repair of the damaged wolf or individually stated new guardian fate is supplied.</p></details><details><summary>The Fury of the Gods · 73</summary><h2>One guardian is clubbed down, one leg shattered and half missing</h2><p>One guardian is clubbed down, one leg shattered and half missing. Svik’s Bloodsworn attack its trolls and it remains active enough to knock the last troll down for them to kill. The damaged wolf is not distinguished by name or side, and no repair or final fate of either guardian is supplied.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>Leif’s death and the tunnel escape</h2><p>The group is directly present in Ulfrir’s gathering evacuation: Skuld above, both stone wolves alongside, Úlfhéðnar beneath, Battle-Grim/drengrs with Sighvat, Orlyg’s survivors and Sulich’s mounted remnants. The gate is blocked and they turn to the tunnels. This does not establish repaired guardians or a complete survivor tally.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>Both guardians limp out of the tunnel and sit with their backs toward Ulfrir, watching the forest</h2><p>Both guardians limp out of the tunnel and sit with their backs toward Ulfrir, watching the forest. Survival is confirmed and damage remains; no repair of the lost leg or earlier chips is narrated.</p></details><details><summary>The Fury of the Gods · 81</summary><h2>The charge against the gods</h2><p>Both guardians charge alongside wolf-form Ulfrir, then knock the rat down and tear at him after Skuld’s spear. Their participation does not mean their damaged stone bodies were repaired.</p></details><details><summary>The Fury of the Gods · 82</summary><h2>Sigrún falls and Lif confronts Guðvarr</h2><p>One guardian is battered by Heðin/trolls, losing a whole rear leg and suffering a crushed side, then its head is smashed to rubble and it lies still. This destroys one of the pair without distinguishing which prior damaged wolf it was or accounting for the other.</p></details><details><summary>The Fury of the Gods · 85</summary><h2>Lif’s reckoning with Guðvarr</h2><p>The remaining guardian is active in the continuing battle, leaping onto rat-form Rotta’s back and biting. No repair of earlier damage, fixed identity among the old injuries or final guardian fate is narrated.</p></details><details><summary>The Fury of the Gods · 89</summary><h2>Heðin falls and the ravens seize Rotta</h2><p>The last guardian remains on Rotta’s shoulder/back despite two trolls’ blows, then is thrown off when Rotta crashes into Heðin’s corpse. No new destruction or repaired damage is narrated.</p></details><details><summary>Illustration · The Fury of the Gods · 82</summary><p><a href="assets/886c07126fc4ce.jpg">Open noncanonical illustration</a></p><p>Heðin reducing one stone guardian’s head to rubble.</p></details><details><summary>Illustration · The Fury of the Gods · 38</summary><p><a href="assets/b18ccdbba68b24.jpg">Open noncanonical illustration</a></p><p>The stone guardians awakening before Ulfrir changes form.</p></details><details><summary>Illustration · The Fury of the Gods · 85</summary><p><a href="assets/86b191f404cd06.jpg">Open noncanonical illustration</a></p><p>The remaining stone guardian leaping onto the rat.</p></details><details><summary>Illustration · The Fury of the Gods · 63</summary><p><a href="assets/17a8a49cddc3be.jpg">Open noncanonical illustration</a></p><p>The two guardians returning, one visibly damaged.</p></details><details><summary>Illustration · The Fury of the Gods · 73</summary><p><a href="assets/05f4dcba636f0f.jpg">Open noncanonical illustration</a></p><p>Æsa running the planted spear during the stone-wolf rescue.</p></details></noscript>
