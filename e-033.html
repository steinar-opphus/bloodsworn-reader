      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 3</summary><h2>Introduction</h2><p>Guðvarr is Jarl Sigrún’s nephew. He is one of her drengrs.</p></details><details><summary>The Shadow of the Gods · 3</summary><h2>Appearance</h2><p>He has black hair. In Fellur’s courtyard it is oiled and tied at his neck. He has the beginnings of a beard. He wears an embroidered red woollen tunic and a silver arm ring. He carries a sword at his hip.</p></details><details><summary>The Shadow of the Gods · 10</summary><h2>An Althing and a challenge</h2><p>He is described as young, with a long, pointed nose; moisture repeatedly hangs from its tip. At the chapter 10 Althing he wears mail, carries a sword at his hip and arrives swaggering.</p></details><details><summary>The Shadow of the Gods · 3</summary><h2>Story and connections</h2><p>Virk says he arrived downriver by snekke that morning.</p></details><details><summary>The Shadow of the Gods · 3</summary><h2>Story and connections</h2><p>Guðvarr promotes oaths to Queen Helka as beneficial. He calls Helka the strongest. He claims Jarl Störr threatens from the west. He claims vaesen are growing bolder, murdering and stealing.</p></details><details><summary>The Shadow of the Gods · 3</summary><h2>Story and connections</h2><p>He blames the killings at Asgrim’s steading on vaesen. Orka denies that accusation. He tells Orka she is asking for trouble.</p></details><details><summary>The Shadow of the Gods · 3</summary><h2>Story and connections</h2><p>He announces an Althing after Sigrún’s return. He says they will look into the killings.</p></details><details><summary>The Shadow of the Gods · 10</summary><h2>An Althing and a challenge</h2><p>Virk says Guðvarr sent scouts but no river boats or hounds. Sigrún defends him, and Virk calls the defence a lie.</p></details><details><summary>The Shadow of the Gods · 10</summary><h2>An Althing and a challenge</h2><p>Guðvarr publicly challenges Virk to holmganga. He says the challenge cannot be withdrawn.</p></details><details><summary>The Shadow of the Gods · 12</summary><h2>The fatal duel</h2><p>Guðvarr chooses a fight to submission and is wounded by Virk. He insults Virk while down.</p></details><details><summary>The Shadow of the Gods · 12</summary><h2>The fatal duel</h2><p>Sigrún says Virk broke the duel by striking for death after submission.</p></details><details><summary>The Shadow of the Gods · 22</summary><h2>Captives freed and a name obtained</h2><p>Lif says he and Mord tried unsuccessfully to kill Guðvarr before their capture. During Orka’s raid, Guðvarr is first through Sigrún’s chamber door, his shoulder still bandaged. He leaps back from Orka’s thrown seax, which strikes the doorpost. He later shouts vengeance from the pier while Orka and the brothers escape.</p></details><details><summary>The Shadow of the Gods · 40</summary><h2>Flight towards Grimholt Pass</h2><p>Guðvarr pursues Orka, Lif and Mord from their lodging farm with mounted drengrs. Arild rides behind him. He tries to cross the bridge Orka sets alight but retreats when its timber cracks.</p></details><details><summary>The Shadow of the Gods · 46</summary><h2>The broken oath stone</h2><p>Orka sees the smoke of his pursuing campfires and estimates his party is about a day and a half behind. She suspects river pursuit as well, without seeing boats.</p></details><details><summary>The Shadow of the Gods · 51</summary><h2>Captivity and violence at Grimholt</h2><p>He arrives in Grimholt with Arild and stabs bound Mord despite Skalk’s command to wait. Orka later sees him among those fleeing towards the boats.</p></details><details><summary>The Hunger of the Gods · 7</summary><h2>An offer to return to the Bloodsworn</h2><p>At Grimholt, in Guðvarr’s absence, Lif asks Glornir to leave him alive for Lif’s revenge and tell him Lif will come for him. Glornir nods; no encounter with Guðvarr occurs here.</p></details><details><summary>The Hunger of the Gods · 12</summary><h2>Rowing away from Grimholt</h2><p>Four days after fleeing Grimholt, he travels down the River Drammur with the overcrowded refugee boats. Rowing has left his hands calloused and red-raw. He feels shame at fleeing Orka and fears facing Sigrún without her head.</p></details><details><summary>The Hunger of the Gods · 12</summary><h2>Rowing away from Grimholt</h2><p>He remembers his father’s habit of insulting others and privately uses it himself. He despises Arild’s attention while enjoying what he interprets as her admiration; he accepts the bread and cheese she offers. Seeing Skalk also wounded and fleeing lets him rationalise his own flight.</p></details><details><summary>The Hunger of the Gods · 12</summary><h2>Rowing away from Grimholt</h2><p>Beside him a wounded royal drengr deteriorates with a torn face, a swollen sting-wound and radiating black veins. Guðvarr hears breathing and feels a pulse, but steals the man’s silver eagle-winged brooch and declares him dead. Arild helps lift him to the rail. He screens the man’s fluttering eyelids, rolls him into the river and enjoys the extra room. The man is alive before being thrown; his eventual fate is unshown.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>The fugitives reach Darl</h2><p>He reaches Darl with the fugitives. He reminds Skalk of carrying him to safety; Skalk acknowledges the service, then makes him carry and guard the heavy chest under threat of death. Guðvarr hopes service will soften Sigrún’s displeasure.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>The fugitives reach Darl</h2><p>When Skalk sends the other travellers, including Arild, towards the tower, he is exempted and follows Skalk to Helka. He reassures Arild but privately cares primarily about his own safety. Skalk demands secrecy under threat of handing him to the Úlfhéðnar.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>The fugitives reach Darl</h2><p>He witnesses the court accusations and the restoration of the talon. Looking into the chest of bones and manuscripts, he thinks of opportunity; no specific plan is disclosed.</p></details><details><summary>The Hunger of the Gods · 21</summary><h2>An audience with Queen Helka</h2><p>He dreams of a jarl’s title and marriage to Helka before she becomes Orka and bites his throat. These honours and transformation are dream events. He wakes with his face in a woman’s hair in The Dead Drengr’s hayloft, feels sick after drinking and dresses clumsily when Yrsa summons him to Helka.</p></details><details><summary>The Hunger of the Gods · 21</summary><h2>An audience with Queen Helka</h2><p>Frek’s amber-flickering eyes recall the nightmare. He hears only uncertain fragments before Jaromir’s angry departure. Seeing Estrid in Helka’s chamber, he imagines a betrothal, without receiving any such offer.</p></details><details><summary>The Hunger of the Gods · 21</summary><h2>An audience with Queen Helka</h2><p>Helka rewards him with a gold arm ring after Yrsa corroborates his rescue of Skalk. Privately he remembers his fear during the escape and chooses not to mention it. The reward is real; his dream’s title and royal marriage are not.</p></details><details><summary>The Hunger of the Gods · 21</summary><h2>An audience with Queen Helka</h2><p>He considers his Orka account a rehearsal for Sigrún, who welcomed him the previous night without yet hearing about his flight. He recounts the family and raided steading, claims to have searched unsuccessfully for the killers, and deliberately omits the Althing and his holmganga with Virk. His hostile description of the chamber attack remains attributed testimony.</p></details><details><summary>The Hunger of the Gods · 21</summary><h2>An audience with Queen Helka</h2><p>He offers to fetch Orka but immediately regrets it. Helka declines, to his relief, and instead offers an unspecified task closer to home. He agrees, and Skalk tells him to follow; the assignment is not disclosed.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>Secrets in the Galdur tower</h2><p>He follows Skalk and Yrsa through a secret passage to Darl’s Galdur tower. Skalk flatters his ambition and cunning, then threatens him and produces a palm flame while Yrsa blocks retreat. Guðvarr accepts the assignment to befriend Hakon and learn what he conceals from Helka. Skalk’s suspicion and flattery are not objective confirmation of danger or courage.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>Secrets in the Galdur tower</h2><p>An unseen barrier freezes him at the tower threshold until Skalk speaks. He sees Sturla’s wounded expedition return with a dead wooden Froa form, then Skapti and Hrolf in a cell and Vol bruised, shackled and with her lips stitched shut. He wonders about Arild without seeing her.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>Secrets in the Galdur tower</h2><p>In the workroom he sees caged creatures and hears Skalk identify a faunir, a Näcken, hyrndur and a shard of Ulfrir’s chain. His recollection of Sigrún’s horrific hyrndur tale is lore, not a witnessed hatching.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>Secrets in the Galdur tower</h2><p>Skalk orders him bound to the restraint table, then places a hyrndur on his arm. He begs as it starts burrowing into him. Skalk claims it will detect betrayal from near his heart and later leave on command; those effects remain untested. At the close it is only half-buried in his arm and a hawk watches from a beam. His eventual survival and the insect’s full progress are not shown.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>Secrets in the Galdur tower</h2><p>Immediately before the bite, he begs with tears running down his face. At Skalk’s command the hyrndur opens its mandibles and dips its head towards his skin.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>The assault on the workroom</h2><p>He survives the hyrndur’s burrowing, feeling a trail of pain from arm to chest and pressure after it stops moving. He remains exhausted and bound. The exact location at his heart and any loyalty monitoring are not established.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>The assault on the workroom</h2><p>During Jaromir’s attack he witnesses the breach, rune-fire, the hawk’s assault on Skalk and Iva’s mist and fissure. The table splinters above the chasm while he and Vol remain attached. Jaromir takes Vol and the chest; Iva leaves with the burned Taras.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>The assault on the workroom</h2><p>Broken straps let him free himself and escape the tipping table, though his arm still hurts. He finds Arild’s dead body folded into a barrel and thinks he might have shared her fate without Skalk’s favour. Skapti and the other prisoners ask for release, but he claims to lack keys and leaves them.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>The assault on the workroom</h2><p>A hammer-wielder and guard collide with him, hurting his nose. He seizes the dropped hammer and kills the unnamed man. A cleaver-wielder throws an axe in response; a rising tower guard takes the hit and dies. Pursued, Guðvarr runs into the tunnel and closes the door without magical resistance. His theories about the ward being broken or working only one way remain speculation.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>Varg’s next viewpoint explicitly names the hammer-blow victim as Jökul and follows the earlier cleaver-wielder’s corresponding pursuit and axe retrieval. The original unnamed courtyard observations acquire their named counterparts only at this point in reading chronology.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>Varg recognises the killer standing before Helka with Jökul’s hammer. He sees a long snot-covered nose, sweat and grime, and a torn bloody tunic sleeve; Svik holds Varg back. Varg has not learned his personal name and no vengeance or further exchange is completed here.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>Exhausted in Helka’s hall, he resents being questioned about his warning. He sees Estrid excited behind the queen’s guards and Sigrún farther along the table, but does not rush to defend his aunt. Hearing Helka name Glornir connects the bald axe-fighter to the Bloodsworn chief.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>He tells the hall he saw Jaromir take Vol and the chest, including Jaromir’s claimed Hraeg identification. Glornir’s gaze makes him notice and drop the hammer. Varg accuses him of killing Jökul and fleeing; he claims instead to have come to warn Helka. Glornir stops Varg approaching.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>He privately hopes Skalk will be surrendered and killed. Instead, Skalk returns alive with Yrsa and Sturla, and Helka’s bargain preserves him for now.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>When Skalk sits and looks at him, he feels an internal shift and pinch, gasps and clutches his chest. He thinks the hyrndur moved and remembers the order to befriend Hakon; this is not proof of remote control or loyalty monitoring.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>He takes a dead drengr’s cloak and, with Helka’s and Glornir’s permission, wraps it around Hakon while Røkia slightly lifts the seax. Hakon thanks him. The gesture begins contact, not established friendship or successful spying.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>Varg grips his wrist, asks his name and warns that Lif is coming, saying Lif asked him not to kill him. Guðvarr mocks Lif and threatens a holmganga while privately feeling unfit to fight. Helka forbids bloodshed and Glornir orders his release. Only then does Guðvarr learn the cleaver-wielder’s personal name, Varg, and resolve to remember it.</p></details><details><summary>The Hunger of the Gods · 33</summary><h2>A summons after the tower battle</h2><p>Less than two days after the Bloodsworn’s departure, Yrsa and Sturla fetch him from The Dead Drengr’s hayloft, where he is with the red-haired sex worker Vilja. Arm and restraint pains persist, along with nightmares of the hyrndur and the tower’s corpses. His new green wool tunic covers the entry scabs; he wears Helka’s gold ring and carries a sword.</p></details><details><summary>The Hunger of the Gods · 33</summary><h2>A summons after the tower battle</h2><p>Returning through the damaged tower, he sees the former prisoners’ cell open and fears they have been murdered; he does not establish their fate. In a higher room he sees Skalk’s finished Froa-derived staff and the red hole left by the injured eye. Skalk’s new-staff confidence remains a boast about a possible rematch.</p></details><details><summary>The Hunger of the Gods · 33</summary><h2>A summons after the tower battle</h2><p>Skalk deliberately makes the hyrndur move in his chest by a spoken command while pointing the staff. Pain and weakness nearly bring him down until Yrsa catches him. A second command stops the movement and the pain fades. Skalk threatens worse for displeasure; Guðvarr whimpers assent. This demonstrates coercive control in the encounter, not automatic detection of betrayal or safe eventual removal.</p></details><details><summary>The Hunger of the Gods · 33</summary><h2>A summons after the tower battle</h2><p>He is told to exploit Hakon’s expected gratitude for the cloak and use The Dead Drengr to get closer to him. Skalk reports repeated private visits by the prince; Guðvarr agrees and leaves shaky, with neither a new meeting nor a successful spying result.</p></details><details><summary>The Hunger of the Gods · 33</summary><h2>A summons after the tower battle</h2><p>Instead of returning to Vilja he seeks Sigrún in the summit fortress, gaining entry after showing Helka’s gold arm ring. He fears Skalk will kill him after the task, rather than knowing a confirmed plan. Járn directs him to his displeased aunt. He acknowledges inwardly that he has avoided her over his flight from Orka and then his ordeal. After she clears the room at his request, he says he has got into trouble; no full explanation or answer follows here.</p></details><details><summary>The Hunger of the Gods · 41</summary><h2>Sigrún&#x27;s reckoning with Guðvarr</h2><p>In the guarded privacy of Sigrún’s rear chamber he apologises for failing to bring back Orka’s head, recalling her wolf-like violence. His aunt explains the political harm of appearing weak and checks his threat against the jarls she believes covet her lands, counselling guile.</p></details><details><summary>The Hunger of the Gods · 41</summary><h2>Sigrún&#x27;s reckoning with Guðvarr</h2><p>He wishes to return to Fellur and asks her to demand that Helka order Skalk to free him. Sigrún fears Helka might favour Skalk and declines the immediate appeal. She says Helka has asked the jarls to stay for Orlyg’s meeting; their discussion of a pact to isolate one enemy remains speculation.</p></details><details><summary>The Hunger of the Gods · 41</summary><h2>Sigrún&#x27;s reckoning with Guðvarr</h2><p>When Hakon returns with Frek, Sigrún elbows Guðvarr and he thinks of getting his task done. He welcomes the prince, who still wears his borrowed cloak and gives him a curt nod. Guðvarr perceives recognition, but obtains no secrets or demonstrated friendship. He follows into the hall and welcomes Helka’s announced feast.</p></details><details><summary>The Hunger of the Gods · 43</summary><h2>The feast and the shield-dance</h2><p>He drinks at Hakon’s feast despite Sigrún’s frown, imagining the warning she would give him and answering with a mock toast. He hears Leif’s accusations against Varg, Helka’s permission for a hunt and the hiring of Sterkur, whose reputation he knows from skáld songs. Helka’s belief that the Bloodsworn are already in Iskidan remains her suspicion.</p></details><details><summary>The Hunger of the Gods · 43</summary><h2>The feast and the shield-dance</h2><p>Determined to compete in the shield-dance, he kicks a woman’s knee and pushes forward. Hakon touches his cloak before choosing him. Vilja fills his drinking horn and insinuates a winner’s prize. He recalls his successes in Fellur and aboard Sigrún’s ship; seeing Skalk makes him remember the hyrndur and wobble before recovering. No new magical activation is demonstrated.</p></details><details><summary>The Hunger of the Gods · 43</summary><h2>The feast and the shield-dance</h2><p>After overtaking a contestant whose heel is clipped by a shield rim, he passes Glunn by landing on the same shield and stepping around him. He then leaps into Estrid as she closes on Hakon, sending both down; Glunn falls too. Estrid hauls him up and accuses him of deliberate interference. His private motive invokes the monster in his chest, while his public account calls the collision a mistimed accident. He is not shown being paid by Hakon.</p></details><details><summary>The Hunger of the Gods · 43</summary><h2>The feast and the shield-dance</h2><p>Hakon wins and thanks Guðvarr’s flattery; Glunn compliments his move while Estrid remains angry. Guðvarr wonders whether Hakon will visit The Dead Drengr, but the chapter ends with him looking towards Vilja. Selection and thanks improve access to the prince, without established friendship or discovered secrets.</p></details><details><summary>The Hunger of the Gods · 46</summary><h2>A secret meeting before dawn</h2><p>After the shield-dance feast he wakes hungover with Vilja in The Dead Drengr’s roof-space. He cannot remember whether they had sex. He dresses and finds Hakon meeting a hooded Kalv before opening time, while Rog is alive and serving. He listens from the doorway.</p></details><details><summary>The Hunger of the Gods · 46</summary><h2>A secret meeting before dawn</h2><p>Kalv demands the proof he attributes to Drekr. Guðvarr sees Hakon reveal a short-regrowth strip and under-skin shadow at the back of his head, comparing it to Úlfhéðnar tattoos without identifying a design or power. He hears the reported job-done/coming-day message and Hakon’s unnamed she-is-free question; Kalv’s subsequent whisper is not narrated.</p></details><details><summary>The Hunger of the Gods · 46</summary><h2>A secret meeting before dawn</h2><p>Fearing Rog will find him, he enters and is stopped at sword-point by Gudrun. Hakon recognises him from the shield-dance and cloak gift, orders her to withdraw and invites him to drink. Guðvarr vows vengeance for Sigrún and denies friendship with Skalk, but Hakon already remembers his talon-carrying service. He gives a selective unwilling-escort account while Kalv rests a hand on his seax.</p></details><details><summary>The Hunger of the Gods · 46</summary><h2>A secret meeting before dawn</h2><p>Hakon offers friendship and food. Guðvarr feels he belongs among equals and plans to deal with Skalk and conceal the connection, rather than having achieved secure trust or delivered a spying report. Rog then admits Skapti and Hrolf; Guðvarr recognises them, but no subsequent confrontation occurs on the page.</p></details><details><summary>The Hunger of the Gods · 48</summary><h2>Flight from the breakfast table</h2><p>Skapti’s warning about Skalk and narrowed gaze make him fear exposure. He overturns the breakfast table into Hakon, throws ale at Kalv and escapes through the provisions room, dropping barrels which trip Gudrun. At the canal, with Kalv and Gudrun behind and Skapti and Hrolf to either side, he dives into the water.</p></details><details><summary>The Hunger of the Gods · 48</summary><h2>Flight from the breakfast table</h2><p>He frees his arm from his weapons belt and swims underwater for an estimated thirty or forty heartbeats before reaching the muddy opposite bank. Hrolf brings a boat for the pursuers. Exhausted, Guðvarr runs through the tannery and uphill towards Skalk at the tower.</p></details><details><summary>The Hunger of the Gods · 48</summary><h2>Flight from the breakfast table</h2><p>Knocked into a cart, he kicks Kalv’s face to escape an ankle-grip, then throws an intervening trapper into him. The later red seax and discarded body leave the bystander’s fate uncertain. A head blow drops him; Hrolf retrieves a bloody-poll axe and raises it at an unnamed voice’s order. A spear kills Hrolf before the stroke; Guðvarr does not identify its thrower.</p></details><details><summary>The Hunger of the Gods · 48</summary><h2>Flight from the breakfast table</h2><p>As Skalk and the guards arrive, Kalv’s darkening eyes, thickening neck and shoulders and curling teeth reveal a change Guðvarr recognises as Tainted. He freezes and wets himself as Kalv charges. An unnamed voice and fiery net interrupt the attack. Skalk, now unbandaged and scarred, explains the restraint’s tightening.</p></details><details><summary>The Hunger of the Gods · 48</summary><h2>Flight from the breakfast table</h2><p>He tells Skalk that Kalv is Drekr’s messenger to Hakon, without narrating a fuller report of the inn conversation. He thinks Kalv is trying to kill himself against the net. Skalk strikes Kalv limp, changes the fiery net to thin cord after a spoken phrase and orders the captive carried and Guðvarr to follow. Guðvarr remains bleeding from the head; no interrogation or release is shown.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>Still urine-damp in the tower, he sees Kalv chained for interrogation. His arm entry has become a white-ridged scar; he believes the hyrndur remains within. He retches as Sturla smashes toes and repeats Drekr’s job-done/be-ready message, wanting the torture to stop.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>When Hakon denies the meeting and Helka rejects his unsupported testimony, he reveals the hidden head mark. Helka’s inspection exposes a dragon tattoo matching Kalv’s. Hakon’s disclosures then connect Drekr, the dragon-born, the children and Lik-Rifa’s release. Frek kills Kalv, and Hakon supplies secondhand Nastrandir directions.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>He expects the exposed secrets to earn release from the hyrndur bargain, but remembers Sigrún’s warning about becoming useless. Hearing the plan for Orna intensifies his fear of being silenced. He proposes acting as Hakon’s replacement messenger to Nastrandir to obtain a return message. Skalk praises his guile, without explicitly commissioning him or removing the insect.</p></details><details><summary>The Hunger of the Gods · 60</summary><h2>Guðvarr taken into Nastrandir</h2><p>He reaches Nastrandir after travelling with Frek, who sends him alone near the peninsula. A frost-spider web traps him and he wakes bound. Drekr frees him after his Hakon-messenger performance. Fain and Storolf grieve when he reports Kalv&#x27;s death; he infers kinship without an explicit family explanation.</p></details><details><summary>The Hunger of the Gods · 60</summary><h2>Guðvarr taken into Nastrandir</h2><p>He kneels before Lik-Rifa&#x27;s dragon return, feeling the hyrndur stir. He delivers the false suicide story and shows the dragon tattoo coiled around his arm. Ilska suspects a ruse, but he thinks the god believes him. No confirmed safety, removal of the hyrndur or next assignment is shown.</p></details><details><summary>The Hunger of the Gods · 77</summary><h2>Orna raised and the battle above Darl</h2><p>He returns for Orna&#x27;s raising and witnesses the blood-and-rune resurrection and dragon attack. Hakon accuses him of a nine-day false timetable. After Sigrún stabs Helka, he kills Hakon and attacks Estrid, but she fights effectively and the gods&#x27; crash separates them.</p></details><details><summary>The Hunger of the Gods · 77</summary><h2>Orna raised and the battle above Darl</h2><p>He admits betrayal to Skalk and reports Lik-Rifa exposed his mission through the hyrndur and removed it painfully. Skalk&#x27;s recall produces no creature, and the entry scar is fresh again. Yrsa knocks him aside before he strikes Skalk; he survives the wreckage but loses sight of both. His all-vaesen creation claim remains an attributed generalisation.</p></details><details><summary>The Fury of the Gods · 2</summary><h2>At Darl, the hyrndur scar is peeling and no longer painful, though nightmares persist</h2><p>At Darl, the hyrndur scar is peeling and no longer painful, though nightmares persist. He recommends flattery to Sigrún as they seek safety under Lik-Rifa. He witnesses her massacre of Helka&#x27;s captive drengrs and Glunn&#x27;s killing of Svard. Invited to the god&#x27;s meal under the mistaken name Guthlaf, he follows his aunt into the hall, fearing unproven mind-reading.</p></details><details><summary>The Fury of the Gods · 8</summary><h2>The gathering in the Galdur tower</h2><p>At the tower meal he corrects Lik-Rifa&#x27;s repeated Guthlaf misnaming and fears her momentary jaw change before she praises him. He boasts that he held Skalk at swordpoint, but the narration states Yrsa held him instead. After Sigrún volunteers them, Ilska assigns them to hunt Estrid and Skalk with Krúsa, her clan and vaesen. He feels both relief at leaving and fear of the mission; departure is not yet shown.</p></details><details><summary>The Fury of the Gods · 18</summary><h2>The hunters turn towards the Slågen</h2><p>Five days out from Darl, he rides with Sigrún and Krúsa’s force after a track-and-farmer lead turned the hunt west. He fears the trained fugitives and resents Krúsa’s authority. At an ash-tree glade he hears her creation account and thinks the leaves seem to warn them away; this impression is not confirmed speech. Saddle soreness and a raw cold-chafed nose add to his wish for the safety and respect he remembers in Fellur.</p></details><details><summary>The Fury of the Gods · 18</summary><h2>The hunters turn towards the Slågen</h2><p>When a spider enters the tree and falls with curled legs, he calls it dead. A Froa emerges and summons vines against the hunters. Sigrún tries to save a strangled drengr, but Guðvarr pulls her away, helps her mount and flees. He sees the others following and wishes himself back in Fellur; pursuit and losses remain unresolved.</p></details><details><summary>The Fury of the Gods · 20</summary><h2>He argues himself out of calling his earlier flights cowardice, then startles at a branch and spider</h2><p>He argues himself out of calling his earlier flights cowardice, then startles at a branch and spider. At camp he hears Munni’s report and reads the six-digit hand-counting as thirty-six, which the scout immediately qualifies. He and Sigrún fear reliance on vaesen and privately plan for Krúsa to face the first danger, but Krúsa orders them to lead instead.</p></details><details><summary>The Fury of the Gods · 20</summary><h2>He argues himself out of calling his earlier flights cowardice, then startles at a branch and spider</h2><p>On the narrow woodland approach he fears an ambush while Sigrún tells him to master his fear. At a boulder-filled glade he recognises Skapti, approaches with sword levelled and hears an offer of information. No attack, agreement or actual intelligence is supplied before the ending.</p></details><details><summary>The Fury of the Gods · 31</summary><h2>The hunters enter Jarnvidr</h2><p>He reaches the Slågen bridge facing Jarnvidr and urges letting Krúsa lead, but Sigrún insists fame and all-sided ambush risk favour their apparent leadership. He distrusts Skapti and questions his new messenger role for Skalk. Inside the towering forest he is relieved when Sigrún calls the trees birch/alder rather than ash, and stays on the road during a disturbance. He proposes feeding or killing the captured Faunir; Krúsa rejects both. As they continue with a hostage he fears Skalk, Skapti and possible unseen Faunir, wishing for Fellur.</p></details><details><summary>The Fury of the Gods · 34</summary><h2>He hears the hostage’s insults and offers Járn money to kill it, but Sigrún stops him</h2><p>He hears the hostage’s insults and offers Járn money to kill it, but Sigrún stops him. At the meeting he recognises Frek, Yrsa and Sturla and hates Skalk, disputing that his old service was voluntary alliance. He hears the survival proposal and reported wolf intelligence. Faunir splinters wound his forearm; he cuts an attacker from his leg and rides through those around Sigrún, opening her way. He escapes down the entry road and sees the hostage freed behind him. No wound treatment is shown.</p></details><details><summary>The Fury of the Gods · 41</summary><h2>He rides near Sigrún as the injured, reduced party returns</h2><p>He rides near Sigrún as the injured, reduced party returns. Biórr sees bandaged riders collectively but no specific new wound or healing state is assigned to Guðvarr in this view. The leaders report their forest battle and negotiation to Lik-Rifa.</p></details><details><summary>The Fury of the Gods · 45</summary><h2>He approaches the Iron Wood from the north with Sigrún and the host, dreading the return</h2><p>He approaches the Iron Wood from the north with Sigrún and the host, dreading the return. He tends his horse and watches Drekr’s welcome at the campfires, wondering whether affection or fear underlies the respect. With his aunt he admits difficulty resisting flight; she acknowledges fear and recalls his survival. At dawn an unidentified tennúr warns that they are coming. He wonders if it is Munni, then runs back to Sigrún; no enemy is identified yet.</p></details><details><summary>The Fury of the Gods · 47</summary><h2>He sees Orka and Drekr duelling, but Lif intercepts his attempt to strike Orka while distracted</h2><p>He sees Orka and Drekr duelling, but Lif intercepts his attempt to strike Orka while distracted. Lif wounds his cheek/ear, shoulder and calf; Guðvarr’s tackle and strangling fail when Lif strikes him with a shield. A spearwoman helps Lif stand before the dragon landing separates them. Dizzy and hurting, Guðvarr calls the wounds scratches to Sigrún, takes another shield and follows her. He witnesses the runic disappearance and tracks ending, then mistakes the approaching giant rat for Ulfrir before recognising Rotta.</p></details><details><summary>The Fury of the Gods · 55</summary><h2>The siege begins at the river</h2><p>He arrives at dawn with Sigrún and sees the ready river defences, feeling pride, dread and as though the silent line watches him. After hearing the ladder/raft plan he cuts an elm trunk while Járn and others prepare branches. Arrival is actual, but successful surprise is not established.</p></details><details><summary>The Fury of the Gods · 55</summary><h2>The siege begins at the river</h2><p>A nearby Froa’s root and vine attacks leave him transfixed. Lik-Rifa descends and is marked by vines, then uproots a nearby ash as the spirit collapses still. He kneels with ears covered at her roar; no new injury, recovery or main siege breach is shown.</p></details><details><summary>The Fury of the Gods · 57</summary><h2>Rafts and ladders reach the defences</h2><p>Waiting beside a stream outside the trees, shield on back and spear in hand, he struggles with fear/shame as he watches raft attacks and skraeling vaulting onto the gate walkway. He sees an unnamed huge black-skinned defender throw one back onto the ladder parties. Spertus crowd the stream towards the river; Rotta passes with Biórr and about twelve others without revealing a destination. Sigrún calls the crew and its two rafts forward, and Guðvarr hesitantly follows, before any crossing of his own.</p></details><details><summary>The Fury of the Gods · 59</summary><h2>Across the wall towards the hall</h2><p>He makes the raft crossing into icy knee-deep water but is shoved into the corpse-filled ditch, falls, loses his spear and hits his head against his shield. Using shield/fist to climb the mud, he reaches the wall without a defender directly facing him and hauls himself over, exhausted. A spertus approaches but leaves when Sigrún finds him after his plea of friendship; no immunity rule or new diagnosed wound is established.</p></details><details><summary>The Fury of the Gods · 59</summary><h2>Across the wall towards the hall</h2><p>Drawing his sword, he follows Sigrún down timber steps to the hill-side track and joins her ten-wide shield front. His sword glances off an enemy helm and an axe pulls his shield down; a spertus stings the spearman threatening him. The opposing wall breaks under the flying creatures, and he tempers his elation with recognition of their help. He sees the gate unbarred and Raven-Feeders enter, then Elvar’s host waiting before the huge hillside door.</p></details><details><summary>The Fury of the Gods · 71</summary><h2>Guðvarr finds Estrid</h2><p>Entering at dawn with Sigrún, he fears the host is losing, an impression rather than a counted result. She joins Estrid’s shield wall; he locks shields but an unnamed black bull-man/two Berserkir smash the formation and throw him aside. His shield is lost, and he rises with the sword as staff. A maimed drengr might be Járn in his uncertain glance, not an identified death.</p></details><details><summary>The Fury of the Gods · 71</summary><h2>Guðvarr finds Estrid</h2><p>He finds Estrid alive with a forehead cut and recalls her earlier humiliation of him. Pretending to lean on his sword, he drives it into her throat, then kneels, holds/pins her down under a show of comfort until she dies. He retrieves the sword, smiles and watches the burning Froa collapse, dragon break free and carry Rotta up the hall. No new diagnosed personal injury or exit is shown.</p></details><details><summary>The Fury of the Gods · 78</summary><h2>The shattered enemy camp</h2><p>Alive and exhausted, he rests by a fire after removing mail/belt in the snow-damaged enemy camp, with an available shield again but no narrated recovery. He estimates over half the host lost and fears Snaka even while thinking him on their side. Sigrún brings death reports; he hides joy at Skalk’s end and falsely frames Estrid’s death as part of the bull-man charge, concealing his own murder.</p></details><details><summary>The Fury of the Gods · 78</summary><h2>The shattered enemy camp</h2><p>He sees wounded human Lik-Rifa/Rotta follow Snaka’s imposing scale-mottled human form. Feeling compelled to kneel and swear, he finally kneels after the two gods acclaim their father as king. No formal oath rite or independent proof of world-ownership follows.</p></details><details><summary>The Fury of the Gods · 82</summary><h2>Sigrún frees his mail from his beard-ring and helps him arm</h2><p>Sigrún frees his mail from his beard-ring and helps him arm. Heðin’s destruction of a stone guardian and the Battle-Grim’s approach frighten him; an unnamed older axeman breaks his shield and splinters his cheek. His dodge displaces a fellow defender who is killed, opening the line. Hiding beneath remnants, he sees Sigrún wounded, a thinning-haired foe killed and Krúsa decapitated.</p></details><details><summary>The Fury of the Gods · 82</summary><h2>Sigrún frees his mail from his beard-ring and helps him arm</h2><p>He finds Sigrún breathing and drags her a dozen paces, then leaves her groaning/semi-conscious, hoping someone will help if their side wins. He retrieves sword and takes another shield, but Lif bars his route with shield/spear and vows revenge for father/brother. No duel outcome or return home follows.</p></details><details><summary>The Fury of the Gods · 85</summary><h2>Lif’s reckoning with Guðvarr</h2><p>Facing Lif, he boasts of warrior training and offers mercy, then asks to negotiate after Lif invokes his family’s murders and Orka’s teaching. A spear splits chest-mail rings; he forces Lif toward a spider and smiles while walking off when it knocks him down. Lif returns alive, trips him with the spear and defeats his sword/shield.</p></details><details><summary>The Fury of the Gods · 85</summary><h2>Lif’s reckoning with Guðvarr</h2><p>An axe-top strike breaks a tooth and cuts from mouth to ear, side unspecified. He drops his sword and pleads holmganga forfeit, offering mail/sword/anything. Lif demands father/brother back and brings the axe down; Guðvarr’s death is strongly implied, with no post-blow aftermath explicitly narrated.</p></details><details><summary>The Fury of the Gods · 88</summary><h2>Thorkel avenged and the final advance</h2><p>Lif’s return with a blooded axe and confirmation to Orka that it is done reinforce the earlier strongly implied death as a participant report. No new direct corpse or burial scene is supplied.</p></details><details><summary>Illustration · The Fury of the Gods · 45</summary><p><a href="assets/88de86a7eac9db.jpg">Open noncanonical illustration</a></p><p>Sigrún admitting fear and encouraging Guðvarr.</p></details><details><summary>Illustration · The Fury of the Gods · 59</summary><p><a href="assets/26216e2f177e2d.jpg">Open noncanonical illustration</a></p><p>The shield wall before the hillside entrance.</p></details><details><summary>Illustration · The Hunger of the Gods · 23</summary><p><a href="assets/90f46a250174ce.jpg">Open noncanonical illustration</a></p><p>Skalk and Guðvarr arrive at the tower workroom doorway.</p></details><details><summary>Illustration · The Shadow of the Gods · 10</summary><p><a href="assets/40dcf60e64910a.jpg">Open noncanonical illustration</a></p><p>Guðvarr arriving for the Althing, before the duel.</p></details><details><summary>Illustration · The Hunger of the Gods · 23</summary><p><a href="assets/f57fe9f63e6580.jpg">Open noncanonical illustration</a></p><p>Guðvarr lies restrained as the hyrndur is lowered towards him.</p></details><details><summary>Illustration · The Fury of the Gods · 82</summary><p><a href="assets/886c07126fc4ce.jpg">Open noncanonical illustration</a></p><p>Heðin reducing one stone guardian’s head to rubble.</p></details><details><summary>Illustration · The Fury of the Gods · 55</summary><p><a href="assets/76b7c5c0aeddd9.jpg">Open noncanonical illustration</a></p><p>The ash being uprooted as the local spirit falters.</p></details><details><summary>Illustration · The Hunger of the Gods · 45</summary><p><a href="assets/5bf672d186e06e.jpg">Open noncanonical illustration</a></p><p>Guðvarr takes fresh ale during an early circuit of Hakon&#x27;s shield-dance.</p></details><details><summary>Illustration · The Fury of the Gods · 20</summary><p><a href="assets/1e9a1f0628dd52.jpg">Open noncanonical illustration</a></p><p>Skapti’s still-undisclosed offer in the boulder glade.</p></details><details><summary>Illustration · The Fury of the Gods · 78</summary><p><a href="assets/9b5bd529e2431f.jpg">Open noncanonical illustration</a></p><p>Snaka’s human form in the snowy enemy camp.</p></details><details><summary>Illustration · The Fury of the Gods · 57</summary><p><a href="assets/6f5f69946c0541.jpg">Open noncanonical illustration</a></p><p>The spertus crowding the tributary.</p></details><details><summary>Illustration · The Fury of the Gods · 18</summary><p><a href="assets/a3dffdca08899d.jpg">Open noncanonical illustration</a></p><p>The first vines erupting in the ash-tree glade.</p></details><details><summary>Illustration · The Fury of the Gods · 71</summary><p><a href="assets/43824082300f3e.jpg">Open noncanonical illustration</a></p><p>The unnamed attackers breaking the joined shield line.</p></details><details><summary>Illustration · The Fury of the Gods · 85</summary><p><a href="assets/86b191f404cd06.jpg">Open noncanonical illustration</a></p><p>The remaining stone guardian leaping onto the rat.</p></details><details><summary>Illustration · The Fury of the Gods · 55</summary><p><a href="assets/fe8aa15a09c00e.jpg">Open noncanonical illustration</a></p><p>The defended bank seen by the arriving host.</p></details></noscript>
