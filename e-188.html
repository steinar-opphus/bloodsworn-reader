      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 43</summary><h2>Introduction</h2><p>An unnamed old, grey-bearded, red-eyed man emerges from the guarded tunnel with a dozen mailed warriors. He wears dark mail, a helmet with mail neck-guard, a cloak and many silver and gold arm rings, and carries a long curved bone sword. His helmet later exposes a shaved head. His identity is unestablished at that encounter.</p></details><details><summary>The Shadow of the Gods · 43</summary><h2>Story and connections</h2><p>He hurls Glornir back, cuts Røkia&#x27;s spear from the air and defeats Vol&#x27;s protective rune. Varg drives a cleaver into his head as the man&#x27;s sword strikes Varg at the waist; the chapter does not provide a later confirmation of either man&#x27;s condition.</p></details><details><summary>The Shadow of the Gods · 45</summary><h2>Waking among the wounded</h2><p>In chapter 45 Torvik identifies the slain swordsman as dragon-born. At that point his personal name and any connection to earlier attackers remain unknown.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>Edel identifies the old man Varg struck with his cleaver as Ilska and Myrk’s father, and Varg recognises the implication for himself. This dates the family identification to the Liga conversation for Varg’s knowledge. The man’s personal name and any identity with the earlier unnamed red-eyed attacker remain unestablished.</p></details></noscript>
