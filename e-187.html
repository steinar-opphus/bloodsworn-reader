      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 45</summary><h2>Introduction</h2><p>Vali is one of the two shrouded dead Bloodsworn in the catacomb after the troll battle.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>Varg remembers him explicitly as Vali Horse-Breath, Halja’s brother, killed by the troll’s club at Rotta’s chamber. The memory prompts thoughts of Frøya and blood feud. The sibling relationship was already described in chapter 41 of the first book; this is renewed recollection rather than a new kinship disclosure.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>At the farm Halja says skraeling were at Rotta’s chamber when her brother died, links them with the dragon-born and says she will kill them for Vali’s sake. This is her named recollection and vengeance motive, not a new death or a replacement for the earlier troll account.</p></details></noscript>
