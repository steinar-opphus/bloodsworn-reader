      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 1</summary><h2>Introduction</h2><p>Breca is Orka and Thorkel&#x27;s son, ten summers old according to his father.</p></details><details><summary>The Shadow of the Gods · 1</summary><h2>Appearance</h2><p>He has grey-green eyes and crow-black hair.</p></details><details><summary>The Shadow of the Gods · 1</summary><h2>A child meeting the wider world</h2><p>On the hunt, Breca&#x27;s spear hits a tree instead of the reindeer. He has helped slaughter animals for food, but Asgrim is the first dead person he has seen. His question at the steading is where Harek has gone, the boy he has played with on Fellur&#x27;s beach.</p></details><details><summary>The Shadow of the Gods · 3</summary><h2>News of Harek brought to Fellur</h2><p>Orka gives him the pony and wagon to lead back to Fellur, focusing his attention after what he has seen. Before the gathered villagers, he says that Harek has been taken.</p></details><details><summary>The Shadow of the Gods · 6</summary><h2>A tooth given to Vesli</h2><p>Hearing an injured tennúr scream leads him to the creature he later calls Vesli. He gives her a loose first tooth and asks whether the family can keep her.</p></details><details><summary>The Shadow of the Gods · 15</summary><h2>Weapons lessons and mercy for a moth</h2><p>Anger at Guðvarr and Sigrún makes him want to learn sword craft, yet he also argues that a trapped creature facing death deserves help. His appeal persuades Orka to free a moth from a web. He wears a small wooden sword pendant and later carries the dishes to the stream with Vesli riding on the load.</p></details><details><summary>The Shadow of the Gods · 17</summary><h2>Taken from the burning steading</h2><p>After the attack on the steading, Thorkel tells Orka that Breca has been taken. A captive later names Drekr and says the boy was carried onto the river, but claims not to know the route or destination. That testimony is obtained under violent coercion.</p></details><details><summary>The Shadow of the Gods · 53</summary><h2>Still missing after Grimholt</h2><p>At the end of book one, Orka tells Glornir her son was taken and says the person she seeks is not at Grimholt. The children she has found do not establish that Breca is among them or has been recovered.</p></details><details><summary>The Hunger of the Gods · 1</summary><h2>Rest and restraint in the burned hall</h2><p>Orka explicitly says he is Tainted and carries her wolf-blood.</p></details><details><summary>The Hunger of the Gods · 3</summary><h2>Mord&#x27;s burial and a blood feud</h2><p>Glornir calls him his nephew; Orka says he is ten winters and describes him as thoughtful and kind.</p></details><details><summary>The Hunger of the Gods · 15</summary><h2>The search through Rotta&#x27;s chamber</h2><p>At the excavation’s children’s room, Spert and Vesli investigate one small mattress and Spert says Breca was there. Orka recognises the trace and remembers his large eyes and raven-dark hair. This adds a past holding place to the search without locating him now.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>He is directly shown alive in Lik-Rifa’s northern camp in Biórr’s viewpoint, after Ilmur tracks a runaway and a member of Drekr’s crew brings him back. Pale-faced and estimated at ten or eleven winters, he bites his captor’s hand and runs. A thrown knife, still in its scabbard, strikes his head and knocks him down.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>His captor kicks and beats him, breaking his nose. Biórr urges that he has had enough, but the violence continues. Breca draws the knife thrown at him and cuts the man’s arm; the man punches his chin and stamps on his knife-hand, breaking bones. No new supernatural ability is demonstrated.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>He twice insists on Breca Thorkelsson when ordered to accept only Breca and abandon his parents and past. The patronymic is newly disclosed here. His captor pins his throat and chest with a knee, grips his crow-black hair and cuts his cheek deeply below one eye; the side is unspecified and the eye itself is not said to be cut.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>The captor identifies himself as Brák Trolls-Bane and says the cut will scar for life as a warning against running. Breca says he will not forget. This is a fresh injury and a threat of future scarring; no healed scar, escape, rescue or later recovery is shown. Orka does not receive this information in the chapter.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>Orka imagines him killed when Myrk mentions the ritual’s blood requirement, but that is fear rather than an event. Myrk says no Tainted children died and infers Orka’s son is alive, while admitting she cannot identify him among them. The claim is not a new direct view of Breca.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>Myrk reports that the son was with Ilska north of the bridge when she left and gives an earlier plan for a westward rendezvous off the Iskalt Islands. Orka is relieved by a target but doubts its truth. This is her new lead, not a confirmed present location, reunion or cure of the injuries already shown in Breca’s own camp scene.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>He now rides with Kráka and Bjarn, his broken hand wrapped in linen around wooden splints. The treatment does not establish healing or the injured side. No further child has tried to escape since his beating, though Biórr cannot tell whether fear or acceptance accounts for that.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>He challenges Biórr’s safety assurance by asking about the dragon, then offers to play tafl despite one injured hand. Choosing the jarl, he says he needs escape practice and insists he is not joking. Kráka warns that such talk could get his other hand broken. Her words remind him of his father and he cries; no second hand is injured here.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>He takes some raiders early but Biórr surrounds his jarl. Told to use strategy and position rather than aggression, he requests another game. Its result and any real successful escape are not shown.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>During Lik-Rifa’s exercise he shuts his eyes, weeps and clenches his unbroken hand, then growls. Last to open his eyes, he tells Kráka he feels wolf and bear. She looks startled and squeezes his good hand. The narration calls feeling both parental bloodlines rare and valued; Biórr predicts future strength and cunning. This is Breca’s report and others’ reactions, not a complete transformation or tested set of powers. Orka learns nothing of it in this scene.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>At Starl Orka tells Uspa of his abduction and learns Bjarn was taken too. She concludes the boys are together, without seeing them or learning the reader’s details of Breca’s injuries and later bloodline experience. Elvar’s report of eastward tracks challenges the westward route Orka has been following; Nastrandir is proposed as a possible destination, not Breca’s confirmed present location. No rescue or reunion occurs.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>Nastrandir revealed in the snow</h2><p>He walks beside the struggling carts with the squat camp boy Harek. One hand remains wrapped in splints and linen; no side or complete healing is supplied. When Storolf makes the children laugh, Breca smiles and a red-wealed scar beneath one eye moves. This is a later appearance of the known cheek cut, not a fresh second cut or newly fixed eye side.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>Nastrandir revealed in the snow</h2><p>He remains with the travelling company as it reaches Nastrandir’s revealed entrance. No escape, reunion with Orka or interior visit is shown, and Orka receives no new account of his condition here.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>He is directly shown at Nastrandir’s feast beside his friend Harek. Harek joins some children in cheering Lik-Rifa’s declared cause, while Breca glowers. The contrast does not establish Harek’s free allegiance or a fresh escape plan for Breca; no reunion with Orka occurs.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>At the training demonstration he stands between Harek and Bjarn and correctly identifies Biórr’s use of the shield to get inside an axe’s reach. He wants sword-craft and infers Biórr won his blade from an enemy. Saying he intends to win one, he looks towards Brák’s sparring; Storolf tells him to let it go. A challenge or precise revenge plan is not spoken or carried out.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>He joins the children taking shields and practice weapons and pairing up under instruction. Rotta’s intervention is followed by more painful aggression. Participation does not establish full healing of the previously injured hand, successful escape, free choice or rescue.</p></details><details><summary>The Hunger of the Gods · 58</summary><h2>Biórr&#x27;s rat senses and a captured message</h2><p>He demands Bjarn&#x27;s release, shows green-brown eyes and sharp teeth, and tackles Brák after being slapped. Rotta lifts and subdues him, tells him to control his beast and returns him to the crowd. Bjarn then rejoins him and Harek.</p></details><details><summary>The Hunger of the Gods · 62</summary><h2>The army departs for Svelgarth</h2><p>Myrk&#x27;s account of Orka brings him hope. With amber-green eyes he claims to smell Drekr&#x27;s fear, then Drekr strikes him to the ground. Myrk threatens him, but Rotta argues for keeping him alive as bait for his mother; no reunion follows.</p></details><details><summary>The Hunger of the Gods · 72</summary><h2>The army gathers below Svelgarth</h2><p>Orka sees children at the army&#x27;s wagons and believes he is among them, but no individual sighting occurs from the ridge. She prepares to enter the camp to extract him.</p></details><details><summary>The Hunger of the Gods · 74</summary><h2>The gate falls and the children flee</h2><p>Orka directly finds and embraces him; he is taller and thinner, with a scar below one eye. He asks for his father and understands Orka&#x27;s shaken head. He joins the escape, helps locate Bjarn, urges other children to flee and unsuccessfully calls Harek, who instead raises an alarm. Their final exit is not yet shown.</p></details><details><summary>The Hunger of the Gods · 76</summary><h2>Captives before Rotta</h2><p>Rotta captures, strikes and threatens him to coerce Orka. His talons and amber-green eyes show wolf fury with an unidentified additional element. Spert guides him back to Orka during the giant-rat disruption, and they run into the woods.</p></details><details><summary>The Hunger of the Gods · 78</summary><h2>Escape through the river valley</h2><p>He identifies bear alongside wolf in his blood, resolving the additional quality Orka previously sensed. In battle fury he kills a frost-spider attacking her with claws and teeth. When venom immobilises her, he tries to carry her towards the lake. Orka throws him into the river; he resurfaces and is swept from view. His next destination remains unknown.</p></details><details><summary>The Fury of the Gods · 4</summary><h2>A prisoner outside Svelgarth</h2><p>Orka, now captive, believes the river carried him to the lake rendezvous and that he escaped with the others. This is her inference, not a new sighting. Rotta says he escaped and plans to find him to coerce her. The final group of bound children is not individually identified here.</p></details><details><summary>The Fury of the Gods · 5</summary><h2>The dead and the choice of revenge</h2><p>Brák reports finding no trace of him beyond Orka&#x27;s capture point; he is absent from the recaptured group. The hunter&#x27;s guess that he drowned or froze after entering the river is not a death confirmation. Rotta orders him found and Brák resumes pursuit. No lake reunion or capture is shown.</p></details><details><summary>The Fury of the Gods · 15</summary><h2>He is directly sighted alive at the treeline, beckoning to Orka during the battle</h2><p>He is directly sighted alive at the treeline, beckoning to Orka during the battle. After her fatal fight with Myrk he stands over her with a hand-axe, touches her, calls Mama and takes her hand to urge her away. Lif, Halja, Gunnar and Sæunn accompany him. His survival and reunion are established, but a completed escape is not.</p></details><details><summary>The Fury of the Gods · 16</summary><h2>Wrapped in thick furs, he helps Orka to her feet with the protective group around her</h2><p>Wrapped in thick furs, he helps Orka to her feet with the protective group around her. Later he rushes from behind a wagon and kills a skraeling attacking her, continuing to hack at its corpse. She lifts him by his cloak and stops him; his eyes blaze amber and green before he calms. This mixed colour supplies no named additional divine lineage.</p></details><details><summary>The Fury of the Gods · 17</summary><h2>After calming, he explains that he killed to protect Orka</h2><p>After calming, he explains that he killed to protect Orka. Seeing Harek kindles his eyes amber and green again until she restrains him. Later he calls Bjarn from the wagon, boards with Lif’s help and tries to go back when Harek tackles Bjarn into the reeds, but Orka stops him.</p></details><details><summary>The Fury of the Gods · 17</summary><h2>After calming, he explains that he killed to protect Orka</h2><p>Safe from the bank aboard the escaping ship, he vomits and trembles. He says he could not leave without his mother. She embraces him and kisses away his tears, and he holds her fiercely. Their escape is established, but no final destination is reached.</p></details><details><summary>The Fury of the Gods · 22</summary><h2>Breca’s training and Orlyg’s passengers</h2><p>He trains with Gunnar’s too-large shield and a short-hafted axe, then struggles with amber-and-green eyes when mocked. Orka warns that loss of control risks enslavement. She returns his wooden sword pendant; the reminder of the time before his father’s death brings tears and an embrace. Lif is assigned to continue his shield training. No discovery of his ancestry by Orlyg is shown.</p></details><details><summary>The Fury of the Gods · 26</summary><h2>Lif defeats his impulsive spear rush, and Orka tells him to use his wits</h2><p>Lif defeats his impulsive spear rush, and Orka tells him to use his wits. He says Biórr taught him tafl strategy. Grieving his father, he hugs Orka and asks about going home to bury Spert; his pleading has led her to preserve the body rather than bury it at sea. He resumes practice and later lasts longer, without mastery or guaranteed future safety.</p></details><details><summary>The Fury of the Gods · 28</summary><h2>Orlyg joins the sea battle</h2><p>Orka obtains a dead warrior’s shield and nasal helm for him, padding and strapping the oversized helmet; no brynja fits, so he has wool, leather and fur, a hand-axe and a small seax. He hears her account of their parents’ broken Bloodsworn oaths and calls the company their pack. Though frightened, with amber flickering in his eyes, he insists on fighting. Lif and Sæunn are assigned to guard him; he nevertheless slips forward to strike an enemy whom Halja finishes. No new injury is described.</p></details><details><summary>The Fury of the Gods · 29</summary><h2>He reaches Sea-Wolf with Orka’s rescue group and fights with his oversized shield and hand-axe</h2><p>He reaches Sea-Wolf with Orka’s rescue group and fights with his oversized shield and hand-axe. When he rushes at the advancing rune-wielder, Orka seizes his tunic and pulls him out of the caster’s path. No successful strike against the magical protection is shown.</p></details><details><summary>The Fury of the Gods · 30</summary><h2>He is alive beside Orka after the blast</h2><p>He is alive beside Orka after the blast. She draws him away from the approaching sea serpent, then explains the mother’s hunting demonstration to him. Vesli returns and hugs him; he says he missed her too. When she asks for Spert he cries and shakes his head, conveying their loss without a new spoken account of the killing.</p></details><details><summary>The Fury of the Gods · 32</summary><h2>Orka introduces Glornir as Thorkel’s brother and therefore his uncle</h2><p>Orka introduces Glornir as Thorkel’s brother and therefore his uncle. Glornir calls him his brother’s son and Breca Thorkelsson, holds him on a knee and weeps; Breca calls him Uncle and brushes away a tear. The narration calls his eyes dark here, retained as variation alongside earlier grey-green descriptions without asserting a permanent change. He reports Drekr went to Darl with Lik-Rifa. Later he helps Orka clear an enemy body and watches the sea burials.</p></details><details><summary>The Fury of the Gods · 37</summary><h2>Life aboard Sea-Wolf</h2><p>With Orka’s permission he spars against Einar using shield and a short spear with leather cap over its blade. Balanced movement, a butt strike and cheek/nose rake draw blood, though no cap removal is narrated. Refna attacks over Einar’s hurt; Breca’s eyes flicker amber/green as he snarls back. Orka lifts him clear and her command calms him. Neither full transformation nor a lasting feud is established.</p></details><details><summary>The Fury of the Gods · 39</summary><h2>He holds Orka’s oar and pretends to row with Vesli eating teeth on his lap</h2><p>He holds Orka’s oar and pretends to row with Vesli eating teeth on his lap. He asks for a real shift, pointing to Refna, but Orka refuses and warns that an unpractised rower can break rhythm, oars or someone’s arm. No such accident actually occurs.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>He is among the landing company with Vesli on his shoulder</h2><p>He is among the landing company with Vesli on his shoulder. No new fight, rowing permission or eye-colour statement is given.</p></details><details><summary>The Fury of the Gods · 43</summary><h2>Orka presents him to Elvar as recovered, carrying an oversized back shield, short spear and belt axe</h2><p>Orka presents him to Elvar as recovered, carrying an oversized back shield, short spear and belt axe. Elvar calls him fierce like his mother; the compliment does not establish a new lineage, fight or mastery.</p></details><details><summary>The Fury of the Gods · 48</summary><h2>Return from the sortie</h2><p>Varg sees him with Orka after the raiders return, carrying a meal and cup towards the Bloodsworn’s sleeping chambers. No new abduction or participation in the sortie is described.</p></details><details><summary>The Fury of the Gods · 52</summary><h2>The choice to hide the beast</h2><p>He proposes collar cover for Orka and reports hearing both bear and wolf when angry, which Glornir calls rare. They discuss Thorkel, blood/oath kinship and his resemblance to his father; no full transformation is shown. He relays Ákveðin/others’ freedom talk. During the dawn alarm he stays near Orka with spear/shield and, at the fleet wreckage, notices Broðir moving strangely towards Elvar. His warning prompts Orka’s shout before the attack; no new injury to him is recorded.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>Salvage and a choice about freedom</h2><p>He is among the present Bloodsworn whose changing eyes/teeth/claws make their Tainted nature public before Elvar. The group description does not assign him a new specific full transformation. Earlier he and Orka search the wreckage and depart with a barrel, contents not identified by Elvar.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>Vesli embraces him and kisses his cheek beside Orka on the defended wall</h2><p>Vesli embraces him and kisses his cheek beside Orka on the defended wall. Drekr’s threat against mother and son reaches the defenders at parley, without its promised outcome occurring here.</p></details><details><summary>The Fury of the Gods · 58</summary><h2>Holding the gate walkway</h2><p>He defends with shield/spear against skraeling as Vesli and Orka intervene, and helps stab the one Orka tackles. He grips her long-axe to push a ladder, but their combined strength is insufficient until Einar joins and all three topple it. No new wound or subsequent retreat route is given.</p></details><details><summary>The Fury of the Gods · 61</summary><h2>The shield line under pressure</h2><p>His shield covers Orka’s left as she fights without one using her long-axe; Lif is with him and Sæunn on her right. No new injury or solo killing is assigned to him here.</p></details><details><summary>The Fury of the Gods · 62</summary><h2>The fighting withdrawal</h2><p>He jokes that Orka should heed her own warning about spider bites and promises to stay with her, carrying battered shield/spear and a short belt axe. Lif/Sæunn spear a spider leaping at him. At Orka’s command he runs ahead with those two, Vesli flying above with a short spear. He is not shown bitten or safely inside the hall yet.</p></details><details><summary>The Fury of the Gods · 65</summary><h2>He sits on Glornir’s lap with Vesli on his shoulder during the hall’s post-battle gathering</h2><p>He sits on Glornir’s lap with Vesli on his shoulder during the hall’s post-battle gathering. No new bite, wound or full recovery statement is made.</p></details><details><summary>The Fury of the Gods · 70</summary><h2>The gods collide and the tree burns</h2><p>He stays near Orka, Lif/Sæunn flanking him, and later follows the Bloodsworn push with his short spear, snarling and stabbing. No named individual kill, new wound or final outcome is assigned to him.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>He calls to Orka from a dozen steps behind, Lif/Sæunn guarding him as the fight climbs</h2><p>He calls to Orka from a dozen steps behind, Lif/Sæunn guarding him as the fight climbs. No newly named Breca victim, new wound or complete healing is given; the companies later emerge and charge again.</p></details><details><summary>The Fury of the Gods · 74</summary><h2>Snaka rises and Wolfdales collapses</h2><p>Lif and Sæunn protect him during the hilltop fight; Orka hears cub-like growls, without a complete transformation. When the hill breaks apart she lifts him, reaches the cliff above Falinn and jumps holding him after telling him she loves him. No landing is shown.</p></details><details><summary>The Fury of the Gods · 76</summary><h2>Surviving the plunge into the Falinn</h2><p>He survives the river plunge with Orka and coughs on the bank, then joins Glornir at the treeline, leaning against him under his hand. He asks how to fight Snaka. Vesli’s return brings a happy embrace; the safety of every other missing ally is not yet established.</p></details><details><summary>The Fury of the Gods · 79</summary><h2>A night of repairs and choices</h2><p>Vesli returns from scouting, then curls tired on his lap with a wing over her head/shoulder as he strokes her. The conditional tooth reward is not paid here.</p></details><details><summary>The Fury of the Gods · 83</summary><h2>Skuld’s scissors and the spider’s venom</h2><p>He remains at Orka’s right with Sæunn, then kills the frost-spider pinning her by driving his short spear into its eyes. This directly frees her, without a new full beast transformation or healing claim.</p></details><details><summary>The Fury of the Gods · 86</summary><h2>He approaches with Sæunn and receives one of Orka’s seaxes</h2><p>He approaches with Sæunn and receives one of Orka’s seaxes. His mother deliberately teaches him through the reprisal against the poisoned Drekr, comparing the act to the serpent mother’s example; he brings Drekr down and joins her neck strikes, invoking Papa. No full wolf/bear change or new independence from her direction is shown.</p></details><details><summary>The Fury of the Gods · 88</summary><h2>He stays at Orka’s side after Drekr’s death and follows with the group toward the gods at dawn</h2><p>He stays at Orka’s side after Drekr’s death and follows with the group toward the gods at dawn. No new weapon retrieval, transformation or separate battle outcome is supplied.</p></details><details><summary>The Fury of the Gods · 90</summary><h2>The last assault on Lik-Rifa</h2><p>He fights alongside Orka, then reaches mortally wounded Glornir, calls him Uncle and pleads against another loss like Papa. Glornir asks him to care for his mother. After the death he clings to wounded Orka; no new kinship discovery or full transformation is introduced.</p></details><details><summary>The Fury of the Gods · 91</summary><h2>At home beside his father’s barrow, he says Mama saved him and they avenged Papa</h2><p>At home beside his father’s barrow, he says Mama saved him and they avenged Papa. Orka tells him that he is her home; Vesli lands on his shoulder as the company gathers.</p></details><details><summary>The Fury of the Gods · 92</summary><h2>A home for the Bloodsworn</h2><p>After the funeral gathering he shows Refna Strong-Hands the beehive; later they sit by the stream where Spert lived. Varg includes both children in the company’s case for a permanent home.</p></details><details><summary>The Shadow of the Gods · 1</summary><h2>Personality</h2><p>Orka worries that her son is too gentle for the world around him. When the family reaches the ruined steading, Breca asks where his friend Harek has gone.</p></details><details><summary>Illustration · The Fury of the Gods · 32</summary><p><a href="assets/1ed4d398af7e3c.jpg">Open noncanonical illustration</a></p><p>Breca’s first meeting with his uncle.</p></details><details><summary>Illustration · The Hunger of the Gods · 76</summary><p><a href="assets/c3b26fd9638c5b.jpg">Open noncanonical illustration</a></p><p>Breca displays his altered features before the captives.</p></details><details><summary>Illustration · The Hunger of the Gods · 45</summary><p><a href="assets/30528e1d3c02d7.jpg">Open noncanonical illustration</a></p><p>Breca with his scar and splinted hand during the winter march.</p></details><details><summary>Illustration · The Fury of the Gods · 15</summary><p><a href="assets/2b126d70f04dd9.jpg">Open noncanonical illustration</a></p><p>Orka reaching towards Breca at their reunion; he remains outside the crop.</p></details><details><summary>Illustration · The Fury of the Gods · 76</summary><p><a href="assets/ab304df5413ea2.jpg">Open noncanonical illustration</a></p><p>Breca embracing Vesli at the riverbank regrouping.</p></details><details><summary>Illustration · The Fury of the Gods · 22</summary><p><a href="assets/bb1c585cefdbae.jpg">Open noncanonical illustration</a></p><p>Noncanonical close view of the wooden sword pendant at its return.</p></details></noscript>
