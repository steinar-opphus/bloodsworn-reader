      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 20</summary><h2>Introduction</h2><p>Sigrún describes Iskidan as ruled by Kirill from Gravka; Sergei calls him the Great Khagan and Kirill the Magnificent. In B01-C020, Jaromir names his father Kirill the Great, Khagan of all Iskidan. These are attributed accounts.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>Ilska calls him Kirill the Magnificent and describes him as the emperor ruling Iskidan after its unfamiliar gods’ deaths in the Guðfalla. Her history remains attributed, with no direct scene of the emperor or new confirmed foreign pantheon.</p></details><details><summary>The Hunger of the Gods · 66</summary><h2>Sulich&#x27;s lineage and the ambush</h2><p>Svik names him as the father shared by Sulich and Jaromir; Sulich acknowledges his princely status. Sulich&#x27;s account also identifies Jaromir&#x27;s twin Rurik and describes sibling disappearances attributed to the twins.</p></details><details><summary>The Hunger of the Gods · 70</summary><h2>The pursuit into Valdai</h2><p>Sulich identifies the collared prisoners hidden behind Jaromir&#x27;s chamber tapestry as the Khagan&#x27;s Tainted children and his siblings. Their names and the full scope of the imprisoned family are not supplied.</p></details></noscript>
