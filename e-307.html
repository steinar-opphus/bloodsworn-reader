      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 67</summary><h2>Introduction</h2><p>Sighvat identifies him as chief of the Fell-Hearted. He is tall and mailed, with tangled black hair, a beard covering most of his face and a back-slung shield bearing two knotwork ravens. His peace-making through swift killing is a reputation Sighvat suggests is paid publicity, not a witnessed deed here.</p></details><details><summary>The Hunger of the Gods · 71</summary><h2>The wolf-god wrecks Störr&#x27;s hall</h2><p>He refuses Thorun&#x27;s command to stop Elvar, invoking non-interference in a family dispute while standing beside one of her treasure chests. The text does not show a new formal hire contract.</p></details><details><summary>The Fury of the Gods · 3</summary><h2>He offers to continue Störr&#x27;s war against Helka for Elvar&#x27;s silver</h2><p>He offers to continue Störr&#x27;s war against Helka for Elvar&#x27;s silver. She declares a different campaign against Lik-Rifa. After she opens the treasure and promises wealth to survivors, he raises his arm and acclaims her as jarl, watching the chest; the other warriors join him.</p></details><details><summary>The Fury of the Gods · 33</summary><h2>He approaches the Wave-Jarl pier with knotwork-raven-shielded men, bringing a crowd behind</h2><p>He approaches the Wave-Jarl pier with knotwork-raven-shielded men, bringing a crowd behind. He reveals Grend bloodied, roped and leashed and has him forced to Elvar’s feet, calling him a gift. When she protests he claims the treatment deserved because Grend deceived her and is Tainted. This is his accusation, not an independently demonstrated manifestation or settled judgment.</p></details><details><summary>The Fury of the Gods · 35</summary><h2>The fleet leaves Snakavik</h2><p>He sits inside the sail enclosure with Grend’s bundled mail/belt/axe and tells Elvar his unnamed Hundur-thrall found bloodied linen after the dock fight. He alleges Grend’s Hundur blood and reports pursuit onto the cliffs/Snaka’s back, two men killed and three more lost bringing him in. His discovery and lineage claims remain attributed, without a shown scent test. He gives up the equipment and receives Elvar’s promise of payment; no actual payment occurs.</p></details><details><summary>The Fury of the Gods · 51</summary><h2>He is among the named people Elvar glimpses in an upper chamber</h2><p>He is among the named people Elvar glimpses in an upper chamber. She assumes Grend is discussed, but the chapter supplies no overheard subject, betrayal or new act against Grend.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>Freedom and the approaching army</h2><p>Frek reports to Elvar that Estrid and Skalk sent information through Lik-Rifa’s messengers and joined Broðir/Runa’s plot, with Hjalmar present. He says his group sought to bring them to Elvar but found they had fled; their destination and capture are not shown. Elvar orders a search. These details remain attributed testimony, not a newly witnessed council scene.</p></details><details><summary>The Fury of the Gods · 66</summary><h2>The infiltrators descend</h2><p>He is explicitly among those sent elsewhere in Wolfdales’ tunnels, not named as the guide or the anonymous chapter64 respondent. His destination and intended action remain unshown.</p></details><details><summary>The Fury of the Gods · 68</summary><h2>Elvar’s fall and the rebellion in the hall</h2><p>Glornir identifies his Fell-Hearted among the door rebels and personally kicks him down, then drives a long-axe through shield and chest. Hjalmar explicitly dies; his surviving followers gather toward Estrid. No further living Hjalmar action is implied.</p></details><details><summary>Illustration · The Hunger of the Gods · 67</summary><p><a href="assets/f3d021836b4892.jpg">Open noncanonical illustration</a></p><p>Hjalmar Peacemaker as described in Snakavik&#x27;s hall.</p></details></noscript>
