      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 5</summary><h2>Introduction</h2><p>Biórr introduces Myrk as Ilska’s sister and calls her Sharp-Claw. She also identifies Skrið as her brother. Her “claws”, she explains, are her blades.</p></details><details><summary>The Hunger of the Gods · 5</summary><h2>Appearance</h2><p>She is younger than twenty-three, with raven-black hair and a sharp face softened by humour. She wears dark mail and carries sword, seax and axe. Biórr observes her confident, graceful bearing.</p></details><details><summary>The Hunger of the Gods · 5</summary><h2>The Hunger of the Gods - chapter 5</h2><p>Myrk expects to be a dragon-born captain beneath Lik-Rifa, with other Tainted and then untouched below them. She says the collared children have been calmed by Seiðr and will lose their collars once they accept the cause.</p></details><details><summary>The Hunger of the Gods · 5</summary><h2>The Hunger of the Gods - chapter 5</h2><p>Ilska orders her to take ten companions to their father at Rotta’s chamber and bring him and the finds to the eastern Bonebacks. Biórr is to stay. Myrk accepts; her departure is not shown.</p></details><details><summary>The Hunger of the Gods · 9</summary><h2>Old companions at the campfire</h2><p>She departs south with fifteen warriors, each leading a spare horse. This observed departure differs from Ilska’s earlier order for ten companions; no reason for the changed number is supplied.</p></details><details><summary>The Hunger of the Gods · 20</summary><h2>Myrk confronted in the glade</h2><p>The previously unnamed leader at the mine is explicitly called Myrk Sharp-Claw by one of her warriors. Identity merge recorded 2026-10-20 at B02-C020: canonical E-209 and provisional E-232 identify the same woman. E-232 and its chapter 18 record are retained for historical links.</p></details><details><summary>The Hunger of the Gods · 20</summary><h2>Myrk confronted in the glade</h2><p>The chapter 18 observation records black hair with a silver-wire-bound raven feather, pale sharp features and dark eyes; her equipment includes dark mail, sword, seaxes, helm and a saddle-mounted shield. Orka now estimates her at about twenty-five, a perspective-dependent estimate distinct from Biórr’s earlier younger-than-twenty-three description.</p></details><details><summary>The Hunger of the Gods · 20</summary><h2>Myrk confronted in the glade</h2><p>She asks whether Orka killed her father and whether Vesli ate his teeth. His personal name remains unestablished. When Orka asks about her son and names Drekr, Myrk asks how she knows him and orders the group seized for a beating to extract answers.</p></details><details><summary>The Hunger of the Gods · 20</summary><h2>Myrk confronted in the glade</h2><p>In battle her eyes glow red and her teeth are pointed. She fights with sword and seax, then draws her boot seax after losing her sword. She and Orka both bleed. After Orka escapes the choking attacker, Myrk bites through Orka’s mail and suffers an arm injury with an audible crack of bone.</p></details><details><summary>The Hunger of the Gods · 20</summary><h2>Myrk confronted in the glade</h2><p>With one arm limp she speaks runic words and sends a moving circle of rune-fire at Orka, burning her cheek before the flames surge like a net. Orka passes underneath and strikes her jaw: Myrk’s eyes roll white, she falls, and the rune evaporates. The chapter does not establish her death.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>Wounds tended and seaxes compared</h2><p>She is confirmed alive after chapter 20, unconscious and tied at wrists and ankles with leather cords and hemp rope, with a linen gag. Her sword has a five-lobed pommel and silver-wire grip, and her smaller seax matches the craftsmanship of Orka’s recovered pair. Orka removes her coin and serpent-headed silver arm rings, cleans her cut cheek and keeps the bloodied linen.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>Wounds tended and seaxes compared</h2><p>Woken, she strains at her bonds with red-flaring eyes before they return to blue under Orka’s threat. She demands her father’s killer and a holmganga, invokes Lik-Rifa and declares that she has learned the Bloodsworn are Tainted. These are her statements, without a newly demonstrated external message or alliance ritual.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>Wounds tended and seaxes compared</h2><p>She reacts to Drekr’s seax and says he told her about Orka entering The Dead Drengr alone against twelve. She taunts Orka about Thorkel but gives no location for Breca. Orka beats her until the companions intervene. She remains breathing, later gagged and tied over her horse, her face swollen and teeth lost; subsequent questioning is still intended.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>Storolf mentions her earlier departure south, and Biórr jokes about conserving his strength for her return. Biórr also recalls her defence of the children’s temporary collars and use in the freeing spell. These are the camp’s conversation and his memory, not a new sighting or knowledge there of her chapter-22 captivity.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>She is still a swollen-faced prisoner, tied at wrists and ankles with leather cord and missing a tooth, when Orka removes her gag. She insults Spert and Vesli, again demands her father’s killer and challenges Orka to release and fight her.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>Halja’s taunts provoke bloody-lipped struggling and a red flare in her eyes; she stills when Orka’s seax, Spert’s sting and Vesli’s spear threaten her. She accepts an exchange of answers for the killer’s name after Orka’s blood-sealed conditional promise of survival until Breca is found and subsequent release for holmganga.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>She says the Raudskinna gave a way to free Lik-Rifa with Tainted blood. Orka then destroys one eye with the seax hilt; Myrk screams, laughs and continues speaking. She remains alive and captive, with one ruined eye of unspecified side and no healing shown.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>She claims none of the Tainted children died but says she does not know whether one was Orka’s son. She describes unspecified failures with older Tainted and claims children are easier to control using blended Seiðr and Galdur. These are her account, not a direct identification of Breca or independently established magic rules.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>She names Uspa as the enslaved witch who opened the bridge, distinguishes her from Kráka and says she does not know the Battle-Grim survivors’ fate. She describes a past northern location and a westward Iskalt-coast rendezvous plan, where she was ordered to bring her father. Her claimed plan is not substituted for the reader’s direct eastward scenes.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>Halja tells her the killer’s name is Varg. She repeats it, looks east towards Rotta’s chamber and threatens his remaining life. Her father’s personal name remains unknown; she has not escaped, returned to the company or met Varg.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>Orka&#x27;s search in Starl</h2><p>She now sits upright in the saddle but remains tied at wrist and ankle, gagged and secured to it while Orka leads the horse. Briefly ungagged, she says her company crossed Horndal on a knarr. Halja reports tracks into Starl, supporting the approach rather than proving embarkation; Orka remains suspicious and gags her again.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>Orka&#x27;s search in Starl</h2><p>At the inn she is taken down and tied to a post beside the stables under watch. Orka uses her pouch’s silver for stabling, food and provisions, and takes blood from her bay gelding. That sample is not Myrk’s blood or her earlier unexplained bloodied linen. She is not released, sold or given the promised holmganga here.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>Edel recounts the encounter with Ilska’s sister at Rotta’s chamber and identifies their father as the old man Varg struck with his cleaver. She names Myrk as the source of the claim that Lik-Rifa accompanies Ilska. The present scene is at Liga and does not move Myrk from Orka’s custody in Starl.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>Absent from the shipboard conversation, she is named by Orka as the prisoner kept alive to guide her to Ilska and Lik-Rifa. Orka repeats the withheld western meeting lead near the Iskalt Islands. Elvar calls her a liar and reports eastward tracks at Isbrún Bridge, supported by Sighvat. This challenges the lead, while deliberate deceit, changed plans and exact current coordinates are not independently resolved.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>Orka imagines killing her, then restrains herself because she still needs the prisoner to find Breca. There is no new assault, death, release or holmganga. The scene does not move Myrk aboard the Wave-Jarl.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>Bound in the Starl stable, she taunts Orka about Drekr and possible future combat. Revna mocks her earlier defeat. Myrk strains with eye-fire and invokes Eldur sparks, but Orka’s seax cut across her neck and threat make her calm. Orka wipes the fresh blood on her tunic and later gags her.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>She escapes on her horse during an apparent raid. After she leaves, the attackers are revealed as Battle-Grim friends and Orka confirms that escape was the plan; the seax left by Orka’s hay bale is also gone, though its taking and the freeing of Myrk’s bonds are not shown. Orka now intends to follow her through Sæunn’s blood-scent tracking rather than catch her. Myrk’s actual next destination and knowledge of the ruse remain unstated.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>Sæunn has followed her trail for two days north along Horndal and then east around the northern Bonebacks. Orka treats this as corroborating Elvar against the western route Myrk had sworn to, and restrains anger at the deception. Myrk is not directly seen; her exact destination and knowledge of the tracking ruse remain unshown. This uses canonical E-209 and preserves the earlier E-232 merge record.</p></details><details><summary>The Hunger of the Gods · 62</summary><h2>The army departs for Svelgarth</h2><p>She reaches Nastrandir in an eye bandage, pale and weak, asking her brother Drekr for fighters and a sword. She reports their father&#x27;s death at Varg&#x27;s hands and shows the empty socket attributed to Orka. Her all-dead claim is not an independently counted casualty list. She says Orka believes Drekr is at Iskalt.</p></details><details><summary>The Hunger of the Gods · 62</summary><h2>The army departs for Svelgarth</h2><p>She threatens Breca but collapses while dismounting and is held by Drekr. Rotta is identified to her and argues that Breca should remain alive as bait.</p></details><details><summary>The Hunger of the Gods · 73</summary><h2>Biórr at the siege</h2><p>She says some allies prefer darkness and that Lik-Rifa has delayed the attack for them. Before heading to rune-work against the wall&#x27;s Galdurmen, she tells Biórr he sustained her journey and asks him to survive. His own thoughts remain troubled by Elvar.</p></details><details><summary>The Fury of the Gods · 4</summary><h2>A prisoner outside Svelgarth</h2><p>She arrives outside Svelgarth in oil-black mail with her silver-wire raven feather and uncovered scarred eye socket. She drags three bound people she calls Jarl Orlyg&#x27;s children, then rushes Orka. Rotta blocks her from killing Orka. She kicks the captive and takes her weapons belt with two fine seaxes, taunting her about their use against Thorkel. The passage does not name the three captives.</p></details><details><summary>The Fury of the Gods · 7</summary><h2>The chained march and its victims</h2><p>She returns with six riders, kisses Biórr and has seven or eight stragglers, including children and injured people, forced to the trees. Riders and skraeling prevent escape while frost-spiders and night-hags attack; the victims are webbed and dragged away. She holds Hagal at knifepoint to stop intervention. She justifies the act as revenge, prevention and avoiding delay, while refusing Dagrun any comfort. These rationalisations do not establish future guilt of the children or final individual fates.</p></details><details><summary>The Fury of the Gods · 11</summary><h2>After intimacy she calls Biórr friend and more and kisses him tenderly</h2><p>After intimacy she calls Biórr friend and more and kisses him tenderly. She wears the recovered seaxes now identified by the narration as Drekr&#x27;s, one across the front and one across the back of her belt. Her tenderness is specific to this encounter and does not revise the recorded treatment of prisoners.</p></details><details><summary>The Fury of the Gods · 13</summary><h2>She hears Orka name Elvar as chief and speculates that Störr’s daughter seeks her father’s aid</h2><p>She hears Orka name Elvar as chief and speculates that Störr’s daughter seeks her father’s aid. She asks Rotta for permission to kill Orka in revenge for her eye, draws Drekr’s paired seaxes and taunts her about Thorkel’s death. Her eyes glow red and teeth sharpen. Orka takes one blade with her wrist chain, while Myrk cuts her ribs with the other; Rotta interrupts the duel before its outcome.</p></details><details><summary>The Fury of the Gods · 15</summary><h2>She knocks Orka down as Orka moves towards Breca</h2><p>She knocks Orka down as Orka moves towards Breca. Fighting with the remaining seax, she punches Orka but suffers a thigh cut. She speaks and traces flaming red runes, then tries again while Orka tackles her and tightens a wrist chain around her throat. Orka kills her with wolf-jaws; the narration explicitly describes her lifeless body. No completed burning effect is shown.</p></details><details><summary>The Fury of the Gods · 24</summary><h2>Rotta returns to Darl</h2><p>Biórr brings her linen-wrapped corpse to Darl and reveals her face to Ilska and Drekr while concealing the torn throat. Ilska turns pale and Drekr lifts and weeps over her. Biórr names Orka as the killer. This is transport and notification of the already established death; no burial or revival is shown.</p></details><details><summary>The Fury of the Gods · 41</summary><h2>Ilska thanks Biórr for bringing her body and giving her joy; he says it was mutual</h2><p>Ilska thanks Biórr for bringing her body and giving her joy; he says it was mutual. Ilska later gives him a raven feather she says belonged to Myrk, believing she would want him to have it. He braids it into his hair. This is a keepsake and acknowledged loss, not a new death or revival.</p></details><details><summary>Illustration · The Fury of the Gods · 24</summary><p><a href="assets/17b87784ebcb2a.jpg">Open noncanonical illustration</a></p><p>Noncanonical, non-graphic interpretation of Drekr and Ilska receiving Myrk’s body.</p></details><details><summary>Illustration · The Fury of the Gods · 41</summary><p><a href="assets/5e856db37aaf63.jpg">Open noncanonical illustration</a></p><p>Ilska giving Biórr the feather she says was Myrk’s.</p></details><details><summary>Illustration · The Hunger of the Gods · 5</summary><p><a href="assets/7f79932855d880.jpg">Open noncanonical illustration</a></p><p>Myrk at her introduction in the Raven-Feeders&#x27; camp.</p></details><details><summary>Illustration · The Fury of the Gods · 4</summary><p><a href="assets/bd8aa0c8557c9a.jpg">Open noncanonical illustration</a></p><p>Orka captive outside Svelgarth.</p></details><details><summary>Illustration · The Hunger of the Gods · 22</summary><p><a href="assets/b293cde014c0db.jpg">Open noncanonical illustration</a></p><p>An interpretive comparison of the seaxes and their shared knotwork; the weapons are not gathered together in a narrated scene.</p></details></noscript>
