      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 2</summary><h2>Introduction</h2><p>Varg reaches Liga believing he is being pursued. He does not know his age, but remembers thirty winters and summers shackled to Kolskegg&#x27;s farm and says he never knew his parents.</p></details><details><summary>The Shadow of the Gods · 2</summary><h2>Appearance</h2><p>At his arrival, his hair is short and stubbled and his beard newly grown. He wears a woollen cloak and carries a leather pouch at his belt; precise hair colour, eye colour and age are not established by these descriptions.</p></details><details><summary>The Shadow of the Gods · 4</summary><h2>A trial and a reason to keep going</h2><p>Varg comes looking for a Seiðr-witch to perform an akáll. Although he initially says he does not want to fight, he agrees to face Einar Half-Troll. The trial is unfamiliar enough that he refuses a shield he has never learned to use, and his last memories of the fight give way to an injured awakening outside Liga.</p></details><details><summary>The Shadow of the Gods · 4</summary><h2>A trial and a reason to keep going</h2><p>His earlier fighting on the farm began when he tried to get broth for his sister Frøya. Now he thinks of her as dead and wants vengeance, although he does not know how to pursue it. He resolves to find a Galdurman or Seiðr-witch who will help him for coin.</p></details><details><summary>The Shadow of the Gods · 16</summary><h2>Learning to accept help</h2><p>When Leif&#x27;s men corner him, a grey-bearded rescuer declares Varg one of the Bloodsworn. The days afterwards bring treatment for his wound and shield training under Røkia. Training is painful, but Svik helps him stand and tells him that accepting help is not weakness, a thought at odds with Varg&#x27;s long isolation.</p></details><details><summary>The Shadow of the Gods · 16</summary><h2>Learning to accept help</h2><p>Glornir refuses the akáll and makes Varg&#x27;s position clear: he is an apprentice, not yet Bloodsworn. In return for learning, obedience and fighting, he will receive food, teaching and protection. Varg accepts coin for equipment, and Svik offers to help him spend it.</p></details><details><summary>The Shadow of the Gods · 18</summary><h2>New clothing and Glornir&#x27;s gifts</h2><p>Buying clothes and weapons with Svik and Røkia gives Varg a new outward appearance. He burns his old clothing and washes, receives Glornir&#x27;s shield and an ash-hafted spear, then finds himself in real fighting at the docks. Forgetting his helmet and leaving the spear&#x27;s cover on show how much he still has to learn.</p></details><details><summary>The Shadow of the Gods · 20</summary><h2>The dead rider and the rules of spoils</h2><p>Seeing the dead rider he wounded makes Varg vomit. His companions explain the rules governing battle spoils, and he helps strip the body before taking his place aboard the Sea-Wolf. Rowing to Svik&#x27;s rhythm, he joins the song and feels excitement alongside his guilt about Frøya.</p></details><details><summary>The Shadow of the Gods · 39</summary><h2>Frøya&#x27;s hair and Torvik&#x27;s promise</h2><p>Survival matters to Varg more than battle-fame: it will let him discover how Frøya died and avenge her. Torvik calls him brother and later promises to help hunt her murderers. Varg reveals that his guarded pouch contains a lock of her black hair for the akáll, while recognising that his growing attachment to the Bloodsworn will make leaving difficult.</p></details><details><summary>The Shadow of the Gods · 45</summary><h2>Protecting Glornir and surviving the bone sword</h2><p>At the excavation Varg fights beside Torvik and later attacks the bone-sword wielder to protect Glornir and Vol. A sword blow ends his awareness, but he survives with a bruised, blistered side. His account to Vol still leaves a gap between the denial of his promised freedom and the bloody aftermath on the farm.</p></details><details><summary>The Shadow of the Gods · 45</summary><h2>Protecting Glornir and surviving the bone sword</h2><p>After Torvik is killed, Varg attacks Olvir rather than accepting Skalk&#x27;s offered oath. Skalk kicks him unconscious.</p></details><details><summary>The Shadow of the Gods · 47</summary><h2>Wolf ancestry and an offered place</h2><p>Edel says she smelled the wolf in Varg&#x27;s blood after the Liga trial. Røkia identifies him as Úlfhéðnar like herself and connects his red mist to that ancestry. Distressed at first, he accepts the disclosure. He also accepts Glornir&#x27;s invitation to join the Bloodsworn and wears the chief&#x27;s silver arm ring, although the formal oath-words must wait until after the effort to recover Vol.</p></details><details><summary>The Shadow of the Gods · 53</summary><h2>Running with the scouts towards Grimholt</h2><p>Two days into the pursuit of Skalk, Varg runs with Edel&#x27;s scouts in his newly won mail and helm. His pain is manageable, and he increasingly accepts kinship with the company. At the burning fortress he witnesses Glornir&#x27;s recognition and embrace of Orka Skullsplitter.</p></details><details><summary>The Hunger of the Gods · 3</summary><h2>Mord&#x27;s burial and a blood feud</h2><p>He helps bury Mord and comforts Lif, remembering Torvik as chosen kin and his unresolved vow for Frøya. He reveals that a seax taken from the slain dragon-born has hilt knotwork matching the blades Orka found in Thorkel; Røkia suggests a shared maker, without confirming it.</p></details><details><summary>The Hunger of the Gods · 7</summary><h2>An offer to return to the Bloodsworn</h2><p>He walks beside Røkia among the scouts leaving Grimholt, carrying a plain black shield. Orka interprets the unmarked shield as showing that he has not yet taken the oath; this is her reading of the sign, not a newly narrated oath ceremony.</p></details><details><summary>The Hunger of the Gods · 11</summary><h2>Learning to control the wolf</h2><p>Training above the camp, he falls and is struck by his shield. Røkia urges spear reach and instinctive weapons craft instead of reliance on wolf-blood. He has slept badly after dreaming of an immense pack of howling wolves and an amber-eyed, wolf-grey man calling him; the sender is not identified.</p></details><details><summary>The Hunger of the Gods · 11</summary><h2>Learning to control the wolf</h2><p>He wears his captured mail but leaves the loose captured helm at his belt. The helm has eye openings and an oil-dark mail aventail. Røkia uses a temporarily lengthened canine to make a new strap hole; he puts the helm on and finds the fit improved.</p></details><details><summary>The Hunger of the Gods · 11</summary><h2>Learning to control the wolf</h2><p>Svik tells him to master the wolf rather than serve it. After Røkia compares controlled release to a steady stream instead of a flood, Varg asks her to teach him. His own controlled attempt is not yet shown.</p></details><details><summary>The Hunger of the Gods · 13</summary><h2>News of a missing sister</h2><p>At the river village he touches the silver scars left by his collar and recalls his own enslavement. Svik says he now looks and moves like a warrior, although Varg still feels afraid.</p></details><details><summary>The Hunger of the Gods · 13</summary><h2>News of a missing sister</h2><p>He recognises Terna, formerly sold from Kolskegg’s farm with Frøya. Terna says Frøya was alive when Brimil sold Terna to Njal. She says Brimil beat Frøya for trying to escape, and that Frøya worried about Varg. Njal places Brimil in Darl; Svik promises to help find him. Varg says he killed Kolskegg and ran. This is an attributed admission, while his earlier memory gap remains recorded.</p></details><details><summary>The Hunger of the Gods · 13</summary><h2>News of a missing sister</h2><p>After Svik’s clash with the dragon preacher, Varg attacks in anger, then tries to direct the wolf through the pack-leader teaching. He feels time slow, breaks free of attackers and uses his helm to batter a club-wielding man. Svik catches his wrist before a final blow; Varg gradually reduces his bloodlust. This is assisted progress rather than secure mastery. He has torn the newly repaired helm strap and asks to buy leather.</p></details><details><summary>The Hunger of the Gods · 13</summary><h2>News of a missing sister</h2><p>He sees the opened barrow’s dead warrior and looks south towards Darl, anticipating both Skalk and Brimil. The corpse is not identified as a named guard or the man thrown overboard in chapter 12.</p></details><details><summary>The Hunger of the Gods · 19</summary><h2>Scouting beyond the repaired bridge</h2><p>Scouting towards Darl with Røkia, he deliberately focuses on the wolf to sharpen his hearing and uses its vision to study the fortress. Røkia warns that his changing eyes would betray him to the untouched. He promises care but feels safe among friends; this demonstrates focused sensory use while the wider question of reliable control remains open.</p></details><details><summary>The Hunger of the Gods · 19</summary><h2>Scouting beyond the repaired bridge</h2><p>His ribs remain tender from the bone-sword. Røkia’s identification of it prompts him to ask about Skalk’s motive, but she offers no explanation of his mind.</p></details><details><summary>The Hunger of the Gods · 19</summary><h2>Scouting beyond the repaired bridge</h2><p>Hearing Einar warn that the rescued children risk collars if left in Darl, he wishes to destroy every collar and confront every thrall-owner, beginning with Brimil. This remains his intention.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>Seax comparison through B02-C022</h2><p>His earlier observation identifies the same hilt knotwork on the seax taken from the slain dragon-born as on Orka’s recovered pair. Chapter 22 adds Myrk’s smaller seax to the comparison through Orka’s observations; it does not place Varg at that encounter.</p></details><details><summary>The Hunger of the Gods · 24</summary><h2>A rescue planned in Darl</h2><p>He enters Darl with Svik, Jökul and Æsa as the Bloodsworn filter in by separate routes. The crowded town nearly overwhelms him; food smells draw him from old thrall habits, and Æsa shares a biscuit. He asks about the eastern thrall-market, hoping to pass near the slaver, but Svik keeps him on task. Near Orna’s remains he perceives a growing bodily pulse, without a newly established magical mechanism.</p></details><details><summary>The Hunger of the Gods · 24</summary><h2>A rescue planned in Darl</h2><p>Following Glornir’s plan, he has left helmet and shield at the wagon and conceals his kit for the sunset approach. He checks seax, hand-axe and cleaver. Svik orders them to wait for Glornir, act quickly and reserve the beast for mortal necessity. Varg shakes with fear; Jökul grips his wrist and reassures him as a brother. This is chosen kinship.</p></details><details><summary>The Hunger of the Gods · 24</summary><h2>A rescue planned in Darl</h2><p>Jökul anticipates meeting Yrsa and avenging Torvik. Varg feels the wolf stir, commands it to wait, and removes his spear’s leather cover. His later recollection names a sword at Torvik’s throat, unlike the directly narrated spear in book one; this wording discrepancy is retained for review, without replacing the earlier event.</p></details><details><summary>The Hunger of the Gods · 24</summary><h2>A rescue planned in Darl</h2><p>He is startled by the smiths’ steam, then hears a cut-off scream, fighting, horses and an explosion near the tower. The group breaks into a run. The source of the disturbance, entry into the tower and Vol’s recovery are not shown.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>He joins the courtyard battle after recognising Jaromir’s druzhina. Svik’s group crosses the stockade; Varg lands via a flat outbuilding roof. For a time he feeds strength, speed and senses from the wolf while retaining a thin edge of control.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>He sees Jökul killed with his own hammer by a dark-haired, sharp-nosed man. Grief drives him towards the tower; he finds Jökul’s corpse, takes his axe from the nearby dead guard’s skull and hears running feet down the tunnel. This explicitly named sequence now confirms his and Jökul’s counterparts in the earlier unnamed courtyard observations, without rewriting that viewpoint.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>The fruitless search for Vol and Glornir’s decision redirect the company into the fortress. He sees Glornir change enough to break the trapdoor and then return to normal, recognising the control Røkia has taught him. Hakon is taken from his chamber after professing ignorance of Vol’s and Skalk’s whereabouts.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>Near the feast hall beneath Orna’s bones he experiences intensifying head-pounding and nausea. He recognises the hammer-bearing killer before Helka, but Svik makes him wait. No name is exchanged, and no cause for Varg’s head pain is established.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>During the dais fight a two-seax Úlfhéðnar batters him against a wall. He wounds her foot with his cleaver but she pins him and bites off his ear. She dies and Sulich pulls him upright; the fatal stroke is not described. Varg remains bloodied and in pain, with no healing shown.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>He sees the company losing ground while concealing its Tainted blood. Helka calls a halt when Røkia holds Hakon with a seax at his throat. The hostage confrontation has not been resolved.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>He accuses Guðvarr before the hall of killing Jökul and fleeing. Glornir prevents him approaching. He then demands Yrsa for Torvik’s death; his sword accusation repeats the existing discrepancy with the earlier spear narration. Glornir stops that advance too.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>After Guðvarr cloaks Hakon, he seizes his wrist. Guðvarr sees his short beard, lean sharp face and torn ear, and notes that Varg is taller than him. He confirms Guðvarr’s name and delivers Lif’s warning that he is coming for him.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>He says he may not be able to keep his promise to spare Guðvarr for Lif, condemns the killing of Lif’s brother and the blow against Jökul, and invites a holmganga. Helka forbids bloodshed. Glornir’s order makes him release the wrist; no duel or new killing occurs. Naming him in that command gives Guðvarr his personal name.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>The morning after the hall fight he grieves Jökul and touches the bandage over his missing ear. He recalls Røkia holding him while Glornir cauterised it. With Glornir’s permission he accompanies Svik, Røkia and Einar from the dockside barracks to find Brimil.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>The slave market’s collared captives stir guilt and anger. He sees the near-black-skinned people Svik calls Bruised Men and hears the account of southern and northern Iskidan. To approach Brimil, he puts on his old collar as a disguise; its weight brings fear and shame. Svik leads the supposed captive to The Dead Drengr.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>Remembering Frøya and Terna’s report, he attacks Brimil, knocks the bartender Rog into a table and beats the slaver. Rog is left unmoving, with no confirmed death. After questioning about Frøya’s punishment and Brimil’s statement about sexual violence, he loses control and tears Brimil’s cheek with his teeth. Einar restrains him until he calms.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>Under coercion Brimil says Frøya was sold to Brák Trolls-Bane, a hunter and trapper out of Darl who drinks at the inn. Her later fate remains unexplained. Svik cuts Brimil’s throat while Røkia and Einar kill the guards. Svik says the slaver saw Varg’s changing eyes; Varg blames his own loss of control, and Røkia warns it could expose the whole company.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>Røkia steadies his shaking hand and unlocks the collar; he removes it. He helps load the loaned drakkar and receives Glornir’s promise of help with Brák. With Hakon and Frek aboard, the company rows from Darl. Sulich explains the hoped-for interception at Liga, not a confirmed meeting with Jaromir.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>At Orka’s camp, Halja tells Myrk that Varg killed her father. Myrk repeats his name and threatens his life. This supplies his name to her; he is not present, learns no warning here and has no new confrontation with her.</p></details><details><summary>The Hunger of the Gods · 32</summary><h2>Children hidden in the barrels</h2><p>Stiff after rowing, he stops with the company at dusk when Einar drops the anchor-stone. After Glornir uncovers a child in a barrel, Varg helps open Einar’s wagon barrels and bring the hidden children out to be fed.</p></details><details><summary>The Hunger of the Gods · 32</summary><h2>Children hidden in the barrels</h2><p>He feels sudden tension at Frek’s calm warning to Glornir and watches Æsa straighten. Later he listens to Svik’s fable, laughing until his jaw aches. At the close he sees Frek looking down at clenched fists; he is given no explanation of the gesture.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>He returns to Liga and reunites with Edel, Ingmar and the Sea-Wolf. Having seen Darl, he now regards Liga as a fair-sized trading port. As Hakon leaves under Logur’s arrangement, he tells Frek that he once thought thralldom inescapable. Frek pulls away and follows the prince; his thoughts remain unspoken.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>He retrieves his stored druzhina spoils and now understands captured equipment as a record of battle-fame. Thinking he has too much kit and has never used a bow, he offers it to Sulich as repayment for his rescue in Darl. He apologises for the previous insulting offer. Sulich accepts after Varg insists it is his property to give and Einar encourages him; no bow shot or armour use is shown.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>He stows his own helm, weapons and mail, wrapping the mail in his sealskin cloak. Edel’s account tells him the slain cleaver-struck man was Ilska and Myrk’s father. Ingmar reassures him of his place in the company. News of Halja’s vengeance recalls Vali’s death, Frøya and the pull of blood feud.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>He joins the Sea-Wolf’s departure after Glornir reports Jaromir’s two-day lead and orders pursuit to Iskidan. Røkia’s warning and Svik’s laughter anticipate his first open-sea passage; the ending still shows him rowing in the fjord.</p></details><details><summary>The Hunger of the Gods · 43</summary><h2>The feast and the shield-dance</h2><p>In Varg’s absence, Leif renews his accusations before Helka and asks permission to hunt him despite Bloodsworn protection. Helka blesses the hunt; Leif says he has hired Sterkur death-in-the-eye and his mercenary band with his farm wealth. The accusations do not supersede Varg’s earlier competing account of his freedom or independently establish guilt.</p></details><details><summary>The Hunger of the Gods · 43</summary><h2>The feast and the shield-dance</h2><p>Helka tells Leif the company sailed from Liga after Jaromir and suspects it is already in Iskidan. No new arrival is observed, no hunters reach Varg and he receives no warning of this audience within the chapter.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>After two days at sea he is still vomiting almost since losing sight of land. Svik’s breakfast advice has not helped. While Glornir directs tacking, Røkia forecasts land in a day or a day and a half; Varg’s fear that he is dying is distressed speech, not an established fatal condition.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>He asks why Svik has been quiet since Grimholt. Røkia tells him Orka found and trained Svik as a ten-year-old runaway thrall, and recounts the company’s search after Orka and Thorkel vanished in a sea battle. She describes Svik’s mother-like attachment and guesses that Orka’s survival and departure have renewed his hurt. Varg argues that a stone heart blocks love and friendship along with pain; Svik does not give his own explanation.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>Refna wipes his chin and supplies water, then tells him of her parents’ deaths and brother Kel’s execution after repeated escape attempts. Varg grips the rail and asks whether Brák was called Troll-Slayer; she agrees and names Drekr as chief. This connects her testimony with his concerns and Orka’s hunt, but does not supply Frøya’s death circumstances. Røkia predicts their paths will cross again.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>He sees gold flecks in Sulich’s eyes as the man notices something at sea. Following Røkia’s southward pointing, Varg first hopes for land, then recognises sails. Glornir orders weapons after handing Æsa the tiller; no ship identification, engagement or arrival is shown.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>The boarding battle at sea</h2><p>He freezes over his sea-chest thinking of Brák until Svik prompts him to prepare. He says his seasickness has eased, then puts on oil-dark mail, axe, cleaver and seax, cap and helm with a mail curtain. His missing ear makes the helm feel unbalanced and his growing beard catches in the buckle. He takes shield and spear from the racks. The weapons’ weight now reassures him.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>The boarding battle at sea</h2><p>Glornir tells him to run with the wolf as the company forms two lines around the children. Røkia replaces Sulich beside him; he raises his shield against an arrow which Svik breaks. When boarding begins, he recalls the pugil-ring’s restrained red mist and resolves to act with the wolf. His braced, overlapping shield and underhand spear earn Røkia’s approval, but she warns him to trust the rear line rather than turn.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>The boarding battle at sea</h2><p>The silent boarders unsettle him. A woman keeps attacking after his spear penetrates her neck; Røkia parries and cuts her face. She later grips his ankle until repeated downward stabs leave her stiff and her hand slack. A helm blow briefly dazes him and the prolonged assault burns his shield arm, yet he initially keeps the red mist at bay.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>The boarding battle at sea</h2><p>His spear catches in another attacker’s chest. As he draws his seax he is dragged out of the wall, loses his shield and has the blade pinned. Helm and mail turn blows while Røkia and Svik call out. A pockmarked man with foul breath and a slimy tongue opening like a toothed mouth looms close.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>The boarding battle at sea</h2><p>He consciously releases the wolf to save himself. Senses sharpen, strength and rage surge and his hands become claws. He tears free, headbutts and bites the pockmarked man, and stabs with the seax before slashing into the surrounding bodies. Finally he stands on a mound of corpses and howls. His later condition and the other companions’ outcomes remain unshown.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>At Svik’s prompting he orders the wolf to stop until the red mist retreats, leaving him exhausted. He witnesses Glornir extract a tongue-like creature and learns Sulich’s name and account of the tungumatur. He infers the pockmarked attacker meant to transfer one to him; no successful infection is shown.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>He rows after the escaping ship into the islands, goes ashore and fights infected hosts in a courtyard, directly targeting their mouth parasites. He follows Æsa into the beechwood and uses the wolf for speed when she screams. At the pool he sees bound druzhina and the giant swallowing a man, then charges with Einar.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>He abandons a snagged spear, uses his cleaver to kill an emerging parasite, then attacks the giant as it injures Æsa and throws Einar. Glornir kills it after it hurls Varg into the pool. Varg held his mouth closed and breath before escaping; these precautions do not prove immunity. He cradles the breathing but unconscious Einar and fears losing him, then follows Glornir to hear the captive’s Valdai report. No recovery of Einar or Vol occurs.</p></details><details><summary>The Hunger of the Gods · 59</summary><h2>New looks on the journey through Ulaz</h2><p>He leaves the island troubled by Einar&#x27;s absence and repeatedly checks his tongue, without confirmed infection. Svik trims his beard and adds a silver ring, then shaves the back and sides of his head; the retained top remains too short to braid. Røkia begins axe training and a demonstration leaves him reporting a loosened tooth.</p></details><details><summary>The Hunger of the Gods · 63</summary><h2>A shortcut through the mountains</h2><p>He runs with the scouts on the mountain shortcut, using the wolf for stamina and distant senses. Røkia corrects his exposed ridge silhouette. All fifty-four travelling Bloodsworn have left the hidden ship; at Valdai&#x27;s approach the company prepares an ambush without yet meeting Jaromir.</p></details><details><summary>The Hunger of the Gods · 66</summary><h2>Sulich&#x27;s lineage and the ambush</h2><p>He shaves the stubble and ties back his top hair with leather, sustaining a small nick. In cap, helm and mail he stands with spear and shield in the second rank behind Røkia. He directly sees Vol&#x27;s shackles and stitched lips as Glornir calls the wall.</p></details><details><summary>The Hunger of the Gods · 68</summary><h2>The cavalry charge and the shield wall</h2><p>He uses the shield-hook opening Røkia makes to stab an opponent. The huge thrall&#x27;s charge throws him and costs him shield and spear; drawing on the wolf he spoils a stomp aimed at Ingmar and embeds his seax in the man&#x27;s thigh. After being hurled away again he rises with his hand-axe and witnesses Jaromir&#x27;s escape with Vol.</p></details><details><summary>The Hunger of the Gods · 70</summary><h2>The pursuit into Valdai</h2><p>He recovers spear and shield for pursuit, vaults into Valdai from Ingmar&#x27;s support and fights through the walkway. Røkia protects him after a new gaping facial wound and disorientation. The narration uses his seax again without narrating its recovery from the earlier opponent.</p></details><details><summary>The Hunger of the Gods · 70</summary><h2>The pursuit into Valdai</h2><p>He witnesses Ingmar&#x27;s death and Vol&#x27;s survival and liberation. Below the hall he recognises a map of Vigrið despite being unable to read, but does not know its purpose. Sulich identifies the barred prisoners as his siblings.</p></details><details><summary>The Fury of the Gods · 1</summary><h2>At Valdai, Røkia stitches his cheek with fishhook and gut thread</h2><p>At Valdai, Røkia stitches his cheek with fishhook and gut thread. Mourning the company&#x27;s fallen, he thinks of them as family and touches the lock of Frøya&#x27;s hair. Vol agrees to perform his long-promised akáll tonight; her warning makes him dread what it might reveal, but the ritual remains pending.</p></details><details><summary>The Fury of the Gods · 6</summary><h2>At Valdai, he shows Sulich&#x27;s freed kin his own collar scars and says adjustment takes time</h2><p>At Valdai, he shows Sulich&#x27;s freed kin his own collar scars and says adjustment takes time. Though he fears the dragon fight, he agrees with Edel that the threat will not disappear. Glornir decides to fight and leave for the Sea-Wolf at dawn. Varg recalls dreams of a black wolf and green-eyed man, without identifying either.</p></details><details><summary>The Fury of the Gods · 6</summary><h2>At Valdai, he shows Sulich&#x27;s freed kin his own collar scars and says adjustment takes time</h2><p>With Røkia accompanying him, he receives Vol&#x27;s promised akáll. He experiences Frøya&#x27;s exhaustion, fear and pain through the vision. It depicts an unnamed chief ordering Brák to punish her, her resistance with wolf strength and Brák&#x27;s killing of her. He memorises the faces and Brák&#x27;s name; when her final word is his own name and the vision fades, he falls howling. Røkia supports him.</p></details><details><summary>The Fury of the Gods · 10</summary><h2>The road to Ulaz</h2><p>On the overland journey to Ulaz, he runs ahead of the horses, replaying Frøya&#x27;s death and wanting Brák dead. Svik brings him back to food and water. Røkia confides her own loss and revenge; he touches her hand and hopes vengeance might bring peace, while her account explicitly denies that it restored her mother or eased grief.</p></details><details><summary>The Fury of the Gods · 10</summary><h2>The road to Ulaz</h2><p>He sees Rurik, the collared rune-wielder and the guarded eastern fleet with Svik, who judges an invasion close. Before they reunite with Glornir, the differently eyed man and armed golden-eye shieldbearers ambush them. Varg struggles under a bag, is struck in the head and falls. Captor identity, destination and the others&#x27; outcomes remain unresolved.</p></details><details><summary>The Fury of the Gods · 12</summary><h2>The captors reveal their purpose</h2><p>He wakes hooded with head pain and is dragged into a wooden building near wave sounds, which he thinks may be a dockside warehouse. Sterkur and Leif confront him. He rejects Leif&#x27;s claim of murder and ownership, then bites a captor when Røkia is seized; others beat and pin him down. After Svik disrupts the execution, Røkia signals the wall and he hears a snuffle and growl, smiling without the source being named.</p></details><details><summary>The Fury of the Gods · 14</summary><h2>Glornir’s rescuers break through the warehouse wall</h2><p>Glornir’s rescuers break through the warehouse wall. He copies Røkia in biting through his bonds, helps Svik and recovers his axe and cleaver. Sterkur gets Leif away; Varg pursues but Røkia and Glornir stop him amid dock alarms. He escapes aboard Sea-Wolf. Later Røkia reports that Sterkur recognised her Tainted eyes, and Varg spots five hawk-marked ships that Svik identifies as Rurik’s possible pursuers.</p></details><details><summary>The Fury of the Gods · 21</summary><h2>Reunion in the island harbour</h2><p>After rowing into the island harbour he sees Einar mobile, Æsa limping and Refna among the children at the reunion. Aboard he watches Taras and Einar make friends, then renews thoughts of the dragon and avenging Frøya on Brák. He witnesses Edel’s handover and Vol’s assessment of the fragments. The renewed five-ship pursuit interrupts the passage towards Snakavik without an engagement yet.</p></details><details><summary>The Fury of the Gods · 25</summary><h2>Preparing to meet the pursuing ships</h2><p>He equips mail, wool cap and eye-guarded helm with mail neck curtain, weapons belt with seax/cleaver/bearded axe and Glornir’s silver bear-head ring on his left bicep; the sealskin cloak stays in his chest. The company’s ships are lashed together for battle after a day’s pursuit. He learns the tactic from Svik and takes spear and back-shield.</p></details><details><summary>The Fury of the Gods · 25</summary><h2>Preparing to meet the pursuing ships</h2><p>An arrow punches through his raised shield. He sees the enemy caster’s red ward, the serpent’s retreat and Vol/Iva’s freezing counterspell. The leading drakkar breaks and sinks, horrifying and fascinating him. No outcome for the remaining four ships is shown.</p></details><details><summary>The Fury of the Gods · 27</summary><h2>The ships collide</h2><p>He defends Sea-Wolf in the second rank, then follows Røkia onto an attacking drakkar, hurts his ankle on landing and helps break its shield wall. He channels wolf-blood strength and speed while holding formation. Returning to Sea-Wolf, he sees Einar wounded and Glornir fighting barehanded. An axe blow dents his helmet and drops him; he kills the attacker at close quarters. Røkia helps him stand, but he sways with a pounding head and vomits. Unable to find his shield, he shares her cover as another unidentified drakkar approaches.</p></details><details><summary>The Fury of the Gods · 29</summary><h2>The fight aboard the stern drakkar</h2><p>He fights aboard the stern attacker after Gunnar and Halja’s intervention opens the way, then stands exhausted by his wolf-driven frenzy. Vol’s scream draws the company back to Sea-Wolf. He sees Svik wounded at the hip and recognises Orka Skullsplitter as she saves him, together with Gunnar and Halja. Before any settled reunion, two enemy casters combine against Vol and the resulting heat and steam knock him and the others down.</p></details><details><summary>The Fury of the Gods · 37</summary><h2>Life aboard Sea-Wolf</h2><p>He mends his tunic aboard Sea-Wolf and handles the rough motion better than on his first voyage, with Orlyg’s sail ahead. After children’s sparring Glornir orders his shield repainted black for the night’s vow. At the south-west coast cove he wears scrubbed mail, weapons/helm at belt, shaved head-sides, crown-tied hair and a beard now long enough to braid, tied in leather. He thinks of Frøya and wishes she shared this belonging; wind resembling a voice is not confirmed contact.</p></details><details><summary>The Fury of the Gods · 37</summary><h2>Life aboard Sea-Wolf</h2><p>Svik brings him into the fire-circle and every present company member vouches, Røkia first and Glornir last. Vol cuts and joins their blood, the strands visibly rising and merging, then pours it into his hands. He swears the spoken kin/pack oath, to fight, die if needed and avenge them, sealing it on the black shield with burning blood marks. Glornir returns it and welcomes him; he cries with joy. This completes the delayed full oath, distinct from the earlier invitation and arm ring; no court has thereby judged Leif’s ownership claims.</p></details><details><summary>The Fury of the Gods · 39</summary><h2>He spars with Røkia after his completed oath, which Svik explicitly calls last night’s</h2><p>He spars with Røkia after his completed oath, which Svik explicitly calls last night’s. They pause axe-work to watch Svik confront Orka. Her subsequent reacceptance is separate from his own new full membership.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>He feels the dream-call while awake at landing and believes Røkia hears it</h2><p>He feels the dream-call while awake at landing and believes Røkia hears it. He follows the company into Wolfdales, watches a stone wolf turn and bare fangs and is told to keep walking when reaching for a weapon. In the hall he sees a spiral stair carved around the glowing tree, varied warbands, and scowls at Taras/riders that make him question prejudice rather than know their motive.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>He feels the dream-call while awake at landing and believes Røkia hears it</h2><p>He watches Vol/Uspa reunite, then sees tall Ulfrir with long nape-tied grey-streaked dark hair, short beard, amber eyes and sharp tooth tips, with red-winged Skuld. A voice in his head calls him wolf-child, promises secrecy and asks him to come; he identifies Ulfrir and it answers I am your god. Røkia reacts but her exact thoughts remain unknown. The address supplies no biological paternity. Glornir’s offer is accepted before the chapter ends on Elvar’s question about Orka.</p></details><details><summary>The Fury of the Gods · 43</summary><h2>He jumps at Hrung’s booming voice while the allies exchange news</h2><p>He jumps at Hrung’s booming voice while the allies exchange news. No further private visit to Ulfrir or new answer to the god’s earlier invitation occurs.</p></details><details><summary>The Fury of the Gods · 48</summary><h2>He returns through the tunnels after the ordered brief raid, frustrated not to have found Brák</h2><p>He returns through the tunnels after the ordered brief raid, frustrated not to have found Brák. Ulfrir privately praises him, and his companions support his unfinished vengeance. He squeezes Røkia’s hand; she stays, and Einar covers their hands in affirmation of kinship. Seeing collars on servants, Ulfrir and Frek, he questions serving slavers. After accepting the dragon’s atrocities make her unfit to follow, he proposes all people free and labour paid, rejecting a simple reversal of enslavement. The proposal remains a table conversation, not law.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>From the gate he sees the woodland destruction and enemy siege parties</h2><p>From the gate he sees the woodland destruction and enemy siege parties. Surrounded by the Bloodsworn, he feels free and grateful to Elvar, with a purpose beyond revenge. He recognises the golden-eye company and voices his grievance against Leif. Frek’s report and the failed god-parley unfold before him.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>From the gate he sees the woodland destruction and enemy siege parties</h2><p>Røkia tells him to stay alive and gently touches their helms. Wearing cap, spectacle helm and mail neck guard, he fights ladder climbers with shield and spear; when the spear sticks in a chest he releases it to avoid falling. His hand-axe hooks one ladder sideways into another, toppling both, but the next arrives at once. No new injury or final victory is shown.</p></details><details><summary>The Fury of the Gods · 61</summary><h2>He braces between Svik and Røkia, using shield and seax while hoping Brák will face him</h2><p>He braces between Svik and Røkia, using shield and seax while hoping Brák will face him. A dark-haired opponent wounds his calf through wraps/breeches; Orka’s axe helps open her defence and he stabs her throat. He foils another shield hook and fights successive replacements, deliberately releasing a controlled measure of wolf-blood for strength/senses without full transformation.</p></details><details><summary>The Fury of the Gods · 61</summary><h2>He braces between Svik and Røkia, using shield and seax while hoping Brák will face him</h2><p>An axe tears his mail and wounds his shoulder; Orka helps again after he cuts an attacker’s helm buckle. Both new wound sides are unspecified, and neither is shown healed. Even as third-rank fighters relieve exhausted front warriors, he refuses rotation for fear of missing Brák. Enemy disengagement gives him time for water, then frost-spiders and trolls approach. He sheathes his seax and draws his cleaver, the next clash still ahead.</p></details><details><summary>The Fury of the Gods · 62</summary><h2>A spider entangles his shield/mail until Orka and Røkia strike it off</h2><p>A spider entangles his shield/mail until Orka and Røkia strike it off. He lingers for Brák, whose identity and position Orka now explicitly confirms beside Ilska, with Drekr behind. Orka’s warning and Svik/Røkia’s restraint persuade him to defer revenge and flee the hyrndur. He drops his shield to cleave the troll threatening Svik, rolls clear and helps the rescue. Shield retrieval, safe entry and revenge remain unshown.</p></details><details><summary>The Fury of the Gods · 68</summary><h2>Elvar’s fall and the rebellion in the hall</h2><p>He wakes to horns and follows Glornir/Vol into the hall with a shield, whose earlier retrieval is unshown. Elvar’s body falls before them, identified by Glornir and her white forearm scar, and the narration calls her dead. Shocked, he joins the Bloodsworn’s loose line with shield/hand-axe against the door rebels, reaching the gates without a new wound specified. He then witnesses the god confrontation and night-hag entry.</p></details><details><summary>The Fury of the Gods · 73</summary><h2>Flames cut him and his companions off from Glornir’s climbing party</h2><p>Flames cut him and his companions off from Glornir’s climbing party. He follows Svik to aid the fallen stone wolf, then hears Refna and confronts Brák over his sister. Refna claws free; enemies separate the company and Varg loses his shield under a spear attack. Leif and Sterkur flank him, calling him Kolskegg’s-thrall. Seeing Brák thrust through Einar’s throat, he demands passage and runs at Sterkur; the duel is unresolved.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>Leif’s death and the tunnel escape</h2><p>He overcomes the mental voice’s distraction in rage, tackles Leif and tears his throat, explicitly killing him after inflicting an earlier shoulder cut. Røkia pulls him up. He retrieves axe/cleaver, then finds Einar dead and howls with grief; Sterkur is unseen and Røkia reports Brák fled.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>Leif’s death and the tunnel escape</h2><p>He calls attention to Grend’s lagging party carrying Hrung, prompting Ulfrir to rescue them. At the tunnel entrance he sees Snaka break through the wall and hears the serpent address Ulfrir as son. The pressure returns; Varg follows Ulfrir into the tunnel, with no completed emergence shown.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>The survivors’ camp and reunion</h2><p>He emerges from the tunnel into snowy last daylight with the battered host, sees Hrung set down and Ulfrir become human, then joins Elvar’s memorial. Exhausted and grieving Einar, he hunts with Røkia and later eats rabbit marrow beside the screened fire. He still hopes the other Bloodsworn survived, until Vesli actually brings Glornir/Vol/Orka’s party into camp.</p></details><details><summary>The Fury of the Gods · 79</summary><h2>He cleans axe/cleaver/seax among the reunited company and hears Frek/Sæunn speak of freedom</h2><p>He cleans axe/cleaver/seax among the reunited company and hears Frek/Sæunn speak of freedom. Lif’s song recalls his childhood with Frøya. Røkia corrects his assumption about her preferences, takes his hand and says she chooses him. He follows her away, passing council as Hrung mentions Elvar’s plan; beyond earshot they kiss mutually and he returns her choice, beginning intimacy.</p></details><details><summary>The Fury of the Gods · 81</summary><h2>The charge against the gods</h2><p>Shieldless with hand-axe/seax, he charges after witnessing Snaka’s murder and Ulfrir’s warning about heart power. He fights beside Røkia/Svik/Edel/Æsa, still searching for Brák. Recognising Yrsa as Torvik’s killer, he points her out; after companions clear her guards he feints a slip, hooks her ankle and topples her, breaks her sword-wrist and axes her face for Torvik/friendship.</p></details><details><summary>The Fury of the Gods · 81</summary><h2>The charge against the gods</h2><p>He then sees Iva battling an unnamed fair-haired red-staff Galdurwoman and Taras surrounded by hunters. Spotting Brák behind Taras with slim sword, he bellows the name, without a new duel outcome yet.</p></details><details><summary>The Fury of the Gods · 84</summary><h2>Silrið’s defeat and vengeance for Frøya</h2><p>He and Røkia/Svik/Edel/Æsa free Taras from the circling hunters, then he challenges Brák as Iva defeats Silrið. Røkia names Brák’s Væsa lineage. Initially controlling his wolf, he adapts pugil tactics but suffers fresh wounds and a disabling left-leg problem, drops his axe and faces Brák’s final lunge.</p></details><details><summary>The Fury of the Gods · 84</summary><h2>Silrið’s defeat and vengeance for Frøya</h2><p>He releases strength, pins Brák’s foot with seax, rises on the right leg, breaks his wrist/bites his face and takes his sword. Limping, he drags Brák to a tree and pins him through the belly for Frøya. At Røkia’s signal the children join, Refna invoking Einar; he assents, then hears vengeance declared and falls weeping. His dropped axe/seax are not shown recovered and his wounds are not healed.</p></details><details><summary>The Fury of the Gods · 89</summary><h2>He leaves Brák’s explicit corpse limping, exhausted and without the joy he expected</h2><p>He leaves Brák’s explicit corpse limping, exhausted and without the joy he expected. After Iva/Taras’s farewell the Bloodsworn head toward the gods. Æsa is killed by the larger troll; Varg fights Heðin with cleaver and an available hand-axe again, without a shown recovery. A Faunir frees him from a spider’s barbed hold on his mail.</p></details><details><summary>The Fury of the Gods · 89</summary><h2>He leaves Brák’s explicit corpse limping, exhausted and without the joy he expected</h2><p>He joins Røkia/Edel/Svik/the hound in bringing Heðin down and killing him after Røkia casts Æsa’s spear. Rotta then faces them until Grok/Kló lift/drop him into wagons. Varg sees the rat still and unmoving, without a final death statement.</p></details><details><summary>The Fury of the Gods · 92</summary><h2>He adds a stone to Glornir’s completed barrow, shares ale/cheese and learns Rotta’s body vanished</h2><p>He adds a stone to Glornir’s completed barrow, shares ale/cheese and learns Rotta’s body vanished. He proposes a permanent home for children, elders and weary members, leaving raiding open to others; all agree. He and Røkia each want a child one day, without a pregnancy or timetable.</p></details><details><summary>Illustration · The Fury of the Gods · 89</summary><p><a href="assets/d6e4bff26147b0.jpg">Open noncanonical illustration</a></p><p>The unnamed Faunir intervening against the spider holding Varg.</p></details><details><summary>Illustration · The Fury of the Gods · 92</summary><p><a href="assets/fbf45426dd230f.jpg">Open noncanonical illustration</a></p><p>The company sharing food and discussing a lasting home.</p></details><details><summary>Illustration · The Fury of the Gods · 12</summary><p><a href="assets/d0f188333e567f.jpg">Open noncanonical illustration</a></p><p>The companions’ defiance before the execution attempt.</p></details><details><summary>Illustration · The Fury of the Gods · 89</summary><p><a href="assets/82a301355c5056.jpg">Open noncanonical illustration</a></p><p>Grok and Kló lifting Rotta in revenge for Snaka.</p></details><details><summary>Illustration · The Fury of the Gods · 84</summary><p><a href="assets/9a074386763863.jpg">Open noncanonical illustration</a></p><p>Iva’s ice wheel meeting Silrið’s flaming rune-vines.</p></details><details><summary>Illustration · The Fury of the Gods · 10</summary><p><a href="assets/62d612126a5821.jpg">Open noncanonical illustration</a></p><p>Røkia and Varg’s conversation above Ulaz.</p></details><details><summary>Illustration · The Fury of the Gods · 79</summary><p><a href="assets/b258543c977818.jpg">Open noncanonical illustration</a></p><p>Røkia taking Varg’s hand and declaring her choice.</p></details><details><summary>Illustration · The Hunger of the Gods · 22</summary><p><a href="assets/b293cde014c0db.jpg">Open noncanonical illustration</a></p><p>An interpretive comparison of the seaxes and their shared knotwork; the weapons are not gathered together in a narrated scene.</p></details><details><summary>Illustration · The Fury of the Gods · 75</summary><p><a href="assets/6db2783ef006df.jpg">Open noncanonical illustration</a></p><p>Snaka appearing through the shattered hall wall as Ulfrir withdraws.</p></details><details><summary>Illustration · The Fury of the Gods · 56</summary><p><a href="assets/71f9113f3d8959.jpg">Open noncanonical illustration</a></p><p>Røkia’s quiet gesture before combat.</p></details><details><summary>Illustration · The Fury of the Gods · 81</summary><p><a href="assets/7e24dd3cc88c25.jpg">Open noncanonical illustration</a></p><p>Sulich’s mounted force entering the unprepared camp.</p></details><details><summary>Illustration · The Fury of the Gods · 84</summary><p><a href="assets/840bb77c043759.jpg">Open noncanonical illustration</a></p><p>Taras resting his head on Iva’s shoulder after the fight.</p></details><details><summary>Illustration · The Fury of the Gods · 77</summary><p><a href="assets/351bb7176446cb.jpg">Open noncanonical illustration</a></p><p>Glornir’s party entering the survivors’ snowy camp.</p></details><details><summary>Illustration · The Fury of the Gods · 61</summary><p><a href="assets/ebf68832f37548.jpg">Open noncanonical illustration</a></p><p>The frost-spiders advancing after the disengagement.</p></details><details><summary>Illustration · The Fury of the Gods · 42</summary><p><a href="assets/07e832076ed195.jpg">Open noncanonical illustration</a></p><p>Noncanonical arrival view showing the spiral walkway newly described around the tree.</p></details><details><summary>Illustration · The Fury of the Gods · 75</summary><p><a href="assets/855fc6762a4e54.jpg">Open noncanonical illustration</a></p><p>Ulfrir carrying Hrung’s sailcloth and shielding the delayed party.</p></details><details><summary>Illustration · The Hunger of the Gods · 51</summary><p><a href="assets/caab0af5ec0a7f.jpg">Open noncanonical illustration</a></p><p>Varg howls above the fallen attackers on the Sea-Wolf&#x27;s deck.</p></details><details><summary>Illustration · The Hunger of the Gods · 59</summary><p><a href="assets/209fa2ccc4525a.jpg">Open noncanonical illustration</a></p><p>Varg after Svik&#x27;s grooming aboard the Sea-Wolf near Ulaz.</p></details><details><summary>Illustration · The Shadow of the Gods · 53</summary><p><a href="assets/bdb984c3b9e127.jpg">Open noncanonical illustration</a></p><p>Varg in the pinewood wearing his newly won helm at the end of the first book.</p></details><details><summary>Illustration · The Shadow of the Gods · 21</summary><p><a href="assets/11a042a1bdf288.jpg">Open noncanonical illustration</a></p><p>Varg after receiving Glornir&#x27;s spear, before the dockside battle.</p></details><details><summary>Illustration · The Fury of the Gods · 81</summary><p><a href="assets/9a85192de9d89f.jpg">Open noncanonical illustration</a></p><p>Varg’s ankle hook before the fatal follow-up.</p></details><details><summary>Illustration · The Fury of the Gods · 6</summary><p><a href="assets/a40f2b312d755e.jpg">Open noncanonical illustration</a></p><p>Vol prepares the akáll.</p></details><details><summary>Illustration · The Fury of the Gods · 48</summary><p><a href="assets/2980464da34af5.jpg">Open noncanonical illustration</a></p><p>Einar’s gesture affirming Bloodsworn kinship.</p></details><details><summary>Illustration · The Fury of the Gods · 37</summary><p><a href="assets/b872187acec541.jpg">Open noncanonical illustration</a></p><p>Varg’s welcome after the spoken oath.</p></details><details><summary>Illustration · The Fury of the Gods · 73</summary><p><a href="assets/05f4dcba636f0f.jpg">Open noncanonical illustration</a></p><p>Æsa running the planted spear during the stone-wolf rescue.</p></details></noscript>
