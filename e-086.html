      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 9</summary><h2>The serpent and the captive family</h2><p>Agnar names the attacking sea serpent Sjávarorm.</p></details><details><summary>The Shadow of the Gods · 9</summary><h2>The serpent and the captive family</h2><p>It tears a goat and knocks Berak’s boy into the sea. It turns, slows and dives away during the mother’s song.</p></details><details><summary>The Fury of the Gods · 25</summary><h2>Preparing to meet the pursuing ships</h2><p>During the sea battle a large scaled, red-eyed and sharp-fanged individual rises between the ships after Vol and Iva sing. Svik says they summoned it. The enemy caster sings and it hisses/screeches before diving, appearing pained to Varg. This is not identified with the earlier goat-taking serpent or a universal rule about summoning or control.</p></details><details><summary>The Fury of the Gods · 30</summary><h2>The casters and the mother serpent</h2><p>A mother individual boards Sea-Wolf with a wagon-sized head and ash-spear-length black-scaled young clinging along her body. Vol welcomes and strokes her, then gives the bound caster to her. Orka interprets the subsequent demonstration and juvenile attacks as hunting instruction. Most leave with the captive beneath the sea; one stays coiled around Vol’s forearm. These are observed individuals and local actions, not universal behaviour or identification with earlier sightings.</p></details><details><summary>Illustration · The Fury of the Gods · 30</summary><p><a href="assets/6695f8968a0edf.jpg">Open noncanonical illustration</a></p><p>Vol greeting the mother serpent before the captive is delivered.</p></details></noscript>
