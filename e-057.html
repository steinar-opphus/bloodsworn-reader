      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 9</summary><h2>Introduction</h2><p>Biórr has black hair.</p></details><details><summary>The Shadow of the Gods · 9</summary><h2>The serpent and the captive family</h2><p>He brings porridge to Berak’s wife and son.</p></details><details><summary>The Shadow of the Gods · 14</summary><h2>Blood memories at the oath stone</h2><p>Biórr finds the campsite overlooking the Wave-Jarl. He and others burn the night-wyrms with flaming branches.</p></details><details><summary>The Shadow of the Gods · 23</summary><h2>Kinship and a proposed marriage</h2><p>Biórr tells Bjarn that his father has gone away and asked them to care for him; this is Biórr&#x27;s comforting account.</p></details><details><summary>The Shadow of the Gods · 25</summary><h2>A choice of loyalties</h2><p>Biórr compliments Elvar&#x27;s appearance and offers to help with her inner struggle.</p></details><details><summary>The Shadow of the Gods · 27</summary><h2>A raid and a stolen child</h2><p>Biórr is found unconscious, bleeding from a shoulder wound and his face.</p></details><details><summary>The Shadow of the Gods · 32</summary><h2>The promise of Oskutreð</h2><p>Biórr expresses guilt for Thrud&#x27;s death; this does not establish responsibility. Biórr promises to follow Elvar as well as Agnar and calls her Elvar Fire-Fist. Biórr kisses Elvar, who pulls back startled before Grend arrives to send her to watch.</p></details><details><summary>The Shadow of the Gods · 42</summary><h2>Survivors and the family Agnar chose</h2><p>Elvar thanks Biórr for saving her and Grend, kisses him and leads him away from camp beneath a willow. Her close view also reveals freckles on his cheek.</p></details><details><summary>The Shadow of the Gods · 42</summary><h2>Survivors and the family Agnar chose</h2><p>In the chapter 42 streamside scene, his hair is braided, with a loose strand falling across his face. A documented  separates observed features from the portrait&#x27;s artistic choices.</p></details><details><summary>The Shadow of the Gods · 44</summary><h2>On the road through the Dark-of-Moon Hills</h2><p>His shoulder bears a curling blue tattoo, and pale diagonal scars cross his dark-haired chest. He attributes the scars to a knotted leather whip. He tells Elvar he is twenty-two and that all his kin are dead; these personal disclosures remain his account.</p></details><details><summary>The Shadow of the Gods · 50</summary><h2>A deadly holmganga</h2><p>Chapter 50 reveals his betrayal: after the duel he approaches wounded Agnar and thrusts his spear into the chief’s mouth and throat. His motive is not explained in this chapter.</p></details><details><summary>The Shadow of the Gods · 52</summary><h2>Betrayal and the dragon&#x27;s release</h2><p>After killing Agnar he uses the chief’s keys to free Ilmur and Kráka. He declares himself Tainted, says Ilska offers the Tainted a home and condemns their enslavement. He acknowledges Thrud’s killing. Elvar identifies him with Rotta’s blood, but that lineage identification is her conclusion.</p></details><details><summary>The Shadow of the Gods · 52</summary><h2>Betrayal and the dragon&#x27;s release</h2><p>He avoids Elvar’s thrown spear with unnatural speed.</p></details><details><summary>The Hunger of the Gods · 5</summary><h2>A welcome among the Raven-Feeders</h2><p>Biórr is twenty-three and wears his black hair in a braid. Ilska gives him a raven feather and a gold arm ring with serpent-head terminals, which he tightens over his mail sleeve.</p></details><details><summary>The Hunger of the Gods · 5</summary><h2>A welcome among the Raven-Feeders</h2><p>His infiltration began close to three years earlier. He has spent over half his life with the Raven-Feeders but feels distant on returning. He hopes Tainted and untouched can live together in harmony, and feels shame over killing Agnar as the wounded man reached for help.</p></details><details><summary>The Hunger of the Gods · 5</summary><h2>A welcome among the Raven-Feeders</h2><p>He had personally handed Bjarn to the Raven-Feeders at Snakavik. Bjarn briefly recognises him at the new camp, saying “Tafl”.</p></details><details><summary>The Hunger of the Gods · 9</summary><h2>Old companions at the campfire</h2><p>He watches Myrk leave south with fifteen warriors and spare horses. Red Fain approaches; Biórr pulls away from his hand but remembers his early kindness. A welcome and meal with Storolf Wartooth ease some of his unease.</p></details><details><summary>The Hunger of the Gods · 9</summary><h2>Old companions at the campfire</h2><p>He sees Lik-Rifa transform and devour a guard while Drekr saves Ilska. When the goddess says she will try not to resemble her father’s appetite for his creations, Biórr silently notes what she has just done and keeps his objection to himself.</p></details><details><summary>The Hunger of the Gods · 14</summary><h2>Crossing Isbrún Bridge</h2><p>Crossing Isbrún Bridge with the company, he remains troubled by memories of Elvar. Ilmur thanks him for freedom; Biórr says he escaped enslavement when very young and was found by Red Fain. He recalls whipping and hopes Lik-Rifa will end Tainted subjection. These hopes remain his beliefs.</p></details><details><summary>The Hunger of the Gods · 14</summary><h2>Crossing Isbrún Bridge</h2><p>He recognises the tennúr nest beyond the bridge and runs to warn Ilska. He sees the creatures swarm Lik-Rifa without attacking, witnesses her change to human form and kneels. After her magic at the bridge boulder he can no longer see the bridge. She leads them east towards Nastrandir.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>He marches east with Fain and Storolf while Lik-Rifa, human for days, questions Ilska. Near the warm vaesen pit he helps make camp, but praise for killing Agnar only sharpens his wish to forget. He judges his act murder of someone who trusted him and dreams of Elvar accusing him; these are his moral judgments and dreams, not messages from her.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>Fain asks Storolf to give him time. Storolf’s joke about Myrk’s earlier southward departure draws a reply about her hoped-for return, not a sighting or news of her current captivity. Biórr questions using enslaved Tainted children to end Tainted enslavement and wonders whether his year among the untouched changed him.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>He is glad Kráka holds Bjarn’s hand as the children are assembled. He sees all their collars removed, hears crying and observes Lik-Rifa silence them through a brief threatening change, then demand loyalty as their queen and mother. He cannot tell whether they are terrified or enraptured; some seek her touch and others withdraw. He eventually joins the acclamation.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>At dawn Ilmur reports tracking a runaway. Biórr sees a subservient eagerness in him rather than proof of new formal enslavement. The other man, later naming himself Brák Trolls-Bane, beats the boy after an escape attempt. Biórr verbally objects, but does not stop the subsequent violence.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>The child fights back with the thrown knife, then suffers a broken hand and a deep cheek cut. He names himself Breca Thorkelsson and refuses to drop the patronymic. Brák names himself while threatening a lifelong scar. The chapter closes with Breca still alive and captive, not rescued by Biórr.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>At the Wave-Jarl camp Elvar recalls their former intimacy, calls him a liar and betrayer and threatens under her breath to cut out his heart if they meet again. He is absent and receives no warning in this scene; the conditional vengeance is not carried out.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>On the southward march along the eastern crags he sees Kráka, Bjarn and the bandaged Breca in a wagon. He feels guilty for having arranged Bjarn’s abduction, developing the earlier account of his handover, and decides to approach with tafl. Old friends greet him at camp, but his time with the Battle-Grim still feels like a barrier to those bonds.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>He assures Bjarn he is safe with his people, while Breca questions safety with a dragon. Bjarn briefly recognises him but remains distracted; Kráka only hopes lingering Seiðr will fade. He cannot tell whether the children’s lack of further escape attempts means acceptance or intimidation. Seeing Ilmur with Brák and Drekr worries him rather than proving a new formal enslavement.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>He plays tafl with Breca, surrounds the boy’s jarl and advises cunning and manoeuvre rather than aggression. Breca requests another game. He witnesses the boy’s grief over his father but does not free him or prevent Kráka’s warning about another broken hand.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>Lik-Rifa’s speech stirs pride and worth after years of shame and whipping. He watches Ilska’s partial change and the children’s bloodline exercise: Bjarn says bear, a camp boy called Harek says boar, and Breca says wolf and bear. The narration calls dual blood rare and highly valued; Biórr predicts Breca will become fierce and powerful, without a demonstrated transformation.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>At the approaching swarm he reaches for his seax and regrets leaving his spear at Storolf’s fire. Lik-Rifa halts the dragon-born’s rune-fire preparations and welcomes the tennúr. He cannot understand their many voices, but hears her enraged declaration that her brother crossed Isbrún Bridge. No new attack or change of his allegiance occurs.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>Nastrandir revealed in the snow</h2><p>He marches through slush after a blizzard, having slept under snow in his sealskin cloak and sheepskin blanket. The Bonebacks come into sight. Ilska and the dragon-born clear a path through the snow with Galdur-rune powers while the carts labour and children walk.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>Nastrandir revealed in the snow</h2><p>He sees Bjarn’s eyes clear and bright and finds him more like the boy he knew, while Kráka only thinks the Seiðr is gone. Breca still has his splinted hand and now a red-wealed scar beneath one eye; he and the camp boy Harek join in the food and laughter. Biórr’s observation of warmth and improvement does not establish safety, rescue or a changed political allegiance.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>Nastrandir revealed in the snow</h2><p>He sees the returning tennúr and reaches the sea-facing serpent-shaped promontory with the column. Lik-Rifa transforms and appears stronger, then roars and sings before the cliff erupts. Biórr is thrown down, rises through settling spray and dust and sees Nastrandir’s huge silver-edged black doors and bowing carved serpents. No injury or death for him is stated, and he has not entered the hall.</p></details><details><summary>The Hunger of the Gods · 42</summary><h2>Inside Nastrandir&#x27;s great hall</h2><p>He enters Nastrandir beside Fain and Storolf, uneasy beneath the animated granite serpents. Lik-Rifa is human and lights enormous braziers; Biórr sees dry stone, great serpent-carved pillars, high shafts of daylight and tables beside ash-filled hearth pits. The scale makes him dizzy, and the outer doors close after the column enters.</p></details><details><summary>The Hunger of the Gods · 42</summary><h2>Inside Nastrandir&#x27;s great hall</h2><p>After Lik-Rifa’s interaction with a throne serpent and her declaration of an earlier visitor, he readies his shield and spear and follows her through further chambers. He passes the internal pier and boats, then stands armed when her command throws open the doors to a furnished, occupied food hall. He witnesses the grinning man whom she names Rotta welcome her as sister. No combat or new injury follows in the chapter.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>He eats beside Fain and Storolf, joyful to sit before Rotta, whom he regards as his bloodline’s father. He sees Kráka whispering to a serious Bjarn amid the general cheer. He assumes the frequently speaking tennúr may be chief, but this is not an established office. The creature is named Tannbursta during the table exchange.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>He laughs as Storolf defends Tannbursta, knocks Oleif unconscious and supplies a tooth which the vaesen eats. Rotta later rests a hand on his shoulder; Biórr feels power and friendship and agrees with the god’s claim to sense shared blood. Rotta’s sympathy prompts memories of persecution and tears. His promise to make things right remains unfulfilled here.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>He observes the cheering response to Lik-Rifa’s cause, with Harek joining while Breca glowers. Her song overwhelms his senses and he almost sees tendrils leaving the hall; Rotta calls it a summons to her created vaesen. This is Biórr’s subjective impression plus an attributed explanation, not proof of physical tendrils, measured range or incoming forces.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>He and Storolf teach children through a padded seax-and-long-axe demonstration. Breca identifies the shield opening and asks about swords; Biórr distinguishes sword-hilt danger and gives advice about cost and skill. Breca infers he won his own sword from a dead enemy, without a narrated acquisition. The pair then correct weapons grips, stance, footwork and balance.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>Rotta’s approach excites his rat nature, which he calms. The god’s praise makes him proud while the children practise more fiercely. Biórr sees the mixed hall community as their hoped-for safe world. He comforts Storolf over the loss of his felt connection to Kalv and thinks the brother has probably died, an inference rather than direct confirmation.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>He observes vaesen arrivals and the war council. Lik-Rifa’s promised punishment and freedom from enslavement renew his pride and sense that past sacrifices were worthwhile, yet Agnar’s face remains in his thoughts. This is personal justification, not actual liberation or the erasure of his earlier doubts. He hears the campaign order against the three rulers and Ulfrir.</p></details><details><summary>The Hunger of the Gods · 58</summary><h2>Biórr&#x27;s rat senses and a captured message</h2><p>His rat sharpens hearing and smell and increases skeletal flexibility enough to compress into narrow gaps. On dock duty he allows Kráka and Bjarn to flee, then lends Kráka his spear to knock him down as a cover story. He suffers vomiting, head and jaw pain, and a linen head dressing; he lies to Storolf about remembering the attack.</p></details><details><summary>The Hunger of the Gods · 58</summary><h2>Biórr&#x27;s rat senses and a captured message</h2><p>Rotta&#x27;s private warning makes him suspect the god knows. After recapture, Brák challenges his account and Ilska orders him to kill Kráka. A voice associated with Rotta urges self-preservation. Biórr drives his spear into her throat; no later condition is shown before the chapter ends.</p></details><details><summary>The Hunger of the Gods · 62</summary><h2>The army departs for Svelgarth</h2><p>He prepares to march on Svelgarth in the rearguard behind wagons and children, carrying mail, sealskin cloak, sword, seax, shield and travel/medical kit. He urges vengeance for Storolf&#x27;s brother Kalv and frames the campaign as ending Tainted enslavement. Passing Kráka&#x27;s blood, he now feels emptiness; narration calls him her executioner.</p></details><details><summary>The Hunger of the Gods · 73</summary><h2>Biórr at the siege</h2><p>Myrk expresses tender attachment, but he remains haunted by Elvar and his betrayals, including Kráka&#x27;s killing. He returns to guard the wagons and children and insists on obeying Rotta rather than joining the attack.</p></details><details><summary>The Hunger of the Gods · 75</summary><h2>The rescuers pursued</h2><p>He recognises Orka taking Breca and Bjarn and chooses pursuit out of fear of punishment, despite a moment of compassion. In mail but no helm or shield, he spears Revna through the chest. Orka knocks him into a fire; he rises injured and fights Gunnar, who disarms him before Rotta&#x27;s returning guards intervene.</p></details><details><summary>The Fury of the Gods · 5</summary><h2>With Skaga he carries Ilmur&#x27;s corpse beside Storolf</h2><p>With Skaga he carries Ilmur&#x27;s corpse beside Storolf. He grieves and feels guilt over raising the alarm, counterfactually imagining that allowing Orka and Breca to go might have saved his friends. He tells wounded Fain that continuing the war is necessary to change their people&#x27;s fate and give the dead&#x27;s sacrifice meaning; Fain nods.</p></details><details><summary>The Fury of the Gods · 5</summary><h2>With Skaga he carries Ilmur&#x27;s corpse beside Storolf</h2><p>Rotta assigns him the recaptured children, Orka and Myrk&#x27;s prisoners. He sends Skaga to take the children, but privately wants revenge and recognition rather than guard duty. Myrk calls him lover and he blushes. Rotta praises him as a thinker and orders preparations for Darl.</p></details><details><summary>The Fury of the Gods · 7</summary><h2>Orka sees him as young and slim, with suffering apparent in his gaze</h2><p>Orka sees him as young and slim, with suffering apparent in his gaze. As her guard he argues for Tainted liberation and claims Breca was treated well and unharmed, which she challenges with the murder of his father and abduction. He acknowledges complexity but maintains hope in the gods, then returns to his hatred over his dead friends. His assurances do not supersede the documented abuse of Breca.</p></details><details><summary>The Fury of the Gods · 7</summary><h2>Orka sees him as young and slim, with suffering apparent in his gaze</h2><p>At camp Myrk embraces and kisses him before sending vulnerable prisoners to the vaesen. When Orka confronts him with his promise of a fair world, he looks away; no explicit renunciation of the cause is spoken.</p></details><details><summary>The Fury of the Gods · 11</summary><h2>Myrk calls him friend and more, kisses him with unusual tenderness and helps him up after intimacy</h2><p>Myrk calls him friend and more, kisses him with unusual tenderness and helps him up after intimacy. Fain warns him not to stray beyond the guard-line; Biórr recalls finding six dead rearguard skraeling and no trailing prisoners the previous evening. He has removed the children&#x27;s restraints and credits kindness, games and meals for his belief they will stay. His memory of finding Bjarn unconscious beneath a smashed wagon explains the failed escape.</p></details><details><summary>The Fury of the Gods · 11</summary><h2>Myrk calls him friend and more, kisses him with unusual tenderness and helps him up after intimacy</h2><p>Rotta&#x27;s praise makes him proud, but Orka&#x27;s warning about gods continues to trouble him. After she refuses Rotta&#x27;s bargain, Biórr hears the god&#x27;s angry voice in his head while the face remains calm. No general psychic power is explained. He steps close with a spear when Fain strikes Dagrun and the prisoners stir; Dagrun orders calm.</p></details><details><summary>The Fury of the Gods · 13</summary><h2>He hears Orka disclose Ulfrir’s destination and reacts in surprise that Elvar is now chief</h2><p>He hears Orka disclose Ulfrir’s destination and reacts in surprise that Elvar is now chief. He describes Snakavik’s westward location and skull-built town to Rotta. Myrk watches him and speculates about Elvar seeking her father’s help; neither speaker demonstrates current knowledge of Störr’s death or Elvar’s takeover.</p></details><details><summary>The Fury of the Gods · 15</summary><h2>Orka sees him move in response to Rotta’s god-voiced order as the warband forms its defensive wall</h2><p>Orka sees him move in response to Rotta’s god-voiced order as the warband forms its defensive wall. The source does not give his later individual actions during the ensuing collapse.</p></details><details><summary>The Fury of the Gods · 16</summary><h2>He and Fain survive the first attack within a knot of twelve to fifteen Raven-Feeders</h2><p>He and Fain survive the first attack within a knot of twelve to fifteen Raven-Feeders. Seeing Myrk dead and Orka taking her belt and seaxes, he screams and charges. He turns the rat’s fear into aggression, feeling strength flood him; Fain, companions and Skaga’s skraeling follow.</p></details><details><summary>The Fury of the Gods · 16</summary><h2>He and Fain survive the first attack within a knot of twelve to fifteen Raven-Feeders</h2><p>He confronts the Bloodsworn defender identifiable as Gunnar through the Revna connection and continuous party. Their exchange wounds Gunnar’s upper back and Biórr’s shield arm. Gunnar knocks him down and pins his wrist, accusing him of killing Revna. Harek interrupts the raised axe, standing over Biórr with yellow eyes and lower-jaw tusks. Neither Biórr’s escape nor a final death is shown.</p></details><details><summary>The Fury of the Gods · 24</summary><h2>He returns alive to Darl beside Rotta, with Fain wounded and Harek on a wagon</h2><p>He returns alive to Darl beside Rotta, with Fain wounded and Harek on a wagon. How he escaped the valley’s final unseen moments is not supplied, and Bjarn is not individually sighted. He agrees not to disclose the raid’s losses, fearing Lik-Rifa’s response, and carries Myrk’s linen-wrapped body to her siblings, hiding the throat wound.</p></details><details><summary>The Fury of the Gods · 24</summary><h2>He returns alive to Darl beside Rotta, with Fain wounded and Harek on a wagon</h2><p>He tells Ilska and Drekr that Orka killed Myrk and identifies her through Breca and the earlier Darl pursuit. Inside he struggles with his rat’s fear of the floor serpents, then listens to the heart-power discussion. Rotta reveals Elvar’s company connection and Lik-Rifa asks him for details; his reply is not shown.</p></details><details><summary>The Fury of the Gods · 36</summary><h2>The dragon’s host marches out</h2><p>He mounts in Darl as Fain prepares the children’s wagon, sharing hopes for freedom from thraldom and vengeance. Rotta calls him beside him behind the leaders; he sees hundreds of hopeful, half-starved Tainted and the growing mixed host. Rotta explains the land route towards Snakavik as accommodating unwilling sailors and avoiding divided forces, with the motive speculative. Biórr sees Sterkur and Leif join, then the army leaves town and gathers more vaesen. His confidence that they are unbeatable meets Rotta’s warning.</p></details><details><summary>The Fury of the Gods · 41</summary><h2>At camp he grieves Myrk alone despite the crowd</h2><p>At camp he grieves Myrk alone despite the crowd. Ilska thanks him for returning her body and the joy he brought; he says it was mutual. He gives her a profile of Orka’s wolf-blood, weapons, maternal courage and resistance until Spert was threatened, then her Bloodsworn connection and his own earlier killing. Ilska cites Sterkur’s hiring intelligence. He regrets betraying Elvar without changing sides. At departure she gives him a feather she says was Myrk’s, and he braids it into his hair.</p></details><details><summary>The Fury of the Gods · 41</summary><h2>At camp he grieves Myrk alone despite the crowd</h2><p>He sees the diminished, bandaged hunting party and initially wonders if Estrid/Skalk caused the losses. Their report instead describes Faunir and a negotiation. He reacts with the others to Ulfrir’s collar news, hears the spy offer and Munni’s verification of ships/stone wolves at the den. Lik-Rifa calls the wolf weak, an assessment rather than proven condition.</p></details><details><summary>The Fury of the Gods · 50</summary><h2>The burned wagons and the captive children</h2><p>He searches the burned supplies and finds Fain alive with an unconscious but breathing girl Aila, then directly sees Bjarn among the children. His protection argument cannot answer Bjarn’s charge that the Raven-Feeders used them without consent. He predicts Elvar would enslave Bjarn, but cannot prove it; when Bjarn asks to leave, neither adult grants permission and Fain stops him. Biórr later hears council reports of nightly losses, desertion, short supplies and reinforcements. Kept back by Rotta, he assesses Elvar’s cunning and hears the conditional insider report, without named betrayers or a murder method.</p></details><details><summary>The Fury of the Gods · 53</summary><h2>A night march under false campfires</h2><p>He praises Fain’s teaching despite unhealed mobility and watches the recovering group, with Harek/Bjarn still aggressive in covered-spear practice. Hearing Rotta’s internal call, he rides to the gods through the moving night column. Skadi greets him as brother but Biórr rejects blood alone as kinship. He hears the night-deception plan, the dragon’s ward complaint and an unspecified dangerous contingency, then sees Broðir/Silrið brought alive and hears the confirmed assassination mission and claimed control-succession argument.</p></details><details><summary>The Fury of the Gods · 57</summary><h2>He follows Rotta through the forest with about twelve others and asks where they are going</h2><p>He follows Rotta through the forest with about twelve others and asks where they are going. Rotta’s answer gives no destination before they disappear into the trees; no final mission, attack or new injury is shown.</p></details><details><summary>The Fury of the Gods · 64</summary><h2>The rat-blood climb the cliff</h2><p>He follows Rotta around the hill, crosses the river by raft and climbs barefoot after removing shoes/socks. His rat-blood lengthens/hardens fingers/toes/nails and sharpens grip; when his sword catches, Rotta takes his slipping wrist and hauls him up. The host’s new campfires make him infer neither total defeat nor victory, not a complete battle report.</p></details><details><summary>The Fury of the Gods · 64</summary><h2>The rat-blood climb the cliff</h2><p>He follows the crouching crew to a ruined tower, passes stripped kit through a hand-width seam and uses pliable rat-blood bones/ribs to squeeze inside. Rat-enhanced sight resolves the cramped space and he re-dresses. Rotta dissolves a blue barrier with words claimed from a tortured daughter, then calls Skalk/Estrid and gets a single unidentified reply. No hall arrival, murder or universal immunity is shown.</p></details><details><summary>The Fury of the Gods · 66</summary><h2>Skalk and an unnamed fair-haired drengr guide him and Rotta’s crew downward</h2><p>Skalk and an unnamed fair-haired drengr guide him and Rotta’s crew downward. He struggles with rat-blood fear, while Rotta explicitly assigns him the killing blow against Elvar. Remembered intimacy complicates his hostility; his justification repeats her slaving/god-thralling past, without acknowledging the freedom the reader has seen. It is his rationale, not a current description of her policy.</p></details><details><summary>The Fury of the Gods · 66</summary><h2>Skalk and an unnamed fair-haired drengr guide him and Rotta’s crew downward</h2><p>At the door Skalk names as Elvar’s room he silently draws from a grease/sheepskin-lined scabbard, turns the ring-handle and enters. Agnar’s bearskin on the chair confirms the chiefship to him. The shadowed bed figure shows mail and blonde braids, but as he raises his sword a separate unnamed defender shouts Chief and lunges with a spear. Neither sword strike nor spear impact is shown.</p></details><details><summary>The Fury of the Gods · 67</summary><h2>The attack on Elvar’s chamber</h2><p>He emerges from the bedroom fight with more beard, dark sad eyes and two black raven feathers silver-wired into his braids. At a kill order he attacks Elvar, receives a cheek/neck axe cut and uses rat-blood speed to force her back; her mail holds against his blade. Rotta urges him to finish and threatens to do it himself.</p></details><details><summary>The Fury of the Gods · 67</summary><h2>The attack on Elvar’s chamber</h2><p>Elvar traps his sword arm, head-butts his nose and cuts behind a leg, then sends his sword off the branch and pins his wrist with her foot. At her sword point he repeats the old enthralling accusation and is visibly shocked to hear she freed Ulfrir and all Tainted. He shouts No as an unnamed assailant attacks her neck and pushes her toward the stair edge. No completed Biórr killing of Elvar, named Sólín killing, rescue or later fate is shown.</p></details><details><summary>The Fury of the Gods · 69</summary><h2>Biórr’s doubts amid the fighting</h2><p>He watches the host enter while doubting whether Elvar lied about freedom, reasoning that she had not needed to when she held his life. Rotta has hauled him up and led him down with Skalk/unnamed drengr. As Grend attacks he jumps clear, then finds his sword still gone, takes an anonymous Fell-Hearted raven shield and recognises/reclaims Elvar’s light axe from the floor. No final allegiance change is yet stated.</p></details><details><summary>The Fury of the Gods · 69</summary><h2>Biórr’s doubts amid the fighting</h2><p>Answering Rotta’s explicit mental cry, he uses the axe to sever the tail pinned beneath Ulfrir, freeing the rat and leaving himself cornered against the trunk. Only afterward, as the dragon lands and Broðir fails to command the wolf, does the collarless Ulfrir’s declaration convince him Elvar spoke true. The dragon kills Broðir and leaps at Ulfrir; Biórr’s next choice and fate remain unshown.</p></details><details><summary>The Fury of the Gods · 80</summary><h2>He kneels/kisses Snaka’s hand, confirms descent from Rotta and feels the god’s overwhelming presence</h2><p>He kneels/kisses Snaka’s hand, confirms descent from Rotta and feels the god’s overwhelming presence. Exhausted and uneasy, he finds Fain/Harek/the children alive. Rotta acknowledges the tail-cut rescue and Biórr still has Elvar’s axe; confronting him over Elvar’s freedom declaration brings an admission that she told him, coupled with a claim of disbelief. Biórr’s regret persists.</p></details><details><summary>The Fury of the Gods · 80</summary><h2>He kneels/kisses Snaka’s hand, confirms descent from Rotta and feels the god’s overwhelming presence</h2><p>He witnesses Snaka dominate the meal, then sees the poison attempt and hears Rotta reveal the heart plan. Snaka begins expelling the poison before the siblings attack with knives, cut his throat and remove the heart. An unnamed tennúr takes it before consumption.</p></details><details><summary>The Fury of the Gods · 80</summary><h2>He kneels/kisses Snaka’s hand, confirms descent from Rotta and feels the god’s overwhelming presence</h2><p>More tennúr warn of the wolf as Rotta/Lik-Rifa begin changing and figures charge from the forest. He turns toward the attack, without its identities or outcome established here.</p></details><details><summary>The Fury of the Gods · 87</summary><h2>Biórr returns Bjarn</h2><p>At dawn he watches Tainted fight one another, recalls Elvar/Orka and rejects the gods’ war and revenge. After Faunir spare the wagon, he persuades Fain to take the children away. He stays for Bjarn, sheathes an available sword again without narrated retrieval, shields the boy through battle and gives him Elvar’s axe before returning him to Uspa/Berak.</p></details><details><summary>The Fury of the Gods · 87</summary><h2>Biórr returns Bjarn</h2><p>He turns away from the reunion and explicitly refuses Rotta’s renewed mental help command. Gunnar Prow then axes his temple, pins him underfoot and delivers a final blow for Revna. His death is strongly implied at the ending, without a separate corpse or burial scene.</p></details><details><summary>The Fury of the Gods · 88</summary><h2>Thorkel avenged and the final advance</h2><p>Gunnar explicitly reports the rat-blood dead after the finishing blow, confirming Biórr’s death as the direct attacker’s report. His preceding Bjarn rescue and refusal of Rotta remain part of the chronology.</p></details><details><summary>Illustration · The Shadow of the Gods · 43</summary><p><a href="assets/7defc154812176.jpg">Open noncanonical illustration</a></p><p>Biórr alone beside the camp stream.</p></details><details><summary>Illustration · The Fury of the Gods · 5</summary><p><a href="assets/14f93446e928c5.jpg">Open noncanonical illustration</a></p><p>Biórr and Fain after the escape.</p></details><details><summary>Illustration · The Fury of the Gods · 16</summary><p><a href="assets/5c77717d0b0b6f.jpg">Open noncanonical illustration</a></p><p>Biórr and Fain during the brief shield-wall respite.</p></details><details><summary>Illustration · The Fury of the Gods · 66</summary><p><a href="assets/1cf47a825aed2b.jpg">Open noncanonical illustration</a></p><p>Biórr at the door before entering.</p></details><details><summary>Illustration · The Fury of the Gods · 50</summary><p><a href="assets/0853f7b48aa5cf.jpg">Open noncanonical illustration</a></p><p>Bjarn asking to choose whether to leave.</p></details><details><summary>Illustration · The Fury of the Gods · 87</summary><p><a href="assets/54c50d8382e602.jpg">Open noncanonical illustration</a></p><p>Bjarn’s reunion with his parents.</p></details><details><summary>Illustration · The Fury of the Gods · 67</summary><p><a href="assets/6dd2b44918ef5a.jpg">Open noncanonical illustration</a></p><p>Elvar overcoming Biórr before the later attack.</p></details><details><summary>Illustration · The Fury of the Gods · 87</summary><p><a href="assets/ad63c782561464.jpg">Open noncanonical illustration</a></p><p>Faunir emerging from the forest at dawn.</p></details><details><summary>Illustration · The Fury of the Gods · 41</summary><p><a href="assets/5e856db37aaf63.jpg">Open noncanonical illustration</a></p><p>Ilska giving Biórr the feather she says was Myrk’s.</p></details><details><summary>Illustration · The Fury of the Gods · 7</summary><p><a href="assets/01668593708551.jpg">Open noncanonical illustration</a></p><p>Orka and Biórr on the march.</p></details><details><summary>Illustration · The Fury of the Gods · 64</summary><p><a href="assets/2aae14c652974b.jpg">Open noncanonical illustration</a></p><p>Rotta catching Biórr’s slipping wrist.</p></details><details><summary>Illustration · The Fury of the Gods · 80</summary><p><a href="assets/37be3fc75eb662.jpg">Open noncanonical illustration</a></p><p>Snaka expelling the poison before the knife attack.</p></details><details><summary>Illustration · The Fury of the Gods · 53</summary><p><a href="assets/d5418f7575f773.jpg">Open noncanonical illustration</a></p><p>The ordered night march with campfires left burning.</p></details><details><summary>Illustration · The Fury of the Gods · 69</summary><p><a href="assets/ee64a1f54290d6.jpg">Open noncanonical illustration</a></p><p>The moment before Biórr frees the pinned rat.</p></details><details><summary>Illustration · The Fury of the Gods · 80</summary><p><a href="assets/b1d8da09570245.jpg">Open noncanonical illustration</a></p><p>The unnamed tennúr’s flight; its stolen cargo is hidden from view.</p></details><details><summary>Illustration · The Fury of the Gods · 64</summary><p><a href="assets/d1551f7b80fc0b.jpg">Open noncanonical illustration</a></p><p>The tower ward yielding to Rotta’s words.</p></details></noscript>
