      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 32</summary><h2>The promise of Oskutreð</h2><p>The Wave-Jarl crosses Lake Horndal. Lake Horndal provides one of only two passes through the Bonebacks to the northern Battle-Plain.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>Wounds tended and seaxes compared</h2><p>Edel says the north-western path along the Bonebacks leads from the mine towards Lake Horndal and Starl. This is a suggested lead for Orka, not confirmation of the Raven-Feeders’ origin or Breca’s location.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>Orka’s pursuit of Myrk’s earlier tracks leads north-west through the Boneback foothills, ever closer to Lake Horndal. The party does not arrive at or cross the lake in this chapter.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>Elvar’s southward march reaches sight of the lake as softer woodland changes from ash and elm to alder and willow. The company then returns to the Wave-Jarl, which lies moored in a river. No renewed lake crossing or exact camp coordinates are given.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>Orka&#x27;s search in Starl</h2><p>Starl spreads along the southern shore, with the River Hvítá winding south from the lake towards Snakavik. Myrk says she earlier crossed on a knarr; Halja’s tracks lead into Starl rather than around the shore. Orka intends to buy a passage, but does not book or embark here.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>Orka&#x27;s search in Starl</h2><p>From the docks the northern shore is beyond Orka’s enhanced sight. Reeds edge the shore with swans, geese and other waterbirds; Snaka’s grey-green rib arches above the lake. Orka’s head pulses and a wolf-like howl grows near a drakkar bearing Battle-Grim shields. Her initial attribution to Snaka and the caller’s identity remain uncertain.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>Orka&#x27;s search in Starl</h2><p>From the southern approach, the lake shimmers like silver in sunlight between two mountains. The Bonebacks rise to east and west; the eastern peaks are white-capped and lost in cloud when Orka approaches.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The laden ship reaches Starl</h2><p>The Wave-Jarl completes a new crossing towards Starl, low and sluggish from the Oskutreð gold and silver. Cold wind has sped the passage; at the docks her sail is stowed and the crew rows. Sólín brings her to an empty pier and Sighvat throws the mooring line. This identifies and docks the Battle-Grim vessel left unnamed in Orka’s earlier viewpoint.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>From the Wave-Jarl at Starl, Elvar sees Orka’s riders on a track between the shore and the tree-shrouded Boneback slopes, confirming what Uspa, Ulfrir and Skuld have been watching. Their stop gives Elvar the impression that they look back; no communication across the water is confirmed.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>The ship casts off into ice-bright water and gathers speed through white foam. Sighvat steers towards a river mouth on the lake’s southern edge, and Elvar names the River Hvítá and Snakavik as the route ahead. The weather and bright water are scene details, without a stated season or completed river voyage.</p></details><details><summary>The Hunger of the Gods · 50</summary><h2>The wolf&#x27;s call across the lake</h2><p>From the shoreline track Orka looks across to Starl’s docks and the Wave-Jarl, using a flicker of her wolf to sharpen her senses. She sees Ulfrir with Skuld and Uspa and experiences his voice in her head before the moving ship draws her last look. This supplies her side of the preceding viewpoint’s pause, without a measured communication range or confirmed receipt of her reply.</p></details><details><summary>The Hunger of the Gods · 50</summary><h2>The wolf&#x27;s call across the lake</h2><p>While the riders halt and Sæunn returns from ahead, Orka whistles. Spert climbs dripping from the lake on their left and Vesli hovers in from trees on their right holding Breca’s spear. Their reunion follows an expected docks lookout rather than an actual lake passage by Orka’s group.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>The opening account places two days of Sæunn’s pursuit north along the lake before turning east around the northern Bonebacks. Orka reads the actual tracked course as corroborating Elvar’s eastern direction rather than Myrk’s western guidance. No new lake crossing or sighting of Breca occurs.</p></details><details><summary>Illustration · The Hunger of the Gods · 36</summary><p><a href="assets/d5bd27d46e2800.jpg">Open noncanonical illustration</a></p><p>Lake Horndal seen from the southern shore beside Starl&#x27;s docks.</p></details></noscript>
