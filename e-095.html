      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 10</summary><h2>Introduction</h2><p>The woman beside Sigrún has a tattooed head and wears a thrall collar.</p></details><details><summary>The Shadow of the Gods · 12</summary><h2>The fatal duel</h2><p>The warrior-thrall stabs Virk and tears his face with her teeth. Her eyes turn amber and teeth sharp.</p></details><details><summary>The Shadow of the Gods · 12</summary><h2>The fatal duel</h2><p>Thorkel calls her Ulfrir-kin and kicks her off Virk. She cuts him during the next exchange.</p></details><details><summary>The Shadow of the Gods · 12</summary><h2>The fatal duel</h2><p>A collar flash coincides with her collapse; further commands from Sigrún precede the fading of her changes.</p></details><details><summary>The Shadow of the Gods · 15</summary><h2>Grief and the decision to leave</h2><p>In B01-C015, Thorkel identifies her as Úlfhéðnar. Orka says she tasted Thorkel’s blood from her seax, while Thorkel says it might have been Virk’s. He argues that she is not Hundur and the blood would mean nothing to her.</p></details><details><summary>The Shadow of the Gods · 22</summary><h2>Vafri names herself and her master</h2><p>The warrior-thrall identifies herself as Vafri when Orka holds her at blade-point. She claims descent from both Ulfrir and Hundur, adding her own account to the earlier disagreement between Thorkel and Orka. She identifies Hakon as her master and says she was ordered to report signs of the Tainted to Drekr.</p></details><details><summary>The Shadow of the Gods · 22</summary><h2>Vafri names herself and her master</h2><p>She says she does not know Breca’s destination. Forced to guess, she offers Darl; this remains a suggestion under threat. She attacks Orka, raking with nails like claws; Orka breaks her arm, damages her face and stabs her belly. Orka takes her seax and leaves her described as dying.</p></details><details><summary>The Shadow of the Gods · 24</summary><h2>Her fate after the gut wound remains unknown</h2><p>Orka says Vafri may already be dead but may yet survive her gut wound; her death remains unconfirmed here.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>The fugitives reach Darl</h2><p>Guðvarr recalls her as an Úlfhéðnar whom Helka gifted to Sigrún, and remembers close company with her. This is his recollection, adding provenance without supplying her later fate.</p></details><details><summary>The Hunger of the Gods · 21</summary><h2>An audience with Queen Helka</h2><p>In the chapter 21 audience Helka speaks of Vafri as a painful loss, dear to her and pack to her Úlfhéðnar, and a valuable gift to Sigrún. Skalk explicitly says Orka slew Vafri. These later character statements report her death; the earlier narrative’s unresolved wound outcome is retained as historical evidence rather than silently rewritten.</p></details></noscript>
