      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 49</summary><h2>Chapter 49 — The frost-spider encounter</h2><p>Orka encounters two horse-sized black ravens near Grimholt. One is trapped in frost-web while the other tries to free it; both speak. Orka and the brothers intervene, and the birds repay the aid by saving her from a spider before thanking her and flying away. Neither bird’s name or ancestry is given here.</p></details><details><summary>The Shadow of the Gods · 51</summary><h2>Chapter 51 — Returning the aid</h2><p>They repay Orka’s aid by tearing the roof from Grimholt’s tower and attacking a guard. They bring Spert and Vesli, saying they found her friends looking for her.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>The pair intervene at the attacked farm, lifting and tearing skraeling apart and saving Orka from an axe threat. Afterwards one feeds while the other preens on the timber mound, now recognised as their nest. Gudleif says the residents supply food and a safe resting place for news and protection; the actual intervention supports his answer to Revna’s criticism of their late arrival.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>In B02-C057 the speaker beside Orka names herself Kló and names her mate Grok, explicitly identifying him as the raven saved from frost-web near Grimholt. Grok descends and thanks Orka. E-196 remains this pair; the new individual IDs E-299 and E-300 do not replace or merge its historical record. The earlier nameless accounts retain their chronology.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>They deny being vaesen and claim Snaka created them as he did giants, Froa and the person addressed, contrasting this with Lik-Rifa’s creation of vaesen. Grok says more ravens once served as Snaka’s messengers, eyes, ears and spies; Kló says Lik-Rifa disliked it. These are attributed accounts with no full taxonomy, population total or extermination mechanism. Grok explains their help as a returned favour, and Orka asks for an unspecified favour of her own.</p></details><details><summary>The Fury of the Gods · 30</summary><h2>The two giant ravens intervene directly, seize and dismember the caster Orka has speared</h2><p>The two giant ravens intervene directly, seize and dismember the caster Orka has speared. After the serpent departs they land on Sea-Wolf and speak as Grok and Kló, confirming the pair present. This does not independently prove which birds Halja saw earlier at great height.</p></details><details><summary>The Fury of the Gods · 32</summary><h2>Debts, kinship and the voyage onward</h2><p>They eat stripped enemy corpses after the battle, then hear Glornir’s thanks and debt acknowledgement. Calling the company friends, they offer to watch the skies for danger and the dragon after finishing their meal. Vol promises help when possible; no completed scouting flight or sighting occurs yet.</p></details><details><summary>The Fury of the Gods · 39</summary><h2>Their separate scouting reports bring news of a westbound dragon army and Elvar’s fleet in Jarnvidr</h2><p>Their separate scouting reports bring news of a westbound dragon army and Elvar’s fleet in Jarnvidr. They preen each other and identify Wolfdale/Wolf-Dale as Ulfrir’s home. Glornir requests a joint relay to Orlyg; the request is not yet a completed message or rendezvous.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>Arrival at the wolf-god’s hall</h2><p>Grok and Kló insist on joining the entry, wait on Sea-Wolf’s rail and hop ashore to follow the company. Their earlier relay to Orlyg is not separately narrated, though all parties now arrive together.</p></details><details><summary>The Fury of the Gods · 43</summary><h2>Allies meet and old loyalties surface</h2><p>They report the march, reconnect with Hrung and face Ulfrir’s accusation of past spying for Snaka and exclusive loyalty. They admit changed conditions after Snaka’s death and say friendship now keeps them safe; Orka vouches for rescues/message help. Elvar accepts friendship and asks continued watching, but no exact timetable or new flight follows.</p></details><details><summary>The Fury of the Gods · 44</summary><h2>The new arrivals and Grend’s fate</h2><p>An unnamed one of the pair flies into the hall and reports Lik-Rifa has reached Jarnvidr, shocking Skalk/Estrid. No individual Grok/Kló assignment, precise distance or completed battle is supplied.</p></details><details><summary>Illustration · The Fury of the Gods · 43</summary><p><a href="assets/3c80cc23ff516b.jpg">Open noncanonical illustration</a></p><p>Elvar accepting the ravens as friends and scouts.</p></details><details><summary>Illustration · The Shadow of the Gods · 53</summary><p><a href="assets/5ad3e346ea1bb7.jpg">Open noncanonical illustration</a></p><p>Giant ravens and frost-spiders clash above the wooded slope.</p></details></noscript>
