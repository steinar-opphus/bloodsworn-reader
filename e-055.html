      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 5</summary><h2>Introduction</h2><p>Agnar is Elvar’s chief. He steers the Wave-Jarl.</p></details><details><summary>The Shadow of the Gods · 5</summary><h2>Story and connections</h2><p>He demands the surrender of Berak. He claims Berak is gods-touched and dangerous to the villagers.</p></details><details><summary>The Shadow of the Gods · 5</summary><h2>Story and connections</h2><p>He throws a coin pouch on the beach and offers the villagers a choice to prosper or die.</p></details><details><summary>The Shadow of the Gods · 5</summary><h2>Story and connections</h2><p>He cuts Hrut’s chin and lower lip with his sword. He orders pursuit at the chapter’s close.</p></details><details><summary>The Shadow of the Gods · 7</summary><h2>The troll beside the molten pool</h2><p>Agnar identifies the captive as Berak Bjornasson, despite his denial. He threatens a boy with his sword, drawing blood.</p></details><details><summary>The Shadow of the Gods · 7</summary><h2>The troll beside the molten pool</h2><p>He commands HALDA and the collar flashes red as the captive halts. After Á HNÉN the man drops. Agnar intends to sell him.</p></details><details><summary>The Shadow of the Gods · 21</summary><h2>Harbour dues and the road to Störr</h2><p>Störr addresses him as Agnar Broksson, chief of the Battle-Grim, in B01-C021. Agnar pays harbour dues and further coin for speedier passage through checkpoints; he orders Thrud to find lodgings.</p></details><details><summary>The Shadow of the Gods · 21</summary><h2>Harbour dues and the road to Störr</h2><p>He offers Berak to Störr, claiming he is wanted by three jarls for murder, blood-debt and weregild and that his Seiðr-witch has confirmed his lineage. After Hrung’s blood-tasting pronouncement, Agnar accepts Störr’s offer of twice what he would receive elsewhere and promises loyalty. Silrið leads Berak away; Störr says she will bring the payment, which is not shown received here.</p></details><details><summary>The Shadow of the Gods · 23</summary><h2>Payment for Berak</h2><p>Gytha delivers a chest for Agnar, identified by Elvar as payment for Berak. Agnar takes the Battle-Grim and chest towards the Wave-Jarl to give Störr privacy.</p></details><details><summary>The Shadow of the Gods · 25</summary><h2>Elvar&#x27;s secret and her share of the spoils</h2><p>Agnar knew Elvar&#x27;s background when taking her in at seventeen and kept it private for almost four years. Agnar gives Elvar and Grend their shares of the Battle-Grim&#x27;s spoils; Grend collects both pouches. Agnar assures Elvar that she will always have an oar-bench on the Wave-Jarl whatever she chooses.</p></details><details><summary>The Shadow of the Gods · 27</summary><h2>Ilska&#x27;s raid and a vow of reprisal</h2><p>Agnar and the Battle-Grim pursue the attackers to the docks but arrive after their ship has departed. Agnar vows that Ilska will regret stealing from him. Agnar pays the landlord for the tavern&#x27;s damage. Agnar confirms Ilska&#x27;s Raven-Feeders took Bjarn and initially declines a costly pursuit. Agnar bargains for Uspa&#x27;s secret in exchange for recovering Bjarn.</p></details><details><summary>The Shadow of the Gods · 29</summary><h2>The blood oath to recover Bjarn</h2><p>Agnar says the gods-fall is dated to two hundred and ninety-seven years earlier. Uspa agrees to guide the group to Oskutreð first if all present swear the blóð svarið. Uspa, Elvar, Grend, Agnar, Sighvat and Kráka mingle blood over the carved runes.</p></details><details><summary>The Shadow of the Gods · 32</summary><h2>Carts, ponies and the secret destination</h2><p>Agnar buys five dismantled carts and eight pack-ponies in Starl. The oath participants keep Oskutreð secret from the rest of the Battle-Grim until reaching the lake&#x27;s north shore. Agnar questions whether Ilska knowingly kept a Tainted warrior without a thrall-collar. Agnar tells the crew their destination is Oskutreð and that Uspa learned the route before burning the book. Agnar admits the idea that Bjarn was taken for bargaining is a theory. Agnar has seen no sign of Ilska following but hopes she does, to make the rescue easier. Agnar publicly promises to recover Uspa&#x27;s son or die trying. Agnar tells even the unmarked crew they are bound by the oath if they follow him; no new magical binding is demonstrated.</p></details><details><summary>The Shadow of the Gods · 42</summary><h2>The family Agnar chose</h2><p>Agnar describes the Battle-Grim as his chosen family, saying he would die for them and will not abandon those bound to him. He tells Elvar that his mother died when he was ten, his father tried to sell him after crop failure when he was eleven, and he killed the would-be buyer with a wood-axe before fleeing. These childhood events are his testimony.</p></details><details><summary>The Shadow of the Gods · 32</summary><h2>Carts, ponies and the secret destination</h2><p>Agnar has blond hair in a central warrior-braid with the rest of his scalp shaved to stubble, and a blond braid in his beard. In the chapter 32 camp address he reveals spiralling oath scars around his hand, wrist and forearm. A documented  distinguishes source details from artistic choices.</p></details><details><summary>The Shadow of the Gods · 48</summary><h2>A promise to the guardian</h2><p>He pledges that his company will not approach the dead tree after Vörn binds Sighvat, then sends the Battle-Grim to gather relics on the surrounding plain.</p></details><details><summary>The Shadow of the Gods · 50</summary><h2>Victory in the duel and Biórr&#x27;s betrayal</h2><p>At Oskutreð he accepts a holmganga against Ilska’s brother Skrið and kills him despite severe wounds. Biórr then approaches and drives a spear into Agnar’s open mouth and throat, causing him to fall backwards.</p></details><details><summary>The Shadow of the Gods · 52</summary><h2>Agnar&#x27;s death confirmed</h2><p>Chapter 52 confirms his death after Biórr’s spear thrust. His victory over Skrið precedes the betrayal and remains part of that sequence.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>A duel for the Battle-Grim</h2><p>His succession is settled by Huld and Elvar’s duel. Elvar grips the troll tusk he gave her and thinks that she misses him. After her victory Sighvat transfers his bearskin chief’s cloak to her and proclaims her Elvar Fire-Fist.</p></details><details><summary>Illustration · The Shadow of the Gods · 43</summary><p><a href="assets/43ef87fc7e41c5.jpg">Open noncanonical illustration</a></p><p>Agnar beside the camp firepit.</p></details><details><summary>Illustration · The Hunger of the Gods · 28</summary><p><a href="assets/146336e987757a.jpg">Open noncanonical illustration</a></p><p>Sighvat fastens Agnar&#x27;s bearskin cloak around Elvar before proclaiming her chief.</p></details></noscript>
