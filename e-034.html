      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 3</summary><h2>Introduction</h2><p>Virk is a fisherman. Orka and Thorkel have traded with him many times.</p></details><details><summary>The Shadow of the Gods · 3</summary><h2>Story and connections</h2><p>He injured his arm when his boat was caught in a storm. His two sons fish while he heals.</p></details><details><summary>The Shadow of the Gods · 3</summary><h2>Story and connections</h2><p>He says Sigrún went to Queen Helka’s court in Darl. He objects that Helka’s care would be rule. He says Fellur’s people were all freedmen and women not long ago.</p></details><details><summary>The Shadow of the Gods · 3</summary><h2>Story and connections</h2><p>He says he has heard of children being taken before.</p></details><details><summary>The Shadow of the Gods · 10</summary><h2>An Althing and a challenge</h2><p>Mord and Lif are Virk’s sons. He rows the family to the Althing.</p></details><details><summary>The Shadow of the Gods · 10</summary><h2>An Althing and a challenge</h2><p>He reports missing Haraldurson children and a murdered family with missing sons at Kergarth.</p></details><details><summary>The Shadow of the Gods · 10</summary><h2>An Althing and a challenge</h2><p>He objects to Helka’s rule and accepts Guðvarr’s duel challenge. He asks Orka to act as his second.</p></details><details><summary>The Shadow of the Gods · 12</summary><h2>The fatal duel</h2><p>Virk wounds Guðvarr’s shoulder and declares him outside the duel boundary. After further insult, Virk swings at his head.</p></details><details><summary>The Shadow of the Gods · 12</summary><h2>The fatal duel</h2><p>Sigrún’s thrall repeatedly stabs Virk and mauls his face. Thorkel declares him dead. His sons and the family carry his body away.</p></details><details><summary>The Shadow of the Gods · 15</summary><h2>Grief and the decision to leave</h2><p>After his death, Orka’s family helps his sons raise a barrow over him. Orka says he taught his sons a trade and that they have a fishing boat.</p></details><details><summary>The Fury of the Gods · 82</summary><h2>Lif confronts Guðvarr at the forest edge, vowing revenge for the murder of his father and brother</h2><p>Lif confronts Guðvarr at the forest edge, vowing revenge for the murder of his father and brother. This invokes the established family losses without retelling or changing their original death accounts.</p></details><details><summary>The Fury of the Gods · 85</summary><h2>Lif’s reckoning with Guðvarr</h2><p>Lif recounts the father’s broken holmganga and the chained/venom-weakened brother’s stabbing as he confronts Guðvarr. After defeating him he demands them back and brings his axe down, strongly implying the end of his family revenge; no resurrection or changed death history follows.</p></details></noscript>
