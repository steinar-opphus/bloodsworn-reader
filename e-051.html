      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 11</summary><h2>Introduction</h2><p>Glornir is the Bloodsworn warrior who intervenes at Varg&#x27;s camp, orders him released and declares him one of the company.</p></details><details><summary>The Shadow of the Gods · 11</summary><h2>Shield-Breaker and Gold-Giver</h2><p>The rescuer is named as Glornir. Røkia calls him their chief and Shield-Breaker; to Svik he is Gold-Giver.</p></details><details><summary>The Shadow of the Gods · 13</summary><h2>The blood oath that protects Sulich</h2><p>Glornir describes protection as part of his oath to the crew. When asked to surrender Sulich, he refuses because their promise has been sealed in blood. Svik also calls him Soul-Stealer.</p></details><details><summary>The Shadow of the Gods · 16</summary><h2>An apprenticeship before an akáll</h2><p>Varg discovers that the declaration made at his camp did not settle his place in the company. Glornir now calls him an apprentice, saved for the potential he saw in him. He refuses the akáll, demands skill and loyalty, and offers teaching, food and protection in exchange for learning, obedience and fighting. With the ship due to sail, he gives Varg money for equipment.</p></details><details><summary>The Shadow of the Gods · 18</summary><h2>Aslog&#x27;s spear and the dockside clash</h2><p>The chief gives Varg Aslog&#x27;s old spear and the dead man&#x27;s oar-bench place. At the docks, his refusal to hand Sulich over to Jaromir brings another confrontation. He swings his long-axe as the first arrow splinters at his feet, then his company shields him from the volley and forms against the cavalry charge.</p></details><details><summary>The Shadow of the Gods · 20</summary><h2>A commission from Queen Helka</h2><p>After meeting Helka in Logur&#x27;s hall, Glornir returns with Skalk and orders the crew to sail. Their work is to find and kill whatever is eating Helka&#x27;s people in the north, although the ship first heads south and west out of Liga. Glornir takes the steering oar, makes the passengers row and leaves Vol at the prow.</p></details><details><summary>The Shadow of the Gods · 26</summary><h2>Respect for Vol and grief for Skullsplitter</h2><p>He insists that Vol receive the same respect as any crew member risking a life aboard his ship. Svik&#x27;s account also presents a private grief: Glornir still mourns Skullsplitter, whom Svik calls his brother.</p></details><details><summary>The Shadow of the Gods · 34</summary><h2>No fires in the Boneback foothills</h2><p>At the farm, Glornir reports neither bodies nor blood. Later, in the Boneback foothills, he orders quiet and forbids campfires. He admits that he worries too, but says he does not know where to search and has made their route public so the woman can find them. Varg&#x27;s renewed request for an akáll meets a final refusal.</p></details><details><summary>The Shadow of the Gods · 43</summary><h2>Wounded by the bone-sword wielder</h2><p>The bone-sword wielder throws Glornir through the air and wounds him through his mail. Vol&#x27;s rune briefly protects him, but its destruction brings them both down; Varg intervenes before the next sword stroke.</p></details><details><summary>The Shadow of the Gods · 47</summary><h2>Vol revealed as his wife</h2><p>After Vol is taken, his grief is violent enough that Einar and others must brace a door against him. Svik identifies him as Berserkir, and Glornir explicitly names Vol as his wife, correcting the earlier impression that she was a thrall. He invites Varg into the company and gives him a silver arm ring, postponing the formal oath-words so they can pursue her rescue.</p></details><details><summary>The Shadow of the Gods · 53</summary><h2>The recognition at Grimholt</h2><p>Two days of tracking Skalk bring him to the burning Grimholt. He recognises Orka as Skullsplitter, asks after his brother and embraces her after hearing of a killing and her son&#x27;s abduction. The exchange establishes the recognition without making every earlier use of &#x27;brother&#x27; a statement of biological kinship.</p></details><details><summary>The Hunger of the Gods · 1</summary><h2>Rest and restraint in the burned hall</h2><p>At Grimholt he tells Orka that they found her with the wolf loose in her blood and explains Vol&#x27;s abduction. Orka supplies the boat escape account. He initially calls the reports of a freed dragon bad dreams.</p></details><details><summary>The Hunger of the Gods · 3</summary><h2>Mord&#x27;s burial and a blood feud</h2><p>Asking Orka about his brother, he explicitly calls Breca his nephew. He prioritises Vol&#x27;s rescue and decides to pursue towards Darl after hearing Lif&#x27;s and Vesli&#x27;s reports.</p></details><details><summary>The Hunger of the Gods · 7</summary><h2>An offer to return to the Bloodsworn</h2><p>The narration now explicitly identifies Thorkel as his younger brother and describes them both as big men. His gaze is nearly level with Orka’s. This chapter’s explicit relationship is kept distinct from the earlier attributed uses of “brother” and Skullsplitter.</p></details><details><summary>The Hunger of the Gods · 7</summary><h2>An offer to return to the Bloodsworn</h2><p>He tells Orka that he and the company would accept her back, though not as chief, despite anger and renewed grief at her departure. She refuses; he understands her focus on Breca and asks to share vengeance for Thorkel.</p></details><details><summary>The Hunger of the Gods · 7</summary><h2>An offer to return to the Bloodsworn</h2><p>He sends Edel towards the Sea-Wolf and offers her as a guide to Orka’s mine. He agrees to take the children as far as Darl and conditionally accepts Lif, while warning that he might kill him if trust fails. His claim that the Bloodsworn have killed to keep their secret remains attributed.</p></details><details><summary>The Hunger of the Gods · 7</summary><h2>An offer to return to the Bloodsworn</h2><p>He leaves Grimholt on horseback with his black shield and long-axe at his saddle. Lif publicly asks him to spare Guðvarr for Lif’s revenge, and he nods approvingly.</p></details><details><summary>The Hunger of the Gods · 11</summary><h2>Learning to control the wolf</h2><p>Three days south of Grimholt he keeps the company without fires while pursuing Skalk. He sharpens and tests his long-axe with his face set in hard lines, orders the camp to prepare, and tells chief scout Røkia to lead out when ready.</p></details><details><summary>The Hunger of the Gods · 13</summary><h2>News of a missing sister</h2><p>He sends Svik and Varg to obtain news at a river village, then inspects the opened barrow with the company. Einar observes that the dead man is not Skalk; Røkia explains Glornir’s grim satisfaction as wanting to kill Skalk himself. No encounter with the Galdurman occurs here.</p></details><details><summary>The Hunger of the Gods · 19</summary><h2>Scouting beyond the repaired bridge</h2><p>On reaching the outskirts of Darl, he carries his long-axe and a blood-spattered black shield, orders a concealed camp and goes to take a closer look. He agrees the Sea-Wolf is still distant but refuses to wait, planning to recover Vol and travel south along the river to meet it.</p></details><details><summary>The Hunger of the Gods · 19</summary><h2>Scouting beyond the repaired bridge</h2><p>He considers his promise to Orka fulfilled by bringing the children to Darl. He plans to let them stay in camp until the company leaves, then enter the town the following day. Einar warns of enslavement and argues that they are helpful, but Glornir insists they have slowed the pursuit and that speed will be essential after Vol’s recovery. The chapter ends before the plan is carried out.</p></details><details><summary>The Hunger of the Gods · 24</summary><h2>A rescue planned in Darl</h2><p>He splits the company into small bands entering Darl by different routes and times. His plan is to hide mail and weapons under cloaks, leave shields and helmets with the wagon and converge on the tower by sunset, expecting Helka to be at her feast. Svik’s band is to wait for Glornir’s move. His warning covers the rune-guarded tower, Skalk’s retinue and apprentices, locating Vol and avoiding royal alarm. No completed assault or rescue is shown.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>He enters the courtyard swinging his long-axe and later breaks an interior door, ordering a search led upstairs by Sulich. He pauses over Jökul’s corpse. The search does not recover Vol.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>He refuses to leave without Vol, his face shifting, teeth lengthening and eyes flickering green. He guesses Skalk may be with Helka and chooses a direct attack on her hall. His allegation that Skalk slew one of the crew is not an identification of Jökul’s killer or proof of Skalk’s survival.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>He leads through the tunnel, briefly swells, gains green eyes, sharp teeth and claws, then smashes the trapdoor. On emerging his claws shrink and his eyes return to hazel brown. Varg regards this as controlled change; it is one observed episode, not an exhaustive rule of Berserkir powers.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>After Hakon claims not to know where Skalk and Vol are, he orders the prince taken. At Helka’s dais he hacks into a turning Úlfhéðnar’s neck and fights towards her, supported on his flanks by Svik and Sulich. Superior numbers slow him until the queen’s halt and Røkia’s hostage move.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>He stands blood-spattered with his long-axe and demands Skalk and Vol in exchange for Hakon’s life. Guðvarr’s report establishes for him that Jaromir took Vol and the chest. He restrains Varg from attacking Guðvarr, and later from advancing on Yrsa.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>When Skalk appears alive, he confirms his wish to kill him. Helka offers a paid pursuit of Jaromir instead; he agrees to defer Skalk’s death while reiterating his future threat.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>He requires Hakon as surety until clear of Darl, half the silver now and half when he delivers Jaromir or his head, plus a drakkar. Helka agrees and adds an Úlfhéðnar guardian for Hakon, which he accepts. Neither payment, boarding nor release is completed here.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>He permits Guðvarr to clothe Hakon after Helka’s intervention. At the close he orders Varg to release Guðvarr rather than continue the confrontation.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>After the hall bargain he receives a chest of silver and declines fortress lodging in favour of dockside barracks, with a drakkar being prepared. He cauterises Varg’s ear. Four fallen Bloodsworn, including Jökul, are carried to the barracks and later aboard.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>At the ship he has a small scabbed cheek cut and leans on his long-axe. He says he does not know Brák’s name but promises Varg help and a reckoning, while insisting they must leave.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>He tells Helka that Hakon has been fed and clothed, lets Frek board as guardian, and promises to return for the remaining silver and Skalk. He repeats his word about Hakon before casting off; the prince has not yet been released.</p></details><details><summary>The Hunger of the Gods · 32</summary><h2>Children hidden in the barrels</h2><p>He orders a cold meal and a night aboard, with an awning against possible rain and no fires. After opening a barrel and finding a child, he tells Einar to get them all out. Varg notices a fleeting hint of a smile; this does not establish when Glornir learned of the concealment.</p></details><details><summary>The Hunger of the Gods · 32</summary><h2>Children hidden in the barrels</h2><p>He says the anchored ship makes escape harder and that he distrusts Hakon and Helka. Refusing release the next day, he claims land warriors and drakkars are following, although Hakon says he has seen no drakkars. He promises Hakon freedom at Liga and no harm unless he tries to escape. Frek’s calm warning ends without a fight.</p></details><details><summary>The Hunger of the Gods · 32</summary><h2>Children hidden in the barrels</h2><p>He dismisses Hakon’s protest about fairness and points to Frek’s collar. Later he assigns first watch and listens quietly to Svik’s tale from the prow. His maxim about the world remains his stated view.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>At Liga he seizes harbour official Palrun by the throat while demanding Jaromir’s whereabouts, then throws him down. Logur intervenes as a friend and reports Jaromir has sailed. Glornir requests the Sea-Wolf be provisioned and Helka’s loaned ship be taken for her warriors. He entrusts Hakon to Logur for later return with the ship; the prince leaves with guards and Frek.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>Back aboard the Sea-Wolf he conditionally tolerates the working children after Einar’s plea. He names the girl Refna Strong-Hands when she offers to row. He reports Jaromir’s arrival three days earlier and departure two days earlier with three drakkar and two knarr, then orders pursuit home to Iskidan and steers the actual departure.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>In his absence Elvar asks Orka to send him an offer to hire the Bloodsworn at double their asking price, accompanied by a silver bear-head ring as regard and a request to meet in Snakavik. Gunnar guesses at his location but does not know it. Glornir receives no message or gift and makes no acceptance within this chapter.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>He directs the crew’s tacking in a strong south-easterly wind two days into the Sea-Wolf’s open-sea passage. Refna’s first rowing shift out of Liga has kept pace with the company, and his Strong-Hands name for her has stuck.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>When Røkia calls him to look at the southward sighting, he gives Æsa the tiller, scowls and orders weapons. The distant sails are not identified and no fight, interception or landfall follows in the chapter.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>The boarding battle at sea</h2><p>He has the sail furled as two longships approach. Mailed and armed with his long-axe, he orders a trap: leave the ropes intact, seem to cower and then release the beasts. He intends no survivors and tells Varg to run with the wolf, his eyes prickling green. The instruction is not confirmation that every attacker is ultimately killed.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>The boarding battle at sea</h2><p>He calls shields against arrows and again as the boarders arrive, standing outside the wall with shield on his back and axe gripped two-handed. He chops through an attacker’s raised shield into the body behind it. Varg later hears him roar amid the fighting, but the whole battle’s final accounting remains outside the chapter.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>His green-brown eyes and sharp teeth recede as the bear in his blood fades. He extracts a hooked, branching tungumatur from a moving host, which then lies still, and crushes the specimen. Seeing one enemy ship escape, he orders pursuit rather than leaving the infected loose.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>He steers the rowing chase into sheltered islands and leads the shore attack. Arriving at the pool fight, he kills the giant with an axe blow to its head. He leaves Einar’s care to Røkia and orders Edel to search for remaining parasites, without an all-clear shown.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>He presses a bound druzhina who asks for death, offering that relief rather than abandonment. The witness reports separation from Jaromir’s fleet and captivity, identifies Vol as the prince’s prisoner and finally names Valdai as their destination. No execution of the captives, interception of Jaromir or rescue of Vol follows in the chapter.</p></details><details><summary>The Hunger of the Gods · 59</summary><h2>New looks on the journey through Ulaz</h2><p>He leaves Einar with Æsa and the children, provisions and water instructions. Sulich&#x27;s report of Vol&#x27;s abuse makes his shoulders swell and his grip crack the rail. He orders hard rowing towards a possible Valdai interception, prioritising Vol over the unexplained activity in Ulaz.</p></details><details><summary>The Hunger of the Gods · 63</summary><h2>A shortcut through the mountains</h2><p>He leaves the ship hidden after volunteers and lots fail to settle who should stay, taking all fifty-four travelling members overland. He arrives with strong endurance, selects the narrowed road and deploys Edel to watch the approach and Røkia to inspect Valdai.</p></details><details><summary>The Hunger of the Gods · 66</summary><h2>Sulich&#x27;s lineage and the ambush</h2><p>He positions two ranks at the rockfall and hawthorn choke point, authorises open beast use and reacts to Vol with swelling shoulders and neck and a roar. He steps into the front rank and calls the shield wall; his threatened victory remains unachieved at this cutoff.</p></details><details><summary>The Hunger of the Gods · 68</summary><h2>The cavalry charge and the shield wall</h2><p>His shallow disguised ditch breaks the cavalry&#x27;s first charge and his concealed flank force attacks behind them. He wounds Ilia and advances the wall, but the bull-like thrall breaks it. After the local victory he immediately pursues Jaromir and captive Vol.</p></details><details><summary>The Hunger of the Gods · 70</summary><h2>The pursuit into Valdai</h2><p>He forces the Valdai assault and reunites with living Vol, kissing her and cutting away her stitches. Supporting her, he follows her pursuit into the hall and lower chamber where Jaromir is killed. Ingmar&#x27;s death is an actual loss despite the rescue.</p></details><details><summary>The Fury of the Gods · 6</summary><h2>Warnings and the search for Frøya</h2><p>He consults every Bloodsworn present about the dragon offer, promises to collect Einar and Æsa, and states that the followers killed his brother and took his nephew. Vesli&#x27;s further report of Uspa and Bjarn adds a family stake for Vol. He decides the company will fight and orders departure for the Sea-Wolf at dawn; the journey has not begun on-page.</p></details><details><summary>The Fury of the Gods · 10</summary><h2>The road to Ulaz</h2><p>A retrospective account explains the plan to sail ahead to Ulaz and purchase a horse-carrying ship for Sulich&#x27;s kin. Svik found three chests, which Glornir offered as recompense; the kin chose to join and offered the money back, and he proposed using it for their ship. The overland party has not reunited with him or seen the purchase by the end of the chapter.</p></details><details><summary>The Fury of the Gods · 14</summary><h2>The warehouse rescue</h2><p>He leads the warehouse rescue, orders Varg to abandon pursuit of Leif and Sterkur and brings the company to Sea-Wolf. He steers the departure and ignores mounted druzhina ordering the vessels back, escaping their arrows with Sulich’s transport behind.</p></details><details><summary>The Fury of the Gods · 21</summary><h2>Reunion in the island harbour</h2><p>He brings Sea-Wolf to the island harbour, reunites with Einar, Æsa and the children and receives Refna’s fierce hug. He orders everyone aboard quickly because five of Rurik’s ships hunt nearby. They depart, but the five vessels reappear as the company reaches open water.</p></details><details><summary>The Fury of the Gods · 25</summary><h2>Seeing the slower transport will be caught, he elects battle after a day at sea</h2><p>Seeing the slower transport will be caught, he elects battle after a day at sea. The ships are lashed together, some rowers maintain orientation, Iva and Taras reinforce the knarr and he rallies the Bloodsworn with green eyes and bared teeth. He orders shields under the enemy arrows. Only the first enemy vessel is destroyed in the shown sequence.</p></details><details><summary>The Fury of the Gods · 27</summary><h2>He moves defenders to the stern, where overwhelming numbers surround and hide him</h2><p>He moves defenders to the stern, where overwhelming numbers surround and hide him. Roaring, he bursts out and fights barehanded with long-taloned claws and teeth, his long-axe and shield gone. An arrow sinks into his shoulder and he snaps its shaft. Edel shields him while companions attack the archers. No full animal shape, healing or final outcome is described.</p></details><details><summary>The Fury of the Gods · 29</summary><h2>He leads the counterboarding rush after Gunnar and Halja distract the archers</h2><p>He leads the counterboarding rush after Gunnar and Halja distract the archers. Hearing Vol scream, he returns to Sea-Wolf using a long-axe to climb: it is now in his hands, though the retrieval is unshown. He reaches Orka after she saves Svik and pulls her into a crushing embrace. Einar pushes them clear of a caster; the later joint spell strike on Vol knocks the company down. No healing of his earlier arrow wound or recovered shield is established.</p></details><details><summary>The Fury of the Gods · 32</summary><h2>Debts, kinship and the voyage onward</h2><p>He thanks Orlyg, confirms Elvar hired the company for dragon-killing and learns for the first time that Ulfrir is collared by Elvar because Vesli omitted that news. He pledges the Bloodsworn’s debt and future help with word and wrist-grip. He refuses to sell Vol or Iva, saying he needs one witch on each ship. After Orlyg leaves he embraces Orka and Vol, then meets Breca, explicitly introduced as his brother Thorkel’s son. He seats the boy on a knee, weeps and calls him Breca Thorkelsson, accepting Uncle. He promises to help find Drekr; vengeance is still pending.</p></details><details><summary>The Fury of the Gods · 32</summary><h2>Debts, kinship and the voyage onward</h2><p>He leads sea burial for eight Bloodsworn and ten of Sulich’s kin, naming and remembering each. Gathering the newcomers, he states the secrecy choices: a collar as cover for public gifts, or no collar and no witnessed powers; he says public use is only when all witnesses are intended to die. The choices must be made before landing, not already individually resolved. He claims never to command Vol, who jokes he would not dare. He thanks the ravens, accepts their scouting offer and orders preparation for Snakavik.</p></details><details><summary>The Fury of the Gods · 37</summary><h2>Life aboard Sea-Wolf</h2><p>After settling the sparring disturbance, he tells Varg to repaint his shield and take the vow at night. At the beach circle he recites Varg’s service and risks, asks the company to vouch and gives his own assent last. He holds the shield during the blood-sealing, returns it and explicitly welcomes Varg to the Bloodsworn, completing the rite postponed for Vol’s rescue.</p></details><details><summary>The Fury of the Gods · 39</summary><h2>He gives Einar the steering oar to hear Grok’s report that the dragon’s host walks west from Darl</h2><p>He gives Einar the steering oar to hear Grok’s report that the dragon’s host walks west from Darl. With Vol he infers Snakavik and welcomes the shorter hunt. He hears Orka’s answer to Svik, saying she never left his heart when she asks to be accepted back. Kló then reports Elvar’s ships in Jarnvidr; he had not known Wolfdales before the ravens name the den. He asks them to inform Orlyg of a changed destination for the Iron Wood, not a delivered message or completed arrival.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>Arrival at the wolf-god’s hall</h2><p>He hears that only Iva and Taras choose collars, supplies two collar/key pairs through Sulich and assures Iva she controls hers and will not be sold to Orlyg. He checks consent and hears her claim inner freedom. He orders harder rowing to catch Orlyg, then leads the landed company through the defences and den, accepting Orlyg’s gesture to go first. Uspa embraces him after her reunion with Vol. Before Elvar he explicitly commits the company to dragon-fighting; she welcomes the acceptance and asks after Orka.</p></details><details><summary>The Fury of the Gods · 43</summary><h2>He reports dragon and rat marching towards the den with Grok as source</h2><p>He reports dragon and rat marching towards the den with Grok as source. Elvar receives his accepted dragon-fighting service and welcomes him with the arriving allies, offering rest/food/ale. No payment, exact enemy arrival time or new oath is shown.</p></details><details><summary>The Fury of the Gods · 44</summary><h2>The new arrivals and Grend’s fate</h2><p>He advances on Skalk with the Bloodsworn behind, knocks down the unnamed sword guard and draws his sword as Vol and Skalk kindle spells. Ulfrir’s huge wolf form stops them. Glornir states the offences against Vol and the slain company member and demands reckoning; under Elvar’s temporary truce he says Soon and stalks away. This postpones vengeance without forgiveness or a new killing.</p></details><details><summary>The Fury of the Gods · 46</summary><h2>The hidden tunnel raid</h2><p>He leads at the hidden stairs, unbolts the hatch Vol reveals and extinguishes his torch before emerging. He then leads the charge on the roadside camp with Einar and Svik near him. No result for the whole host or later duel is established here.</p></details><details><summary>The Fury of the Gods · 48</summary><h2>He leads the returning crew, with Vol beside him, and agrees none have been left behind</h2><p>He leads the returning crew, with Vol beside him, and agrees none have been left behind. He reports the angry dragon and receives Elvar’s praise and meal invitation. Later he greets Logur warmly, vouches for the jarl and brings him to Elvar, who welcomes Logur and his men.</p></details><details><summary>The Fury of the Gods · 52</summary><h2>The choice to hide the beast</h2><p>He discusses Skalk’s exposure risk, approves Breca’s collar-cover idea and calls the reported wolf/bear combination rare. He explicitly distinguishes Thorkel as blood brother and Orka as oath-sister, reaffirming she never ceased being kin. At the alarm he leads the armed Bloodsworn to Elvar and the gates. His feud with Skalk is still discussed rather than performed.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>Salvage and a choice about freedom</h2><p>He presents the current company, confirms the two witches/man were never his thralls and acknowledges all the gathered Bloodsworn as Tainted. He celebrates freedom and promises lifelong loyalty to Elvar, with no separate new blood-oath ceremony narrated.</p></details><details><summary>The Fury of the Gods · 58</summary><h2>He stands blood-spattered with Sulich and Æsa before the renewed assault</h2><p>He stands blood-spattered with Sulich and Æsa before the renewed assault. No specific new wound or withdrawal route is narrated here.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>He and the Bloodsworn hold Elvar’s right flank at the hillside shield wall</h2><p>He and the Bloodsworn hold Elvar’s right flank at the hillside shield wall. No individual new wound or final company fate is reported.</p></details><details><summary>The Fury of the Gods · 65</summary><h2>He talks with Vol and Orka while Breca sits on his lap and Vesli on the child’s shoulder</h2><p>He talks with Vol and Orka while Breca sits on his lap and Vesli on the child’s shoulder. It is a quiet post-battle gathering, without a new family identity or promise of final safety.</p></details><details><summary>The Fury of the Gods · 68</summary><h2>Elvar’s fall and the rebellion in the hall</h2><p>He leads the awakened company to the hall, recognises Hjalmar’s forces and identifies Elvar’s fallen body. Since combat is scattered he orders a loose attack, then kicks Hjalmar down and kills him by driving his long-axe through shield/chest, calling him oath-breaker before fighting on.</p></details><details><summary>The Fury of the Gods · 70</summary><h2>The gods collide and the tree burns</h2><p>He joins the gap Orka opens and fights the Raven-Feeders toward the tree, then spots Skalk with his unnamed drengr on the lower steps and starts cutting toward them. Skalk’s final fate is not shown here.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>He and Vol push toward Skalk up the tree, then ask Halja to read the burning hall and sea</h2><p>He and Vol push toward Skalk up the tree, then ask Halja to read the burning hall and sea. He accepts the need for another way down but prioritises vengeance, identifies the fleets as Rurik/Jaromir’s planned invasion and urges one battle at a time. With Thorguna he breaks the hilltop skraeling screen after Halja’s spear clears a threat and hits the Raven-Feeders’ shields.</p></details><details><summary>The Fury of the Gods · 74</summary><h2>Snaka rises and Wolfdales collapses</h2><p>He throws Drekr off but loses his long-axe when the haft breaks, changes to back shield/sword and fights back-to-back with Orka. He feints below Ilska’s shield, stabs high, knocks her down and cuts her neck. As the hill collapses he takes Vol’s wrist and leads the retreat, jumping from the Falinn cliff hand-in-hand with her.</p></details><details><summary>The Fury of the Gods · 76</summary><h2>He survives at the downriver bend with Vol and named Bloodsworn</h2><p>He survives at the downriver bend with Vol and named Bloodsworn. Breca leans against him as they watch Snaka smash Wolfdales, and he too feels the presence. He puts the dragon/rat before the next battle, orders drying/warming before a search for friends, then asks returned Vesli to look for Elvar’s survivors so they can regroup.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>The survivors’ camp and reunion</h2><p>Vesli brings Glornir’s party to the woodland camp, escorted by Ulfrir’s guards: Glornir leads with Vol and Orka at his shoulders and a score-or-so Bloodsworn behind. The split company actually reunites and Svik/Orlyg welcome them. No new battle or all-missing-allies tally is given.</p></details><details><summary>The Fury of the Gods · 81</summary><h2>Glornir and Orka lead the Bloodsworn in the loose assault after Snaka’s murder</h2><p>Glornir and Orka lead the Bloodsworn in the loose assault after Snaka’s murder. About half the company lacks shields; no organised shield-wall approach or new weapon recovery is established.</p></details><details><summary>The Fury of the Gods · 88</summary><h2>He defends Vol/Uspa with Berak/companions until Orka’s flanking charge relieves them</h2><p>He defends Vol/Uspa with Berak/companions until Orka’s flanking charge relieves them. He asks whether Drekr is dead, calls Thorkel avenged on Orka’s confirmation and agrees it is time when Skuld sounds the horn. The next action’s contents/outcome remain unshown.</p></details><details><summary>The Fury of the Gods · 90</summary><h2>The last assault on Lik-Rifa</h2><p>He drops shield, runs with long sword and partially manifests claws/green-flickering eyes, joining Orka on the wing/head. Their jaw attack opens the way for Hrung but they are thrown off; he then knocks Orka out of a claw’s path and takes the blow. Mortally wounded, he farewells Breca/Orka, asks care for mother/Vol and explicitly dies as his wife arrives. No successor is named here.</p></details><details><summary>The Fury of the Gods · 91</summary><h2>Return to the ruined homestead</h2><p>His linen-wrapped corpse is carried to his brother Thorkel’s barrow by Varg, Svik, Røkia, Edel, Vol and Sulich. Vol declined Ulfrir’s offered place beside Elvar, choosing the homestead with his kin. The company begins digging; the completed burial is not shown.</p></details><details><summary>The Fury of the Gods · 92</summary><h2>The company now stands around three completed barrows for Thorkel, Glornir and Spert</h2><p>The company now stands around three completed barrows for Thorkel, Glornir and Spert. Varg places a stream-stone on Glornir’s and Vol the final stone before the gathering moves to food and discussion.</p></details><details><summary>The Shadow of the Gods · 4</summary><h2>Appearance</h2><p>He is bald and grey-bearded and carries a bearded long-axe.</p></details><details><summary>Illustration · The Fury of the Gods · 32</summary><p><a href="assets/1ed4d398af7e3c.jpg">Open noncanonical illustration</a></p><p>Breca’s first meeting with his uncle.</p></details><details><summary>Illustration · The Fury of the Gods · 27</summary><p><a href="assets/7503b665cb5245.jpg">Open noncanonical illustration</a></p><p>Edel shielding Glornir during the boarding battle.</p></details><details><summary>Illustration · The Shadow of the Gods · 21</summary><p><a href="assets/5221e00c3e48ab.jpg">Open noncanonical illustration</a></p><p>Glornir with his long-axe in the equipment worn for the courtyard departure.</p></details><details><summary>Illustration · The Fury of the Gods · 74</summary><p><a href="assets/1ea616eab4309c.jpg">Open noncanonical illustration</a></p><p>Glornir and Vol’s leap, before any landing is shown.</p></details><details><summary>Illustration · The Fury of the Gods · 29</summary><p><a href="assets/357c3a72a11ba9.jpg">Open noncanonical illustration</a></p><p>The brief reunion before the next magical threat.</p></details><details><summary>Illustration · The Fury of the Gods · 90</summary><p><a href="assets/8ebbc301db92b4.jpg">Open noncanonical illustration</a></p><p>Orka and Glornir climbing the damaged wing before the jaw attack.</p></details><details><summary>Illustration · The Fury of the Gods · 39</summary><p><a href="assets/f20f8d2ec0ef53.jpg">Open noncanonical illustration</a></p><p>Glornir welcoming Orka back as kin.</p></details><details><summary>Illustration · The Fury of the Gods · 77</summary><p><a href="assets/351bb7176446cb.jpg">Open noncanonical illustration</a></p><p>Glornir’s party entering the survivors’ snowy camp.</p></details><details><summary>Illustration · The Fury of the Gods · 44</summary><p><a href="assets/2c1a0be95bf6a4.jpg">Open noncanonical illustration</a></p><p>Ulfrir halting the confrontation under Elvar’s rule.</p></details><details><summary>Illustration · The Fury of the Gods · 46</summary><p><a href="assets/ac7c1b098d7483.jpg">Open noncanonical illustration</a></p><p>The concealed exit revealed before
