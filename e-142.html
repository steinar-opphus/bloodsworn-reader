      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 19</summary><h2>Appearance</h2><p>Vesli identifies skraeling among the attackers who came to Orka’s steading. No appearance or capabilities are described for them in this account.</p></details><details><summary>The Shadow of the Gods · 43</summary><h2>Observed at the Boneback excavation</h2><p>The guards observed in Chapters 41 and 43 have long, heavily muscled arms, thick necks and a stooped, knuckle-supported posture. Varg sees uneven humanlike faces, small dark eyes and small lower-jaw tusks. One facing Varg and Torvik draws a broad, thick blade between a seax and a sword in length.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>About a score surround Lik-Rifa protectively, thick-muscled with grey-melted flesh, furs and rough leather, carrying crude iron weapons. At her nod one blows a horn, and several score are later present at the council. These are scene estimates, not a complete muster or a new named guard identity.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>Tracks identified as skraeling head east along with other vaesen north of the Bonebacks. Later Revna identifies a foul mound on the path as their dung and Gunnar voices dislike. No living skraeling or proof they caused the farm’s smoke and screams is supplied.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>At the farm they skin, dismember and strip human bodies and assault a longhouse whose roof and doors are breached. Orka warns Lif of their inhuman strength; her sharpened sight shows local blue-grey folded hides, grime, sweat, patches of hair on lopsided heads and rusty blades. These are observations and a scoped warning, not a newly established universal appearance.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>Seven courtyard attackers fall, followed by close fighting in the hall and a pursuit of fleeing skraeling. Ravens tear attackers apart outside. A body near Lif has black swollen veins and punctures while Spert hovers, without an explicitly identified venom cause. Fourteen skraeling bodies have been brought out so far, not necessarily the raid’s entire death toll.</p></details><details><summary>The Fury of the Gods · 57</summary><h2>Rafts and ladders reach the defences</h2><p>Attackers leap from the besiegers’ locked shields to grip the gate palisade and climb onto its walkway. Close combat follows; one is thrown back onto the ladder parties by an unnamed huge black-skinned defender. Reaching the walkway does not establish a secured position or final victory.</p></details><details><summary>The Fury of the Gods · 58</summary><h2>They attack Breca and the gate defenders; Halja, Vesli, Orka and Breca oppose specific climbers</h2><p>They attack Breca and the gate defenders; Halja, Vesli, Orka and Breca oppose specific climbers. More come ashore with later raft waves while the defence gives way, with no exact enemy casualty count.</p></details><details><summary>The Fury of the Gods · 59</summary><h2>After the wall breach they press withdrawing defenders alongside cultists</h2><p>After the wall breach they press withdrawing defenders alongside cultists. Some descend the gate walkway and lift/cast down its great bars, swinging the river gate open for the Raven-Feeders and following host. This is physical access from inside, not a ram breaking the sealed timbers.</p></details><details><summary>The Fury of the Gods · 69</summary><h2>They swirl among the entering trolls before the shield host</h2><p>They swirl among the entering trolls before the shield host. The hall erupts into mixed fighting until the dragon’s landing pauses it; no individual skraeling is named or precise tally supplied.</p></details><details><summary>Illustration · The Shadow of the Gods · 43</summary><p><a href="assets/f4bec90b61a79a.jpg">Open noncanonical illustration</a></p><p>The unnamed skraeling crouches with its blade drawn before Varg and Torvik.</p></details></noscript>
