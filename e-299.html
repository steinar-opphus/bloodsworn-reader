      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>Kló is one of the giant speaking raven pair first encountered near Grimholt. The earlier second raven tries to free the frost-web captive; B02-C057 supplies Kló’s name and identifies her mate Grok as that captive. Her sex and mate relationship follow the scene’s pronouns and her introduction. This identification is dated here, while E-196 remains the pair.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>At the rescued farm she is the raven talking beside Orka, while Grok initially sits in the giant nest. Gudleif says the residents feed and shelter the pair for news and protection. They have just intervened against the skraeling, without an exact individual kill allocation.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>She says Snaka made the ravens as he did giants, Froa and the person addressed, while Lik-Rifa made vaesen. After Grok describes their service as Snaka’s messengers and spies, she says Lik-Rifa disliked it. These are attributed origin and history claims, without a universal taxonomy or complete account of other ravens’ fates.</p></details><details><summary>The Hunger of the Gods · 64</summary><h2>The hidden doors into Nastrandir</h2><p>Orka asks Kló and Grok to carry the consenting Vesli to Darl in search of Glornir. The departure is recalled, but their arrival or delivered message is not shown.</p></details><details><summary>The Fury of the Gods · 30</summary><h2>She and Grok kill the wounded caster above Sea-Wolf, then land after the serpent leaves</h2><p>She and Grok kill the wounded caster above Sea-Wolf, then land after the serpent leaves. Kló speaks from the prow, saying snakes taste good but large ones bite back, and preens. Her remark is personal, not a universal law about ravens or serpents.</p></details><details><summary>The Fury of the Gods · 32</summary><h2>She and Grok finish a meal from enemy corpses before the promised aerial scouting</h2><p>She and Grok finish a meal from enemy corpses before the promised aerial scouting. The pair calls the Bloodsworn friends and accepts help in return, without a command collar or formal ownership. No scouting result is shown.</p></details><details><summary>The Fury of the Gods · 39</summary><h2>She lands heavily on Sea-Wolf’s starboard rail before hopping to deck, where Grok preens her</h2><p>She lands heavily on Sea-Wolf’s starboard rail before hopping to deck, where Grok preens her. She reports many ships left Snakavik, sailed south and rowed into Jarnvidr. She identifies the Wolf-Dale as Ulfrir’s home and says she saw it and heard painful wolf howling. Asked with Grok to carry this news and the changed destination to Orlyg, she is not yet shown delivering it.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>Arrival at the wolf-god’s hall</h2><p>She and Grok choose to accompany the company, hopping from Sea-Wolf to the pier and following its entry. No new delivery dialogue is narrated.</p></details><details><summary>The Fury of the Gods · 43</summary><h2>She joins Grok when Hrung calls, objects to mischief charges and says they help friends</h2><p>She joins Grok when Hrung calls, objects to mischief charges and says they help friends. She speaks mournfully of Snaka’s death, calls Orka their friend and offers continued watching if Elvar befriends them. Elvar agrees. No new scouting departure, fixed timetable or proved betrayal is shown.</p></details><details><summary>The Fury of the Gods · 48</summary><h2>Return from the sortie</h2><p>She returns to the hall with good and bad news: many killed by the raid and an enraged dragon, then many new Tainted joining Lik-Rifa. She gives no reinforcement identities, exact numbers or outcome of future fighting. Her desire for the herring feast does not prevent reporting when Elvar insists.</p></details><details><summary>The Fury of the Gods · 65</summary><h2>Losses and plans after the retreat</h2><p>Grok and Kló have searched the enemy host for signs of the Tainted children/Bjarn, but Uspa has no positive report for Elvar. The failed search report does not mean the child is absent from the host or dead.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>The survivors’ camp and reunion</h2><p>Uspa asks for Grok/Kló as scouts, but Ulfrir warns that they belong to Snaka heart/soul and would betray the group, speculating they might already search for him. This warning is attributed to Ulfrir; neither raven is directly seen betraying or scouting in the chapter.</p></details><details><summary>The Fury of the Gods · 89</summary><h2>Heðin falls and the ravens seize Rotta</h2><p>Grok/Kló seize Rotta from the sky crying that he killed Father-Snaka, carry him up and drop him into wagons. This directly shows revenge/loyalty toward Snaka; the predicted betrayal/search against the survivors is not observed here.</p></details><details><summary>Illustration · The Fury of the Gods · 43</summary><p><a href="assets/3c80cc23ff516b.jpg">Open noncanonical illustration</a></p><p>Elvar accepting the ravens as friends and scouts.</p></details><details><summary>Illustration · The Fury of the Gods · 89</summary><p><a href="assets/82a301355c5056.jpg">Open noncanonical illustration</a></p><p>Grok and Kló lifting Rotta in revenge for Snaka.</p></details></noscript>
