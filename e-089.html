      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 12</summary><h2>Introduction</h2><p>Mord is Virk’s older son. He asks Sigrún for justice after the fatal attack on his father.</p></details><details><summary>The Shadow of the Gods · 15</summary><h2>Grief and the decision to leave</h2><p>Orka recalls that she and Thorkel restrained Mord from attacking Guðvarr and Sigrún’s thrall. The family helps raise Virk’s barrow, and Mord and Lif feed them afterwards. Mord mutters oaths of vengeance and the brothers decline Thorkel’s invitation to the steading. Orka says Virk left his sons a fishing boat and taught them a trade.</p></details><details><summary>The Shadow of the Gods · 22</summary><h2>Captives freed and a name obtained</h2><p>Orka finds the brothers bound at Fellur’s hall. Lif says they tried unsuccessfully to kill Guðvarr and face trial, with outlawry or execution threatened. Orka frees them. They wait in their fishing boat, take Orka aboard and row away at her order to head south for the sea.</p></details><details><summary>The Shadow of the Gods · 24</summary><h2>A bargain with the brothers</h2><p>Mord is fair-haired, broad-faced and solid, with a thick beard. Mord&#x27;s head wound continues to bleed through its bandage. Mord warns that Sigrún may send searchers in every direction; no actual search deployment is observed here. Orka advises waiting until Fellur&#x27;s alarm and search have subsided before seeking revenge.</p></details><details><summary>The Shadow of the Gods · 28</summary><h2>The Näcken at the rapids</h2><p>Mord weaves willow branches into a fish trap while Orka and Lif row. Orka suggests going ashore to walk around rapids, but Mord argues they can row through. An impact lifts the boat&#x27;s prow and throws Mord into the water. The Näcken bites Mord&#x27;s shoulder.</p></details><details><summary>The Shadow of the Gods · 31</summary><h2>Arrival in Darl</h2><p>Mord&#x27;s Näcken bite is healing well, and his head retains a red scar from Guðvarr&#x27;s blow. Mord and Lif are bruised by their weapons lessons; Mord persists despite his more serious wounds.</p></details><details><summary>The Shadow of the Gods · 35</summary><h2>The confrontation at The Dead Drengr</h2><p>Lif and Mord arrive on horses and break into the ring to rescue Orka.</p></details><details><summary>The Shadow of the Gods · 40</summary><h2>Flight towards Grimholt Pass</h2><p>Mord&#x27;s arm still bleeds from Skefil&#x27;s wound when Guðvarr&#x27;s company appears at the lodging farm. He follows Orka&#x27;s decision to flee north rather than fight.</p></details><details><summary>The Shadow of the Gods · 37</summary><h2>A captive questioned on the eastward road</h2><p>The later description explicitly identifies his beard as blond. A documented  separates his observed features from the portrait&#x27;s artistic choices.</p></details><details><summary>The Shadow of the Gods · 46</summary><h2>The broken oath stone</h2><p>He continues practising against Orka with a wool-wrapped seax. Orka judges his impatience a weakness compared with Lif’s calmer approach, and warns both brothers about fighting armoured warriors in wool.</p></details><details><summary>The Shadow of the Gods · 49</summary><h2>Ravens and frost-spiders</h2><p>He fights frost-spiders beside Orka and Lif, stands over his poisoned brother and keeps attackers back, despite his fear. When warriors surround them he spears one through the throat.</p></details><details><summary>The Shadow of the Gods · 51</summary><h2>Captivity and violence at Grimholt</h2><p>Bound in Grimholt’s tower, he is stabbed through the belly by Guðvarr. The chapter leaves the severity evident but does not establish his final fate.</p></details><details><summary>The Hunger of the Gods · 1</summary><h2>Rest and restraint in the burned hall</h2><p>His charred body remains chained in the damaged tower until Orka breaks the chain and, with Lif&#x27;s help, wraps him in a cloak for removal.</p></details><details><summary>The Hunger of the Gods · 3</summary><h2>Mord&#x27;s burial and a blood feud</h2><p>Orka, Lif, Varg and the Bloodsworn bury him and raise a stone barrow at Grimholt. Lif seals a blood feud against Guðvarr over the grave.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>Orka tells Lif of his defence during the earlier frost-spider attack, praising him for standing over his poisoned brother and fighting despite fear. Lif reports a memory gap before the tower and cries, relieved that she did not judge Mord a coward. This adds the testimony and its effect on Lif, not a new battle, changed death or present appearance.</p></details><details><summary>The Fury of the Gods · 47</summary><h2>Lif names Mord while attacking Guðvarr, marking the cheek wound as vengeance</h2><p>Lif names Mord while attacking Guðvarr, marking the cheek wound as vengeance. Lif survives the visible fight, but no completed revenge killing or resolution of the grievance occurs.</p></details><details><summary>The Fury of the Gods · 82</summary><h2>Lif confronts Guðvarr at the forest edge, vowing revenge for the murder of his father and brother</h2><p>Lif confronts Guðvarr at the forest edge, vowing revenge for the murder of his father and brother. This invokes the established family losses without retelling or changing their original death accounts.</p></details><details><summary>The Fury of the Gods · 85</summary><h2>Lif’s reckoning with Guðvarr</h2><p>Lif recounts the father’s broken holmganga and the chained/venom-weakened brother’s stabbing as he confronts Guðvarr. After defeating him he demands them back and brings his axe down, strongly implying the end of his family revenge; no resurrection or changed death history follows.</p></details><details><summary>Illustration · The Shadow of the Gods · 43</summary><p><a href="assets/86b64ffdd7ac3e.jpg">Open noncanonical illustration</a></p><p>Mord travelling back from Darl before the pursuit.</p></details></noscript>
