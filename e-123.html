      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 14</summary><h2>Blood memories at the oath stone</h2><p>Elvar identifies a scene on the oath stone as the Gallows Wood.</p></details><details><summary>The Shadow of the Gods · 14</summary><h2>Blood memories at the oath stone</h2><p>In her recalled tale, Lik-Rifa murdered Orna and Ulfrir’s daughter; they slaughtered Lik-Rifa’s offspring in vengeance. The mutilation is called the blood-eagle.</p></details><details><summary>The Shadow of the Gods · 48</summary><h2>The guardian of Oskutreð</h2><p>The Battle-Grim encounter hundreds of desiccated hanging bodies with blood-eagled backs. Uspa identifies the forest as the Gallows Wood; the identification of the dead as dragon-born remains part of Elvar’s recalled saga.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>Ketil asks about a saga in which Ulfrir slew and hung a hundred dragon-born. Skuld corrects him to about five hundred of Lik-Rifa’s children. The varying historical numbers remain attributed; they do not replace the earlier direct observation of hundreds of hanging bodies with a newly counted exact total.</p></details></noscript>
