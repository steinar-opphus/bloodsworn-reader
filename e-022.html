      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 2</summary><h2>Introduction</h2><p>Einar Half-Troll is the fighter whom Svik names at the weapons trial. Svik says he fights without a shield to give challengers a chance.</p></details><details><summary>The Shadow of the Gods · 2</summary><h2>Appearance</h2><p>At the trial his red beard is braided to his waist, and he fights stripped to the waist.</p></details><details><summary>The Shadow of the Gods · 4</summary><h2>Appearance</h2><p>Einar has a thick body and knotted muscles, with a slab-boned face framed by red hair and enormous fists.</p></details><details><summary>The Shadow of the Gods · 2</summary><h2>An opponent and a companion</h2><p>A challenger sees his shield shattered by Einar&#x27;s punch before being thrown down and carried away unconscious. Varg agrees to face the same fighter.</p></details><details><summary>The Shadow of the Gods · 4</summary><h2>The trial, the bite and Varg&#x27;s pursuers</h2><p>Varg&#x27;s attempt to strike his groin finds iron-hard protection made by Jökul. A kick sends Einar to one knee, and Varg bites his calf. Later at the camp, Einar punches one of Leif&#x27;s men through the branches.</p></details><details><summary>The Shadow of the Gods · 11</summary><h2>A limp that does not stop his training</h2><p>The bite still leaves him limping when Svik mentions it, but he can spar with two of Logur&#x27;s warriors at once.</p></details><details><summary>The Shadow of the Gods · 20</summary><h2>Shielding Glornir and preparing to sail</h2><p>At the docks, Einar helps shield Glornir from arrows and knocks a mounted warrior from the saddle with a spear. At departure he hammers the Sea-Wolf&#x27;s mast-lock into place and calls the rowing commands.</p></details><details><summary>The Shadow of the Gods · 26</summary><h2>Bread and a less combative friendship</h2><p>His dealings with Varg also become less combative: after Varg promises not to bite again, Einar offers him bread and a seat.</p></details><details><summary>The Shadow of the Gods · 34</summary><h2>Big bones, not a troll</h2><p>Asked about his name, he denies being a troll and says he merely has big bones.</p></details><details><summary>The Shadow of the Gods · 43</summary><h2>The skraeling and the troll at the excavation</h2><p>For the excavation he prepares a table-sized shield and a hooked, bearded axe. He kills the skraeling threatening Varg and Torvik, then joins the others against the troll and opens its thigh with his axe.</p></details><details><summary>The Shadow of the Gods · 47</summary><h2>What Half-Troll does not mean</h2><p>During the later disclosures he explicitly says that he is not actually a half-troll. His epithet does not establish literal parentage.</p></details><details><summary>The Hunger of the Gods · 3</summary><h2>Mord&#x27;s burial and a blood feud</h2><p>He carries a man-sized stone for Mord&#x27;s barrow and later plays a sleeping troll for the rescued children to climb on.</p></details><details><summary>The Hunger of the Gods · 7</summary><h2>An offer to return to the Bloodsworn</h2><p>When the Bloodsworn leave Grimholt, he drives a wagon carrying the rescued Tainted children after Glornir’s company.</p></details><details><summary>The Hunger of the Gods · 19</summary><h2>Scouting beyond the repaired bridge</h2><p>He drives the children’s cart to the outskirts of Darl, helps distribute food, and plays dodge-the-troll. He deliberately lets the children evade and climb over him. When Røkia joins too competitively, he explains that letting them win makes them happy.</p></details><details><summary>The Hunger of the Gods · 19</summary><h2>Scouting beyond the repaired bridge</h2><p>He objects to Glornir’s plan to leave them, warning that Tainted children without parents risk discovery and enslavement. He calls them helpful, but Glornir refuses; Svik squeezes his arm and he falls silent, shoulders slumping. His warning is a predicted danger, not an observed fate.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>He joins Røkia at the tower, follows the march and must stoop on entering the tunnel. This chapter gives no new account of the children’s supervision or fate.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>On the dais he hits a leaping Úlfhéðnar woman in the upper back with his hand-axe, bringing her down as she attacks Glornir. She then tries to bite his leg; no death is confirmed for that opponent. He continues fighting while numbers press the company back.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>He accompanies the search for Brimil, knocks the outside guard unconscious, and restrains Varg when the wolf overwhelms him. He later kills the unconscious guard with his axe.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>After Varg removes the disguise collar, Einar asks an unspecified favour. He next leads an ox-wagon to the drakkar and helps carry barrels aboard, then beats rowing time on a barrel lid with his axe butt as they depart. No content for the favour, concealed passenger or resolution of the children’s fate is stated.</p></details><details><summary>The Hunger of the Gods · 32</summary><h2>Children hidden in the barrels</h2><p>The contents of his wagon barrels are revealed when Glornir opens one and lifts out a hungry boy of about eight or nine winters. Einar had tried to stop that barrel being opened. At Glornir’s direction he brings the children out, thanking his chief, while Varg helps and the others provide food. The concealment is now explicit, though the exact wording of his earlier favour remains unreported.</p></details><details><summary>The Hunger of the Gods · 32</summary><h2>Children hidden in the barrels</h2><p>Four boys and six girls cling to his legs as he asks Svik for a story, then the children settle over him on deck. When Svik names a fictional troll Einar, he twice reassures them that the character is not him; some nevertheless become tearful at the troll’s fate. This clarification concerns the fable’s role, not a new revelation about his ancestry.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>He encourages Sulich to accept Varg’s captured kit as earned repayment. He sets the rescued children to carrying the remaining stores and argues they will help aboard the Sea-Wolf. Glornir conditionally tolerates them and calls Refna Strong-Hands to a rowing place. Einar and Ingmar push the departing ship clear with spears.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>The boarding battle at sea</h2><p>He herds the children into the gap between the company’s back-to-back lines and tells them to stay down, carrying his huge shield and axe. Varg hears him bellow during the silent onslaught. The protective formation is shown, but the chapter does not separately establish every child’s final safety.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>He drops the anchor stone, tells Refna and the other children to stay aboard and joins the shore pursuit. At the settlement he cuts an attacker from Svik’s back, then follows Æsa and Varg into the beechwood.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>He charges to free Æsa, cutting and trampling infected hosts, and scatters her captors. After she is wounded in the thigh, the giant coils round him, pins one arm and lifts him, then throws him into a tree. He lies motionless but is subsequently found breathing and unconscious.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>His helm is deeply dented, his head bleeding, and an arm lies at an unnatural angle with bone showing. Svik assesses a cracked skull, broken arm and possible additional fractures. Røkia takes over, requests ship water and linen and starts dabbing the wound. His survival beyond the immediate scene and recovery remain unresolved.</p></details><details><summary>The Hunger of the Gods · 59</summary><h2>New looks on the journey through Ulaz</h2><p>After remaining unconscious and feverish overnight, he is left on the island with Æsa as healer and the children. Glornir leaves provisions and promises to return; no recovery is yet observed.</p></details><details><summary>The Fury of the Gods · 21</summary><h2>Reunion in the island harbour</h2><p>The company finds him alive at the island huts, huge and broad with his head still bandaged, Refna on his shoulders. He walks, laughs and lifts Svik in a hug, then says his head is all good. This establishes survival and restored function, but not a full medical confirmation of skull or arm healing. He returns aboard with the group.</p></details><details><summary>The Fury of the Gods · 21</summary><h2>Reunion in the island harbour</h2><p>He finds Taras occupying his familiar stern time-beater’s seat. After Vol calls Taras a friend, the two exchange names and accept each other as friends of the Bloodsworn. They are roughly equal in height. Taras offers a shared seat and leather bottle; Einar drinks, coughs and smiles.</p></details><details><summary>The Fury of the Gods · 25</summary><h2>He gives Taras battle kit and exchanges a forearm grip before Taras crosses to the knarr</h2><p>He gives Taras battle kit and exchanges a forearm grip before Taras crosses to the knarr. Then Einar takes Sea-Wolf’s champion position with long-axe, helmet, mail, belt seax/axe and huge back-shield, leading the challenge. When arrows arrive he swings behind the prow for cover; his earlier wounds are not medically reassessed.</p></details><details><summary>The Fury of the Gods · 27</summary><h2>He wins the initial prow exchange, then continues fighting aboard Sea-Wolf</h2><p>He wins the initial prow exchange, then continues fighting aboard Sea-Wolf. A female champion cuts through his chest mail, draws blood and knocks him to one knee. Refna Strong-Hands bites the attacker’s neck and other children pull her down. Einar’s eventual condition and the attacker’s final fate remain unshown.</p></details><details><summary>The Fury of the Gods · 28</summary><h2>Orlyg joins the sea battle</h2><p>Orka sees him and a handful of companions protecting Vol near Sea-Wolf’s prow as the rescue reaches the knarr. Continued fighting does not establish that his chest wound has healed.</p></details><details><summary>The Fury of the Gods · 29</summary><h2>The fight aboard the stern drakkar</h2><p>He attacks the escort pressing Vol, with Svik protecting his back and Refna and the children following. After Orka saves the wounded Svik and Glornir embraces her, Einar shoves them clear of the advancing caster. His continued fighting does not demonstrate that his earlier chest wound has healed.</p></details><details><summary>The Fury of the Gods · 32</summary><h2>Debts, kinship and the voyage onward</h2><p>He worries over the bandaged, stiff-moving Taras, who squeezes his shoulder and reassures him about shallow arrows and Iva’s care. Later he chuckles at the ravens’ insistence on finishing their meal before scouting. No recovery of his own chest wound is established.</p></details><details><summary>The Fury of the Gods · 37</summary><h2>He play-wrestles with Refna and the children, then welcomes Breca with his capped spear</h2><p>He play-wrestles with Refna and the children, then welcomes Breca with his capped spear. Breca’s butt strike and follow-up leave forehead/cheek cuts. He separates angry Refna from Breca and explains manners despite her worry his head had only just improved; he calls the new hurt minor, without proving all prior wounds healed. Later he vouches for Varg at the completed oath.</p></details><details><summary>The Fury of the Gods · 48</summary><h2>Return from the sortie</h2><p>He carries one wounded comrade back, eats with Varg’s group and covers Varg’s/Røkia’s hands, affirming kinship. He supports vengeance against Brák and cites the stolen children, saying Bjarn is still held; that is his account rather than a new sighting. He frowns at Varg’s universal freedom and paid-work proposal, without an explicit full reply.</p></details><details><summary>The Fury of the Gods · 58</summary><h2>Holding the gate walkway</h2><p>He joins Orka and Breca on her long-axe haft and together they topple a loaded ladder, then returns to piling boulders. He has been assigned this because he can carry twice as many as others. Active work does not specify complete healing of his earlier injuries.</p></details><details><summary>The Fury of the Gods · 61</summary><h2>The shield line under pressure</h2><p>From the row behind Svik he uses his axe against the opponent exposed by Svik’s sword-and-shield action. This shows coordinated fighting, without confirming every old wound healed.</p></details><details><summary>The Fury of the Gods · 65</summary><h2>He arm-wrestles Sighvat with Taras laughing behind him and companions wagering</h2><p>He arm-wrestles Sighvat with Taras laughing behind him and companions wagering. No winner or full medical clearance follows.</p></details><details><summary>The Fury of the Gods · 73</summary><h2>He helps kill a troll after Edel’s spear strike, then rushes to Refna when Brák threatens her</h2><p>He helps kill a troll after Edel’s spear strike, then rushes to Refna when Brák threatens her. Once she claws free he fights Brák, suffering forearm and calf cuts. He knocks Brák down, but another warrior spears his leg; as he falls to a knee after striking that attacker, Brák thrusts a sword through his throat and neck. The chapter ends before an explicit death statement or aftermath.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>Leif’s death and the tunnel escape</h2><p>His death is now explicit: Svik and Røkia mourn beside his body, Refna weeps on him, the children bow their heads, Edel’s hound licks his hand and Æsa/Varg cry out. No burial or carriage of his body out of the hall is narrated here.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>The camp mourns him as Refna asks Uspa to bring him back with Elvar</h2><p>The camp mourns him as Refna asks Uspa to bring him back with Elvar. Uspa says neither is a god and she cannot raise them as she released power in Ulfrir’s bones. No revival, burial or explicit recovery of his corpse is shown.</p></details><details><summary>The Fury of the Gods · 84</summary><h2>Refna invokes him when striking Brák after Varg’s duel, and Røkia declares the losses avenged</h2><p>Refna invokes him when striking Brák after Varg’s duel, and Røkia declares the losses avenged. This adds revenge rather than a new death account, burial or restoration.</p></details><details><summary>Illustration · The Shadow of the Gods · 43</summary><p><a href="assets/64775bcf5ec531.jpg">Open noncanonical illustration</a></p><p>Einar Half-Troll — standing with Svik&#x27;s group on the wooded slope before the attack.</p></details><details><summary>Illustration · The Fury of the Gods · 21</summary><p><a href="assets/8ab12f36af7d18.jpg">Open noncanonical illustration</a></p><p>Taras offering Einar a drink and a shared seat.</p></details><details><summary>Illustration · The Fury of the Gods · 48</summary><p><a href="assets/2980464da34af5.jpg">Open noncanonical illustration</a></p><p>Einar’s gesture affirming Bloodsworn kinship.</p></details></noscript>
