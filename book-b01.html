      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 1</summary><h2>Introduction</h2><p>The first book opens in Vigrið in the year 297 of Friðaröld, the Age of Peace. Orka and her family are out hunting; the world beyond them is introduced through their journey and the stories they tell. The chapter summaries below follow only as far as you have read.</p></details><details><summary>The Shadow of the Gods · 1</summary><h2>Chapter One - Orka</h2><p>A spring hunt in the year 297 of Friðaröld brings Orka, Thorkel and Breca into contact with a badly wounded fell-wolf. Screams draw them towards Asgrim&#x27;s steading, while Thorkel&#x27;s stories describe Snaka&#x27;s death and the breaking of the world. The steading holds a more immediate horror: Asgrim is dead and Idrun has been nailed to the gate. Orka puts an axe in Asgrim&#x27;s hand, and Breca asks where Harek has gone.</p></details><details><summary>The Shadow of the Gods · 2</summary><h2>Chapter Two - Varg</h2><p>Varg reaches Liga believing he is being pursued. Before entering, he puts an iron collar around his own neck and names Snepil as his master, although he remembers strangling him; how the killing began is missing from his memory. A trader&#x27;s account of the Bloodsworn&#x27;s Seiðr-witch leads him to their longhouse. Svik refuses his request for an akáll, but Varg agrees to enter the weapons trial after watching Einar demolish another challenger&#x27;s shield.</p></details><details><summary>The Shadow of the Gods · 3</summary><h2>Chapter Three - Orka</h2><p>With Harek still missing, Thorkel follows the tracks while Orka and Breca take the bodies to Fellur. The village&#x27;s protection against vaesen does not prevent a dispute over the killings: Guðvarr blames the creatures, Orka rejects his explanation and Virk reports other missing children. Their argument also exposes disagreement over Queen Helka&#x27;s growing authority. Thorkel returns without finding the killers, reporting tracks to a river and signs of three boats. Orka takes her family home.</p></details><details><summary>The Shadow of the Gods · 4</summary><h2>Chapter Four - Varg</h2><p>Varg&#x27;s trial against Einar ends in a gap in his awareness; he next finds himself injured outside Liga. Thoughts of his dead sister Frøya give him a reason to seek an akáll and vengeance, but Leif Kolskeggson and his men catch him at his camp. Leif accuses him of killings and claims him as a thrall. A grey-bearded warrior orders his release, backed by Einar and Svik, and declares Varg one of the Bloodsworn.</p></details><details><summary>The Shadow of the Gods · 5</summary><h2>Chapter Five - Elvar</h2><p>The Battle-Grim land on Iskalt Island with Agnar seeking a man he calls Berak and claims is gods-touched. Elvar, the youngest of the warband, is sent after a fleeing girl as the confrontation with the villagers turns violent. Her search finds an empty hut with a hole in its rear wall; Grend follows the signs towards the trees, and Agnar orders the pursuit to continue.</p></details><details><summary>The Shadow of the Gods · 6</summary><h2>Chapter 6 - Orka</h2><p>Waking from images of battle, Orka finds Breca&#x27;s cot empty. Thorkel follows the boy&#x27;s tracks to a pool, where he thinks he smells Näcken. Breca is holding an injured tennúr he says is named Vesli, to whom he has given a loose tooth. Orka strikes him and raises her hand again, but the creature shields him and Thorkel catches her wrist. Breca wants to keep his new companion.</p></details><details><summary>The Shadow of the Gods · 7</summary><h2>Chapter 7 - Elvar</h2><p>The pursuit brings Elvar, Grend and Biórr to a man fighting a troll beside a molten waterfall. A woman throws an unidentified object into the pool before fleeing with a child. The troll kills warriors before Elvar brings it down, and the man is collared. Agnar calls him Berak, despite his denial; when the boy is threatened, his eyes, teeth and nails change. Commands and flashes from the collar halt him, while Agnar talks of selling him as Berserkir.</p></details><details><summary>The Shadow of the Gods · 8</summary><h2>Chapter 8 - Orka</h2><p>Orka and Thorkel disagree over protecting Breca, whose age recalls Thorkel&#x27;s own years under a collar and lash. Spert demands an oath from Vesli, and she pledges faithfulness to him and Breca with blood. The household&#x27;s attempt to settle is interrupted by news of Sigrún&#x27;s return and an Althing in six days. Attendance is compulsory for those who remain in the realm; Thorkel advises going quietly, and Orka agrees.</p></details><details><summary>The Shadow of the Gods · 9</summary><h2>Chapter 9 - Elvar</h2><p>A sea serpent strikes the Wave-Jarl, throwing Berak&#x27;s son overboard. Elvar dives after him and Grend helps them back aboard, while the boy&#x27;s mother&#x27;s song slows the creature until it withdraws. Agnar calls her a Seiðr-witch and threatens her son. Elvar receives a gold ring for the rescue, in addition to her troll-tusk necklace, but Agnar&#x27;s plans for the family remain a sale at Snakavik.</p></details><details><summary>The Shadow of the Gods · 10</summary><h2>Chapter 10 - Orka</h2><p>At the Althing, reports of missing children accompany Sigrún&#x27;s announcement that she has sworn to Helka. Virk objects to the oath and challenges Guðvarr&#x27;s account of the search. The argument becomes a formal challenge to holmganga, which Virk accepts. Sigrún orders the preparations, and Orka agrees to stand as Virk&#x27;s second.</p></details><details><summary>The Shadow of the Gods · 11</summary><h2>Chapter 11 - Varg</h2><p>Varg wakes with his spear wound treated and learns that six days have passed. Svik explains that the trial measured how people lost rather than whether they won. The blonde warrior and the grey-bearded rescuer are now named as Røkia and Glornir, the company&#x27;s chief. On Glornir&#x27;s orders, Røkia begins Varg&#x27;s shield training; painful mistakes in the moving drills lead him to agree to learn.</p></details><details><summary>The Shadow of the Gods · 12</summary><h2>Chapter 12 - Orka</h2><p>A duel agreed to end in submission becomes fatal. After wounding Guðvarr and declaring him outside the boundary, Virk responds to an insult with a stroke at his head. Sigrún&#x27;s warrior-thrall attacks and mauls him; Thorkel kicks her away, suffers a cut and restrains Orka. Collar commands accompany the thrall&#x27;s collapse and fading changes. Sigrún rules that Virk broke the holmganga, and his sons carry his body away with the family&#x27;s help.</p></details><details><summary>The Shadow of the Gods · 13</summary><h2>Chapter 13 - Varg</h2><p>At the feast, Varg meets Torvik, another apprentice who has yet to swear the oath, and hears Galinn&#x27;s account of the gods&#x27; war. The gathering is interrupted by Prince Jaromir&#x27;s demand for Sulich, whom he accuses of crimes. Glornir refuses to surrender a sworn crewmate, and the Bloodsworn rise when he is threatened. Logur requires evidence and witnesses; Jaromir promises to return the next day.</p></details><details><summary>The Shadow of the Gods · 14</summary><h2>Chapter 14 - Elvar</h2><p>At a surviving oath stone in the Frost-Isles, Uspa uses blood to reveal images and tells of divine jealousy, feud and the creation of the vaesen. She and her son are named as Uspa and Bjarn. That night, swarming night-wyrms pin the sleepers, forcing the company to fight and burn its way free. A warrior dies, and Agnar orders a return to the ship. Elvar&#x27;s suspicion that the stone attracted the creatures remains a question.</p></details><details><summary>The Shadow of the Gods · 15</summary><h2>Chapter 15 - Orka</h2><p>After Virk&#x27;s burial, grief and the desire for revenge reach Orka&#x27;s home. Breca asks to learn weapons craft, while Thorkel counsels fairness and restraint; the boy later persuades Orka to release a trapped moth. Worried about Sigrún&#x27;s thrall and her tasting of blood, Orka asks Thorkel to leave the area with her. He agrees. Before dawn she seeks the local Froa&#x27;s advice, only to find the Ash Tree destroyed and the spirit dead. Screaming comes from the west.</p></details><details><summary>The Shadow of the Gods · 16</summary><h2>Chapter 16 - Varg</h2><p>Painful training has left Varg aching, and Svik challenges his habit of refusing help. As the company prepares to sail, Varg again asks Vol for an akáll, which she describes as reliving a life&#x27;s last moments. Glornir refuses and makes the terms of Varg&#x27;s position clear: he is an apprentice, offered food, protection and teaching in return for learning, obedience and fighting. Varg accepts coin for equipment, and Svik offers to accompany him shopping.</p></details><details><summary>The Shadow of the Gods · 17</summary><h2>Chapter 17 - Orka</h2><p>Orka returns to a burning steading. Thorkel tells her Breca has been taken, then dies outside after saying &#x27;Dragon-born&#x27; and apologising. Having rescued Vesli and placed an axe in Thorkel&#x27;s hand, Orka follows the attackers to the river. Her assault leaves her wounded but yields a captive who names Drekr under violent questioning. He claims not to know Breca&#x27;s destination or route. Orka kills him, with two river channels still leaving the direction uncertain.</p></details><details><summary>The Shadow of the Gods · 18</summary><h2>Chapter 18 - Varg</h2><p>Buying equipment with Svik and Røkia gives Varg a new kit and Glornir&#x27;s gifts of a shield and Aslog&#x27;s spear. At the docks, Jaromir&#x27;s renewed demand for Sulich becomes a cavalry attack. Varg&#x27;s inexperience shows in a forgotten helmet and a covered spearhead, but he climbs onto a horse and wounds its rider through a gap in the armour. The confrontation stops as Logur&#x27;s guards arrive and Helka&#x27;s eagle-bannered ships approach.</p></details><details><summary>The Shadow of the Gods · 19</summary><h2>Chapter 19 - Orka</h2><p>Back at the ruins, Vesli tends Orka&#x27;s wounds and gives an incomplete account of the attack, including a change in Thorkel and a red-eyed assailant with long claws. Orka releases the two vaesen from their oaths and unearths her old equipment. She buries Thorkel, equips herself with the recovered mail and provisions, seals his barrow and leaves with the blades that killed him, determined to find their owner.</p></details><details><summary>The Shadow of the Gods · 20</summary><h2>Chapter 20 - Varg</h2><p>Helka takes control of the dispute at the docks and invites Glornir to the hall. Varg&#x27;s reaction to the dead rider gives way to a lesson in battle spoils, and he helps take the man&#x27;s gear. Glornir returns with orders to sail and work for Helka against whatever is eating people in the north. With passengers made to row, Varg follows Svik&#x27;s rhythm aboard the Sea-Wolf, feeling excitement alongside his guilt about Frøya.</p></details><details><summary>The Shadow of the Gods · 21</summary><h2>Chapter 21 - Elvar</h2><p>At Snakavik, built around Snaka&#x27;s immense skull, Agnar takes a small party to Störr&#x27;s hall to sell Berak. Hrung, a speaking giant head, tastes the captive&#x27;s blood and pronounces it Berser&#x27;s blood; Störr offers a price Agnar accepts. As the party leaves, Hrung announces Elvar&#x27;s presence. She removes her hood and addresses Störr as her father.</p></details><details><summary>The Shadow of the Gods · 22</summary><h2>Chapter 22 - Orka</h2><p>Returning to Fellur for information, Orka frees Mord and Lif before entering Sigrún&#x27;s chamber. Under threat, the warrior-thrall names herself Vafri, claims mixed divine ancestry and identifies Hakon and Drekr as her master and contact. Darl is only her forced guess about Breca&#x27;s destination. Violence follows: Orka wounds Sigrún, leaves Vafri dying and escapes through the window to the brothers&#x27; boat. They row south as Guðvarr vows revenge from the pier.</p></details><details><summary>The Shadow of the Gods · 23</summary><h2>Chapter 23 - Elvar</h2><p>Störr&#x27;s visit makes Elvar&#x27;s parentage public among more of her companions. He claims her departure forced him to shed blood to restore his authority, but she refuses his proposed marriage to Hakon and insists on earning her own reputation. Grend defends what she has achieved. Störr offers reconciliation and a warband of her own, leaving Elvar with an unsettled choice rather than an accepted agreement.</p></details><details><summary>The Shadow of the Gods · 24</summary><h2>Chapter 24 - Orka</h2><p>After hiding the boat and misleading their pursuers, Orka tells the brothers about Thorkel&#x27;s death and Breca&#x27;s abduction. Their wish for revenge on Guðvarr conflicts with her need to continue the search. She refuses an immediate attack and advises waiting for the alarm in Fellur to subside. They settle on an exchange: she will teach them weapons craft if they row her to Darl.</p></details><details><summary>The Shadow of the Gods · 25</summary><h2>Chapter 25 - Elvar</h2><p>Elvar weighs Störr&#x27;s offer against a place that remains open to her with the Battle-Grim. Grend advises accepting, warns of hidden plans and promises to follow her. Seeking another answer, she takes mead to Hrung and hears his account of survival and confinement in the fjord. His reply to her question is a riddle, and she leaves as her father approaches, still without a settled decision.</p></details><details><summary>The Shadow of the Gods · 26</summary><h2>Chapter 26 - Varg</h2><p>An oar-dance after the storm gives the Bloodsworn a chance to celebrate, though Varg&#x27;s fall ends in wet training and an accusation against Einar. Their later sharing of bread follows Varg&#x27;s promise not to bite again. Skalk describes the northern killings but has no certain creature or witnesses. When he dismisses Vol as a thrall, Glornir insists on the respect due to a crewmate; Skalk yields and promises payment.</p></details><details><summary>The Shadow of the Gods · 27</summary><h2>Chapter 27 - Elvar</h2><p>Elvar and Grend return to a raid&#x27;s aftermath: Thrud is dead, Biórr wounded and Bjarn taken. Ilska&#x27;s ship escapes while Agnar initially refuses an unprofitable pursuit. Uspa says the raiders wanted her and offers knowledge of the way to Oskutreð in exchange for recovering her son. The route is her claim at this point. Elvar gives Grend a silver arm ring in recognition of their friendship.</p></details><details><summary>The Shadow of the Gods · 28</summary><h2>Chapter 28 - Orka</h2><p>The smaller waterways chosen to evade pursuit bring Orka and the brothers into danger at the rapids. A melody affects Orka and Lif before Mord is thrown into the water and bitten by a Näcken. Orka dives after him; a strike accompanied by spoken words wounds the creature, though another fails. Lif helps her ashore after its shriek throws her through the water. As it retreats, she plants iron blades on the bank and explains its dislike of iron.</p></details><details><summary>The Shadow of the Gods · 29</summary><h2>Chapter 29 - Elvar</h2><p>Elvar commits to the Battle-Grim before Uspa shares her secret. Uspa identifies the burned book from Iskalt as the Graskinna and says it gave her the route to Oskutreð. She will guide them there before Bjarn&#x27;s rescue only if they swear a binding blood oath. Six participants mingle their blood, which rises into a hot cord around their joined hands. The fatal consequences of breaking the oath are described by Kráka and Uspa, not demonstrated here.</p></details><details><summary>The Shadow of the Gods · 30</summary><h2>Chapter 30 - Varg</h2><p>The Bloodsworn leave the Sea-Wolf at a deserted farm after five days on the Slågen. Fifty warriors prepare to continue on foot while ten remain behind. Despite Svik&#x27;s warning, Varg leaves his captured armour. The farm has neither bodies nor blood; supplies are loaded onto ponies and Edel&#x27;s hounds take a scent. Varg follows with his own purpose unchanged: to live long enough to discover and avenge Frøya&#x27;s death.</p></details><details><summary>The Shadow of the Gods · 31</summary><h2>Chapter 31 - Orka</h2><p>Nearly fifteen days of indirect travel bring Orka and the brothers to Darl, with Mord healing and their weapons lessons continuing. Helka&#x27;s fortress stands above the city with its giant eagle remains and Galdur tower. After Helka arrives with warriors Orka identifies as Ulfhednar, Orka ends her arrangement with the brothers, pays them and once more counsels patience before leaving to search for Breca.</p></details><details><summary>The Shadow of the Gods · 32</summary><h2>Chapter 32 - Elvar</h2><p>Across Lake Horndal, the journey turns towards Uspa&#x27;s promised destination. Elvar qualifies her earlier identification of a Raven-Feeder as Tainted, while Agnar tells the company about Oskutreð and his promise to recover Bjarn. They agree to follow him. Later, Biórr speaks of his guilt over Thrud, promises to follow Elvar as well and kisses her, before Grend sends her to watch.</p></details><details><summary>The Shadow of the Gods · 33</summary><h2>Chapter 33 - Orka</h2><p>Searching Darl&#x27;s taverns leads Orka after a burn-scarred man to the Dead Drengr. At dawn she sees bound children being loaded onto a canal boat, attacks the guards and cuts the captives free. Their answers do not give her Breca: a boy says he is not among them, and a girl reports other children have already left the tavern. Orka entrusts their escape to the older boy and approaches the Dead Drengr after being told Drekr is inside.</p></details><details><summary>The Shadow of the Gods · 34</summary><h2>Chapter 34 - Varg</h2><p>With campfires forbidden, Svik shares cheese and tells Varg how he claims to have outwitted a troll. Torvik&#x27;s brotherly address offers Varg companionship while reminding him of his unresolved duty to Frøya. Glornir&#x27;s conversation with Vol shows his own concern for an absent woman, but it brings no change in his refusal of an akáll. Varg begins considering whether Skalk might help him instead.</p></details><details><summary>The Shadow of the Gods · 35</summary><h2>Chapter 35 - Orka</h2><p>Breca&#x27;s carved sword pendant is what Orka recognises inside the Dead Drengr. Her search becomes a confrontation with Hakon and Drekr, who boasts of stabbing her husband. The fight moves into the street, where Drekr wounds and nearly strangles her while making unexplained claims about Breca. An unnamed inner change restores her strength enough to break free. Lif and Mord ride in to rescue her, leaving Drekr alive.</p></details><details><summary>The Shadow of the Gods · 36</summary><h2>Chapter 36 - Varg</h2><p>Skalk offers Varg an akáll in exchange for a future blood-oath debt, warning that accepting may cost him his place among the Bloodsworn. The company&#x27;s discovery of twenty-four mutilated bodies makes their own bargain with Helka more troubling. Vol translates the rune as &#x27;Forbidden ground&#x27;; the dead are Helka&#x27;s drengrs, whose dispatch Skalk had not disclosed. Glornir confronts him but continues the hunt despite the incomplete account of their mission.</p></details><details><summary>The Shadow of the Gods · 37</summary><h2>Chapter 37 - Orka</h2><p>Lif and Mord have sold their boat and bought horses. While recovering and repairing her mail, Orka plans another attempt to obtain information. She captures the burned man, who names himself Skefil and reports that Drekr has taken Tainted children towards Grimholt Pass. She questions him about Breca and Hakon before killing him. The report points her towards the pass without independently confirming Breca&#x27;s presence among the children.</p></details><details><summary>The Shadow of the Gods · 38</summary><h2>Chapter 38 - Elvar</h2><p>At the vaesen pit, Uspa&#x27;s blood and chanting reveal a pawprint and the Isbrún Bridge as she steps over the chasm. Before the company can pass safely, tennúr erupt beneath the camp. Grend falls protecting Elvar, who holds them off until Biórr carries him out; she also rescues Sólín on the retreat. Leaving dead warriors and a pony behind, the survivors reach the ice bridge and continue towards Oskutreð.</p></details><details><summary>The Shadow of the Gods · 39</summary><h2>Chapter 39 - Varg</h2><p>Showing Torvik the lock of Frøya&#x27;s hair makes Varg&#x27;s need for an akáll personal, and Torvik&#x27;s offer to help hunt her murderers makes leaving harder. At camp, Skalk&#x27;s hostility towards Vol draws Glornir&#x27;s intervention. Accounts of inherited Seiðr and learned Galdur lead into the reported binding of Ulfrir and the making of thrall-collars from his chain. Skalk then renews Jaromir&#x27;s accusation against Sulich, which Sulich denies before Glornir stops the confrontation.</p></details><details><summary>The Shadow of the Gods · 40</summary><h2>Chapter 40 - Orka</h2><p>Feeling a debt to the brothers, Orka proposes using herself as bait to help avenge their father. Guðvarr&#x27;s arrival at their lodging farm overtakes the plan and forces a flight north towards Grimholt Pass. At a ravine she sets a wooden bridge alight, making the pursuers retreat from the timbers. She intends to keep drawing Guðvarr after them while continuing her search for Drekr and Breca.</p></details><details><summary>The Shadow of the Gods · 41</summary><h2>Chapter 41 - Varg</h2><p>Following guarded captives leads the Bloodsworn to a cliff excavation, where emaciated people carry rubble from a tunnel. Glornir divides the company for the approach and Torvik guides Svik&#x27;s group into position. Varg prepares his equipment without mail and weighs the possibility of escape. Svik reminds the two apprentices that they have not taken the oath, but Varg follows when Glornir steps into the glade. The battle has not yet begun.</p></details><details><summary>The Shadow of the Gods · 42</summary><h2>Chapter 42 - Elvar</h2><p>The survivors of the bridge attack count their losses while Grend lies unconscious in a cart. Uspa says his skull is not broken, and Agnar brings Elvar food and speaks of the family he has chosen. Grend eventually wakes and speaks to her before sleeping again. Sólín acknowledges the rescue as a blood-debt, which Elvar answers by calling them shield-sisters. Elvar then thanks Biórr, kisses him and leads him away from camp.</p></details><details><summary>The Shadow of the Gods · 43</summary><h2>Chapter 43 - Varg</h2><p>The assault on the excavation breaks Varg and Torvik from the shield line, but Einar kills the skraeling threatening them. A troll blocks the route to Glornir while a red-eyed swordsman throws and wounds the chief. Vol&#x27;s blood-and-flame rune offers only brief protection before the bone sword breaks it. Varg intervenes, releases his restrained rage and drives his cleaver into the man&#x27;s head. The falling sword strikes his waist, ending his awareness before the fight&#x27;s outcome is known.</p></details><details><summary>The Shadow of the Gods · 44</summary><h2>Chapter 44 - Elvar</h2><p>Travelling through the Dark-of-Moon Hills, the Battle-Grim remain in full battle gear and Agnar voices a concern he cannot identify. Biórr and Elvar continue their relationship; his account of whip scars and dead kin adds to what she knows of him. Uspa admits uncertainty about when they will reach Oskutreð and warns against carrying its treasures south, while putting Bjarn&#x27;s recovery above her principles. Their debate turns to fame, love, chosen kin and the consequences of individual choices.</p></details><details><summary>The Shadow of the Gods · 45</summary><h2>Chapter 45 - Varg</h2><p>Varg wakes alive in the catacomb, where Vol tends his pain and Torvik explains the chamber through identifications and saga-tales. Vol names her missing sister as Uspa, then hears Varg&#x27;s fragmented account of Frøya&#x27;s death and the killings on the farm. Their conversation ends in betrayal: Skalk knocks Vol unconscious, Yrsa mortally wounds Torvik and Olvir restrains Varg. Offered an akáll for his oath, Varg attacks Olvir instead. Skalk kicks him unconscious as Vol is carried away.</p></details><details><summary>The Shadow of the Gods · 46</summary><h2>Chapter 46 - Orka</h2><p>Orka and the brothers climb towards Grimholt with smoke marking Guðvarr&#x27;s pursuit behind them. A broken oath stone beneath a hanging dead eagle bears a fresh, blood-coated carving, which Orka identifies with Lik-Rifa worship; its connection to Breca remains speculation. Training continues while her own wounds heal. She plans to reach Grimholt before deciding whether to press on or confront their pursuers, and prepares the brothers for fighting armoured opponents.</p></details><details><summary>The Shadow of the Gods · 47</summary><h2>Chapter 47 - Varg</h2><p>Varg wakes to a company whose secrets are being disclosed. Svik reveals fox ancestry with a reversible change of face, eyes and teeth, while Edel and Røkia identify the wolf in Varg&#x27;s blood. The companions explain that secrecy let them judge his trustworthiness. Glornir, grieving Vol&#x27;s abduction and explicitly naming her as his wife, invites Varg into the Bloodsworn. Varg accepts a silver arm ring, but the formal oath-words must wait while they pursue her rescue.</p></details><details><summary>The Shadow of the Gods · 48</summary><h2>Chapter 48 - Elvar</h2><p>Beyond the Gallows Wood, the Battle-Grim reach Oskutreð&#x27;s immense ruined stump and the remains around it. Vörn emerges from a living tree and forbids entry onto the dead one; when Sighvat attacks, she binds him in vines. She says Lik-Rifa is imprisoned below and names the dragon&#x27;s gaolers. Agnar promises to keep his company away from the tree. Their gathering of relics is interrupted by Ilska&#x27;s approaching force.</p></details><details><summary>The Shadow of the Gods · 49</summary><h2>Chapter 49 - Orka</h2><p>Unable to assault Grimholt directly, Orka follows a disturbance and finds two speaking ravens threatened by frost-spiders. Remembering Breca and the moth, she intervenes with the brothers. Lif is bitten, web numbs her leg and Mord becomes entangled, although the freed ravens help her before flying away. Arriving riders include a blond staff-bearer who burns the spiders. More warriors surround the party, and he strikes Orka down as she tries to carry Lif out.</p></details><details><summary>The Shadow of the Gods · 50</summary><h2>Chapter 50 - Elvar</h2><p>Ilska refuses Uspa&#x27;s demand for Bjarn and offers a holmganga between Agnar and her brother Skrið. Despite his opponent&#x27;s suddenly heightened strength and speed, Agnar wins while suffering severe wounds. Vörn recognises dragon-born blood and forbids their approach. Ilska&#x27;s carts reveal scores of collared children, including Bjarn. When Biórr reaches the wounded Agnar, he drives his spear into the chief&#x27;s mouth and throat, leaving Elvar screaming as he falls.</p></details><details><summary>The Shadow of the Gods · 51</summary><h2>Chapter 51 - Orka</h2><p>Captured inside Grimholt, Orka hears a child and calls for Breca, but the guards subdue her. Interrogation exposes Hakon&#x27;s order to accommodate Drekr&#x27;s traffic. Guðvarr&#x27;s stabbing of the bound Mord brings a surge of strength and sharpened senses; Orka bites through her bonds, frees Lif and wounds Skalk. The ravens repay her rescue by opening the roof and bringing Spert and Vesli. With their aid she drives the guards into retreat and pursues them towards the courtyard.</p></details><details><summary>The Shadow of the Gods · 52</summary><h2>Chapter 52 - Elvar</h2><p>Agnar dies and Biórr declares his allegiance to Ilska, acknowledging Thrud&#x27;s killing. Grend draws Elvar back into the Battle-Grim&#x27;s defence and carries her behind the line after she is wounded. At the tree, Ilska overcomes resistance and uses a blood ritual involving the collared children to open the door. Lik-Rifa emerges and fights her gaolers. Elvar and Grend survive the blast but cannot prevent the dragon&#x27;s departure or Ilska&#x27;s company leaving with the children.</p></details><details><summary>The Shadow of the Gods · 53</summary><h2>Chapter 53 - Varg</h2><p>Following Skalk&#x27;s trail, Varg runs with Edel&#x27;s scouts in his newly won armour, increasingly accepting his place among the Bloodsworn. Smoke and blood lead them to a devastated fortress. On its steps a woman sits with two vaesen and a group of children, but says the person she seeks is not there. Glornir recognises her as Orka Skullsplitter, asks after his brother and embraces her after hearing of a killing and her son&#x27;s abduction.</p></details></noscript>
