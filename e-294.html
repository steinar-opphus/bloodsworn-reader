      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>A bound druzhina at the tongue-eater pool tells Glornir that Jaromir is taking Vol to Valdai. The witness had been separated from the prince’s ship in mist. This is a reported destination only: settlement type, geography, a completed arrival and Vol’s present condition are unspecified.</p></details><details><summary>The Hunger of the Gods · 59</summary><h2>New looks on the journey through Ulaz</h2><p>Edel and Sulich report Jaromir bound for his tower here. Sulich estimates three days&#x27; riding from Ulaz and proposes a narrow footpath unsuitable for horses as a possible interception route. No successful interception is shown.</p></details><details><summary>The Hunger of the Gods · 63</summary><h2>A shortcut through the mountains</h2><p>From the approach ridge the company sees the fortress beyond a road vale with boulders, hawthorn and a rockfall bottleneck. Sulich says the shortcut has put them ahead of Jaromir; reconnaissance and ambush preparations begin.</p></details><details><summary>The Hunger of the Gods · 66</summary><h2>Sulich&#x27;s lineage and the ambush</h2><p>Røkia reports closed timber gates, walls about twice Glornir&#x27;s height, a north-south stream beneath the wall, tower, hall and stables, with an estimated fifty spears. The force and adequacy estimates remain her reconnaissance assessment.</p></details><details><summary>The Hunger of the Gods · 70</summary><h2>The pursuit into Valdai</h2><p>The Bloodsworn pursue Jaromir across the sun-bleached plain towards Valdai, under high hot sun and through the riders&#x27; dust. The company numbers fifty men and women. Vol rides her own horse behind Jaromir, while the mounted Røkia and Sulich pass in among the retreating druzhina before the gates close.</p></details><details><summary>The Hunger of the Gods · 70</summary><h2>The pursuit into Valdai</h2><p>The Bloodsworn force the gates and hall during Vol&#x27;s rescue. Jaromir is killed below, where a Vigrið map and a tapestry-concealed barred prison holding the Khagan&#x27;s Tainted children are discovered. No purpose for the map or completed prisoner release is yet supplied.</p></details><details><summary>The Fury of the Gods · 1</summary><h2>The Bloodsworn hold its courtyard on the day after battle</h2><p>The Bloodsworn hold its courtyard on the day after battle. The gates are shattered, stripped enemy corpses lie nearby and fifteen fallen company members have stone barrows along a wall. Survivors tend wounds and equipment and keep watch under a cloudless, searing sun. A gate tower contains a square chamber and a holding pen, where Vol frees Iva and Taras. Two giant ravens subsequently land with Vesli carrying an employment offer.</p></details><details><summary>Illustration · The Hunger of the Gods · 70</summary><p><a href="assets/e546af7cc877e5.jpg">Open noncanonical illustration</a></p><p>The Bloodsworn pursue their enemies through the gates of Valdai.</p></details><details><summary>Illustration · The Fury of the Gods · 1</summary><p><a href="assets/203e711c970de2.jpg">Open noncanonical illustration</a></p><p>Vesli arrives at Valdai.</p></details></noscript>
