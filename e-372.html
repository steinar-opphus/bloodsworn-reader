      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 36</summary><h2>The dragon’s host marches out</h2><p>The force assembles at Darl’s Galdur courtyard with Raven-Feeders, dragon-born, sworn drengrs, skraeling, tennúr, children’s wagons and mounts. Hundreds of Tainted join through the streets, some families, alongside Glunn’s riders, petty jarls, mercenaries and cultists; scores of wagons carry stores. Lik-Rifa leads from a grey gelding, Ilska and Drekr beside her, Rotta and Biórr behind. Sterkur’s gold-eye band and Leif are admitted at the docks. It leaves Darl towards Snakavik by land and gathers troll clans, spiders, night-hags and spertus. Rotta attributes the route to unwilling sailors and fear of splitting; total strength and supply sufficiency are not independently established.</p></details><details><summary>The Fury of the Gods · 41</summary><h2>At dawn the camp readies to march, then approaches the Slågen with Jarnvidr beyond</h2><p>At dawn the camp readies to march, then approaches the Slågen with Jarnvidr beyond. Ilska halts it for the reduced hunting party and leaders receive negotiations, collar news and den intelligence. Supply/casualty totals and an actual river crossing or den attack are not given.</p></details><details><summary>The Fury of the Gods · 45</summary><h2>The host enters the Iron Wood</h2><p>The host approaches from north of Ulfrir’s den by Ilska’s more open route, not the hunters’ former crossing. After another hard march it camps stretched along the forest road, scrub blocking even trolls while spiders, hags and tennúr range deeper. Darl’s thralls handle essential labour; Sigrún credits Ilska’s organisation. A dawn tennúr warning names no approaching opponent.</p></details><details><summary>The Fury of the Gods · 46</summary><h2>At dawn Bloodsworn and Sulich’s bowmen emerge from a hidden tunnel near the roadside camp</h2><p>At dawn Bloodsworn and Sulich’s bowmen emerge from a hidden tunnel near the roadside camp. Some opponents scramble for kit while others are ready; perimeter spiders/hags and then camp fighters are attacked, with tents catching fire. The raid has not become a demonstrated destruction of the full host. Orka meets Drekr at the cutoff.</p></details><details><summary>The Fury of the Gods · 47</summary><h2>The dawn raid is disrupted by Lik-Rifa’s landing, which throws camp inhabitants aside</h2><p>The dawn raid is disrupted by Lik-Rifa’s landing, which throws camp inhabitants aside. Attackers withdraw at a horn, and Ilska/Drekr lead pursuit without finding them. Rotta reports further attacks along the line and infers tunnel use from the tracks; neither final losses nor the raiders’ full return is counted.</p></details><details><summary>The Fury of the Gods · 48</summary><h2>Kló reports many dead from the raid and many Tainted newly joining the host</h2><p>Kló reports many dead from the raid and many Tainted newly joining the host. These are scout reports without names or exact numbers; losses do not mean the army destroyed or reinforcements identified.</p></details><details><summary>The Fury of the Gods · 49</summary><h2>Elvar sends additional tunnel sorties with orders to burn supply wagons as the host approaches</h2><p>Elvar sends additional tunnel sorties with orders to burn supply wagons as the host approaches. The scene does not directly witness the wagons burning or measure new casualties.</p></details><details><summary>The Fury of the Gods · 50</summary><h2>Burned wagons are salvaged after repeated night raids</h2><p>Burned wagons are salvaged after repeated night raids. Captains report the first night worst, later thinly stretched guards and fresh losses; Ilska says two mercenary bands deserted north. Food is estimated at three/four days and the den two days away, with siege needs disputed. More Tainted arrive and provisioning is ordered, no exact reinforcement identities or final casualty count.</p></details><details><summary>The Fury of the Gods · 53</summary><h2>A night march under false campfires</h2><p>After another day’s march and a meal/training stop, tennúr circulate the order to ride and leave fires burning. The host moves through darkness under Rotta’s attempted scout deception, aiming for dawn arrival. New rat-blood guards are visible near the gods; no arrival, surprise success or completed battle is shown.</p></details><details><summary>The Fury of the Gods · 55</summary><h2>The siege begins at the river</h2><p>The army arrives and camps before Wolfdales at dawn, facing prepared defenders; surprise success is not stated. Captains choose ladders/rafts and issue axes/rope, then spread into timber-cutting. Froa attack the workers and Lik-Rifa counters trees, without a complete casualty count or successful main assault yet.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>Freedom and the approaching army</h2><p>Rafts and ladders are completed and brought out among skraeling, trolls, frost-spiders, tennúr and armed companies. After failed parley Rotta signals the advance: dozens of rafts push off, six shielded wedges fill the bridge and ladders reach the gate. The crossing meets active defence; neither complete defeat nor victory is shown.</p></details><details><summary>The Fury of the Gods · 57</summary><h2>Rafts and ladders reach the defences</h2><p>Raft waves and shield-assisted skraeling leaps put some attackers at or over the walls, where defenders fight them. Spertus approach down a crowded tributary; Rotta takes Biórr and about twelve others into the forest without stating a destination. Sigrún’s crew carries two rafts toward the river, no final siege outcome shown.</p></details><details><summary>The Fury of the Gods · 58</summary><h2>Fresh ladder/raft and mercenary waves follow the initial assault</h2><p>Fresh ladder/raft and mercenary waves follow the initial assault. Spertus fly/climb over embankment walls with poison; trolls climb their thrown spears/axes and tennúr attack from above. The gate and bank defence is breached and Elvar orders withdrawal, without a final conquest shown.</p></details><details><summary>The Fury of the Gods · 59</summary><h2>Across the wall towards the hall</h2><p>The attackers establish control at the river gate as skraeling unbar it for Ilska/Drekr’s Raven-Feeders and following forces. Sigrún’s unit advances after spertus break a small retreating shield group. Ahead lies Elvar’s road-blocking shield wall before the hillside door; the main battle remains unresolved.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>Elvar Chainbreaker and the hillside stand</h2><p>Ilska forms a shield front deeper than Elvar’s, vaesen gathering behind, night-hags visible beyond the river gate. Spertus surge ahead but volleys, shield defence and a dispersing wind blunt them; survivors recall at a horn. The following shield wall fills arrow gaps and collides with the defenders outside the stone doors.</p></details><details><summary>The Fury of the Gods · 61</summary><h2>The shield line under pressure</h2><p>Their shield wall sustains close fighting and replacement ranks, then horn signals bring a controlled disengagement. The wall parts for frost-spiders, with trolls behind. This is a transition between waves, not a final defeat or ended siege.</p></details><details><summary>The Fury of the Gods · 64</summary><h2>From the hill crown Biórr sees fires along both riverbanks and recognises the host making camp</h2><p>From the hill crown Biórr sees fires along both riverbanks and recognises the host making camp. He infers the fight is neither complete defeat nor victory. Meanwhile Rotta’s selected crew takes a tower route; the main force’s exact losses or final success remain unknown.</p></details><details><summary>The Fury of the Gods · 71</summary><h2>Guðvarr suspects heavier losses than the defenders, a subjective assessment</h2><p>Guðvarr suspects heavier losses than the defenders, a subjective assessment. Sigrún’s and Estrid’s joined shield group breaks under the huge bull-man/Berserkir charge; Estrid is then killed by Guðvarr. The freed dragon lifts Rotta inside the hall, without a counted total or final host outcome.</p></details><details><summary>The Fury of the Gods · 78</summary><h2>The host regathers in a shattered snowy camp with some food/supplies</h2><p>The host regathers in a shattered snowy camp with some food/supplies. Guðvarr judges over half lost; wounded/skraeling mourning, Heðin’s treatment and surviving spiders/night-hags show a reduced mixed force without exact roster. Sigrún/Drekr/Krúsa/Glunn are returned so far. The gods enter, wounded dragon/rat in human form behind human Snaka, and public kneeling acclaims the father as king.</p></details><details><summary>The Fury of the Gods · 80</summary><h2>The host completes obeisance to Snaka before the public family meal</h2><p>The host completes obeisance to Snaka before the public family meal. The siblings’ heart plan ends in poisoning/knife attack, Snaka’s collapse and heart extraction, but an unnamed tennúr takes the heart. Further tennúr warn of the wolf and figures charge, with the battle’s result not yet shown.</p></details><details><summary>The Fury of the Gods · 81</summary><h2>The allied surprise charge strikes its unprepared camp after Snaka’s murder</h2><p>The allied surprise charge strikes its unprepared camp after Snaka’s murder. The dragon/rat shift and fight Ulfrir/guardians/Skuld, while trolls defend them; Darl’s wing-shield group rallies under Yrsa before Varg defeats her. More fighting continues with an unnamed caster and Brák’s hunters, without a final host outcome.</p></details><details><summary>The Fury of the Gods · 82</summary><h2>Fighting under heavy snow remains confused</h2><p>Fighting under heavy snow remains confused. Heðin destroys one guardian; Battle-Grim break Sigrún’s wall, Krúsa is killed and Sigrún is left wounded while Guðvarr attempts flight. No full host outcome or completed rescue is shown.</p></details><details><summary>The Fury of the Gods · 87</summary><h2>At dawn the battle is still unresolved when Faunir reinforce against its vaesen</h2><p>At dawn the battle is still unresolved when Faunir reinforce against its vaesen. Biórr/Fain choose to leave the gods’ cause, Fain’s children’s wagon departs and Bjarn rejoins his parents. Gunnar’s finishing attack on Biórr follows; no complete warhost defeat or evacuation tally is yet given.</p></details><details><summary>The Fury of the Gods · 88</summary><h2>Its surviving mixed forces gather toward Lik-Rifa as Faunir and mounted warriors continue the battle</h2><p>Its surviving mixed forces gather toward Lik-Rifa as Faunir and mounted warriors continue the battle. Orka breaks one cultist flank, but the overall host outcome waits on the renewed god clash.</p></details><details><summary>Illustration · The Fury of the Gods · 82</summary><p><a href="assets/886c07126fc4ce.jpg">Open noncanonical illustration</a></p><p>Heðin reducing one stone guardian’s head to rubble.</p></details><details><summary>Illustration · The Fury of the Gods · 47</summary><p><a href="assets/5529b71048adad.jpg">Open noncanonical illustration</a></p><p>Lik-Rifa breaking through the canopy during the raid.</p></details><details><summary>Illustration · The Fury of the Gods · 36</summary><p><a href="assets/de0423fd74978e.jpg">Open noncanonical illustration</a></p><p>Lik-Rifa’s departure, just before her voice and face change.</p></details><details><summary>Illustration · The Fury of the Gods · 80</summary><p><a href="assets/37be3fc75eb662.jpg">Open noncanonical illustration</a></p><p>Snaka expelling the poison before the knife attack.</p></details><details><summary>Illustration · The Fury of the Gods · 78</summary><p><a href="assets/9b5bd529e2431f.jpg">Open noncanonical illustration</a></p><p>Snaka’s human form in the snowy enemy camp.</p></details><details><summary>Illustration · The Fury of the Gods · 57</summary><p><a href="assets/6f5f69946c0541.jpg">Open noncanonical illustration</a></p><p>The spertus crowding the tributary.</p></details><details><summary>Illustration · The Fury of the Gods · 81</summary><p><a href="assets/7e24dd3cc88c25.jpg">Open noncanonical illustration</a></p><p>Sulich’s mounted force entering the unprepared camp.</p></details><details><summary>Illustration · The Fury of the Gods · 61</summary><p><a href="assets/ebf68832f37548.jpg">Open noncanonical illustration</a></p><p>The frost-spiders advancing after the disengagement.</p></details><details><summary>Illustration · The Fury of the Gods · 53</summary><p><a href="assets/d5418f7575f773.jpg">Open noncanonical illustration</a></p><p>The ordered night march with campfires left burning.</p></details><details><summary>Illustration · The Fury of the Gods · 80</summary><p><a href="assets/b1d8da09570245.jpg">Open noncanonical illustration</a></p><p>The unnamed tennúr’s flight; its stolen cargo is hidden from view.</p></details></noscript>
