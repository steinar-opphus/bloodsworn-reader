      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 33</summary><h2>Children freed at the canal</h2><p>Orka follows a burn-scarred man from the tavern to the Dead Drengr. A woman outside the Dead Drengr carries a black shield with gold eagle wings; Orka identifies her as one of Helka&#x27;s drengrs. At dawn Orka sees bound children being taken from the Dead Drengr&#x27;s rear courtyard to a canal boat. A guard strikes a sobbing child, lifts her by the hair and throws her into the boat. The girl reports that other captive children had been held at the tavern but are now gone. The older boy says Drekr is inside the Dead Drengr.</p></details><details><summary>The Shadow of the Gods · 35</summary><h2>The confrontation at The Dead Drengr</h2><p>Orka hears the freed children rowing away as she enters the Dead Drengr courtyard. The Dead Drengr&#x27;s loft contains about twenty small reed mattresses and smells of urine and faeces. The burned man joins six or seven people playing knucklebone inside the tavern. The hooded young man at Drekr&#x27;s table is Hakon, whom Orka recognises from the docks. The tavern&#x27;s players, bartender and doorway guards join the attack against Orka. Orka and Drekr crash through the broken window into the street.</p></details><details><summary>The Hunger of the Gods · 21</summary><h2>An audience with Queen Helka</h2><p>After Helka’s feast, Guðvarr wakes beside an unnamed red-haired woman in a dark, straw-floored room beneath a sloping roof. She identifies it as the tavern’s hayloft. Yrsa summons him from its trapdoor. The passage does not establish that this room is the same loft previously seen by Orka.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>Svik’s inquiry leads Varg’s party here; the windows look recently repaired. Inside, Brimil counts coins under a female guard while the grey-haired, balding bartender Rog serves ale, limping with a bandaged ankle. No identity with earlier unnamed inn figures is established.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>Varg knocks Rog into a table and attacks Brimil. The slaver names Brák Trolls-Bane as Frøya’s purchaser and says the hunter drinks here when in town, though he is currently away. Svik kills Brimil, Røkia kills the female guard and Einar kills the outside guard. Rog remains unmoving with no confirmed death.</p></details><details><summary>The Hunger of the Gods · 33</summary><h2>A summons after the tower battle</h2><p>Yrsa and Sturla find Guðvarr in the hayloft with the red-haired sex worker Vilja and summon him to Skalk. Vilja is named in this scene without an explicit identification with the earlier unnamed woman.</p></details><details><summary>The Hunger of the Gods · 33</summary><h2>A summons after the tower battle</h2><p>Skalk says Orka told him Hakon met Drekr here and that later inquiries suggest Hakon visited repeatedly at night or before opening. He wants Guðvarr’s frequent presence to help him get closer to the prince. The new visit pattern is reported information, not a new directly witnessed meeting or disclosure of Hakon’s full purpose.</p></details><details><summary>The Hunger of the Gods · 46</summary><h2>A secret meeting before dawn</h2><p>The roof-space has a straw mattress, sloping roof and a beam Guðvarr strikes while dressing, with light through a crack. The stairs lead to a small storeroom of provisions beside the courtyard door. The canal flows behind the yard and the latrine is a bucket shed. It is early daylight and the inn is not open to ordinary customers.</p></details><details><summary>The Hunger of the Gods · 46</summary><h2>A secret meeting before dawn</h2><p>Rog is alive serving drinks, with a dirty linen head bandage and a limp, and later cooks breakfast over an iron griddle. Hakon sits near the back with the hooded Kalv while Gudrun watches the room from a hearth-side corner. The meeting involves a tattoo-like mark and a message attributed to Drekr; Guðvarr overhears before joining them.</p></details><details><summary>The Hunger of the Gods · 46</summary><h2>A secret meeting before dawn</h2><p>Rog admits two more cloaked men, calls them Hakon’s friends, and Guðvarr recognises Skapti and Hrolf from Grimholt. Their arrival is shown, but the next exchange, their release route and the fates of other former prisoners are not.</p></details><details><summary>The Hunger of the Gods · 48</summary><h2>Flight from the breakfast table</h2><p>Skapti’s warning at breakfast is followed by Guðvarr overturning the table into Hakon and throwing ale at Kalv. Guðvarr flees through barrels and boxes, dropping barrels which trip Gudrun. He crosses the rear courtyard, passes the latrine and breaks through rotting gates to the canal-bank.</p></details></noscript>
