      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 1</summary><h2>Introduction</h2><p>Orka is Thorkel&#x27;s wife and Breca&#x27;s mother.</p></details><details><summary>The Shadow of the Gods · 1</summary><h2>Appearance</h2><p>She has blonde hair and grey-green eyes like Breca&#x27;s. During the family&#x27;s climb to the steading, her hair is braided.</p></details><details><summary>The Shadow of the Gods · 3</summary><h2>Appearance</h2><p>Her size is described through comparison: she is taller than Virk, and both taller and wider than Guðvarr.</p></details><details><summary>The Shadow of the Gods · 1</summary><h2>The life she tries to hold together</h2><p>Violence intrudes on Orka&#x27;s thoughts even before it reaches her own home. The injured wolf&#x27;s blood brings images of death, and danger stirs a familiar physical response. At Asgrim&#x27;s steading she puts an axe in his hand and urges him to travel the soul road armed.</p></details><details><summary>The Shadow of the Gods · 6</summary><h2>Battle memories and fear for Breca</h2><p>Battle also follows her into sleep. She wants alcohol to quiet the memories, although Thorkel has asked her to drink less. When fear for Breca turns into anger at the pool, Thorkel restrains her; she has learned to trust his judgement when her blood is high.</p></details><details><summary>The Shadow of the Gods · 15</summary><h2>Courage, grief and a trapped moth</h2><p>Orka tells Breca that her own parents died when she was about ten or eleven, and remembers wanting to forget them. Yet she teaches him that courage means doing what must be done despite fear, and his appeal moves her to free a moth from a spiderweb.</p></details><details><summary>The Shadow of the Gods · 15</summary><h2>Courage, grief and a trapped moth</h2><p>She asks Thorkel to leave the area with her. He agrees, and she tells him that he and Breca are her home wherever they live. Before dawn she leaves Spert guarding the locked steading and sets out with her spear.</p></details><details><summary>The Shadow of the Gods · 17</summary><h2>A home destroyed</h2><p>Returning to a burning hall and a destroyed rune-post, Orka drags the wounded Thorkel outside. He tells her that Breca has been taken. She promises to recover their son, but Thorkel dies after saying &#x27;Dragon-born&#x27; and apologising. Orka carries Vesli out as the hall collapses, then places Thorkel&#x27;s long-axe in his hand.</p></details><details><summary>The Shadow of the Gods · 17</summary><h2>A home destroyed</h2><p>Her pursuit leads to a group beside the river. Fighting leaves her wounded, and a violent interrogation gives her the name Drekr, but not Breca&#x27;s destination. She kills the young captive after obtaining the name.</p></details><details><summary>The Shadow of the Gods · 19</summary><h2>Thorkel&#x27;s burial and the recovered war gear</h2><p>Back at the steading, Vesli tends Orka&#x27;s wounds. Orka releases both vaesen from their oaths, unearths her old equipment and buries Thorkel beneath a timber-and-stone barrow. She takes the blades that killed him, puts on her recovered mail and leaves determined to find their owner.</p></details><details><summary>The Shadow of the Gods · 22</summary><h2>Lif, Mord and Vafri freed or questioned</h2><p>In Fellur she frees Mord and Lif and forces information from Sigrún&#x27;s warrior-thrall, who names herself Vafri. Vafri identifies Hakon as her master and Drekr as her contact; Darl is only her guess about Breca&#x27;s destination. Orka escapes by boat with the brothers.</p></details><details><summary>The Shadow of the Gods · 31</summary><h2>The river journey ends at Darl</h2><p>The brothers row her towards Darl in exchange for weapons training. They keep to smaller waterways to avoid pursuit, and Orka rescues Mord from the river. At Darl she ends their arrangement, pays Lif and urges both men to put off revenge while she searches for Breca.</p></details><details><summary>The Shadow of the Gods · 35</summary><h2>The search in Darl</h2><p>Orka follows her enquiries through Darl&#x27;s taverns to the Dead Drengr, freeing captive children on the way. A small wooden sword on a broken cord is recognisable as Breca&#x27;s pendant, but it does not establish his present location. Fighting Drekr leaves her wounded and nearly strangled; a sudden sharpening of strength and senses helps her escape alive with Lif.</p></details><details><summary>The Shadow of the Gods · 46</summary><h2>Flight north and the broken oath stone</h2><p>Guðvarr&#x27;s arrival forces Orka and the brothers north. She burns a bridge to delay him and makes for Grimholt Pass. Along the way she finds a broken oath stone and signs she associates with Lik-Rifa worship; its connection to Breca&#x27;s abduction remains her speculation.</p></details><details><summary>The Shadow of the Gods · 49</summary><h2>Helping ravens among the frost-spiders</h2><p>Near Grimholt, Orka helps two speaking ravens caught among frost-spiders, remembering Breca&#x27;s rescue of the moth. The intervention ends in capture: her leg is numbed by web, Lif is bitten, and an unnamed staff-bearer strikes her down as she tries to carry him away.</p></details><details><summary>The Shadow of the Gods · 51</summary><h2>The wolf unleashed in captivity</h2><p>When Guðvarr stabs the bound Mord, Orka&#x27;s senses, strength and teeth change. The narration now explicitly names the wolf in her blood. She bites through her bonds, frees Lif and wounds Skalk. The ravens repay her help by bringing Spert and Vesli through the roof, and together they drive the guards out.</p></details><details><summary>The Shadow of the Gods · 53</summary><h2>Orka Skullsplitter recognised</h2><p>The Bloodsworn find her on Grimholt&#x27;s steps with Spert, Vesli and a group of children. The person she seeks is not among them. Glornir recognises her as Orka Skullsplitter, and they embrace: the old identity becomes established here, rather than being knowledge the reader possessed from the beginning.</p></details><details><summary>The Hunger of the Gods · 1</summary><h2>Rest and restraint in the burned hall</h2><p>At Grimholt she nearly stabs Lif on waking from a nightmare, then restrains herself. She bathes, puts on clean wool breeches, a linen undertunic and a blue-grey wool overtunic, and carries her dirty mail rather than wearing it.</p></details><details><summary>The Hunger of the Gods · 1</summary><h2>Rest and restraint in the burned hall</h2><p>She admits her Tainted nature to Lif and says Breca carries her wolf-blood. In her account she was pregnant when she and Thorkel left the Bloodsworn, jumping overboard in a sea battle and swimming ashore while the company believed them dead. She says the Skullsplitter has returned to help find Breca.</p></details><details><summary>The Hunger of the Gods · 1</summary><h2>Rest and restraint in the burned hall</h2><p>She helps Lif recover Mord&#x27;s body and tells Glornir that Skalk&#x27;s party fled by snekke.</p></details><details><summary>The Hunger of the Gods · 3</summary><h2>Mord&#x27;s burial and a blood feud</h2><p>Røkia challenges her departure from the company. Orka recounts Thorkel&#x27;s death and Breca&#x27;s abduction to Glornir and names Drekr as dragon-born. Varg&#x27;s captured seax matches her blades in its hilt knotwork; she suspects a connection among the weapons, stolen children and Lik-Rifa carving, rather than proving a common plot.</p></details><details><summary>The Hunger of the Gods · 3</summary><h2>Mord&#x27;s burial and a blood feud</h2><p>She says Breca is ten and hears Glornir call him his nephew. She thinks Skalk is heading for Darl but admits she did not see Vol taken aboard.</p></details><details><summary>The Hunger of the Gods · 7</summary><h2>An offer to return to the Bloodsworn</h2><p>At Grimholt she cleans her rust-spotted mail by beating it in a sack of sand, grit and salt. A pale scar across her palm recalls her blood oath over a black shield; when she mounts Trúr, her mail is sand-scoured and gleaming.</p></details><details><summary>The Hunger of the Gods · 7</summary><h2>An offer to return to the Bloodsworn</h2><p>Glornir offers her a return to the Bloodsworn, although not as chief. She refuses, placing Breca and her vengeance oath first. She chooses the western mine in hope of a clue to Breca, and Glornir assigns Edel to guide her.</p></details><details><summary>The Hunger of the Gods · 7</summary><h2>An offer to return to the Bloodsworn</h2><p>She arranges for the rescued children to travel as far as Darl with Glornir. Although he also conditionally accepts Lif, Lif asks to stay with her for further weapons training. She tells him to gather equipment, provisions and their horses.</p></details><details><summary>The Hunger of the Gods · 7</summary><h2>An offer to return to the Bloodsworn</h2><p>She promises Glornir an account of vengeance for his brother. As his company leaves, Edel and nine companions form her separate escort and Edel heads for the gates.</p></details><details><summary>The Hunger of the Gods · 10</summary><h2>The night-hag in the woodland camp</h2><p>She wakes to danger in the woodland camp, sharpens her senses through her wolf-blood and finds Lif missing. A night-hag grips her throat with its hair; her first axe stroke passes through it. Remembering Seiðr-words Uspa taught her, she speaks Skuggar skilja and disperses it, then repeats the attack to free the choking Lif.</p></details><details><summary>The Hunger of the Gods · 10</summary><h2>The night-hag in the woodland camp</h2><p>She later wakes from a vivid dream of a wolf or man calling her name. In it she resists through her oath and Thorkel’s and Breca’s names. The chapter does not establish an external caller or identify the dream figure.</p></details><details><summary>The Hunger of the Gods · 10</summary><h2>The night-hag in the woodland camp</h2><p>She has not told Lif the Bloodsworn’s collective secret, but she and Edel reason he may infer it. Orka says Lif knows Thorkel was Berserkir. When Edel suggests the hag might better have taken him, Orka declares her debt and protection and takes hold of her axe haft.</p></details><details><summary>The Hunger of the Gods · 10</summary><h2>The night-hag in the woodland camp</h2><p>Edel contrasts that loyalty with Orka’s abandoned oath. Orka privately recalls exhaustion with violence, pregnancy, her hopes for her child and lasting regret, but aloud merely acknowledges that she walked away. Spert’s request for food interrupts; she asks for porridge with a pointed joke.</p></details><details><summary>The Hunger of the Gods · 15</summary><h2>The search through Rotta&#x27;s chamber</h2><p>She reaches the excavation with Edel’s escort, recognises the old dragon-born’s corpse and exposes a winged dragon tattoo like Drekr’s and the oath-stone carving. She questions whether the design marks all dragon-born or some other connection, without settling it.</p></details><details><summary>The Hunger of the Gods · 15</summary><h2>The search through Rotta&#x27;s chamber</h2><p>Gunnar and Revna guide her through the chambers. She sees the broken restraints and scarred slab, then asks them to gather parchments identified as copies of Rotta’s Galdrabok fragments for Glornir and Vol.</p></details><details><summary>The Hunger of the Gods · 15</summary><h2>The search through Rotta&#x27;s chamber</h2><p>Spert and Vesli single out a child’s mattress; Spert says Breca was there. She kneels, remembers him and renews her resolve to find him. She refers camping decisions to Edel, recommends the woods because the chambers have one entrance, and stays to search further.</p></details><details><summary>The Hunger of the Gods · 18</summary><h2>Training and an encounter in the rain</h2><p>The morning after her search, she says she found no onward clue for Breca. Edel must leave to bring the Sea-Wolf to Darl, but offers warmer words about her return and hopes for her son and vengeance.</p></details><details><summary>The Hunger of the Gods · 18</summary><h2>Training and an encounter in the rain</h2><p>She trains Lif in immediate readiness, then shield use, using his new grey round shield. She demonstrates rim and boss strikes and a trip, before inviting Ingmar Ice to spar. Using the shield to conceal a right-hand punch, she knocks him down; he recalls her lesson that the unseen blow ends a fight.</p></details><details><summary>The Hunger of the Gods · 18</summary><h2>Training and an encounter in the rain</h2><p>Warned of riders by Vesli, she arms and hides at the treeline. An unnamed Raven-Feeder leader mourns at the dead. Ingmar catches Orka’s wrist, but releases her when she says she will ask where her son was taken. She steps alone into the glade; no answer or fight follows within this chapter.</p></details><details><summary>The Hunger of the Gods · 20</summary><h2>Myrk confronted in the glade</h2><p>At Rotta’s chamber she plans to kill all but one enemy, telling Lif to stay behind her. The leader is explicitly named Myrk Sharp-Claw. Orka denies killing her father, asks about Breca and reads Myrk’s response to Drekr’s name as familiarity; no onward location for Breca is supplied.</p></details><details><summary>The Hunger of the Gods · 20</summary><h2>Myrk confronted in the glade</h2><p>She delays releasing the wolf until Myrk orders their capture. Her senses sharpen and strength rises; her eyes turn amber and teeth lengthen. She kills three attackers, abandons her trapped long-axe, sends Vesli to help Lif and throws her hand-axe to protect Vesli. Revna and the Bloodsworn join the fight.</p></details><details><summary>The Hunger of the Gods · 20</summary><h2>Myrk confronted in the glade</h2><p>After exchanging blows with Myrk, she is pinned and throttled by a man she identifies as Berserkir. Her new-grown claws cannot loosen his grip. Spert’s intervention and a hound free her; she then wrenches Myrk’s arm until bone cracks, after suffering a bite through her mail.</p></details><details><summary>The Hunger of the Gods · 20</summary><h2>Myrk confronted in the glade</h2><p>Myrk’s rune-fire burns her cheek. She dives beneath it and elbows Myrk’s jaw; Myrk falls and the rune vanishes. Orka commands the wolf to calm, then staggers up with a forehead wound and a bleeding shoulder bite. Her thought that all enemies are dead is not independent confirmation of Myrk’s death.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>Wounds tended and seaxes compared</h2><p>Vesli washes and treats her forehead, removes broken mail rings from her shoulder wound and packs both injuries with regurgitated green material. The wounds become numb; by departure preparations their serious pain is absent, but stiffness and lesser bruises remain. She puts her mail back on and takes a dead Raven-Feeder’s sealskin cloak.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>Wounds tended and seaxes compared</h2><p>She compares Myrk’s smaller seax with the pair recovered from Thorkel, calling the latter Drekr’s and recognising shared workmanship. She takes Myrk’s coin and serpent-headed silver rings, washes her cheek and keeps the bloodied linen. Myrk is alive and bound; Orka questions her under threat of a seax.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>Wounds tended and seaxes compared</h2><p>Myrk’s invocation of Lik-Rifa makes her wonder about a connection with Thorkel and Breca, without establishing it. Myrk says Drekr told her about Orka’s attack at The Dead Drengr, but gives no destination for Breca. Despite judging pain ineffective, Orka repeatedly punches her until Edel, Halja and Revna restrain her. Myrk is still breathing; Orka later recognises her loss of control as a mistake.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>Wounds tended and seaxes compared</h2><p>Ingmar’s words about missing her and loving Thorkel as a friend leave her unable to answer. She gives Spert porridge with blood and spit, and plans to follow the riders’ tracks and question Myrk again. Edel points towards Horndal and Starl as a lead, not a confirmed origin.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>Wounds tended and seaxes compared</h2><p>Edel offers Halja, Gunnar and Revna as companions. Orka hesitates because she abandoned the Bloodsworn, then accepts them after warning of death on the road. This acceptance of help is not a newly sworn oath or formal return to chiefship. The group is preparing to leave, with Myrk tied over her horse.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>She follows Myrk’s earlier trail north-west through the Boneback foothills towards Lake Horndal, reading abandoned fires, flattened grass and dung after days of hard riding. She suspects the trail will lead to Drekr and her son. Revna and Gunnar keep calling her chief despite her repeated objections; no formal reinstatement is shown.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>At camp she ungags the bound Myrk while Spert and Vesli guard her. Halja proposes trading the killer’s name for the son’s location; Myrk’s red-eyed struggle is stopped by the seax and vaesen threats. Orka initially fears betraying a Bloodsworn, then accepts after Gunnar and Revna agree.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>She promises Myrk survival until finding her son, followed by release and holmganga, and seals it by cutting her palm and swearing on her son’s life. The bargain is conditional and accepted, not an immediate release or a tested magical bond.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>Myrk’s account of using Tainted blood makes her imagine Breca’s throat cut. That image is fear, not an actual death. She really destroys one of Myrk’s eyes with her seax hilt, then restrains the wolf and later uses slow breathing rather than inflicting the further violence she wants.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>She hears Myrk’s general claim that the Tainted children survived, qualified by not knowing whether one was hers. Myrk names Uspa as the bridge-opening captive witch; Orka recognises Vol’s sister and wonders whether Berak could be dead. That thought is inference, not a newly confirmed fate.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>Myrk gives past positions and an alleged rendezvous west to the coast off the Iskalt Islands. Orka feels relief at a search destination but doubts the account. Halja gives Varg’s name to Myrk, who threatens him. Orka has not reached the rendezvous, found Breca or fulfilled her promise to release Myrk.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>Orka&#x27;s search in Starl</h2><p>Emerging from a ravine on Trúr, she reaches sight of Starl and Lake Horndal. Myrk says the Raven-Feeders took a knarr across; Halja’s scouting finds tracks leading to town rather than the shore path. Orka worries a lie could lose the trail. She orders Spert and Vesli to stay outside, watch the water and expect her within a day, then enters Starl with her human companions and captive.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>Orka&#x27;s search in Starl</h2><p>She pays for an inn’s stables and meal with Myrk’s silver and has the captive tied to a post. She cuts linen from her under-tunic, nicks Myrk’s bay gelding and stores a folded strip of its blood. The sample’s purpose is not given. Leaving the others to watch Myrk, she takes Halja to restock and seek passage; she pays one trader to save time rather than shopping for lower prices.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>Orka&#x27;s search in Starl</h2><p>Halja reports northern winged-beast rumours. At the thrall market Orka admits she too dislikes the purchase but insists it must be done. She negotiates with Haga and whispers the precise requirement. She then leaves with a key in the pouch holding Breca’s pendant and the collared Sæunn following her. Neither the woman’s bloodline nor the intended task is disclosed.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>Orka&#x27;s search in Starl</h2><p>She passes a dragon-judgment preacher and her associates uneasily, then buys Sæunn a cloak, tunics, socks, shoes and leg-wraps. She explains the clothes are for wearing; Sæunn immediately undresses publicly and apologises when Halja clarifies the instruction. Orka tells her to finish dressing. Providing clothes does not free her from the collar.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>Orka&#x27;s search in Starl</h2><p>At the lake she feels a pulse and thinks of Snaka’s lingering power. A wolf-like howl follows and grows as an approaching drakkar lowers its sail and mast, then rows towards a pier. Halja identifies its black spear-and-axe shields on red as Battle-Grim. Orka has not recognised an individual passenger, named the vessel or met anyone aboard; neither Snaka nor a named wolf is confirmed as the source of her sensations.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The laden ship reaches Starl</h2><p>She approaches the newly moored Wave-Jarl with Halja and an unnamed collared woman. Elvar sees her as taller, broader and older than her companions, thick through shoulders and back, lean at the waist, with greying fair hair braided. She wears mail and carries a long-axe and a fine-looking seax. Her hard stare unsettles Elvar, without establishing a magical aura.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The laden ship reaches Starl</h2><p>She demands Uspa in a flat rasping growl and threatens the crew with the consequences of refusal. Uspa recognises and names her, shocked because she thought her dead. Orka says she is not dead yet and asks Uspa to come. Elvar refuses and frees her sword arm; Orka nods and raises her long-axe.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The laden ship reaches Starl</h2><p>Ulfrir calls a halt, approaches and looks at her, then breathes deeply, smiles and says she has come, calling her wolf-child. No blow, surrender of Uspa or resolution follows before the chapter ends. The greeting does not explicitly establish the source of her earlier dreams or the wolf-like calls at Starl.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>She recognises Ulfrir and the howl she has heard within her soul and blood. He claims her as his child and offers protection. His invitation draws her feet into motion, but she stops herself and objects to stepping aboard the ship of Uspa’s enslavers. Elvar grants a conditional truce after learning of the dragon-born prisoner; Orka boards with Halja and Sæunn.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>She and Uspa exchange news of their sons’ abduction, and she concludes Breca and Bjarn are together. Uspa refuses to abandon Elvar’s plan and the oath to recover Bjarn. Orka resists Ulfrir’s powerful pull towards pack and refuses to join him because she will not delay Breca’s recovery. Against his in-essence father claim, she says her human father beat her for pleasure and she killed him and left home at twelve.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>While the conversation continues she hears Ulfrir say Daughter in her head and feels his presence in her blood. She wonders whether Skuld is the guardian of the sagas. This is an experienced mental voice and recognition, not an explained communication system or immediate biological paternity.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>She explains Myrk’s capture and westward meeting lead to Elvar, who calls the prisoner a liar and reports eastward tracks, confirmed by Sighvat. Ulfrir predicts an eastern refuge at Nastrandir, but its survival and directions remain uncertain. Orka imagines killing Myrk, then restrains herself because she still needs the prisoner. She asks Elvar for help and agrees to return a favour, with the terms unstated.</p></details><details><summary>The Hunger of the Gods · 41</summary><h2>Sigrún&#x27;s reckoning with Guðvarr</h2><p>In Darl, Guðvarr apologises to Sigrún for failing to bring back Orka’s head and describes her Tainted nature and vaesen help. Sigrún says the pursuit was chiefly about the appearance of weakness Orka caused, rather than personal revenge, and now advocates guile. These are her stated motives in Orka’s absence.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>At night in Starl’s stable she sharpens her long-axe and remembers the loss and restlessness she felt leaving Ulfrir, choosing her search for Breca over his offered fatherhood. Breca’s black hair, pale face and grey-green eyes are her memory, not a current sighting. She ignores Myrk’s cold and taunts until eye-fire and Eldur sparks appear, then cuts a neck line and threatens her into calming. She wipes the fresh blood on her tunic hem and gags her.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>Lif’s mournful song lets her relax into sleep. Awakened by an apparent horse raid, she fights a huge hooded attacker, wrestling over the axe and headbutting him. Myrk rides out, and Orka calls a halt: the attacker is Sighvat, with Orv, Elvar and Grend among the raiders. The fight was staged to give Myrk an escape. Real blows leave Sighvat bleeding; the blade Orka left by the hay is now gone.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>She whistles Sæunn forward and supplies horse blood and fresh Myrk neck blood, calling her Hundur-blooded and asking her to track both horse and rider. Sæunn sniffs and agrees. Orka corrects mistress to her name, without removing the collar, then delays pursuit because she wants to follow rather than recapture Myrk. She calls the previous trail a lie and expects the escapee to lead them to Breca; this remains a strategy, not a completed rescue.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>She thanks Elvar and promises the reciprocal service: sending Glornir an offer to hire the Bloodsworn for double their price, with a silver bear-head ring as regard and Snakavik as rendezvous. The offer, gift and meeting have not been delivered or accepted, and Gunnar can only guess where the company is.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>In her absence, Røkia recounts finding Svik a ten-year-old runaway and taking him into the Bloodsworn while she was chief. Røkia says Orka trained him and restored his dignity, and describes his attachment as mother-like. No biological or adoptive motherhood is established.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>Røkia supplies the company’s perspective on the old disappearance: after a three-longship attack on the Sea-Wolf, they searched beaches and seabed for Orka and Thorkel and presumed them lost. She guesses that Svik’s encounter with the living Orka reopened grief and the hurt of her abandoning the oath. This testimony sits beside Orka’s earlier account of a deliberate departure, without changing her current whereabouts or proving a new death.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>After Refna names Drekr as the chief of her captors, Varg identifies him as Orka’s target and Røkia predicts their paths will cross again. No reunion or new message to Orka occurs.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>At first light, after a night of quiet conversation, she mounts while Elvar relays Ulfrir’s good-hunting message and promise of seeing her again. Her grey-green eyes look hard and emotionless to Elvar, and she grunts; Elvar later reports no answer to the message.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>She calls Sæunn to lead. After sniffing two bloodstained rags, Sæunn starts at a loping run and Orka’s riders follow, shields on their backs and each leading a laden packhorse. Orka reassures Elvar that the Bloodsworn will hear her offer, while reserving acceptance to the recipients. This is the beginning of pursuit, not a rescue or completed delivery.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>From the Wave-Jarl Elvar and Ulfrir identify her party on the track between Horndal and the wooded Boneback slopes. The riders stop; Elvar only feels that they look back. Grend calls Orka dangerous, Skuld says she liked her and Ulfrir predicts another meeting. These perspectives add no new attack, alliance or confirmed exchange across the water.</p></details><details><summary>The Hunger of the Gods · 50</summary><h2>The wolf&#x27;s call across the lake</h2><p>At the lakeshore on Trúr she lets a flicker of her wolf sharpen sight and smell, spotting Ulfrir with Skuld and Uspa at the Wave-Jarl’s prow. His voice enters her head, declaring a wolf and sword age of bloodshed and promising another meeting. His departure leaves a moment of despair and fear. She tells him to stay out of her way and head, but explicitly does not know whether he hears. This reveals her side of the pause without changing Elvar’s preceding limited viewpoint.</p></details><details><summary>The Hunger of the Gods · 50</summary><h2>The wolf&#x27;s call across the lake</h2><p>She tethers the wolf within her as a companion asks why they stopped and Sæunn returns from ahead. A whistle brings Spert from the lake and Vesli from the trees. The pair had expected a boat departure; she announces a change of plan and Lif explains the tracking ruse, crediting her.</p></details><details><summary>The Hunger of the Gods · 50</summary><h2>The wolf&#x27;s call across the lake</h2><p>Pressed about their manner, the pair report Lik-Rifa’s night summons and voices in their heads. Orka compares it to Ulfrir’s calls and questions their trustworthiness. Spert says his pact keeps him with her and rejects her earlier release; Vesli says gratitude and their oath to find Breca helped her refuse. Orka recognises the likeness to her own resistance through the promise to find Breca and avenge Thorkel. These experiences do not establish a general oath-based immunity.</p></details><details><summary>The Hunger of the Gods · 50</summary><h2>The wolf&#x27;s call across the lake</h2><p>She nods acceptance of the pair’s staying. When Revna extends the concern to all vaesen and asks the summons’ purpose, Orka concludes war. Revna’s scope and her answer are interpretations, not a complete muster or new battle.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>Two days of Sæunn’s tracking take her north beside Horndal and east along the northern Bonebacks, reinforcing Elvar’s account against Myrk’s western guidance. She restrains her angry wolf. She selects Vesli for a proposed Glornir message and ring delivery, but postpones the message after seeing the weight burden and hearing that Vesli’s range is unknown, taking the ring back.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>She follows the vaesen traces across meadow and pinewood, using wolf-sharpened senses without detecting the frost-spiders. Halja’s eagle sight finds loose webs and assesses the spiders as gone. Orka orders vigilance while Sæunn continues ahead.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>She tells Lif that Mord’s defence of his poisoned brother was courage despite fear. Thorkel’s advice returns in memory, while she privately fears failing Breca and leaving her husband unavenged. She explains the raven rescue through Breca’s earlier moth rescue. Discussing loneliness, she names Drekr’s death as comfort and advises Lif that shared grief may connect him with Halja, without claiming Halja’s feelings.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>After dung on the path, horns, smoke and screams reveal a distant stockaded farm. She agrees with Halja to investigate, partly fearing danger behind the party after nightfall. No arrival, attacker identification or rescue is shown.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>At the smoking farm she finds skraeling butchering bodies and attacking the longhouse. Her own home’s destruction returns in memory, yet she initially rejects Lif’s appeal, warning that intervention may destroy their vengeance and rescue hopes. She grabs him when he invokes Breca and Thorkel, then releases him at Halja’s touch. Denying she is their chief, she lets the companions choose; after hearing their motives she agrees to attack.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>She divides the party between stream entrance and gate, leaves Sæunn guarding the horses and lets Spert and Vesli volunteer. In her cap, nasal helm and mail curtain she warns Lif to use skill against skraeling strength and secretly asks the vaesen to keep him alive. Wolf-sharpened senses precede her charge. A lodged long-axe forces her to hand-axe, seax and teeth, and Gunnar intervenes beside her.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>She coordinates door, flank and roof attacks against the longhouse assault. Lif spears an enemy dragging her helm. Pursuing fugitives, she tumbles out of the doorway and is threatened on the ground until two giant ravens strike. Afterwards she washes, recovers weapons, sees Lif being treated and the bodies collected, and recognises the timber mound as a nest.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>Gudleif Arnesson thanks her; she credits Lif. He describes food and shelter traded to the ravens for news and protection. The birds name themselves Kló and Grok, identify Grok as the saved frost-web captive and claim service as Snaka’s messengers and spies. Grok calls their intervention repayment. She says she needs a favour, without specifying it before the ending.</p></details><details><summary>The Hunger of the Gods · 64</summary><h2>The hidden doors into Nastrandir</h2><p>She follows Sæunn to Nastrandir, cuts a path-blocking web and rushes into the hall after Spert opens the doors. It is abandoned. She had already sent Vesli with Kló and Grok towards Darl to find Glornir and keep her bargain with Elvar; no delivery is shown. Sæunn finds Myrk&#x27;s onward trail.</p></details><details><summary>The Hunger of the Gods · 72</summary><h2>The army gathers below Svelgarth</h2><p>At Svelgarth she sees the approaching mixed army and children by its wagons. She believes Breca and Drekr are there but does not identify them individually. After giving her companions a free choice, she plans a focused extraction, limiting killing to those who obstruct her.</p></details><details><summary>The Hunger of the Gods · 72</summary><h2>The army gathers below Svelgarth</h2><p>Her prepared weapons include long-axe, hand-axe, an arm-hidden small seax from Starl, Myrk&#x27;s sword and Thorkel&#x27;s dragon-hilted seaxes.</p></details><details><summary>The Hunger of the Gods · 74</summary><h2>The gate falls and the children flee</h2><p>She removes Sæunn&#x27;s collar and explicitly frees her, then offers a voluntary horse-and-supplies choice. With a lake rendezvous agreed and Halja&#x27;s distraction drawing guards, she reaches the children and reunites with Breca. Bjarn joins them, but Harek refuses and raises an alarm before the camp escape is complete.</p></details><details><summary>The Hunger of the Gods · 75</summary><h2>The rescuers pursued</h2><p>She warns Revna of Ilmur, then intercepts Biórr and fights Fain and Storolf. She gravely wounds Fain and is tackled by Storolf. Rotta approaches as Gunnar is captured; the children&#x27;s escape and her own next condition remain unshown.</p></details><details><summary>The Hunger of the Gods · 76</summary><h2>Captives before Rotta</h2><p>Rotta captures her by threatening Breca and demands Ulfrir&#x27;s location. She is web-bound under the threat of Storolf&#x27;s axe. Spert&#x27;s sting and black-cloud attack and an unidentified spear strike disrupt the captors; Lif cuts her free while Halja guards. She reunites with Breca and runs with the group, Gunnar carrying dead Revna.</p></details><details><summary>The Hunger of the Gods · 78</summary><h2>Escape through the river valley</h2><p>She escapes south with Breca, splitting from the others to rendezvous at the lake. Breca identifies bear as well as wolf in his blood, which she recognises as their parents&#x27; shared inheritance. She promises Gunnar help with revenge.</p></details><details><summary>The Hunger of the Gods · 78</summary><h2>Escape through the river valley</h2><p>A frost-spider bites her neck while she protects Breca. Blue-tinged icy venom suppresses her wolf strength, turns her lips blue and numbs her legs. Breca tries to carry her. Unable to flee the surrounding spiders, she throws him into the river and sees him resurface before the current takes him out of sight.</p></details><details><summary>The Hunger of the Gods · 78</summary><h2>Escape through the river valley</h2><p>Mail protects her chest from one spider; she kills it with a seax and another by tearing out its fangs. More spiders bite her legs and a night-hag settles on her chest as her heartbeat slows. Darkness takes her with Breca in her thoughts; her death is not explicitly confirmed at this cutoff.</p></details><details><summary>The Fury of the Gods · 4</summary><h2>She is alive after the river separation but captive outside burning Svelgarth</h2><p>She is alive after the river separation but captive outside burning Svelgarth. Rotta assaults her for Ulfrir&#x27;s whereabouts and prevents Myrk from killing her. Venom recedes enough for feeling and wolf strength to return, but frost-web still binds her wrists.</p></details><details><summary>The Fury of the Gods · 4</summary><h2>She is alive after the river separation but captive outside burning Svelgarth</h2><p>She believes Breca has reached the lake and escaped with the others, reasoning from the absence of a returned captive; this remains unconfirmed. Myrk takes her weapons belt and the two seaxes, taunting her about Thorkel. Rotta threatens to recapture Breca to make her talk. An unnamed man then appears with bound children; none is identified before the ending.</p></details><details><summary>The Fury of the Gods · 7</summary><h2>The chained march and its victims</h2><p>Marching in wrist chains among Svelgarth&#x27;s prisoners, she regains wolf senses and argues with Biórr about the supposed liberation campaign. She rejects his reassurance that Breca was unharmed and points to their own captives as evidence against his promises. At dusk she tests her chains with wolf strength but cannot break them.</p></details><details><summary>The Fury of the Gods · 7</summary><h2>The chained march and its victims</h2><p>She recognises Bjarn in a captive wagon, establishing that his escape failed. When Myrk sends stragglers to attacking vaesen, she challenges Biórr with his fair-world promise; he looks away. Brák later returns with two dead adults. She infers Spert&#x27;s involvement from black-veined injuries, but does not see the ambush or know whether Breca is with her allies.</p></details><details><summary>The Fury of the Gods · 11</summary><h2>An unseen enemy follows the host</h2><p>Her mail has been taken and she refuses an offered cloak, marching in wool tunic and under-tunic while still chained. Rotta offers release and weapons, alliance or peaceful departure with Breca, if she gives Ulfrir&#x27;s location. She looks towards the trees and Fain&#x27;s axe, then says No; the glance does not establish a specific escape plan. No freedom is granted.</p></details><details><summary>The Fury of the Gods · 11</summary><h2>An unseen enemy follows the host</h2><p>Brák returns with a reduced wounded crew and a writhing sack, whose contents remain unseen. Rotta smiles at her, but the source does not identify Breca or any other person within it.</p></details><details><summary>The Fury of the Gods · 13</summary><h2>The price of Spert’s loyalty</h2><p>She recognises the wounded Spert as family and gives Rotta Ulfrir’s destination and travelling companions to save him. Rotta kills him despite her compliance. She attacks with claws, teeth and wrist chain, injuring him before guards restrain her.</p></details><details><summary>The Fury of the Gods · 13</summary><h2>The price of Spert’s loyalty</h2><p>Myrk gains permission to kill her with the seaxes that killed Thorkel. Orka uses her chain to wrench away one blade and catches it, but suffers a cut across her ribs from the other. Rotta stops the duel when armed, iron-collared strangers emerge from the valley woods. Their appearance does not yet establish a rescue or a victor.</p></details><details><summary>The Fury of the Gods · 15</summary><h2>During the attack she sees Breca alive, beckoning from beyond a gap in the fighting</h2><p>During the attack she sees Breca alive, beckoning from beyond a gap in the fighting. Myrk knocks her down before she can reach him. Still wrist-chained and holding the recovered seax, Orka wounds Myrk’s thigh, tackles her as red runes kindle, then uses the chain and wolf-jaws to kill her. The battle’s wider outcome and any additional wound from Myrk’s final stabbing are not established.</p></details><details><summary>The Fury of the Gods · 15</summary><h2>During the attack she sees Breca alive, beckoning from beyond a gap in the fighting</h2><p>Breca reaches her, touches her and calls Mama. Lif, Halja, Gunnar and the uncollared Sæunn are behind him. He takes her hand and urges her to come with them. Their reunion is direct, but departure to safety remains unshown.</p></details><details><summary>The Fury of the Gods · 16</summary><h2>She rises with Breca’s help, takes Myrk’s belt and retrieves both seaxes</h2><p>She rises with Breca’s help, takes Myrk’s belt and retrieves both seaxes. She fights the attackers pursuing her; when a skraeling clings to her throat, Breca kills it and continues striking. She pulls him off by his cloak and holds him until he calms, his eyes amber and green. No escape from the valley is shown.</p></details><details><summary>The Fury of the Gods · 17</summary><h2>She calms Breca, gathers her companions and sees Orlyg directly leading the river warriors</h2><p>She calms Breca, gathers her companions and sees Orlyg directly leading the river warriors. She retrieves Gunnar after a falling troll interrupts his confrontation with Biórr. Gunnar damages her wrist chain with three axe strikes and she snaps it with wolf-strength. She sheathes the seaxes and picks up Fain’s long-axe, then helps save Dagrun and retrieves Spert’s body.</p></details><details><summary>The Fury of the Gods · 17</summary><h2>She calms Breca, gathers her companions and sees Orlyg directly leading the river warriors</h2><p>With Rotta’s rune-casters and vaesen blocking the woods, she follows Dagrun towards the river. One ship burns, but the group boards the second. She helps stragglers aboard; Harek tackles Bjarn into the reeds and she restrains Breca from going after them. She intercepts Rotta’s ice-rune with a shield and throws it overboard as it freezes; her hand remains numb. The ship escapes the bank with her named companions and Spert’s body.</p></details><details><summary>The Fury of the Gods · 17</summary><h2>She calms Breca, gathers her companions and sees Orlyg directly leading the river warriors</h2><p>Aboard, she reproaches the decision to return rather than taking Breca to Glornir. Sæunn says everyone chose to stay and Spert first refused to abandon her. Orka mourns him, vows revenge internally and embraces her trembling son.</p></details><details><summary>The Fury of the Gods · 22</summary><h2>Breca’s training and Orlyg’s passengers</h2><p>She trains Breca with Lif’s borrowed spear against Gunnar’s oversized shield, then warns him to master and hide his beast lest Orlyg discover their Tainted blood. She predicts the Bloodsworn will accept Elvar’s hire and be at Snakavik, while her companions lack news of Vol or the company. She returns Breca’s pendant and comforts him. Her current remembered home-recovery location differs from the earlier directly recorded tavern loft; that discrepancy remains unresolved.</p></details><details><summary>The Fury of the Gods · 22</summary><h2>Breca’s training and Orlyg’s passengers</h2><p>She recognises Lif’s battlefield growth and leaves him teaching Breca. At the stern she admits former Bloodsworn service and recounts her family’s loss and search, winning Orlyg’s welcome and a promised blood-price rather than an observed payment. She reveals Ulfrir’s service to Elvar and proposed dragon-killing use. Orlyg orders Snakavik as their destination; her own blood remains concealed in this conversation.</p></details><details><summary>The Fury of the Gods · 26</summary><h2>She coaches Breca after Lif’s win and hears Biórr taught him tafl strategy</h2><p>She coaches Breca after Lif’s win and hears Biórr taught him tafl strategy. Their shared grief for Thorkel draws another promise that no one will take him. She has accepted preserving Spert for a hoped-for Fellur burial, obtaining barrel and salt on debt from Orlyg, though they passed the home fjord a day earlier and she doubts returning. She links return to Drekr’s death without claiming vengeance complete.</p></details><details><summary>The Fury of the Gods · 26</summary><h2>She coaches Breca after Lif’s win and hears Biórr taught him tafl strategy</h2><p>Dagrun gives her Brynjolf’s former mail and helm as his own repayment. She resists debt, then dons the brass-edged half-sleeved coat, fitting above her knees, and the slightly loose nasal helm with brass-edged mail curtain. She repositions the seaxes front and back; a spare wool cap is offered but not shown donned. His whispered claim to know what she is alarms her, though he promises discretion without naming the secret.</p></details><details><summary>The Fury of the Gods · 26</summary><h2>She coaches Breca after Lif’s win and hears Biórr taught him tafl strategy</h2><p>She startles at Gunnar’s touch after the rowing change, then shares ale and watches Breca improve. Halja reports enormous black birds and a possible Sea-Wolf sail to the south. Orka sees only gulls/clouds and the horizon at first; no confirmed contact or reunion is established.</p></details><details><summary>The Fury of the Gods · 28</summary><h2>Orlyg joins the sea battle</h2><p>She equips Breca with oversized shield and padded nasal helm at further debt to Orlyg; no mail fits him. She assigns Lif and Sæunn to keep him safe. Having identified Sea-Wolf and convinced Orlyg to help, she tells Breca that she and Thorkel broke their Bloodsworn oaths to raise him peacefully but still see the company as family. She now dons a grey nålbinding cap under her helm, tests the fit and takes her captured long-axe.</p></details><details><summary>The Fury of the Gods · 28</summary><h2>Orlyg joins the sea battle</h2><p>She brings Breca aboard the stern attacker, then crosses onto the knarr with her group. She chooses Sulich’s rescue first, attacking rear archers while the others protect Breca and her. Orlyg’s reinforcements break one boarding crew. Sulich initially mistakes her for an enemy; Gunnar stops him, and she introduces him to Orlyg. Another crew remains in battle.</p></details><details><summary>The Fury of the Gods · 29</summary><h2>The fight aboard the stern drakkar</h2><p>She saves Svik from a sabre after he is wounded at the hip, fighting with long-axe, mail and helm; her grey-laced blonde braids, sharp teeth and amber eyes are visible. Varg recognises her from Grimholt as Orka Skullsplitter. Her companions cut through the guards, and Glornir embraces her. Einar pushes them away from an advancing caster; she catches Breca’s tunic and pulls him out of its path. Two casters then strike Vol’s protection with white-hot spells, scattering the company in heat and steam.</p></details><details><summary>The Fury of the Gods · 30</summary><h2>She finds Breca alive and sees Vol survived behind a damaged shield</h2><p>She finds Breca alive and sees Vol survived behind a damaged shield. She throws a spear through a rune-shield gap, wounding the caster whom Grok and Kló then kill. She initially raises her axe against a boarding sea serpent and moves Breca back, but obeys Vol’s order to leave it. She recognises mother and young and explains the ensuing demonstration to Breca as hunting instruction. After the battle, Vesli’s question about Spert brings Breca and the tennúr to tears.</p></details><details><summary>The Fury of the Gods · 32</summary><h2>Debts, kinship and the voyage onward</h2><p>She introduces Orlyg and Glornir, whose debt promise secures future help without a sale of Vol or Iva. Alone with the old friends, she feels exhausted and aching, sees Vol’s mouth wounds now as white pinprick scars, and shares their embrace. She introduces Breca to his paternal uncle, explicitly naming Glornir as Thorkel’s brother. Her recovery oath is only partly fulfilled because Drekr remains alive; Glornir promises they will find him together.</p></details><details><summary>The Fury of the Gods · 32</summary><h2>Debts, kinship and the voyage onward</h2><p>She helps clear the deck and introduces Sæunn to Edel as a friend. Revna’s reported death and burial bring discussion of the escort’s chosen risks; she tells Gunnar the killer he seeks is Biórr. She sees Lif’s fresh cheek-to-jaw cut, watches the eighteen sea burials, and joins the gathering where Glornir states the newcomers’ secrecy choices before sailing.</p></details><details><summary>The Fury of the Gods · 37</summary><h2>She permits Breca’s sparring with Einar, then seizes him by his neck fur when the children clash</h2><p>She permits Breca’s sparring with Einar, then seizes him by his neck fur when the children clash. Her command stops his flickering eye change and he slumps, complaining Refna attacked first. No new injury or permanent transformation is reported for either child.</p></details><details><summary>The Fury of the Gods · 39</summary><h2>Old oaths and news of the dragon</h2><p>She rows after Varg’s oath and remembers her own vow under Boðvar-Claw, judging herself an oath-breaker. Thorkel’s voice is a memory in her thought-cage, not a demonstrated spirit visit. Breca imitates rowing with Vesli, but she refuses his demand for a full shift despite Refna rowing, warning of accidents without practice. Grok’s westward-army report feeds her thoughts of Drekr vengeance.</p></details><details><summary>The Fury of the Gods · 39</summary><h2>Old oaths and news of the dragon</h2><p>Svik confronts her about his grief and her departure without word. She recalls a frightened whipped boy, not explicitly named in the memory, and explains she left for Breca’s safety and peace. Those hopes failed, but her oath remains carved on her soul. She offers to be Bloodsworn again if Glornir forgives her; he answers that in his heart she never left. This is reacceptance, without a newly performed oath rite.</p></details><details><summary>The Fury of the Gods · 41</summary><h2>Ilska asks about Orka</h2><p>Biórr profiles her for Ilska as Úlfhéðnar, skilled and stubborn, maternally driven and unafraid of overwhelming odds. He says she revealed Ulfrir only under threat to Spert and attacked Rotta after Spert died. Ilska intends a meeting and learns her Bloodsworn ties; no warning to Orka or new confrontation is shown.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>Elvar asks Glornir whether she is with the arriving Bloodsworn</h2><p>Elvar asks Glornir whether she is with the arriving Bloodsworn. The chapter ends before his answer or a new direct exchange with Orka; it does not establish she is absent.</p></details><details><summary>The Fury of the Gods · 43</summary><h2>Allies meet and old loyalties surface</h2><p>She steps forward to confirm her presence and Breca’s rescue, reports Myrk dead and Drekr still alive, and declares herself with the Bloodsworn. Ulfrir privately says she should be with him; she tells him out of her thought-cage. She later confirms Rotta alive to the doubtful god, explaining his scent detection, and hears Ulfrir vow his death. No new oath to the wolf or completed vengeance follows.</p></details><details><summary>The Fury of the Gods · 43</summary><h2>Allies meet and old loyalties surface</h2><p>Seeing Hrung speak reveals that the apparent bust is alive and matches the counsellor tales she knew. She vouches for the ravens’ two rescues and message service, rejecting Ulfrir’s private warning and choosing her own trust. Elvar accepts their friendship and welcomes the arrivals; the broad credit to the birds does not replace Vesli’s actual earlier spoken delivery.</p></details><details><summary>The Fury of the Gods · 46</summary><h2>The hidden tunnel raid</h2><p>She waits after a forced tunnel march with the Bloodsworn and Sulich’s archers, receiving Ulfrir’s timing signal. Lif and Sæunn insist on accompanying her; Breca is at Wolfdales. With long-axe, short-axe and both seaxes but no shield, she follows through the rune-revealed hatch. Lif destroys a hag attacking Sæunn, and both companions protect and fight beside her as the camp burns. Following rune magic she faces Drekr; the chapter ends as he charges, without an outcome.</p></details><details><summary>The Fury of the Gods · 47</summary><h2>Drekr, Lif and the dragon’s counterattack</h2><p>Guðvarr sees her duelling Drekr with long-axes, amber-eyed and blood-spattered, and considers a distracted attack before Lif intercepts him. After Lik-Rifa lands and the withdrawal horn sounds, two unnamed warriors drag her from the road as she rages. Both she and Drekr remain alive at this cutoff; their duel’s exact ending and his new cheek wound’s cause are not witnessed.</p></details><details><summary>The Fury of the Gods · 48</summary><h2>Return from the sortie</h2><p>After the sortie she is back in Wolfdales with Breca, both carrying food and cups towards the Bloodsworn’s sleeping chambers. This confirms their presence together after the raid, without a further duel, injury report or separation.</p></details><details><summary>The Fury of the Gods · 52</summary><h2>The choice to hide the beast</h2><p>Dagrun confirms he saw her beast and offers reciprocal friendship rather than new payment; she explicitly acknowledges being Tainted and warns against enslavement. Hiding from Skalk, she hears Breca propose collar cover but takes no collar. Glornir reaffirms oath-sisterhood as they grieve Thorkel, and she gives Breca her cynical view of freedom rhetoric.</p></details><details><summary>The Fury of the Gods · 52</summary><h2>The choice to hide the beast</h2><p>At dawn she keeps Breca close and follows the company outside. Gate and towers still stand with blue ripples, but the fleet has become drifting wreckage. The dragon is seen retreating; her exact attacks and motives are not directly witnessed by Orka inside the hall.</p></details><details><summary>The Fury of the Gods · 52</summary><h2>The choice to hide the beast</h2><p>Breca’s warning lets her see Broðir’s attack on Elvar. She throws her hand-axe into his back/shoulder, helping Elvar survive, while Vol disrupts Silrið and Gytha captures Runa alive. Broðir and Silrið disappear into the river with the axe; their fates and the weapon’s recovery remain unknown.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>Elvar sees her and Breca search the wreckage for hours before she carries away a barrel</h2><p>Elvar sees her and Breca search the wreckage for hours before she carries away a barrel. The contents are not shown, so this alone does not prove Spert’s remains recovered. She is part of the current Bloodsworn’s public Tainted revelation and collective loyalty pledge, not a newly imposed collar cover.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>She stands with Breca and the reunited companions, growling at Drekr’s approach</h2><p>She stands with Breca and the reunited companions, growling at Drekr’s approach. Rotta threatens to hunt her and Drekr to kill her/son; she promises to meet Drekr again. Ilska separately threatens revenge for Myrk. None of those threatened outcomes is completed during the parley.</p></details><details><summary>The Fury of the Gods · 58</summary><h2>She fights with both seaxes as Halja and Vesli help protect the walkway and Breca</h2><p>She fights with both seaxes as Halja and Vesli help protect the walkway and Breca. When she and Breca cannot push a ladder away with her long-axe, Einar adds his strength and they topple it together. Elvar/Grend hold nearby while new enemy waves gather.</p></details><details><summary>The Fury of the Gods · 58</summary><h2>She fights with both seaxes as Halja and Vesli help protect the walkway and Breca</h2><p>She warns of spertus emerging from the river, then sees their winged assault and poison fray the embankment defence. Trolls climb their thrown weapons and tennúr swarm the gate; she cuts one down and stabs a troll. With enemies overrunning the walkway she announces the wall breached, cleans/sheathes the seaxes and takes her long-axe as Elvar orders retreat.</p></details><details><summary>The Fury of the Gods · 61</summary><h2>Shieldless behind Varg, she fights with her long-axe</h2><p>Shieldless behind Varg, she fights with her long-axe. Breca’s shield covers her left, with Lif alongside him, and Sæunn stands right. She helps Varg against a dark-haired opponent and later an attacker whose helm buckle he cuts. No new personal wound or definite next outcome is given.</p></details><details><summary>The Fury of the Gods · 62</summary><h2>She warns Breca about spider bites and tells him to stay with her during the ordered retreat</h2><p>She warns Breca about spider bites and tells him to stay with her during the ordered retreat. Her axe and Røkia’s sword together free Varg from an entangling spider; Lif/Sæunn protect Breca. After the Tainted countercharge she sends her son running and turns Varg from his revenge fixation, explicitly naming Brák and Drekr and arguing that a hopeless attack now would achieve nothing.</p></details><details><summary>The Fury of the Gods · 62</summary><h2>She warns Breca about spider bites and tells him to stay with her during the ordered retreat</h2><p>She warns of hyrndur and runs, seeing a fiery net briefly protect the retreat before a troll tears it down. Breca goes ahead with Lif/Sæunn and Vesli. When Svik trips under another troll she turns back with her long-axe; Varg and Røkia also strike it until it falls. Svik rises and the four run toward the gates, without safe entry or the full battle outcome yet shown.</p></details><details><summary>The Fury of the Gods · 65</summary><h2>She talks with Glornir and Vol in the hall after the battle while Breca sits on Glornir’s lap</h2><p>She talks with Glornir and Vol in the hall after the battle while Breca sits on Glornir’s lap. This establishes their immediate gathering inside, not the siege’s end.</p></details><details><summary>The Fury of the Gods · 70</summary><h2>With Breca/Lif/Sæunn near, she watches the god clash and Gelta’s root binding</h2><p>With Breca/Lif/Sæunn near, she watches the god clash and Gelta’s root binding. When Ilska/Drekr’s Raven-Feeders cut roots she charges through their unformed shields, opening a gap for the Bloodsworn and driving the cutters toward the trunk. This is a local advance while the dragon still resists, not a concluded victory.</p></details><details><summary>The Fury of the Gods · 70</summary><h2>With Breca/Lif/Sæunn near, she watches the god clash and Gelta’s root binding</h2><p>Rotta’s fire spreads over the tree and Vol’s frost fails at contact. Orka sees Glornir head toward Skalk, then kills a separate unnamed attacker and charges Drekr through the flames. Her collision sends him up the stair after he dodges her axe; Ilska’s sword misses her head and its shield strike hits her face. Ilska follows upward, the renewed fight and injury severity unshown.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>The roof ward opens</h2><p>She is kept from Drekr by Ilska as the fight climbs the wide tree stair, with Breca guarded behind and Thorguna now aided. At the roof, retreaters and dragon hit a blue ward; Rotta’s words remove it and the dragon escapes outside. Halja reports Gelta dead and the hall burning, while Glornir insists on pursuing vengeance before finding another way back.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>The roof ward opens</h2><p>Outside at dawn she sees the dragon heading north-west and fleets vastly greater than Elvar’s drakkar group, with courses toward the ports/Falinn. Glornir identifies Rurik’s planned invasion; no named commander is directly seen aboard and the source’s Iskidan coastline wording remains unresolved. She follows Glornir/Thorguna’s charge after Halja clears a spear-bearing skraeling, the Raven-Feeder fight still open.</p></details><details><summary>The Fury of the Gods · 74</summary><h2>Breaking through the line, she sees Thorguna impaled and helps Glornir against Drekr</h2><p>Breaking through the line, she sees Thorguna impaled and helps Glornir against Drekr. She bites Drekr’s throat but is scalded by his spell, then retrieves her axe and fights back-to-back with Glornir. After Ilska is cut down Drekr tackles her and she loses the axe again. Tremors interrupt the duel.</p></details><details><summary>The Fury of the Gods · 74</summary><h2>Breaking through the line, she sees Thorguna impaled and helps Glornir against Drekr</h2><p>She witnesses Snaka’s return, two fleet destructions and the immense upheaval, struggling under his wordless mental presence. Lik-Rifa leads him toward Wolfdales. Vesli intercepts Drekr; Orka gathers Breca and follows Glornir to the cliff over Falinn, declares her love and leaps holding her son. Their landing and survival are not yet shown.</p></details><details><summary>The Fury of the Gods · 76</summary><h2>Surviving the plunge into the Falinn</h2><p>She keeps herself and Breca from sinking under her wet mail after the Falinn jump, then reaches a downriver bend and leads him into the treeline with the surviving companions. Both seaxes remain at her belt; her lost long-axe is not recovered. She believes Ilska dead, while Breca’s suggestion that Drekr may be dead remains uncertain at first.</p></details><details><summary>The Fury of the Gods · 76</summary><h2>Surviving the plunge into the Falinn</h2><p>She watches Snaka batter the broken hill and still feels his mental/bodily pressure. Vesli returns alive and reports Drekr escaped, bringing a tooth she claims as part of him; Orka thanks her. Glornir prioritises warmth then regrouping and asks Vesli to scout. A first snowflake lands on Orka as the sun sinks, with no scout result yet.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>The survivors’ camp and reunion</h2><p>Vesli brings Glornir’s party to the woodland camp, escorted by Ulfrir’s guards: Glornir leads with Vol and Orka at his shoulders and a score-or-so Bloodsworn behind. The split company actually reunites and Svik/Orlyg welcome them. No new battle or all-missing-allies tally is given.</p></details><details><summary>The Fury of the Gods · 79</summary><h2>She hones her two seaxes as the camp tends kit; Sæunn credits her with freedom</h2><p>She hones her two seaxes as the camp tends kit; Sæunn credits her with freedom. No recovery of the long-axe or new public oath follows the conversation.</p></details><details><summary>The Fury of the Gods · 81</summary><h2>Glornir and Orka lead the Bloodsworn in the loose assault after Snaka’s murder</h2><p>Glornir and Orka lead the Bloodsworn in the loose assault after Snaka’s murder. About half the company lacks shields; no organised shield-wall approach or new weapon recovery is established.</p></details><details><summary>The Fury of the Gods · 83</summary><h2>With two seaxes she advances, Breca/Sæunn at her right and Gunnar/Halja left</h2><p>With two seaxes she advances, Breca/Sæunn at her right and Gunnar/Halja left. Breca kills a spider pinning her arms; freed, she wipes both seaxes over its venom-wet fangs, sheathes one and picks up a hand-axe of unknown ownership. This is preparation, without a demonstrated venom effect or recovery of either lost axe.</p></details><details><summary>The Fury of the Gods · 83</summary><h2>With two seaxes she advances, Breca/Sæunn at her right and Gunnar/Halja left</h2><p>She turns toward Orlyg’s pressed line and runs as Drekr hits its rear. She sees Dagrun struck down by the haft and Orlyg pinned beneath his broken shield, then Drekr’s axe entering his head. She has not reached a completed rescue or duel at the cutoff.</p></details><details><summary>The Fury of the Gods · 85</summary><h2>Lif’s reckoning with Guðvarr</h2><p>Lif explicitly cites his training with Orka Skullsplitter and fighting with Bloodsworn when rebutting Guðvarr’s boast. His success is shown through the duel, without a new teaching scene or oath.</p></details><details><summary>The Fury of the Gods · 86</summary><h2>Orka and Breca confront Drekr</h2><p>She finds Orlyg’s corpse and Dagrun alive, passes the son to intercept Drekr and fights with hand-axe/seax while Gunnar/Halja/Sæunn engage the other Raven-Feeders. Her axe wounds his shoulder but a seax first meets mail; she headbutts with her nasal helm before he disarms the axe. She draws both seaxes, accuses him about Thorkel and cuts beneath an eye.</p></details><details><summary>The Fury of the Gods · 86</summary><h2>Orka and Breca confront Drekr</h2><p>The spider venom slows Drekr until he drops his axe. She gives Breca one blade and deliberately teaches him in the reprisal, invoking the serpent mother’s hunting lesson. Breca brings Drekr down, then both push their seaxes into his neck for Thorkel/Papa. Death is strongly implied; her ground hand-axe has been lost again, without shown recovery.</p></details><details><summary>The Fury of the Gods · 88</summary><h2>Thorkel avenged and the final advance</h2><p>She retrieves the hand-axe disarmed by Drekr and takes his long-axe, while both seaxes remain in his corpse. Lif affirms his own task complete, Gunnar reports the rat-blood dead and she confirms Drekr to Glornir as Thorkel avenged. These are distinct weapons and distinct revenge reports, not Rotta’s death or recovery of her old lost axes.</p></details><details><summary>The Fury of the Gods · 88</summary><h2>Thorkel avenged and the final advance</h2><p>Ulfrir speaks inside her skull, saying his strength fails and now is the time; she assents without the action being explained. She leads the flank attack relieving Glornir beside Vol/Uspa’s spells, then agrees to the horn signal as the wounded wolf leaps at the dragon again.</p></details><details><summary>The Fury of the Gods · 90</summary><h2>The last assault on Lik-Rifa</h2><p>Using Drekr’s taken long-axe, she and Glornir leap onto the damaged wing and climb with partial Tainted claws while the three witches bind the dragon’s head. They sever one jaw hinge, are thrown off and Orka suffers self-assessed shattered ribs/leg injury, sides unspecified. She uses a spear as staff; Glornir saves her from a claw and is mortally struck.</p></details><details><summary>The Fury of the Gods · 90</summary><h2>The last assault on Lik-Rifa</h2><p>She witnesses Taras throw Hrung into the dragon’s jaws, her poison collapse/death and Ulfrir’s explanation. With Breca she reaches dying Glornir for farewells, then Lif/Sæunn help her up as she embraces her son. Her words brother refer to the already established oath/family relationship, not new biological siblinghood. Hrung is heard alive inside the corpse at the end.</p></details><details><summary>The Fury of the Gods · 91</summary><h2>She leads the survivors home with an aching leg and still-healing ribs</h2><p>She leads the survivors home with an aching leg and still-healing ribs. At the ruined steading she tells Breca he is her home, mourns Thorkel at his barrow and takes a spade to dig for Glornir. No full recovery or completed burial is narrated.</p></details><details><summary>The Fury of the Gods · 92</summary><h2>A home for the Bloodsworn</h2><p>She declines to be chief again, then welcomes Vol’s proposal that the Bloodsworn make this steading their home. Her approval does not itself mean rebuilding is complete.</p></details><details><summary>The Shadow of the Gods · 1</summary><h2>Personality</h2><p>Orka worries that Breca is too gentle for their world. Danger stirs a familiar physical response in her, and the wounded wolf&#x27;s blood brings images of violent deaths to mind.</p></details><details><summary>Illustration · The Fury of the Gods · 15</summary><p><a href="assets/2b126d70f04dd9.jpg">Open noncanonical illustration</a></p><p>Orka reaching towards Breca at their reunion; he remains outside the crop.</p></details><details><summary>Illustration · The Fury of the Gods · 76</summary><p><a href="assets/ab304df5413ea2.jpg">Open noncanonical illustration</a></p><p>Breca embracing Vesli at the riverbank regrouping.</p></details><details><summary>Illustration · The Fury of the Gods · 26</summary><p><a href="assets/ed843c0b7f290d.jpg">Open noncanonical illustration</a></p><p>Dagrun’s armour gift and quiet assurance to Orka.</p></details><details><summary>Illustration · The Fury of the Gods · 72</summary><p><a href="assets/146eb07fa5bcf1.jpg">Open noncanonical illustration</a></p><p>The fleets seen from the crown of Wolfdales at dawn.</p></details><details><summary>Illustration · The Fury of the Gods · 74</summary><p><a href="assets/1ea616eab4309c.jpg">Open noncanonical illustration</a></p><p>Glornir and Vol’s leap, before any landing is shown.</p></details><details><summary>Illustration · The Fury of the Gods · 29</summary><p><a href="assets/357c3a72a11ba9.jpg">Open noncanonical illustration</a></p><p>The brief reunion before the next magical threat.</p></details><details><summary>Illustration · The Shadow of the Gods · 21</summary><p><a href="assets/e1881d728bcb46.jpg">Open noncanonical illustration</a></p><p>Orka after recovering her old war gear and burying Thorkel.</p></details><details><summary>Illustration · The Fury of the Gods · 7</summary><p><a href="assets/01668593708551.jpg">Open noncanonical illustration</a></p><p>Orka and Biórr on the march.</p></details><details><summary>Illustration · The Fury of the Gods · 90</summary><p><a href="assets/8ebbc301db92b4.jpg">Open noncanonical illustration</a></p><p>Orka and Glornir climbing the damaged wing before the jaw attack.</p></details><details><summary>Illustration · The Fury of the Gods · 4</summary><p><a href="assets/bd8aa0c8557c9a.jpg">Open noncanonical illustration</a></p><p>Orka captive outside Svelgarth.</p></details><details><summary>Illustration · The Fury of the Gods · 17</summary><p><a href="assets/5e1ad98da7b9c2.jpg">Open noncanonical illustration</a></p><p>Orka discarding the shield after Rotta’s ice-rune strikes it.</p></details><details><summary>Illustration · The Fury of the Gods · 83</summary><p><a href="assets/72dc2cb9d8574c.jpg">Open noncanonical illustration</a></p><p>Orka wiping both seaxes on the spider’s venom-wet fangs.</p></details><details><summary>Illustration · The Fury of the Gods · 46</summary><p><a href="assets/0297d066d79e3b.jpg">Open noncanonical illustration</a></p><p>Orka and Drekr facing one another before their clash.</p></details><details><summary>Illustration · The Fury of the Gods · 86</summary><p><a href="assets/da334e434985ba.jpg">Open noncanonical illustration</a></p><p>Orka’s initial axe-and-seax clash with Drekr.</p></details><details><summary>Illustration · The Hunger of the Gods · 72</summary><p><a href="assets/44bf2ffe0da90a.jpg">Open noncanonical illustration</a></p><p>Orka&#x27;s companions survey Svelgarth and the approaching army from the mountain path.</p></details><details><summary>Illustration · The Fury of the Gods · 11</summary><p><a href="assets/7eef904efccce4.jpg">Open noncanonical illustration</a></p><p>Orka refusing Rotta’s conditional offer.</p></details><details><summary>Illustration · The Fury of the Gods · 39</summary><p><a href="assets/f20f8d2ec0ef53.jpg">Open noncanonical illustration</a></p><p>Glornir welcoming Orka back as kin.</p></details><details><summary>Illustration · The Fury of the Gods · 91</summary><p><a href="assets/660a0c42b22bdc.jpg">Open noncanonical illustration</a></p><p>The survivors approaching the overgrown steading.</p></details><details><summary>Illustration · The Fury of the Gods · 88</summary><p><a href="assets/bb25c389270dd9.jpg">Open noncanonical illustration</a></p><p>Skuld’s horn signal above the exhausted wolf and dragon.</p></details><details><summary>Illustration · The Fury of the Gods · 74</summary><p><a href="assets/9aca3371fbb0bb.jpg">Open noncanonical illustration</a></p><p>Snaka rising from the fjord and shedding the mountain’s rock.</p></details><details><summary>Illustration · The Fury of the Gods · 58</summary><p><a href="assets/a6bdbc1d301bcc.jpg">Open noncanonical illustration</a></p><p>The winged spertus reaching the palisade.</p></details><details><summary>Illustration · The Fury of the Gods · 90</summary><p><a href="assets/74e707bda99962.jpg">Open noncanonical illustration</a></p><p>Taras throwing Hrung toward the dragon’s open jaws.</p></details><details><summary>Illustration · The Fury of the Gods · 77</summary><p><a href="assets/351bb7176446cb.jpg">Open noncanonical illustration</a></p><p>Glornir’s party entering the survivors’ snowy camp.</p></details><details><summary>Illustration · The Fury of the Gods · 72</summary><p><a href="assets/a31ae3fafb144b.jpg">Open noncanonical illustration</a></p><p>The roof ward stopping the dragon before Rotta opens it.</p></details><details><summary>Illustration · The Fury of the Gods · 52</summary><p><a href="assets/0db38c882c4a1f.jpg">Open noncanonical illustration</a></p><p>The ruined fleet seen from the intact gate.</p></details><details><summary>Illustration · The Fury of the Gods · 22</summary><p><a href="assets/bb1c585cefdbae.jpg">Open noncanonical illustration</a></p><p>Noncanonical close view of the wooden sword pendant at its return.</p></details></noscript>
