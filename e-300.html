      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>Grok is Kló’s mate and one of the giant raven pair. In B02-C057 she explicitly identifies him as the horse-sized raven Orka saved from frost-web near Grimholt in B01-C049; he thanks Orka for it. The individual name and mapping are learned now, preserving the older nameless account and E-196 pair record.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>After the farm rescue he sits in the giant timber nest, emphatically denies being vaesen, then glides down to the courtyard. Gudleif explains the residents’ food-and-shelter trade for news and protection. The pair’s battle intervention is directly observed, without allocating each strike to a named bird.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>He says more ravens once existed and that they were Snaka’s messengers, eyes, ears and spies. He frames helping Orka as repayment for her aid: favour for favour. Orka says she needs a favour, but does not specify it before the ending. No new commission or messenger journey is established.</p></details><details><summary>The Hunger of the Gods · 64</summary><h2>The hidden doors into Nastrandir</h2><p>Together with Kló, Grok takes on carrying Vesli towards Darl to find Glornir for Orka. No arrival or completed errand is yet recorded.</p></details><details><summary>The Fury of the Gods · 30</summary><h2>He and Kló seize the shoulder-wounded caster and tear him apart aloft</h2><p>He and Kló seize the shoulder-wounded caster and tear him apart aloft. They later land on Sea-Wolf; Grok is the bird on the rail, commenting that he is glad the large serpent has gone. The attack is directly observed and their names are supplied by speech, rather than inferred from the earlier distant black birds alone.</p></details><details><summary>The Fury of the Gods · 32</summary><h2>Debts, kinship and the voyage onward</h2><p>With Kló he feeds on enemy dead, then offers the company aerial watching for danger and the dragon after their meal. Their exchange frames aid as friendship, and Vol promises reciprocal help if possible. No new dragon sighting is made.</p></details><details><summary>The Fury of the Gods · 39</summary><h2>Old oaths and news of the dragon</h2><p>He reports the dragon’s host has left Darl on foot westward, explicitly having stayed too far away to hear its destination. Vol offers pickled herring. He later preens Kló and names Ulfrir’s den Wolfdale as she reports Elvar’s fleet; Glornir asks both to tell Orlyg of the course change. No completed relay or new close listening is claimed.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>He accompanies Kló from the ship onto the pier and towards the wolf hall at their own request</h2><p>He accompanies Kló from the ship onto the pier and towards the wolf hall at their own request. No new scouting report or spell occurs.</p></details><details><summary>The Fury of the Gods · 43</summary><h2>He steps forward to affirm the dragon/rat march and is recognised with Kló by Hrung</h2><p>He steps forward to affirm the dragon/rat march and is recognised with Kló by Hrung. Against Ulfrir’s trust warning, he says the world changed after Snaka’s death and the pair had been lonely/afraid. He cannot state an arrival time; Elvar accepts their offered watching as friendship, not a commanded new collar oath.</p></details><details><summary>The Fury of the Gods · 48</summary><h2>During Logur’s welcome, he feeds from a barrel of pickled herring on the dais</h2><p>During Logur’s welcome, he feeds from a barrel of pickled herring on the dais. Kló sees the feast and asks for food before being told to report first.</p></details><details><summary>The Fury of the Gods · 65</summary><h2>Losses and plans after the retreat</h2><p>Grok and Kló have searched the enemy host for signs of the Tainted children/Bjarn, but Uspa has no positive report for Elvar. The failed search report does not mean the child is absent from the host or dead.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>The survivors’ camp and reunion</h2><p>Uspa asks for Grok/Kló as scouts, but Ulfrir warns that they belong to Snaka heart/soul and would betray the group, speculating they might already search for him. This warning is attributed to Ulfrir; neither raven is directly seen betraying or scouting in the chapter.</p></details><details><summary>The Fury of the Gods · 89</summary><h2>Heðin falls and the ravens seize Rotta</h2><p>Grok/Kló seize Rotta from the sky crying that he killed Father-Snaka, carry him up and drop him into wagons. This directly shows revenge/loyalty toward Snaka; the predicted betrayal/search against the survivors is not observed here.</p></details><details><summary>Illustration · The Fury of the Gods · 43</summary><p><a href="assets/3c80cc23ff516b.jpg">Open noncanonical illustration</a></p><p>Elvar accepting the ravens as friends and scouts.</p></details><details><summary>Illustration · The Fury of the Gods · 89</summary><p><a href="assets/82a301355c5056.jpg">Open noncanonical illustration</a></p><p>Grok and Kló lifting Rotta in revenge for Snaka.</p></details></noscript>
