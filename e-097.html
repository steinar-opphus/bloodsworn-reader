      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 10</summary><h2>Introduction</h2><p>Sigrún names Jarl Orlyg at Svelgarth and says he has raided her lands.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>Ilska names him alongside Störr of Snakavik and Helka of Darl as growing powers gathering or absorbing lesser jarls. This is her political assessment; no new particular conquest or personal appearance is shown.</p></details><details><summary>The Hunger of the Gods · 41</summary><h2>Sigrún&#x27;s reckoning with Guðvarr</h2><p>Sigrún reports that Helka has invited him to a meeting in Darl and that his messengers have said he is coming. Guðvarr calls him Helka’s enemy and Sigrún agrees. She places him on Helka’s eastern border, opposite the western threat from Störr, and speculates about peace or a pact. His arrival, negotiations and any agreement remain pending; the procession that follows carries Hakon and Frek.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>In Orlyg’s absence Skalk says his realm is the quickest route towards Nastrandir, but the needed force could not pass without an arrangement. He suggests Helka’s offered pact during the planned visit might solve that obstacle. The strategic purpose is now voiced in her council; no arrival, meeting or pact is completed.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>Ilska describes him to Lik-Rifa as old but hale, warlike and weaker than his two rivals, ruling at Svelgarth a few days south and fighting Helka on his borders. Those are her reports and judgments. Lik-Rifa names him as the first ruler she plans to kill; no attack, audience or change of rule occurs.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Rowing and a merchant ship intercepted</h2><p>The Hvítá merchant tells Elvar he is bound for Darl and says Störr suspects an alliance with Helka, prompting a planned first strike. She presents the news as drengrs’ gossip. It does not confirm his arrival, the meeting, a signed pact or his reaction to Störr.</p></details><details><summary>The Hunger of the Gods · 77</summary><h2>Orna raised and the battle above Darl</h2><p>He appears beside Helka with a Galdurman and twelve collared warriors, in wolfskin and with a knotted white beard. At the attack he calls his men and jumps from the platform to fight.</p></details><details><summary>The Fury of the Gods · 17</summary><h2>Escape on Orlyg’s longship</h2><p>Orka recognises him leading the wolf-shield warriors: white-haired, barrel-chested, in mail and fur, fighting with a long-axe. A dark-haired staff-bearing Galdurman with animal skulls in his braids shields him. Under Rotta’s fire and ice assault he orders retreat, signalled by a horn. He boards the second longship and directs its escape after the first burns.</p></details><details><summary>The Fury of the Gods · 22</summary><h2>Breca’s training and Orlyg’s passengers</h2><p>He stands at the stern in mail and a patchwork fox-pelt cloak, white hair and thick braided white beard, a newly stitched cheek wound scabbed and bruised. Aila and Tjorvi guard his sides, and Gösta joins the discussion. He challenges Orka’s farmer account, recognises the Bloodsworn shields and accepts her former service and search after Dagrun vouches for her. He promises a blood-price and passage without an observed payment.</p></details><details><summary>The Fury of the Gods · 22</summary><h2>Breca’s training and Orlyg’s passengers</h2><p>He rejects joining the enemy or fleeing under Kirill, and accepts that rebuilding Svelgarth now is unsafe. He discusses Störr as a possible ally without knowing the succession and admits his earlier conditional plan to defeat him alongside Helka, then betray her. Orka’s news of Elvar and Ulfrir changes the proposal. Tjorvi reports dreams of the wolf’s call; Orlyg had not known. He orders Snakavik as the destination, while fearing a victorious Elvar could become too powerful.</p></details><details><summary>The Fury of the Gods · 26</summary><h2>Lessons, mourning and Spert’s barrel</h2><p>He supplies Orka a barrel and salt for Spert’s preservation and jokes it goes on her debt tally because salt is costly. She agrees despite disliking debt. Dagrun later distinguishes his own repayment in armour from his father’s earlier safe passage; no specific price or payment is recorded.</p></details><details><summary>The Fury of the Gods · 28</summary><h2>Orlyg joins the sea battle</h2><p>He agrees to intervene after Orka identifies the outnumbered Sea-Wolf, welcoming the chance to put the Bloodsworn in his debt. Crosswind delays the approach; Gunnar persuades him that rescuing the worse-pressed knarr also helps the company. He directs the attack to the drakkar at its stern, boards with Dagrun and Gösta, and fights through to the knarr. His reinforcements break one enemy crew. Orka introduces Sulich, who points out the other crew still fighting. No debt settlement or formal alliance follows here.</p></details><details><summary>The Fury of the Gods · 30</summary><h2>He follows Iva, Taras and Sulich onto Sea-Wolf as the last enemy drakkar retreats south</h2><p>He follows Iva, Taras and Sulich onto Sea-Wolf as the last enemy drakkar retreats south. After the serpent leaves and Vesli rejoins Breca, he remarks on the Bloodsworn’s strange company, looking between the tennúr, giant ravens and juvenile on Vol’s forearm. No rescue-debt payment or formal pact is settled.</p></details><details><summary>The Fury of the Gods · 32</summary><h2>Debts, kinship and the voyage onward</h2><p>He greets Glornir, compares Snakavik intentions and reports Elvar’s collared wolf-god, news Vesli had omitted. He receives Glornir’s word that the Bloodsworn are in his debt for rescue, sealed with a wrist-grip; no sum or authority transfer is specified. He tries to buy a Seiðr-witch, but Glornir refuses both Vol and Iva. He returns to his drakkar, which is already sailing on a south-easterly towards Vigrið’s coast while the others complete repairs.</p></details><details><summary>The Fury of the Gods · 39</summary><h2>Old oaths and news of the dragon</h2><p>Glornir asks Grok and Kló to tell him of the dragon’s movement, Elvar’s fleet and a course change towards the Iron Wood. No delivery, acknowledgement or new manoeuvre by Orlyg is shown here.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>Arrival at the wolf-god’s hall</h2><p>He approaches the landing with Dagrun, Gösta and fifty or sixty drengrs/Tainted and lets the Bloodsworn lead. Glornir had urged catching him first to avoid his boasting. He follows with the group into Wolfdales, but no formal terms with Elvar are spoken by him before the ending. Glornir privately promises Iva no sale to him.</p></details><details><summary>The Fury of the Gods · 43</summary><h2>Allies meet and old loyalties surface</h2><p>He offers his surviving Svelgarth drengrs/Tainted to Elvar against dragon and rat, with Dagrun at his shoulder. His report of Rotta leading the sack surprises Ulfrir/Skuld; he names Nidden as the river where he attacked the rat’s warband and lost one drakkar. Elvar explicitly accepts his axe and welcomes him with the other arrivals. No new payment or blood-binding rite accompanies it.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>Salvage and a choice about freedom</h2><p>He publicly supports the release decision and removes collars from about twenty followers, offering them voluntary drengr oaths and paid support. His joke about needing silver is not a full wage schedule, new raid or completed acceptance by each freed person.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>Elvar Chainbreaker and the hillside stand</h2><p>He is explicitly named with Dagrun, his drengrs and Tainted on Elvar’s left flank before the hillside shield clash. His presence here does not by itself definitively name the earlier white-haired commander seen by Guðvarr.</p></details><details><summary>The Fury of the Gods · 73</summary><h2>Brák’s hostages and Einar’s fall</h2><p>Sighvat’s Battle-Grim and Orlyg’s warband fight together, pushing skraeling away from the dais toward the open doors while the hall burns. This is an ongoing local advance, without a final casualty tally or completed evacuation.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>Leif’s death and the tunnel escape</h2><p>The group is directly present in Ulfrir’s gathering evacuation: Skuld above, both stone wolves alongside, Úlfhéðnar beneath, Battle-Grim/drengrs with Sighvat, Orlyg’s survivors and Sulich’s mounted remnants. The gate is blocked and they turn to the tunnels. This does not establish repaired guardians or a complete survivor tally.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>Orlyg and Logur emerge together with perhaps a hundred combined warband survivors</h2><p>Orlyg and Logur emerge together with perhaps a hundred combined warband survivors. Both sit at council; Orlyg assesses the battle and jokes about Snaka, then welcomes the returning Glornir/Orka as Shieldbreaker/Farmer. The estimate is not a precise split between their forces.</p></details><details><summary>The Fury of the Gods · 81</summary><h2>The charge against the gods</h2><p>The captains join the loose charge: Orlyg/Logur lead their warriors, Sighvat the Battle-Grim, and Grend/Gytha Elvar’s drengrs with Berserkir/Úlfhéðnar. This is a renewed allied assault, not its final outcome.</p></details><details><summary>The Fury of the Gods · 83</summary><h2>Skuld’s scissors and the spider’s venom</h2><p>Pressed against raven-emblem warriors, his line is struck from behind by Drekr’s small Raven-Feeder group. Drekr smashes his shield, throws/pins him beneath it and chops into his head. The chapter ends at the strike, without a later examination or explicitly narrated death aftermath.</p></details><details><summary>The Fury of the Gods · 86</summary><h2>His death is now explicit: Orka sees his corpse/shattered skull under Drekr’s axe</h2><p>His death is now explicit: Orka sees his corpse/shattered skull under Drekr’s axe. His surviving son Dagrun rises to fight; only a handful of his drengrs remain engaged, mostly freed Tainted who had sworn to him after Elvar’s emancipation. This confirms those prior oaths without dating or inventing their ceremony.</p></details><details><summary>Illustration · The Fury of the Gods · 22</summary><p><a href="assets/e06e9438bb0882.jpg">Open noncanonical illustration</a></p><p>Orlyg’s stern discussion on the way to the sea.</p></details></noscript>
