      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 2</summary><h2>The trader’s dried-blood claim</h2><p>A Liga trader previously offered what was labelled faunir dried blood. That sales description does not itself establish a biological property.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>A leafy captive in the tower</h2><p>In Skalk’s tower Guðvarr sees a captive emerge from a leafy bush in a tall cage. It is smaller than a man, sapling-thin and green-eyed, with leaf-like hair, dark wood-grained skin, moss and lichen patches and thorn-sharp fingers. It speaks an insult; Skalk identifies it as a faunir. These are one specimen’s observed traits and an attributed classification, without a universal account of the species.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>Orka’s party has seen tracks identified as faunir among several vaesen kinds heading east north of the Bonebacks. No live faunir is encountered in this chapter and no new anatomy or behaviour beyond the trail direction is shown.</p></details><details><summary>The Fury of the Gods · 31</summary><h2>The hunters enter Jarnvidr</h2><p>A new individual captured in Jarnvidr has leaf-hair, polished dark wood-grain skin, thornlike fingers and small dark eyes. Its chest bites turn icy blue. Krúsa claims Faunir were made by Snaka, that their sap-like blood kills frost-spiders and that unseen kin would retaliate if it died. Those claims are attributed; the actual hostage decision is to carry it until leaving the forest, without release yet.</p></details><details><summary>The Fury of the Gods · 34</summary><h2>A bargain in the forest glade</h2><p>In Jarnvidr, a large local force of wood-bodied thorn-handed Faunir attacks the negotiation glade and frees the captive. Some throw fistfuls of sharp splinters/stakes, wounding Guðvarr and a drengr. Spiders seize some in blue webs but are also overwhelmed, as are skraeling; collared Úlfhéðnar resist more effectively but take losses. No force/casualty total or universal species mechanism is provided.</p></details><details><summary>The Fury of the Gods · 87</summary><h2>Biórr returns Bjarn</h2><p>They arrive at dawn after howl/horn, resembling wood carvings with spiked-leaf hair/thorn hands, throwing wood/thorns and swarming spiders/trolls. A small group inspects the hidden children but leaves Biórr/Fain/wagon untouched when they do not strike. This records this force’s conduct, without a universal Faunir promise or identified hostage from the earlier rescue.</p></details><details><summary>The Fury of the Gods · 89</summary><h2>They are now explicitly Ulfrir’s new allies, though the terms/promises remain unknown to Varg</h2><p>They are now explicitly Ulfrir’s new allies, though the terms/promises remain unknown to Varg. They selectively attack Lik-Rifa’s spiders/skraeling/trolls and leave the Tainted/drengrs/mercenaries/cultists alone. One unnamed Faunir rescues Varg from a spider; no identity with the earlier hostage is established.</p></details><details><summary>The Fury of the Gods · 90</summary><h2>Hundreds stand together watching Lik-Rifa’s corpse after helping clear enemy vaesen</h2><p>Hundreds stand together watching Lik-Rifa’s corpse after helping clear enemy vaesen. They remain an allied force at the local victory, without terms or a universal peace promise disclosed.</p></details><details><summary>Illustration · The Fury of the Gods · 89</summary><p><a href="assets/d6e4bff26147b0.jpg">Open noncanonical illustration</a></p><p>The unnamed Faunir intervening against the spider holding Varg.</p></details><details><summary>Illustration · The Fury of the Gods · 87</summary><p><a href="assets/ad63c782561464.jpg">Open noncanonical illustration</a></p><p>Faunir emerging from the forest at dawn.</p></details><details><summary>Illustration · The Shadow of the Gods · 2</summary><p><a href="assets/05d3030430e983.jpg">Open noncanonical illustration</a></p><p>Noncanonical appearance study of a leaf-haired Faunir.</p></details></noscript>
