      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 46</summary><h2>Introduction</h2><p>Gudrun is Hakon’s female drengr at his pre-opening meeting in The Dead Drengr. She sits by the hearth with her back to a corner, positioned to watch the entrance and room.</p></details><details><summary>The Hunger of the Gods · 46</summary><h2>Appearance</h2><p>She reaches Guðvarr rapidly with a sword point at his throat. Hakon names her when ordering the sword lowered; she sheaths it and steps back without returning to her chair. Her cold, hard eyes describe the encounter’s bearing, not a stated iris colour. No match to an earlier anonymous guard or supernatural ability is established.</p></details><details><summary>The Hunger of the Gods · 48</summary><h2>Flight from the breakfast table</h2><p>As Guðvarr flees Hakon’s breakfast table, she follows into the provisions room, strikes her shins on a fallen barrel and falls. She resumes pursuit through the rear yard and reaches the canal with Kalv, then crosses with the others in Hrolf’s boat. No lasting injury or later fate is shown.</p></details></noscript>
