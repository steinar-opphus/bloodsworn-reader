      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 7</summary><h2>The troll beside the molten pool</h2><p>Agnar calls the captive Tainted and Berserkir. He claims the dead god Berser’s blood flows in the man’s veins.</p></details><details><summary>The Shadow of the Gods · 7</summary><h2>The troll beside the molten pool</h2><p>The captive’s eyes, teeth and nails change under threat to the boy.</p></details><details><summary>The Shadow of the Gods · 21</summary><h2>Blood tested in Snakavik</h2><p>Störr’s collared guards are identified as Berserkirs; they wear iron bear-claw pendants and carry axes. After tasting Berak’s blood, Hrung declares it Berser’s blood. The test is observed, while the lineage result remains Hrung’s pronouncement.</p></details><details><summary>The Shadow of the Gods · 47</summary><h2>The Bloodsworn reveal their ancestry</h2><p>Svik identifies Glornir as Berserkir in chapter 47, during the chief’s violent grief over Vol’s abduction.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>A handful of Elvar’s Berserkir stand at the gate without iron collars</h2><p>A handful of Elvar’s Berserkir stand at the gate without iron collars. Frek’s collar-free former Helka/now Estrid Úlfhéðnar join the defence voluntarily after crediting Elvar for freedom; no full new oath rite is narrated.</p></details><details><summary>The Fury of the Gods · 58</summary><h2>They fight beside Elvar, killing two skraeling on the walkway</h2><p>They fight beside Elvar, killing two skraeling on the walkway. One unnamed Berserkir is struck by a troll-thrown spear and hurled off. No total Berserkir casualties or identified named death is supplied.</p></details><details><summary>The Fury of the Gods · 62</summary><h2>The fighting withdrawal</h2><p>At a horn the retreating line parts and Berserkir/Úlfhéðnar charge through, bodies bunching and eyes glowing, attacking frost-spiders in a frenzy and drawing them away from retreaters. Hyrndur later sting both groups amid the flight. No full individual animal form, casualty-free charge or final fate of the counterchargers is given.</p></details><details><summary>The Fury of the Gods · 63</summary><h2>The stone doors and the retreat inside</h2><p>The Tainted counterchargers hold spiders and attack trolls before disengaging for the hall; one unnamed Berserkir is speared/hurled away. Some are still in running fights as the last Bloodsworn enter. A few score Úlfhéðnar also stand with Ulfrir inside, without a statement that every outside countercharger survived.</p></details><details><summary>The Fury of the Gods · 69</summary><h2>Berserkir fight amid the hall turmoil as waves enter</h2><p>Berserkir fight amid the hall turmoil as waves enter. The source describes frenzy, not a complete survival count or a named new god-lineage.</p></details><details><summary>The Fury of the Gods · 71</summary><h2>Guðvarr finds Estrid</h2><p>Guðvarr sees two unnamed Berserkir alongside an even larger black bull-man break the combined shield wall; one later guards the two unnamed frost casters. He supplies no named identities or proof that the bull-man shares their exact lineage.</p></details><details><summary>Illustration · The Fury of the Gods · 62</summary><p><a href="assets/8d192bed87ec4f.jpg">Open noncanonical illustration</a></p><p>The countercharge covering the retreat.</p></details></noscript>
