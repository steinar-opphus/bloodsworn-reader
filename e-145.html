      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 19</summary><h2>Burial and a vow of vengeance</h2><p>The pair is first observed embedded in Thorkel’s chest and belly in B01-C017. Orka removes them before burying him.</p></details><details><summary>The Shadow of the Gods · 19</summary><h2>Burial and a vow of vengeance</h2><p>They are forearm-length, wide and single-edged, tapering abruptly towards their tips. Their ash hilts bear knotwork, brass end-caps and leather-threaded pins.</p></details><details><summary>The Shadow of the Gods · 19</summary><h2>Burial and a vow of vengeance</h2><p>In B01-C019, Orka carries both in her belt and says she will find their owner and give them back to him. Vesli’s report of an attacker with two long claws prompts Orka to wonder about these blades, but their owner is not identified at that cutoff.</p></details><details><summary>The Shadow of the Gods · 22</summary><h2>Captives freed and a name obtained</h2><p>During the chamber fight in B01-C022, Orka draws one of the blades she removed from Thorkel’s body.</p></details><details><summary>The Hunger of the Gods · 3</summary><h2>Mord&#x27;s burial and a blood feud</h2><p>Varg displays a seax taken from the slain dragon-born with the same hilt knotwork as Orka&#x27;s recovered weapons. Røkia suggests a shared maker, and Orka suspects a wider connection; these do not establish the blades&#x27; workshop or full history.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>Wounds tended and seaxes compared</h2><p>Orka now explicitly calls the recovered pair Drekr’s. Myrk’s seax has the same ash-hilted serpent knotwork and craftsmanship, but is shorter, slimmer and lighter. Orka displays the blades together; Myrk reacts to Drekr’s blade and asks how Orka got it. Orka says she found it in her husband’s body. This strengthens the connection without identifying a workshop or establishing the complete history of the matching weapons.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>While speaking of finding comfort in Drekr’s death, Orka touches one of the dragon-born’s seaxes sheathed across her lap. The blade remains part of her intended vengeance, without a new killing, completed return to Drekr or newly identified maker.</p></details><details><summary>The Fury of the Gods · 11</summary><h2>An unseen enemy follows the host</h2><p>The narration now calls the pair Drekr&#x27;s two seaxes and shows Myrk wearing them after recovering them from Orka. One is carried across the front and one across the back of her belt. A return into Drekr&#x27;s physical possession is not shown.</p></details><details><summary>The Fury of the Gods · 13</summary><h2>Myrk draws both seaxes against Orka and calls them the blades that killed her husband</h2><p>Myrk draws both seaxes against Orka and calls them the blades that killed her husband. Orka traps one blade in her wrist chain, wrests it away and catches its hilt. Myrk keeps the other and cuts Orka’s ribs. At the interruption, possession is divided between them; which physical blade each holds is unspecified.</p></details><details><summary>The Fury of the Gods · 16</summary><h2>Grief and pursuit at the river</h2><p>After Myrk’s death, Orka takes her weapons belt, buckles it on and retrieves the second seax from the ground, keeping the blade already in her hand. Both are now back in Orka’s possession and she subsequently fights with one in each fist.</p></details><details><summary>The Fury of the Gods · 26</summary><h2>Lessons, mourning and Spert’s barrel</h2><p>When Orka accepts her new mail she rebuckles the captured pair so one seax lies across her front and one across her back. Both remain with her; the rearrangement is not a new recovery or transfer.</p></details><details><summary>The Fury of the Gods · 58</summary><h2>Holding the gate walkway</h2><p>Orka uses both in the close gate fighting, plants them temporarily in the wall while pushing a ladder with her long-axe, then retrieves them for the spertus/tennúr attack. At the breach she cleans and sheathes them to take the long-axe; they are not lost.</p></details><details><summary>The Fury of the Gods · 83</summary><h2>Skuld’s scissors and the spider’s venom</h2><p>Orka coats both seaxes by wiping them along a dead frost-spider’s venom-wet fangs, then sheathes one and takes an unidentified ground hand-axe. No subsequent venom strike/effect is yet shown.</p></details><details><summary>The Fury of the Gods · 86</summary><h2>Orka uses both after her picked-up hand-axe is disarmed</h2><p>Orka uses both after her picked-up hand-axe is disarmed. Drekr’s taunt acknowledges their Thorkel connection; the under-eye cut delivers frost-spider venom with a directly observed disabling effect. She gives Breca one and both use them for the final neck attack. No subsequent sheathing/retrieval or general poison rule is shown.</p></details><details><summary>The Fury of the Gods · 88</summary><h2>Both remain embedded in Drekr’s corpse as Orka retrieves the hand-axe and takes his long-axe</h2><p>Both remain embedded in Drekr’s corpse as Orka retrieves the hand-axe and takes his long-axe. Their retrieval is not narrated in this chapter.</p></details><details><summary>Illustration · The Fury of the Gods · 83</summary><p><a href="assets/72dc2cb9d8574c.jpg">Open noncanonical illustration</a></p><p>Orka wiping both seaxes on the spider’s venom-wet fangs.</p></details><details><summary>Illustration · The Fury of the Gods · 86</summary><p><a href="assets/da334e434985ba.jpg">Open noncanonical illustration</a></p><p>Orka’s initial axe-and-seax clash with Drekr.</p></details><details><summary>Illustration · The Hunger of the Gods · 22</summary><p><a href="assets/b293cde014c0db.jpg">Open noncanonical illustration</a></p><p>An interpretive comparison of the seaxes and their shared knotwork; the weapons are not gathered together in a narrated scene.</p></details></noscript>
