      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 40</summary><h2>Councils and secrets in Wolfdales</h2><p>The Berserkir first named Thorguna during the treasury alarm now guards Grend’s cell and is called Storm-Cloud for a permanent heavy-browed frown. She carries a large iron key, unlocks the door at Elvar’s command and steps aside when ordered to let Elvar enter alone. She is not merged with the unnamed collared axe-woman in the valley.</p></details><details><summary>The Fury of the Gods · 9</summary><h2>Appearance</h2><p>Earlier appearance: Thorguna is the named twin-axe Berserkir at the treasury alarm, retained under E-323.</p></details><details><summary>The Fury of the Gods · 44</summary><h2>The new arrivals and Grend’s fate</h2><p>She waits in mail outside Elvar’s high chamber and joins Sólín escorting her down the carved branch-and-trunk stair. This does not identify any of the unnamed arrival guards as Thorguna.</p></details><details><summary>The Fury of the Gods · 49</summary><h2>She accompanies Elvar’s inspection outside the stone gates with Orv, Taras and the casters</h2><p>She accompanies Elvar’s inspection outside the stone gates with Orv, Taras and the casters. No new combat, oath or magical contribution is specifically assigned to her.</p></details><details><summary>The Fury of the Gods · 52</summary><h2>The choice to hide the beast</h2><p>She draws both axes during Runa’s drengrs’ attack, striking one in the head and severing another’s wrist. The attackers on the walkway are later reported slain. No wound or new transformation is specifically assigned to Thorguna.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>Salvage and a choice about freedom</h2><p>Elvar rejects her self-blame and says she defended her, while Thorguna says Störr would have punished her. Thorguna is among the named Berserkir whose collars are removed. She later follows as guard and tearfully affirms freely given oaths, not continuing collar compulsion.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>Thorguna and Frek step forward as the chosen captains of the waiting Berserkir/Úlfhéðnar</h2><p>Thorguna and Frek step forward as the chosen captains of the waiting Berserkir/Úlfhéðnar. Elvar reminds them of the plan and orders control of their beasts. The full plan or performed transformation is not yet shown.</p></details><details><summary>The Fury of the Gods · 65</summary><h2>Losses and plans after the retreat</h2><p>She remains as guard in the shadows of Elvar’s tree-branch entrance while Sólín takes the rear door, after Elvar praises their fighting and falls asleep. No new individual injury is supplied.</p></details><details><summary>The Fury of the Gods · 67</summary><h2>She rushes the bedroom intrusion with twin axes, helps Elvar rise and fights the doorway crowd</h2><p>She rushes the bedroom intrusion with twin axes, helps Elvar rise and fights the doorway crowd. The staff force throws her inward, but she rises and keeps enemies occupied; a shoulder wound streams blood, side unknown. She is still fighting as Grend/Gytha arrive, and her final fate is not shown.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>The roof ward opens</h2><p>Gunnar and Halja come to her aid against three Tainted near the bedchamber, and she fights with them up the tree. She later limps toward Glornir and the two charge the skraeling screen and Raven-Feeder wall in swelling fury. No complete animal change, healed shoulder or final outcome is shown.</p></details><details><summary>The Fury of the Gods · 74</summary><h2>Snaka rises and Wolfdales collapses</h2><p>Orka sees her on the ground after the shield-wall breakthrough, a spear through belly and back with dead enemies beneath/around her. The account does not explicitly establish whether she is dead or survives this wound.</p></details></noscript>
