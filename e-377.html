      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 29</summary><h2>Introduction</h2><p>Grend swore an oath to Elvar’s mother.</p></details><details><summary>The Hunger of the Gods · 67</summary><h2>Earlier evidence records Grend’s oath to Elvar’s dead mother</h2><p>Earlier evidence records Grend’s oath to Elvar’s dead mother. Elvar later recalls being twelve when her sick mother died, Störr forbidding visits and Grend crying at the death horn. These are earlier recorded recollections, without a newly established medical cause of death.</p></details><details><summary>The Fury of the Gods · 40</summary><h2>She is unnamed here, Elvar’s mother and Störr’s wife, remembered from earlier evidence as dead</h2><p>She is unnamed here, Elvar’s mother and Störr’s wife, remembered from earlier evidence as dead. Grend now says she was the daughter of Störr’s petty jarl and of similar age to him. She cared for him after beatings, and they later saved one another from outlaws during a hunt. She kept his Hundur blood secret, and her father freed him for rescuing her. After Störr married her, she summoned him to Snakavik. Soon after Elvar’s birth and the start of mistreatment, she asked Grend’s blood oath to protect the child. These are his recollections, not a new present assault or a new cause of her death. Grend denies being Elvar’s biological father.</p></details></noscript>
