      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 13</summary><h2>News of a missing sister</h2><p>This is a descriptive label for the unnamed river village visited by Svik and Varg. Its buildings include about twenty turf-roofed pit-houses, smokehouses, a barn and pig pens; wooden piers line the river and damaged nets hang on timber frames.</p></details><details><summary>The Hunger of the Gods · 13</summary><h2>News of a missing sister</h2><p>Thin, collared field thralls flee at the Bloodsworn’s approach. Njal Olafsson meets the visitors and describes farming, fishing and hunting. He reports that crowded boats from Grimholt stopped for food and left dead to bury.</p></details><details><summary>The Hunger of the Gods · 13</summary><h2>News of a missing sister</h2><p>An armed preacher proclaims Lik-Rifa’s coming. Njal tolerates the group to protect his villagers, despite Svik’s claim that Althing Law permits hanging god-worshippers. Svik’s thrown cheese provokes a fight; afterwards wounded opponents lie scattered and the villagers hold one man at spearpoint.</p></details><details><summary>The Hunger of the Gods · 13</summary><h2>News of a missing sister</h2><p>The Bloodsworn open a barrow and inspect a dark-haired dead warrior with torn facial wounds, a bronze arm ring, an eagle-wing brooch and a hand-axe. He is not Skalk. His individual identity and any connection with chapter 12’s overboard man are unestablished.</p></details></noscript>
