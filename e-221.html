      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 13</summary><h2>Introduction</h2><p>Terna and Njal first name Brimil as an absent slaver. Terna says Kolskegg sold her and Frøya to him, and that Frøya remained alive when he sold Terna to Njal. Njal says Brimil trades in Darl and calls him respected.</p></details><details><summary>The Hunger of the Gods · 13</summary><h2>Story and connections</h2><p>According to Terna, Brimil often beat Frøya because she kept trying to escape. Svik promises to help Varg find and question him. At that point, neither a meeting with Brimil nor his responsibility for Frøya’s death is established.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>Varg’s party finds him at The Dead Drengr, counting coins with a female guard behind him. Bald and thickset, he has a gold-bound grey-streaked beard, muscular arms and a belly over his belt. He identifies himself to Svik and boasts of handling runaway thralls during the pretended sale of Varg.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>Varg attacks and beats him. Under violent questioning he remembers Terna and Frøya, admits punishing Frøya and invokes sexual violence to break defiance. He says he sold her to Brák Trolls-Bane, currently out of town. These remain his statements under coercion; they do not establish how Frøya died.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>Svik cuts his throat after the questioning. Svik says Brimil saw Varg’s eyes change and that their secret must be protected. Røkia and Einar kill the two guards; Rog’s fate remains unconfirmed.</p></details><details><summary>Illustration · The Hunger of the Gods · 29</summary><p><a href="assets/70355889754183.jpg">Open noncanonical illustration</a></p><p>Brimil — seated at The Dead Drengr before Varg attacks.</p></details></noscript>
