      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 2</summary><h2>Introduction</h2><p>Varg refers to Helka as Queen Helka. A local drengr has collected tax due to her at Kolskegg’s farm.</p></details><details><summary>The Shadow of the Gods · 2</summary><h2>Story and connections</h2><p>A trader calls Varg’s bronze coin a Helka. The coin bears a woman’s profile.</p></details><details><summary>The Shadow of the Gods · 2</summary><h2>Story and connections</h2><p>Varg has heard talk that she seeks to rule and control half of Vigrið. He has also heard of her ruthlessness towards enemies. The stew trader complains that her queenship serves heavy taxation.</p></details><details><summary>The Shadow of the Gods · 3</summary><h2>Bodies brought to Fellur</h2><p>Virk says Jarl Sigrún went to Helka’s court in Darl.</p></details><details><summary>The Shadow of the Gods · 3</summary><h2>Bodies brought to Fellur</h2><p>Guðvarr reports Sigrún calling Helka just, good and wise. He promotes swearing oaths to her as beneficial to Fellur. Virk objects that her care would be rule.</p></details><details><summary>The Shadow of the Gods · 10</summary><h2>An Althing and a challenge</h2><p>Sigrún announces she has sworn her blood oath to Helka. She says Helka will demand coin and oaths.</p></details><details><summary>The Shadow of the Gods · 10</summary><h2>An Althing and a challenge</h2><p>Sigrún says the bones of Orna tower over Helka’s fortress at Darl.</p></details><details><summary>The Shadow of the Gods · 18</summary><h2>New weapons and an attack at the docks</h2><p>At the end of B01-C018, three drakkar bearing eagle images on black sails approach Liga, and Helka comes to the port.</p></details><details><summary>The Shadow of the Gods · 20</summary><h2>The queen arrives at Liga</h2><p>In B01-C020, Helka is tall, with long black hair braided with gold wire, a red cloak pinned with a gold brooch and an ornate gold-trimmed sword. Her banner is Orna in gold against black sails, and her first moored drakkar is nearly twice the size of the Sea-Wolf.</p></details><details><summary>The Shadow of the Gods · 20</summary><h2>The queen arrives at Liga</h2><p>Her mail-clad, collared bodyguards control access to her. Svik identifies Hakon as her son and Skalk as her skáld and Galdurman.</p></details><details><summary>The Shadow of the Gods · 20</summary><h2>The queen arrives at Liga</h2><p>She takes Jaromir’s grievance to Logur’s hall and invites Glornir to join her. Glornir later announces work for her against something eating people in the north; Skalk and two of her warriors travel aboard the Sea-Wolf.</p></details><details><summary>The Shadow of the Gods · 31</summary><h2>A royal procession through Darl</h2><p>Helka arrives wearing gold-threaded black braids, a red cloak and gold arm rings. People kneel to Helka as an honour guard escorts her into Darl.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>The fugitives reach Darl</h2><p>She sits in a high-backed chair, her face described as sharp-featured with bright, intelligent eyes.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>The fugitives reach Darl</h2><p>In her private chamber she wears red wool with fine tablet weave, a gold-fitted belt and an ivory-hilted eating knife, her black hair bound with gold wire. Hakon, Sigrún, Jaromir and sworn jarls attend her.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>The fugitives reach Darl</h2><p>She hears Skalk’s accusations against Störr and the Bloodsworn, restrains Glunn’s immediate call to mobilise, and explains to Jaromir that she had intended to address his grievance when the hired company returned for payment. She conditionally offers to help hunt the Bloodsworn if they do not come to Darl.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>The fugitives reach Darl</h2><p>After Skalk fits the talon into Orna’s foot with magic, she declares the skeleton complete after years of searching. This is her appraisal; no resurrection or new protective effect is demonstrated.</p></details><details><summary>The Hunger of the Gods · 21</summary><h2>An audience with Queen Helka</h2><p>She receives Guðvarr with Skalk and her youngest child, Estrid, in her private chamber. After Yrsa corroborates Guðvarr’s rescue of Skalk, Helka thanks him, says Skalk is dear to her and gives him a gold arm ring. She later lets the bored Estrid leave after a request for weapons-craft teaching from Frek.</p></details><details><summary>The Hunger of the Gods · 21</summary><h2>An audience with Queen Helka</h2><p>She calls Vafri’s loss painful, says Vafri was dear to her and pack to her Úlfhéðnar, and describes her as a valuable gift to Sigrún. This is Helka’s later testimony about Vafri, kept separate from the earlier directly witnessed wound.</p></details><details><summary>The Hunger of the Gods · 21</summary><h2>An audience with Queen Helka</h2><p>Hearing the accounts of Orka’s search for her son, Helka identifies her as Úlfhéðnar with vaesen and giant raven allies and orders her brought before her. She declines Guðvarr’s offer to fetch Orka and offers him another task closer to home, without disclosing its nature.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>She sits at the feast hall’s dais among richly dressed, arm-ringed guests. An unnamed scarred woman is among them; no name is assigned from resemblance alone. Her iron-collared Úlfhéðnar guard the dais, provoking sorrow and rivalry in Varg.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>Glornir’s attack brings the guards and drengrs into battle. When Røkia displays Hakon as a hostage, Helka shouts for the fighting to stop; the Úlfhéðnar immediately withdraw and one knocks down a drengr who fails to obey. No settlement is shown.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>Her Úlfhéðnar protect her and Estrid during the confrontation. She demands Hakon’s release, says Skalk went to the tower and claims not to know where Vol is. Guðvarr then reports Jaromir’s removal of Vol and the chest.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>When Glornir threatens her heir, she says she has a spare and tells the pleading Hakon she is negotiating. She silences Estrid after the daughter says he should die and that she would rule better. The bargaining language does not establish a succession change or her private willingness to sacrifice him.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>After Skalk returns she refuses to surrender him, estimating forty Bloodsworn against two hundred of her own. She proposes a chest of silver for pursuit and capture of Jaromir, whom she condemns for insulting his host, with Vol’s recovery as the company’s incentive.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>She accepts Glornir’s payment and hostage terms and demand for a drakkar, requiring an Úlfhéðnar to act as Hakon’s guardian. She orders silver, a longship and food and drink while they wait. No ship or guardian is named and actual delivery and departure remain pending.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>She permits Guðvarr to put a cloak around Hakon, then later forbids any further bloodshed that night when Varg and Guðvarr confront each other.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>She provides food, a chest of silver, dockside barracks and the drakkar for the Bloodsworn. Glornir refuses her initial offer of fortress lodging. At the pier she arrives with drengrs and a dozen Úlfhéðnar and appoints Frek to accompany Hakon.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>She promises another chest when Jaromir is delivered, explains Skalk’s absence by his injuries and demands her son’s unharmed return under threat of pursuit. The Bloodsworn depart with Hakon and Frek; neither the second payment nor the hostage’s release is completed.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>On the northern march, Ilska names Helka of Darl among the growing powers gathering or swallowing lesser jarls, alongside Störr and Orlyg. This is Ilska’s assessment rather than a newly observed conquest or an account known to Helka within the chapter.</p></details><details><summary>The Hunger of the Gods · 41</summary><h2>Sigrún&#x27;s reckoning with Guðvarr</h2><p>Sigrún reports that Helka has asked her jarls to remain and invited Orlyg of Svelgarth to a meeting; his messengers say he is coming. Sigrún places Störr west and Orlyg east of Helka’s borders and speculates about peace or a pact. Neither that strategic purpose nor an agreement is confirmed. Sigrún also fears Helka might favour Skalk over her and declines to demand Guðvarr’s release.</p></details><details><summary>The Hunger of the Gods · 41</summary><h2>Sigrún&#x27;s reckoning with Guðvarr</h2><p>Hakon and Frek actually return to Darl with an escort of two score drengrs. Helka is hearing merchants from a chair on the dais when her son approaches. She walks down, welcomes him and allows him to kiss her hand, then announces a feast that night for his safe return. The crowd cheers; the feast itself is still ahead.</p></details><details><summary>The Hunger of the Gods · 43</summary><h2>The feast and the shield-dance</h2><p>At her son’s feast she admits Leif to an audience despite remarking that this is not Justice Day, when she normally hears disputes. He seeks permission to hunt Varg, renewing accusations and reporting his hiring of Sterkur’s mercenaries. She explicitly blesses the hunt and declares she wishes harm on the Bloodsworn now Hakon has returned. Her permission does not independently establish Leif’s accusations as true.</p></details><details><summary>The Hunger of the Gods · 43</summary><h2>The feast and the shield-dance</h2><p>She tells Leif the Bloodsworn sailed from Liga after Jaromir and suspects they are already in Iskidan. This is intelligence and conjecture supplied by her, not a newly observed arrival. She then lets Hakon choose a feast challenge, prompts him to accept Estrid as a contestant and presides over the shield-dance. At its end she raises Hakon’s arm and toasts his victory.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>She enters Kalv’s interrogation and demands evidence before accepting accusations against her eldest son and heir. At Guðvarr’s account of the hidden mark she orders Frek to hold Hakon, lifts his hair and shaves the patch to expose the dragon tattoo. She twice strikes him and says motherhood will not spare him from answering.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>She permits the hot-knife threat, initially rejects the claim of Lik-Rifa’s release, then hears Kalv’s affirmation, Frek’s dream report and Hakon’s account. Skalk joins earlier evidence into a plausible explanation. When Kalv partly breaks his chair she calls Frek, who kills him, and she forces Hakon to provide the northern location.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>She says Hakon has left her weakened and unprepared, refuses to kneel to Lik-Rifa and considers Skalk’s suggestion of a route through Orlyg’s realm. His plan to raise and bind Orna attracts her, especially the prospect of showing Störr a god as her thrall. Her response is tentative and the uncertain many-day preparation worries her. Guðvarr’s messenger proposal surprises her; no mission commission, pact or god-binding is completed.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>In her absence Ilska rates her likely strongest among the three powers by commanded jarls and warriors, characterises her as ruthless and places her territory up to the Slågen. Lik-Rifa rejects her claim to queenship and intends to attack her after Orlyg. No new confrontation or change of allegiance is shown.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Rowing and a merchant ship intercepted</h2><p>A merchant on the Hvítá tells Elvar that Störr is mustering against her, fearing an alliance with Orlyg and intending to strike before she is ready. The woman cites drengrs’ whispers to whores. This supplies an attributed threat report, without showing Helka’s response, Orlyg’s arrival, an agreed pact or an attack.</p></details><details><summary>The Hunger of the Gods · 77</summary><h2>Orna raised and the battle above Darl</h2><p>She hosts Orna&#x27;s raising and claims the collar makes the god hers. During the invasion Sigrún stabs through her back and abdomen, and she falls out of view. The Úlfhéðnar&#x27;s collar response passes to Hakon then responds to Estrid after Hakon&#x27;s death; Helka&#x27;s body is not separately inspected in this viewpoint.</p></details><details><summary>The Fury of the Gods · 19</summary><h2>Svea tells Elvar’s council that Helka is dead and attributes her death to the dragon</h2><p>Svea tells Elvar’s council that Helka is dead and attributes her death to the dragon. This is new testimony reaching Snakavik, not an inspected body or a replacement for the earlier directly witnessed stabbing by Sigrún and fall from the platform. The report’s claimed fatal mechanism remains attributed.</p></details><details><summary>Illustration · The Hunger of the Gods · 16</summary><p><a href="assets/b2b874ae0e801e.jpg">Open noncanonical illustration</a></p><p>Helka seated in her private chamber.</p></details><details><summary>Illustration · The Hunger of the Gods · 26</summary><p><a href="assets/8bfd5328314af6.jpg">Open noncanonical illustration</a></p><p>Røkia holds Hakon hostage during the confrontation with Helka.</p></details></noscript>
