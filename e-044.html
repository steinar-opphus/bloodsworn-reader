      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 13</summary><h2>Introduction</h2><p>Torvik calls the smith Jökul Hammer-Hand and says he is apprenticed to him. Torvik calls him the best smith in Vigrið.</p></details><details><summary>The Shadow of the Gods · 41</summary><h2>The approach to the excavation</h2><p>He is broad and thick-waisted in the mead hall. Before the chapter 41 advance, his brows are heavy and his expression dour; he puts on his helm and takes his shield from his back.</p></details><details><summary>The Shadow of the Gods · 30</summary><h2>An abandoned farm and a march inland</h2><p>Jökul catches two ponies with apples and loads them with supplies using tack found in the stable.</p></details><details><summary>The Shadow of the Gods · 41</summary><h2>The approach to the excavation</h2><p>At the guarded excavation, Jökul wears a pitted leather apron over mail and carries a long-hafted hammer with a pitted, stained black-iron head.</p></details><details><summary>The Shadow of the Gods · 43</summary><h2>The battle beneath the cliff</h2><p>Jökul&#x27;s hammer helps break an enemy shield wall. While attacking the troll&#x27;s toes, he is hit by a flailing limb and lands with twisted limbs; his condition is unresolved at the chapter&#x27;s end.</p></details><details><summary>The Shadow of the Gods · 45</summary><h2>Waking among the wounded</h2><p>After the battle he remains unconscious with a bandaged head wound, but Varg sees him breathing.</p></details><details><summary>The Shadow of the Gods · 47</summary><h2>The Bloodsworn reveal their ancestry</h2><p>By chapter 47 he is awake and freeing captives from their collars with hammer and chisel, still wearing a head bandage. He reveals descent from Gröfu the badger.</p></details><details><summary>The Hunger of the Gods · 1</summary><h2>Rest and restraint in the burned hall</h2><p>At Grimholt Orka sees him with a head bandage, thinning hair and a beard greyer than she remembers. She recalls that he forged her bronze belt buckle and fittings.</p></details><details><summary>The Hunger of the Gods · 3</summary><h2>Mord&#x27;s burial and a blood feud</h2><p>At Mord&#x27;s burial he promises Varg that Torvik will be avenged.</p></details><details><summary>The Hunger of the Gods · 24</summary><h2>A rescue planned in Darl</h2><p>He enters Darl with Svik, Varg and Æsa. In the pre-fight pause he rubs mud between his hands, wipes them on the pitted apron over his mail and checks his hammer. He recounts a saga of Snaka shaping people from mud, explaining that the act reminds him of mortality and also aids grip. His beard is white-streaked.</p></details><details><summary>The Hunger of the Gods · 24</summary><h2>A rescue planned in Darl</h2><p>He reassures Varg, calling him brother, and says Yrsa is Skalk’s oathsworn whom they may encounter. He wants to avenge Torvik if they can. When the explosion hits, he stumbles against a building and joins the group’s run; no new injury is established.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>Svik boosts him over the tower stockade. In the courtyard he drags Varg upright and crushes a guard’s skull with his hammer.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>His death is now explicit: Varg sees a dark-haired, sharp-nosed man take his fallen hammer and strike his head. Varg finds his corpse slumped at the tower threshold with a catastrophic head wound. Svik kneels beside him and Æsa looks down in disbelief. The chapter-25 hammer-wielder identity question is resolved by this named corresponding sequence; its earlier uncertainty is preserved above.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>The night march carries his body with three other fallen Bloodsworn to the dockside barracks. All four are later taken aboard in linen shrouds before the drakkar leaves Darl. No burial or funeral is performed in this chapter.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>As the assault begins Varg remembers Jökul’s habit of rubbing a handful of earth between his hands</h2><p>As the assault begins Varg remembers Jökul’s habit of rubbing a handful of earth between his hands. This memory does not make Jökul present or newly alive at the siege.</p></details><details><summary>Illustration · The Shadow of the Gods · 53</summary><p><a href="assets/b60c517b2408d3.jpg">Open noncanonical illustration</a></p><p>Jökul in a composed character study before the excavation battle.</p></details></noscript>
