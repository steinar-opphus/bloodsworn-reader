      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 9</summary><h2>Introduction</h2><p>The boy is Berak’s son.</p></details><details><summary>The Hunger of the Gods · 5</summary><h2>Bjarn among the guarded children</h2><p>His hair is described as unkempt black on his first appearance, and as brown in chapter 5 of The Hunger of the Gods.</p></details><details><summary>The Shadow of the Gods · 9</summary><h2>The serpent and the captive family</h2><p>A sea serpent knocks him overboard and Elvar dives to take his wrist. Grend helps bring them back to the ship.</p></details><details><summary>The Shadow of the Gods · 14</summary><h2>Blood memories at the oath stone</h2><p>Uspa calls her son Bjarn in B01-C014.</p></details><details><summary>The Shadow of the Gods · 14</summary><h2>Blood memories at the oath stone</h2><p>Berak frees his wife and son from the night-wyrms.</p></details><details><summary>The Shadow of the Gods · 27</summary><h2>A raid and a stolen child</h2><p>Agnar confirms Ilska&#x27;s Raven-Feeders took Bjarn and initially declines a costly pursuit.</p></details><details><summary>The Shadow of the Gods · 50</summary><h2>A deadly holmganga</h2><p>Ilska says he lives but refuses to return him. When the carts of collared children are uncovered at Oskutreð, Uspa recognises him.</p></details><details><summary>The Shadow of the Gods · 52</summary><h2>Betrayal and the dragon&#x27;s release</h2><p>Elvar directly sees him on the trapdoor among the collared children used in Ilska’s ritual. The company later reloads the captive children and departs; no rescue of Bjarn is shown.</p></details><details><summary>The Hunger of the Gods · 5</summary><h2>Bjarn among the guarded children</h2><p>Bjarn remains in the Raven-Feeders’ guarded camp beside Kráka, collared and with pearl-white filmed eyes. He briefly recognises Biórr and says “Tafl” before his eyes film over again. Biórr’s viewpoint confirms that he handed Bjarn over during the Snakavik raid.</p></details><details><summary>The Hunger of the Gods · 5</summary><h2>Bjarn among the guarded children</h2><p>Myrk says the children’s condition is caused by a Seiðr-spell to calm them, and promises their collars will be removed after they accept the cause. This promise has not been fulfilled here.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>Kráka holds his hand in Lik-Rifa’s camp, and he appears not to know where he is. Biórr feels affection for him. He is with the group whose collars Ilska and the dragon-born remove at Lik-Rifa’s order; subsequent crying and movement do not establish his individual full recovery or rescue.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>Lik-Rifa demands the children’s loyalty and obedience while claiming to replace their parents. Physical collar removal is accomplished, but Bjarn’s return to Uspa is not shown.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>After collar removal he rides beside Breca with Kráka. He recognises Biórr and asks why he is there, but his brief smile at the tafl offer fades into distraction and he does not answer a question about his condition. Kráka hopes residual Seiðr is responsible and will fade; this remains uncertain rather than a demonstrated full recovery.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>He watches Lik-Rifa and stays calm while other children cry during the memory exercise. Biórr reasons that he already knew his parents were Tainted, which is an inference about his knowledge. Asked which animal he feels, Bjarn answers bear; no new full transformation or return to Uspa occurs.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>Uspa tells Orka her son was taken too. Orka infers Bjarn and Breca are together, and Uspa cites the rescue oath when refusing to leave Elvar’s plan. This brings the mothers’ information together without a direct sighting, new report of Bjarn’s condition or reunion with Uspa.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>Nastrandir revealed in the snow</h2><p>At the midday halt he is shivering under a blanket but his eyes look clear and bright to Biórr, and he asks for food with a wan smile. Kráka agrees he is more himself and thinks the Seiðr is now out of him. Biórr later spends time talking with him near the carts. This is visible improvement and a tentative explanation, not a demonstrated full recovery, freedom or return to Uspa.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>He listens while Kráka whispers in his ear, looking down at his hands with round serious eyes amid the feasting. Biórr sees neither of them smiling. The scene does not disclose the conversation or demonstrate a relapse, full recovery, escape plan or reunion with Uspa.</p></details><details><summary>The Hunger of the Gods · 58</summary><h2>Biórr&#x27;s rat senses and a captured message</h2><p>His request to return to his mother moves Biórr to let him escape with Kráka. Both are recaptured. Breca challenges Brák for him, and Rotta releases Bjarn from his bonds while holding Kráka responsible.</p></details><details><summary>The Hunger of the Gods · 74</summary><h2>The gate falls and the children flee</h2><p>He emerges when Breca calls and agrees to travel with Orka and Gunnar towards his mother. Gunnar describes Uspa as sister to his chief&#x27;s wife. This is joining the escape attempt, not a completed reunion with Uspa.</p></details><details><summary>The Fury of the Gods · 7</summary><h2>The chained march and its victims</h2><p>Orka directly recognises him among the captive Tainted children in a wagon, dark-haired and heavy-browed. This establishes that he did not escape during the raid; no new rescue occurs in the chapter.</p></details><details><summary>The Fury of the Gods · 11</summary><h2>An unseen enemy follows the host</h2><p>Biórr recalls finding him unconscious beneath a wheel of a wagon smashed during Rotta&#x27;s poisoned transformation. Now he sits beside Harek, with the recaptured children no longer bound because Biórr believes games and meals will deter escape. Their captivity has not ended and his allegiance is not established.</p></details><details><summary>The Fury of the Gods · 17</summary><h2>Breca calls him from the overturned wagon and he follows the group towards the river</h2><p>Breca calls him from the overturned wagon and he follows the group towards the river. At the final approach to the departing ship, Harek tackles him and both disappear into the reeds. Neither is seen boarding or dying; his attempted escape remains unresolved.</p></details><details><summary>The Fury of the Gods · 48</summary><h2>Return from the sortie</h2><p>Einar tells the meal group that the dragon’s side still holds Bjarn, identifying him as Uspa and Berak’s boy. This updates an ally’s belief, without a direct new sighting or explaining his whereabouts after the earlier reeds escape.</p></details><details><summary>The Fury of the Gods · 50</summary><h2>The burned wagons and the captive children</h2><p>Biórr directly sees him alive among the dragon camp’s children, becoming broader/thicker-limbed, with green flickering in his eyes during anger. He is collarless yet says he is a prisoner and cannot leave, challenging the adults’ protection claim and recalling his unchosen ritual use. He wants his mother and the Bloodsworn’s offered help, insisting freedom entails choosing to leave. Fain stops his step towards the road and he sits apart. Current survival/location are resolved, but the return from the reeds and a free departure are not shown.</p></details><details><summary>The Fury of the Gods · 53</summary><h2>A night march under false campfires</h2><p>He is directly present sparring fiercely with Harek under Fain’s training, using the group’s leather-covered spears. This does not resolve his refusal of confinement or grant permission to leave; no new wound is stated.</p></details><details><summary>The Fury of the Gods · 65</summary><h2>Elvar’s side still has no positive news from Grok/Kló’s search for him among the enemy children</h2><p>Elvar’s side still has no positive news from Grok/Kló’s search for him among the enemy children. Berak/Elvar promise to find him, a hope rather than a completed rescue or a new change to his captor status.</p></details><details><summary>The Fury of the Gods · 87</summary><h2>Biórr returns Bjarn</h2><p>Biórr takes him from Fain’s departing wagon party, promises to return him to his mother and gives him Elvar’s axe for protection. He runs into Uspa’s arms; she kisses him and Berak sweeps both into an embrace. This is actual reunion with his established parents, not merely a search plan.</p></details><details><summary>The Fury of the Gods · 90</summary><h2>The last assault on Lik-Rifa</h2><p>He is held by Uspa/Berak in victory while Sighvat tousles his hair and celebrates, showing the white arm scar. No new weapon use or disposal of Elvar’s axe is narrated.</p></details><details><summary>Illustration · The Hunger of the Gods · 45</summary><p><a href="assets/c998fb165aacd3.jpg">Open noncanonical illustration</a></p><p>An imagined portrait of Berak and Uspa&#x27;s son Bjarn.</p></details><details><summary>Illustration · The Fury of the Gods · 50</summary><p><a href="assets/0853f7b48aa5cf.jpg">Open noncanonical illustration</a></p><p>Bjarn asking to choose whether to leave.</p></details><details><summary>Illustration · The Fury of the Gods · 87</summary><p><a href="assets/54c50d8382e602.jpg">Open noncanonical illustration</a></p><p>Bjarn’s reunion with his parents.</p></details></noscript>
