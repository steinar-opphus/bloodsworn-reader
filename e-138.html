      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 17</summary><h2>Introduction</h2><p>A young captive, questioned violently by Orka about the chief who took Breca, supplies the name Drekr. He says he fears the chief. This is the captive’s account under coercion; this initial identification is not direct observation of Drekr.</p></details><details><summary>The Shadow of the Gods · 22</summary><h2>Captives freed and a name obtained</h2><p>Under Orka’s threat in B01-C022, Vafri independently supplies Drekr’s name as the recipient of her reports about the Tainted. She says she does not know where he is taking Breca and, forced to guess, suggests Darl. The destination remains uncertain.</p></details><details><summary>The Shadow of the Gods · 33</summary><h2>Children freed at the canal</h2><p>The older boy says Drekr is inside the Dead Drengr.</p></details><details><summary>The Shadow of the Gods · 35</summary><h2>The confrontation at The Dead Drengr</h2><p>Drekr is huge and raven-haired, with silver rings in his beard and four recently stitched claw scars from forehead to chin. Drekr reacts to the seax Orka recovered from Thorkel&#x27;s body, and the narrative names him after her identification. Drekr boasts that he stabbed Orka&#x27;s husband and that he squealed; the boast is Drekr&#x27;s account. Drekr headbutts Orka and throws her off him. Drekr orders his companions to let him fight Orka, and a crowd forms around them and bets on the fight. Drekr says Breca is gone but gives no destination. Drekr has a serpent tattoo across his shoulder and chest, with open jaws and a knotwork body; no ancestry is established by it. Drekr cuts Orka&#x27;s forearm, disarms her axe and catches her throat in his axe shaft. Drekr claims Orka&#x27;s son will change the world. Drekr orders his men to surround Orka so she cannot escape. Orka climbs behind Lif and escapes down an alley, leaving Drekr alive on the street.</p></details><details><summary>The Shadow of the Gods · 35</summary><h2>The confrontation at The Dead Drengr</h2><p>At the Dead Drengr, his bunched shoulders make him appear almost neckless, and his dark tunic has knot-weave embroidery around the neck and chest. His axe is shorter than a long-axe but can be gripped two-handed.</p></details><details><summary>The Shadow of the Gods · 50</summary><h2>A deadly holmganga</h2><p>Chapter 50 names him beside Ilska at Oskutreð and identifies him and Skrið as her brothers. Elvar concludes they are dragon-born after Vörn’s response to Skrið, but that collective identification remains Elvar’s conclusion at this point.</p></details><details><summary>The Shadow of the Gods · 52</summary><h2>Betrayal and the dragon&#x27;s release</h2><p>At the released dragon’s side he attacks the golden-winged gaoler with Ilska, then kneels before Lik-Rifa with the others.</p></details><details><summary>The Hunger of the Gods · 5</summary><h2>A welcome among the Raven-Feeders</h2><p>Drekr carries Skrið’s long-axe as he kneels before Lik-Rifa beside Ilska.</p></details><details><summary>The Hunger of the Gods · 9</summary><h2>Old companions at the campfire</h2><p>Storolf identifies ten or twelve warriors around Drekr’s fire as people who came with him and describes them as capable fighters. Among them Biórr notices an unnamed lean man with tusk-like ornaments and many seaxes; no identity is assigned.</p></details><details><summary>The Hunger of the Gods · 9</summary><h2>Old companions at the campfire</h2><p>When Lik-Rifa transforms in anger, Drekr grabs Ilska and rolls her away from the jaws. He later stands with his long-axe between his sister and the dragon. Lik-Rifa returns to human form, praises this loyalty and threatens his defiance.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>He blows the horn at Ilska’s signal to end the march. At Lik-Rifa’s address he stands beside her, shorter than her but broader, and joins the acclamation. Her dragon-born followers stand behind the gathered children.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>One of his crew, explicitly naming himself Brák Trolls-Bane, returns with Ilmur and the runaway Breca, then violently punishes the boy. No new direct order from Drekr, ancestry for Brák or original abduction route is supplied.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>He sharpens an array of weapons at a fire with Brák, Ilmur and others. When flying sounds approach the camp he goes to Ilska with his long-axe as the dragon-born prepare rune-fire. Lik-Rifa calls them off and welcomes the returning tennúr; no new fight or casualty follows here.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>Nastrandir revealed in the snow</h2><p>He rides on one side of Lik-Rifa with Ilska on the other as the column approaches the coast. Lik-Rifa stops them following her towards the cliffs. He is among the company welcomed to her revealed home, but no new combat, dialogue with Breca or entry through the doors is shown.</p></details><details><summary>The Hunger of the Gods · 42</summary><h2>Inside Nastrandir&#x27;s great hall</h2><p>He follows Lik-Rifa inside Nastrandir with Ilska and the Raven-Feeders, keeping a distance behind her as she advances between the first hall’s serpent-carved pillars. No new transformation, fight or personal conversation is given to him.</p></details><details><summary>The Hunger of the Gods · 46</summary><h2>A secret meeting before dawn</h2><p>At The Dead Drengr, Kalv tells Hakon that Drekr demands proof of commitment before his message, then reports that the job is done and the day is coming. Hakon asks whether she is free and Kalv agrees. This is a messenger’s report and the prince’s response, not Drekr’s presence, a named identification of she or a fully specified next operation. The ensuing whisper is not narrated.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>Refna names him as the chief of the captors who took her and Kel after killing their parents, distinguishing him from Brák. Varg connects the name with Orka’s hunt and Røkia predicts another meeting with her. This adds testimony about the raiding group, not Drekr’s current presence, a fresh order, Frøya’s death circumstances or completed vengeance.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>Hakon initially refuses to explain because he fears Drekr, then claims to have seen him and other dragon-born with servants all around. He attributes the hidden book and child-requiring liberation spell to their discovery of Rotta’s chamber. Skalk connects prior testimony about the children’s transport and Hakon’s protection. These are disclosures and synthesis in Drekr’s absence, not a new direct sighting.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>Hakon relays Kalv’s Nastrandir directions. Guðvarr proposes replacing the slain messenger to learn what Drekr expects Hakon to be ready for, but that next operation remains unspecified and no mission starts.</p></details><details><summary>The Hunger of the Gods · 58</summary><h2>Biórr&#x27;s rat senses and a captured message</h2><p>He argues that Kráka&#x27;s divine blood is insufficient without crew loyalty and says her broken crew oath makes her execution necessary. This is his judgment; Biórr then delivers the ordered spear strike.</p></details><details><summary>The Hunger of the Gods · 60</summary><h2>Guðvarr taken into Nastrandir</h2><p>He questions web-bound Guðvarr, listens to Kalv&#x27;s reported death and cuts him free after the messenger claims allegiance. His braided black hair and unilateral white-ridged scars are observed; the bear-claw origin remains a comparison. He introduces Guðvarr to Lik-Rifa as a claimed messenger and explains Hakon&#x27;s useful position as Helka&#x27;s son.</p></details><details><summary>The Hunger of the Gods · 62</summary><h2>The army departs for Svelgarth</h2><p>He receives Myrk&#x27;s report of their father&#x27;s death and recognises Orka from the broken thumb and facial scars. He threatens Orka and strikes Breca after the boy taunts him. Myrk collapses in his arms; Rotta urges keeping the boy as bait.</p></details><details><summary>The Hunger of the Gods · 77</summary><h2>Orna raised and the battle above Darl</h2><p>He and Ilska lead a rune-fire wedge into Darl among concealed dragon followers, then strike Skalk&#x27;s group in the flank during the gods&#x27; battle.</p></details><details><summary>The Fury of the Gods · 8</summary><h2>He reports seeing Hakon&#x27;s body and Orlyg&#x27;s departing ships</h2><p>He reports seeing Hakon&#x27;s body and Orlyg&#x27;s departing ships. He blocks Glunn&#x27;s offer to pursue his former allies, ordering him to prove loyalty by finding Helka&#x27;s supporters within Darl. His assignment is distinct from the external hunt given to Sigrún, Guðvarr and Krúsa.</p></details><details><summary>The Fury of the Gods · 24</summary><h2>He kneels, takes Myrk’s body into his arms and cries</h2><p>He kneels, takes Myrk’s body into his arms and cries. His old facial scars stand white and livid and his eyes burn red as he demands the killer’s name. Biórr identifies Orka as Breca’s mother and the woman who tracked him to Darl; he responds with a growling sob. No vengeance follows within this chapter.</p></details><details><summary>The Fury of the Gods · 36</summary><h2>He rides beside Lik-Rifa, brooding and carrying his dead brother’s long-axe, with Brák’s crew behind</h2><p>He rides beside Lik-Rifa, brooding and carrying his dead brother’s long-axe, with Brák’s crew behind. Hearing Leif wants the Bloodsworn dead, he welcomes the shared enemy and promises they will see the company buried. This is intent, not accomplished vengeance.</p></details><details><summary>The Fury of the Gods · 45</summary><h2>The host enters the Iron Wood</h2><p>He moves among the campfires, talking and drinking with mixed groups who greet him with smiles and laughter. Guðvarr sees him as respected but cannot decide whether love or fear explains it; the uncertainty remains his interpretation.</p></details><details><summary>The Fury of the Gods · 46</summary><h2>The hidden tunnel raid</h2><p>He emerges through camp smoke, broad and black-haired with silvered facial scars and a raven feather in his hair, and recognises Orka. She readies her axe and he runs at her. The chapter stops before their clash resolves; his feather is not identified as Biórr’s keepsake.</p></details><details><summary>The Fury of the Gods · 47</summary><h2>He duels Orka with a long-axe and remains alive after Lik-Rifa’s disruptive landing</h2><p>He duels Orka with a long-axe and remains alive after Lik-Rifa’s disruptive landing. Ilska helps him up and he pursues the raiders. A new bleeding cheek cut is seen, side and exact cause unstated. At the end of the tracks he cannot find the withdrawing group. No duel victory, death or full medical condition is established.</p></details><details><summary>The Fury of the Gods · 50</summary><h2>He attends the evening council and promises to pursue deserters after the war</h2><p>He attends the evening council and promises to pursue deserters after the war. Lik-Rifa asks that as many as possible be brought alive; no hunt or reprisal is performed here.</p></details><details><summary>The Fury of the Gods · 55</summary><h2>He proposes a ram, then accepts Rotta’s advice that the bound gate requires ladders</h2><p>He proposes a ram, then accepts Rotta’s advice that the bound gate requires ladders. No ram is built/used or wall breached here.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>Freedom and the approaching army</h2><p>At parley he carries a long-axe, raven feather in dark hair, old white claw-like facial scars and newer scabbed wounds, sides unstated. He threatens Orka and Breca; she promises another meeting. He returns with Rotta before the assault, without resolving their feud.</p></details><details><summary>The Fury of the Gods · 59</summary><h2>Across the wall towards the hall</h2><p>He enters the opened river gate with Ilska at the Raven-Feeders’ head, long-axe in his fists and shield on his back. Elvar’s shield wall lies ahead before the hillside door, but no new Drekr duel or outcome is shown.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>Elvar Chainbreaker and the hillside stand</h2><p>He stands behind Ilska in the Raven-Feeders’ second row, long-axe ready, as their wall approaches and crashes into Elvar’s. No new confrontation with Orka is shown.</p></details><details><summary>The Fury of the Gods · 62</summary><h2>Orka identifies him in the rank behind Brák and Ilska and repeats that he killed Thorkel</h2><p>Orka identifies him in the rank behind Brák and Ilska and repeats that he killed Thorkel. She resists rushing at him because she judges an immediate attack suicidal. No new duel or vengeance occurs.</p></details><details><summary>The Fury of the Gods · 70</summary><h2>He follows Ilska to cut the dragon’s binding roots with his long-axe</h2><p>He follows Ilska to cut the dragon’s binding roots with his long-axe. Driven toward the trunk, he faces Orka again; he dodges her axe, but she collides and sends him tumbling up the stair. Ilska intervenes, and no specific new Drekr wound or final winner is shown.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>The roof ward opens</h2><p>He stays ahead of Orka behind Ilska’s interference, reaches the ward and runs through after Rotta opens it. He is with the hilltop Raven-Feeder line when the Bloodsworn charge, without a decisive new duel outcome.</p></details><details><summary>The Fury of the Gods · 74</summary><h2>He wrestles Glornir, breaks his axe haft and fights with hand-axe/seax</h2><p>He wrestles Glornir, breaks his axe haft and fights with hand-axe/seax. Orka bites his throat; he scalds her with a spell she recognises as Seiðr. After Ilska falls he tackles Orka, then charges again amid the tremors. Vesli grips his head and both roll down the hill out of sight; neither final fate is established.</p></details><details><summary>The Fury of the Gods · 76</summary><h2>After his fall downhill with Vesli, Breca wonders if he is dead and Orka is uncertain</h2><p>After his fall downhill with Vesli, Breca wonders if he is dead and Orka is uncertain. Returned Vesli reports he got away, showing a tooth she presents as his. His survival/escape is thus reported by the direct participant; his new location or capture is not shown.</p></details><details><summary>The Fury of the Gods · 78</summary><h2>He is directly seen alive at the returned captains’ meeting with Sigrún/Krúsa/Glunn</h2><p>He is directly seen alive at the returned captains’ meeting with Sigrún/Krúsa/Glunn. This confirms survival beyond Vesli’s escape report, but no new dental inspection, exact injury diagnosis or completed confrontation is given.</p></details><details><summary>The Fury of the Gods · 83</summary><h2>Skuld’s scissors and the spider’s venom</h2><p>Leading a few Raven-Feeders with his long-axe, he attacks Orlyg’s rear, shatters/pins his shield, knocks Dagrun down by a jaw strike and chops into Orlyg’s head. Orka runs toward them, without a new completed confrontation yet.</p></details><details><summary>The Fury of the Gods · 86</summary><h2>He stands over Orlyg’s explicitly dead body and faces Dagrun/Orka</h2><p>He stands over Orlyg’s explicitly dead body and faces Dagrun/Orka. After trading wounds, headbutt and disarming Orka’s hand-axe, he taunts her about Thorkel’s seaxes. Her small cheek cut carries spider venom, leaving him slow/trembling and dropping his axe. Orka directs Breca’s participation; the boy brings him down and both give finishing neck strikes for Thorkel. His death is strongly implied without a separate corpse aftermath.</p></details><details><summary>The Fury of the Gods · 88</summary><h2>His death is now explicit: Orka sees the corpse with both seaxes embedded and takes his long-axe</h2><p>His death is now explicit: Orka sees the corpse with both seaxes embedded and takes his long-axe. She confirms his death to Glornir, who calls Thorkel avenged. The earlier chapter’s fatal inference is now supported by a direct corpse description.</p></details><details><summary>Illustration · The Shadow of the Gods · 35</summary><p><a href="assets/046693988e5baf.jpg">Open noncanonical illustration</a></p><p>Drekr at The Dead Drengr before his duel with Orka.</p></details><details><summary>Illustration · The Fury of the Gods · 24</summary><p><a href="assets/17b87784ebcb2a.jpg">Open noncanonical illustration</a></p><p>Noncanonical, non-graphic interpretation of Drekr and Ilska receiving Myrk’s body.</p></details><details><summary>Illustration · The Fury of the Gods · 46</summary><p><a href="assets/0297d066d79e3b.jpg">Open noncanonical illustration</a></p><p>Orka and Drekr facing one another before their clash.</p></details><details><summary>Illustration · The Fury of the Gods · 86</summary><p><a href="assets/da334e434985ba.jpg">Open noncanonical illustration</a></p><p>Orka’s initial axe-and-seax clash with Drekr.</p></details></noscript>
