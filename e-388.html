      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 42</summary><h2>Arrival at the wolf-god’s hall</h2><p>Varg sees ditches, embankments/stakes and timber bridge gates, towers and palisades under construction on the defended western bank of River Falinn, with the opposite bank being cleared.</p></details><details><summary>The Fury of the Gods · 49</summary><h2>Building defences at the bridge gate</h2><p>The new bridge gate has towers, palisade, sunk tied struts and two oak bars, with stones piled on walkways and behind the gate; new ditch earth buttresses the riverbank timber wall. A carved shallow half-circle/spoke pattern runs beneath the gate onto the bridge and along the wall. Vol, Uspa and Iva channel rune-fire while Ulfrir and Skuld cast blood; warm white sparks flare in timber/runes, then fade. Ulfrir claims resistance to dragon and rat and possible retaliation, not yet tested.</p></details><details><summary>The Fury of the Gods · 50</summary><h2>Munni’s relayed report makes the gates, towers and wall known to Rotta/Lik-Rifa</h2><p>Munni’s relayed report makes the gates, towers and wall known to Rotta/Lik-Rifa. The dragon threatens destruction, but the report does not disclose knowledge of the new magical working or show an attack.</p></details><details><summary>The Fury of the Gods · 52</summary><h2>The dawn attack leaves gate and towers intact with fractured blue ripples</h2><p>The dawn attack leaves gate and towers intact with fractured blue ripples. Pain-edged roar and a retreating dragon support a first successful defence, though the exact strike is not watched; Ulfrir says she failed against the gate. The nearby fleet is destroyed outside this observed protection.</p></details><details><summary>The Fury of the Gods · 52</summary><h2>The dawn attack leaves gate and towers intact with fractured blue ripples</h2><p>The walkway then becomes the site of the attack on Elvar. She survives the attempted killing, Runa is subdued alive and Broðir/Silrið disappear into the river; no later sentence or future immunity is established.</p></details><details><summary>The Fury of the Gods · 53</summary><h2>A night march under false campfires</h2><p>Lik-Rifa directly complains the spell at the wall bit her when she tried to smash it, corroborating the earlier intact gate, blue flare and retreat. Her wording proves a reported painful effect, not literal teeth/fire-breathing or universal future invulnerability.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>Salvage and a choice about freedom</h2><p>Day-long salvage after the attack finds one longship and two knarr not totally destroyed, though their hulls require repair before sailing. This refines the first view of total fleet ruin; no named hull or successful sailing is given.</p></details><details><summary>The Fury of the Gods · 55</summary><h2>The siege begins at the river</h2><p>The arriving enemy sees silent armed defenders above the far-end bridge gate/towers and ditch-backed bank palisade. Rotta rejects rams against the Seiðr-bound structure and orders ladders, Ilska rafts; construction begins but no crossing or scaling proves his proposed route works.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>Frek reports the plotters’ flight before a failed bridge parley</h2><p>Frek reports the plotters’ flight before a failed bridge parley. Rafts launch and reach the bank/ditch; shielded ladder parties advance in six bridge wedges. Archery, combined defending runes, rocks and spears resist them. Varg topples two ladders but more arrive; no definitive breach or siege victory is established.</p></details><details><summary>The Fury of the Gods · 57</summary><h2>Rafts and ladders reach the defences</h2><p>Guðvarr sees raft waves reach the ditch and some attackers climb over the embankment wall, one immediately falling under defenders’ blows. Skraeling vault off locked shields onto the gate walkway; one is thrown back at the ladder-carriers. Local entry and continuing close combat are shown, without a secured breach or decisive outcome.</p></details><details><summary>The Fury of the Gods · 58</summary><h2>Holding the gate walkway</h2><p>The gate walkway is held in close fighting until flying/scuttling spertus cross the bank palisades with poison clouds, trolls climb embedded thrown weapons and tennúr swarm. Raft waves exploit the weakening embankment defence. Defenders form retreating shield groups; Orka calls the wall breached and Elvar orders fall back. This is a demonstrated wall breach, not the confirmed loss of the whole settlement or destruction of every ward.</p></details><details><summary>The Fury of the Gods · 59</summary><h2>Across the wall towards the hall</h2><p>Guðvarr now crosses, struggles through the corpse-filled ditch and reaches the walkway unopposed at his exact point. Inside, enemy spertus help break a retreating shield group. Skraeling remove the great gate bars and open the leaves on iron hinges; Ilska/Drekr’s host enters. Physical unbarring after the wall breach is demonstrated, without every magical protection being destroyed.</p></details><details><summary>Illustration · The Fury of the Gods · 58</summary><p><a href="assets/a6bdbc1d301bcc.jpg">Open noncanonical illustration</a></p><p>The winged spertus reaching the palisade.</p></details><details><summary>Illustration · The Fury of the Gods · 52</summary><p><a href="assets/0db38c882c4a1f.jpg">Open noncanonical illustration</a></p><p>The ruined fleet seen from the intact gate.</p></details><details><summary>Illustration · The Fury of the Gods · 49</summary><p><a href="assets/b260375c8f69d9.jpg">Open noncanonical illustration</a></p><p>The combined working at the river gate.</p></details><details><summary>Illustration · The Fury of the Gods · 56</summary><p><a href="assets/9d4fd81ccba6d4.jpg">Open noncanonical illustration</a></p><p>The three casters’ combined defence.</p></details><details><summary>Illustration · The Fury of the Gods · 58</summary><p><a href="assets/7f4d1b6c0ed99c.jpg">Open noncanonical illustration</a></p><p>The trolls using embedded weapon shafts as climbing holds.</p></details><details><summary>Illustration · The Fury of the Gods · 55</summary><p><a href="assets/fe8aa15a09c00e.jpg">Open noncanonical illustration</a></p><p>The defended bank seen by the arriving host.</p></details><details><summary>Illustration · The Fury of the Gods · 49</summary><p><a href="assets/37f580688c3d0c.jpg">Open noncanonical illustration</a></p><p>Noncanonical representative view of the river defences.</p></details></noscript>
