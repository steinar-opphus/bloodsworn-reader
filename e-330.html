      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 10</summary><h2>Appearance</h2><p>An unnamed man with differently coloured eyes approaches Varg in Ulaz, saying he has been seeking him; he is the man Varg noticed earlier in the market. Armed associates appear, some carrying shields painted with a golden eye. They seize Varg, drag a bag over his head and strike him while Svik and Røkia respond. The group&#x27;s name, employer and connection to any earlier eye-emblem shield remain unproven.</p></details><details><summary>The Fury of the Gods · 12</summary><h2>The captors reveal their purpose</h2><p>The abductor names himself Sterkur and Leif is revealed with him, continuing the previously reported paid hunt. The leader&#x27;s identity is now established; the group has no newly supplied official name. Captors report Unlaf wounded and Idrun slain, then attempt to execute Svik. His hair trick makes the axe sever Norv&#x27;s hands instead. The chapter ends with warriors rushing him and an unidentified sound at the wall, without a completed rescue.</p></details><details><summary>The Fury of the Gods · 14</summary><h2>Glornir’s rescuers break into the warehouse</h2><p>Glornir’s rescuers break into the warehouse. Norv is confirmed dead from blood loss. Sterkur and Leif flee with several warriors, while those remaining in the warehouse are dead or down; the source does not identify the final fate of every fallen member.</p></details><details><summary>The Fury of the Gods · 36</summary><h2>Sterkur brings forty or fifty mail-clad warriors with gold-eye shields to Lik-Rifa’s departing host</h2><p>Sterkur brings forty or fifty mail-clad warriors with gold-eye shields to Lik-Rifa’s departing host. Leif introduces himself as new to the crew. Sterkur cites coin/fame/victory, while Leif seeks the Bloodsworn’s death. Ilska recognises Sterkur and invites them in after Drekr welcomes them; Lik-Rifa promises reward for killing the wolf. This is current service accepted, distinct from the earlier Ulaz employment, with no payment or narrated oath rite.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>Varg recognises the golden scrollwork-eye shields among the attacking host</h2><p>Varg recognises the golden scrollwork-eye shields among the attacking host. Svik names Leif and Sterkur, and both he and Varg voice unfulfilled vengeance. No individual duel or final fate follows in this chapter.</p></details><details><summary>The Fury of the Gods · 73</summary><h2>Brák’s hostages and Einar’s fall</h2><p>Golden-eye shields identify the warriors arriving behind Leif and Sterkur, who spread around Røkia/Edel/Æsa and separate Varg’s companions from Einar/Svik. No exact total strength or final outcome is established.</p></details></noscript>
