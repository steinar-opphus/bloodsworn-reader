      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 25</summary><h2>Introduction</h2><p>Iva enters with Jaromir, wearing an iron thrall-collar, her shaved head and arms covered in coiling tattoos. Jaromir names her and the narration calls her a Seiðr-woman. She is not merged with the previously unnamed hooded arrival solely from shared traits.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>Introduction in B02-C025</h2><p>Her spoken mist extinguishes the rune-fire. She stamps and speaks to open a fissure towards Skalk, and later rusts an iron restraint to free Vol from the table. These demonstrated acts do not establish a complete system of powers or clarify every restraint’s status.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>Introduction in B02-C025</h2><p>She handles the badly burned Taras by the hand, later promising to make him better once away. She lifts Vol over Jaromir’s saddle with surprising strength and then leads Taras out. His healing is promised, not shown.</p></details><details><summary>The Hunger of the Gods · 66</summary><h2>Sulich&#x27;s lineage and the ambush</h2><p>She rides beside a huge collared shaved-haired man with blue-black-purple skin, herself collared and tattooed on head and arms. Jaromir names her and orders her forward to clear the Bloodsworn from the road; no spell is shown before the ending.</p></details><details><summary>The Hunger of the Gods · 68</summary><h2>The cavalry charge and the shield wall</h2><p>Her opening fire spell is stopped by arrows in the back and she falls into the huge thrall&#x27;s arms. He places her beneath trees and charges in distress, calling out that the company hurt her. No independent death confirmation for her is supplied in the chapter.</p></details><details><summary>The Fury of the Gods · 1</summary><h2>After the battle at Valdai</h2><p>She survives the arrow wounds and lies bandaged, pale and sweating in the gate tower, protected by Taras. Her shaved scalp and tattoos extending across her torso to her neck and jaw are visible. She warns of Rurik&#x27;s arrival without specifying when he may come.</p></details><details><summary>The Fury of the Gods · 1</summary><h2>After the battle at Valdai</h2><p>Vol removes her thrall-collar and bonds. Iva says she has never been free and promises not to oppose the company again. She asks for sunlight and air; Taras carries her outside, where she smiles up at the sky.</p></details><details><summary>The Fury of the Gods · 21</summary><h2>Vol goes to speak to her after identifying the copied fragments as Raudskinna material</h2><p>Vol goes to speak to her after identifying the copied fragments as Raudskinna material. Iva is seated on a barrel near Sea-Wolf’s mast, wrapped in a cloak. Her reply or participation in any new interpretation is not yet shown.</p></details><details><summary>The Fury of the Gods · 25</summary><h2>She transfers with Taras to Sulich’s knarr before battle</h2><p>She transfers with Taras to Sulich’s knarr before battle. Her voice joins Vol’s as the serpent rises, then in the freezing counterattack. Her explicitly identified ice shard strikes the water, thickening it around the leading drakkar, icing oars and hull until it breaks and sinks. No total enemy casualty count is established.</p></details><details><summary>The Fury of the Gods · 27</summary><h2>She works from the knarr against the attacking ships’ rune-wielders while Vol casts from Sea-Wolf</h2><p>She works from the knarr against the attacking ships’ rune-wielders while Vol casts from Sea-Wolf. Varg sees both looking drained as the decks fill with attackers; the eventual result remains unknown.</p></details><details><summary>The Fury of the Gods · 28</summary><h2>Orlyg joins the sea battle</h2><p>Orka sees the short-haired woman singing with raised arms and blue frost-runes at the centre of the knarr’s defenders, with Taras fighting nearby. This continues Iva’s established position and casting in the same battle, rather than introducing another unnamed woman.</p></details><details><summary>The Fury of the Gods · 30</summary><h2>She climbs from the knarr to Sea-Wolf beside Taras, followed by Sulich and Orlyg</h2><p>She climbs from the knarr to Sea-Wolf beside Taras, followed by Sulich and Orlyg. Her frost-vines suspend and bind the unshielded caster, silencing his mouth and snuffing his new runes. Vol thanks her by name. She later releases the ankle binding when the mother serpent takes him, leaving his arms and mouth still bound.</p></details><details><summary>The Fury of the Gods · 32</summary><h2>She rests on a barrel as Taras brings water after the battle</h2><p>She rests on a barrel as Taras brings water after the battle. Glornir refuses Orlyg’s attempt to buy her or Vol, needing a witch on each ship. She later joins the newcomers’ gathering; Glornir requires a choice of collar-as-cover or hidden uncollared gifts before landing, but her individual decision is not shown. Taras says she always tends his wounds.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>She chooses a collar as cover to use gifts openly, expecting need and noting Orlyg saw her casting</h2><p>She chooses a collar as cover to use gifts openly, expecting need and noting Orlyg saw her casting. Her condition is not being sold to him; Glornir promises that and gives collar/key access, asking whether old memories make the decision hard. She says she knows herself free. She later lands in an iron collar, without a narrated new binding or real sale.</p></details><details><summary>The Fury of the Gods · 49</summary><h2>Building defences at the bridge gate</h2><p>Elvar’s viewpoint calls her a Bloodsworn thrall, consistent with the public collar cover rather than a fresh enslavement. She joins Uspa and Vol at the gate, adding a pale-fire rune-covered hand to the channel while chanting. No new sale, coercive rite or solitary mastery of the ward is shown.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>She removes her own cover collar with her key beside Vol and Taras</h2><p>She removes her own cover collar with her key beside Vol and Taras. Glornir’s Never makes their real freedom known to Elvar. This is public removal of a disguise, not first emancipation or a new sale.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>Freedom and the approaching army</h2><p>Vol, Uspa and Iva combine spoken invocations and runes over the bridge defenders as enemy red/blue runes descend. The spells collide and burst in heat and colour. This successful interception is observed, without proving immunity to every later spell or naming a universal magical limit.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>Vol, Uspa and Iva confer behind the shield wall before the clash</h2><p>Vol, Uspa and Iva confer behind the shield wall before the clash. Later an incantation from behind the line is followed by a wind dispersing the spertus cloud, but that passage does not individually identify its caster; no specific casting is assigned to her on that basis alone.</p></details><details><summary>The Fury of the Gods · 63</summary><h2>The stone doors and the retreat inside</h2><p>Vol, Uspa and Iva are explicitly seen using rune-spells against the hyrndur inside the hall after the doors close. This named interior action does not retroactively identify the unassigned earlier wind or fire-net casters.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>Taras carries her in his arms among the fleeing survivors</h2><p>Taras carries her in his arms among the fleeing survivors. No specific new injury or unconsciousness is stated; the group follows Ulfrir into the tunnel.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>Taras carries her from the tunnel with a blood-crusted forehead gash now explicitly visible</h2><p>Taras carries her from the tunnel with a blood-crusted forehead gash now explicitly visible. The location is forehead, without a stated side, cause, severity diagnosis or unconsciousness assertion.</p></details><details><summary>The Fury of the Gods · 81</summary><h2>She is directly active in Seiðr combat with an unnamed fair-haired Galdurwoman and red-rune staff</h2><p>She is directly active in Seiðr combat with an unnamed fair-haired Galdurwoman and red-rune staff. This shows functional fighting after her forehead gash, without a full medical healing claim or named identity for the opponent.</p></details><details><summary>The Fury of the Gods · 84</summary><h2>The fair-haired caster is now explicitly Silrið</h2><p>The fair-haired caster is now explicitly Silrið. Their fire/ice exchange includes a rolling ice wheel caught in flaming rune-vines; Iva then opens a fissure, drops Silrið into it and closes/buries her until the last gasp fades. She rejoins Taras, who rests his head on her shoulder. Her own full medical healing is not asserted.</p></details><details><summary>The Fury of the Gods · 89</summary><h2>After farewells she leaves toward the forest with limping Taras</h2><p>After farewells she leaves toward the forest with limping Taras. A later Taras reference is a preserved continuity issue, not evidence she rejoins the fight herself.</p></details><details><summary>The Fury of the Gods · 90</summary><h2>She arrives with Taras/Hrung, joins Uspa/Vol and helps bind Lik-Rifa in fire/ice ropes</h2><p>She arrives with Taras/Hrung, joins Uspa/Vol and helps bind Lik-Rifa in fire/ice ropes. Those restraints break when the dragon shakes off her attackers; no general invulnerability or full healing is inferred.</p></details><details><summary>The Fury of the Gods · 92</summary><h2>At the courtyard discussion Taras says peace sounds good and Iva pats his knee and agrees</h2><p>At the courtyard discussion Taras says peace sounds good and Iva pats his knee and agrees. They join the company’s eventual agreement to a permanent home, without a new oath or marriage being declared.</p></details><details><summary>Illustration · The Fury of the Gods · 1</summary><p><a href="assets/7ad7e1c9d5b97b.jpg">Open noncanonical illustration</a></p><p>Freedom in the courtyard.</p></details><details><summary>Illustration · The Fury of the Gods · 84</summary><p><a href="assets/9a074386763863.jpg">Open noncanonical illustration</a></p><p>Iva’s ice wheel meeting Silrið’s flaming rune-vines.</p></details><details><summary>Illustration · The Hunger of the Gods · 25</summary><p><a href="assets/4052da17bd5fb2.jpg">Open noncanonical illustration</a></p><p>Iva with her hood thrown back during the workroom assault.</p></details><details><summary>Illustration · The Fury of the Gods · 84</summary><p><a href="assets/840bb77c043759.jpg">Open noncanonical illustration</a></p><p>Taras resting his head on Iva’s shoulder after the fight.</p></details><details><summary>Illustration · The Fury of the Gods · 25</summary><p><a href="assets/fe5a2430b0dacf.jpg">Open noncanonical illustration</a></p><p>The early counterspell freezing the lead drakkar’s red ward, before the hull breaks.</p></details><details><summary>Illustration · The Fury of the Gods · 49</summary><p><a href="assets/b260375c8f69d9.jpg">Open noncanonical illustration</a></p><p>The combined working at the river gate.</p></details><details><summary>Illustration · The Fury of the Gods · 56</summary><p><a href="assets/9d4fd81ccba6d4.jpg">Open noncanonical illustration</a></p><p>The three casters’ combined defence.</p></details></noscript>
