      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 40</summary><h2>Councils and secrets in Wolfdales</h2><p>Elvar occupies the oversized high-arched, wolf-carved chair as the hall’s seat of power, keeping Ulfrir standing beside her.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>Salvage and a choice about freedom</h2><p>Uspa carves four sharp-angled runes on an arm for Ulfrir’s justice oath: Líf, Dauða, blóð svarið and Kvöl, named with life/death/binding/torment meanings. Their blood fills the carvings then rises into the strand that scars Ulfrir. The chair serves as the rite’s medium; exact material, glyphs, later residual power and a universal reuse mechanism are not established.</p></details><details><summary>The Fury of the Gods · 65</summary><h2>Losses and plans after the retreat</h2><p>Ulfrir sits in his own chair again while Elvar takes a newly brought, smaller and more comfortable one on the dais. She considers continuing the symbolic occupation unnecessary after freedom, trusting the oath instead. No new carving or magic test is performed.</p></details><details><summary>Illustration · The Fury of the Gods · 54</summary><p><a href="assets/7ac9be53d16b41.jpg">Open noncanonical illustration</a></p><p>Noncanonical detail of the four carvings prepared for the oath; the glyph shapes are artistic.</p></details></noscript>
