      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 5</summary><h2>Introduction</h2><p>Kráka is described as a Tainted thrall. She chants magic to keep sea vaesen away from the drakkar.</p></details><details><summary>The Shadow of the Gods · 5</summary><h2>Appearance</h2><p>In chapter 5, her black hair is plastered to her head by sweat and seawater as she slumps across the ship&#x27;s prow.</p></details><details><summary>The Shadow of the Gods · 5</summary><h2>Story and connections</h2><p>She wears a thrall-collar and chain. A ship-guard kicks her.</p></details><details><summary>The Shadow of the Gods · 9</summary><h2>The serpent and the captive family</h2><p>Kráka says she was asleep when the serpent struck. The narrator says Seiðr-song takes a toll.</p></details><details><summary>The Shadow of the Gods · 9</summary><h2>The serpent and the captive family</h2><p>In that chapter 9 aftermath, her face is grey with deep-sunken lines, likened to melted wax; this is a description of her condition in that scene. Her hands are long and bony when she strokes the troll antler.</p></details><details><summary>The Shadow of the Gods · 9</summary><h2>The serpent and the captive family</h2><p>Agnar gives her a troll antler, describing it as power for the journey. Her collar glows red as he speaks in the Galdur-tongue.</p></details><details><summary>The Shadow of the Gods · 9</summary><h2>The serpent and the captive family</h2><p>She resumes her serpent-song as the ship turns south.</p></details><details><summary>The Shadow of the Gods · 14</summary><h2>Blood memories at the oath stone</h2><p>Kráka identifies the surviving oath stone. She says the gods are the parents of the Tainted.</p></details><details><summary>The Shadow of the Gods · 27</summary><h2>A raid and a stolen child</h2><p>Kráka tends the wounded Biórr after the raid.</p></details><details><summary>The Shadow of the Gods · 29</summary><h2>The hidden book and the road ahead</h2><p>Kráka describes the Guðfalla as a song in the Tainted&#x27;s blood and says their ancestors fell at the tree. Kráka describes the blóð svarið as a binding made with blood, runes and words of power, with death for breaking it.</p></details><details><summary>The Shadow of the Gods · 52</summary><h2>Betrayal and the dragon&#x27;s release</h2><p>Biórr removes her thrall-collar along with Ilmur’s after Agnar’s death.</p></details><details><summary>The Hunger of the Gods · 5</summary><h2>A welcome among the Raven-Feeders</h2><p>At the Raven-Feeders’ camp, Kráka wears her black hair loose; blue swirling tattoos cross one cheek into her hair. She reports receiving food and warm clothing, and draws attention to the children’s continuing collars and altered condition.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>She and Ilmur help organise the children, who still move slowly and stiffly. She holds Bjarn’s hand while they are brought before Lik-Rifa; Biórr is glad she is there, but that feeling does not establish that she rescues him.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>Ilska and the dragon-born subsequently remove all the children’s collars while chanting. This collective action does not show Kráka freeing them herself, nor Bjarn leaving the camp.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>Revna identifies her as the Battle-Grim’s witch but doubts she could open god-bridges. Myrk replies that Kráka has joined her company and that Uspa opened the bridge. These are their statements; the bridge feat is not reassigned to Kráka.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>She rides with Bjarn and the splinted Breca, then sits with children around a fire. She says some are back to themselves and others are not, hoping that Seiðr effects will fade. Her explanation is tentative. She warns Breca that escape talk could cost his other hand; the warning is not a second injury.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>She points out Ilmur’s company with Brák and Drekr. At Breca’s report of wolf and bear her eyes widen, and she squeezes his unbroken hand. This reaction does not itself explain every bloodline mechanism.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>Nastrandir revealed in the snow</h2><p>She agrees Bjarn is more himself and thinks the Seiðr is gone, while rubbing her arm through thick wool and linen. The gesture has no stated cause and is not diagnosed as a new wound or oath punishment. She uses a seax to open the barrel and distributes apples and cheese.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>Nastrandir revealed in the snow</h2><p>Her exchanges with Storolf include hints of smiles, a playful kick and his imitation of boar tusking. He jokingly assigns her Snaka’s blood; this retains the speaker rather than becoming a new independently tested lineage fact. The rapport is not a proven romance. At the tennúr return she says they have found something, but the report itself is not decoded.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>During the otherwise cheerful feast she leans close and whispers in Bjarn’s ear. Biórr sees them as the only two not smiling, with Bjarn staring seriously at his hands. Their words and purpose remain undisclosed; no new injury, diagnosis or plan is established.</p></details><details><summary>The Hunger of the Gods · 58</summary><h2>Biórr&#x27;s rat senses and a captured message</h2><p>She tries to take Bjarn back to Uspa, exposing scars, raw wounds and blisters which she attributes to the blóð svarið. She says the vow accepted Bjarn&#x27;s earlier immobility but now compels escape. Biórr permits departure and stages his own assault with her help.</p></details><details><summary>The Hunger of the Gods · 58</summary><h2>Biórr&#x27;s rat senses and a captured message</h2><p>Recaptured, bound and wounded at the scalp, she names Uspa as the oath-maker. Rotta says there is no escape except death. Bjarn is released, but Ilska orders Biórr to kill her and he spears her throat. This chapter ends at that strike rather than a separately observed death.</p></details><details><summary>The Hunger of the Gods · 62</summary><h2>The army departs for Svelgarth</h2><p>Her blood remains on the floor and the narrator describes Biórr as her executioner. This retrospective confirmation advances the earlier chapter&#x27;s ending at the throat strike; no final exchange with Bjarn or Uspa is shown.</p></details><details><summary>Illustration · The Shadow of the Gods · 53</summary><p><a href="assets/7b23d6f8ef5143.jpg">Open noncanonical illustration</a></p><p>Kráka aboard the Wave-Jarl during the early voyage.</p></details></noscript>
