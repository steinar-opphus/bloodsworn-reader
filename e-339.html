      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 17</summary><h2>Appearance</h2><p>Beside Orlyg he has dark hair braided with animal skulls and carries a staff. Red runes traced with it form a flaming shield that burns an attacking skraeling. He later protects Orlyg during retreat, boards the surviving ship and casts runes at pursuing vaesen. No personal name is given; his role resembles the unnamed companion at Darl but no separate personal identification is asserted.</p></details><details><summary>The Fury of the Gods · 22</summary><h2>The previously unnamed Galdurman is explicitly named Gösta in the continuous shipboard group</h2><p>The previously unnamed Galdurman is explicitly named Gösta in the continuous shipboard group. He is slim, dark-haired, with lower-jaw tattoos and small bones braided into his hair, supplementing the animal-skull braids previously described. His name is first learned here, not imposed on the earlier chapter summary.</p></details><details><summary>The Fury of the Gods · 22</summary><h2>The previously unnamed Galdurman is explicitly named Gösta in the continuous shipboard group</h2><p>He distinguishes Seiðr-witches’ Snaka lineage from dragon-born power, presuming the latter comes from Lik-Rifa’s weaker blood; the comparison remains his claim. At the reported destruction of Svelgarth’s tower he turns pale. He lays out joining, fighting or fleeing and then suggests Störr as an ally, unaware of the change at Snakavik. Orka’s account leads Orlyg to order that destination.</p></details><details><summary>The Fury of the Gods · 28</summary><h2>At Orlyg’s order he prepares rune-fire with his staff and boards the stern attacker</h2><p>At Orlyg’s order he prepares rune-fire with his staff and boards the stern attacker. His chant forms a burning net that constricts two guards. The opposing caster’s protection flickers, creating the opening for Dagrun’s spear. The guards’ burning is the spell’s observed local effect, not a universal rule for every rune-net.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>Arrival at the wolf-god’s hall</h2><p>He accompanies Orlyg and Dagrun on the approach from the riverbank, their followers joining the Bloodsworn procession. No new spell or exact private exchange is shown.</p></details><details><summary>Illustration · The Fury of the Gods · 28</summary><p><a href="assets/6673c753c8b839.jpg">Open noncanonical illustration</a></p><p>Gösta’s net forming before the guards are struck.</p></details><details><summary>Illustration · The Fury of the Gods · 22</summary><p><a href="assets/e06e9438bb0882.jpg">Open noncanonical illustration</a></p><p>Orlyg’s stern discussion on the way to the sea.</p></details><details><summary>Illustration · The Fury of the Gods · 17</summary><p><a href="assets/2e7589a4aa6d26.jpg">Open noncanonical illustration</a></p><p>The unnamed Galdurman.</p></details></noscript>
