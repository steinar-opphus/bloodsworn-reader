      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 18</summary><h2>New weapons and an attack at the docks</h2><p>The Sea-Wolf is the Bloodsworn’s ship, moored at Liga’s docks in B01-C018. Jaromir threatens the crew’s ship while torch-bearing riders wait at the pier entrance and figures move aboard it. Glornir refuses to surrender Sulich, and the dockside confrontation turns into a battle.</p></details><details><summary>The Shadow of the Gods · 20</summary><h2>Layout and departure from Liga</h2><p>Sea-chests store gear and serve as rowing seats. A shield rack runs along the top-rail, and Varg opens a shuttered oar-hole to row from his chest. Einar locks the mast in place and commands sixty oars.</p></details><details><summary>The Shadow of the Gods · 20</summary><h2>Layout and departure from Liga</h2><p>The sail remains furled as the mast is raised. Its woollen fabric is directly described.</p></details><details><summary>The Shadow of the Gods · 20</summary><h2>Layout and departure from Liga</h2><p>Skalk and two of Helka’s warriors join the crew for the new assignment; Glornir orders them to row. Vol stands at the prow and Glornir takes the steering oar at the stern. The ship casts off from Liga and steers south and west through the fjord. Glornir describes their work as finding and killing an unidentified problem eating Helka’s people in the north.</p></details><details><summary>The Hunger of the Gods · 7</summary><h2>An offer to return to the Bloodsworn</h2><p>Glornir says the ship is waiting on the River Slågen with an oar-light crew. He sends Edel and others back to it, with the mine lying along their route.</p></details><details><summary>The Hunger of the Gods · 19</summary><h2>Scouting beyond the repaired bridge</h2><p>Outside Darl, Svik says the ship will not yet be close and Glornir agrees. Glornir refuses to wait, intending to recover Vol and then follow the river south to meet it. No reunion with the ship occurs here.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>Edel says she has just docked at Liga when the returning Bloodsworn arrive on Helka’s loaned drakkar. Logur orders provisioning: food, drink, cheese, nails and rivets, thread, leather cord, walrus rope and a folded wool sail are brought aboard. Varg stores his mail wrapped in sealskin, while Sulich accepts the druzhina kit retrieved from Varg’s chest.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>The children help stow goods, and Refna Strong-Hands takes an oar-chest. Røkia and Sulich fit the steering oar; Einar and Ingmar push off with spears. Glornir steers as the crew rows from the pier in pursuit towards Iskidan. The chapter ends in the fjord before an ocean crossing is completed.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>Two days into the open-sea passage, the crew works pine-tarred ropes while Glornir directs tacking against a strong south-easterly wind. Varg remains sick. Røkia estimates landfall in a day or a day and a half, but no arrival is shown.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>Røkia recounts an earlier battle aboard the ship: three longships attacked as the company rowed out of a bay, after which Orka and Thorkel were missing. Her account of searches and presumed loss is historical testimony, not a second current engagement.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>Sulich and Røkia notice distant sails to the south. Glornir passes the tiller to Æsa and orders weapons. Neither the distant vessels nor their purpose is identified, and no fight occurs before the chapter ends.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>The boarding battle at sea</h2><p>Two smaller longships approach with the wind behind them, prompting Glornir to furl sail and prepare instead of fleeing into the wind. The opponents have perhaps thirty to forty oars apiece. They lower sail and row to attack both flanks; the Sea-Wolf is larger and sits higher as they grapple alongside.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>The boarding battle at sea</h2><p>The crew form back-to-back lines in the deck’s centre with children sheltered between them. Arrows are stopped by shields, hooks catch on thwarts and silent boarders pour over the rail. Varg’s battle ends on a mound of corpses on the blood-slick deck, but neither enemy vessel’s fate nor the ship’s final casualty accounting is supplied.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>After the boarding fight the dead are thrown overboard and blood washed from the deck. One enemy drakkar escapes; Glornir orders pursuit and steers as the company row from before noon towards sunset. Islands shelter them from the wind and waves as they close to an estimated three or four hundred paces.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>The fugitive beaches in a bay. Einar drops the Sea-Wolf’s anchor stone and orders the children to remain while the warriors land. Røkia later requests water and linen from the ship for Einar’s injuries. The chapter does not show their delivery or departure from the island.</p></details><details><summary>The Fury of the Gods · 14</summary><h2>The ship waits at the end of a long pier with mast raised, sail furled and Vol at the stern</h2><p>The ship waits at the end of a long pier with mast raised, sail furled and Vol at the stern. The rescued companions and Glornir’s party board while Sulich and Kesha take the adjoining horse transport. Røkia frees the mooring, Glornir steers and Taras beats rowing time on a shield.</p></details><details><summary>The Fury of the Gods · 14</summary><h2>The ship waits at the end of a long pier with mast raised, sail furled and Vol at the stern</h2><p>Both vessels row beyond the arrows of mounted druzhina, whose return orders Glornir ignores. They pass the bull and scorpion statues at sunset. Sea-Wolf then sails with the south-westerly wind; five hawk-marked longships appear behind, identified by Svik as Rurik’s and suspected of pursuit.</p></details><details><summary>The Fury of the Gods · 21</summary><h2>Reunion in the island harbour</h2><p>Threading Iskidan’s northern islands to evade the five pursuers, the ship returns to a sandy natural harbour and the island huts. Taras beats rowing time and handles the anchor stone. Einar, Æsa and the children rejoin, then the company leaves quickly. Taras and Einar share the time-beater’s seat by agreement, without a formal new office.</p></details><details><summary>The Fury of the Gods · 21</summary><h2>Reunion in the island harbour</h2><p>Edel gives the Raudskinna copies to Vol aboard; Iva sits near the mast. The ship leaves island shelter for rougher open sea with Sulich’s knarr behind. Five longships reappear from the channels, and Svik concludes a fight is necessary, with no engagement shown.</p></details><details><summary>The Fury of the Gods · 25</summary><h2>After a day at sea, the ship is lashed to the slower knarr for a joint stand</h2><p>After a day at sea, the ship is lashed to the slower knarr for a joint stand. Some outer oars keep both prows facing the attackers while the rest prepare. Einar takes the prow, Vol chants nearby and Iva/Taras transfer to the companion vessel. The enemy’s first drakkar is sunk by ice magic after arrows strike the shields; the other four are not resolved here.</p></details><details><summary>The Fury of the Gods · 27</summary><h2>Enemy ships surround and grapple the lashed vessels</h2><p>Enemy ships surround and grapple the lashed vessels. A portside attacker is counterboarded and its deck cleared, but fighting remains at Sea-Wolf’s prow and stern and on the knarr. Vol’s rune battle continues; Einar, Glornir and Varg receive injuries. Another drakkar rows towards the ship before the chapter ends, without identification or a resolved outcome.</p></details><details><summary>The Fury of the Gods · 29</summary><h2>The fight aboard the stern drakkar</h2><p>The company counterboards the stern attacker, leaving its rune-dome intact, then returns to defend Vol. Orka’s rescue group reaches Einar and Svik, but two male casters converge on Vol. Their joint strike against her frost protection unleashes heat and steam across the deck and knocks the Bloodsworn down; no final ship damage or battle result is supplied.</p></details><details><summary>The Fury of the Gods · 30</summary><h2>The casters and the mother serpent</h2><p>Vol’s shield survives the explosion; the two male casters are overcome by ice, Orka’s spear, the ravens and Iva’s bindings. A mother serpent boards, receives the bound caster and leaves with most young while one remains on Vol’s arm. Grok and Kló land and Vesli returns. The final enemy ship retreats south and fighting ceases into quiet; no full damage or casualty inventory is supplied.</p></details><details><summary>The Fury of the Gods · 32</summary><h2>Debts, kinship and the voyage onward</h2><p>Crews clear enemy corpses, tend wounds and repair damage before eight Bloodsworn and ten of Sulich’s kin are buried at sea with Glornir’s words. Sulich brings his survivors and Iva/Taras aboard to hear the secrecy choices, then Glornir orders preparation for Snakavik. No exact damage inventory or ship departure is described for Sea-Wolf before the ending.</p></details><details><summary>The Fury of the Gods · 37</summary><h2>Life aboard Sea-Wolf</h2><p>It follows the coast in rain with Orlyg’s sail ahead, then anchors with Sulich’s knarr at a small south-western cove overnight. A few guards stay aboard under lit awnings while most crews gather on shore for Varg’s completed oath. No exact cove name or onward arrival is supplied.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>It draws beside the knarr for collar choices/disguise before rowing hard to Wolfdales</h2><p>It draws beside the knarr for collar choices/disguise before rowing hard to Wolfdales. The crews then moor and disembark at a stone pier while the ravens leave its rail to follow. No collision, sinking or new damage is shown.</p></details><details><summary>Illustration · The Shadow of the Gods · 53</summary><p><a href="assets/1ee925ff73d52b.jpg">Open noncanonical illustration</a></p><p>The Sea-Wolf leaving the fjord under oars.</p></details><details><summary>Illustration · The Fury of the Gods · 14</summary><p><a href="assets/298e3ec301f037.jpg">Open noncanonical illustration</a></p><p>The two vessels rowing beyond the pier’s arrows.</p></details></noscript>
