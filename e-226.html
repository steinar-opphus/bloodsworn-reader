      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 33</summary><h2>Introduction</h2><p>Hrolf is a tall, hard-looking Grimholt warrior with cold eyes and scarred hands who curses Guðvarr’s rowing. He is later seen imprisoned with Skapti, asks for release during the tower attack and remains behind as Guðvarr leaves. The later open cell does not establish his death or explain how he left.</p></details><details><summary>The Hunger of the Gods · 46</summary><h2>A secret meeting before dawn</h2><p>Chapter 46 directly establishes him alive: he and Skapti enter The Dead Drengr, pull back their hoods and are recognised by Guðvarr. Rog calls them Hakon’s friends. Their release route, the other former prisoners and their next conversation remain unshown.</p></details><details><summary>The Hunger of the Gods · 48</summary><h2>Flight from the breakfast table</h2><p>He closes on Guðvarr from one side of the canal, then brings a small rowing boat to carry the other pursuers across. He and Kalv follow Guðvarr uphill to the tower, at one point fewer than twenty paces behind.</p></details><details><summary>The Hunger of the Gods · 48</summary><h2>Flight from the breakfast table</h2><p>After a blow drops Guðvarr with a bleeding head, Hrolf retrieves a hand-axe with a bloody iron poll and jokes about his poor throwing. An unnamed rasping voice urges him on. He raises the axe but is killed by a spear before striking: Guðvarr sees his lifeless eyes, skewered body and spreading blood. The spear thrower is unnamed. This is a new confirmed death after his earlier survival, without explaining how he left the tower cell.</p></details><details><summary>Illustration · The Hunger of the Gods · 33</summary><p><a href="assets/2a1f5b7d1e3cce.jpg">Open noncanonical illustration</a></p><p>Hrolf in a full-length study of his first described appearance.</p></details></noscript>
