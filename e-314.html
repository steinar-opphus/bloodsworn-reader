      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 6</summary><h2>The Fury of the Gods - chapter 6</h2><p>A black-skinned woman among Sulich&#x27;s freed kin, she says Jaromir and Rurik intended to use their Tainted siblings as weapons in an invasion of Vigrið to impress their shared father, Kirill. Fearing Rurik, she urges departure; Sulich promises to leave at sunrise and assures her of safety that night, but she remains unconvinced.</p></details><details><summary>The Fury of the Gods · 14</summary><h2>She attacks Leif in the warehouse before Sterkur knocks her aside with his shield and takes him away</h2><p>She attacks Leif in the warehouse before Sterkur knocks her aside with his shield and takes him away. She survives the fight, withdraws with Sulich and boards the horse transport with him, escaping Ulaz behind Sea-Wolf.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>Elvar Chainbreaker and the hillside stand</h2><p>She helps Sulich pull a handcart of bundled arrows from the hall to his waiting druzhina, who then form behind the shield wall.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>The survivors’ camp and reunion</h2><p>She rides out beside Sulich with the battered mounted survivors, their mostly empty quivers and reduced numbers visible. No exact personal injury or individual kill count is supplied.</p></details></noscript>
