      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 45</summary><h2>Waking among the wounded</h2><p>Varg recalls saga-tales describing Rotta inflaming Orna and Lik-Rifa’s feud and Orna imprisoning him beneath Frang’s Falls with enchanted venomous serpents. Torvik reports Vol’s belief that the excavated catacomb is Rotta’s chamber; that identification is not independent proof of the saga.</p></details><details><summary>The Hunger of the Gods · 15</summary><h2>The search through Rotta&#x27;s chamber</h2><p>Gunnar and Revna recount saga-tales that Rotta murdered and flayed Valkyrie, daughter of Orna and Ulfrir, tried to blame Lik-Rifa and fled when exposed. Gunnar says he wrote Raudskinna on Valkyrie’s skin. These details remain attributed lore.</p></details><details><summary>The Hunger of the Gods · 15</summary><h2>The search through Rotta&#x27;s chamber</h2><p>The party observes a scarred slab with broken manacles. Gunnar reports Vol’s identification of it as Rotta’s punishment place, and Revna describes serpent venom as the sentence. She asks how he escaped and notes no appearance in her tales of Guðfalla; Orka observes that he is absent. Neither escape mechanism nor present fate is established.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>Skuld says Rotta warned the other gods that Lik-Rifa was secretly building a vaesen army to overwhelm them. This is her historical account; it does not establish his present whereabouts, restore him to a current scene or resolve his escape from punishment.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>Hearing Halja describe the buried slab, collar and chains, Ulfrir identifies the site as Rotta’s chamber. He says they hunted Rotta for what he did to Valkyrie, claims he hammered the chains into the rock and says he smiled when serpent venom burned him. This is first-person historical testimony beside the earlier saga accounts. It does not supply Rotta’s escape method or present fate.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>Halja tentatively identifies the copied Galdrabok pages as Raudskinna material; Uspa infers a connection to the magic that freed Lik-Rifa. Copies, original and the other Galdrabok records remain distinct.</p></details><details><summary>The Hunger of the Gods · 42</summary><h2>Inside Nastrandir&#x27;s great hall</h2><p>His present survival and whereabouts are now directly established: in an occupied chamber within Nastrandir, a grinning man welcomes Lik-Rifa home as sister and she names him Rotta. He rises from a bench near the doorway and approaches with arms spread. This named encounter adds present evidence to the earlier attributed punishment accounts; it does not disclose his escape or intervening journey.</p></details><details><summary>The Hunger of the Gods · 42</summary><h2>Inside Nastrandir&#x27;s great hall</h2><p>Biórr sees an exceptionally tall, lean man with long brown hair oiled into neat braids fixed by a long silver pin. His beard is close-cropped and oiled, his eyes dark and bright, and his slightly stretched face strikingly handsome to Biórr. Tooth tips project beneath a wide mouth. Exact age, skin tone, beard colour, clothing and an animal form are not supplied here.</p></details><details><summary>The Hunger of the Gods · 42</summary><h2>Inside Nastrandir&#x27;s great hall</h2><p>Rotta says he has looked after the hall while his sister was away and hopes she does not mind. Food, attendants and musicians are observed in the chamber, but his role in arranging them, the duration of his stay, his purpose and Lik-Rifa’s subsequent response remain unestablished.</p></details><details><summary>The Hunger of the Gods · 43</summary><h2>The feast and the shield-dance</h2><p>Guðvarr privately compares his shield-dance surefootedness to the dead god Rotta. This is his belief and figurative comparison, not a new death or correction of the directly observed living Rotta in Nastrandir in chapter 42. The reader’s knowledge and Guðvarr’s knowledge remain distinct.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>His scene clothing is a pale blue tablet-weave-trimmed tunic, with seax, hand-axe and gold and silver arm rings. Pressed by Lik-Rifa, he says he escaped during Guðfalla and stayed away through fear of recapture and of Skuld, Urd and Verdani. This supplies his claimed timing and reasons, not the escape mechanism.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>Afhjúpa and a hand gesture make his face shimmer and change: beard withering, cheeks sinking, holes and ragged tears weeping pus, jaw shrinking and lips drooping. He attributes the damage to Orna and Ulfrir’s enchanted serpent venom and claims daily pain. Leyna and another gesture restore his handsome bearded appearance. The change does not demonstrate that the underlying damage is healed.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>Lik-Rifa accuses him of flaying the gaolers’ sister and writing his Galdrabok with her blood; he acknowledges the grounds for their hatred. He hears her news of Ulfrir’s survival and pledges to stand with her against him. His claimed preparation of a welcome leads to an embrace that Lik-Rifa slowly returns, with mutual statements of missing one another. Future loyalty and success remain untested.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>At the feast he places a hand on Biórr’s shoulder, says he feels his blood in the man and offers sympathy for inherited persecution. Biórr feels power and friendship and responds tearfully; Rotta promises to make things right. His response to an unspoken title question and listening-like pause are particular ambiguous interactions, not proof of unrestricted telepathy or benevolence.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>He affirms Lik-Rifa’s intention to kill Ulfrir and explains her final song as a summons to the vaesen she created and bred. No reinforcements arrive within the chapter.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>He enters training armed with two seaxes, an axe and a sword and urges ruthless attacks on unarmoured targets. Biórr feels his rat stir and restrains it; children practise more aggressively afterward, without an established magical cause. Rotta praises the teaching and claps Biórr’s shoulder, making him proud.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>He stands at Lik-Rifa’s left during the council and she takes his hand while celebrating his return. He asks for the plan and hears her intended attack order against Orlyg, Helka and Störr before finding and killing Ulfrir. No new conquest or attack by him is shown.</p></details><details><summary>The Hunger of the Gods · 58</summary><h2>Biórr&#x27;s rat senses and a captured message</h2><p>He privately warns Biórr about loyalty, then oversees the fugitives&#x27; judgment. He recognises Kráka&#x27;s blóð svarið and says quick death is her only escape. His nose and incisors change as he subdues Breca; he tells the boy to control his beast and has Bjarn released. A later internal voice urging Biórr to kill is associated with his stare, without an explained general mechanism.</p></details><details><summary>The Hunger of the Gods · 62</summary><h2>The army departs for Svelgarth</h2><p>He remains on the serpent throne while the army prepares to leave. On Myrk&#x27;s arrival he argues against killing Breca, favouring live bait for Orka. This is a trapping rationale, not a completed encounter.</p></details><details><summary>The Hunger of the Gods · 75</summary><h2>The rescuers pursued</h2><p>He returns with warriors and skraeling to overpower Gunnar, holds him under a spear and orders disarmament and kneeling, then moves towards Orka and Storolf. He has not yet resolved that confrontation on-page.</p></details><details><summary>The Hunger of the Gods · 76</summary><h2>Captives before Rotta</h2><p>He identifies Orka as Ulfrir&#x27;s child, scents his brother and coerces her through Breca. After Spert&#x27;s black-cloud attack and a spear through his chest he grows into a longship-sized and still-expanding rat, scattering the camp. No god death or final recovery is shown.</p></details><details><summary>The Fury of the Gods · 4</summary><h2>A prisoner outside Svelgarth</h2><p>Back in human form after Spert&#x27;s attack, he remains alive despite facial sores and a chest stain from Halja&#x27;s spear. Outside Svelgarth, he assaults captive Orka while seeking Ulfrir. He stops Myrk killing her because he wants information, then allows further abuse under an order of restraint. He plans to recapture Breca and exploit her concern for him; no such recapture is established.</p></details><details><summary>The Fury of the Gods · 5</summary><h2>The dead and the choice of revenge</h2><p>He wants Breca found dead or alive, but refuses Brák&#x27;s proposal to kill the other recaptured children, citing their god-blood and military value. He assigns Biórr to the children, Orka and Myrk&#x27;s prisoners, explaining that Orka may help locate Ulfrir before his power consolidates. He orders the camp to prepare for Darl, south-west, to join his sister; no arrival is shown.</p></details><details><summary>The Fury of the Gods · 11</summary><h2>An unseen enemy follows the host</h2><p>He praises Biórr&#x27;s use of kindness and claims he has urged his sister to consider it instead of violence. Suspecting a watcher, he sends a tennúr that finds nothing; he guesses Orka&#x27;s crew is near. He then offers Orka conditional freedom and friendship in exchange for Ulfrir&#x27;s location. She refuses. Biórr hears his anger internally while his expression stays calm; no mechanism or universal mind-reading power is established.</p></details><details><summary>The Fury of the Gods · 11</summary><h2>An unseen enemy follows the host</h2><p>Brák returns with four hunters from a former twelve and a moving sack on a spear shaft. Rotta smiles at Orka, but neither the sack&#x27;s identity nor the absent hunters&#x27; fates is revealed.</p></details><details><summary>The Fury of the Gods · 13</summary><h2>The price of Spert’s loyalty</h2><p>He extracts Ulfrir’s Snakavik destination and his company with Elvar’s Battle-Grim by threatening Spert. Myrk suggests Elvar seeks her father’s help, without demonstrating knowledge of the changes at Snakavik. Rotta kills Spert after Orka complies. Her immediate attack wounds his face and arm; he survives to authorise Myrk’s revenge duel, then halts it when strangers emerge from the woods.</p></details><details><summary>The Fury of the Gods · 15</summary><h2>He runs to the head of the column and uses his god-voice to demand protection</h2><p>He runs to the head of the column and uses his god-voice to demand protection. Biórr and Fain respond as a two-deep wall forms. The Berserkir and Úlfhéðnar break it apart while riverborne warriors threaten the rear. His individual subsequent position and the battle’s outcome are not supplied here.</p></details><details><summary>The Fury of the Gods · 17</summary><h2>Escape on Orlyg’s longship</h2><p>With mounted dragon-born he blocks the western woods using ice-blue runes, red runes and emerging vaesen, then drives back the attackers with freezing and burning spells. One longship catches fire. He casts an ice-rune directly at Orka aboard the survivor; she intercepts and discards it with a freezing shield. The ship gains the current and leaves him shouting in frustration. No renewed captivity of Orka or her son occurs.</p></details><details><summary>The Fury of the Gods · 24</summary><h2>Rotta returns to Darl</h2><p>He returns from Svelgarth and orders Biórr to hide the losses from Orlyg’s raid, while declaring himself unable to lie to his sister. He kneels, kisses her hand and reports victory, but she prioritises Ulfrir’s death. Myrk’s body is delivered before they enter the serpent hall.</p></details><details><summary>The Fury of the Gods · 24</summary><h2>Rotta returns to Darl</h2><p>He is frustrated that Lik-Rifa forgot their plan to recover Orna’s heart, claiming even a fragment would strengthen them against Ulfrir. He proposes another unnamed heart-source, which she rejects as too risky. He then reveals Orka’s Snakavik intelligence, winning praise and exposing Biórr as a source on Elvar’s Battle-Grim. No new campaign departure is shown.</p></details><details><summary>The Fury of the Gods · 36</summary><h2>In mail and wolf-pelt cloak he kisses an unnamed woman, mounts and brings Biórr beside him</h2><p>In mail and wolf-pelt cloak he kisses an unnamed woman, mounts and brings Biórr beside him. He explains the landward Snakavik route through unwilling sailing followers and speculates Lik-Rifa fears Ulfrir defeating split forces. He disparages the wolf but later cautions Biórr that a huge host is no guarantee of victory. No identity or lasting relationship is assigned to the kissed woman.</p></details><details><summary>The Fury of the Gods · 41</summary><h2>He reacts in surprise to the news that Ulfrir is Elvar’s thrall and hears the new den location</h2><p>He reacts in surprise to the news that Ulfrir is Elvar’s thrall and hears the new den location. After Lik-Rifa calls the wolf weak, he points out the Iron Wood is close. No completed attack or personal heart-power plan is enacted.</p></details><details><summary>The Fury of the Gods · 43</summary><h2>Orlyg reports his role in Svelgarth and the Nidden fight and describes him as much healed</h2><p>Orlyg reports his role in Svelgarth and the Nidden fight and describes him as much healed. Ulfrir/Skuld initially disbelieve, but Orka confirms direct speech and scent detection. Ulfrir vows his death. The account updates their knowledge without asserting every current injury healed or a fresh fight in this scene.</p></details><details><summary>The Fury of the Gods · 47</summary><h2>Drekr, Lif and the dragon’s counterattack</h2><p>He arrives in giant-rat form, recognised by tapering snout, black eyes and long hairless tail after Guðvarr fears a wolf. Returning human, he reports attacks elsewhere along the line with no Ulfrir seen. He examines the ending tracks and concludes tunnels; this remains his inference, without an opened hatch or measured route.</p></details><details><summary>The Fury of the Gods · 50</summary><h2>The burned wagons and the captive children</h2><p>He questions desertion and siege supplies, orders care for new Tainted and requests any with his blood be brought later, without stating purpose. Munni whispers to him; after keeping Biórr back, Rotta reports the defences and unnamed disaffected friends at Wolfdales. Their suggestion that doors might open if Elvar died remains conditional intelligence, with no named contacts, murder commitment or method. His response to the dragon’s question is only a smile.</p></details><details><summary>The Fury of the Gods · 53</summary><h2>He summons Biórr mentally and rides with new rat-blood guards including Skadi</h2><p>He summons Biórr mentally and rides with new rat-blood guards including Skadi. He explains night marching/burning fires as deception against enemy aerial scouts reported by Munni, admits fear of Ulfrir and cautions that weakness may be feigned. The gods’ dangerous contingency remains unnamed. He stays the execution of Broðir/Silrið by claiming any Elvar death would pass control of Ulfrir to Broðir; no transfer occurs. His closing remark suggests he intends Elvar’s death himself, method unspoken.</p></details><details><summary>The Fury of the Gods · 55</summary><h2>The siege begins at the river</h2><p>He rejects rams because the gates/bank walls are Seiðr-bound, proposing climbing and many ladders; Ilska adds rafts. This tactic has not yet succeeded. He repeats the rock/venom punishment account while Lik-Rifa taunts him about flaying Ulfrir’s daughter; no new torture is performed.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>Freedom and the approaching army</h2><p>He arrives at the bridge parley in gilded mail, taller/slimmer than Drekr, brown hair braided/pinned, short oiled beard and bright dark eyes in a long handsome face. He invokes Biórr’s description of Elvar and threatens Orka’s company, then offers the defenders lives/freedom for Ulfrir. Elvar says she freed the wolf and refuses; his smile falters, he dismisses her as a zealot and returns to signal the assault.</p></details><details><summary>The Fury of the Gods · 57</summary><h2>He moves through the forest shadows with Biórr and about twelve others</h2><p>He moves through the forest shadows with Biórr and about twelve others. When Biórr asks their destination he only repeats that he must do a job himself, then vanishes into the trees. Departure is observed, but his route, precise next tactic and any successful infiltration remain unknown.</p></details><details><summary>The Fury of the Gods · 64</summary><h2>His hand-picked rat-blood crew takes a river-and-cliff route, Skadi among them</h2><p>His hand-picked rat-blood crew takes a river-and-cliff route, Skadi among them. He rescues Biórr’s slipping wrist, keeps the crew barefoot, then circles the crown tree to a ruined tower seam. Removing mail/belt he elongates through, receives the crew’s kit and gathers them in the cramped inner space.</p></details><details><summary>The Fury of the Gods · 64</summary><h2>His hand-picked rat-blood crew takes a river-and-cliff route, Skadi among them</h2><p>He demonstrates a blue ward below the old trapdoor and says Ulfrir’s family knew the access words. He claims to have extracted them by flaying a daughter, unnamed in this account. His spoken words actually melt this ward and he descends a few steps, calling Skalk/Estrid. A single anonymous voice answers; his next action and both contacts’ visible presence remain unshown.</p></details><details><summary>The Fury of the Gods · 66</summary><h2>The infiltrators descend</h2><p>He infiltrates the tunnels behind Skalk/unnamed drengr and encourages Biórr past shared fear, invoking his old punishment. He explicitly gives Biórr the honour of killing Elvar, promising world-changing fame and an ended war; these are incitements, not completed outcomes. Biórr enters the chosen room before an unknown spear defender intercepts him.</p></details><details><summary>The Fury of the Gods · 67</summary><h2>The attack on Elvar’s chamber</h2><p>He enters with Skalk behind the blast and repeatedly demands Biórr kill Elvar, threatening to finish her himself. He leans by a timber column as others fight. The final behind-Elvar assailant speaks of choosing rat over wolf, but this passage does not explicitly name that attacker; the wiki does not yet convert the implication into an established identification.</p></details><details><summary>The Fury of the Gods · 68</summary><h2>Elvar’s fall and the rebellion in the hall</h2><p>He is explicitly identified among the descending stair figures, tall/lean/mailed and holding a blood-red seax. His smooth handsome face briefly reveals scarred raw damage before looking smooth again. This is evidence of concealed appearance, not a newly witnessed injury or direct admission to the preceding neck attack. He dismisses Ulfrir’s threat, partially changes mouth/jaws/teeth and speaks words invoking Ulfrir that actually open the doors; night-hags enter.</p></details><details><summary>The Fury of the Gods · 69</summary><h2>Biórr’s doubts amid the fighting</h2><p>Grend leaps onto him and wounds his chest repeatedly before the rat transformation hurls Grend against the trunk, stunned/groaning. Rotta in fur/clawed feet/yellowed teeth is blood-matted, and Skuld later arrows a back leg, side unspecified. Ulfrir pins his tail; his internal Help me makes Biórr sever it with Elvar’s axe. Half the tail remains under the paw as Rotta escapes, with no regrowth or final fate shown.</p></details><details><summary>The Fury of the Gods · 70</summary><h2>Back in human form and bleeding from many wounds, he casts fire runes at the ash trunk</h2><p>Back in human form and bleeding from many wounds, he casts fire runes at the ash trunk. Gelta lashes at him but he dodges behind it; her attempts to beat the flames burn her vines. Vol’s first frost/ice working becomes steam at his fire. This does not show the entire tree destroyed or all ice magic defeated.</p></details><details><summary>The Fury of the Gods · 71</summary><h2>Guðvarr finds Estrid</h2><p>He emerges from the flames in rat form and calls his sister, who takes him in both taloned claws and flies upward around the burning ash. This is carried flight within the hall, not riding a saddle or a confirmed outdoor escape. No tail regrowth, wound healing or new completed attack is narrated.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>Still carried in the dragon’s claws, he speaks Úlfavinur, opinn after she hits the roof ward</h2><p>Still carried in the dragon’s claws, he speaks Úlfavinur, opinn after she hits the roof ward. The spell dissolves and they escape outdoors, heading north-west; no tail restoration, final landing or newly tested universal access power is shown.</p></details><details><summary>The Fury of the Gods · 78</summary><h2>Human again, he enters stiffly, limping with blood on his tunic and one arm held to his left side</h2><p>Human again, he enters stiffly, limping with blood on his tunic and one arm held to his left side. He kneels and orders the camp to acclaim Snaka as maker/master/king. His tail’s fate in human form is not visible, and this does not assign a side to earlier rat wounds.</p></details><details><summary>The Fury of the Gods · 80</summary><h2>Snaka’s heart and the interrupted feast</h2><p>Still wounded, left arm tight to his side, he concedes Biórr cut his tail to save him and offers thanks. He admits Elvar told him she freed the Tainted, claims he did not believe her and urges Biórr to dismiss regret, then wonders what they have done as he looks at Snaka.</p></details><details><summary>The Fury of the Gods · 80</summary><h2>Snaka’s heart and the interrupted feast</h2><p>He serves/toasts his father, then reveals the siblings raised him to take his heart, despising him rather than trusting him against Ulfrir. When Snaka starts to overcome poison, he cuts his throat while Lik-Rifa pins him, then extracts the heart. His jaws begin changing to eat it, but a tennúr steals it first. He starts transforming amid a new attack; no heart consumption is shown.</p></details><details><summary>The Fury of the Gods · 81</summary><h2>The charge against the gods</h2><p>He completes his rat shift, bites/rakes Ulfrir’s haunches, then is speared in the back by Skuld and struck by both stone guardians. Trolls come to his/dragon’s defence. Neither death nor final heart recovery is shown.</p></details><details><summary>The Fury of the Gods · 85</summary><h2>Lif’s reckoning with Guðvarr</h2><p>Rat-form he runs squealing through snowy combat with the surviving stone wolf leaping onto his back and biting. His final outcome and the heart’s location are not given by this viewpoint.</p></details><details><summary>The Fury of the Gods · 87</summary><h2>He repeatedly screams for Biórr’s help inside his mind</h2><p>He repeatedly screams for Biórr’s help inside his mind. Biórr instead returns Bjarn and then explicitly refuses No; no physical rescue or new formal oath dissolution occurs before Gunnar attacks Biórr.</p></details><details><summary>The Fury of the Gods · 89</summary><h2>Heðin falls and the ravens seize Rotta</h2><p>Half-tail intact as a shortened remainder, he fights the guardian and Skuld, then crashes into dead Heðin. Facing the Bloodsworn, he shows yellow incisors and talons long/curved like a sabre. Grok/Kló seize him in revenge for Snaka, lift and drop him into wagons; he lies unmoving without a proven death/recovery yet.</p></details><details><summary>The Fury of the Gods · 92</summary><h2>Varg had believed the fall killed him, but Ulfrir’s later search finds his body gone</h2><p>Varg had believed the fall killed him, but Ulfrir’s later search finds his body gone. Edel says he must be hunted. His present condition, route and whereabouts are unreported; disappearance is not an explicit witnessed survival scene.</p></details><details><summary>Illustration · The Fury of the Gods · 66</summary><p><a href="assets/1cf47a825aed2b.jpg">Open noncanonical illustration</a></p><p>Biórr at the door before entering.</p></details><details><summary>Illustration · The Fury of the Gods · 89</summary><p><a href="assets/82a301355c5056.jpg">Open noncanonical illustration</a></p><p>Grok and Kló lifting Rotta in revenge for Snaka.</p></details><details><summary>Illustration · The Fury of the Gods · 71</summary><p><a href="assets/e28796c47f3fa9.jpg">Open noncanonical illustration</a></p><p>The dragon carrying the rat upward inside the hall.</p></details><details><summary>Illustration · The Fury of the Gods · 68</summary><p><a href="assets/e401e66f94ebea.jpg">Open noncanonical illustration</a></p><p>The black mist at the reopened stone doors.</p></details><details><summary>Illustration · The Fury of the Gods · 11</summary><p><a href="assets/7eef904efccce4.jpg">Open noncanonical illustration</a></p><p>Orka refusing Rotta’s conditional offer.</p></details><details><summary>Illustration · The Hunger of the Gods · 76</summary><p><a href="assets/01e207a073ed56.jpg">Open noncanonical illustration</a></p><p>Rotta expands into a giant rat before the captives.</p></details><details><summary>Illustration · The Hunger of the Gods · 45</summary><p><a href="assets/870ada0148c464.jpg">Open noncanonical illustration</a></p><p>Rotta with his handsome appearance restored by illusion.</p></details><details><summary>Illustration · The Hunger of the Gods · 45</summary><p><a href="assets/80f18377e38221.jpg">Open noncanonical illustration</a></p><p>Rotta&#x27;s damaged appearance after the glamour is removed.</p></details><details><summary>Illustration · The Fury of the Gods · 64</summary><p><a href="assets/2aae14c652974b.jpg">Open noncanonical illustration</a></p><p>Rotta catching Biórr’s slipping wrist.</p></details><details><summary>Illustration · The Fury of the Gods · 70</summary><p><a href="assets/0bd7a42f24bf1f.jpg">Open noncanonical illustration</a></p><p>Rotta’s fire spreading over the hall tree.</p></details><details><summary>Illustration · The Fury of the Gods · 80</summary><p><a href="assets/37be3fc75eb662.jpg">Open noncanonical illustration</a></p><p>Snaka expelling the poison before the knife attack.</p></details><details><summary>Illustration · The Fury of the Gods · 72</summary><p><a href="assets/a31ae3fafb144b.jpg">Open noncanonical illustration</a></p><p>The roof ward stopping the dragon before Rotta opens it.</p></details><details><summary>Illustration · The Fury of the Gods · 53</summary><p><a href="assets/d5418f7575f773.jpg">Open noncanonical illustration</a></p><p>The ordered night march with campfires left burning.</p></details><details><summary>Illustration · The Fury of the Gods · 69</summary><p><a href="assets/ee64a1f54290d6.jpg">Open noncanonical illustration</a></p><p>The moment before Biórr frees the pinned rat.</p></details><details><summary>Illustration · The Fury of the Gods · 85</summary><p><a href="assets/86b191f404cd06.jpg">Open noncanonical illustration</a></p><p>The remaining stone guardian leaping onto the rat.</p></details><details><summary>Illustration · The Fury of the Gods · 80</summary><p><a href="assets/b1d8da09570245.jpg">Open noncanonical illustration</a></p><p>The unnamed tennúr’s flight; its stolen cargo is hidden from view.</p></details><details><summary>Illustration · The Fury of the Gods · 64</summary><p><a href="assets/d1551f7b80fc0b.jpg">Open noncanonical illustration</a></p><p>The tower ward yielding to Rotta’s words.</p></details></noscript>
