      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 21</summary><h2>Introduction</h2><p>Störr addresses the blonde woman at his shoulder as Silrið. She is tall, with a bone necklace, rune tattoos on her hands and a yellow wool tunic.</p></details><details><summary>The Shadow of the Gods · 21</summary><h2>Story and connections</h2><p>Her chapter 21 outfit also includes breeches, winnigas crossed by leather cords and a comparatively short seax at her belt.</p></details><details><summary>The Shadow of the Gods · 21</summary><h2>Story and connections</h2><p>Silrið obtains Berak’s blood by cutting his arm, wakes Hrung and wipes the blood onto his tongue for testing. She takes Berak’s chain and leads him away after the price is agreed; Störr says she will bring Agnar his payment. Her exact office is not stated at this point in chapter 21.</p></details><details><summary>The Shadow of the Gods · 23</summary><h2>Kinship and a proposed marriage</h2><p>Silrið suggests searching for another path to fulfil their ambitions; its specific nature is unstated.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>A collar and the wolf-god&#x27;s return</h2><p>Elvar now recalls her specifically as Störr’s Galdurwoman, teaching him the binding words for the Berserkirs. This later disclosure clarifies the office left unstated in the earlier account.</p></details><details><summary>The Hunger of the Gods · 69</summary><h2>Bargaining for the Berserkir</h2><p>Her pale-green hand-working sends mist-like tendrils into Elvar&#x27;s chest of treasure; she calls it ancient and powerful. No quantified magical property or use is established by that assessment.</p></details><details><summary>The Hunger of the Gods · 71</summary><h2>The wolf-god wrecks Störr&#x27;s hall</h2><p>Her initial fire attack is blocked by Uspa. After Störr&#x27;s death she disobeys Thorun, binds him in fire and addresses Elvar as jarl while offering him as a gift. Her switch is observed; its private motive is not disclosed.</p></details><details><summary>The Fury of the Gods · 19</summary><h2>Hidden followers and the missing Grend</h2><p>She attends with a bone necklace and drinking horn, asks whether recovery should use guile or force, and challenges Ulfrir’s possible private agenda. She trusts the fortress, large warband and tower’s ancient power, which Ulfrir disputes. These are council judgments rather than a demonstrated guarantee of safety.</p></details><details><summary>The Fury of the Gods · 35</summary><h2>The fleet leaves Snakavik</h2><p>Inside the makeshift sail room she sits beside Uspa, dark jaw tattoos visible, while Grend is questioned. Elvar orders her to fit an iron collar and say the binding words; she agrees, but the actual act and consequences are not shown before Elvar leaves.</p></details><details><summary>The Fury of the Gods · 38</summary><h2>She leads Grend from Wave-Jarl on a leash buckled to his now-fitted iron collar, wrists still tied</h2><p>She leads Grend from Wave-Jarl on a leash buckled to his now-fitted iron collar, wrists still tied. Asked what to do with him, Elvar orders them to follow and intends to find a gaol inside the den. No binding ritual or active collar punishment is narrated.</p></details><details><summary>The Fury of the Gods · 40</summary><h2>She discusses rune magic, relics and bones in council, questioning how to lure and kill the dragon</h2><p>She discusses rune magic, relics and bones in council, questioning how to lure and kill the dragon. Ulfrir answers that he will be bait and kill her, leaving the allies her host. This remains a proposed division of roles, without a demonstrated spell or outcome.</p></details><details><summary>The Fury of the Gods · 44</summary><h2>The new arrivals and Grend’s fate</h2><p>After speaking with Broðir, Runa and other jarls, she presses Elvar for a public decision on Grend, reporting that leniency makes followers doubt her strength. She argues treasure matters only to survivors. Elvar says no decision is made and cuts off further pressure. No execution or restored office is announced.</p></details><details><summary>The Fury of the Gods · 51</summary><h2>Elvar glimpses her in a torchlit upper chamber with Runa, Hjalmar and Estrid and unnamed others</h2><p>Elvar glimpses her in a torchlit upper chamber with Runa, Hjalmar and Estrid and unnamed others. Elvar assumes Grend is the topic but hears no discussion; this does not identify the group as Rotta’s spies or establish a murder plan.</p></details><details><summary>The Fury of the Gods · 52</summary><h2>The choice to hide the beast</h2><p>After explaining the fleet attack as preventing flight, she aims red staff magic towards Elvar and Broðir during the assault. Vol’s serpent whip bites and tears her cheek, interrupting her; no spell impact is shown. She drags the wounded Broðir over the wall and across the bridge, then follows him into the river. She disappears among wrecks, with no confirmed death, rescue or capture.</p></details><details><summary>The Fury of the Gods · 53</summary><h2>A night march under false campfires</h2><p>She is found alive after the river escape attempt, soaked and using her staff, with a severe bleeding cheek wound. Ilska names her alongside Broðir. The queen first orders them killed, but both are led away after Rotta’s intervention; treatment is expressly ordered for Broðir, not a separately shown cure of Silrið.</p></details><details><summary>The Fury of the Gods · 84</summary><h2>She is explicitly the red-staff Galdurwoman fighting Iva, resolving the earlier unnamed opponent</h2><p>She is explicitly the red-staff Galdurwoman fighting Iva, resolving the earlier unnamed opponent. Fire is countered by ice and her red vines evaporate an ice wheel. Iva then opens/ closes a fissure around her, burying her until her final gasp fades to silence. This ends her fight after her previously recorded survival from the river.</p></details><details><summary>Illustration · The Fury of the Gods · 84</summary><p><a href="assets/9a074386763863.jpg">Open noncanonical illustration</a></p><p>Iva’s ice wheel meeting Silrið’s flaming rune-vines.</p></details><details><summary>Illustration · The Shadow of the Gods · 21</summary><p><a href="assets/9a250ecda5a1dd.jpg">Open noncanonical illustration</a></p><p>Silrið at her first appearance in Snakavik, before testing Berak&#x27;s blood.</p></details></noscript>
