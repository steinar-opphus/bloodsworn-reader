      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 7</summary><h2>The troll beside the molten pool</h2><p>Elvar has seen frost-spider venom freeze blood and stop the heart.</p></details><details><summary>The Shadow of the Gods · 7</summary><h2>The troll beside the molten pool</h2><p>During the Iskalt pursuit she sees finger-thick cobwebs.</p></details><details><summary>The Shadow of the Gods · 49</summary><h2>Chapter 49 — The giant ravens near Grimholt</h2><p>Near Grimholt many boar-sized spiders entangle giant ravens. Their bite visibly turns Lif’s limbs blue and stiff; thrown web burns and numbs Orka through wool. Orka describes the venom as chilling blood and immobilising victims, with severe freezing possible, but the full claimed mechanism remains her account.</p></details><details><summary>The Shadow of the Gods · 49</summary><h2>Chapter 49 — The giant ravens near Grimholt</h2><p>The approaching spider is fat-bodied and hoar-crusted, with long spindle-legs and bright glittering eyes. Dense frost-webs in the boughs are as thick as Orka&#x27;s wrist.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>More than a score enter Nastrandir through opening doors in wind and rain, with clustered eyes, ice on blue-tinged fangs and scraping barbed claws. Earlier arrivals have spun rope-thick webs between the columns. A thick-haired scarred spider probes Lik-Rifa’s face and body as she kneels and croons; the group then climbs a snake-carved column into ice-touched webs. The indistinct words are not decoded into orders.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>Sæunn identifies a broad torn trail as made by many frost-spiders after smelling fine dew-covered hairs, while Orka sees ice-tinged web. Bark traces indicate a return to the canopy. Halja finds loose webs and concludes the spiders have gone from this patch; no living spider or new bite occurs. Lif’s fearful reaction and Orka’s account of Mord’s earlier defence are current responses to the traces.</p></details><details><summary>The Hunger of the Gods · 78</summary><h2>Escape through the river valley</h2><p>In the pursuit after the camp escape, one bites Orka&#x27;s neck. Blue-tinged ichor burns cold; venom weakens her wolf response, chills and numbs her limbs and turns her lips blue. Breca kills the spider attacking her, but later spiders surround her and bite her legs. Her mail stops a chest strike; she kills spiders with axe, seax and by tearing out fangs. The ending does not explicitly establish her death.</p></details><details><summary>The Fury of the Gods · 31</summary><h2>The hunters enter Jarnvidr</h2><p>Krúsa’s frost-spiders cross the Slågen bridge, spread through Jarnvidr’s branches and return from a disturbance dragging a Faunir bound in blue web. The captive’s two chest bites pulse blue and spread frost. Krúsa says its blood could kill spiders and rejects feeding it to them; this is her claim, not an observed poisoning experiment.</p></details><details><summary>The Fury of the Gods · 34</summary><h2>They spread around the meeting glade and drop on threads to catch attacking Faunir in blue web</h2><p>They spread around the meeting glade and drop on threads to catch attacking Faunir in blue web. Some climb back with captives; others fall or disappear under the swarm. The scene supplies actual resistance/loss, without confirming Krúsa’s earlier sap-poison claim.</p></details><details><summary>The Fury of the Gods · 36</summary><h2>They join the marching host from woodland outside Darl</h2><p>They join the marching host from woodland outside Darl. Rotta reports unwillingness to travel by water as one reason for the land route; this is not a demonstrated universal behaviour for every frost-spider.</p></details><details><summary>The Fury of the Gods · 46</summary><h2>In the Iron Wood camp perimeter, spiders occupy boughs and descend on threads</h2><p>In the Iron Wood camp perimeter, spiders occupy boughs and descend on threads. Sulich’s bowmen shoot some down; Bloodsworn cut one gripping a comrade and blue-tinged blood spills. The comrade’s later condition is not stated.</p></details><details><summary>The Fury of the Gods · 58</summary><h2>Scores emerge from the forest behind the trolls and advance with the next wave</h2><p>Scores emerge from the forest behind the trolls and advance with the next wave. This chapter shows their approach without assigning an individual attack or ultimate outcome.</p></details><details><summary>The Fury of the Gods · 61</summary><h2>The shield line under pressure</h2><p>At a horn signal they stream through a central gap in the enemy shield wall, filling the space between hosts. Their sharp-barbed angular legs, clustered shining eyes and long twitching fangs with ice-tinged venom are visible; troll silhouettes follow. The resulting attack and final creature losses are not yet shown.</p></details><details><summary>The Fury of the Gods · 62</summary><h2>The fighting withdrawal</h2><p>Spells/arrows kill some but the mass reaches the retreating shield wall, barbed limbs catching gear and dragging warriors down. Orka/Røkia free Varg, and Lif/Sæunn protect Breca. The Berserkir/Úlfhéðnar countercharge diverts them, and a falling burned troll later crushes some. Exact losses and the countercharge outcome are not supplied.</p></details><details><summary>The Fury of the Gods · 63</summary><h2>Some get through the doors and are surrounded by defenders inside</h2><p>Some get through the doors and are surrounded by defenders inside. One bites Hrung’s head, then crumples dead before Elvar’s axe reaches it. Hrung shows blue lumps/lips and icing eyes; neither the spider’s death mechanism nor Hrung’s ultimate outcome is established.</p></details><details><summary>The Fury of the Gods · 65</summary><h2>The dead spider remains curled at Hrung’s pedestal as he wakes under Uspa’s warming care</h2><p>The dead spider remains curled at Hrung’s pedestal as he wakes under Uspa’s warming care. His responsiveness narrows his immediate fate, but why the spider died is still unexplained and no general giant-venom immunity is proven.</p></details><details><summary>The Fury of the Gods · 69</summary><h2>Biórr’s doubts amid the fighting</h2><p>They scuttle in after the night-hags and are trampled by emerging mounted warriors and fought by defenders. The dragon’s landing interrupts the hall battle, with no final spider count or complete defeat established.</p></details><details><summary>Illustration · The Fury of the Gods · 62</summary><p><a href="assets/8d192bed87ec4f.jpg">Open noncanonical illustration</a></p><p>The countercharge covering the retreat.</p></details><details><summary>Illustration · The Shadow of the Gods · 53</summary><p><a href="assets/5ad3e346ea1bb7.jpg">Open noncanonical illustration</a></p><p>Giant ravens and frost-spiders clash above the wooded slope.</p></details><details><summary>Illustration · The Fury of the Gods · 61</summary><p><a href="assets/ebf68832f37548.jpg">Open noncanonical illustration</a></p><p>The frost-spiders advancing after the disengagement.</p></details></noscript>
