      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 5</summary><h2>Introduction</h2><p>Sighvat beats rowing time on a barrel. He is already described as fat-bellied in this first chapter-5 appearance.</p></details><details><summary>The Shadow of the Gods · 5</summary><h2>Story and connections</h2><p>He names the warband the Battle-Grim. He calls them hunters of the Tainted.</p></details><details><summary>The Shadow of the Gods · 48</summary><h2>Chapter 48 — Bound at Oskutreð</h2><p>At Oskutreð he attacks Vörn despite her prohibition. She traps his axe in her staff, strikes him down and binds him in vines until the company’s departure, conditional on Agnar keeping his word.</p></details><details><summary>The Shadow of the Gods · 48</summary><h2>Chapter 48 — Bound at Oskutreð</h2><p>He is tall, broad-shouldered and fat-bellied.</p></details><details><summary>The Hunger of the Gods · 2</summary><h2>A burial and a surviving gaoler</h2><p>He survives the vines with red weals, completes Agnar&#x27;s cairn and agrees to divide the treasure. His oath-marked arm burns when he resists recovering Bjarn and cools when he promises to try. The awakening gaoler breaks her bonds and seizes his axe.</p></details><details><summary>The Hunger of the Gods · 6</summary><h2>The swarm in the depths</h2><p>He is bleeding from many wounds after the swarm fight. Elvar includes him among the four who must try to recover Bjarn.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>A collar and the wolf-god&#x27;s return</h2><p>He and Grend hammer the collar under Uspa’s direction. He then lifts Uspa to Ulfrir’s spine so the new collar can be fitted.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>A collar and the wolf-god&#x27;s return</h2><p>After the resurrection, Ulfrir remains wounded and changes into an exhausted man. Sighvat asks how he will slay a dragon; this is doubt about a future fight, not proof of its outcome.</p></details><details><summary>The Hunger of the Gods · 17</summary><h2>An uneasy bargain with Ulfrir</h2><p>At the pit he braces Grend’s wrist while Grend catches and rescues Elvar. He then supports the weakened Ulfrir at the boulder, where the god stands a head taller than him. After the attack he watches the few surviving tennúr flee and predicts they will not return.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>A duel for the Battle-Grim</h2><p>He rises with dishevelled red hair and beard and insists on eating porridge during the assembly. Orv nominates him as Agnar’s former second, but he declines, preferring fighting to responsibility for cunning plans. His proposal of Grend is also refused.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>A duel for the Battle-Grim</h2><p>He declares the contested leadership must be settled by holmganga, explains the bar on later weregild or blood feud and gets Grend’s assent. He offers first wound, submission or death; both women choose death despite his objection to losing a needed warrior.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>A duel for the Battle-Grim</h2><p>After Elvar kills Huld he drapes Agnar’s bearskin cloak over her, pins it with gold and proclaims her Elvar Fire-Fist, chief of the Battle-Grim, raising her arm as the company joins in. No appointment of him as the new chief’s second is made.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>At the reunion camp beside the Wave-Jarl he acknowledges the broad account of the dragon, wealth and Ulfrir’s promised help while Ketil jokes about it. He laughs at Ketil’s teasing name Sólín Spittle. After Ketil’s death and Elvar’s coercion of Ulfrir, he breaks the silence by saying the god looks better; the joke is not evidence of complete recovery.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The laden ship reaches Starl</h2><p>He beats the rowing rhythm on an empty barrel during the Horndal crossing, calls in the oars and throws walrus rope to the harbour crew as Sólín docks. Elvar selects him with Orv and Urt as the only permitted provisioning party, but no purchase is completed in the scene.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The laden ship reaches Starl</h2><p>He proclaims Elvar Troll-Slayer and Fire-Fist at the boarding plank. Facing Orka and Halja’s demand for Uspa, he boasts of forty crew against three visitors and trades threats with Halja. His Skullsplitter joke prompts her glance towards Orka; no explicit public identification or fight follows.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>He introduces himself to the visitors as sometimes called the Fat and names Grend. He shows the white oath scars alongside Uspa, Elvar and Grend. His joking wrestling challenge to Halja ends in laughter at her whale-and-spear reply, not a match or fight.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>He confirms Elvar’s eastward-track account against Myrk’s westward directions and predicts they will find Lik-Rifa at Nastrandir. Elvar points out they do not know the place’s location; his confident forecast is not a witnessed arrival.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>He is the huge hooded attacker who grapples with Orka in the staged stable raid. Actual shoulder, axe-haft and headbutt contact accompany the ruse; when the halt is called he lowers his hood with a bleeding nose and swelling lips. He complains that Orka went hard at it, and she says it had to look real and she held back. No serious lasting injury or death is established.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>He jokes sexually with Halja at the barn, accepting her mocking reply with laughter. Afterwards he says he will miss Orka’s group and would welcome them beside the Battle-Grim in a shield wall. Sólín Spittle teases him about a furth; he ducks her swipe after praising fine women. Neither exchange establishes a liaison or recruitment.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>Elvar assigns him the Wave-Jarl’s tiller. He answers her as chief, goes to the stern and later steers the departing ship towards a river mouth on the southern edge of Horndal. Elvar names the onward Hvítá and Snakavik route; no arrival follows.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Rowing and a merchant ship intercepted</h2><p>Elvar leaves the tiller to him and joins the oar-benches. He calls the rotating rower shifts, with twenty-four oars maintained through the travelling day. At her order he slows to half-time and steers across to intercept a merchant knarr, then takes the Wave-Jarl back on course after she obtains news. The chapter ends at a distant view of Snakavik.</p></details><details><summary>The Hunger of the Gods · 69</summary><h2>Bargaining for the Berserkir</h2><p>He opens the larger treasure chest for Elvar&#x27;s hire offer, then arms beside her as Störr&#x27;s men close in.</p></details><details><summary>The Hunger of the Gods · 71</summary><h2>The wolf-god wrecks Störr&#x27;s hall</h2><p>Uspa advances beside Elvar, holding a forward sheet of red Seiðr-runes against Silrið&#x27;s fire from the dais. Grend and Sighvat guard the flanks with axes and shields, fighting drengrs who move around the barrier while Ulfrir battles the Berserkir.</p></details><details><summary>The Fury of the Gods · 3</summary><h2>He brings Elvar honeyed porridge in the snowy ruined hall, wearing a sealskin cloak</h2><p>He brings Elvar honeyed porridge in the snowy ruined hall, wearing a sealskin cloak. Her Berserkir initially bar his approach until she orders them aside. He urges her to eat for clear thought, and she accepts; after her speech he privately says she almost makes him want to fight a dragon.</p></details><details><summary>The Fury of the Gods · 19</summary><h2>Hidden followers and the missing Grend</h2><p>He pours ale at council, says he would rather avoid the dragon but will fight if required, and watches his arm in case their blood-oath punishes the hesitation. No new pain occurs. He stresses that the enemy must first be found and welcomes the idea of deception, without supplying a detailed trap.</p></details><details><summary>The Fury of the Gods · 23</summary><h2>Hrung’s account and Grend’s secret</h2><p>He falls asleep while guarding Elvar in the tower, waking at the visitor’s knock and then standing behind her for the arrivals. He knows Jarnvidr’s location, but no separate scouting or battle action occurs here.</p></details><details><summary>The Fury of the Gods · 33</summary><h2>The tide and the search for Grend</h2><p>He stands in the dawn council with Sólín and later moves close to Elvar with a hand on his axe as Hjalmar approaches. No actual oath-pain or strike is described at this point.</p></details><details><summary>The Fury of the Gods · 35</summary><h2>The fleet leaves Snakavik</h2><p>At sea he sits on a sea-chest and beats rowing time with his axe haft while singing, the rowers answering. This is actual departure, without a newly sworn oath or pain episode.</p></details><details><summary>The Fury of the Gods · 38</summary><h2>He steers Wave-Jarl into Falinn at Elvar’s order and towards the ancient pier</h2><p>He steers Wave-Jarl into Falinn at Elvar’s order and towards the ancient pier. After landing he calls the god’s home just a big hill, before the hidden gates and guardians are revealed. No new oath or pain effect occurs.</p></details><details><summary>The Fury of the Gods · 40</summary><h2>Councils and secrets in Wolfdales</h2><p>He follows Elvar with Berak and insists his chosen loyalty as Battle-Grim is better than forced thrall duty. Berak says he too would choose her for Bjarn’s rescue, and Sighvat concedes. He tries to follow into Grend’s cell despite Alone, but Elvar repeatedly orders him out and closes the door.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>Salvage and a choice about freedom</h2><p>He holds bound Runa at the assembly; Elvar stops his raised fist during questioning, then orders him to hang her. He carries out the execution from an ash branch. Later he follows Elvar with the guards whose continued service is freely affirmed; his presence alone does not establish a new bloodline or personal collar ritual.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>Elvar Chainbreaker and the hillside stand</h2><p>He offers Elvar the front-rank place with a mock bow and stands on her right, joining the shield-beat rhythm. As the enemy approaches he asks whether this is part of her plan; the shields clash before the full plan or outcome is revealed.</p></details><details><summary>The Fury of the Gods · 63</summary><h2>When Elvar orders the guards inside he asks about the stone wolves still fighting outside</h2><p>When Elvar orders the guards inside he asks about the stone wolves still fighting outside. The order stands; both guardians then make it through the closing doors. His concern is not an order to abandon them permanently.</p></details><details><summary>The Fury of the Gods · 65</summary><h2>He arm-wrestles Einar amid Bloodsworn/Battle-Grim encouragement and wagers after the battle</h2><p>He arm-wrestles Einar amid Bloodsworn/Battle-Grim encouragement and wagers after the battle. The winner is not shown and this does not establish that all injuries are healed.</p></details><details><summary>The Fury of the Gods · 73</summary><h2>Brák’s hostages and Einar’s fall</h2><p>Sighvat’s Battle-Grim and Orlyg’s warband fight together, pushing skraeling away from the dais toward the open doors while the hall burns. This is an ongoing local advance, without a final casualty tally or completed evacuation.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>Leif’s death and the tunnel escape</h2><p>He leads Battle-Grim/Elvar’s drengrs in the evacuation, then leaves the group to retrieve Elvar’s corpse. He returns carrying her, tears streaking his face, before Ulfrir directs everyone into the tunnels.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>He carries Elvar’s corpse out of the tunnel, then binds it with cloak/leather alongside Grend</h2><p>He carries Elvar’s corpse out of the tunnel, then binds it with cloak/leather alongside Grend. He joins the captains’ council after Ulfrir honours Chainbreaker. No burial is yet performed.</p></details><details><summary>The Fury of the Gods · 81</summary><h2>The charge against the gods</h2><p>The captains join the loose charge: Orlyg/Logur lead their warriors, Sighvat the Battle-Grim, and Grend/Gytha Elvar’s drengrs with Berserkir/Úlfhéðnar. This is a renewed allied assault, not its final outcome.</p></details><details><summary>The Fury of the Gods · 90</summary><h2>The last assault on Lik-Rifa</h2><p>He helps transport Hrung, then celebrates at Bjarn’s family reunion, showing a white arm scar and dancing. This reveals no new bloodline or oath ceremony. Hearing a muffled voice, he listens at the dragon’s belly and identifies Hrung alive.</p></details><details><summary>Illustration · The Hunger of the Gods · 71</summary><p><a href="assets/60a169e02eb340.jpg">Open noncanonical illustration</a></p><p>Elvar advances through Störr&#x27;s hall beneath Uspa&#x27;s protective barrier.</p></details><details><summary>Illustration · The Hunger of the Gods · 28</summary><p><a href="assets/146336e987757a.jpg">Open noncanonical illustration</a></p><p>Sighvat fastens Agnar&#x27;s bearskin cloak around Elvar before proclaiming her chief.</p></details><details><summary>Illustration · The Shadow of the Gods · 48</summary><p><a href="assets/ec77acb8e91402.jpg">Open noncanonical illustration</a></p><p>Sighvat at Oskutreð before Vörn binds him.</p></details><details><summary>Illustration · The Shadow of the Gods · 53</summary><p><a href="assets/eb790d69f84ecc.jpg">Open noncanonical illustration</a></p><p>Vörn binds Sighvat to the ground with growing vines after disarming him.</p></details><details><summary>Illustration · The Fury of the Gods · 77</summary><p><a href="assets/23e1563f8a5e7a.jpg">Open noncanonical illustration</a></p><p>The survivors’ silent memorial for Elvar Chainbreaker.</p></details></noscript>
