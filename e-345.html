      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 19</summary><h2>Hidden followers and the missing Grend</h2><p>Through a wide arched entrance and thick timber doors, the circular high-vaulted council room centres on a fire pit. Hrung has been moved here on his pedestal because the ruined feast hall is too cold; Elvar’s father’s chair, chairs and a long table also stand here. Behind Hrung and the fire is a giant half-buried chain link, with a cold forge in the far wall beyond.</p></details><details><summary>The Fury of the Gods · 19</summary><h2>Hidden followers and the missing Grend</h2><p>Elvar identifies the link through the skaldic chain history and says every Galdur tower is built around one; this observed room does not independently prove the universal claim. The new council debates the dragon campaign and prepares to leave only after obtaining intelligence, then hears Svea’s report of Darl’s fall.</p></details><details><summary>The Fury of the Gods · 23</summary><h2>Hrung’s account and Grend’s secret</h2><p>Elvar waits here with sleeping Sighvat and speaks with Hrung, then receives Ulfrir’s uncollared followers. The tense audience ends in an oath-and-command arrangement rather than new collars. Uspa’s later proposal to free the existing thralls is rejected, and departure preparations for Jarnvidr are ordered.</p></details><details><summary>The Fury of the Gods · 33</summary><h2>Elvar’s dawn council gathers here in war gear, with Hrung still on his pedestal</h2><p>Elvar’s dawn council gathers here in war gear, with Hrung still on his pedestal. After agreeing to move to the docks she has him lifted to a two-pony cart and leaves through her father’s ruined halls, heading down to the town.</p></details><details><summary>Illustration · The Fury of the Gods · 19</summary><p><a href="assets/8107774f8a5f4d.jpg">Open noncanonical illustration</a></p><p>Svea’s news reaching the new tower council.</p></details></noscript>
