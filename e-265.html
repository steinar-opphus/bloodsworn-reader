      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 34</summary><h2>Appearance</h2><p>An unnamed Froa comes to the reunion glade seeking Ulfrir after Grend warns of her approach. She is tree-tall, slender and dark-skinned, with vine-like hair, knotted rope-like arms, blazing green eyes and a voice creaking like wind in leaves. Bark, trunk-like legs and toes spreading through the soil like vines are observed. The page title identifies the encounter and is not her personal name; she is not merged with another Froa.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>Ketil spears her chest while others hack at her root-like legs. She throws several warriors through the air. Ulfrir transforms, kills Ketil and forbids the Battle-Grim to harm her; her death is not shown and she remains able to move and speak.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>She kneels, greets Ulfrir as a friend of woods and trees and is nuzzled by him. After he indicates his collar, she vows that the loyalty of the Froa will never waver, then leaves the glade. Her pledge does not independently establish every Froa’s allegiance. Ulfrir calls the Froa his friends.</p></details></noscript>
