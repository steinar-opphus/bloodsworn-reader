      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 39</summary><h2>A sister&#x27;s hair and an offer of help</h2><p>Skalk says thrall-collars are forged from iron mixed with recovered fragments of Ulfrir&#x27;s chain using Galdur-magic. He identifies Vol&#x27;s collar as one such restraint, controlled by Galdur-tongue words; Glornir agrees. Skalk says the system also controls Helka&#x27;s Úlfhéðnar and Störr&#x27;s Berserkir.</p></details><details><summary>The Hunger of the Gods · 6</summary><h2>The swarm in the depths</h2><p>Skuld’s collar glows red at Elvar’s summons, forces her to kneel and burns her flesh as she resists. These are observed effects on this wearer.</p></details><details><summary>The Hunger of the Gods · 6</summary><h2>The swarm in the depths</h2><p>Elvar proposes making a collar from Ulfrir’s old chain to control the wolf-god. Uspa claims the Galdrabok will enable a god-binding collar; its forging and effectiveness are not demonstrated here.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>A collar and the wolf-god&#x27;s return</h2><p>Uspa directs the forging of a new collar, to which she and Elvar add blood. The smooth iron opens and closes at Elvar’s spoken commands without a visible key, hinge or clasp when shut.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>A collar and the wolf-god&#x27;s return</h2><p>At Elvar’s command it expands around Ulfrir’s skeleton and closes after she names him, reaching twenty times its original size. It expands further with the regrowing neck during resurrection. The fitted collar and its shape-changing are demonstrated; its control of the living wolf-god is not yet tested.</p></details><details><summary>The Hunger of the Gods · 12</summary><h2>Rowing away from Grimholt</h2><p>Skalk threatens to replace the iron collar on the bound Vol in Darl with one of his own crafting, claiming that it will make her his thrall with no return. Guðvarr perceives fear in her response. The replacement and its claimed irreversible effect are not demonstrated here.</p></details><details><summary>The Hunger of the Gods · 17</summary><h2>An uneasy bargain with Ulfrir</h2><p>Skuld warns Ulfrir that his rune-cast collar will burn him if he disobeys Elvar. He objects to being chained, but the chapter does not show Elvar invoking the collar or demonstrate its power to compel him.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>Secrets in the Galdur tower</h2><p>Skalk says every collar used upon the Tainted contains a shaving from the chain fragment in his workroom. He tells Vol he needs a new Froa-derived staff before he can replace her present collar with one of his own. The recipe is his claim and the replacement remains intended.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>The assault on the workroom</h2><p>Iva is collared, as is Taras. When freeing Vol, Iva touches a table ring and rusts iron to fragments, after which Vol is free of the table. The narration’s move from ring to collar leaves the exact restraint ambiguous; this is not treated as confirmed removal of Vol’s enchanted neck collar or of Iva’s/Taras’s collars.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>Varg carries his old collar and key hidden inside his cloak, wears the collar temporarily as part of Svik’s runaway-sale disguise, and removes it with Røkia’s help after questioning Brimil. Its feared return brings shame and memories; this disguise is not a new enslavement. Frek wears an iron collar when boarding as Hakon’s guardian.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>Ilska’s historical account describes Ulfrir’s fragmented chain and the forging of Galdur-collars after attempted destruction of the Tainted. This remains her account, distinct from direct observation of the camp’s collars.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>Lik-Rifa orders the children’s collars taken off, and Ilska and the other dragon-born chant and unlock every one. Children regain visible activity and cry out, but are then intimidated and commanded to accept Lik-Rifa as queen and mother. Breca is later beaten for attempting to flee. The removals do not establish freedom of movement or safety.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>Under interrogation Myrk says children were easier to control than older Tainted through blended Seiðr and Galdur-power, and claims none died. These are her explanations and general survival claim, not a new observed collar operation or proof of complete recovery. They do not erase the earlier observed removal of the children’s collars and continued coercion.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>At the Wave-Jarl camp Elvar’s Eldsverkur command makes Ulfrir’s collar glow red with white heat and inflicts pain. He then reverts to human form and kneels but remains defiant. Skuld obeys a kneeling command and, with her collar glowing red, begins to obey an eye-gouging order. Elvar stops her hand before any eye is removed.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>Ulfrir’s attempt to intervene is met with Sársauki and renewed agony. After his plea Elvar says Sársauki endar and his collar dulls to black iron. His closing promise not to eat more Battle-Grim follows this coercion; long-term obedience, free allegiance and effectiveness against Lik-Rifa are not proved.</p></details><details><summary>The Fury of the Gods · 19</summary><h2>Hidden followers and the missing Grend</h2><p>Elvar recounts the skaldic history that Galdurmen forged thrall-collars from shavings of Ulfrir’s broken chain. Ulfrir condemns the historical enslavement and seeks a promise that his hidden Úlfhéðnar children will not be collared; Elvar makes no such promise in this council approach.</p></details><details><summary>The Fury of the Gods · 38</summary><h2>Grend’s collar is now actually worn, with Silrið’s leash attached, after Elvar’s earlier order</h2><p>Grend’s collar is now actually worn, with Silrið’s leash attached, after Elvar’s earlier order. Elvar tells Orv collars prevent acts of betrayal/harm/incitement and expects control to pass to Broðir if she dies. Those claims are not newly tested in the scene; no punishment or precise binding ritual is shown.</p></details><details><summary>The Fury of the Gods · 40</summary><h2>Grend remains iron-collared and leashed to a cell wall ring when Elvar visits</h2><p>Grend remains iron-collared and leashed to a cell wall ring when Elvar visits. She cuts his wrist ropes and unbuckles the tether but the text does not state collar removal or formal emancipation. No collar punishment activates in the conversation.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>Iva and Taras choose visible collars as cover, while the rest of Sulich’s crew decline</h2><p>Iva and Taras choose visible collars as cover, while the rest of Sulich’s crew decline. Two collar/key pairs are supplied, Iva explicitly assured she has both and will not be sold to Orlyg. Both are later seen collared, but no new binding rite or actual involuntary ownership is enacted. This differs from Grend’s captive collar state.</p></details><details><summary>The Fury of the Gods · 48</summary><h2>Return from the sortie</h2><p>The return meal juxtaposes collared serving thralls, Ulfrir and Frek with Varg’s persistent faded neck scar. Varg proposes throwing collars away and freeing everyone, with paid labour instead of reversing slavery. The discussion produces no enacted reform or new actual collar removal.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>Salvage and a choice about freedom</h2><p>Actual collars are unlocked and removed from Ulfrir, Skuld, Elvar’s Berserkir and the allied chiefs’ Tainted, with I see you used as manumission words and leave/stay choice offered. Vol/Iva/Taras remove their own cover collars and are revealed never enslaved to Glornir. Grend’s collar is removed separately. The scope is this coalition’s Tainted, not an explicit world-wide/all-person abolition.</p></details><details><summary>Illustration · The Fury of the Gods · 54</summary><p><a href="assets/6563c800344cf4.jpg">Open noncanonical illustration</a></p><p>Elvar declaring Ulfrir free after his sworn oath.</p></details></noscript>
