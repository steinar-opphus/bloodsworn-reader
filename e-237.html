      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 23</summary><h2>Introduction in B02-C023</h2><p>In Skalk’s tower a nest around a bare tree glitters amber, green and gold and moves on its surface. Skalk calls it a hyrndur nest. Guðvarr recalls larger, aggressive wasp-kin, brief paralysis from a sting and females burrowing into flesh. Sigrún’s tale of insects erupting from a man remains a recounted story, not an observed hatching.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>Introduction in B02-C023</h2><p>A specimen called to Skalk’s palm has six jointed legs, a hairy body, orange-striped tapering abdomen, hooked sting, opaque wings, black eyes, antennae and sharp mandibles. It covers most of his palm. Skalk calls it female and ready to burrow and lay eggs. Its barbed feet draw blood as it walks to Guðvarr’s elbow.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>Introduction in B02-C023</h2><p>Skalk claims it can live near the heart, detect betrayal and leave on command after the assignment. The actual burrowing begins and the insect is half inside Guðvarr’s arm at the chapter’s close. Arrival at the heart, surveillance, egg-laying and safe eventual removal are unproven.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>The assault on the workroom</h2><p>Guðvarr survives the insect’s progress into his chest and feels it stop moving as an internal pressure. The exact organ, eventual removal and ability to monitor betrayal remain unproven.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>The assault on the workroom</h2><p>Skalk calls a swarm from the nest to attack the riders. It initially moves coherently against them; after the hawk injures him, it breaks formation and attacks at random, with some insects leaving the tower. Guðvarr later sees a dead rider with a swollen face attributed to their stings. The observed sequence does not establish a universal control mechanism.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>After Skalk looks at him in the hall, Guðvarr feels a sharp pinch and shifting sensation deep in his torso. He thinks the hyrndur moved and remembers his assignment to befriend Hakon. This extends the bodily experience but does not prove remote activation, loyalty detection, exact anatomical position or safe removal.</p></details><details><summary>The Hunger of the Gods · 33</summary><h2>A summons after the tower battle</h2><p>Skalk now explicitly commands the insect inside Guðvarr while pointing his completed staff at him. The staff’s Froa eyes flare green and its mouth seems to shift; movement deep in Guðvarr’s chest causes sharp pain, breathlessness and weakness. A command to sleep again abruptly stops the movement, with the pain fading.</p></details><details><summary>The Hunger of the Gods · 33</summary><h2>A summons after the tower battle</h2><p>Skalk uses this as a threat of worse consequences for displeasure. The encounter demonstrates deliberate control of movement, advancing beyond the ambiguous hall episode. It still does not establish automatic loyalty detection, exact organ, control at a distance, egg-laying or safe removal.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>Guðvarr’s entry wound is now a white-ridged arm scar, and he thinks the hyrndur is still inside. He expects Hakon’s exposure to fulfil the bargain and earn removal, then fears Skalk may discard him instead. He proposes further service to remain useful. No removal, new internal inspection or safe cure occurs.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>A buzzing swarm arrives at Nastrandir and makes a nest attached to a column, discomfiting even Drekr in Biórr’s recollection. During the council Biórr thinks they seem uninterested in the war details. No member of the swarm is identified as Guðvarr’s implanted creature, and no new burrowing occurs in this scene.</p></details><details><summary>The Fury of the Gods · 62</summary><h2>The fighting withdrawal</h2><p>They swarm the retreat, stinging through helm gaps and tormenting even the Tainted; an unnamed fair-haired woman falls with swollen stings but no confirmed named death. A fiery rune-net incinerates many before a troll tears it down. This is an observed local defence, not complete extinction or immunity.</p></details><details><summary>The Fury of the Gods · 63</summary><h2>Some follow the retreat into the hall</h2><p>Some follow the retreat into the hall. Vol, Uspa and Iva use rune-spells to finish them, though the narration does not enumerate every insect or prove the entire chamber clear.</p></details><details><summary>Illustration · The Hunger of the Gods · 23</summary><p><a href="assets/f57fe9f63e6580.jpg">Open noncanonical illustration</a></p><p>Guðvarr lies restrained as the hyrndur is lowered towards him.</p></details><details><summary>Illustration · The Hunger of the Gods · 23</summary><p><a href="assets/0ac4529c1515a8.jpg">Open noncanonical illustration</a></p><p>An isolated study of the hyrndur described in the Galdur tower.</p></details><details><summary>Illustration · The Fury of the Gods · 62</summary><p><a href="assets/784e4cd427e9d8.jpg">Open noncanonical illustration</a></p><p>The fire-net before it is torn down.</p></details></noscript>
