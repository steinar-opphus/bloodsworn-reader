      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 35</summary><h2>The fleet leaves Snakavik</h2><p>A large light pair of finely wrought scissors, with runes carved in silver handles, taken by Elvar from Oskutreð’s underground forge. Skuld says they were her mother’s; Elvar returns them aboard Wave-Jarl, and Skuld fixes them to her belt with a leather loop. Their size is described as made for god-hands, not a measured dimension. Elvar wonders about Seiðr power, but none is demonstrated while the earlier registered maternal relationship points to Orna.</p></details><details><summary>The Fury of the Gods · 35</summary><h2>The fleet leaves Snakavik</h2><p>Earlier relationship context: Skuld identifies herself as Orna and Ulfrir’s daughter, establishing the mother meant in the keepsake claim.</p></details><details><summary>The Fury of the Gods · 83</summary><h2>Skuld draws the pair at her belt and uses them to stab one of the dragon’s eyes for her mother</h2><p>Skuld draws the pair at her belt and uses them to stab one of the dragon’s eyes for her mother. This is their first shown combat use in this sequence, with no stated magical mechanism or fixed eye side; Skuld is then hurled away.</p></details><details><summary>Illustration · The Fury of the Gods · 83</summary><p><a href="assets/31ebd0f5cb8649.jpg">Open noncanonical illustration</a></p><p>Skuld drawing her scissors before the eye attack.</p></details><details><summary>Illustration · The Fury of the Gods · 35</summary><p><a href="assets/865127e7180af1.jpg">Open noncanonical illustration</a></p><p>The silver scissors returned to Skuld.</p></details></noscript>
