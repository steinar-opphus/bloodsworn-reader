      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 24</summary><h2>Introduction</h2><p>Æsa is a short, squat, fair-haired Bloodsworn woman in Svik’s group with Varg and Jökul. She shares a biscuit with Varg and says it is best to have food before a fight. Varg recalls her as fast and elusive in sparring, laughing when accidentally hit on the head with his spear butt; his impression that she feels no pain does not establish immunity.</p></details><details><summary>The Hunger of the Gods · 24</summary><h2>Introduction in B02-C024</h2><p>She points Varg towards the thrall-market east by the docks. Before the fight she slaps her face and says pain wakes and sharpens her and that she likes it. She is confident of surprise and anticipates a saga-song about recovering their companion. The rescue has not yet occurred. Her identity is not merged with Aska or any similarly named person.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>She crosses the stockade ahead of Varg, light-footed and balanced like a mountain goat, and is already fighting before Svik and Jökul land. Her reaction to Jökul’s corpse is disbelief, followed by a demand to kill his killer.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>She joins the tunnel march and room search, predicting approaching drengrs when alarms sound. In the hall she leaps onto the table and stabs with her spear as the company is pressed back. Nothing here establishes immunity to pain.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>She guards Hakon at the barracks and later sits beside him in the drakkar’s prow with a spear. Frek joins them as his appointed guardian and ignores her smiling attempt at a greeting. The ship leaves with Hakon still held.</p></details><details><summary>The Hunger of the Gods · 32</summary><h2>Children hidden in the barrels</h2><p>She stays close to Hakon and Frek at the meal, mocks the prince’s demand for hot food, and straightens with her eyes on Frek when he warns Glornir. After Hakon takes cold food she grins and offers to keep him company.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>When Røkia calls Glornir to inspect the distant sails, he hands the Sea-Wolf’s tiller to her. She takes over that role in the moment; no new rank or subsequent manoeuvre is specified before his weapons order.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>The boarding battle at sea</h2><p>As Glornir calls the company to show the approaching attackers what they are, she bangs her spear against her shield and laughs. No subsequent individual outcome or new change of rank is stated.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>She pursues fugitives from the settlement into the beechwood, urging that none spread the parasites farther. Her scream draws Varg and Einar to the pool, where infected people are binding her and then drag her towards the giant.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>Einar scatters her captors and she fights with an axe, but a spear is driven deep into her thigh. She remains active, later stabbing the giant while Varg clings to it. The creature is killed by Glornir; no treatment or complete recovery of her thigh wound is shown.</p></details><details><summary>The Hunger of the Gods · 59</summary><h2>New looks on the journey through Ulaz</h2><p>Wounded herself, she remains on the island as Einar&#x27;s skilled healer, with all the children and a third of the provisions. Einar is still unconscious and feverish at departure.</p></details><details><summary>The Fury of the Gods · 21</summary><h2>At the island huts she is alive and walking with a limp, broad across back and shoulders</h2><p>At the island huts she is alive and walking with a limp, broad across back and shoulders. She hugs Svik amid bawdy jokes and says her leg is healing, though not ready for races. She welcomes future fighting and rejoins Sea-Wolf, without a new medical finding of complete recovery.</p></details><details><summary>The Fury of the Gods · 25</summary><h2>Preparing to meet the pursuing ships</h2><p>After the first drakkar sinks in the ice, she jokes that she still wants a proper fight and did not dress for nothing. The remark gives no medical clearance or total battle outcome.</p></details><details><summary>The Fury of the Gods · 27</summary><h2>The ships collide</h2><p>She fights beside Varg in the defending wall, joins the attack aboard the enemy drakkar and returns to Sea-Wolf. Later she follows the charge around Glornir as Edel shields him from arrows.</p></details><details><summary>The Fury of the Gods · 29</summary><h2>The fight aboard the stern drakkar</h2><p>She finishes an attacker wounded by Varg, fights near him on the stern drakkar and returns with the company to Sea-Wolf. She cannot reach Svik before Orka’s rescue; the later magical blast knocks the company down.</p></details><details><summary>The Fury of the Gods · 39</summary><h2>She takes Orka’s oar at the change of shift and thanks Skullsplitter</h2><p>She takes Orka’s oar at the change of shift and thanks Skullsplitter. Orka notes Æsa was not among the Bloodsworn in her earlier time; this is their relative crew chronology, not an exact joining date.</p></details><details><summary>The Fury of the Gods · 58</summary><h2>She stands blood-spattered beside Glornir and Sulich at the gate as Elvar calls readiness</h2><p>She stands blood-spattered beside Glornir and Sulich at the gate as Elvar calls readiness. No distinct new wound is stated.</p></details><details><summary>The Fury of the Gods · 73</summary><h2>Brák’s hostages and Einar’s fall</h2><p>She runs up a troll’s planted spear shaft, leaps and stabs an eye, then retrieves her seax after it falls. Later she fights Brák’s crew and is cut off from Einar/Svik by the golden-eye warriors.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>She wails at Einar’s body and asks what is happening as the hall collapses; Edel names Snaka</h2><p>She wails at Einar’s body and asks what is happening as the hall collapses; Edel names Snaka. The survivors turn toward the tunnels.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>The survivors’ camp and reunion</h2><p>Edel and Æsa emerge with Røkia/Svik and a little over a score Bloodsworn protecting Refna/the children. Their group later welcomes Glornir’s survivors into the same woodland camp.</p></details><details><summary>The Fury of the Gods · 81</summary><h2>The charge against the gods</h2><p>Svik and Æsa follow Varg/Røkia toward Yrsa, then sweep aside the remaining guards with Edel, enabling Varg’s confrontation. No separate final enemy roster or individual new wound is given.</p></details><details><summary>The Fury of the Gods · 84</summary><h2>Edel and Æsa help Røkia/Svik tear through Brák’s hunters while Varg reaches Taras</h2><p>Edel and Æsa help Røkia/Svik tear through Brák’s hunters while Varg reaches Taras. They remain with the companions around the confrontation, without a separately named new wound/final kill count.</p></details><details><summary>The Fury of the Gods · 89</summary><h2>Heðin falls and the ravens seize Rotta</h2><p>She spears/climbs and kills the smaller troll, leaps free and grins, then Heðin’s club crushes her in a sudden fatal blow. Røkia later uses Æsa’s spear in the companions’ collective defeat of Heðin. No rescue or revival follows.</p></details><details><summary>Illustration · The Hunger of the Gods · 24</summary><p><a href="assets/da8b44d363f9a7.jpg">Open noncanonical illustration</a></p><p>Æsa in a composed study of her first appearance.</p></details><details><summary>Illustration · The Fury of the Gods · 73</summary><p><a href="assets/05f4dcba636f0f.jpg">Open noncanonical illustration</a></p><p>Æsa running the planted spear during the stone-wolf rescue.</p></details></noscript>
