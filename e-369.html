      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 33</summary><h2>Introduction</h2><p>Járn is a named guard encountered at Sigrún’s quarters.</p></details><details><summary>The Fury of the Gods · 2</summary><h2>Earlier appearances: the patchy-bearded, large-eared named guard meets Guðvarr</h2><p>Earlier appearances: the patchy-bearded, large-eared named guard meets Guðvarr in Sigrún’s quarters and later warns of approaching visitors. These establish his prior appearances without merging an unnamed guard.</p></details><details><summary>The Fury of the Gods · 34</summary><h2>A bargain in the forest glade</h2><p>Previously encountered as Sigrún’s named young guard, he now rides with her column: patchy beard and large ears beneath an iron cap helm. Guðvarr offers him money to spear the Faunir hostage, but Sigrún stops the demand. He accompanies her into the meeting glade; no accepted payment, killing or individual fate is shown.</p></details><details><summary>The Fury of the Gods · 55</summary><h2>He climbs the elm Sigrún selects and chops branches down to be trimmed/tied into ladders</h2><p>He climbs the elm Sigrún selects and chops branches down to be trimmed/tied into ladders. Guðvarr and another cut its trunk for rafts. No attack on a named spirit or killing is attributed to Járn.</p></details><details><summary>The Fury of the Gods · 71</summary><h2>Guðvarr sees the huge bull-man maul one of Sigrún’s drengrs and wonders whether it is Járn</h2><p>Guðvarr sees the huge bull-man maul one of Sigrún’s drengrs and wonders whether it is Járn. His uncertain question does not establish that Járn loses an arm or dies; the victim remains separately unpaged pending identification.</p></details></noscript>
