      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 50</summary><h2>The burned wagons and the captive children</h2><p>A huge bull troll at Lik-Rifa’s evening council, he leans on a club the size of a small tree and wears a cloak of stitched bearskins. He promises to squash deserters for Mother-Maker, his address for Lik-Rifa, without an actual hunt or new creation proof.</p></details><details><summary>The Fury of the Gods · 78</summary><h2>The shattered enemy camp</h2><p>Heðin is directly present among the troll survivors, cauterising a wound with iron heated in the camp fire. This is treatment observed, without a named patient or complete recovery claim.</p></details><details><summary>The Fury of the Gods · 82</summary><h2>Sigrún falls and Lif confronts Guðvarr</h2><p>With trolls he batters one stone guardian until a rear leg is gone and its side crushed, then reduces the head to rubble with a two-handed club blow. The wolf becomes still; the other guardian’s fate is not supplied here.</p></details><details><summary>The Fury of the Gods · 89</summary><h2>Heðin falls and the ravens seize Rotta</h2><p>The larger troll has huge yellowed tusks from his lower jaw and kills Æsa after she slays his smaller companion. He names himself while threatening the group. Røkia/Edel/Svik/Varg and Edel’s hound fight him; Røkia casts Æsa’s spear and their combined attacks bring him down. His death is explicit.</p></details><details><summary>Illustration · The Fury of the Gods · 50</summary><p><a href="assets/6fabdee5385040.jpg">Open noncanonical illustration</a></p><p>Heðin.</p></details><details><summary>Illustration · The Fury of the Gods · 82</summary><p><a href="assets/886c07126fc4ce.jpg">Open noncanonical illustration</a></p><p>Heðin reducing one stone guardian’s head to rubble.</p></details></noscript>
