      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 38</summary><h2>The bridge over the vaesen pit</h2><p>Uspa reveals the bridge after cutting her palm, applying blood to a black boulder and chanting. It spans the vaesen pit and is solid ice wide enough for fifty warriors abreast, with molten fire visible below. Agnar&#x27;s assertion that the gods were its last users remains his claim.</p></details><details><summary>The Hunger of the Gods · 9</summary><h2>Old companions at the campfire</h2><p>Lik-Rifa orders her company south to cross the bridge before sólstöður ends, warning that otherwise they will be imprisoned on the north side of the vaesen pit. This seasonal limit is her claim; no crossing or demonstrated closure is shown here.</p></details><details><summary>The Hunger of the Gods · 14</summary><h2>Crossing Isbrún Bridge</h2><p>The company crosses from the Dark of Moon Hills to grassy land beyond the pit. Biórr feels solid ice underfoot above molten rock and sees colours like the god-lights. The crossing is shown, without establishing that sólstöður has ended.</p></details><details><summary>The Hunger of the Gods · 14</summary><h2>Crossing Isbrún Bridge</h2><p>After the tennúr encounter, Lik-Rifa places her palm in the boulder’s claw-shaped cleft and speaks; white veins spread into the rock. Steam engulfs the bridge, which Biórr cannot see once it clears. This is an observed disappearance from view, not established destruction or a proven permanent barrier.</p></details><details><summary>The Hunger of the Gods · 17</summary><h2>An uneasy bargain with Ulfrir</h2><p>The crossing is physically absent where Elvar steps, and she must be rescued. Uspa says the Long Day has not ended, but her blood-and-words attempt reveals only the boulder’s pawprint. Ulfrir attributes the obstruction to Lik-Rifa.</p></details><details><summary>The Hunger of the Gods · 17</summary><h2>An uneasy bargain with Ulfrir</h2><p>After Elvar cuts his palm, Ulfrir applies blood and speaks. Elvar sees wolf- and dragon-like mist figures clash; after the wolf tears the dragon apart the bridge reappears. The whole Battle-Grim party and all four wagons cross. This demonstrates reopening by this intervention, not permanent destruction or unrestricted access for everyone.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>Myrk tells Orka that the Battle-Grim’s captive witch opened the bridge and that her company followed across to Oskutreð. After Revna objects that Kráka lacks such power, Myrk names Uspa instead. The account is reported to a new audience; it is not another crossing or a new witnessed opening.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>After the tennúr return to her camp, Lik-Rifa declares that her brother has crossed the bridge. Biórr hears her words but cannot make out the creatures’ full report. This adds her reaction to news of the crossing, without another crossing scene or a new test of present accessibility.</p></details><details><summary>Illustration · The Shadow of the Gods · 43</summary><p><a href="assets/339c3a71267c75.jpg">Open noncanonical illustration</a></p><p>Uspa steps onto the Isbrún Bridge as its span becomes visible over the chasm.</p></details></noscript>
