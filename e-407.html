      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 9</summary><h2>Earlier observed use</h2><p>In The Hunger of the Gods chapter6, Sólín uses the newly found spear with silver light against a many-legged creature. It is explicitly an Oskutreð spear with a silver-glowing head during the chapter9 fight of The Fury of the Gods. Those earlier colour descriptions remain dated observations, not rewritten to blue.</p></details><details><summary>The Fury of the Gods · 67</summary><h2>The attack on Elvar’s chamber</h2><p>Sólín uses the Oskutreð spear to defend Elvar’s room, blue flashes bursting with blows, and stabs an attacker through the throat. She is then killed by an unnamed sword-wielder. No retrieval or destruction of the spear is narrated. Earlier silver-glowing descriptions remain their own chapter states, not changed to match this blue-lit encounter.</p></details><details><summary>Illustration · The Fury of the Gods · 67</summary><p><a href="assets/5bbb8859f798c8.jpg">Open noncanonical illustration</a></p><p>Sólín’s spear guarding the doorway before her fall.</p></details></noscript>
