      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 20</summary><h2>The queen&#x27;s orders</h2><p>Sulich describes a defeated opponent’s gear as the victor’s battle spoils, telling the tale of victory and battle-fame. Svik says taking another warrior’s kill is stealing and dishonourable.</p></details><details><summary>The Shadow of the Gods · 20</summary><h2>The queen&#x27;s orders</h2><p>After the dockside battle, Bloodsworn loot fallen druzhina and allow a druzhina to take a fallen Bloodsworn’s equipment. Varg initially refuses, then helps Svik strip his own opponent’s gear. These observations establish the practice in this scene, not a universal rule for all cultures.</p></details><details><summary>The Shadow of the Gods · 47</summary><h2>The Bloodsworn reveal their ancestry</h2><p>Røkia gives Varg the slain red-eyed swordsman’s mail and helm as spoils earned by his blood and courage.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>Varg now regards his captured equipment as the story of his battle-fame. He argues that earned ownership lets him choose to give it as repayment, and Sulich accepts after initial reluctance and Einar’s encouragement. This is a successful personal negotiation after the earlier insulting offer, not a demonstrated universal gift rule or magically enforced debt.</p></details></noscript>
