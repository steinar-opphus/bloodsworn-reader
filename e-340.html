      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 17</summary><h2>The second of Orlyg’s two river longships survives the destruction of the first</h2><p>The second of Orlyg’s two river longships survives the destruction of the first. Orlyg, his Galdurman and Orka’s group board; named companions include Breca, Lif, Gunnar, Halja and Sæunn. Shields protect rowers as the ship pushes off. Orka brings Spert’s body and helps additional fugitives aboard; Bjarn and Harek are not seen boarding. Rotta’s ice-rune is blocked, and the ship gains the current and escapes the bank. No formal ship name or final destination is given.</p></details><details><summary>The Fury of the Gods · 22</summary><h2>Breca’s training and Orlyg’s passengers</h2><p>After two days rowing downriver, the longship nears the estuary and sea, carrying wounded survivors and some newly dead wrapped in cloth. Orka’s group trains on deck while a stern discussion determines its course. Orlyg welcomes them aboard and ultimately orders Snakavik, without a completed landfall or alliance.</p></details><details><summary>The Fury of the Gods · 26</summary><h2>Lessons, mourning and Spert’s barrel</h2><p>After leaving the estuary, the drakkar follows Vigrið’s eastern coast under a north-easterly before sheltering in an inlet overnight. A south-westerly headwind then forces slow rowing with sail furled. It passed Fellur’s fjord a day before this scene. Halja reports southern sails, one possibly Sea-Wolf, but no confirmed vessel identification or manoeuvre follows before the ending.</p></details><details><summary>The Fury of the Gods · 28</summary><h2>Its arrival is now identified directly through Orka’s viewpoint: she persuaded Orlyg to aid Sea-Wolf</h2><p>Its arrival is now identified directly through Orka’s viewpoint: she persuaded Orlyg to aid Sea-Wolf. A crosswind delayed the approach under sail before the final rowing run. Passing Sea-Wolf, Gunnar and Halja cast spears; the ship then rams and grapples the attacker fastened to the knarr’s stern and its fighters board.</p></details><details><summary>The Fury of the Gods · 32</summary><h2>Orlyg returns aboard after securing Glornir’s debt promise and failing to buy a witch</h2><p>Orlyg returns aboard after securing Glornir’s debt promise and failing to buy a witch. By the time the others finish repairs, his drakkar is under a full sail on a south-easterly towards Vigrið’s coast. No arrival at Snakavik is established.</p></details><details><summary>The Fury of the Gods · 37</summary><h2>Varg glimpses its sail ahead near the edge of vision during the rain-swept coastal passage</h2><p>Varg glimpses its sail ahead near the edge of vision during the rain-swept coastal passage. It is not explicitly placed in the later anchored cove or the oath circle by this sighting.</p></details><details><summary>The Fury of the Gods · 43</summary><h2>Allies meet and old loyalties surface</h2><p>Orlyg’s account now names the Nidden as the river of his earlier attack and the loss of its companion drakkar. No new damage or voyage manoeuvre is reported for the survivor here.</p></details><details><summary>Illustration · The Fury of the Gods · 17</summary><p><a href="assets/5e1ad98da7b9c2.jpg">Open noncanonical illustration</a></p><p>Orka discarding the shield after Rotta’s ice-rune strikes it.</p></details><details><summary>Illustration · The Fury of the Gods · 22</summary><p><a href="assets/e06e9438bb0882.jpg">Open noncanonical illustration</a></p><p>Orlyg’s stern discussion on the way to the sea.</p></details></noscript>
