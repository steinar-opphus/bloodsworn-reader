      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 2</summary><h2>A fugitive at the trial gate</h2><p>Svik glosses akáll as an invocation.</p></details><details><summary>The Shadow of the Gods · 2</summary><h2>A fugitive at the trial gate</h2><p>Varg asks for the Seiðr-witch to perform one. Svik says Vol is not for hire.</p></details><details><summary>The Shadow of the Gods · 16</summary><h2>Training and the price of an akáll</h2><p>In B01-C016, Vol describes the akáll as reliving the last moments of a life, and calls it no simple task. Varg directly asks her to perform one, but Glornir refuses before she finishes explaining the requirements.</p></details><details><summary>The Shadow of the Gods · 34</summary><h2>Cheese, companionship and a troll tale</h2><p>Glornir again refuses Varg&#x27;s akáll request and orders him not to ask again. Frustrated by Glornir&#x27;s refusal, Varg considers Skalk as someone who could perform the akáll.</p></details><details><summary>The Shadow of the Gods · 45</summary><h2>Waking among the wounded</h2><p>Vol says she needs a link to Frøya to attempt Varg’s akáll, but leaves permission to Glornir. Skalk later offers to perform it in exchange for Varg’s oath; the invocation remains unperformed here.</p></details><details><summary>The Fury of the Gods · 6</summary><h2>Warnings and the search for Frøya</h2><p>At Valdai, Vol demonstrates one performance: sixteen blood lines radiate from a torch into a web-like stave with end-runes. She obtains Frøya&#x27;s name and hair, invokes her final sight and breath and burns the lock in the torch. Flames stay within the stave, the room chills and Varg experiences Frøya&#x27;s perceptions and emotions. The vision ends after her last word and death. These are observed features of this performance, not a universal recipe or proof that every invocation must use the same design.</p></details><details><summary>Illustration · The Fury of the Gods · 6</summary><p><a href="assets/a40f2b312d755e.jpg">Open noncanonical illustration</a></p><p>Vol prepares the akáll.</p></details></noscript>
