      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 31</summary><h2>The hunters enter Jarnvidr</h2><p>A slender, leaf-haired Faunir, larger than a child and smaller than a man, has dark polished-wood-grained skin, long thorn-hooked fingers and small dark eyes. Frost-spiders drag it onto the Jarnvidr road with blue-tinged web around legs and ankles. Two chest bites pulse blue as its skin turns icy and frost appears at its lips. It stutters a demand that the intruders leave its forest. Krúsa warns against killing it, and Sigrún’s hostage proposal is enacted: a birch pole suspends it between two skraeling as the column marches on. Release, recovery and death are unshown; it is not the earlier Darl captive by assumption.</p></details><details><summary>The Fury of the Gods · 34</summary><h2>Still alive, it shreds linen and leather gags and abuses the hunters</h2><p>Still alive, it shreds linen and leather gags and abuses the hunters. It announces the approaching Faunir before the glade is overrun. During retreat Guðvarr sees its kind sawing through its bonds; it stands and gives a war cry. This liberation is not fulfilment of the captors’ promised release or proof all bite effects are cured.</p></details><details><summary>Illustration · The Fury of the Gods · 31</summary><p><a href="assets/05d3030430e983.jpg">Open noncanonical illustration</a></p><p>Noncanonical appearance study of a leaf-haired Faunir.</p></details></noscript>
