      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 23</summary><h2>Introduction</h2><p>Broðir is Elvar&#x27;s younger brother. Broðir asks Elvar to return and says he has missed her.</p></details><details><summary>The Hunger of the Gods · 67</summary><h2>Elvar returns to her father&#x27;s hall</h2><p>Elvar&#x27;s younger brother sits near Thorun and Störr. He resembles Thorun but is leaner in shoulders and waist. No new conduct or political position is shown.</p></details><details><summary>The Hunger of the Gods · 71</summary><h2>The wolf-god wrecks Störr&#x27;s hall</h2><p>He kneels, kisses Elvar&#x27;s hand and calls her jarl after Thorun&#x27;s death. She considers him a possible inheritor of collar control but spares him and touches his cheek; her reasoning is not a universal succession proof.</p></details><details><summary>The Fury of the Gods · 19</summary><h2>Elvar allows him through the Berserkir guards and returns his embrace after initial stiffness</h2><p>Elvar allows him through the Berserkir guards and returns his embrace after initial stiffness. At council he favours guile, suggests mercenary scouts and proposes an alliance with Helka. Elvar welcomes considering the alliance, before Svea reports Helka dead. No alliance or scouting mission is completed here.</p></details><details><summary>The Fury of the Gods · 33</summary><h2>The tide and the search for Grend</h2><p>He wears gilded mail with gold-edged helm and five-lobed sword when he reaches the pier; Elvar suspects the gear came from their father without confirming it. He eagerly presents Runa’s Hundur-thrall for Elvar’s search, pleased to have found one. Hjalmar’s subsequent arrival interrupts the planned tracking.</p></details><details><summary>The Fury of the Gods · 38</summary><h2>He has been made chief of one of Elvar’s ship crews</h2><p>He has been made chief of one of Elvar’s ship crews. She tells Orv she expects him to inherit Ulfrir’s collar control as her blood kin if she dies, comparing her father’s Berserkir succession. This is her stated hypothetical, not an actual inheritance or verified universal law.</p></details><details><summary>The Fury of the Gods · 52</summary><h2>The choice to hide the beast</h2><p>He approaches Elvar behind the distracted crowd, draws a concealed seax and attacks her waist while punching her. Orka’s thrown hand-axe strikes through his mail into back/shoulder, side unstated; Elvar head-butts him. Silrið drags him off the wall, then he jumps from the bridge into the wreck-filled river ahead of Ulfrir and vanishes. No death or capture is shown, and Orka’s axe remains with him.</p></details><details><summary>The Fury of the Gods · 53</summary><h2>He is found alive and soaked, one shoulder slumped with a bleeding back wound</h2><p>He is found alive and soaked, one shoulder slumped with a bleeding back wound. Lik-Rifa explicitly names his assigned mission to kill Elvar and open the doors; he admits trying. Rotta saves him from immediate execution by claiming Elvar’s death would transfer Ulfrir’s control to him. The queen orders his wounds tended and he is led away with Silrið. No control transfer, completed cure, release or axe recovery is shown.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>Salvage and a choice about freedom</h2><p>Elvar recognises the danger that her death would let Broðir command Ulfrir and her Berserkir, then actually releases the god and those fighters from their collars. This changes the situation of control through collars underlying the enemy’s plan; no new conduct or knowledge by Broðir is shown.</p></details><details><summary>The Fury of the Gods · 69</summary><h2>Biórr’s doubts amid the fighting</h2><p>Alive but wounded, he is carried in the dragon’s claw and dropped into the hall, dark-haired/lean/heavy-browed, one shoulder hanging and bandages around his back. At her order he twice tries to command Ulfrir as thrall. The collarless wolf refuses and explains freedom. Lik-Rifa then takes Broðir in her jaws and bites him away, establishing his death. Silrið’s fate and Orka’s earlier thrown short-axe remain unaddressed.</p></details><details><summary>Illustration · The Hunger of the Gods · 67</summary><p><a href="assets/ea05265b6f6514.jpg">Open noncanonical illustration</a></p><p>Broðir seated in the hall at Snakavik.</p></details><details><summary>Illustration · The Fury of the Gods · 69</summary><p><a href="assets/d609fc6ea53452.jpg">Open noncanonical illustration</a></p><p>The free wolf’s refusal, before Broðir’s death.</p></details></noscript>
