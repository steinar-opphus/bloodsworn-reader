      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 43</summary><h2>Introduction</h2><p>He accompanies Leif Kolskeggson to Helka’s feast but is kept back by her Úlfhéðnar while Leif speaks. He wears mail, an axe and seax, with a shield slung across his back bearing an eye in golden scrollwork.</p></details><details><summary>The Hunger of the Gods · 43</summary><h2>Appearance</h2><p>His fair hair is lank and greasy, tied at the nape; his beard thin and wispy. His extremely pale eyes water in the smoky hall. No blindness, exact eye colour or supernatural power is established by that description or his epithet.</p></details><details><summary>The Hunger of the Gods · 43</summary><h2>Story and connections</h2><p>Leif says he has hired Sterkur and his band of mercenaries to hunt Varg, funded by his wealth. Guðvarr recalls songs praising Sterkur’s strength, cunning and holmganga skill, but sees no feat performed here. After Helka authorises the hunt and supplies her intelligence, Sterkur leaves with Leif. The band’s size, personnel and subsequent journey remain unspecified.</p></details><details><summary>The Fury of the Gods · 12</summary><h2>The previously unnamed Ulaz abductor identifies himself as Sterkur to Varg</h2><p>The previously unnamed Ulaz abductor identifies himself as Sterkur to Varg. His greasy fair hair, thin beard, pale eyes, equipment and association with Leif continue the earlier hunt. Varg&#x27;s previous observation of differently coloured eyes now belongs to him; exact eye hues remain unspecified. He confirms the paid job, keeps Leif at a cautious distance and orders the companions killed before transporting Varg to his ship. No naval connection to Rurik is established.</p></details><details><summary>The Fury of the Gods · 12</summary><h2>The previously unnamed Ulaz abductor identifies himself as Sterkur to Varg</h2><p>He selects Svik for execution, orders Norv to hold the hair clear, then sees Svik redirect the falling axe into Norv&#x27;s wrists. He calls his warriors onto Svik; neither a finished execution nor the group&#x27;s defeat is shown.</p></details><details><summary>The Fury of the Gods · 14</summary><h2>He shields Leif against Kesha and pulls him from the warehouse</h2><p>He shields Leif against Kesha and pulls him from the warehouse. Both escape down the docks with a few warriors while the rest of the crew are dead or down. Later Røkia says he saw her Tainted eyes and Svik vows to silence him; no killing of Sterkur occurs.</p></details><details><summary>The Fury of the Gods · 36</summary><h2>The dragon’s host marches out</h2><p>He leads forty or fifty gold-eye-shielded warriors to offer Lik-Rifa service, lank fair hair tied at the nape and thin beard. She promises reward but waves aside his name; Ilska recognises him. He says he seeks coin, fame and the winning side, and his new recruit Leif seeks the Bloodsworn’s death. Drekr welcomes them and Ilska invites the band to fall in; no payment or full oath ritual is shown.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>Freedom and the approaching army</h2><p>Svik identifies him with Leif’s golden-eye company among the attackers and speaks of a red death owed to him. No such killing occurs in the depicted assault.</p></details><details><summary>The Fury of the Gods · 73</summary><h2>Brák’s hostages and Einar’s fall</h2><p>Sterkur appears with the golden-eye shieldbearers and confronts Varg, cutting his group off from Einar/Svik. The two leaders flank Varg; their dark-haired spear-bearer/fair-haired swordsman descriptions are not individually mapped here. Varg finally runs at Sterkur, with no completed duel or legal adjudication of the thrall claim.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>Leif’s death and the tunnel escape</h2><p>He falls under the tremor/mental presence alongside Varg/Leif, but is nowhere seen after Varg kills Leif. No escape route or death is supplied.</p></details><details><summary>Illustration · The Fury of the Gods · 12</summary><p><a href="assets/d0f188333e567f.jpg">Open noncanonical illustration</a></p><p>The companions’ defiance before the execution attempt.</p></details><details><summary>Illustration · The Hunger of the Gods · 45</summary><p><a href="assets/7840592d019b88.jpg">Open noncanonical illustration</a></p><p>Sterkur in the smoky mead hall at his first appearance.</p></details></noscript>
