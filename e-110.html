      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 8</summary><h2>A collar and the wolf-god&#x27;s return</h2><p>Galinn’s saga-song calls Svin brave. Later Elvar wonders whether an enormous yellowed tusk recovered with the treasure came from Svin, whom she calls the boar god; the tusk’s provenance is not confirmed. These earlier references do not depict Svin alive.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>Nastrandir revealed in the snow</h2><p>Storolf says he has Svin the boar in him and tells the camp boy Harek he has the same blood. The narration describes Storolf teaching a group of children assigned Svin ancestry after Lik-Rifa’s evening lessons. His playful rooting and tusking are imitations, not a transformation, and neither Harek’s human parentage nor a complete list of inherited powers is established.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>Skalk asks the captured messenger Kalv whether he is Tainted with Svin the boar’s blood. Kalv clenches his teeth rather than confirming. This is Skalk’s proposed ancestry attribution, without establishing parentage or merging the messenger with the Kalv earlier named in Fain’s family.</p></details></noscript>
