      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 11</summary><h2>Recovery among the Bloodsworn</h2><p>Røkia teaches Varg to hold a gap between shield and torso against penetrating strikes.</p></details><details><summary>The Shadow of the Gods · 11</summary><h2>Recovery among the Bloodsworn</h2><p>She says a shield is also a weapon and warns him not to lose sight of an opponent.</p></details><details><summary>The Shadow of the Gods · 26</summary><h2>Oar-dance and weapons practice</h2><p>Røkia teaches Varg to use the shield&#x27;s boss and rim as weapons. The overhand spear grip gives Varg longer reach but is weaker than the reverse grip in his training.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>The boarding battle at sea</h2><p>During the Sea-Wolf boarding fight Varg braces his arm behind his shield, overlaps it with Røkia’s and Svik’s and holds his spear underhand. The narration explains the reduced reach and stronger, more manoeuvrable grip in the wall’s crush, and Røkia approves. She tells him to trust the rear line. Later a wounded opponent pulls his shield rim and drags him out; the shield is torn away in the press.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>Biórr demonstrates catching a long-axe blow on the shield boss and stepping inside its reach with a padded seax; Breca identifies the opening. Biórr extends the lesson to spears but warns that swords and their hilts remain dangerous close in. Rotta separately urges attacks on unprotected body parts rather than mail. These are narrated exercises and attributed advice, not guaranteed outcomes for every weapon.</p></details></noscript>
