      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 32</summary><h2>The promise of Oskutreð</h2><p>The Battle-Grim spend two days in Starl restocking provisions and maintaining the Wave-Jarl. Starl lies under an exposed rib of Snaka that arches over Lake Horndal.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>Wounds tended and seaxes compared</h2><p>Edel suggests Orka follow the riders’ north-western approach along the Bonebacks towards Lake Horndal and the trading town of Starl. She does not know if they actually came from there, and Orka has not arrived in this chapter.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>Orka&#x27;s search in Starl</h2><p>Orka approaches from a ravine and plain with the Bonebacks to the east. The town spreads along Horndal’s southern shore, with the River Hvítá carrying cargo south to Snakavik. A horseshoe stockade encloses the town against eastern cliffs and the lake to its north. Its strongest merchants govern and hire the guards; there is no jarl.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>Orka&#x27;s search in Starl</h2><p>Gate guards question neither the party nor the bound Myrk; the narration suggests the Bloodsworn shields probably help. Mud seeps between wooden street planks. Orka finds a seal-oil-lit inn with stables, a brewhouse, sheds and a muddy paddock, pays for a meal and stabling and keeps Myrk restrained under watch.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>Orka&#x27;s search in Starl</h2><p>Linked market squares buffer town and lake docks, trading textiles, weapons, northern animal goods and food and spices. Orka arranges provision delivery and then negotiates with the Tainted slaver Haga, leaving with the collared Sæunn. Her whispered specification is not revealed.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>Orka&#x27;s search in Starl</h2><p>Halja hears uncertain northern dragon reports. Near the docks an unnamed woman preaches coming dragon judgment and freedom, surrounded by similarly dressed people. Some cheer and one man laughs; associates move towards him, but no assault is shown and no formal Dragon-Cult identity is established.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>Orka&#x27;s search in Starl</h2><p>An arriving drakkar lowers its sail and mast and rows towards an empty pier. Halja recognises its black spear-and-axe shields on red as Battle-Grim. Neither a named vessel, a completed docking nor individual passengers are identified before the chapter ends.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The laden ship reaches Starl</h2><p>The arriving Battle-Grim vessel is directly named the Wave-Jarl in Elvar’s viewpoint. It crosses Horndal with the hoard, docks under Sólín’s steering and receives the mooring assistance of the harbour crew. Elvar stops for urgently needed supplies but allows only Sighvat, Orv and Urt ashore to preserve secrecy.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The laden ship reaches Starl</h2><p>Orka and Halja, with an unnamed collared companion, approach the boarding plank demanding Uspa. Uspa recognises them; Elvar refuses to let her go, Orka raises her axe and Ulfrir intervenes, greeting Orka as wolf-child. The chapter ends before a fight, settlement or completed provision purchase.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>The dockside standoff becomes a conditional truce when Orka and Halja offer information from their dragon-born prisoner. They board the Wave-Jarl with Sæunn and speak with Elvar, Uspa, Ulfrir, Skuld, Sighvat and Grend. Uspa declines to leave, and Orka refuses Ulfrir’s invitation to join him.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>The conversation exchanges abduction and excavation reports, challenges Myrk’s western route with eastward tracks and proposes Nastrandir without directions. Orka and Elvar agree to reciprocal favours, but neither specific service is disclosed or completed. No new departure, fight or rescue follows before the chapter ends.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>At night a stable shelters Orka’s party, their prisoner Myrk and her horse. Moonlight, a half-open doorway, cold wind and hay frame the gathering. Lif sings before an apparent armed horse raid becomes a staged fight with Battle-Grim participants, allowing Myrk to ride away.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>After the reveal Orka prepares Sæunn to follow the horse and rider from blood, while Elvar specifies the reciprocal message and a future Snakavik rendezvous. No onward pursuit or journey is completed in this scene.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>After night-long conversation in the inn’s barn, Sæunn leads Orka’s mounted group away at first light, sniffing the bloodstained rags before running. The riders carry shields on their backs and lead packhorses loaded with sacks and barrels through the courtyard and streets. The pursuit begins without a destination being reached.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>Uspa’s market provisions are unloaded onto the Wave-Jarl. Elvar returns to the pier, makes ready and casts off, with Sólín leaping aboard and Sighvat steering towards the southern river mouth. The ship actually departs the supply stop, with the Hvítá and Snakavik still ahead.</p></details></noscript>
