      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 1</summary><h2>The hunt and the ruined steading</h2><p>Orka says Snaka’s fall opened the vaesen pit. She says creatures from below were released into their land.</p></details><details><summary>The Shadow of the Gods · 1</summary><h2>The hunt and the ruined steading</h2><p>In her assessment, runes hold back all but the most powerful vaesen. She considers it rare for vaesen to use weapons.</p></details><details><summary>The Shadow of the Gods · 2</summary><h2>A fugitive at the trial gate</h2><p>The Bloodsworn hunt vaesen-monsters. In Liga, a trader offers wares presented as vaesen body parts.</p></details><details><summary>The Shadow of the Gods · 3</summary><h2>Bodies brought to Fellur</h2><p>Orka thinks vaesen prefer quiet, dark places where they can remain hidden. The god-bone in Fellur’s gate helps keep them out of the village.</p></details><details><summary>The Shadow of the Gods · 3</summary><h2>Bodies brought to Fellur</h2><p>Guðvarr blames the killings at Asgrim’s steading on vaesen. Orka denies his accusation. In her argument with Guðvarr in B01-C003, she says vaesen hunt with tooth and claw rather than iron swords.</p></details><details><summary>The Shadow of the Gods · 15</summary><h2>Grief and the decision to leave</h2><p>Froa are powerful vaesen bound to ash trees; they live and die with their trees. Orka finds the local forest guardian dead beside its destroyed tree.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>At Nastrandir Storolf defends the tennúr Tannbursta as a member of Lik-Rifa’s crew entitled to the feast. His intervention and violence against Oleif do not establish a universal equality rule or the freedom of every vaesen.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>After declaring that her forces are too few, Lik-Rifa sings with overwhelming volume. Rotta explains that she has called the vaesen she created and bred to herself. This repeats a creation claim and supplies an interpretation of the summons, without showing which creatures hear, whether they must obey or any new arrivals.</p></details><details><summary>The Hunger of the Gods · 50</summary><h2>The wolf&#x27;s call across the lake</h2><p>Spert and Vesli report hearing Lik-Rifa’s call in their heads at night, identifying two named recipients. Spert does not know the mechanism. Vesli says she and Spert were made by Lik-Rifa or descended from kin she made, an attributed alternative rather than independently observed creation. She describes a song-like command to come and take part in great and terrible deeds.</p></details><details><summary>The Hunger of the Gods · 50</summary><h2>The wolf&#x27;s call across the lake</h2><p>They remain with Orka, with Spert citing his pact despite her earlier release and Vesli citing gratitude and their oath to find Breca. Vesli says the call was difficult to resist. The refusal is not a guarantee for every creature or later call. Revna’s extension to all vaesen and Orka’s war conclusion remain the speakers’ interpretations.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>Named kinds now actually gather at Nastrandir in answer to Lik-Rifa: frost-spiders, tennúr, skraeling, hyrndur, trolls, night-hags and spertus. The narration places these gathered creations’ origin in the vaesen pit before Snaka’s fall broke Eldrafell and released fire. It does not give every individual ancestry, a complete army count or proof all vaesen obeyed the summons.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>Lik-Rifa says their gathering makes her feel better and announces a campaign to punish rulers, free Tainted and find Ulfrir. These are declarations, not completed liberation or conquest.</p></details></noscript>
