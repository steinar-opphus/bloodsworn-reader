      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 72</summary><h2>The roof ward opens</h2><p>From the Wolfdales crown at dawn Halja/Orka see separated groups of ships across the ocean, hundreds/many hundreds/perhaps thousands. Orka describes courses toward Snakavik, Liga, Darl and the Falinn estuary. Glornir identifies them as the invasion Rurik planned with Jaromir, an attributed identification rather than a direct view of commanders or every ship’s allegiance. No completed landing/conquest or exact count is yet shown.</p></details><details><summary>The Fury of the Gods · 74</summary><h2>Snaka rises and Wolfdales collapses</h2><p>One group entering Snakavik fjord is destroyed by the rockfall wave; another is smashed when Snaka resurfaces. These are two observed fleet destructions, not proof every separate invasion fleet has gone or named commanders were aboard.</p></details><details><summary>The Fury of the Gods · 92</summary><h2>Gunnar reports Rurik and survivors of the fleet still active in Vigrið</h2><p>Gunnar reports Rurik and survivors of the fleet still active in Vigrið. The destroyed groups did not account for the entire invasion force; exact remaining strength is unknown.</p></details><details><summary>Illustration · The Fury of the Gods · 72</summary><p><a href="assets/146eb07fa5bcf1.jpg">Open noncanonical illustration</a></p><p>The fleets seen from the crown of Wolfdales at dawn.</p></details><details><summary>Illustration · The Fury of the Gods · 74</summary><p><a href="assets/9aca3371fbb0bb.jpg">Open noncanonical illustration</a></p><p>Snaka rising from the fjord and shedding the mountain’s rock.</p></details></noscript>
