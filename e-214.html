      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 40</summary><h2>Introduction</h2><p>Red Fain calls Kalv his son in chapter 9. Storolf later calls him brother and looks forward to his return as a better teacher. These family reports first registered E-214 and are distinct from the later messenger’s observed encounter.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>At Nastrandir Storolf reports dark dreams and says he can no longer feel Kalv. Fain shares the fear and embraces Storolf. Biórr thinks the lost kin-sense means Kalv has probably died. Kalv is not directly seen; death is inferred rather than independently narrated here.</p></details><details><summary>The Hunger of the Gods · 62</summary><h2>The messenger’s family identity established</h2><p>The chapter does not explicitly identify this brother with Kalv the messenger, E-281, whose separate death in Darl is recorded. Their identities therefore remain separate at this cutoff.</p></details><details><summary>The Hunger of the Gods · 62</summary><h2>The army departs for Svelgarth</h2><p>Biórr&#x27;s viewpoint now explicitly calls the loss Storolf&#x27;s brother&#x27;s death and names Kalv in his call for vengeance. This resolves the previously provisional separation from the messenger whose death Guðvarr reported in chapter 60; no new death occurs in this scene.</p></details><details><summary>The Hunger of the Gods · 62</summary><h2>Storolf&#x27;s dead brother identified</h2><p>The narrator now calls the loss Storolf&#x27;s brother&#x27;s death, and Biórr immediately names Kalv in urging vengeance. Together with the directly reported messenger death to Fain and Storolf in chapter 60, this establishes continuity between the earlier family Kalv (E-214) and the messenger formerly E-281. E-214 is retained as canonical; E-281 is preserved as a former identifier and redirect, with the revelation dated B02-C062.</p></details><details><summary>The Hunger of the Gods · 62</summary><h2>Storolf&#x27;s dead brother identified</h2><p>Hakon names this visitor Kalv during their meeting in The Dead Drengr. He says he has waited days and reports Drekr’s demand for proof of the prince’s commitment. After Hakon shows the back of his head, Kalv relays the job-done/coming-day message and then whispers an unnarrated answer to a timing question.</p></details><details><summary>The Hunger of the Gods · 62</summary><h2>Storolf&#x27;s dead brother identified</h2><p>He is broad-shouldered and thick-torsoed, with fair hair bound in a thick braid, a close-cropped grey-streaked beard, small narrow eyes and a wide angular jaw. His skin looks rune-carved to Guðvarr, a comparison rather than established literal runes. Mail shows beneath a dark stained hooded cloak.</p></details><details><summary>The Hunger of the Gods · 62</summary><h2>Storolf&#x27;s dead brother identified</h2><p>Guðvarr reads disagreement in his glower when Hakon invites him to join. Kalv later rests a hand on a seax across his lap without attacking. The weapon is not identified with another named blade.</p></details><details><summary>The Hunger of the Gods · 62</summary><h2>Storolf&#x27;s dead brother identified</h2><p>This encounter does not establish whether he is the Kalv earlier named as Fain’s son and Storolf’s brother. Those prior family statements remain distinct from the messenger’s observed appearance and reported role.</p></details><details><summary>The Hunger of the Gods · 62</summary><h2>The messenger’s family identity established</h2><p>Guðvarr throws ale into his face and flees; Kalv draws his seax and pursues him across the canal in Hrolf’s boat. At close quarters Guðvarr sees his fair beard and small dark eyes, then kicks him free of an ankle-grip, bloodying his nose. Guðvarr hurls an intervening trapper into him and later sees Kalv pushing a body away with a red seax; the precise blow and the bystander’s fate remain unconfirmed.</p></details><details><summary>The Hunger of the Gods · 62</summary><h2>The messenger’s family identity established</h2><p>As Skalk arrives, his irises and pupils darken like ink, his shoulders and neck thicken and teeth curl from his lower jaw. He charges at Guðvarr’s belly with his seax. Guðvarr recognises him as Tainted; the changes do not identify a precise animal lineage or establish the earlier Kalv family connection.</p></details><details><summary>The Hunger of the Gods · 62</summary><h2>The messenger’s family identity established</h2><p>A fiery binding net follows an unnamed voice’s Bindið hann, tightens despite his seax and burns him. Eight or ten guards surround him. Skalk explains that struggle tightens it. Guðvarr identifies him as Drekr’s messenger and interprets his pressing into the net as attempted self-killing; Kalv does not state that intent.</p></details><details><summary>The Hunger of the Gods · 62</summary><h2>The messenger’s family identity established</h2><p>Skalk strikes his head twice with the staff until he goes limp. After Eldur slökktur and steam, the net is thin cord. Skalk orders the guards to bring him; no interrogation or confirmed death is shown.</p></details><details><summary>The Hunger of the Gods · 62</summary><h2>The messenger’s family identity established</h2><p>Alive in a chair fixed to the tower floor, he has chained wrists and ankles, extensive burns, ruined tunic and hair, and an eye that looks blinded to Guðvarr. A knotwork shoulder/chest tattoo is later clearly identified as the same spread-winged dragon exposed on Hakon’s head. Sturla repeatedly smashes his toes, but he defies Skalk. Skalk’s question assigning Svin ancestry is unanswered and does not resolve his identity with the earlier Kalv named in Fain’s family.</p></details><details><summary>The Hunger of the Gods · 62</summary><h2>The messenger’s family identity established</h2><p>He urges Hakon’s silence but confirms that Lik-Rifa is free and points to the Úlfhéðnar’s dreams. He threatens Helka with the dragon, then strains until a chair arm and leg break, half rising with the other limbs still bound. At Helka’s command Frek cuts his throat with a seax. His death is established by the wound, later slumped state and Guðvarr’s truthful caught-and-slain account, beyond the earlier uncertain limp capture.</p></details><details><summary>The Hunger of the Gods · 62</summary><h2>The messenger’s family identity established</h2><p>Hakon subsequently attributes the Nastrandir location and directions to him. That information is secondhand within the interrogation; no direct travel account by Kalv or fuller confession before his death is supplied.</p></details><details><summary>The Hunger of the Gods · 62</summary><h2>The messenger’s family identity established</h2><p>Guðvarr reports his death to Drekr, Fain and Storolf, then gives Lik-Rifa the rehearsed claim that he killed himself to avoid questioning. That later message is a cover story, not a revision of his earlier observed killing; precise kinship to the grieving men is inferred by Guðvarr here.</p></details><details><summary>Illustration · The Hunger of the Gods · 62</summary><p><a href="assets/78b9ba0dd414b2.jpg">Open noncanonical illustration</a></p><p>Kalv at The Dead Drengr after pushing back his hood.</p></details></noscript>
