      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 1</summary><h2>The hunt and the ruined steading</h2><p>Tennúr are small, two-legged creatures. They have sharp-boned fingers and razor teeth. A pack can be deadly.</p></details><details><summary>The Shadow of the Gods · 1</summary><h2>The hunt and the ruined steading</h2><p>Orka says they covet human teeth. She attributes Asgrim’s missing teeth to them. His mouth has empty, bloodied sockets.</p></details><details><summary>The Shadow of the Gods · 6</summary><h2>A child and an injured vaesen</h2><p>Thorkel identifies the creature Breca finds as a tennúr. Breca reports her name as Vesli. Breca says he gives her one of his teeth.</p></details><details><summary>The Shadow of the Gods · 17</summary><h2>The burning home and the stolen child</h2><p>Orka finds about a dozen tennúr around the wounded Spert at the attacked steading; they appear dead. Vesli, separately found inside the hall, survives and is carried outside.</p></details><details><summary>The Shadow of the Gods · 19</summary><h2>Burial and a vow of vengeance</h2><p>Vesli demonstrates that her spit can congeal into tendon-like strings; she treats Orka’s wounds, after which Orka feels less pain. The source establishes this for Vesli, rather than every tennúr.</p></details><details><summary>The Shadow of the Gods · 19</summary><h2>Burial and a vow of vengeance</h2><p>Vesli says oathless tennúr broke into the hall and tried to take Breca; she fought them. In B01-C019 the dozen tennúr lying around the stream are described as dead.</p></details><details><summary>The Shadow of the Gods · 38</summary><h2>The bridge over the vaesen pit</h2><p>At the vaesen pit, dozens emerge from underground and attack the Battle-Grim. One observed creature is knee-high, hairless and pink-skinned with dark veins, wings and two rows of teeth. The attack kills a pony and several warriors.</p></details><details><summary>The Hunger of the Gods · 14</summary><h2>Crossing Isbrún Bridge</h2><p>At the bridge-side nest, creatures emerge from rippling soil with small taloned fingers, pink hairless bodies, thin-veined wings and large mouths. They swarm Lik-Rifa without attacking and she strokes them in human form.</p></details><details><summary>The Hunger of the Gods · 14</summary><h2>Crossing Isbrún Bridge</h2><p>One lands on her arm, folds translucent wings and says human teeth taste good, but promises obedience to its Lady. Lik-Rifa claims she created the vaesen and insists her followers treat them as allies; the creation account remains her testimony.</p></details><details><summary>The Hunger of the Gods · 14</summary><h2>Crossing Isbrún Bridge</h2><p>After Lik-Rifa addresses the creatures, they return to the hill and burrow out of sight. She says they will join the company after performing a task.</p></details><details><summary>The Hunger of the Gods · 17</summary><h2>An uneasy bargain with Ulfrir</h2><p>The bridge-side nest erupts as the Battle-Grim pass. Its swarm flies over the prepared shield wall to attack Ulfrir’s wagon. The god fights in wolf form, Skuld joins him and Uspa’s moving flame-rune shield burns the attackers; some try to tear out a long fang.</p></details><details><summary>The Hunger of the Gods · 17</summary><h2>An uneasy bargain with Ulfrir</h2><p>Only a handful escape. Ulfrir remains standing with many small wounds, while Skuld pushes herself to one knee. Sighvat’s claim that this is the last they will see of the creatures remains a prediction, not a universal end to their threat.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>As Lik-Rifa looks west, a swarm returns to her camp. She stops the dragon-born’s preparations and welcomes them as her returning children. They fly around her, perch on arms and shoulders, settle at her feet and speak in many voices. Biórr cannot understand the full message; her ensuing declaration concerns her brother’s Isbrún crossing. No individual creature is securely identified with a particular survivor of the earlier attack.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>Nastrandir revealed in the snow</h2><p>The surviving swarm returns like a distant cloud, then whirls around Lik-Rifa and remains overhead at the front of the column. Kráka says they found something, but the report’s content and any link to the earlier report of Ulfrir’s crossing are not established. No new attack or casualty is described.</p></details><details><summary>The Hunger of the Gods · 42</summary><h2>Inside Nastrandir&#x27;s great hall</h2><p>They swirl overhead, flitting in and out of the shadows as Lik-Rifa leads the company towards the rear of Nastrandir after declaring someone has been there. Their presence is observed, but no scout message is decoded or explicitly linked to the discovery of Rotta.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>One table visitor is now named Tannbursta. Biórr assumes he may lead the tennúr because he seems their most frequent speaker to Lik-Rifa; this does not securely identify every earlier unnamed speaker. His pink hairless skin and dark veins are observed as he inspects the food and complains that it lacks teeth.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>Storolf defends his place at the feast, knocks the insulting Oleif unconscious and supplies him a tooth with red flesh attached. Tannbursta catches it in a long-fingered hand and eats it. This is an individual action, not a new universal dietary rule. Tennúr also join the cheers at Lik-Rifa’s speech; Rotta identifies her subsequent song as a call to created vaesen, with no new answering arrival shown.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>More tennúr now swirl above Nastrandir’s hall as vaesen answer Lik-Rifa’s summons, and clouds of them are present at the council. No individual is identified as an earlier named tennúr and no exact total is supplied.</p></details><details><summary>The Fury of the Gods · 20</summary><h2>The new individual Munni scouts for Krúsa, reports an uncertain group count and eats a tooth reward</h2><p>The new individual Munni scouts for Krúsa, reports an uncertain group count and eats a tooth reward. His specifically observed two tooth rows, six digits per hand and broad grinding teeth belong to his description; they are not independently proven for every tennúr, nor do his scouting statements become a direct named sighting by the hunters.</p></details><details><summary>The Fury of the Gods · 45</summary><h2>The host enters the Iron Wood</h2><p>Ilska dispatches a flock from Lik-Rifa’s saddle into the Iron Wood and Sigrún praises their scouting usefulness. Later a tennúr warns at dawn that they are coming. Guðvarr wonders whether it is Munni, without confirmation or an identified enemy.</p></details><details><summary>The Fury of the Gods · 47</summary><h2>They search after Lik-Rifa’s command to Tannbursta</h2><p>They search after Lik-Rifa’s command to Tannbursta. An unnamed returning tennúr reports no one found; the negative search report is not a proven absence from all underground or forest space.</p></details><details><summary>The Fury of the Gods · 58</summary><h2>A swarm follows the trolls onto the gate defenders, slashing at faces</h2><p>A swarm follows the trolls onto the gate defenders, slashing at faces. Orka cuts one down and Vesli spears another. These attackers are distinct from Vesli and do not establish universal allegiance of the type.</p></details></noscript>
