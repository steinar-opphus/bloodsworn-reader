      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 18</summary><h2>Introduction</h2><p>The druzhina woman who threatens Glornir is addressed as Ilia by Jaromir in B01-C013. In B01-C018, she is beside Jaromir at the head of the mounted warriors blocking the docks.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>The assault on the workroom</h2><p>During the tower attack she brings the wooden chest across her saddle, wearing lamellar armour and a horsehair helm and carrying a curved sword. Jaromir identifies the bones as Hraeg’s. Ilia urges departure, then follows him out while giving orders to the other riders; Vol and the chest go with them.</p></details><details><summary>The Hunger of the Gods · 68</summary><h2>The cavalry charge and the shield wall</h2><p>Jaromir names her and she leads the mounted advance with plumed helm, braided hair, sabre and shield. After the ditch collapse she directs surviving riders along the wall; Glornir&#x27;s axe wounds her thigh and knocks her from the saddle. Her separate final condition is not shown.</p></details><details><summary>Illustration · The Hunger of the Gods · 25</summary><p><a href="assets/40d56d03b81f76.jpg">Open noncanonical illustration</a></p><p>Jaromir rides away with Vol captive while Ilia follows with the chest.</p></details></noscript>
