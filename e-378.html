      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 40</summary><h2>Councils and secrets in Wolfdales</h2><p>A huge moss-barked tree grows at the centre of Wolfdales’ great hall, its trunk as thick as a mead hall. Dense fungus clumps as large as shields emit an ethereal light that lets Elvar trace it towards the high vault. Fractured seams of roof light may seem magical to her, but no proven mechanism, spirit identity, World-Tree identification or measured tree dimensions are given.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>Varg sees a broad-stepped walkway carved spirally around and up its trunk</h2><p>Varg sees a broad-stepped walkway carved spirally around and up its trunk. Glowing fungal clumps and fractured roof light remain visible; he compares the glow to Seiðr without proving a mechanism or spirit identity. This new carved route supplements Elvar’s earlier view rather than rewriting it.</p></details><details><summary>The Fury of the Gods · 44</summary><h2>A stair carved in one huge branch connects the high wall platform to its main spiral walkway</h2><p>A stair carved in one huge branch connects the high wall platform to its main spiral walkway. Elvar descends from Ulfrir’s former bedchamber by that route, dizzy at the height. This supplements the previously observed trunk path, without establishing every branch as a route or a measured tree height.</p></details><details><summary>The Fury of the Gods · 51</summary><h2>Ulfrir’s trust and the roof ward</h2><p>The spiral climbs above Elvar’s chamber to further branch-linked wall rooms and an open canopy sealed by Seiðr. Ulfrir says Snaka planted it from Oskutreð’s seed, the first of Jarnvidr, and built the forest for him. Its Froa is named Gelta, her huge woman’s face, vine-like hair and knotted limbs visible in the trunk. Ancient origin/sleep are his testimony; beginning the waking song does not yet show an awakened spirit.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>Sighvat uses a branch of the hall’s ash tree for Runa’s execution</h2><p>Sighvat uses a branch of the hall’s ash tree for Runa’s execution. During Ulfrir’s oath a cold wind shakes its branches; no response by Gelta is identified in this chapter.</p></details><details><summary>The Fury of the Gods · 63</summary><h2>The stone doors and the retreat inside</h2><p>Ulfrir stands in wolf form below the ash as the host enters; beyond the trunk Hrung is attacked on his pedestal and Elvar runs around it to help. No new response from Gelta or movement of the tree is described.</p></details><details><summary>The Fury of the Gods · 67</summary><h2>The bedchamber platform opens onto the branch/stair carved into the hall tree</h2><p>The bedchamber platform opens onto the branch/stair carved into the hall tree. Biórr and Elvar fight back toward the trunk; his sword is kicked off the branch, then an unidentified assailant pushes Elvar off the stair edge. Her landing and any action by Gelta remain unshown.</p></details><details><summary>The Fury of the Gods · 68</summary><h2>Elvar’s fall and the rebellion in the hall</h2><p>Elvar’s body falls from a thick branch to the hall floor, with Grend screaming above and continuing combat at the chamber platform. The infiltrating party hurries down the stair until Ulfrir halts them. No action by Gelta or transformation of the tree is narrated.</p></details><details><summary>The Fury of the Gods · 69</summary><h2>Biórr’s doubts amid the fighting</h2><p>Grend is thrown against its trunk, then Ulfrir pursues Rotta around it and corners Biórr after the tail rescue. No new tree movement or waking of Gelta is described before the dragon arrives.</p></details><details><summary>The Fury of the Gods · 70</summary><h2>The gods collide and the tree burns</h2><p>The god clash throws the dragon against its trunk, then Gelta tears free at Ulfrir’s call and binds her with roots. The defenders push root-cutters back to the trunk. Human-form Rotta casts fire over it; Gelta’s vines burn and Vol’s frost turns to steam. Fighting moves up its carved stair, without a completed tree collapse or final binding outcome.</p></details><details><summary>The Fury of the Gods · 71</summary><h2>Fire spreads up trunk/stairs and drives unnamed fighters higher</h2><p>Fire spreads up trunk/stairs and drives unnamed fighters higher. Gelta burns/collapses, her binding roots fall away and the freed dragon collides with the burning tree during the wolf clash. The dragon then spirals upward carrying Rotta. No full tree fall, outside exit or final hall collapse is shown.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>The roof ward opens</h2><p>The stair is explicitly wide enough for the wolf-god and carries the retreat/fight toward the ceiling and roof ward. After it opens, Halja reports the tree/hall burning and the path down unusable. The party exits by the stair to the grassy crown; full tree collapse is not narrated.</p></details><details><summary>The Fury of the Gods · 73</summary><h2>Varg sees the fire climbing the trunk to the first branches</h2><p>Varg sees the fire climbing the trunk to the first branches. Flames cut his party off from the figures climbing above; the hall still contains scattered fighting groups and guardians. The full tree’s collapse is not shown.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>A great burning branch falls as the chamber and its roof collapse</h2><p>A great burning branch falls as the chamber and its roof collapse. Light opens through ragged holes before Snaka breaches the far wall beyond the tree/dais; no complete destruction assessment of the whole tree is supplied.</p></details><details><summary>Illustration · The Fury of the Gods · 44</summary><p><a href="assets/cb33c87828879a.jpg">Open noncanonical illustration</a></p><p>The descent from Ulfrir’s former chamber.</p></details><details><summary>Illustration · The Fury of the Gods · 67</summary><p><a href="assets/6dd2b44918ef5a.jpg">Open noncanonical illustration</a></p><p>Elvar overcoming Biórr before the later attack.</p></details><details><summary>Illustration · The Fury of the Gods · 51</summary><p><a href="assets/d79e07ae4dafdc.jpg">Open noncanonical illustration</a></p><p>Gelta’s dormant form before any waking response is shown.</p></details><details><summary>Illustration · The Fury of the Gods · 70</summary><p><a href="assets/8226a3d8f585da.jpg">Open noncanonical illustration</a></p><p>Gelta’s first binding before the counterattack.</p></details><details><summary>Illustration · The Fury of the Gods · 71</summary><p><a href="assets/e28796c47f3fa9.jpg">Open noncanonical illustration</a></p><p>The dragon carrying the rat upward inside the hall.</p></details><details><summary>Illustration · The Fury of the Gods · 70</summary><p><a href="assets/0bd7a42f24bf1f.jpg">Open noncanonical illustration</a></p><p>Rotta’s fire spreading over the hall tree.</p></details><details><summary>Illustration · The Fury of the Gods · 40</summary><p><a href="assets/1f6838dd4b2fd8.jpg">Open noncanonical illustration</a></p><p>Elvar walking past the great hall’s luminous tree.</p></details><details><summary>Illustration · The Fury of the Gods · 42</summary><p><a href="assets/07e832076ed195.jpg">Open noncanonical illustration</a></p><p>Noncanonical arrival view showing the spiral walkway newly described around the tree.</p></details></noscript>
