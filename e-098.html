      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 10</summary><h2>An Althing and a challenge</h2><p>Sigrún places Jarl Orlyg at Svelgarth and says he has raided her lands.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>A duel for the Battle-Grim</h2><p>Huld claims to have learned fighting in Svelgarth’s streets while taunting Elvar during their duel. This is Huld’s claimed background, not a view of the settlement.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>Ilska includes Orlyg of Svelgarth among the growing powers gathering or absorbing lesser jarls. The account supplies no new buildings, dimensions or direct scene of Svelgarth.</p></details><details><summary>The Hunger of the Gods · 41</summary><h2>Sigrún&#x27;s reckoning with Guðvarr</h2><p>Sigrún reports that its jarl Orlyg has accepted an invitation to meet Helka in Darl by sending messengers saying he is coming. She places Orlyg on Helka’s eastern border and speculates about a pact. The meeting has not yet taken place and Svelgarth itself is not visited.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>Hakon reports Kalv’s directions placing Nastrandir three days north of Svelgarth at the north-eastern Bonebacks. This is secondhand travel guidance, not a measured distance or a visit to Svelgarth in this chapter.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>Ilska places it south of Nastrandir, not more than a few days’ march away, as Orlyg’s seat. Lik-Rifa announces it as the first target in her campaign before Helka and Störr. This is reported travel guidance and an intended attack, not a completed march or conquest.</p></details><details><summary>The Hunger of the Gods · 72</summary><h2>The army gathers below Svelgarth</h2><p>Orka observes the fjord docks, hall and black tower and the high landward wall. A mixed human and vaesen army halts outside and appears to parley and camp; the terms are not heard.</p></details><details><summary>The Hunger of the Gods · 73</summary><h2>Biórr at the siege</h2><p>Myrk says the attack is delayed for darkness to suit allies. At night the force advances and red light and arrows mark fighting at the wall, while vaesen and a rearguard remain with supplies and children. No capture of the town is shown yet.</p></details><details><summary>The Hunger of the Gods · 74</summary><h2>The gate falls and the children flee</h2><p>Dragon-born make fiery ropes around the gate tower and pass them to trolls, who pull it from the wall. The mixed host pours into the breach; Orka uses the attack as cover for the separate child-rescue attempt.</p></details><details><summary>The Fury of the Gods · 4</summary><h2>A prisoner outside Svelgarth</h2><p>Outside its broken gates and walls, the town still burns under smoke and pale sun on ice-crusted snow. Orka lies captive on charred ground, questioned by Rotta amid gathered vaesen; Myrk brings three prisoners she identifies as Jarl Orlyg&#x27;s children. A later line of bound children comes from the wooded slopes without named identities.</p></details><details><summary>The Fury of the Gods · 22</summary><h2>Breca’s training and Orlyg’s passengers</h2><p>Dagrun reports the town ruined and the Galdur tower smashed and burned, blaming trolls and rune-wielders. Gösta distinguishes the attackers as dragon-born. Orlyg considers rebuilding but rejects an immediate return because renewed attack could destroy them again. These are the survivors’ reports and strategic decisions, not a new inspection of the ruins.</p></details><details><summary>Illustration · The Fury of the Gods · 4</summary><p><a href="assets/bd8aa0c8557c9a.jpg">Open noncanonical illustration</a></p><p>Orka captive outside Svelgarth.</p></details><details><summary>Illustration · The Hunger of the Gods · 72</summary><p><a href="assets/44bf2ffe0da90a.jpg">Open noncanonical illustration</a></p><p>Orka&#x27;s companions survey Svelgarth and the approaching army from the mountain path.</p></details></noscript>
