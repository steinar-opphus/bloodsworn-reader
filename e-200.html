      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 52</summary><h2>Betrayal and the dragon&#x27;s release</h2><p>Lik-Rifa names Nastrandir as her hall and says she wants to see it after escaping Oskutreð. The hall itself is not visited in this chapter.</p></details><details><summary>The Hunger of the Gods · 5</summary><h2>A welcome among the Raven-Feeders</h2><p>Lik-Rifa names Nastrandir as the destination for her people, on a coastal strand shaped like her serpent father. Ilska associates the location with the Bonebacks and doubts the hall survives beneath the ice; Lik-Rifa insists it stands. Neither account is verified by visiting it in this chapter.</p></details><details><summary>The Hunger of the Gods · 5</summary><h2>A welcome among the Raven-Feeders</h2><p>Ilska’s directions place the gathering on a serpent-shaped promontory north of Svelgarth at the eastern edge of the Bonebacks, which she says her father calls the Corpse-Strand.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>Ulfrir tells the Starl meeting his sister’s hall was in the east, but admits he does not know whether it survived Snaka’s destruction. He predicts the weakened Lik-Rifa will seek a familiar refuge there. Halja suggests it may have survived like Rotta’s buried chamber and Sighvat expects to find the dragon there; these remain hypotheses rather than a visit or arrival.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>Elvar points out their group does not know its location, even though the track report directs the search east. That limit belongs to the speakers’ knowledge and does not erase the earlier directions reported elsewhere.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>Nastrandir revealed in the snow</h2><p>Biórr’s travelling company reaches the icy, serpent-shaped coastal promontory. Lik-Rifa dismounts at the cliffs and transforms; improved visible condition makes her seem stronger to him than at release. Roaring the hall’s name, she sings as the apparent cliff shimmers and erupts, enveloping the company in rock dust and sea-spray.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>Nastrandir revealed in the snow</h2><p>Once the cloud clears, black-granite doors edged in glistening silver are visible, taller and wider than dragon-form Lik-Rifa. The surrounding carved stone serpents undulate and hiss, their tower-wide bodies and fanged heads rising then bowing before her. She welcomes the company home, directly identifying the reached hall. The exterior survives and is revealed; the doors do not open on the page and the interior remains uninspected.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>Nastrandir revealed in the snow</h2><p>The word Ormsalur occurs within the repeated song. The chapter supplies no translation or explicit alias declaration, so it is not treated as a separate place or silently adopted name for Nastrandir.</p></details><details><summary>The Hunger of the Gods · 42</summary><h2>Inside Nastrandir&#x27;s great hall</h2><p>The entrance is now gaping, and Biórr, Fain and Storolf enter beneath moving granite serpents described as thick as dragon-form Lik-Rifa. The great doors close once the column has entered. The chapter does not narrate the outer doors’ opening mechanism; their open state follows the earlier closed-door reveal.</p></details><details><summary>The Hunger of the Gods · 42</summary><h2>Inside Nastrandir&#x27;s great hall</h2><p>The first chamber is vast enough in description for a score of dragons to walk or fly. Thick serpent-carved pillars rise into high darkness over dry stone, with daylight through high cracks and fissures. Huge braziers, some on pedestals and some apparently cut into rough walls at varied heights, ignite after Lik-Rifa speaks. Long tables and benches cluster around empty ash-filled hearth pits. This is direct interior observation, resolving the earlier doubt about the hall’s survival.</p></details><details><summary>The Hunger of the Gods · 42</summary><h2>Inside Nastrandir&#x27;s great hall</h2><p>A few stone-cut steps lead to a high-backed stone throne that divides into smaller moving serpents around Lik-Rifa. She strokes a head and a serpent later hovers by her ear. After seeming to listen she declares someone has been there, then leads the company deeper. Her welcome promises protection and a place to recover and plan; safety is her assurance, not an independently established property of the hall.</p></details><details><summary>The Hunger of the Gods · 42</summary><h2>Inside Nastrandir&#x27;s great hall</h2><p>Dragon-sized passages lead through further chambers past a stone pier with two serpent-prowed drakkars and several snekkes on ice-touched water. Names, owners and the water’s precise sea connection are unstated. At another pair of closed doors Lik-Rifa’s command throws them inward, revealing a smaller chamber still large enough for a full-grown dragon.</p></details><details><summary>The Hunger of the Gods · 42</summary><h2>Inside Nastrandir&#x27;s great hall</h2><p>This chamber has active cooking fires, deer and boar on spits, and tables of bread, cheese, fish, turnip, kale, ale, mead and honey. About twenty men and women serve and tend the food while lyre and mouth harps sound at the rear, falling silent at the arrival. Rotta is present near the doorway, explicitly named by Lik-Rifa; he claims to have looked after the place in her absence. The origins of the occupants and preparations are not explained.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>The prepared feast is now eaten, with Biórr, Fain and Storolf together and music and ale flowing. Rotta claims he prepared the homecoming, reconciles with Lik-Rifa and later approaches Biórr. No duration of residence or complete history of the preparations is established.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>Storolf’s exchange with the named tennúr Tannbursta leads to Oleif being knocked unconscious and a tooth passed to the vaesen. The hall then hears Lik-Rifa’s declared cause and a powerful song, which Rotta identifies as a summons to her created vaesen. No incoming reinforcements or new exterior change is shown.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>Under interrogation Hakon relays Kalv’s report that Lik-Rifa is at Nastrandir, at the north-eastern tip of the Bonebacks, three days north of Svelgarth. These are secondhand directions and a travel estimate. Skalk recalls its saga status as the dragon’s hall and speculates that god-built places might have protection, without a new inspection by this group.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>Skalk considers an army route through Orlyg’s realm conditional on a pact. Guðvarr instead proposes going as Hakon’s replacement messenger to seek intelligence. The chapter gives neither a completed pact nor an explicit mission commission or departure.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>The entrance hall becomes a training ground under Ilska’s regime from the day after the feast in the chamber now called Rotta’s hall. Children, dragon-worshippers and Raven-Feeders train while other occupants cook, stitch and laugh. The chamber name does not rename the entire complex, and Biórr’s sense of safety remains his evaluation.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>Vaesen answering the summons now occupy the hall: frost-spider webs between columns, a hyrndur nest on a column, tennúr overhead, protective armed skraeling, trolls around a cauldron and night-hags given a dark chamber. More frost-spiders enter with rain and daylight and are greeted by Lik-Rifa. A horn gathers the council, including spertus along its edges.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>The war council hears Ilska’s report that Svelgarth is a few days to the south and Lik-Rifa’s planned campaign against the three rulers. No new march from the hall is shown.</p></details><details><summary>The Hunger of the Gods · 58</summary><h2>Biórr&#x27;s rat senses and a captured message</h2><p>Night guard duty covers subterranean docks and multiple entrances; the halls are described as extending under the Boneback Mountains. A whale caught by Lik-Rifa in dragon form feeds the warband in the hall. Kráka and Bjarn&#x27;s attempted boat escape ends in their recapture.</p></details><details><summary>The Hunger of the Gods · 60</summary><h2>Guðvarr taken into Nastrandir</h2><p>A sticky web traps Guðvarr on the snowbound coastal approach. Inside, serpent-carved columns, a throne and a mixed human/vaesen gathering fill the hall. Lik-Rifa returns through the doors with a whale and lands before her throne.</p></details><details><summary>The Hunger of the Gods · 62</summary><h2>The army departs for Svelgarth</h2><p>The main force prepares to depart through southern tunnels towards Svelgarth; Myrk arrives through the northern gate with spider and tennúr escort. The chapter does not show the march reaching its destination.</p></details><details><summary>The Hunger of the Gods · 64</summary><h2>The hidden doors into Nastrandir</h2><p>Orka&#x27;s party finds the hall empty after Spert opens the concealed cliff doors with Opinn. Granite serpents move at the entrance and later on the throne as Lif approaches. Mattresses, ash, practice weapons, webs and whale bones show recent occupation; Halja estimates the troll dung at a day old or less. Sæunn finds an onward trail.</p></details><details><summary>Illustration · The Hunger of the Gods · 45</summary><p><a href="assets/2ee26a044a6459.jpg">Open noncanonical illustration</a></p><p>The vast first hall of Nastrandir with its braziers alight.</p></details><details><summary>Illustration · The Hunger of the Gods · 41</summary><p><a href="assets/b3e3b788e74b25.jpg">Open noncanonical illustration</a></p><p>Nastrandir after the dust settles and the stone serpents bow.</p></details></noscript>
