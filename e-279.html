      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>Elvar presents this ring as a token of regard to be sent to Glornir with her offer to hire the Bloodsworn. It is pure silver, thick twisted strands sized for an arm as large as Sighvat’s, with two snarling bear-head terminals. The handing over and eventual receipt are not narrated.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>Elvar says it comes from Oskutreð’s Battle-Plain and may have belonged to Berser or one of his children. Her divine-ownership suggestion remains conjecture, and no magical property is demonstrated. The ring is not equated with Agnar’s gold ring or the similar silver ring Glornir previously gave Varg.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>Orka promises the message will be sent, and Elvar names Snakavik as rendezvous. Gunnar warns they do not know Glornir’s whereabouts. The token’s delivery remains pending.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>Orka takes the ring from her cloak while considering Vesli as a messenger to Glornir. Vesli catches it in a hook-clawed foot and dips under the burden, unable to estimate her carrying range. Orka postpones the message and takes it back. This confirms her possession and a brief handover, without delivery or acceptance by Glornir.</p></details></noscript>
