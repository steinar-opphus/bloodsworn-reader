      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 13</summary><h2>A feast interrupted</h2><p>Galinn’s song calls Ulfrir wolf-waking and breaker of chains. The song says he was slain.</p></details><details><summary>The Shadow of the Gods · 20</summary><h2>The queen&#x27;s orders</h2><p>Svik says Helka’s Úlfhéðnar bodyguards are descended from Ulfrir, whom he calls the wolf-god. This remains an attributed ancestry claim.</p></details><details><summary>The Shadow of the Gods · 48</summary><h2>The guardian of Oskutreð</h2><p>At Oskutreð Elvar identifies an enormous wolf skeleton as Ulfrir. Grend tentatively identifies nearby broken iron as a link of the wolf’s chain; these are their interpretations of the finds.</p></details><details><summary>The Hunger of the Gods · 6</summary><h2>A daughter&#x27;s plea for resurrection</h2><p>Skuld asks for her father’s resurrection and says he has the best chance among the firstborn of defeating Lik-Rifa. Elvar proposes raising him and controlling him with a collar made from his old chain.</p></details><details><summary>The Hunger of the Gods · 6</summary><h2>A daughter&#x27;s plea for resurrection</h2><p>Uspa says Lik-Rifa’s Galdrabok can enable the necessary collar and restore his life. This remains a proposed resurrection and an attributed capability, not a completed event.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>Blood, bone and the wolf-god restored</h2><p>The company uncovers his grey-green bones, with teeth as long as spears. Elvar feels rage and malice emanating from them. Uspa and Elvar fit the enlarged new collar around the skeleton before the blood ritual.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>Blood, bone and the wolf-god restored</h2><p>At the first instant of regrowth, veins and arteries rise slowly from the soil around the old bones, after the airborne rune has settled and faded.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>Blood, bone and the wolf-god restored</h2><p>Blood and an airborne rune precede the regrowth of veins, organs, muscle and sinew. His wolf form has slate-grey fur flecked with black and is almost as large as Störr’s mead hall by Elvar’s estimate. Many old wounds remain incompletely healed.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>Blood, bone and the wolf-god restored</h2><p>His restored body initially remains lifeless. Uspa strikes his chest and repeats her command; he gasps, stands and howls. His amber eyes, thick chest, hunched shoulders and neck, and unusually short broad muzzle distinguish the giant wolf. The howl shakes the ground and drives warriors back.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>Blood, bone and the wolf-god restored</h2><p>Bleeding and exhausted, he collapses and changes into a man. He wears torn mail and a wolf-pelt cloak, with empty sword and seax scabbards. His hair is long, dark and lank; amber eyes glare from sunken sockets in a cragged face, with a grey-black beard and a hint of sharp teeth.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>Blood, bone and the wolf-god restored</h2><p>Skuld cradles his head. He recognises her and asks about her mother and sisters; she tells him all are dead. He reacts with grief and a bloody cough. He is alive and wearing the fitted collar, but obedience to a command as a living god and any fight against Lik-Rifa remain unshown.</p></details><details><summary>The Hunger of the Gods · 9</summary><h2>Old companions at the campfire</h2><p>Elsewhere Lik-Rifa insists her brother Ulfrir lives, despite Ilska’s denial. Lik-Rifa says she felt her spell being used and his first breath, and heard his howl. Her account of remote sensing is preserved as testimony; chapter 8 independently showed his return.</p></details><details><summary>The Hunger of the Gods · 17</summary><h2>An unwilling god under Elvar&#x27;s command</h2><p>Still gaunt and pale, with a tangled grey-black beard and iron collar, he rides wrapped in his wolf-pelt cloak. Uspa and Skuld have removed his torn mail and dressed his old wounds. Skuld helps him sit and drink. He laments Orna, Verdani and Urd, then resents Elvar’s mastery; Skuld warns him of the collar’s fire, without demonstrating it.</p></details><details><summary>The Hunger of the Gods · 17</summary><h2>An unwilling god under Elvar&#x27;s command</h2><p>He objects to being chained but acknowledges possible common ground against Lik-Rifa. At the failed bridge he identifies his sister’s handiwork and, supported by Skuld and Sighvat, stands a head taller than Sighvat. Blood on the rock alone does nothing; his subsequent words produce a mist display of wolf and dragon, followed by the bridge’s return. He says Lik-Rifa now knows he lives.</p></details><details><summary>The Hunger of the Gods · 17</summary><h2>An unwilling god under Elvar&#x27;s command</h2><p>After the crossing tennúr attack his wagon. He fights in wolf form with teeth and claws, while Skuld, Uspa and the warriors assist. He survives standing and howling, bleeding from many small wounds; this is not complete recovery.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>The wounded god rests</h2><p>He and Skuld sleep through the march and night after their wounds are tended. They later watch among the duel spectators; Elvar still judges him far from healed when deciding her next course.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>The wounded god rests</h2><p>After Elvar is acclaimed chief, he gives her a sharp-toothed smile and dips his head. This is a gesture, not a new oath, demonstrated collar obedience or proof that he is ready to defeat Lik-Rifa.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>The wolf answers Ketil&#x27;s mockery</h2><p>At the Wave-Jarl reunion he remains huddled in his wolfskin cloak while Ketil jokes about his weakness. Elvar voices confidence despite her private doubts. Skuld corrects saga accounts of his deeds; he himself rejects the tale of a hundred giants, saying there was only one and he bit off its hand. He then names Skuggar as Snaka’s sister and unmaker, a disclosure that startles the listeners.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>The wolf answers Ketil&#x27;s mockery</h2><p>When warriors attack a visiting Froa, he transforms into a wolf taller than her, with amber eyes and spear-long teeth. He seizes Ketil, tears him in two and swallows part of him, killing him. He forbids harm to the Froa, nuzzles her bark and acknowledges his return while showing his collar. She pledges her kind’s loyalty and leaves; he calls the Froa his friends.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>The wolf answers Ketil&#x27;s mockery</h2><p>Elvar challenges the killing of her crewman. He asserts godhood, but her Eldsverkur command makes his collar glow red with white heat and causes howling pain amid uprooted trees. He returns to human form and kneels, still defiant. This demonstrates collar punishment rather than willing allegiance or full recovery.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>The wolf answers Ketil&#x27;s mockery</h2><p>When Elvar commands Skuld to gouge out an eye he tries to grab her arm. Sársauki sends him back howling; he finally pleads before Elvar stops Skuld without a completed mutilation. Sársauki endar dulls his collar to black iron. After Skuld invokes survival and their aims against Lik-Rifa, he promises to eat no more Battle-Grim and spits flesh to the ground. The promise is not tested beyond this scene.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>In Biórr’s separate viewpoint the returning tennúr gather around Lik-Rifa and speak in voices he cannot decipher. She then angrily declares that her brother has crossed Isbrún Bridge. This is her reported news, not another directly witnessed crossing or evidence that Ulfrir hears about the camp’s reaction.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>Kept in check at the Wave-Jarl camp</h2><p>Elvar’s growing confidence as chief is linked in her own reflection to bringing him to heel at the Wave-Jarl camp. She now seeks secrecy about him, Skuld and the hoard during the Starl stop.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>Kept in check at the Wave-Jarl camp</h2><p>As Elvar refuses Orka’s demand for Uspa and Orka raises her axe, he calls a halt and walks to the boarding plank, Skuld following. He looks at Orka, closes his eyes, breathes deeply and smiles before greeting her as wolf-child and saying she has come. The source does not explicitly identify him as the earlier dream-caller or demonstrate a new spell, parentage or outcome of the standoff.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>Ulfrir claims Orka as his child</h2><p>Orka recognises him as the source of her wolf-call. He calls her his child, offers protection and says his blood runs in her veins, presenting himself as in essence her father. His presence draws her towards pack, but she resists for Breca’s sake; his claim is not converted into literal immediate biological paternity. He also addresses her as Daughter within her head, an explicitly narrated experience without a stated general mechanism.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>Ulfrir claims Orka as his child</h2><p>Elvar asserts authority over safe passage; he remains collared while the visitors board under her truce. He introduces Skuld and speaks of his pursuit and chaining of Rotta for what happened to Valkyrie, claiming to have enjoyed the venom punishment. His tears and savage recollection do not explain Rotta’s escape or present fate.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>Ulfrir claims Orka as his child</h2><p>He mourns Orna when Halja mentions the suspected talon. Later he proposes Nastrandir as his sister’s likely eastern refuge to recover strength, admitting he does not know whether the hall survived. This is a prediction and old geographic knowledge, not a direct sighting of Lik-Rifa or a known present route.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>In Ulfrir’s absence Lik-Rifa tells Rotta that he lives. Rotta reacts with fear and hate, then promises to stand with his sister and end him. Lik-Rifa later publicly names killing Ulfrir as their aim and sings to increase their numbers, interpreted by Rotta as a vaesen summons. No new attack on Ulfrir or news reaching him is shown.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>A farewell message for Orka</h2><p>Elvar relays his wish of good hunting and prediction of seeing Orka again. Later, at the Wave-Jarl’s prow, he asks about delivery. Elvar reports that she passed it on but Orka gave no answer; he laughs that this does not surprise him. There is no independently shown secret reply.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>A farewell message for Orka</h2><p>He watches the riders on the track between Horndal and the Bonebacks and confirms Elvar’s identification of Orka. During their stop he stands unnaturally still, likened to a wolf before a pounce, then sighs and shakes himself. He says they will see Orka again and walks down the deck with Skuld following. Elvar believes him, but no meeting, new transformation, attack or telepathic exchange is established here.</p></details><details><summary>The Hunger of the Gods · 50</summary><h2>A promise spoken across the lake</h2><p>The lakeshore pause is now experienced from Orka’s side: after letting a flicker of her wolf sharpen her senses, she sees him at the Wave-Jarl’s prow and hears him in her head. He proclaims a wolf and sword age with bloodshed, says he is no daylight-dismissed dream and promises to see his fierce wolf-child again. These are his declarations and forecast, not a completed future meeting or immediate biological paternity.</p></details><details><summary>The Hunger of the Gods · 50</summary><h2>A promise spoken across the lake</h2><p>When his presence withdraws she briefly feels abandoned, then tells him to stay out of her way and mind. Whether he hears her is explicitly unknown. She later compares the experience with Spert and Vesli’s reported calls and recalls resisting his compulsion through her promise to find Breca and avenge Thorkel. No quantified range, identical mechanism between gods or universally effective countermeasure is supplied.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>At Nastrandir Lik-Rifa calls him a lurking, plotting threat but does not know his location. Ilska pledges to fight until he is dead. Lik-Rifa intends to tear Vigrið apart, kill Orlyg, Helka and Störr and absorb warbands until she finds and kills him. Her accusations and campaign remain declarations, without a newly observed act by Ulfrir.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>A cloaked passenger among the treasure</h2><p>He sits with his face cloaked among chests and barrels aboard the Wave-Jarl. At the bridge he pushes back his hood, raises his head and sniffs, then says the eastbound travellers serve his sister. The surrounding observations show children, wagons and dragon shields; they do not identify any particular known captive. Beyond the bridge he says Father at the distant view of Snaka’s skull and Snakavik. No reunion with Orka or arrival at the fortress occurs here.</p></details><details><summary>The Hunger of the Gods · 61</summary><h2>The return to Snaka&#x27;s skull</h2><p>At Snakavik he watches Snaka&#x27;s skull with an emotional expression and later raises his cloak hood as the company heads towards the fortress. No release from Elvar&#x27;s control occurs.</p></details><details><summary>The Hunger of the Gods · 69</summary><h2>Called forward in Störr&#x27;s hall</h2><p>Elvar calls him forward when Störr orders the Berserkir to seize her. His response beyond stepping forward is not yet described.</p></details><details><summary>The Hunger of the Gods · 71</summary><h2>The hall shattered by the wolf</h2><p>He fully transforms into an enormous wolf, wrecks the hall and kills attackers despite Elvar&#x27;s instruction to spare controlled men. At her nod, Skuld throws Störr into his jaws. Outside, his appearance makes many mustered warriors flee or kneel.</p></details><details><summary>The Hunger of the Gods · 71</summary><h2>The hall shattered by the wolf</h2><p>Skuld carries Störr by a fistful of his tunic and hovers before Ulfrir&#x27;s snarling jaws. She has thrown away his seax and looks down to Elvar, waiting before releasing the captive.</p></details><details><summary>The Hunger of the Gods · 71</summary><h2>Outside the ruined hall</h2><p>Outside the ruined hall, hundreds of drengrs and mercenaries gather with varied shields, trying to form a shield wall. Ulfrir pads out and snarls, showing bloodied teeth; many flee and many more kneel in the snow before the wolf.</p></details><details><summary>The Fury of the Gods · 9</summary><h2>Training and the attempted treasury escape</h2><p>On the docks he dismisses the black serpent glamour with words and a gesture; Uspa calls it an illusion. Later he fights in human form with long-taloned hands, with amber-eyed warriors covering his flanks. No universal spell immunity or named identity for that group is established.</p></details><details><summary>The Fury of the Gods · 19</summary><h2>He identifies the hidden pier defenders as his Úlfhéðnar children and says they fear collars</h2><p>He identifies the hidden pier defenders as his Úlfhéðnar children and says they fear collars. He asks Elvar not to enslave them, argues their loyalty to him would serve her and warns mercenaries can be outbid. She promises only to consider and orders him to bring them. No new gathering or agreement occurs.</p></details><details><summary>The Fury of the Gods · 19</summary><h2>He identifies the hidden pier defenders as his Úlfhéðnar children and says they fear collars</h2><p>He growls at the tower’s chain link and condemns the connection between human history and his people’s slavery. In council he admits wanting Lik-Rifa dead, denies a rescue alone can satisfy her and argues the fortress cannot guarantee safety. He proposes both deception and force but does not know her present whereabouts. Svea’s news of Helka and Orna’s deaths makes him throw back his head and howl, without a new transformation.</p></details><details><summary>The Fury of the Gods · 22</summary><h2>Tjorvi says he and the Tainted rowers he indicates heard his summons in dreams</h2><p>Tjorvi says he and the Tainted rowers he indicates heard his summons in dreams. Orlyg had not known and asks why it was unreported. Orka tells the council she saw Ulfrir collared to Elvar at Starl and says he is at Snakavik to be used against Lik-Rifa. These are accounts reaching Orlyg, not new acts by Ulfrir in this viewpoint.</p></details><details><summary>The Fury of the Gods · 23</summary><h2>He brings his hidden Úlfhéðnar to Elvar and agrees to the proposed oaths and command to serve her</h2><p>He brings his hidden Úlfhéðnar to Elvar and agrees to the proposed oaths and command to serve her. She chooses not to collar them while retaining her authority over him. He later thanks her for the kindness and promises she will not regret it; no test of all future loyalty is shown.</p></details><details><summary>The Fury of the Gods · 23</summary><h2>He brings his hidden Úlfhéðnar to Elvar and agrees to the proposed oaths and command to serve her</h2><p>He treats the Darl report as locating Lik-Rifa and renews his warning about exposed Snakavik. Asked for advice, he proposes the Wolfdales, his largely underground den near Jarnvidr, where cover and confusing ground could offset the dragon’s superior direct strength. He leaves still thralled: Uspa’s later proposal to free him is rejected in his absence.</p></details><details><summary>The Fury of the Gods · 24</summary><h2>Rotta returns to Darl</h2><p>Rotta tells Lik-Rifa that Ulfrir is at Snakavik with Elvar and the Battle-Grim, citing the captured Orka. Lik-Rifa praises him after reporting her scouts had found no answer. The threat develops through this intelligence transfer; no fresh sighting, joint strike or battle occurs here.</p></details><details><summary>The Fury of the Gods · 33</summary><h2>His arriving oathsworn followers have increased to close to a hundred</h2><p>His arriving oathsworn followers have increased to close to a hundred. He warns Elvar that Lik-Rifa would destroy them if she reached Snakavik and they have waited too long. He accompanies the move towards the docks; the number is his gathered followers, not the whole army.</p></details><details><summary>The Fury of the Gods · 34</summary><h2>A bargain in the forest glade</h2><p>Estrid and Skalk report him as the wolf-god who ate Störr and is held by Elvar, claiming to know his location. Krúsa says Lik-Rifa hunts him and agrees to take the news and offer onward. No exact location or direct knowledge of these events by the god is shown.</p></details><details><summary>The Fury of the Gods · 35</summary><h2>He stands at Wave-Jarl’s stern with Skuld and a few followers while the rest row across the fleet</h2><p>He stands at Wave-Jarl’s stern with Skuld and a few followers while the rest row across the fleet. He advises Elvar to face her delayed task, says she is called Wolf-Tamer but denies being tame, vows Lik-Rifa’s death and says he can locate Wolfdales if Jarnvidr remains. When Skuld receives the scissors she identifies as her mother’s, he looks distant and smiles; no new family relationship is inferred from that look alone.</p></details><details><summary>The Fury of the Gods · 38</summary><h2>He identifies the River Falinn estuary as the way to Wolfdales while disclaiming the new river names</h2><p>He identifies the River Falinn estuary as the way to Wolfdales while disclaiming the new river names. Many wolves track the fleet and hundreds howl from his hill; he calls it a homecoming. He lands with a few followers, the howling stops, and he leads the company along the buried stone road. His invocation brings wind/tremor, reveals wolf-carved gates and wakes two stone-wolf guardians. He transforms to a wolf as large as a mead hall, howls with them and the hill wolves, and welcomes the company as the doors open.</p></details><details><summary>The Fury of the Gods · 40</summary><h2>Councils and secrets in Wolfdales</h2><p>Standing beside Elvar rather than in his own high seat, he proposes being bait: he believes Lik-Rifa will read his homecoming as weakness and come, and claims he will kill her while the allies fight her host. These are tactical predictions, not her confirmed intent. He describes the tunnel network under the river into Jarnvidr; torches in the hall were lit at his word.</p></details><details><summary>The Fury of the Gods · 41</summary><h2>Sigrún tells the dragon’s leaders of his collar, prompting surprise</h2><p>Sigrún tells the dragon’s leaders of his collar, prompting surprise. Munni reports ships and stone guardians at his den after verifying the fugitives’ news. Lik-Rifa concludes he is weak for hiding there, matching the expectation in his bait plan without proving his actual condition; no hostile arrival yet occurs.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>Arrival at the wolf-god’s hall</h2><p>He steps forward in the hall, tall with long grey-streaked dark hair tied at nape, short grey-streaked beard, amber eyes and sharp tooth tips. Varg hears him privately address wolf-child/my child, promise secrecy and invite a visit; to Varg’s identification the voice answers I am your god. This is not a biological fatherhood revelation or a general unlimited mind-reading rule. Skuld whispers in his ear beside the dais.</p></details><details><summary>The Fury of the Gods · 43</summary><h2>Allies meet and old loyalties surface</h2><p>He privately tells Orka she belongs with him and objects to Elvar calling his hall hers; she rejects the intrusion. He and Skuld initially doubt Rotta is active because they believed him chained and punished. Orlyg and Orka’s direct testimony convince him; he vows to make sure the rat dies next time. He also warns Elvar that the ravens served Snaka as spies and cannot be trusted, a current judgment Orka contests. No overthrow, attack or exclusive-loyalty proof follows.</p></details><details><summary>The Fury of the Gods · 44</summary><h2>The new arrivals and Grend’s fate</h2><p>At Elvar’s command he leaves the dais shadows and transforms into a huge wolf, growling and ordering Stop. The opponents freeze in awe; no bite, attack or collar pain is shown. His intervention enforces Elvar’s temporary coalition truce rather than a public seizure of her command.</p></details><details><summary>The Fury of the Gods · 46</summary><h2>His Soon and Now sound in Orka’s head, and Røkia/Varg echo the signal heard by them</h2><p>His Soon and Now sound in Orka’s head, and Røkia/Varg echo the signal heard by them. This coordinates the sortie from a hidden tunnel, without placing his body with the attackers.</p></details><details><summary>The Fury of the Gods · 48</summary><h2>He stands in the tree’s shadows as Varg returns and privately calls him vicious child</h2><p>He stands in the tree’s shadows as Varg returns and privately calls him vicious child. This address does not establish biological parentage. His iron collar remains visible during the meal, and Logur later sees his human form and amber eyes.</p></details><details><summary>The Fury of the Gods · 49</summary><h2>Building defences at the bridge gate</h2><p>At the river defences he admits the ordinary gate/wall would quickly fail against the dragon, then leads the planned working with Skuld and the three witches. He cuts one palm, side unstated, and casts blood into the rune-work. When the light fades he claims the structures will withstand his sister/brother and may bite; no actual attack verifies it here.</p></details><details><summary>The Fury of the Gods · 51</summary><h2>Ulfrir’s trust and the roof ward</h2><p>He privately entrusts Elvar with the roof gate’s opening/closing words, explaining he made it for Orna and grieving her return and renewed loss. He warns of Rotta’s spies, praises Elvar while acknowledging his coercive collar, and proposes trust. He describes sealed/guarded routes and offers other words without a shown lesson.</p></details><details><summary>The Fury of the Gods · 51</summary><h2>Ulfrir’s trust and the roof ward</h2><p>He says Snaka planted the Oskutreð-seed tree and forest, sang its resisting Froa Gelta asleep, and taught him waking words before Valkyrie’s abduction/war/death intervened. He begins the song so Gelta may know Elvar means no harm; her response remains unshown.</p></details><details><summary>The Fury of the Gods · 52</summary><h2>He warns Orka mentally of the dragon’s arrival</h2><p>He warns Orka mentally of the dragon’s arrival. The gate/towers remain intact with blue light as the dragon retreats and he attributes the fleet’s destruction to her rage after failing at the gate. During the attack he transforms into full wolf form, leaps down and pursues Broðir/Silrið across the bridge; they jump into the river. No captured bodies or full future invulnerability is proved.</p></details><details><summary>The Fury of the Gods · 53</summary><h2>Lik-Rifa’s ward complaint corroborates resistance to her wall attack</h2><p>Lik-Rifa’s ward complaint corroborates resistance to her wall attack. Rotta admits fear, warning apparent weakness might be deception. He claims Elvar’s death would pass control to Broðir, but no succession or changed collar status is observed.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>Salvage and a choice about freedom</h2><p>He agrees to the justice oath in exchange for freedom: no unjust blood-power, equal protection/fairness, justice and defence of the wronged. Uspa carves four runes carved in the chair, mixes their blood and translates his spoken vow/sanctions.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>Salvage and a choice about freedom</h2><p>A cold wind and rising blood strand leave a raw spiral hand/forearm scar, side unstated. Elvar then physically removes his collar and declares him free. He remains bound to the oath he agreed, without a tested breach punishment or new collar command.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>Salvage and a choice about freedom</h2><p>Elvar invokes his already known fatherhood of Skuld when freeing her without a separate blood oath, relying on his promised fair enforcement to address abuse of power. Skuld remains distinct from the already known daughter Valkyrie.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>Frek’s freed Úlfhéðnar choose to offer service to Elvar instead of the wolf-god</h2><p>Frek’s freed Úlfhéðnar choose to offer service to Elvar instead of the wolf-god. Rotta demands Ulfrir in exchange for the defenders’ lives/freedom, but Elvar refuses because Ulfrir is now free. This does not rescind his separately sworn justice oath.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>Elvar Chainbreaker and the hillside stand</h2><p>Elvar allows the stone hall gates to close behind her host and privately relies on him to fulfil the agreed plan. No visible command or mechanism by Ulfrir, response by Gelta, or completion of his role is shown in this scene.</p></details><details><summary>The Fury of the Gods · 63</summary><h2>The stone doors and the retreat inside</h2><p>Elvar pleads for the closed doors to open; their eventual movement is observed without a direct opening command shown. Inside he stands in wolf form below the ash with a few score Úlfhéðnar, sees Elvar and howls, directly preceding the doors closing. When a troll slips in and kills a drengr he takes it in his jaws and tears it apart. Other insects/spiders still require the host’s response.</p></details><details><summary>The Fury of the Gods · 64</summary><h2>The rat-blood climb the cliff</h2><p>Rotta says Ulfrir’s wife/children knew the den’s access words and that an unnamed daughter yielded them under torture. His successful tower word-use is observed; Ulfrir’s awareness, intended response and the failure of all other wards are not shown.</p></details><details><summary>The Fury of the Gods · 65</summary><h2>Losses and plans after the retreat</h2><p>Human-seated in his own chair, he predicts the dragon will take his outside non-intervention for weakness and enter tomorrow if Elvar repeats a feigned retreat with longer-open doors. This is an untested lure and does not erase his interior help. He thanks Elvar for freedom while tracing the oath scar and acknowledging fair treatment/justice, then goes to his den with Skuld and following Úlfhéðnar.</p></details><details><summary>The Fury of the Gods · 68</summary><h2>He enters in wolf form with Skuld, both stone guardians and following Úlfhéðnar</h2><p>He enters in wolf form with Skuld, both stone guardians and following Úlfhéðnar. At Elvar’s corpse he sniffs/whines, then halts the stair party with a growl and recognises Rotta. His threats do not prevent Rotta’s words opening the stone doors for black mist and night-hags. No full god-duel or final outcome is yet shown.</p></details><details><summary>The Fury of the Gods · 69</summary><h2>Biórr’s doubts amid the fighting</h2><p>He prepares to attack Rotta and chases him around the ash; Skuld’s arrow helps him pin the rat’s tail. Biórr cuts Rotta free and faces the wolf, but the dragon’s arrival interrupts. Broðir’s commands then fail: Ulfrir laughs, shows his collarless neck and says Elvar freed him. He remains free as Lik-Rifa kills Broðir and leaps at him, the result unshown.</p></details><details><summary>The Fury of the Gods · 70</summary><h2>The gods collide and the tree burns</h2><p>He meets the dragon in a shaking collision, takes her clawing at his belly, bites her shoulder and throws her into the ash. He steps back and calls Gelta, who emerges and binds her. The result of the god fight remains unshown beyond this phase; he is not declared untouched or finally victorious.</p></details><details><summary>The Fury of the Gods · 71</summary><h2>Dragon-born spells and trolls attempt to hold him off the bound dragon</h2><p>Dragon-born spells and trolls attempt to hold him off the bound dragon. When she rises he leaps, claws and bites her chest, but her turn into the tree throws him into fire. He howls and rolls clear singed/smoking, still mobile. The full injury extent or next attack is not shown.</p></details><details><summary>The Fury of the Gods · 73</summary><h2>Brák’s hostages and Einar’s fall</h2><p>Trolls and dragon-born beset him, using rune-fire walls and a surrounding troll swarm to try to herd him toward the burning tree. The attempt is observed; no new final god duel or death is shown.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>He shelters fleeing survivors beneath his wolf body with Skuld and both stone guardians nearby</h2><p>He shelters fleeing survivors beneath his wolf body with Skuld and both stone guardians nearby. Finding the gate blocked, he directs them to tunnels. At Varg’s warning he goes back for Grend’s party, takes Hrung’s sailcloth in his jaws and protects the people to the entrance.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>He shelters fleeing survivors beneath his wolf body with Skuld and both stone guardians nearby</h2><p>Snaka breaks through the far wall and calls him son. He whines with a silent snarl, then turns into the tunnel and the others follow. This is a withdrawal into passage, without a completed escape or new god-duel result.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>The survivors’ camp and reunion</h2><p>He sets Hrung down safely, returns to dark-haired amber-eyed human form and has Úlfhéðnar scout while Skuld flies above and both limping guardians keep watch. At Elvar’s body he honours her freeing them and reaffirms Chainbreaker, promising vengeance. His father’s presence remains a distant pressure to Varg.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>The survivors’ camp and reunion</h2><p>He proposes killing wounded Lik-Rifa/Rotta quickly and Snaka if possible, but calls for intelligence/allies. He warns Grok/Kló belong to his father and might betray/search for them; this is his assessment, without a witnessed new betrayal. He refuses to risk conspicuous Skuld as scout. Vesli then brings the missing Bloodsworn to camp.</p></details><details><summary>The Fury of the Gods · 79</summary><h2>He hears Vesli’s enemy-location report and conditionally promises teeth for courage/loyalty</h2><p>He hears Vesli’s enemy-location report and conditionally promises teeth for courage/loyalty. Later he rises to find an ally, but Hrung stops him with Elvar’s plan and he sits back down. The intended ally and plan content are not yet heard by Varg.</p></details><details><summary>The Fury of the Gods · 81</summary><h2>The charge against the gods</h2><p>Horrified at Snaka’s murder, he warns that eating the heart would empower the siblings, becomes wolf and leads the allied charge with stone guardians/Skuld. He crashes into Lik-Rifa while Rotta bites his haunches; Skuld and the guardians intervene against the rat. No completed god duel follows here.</p></details><details><summary>The Fury of the Gods · 83</summary><h2>He drags the dragon down by a shoulder bite, then suffers her razored tail across his chest</h2><p>He drags the dragon down by a shoulder bite, then suffers her razored tail across his chest. He rises with a long bleeding chest wound and leaps at her again after Skuld’s intervention. No final victory or complete healing is shown.</p></details><details><summary>The Fury of the Gods · 87</summary><h2>He howls, Skuld echoes with a horn and Faunir then stream from the forest to attack the enemy vaesen</h2><p>He howls, Skuld echoes with a horn and Faunir then stream from the forest to attack the enemy vaesen. The apparent coordination is observed, but no terms of an alliance or exact commander is named in this viewpoint.</p></details><details><summary>The Fury of the Gods · 88</summary><h2>Thorkel avenged and the final advance</h2><p>Limping and blood-matted, he tells Orka mentally that his strength fails and the action must happen now. He faces the one-eyed/limp-winged dragon, then leaps at her again at Skuld’s horn. No new complete plan or final god result is yet narrated.</p></details><details><summary>The Fury of the Gods · 89</summary><h2>The Faunir are explicitly called his new allies and turn the tide against enemy vaesen</h2><p>The Faunir are explicitly called his new allies and turn the tide against enemy vaesen. Varg wonders what he promised; the chapter does not disclose the agreement or a completed god victory.</p></details><details><summary>The Fury of the Gods · 90</summary><h2>The last assault on Lik-Rifa</h2><p>He pins the dragon while witches/Orka/Glornir act, remaining torn/limping with a tattered ear, side unstated. He explains that swallowed Hrung slays her by the same poison as Snaka; after her death he howls, then returns human and leans on Skuld. This is a local battle victory, not demonstrated global peace or his own death.</p></details><details><summary>The Fury of the Gods · 92</summary><h2>After Lik-Rifa’s death he searches for Rotta’s body and finds it gone</h2><p>After Lik-Rifa’s death he searches for Rotta’s body and finds it gone. Vol says he will pay Elvar’s promised silver; actual payment is not narrated.</p></details><details><summary>Illustration · The Fury of the Gods · 87</summary><p><a href="assets/ad63c782561464.jpg">Open noncanonical illustration</a></p><p>Faunir emerging from the forest at dawn.</p></details><details><summary>Illustration · The Fury of the Gods · 54</summary><p><a href="assets/7ac9be53d16b41.jpg">Open noncanonical illustration</a></p><p>Noncanonical detail of the four carvings prepared for the oath; the glyph shapes are artistic.</p></details><details><summary>Illustration · The Fury of the Gods · 51</summary><p><a href="assets/d79e07ae4dafdc.jpg">Open noncanonical illustration</a></p><p>Gelta’s dormant form before any waking response is shown.</p></details><details><summary>Illustration · The Fury of the Gods · 54</summary><p><a href="assets/6563c800344cf4.jpg">Open noncanonical illustration</a></p><p>Elvar declaring Ulfrir free after his sworn oath.</p></details><details><summary>Illustration · The Fury of the Gods · 19</summary><p><a href="assets/8107774f8a5f4d.jpg">Open noncanonical illustration</a></p><p>Svea’s news reaching the new tower council.</p></details><details><summary>Illustration · The Fury of the Gods · 68</summary><p><a href="assets/e401e66f94ebea.jpg">Open noncanonical illustration</a></p><p>The black mist at the reopened stone doors.</p></details><details><summary>Illustration · The Hunger of the Gods · 71</summary><p><a href="assets/ffd5920d73661e.jpg">Open noncanonical illustration</a></p><p>Skuld hovers with Störr held captive before Ulfrir&#x27;s jaws.</p></details><details><summary>Illustration · The Fury of the Gods · 88</summary><p><a href="assets/bb25c389270dd9.jpg">Open noncanonical illustration</a></p><p>Skuld’s horn signal above the exhausted wolf and dragon.</p></details><details><summary>Illustration · The Fury of the Gods · 75</summary><p><a href="assets/6db2783ef006df.jpg">Open noncanonical illustration</a></p><p>Snaka appearing through the shattered hall wall as Ulfrir withdraws.</p></details><details><summary>Illustration · The Fury of the Gods · 38</summary><p><a href="assets/b18ccdbba68b24.jpg">Open noncanonical illustration</a></p><p>The stone guardians awakening before Ulfrir changes form.</p></details><details><summary>Illustration · The Fury of the Gods · 77</summary><p><a href="assets/23e1563f8a5e7a.jpg">Open noncanonical illustration</a></p><p>The survivors’ silent memorial for Elvar Chainbreaker.</p></details><details><summary>Illustration · The Fury of the Gods · 69</summary><p><a href="assets/ee64a1f54290d6.jpg">Open noncanonical illustration</a></p><p>The moment before Biórr frees the pinned rat.</p></details><details><summary>Illustration · The Fury of the Gods · 49</summary><p><a href="assets/b260375c8f69d9.jpg">Open noncanonical illustration</a></p><p>The combined working at the river gate.</p></details><details><summary>Illustration · The Hunger of the Gods · 8</summary><p><a href="assets/c1e1851d222f75.jpg">Open noncanonical illustration</a></p><p>The first vessels rise from the earth during Ulfrir&#x27;s restoration.</p></details><details><summary>Illustration · The Hunger of the Gods · 71</summary><p><a href="assets/524e96482641ea.jpg">Open noncanonical illustration</a></p><p>Ulfrir grows into a vast wolf and breaks the roof of Störr&#x27;s hall.</p></details><details><summary>Illustration · The Hunger of the Gods · 8</summary><p><a href="assets/48e82b7d00dbc1.jpg">Open noncanonical illustration</a></p><p>Ulfrir in human form immediately after his restored wolf form collapses.</p></details><details><summary>Illustration · The Hunger of the Gods · 8</summary><p><a href="assets/0d7d99fc1bf6b8.jpg">Open noncanonical illustration</a></p><p>Ulfrir stands in wolf form as breath returns after the blood ritual.</p></details><details><summary>Illustration · The Fury of the Gods · 75</summary><p><a href="assets/855fc6762a4e54.jpg">Open noncanonical illustration</a></p><p>Ulfrir carrying Hrung’s sailcloth and shielding the delayed party.</p></details><details><summary>Illustration · The Fury of the Gods · 9</summary><p><a href="assets/f1404bf8a7493a.jpg">Open noncanonical illustration</a></p><p>Ulfrir dismissing the illusory serpents at the docks.</p></details><details><summary>Illustration · The Fury of the Gods · 69</summary><p><a href="assets/d609fc6ea53452.jpg">Open noncanonical illustration</a></p><p>The free wolf’s refusal, before Broðir’s death.</p></details><details><summary>Illustration · The Fury of the Gods · 44</summary><p><a href="assets/2c1a0be95bf6a4.jpg">Open noncanonical illustration</a></p><p>Ulfrir halting the confrontation under Elvar’s rule.</p></details><details><summary>Illustration · The Fury of the Gods · 51</summary><p><a href="assets/e4846375734133.jpg">Open noncanonical illustration</a></p><p>Elvar testing the firm surface of the rooftop ward.</p></details><details><summary>Illustration · The Hunger of the Gods · 71</summary><p><a href="assets/26df0fb7b1cd66.jpg">Open noncanonical illustration</a></p><p>Warriors kneel or flee before Ulfrir outside the shattered hall.</p></details></noscript>
