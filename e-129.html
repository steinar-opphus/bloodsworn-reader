      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 2</summary><h2>Appearance</h2><p>At Liga, a trader’s wares presented as vaesen parts include a necklace made from Froa-spirit hair.</p></details><details><summary>The Shadow of the Gods · 15</summary><h2>Grief and the decision to leave</h2><p>Froa are powerful vaesen whose spirits are bound to ash trees, living and dying with them. Orka’s local forest guardian is found dead with her tree destroyed in B01-C015.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>Secrets in the Galdur tower</h2><p>Sturla returns to Darl dragging a lifelike wooden female form whose face is contorted in pain and rage. Skalk identifies it as a former Froa-spirit and says she and his apprentices killed its tree. He intends to carve a replacement staff from it. This is a newly observed specimen and attributed account, not an identification with a previously known Froa or a completed staff.</p></details><details><summary>The Hunger of the Gods · 33</summary><h2>A summons after the tower battle</h2><p>Skalk has completed a grey ash-wood staff with a head retaining faint hair and facial features. Guðvarr recognises it as what remains of the Froa brought back by Sturla’s expedition. Light ripples across its grain at Skalk’s touch; during the hyrndur command its eyes flare green and the mouth seems to shift. This specimen remains unmerged with any named Froa, and the effects do not prove restored life or consciousness.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>An unnamed Froa visits the Wave-Jarl camp seeking Ulfrir. Tall as the trees, slender and dark-skinned, with vine-like hair, rope-like arms, green eyes and bark, she is attacked by the Battle-Grim but remains alive to leave. Ulfrir kills Ketil while defending her and forbids further harm. She greets him as a friend of the woods, kneels and vows that her kind’s loyalty will never waver. The pledge is her statement, not independent proof of every Froa’s allegiance; she is not merged with any known individual.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>In their creation account the giant ravens say Snaka made them as he made giants, Froa and the person addressed, contrasting this with Lik-Rifa making vaesen. The account is attributed to the ravens. It does not by itself revise every prior speaker’s use of vaesen for Froa or establish a complete taxonomy.</p></details><details><summary>The Fury of the Gods · 18</summary><h2>The hunters turn towards the Slågen</h2><p>Krúsa says Froa were made by Snaka and are not allies of Lik-Rifa’s children, adding that not every ash tree now has one and that they hurt only if threatened. Her general claims remain attributed. In this encounter a distinct Froa emerges after a spider enters her ash tree and drives off the hunters with ground-born vines, demonstrating this individual’s territorial response and power.</p></details><details><summary>The Fury of the Gods · 51</summary><h2>Ulfrir’s trust and the roof ward</h2><p>The hall tree’s spirit is named Gelta and her wood/vine woman’s form observed; her resistance, sleep and intended waking are Ulfrir’s account. He also predicts ash-tree Froa across the river will dislike the enemy host, without a commanded alliance or actual attack shown.</p></details><details><summary>The Fury of the Gods · 55</summary><h2>The siege begins at the river</h2><p>Froa attack timber-cutters near the besieging camp with roots and vine hair, with one wood-carved woman individually observed. Her hair is thorn-barbed and her lashes mark the dragon’s hide. After Lik-Rifa uproots an ash that spirit collapses still, suggesting a close tree connection in this case rather than a universally demonstrated death rule. Other voices/attacks continue; no ordered alliance with Elvar or Gelta’s action is identified.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>Varg sees Lik-Rifa tearing trees and hears inhuman cries; Vol says she is killing Froa</h2><p>Varg sees Lik-Rifa tearing trees and hears inhuman cries; Vol says she is killing Froa. The uprooting/destruction then subsides and timber-cutting resumes, without a final spirit casualty count or a witnessed Gelta response.</p></details><details><summary>The Fury of the Gods · 70</summary><h2>The gods collide and the tree burns</h2><p>The named hall spirit Gelta wakes as a giant grey female form with vine hair/green-amber eyes, actively binding a dragon in thick roots. She renews them under resistance, then suffers burning vines when Rotta fires the tree. This observed power and injury do not establish universal species invulnerability, fatal tree rules or the unnamed earlier spirit’s identity.</p></details><details><summary>The Fury of the Gods · 71</summary><h2>Guðvarr finds Estrid</h2><p>The hall Froa Gelta suffers fire over limbs/vines/body; frost attempts fail, she collapses and her binding roots fall away. This is the named individual’s burning collapse and loss of binding, not a universal Froa mortality law or identification with the earlier siege-ash spirit.</p></details><details><summary>Illustration · The Fury of the Gods · 70</summary><p><a href="assets/8226a3d8f585da.jpg">Open noncanonical illustration</a></p><p>Gelta’s first binding before the counterattack.</p></details><details><summary>Illustration · The Fury of the Gods · 55</summary><p><a href="assets/76b7c5c0aeddd9.jpg">Open noncanonical illustration</a></p><p>The ash being uprooted as the local spirit falters.</p></details></noscript>
