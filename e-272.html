      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 37</summary><h2>Introduction</h2><p>Refna is a fair-haired girl among the rescued children aboard the Sea-Wolf. Varg estimates her age at eleven or twelve. She shows her calloused palms and says she can row and has strong hands; her exact age and individual rowing performance are not established.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>Story and connections</h2><p>Glornir calls her Refna Strong-Hands and asks her to show him. She grins, lifts an oar and takes an empty oar-chest as the ship prepares to depart Liga in pursuit towards Iskidan. No oath, formal apprenticeship or adoption is shown. She is distinct from the adult Revna Hare-Legs.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>She brings the seasick Varg a rag and a drinking horn of fresh water, wipes his chin and lets him rinse his mouth. The narration now confirms that she kept pace with the Bloodsworn through the first rowing shift out of Liga. Very thin but strong, mostly muscle and gristle, she has retained Glornir’s Strong-Hands name; this does not establish a supernatural ancestry or formal oath.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>She quotes her older brother Kel’s advice about a helping hand, then says he is dead. She reports that their parents were killed when the two children were taken, and that Kel repeatedly tried to escape. On the last attempt she fell and hurt her ankle, and he refused to leave her. No current ankle condition is specified.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>She says Brák nailed Kel to a wagon and cut his throat as an example after recapture. She confirms Varg’s Troll-Slayer identification question, says she hates him and names Drekr as chief of the captors. Røkia strokes her hair during the testimony. The account is not a witnessed execution in this chapter and does not identify Frøya’s fate.</p></details><details><summary>The Fury of the Gods · 21</summary><h2>Reunion in the island harbour</h2><p>Fair-haired, she rides Einar’s shoulders at the island reunion, then hugs Glornir’s leg and says she is glad he is safe. His exaggerated complaint about her grip is teasing, not an actual blood-loss event. The reunion group boards Sea-Wolf at his urgent order.</p></details><details><summary>The Fury of the Gods · 27</summary><h2>The ships collide</h2><p>She drops onto the female prow-champion attacking Einar, pulls her head back and bites her neck with visibly growing sharp teeth. Other children join in pulling the warrior down. This action is directly observed, but no exact new ancestry or final fate for the champion is supplied.</p></details><details><summary>The Fury of the Gods · 29</summary><h2>The fight aboard the stern drakkar</h2><p>She and a knot of children follow Einar and Svik into the caster’s escort and claw and bite one druzhina to the deck. This remains the child Refna Strong-Hands, distinct from Revna Hare-Legs.</p></details><details><summary>The Fury of the Gods · 37</summary><h2>Life aboard Sea-Wolf</h2><p>She wrestles playfully with Einar, then angrily tackles Breca for drawing blood from him, colours flickering in her eyes. Einar pulls her clear and teaches that even concern for his recently improved head does not permit attacking people. She calms enough to be put down, still scowling; no new named lineage or full transformation is stated.</p></details><details><summary>The Fury of the Gods · 39</summary><h2>She takes an oar as the shift changes, prompting Breca to ask why he cannot row too</h2><p>She takes an oar as the shift changes, prompting Breca to ask why he cannot row too. Orka’s refusal concerns his lack of rowing practice, not a statement that Refna lacks strength or is too young.</p></details><details><summary>The Fury of the Gods · 73</summary><h2>Held by Brák at seax-point, she snarls for Einar</h2><p>Held by Brák at seax-point, she snarls for Einar. Her eyes flicker green and her nails grow long/dark; she claws Brák’s hand/wrist, drops and rolls clear, rising crouched with claw-like hands. This establishes partial manifestation and release from his grip, without a complete animal form or completed evacuation.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>Leif’s death and the tunnel escape</h2><p>She is free of Brák and weeps on Einar’s explicitly dead body while about a dozen children mourn around him. Their presence is established; the evacuation is still in progress with the survivors entering Ulfrir’s tunnel.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>The surviving Bloodsworn shelter her and the children out of the tunnel</h2><p>The surviving Bloodsworn shelter her and the children out of the tunnel. Weeping, she asks Uspa to restore Elvar/Einar; Uspa explains why she cannot and kneels to hug her. This does not establish a resurrection or a new genealogy for the dead.</p></details><details><summary>The Fury of the Gods · 84</summary><h2>Silrið’s defeat and vengeance for Frøya</h2><p>She appears with the seax-bearing children at Røkia’s whistle and strikes pinned Brák while invoking Einar. The other children follow; this is a facilitated revenge scene, not a newly documented training or freedom rite.</p></details><details><summary>The Fury of the Gods · 92</summary><h2>Breca shows her the beehive after the barrows are completed</h2><p>Breca shows her the beehive after the barrows are completed. Varg names her among the children for whom the company should provide a lasting home.</p></details><details><summary>Illustration · The Hunger of the Gods · 47</summary><p><a href="assets/3fa54235105d0e.jpg">Open noncanonical illustration</a></p><p>Refna smiles aboard the Sea-Wolf as the horn is returned.</p></details></noscript>
