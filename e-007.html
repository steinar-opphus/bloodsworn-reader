      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 1</summary><h2>The hunt and the ruined steading</h2><p>Fellur is a fishing village. It lies on the eastern edge of a fjord. The fjord opens into the sea to the south.</p></details><details><summary>The Shadow of the Gods · 1</summary><h2>The hunt and the ruined steading</h2><p>Orka and Thorkel have visited to trade for provisions. Breca has played with Harek on its beach.</p></details><details><summary>The Shadow of the Gods · 1</summary><h2>The hunt and the ruined steading</h2><p>A track from the eastern side of Asgrim’s steading leads towards the village.</p></details><details><summary>The Shadow of the Gods · 3</summary><h2>Bodies brought to Fellur</h2><p>Fellur has a few dozen reed-thatched wattle-and-daub buildings. A larger longhouse stands at its centre. Parts of its stockade are rotten. The wall ends well short of its dark-sanded beach.</p></details><details><summary>The Shadow of the Gods · 3</summary><h2>Bodies brought to Fellur</h2><p>Fishing nets hang on the beach to dry and await repair. Its handful of timber piers are mostly empty, with a few fishing boats and byrding coasters moored.</p></details><details><summary>The Shadow of the Gods · 3</summary><h2>Bodies brought to Fellur</h2><p>Orka and Thorkel have brought pelts here to trade. A dead god’s knuckle-bone in the gate helps keep vaesen out.</p></details><details><summary>The Shadow of the Gods · 3</summary><h2>Bodies brought to Fellur</h2><p>Sigrún is Jarl of Fellur. Guðvarr announces an Althing after her return. It is to be held on the Oath Rock.</p></details><details><summary>The Shadow of the Gods · 22</summary><h2>Night raid in B01-C022</h2><p>Althing visitors camp between the woodland and the gates. Orka scales the wall, frees Mord and Lif, and enters Sigrún’s chamber through a window. She escapes to the brothers’ fishing boat as Guðvarr calls vengeance from the pier.</p></details><details><summary>The Hunger of the Gods · 41</summary><h2>Sigrún&#x27;s reckoning with Guðvarr</h2><p>Sigrún says Orka’s attack made her appear weak to rivals whom she believes covet her lands. Guðvarr wishes to return home, but she says Skalk holds his life and that Helka has separately asked the jarls to remain in Darl for Orlyg’s meeting. No return to Fellur or loss of its territory occurs.</p></details><details><summary>Illustration · The Shadow of the Gods · 53</summary><p><a href="assets/25dfeb36d23fac.jpg">Open noncanonical illustration</a></p><p>A daytime establishing view of Fellur.</p></details></noscript>
