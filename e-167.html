      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 26</summary><h2>Oar-dance and weapons practice</h2><p>Skalk says the mission goes to the River Slågen&#x27;s source at the Bonebacks, on Helka&#x27;s northwestern border.</p></details><details><summary>The Hunger of the Gods · 7</summary><h2>An offer to return to the Bloodsworn</h2><p>Glornir says the Sea-Wolf is moored on the river with an oar-light crew and that Edel’s party will return to it.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>Ilska tells Lik-Rifa that Helka’s lands reach its banks and that everything west comes under Störr. The boundary is part of her political report, not a newly surveyed or conquered frontier.</p></details><details><summary>The Fury of the Gods · 18</summary><h2>The hunters turn towards the Slågen</h2><p>While following the suspected fugitives west, Sigrún says crossing the river would enter the enemy territory she calls Störr’s lands. The party has not crossed it in this chapter; her language does not establish current knowledge of Snakavik’s succession.</p></details><details><summary>The Fury of the Gods · 20</summary><h2>The hunters camp by a stream while closing on the river</h2><p>The hunters camp by a stream while closing on the river. Munni thinks the reported group can be caught before it, but his distance and count are uncertain. The next approach crosses open heath into dense woods and a boulder glade; no Slågen crossing is completed.</p></details><details><summary>The Fury of the Gods · 31</summary><h2>The hunters cross a broad wooden bridge over its white-spuming water into Jarnvidr</h2><p>The hunters cross a broad wooden bridge over its white-spuming water into Jarnvidr. Sigrún’s riders lead, followed by Krúsa’s skraeling, Skapti and frost-spiders, which disperse into the forest canopy. No precise bridge name or mapped coordinate is supplied.</p></details><details><summary>The Fury of the Gods · 41</summary><h2>Lik-Rifa’s army approaches with Jarnvidr visible beyond its curl</h2><p>Lik-Rifa’s army approaches with Jarnvidr visible beyond its curl. Ilska repeats its old boundary role between Helka and Störr’s lands, while Lik-Rifa claims ownership. No bridge crossing, exact position or complete conquest occurs in this chapter.</p></details><details><summary>The Fury of the Gods · 45</summary><h2>The host enters the Iron Wood</h2><p>Lik-Rifa’s host crosses farther north than the hunters previously did, then skirts the north-eastern Iron Wood boundary towards the den. The chapter supplies no precise crossing name, distance or complete map.</p></details><details><summary>Illustration · The Shadow of the Gods · 26</summary><p><a href="assets/f00a711b7b8223.jpg">Open noncanonical illustration</a></p><p>The Slågen crossing and Jarnvidr’s forest edge.</p></details></noscript>
