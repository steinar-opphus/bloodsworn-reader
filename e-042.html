      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 4</summary><h2>Introduction</h2><p>Varg identifies his pursuer as Leif. Leif names himself Leif Kolskeggson in B01-C004.</p></details><details><summary>The Shadow of the Gods · 4</summary><h2>Appearance</h2><p>He has a black beard. A scar runs through his lip.</p></details><details><summary>The Shadow of the Gods · 4</summary><h2>Story and connections</h2><p>He accuses Varg of butchering his father. He also accuses Varg of slaying three other freedmen. Varg recalls blood and carnage after coming to his senses at Snepil’s death.</p></details><details><summary>The Shadow of the Gods · 4</summary><h2>Story and connections</h2><p>Leif claims Varg as his thrall and property. Varg asserts that he earned his freedom. Leif invokes a right of weregild to claim him.</p></details><details><summary>The Shadow of the Gods · 4</summary><h2>Story and connections</h2><p>Leif cuts Varg’s ribs with his spear. He threatens to drag Varg behind his horse back to the farm. He threatens to force Varg to work for him for life.</p></details><details><summary>The Shadow of the Gods · 4</summary><h2>Story and connections</h2><p>He promises to have Orl carve Varg a wooden hand. The grey-bearded rescuer intervenes, leaving Leif doubled over and dropping the cleaver. The rescuer declares Varg one of the Bloodsworn.</p></details><details><summary>The Hunger of the Gods · 43</summary><h2>The feast and the shield-dance</h2><p>He comes to Helka’s feast with Sterkur, dressed in a fur-trimmed wool cap, red wool cloak, embroidered tunic and belted seax. Guðvarr sees a tall broad man with a weathered face, black beard and scar through cheek and lips. His old beard/scar details remain consistent; this is a new audience and scene outfit.</p></details><details><summary>The Hunger of the Gods · 43</summary><h2>The feast and the shield-dance</h2><p>Admitted without Sterkur to the queen’s immediate presence, he calls himself a tax-paying farmer and asks permission to hunt Varg. He repeats his accusation that Varg was his farm thrall who murdered his father and stole silver, explaining that he fears offending Helka because of the Bloodsworn’s employment. These remain his accusations beside Varg’s earlier freedom claim.</p></details><details><summary>The Hunger of the Gods · 43</summary><h2>The feast and the shield-dance</h2><p>He says his wealth funds Sterkur death-in-the-eye and his band of mercenaries. Helka blesses the hunt and gives news of the Bloodsworn leaving Liga after Jaromir, with their presence in Iskidan only her suspicion. Leif thanks her and leaves with Sterkur. No new interception or encounter with Varg occurs.</p></details><details><summary>The Fury of the Gods · 12</summary><h2>The captors reveal their purpose</h2><p>He appears with Sterkur in the wooden holding place at Ulaz, retaining his black beard, cheek-to-lip scar, fur-trimmed hat and embroidered tunic. He repeats that Varg murdered his father and is his property under law, which Varg and Røkia reject. He wants all three taken to Sterkur&#x27;s ship and killed there, but Sterkur proposes killing the companions first. No court settles the legal claims and no transport is completed.</p></details><details><summary>The Fury of the Gods · 14</summary><h2>He retreats before Kesha’s attack until Sterkur shields him and drags him out</h2><p>He retreats before Kesha’s attack until Sterkur shields him and drags him out. Varg sees them running along the dockside with several warriors but is ordered to abandon pursuit. Leif escapes this encounter; neither his death nor the earlier ownership dispute is resolved.</p></details><details><summary>The Fury of the Gods · 36</summary><h2>The dragon’s host marches out</h2><p>Tall and black-bearded in mail with a belt seax, he introduces himself to Ilska as Leif Kolskeggson, new to Sterkur’s crew. He openly says he fights for the dragon because the Bloodsworn oppose her and he wants them dead. Drekr welcomes the shared hatred and Ilska calls the band into the host. This is recruitment, not fulfilment of his vengeance or an encounter with Varg.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>Freedom and the approaching army</h2><p>The golden-eye company appears with the besieging host; Svik identifies Leif and Sterkur and Varg voices his grievance against Leif. No renewed face-to-face confrontation or completed vengeance is shown.</p></details><details><summary>The Fury of the Gods · 73</summary><h2>Brák’s hostages and Einar’s fall</h2><p>Leif appears with the golden-eye shieldbearers and confronts Varg, cutting his group off from Einar/Svik. The two leaders flank Varg; their dark-haired spear-bearer/fair-haired swordsman descriptions are not individually mapped here. Varg finally runs at Sterkur, with no completed duel or legal adjudication of the thrall claim.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>Varg’s cleaver has gashed one shoulder when the tremors drop both men</h2><p>Varg’s cleaver has gashed one shoulder when the tremors drop both men. Varg attacks, declares he is no thrall and bites his throat; Leif is explicitly dead. This ends his personal pursuit, without a retrospective court ruling about the earlier freedom dispute.</p></details><details><summary>Illustration · The Fury of the Gods · 12</summary><p><a href="assets/d0f188333e567f.jpg">Open noncanonical illustration</a></p><p>The companions’ defiance before the execution attempt.</p></details><details><summary>Illustration · The Hunger of the Gods · 45</summary><p><a href="assets/a7476b1dfffa21.jpg">Open noncanonical illustration</a></p><p>Leif entering the mead hall before removing his cap.</p></details></noscript>
