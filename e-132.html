      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 16</summary><h2>Training and the price of an akáll</h2><p>Varg sees this pale, long object embedded in a rafter above the dais, describing it as resembling a sliver of bone. One end glints like silver.</p></details><details><summary>The Shadow of the Gods · 16</summary><h2>Training and the price of an akáll</h2><p>Varg feels new head pressure as he approaches the dais, but the object’s nature and any connection to the pressure are unestablished. See the unresolved question.</p></details><details><summary>The Shadow of the Gods · 18</summary><h2>Identification reported in B01-C018</h2><p>Torvik identifies the sliver over Logur’s high seat as a fragment of the Vackna Horn, and says Skullsplitter gave it to Logur. He credits it with helping make Logur rich. Varg remembers a strange sensation that he felt emanating from the sliver. The identification and power accounts remain attributed; the cause of Varg’s earlier head pressure has not been independently established.</p></details></noscript>
