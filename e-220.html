      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 13</summary><h2>Introduction</h2><p>Terna is a grey-haired, closely cropped and gaunt thrall who recognises Varg. He remembers her being sold from Kolskegg’s farm with Frøya. Njal says he later bought her at Darl’s thrall-market.</p></details><details><summary>The Hunger of the Gods · 13</summary><h2>Story and connections</h2><p>She is surprised to hear Varg call Frøya dead. She says Frøya was alive when Brimil sold Terna to Njal, and reports Brimil’s repeated beatings of Frøya for escape attempts. She remembers Frøya speaking of and worrying about Varg.</p></details><details><summary>The Hunger of the Gods · 13</summary><h2>Story and connections</h2><p>She asks how Varg left the farm; he says he killed Kolskegg and ran. Her conversation does not establish Frøya’s eventual fate or identify a killer.</p></details></noscript>
