      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 1</summary><h2>The hunt and the ruined steading</h2><p>Thorkel calls the land visible from the ridge Vigrið, the Battle-Plain.</p></details><details><summary>The Shadow of the Gods · 1</summary><h2>The hunt and the ruined steading</h2><p>In his account, this is where the gods fought and died. He identifies the distant mountains as Snaka’s earth-covered bones.</p></details><details><summary>The Shadow of the Gods · 2</summary><h2>A fugitive at the trial gate</h2><p>The Bloodsworn are famed throughout Vigrið.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>Ilska describes Störr of Snakavik, Helka of Darl and Orlyg of Svelgarth as growing powers collecting or absorbing petty jarls. Her account also describes Tainted persecution and the subsequent collar-based servitude. No specific new conquest is witnessed.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>The sharp eastern crags mark the land’s eastern edge, with the Icebound Sea beyond. Lik-Rifa’s company follows them south towards the eastern Bonebacks. The described course is not a new sea voyage or proof of Myrk’s reported western rendezvous.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Rowing and a merchant ship intercepted</h2><p>Elvar’s Hvítá journey leaves mountains and hills for rolling plains, woods, meadows and towns under Störr’s control before curling west towards Snakavik. A merchant reports a threatened war between Störr and Helka over a suspected Orlyg alliance, explicitly as gossip. A separate mixed group of dragon-worshippers crosses the river east in daylight with children and provision wagons; no exact destination is disclosed.</p></details></noscript>
