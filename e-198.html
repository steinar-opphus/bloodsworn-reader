      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 48</summary><h2>The guardian of Oskutreð</h2><p>Elvar recalls a saga identifying Valkyrie as the winged daughter of Orna and Ulfrir, whose murder prompted Orna’s vengeance against dragon-born.</p></details><details><summary>The Hunger of the Gods · 15</summary><h2>The search through Rotta&#x27;s chamber</h2><p>Gunnar’s later saga account says Rotta murdered, flayed and displayed her, blaming Lik-Rifa before Orna and Ulfrir exposed him. He says Rotta carved Raudskinna into her skin. These remain attributed tales rather than a witnessed historical scene.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>Ulfrir says he and others hunted Rotta to the ends of the world for what Rotta did to his Valkyrie. He claims he fixed the punishment chains in the rock and enjoyed the serpent venom burning Rotta. This adds his testimony to the older saga accounts without independently witnessing each detail of the murder and flaying.</p></details><details><summary>The Fury of the Gods · 51</summary><h2>Ulfrir’s trust and the roof ward</h2><p>Ulfrir explicitly calls Valkyrie his daughter while recalling her abduction before the Guðfalla and his death interrupted plans to wake Gelta. The already registered identity is reused; he does not newly name her abductor here.</p></details><details><summary>The Fury of the Gods · 55</summary><h2>The siege begins at the river</h2><p>Lik-Rifa taunts Rotta for skinning Ulfrir’s daughter alive; the name is not repeated in this exchange. This repeats the act previously attributed to him in the Valkyrie saga account, now as another god’s accusation, rather than a newly witnessed past scene.</p></details></noscript>
