      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 67</summary><h2>Elvar returns to her father&#x27;s hall</h2><p>Hjalmar Peacemaker is identified by Sighvat as this warband&#x27;s chief, seen speaking with Störr. No membership count or collective battle result is supplied.</p></details><details><summary>The Fury of the Gods · 33</summary><h2>Their knotwork-raven shields identify Hjalmar’s approaching crew</h2><p>Their knotwork-raven shields identify Hjalmar’s approaching crew. They bring the bound and leashed Grend to Elvar’s pier, where he is accused of Tainted blood. The charge is Hjalmar’s, without a demonstrated lineage or final ruling.</p></details><details><summary>The Fury of the Gods · 68</summary><h2>Elvar’s fall and the rebellion in the hall</h2><p>They are explicitly identified fighting Elvar’s door defenders, their two-raven-scroll shields visible. Glornir kills Hjalmar, but survivors fight their way toward Estrid and her drengrs. This is a named current rebel force without an exact number or every member’s fate.</p></details><details><summary>The Fury of the Gods · 69</summary><h2>Biórr’s doubts amid the fighting</h2><p>Biórr takes a fallen two-black-raven shield associated with Hjalmar’s warriors, called Hjalmar’s Peacemakers in his thought. This is an unnamed member’s shield, not the chief’s already shattered shield or proof Biórr joins the faction.</p></details><details><summary>The Fury of the Gods · 71</summary><h2>Guðvarr finds Estrid</h2><p>Two-raven shields appear in Estrid’s combined formation when Sigrún joins it, before the huge attackers shatter the wall. This does not restore the dead Hjalmar or establish every surviving Fell-Hearted member’s fate.</p></details></noscript>
