      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>In her lesson to the children, Lik-Rifa condemns Tainted as an insult, proposes Fortunate Ones and says divine blood makes them special. She describes different abilities by ancestry, including eagle sight, hound senses, bear strength, wolf savagery and fox cunning. These are her teaching and examples, not a complete tested classification or a newly adopted universal name.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>Ilska visibly demonstrates red eyes, growing claws and sharp teeth before the eye-fire fades. Lik-Rifa identifies her as dragon-born of her blood. This partial change is distinct from the general claims about what every child will be able to do.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>Lik-Rifa teaches that emotion awakens the beast and makes the children recall being taken from their families, then speak inwardly to it. Bjarn answers bear, the camp boy Harek answers boar and Breca reports wolf and bear. Their answers and reactions are observed, without full transformations or tests of new abilities.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>The narration in Biórr’s viewpoint explains that one parental bloodline usually dominates; feeling both is rare but known, and jarls value such Tainted more highly. Biórr predicts that Breca’s wolf and bear will make him fierce, strong and cunning. The usual pattern is qualified and the individual future remains a prediction.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>Orka recognises Ulfrir’s wolf-call, feels his presence in her blood and hears him say Daughter within her head. His invitation and pack appeal strongly attract her, but she resists. He claims his blood runs in her veins and calls himself in essence her father. This is a particular narrated experience and an ancestral claim, not an unrestricted communication system, unavoidable control or a universal rule for god-blooded people.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>Nastrandir revealed in the snow</h2><p>Lik-Rifa’s evening teaching now continues in smaller groups, each child assigned to a Tainted Raven-Feeder mentor. Storolf teaches children assigned Svin’s boar blood and tells Harek he belongs to that line; he also claims Svin for himself and jokingly assigns Kráka Snaka’s blood. These statements and the teaching arrangement do not demonstrate transformations or mastery of every promised power.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>Nastrandir revealed in the snow</h2><p>Ilska and the dragon-born demonstrably melt a snow route with Galdur-rune powers. Storolf’s playful boar imitation is not an actual change. Lik-Rifa later fully changes into a dragon and sings before the cliff upheaval reveals her hall; these are particular observed uses, not a complete system of limits or untranslated spell meanings.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>Rotta says he feels his blood in Biórr, who agrees and regards the god as father of his bloodline. Biórr senses power and friendship, while Rotta’s listening-like pause and apparent response to an unspoken title question remain particular interactions. No universal sensing range, unrestricted thought-reading or guaranteed benevolence is established. Rotta’s apology and promise do not themselves free or heal Biórr.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>Lik-Rifa announces restoration for their bloodlines and death for Ulfrir. Her final song is explained by Rotta as calling the vaesen she created and bred. This created-children language is not silently equated with every inherited divine bloodline or every Tainted person being summoned.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>Sæunn’s intended task is now blood-scent tracking: Orka attributes Hundur ancestry to her and supplies Myrk’s horse blood and fresh neck blood. Sæunn sniffs and assures her she can track. No completed pursuit, reliable range or general mechanism is demonstrated. Orka’s correction of mistress does not remove the iron collar or itself establish freedom.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>Myrk’s eye-fire and Eldur sparks occur while she is bound. Orka’s cut and threat are followed by the eye-fire receding and her calming, without demonstrating a universal magic-interruption rule or full dragon transformation.</p></details></noscript>
