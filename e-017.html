      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 2</summary><h2>A fugitive at the trial gate</h2><p>Liga is a market town. It is a port on the south-eastern banks of a fjord. A stockade surrounds it.</p></details><details><summary>The Shadow of the Gods · 2</summary><h2>A fugitive at the trial gate</h2><p>A grass-turfed long-hall stands on high ground. Jarl Logur’s mead hall lies at the foot of the cliffs above the town.</p></details><details><summary>The Shadow of the Gods · 2</summary><h2>A fugitive at the trial gate</h2><p>The town spreads along a wide black-sanded beach, with crowded piers and hearth smoke above it. Timber-sided buildings line wide muddy market streets, and pier-cranes serve the busy quay.</p></details><details><summary>The Shadow of the Gods · 2</summary><h2>A fugitive at the trial gate</h2><p>A trader offers wares presented as vaesen body parts. The stew trader asks a half-bronze for a bowl.</p></details><details><summary>The Shadow of the Gods · 2</summary><h2>A fugitive at the trial gate</h2><p>A dock worker identifies arriving strangers as coming from Iskidan.</p></details><details><summary>The Shadow of the Gods · 2</summary><h2>A fugitive at the trial gate</h2><p>The stew trader says the Bloodsworn are guests of Jarl Logur at the longhouse. A woman in the queue says they are holding a weapons trial to fill a vacancy.</p></details><details><summary>The Shadow of the Gods · 18</summary><h2>New weapons and an attack at the docks</h2><p>Svik says the Bloodsworn protect Liga’s port from pirates and raiders. In B01-C018, Jaromir’s mounted warriors block the crew’s route to the Sea-Wolf and attack after Glornir refuses to surrender Sulich. Logur arrives with blue-shielded guards as fighting stops and three eagle-bannered drakkar approach; Helka has come to Liga.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>Sulich says Jaromir’s ships are docked here and expects him to flee towards Iskidan. This is the Bloodsworn’s stated interception plan after leaving Darl; the chapter does not show the ships, Jaromir at Liga or a completed interception.</p></details><details><summary>The Hunger of the Gods · 32</summary><h2>Children hidden in the barrels</h2><p>Glornir names Liga as the place where he promises to release Hakon, with no harm unless the prince tries to escape. This is a promised future release; the ship has not reached Liga in this chapter.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>The Bloodsworn arrive across the fjord. Varg now sees the town as a fair-sized trading port compared with Darl. The dockside has mooring officials, unloading merchants and tallymen carving numbers and runes into birch-bark tablets beside scales and weights.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>Palrun’s fee dispute with Glornir ends in assault and Logur’s intervention. The jarl orders Sea-Wolf provisioning and accepts Hakon for later return with Helka’s longship. Røkia directs Sulich towards the traders for a bowstring. Glornir reports Jaromir has already sailed, and the Sea-Wolf leaves in pursuit of Iskidan.</p></details><details><summary>The Fury of the Gods · 48</summary><h2>Return from the sortie</h2><p>Logur says he and his oathsworn rowed hard from Liga before their actual arrival and welcome at Wolfdales. Their force is over a hundred here, not a census of all Liga’s people or forces.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>The roof ward opens</h2><p>Orka describes one of the immense observed fleets sailing toward Liga; Glornir calls the fleets Rurik’s planned invasion. This is an approach seen/reported from Wolfdales, not a witnessed landing or conquest of the settlement.</p></details><details><summary>Illustration · The Shadow of the Gods · 53</summary><p><a href="assets/8aed35503982f4.jpg">Open noncanonical illustration</a></p><p>Liga&#x27;s harbour as seen on Varg&#x27;s arrival day.</p></details></noscript>
