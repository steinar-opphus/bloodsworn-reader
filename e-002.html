      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 1</summary><h2>Introduction</h2><p>Thorkel is Orka&#x27;s husband and Breca&#x27;s father.</p></details><details><summary>The Shadow of the Gods · 1</summary><h2>Appearance</h2><p>Black hair streaked with grey and a scar from cheek to jaw mark his appearance. On the hunt his beard is braided, and he wears a woollen nålbinding cap.</p></details><details><summary>The Shadow of the Gods · 8</summary><h2>Appearance</h2><p>He has dark eyes and a nose that has been broken repeatedly.</p></details><details><summary>The Shadow of the Gods · 1</summary><h2>What he teaches Breca</h2><p>Thorkel identifies the wounded beast as a fell-wolf and tastes its blood. His stories also give Breca a way of understanding the land: he presents Snaka as the father of the gods.</p></details><details><summary>The Shadow of the Gods · 3</summary><h2>Following the tracks beyond the steading</h2><p>He is the better tracker of the spouses, so he follows the trail while Orka and Breca take the bodies to Fellur. He returns without finding the killers, reporting that the tracks reached a river feeding the Skarpain and that three boats had left signs on its bank.</p></details><details><summary>The Shadow of the Gods · 6</summary><h2>Finding Breca and restraining Orka</h2><p>At the pool he finds Breca and thinks he smells Näcken. When Orka raises her hand again, he catches her wrist.</p></details><details><summary>The Shadow of the Gods · 8</summary><h2>The life he chooses over his past</h2><p>Orka calls him Thorkel Ulfsson. He speaks of having worn a thrall&#x27;s collar and suffered lashings at Breca&#x27;s age, but says he chooses each day to concentrate on Orka and their son rather than the past. His plan for the Althing is to attend quietly and avoid attention.</p></details><details><summary>The Shadow of the Gods · 12</summary><h2>Intervening in the fatal duel</h2><p>The Althing draws him into violence despite that intention. He kicks the warrior-thrall off Virk, takes a seax cut and restrains Orka, then lays his cloak over Virk&#x27;s body.</p></details><details><summary>The Shadow of the Gods · 15</summary><h2>Fairness and restraint in weapons craft</h2><p>Thorkel urges Breca to act fairly and avoid unnecessary fights; even necessary killing should be kept free of hatred. To him a weapon is a tool whose worth depends on its wielder. He offers Mord and Lif hospitality and advises them against returning to the Althing. With his own wound shallow and scabbed, he agrees to leave the area with Orka, while disputing her interpretation of the warrior-thrall&#x27;s blood tasting.</p></details><details><summary>The Shadow of the Gods · 17</summary><h2>His last words outside the burning hall</h2><p>Orka finds him still breathing among the bodies, with blades in his chest and belly. He tells her Breca has been taken and that he failed to stop the attackers. Outside the hall he says &#x27;Dragon-born&#x27;, without identifying whom he means, apologises and dies. Orka places his long-axe in his hand.</p></details><details><summary>The Shadow of the Gods · 19</summary><h2>Vesli recalls his defence and change</h2><p>Vesli later describes how he barred the gates, then opened them to fight as smoke and fire choked those inside. She says he changed, but does not finish the description; the red-eyed man with two long claws belongs to her account of the fighting. With Vesli&#x27;s help, Orka buries Thorkel with his axe, an ivory-hilted seax and gold rings, then builds and seals a barrow.</p></details><details><summary>The Hunger of the Gods · 1</summary><h2>Rest and restraint in the burned hall</h2><p>Orka says that, while pregnant with Breca, she and Thorkel chose to leave the Bloodsworn and escaped by swimming ashore during a ship battle. The company believed them killed; this explains her account of his disappearance rather than a new death event.</p></details><details><summary>The Hunger of the Gods · 3</summary><h2>Mord&#x27;s burial and a blood feud</h2><p>When asking Orka about his brother&#x27;s death, Glornir calls Breca his nephew. Orka recounts finding Thorkel down at their burning steading and identifies Drekr as the target of her vengeance.</p></details><details><summary>The Hunger of the Gods · 7</summary><h2>An offer to return to the Bloodsworn</h2><p>The narration explicitly identifies him as Glornir’s younger brother. Glornir asks to share vengeance for his brother, while Orka promises to return with an account of that vengeance; these are present intentions rather than completed revenge.</p></details><details><summary>The Hunger of the Gods · 10</summary><h2>The night-hag in the woodland camp</h2><p>In conversation with Edel, Orka explicitly says Lif knows Thorkel was Berserkir. This disclosure is recorded at book 2, chapter 10 as her statement rather than silently inserted into earlier descriptions.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>Røkia recounts the Bloodsworn’s perspective on the earlier disappearance: he and Orka were missing after three longships attacked the Sea-Wolf outside a bay, and searches failed to find them. The company presumed currents had taken them. This is historical testimony about the old mistaken loss, not another death event or a change to his later established death.</p></details><details><summary>The Fury of the Gods · 32</summary><h2>Debts, kinship and the voyage onward</h2><p>Orka explicitly identifies Glornir to Breca as his father’s brother; Glornir confirms the boy is his brother’s son and calls him Breca Thorkelsson. The paternal uncle/nephew relationship is confirmed at this reading cutoff. Orka says recovering Breca fulfils only part of her oath because Thorkel is still unavenged; Glornir promises help finding Drekr.</p></details><details><summary>The Fury of the Gods · 52</summary><h2>The choice to hide the beast</h2><p>Glornir says Breca resembles his father in looks, speech and walk, and explicitly calls Thorkel his blood brother while Orka is his oath-sister. Orka says she thinks of Thorkel constantly. This remembered kinship does not restore him to life or make Orka/Glornir biological siblings.</p></details><details><summary>The Fury of the Gods · 86</summary><h2>Orka and Breca confront Drekr</h2><p>Orka confronts Drekr over his unfair killing with help, reading his reaction as confirmation; no helper is named. She and Breca invoke Thorkel/Papa in their finishing attack, completing the strongly implied family revenge without a new replay of the original death.</p></details><details><summary>The Fury of the Gods · 88</summary><h2>Orka confirms Drekr dead to Glornir, who says Thorkel is avenged</h2><p>Orka confirms Drekr dead to Glornir, who says Thorkel is avenged. This is the family/companions’ declared completion after the direct corpse sighting, not a new death account for Thorkel.</p></details><details><summary>The Fury of the Gods · 91</summary><h2>The company returns to his overgrown stone barrow</h2><p>The company returns to his overgrown stone barrow. Breca tells Papa of rescue and vengeance, while Orka remembers and mourns him. Vol brings his brother Glornir to rest beside him and the company begins digging.</p></details><details><summary>The Fury of the Gods · 92</summary><h2>The company now stands around three completed barrows for Thorkel, Glornir and Spert</h2><p>The company now stands around three completed barrows for Thorkel, Glornir and Spert. Varg places a stream-stone on Glornir’s and Vol the final stone before the gathering moves to food and discussion.</p></details><details><summary>The Shadow of the Gods · 1</summary><h2>Personality</h2><p>Thorkel reassures Breca after the boy misses his throw, admitting that he missed his own first attempt when he was eleven summers old.</p></details><details><summary>Illustration · The Shadow of the Gods · 21</summary><p><a href="assets/3a08fab11d7e78.jpg">Open noncanonical illustration</a></p><p>Thorkel with his long-axe at the family steading.</p></details></noscript>
