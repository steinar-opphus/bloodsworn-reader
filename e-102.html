      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 11</summary><h2>Introduction</h2><p>In his chapter 11 appearance he is slim, of average height and dark-skinned, his head shaved except for a long, thick black braid. He wears a grey wool kaftan buckled down the centre, baggy breeches and tight ankle-to-knee leg wraps, and carries a black, red-spattered shield and curved single-edged sword.</p></details><details><summary>The Shadow of the Gods · 13</summary><h2>A feast interrupted</h2><p>Glornir names the shaven-haired Bloodsworn warrior Sulich in B01-C013.</p></details><details><summary>The Shadow of the Gods · 13</summary><h2>A feast interrupted</h2><p>Glornir says Sulich has sworn the blood-sealed oath. Jaromir accuses Sulich of great crimes. Glornir refuses to surrender him.</p></details><details><summary>The Shadow of the Gods · 18</summary><h2>New weapons and an attack at the docks</h2><p>In B01-C018, Jaromir again demands Sulich at the docks, threatens the crew and ship, and attacks after Glornir refuses. His accusations remain unsubstantiated in this chapter.</p></details><details><summary>The Shadow of the Gods · 20</summary><h2>The queen&#x27;s orders</h2><p>Sulich calls the dead rider “my brother” and bids him travel well; this address does not establish a biological relationship. He offers Varg the rider’s helmet and describes it as battle spoils that tell the story of his victory. He says battle-fame is what lives on after death. Svik says Varg insults Sulich by suggesting he take another warrior’s spoils.</p></details><details><summary>The Shadow of the Gods · 39</summary><h2>A sister&#x27;s hair and an offer of help</h2><p>Sulich argues for judging people by deeds rather than ancestry. Skalk responds by calling him an escaped murderer and invoking Jaromir&#x27;s accusation; Sulich denies it. Glornir ends the confrontation, while Skalk postpones the matter until Darl.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>He enters the tower with Glornir and leads a search upstairs, reporting Vol absent. He follows the tunnel march into the fortress.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>He guards Glornir’s flank with Svik, then removes the dead Úlfhéðnar from Varg and hauls him up after the ear-biting attack. The exact fatal blow is not narrated. He ducks a drengr’s spear and cuts the man’s belly with his curved sword.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>On the departing drakkar he explains the river strategy: he expects Jaromir to flee towards Iskidan and says the prince’s ships are at Liga. He believes speed could let them intercept him there. This is his assessment and report, not a sighting of Jaromir or proof that he has reached the ships.</p></details><details><summary>The Hunger of the Gods · 32</summary><h2>Children hidden in the barrels</h2><p>He opens food barrels with Svik as the hidden children are brought out and fed. After Svik’s fable he praises it as well told, while Hakon says he does not understand.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>On rejoining the Sea-Wolf he has no mail coat, only a plain nasal helm and curved sword visible among his war gear. Varg offers the captured druzhina equipment as repayment for saving him from an Úlfhéðnar in Helka’s hall, apologising for the earlier insulting proposal. Sulich first insists Varg earned it, then accepts with a smile after Varg’s explanation and Einar’s encouragement.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>He takes the unstrung bow and runs towards Liga’s traders for a bowstring. A purchase, stringing the bow, wearing the new armour and shooting are not shown. Before departure he and Røkia fit the steering oar.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>He joins Varg and Røkia silently while staring out to sea, his eyes visibly flecked with gold. He calls attention to something distant before Varg recognises it. Røkia points south and the sighting proves to be sails; no animal lineage, transformation or measured supernatural sight is established.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>The boarding battle at sea</h2><p>During preparations for the boarding fight he buckles on the lamellar plate coat Varg gave him, now actually wearing the earlier gift. Initially beside Varg in the two-line formation, he is pushed aside when Røkia takes that place. His later individual fighting and final condition are not shown.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>He identifies Glornir’s extracted organism as a tungumatur, or tongue-eater. He describes its stagnant-water young, mouth entry, tongue replacement, numbing, food-sharing, growth towards the thought-cage and host control, admitting he does not know the control mechanism. His lifecycle and transmission possibilities remain attributed, alongside the observed hooked organism and cessation of host movement after extraction.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>At the pool he draws Glornir’s attention to the bound druzhina and suggests they had raided another ship. The witness confirms Jaromir’s service and gives the separated-knarr account and Valdai destination. This is intelligence received, not a sighting of the prince or Vol.</p></details><details><summary>The Hunger of the Gods · 59</summary><h2>New looks on the journey through Ulaz</h2><p>He returns from reconnaissance with Edel, wearing a red-grey kaftan, linen breeches, boots, cap and curved sword. He reports Jaromir&#x27;s departure with a force, two witches and chained Vol, and describes an uncertain chance of interception by a narrow footpath.</p></details><details><summary>The Hunger of the Gods · 63</summary><h2>A shortcut through the mountains</h2><p>He leads the shortcut in the gifted lamellar coat with bow, quiver, horsehair helm, sabre and shield. He expressly says he has hawk blood and that Jaromir is his half-brother. His estimate puts the company ahead of Jaromir, while his prediction of no scouts rests on his view of the prince&#x27;s arrogance.</p></details><details><summary>The Hunger of the Gods · 66</summary><h2>Sulich&#x27;s lineage and the ambush</h2><p>He expressly acknowledges Kirill as father and his own princely status. He names Hauker the hawk as his bloodline and Jaromir&#x27;s twin Rurik, attributing family disappearances to their ambition while remaining unsure of Jaromir&#x27;s true motive for hunting him.</p></details><details><summary>The Hunger of the Gods · 70</summary><h2>The pursuit into Valdai</h2><p>He and Røkia ride inside Valdai before closure. His horse breaks the hall doors, and later he pulls down a tapestry to reveal imprisoned people whom he identifies as Kirill&#x27;s Tainted children and his own siblings. No opening of their cell is shown yet.</p></details><details><summary>The Fury of the Gods · 10</summary><h2>The road to Ulaz</h2><p>His freed kin travel in druzhina equipment and choose to join the Bloodsworn, intending to use Glornir&#x27;s recompense to purchase a horse-carrying ship. He argues that departure offers freedom, claims their riding and archery training and promises loyalty. When he recognises Rurik in Ulaz, Svik sends him to the docks with the kin, heads down; a reunion with Glornir is not yet shown.</p></details><details><summary>The Fury of the Gods · 14</summary><h2>The warehouse rescue</h2><p>He and Kesha join the warehouse rescuers, then board a wider-bellied horse transport crewed by his kin. Horses eat hay on the central deck while the crew’s lamellar and weapons lie stowed. He commands its rowing departure behind Sea-Wolf, escaping the druzhina’s arrows.</p></details><details><summary>The Fury of the Gods · 25</summary><h2>He commands the lashed horse-knarr, whose crew strings bows and raises wicker/willow horse screens</h2><p>He commands the lashed horse-knarr, whose crew strings bows and raises wicker/willow horse screens. Five of his rowers work the outer side to help keep both vessels facing the enemy. He orders an answering volley; the red ward burns some arrows but others strike home.</p></details><details><summary>The Fury of the Gods · 27</summary><h2>His knarr is boarded from enemy drakkars at both prow and stern</h2><p>His knarr is boarded from enemy drakkars at both prow and stern. Superior numbers press him and his warriors towards the deck’s centre while Taras throws an attacker overboard and Iva continues casting. No capture or sinking of the knarr is shown.</p></details><details><summary>The Fury of the Gods · 28</summary><h2>Orlyg joins the sea battle</h2><p>His defenders are pressed into the knarr’s centre as Orka and then Orlyg attack the rear of one boarding crew. He wears horsehair helm and lamellar, with sabre and black blood-spattered shield; his long moustaches are bound with silver wire. He attacks Orka before Gunnar stops the misunderstanding, then greets Halja and acknowledges the rescuers’ timing. Introduced to Orlyg, he points out that another enemy crew still fights nearby.</p></details><details><summary>The Fury of the Gods · 30</summary><h2>He comes aboard Sea-Wolf behind Iva and Taras with Orlyg and other warriors</h2><p>He comes aboard Sea-Wolf behind Iva and Taras with Orlyg and other warriors. Orka sees the final enemy drakkar withdrawing south from the knarr; no casualty tally or decision about the retreating crew is given.</p></details><details><summary>The Fury of the Gods · 32</summary><h2>Ten of his kin receive sea burial after the battle</h2><p>Ten of his kin receive sea burial after the battle. He readies the surviving horses and knarr, then brings roughly forty or fifty warriors to Glornir’s gathering. The newcomers hear the secrecy choices to decide before landing; no individual list or final choices are supplied.</p></details><details><summary>The Fury of the Gods · 37</summary><h2>Life aboard Sea-Wolf</h2><p>He steps forward to vouch for Varg at the shore ceremony, joining the company’s affirmation before the spoken oath is completed. No new personal oath or legal ruling follows for Sulich.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>He reports his crew’s choices: only Iva and Taras want collar cover</h2><p>He reports his crew’s choices: only Iva and Taras want collar cover. He catches the two collar/key pairs and later lands horses and mounted druzhina in lamellar, horsehair helms and their weapons. He follows the Bloodsworn inside; scowls from some onlookers have no independently confirmed motive.</p></details><details><summary>The Fury of the Gods · 46</summary><h2>The hidden tunnel raid</h2><p>He brings about twenty kin in lamellar with recurved bows, divides them onto the Bloodsworn’s flanks and shoots a frost-spider from a branch as the raiders approach. Further archery counters descending spiders and a troll falls to its knees under multiple arrows; no final inspection of the troll is given.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>His archers line the wall, then at his nock/draw/loose orders fire into the advancing assault</h2><p>His archers line the wall, then at his nock/draw/loose orders fire into the advancing assault. No exact casualty count is available.</p></details><details><summary>The Fury of the Gods · 58</summary><h2>During the lull he stands with Glornir and Æsa, bow put away, sabre and slim-handled axe now ready</h2><p>During the lull he stands with Glornir and Æsa, bow put away, sabre and slim-handled axe now ready. He is blood-spattered, without a newly specified wound.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>Elvar Chainbreaker and the hillside stand</h2><p>He and Kesha pull bundled arrows from the hall in a handcart, supplying his druzhina behind the shield wall. Their repeated volleys thin the initial spertus wave, then strike the advancing enemy ranks as gaps are filled. No exact archer kills or full battle outcome is counted.</p></details><details><summary>The Fury of the Gods · 63</summary><h2>His archers fire one last volley at a troll before sprinting toward the stone doors</h2><p>His archers fire one last volley at a troll before sprinting toward the stone doors. Most of the host enters, but the chapter gives no complete named archer casualty roll.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>Leif’s death and the tunnel escape</h2><p>The group is directly present in Ulfrir’s gathering evacuation: Skuld above, both stone wolves alongside, Úlfhéðnar beneath, Battle-Grim/drengrs with Sighvat, Orlyg’s survivors and Sulich’s mounted remnants. The gate is blocked and they turn to the tunnels. This does not establish repaired guardians or a complete survivor tally.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>He emerges mounted with Kesha and twenty/thirty surviving crew, most quivers nearly empty</h2><p>He emerges mounted with Kesha and twenty/thirty surviving crew, most quivers nearly empty. Limited saddlebag food cannot feed everyone. He speaks for the Bloodsworn with Svik at council.</p></details><details><summary>The Fury of the Gods · 81</summary><h2>The charge against the gods</h2><p>He leads his mounted survivors in the surprise charge, few arrows left, using spears into the first ranks then drawing sabres as their spears are left in enemies. The camp is initially unprepared, without an exact cavalry tally or completed victory.</p></details><details><summary>The Fury of the Gods · 92</summary><h2>He raises the need for a chief and asks Vol, who declines</h2><p>He raises the need for a chief and asks Vol, who declines. He supports the proposed home’s suitability by noting nearby meadows for horses.</p></details><details><summary>Illustration · The Shadow of the Gods · 53</summary><p><a href="assets/18f38cd8d063f7.jpg">Open noncanonical illustration</a></p><p>Sulich in his early courtyard appearance.</p></details><details><summary>Illustration · The Fury of the Gods · 81</summary><p><a href="assets/7e24dd3cc88c25.jpg">Open noncanonical illustration</a></p><p>Sulich’s mounted force entering the unprepared camp.</p></details></noscript>
