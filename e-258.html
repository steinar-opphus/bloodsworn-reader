      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>Helka lends the Bloodsworn a black-hulled drakkar smaller than the Sea-Wolf, with twenty oars so the company can row in shifts. It is prepared by Darl’s docks, loaded with provision barrels and boarded by the company and its four shrouded dead.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>Hakon remains aboard in the prow under Æsa’s guard, with Frek joining as Helka’s appointed guardian. Glornir orders the cast-off and they row into the Drammur as Einar beats time. Sulich explains the hoped-for interception at Liga. Hakon’s release and arrival at Liga have not occurred. This ship is not identified with any previously seen royal drakkar.</p></details><details><summary>The Hunger of the Gods · 32</summary><h2>Children hidden in the barrels</h2><p>At dusk Einar drops the anchor-stone in the river. The Bloodsworn rig an awning over the rear deck and prepare a cold meal and a night aboard without fires. Children emerge from the barrels brought from Einar’s wagon; Glornir allows them out and they are fed.</p></details><details><summary>The Hunger of the Gods · 32</summary><h2>Children hidden in the barrels</h2><p>Glornir says remaining aboard makes Hakon’s escape harder and promises release at Liga. His assertion that enemy drakkars shadow them is not confirmed by a sighting here. The deck later becomes the setting for Svik’s tale, with first watch still assigned.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>The Bloodsworn bring it into Liga and disembark. Glornir asks Logur to take it for Helka’s arriving warriors and to return Hakon with it. Logur accepts the arrangement, and the company transfers its stores and sailing activity to the Sea-Wolf. No return of this ship to Darl is shown.</p></details></noscript>
