      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>The Sea-Wolf pursues an infected longship among green-backed islands into a sheltered bay. The fugitive beaches and its occupants run uphill to turf-roofed buildings in a loose half-circle beside beechwood. Animal pens precede a courtyard with a central well. No island or settlement name is given.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>Beyond the settlement is a clearing with a dark, algae-covered pool and rotting reeds. Infected people hold Æsa and druzhina there beside a giant tongue-eater. Glornir kills the giant after the fight leaves Æsa wounded and Einar unconscious. Røkia begins care while Edel searches with her hounds; a complete all-clear is not shown.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>A bound druzhina says his horse-knarr was separated from Jaromir in mist and captured among the islands. He reports some captives eaten and others infected, then names Valdai as the prince’s destination. The knarr’s exact fate and the remaining captives’ final treatment are not shown.</p></details><details><summary>The Fury of the Gods · 21</summary><h2>Reunion in the island harbour</h2><p>Sea-Wolf returns to the wooded natural harbour and sandy beach below the huts where Einar, Æsa and the children have stayed. The companions are alive and mobile, though Einar remains bandaged and Æsa limps. The company retrieves the group and leaves urgently to evade pursuing ships; no new infection or complete medical inspection is shown.</p></details></noscript>
