t after another attacker wounds his leg; the chapter ends as Varg rushes Sterkur, without an explicit death statement or resolved duel.</p></details><details><summary>The Fury of the Gods · 74</summary><h2>Chapter 74 - Orka</h2><p>Orka breaks through the enemy wall and sees Thorguna impaled. She and Glornir fight Drekr/Ilska back-to-back; Vol destroys Skalk’s staff and drops him with a broken neck. Glornir cuts Ilska down, but Orka’s fight with Drekr is interrupted by tremors and overwhelming mental pressure.</p></details><details><summary>The Fury of the Gods · 74</summary><h2>Chapter 74 - Orka</h2><p>Snaka rises from death, regrows flesh/scales and destroys two separate fleet groups while his movement tears the coast and Bonebacks. Lik-Rifa guides him toward Wolfdales. Vesli drags the attacking Drekr out of sight; the hill collapses into the hall. Glornir/Vol leap from a cliff above Falinn and Orka follows holding Breca, with no landing yet shown.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>Chapter 75 - Varg</h2><p>Varg kills Leif while the hall shakes, then rejoins the mourning Bloodsworn: Einar is explicitly dead, with Refna and the children at his body. Røkia says Brák fled and Sterkur is unseen. A collapsed stone door blocks the gate, so Ulfrir gathers survivors for the tunnels; Sighvat returns carrying Elvar’s body.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>Chapter 75 - Varg</h2><p>Varg spots Grend’s delayed party carrying Hrung. Ulfrir takes the sailcloth in his jaws and shields them to the tunnel entrance. Snaka breaks through the far hall wall and addresses his son; Ulfrir turns into the tunnel, Varg and the others following, without a completed escape yet.</p></details><details><summary>The Fury of the Gods · 76</summary><h2>Chapter 76 - Orka</h2><p>Orka and Breca survive the icy Falinn plunge and reach a river bend, joining Glornir, Vol, Halja, Gunnar, Lif, Sæunn and other Bloodsworn at the treeline. Lif gathers fuel and Vol lights a warming fire. They watch Snaka smash the already broken hill, still feeling his presence; by the sinking sun, warming and finding friends take priority.</p></details><details><summary>The Fury of the Gods · 76</summary><h2>Chapter 76 - Orka</h2><p>Orka believes Ilska dead while Drekr’s fate is briefly uncertain. Vesli returns alive to Breca’s embrace and reports that Drekr got away, showing a claimed tooth trophy. Glornir asks her to look for survivors so they can regroup, but no scouting result is shown before the snow begins.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>Chapter 77 - Varg</h2><p>The tunnel party emerges at dusk into snow. Ulfrir returns to human form and the battered survivors make camp; Hrung is alive and speaking, both stone wolves still limp, and Iva has a forehead wound. Sighvat/Grend wrap Elvar’s corpse and Ulfrir honours Chainbreaker. Uspa tells grieving Refna she cannot raise Elvar/Einar as she released the god-power in Ulfrir’s bones.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>Chapter 77 - Varg</h2><p>Food is scarce and Varg/Røkia hunt before council. Ulfrir urges a quick strike against the wounded dragon/rat, warns that the ravens belong to Snaka, refuses Skuld’s risky scouting offer and calls for information/allies. Vesli then arrives with Glornir/Vol/Orka and their surviving Bloodsworn: the divided groups reunite.</p></details><details><summary>The Fury of the Gods · 78</summary><h2>Chapter 78 - Guðvarr</h2><p>Guðvarr survives back to the shattered but provisioned enemy camp in heavy snow. He estimates immense losses and sees Heðin tending a troll, with Sigrún/Drekr/Krúsa/Glunn present. Sigrún reports Glornir killed Ilska and Skalk is dead. Guðvarr conceals his murder of Estrid behind the shield-wall disaster, while she expects rewards on the winning side.</p></details><details><summary>The Fury of the Gods · 78</summary><h2>Chapter 78 - Guðvarr</h2><p>Wounded human Lik-Rifa and Rotta enter behind Snaka, whose tall scale-mottled human form wears grey/gold serpent embroidery and red fur trim. His presence compels Guðvarr’s awe. Rotta and Lik-Rifa kneel/acclaim him and Guðvarr follows, without a formal blood-oath or a completed new-world victory.</p></details><details><summary>The Fury of the Gods · 79</summary><h2>Chapter 79 - Varg</h2><p>The Bloodsworn repair kit while Vesli reports the enemy gods at the ruined-hall riverbank, then sleeps on Breca’s lap after Ulfrir’s conditional promise of teeth. Frek reflects on freedom and Elvar’s choices; Svik calls him Frek the Free, and Sæunn credits Orka for hers. Lif sings; Halja declines his romantic hopes while offering friendship and suggesting Sæunn’s interest.</p></details><details><summary>The Fury of the Gods · 79</summary><h2>Chapter 79 - Varg</h2><p>Røkia corrects Varg’s assumptions, takes his hand and chooses him. As they leave, Hrung stops Ulfrir’s proposed ally search to speak of Elvar’s undisclosed plan. Out of earshot, Røkia/Varg mutually kiss and affirm their choice, beginning intimacy in the trees.</p></details><details><summary>The Fury of the Gods · 80</summary><h2>Chapter 80 - Biórr</h2><p>Biórr submits to Snaka but remains troubled by Elvar’s freedom declaration. He finds Fain/Harek/the children alive; Rotta thanks him for the tail-cut rescue and admits Elvar told him the truth, claiming disbelief. Snaka humiliates Lik-Rifa at the family meal, but the siblings have raised him to steal his heart, not to serve him.</p></details><details><summary>The Fury of the Gods · 80</summary><h2>Chapter 80 - Biórr</h2><p>Poison nearly disables Snaka, then his words/black expulsion begin to counter it. Lik-Rifa pins his hand and Rotta cuts his throat, then removes the heart. Before it is eaten an unnamed tennúr steals it. The gods begin changing as tennúr warn of the wolf and figures charge from the forest; the attack’s outcome is unshown.</p></details><details><summary>The Fury of the Gods · 81</summary><h2>Chapter 81 - Varg</h2><p>Ulfrir’s allied survivors charge after witnessing Snaka’s murder and the intended heart feast; many Bloodsworn lack shields. Sulich’s cavalry breaches the unprepared camp while Ulfrir engages the dragon, Skuld spears the rat and the stone wolves attack him. Varg/Røkia and their companions fight toward Yrsa, whom Varg recognises as Torvik’s killer.</p></details><details><summary>The Fury of the Gods · 81</summary><h2>Chapter 81 - Varg</h2><p>Røkia/Edel/Svik/Æsa clear defenders and Varg topples Yrsa through a feigned slip and ankle hook, then avenges Torvik with a crushing axe blow. He turns to Iva’s rune duel with an unnamed fair-haired caster and Taras encircled by hunters, spots Brák behind Taras and calls his name; the next confrontation remains open.</p></details><details><summary>The Fury of the Gods · 82</summary><h2>Chapter 82 - Guðvarr</h2><p>Guðvarr keeps close to Sigrún after she helps him into mail. Heðin destroys one stone guardian, then Battle-Grim break Sigrún’s wall after an unnamed older axeman shatters Guðvarr’s shield. A huge red-bearded warrior wounds Sigrún; Krúsa kills a thinning-haired opponent before being decapitated by that axeman.</p></details><details><summary>The Fury of the Gods · 82</summary><h2>Chapter 82 - Guðvarr</h2><p>Guðvarr finds his aunt alive, attempts to drag her away, then abandons her semi-conscious while rationalising she may be found. He takes a replacement shield and his sword and heads for trees, where Lif confronts him with his father/brother revenge claim. Neither Sigrún’s fate nor the duel result is yet shown.</p></details><details><summary>The Fury of the Gods · 83</summary><h2>Chapter 83 - Orka</h2><p>Orka advances with Breca and companions as Ulfrir/dragon wound each other. Skuld stabs a dragon eye with her long scissors for her mother, then is thrown into darkness. Breca frees Orka from a spider; she coats both seaxes on its venomous fangs, sheathes one and takes an unidentified hand-axe.</p></details><details><summary>The Fury of the Gods · 83</summary><h2>Chapter 83 - Orka</h2><p>She heads toward Orlyg’s pressed line, but Drekr’s Raven-Feeders strike its rear first. He breaks/pins Orlyg’s shield, strikes Dagrun’s jaw and chops into Orlyg’s head as the chapter ends.</p></details><details><summary>The Fury of the Gods · 84</summary><h2>Chapter 84 - Varg</h2><p>Varg’s group breaks the hunters’ ring around Taras. Iva’s opponent is named Silrið; after their fire/ice contest Iva buries her in a closed fissure, then supports Taras. Brák manifests black eyes and Røkia names Væsa the weasel as his lineage. Their duel wounds Varg, who changes from restraint to a decisive wolf-powered reversal.</p></details><details><summary>The Fury of the Gods · 84</summary><h2>Chapter 84 - Varg</h2><p>Varg disarms and drags Brák to a tree, pinning him with his own sword for Frøya. Røkia brings the children and Refna strikes for Einar, the others joining the reprisal. Røkia declares them avenged and Varg weeps. No full battle resolution follows.</p></details><details><summary>The Fury of the Gods · 85</summary><h2>Chapter 85 - Guðvarr</h2><p>Lif counters Guðvarr’s boasts with the deaths of his father/brother and his own training. Guðvarr uses a spider’s approach to press him back and tries leaving after it knocks Lif down. Lif returns, apparently having killed it, trips Guðvarr with his spear and defeats his shield/sword defence with an axe.</p></details><details><summary>The Fury of the Gods · 85</summary><h2>Chapter 85 - Guðvarr</h2><p>Guðvarr loses a tooth and gains a mouth-to-ear gash, then pleads for forfeit and offers anything. Lif demands his family back and brings the axe down. Guðvarr’s death is strongly implied; the chapter ends before a narrated aftermath.</p></details><details><summary>The Fury of the Gods · 86</summary><h2>Chapter 86 - Orka</h2><p>Orlyg is explicitly dead, while Dagrun rises alive to defend his father. Orka intercepts Drekr with hand-axe/seax as her companions engage the Raven-Feeders. He disarms the axe, but she draws the second seax, confronts him about Thorkel and cuts beneath an eye. The blade’s spider venom slows him until he drops his weapon.</p></details><details><summary>The Fury of the Gods · 86</summary><h2>Chapter 86 - Orka</h2><p>Orka gives Breca a seax and directs their shared reprisal, comparing it to the serpent mother teaching its young. Breca brings Drekr down and both strike his neck for Thorkel/Papa. Drekr’s death and the completion of this revenge are strongly implied, with no separate aftermath narrated.</p></details><details><summary>The Fury of the Gods · 87</summary><h2>Chapter 87 - Biórr</h2><p>At dawn Biórr/Fain despair over the battle before Skuld’s horn follows Ulfrir’s howl and Faunir join against spiders/trolls, sparing the children’s wagon. Biórr rejects the gods’ war and revenge; Fain leaves with Harek/the children in the wagon, planning to wait in the woods. Biórr instead returns Bjarn to Uspa/Berak, giving him Elvar’s axe.</p></details><details><summary>The Fury of the Gods · 87</summary><h2>Chapter 87 - Biórr</h2><p>After the family embraces, Biórr turns away and refuses Rotta’s mental plea. Gunnar Prow strikes him down and gives a finishing blow for Revna. Biórr’s death is strongly implied, with the chapter ending at the axe strike.</p></details><details><summary>The Fury of the Gods · 88</summary><h2>Chapter 88 - Orka</h2><p>Orka recovers her hand-axe and takes Drekr’s long-axe, leaving the seaxes in his explicit corpse for now. Lif returns affirming his task done and Gunnar reports Biórr dead. The battle gathers around the wounded gods; Ulfrir speaks inside Orka’s skull, saying his strength fails and the agreed action must happen now.</p></details><details><summary>The Fury of the Gods · 88</summary><h2>Chapter 88 - Orka</h2><p>Vol/Uspa cast while Glornir/Berak defend them. Orka’s group breaks the cultists’ flank. Ulfrir limps and Lik-Rifa has a limp wing and one wounded eye. Skuld sounds the horn; Glornir/Orka agree it is time and Ulfrir leaps again, without the outcome yet shown.</p></details><details><summary>The Fury of the Gods · 89</summary><h2>Chapter 89 - Varg</h2><p>Varg leaves Brák’s corpse exhausted rather than joyful. Iva/Taras head toward forest, though the narration later names Taras in the charge and this remains review. Æsa kills the smaller troll attacking the last guardian, then Heðin crushes her. The companions fight him while an unnamed Faunir frees Varg from a spider; the Faunir are explicitly Ulfrir’s allies.</p></details><details><summary>The Fury of the Gods · 89</summary><h2>Chapter 89 - Varg</h2><p>Røkia throws Æsa’s spear into Heðin and the companions/hound collectively bring him down and kill him. Rotta confronts them, but Grok/Kló seize him for Father-Snaka, lift and drop him into wagons. He lies unmoving; death or recovery is not yet established.</p></details><details><summary>The Fury of the Gods · 90</summary><h2>Chapter 90 - Orka</h2><p>Taras/Iva arrive with Hrung as Ulfrir pins the dragon. Glornir/Orka use partial Tainted claws and climb the wing/head while Vol/Uspa/Iva bind her, then cut one jaw hinge. Thrown off, Orka suffers ribs/leg injuries and Glornir saves her from a claw at mortal cost. Taras hurls Hrung into the open mouth; she swallows and Ulfrir explains the poison.</p></details><details><summary>The Fury of the Gods · 90</summary><h2>Chapter 90 - Orka</h2><p>The dragon dies under black-veined poison and the surviving enemies flee. Glornir gives his farewells and dies; Vol/companions mourn. Human Ulfrir leans on Skuld, Bjarn’s family and Sighvat celebrate, and a voice from the dragon’s belly reveals Hrung survived. Extraction and the Bloodsworn’s next leadership are not yet shown.</p></details><details><summary>The Fury of the Gods · 91</summary><h2>Chapter 91 - Orka</h2><p>Orka leads the Bloodsworn, children and Sulich’s riders home through pinewoods, still recovering from her injuries. Vesli rides an unexplained chained chest and eats teeth. The steading is overgrown: the hall is burned out, while several outbuildings and the beehive survive.</p></details><details><summary>The Fury of the Gods · 91</summary><h2>Chapter 91 - Orka</h2><p>At Thorkel’s barrow Breca speaks of his rescue and their vengeance, and Orka mourns. Taras brings Spert’s identified recovered remains; the companions carry Glornir’s wrapped corpse to rest beside his brother. Vol chose this home over the place Ulfrir offered beside Elvar, already laid in Wave-Jarl. They begin digging.</p></details><details><summary>The Fury of the Gods · 92</summary><h2>Chapter 92 - Varg</h2><p>The Bloodsworn finish Glornir’s barrow beside Thorkel and Spert, then gather at the fire and toast Elvar Chainbreaker. Gunnar reports Rurik’s fleet survivors still active. Rotta’s body disappeared before Ulfrir could recover it, leaving his fate unresolved; Vol promises future payment of Elvar’s silver.</p></details><details><summary>The Fury of the Gods · 92</summary><h2>Chapter 92 - Varg</h2><p>Vol and Orka decline the chiefship, and no successor is chosen. Varg proposes a home for children, elders and those seeking peace alongside continued raiding; all agree. He and Røkia both want a child one day. Vol proposes this steading, with timber, a fjord and nearby meadows; Orka approves. Vol names her serpent Gand.</p></details></noscript>
