      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 1</summary><h2>Introduction</h2><p>The third book opens with Varg and the Bloodsworn tending wounds and equipment in Valdai after the battle. Choose your last completed chapter to follow the summaries below.</p></details><details><summary>The Fury of the Gods · 1</summary><h2>Chapter 1 - Varg</h2><p>At Valdai, Røkia stitches Varg&#x27;s cheek while the Bloodsworn recover from battle and mourn fifteen dead, including Ingmar. Vol renews her promise of an akáll and arranges it for that night so Varg can learn how Frøya died.</p></details><details><summary>The Fury of the Gods · 1</summary><h2>Chapter 1 - Varg</h2><p>Vol persuades Glornir that Iva and Taras were unwilling servants. She removes their collars and ropes, offers recovery without captivity, and receives their promises never to fight the company again. Taras carries the wounded Iva outside to enjoy the sun.</p></details><details><summary>The Fury of the Gods · 1</summary><h2>Chapter 1 - Varg</h2><p>Two giant ravens land in the courtyard carrying Vesli. She delivers Orka&#x27;s message: Elvar wishes to hire the Bloodsworn to kill a dragon. No agreement or departure is shown.</p></details><details><summary>The Fury of the Gods · 2</summary><h2>Chapter 2 - Guðvarr</h2><p>In Darl, Guðvarr wakes with a healing hyrndur scar. He and Sigrún discuss surviving through usefulness and flattery. Blóta, who identifies herself as dragon-born, summons them to Lik-Rifa&#x27;s assembly in the ruined courtyard.</p></details><details><summary>The Fury of the Gods · 2</summary><h2>Chapter 2 - Guðvarr</h2><p>Lik-Rifa, visibly injured in human form, proclaims herself queen of Darl and all Vigrið, then has Helka&#x27;s fifty or sixty bound drengrs killed because she considers their oaths still binding. She attributes Helka&#x27;s death to her allies; Drekr names Estrid as the surviving daughter, without showing her location.</p></details><details><summary>The Fury of the Gods · 2</summary><h2>Chapter 2 - Guðvarr</h2><p>Svard offers allegiance and Glunn negotiates rewards, but Lik-Rifa forces a contest for service. Glunn kills Svard and claims his property and followers under the laws of holmganga; the warriors assent. Lik-Rifa then invites Glunn, Sigrún and Guðvarr to eat in the ruined hall.</p></details><details><summary>The Fury of the Gods · 3</summary><h2>Chapter 3 - Elvar</h2><p>At ruined Snakavik, Elvar sits amid falling snow, treasure and the Berserkir she now controls. She feels numb after her father&#x27;s and Thorun&#x27;s deaths and spares the surrendered Broðir, despite fearing what succession might tempt him to do. Sighvat brings food and urges her to eat before deciding what comes next.</p></details><details><summary>The Fury of the Gods · 3</summary><h2>Chapter 3 - Elvar</h2><p>Grend brings the captains, petty jarls and mercenary chiefs. Gytha, the captains and Runa offer allegiance, but Elvar postpones formal oaths until she has explained her purpose. She rejects continuing Störr&#x27;s war and declares a campaign against Lik-Rifa and her followers.</p></details><details><summary>The Fury of the Gods · 3</summary><h2>Chapter 3 - Elvar</h2><p>Ingvild demands greater pay and a chance of survival. Elvar points to her forces and collared gods, kicks open the treasure chest and promises riches to those who live, without promising everyone will survive. Hjalmar begins an acclamation that every warrior in the room joins.</p></details><details><summary>The Fury of the Gods · 4</summary><h2>Chapter 4 - Orka</h2><p>Orka is alive but captive outside burning Svelgarth, still weakened by frost-spider venom. Rotta, back in human form and injured, assaults her for information about his brother. Myrk arrives with three captives she calls Jarl Orlyg&#x27;s children, then tries to reach Orka, but Rotta prevents an immediate killing.</p></details><details><summary>The Fury of the Gods · 4</summary><h2>Chapter 4 - Orka</h2><p>Orka gradually regains feeling and wolf strength, though web binds her wrists. She believes Breca has reached the lake and escaped, without a confirming sighting. Myrk takes the two seaxes from Orka&#x27;s belt and taunts her about Thorkel; Rotta plans to use Breca to extract Ulfrir&#x27;s location. The chapter ends as an unnamed man leads bound children from the woods, leaving their identities unresolved.</p></details><details><summary>The Fury of the Gods · 5</summary><h2>Chapter 5 - Biórr</h2><p>Biórr and Skaga carry Ilmur&#x27;s corpse beside Storolf, now confirming both deaths. Biórr grieves and questions his choice to raise the alarm. Brák returns with escaped children, but reports no trace of Breca past Orka&#x27;s capture point; his guess that Breca drowned or froze remains unconfirmed.</p></details><details><summary>The Fury of the Gods · 5</summary><h2>Chapter 5 - Biórr</h2><p>Rotta refuses Brák&#x27;s proposal to kill the recaptured children and assigns their custody to Biórr. Fain is alive but wounded and feverish, grieving Storolf. Biórr urges him to continue the war so the deaths will mean something, and Fain nods. Brák resumes the hunt for Breca.</p></details><details><summary>The Fury of the Gods · 5</summary><h2>Chapter 5 - Biórr</h2><p>Rotta also puts Orka and Myrk&#x27;s prisoners under Biórr&#x27;s guard, describing Orka&#x27;s knowledge of Ulfrir and the children&#x27;s future allegiance as important. He orders the camp to prepare for a south-westward move to Darl to join his sister; the journey is not yet shown.</p></details><details><summary>The Fury of the Gods · 6</summary><h2>Chapter 6 - Varg</h2><p>At Valdai, Kesha says Jaromir and Rurik meant to use their Tainted siblings to invade Vigrið. Glornir consults every Bloodsworn present about the dragon, promises to retrieve Einar and Æsa, and hears the rest of Vesli&#x27;s message about Uspa and Bjarn. He decides the company will fight and orders departure for the Sea-Wolf at dawn.</p></details><details><summary>The Fury of the Gods · 6</summary><h2>Chapter 6 - Varg</h2><p>Late that night Vol leads Varg and Røkia to the hidden chamber. She forms a sixteen-lined blood-stave around a torch and burns Frøya&#x27;s hair after invoking her. The resulting akáll lets Varg experience Frøya&#x27;s flight and recapture in snowy woods.</p></details><details><summary>The Fury of the Gods · 6</summary><h2>Chapter 6 - Varg</h2><p>The vision shows an unnamed chief ordering Brák to make an example of Frøya. She insists she wants her brother, fights back with wolf strength, then is overpowered. Brák nails her to a tree and kills her. Her final word is Varg&#x27;s name; the vision fades and he collapses howling, supported by Røkia. The chief&#x27;s identity remains unresolved.</p></details><details><summary>The Fury of the Gods · 7</summary><h2>Chapter 7 - Orka</h2><p>Orka marches in wrist chains among Svelgarth&#x27;s prisoners, with her wolf senses returning. Biórr defends the war as liberation; she points to her murdered husband, abducted son and the captives around them. His claim that Breca was unharmed is challenged rather than accepted. At dusk she tests her chains, without breaking them.</p></details><details><summary>The Fury of the Gods · 7</summary><h2>Chapter 7 - Orka</h2><p>From the camp Orka sees Harek and Bjarn among the wagons, confirming Bjarn remains captive. Myrk has vulnerable stragglers herded towards frost-spiders and night-hags, then stops Hagal intervening. Dagrun, named as Jarl Orlyg&#x27;s son, tells him to sit. The attackers drag the webbed victims into the trees. Myrk justifies the act while Biórr looks away from Orka&#x27;s rebuke.</p></details><details><summary>The Fury of the Gods · 7</summary><h2>Chapter 7 - Orka</h2><p>Brák returns without captive children, carrying two dead adults. He reports an unseen attacker. Orka identifies the woman&#x27;s black-veined injuries as Spert&#x27;s handiwork and suspects her allies remain nearby, but neither the ambush nor Breca&#x27;s presence is directly shown.</p></details><details><summary>The Fury of the Gods · 8</summary><h2>Chapter 8 - Guðvarr</h2><p>A tennúr guides Sigrún and Guðvarr to Lik-Rifa in the Galdur tower. Serpents cover the floor and frost-spiders hang overhead. At her command the snakes part to open a path. At the table sit Ilska, Drekr, Glunn and the skraeling Krúsa. Lik-Rifa wants Ulfrir killed; Ilska presses for consolidating control first.</p></details><details><summary>The Fury of the Gods · 8</summary><h2>Chapter 8 - Guðvarr</h2><p>Ilska reports Estrid&#x27;s escape with surviving Úlfhéðnar and warriors, and Drekr reports Orlyg leaving by ship. Glunn reports seeing Estrid with Skalk after the fall but only guesses they may now be together. Ilska proposes Liga or Snakavik as possible routes; neither location is confirmed. Guðvarr&#x27;s boast of holding Skalk at swordpoint is explicitly contradicted by the narration.</p></details><details><summary>The Fury of the Gods · 8</summary><h2>Chapter 8 - Guðvarr</h2><p>Lik-Rifa orders Estrid and Skalk hunted but chooses to rest while seeking Ulfrir&#x27;s location. Drekr keeps Glunn in Darl to expose Helka&#x27;s supporters. Ilska assigns Krúsa, her clan, Sigrún, Guðvarr and their forces to the hunt, with whatever vaesen are needed; no departure or capture is shown.</p></details><details><summary>The Fury of the Gods · 9</summary><h2>Chapter 9 - Elvar</h2><p>While training at Snakavik, Grend gives Elvar a light, sharp hand-axe from the Oskutreð treasure and urges her to learn sword-and-axe fighting. He rejects its identification as Fate-Maker. Later Hrung&#x27;s alarm reveals a treasury raid: guards have been killed, one chest and Störr&#x27;s wealth taken, and Uspa&#x27;s ward has burned some thieves.</p></details><details><summary>The Fury of the Gods · 9</summary><h2>Chapter 9 - Elvar</h2><p>Identifying Wave-Roamer shields, Elvar pursues to the docks with her warriors and allies. Ingvild&#x27;s unnamed witch blocks the dock with illusory serpents, which Ulfrir dismisses. Uspa binds the witch&#x27;s mouth with mist and Skuld strikes her down. Ingvild&#x27;s shield wall breaks under the Berserkir; her witch&#x27;s final fate is not separately confirmed.</p></details><details><summary>The Fury of the Gods · 9</summary><h2>Chapter 9 - Elvar</h2><p>In the final duel Ingvild takes Elvar&#x27;s shield. Elvar refuses help, draws her new axe and uses it with her sword to defeat Ingvild, then repeatedly strikes her fallen opponent. The chapter ends with Elvar&#x27;s statement that her treasure was stolen and Sighvat&#x27;s warning joke, without a separate final death declaration for Ingvild.</p></details><details><summary>The Fury of the Gods · 10</summary><h2>Chapter 10 - Varg</h2><p>Travelling overland towards Ulaz, Varg races ahead, consumed by revenge, until Svik brings him back to water and food. Sulich explains the freed kin&#x27;s choice to join the Bloodsworn; Glornir intends their treasure to buy a ship capable of carrying their horses. Neither the reunion nor the purchase is shown.</p></details><details><summary>The Fury of the Gods · 10</summary><h2>Chapter 10 - Varg</h2><p>Above Ulaz, Røkia tells Varg that her village murdered her Tainted mother when she was perhaps nine or ten. She says she spent five years hunting the killers, without easing the loss despite satisfaction in revenge. Varg touches her hand, and they acknowledge his own hope for revenge. They descend through the port and markets.</p></details><details><summary>The Fury of the Gods · 10</summary><h2>Chapter 10 - Varg</h2><p>The guarded eastern harbour holds hundreds of warships and transports. Rurik, named by Sulich, crosses with a collared rune-wielder and druzhina. Svik thinks the invasion fleet nearly ready and intends to warn Glornir. Before they reach him, an unnamed man and golden-eye shieldbearers ambush Varg, Svik and Røkia. Varg is hooded and struck, falling as the chapter ends.</p></details><details><summary>The Fury of the Gods · 11</summary><h2>Chapter 11 - Biórr</h2><p>At a dawn halt Biórr and Myrk share an unusually tender moment after intimacy. He then hears Fain&#x27;s warning about unseen attackers: six rearguard skraeling were found dead and the trailing prisoners were missing. Fain&#x27;s face is healing, while Orka remains bound under guard. By the noonday march no more than fifty Svelgarth prisoners remain from over a hundred.</p></details><details><summary>The Fury of the Gods · 11</summary><h2>Chapter 11 - Biórr</h2><p>Biórr has removed the children&#x27;s bonds and believes kindness will keep them from fleeing. He recalls finding Bjarn unconscious beneath a smashed wagon, explaining his continued captivity. Rotta praises him, then tries a conditional offer of freedom on Orka, whose mail has been taken and who refuses a cloak. She rejects the bargain for Ulfrir&#x27;s location.</p></details><details><summary>The Fury of the Gods · 11</summary><h2>Chapter 11 - Biórr</h2><p>Biórr hears Rotta&#x27;s furious voice internally despite the god&#x27;s calm face. Fain strikes Dagrun after a chuckle, but Dagrun prevents an uprising. Brák then returns with a reduced, wounded hunting party carrying a writhing sack. Its contents remain unseen.</p></details><details><summary>The Fury of the Gods · 12</summary><h2>Chapter 12 - Varg</h2><p>Varg wakes as his captors bring him to a wooden building, possibly a dockside warehouse. The leader names himself Sterkur, linking the previously unnamed abductor to Leif&#x27;s hired hunter. Leif is present and renews his ownership and murder accusations; Varg and Røkia reject them. Svik wakes and joins the defiance, despite their bonds.</p></details><details><summary>The Fury of the Gods · 12</summary><h2>Chapter 12 - Varg</h2><p>Leif proposes moving the captives to Sterkur&#x27;s ship to kill them. Sterkur chooses to kill the companions first. Varg attacks when Røkia is seized and is beaten down. Svik provokes the order for his own execution, then asks Norv to keep his hair clear of the axe.</p></details><details><summary>The Fury of the Gods · 12</summary><h2>Chapter 12 - Varg</h2><p>As the blade falls, Svik pulls Norv into its path, severing the man&#x27;s hands and breaking the holders&#x27; control. Sterkur&#x27;s warriors rush him. Røkia signals towards the wall and Varg hears a snuffle and growl, but the chapter ends without naming the source or completing a rescue.</p></details><details><summary>The Fury of the Gods · 13</summary><h2>Chapter 13 - Orka</h2><p>Brák opens the sack to reveal wounded Spert, not Breca. Spert says friendship and his promise to protect Breca explain his loyalty. Orka recognises him as family. When Rotta threatens him, she discloses Ulfrir’s destination, his company and Elvar’s leadership. Biórr is surprised; Myrk speculates about Elvar seeking Störr’s help.</p></details><details><summary>The Fury of the Gods · 13</summary><h2>Chapter 13 - Orka</h2><p>Rotta kills Spert after receiving the information. Orka attacks him in fury but is restrained. He gives Myrk permission to kill her. In the duel Orka uses her wrist chain to take one of the paired seaxes, while Myrk’s remaining blade cuts her ribs.</p></details><details><summary>The Fury of the Gods · 13</summary><h2>Chapter 13 - Orka</h2><p>Rotta halts the duel at sounds from the wooded valley. A horn rings out and tennúr warn of the trees. An unnamed collared woman with two axes charges, followed by similarly collared men and women. Their identities, allegiance and the battle’s outcome remain unknown.</p></details><details><summary>The Fury of the Gods · 14</summary><h2>Chapter 14 - Varg</h2><p>Glornir and the Bloodsworn break into the warehouse. Røkia and Varg bite through their bonds, recover their weapons and help Svik. Norv is confirmed dead from blood loss. Sterkur shields Leif from Kesha and gets him out; Røkia and Glornir stop Varg from chasing them into the alarmed docks.</p></details><details><summary>The Fury of the Gods · 14</summary><h2>Chapter 14 - Varg</h2><p>The group reaches Sea-Wolf beside the horse transport crewed by Sulich’s kin. Both ships row away, surviving arrows from mounted druzhina on the pier. They pass the bull and scorpion statues at sunset; Sea-Wolf raises sail.</p></details><details><summary>The Fury of the Gods · 14</summary><h2>Chapter 14 - Varg</h2><p>Røkia says Sterkur saw her wolf in her eyes and knows she is Tainted; Svik promises to silence him. Varg spots five hawk-marked longships. Svik identifies Rurik’s vessels and suspects they are following, without a new attack being shown.</p></details><details><summary>The Fury of the Gods · 15</summary><h2>Chapter 15 - Orka</h2><p>Orka recognises the forest attackers as Berserkir and Úlfhéðnar. Rotta orders a defensive wall, but it breaks into smaller knots. Two river longships arrive; warriors from one strike the rear. Dagrun calls for his father and turns on a guard as other prisoners attack theirs.</p></details><details><summary>The Fury of the Gods · 15</summary><h2>Chapter 15 - Orka</h2><p>Orka spots Breca alive at the treeline and starts towards him. Myrk knocks her down and renews the duel. Orka cuts her thigh, interrupts her flaming runes, restrains her with the chain and kills her with wolf-jaws.</p></details><details><summary>The Fury of the Gods · 15</summary><h2>Chapter 15 - Orka</h2><p>Breca reaches his mother, calls to her and takes her hand. Lif, Halja, Gunnar and Sæunn stand behind him; Sæunn is uncollared, wearing leather and fur and carrying a spear. Breca urges Orka to leave with them, but the chapter ends before their escape.</p></details><details><summary>The Fury of the Gods · 16</summary><h2>Chapter 16 - Biórr</h2><p>Biórr and Fain hold a remaining Raven-Feeder shield-wall knot. Biórr sees Breca helping Orka upright and then sees Myrk dead. Orka takes Myrk’s belt and both seaxes. Biórr charges after her in grief, followed by Fain, other Raven-Feeders and Skaga’s skraeling.</p></details><details><summary>The Fury of the Gods · 16</summary><h2>Chapter 16 - Biórr</h2><p>Gunnar, recognisable through his relationship to Revna and the continuous rescue party, defends the group with another Bloodsworn and two spear-bearers. The small defence breaks into pairs under pressure. Orka fights with both seaxes; Breca kills a skraeling attacking her and she stops his continued blows, his eyes blazing amber and green.</p></details><details><summary>The Fury of the Gods · 16</summary><h2>Chapter 16 - Biórr</h2><p>Biórr and Gunnar wound each other before Gunnar knocks him down, pins his wrist and raises his axe with an accusation about Revna. Harek knocks Gunnar back and stands over Biórr in defence, displaying yellow eyes and small lower-jaw tusks. The chapter ends before the intervention’s outcome.</p></details><details><summary>The Fury of the Gods · 17</summary><h2>Chapter 17 - Orka</h2><p>Orka calms Breca and gathers Halja, Lif and Sæunn. She recognises Orlyg leading the river warriors with a staff-bearing Galdurman shielding him. A falling troll separates Gunnar from Biórr and Harek. Halja persuades Gunnar to leave, and he damages Orka’s wrist chain so she can snap it with wolf-strength.</p></details><details><summary>The Fury of the Gods · 17</summary><h2>Chapter 17 - Orka</h2><p>Orka takes Fain’s long-axe, helps save Dagrun and carries Spert’s body. Rotta’s rune-casters block the woods and rout the attacking warriors with fire and ice. Breca calls Bjarn to follow. Dagrun offers a route onto Orlyg’s ships; one burns, but Orka’s group boards the other and helps it push off.</p></details><details><summary>The Fury of the Gods · 17</summary><h2>Chapter 17 - Orka</h2><p>Orka helps other fugitives aboard, but Harek tackles Bjarn into the reeds and neither is seen boarding. She blocks Rotta’s ice-rune with a shield, then throws the freezing shield into the river, her hand numb. The surviving ship pulls away. Breca trembles and vomits; the companions explain their choice to return, Orka mourns Spert, and mother and son embrace.</p></details><details><summary>The Fury of the Gods · 18</summary><h2>Chapter 18 - Guðvarr</h2><p>Five days after leaving Darl, Guðvarr travels with Sigrún, Krúsa and their mixed force. Scouts and a farmer’s account have drawn the hunt west towards the River Slågen, but no direct sighting confirms Estrid or Skalk. Sigrún says Krúsa decides the pace and fears entering the lands she still calls Störr’s.</p></details><details><summary>The Fury of the Gods · 18</summary><h2>Chapter 18 - Guðvarr</h2><p>At a glade’s ash tree, Krúsa warns about Froa and attributes different creations to Snaka and Lik-Rifa. A frost-spider enters the tree and falls apparently dead. An unnamed Froa emerges, with root-like hair, grey bark-grained skin and moss, leaves and yellow lichen. She accuses the hunters of trespass.</p></details><details><summary>The Fury of the Gods · 18</summary><h2>Chapter 18 - Guðvarr</h2><p>The Froa summons vines that lash, entangle and drag at the hunters. Sigrún tries to free a drengr, but Guðvarr pulls her away and helps her mount. Krúsa orders flight and the party escapes the glade. The victims’ final fates and the hunt’s next move remain unshown.</p></details><details><summary>The Fury of the Gods · 19</summary><h2>Chapter 19 - Elvar</h2><p>Elvar asks Ulfrir about the warriors who aided him at the pier. He calls them his hidden Úlfhéðnar children, afraid of collars, and seeks protection for them. She makes no promise, ordering him to bring them while weighing fear, friendship and mercenary pay.</p></details><details><summary>The Fury of the Gods · 19</summary><h2>Chapter 19 - Elvar</h2><p>The council meets in Snakavik’s Galdur tower, with Hrung, a half-buried chain link, central fire pit and cold forge. Elvar recounts the chain-and-collar history attributed to the skalds. The group debates stealth, force and possible allies to recover Bjarn and defeat Lik-Rifa, while their actual locations remain unknown to the council. Elvar orders preparations but no departure until she has intelligence.</p></details><details><summary>The Fury of the Gods · 19</summary><h2>Chapter 19 - Elvar</h2><p>Orv brings Svea, a wool-and-honey trader, who says she left Darl eight days earlier. She reports Helka and the resurrected eagle-god killed by the dragon. The council falls silent; Skuld shrieks and Ulfrir howls. No response plan follows before the ending.</p></details><details><summary>The Fury of the Gods · 20</summary><h2>Chapter 20 - Guðvarr</h2><p>Guðvarr alternates between self-praise and fear as the hunters camp near the Slågen. Sigrún suggests the fugitives chose woodland for protection from aerial attack, without confirming their motive. Munni reports humans and collared wolf-bloods ahead; the direction, distance and count remain uncertain. Krúsa rewards him with teeth.</p></details><details><summary>The Fury of the Gods · 20</summary><h2>Chapter 20 - Guðvarr</h2><p>Sigrún estimates their force and privately proposes letting Krúsa take the first danger. Krúsa instead orders the humans to lead, invoking their need for glory, and Sigrún accepts. They traverse open heath and then a narrow forest path towards a boulder-filled glade; Guðvarr fears an ambush.</p></details><details><summary>The Fury of the Gods · 20</summary><h2>Chapter 20 - Guðvarr</h2><p>Skapti steps from behind the boulders and Guðvarr recognises him. The drengrs prepare and search, Krúsa’s vaesen arrive, and Guðvarr levels his sword. Skapti says he is alone and offers information, but neither the offer’s contents nor a bargain is revealed.</p></details><details><summary>The Fury of the Gods · 21</summary><h2>Chapter 21 - Varg</h2><p>Sea-Wolf evades the five pursuers among Iskidan’s islands, with Sulich’s slower knarr behind. At the island harbour the company reunites with Einar, Æsa and the children. Einar is mobile and strong but still head-bandaged; Æsa still limps and reports healing. Refna hugs Glornir, and Svik’s reunion banter is cut short by the need to leave.</p></details><details><summary>The Fury of the Gods · 21</summary><h2>Chapter 21 - Varg</h2><p>Aboard, Taras and Einar initially dispute the time-beater’s seat. Vol names Taras a friend, both large men introduce themselves, and they agree to share the seat and a drink. Later Svik vows revenge for the Ulaz capture while Varg thinks of the dragon and Brák.</p></details><details><summary>The Fury of the Gods · 21</summary><h2>Chapter 21 - Varg</h2><p>Edel hands Vol copied runes from Rotta’s chamber. Vol identifies Raudskinna fragments, warns of their power and goes to consult Iva, with no conversation yet shown. The ships enter open sea; Svik offers an uncertain Snakavik travel estimate before five pursuing longships reappear, forcing him to contemplate fighting.</p></details><details><summary>The Fury of the Gods · 22</summary><h2>Chapter 22 - Orka</h2><p>Orka trains Breca aboard the river longship, then warns him to conceal and master his beast to avoid enslavement. She aims for Snakavik despite her companions’ uncertainty about the Bloodsworn. She returns his wooden sword pendant and embraces him. Her recollection of finding it at home differs from the earlier loft recovery and remains a continuity review item.</p></details><details><summary>The Fury of the Gods · 22</summary><h2>Chapter 22 - Orka</h2><p>Called to the stern, Orka leaves Lif teaching Breca. Orlyg accepts her former Bloodsworn history and thanks her for saving Dagrun, offering passage. His attendants are named Aila, Tjorvi and Gösta—the previously unnamed Galdurman. The voyage has lasted two days; wounded passengers and shrouded dead remain aboard.</p></details><details><summary>The Fury of the Gods · 22</summary><h2>Chapter 22 - Orka</h2><p>The council discusses Svelgarth’s destruction and limited options, choosing resistance over surrender, rebuilding or flight to Iskidan. Orlyg’s proposed Störr alliance reflects incomplete knowledge. Orka reveals Ulfrir’s presence with Elvar; Tjorvi reports dream-calls to the wolf-bloods. Orlyg orders the ship towards Snakavik to seek them, without an alliance or arrival yet.</p></details><details><summary>The Fury of the Gods · 23</summary><h2>Chapter 23 - Elvar</h2><p>Elvar waits anxiously: Grend has been missing from sparring and searchers have found no trace for three days. Hrung says he killed Snaka by poisoning himself and entering the serpent’s mouth after losing his whole clan. His survival remains unexplained by his own account. Elvar comforts him and gives him mead.</p></details><details><summary>The Fury of the Gods · 23</summary><h2>Chapter 23 - Elvar</h2><p>Ulfrir brings roughly forty or more hungry, wary Úlfhéðnar. Elvar agrees to receive their oaths and his command to serve her, ordering the arrangement immediately without collars. Their exact oath words are not shown. Ulfrir later proposes the mostly underground Wolfdales near Jarnvidr as better ground against Lik-Rifa; Elvar asks for and considers his advice.</p></details><details><summary>The Fury of the Gods · 23</summary><h2>Chapter 23 - Elvar</h2><p>Uspa urges public emancipation to win voluntary Tainted allies. Berak says he would stay, but Elvar refuses to free her existing Berserkir or Ulfrir, linking their service to victory and Bjarn’s recovery. Uspa calls it wrong; Elvar closes the argument and orders preparations to march for Jarnvidr tomorrow. No departure or release is shown.</p></details><details><summary>The Fury of the Gods · 24</summary><h2>Chapter 24 - Biórr</h2><p>Biórr returns to Darl with Rotta’s force. Fain and Harek are alive on a wagon; Brák’s reduced crew and numerous vaesen follow. Citizens hide, the market is empty and the fortress is wrecked, though smiths still work. Rotta tells Biórr to conceal their losses from Lik-Rifa.</p></details><details><summary>The Fury of the Gods · 24</summary><h2>Chapter 24 - Biórr</h2><p>Biórr presents Myrk’s covered corpse to Ilska and Drekr. They grieve, and he names Orka as her killer before entering the serpent-filled feasting hall. Lik-Rifa boasts of Orna’s death but admits forgetting the planned heart collection. Rotta claims its consumption could have given them power; another high-risk heart-source remains unnamed and rejected.</p></details><details><summary>The Fury of the Gods · 24</summary><h2>Chapter 24 - Biórr</h2><p>Lik-Rifa reports no useful word from her scouts. Rotta supplies the Snakavik location and Elvar/Battle-Grim connection extracted from Orka. Lik-Rifa asks Biórr for information about the company, but the chapter ends before his answer or any new attack.</p></details><details><summary>The Fury of the Gods · 25</summary><h2>Chapter 25 - Varg</h2><p>After a day’s pursuit, Glornir chooses battle short of Vigrið’s coast. Varg and the Bloodsworn arm, and Sea-Wolf and Sulich’s knarr are lashed together to prevent separation. Iva and Taras cross to the knarr, Taras in Einar’s gifted battle kit; wicker screens shelter the horses. Einar takes the champion’s place at Sea-Wolf’s prow.</p></details><details><summary>The Fury of the Gods · 25</summary><h2>Chapter 25 - Varg</h2><p>One drakkar approaches ahead of four others, carrying a plumed champion and collared rune-wielder. Vol and Iva’s song brings up a Sjávarorm, but the enemy’s song precedes its retreat. Arrows strike the shields; the caster raises red circles that stop some of Sulich’s answering arrows, while others get through.</p></details><details><summary>The Fury of the Gods · 25</summary><h2>Chapter 25 - Varg</h2><p>Vol and Iva’s ice magic freezes the red ward and surrounding water. Frost overtakes the first drakkar, its people and hull; the ship splits and sinks. The individual champion’s/caster’s fates and total survivors remain unknown. Varg stares in horror and fascination while Æsa jokes that she still wants a fight; the wider battle remains unresolved.</p></details><details><summary>The Fury of the Gods · 26</summary><h2>Chapter 26 - Orka</h2><p>Orka watches Lif train Breca, encouraging strategy over uncontrolled strength. Mother and son grieve Thorkel and discuss Spert’s eventual burial. At Breca’s request, Orka has obtained a barrel and salt rather than bury Spert at sea, incurring debt to Orlyg. Homecoming and vengeance remain hopes; the drakkar rows slowly into a changed wind.</p></details><details><summary>The Fury of the Gods · 26</summary><h2>Chapter 26 - Orka</h2><p>Dagrun brings brass-edged mail and a nasal helm from his oathsworn Brynjolf, whom he says died overnight. He offers the gear as his own repayment for rescue. Orka accepts and puts it on, rearranging the two seaxes front and back. He then claims to know her secret and promises discretion, without naming exactly what he knows.</p></details><details><summary>The Fury of the Gods · 26</summary><h2>Chapter 26 - Orka</h2><p>After the rowing change, the companions drink and Breca continues practice. Halja’s gold-flecked eyes accompany a report of two enormous black birds, then sails to the south, one perhaps Sea-Wolf. Orka cannot yet confirm the distant vessel; no reunion occurs in the chapter.</p></details><details><summary>The Fury of the Gods · 27</summary><h2>Chapter 27 - Varg</h2><p>The four pursuing drakkars attack the lashed ships from all sides. Vol and Iva struggle against their casters as Einar fights at the prow and the Bloodsworn form shield walls. Røkia leaps aboard an attacker; Varg follows, hurting his ankle. With Svik, Æsa, Edel and reinforcements, they break its forming shield wall and clear the deck before returning to Sea-Wolf.</p></details><details><summary>The Fury of the Gods · 27</summary><h2>Chapter 27 - Varg</h2><p>Einar suffers a chest wound, and Refna Strong-Hands and the other children pull his attacker down. At the stern, Glornir is overwhelmed, then erupts from the crowd fighting with claws and teeth. An arrow wounds his shoulder; Edel shields him as the others counterattack. An axe blow dents Varg’s helmet and drops him; he kills his attacker before Røkia helps him up, unsteady and vomiting.</p></details><details><summary>The Fury of the Gods · 27</summary><h2>Chapter 27 - Varg</h2><p>The knarr’s defenders are being pressed into its centre while more attackers board Sea-Wolf. Varg has lost sight of his shield, and Røkia tries to cover them both. They see another drakkar rowing towards them, but its identity and the battle’s outcome remain unresolved.</p></details><details><summary>The Fury of the Gods · 28</summary><h2>Chapter 28 - Orka</h2><p>Orka prepares Breca with borrowed shield and padded helm, increasing her debt to Orlyg, and assigns Lif and Sæunn to protect him. She has identified Sea-Wolf and persuaded Orlyg to intervene; his desire for the Bloodsworn’s debt yields to Gunnar’s argument that saving the knarr helps them too. Passing Sea-Wolf, Gunnar and Halja cast spears and rally its defenders.</p></details><details><summary>The Fury of the Gods · 28</summary><h2>Chapter 28 - Orka</h2><p>Orka tells Breca that she and Thorkel broke their Bloodsworn oaths to raise him, but still regard the company as family. She dons her cap and helm. Orlyg’s ship boards the drakkar at the knarr’s stern, where Gösta burns two guards with a rune-net and Dagrun spears the collared female caster overboard. Her final fate is unshown.</p></details><details><summary>The Fury of the Gods · 28</summary><h2>Chapter 28 - Orka</h2><p>Orka’s group crosses onto the knarr and attacks the archers behind Sulich’s hard-pressed defenders. Taras fights despite many arrows lodged in him. Halja protects Orka and finishes an enemy Breca strikes. Orlyg’s reinforcements break one crew, but another still fights. Sulich briefly attacks Orka before Gunnar stops the mistake, and she introduces him to Orlyg as they prepare to continue.</p></details><details><summary>The Fury of the Gods · 29</summary><h2>Chapter 29 - Varg</h2><p>After Gunnar and Halja’s passing attack distracts the enemy, Glornir’s charge carries the Bloodsworn onto the stern drakkar. Varg is left exhausted by his frenzy, and a protected caster remains beyond the cleared deck. Vol’s scream draws them back to Sea-Wolf, where another caster presses her while Einar, Svik and the children attack his escort.</p></details><details><summary>The Fury of the Gods · 29</summary><h2>Chapter 29 - Varg</h2><p>A blade pierces Svik’s hip, and a sabre threatens his neck. Orka intervenes before the others can reach him, cutting down the attackers. Varg recognises her, Gunnar and Halja as the rescue group breaks through. Glornir embraces Orka, but Einar pushes them clear of the advancing rune-wielder; Orka pulls Breca out of its path.</p></details><details><summary>The Fury of the Gods · 29</summary><h2>Chapter 29 - Varg</h2><p>The caster from the stern drakkar joins the one facing Vol. Their spells intensify to white heat and strike her ice-shield, producing a burst of sparks and boiling steam that throws the Bloodsworn down. Vol’s condition and the battle’s outcome remain unresolved.</p></details><details><summary>The Fury of the Gods · 30</summary><h2>Chapter 30 - Orka</h2><p>Vol survives the blast with a damaged but intact shield. Her ice spells open a gap for Orka’s spear; the two giant ravens then carry off and kill the shoulder-wounded caster. Vol strips the other caster’s protection with wind and a wave, and Iva binds and silences him. The last drakkar is seen withdrawing south.</p></details><details><summary>The Fury of the Gods · 30</summary><h2>Chapter 30 - Orka</h2><p>A mother sea serpent boards with her spear-length young, and Vol stops Orka from striking it. Vol strokes its head and delivers the bound captive to it. Orka interprets the mother’s demonstration as teaching the young to hunt; they bite the captive and drag him beneath the sea. One juvenile instead stays with Vol and coils around her forearm.</p></details><details><summary>The Fury of the Gods · 30</summary><h2>Chapter 30 - Orka</h2><p>The ravens land and speak as Grok and Kló. Vesli hugs Breca, then asks for Spert; his tears and headshake bring her to grief. In the quiet after fighting, Orlyg remarks on the strange company the Bloodsworn keep. Casualty totals and the rescue debt remain unsettled.</p></details><details><summary>The Fury of the Gods · 31</summary><h2>Chapter 31 - Guðvarr</h2><p>At a bridge over the Slågen, Sigrún identifies Jarnvidr and leads the hunters across despite Guðvarr’s fears. She hopes Skapti’s message offers advancement with Lik-Rifa or Ilska while distrusting him. He directs them straight through the forest and says Skalk and Estrid told him to stay on the road, though he knows neither the exact meeting place nor time.</p></details><details><summary>The Fury of the Gods · 31</summary><h2>Chapter 31 - Guðvarr</h2><p>A disturbance brings Krúsa’s weapon out and Munni into the trees. Frost-spiders return with a bound Faunir, leaf-haired and wood-grained, whose bite wounds are turning icy blue. It demands they leave. Krúsa rejects killing it, warning that its blood would harm spiders and other Faunir might retaliate.</p></details><details><summary>The Fury of the Gods · 31</summary><h2>Chapter 31 - Guðvarr</h2><p>Sigrún proposes a hostage to be released after leaving the forest. Krúsa agrees, and the captive is tied to a cut birch pole and carried between two skraeling. The column moves on, with Guðvarr still fearful; the promised meeting and hostage release remain unfulfilled.</p></details><details><summary>The Fury of the Gods · 32</summary><h2>Chapter 32 - Orka</h2><p>Orlyg and Glornir compare their Snakavik plans. Vesli admits she omitted news of collared Ulfrir. Glornir acknowledges the Bloodsworn’s rescue debt with his word and a wrist-grip, but refuses Orlyg’s offer to buy either Seiðr-witch. Once Orlyg leaves, Orka, Vol and Glornir share an emotional reunion.</p></details><details><summary>The Fury of the Gods · 32</summary><h2>Chapter 32 - Orka</h2><p>Orka introduces Breca to his paternal uncle Glornir, who calls him Breca Thorkelsson and weeps. Rescue has fulfilled only part of Orka’s oath; Thorkel remains unavenged, and Glornir promises to help find Drekr. Edel learns Revna was buried near Breca’s rescue lake, welcomes Sæunn and praises Lif’s shieldcraft despite his new facial cut.</p></details><details><summary>The Fury of the Gods · 32</summary><h2>Chapter 32 - Orka</h2><p>Eight Bloodsworn and ten of Sulich’s kin are buried at sea. After tending wounds and repairs, Glornir gathers Sulich’s crew, Iva and the bandaged Taras. He tells newcomers to choose collar-as-cover or secrecy without a collar before landing. He thanks Grok and Kló, who offer aerial scouting after their meal, and orders preparations for Snakavik. Orlyg’s ship is already sailing towards the coast.</p></details><details><summary>The Fury of the Gods · 33</summary><h2>Chapter 33 - Elvar</h2><p>With Grend missing five days, Elvar struggles to leave Snakavik. Uspa insists on noon’s tide and Ulfrir warns of the dragon, while nearly a hundred of his followers have now sworn and gathered. Elvar agrees to go to the docks, taking Hrung by cart through the Bone Tunnel into the busy provisioning town.</p></details><details><summary>The Fury of the Gods · 33</summary><h2>Chapter 33 - Elvar</h2><p>Wave-Jarl is repaired and ready, and Hrung is loaded aboard. Broðir brings Runa Red-Axe and Ákveðin, a named Hundur-thrall Runa gives to Elvar for scent-tracking. Elvar accepts and asks Gytha for an item of Grend’s, but no tracking begins.</p></details><details><summary>The Fury of the Gods · 33</summary><h2>Chapter 33 - Elvar</h2><p>Hjalmar arrives with a crowd, then reveals Grend battered, roped and leashed. Elvar reaches for her sword and demands an explanation. Hjalmar claims Grend has deceived her for years and is Tainted; the chapter ends before any response or independent confirmation.</p></details><details><summary>The Fury of the Gods · 34</summary><h2>Chapter 34 - Guðvarr</h2><p>The Faunir hostage is still alive and defies gags as the hunters reach a stream-crossed glade where Skalk and Estrid wait. Munni reports their troop numbers. Estrid seeks a survival alliance and Skalk offers intelligence; Sigrún promises only advocacy with Lik-Rifa and Ilska, without a binding guarantee.</p></details><details><summary>The Fury of the Gods · 34</summary><h2>Chapter 34 - Guðvarr</h2><p>Estrid and Skalk report Störr’s death and Elvar’s collared wolf-god, citing travellers Frek questioned. They claim to know his location and offer further service. Sigrún and Krúsa agree to forward the proposal, with Munni’s people as messengers; no dragon acceptance is shown.</p></details><details><summary>The Fury of the Gods · 34</summary><h2>Chapter 34 - Guðvarr</h2><p>Faunir swarm the glade, overwhelm defenders and hurl splinters that wound Guðvarr’s forearm. He helps open Sigrún’s escape; she rescues Krúsa and guards the retreat while Skalk’s party withdraws the other way. Looking back, Guðvarr sees the hostage freed by its kind and standing to give a war cry.</p></details><details><summary>The Fury of the Gods · 35</summary><h2>Chapter 35 - Elvar</h2><p>Wave-Jarl leaves Snakavik with fifty longships and fifty knarr, rowing south into a headwind. Ulfrir advises Elvar to face the task she delays and assures her about Wolfdales. Skuld asks for silver scissors she says belonged to her mother. Elvar gives them from the Oskutreð treasure, and Skuld attaches them to her belt.</p></details><details><summary>The Fury of the Gods · 35</summary><h2>Chapter 35 - Elvar</h2><p>Inside a makeshift sail room, Grend remains bound and injured. Hjalmar says his Hundur-thrall found bloodied linen, alleges Hundur blood and reports chasing Grend after he resisted. He hands over Grend’s equipment, and Elvar promises payment for his losses.</p></details><details><summary>The Fury of the Gods · 35</summary><h2>Chapter 35 - Elvar</h2><p>Grend offers only an apology. Elvar, wounded by what she sees as fifteen years of deception, restrains a slap and orders Silrið to fit an iron collar and say the binding words. She leaves in tears; actual collaring and Grend’s explanation remain unshown.</p></details><details><summary>The Fury of the Gods · 36</summary><h2>Chapter 36 - Biórr</h2><p>Darl prepares for war. Fain drives a wagon despite his injured leg, with Harek and other children aboard; he and Biórr hope to end thraldom and avenge their dead. Lik-Rifa appears in gilded mail and red cloak, mounts and leads the host out with a roar against the wolf. Rotta draws Biórr beside him as followers swell the streets.</p></details><details><summary>The Fury of the Gods · 36</summary><h2>Chapter 36 - Biórr</h2><p>Rotta explains the slower land route through followers unwilling to sail and the refusal to divide the army, speculating about Ulfrir’s threat. At the docks, Sterkur’s gold-eye band offers service, with Leif newly among them. Leif openly wants the Bloodsworn dead; Drekr welcomes him and Ilska calls them into the column.</p></details><details><summary>The Fury of the Gods · 36</summary><h2>Chapter 36 - Biórr</h2><p>The army leaves Darl through meadows and woodland, gathering troll clans, spiders, night-hags and spertus. Biórr calls it unbeatable; Rotta warns against assuming victory. No full army count, Snakavik arrival or battle follows.</p></details><details><summary>The Fury of the Gods · 37</summary><h2>Chapter 37 - Varg</h2><p>During the coastal voyage Varg mends his tunic and Røkia repairs mail while Einar wrestles with the children. Breca’s controlled sparring draws blood from Einar; Refna angrily tackles him, and Einar and Orka separate them. Glornir then tells Varg to blacken his shield for the vow that night.</p></details><details><summary>The Fury of the Gods · 37</summary><h2>Chapter 37 - Varg</h2><p>At an anchored cove on the south-west coast, Varg prepares in clean mail and remembers Frøya, wishing she could know the kinship he has found. Svik leads him into the fire-circle, where the company and finally Glornir vouch for him. Vol joins their blood in the witnessed rite.</p></details><details><summary>The Fury of the Gods · 37</summary><h2>Chapter 37 - Varg</h2><p>Varg speaks the full oath of kinship and service, seals it on his shield with their glowing blood and receives the marked shield back. Glornir welcomes him as Bloodsworn; the cheering leaves him in tears of joy. The long-postponed spoken rite is now complete.</p></details><details><summary>The Fury of the Gods · 38</summary><h2>Chapter 38 - Elvar</h2><p>Ulfrir guides Elvar’s fleet into the forest-lined River Falinn and upriver towards Wolfdales. Wolves follow from the western woods. Orv questions trust, and Elvar explains her confidence in collar and blood-oath control, including her expected succession to Broðir if she dies. These remain her claims about protection.</p></details><details><summary>The Fury of the Gods · 38</summary><h2>Chapter 38 - Elvar</h2><p>Hundreds of wolves howl from the hill as Wave-Jarl passes a stone bridge and moors among ancient piers. The company lands with Hrung. Silrið leads Grend on a leash attached to his now-fitted iron collar; he asks Elvar to trust him, and she rejects that appeal despite seeing his wounds healing. They follow Ulfrir towards a vine-covered cliff.</p></details><details><summary>The Fury of the Gods · 38</summary><h2>Chapter 38 - Elvar</h2><p>Ulfrir’s invocation strips away the covering and reveals wolf-carved doors and two animated stone-wolf guardians. He transforms to a mead-hall-sized wolf and howls with them and the wolves above. The gates open and he welcomes the company, but the interior is not yet described.</p></details><details><summary>The Fury of the Gods · 39</summary><h2>Chapter 39 - Orka</h2><p>Rowing brings back Orka’s own oath under Boðvar-Claw and guilt over leaving. Breca imitates her with Vesli on his lap, but she refuses to let him take an oar yet. Grok reports the dragon’s army walking west from Darl; Glornir and Vol infer Snakavik as its destination, while Orka thinks of vengeance.</p></details><details><summary>The Fury of the Gods · 39</summary><h2>Chapter 39 - Orka</h2><p>Svik confronts Orka over the oath and his grief when she disappeared. She explains she left for her son’s safety, only to lose the peaceful home she sought. Asked whether she is Bloodsworn again, she offers her return if Glornir will have her. He says she never left his heart; no new blood ceremony occurs.</p></details><details><summary>The Fury of the Gods · 39</summary><h2>Chapter 39 - Orka</h2><p>Kló reports Elvar’s ships sailing south and into Jarnvidr, and the ravens identify Ulfrir’s home, Wolfdales. Kló cites having seen and heard the howling. Glornir asks the pair to relay news and a change of destination to Orlyg: the Iron Wood. Neither delivery nor arrival is shown.</p></details><details><summary>The Fury of the Gods · 40</summary><h2>Chapter 40 - Elvar</h2><p>Two days inside Wolfdales, Elvar’s council considers using Ulfrir as bait while the army defeats the dragon’s host. Disturbed by Grend’s secret, Elvar leaves the great hall with its luminous fungus-covered tree and wolf-carved pillars. She has begun securing the tunnel network and organising the host but still needs enemy intelligence. Sighvat and Berak each affirm chosen loyalty before she enters Grend’s cell alone.</p></details><details><summary>The Fury of the Gods · 40</summary><h2>Chapter 40 - Elvar</h2><p>Grend explains an earlier oath to Elvar’s mother and openly identifies Hundur blood. His account traces childhood thraldom, kindness, mutual rescue, secrecy and earned freedom, then his choice to follow her to Snakavik and protect Elvar after her birth. The mother knew his secret. Asked about paternity, he denies being Elvar’s biological father while regarding her as his daughter in all else.</p></details><details><summary>The Fury of the Gods · 40</summary><h2>Chapter 40 - Elvar</h2><p>Elvar silently cuts Grend’s wrist bonds with the axe he gave her and releases his wall tether, then leaves. Collar removal, formal emancipation and restored office are not stated.</p></details><details><summary>The Fury of the Gods · 41</summary><h2>Chapter 41 - Biórr</h2><p>At dawn Fain oversees the children while Biórr feels alone. Ilska thanks him for Myrk’s return and their mutual joy, then asks for Orka’s strengths and vulnerabilities. He describes her wolf-blood, skill, maternal drive, resistance and Bloodsworn connection. Ilska cites Sterkur’s news of Elvar’s offer and gives Biórr a raven feather she says was Myrk’s; he braids it into his hair.</p></details><details><summary>The Fury of the Gods · 41</summary><h2>Chapter 41 - Biórr</h2><p>Near the Slågen and Jarnvidr, Tannbursta identifies the returning, diminished and wounded hunting party. Sigrún and Krúsa explain the Faunir fight and Estrid/Skalk’s wish to join, reporting Störr’s death and Elvar’s collared wolf. The proposed further service is spying in Ulfrir’s camp; trust and formal acceptance remain unresolved.</p></details><details><summary>The Fury of the Gods · 41</summary><h2>Chapter 41 - Biórr</h2><p>Munni brings new information from the fugitives and says he checked the den himself, seeing ships and stone wolves. Lik-Rifa praises the report and judges Ulfrir’s homecoming weakness, intending his death. No entry into the den by spies, god-sighting by Munni or actual attack is shown.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>Chapter 42 - Varg</h2><p>On the river, Sulich reports Iva and Taras alone choose collar cover. Glornir supplies two collar/key pairs, promises not to sell Iva and checks her choice. Vol disguises the sleeping young serpent as a coiled whip before they hurry to Wolfdales. The crews land with horses, ravens and Orlyg’s following, then pass growing river defences and animated stone wolves.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>Chapter 42 - Varg</h2><p>Inside the busy wolf hall, Varg sees a spiral walkway carved up the luminous tree and a crowd of varied warbands. He questions scowls towards the Iskidan arrivals. Uspa and Vol joyfully reunite, then Uspa embraces Glornir. Ulfrir steps forward with Skuld and privately calls to Varg, promising secrecy and inviting him closer.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>Chapter 42 - Varg</h2><p>Glornir declares the Bloodsworn will fight the dragon with Elvar. She welcomes the accepted offer and asks after Orka; the chapter ends before the reply or payment.</p></details><details><summary>The Fury of the Gods · 43</summary><h2>Chapter 43 - Orka</h2><p>Orka answers Elvar: Breca is recovered, Myrk dead and Drekr still with the dragon. She affirms the Bloodsworn as her allegiance despite Ulfrir’s private claim on her. Orlyg offers his surviving force, brings news of Rotta’s return and names the Nidden as the river of his rescue attack. Orka confirms the rat’s presence; Elvar accepts Orlyg’s axe.</p></details><details><summary>The Fury of the Gods · 43</summary><h2>Chapter 43 - Orka</h2><p>Glornir and Grok report the enemy march. Hrung recognises both giant ravens, surprising Orka with his living presence. Ulfrir warns that they were Snaka’s spies; the birds speak of loneliness and friendship, and Orka vouches for their help while refusing the god’s direction about whom to trust.</p></details><details><summary>The Fury of the Gods · 43</summary><h2>Chapter 43 - Orka</h2><p>The ravens cannot give a precise enemy arrival time but offer to watch. Elvar welcomes their friendship and scouting, then welcomes the allies with promised rooms, food and ale. No scouting departure, feast, payment or new battle occurs.</p></details><details><summary>The Fury of the Gods · 44</summary><h2>Chapter 44 - Elvar</h2><p>A single horn calls Elvar from Ulfrir’s high bedchamber to new arrivals. She descends the branch-and-trunk walkway with Sólín and Thorguna, receiving encouragement and Silrið’s pressure over Grend. She still has not decided his fate. The arrivals are Estrid, Skalk and followers, offering an alliance; Estrid’s fair-haired description here conflicts with earlier dark hair.</p></details><details><summary>The Fury of the Gods · 44</summary><h2>Chapter 44 - Elvar</h2><p>Glornir moves to avenge Skalk’s earlier crimes, knocks down an unnamed guard and draws his sword as red and blue spells kindle. Elvar calls Ulfrir, whose huge wolf form halts the confrontation. Glornir demands justice for Vol and the dead company member, but Elvar suspends internal feuds until the dragon is dead. He leaves with vengeance postponed.</p></details><details><summary>The Fury of the Gods · 44</summary><h2>Chapter 44 - Elvar</h2><p>Elvar extends the rule to all countries and species and welcomes Estrid/Skalk on those terms; they agree verbally. A giant raven then brings word that Lik-Rifa has reached Jarnvidr. No attack, formal oath or faithful future compliance is yet shown.</p></details><details><summary>The Fury of the Gods · 45</summary><h2>Chapter 45 - Guðvarr</h2><p>From a northern approach chosen by Ilska, Lik-Rifa’s host prepares to enter the Iron Wood. Ilska estimates five days or less to Ulfrir’s den and sends tennúr scouts. Sigrún praises her command and logistical work. Later, dense scrub confines most of the camping host to the road while smaller vaesen range through the woods.</p></details><details><summary>The Fury of the Gods · 45</summary><h2>Chapter 45 - Guðvarr</h2><p>Guðvarr’s dread contrasts with Drekr’s easy reception around the fires. Over stew and ale, Sigrún admits she fears battle and losing everything she has built. They discuss courage as a response to fear, and her recounting of his survival steadies him. At dawn a tennúr warns that an unidentified force is coming, and he runs back to her camp.</p></details><details><summary>The Fury of the Gods · 46</summary><h2>Chapter 46 - Orka</h2><p>In a hidden tunnel, Orka waits with the Bloodsworn and Sulich’s bowmen for Ulfrir’s signal. Sæunn insists on guarding her back, while Lif hopes for vengeance on Guðvarr; Breca remains at Wolfdales. Vol’s red runes reveal a concealed hatch, and Glornir leads them into dawn. Vol promises to guide them back.</p></details><details><summary>The Fury of the Gods · 46</summary><h2>Chapter 46 - Orka</h2><p>The raiders strike the forest camp. Lif uses Vol’s taught words to destroy a night-hag gripping Sæunn, while archers counter spiders. Fighting and fire spread along the road. Orka follows Dragon-born magic through the smoke, faces Drekr and braces as he runs at her. Their clash remains unresolved.</p></details><details><summary>The Fury of the Gods · 47</summary><h2>Chapter 47 - Guðvarr</h2><p>Guðvarr sees Orka and Drekr duelling and tries to approach Orka, but Lif attacks for Mord. Lif wounds him before Guðvarr tackles and strangles him; a shield blow frees Lif, and an unnamed spearwoman helps him stand. Lik-Rifa crashes through the canopy in dragon form, disrupting the fighting. A horn calls the raiders back; both Orka and Drekr survive the visible encounter, without a declared victor.</p></details><details><summary>The Fury of the Gods · 47</summary><h2>Chapter 47 - Guðvarr</h2><p>Sigrún finds the wounded Guðvarr and leads him after the retreating raiders. He sees an unnamed Seiðr-woman and warriors disappear amid rune light; their tracks end abruptly. A huge approaching animal proves to be Rotta rather than Ulfrir. The gods report attacks without seeing the wolf-god, tennúr searches fail and Rotta concludes the raiders used tunnels.</p></details><details><summary>The Fury of the Gods · 48</summary><h2>Chapter 48 - Varg</h2><p>Varg and the Bloodsworn return through tunnels to Wolfdales after the swift raid, with Brák still unfound. Elvar and Glornir confirm the crew brought back; wounded are tended, including spider-bitten fighters, Dagrun and Elvar’s bandaged arm. At the meal Varg’s companions pledge solidarity, and Einar covers Varg’s and Røkia’s clasped hands.</p></details><details><summary>The Fury of the Gods · 48</summary><h2>Chapter 48 - Varg</h2><p>Collared servants and Frek prompt Varg to question the alliance with slavers. His companions cite the dragon’s stolen children and their dead, and he rejects fighting for her. He then proposes freedom for everyone and paid labour, rather than reversing who is enslaved. No reform is enacted.</p></details><details><summary>The Fury of the Gods · 48</summary><h2>Chapter 48 - Varg</h2><p>Logur arrives from Liga with over a hundred blue-shielded oathsworn and is welcomed by Elvar through Glornir’s friendship. Hrung and the gods surprise and amuse him. Kló brings reports of enemy losses and anger, followed by news of many unidentified Tainted joining the dragon.</p></details><details><summary>The Fury of the Gods · 49</summary><h2>Chapter 49 - Elvar</h2><p>Elvar inspects the newly built timber bridge gate, towers and riverbank earthworks while further tunnel raiders are ordered against supply wagons. Orv sees an effective shooting and rock-dropping position, but Elvar and Ulfrir agree ordinary defences would not withstand the dragon. Elvar’s perception of Iva and Taras as thralls remains distinct from their established collar cover.</p></details><details><summary>The Fury of the Gods · 49</summary><h2>Chapter 49 - Elvar</h2><p>Uspa, Vol and Iva channel rune-fire through a shallow wheel-like ditch pattern while Ulfrir and hovering Skuld contribute blood. Warm white sparks settle harmlessly on Elvar and Taras but blaze on timber and channels. When the glow fades Ulfrir declares the wall and gate protected against dragon and rat, perhaps able to bite; this claim has not yet been tested.</p></details><details><summary>The Fury of the Gods · 50</summary><h2>Chapter 50 - Biórr</h2><p>Burned supply wagons and wounded children mark the aftermath of repeated raids. Fain and Harek are alive, and Fain rescues an unconscious but breathing girl named Aila. Bjarn is directly present too. He challenges the claim he is free when not permitted to leave, recalling the children’s unchosen use in freeing the dragon. Biórr cannot answer that charge, and Fain stops his attempt to walk away.</p></details><details><summary>The Fury of the Gods · 50</summary><h2>Chapter 50 - Biórr</h2><p>At the evening council, captains report thin guards, nightly losses, two deserting bands and short food supplies; Tannbursta estimates two days to Wolfdales. More Tainted have joined, and Rotta asks to see any bearing his blood. After the captains leave, Munni’s intelligence brings news of the defences and unnamed disaffected insiders who might open the doors if Elvar died. No killing method or informant identity is disclosed.</p></details><details><summary>The Fury of the Gods · 51</summary><h2>Chapter 51 - Elvar</h2><p>Ulfrir takes Elvar privately up the tree, leaving her guards behind. She glimpses Silrið with Runa, Hjalmar and Estrid, assuming they discuss Grend without hearing them. Ulfrir shares his grief for Orna and reveals the open canopy is sealed by an invisible blue-rippling barrier. He opens and closes it with spoken words, and Elvar follows him onto its firm surface above the hall.</p></details><details><summary>The Fury of the Gods · 51</summary><h2>Chapter 51 - Elvar</h2><p>From the hill they survey Vigrið and discuss Froa-filled ash woods, leadership and trust. Elvar says her aim is survival and bringing Bjarn back, compelled by her oath. Ulfrir describes sealed/guarded alternate entrances and tells her Snaka planted the hall tree from Oskutreð. Its sleeping Froa, Gelta, resisted the carving; Ulfrir begins the waking song, but no response is shown before the chapter ends.</p></details><details><summary>The Fury of the Gods · 52</summary><h2>Chapter 52 - Orka</h2><p>Dagrun confirms he knows Orka’s hidden gift and offers mutual friendship without exposing her. She discusses Skalk’s threat with Glornir and Breca, who proposes collar cover. Breca reports hearing both wolf and bear; Glornir reaffirms blood kinship with Thorkel and oath kinship with Orka. The family grieves, while Breca relays camp talk of freedom and Orka gives her cynical account of war motives.</p></details><details><summary>The Fury of the Gods · 52</summary><h2>Chapter 52 - Orka</h2><p>A dawn dragon attack shakes the hall. Outside, the gate/towers still stand with blue ripples but the fleet is wrecked. Breca spots Broðir approaching Elvar with hidden steel and Orka warns her. Broðir, Runa, her drengrs and Silrið attack; Gytha and Thorguna defend, Vol’s serpent whip disrupts Silrið, and Orka’s hand-axe strikes Broðir.</p></details><details><summary>The Fury of the Gods · 52</summary><h2>Chapter 52 - Orka</h2><p>Elvar survives. Gytha subdues Runa alive while her attacking men are slain. Broðir and Silrið flee the transformed Ulfrir by jumping into the river, their fates unconfirmed; Orka’s axe goes with Broðir. No further sentence, rescue or completed salvage is shown.</p></details><details><summary>The Fury of the Gods · 53</summary><h2>Chapter 53 - Biórr</h2><p>Fain continues training the recovering children despite his unhealed mobility problem, while Harek and Bjarn spar fiercely. Tennúr order the host to move at night and leave fires burning. Rotta explains this as deception against aerial scouts, and newly joined rat-blood guards include Skadi. Lik-Rifa confirms the ward hurt her, while the gods debate Ulfrir’s strength and an unnamed dangerous contingency.</p></details><details><summary>The Fury of the Gods · 53</summary><h2>Chapter 53 - Biórr</h2><p>Brák’s scouts bring Silrið and Broðir alive but badly wounded. Lik-Rifa explicitly names Broðir’s failed mission to kill Elvar and open the doors. She first orders the pair killed, then stays the outcome when Rotta argues Broðir could inherit control of Ulfrir if Elvar died. His wounds are ordered tended and both are led away. Rotta’s closing words disclose intent, not a new assassination method.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>Chapter 54 - Elvar</h2><p>Elvar finds her waist bruised but praises Thorguna’s defence. Salvage yields three repairable ships and Orka recovers an unidentified barrel. Runa, injured after capture/interrogation, condemns Elvar’s supposed weakness and denies remaining allies. Elvar executes her publicly for oath-breaking, then confronts the danger of Broðir inheriting control if she dies.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>Chapter 54 - Elvar</h2><p>Elvar offers Ulfrir freedom in return for a justice oath. Uspa carves four named runes into his chair, combines their blood and translates his vows. The ritual leaves a spiral scar, and Elvar removes his collar. She frees Skuld without a separate oath and releases all her Berserkir, offering voluntary service. Other chiefs must free their Tainted to remain; Orlyg, the others and Estrid comply.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>Chapter 54 - Elvar</h2><p>Vol, Iva and Taras remove their own cover collars and Glornir reveals they were never his thralls. The current Bloodsworn publicly acknowledge being Tainted and pledge loyalty. Freed guards choose to keep serving. Elvar then removes Grend’s collar and embraces him, telling him he is the personal reason behind her decision.</p></details><details><summary>The Fury of the Gods · 55</summary><h2>Chapter 55 - Guðvarr</h2><p>The host reaches Wolfdales at dawn. Across the river, silent defenders line the timber gate and bank palisades. Rotta rejects rams against the bound defences; ladders and rafts are ordered and begun. Sigrún’s crew works on an elm, while nearby cultists’ cutting provokes an unnamed wood-and-vine Froa.</p></details><details><summary>The Fury of the Gods · 55</summary><h2>Chapter 55 - Guðvarr</h2><p>Roots and barbed hair inflict severe harm as more woodland spirits attack. Sigrún forms her drengrs into a circle. Lik-Rifa lands, is marked by the Froa’s lashes and uproots a nearby ash; the spirit collapses and becomes still. The dragon moves to another ash, with the broader outcome unshown. This local spirit is not identified as Gelta.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>Chapter 56 - Varg</h2><p>Varg watches the dragon’s woodland destruction subside and the siege host emerge with ladders and rafts. He values his new freedom and the companions around him. Collar-free Frek’s Úlfhéðnar ask to serve Elvar, reporting Estrid, Skalk and Hjalmar’s involvement in the plot and their flight; Elvar orders a search.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>Chapter 56 - Varg</h2><p>Rotta, Drekr and Ilska come onto the bridge. Threats against Orka accompany an offer of life and freedom for surrendering Ulfrir. Elvar refuses, declaring him freed. Parley fails and the host advances. Røkia tenderly tells Varg to survive before archers and casters open the defence.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>Chapter 56 - Varg</h2><p>The rafts reach the bank and ladder assaults strike the gate. Vol, Uspa and Iva intercept enemy runes; Taras hurls a rock and warriors clash above the ditch. Varg loses his spear in an attacker, then uses his hand-axe to topple two ladders. Another immediately replaces them; the siege remains unresolved.</p></details><details><summary>The Fury of the Gods · 57</summary><h2>Chapter 57 - Guðvarr</h2><p>Guðvarr waits with Sigrún’s drengrs beside a stream, wrestling with fear and shame. He sees raft-borne attackers climbing the ditch, some reaching the wall, while skraeling spring from raised shields onto the gate walkway and meet close combat. An unnamed large defender throws one back onto the ladder parties.</p></details><details><summary>The Fury of the Gods · 57</summary><h2>Chapter 57 - Guðvarr</h2><p>Spertus swim down the crowded stream toward the river. Rotta passes through the forest with Biórr and about twelve others, offering no destination. Sigrún calls her crew forward with two rafts, and Guðvarr hesitantly follows toward the river; his own crossing is not yet shown.</p></details><details><summary>The Fury of the Gods · 58</summary><h2>Chapter 58 - Orka</h2><p>Orka, Halja and Vesli fight skraeling above the gate while Breca defends himself. Orka and Breca cannot push a loaded ladder off until Einar joins them; he then returns to supplying stones. Elvar and Grend fight along the walkway as more mercenaries, trolls and frost-spiders gather.</p></details><details><summary>The Fury of the Gods · 58</summary><h2>Chapter 58 - Orka</h2><p>Spertus reach the defended bank and fly or scramble over the wall, spreading poison while raft waves continue. Trolls use their thrown weapons as climbing holds and tennúr swarm the defenders. The embankment resistance breaks into retreating groups. Orka announces the wall breached, and Elvar orders everyone to fall back; the overall siege remains unresolved.</p></details><details><summary>The Fury of the Gods · 59</summary><h2>Chapter 59 - Guðvarr</h2><p>Guðvarr crosses by raft but falls in the corpse-filled ditch and loses his spear. He drags himself over the wall, exhausted, and Sigrún finds him beside a spertus. Following her down to the hill-side track with his sword drawn, he joins her ten-wide shield front against retreating wolf-shield warriors.</p></details><details><summary>The Fury of the Gods · 59</summary><h2>Chapter 59 - Guðvarr</h2><p>A flying spertus strikes the spearman threatening him; more spertus shatter the opposing wall. Guðvarr’s elation gives credit to their aid as Sigrún advances. Skraeling unbar the river gate, letting Ilska and Drekr lead the Raven-Feeders through. Ahead, Elvar’s host forms a shield wall before the great hillside doorway; its next encounter remains unshown.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>Chapter 60 - Elvar</h2><p>Wounded enter the hall while stone wolves guard its cracked-open doors. Elvar arranges her host, archers take fresh arrows and chosen captains hold the Berserkir/Úlfhéðnar in readiness. At her signal the stone doors close behind them. Berak calls her Chainbreaker; she refuses Gytha’s advice to stay safer and joins Battle-Grim’s front rank.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>Chapter 60 - Elvar</h2><p>Ilska’s Raven-Feeders approach opposite her, Drekr behind. Arrow volleys thin the spertus charge, and Grend chops one whose sting catches in Elvar’s replacement shield. A wind follows an unnamed incantation and disperses poison along the line. The surviving spertus withdraw and the opposing shield walls crash together; the plan and battle remain unresolved.</p></details><details><summary>The Fury of the Gods · 61</summary><h2>Chapter 61 - Varg</h2><p>Varg holds the shield line between Svik and Røkia, hoping to meet Brák. He receives calf and shoulder wounds while Orka’s long-axe helps him in the press; Breca, Lif and Sæunn cover her flanks. Controlled release of his wolf-blood renews him, but he refuses rotation as other exhausted fighters step back.</p></details><details><summary>The Fury of the Gods · 61</summary><h2>Chapter 61 - Varg</h2><p>The enemy horns sound a withdrawal and Varg drinks during the gap, with Røkia grinning beside him. Further horns part the opposing line for a tide of frost-spiders, trolls following. Varg switches from seax to cleaver before the next attack; no victory or meeting with Brák is shown.</p></details><details><summary>The Fury of the Gods · 62</summary><h2>Chapter 62 - Orka</h2><p>The defenders back away under spells/arrows as frost-spiders attack. Orka and Røkia free Varg from one; Lif and Sæunn protect Breca. A horn opens the line for a frenzied Berserkir/Úlfhéðnar countercharge that diverts the spiders. Orka sends Breca back and persuades Varg to leave the now-confirmed Brák and Drekr for another time, with Svik and Røkia’s help.</p></details><details><summary>The Fury of the Gods · 62</summary><h2>Chapter 62 - Orka</h2><p>Hyrndur swarm the retreat. An unnamed casting raises a fiery net, burning hornets until a troll tears it down and falls. When another troll catches the tripped Svik, Varg, Røkia and Orka turn to fight it together. Svik rises after it falls, jokes and runs with them toward the gates; safe entry and the counterchargers’ fate remain unshown.</p></details><details><summary>The Fury of the Gods · 63</summary><h2>Chapter 63 - Elvar</h2><p>Elvar reaches the stone doors as her host retreats and the Tainted hold the attackers back. Gytha’s three horn blasts are followed by an alarming delay before the doors open and Skuld flies out. The stone wolves charge trolls, one suffering damage, while Skuld and Orv’s arrows support them. Most defenders enter.</p></details><details><summary>The Fury of the Gods · 63</summary><h2>Chapter 63 - Elvar</h2><p>Inside, Ulfrir’s howl closes the doors after both guardians, Skuld and an intruding troll pass through. The troll kills a drengr before Ulfrir destroys it. Other attackers remain inside as warriors and casters respond. Elvar finds a spider biting Hrung; it dies before her axe lands. Hrung’s lips blue and his eyes ice over, his fate unresolved.</p></details><details><summary>The Fury of the Gods · 64</summary><h2>Chapter 64 - Biórr</h2><p>Biórr and Rotta’s selected rat-blood crew cross the river behind the hill and scale a moonlit cliff. Rat-blood gives Biórr clawed grip, and Rotta catches his slipping wrist. On the crown they see the host’s campfires, then circle the tree to a ruined tower. They strip off kit and squeeze through a tiny seam into a cramped chamber.</p></details><details><summary>The Fury of the Gods · 64</summary><h2>Chapter 64 - Biórr</h2><p>A blue Seiðr barrier blocks the trapdoor stairs. Rotta says Ulfrir’s family knew the access words and claims he extracted them by torturing a daughter, unnamed here. His whispered words actually dissolve this ward. Below, he calls Skalk and Estrid; an unidentified voice replies. The crew has not yet been shown reaching the hall or killing anyone.</p></details><details><summary>The Fury of the Gods · 65</summary><h2>Chapter 65 - Elvar</h2><p>After the retreat, Elvar uses a smaller chair and weighs the dead against Ulfrir’s confidence. He proposes tomorrow’s feigned retreat and longer-open doors to lure the dragon inside, still an untested plan. The ravens’ search gives Uspa no news of Bjarn. Ulfrir and Skuld thank Elvar for freedom, while his justice oath remains acknowledged.</p></details><details><summary>The Fury of the Gods · 65</summary><h2>Chapter 65 - Elvar</h2><p>Hrung wakes cold; Uspa’s warming hands bring relief and focused eyes, without explaining the spider’s death or proving complete recovery. Companions gather around food and arm-wrestling. In her chamber Elvar still plans tactics until Grend’s tearful pride and father-like kiss persuade her to rest. Her two guards take their posts as she sleeps.</p></details><details><summary>The Fury of the Gods · 66</summary><h2>Chapter 66 - Biórr</h2><p>Skalk and an unnamed fair-haired drengr guide the rat-blood infiltrators downward. Skadi and another kill two unnamed chamber occupants. Rotta tells Biórr to strike Elvar’s heart, while he wrestles with fear, past intimacy and a rationale based on her former enslavement. Estrid’s party and Hjalmar have been sent elsewhere.</p></details><details><summary>The Fury of the Gods · 66</summary><h2>Chapter 66 - Biórr</h2><p>At Skalk’s indicated door Biórr quietly draws his sword, turns the ring-handle and enters. He recognises Agnar’s bearskin among the set-aside gear and sees a mail-clad, blonde-braided shape on the bed. Before his raised sword strikes, an unnamed defender shouts Chief and lunges with a spear. The encounter and the bed figure’s identity remain unresolved.</p></details><details><summary>The Fury of the Gods · 67</summary><h2>Chapter 67 - Elvar</h2><p>Elvar wakes and sees Sólín defending her with a blue-flaring Oskutreð spear. Sólín kills an attacker but is stabbed by an unnamed sword-wielder and dies. Thorguna and Elvar fight the intrusion, and Biórr emerges. Their duel moves from the bedchamber onto the tree branch after the staff working and Rotta’s entry; Thorguna is wounded as Grend and Gytha arrive.</p></details><details><summary>The Fury of the Gods · 67</summary><h2>Chapter 67 - Elvar</h2><p>Elvar’s mail stops sword strikes but cannot prevent a rib injury. She turns the duel, wounds Biórr and sends his sword off the branch, holding him at her blade. Her disclosure that she freed Ulfrir and the Tainted shocks him. Before a decision, an unnamed attacker strikes her neck from behind; she chokes blood and is pushed over the stair edge. The landing and her fate remain unshown.</p></details><details><summary>The Fury of the Gods · 68</summary><h2>Chapter 68 - Varg</h2><p>The Bloodsworn wake to rebellion at the stone doors. Elvar’s body falls from the branch; Glornir identifies her and the narration confirms her corpse. The company attacks in a loose line, Glornir kills Hjalmar and Vol’s ice-net defeats Sturla. Estrid gathers drengrs and Fell-Hearted survivors while Ulfrir arrives with Skuld, guardians and Úlfhéðnar.</p></details><details><summary>The Fury of the Gods · 68</summary><h2>Chapter 68 - Varg</h2><p>Ulfrir grieves at Elvar’s body then halts Rotta’s stair party with a growl. Rotta carries a bloody seax, and his smooth face briefly reveals hidden scarred flesh. Despite Ulfrir’s threat he speaks words that open the stone doors. Before dawn, black mist and night-hags enter; the next battle remains unshown.</p></details><details><summary>The Fury of the Gods · 69</summary><h2>Chapter 69 - Biórr</h2><p>Ilska’s host enters and the hall erupts. Biórr questions Elvar’s supposed lie while Grend attacks Rotta, who transforms and flings him stunned against the tree. Biórr takes a fallen raven shield and Elvar’s light axe. Answering Rotta’s mental cry, he cuts the pinned tail free, then finds himself cornered by Ulfrir.</p></details><details><summary>The Fury of the Gods · 69</summary><h2>Chapter 69 - Biórr</h2><p>Lik-Rifa lands before the wolf and pauses the fighting. She produces the wounded Broðir, whose commands fail against the collarless god. Ulfrir’s declaration that Elvar freed him finally convinces Biórr. The dragon kills Broðir and leaps at Ulfrir; the god battle remains unresolved.</p></details><details><summary>The Fury of the Gods · 70</summary><h2>Chapter 70 - Orka</h2><p>The wolf and dragon collide and Ulfrir throws Lik-Rifa into the tree. At his call Gelta tears free, now a giant grey vine-haired Froa with green/amber eyes, and roots bind the dragon. The stone guardians attack her back as Raven-Feeders rush to cut the roots. Orka and companions drive them back to the trunk.</p></details><details><summary>The Fury of the Gods · 70</summary><h2>Chapter 70 - Orka</h2><p>Human-form Rotta sets the ash alight; Gelta’s vines burn when she tries to beat out the flames and Vol’s first frost working turns to steam. Glornir pushes toward the still-living Skalk and unnamed drengr on the stairs. Orka reaches Drekr, but Ilska joins the fight and drives her upward with a shield blow. The tree, binding and duel outcomes remain unresolved.</p></details><details><summary>The Fury of the Gods · 71</summary><h2>Chapter 71 - Guðvarr</h2><p>At dawn Sigrún leads Guðvarr into the burning hall and joins Estrid’s shield group. A huge unnamed bull-man and two Berserkir shatter it; Guðvarr loses his shield and wonders whether a mauled drengr is Járn. Finding Estrid alive but injured, he deliberately kills her while pretending to comfort her, then takes up his sword again.</p></details><details><summary>The Fury of the Gods · 71</summary><h2>Chapter 71 - Guðvarr</h2><p>Two unnamed frost casters fail to stop the Froa’s burning. Gelta collapses and the roots fall away, freeing the dragon. Ulfrir attacks, falls into the tree flames and rolls clear singed. Lik-Rifa then carries rat-form Rotta upward around the burning tree. Their destination, Gelta’s final fate and the battle outcome remain unshown.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>Chapter 72 - Orka</h2><p>The Bloodsworn climb after their enemies, Breca guarded and Thorguna aided by Gunnar/Halja. A roof ward stops retreaters and the dragon until Rotta’s words dissolve it, allowing escape outside. Halja reports Gelta dead and the hall/tree burning; Glornir pursues vengeance rather than attempt an untried route down.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>Chapter 72 - Orka</h2><p>At dawn on the crown, the dragon retreats north-west and immense fleets fill the sea. Glornir identifies Rurik/Jaromir’s planned invasion, while the source’s coast of Iskidan wording remains for review. The Bloodsworn continue the immediate fight: Halja’s spear clears a braced skraeling and Glornir/Thorguna break the screen before hitting the Raven-Feeders’ wall.</p></details><details><summary>The Fury of the Gods · 73</summary><h2>Chapter 73 - Varg</h2><p>Cut off from the upward party by fire, Varg’s group helps a battered stone wolf against trolls while Sighvat/Orlyg fight at the doors and Ulfrir remains beset. Brák appears with captive children and threatens Refna, who claws free as her Tainted traits manifest.</p></details><details><summary>The Fury of the Gods · 73</summary><h2>Chapter 73 - Varg</h2><p>Brák taunts Varg about his sister and fights Einar while his crew separates the Bloodsworn. Leif and Sterkur close on Varg with golden-eye warriors. Brák drives his sword through Einar’s throa
