      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 32</summary><h2>Children hidden in the barrels</h2><p>Svik tells this fable aboard the loaned drakkar after Einar asks him to distract the children. He sits on a barrel with mead, looks towards Hakon and Frek, and introduces a boy, widow, wolf, troll and the way of the world. This page’s descriptive title follows that introduction.</p></details><details><summary>The Hunger of the Gods · 32</summary><h2>Children hidden in the barrels</h2><p>In the tale, a widow whom Svik calls Helka frees a starving troll named Einar from beneath a stone by using a branch as a lever. The troll then threatens to eat her. Asked to judge, an old hound and a lame horse side with him, each describing an ungrateful owner who plans to kill an animal no longer useful.</p></details><details><summary>The Hunger of the Gods · 32</summary><h2>Children hidden in the barrels</h2><p>A black-furred wolf named Frek bargains for a night among the widow’s sheep, from sunset to sunrise, in exchange for help. He tricks the troll into demonstrating how he fitted under the stone, then helps trap him there again. The wolf echoes the claim that life is unfair and this is the way of the world.</p></details><details><summary>The Hunger of the Gods · 32</summary><h2>Children hidden in the barrels</h2><p>The wolf eats so much that he oversleeps the deadline. The widow’s workers beat him, and she decides to kill him, leaving her son, named Hakon, on guard while she fetches her axe. Instead the boy carries the injured wolf to safety. When the wolf invokes the way of the world, the boy denies that there is such a thing and points to his head.</p></details><details><summary>The Hunger of the Gods · 32</summary><h2>Appearance</h2><p>The names are borrowed for fictional roles. These events do not establish the real Helka’s widowhood, Einar’s deeds, Frek’s fur or injuries, the real prince’s age, or an actual rescue. Einar reassures the children that the troll is not him. Hakon jokes about the widow, nudges Frek at the wolf’s naming, protests unfairness and finally says he does not understand. The company laughs and then responds with smiles and agreement; Sulich praises the tale. Frek ends with clenched fists, without a stated explanation.</p></details></noscript>
