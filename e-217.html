      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 10</summary><h2>The night-hag in the woodland camp</h2><p>Night-hags attack Orka’s woodland camp at night. She sees silent, floating forms and recognises the smell of decay before naming them.</p></details><details><summary>The Hunger of the Gods · 10</summary><h2>Appearance</h2><p>The encountered creatures have wide eyes, flat skeletal noses, long black hair and skeletal bodies under ragged cloaks, with pale wrinkled skin. Oversized clawed hands extend from thin branch-like arms; rope-thick hair can grip and choke a victim.</p></details><details><summary>The Hunger of the Gods · 10</summary><h2>Appearance</h2><p>Orka’s first axe stroke passes through a hag’s mist-like body, although the hair gripping her remains solid. After she remembers words Uspa taught her, speaking Skuggar skilja as she strikes disperses that creature and then another choking Lif. These are the effects shown in this encounter.</p></details><details><summary>The Hunger of the Gods · 10</summary><h2>Appearance and the chapter-10 encounter</h2><p>The hag sitting on Lif’s chest has an expression Orka compares to a mother’s love, then turns savage when attacked. Edel says night-hags enjoy watching a slow death; that wider explanation remains her claim.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>A coven answers the summons and receives a separate chamber from Lik-Rifa because they prefer darkness. Biórr shivers as their ethereal forms float past like mist, and shadowed figures later linger at the council’s rear. The mist comparison is not a newly demonstrated transformation.</p></details><details><summary>The Hunger of the Gods · 78</summary><h2>Escape through the river valley</h2><p>A night-hag emerges from mist and settles on venom-weakened Orka&#x27;s chest amid attacking frost-spiders, adding a crushing weight before darkness takes her. The passage does not separately establish a final death.</p></details><details><summary>The Fury of the Gods · 36</summary><h2>Night-hags float beside Lik-Rifa’s marching army after it leaves Darl</h2><p>Night-hags float beside Lik-Rifa’s marching army after it leaves Darl. Rotta reports them among followers unwilling to sail; the observed march does not establish a universal aversion for every individual.</p></details><details><summary>The Fury of the Gods · 46</summary><h2>A hag grips Sæunn’s throat while ordinary spear thrusts pass through its mist-like body</h2><p>A hag grips Sæunn’s throat while ordinary spear thrusts pass through its mist-like body. Lif’s weapon strikes after skuggar skilja wound and then shatter it into black fragments dissolving to mist. Other Bloodsworn use Vol’s taught words nearby. This documents an effective counter in this fight rather than total immunity.</p></details><details><summary>The Fury of the Gods · 68</summary><h2>Elvar’s fall and the rebellion in the hall</h2><p>Black mist carries screeching/wailing night-hags through the stone doors after Rotta’s successful word-command before dawn. Their next individual attacks and the hall’s final fate are unshown.</p></details><details><summary>The Fury of the Gods · 69</summary><h2>They enter first, floating like mist and grasping with long hands</h2><p>They enter first, floating like mist and grasping with long hands. During the hall fight they squeeze necks, while remembered rune-words destroy some in bursts of black light. The dragon’s landing pauses combat; no exact loss or final outcome is supplied.</p></details><details><summary>Illustration · The Hunger of the Gods · 10</summary><p><a href="assets/5012daf05e5ede.jpg">Open noncanonical illustration</a></p><p>A creature study of the night-hag encountered in the woodland camp.</p></details><details><summary>Illustration · The Fury of the Gods · 68</summary><p><a href="assets/e401e66f94ebea.jpg">Open noncanonical illustration</a></p><p>The black mist at the reopened stone doors.</p></details></noscript>
