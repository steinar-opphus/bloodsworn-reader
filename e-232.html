      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 18</summary><h2>Introduction</h2><p>This woman leads the riders identified by Halja as Raven-Feeders. She has black hair with a raven feather braided in using silver wire, pale sharp features and dark eyes. Her equipment is oil-dark mail, a hip sword, a seax across her lap, another in her boot, an iron helm at her belt and a saddle-mounted shield.</p></details><details><summary>The Hunger of the Gods · 18</summary><h2>Historical record through B02-C018</h2><p>Her initial smile vanishes at the corpses. She runs to one, kneels screaming, then rises in tears and rage. Orka recognises grief but the dead person and relationship are not named. Orka steps out intending to ask about Breca.</p></details><details><summary>The Hunger of the Gods · 18</summary><h2>Appearance</h2><p>Her personal name is not supplied here. Shared affiliation, appearance or travel context does not establish that she is Myrk, Ilska or another known character.</p></details><details><summary>The Hunger of the Gods · 20</summary><h2>Identity resolved in B02-C020</h2><p>On 2026-10-20, the explicit naming in chapter 20 establishes this woman as Myrk Sharp-Claw. Provisional E-232 is merged into canonical E-209; both IDs and the original chapter 18 account are retained. Use Myrk’s page for current knowledge. Earlier summaries retain this historical target without retroactively naming her.</p></details></noscript>
