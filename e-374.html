      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 38</summary><h2>Following the Falinn to Wolfdales</h2><p>Elvar names the wide estuary into which Ulfrir guides the fleet River Falinn; he knows the route but not current river names. Forest cloaks both banks in Jarnvidr. Wave-Jarl sails upstream, adding half an oar crew after half a day as wind falls and currents threaten the banks. Ancient piers and stone bridge lie near Wolfdales’ hill, where the fleet begins mooring. No surveyed length, exact estuary coordinate or map is supplied.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>Arrival at the wolf-god’s hall</h2><p>The Bloodsworn approach along its western bank after mooring, with the den hill to their right and workers clearing the eastern woodland edge. Western piers are full of unloading ships and fortifications are rising near the bridge. No exact bank-distance map or river crossing by this party is supplied.</p></details><details><summary>The Fury of the Gods · 49</summary><h2>The river is crowded with ships of Elvar and newly arrived allies</h2><p>The river is crowded with ships of Elvar and newly arrived allies. Timber gate/towers/palisade guard the stone bridge, with bank ditch and earth-backed wall; new rune channels extend beneath the gateway and along those defences. No river-wide magical barrier or new flow direction is demonstrated.</p></details><details><summary>The Fury of the Gods · 52</summary><h2>The choice to hide the beast</h2><p>The river is filled with splintered fleet timber, masts, oars, prows and half-submerged sails, a half-longship jammed near the bridge, current sweeping wrecks away. Later Broðir and Silrið jump into it and vanish; no individual named hull or final human fate is identified.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>The wreckage yields three repairable but currently unseaworthy hulls: one longship and two knarr</h2><p>The wreckage yields three repairable but currently unseaworthy hulls: one longship and two knarr. Orka/Breca retrieve an unidentified barrel after long searching. This is later salvage knowledge, preserving the earlier initial ruin account without assigning individual ship identities.</p></details><details><summary>The Fury of the Gods · 55</summary><h2>The siege begins at the river</h2><p>The wide river separates the arriving host from Wolfdales’ defended bank, reached by the stone bridge whose far end is gated. Rafts and ladders are planned/begun from forest timber; no new sailing ship or successful crossing is shown.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>Freedom and the approaching army</h2><p>The proposed rafts are now launched in dozens with crude oars and reach the defended bank, where attackers descend the ditch and climb the embankment. This is an actual assault crossing, not a proven final penetration of the wall.</p></details><details><summary>The Fury of the Gods · 57</summary><h2>Fresh raft waves continue carrying warriors/skraeling to the defended bank</h2><p>Fresh raft waves continue carrying warriors/skraeling to the defended bank. A nearby tributary also carries swimming spertus toward the river. Sigrún leads her crew’s two rafts down the bank, but their own launch/crossing is still ahead of the narrated action.</p></details><details><summary>The Fury of the Gods · 58</summary><h2>Holding the gate walkway</h2><p>Spertus now emerge on the defenders’ riverbank and later raft waves land troops, who climb the ditch into a failing embankment defence. The attack has crossed the water and locally breached the wall, without a final siege result.</p></details><details><summary>The Fury of the Gods · 59</summary><h2>Across the wall towards the hall</h2><p>Guðvarr’s raft lands and he wades knee-deep through icy water to the bank, then climbs the ditch/wall. His actual crossing follows the preceding chapters’ preparations; it does not itself make him the cause of the defenders’ retreat.</p></details><details><summary>The Fury of the Gods · 64</summary><h2>The rat-blood climb the cliff</h2><p>Rotta’s crew follows its curve through forest behind Wolfdales’ hill and crosses by raft; the current draws them downstream before a silty-bank landing. Fires later appear along both banks as the main host camps. The chapter provides no mapped exact landing coordinates or successful bridge-gate approach by this crew.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>The roof ward opens</h2><p>Orka sees one of the huge fleet groups sweeping into its estuary and sailing upriver toward Wolfdales. Exact strength, commanding ship and the approach’s final result are not given.</p></details><details><summary>The Fury of the Gods · 74</summary><h2>The fleeing Bloodsworn reach a cliff with the river far below</h2><p>The fleeing Bloodsworn reach a cliff with the river far below. Glornir/Vol jump together, followed by Orka holding Breca; no river impact or landing is yet narrated.</p></details><details><summary>The Fury of the Gods · 76</summary><h2>The jump survivors are swept downriver to a bend where the current deposits them in weeds/shallows</h2><p>The jump survivors are swept downriver to a bend where the current deposits them in weeds/shallows. Orka/Breca and the named companions regroup at its treeline. Bodies and hall debris drift past later, without identifying missing named allies.</p></details><details><summary>Illustration · The Fury of the Gods · 74</summary><p><a href="assets/1ea616eab4309c.jpg">Open noncanonical illustration</a></p><p>Glornir and Vol’s leap, before any landing is shown.</p></details><details><summary>Illustration · The Fury of the Gods · 38</summary><p><a href="assets/282a6b2ace614c.jpg">Open noncanonical illustration</a></p><p>The forest-lined River Falinn.</p></details><details><summary>Illustration · The Fury of the Gods · 57</summary><p><a href="assets/6f5f69946c0541.jpg">Open noncanonical illustration</a></p><p>The spertus crowding the tributary.</p></details><details><summary>Illustration · The Fury of the Gods · 52</summary><p><a href="assets/0db38c882c4a1f.jpg">Open noncanonical illustration</a></p><p>The ruined fleet seen from the intact gate.</p></details><details><summary>Illustration · The Fury of the Gods · 55</summary><p><a href="assets/fe8aa15a09c00e.jpg">Open noncanonical illustration</a></p><p>The defended bank seen by the arriving host.</p></details></noscript>
