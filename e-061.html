      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 5</summary><h2>Introduction</h2><p>Agnar demands the villagers surrender Berak. He says a woman and child accompany Berak.</p></details><details><summary>The Shadow of the Gods · 5</summary><h2>Story and connections</h2><p>Agnar claims Berak is gods-touched. He claims Berak will bring blood and slaughter upon the villagers.</p></details><details><summary>The Shadow of the Gods · 5</summary><h2>Story and connections</h2><p>Hrut denies knowing a Berak living on Iskalt.</p></details><details><summary>The Shadow of the Gods · 7</summary><h2>The troll beside the molten pool</h2><p>Agnar names the fur-clad captive Berak Bjornasson. The captive denies the identification. See the captive’s observed actions.</p></details><details><summary>The Shadow of the Gods · 9</summary><h2>The serpent and the captive family</h2><p>B01-C009 identifies the captive as Berak, resolving the earlier disputed identity. The captured woman is his wife and the boy his son.</p></details><details><summary>The Shadow of the Gods · 9</summary><h2>The serpent and the captive family</h2><p>His chains prevent him diving after his son during the sea-serpent attack.</p></details><details><summary>The Shadow of the Gods · 14</summary><h2>Blood memories at the oath stone</h2><p>Berak’s wife and son are named Uspa and Bjarn in B01-C014.</p></details><details><summary>The Shadow of the Gods · 14</summary><h2>Blood memories at the oath stone</h2><p>He tears himself free of the night-wyrms and frees them.</p></details><details><summary>The Shadow of the Gods · 21</summary><h2>Blood tested and Berak sold</h2><p>In B01-C021, Agnar offers Berak to Störr and says he is wanted by three jarls; the charges remain Agnar’s account. Agnar has warned him about consequences to his wife and child if he causes trouble. Silrið cuts his arm and gives the blood to Hrung, who declares it Berser’s blood. This is Hrung’s identification after an observed test.</p></details><details><summary>The Shadow of the Gods · 21</summary><h2>Blood tested and Berak sold</h2><p>Störr orders him taken. Agnar accepts the offered price, and Silrið takes Berak’s chain and leads him away with two Berserkirs. See the unresolved fate of his family.</p></details><details><summary>The Shadow of the Gods · 29</summary><h2>Uspa recounts their escape</h2><p>Uspa says Berak killed Raven-Feeders and others during their escape.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>Uspa tells Elvar that she and Berak once accepted Ilska’s invitation and travelled with the Raven-Feeders because they were Tainted, before rejecting her course. She explains their attempt to destroy the Graskinna as opposition to what she judged vengeance rather than justice. Her reproach over his later sale adds context and motive to earlier testimony; Berak is not present, newly located or freed.</p></details><details><summary>The Shadow of the Gods · 29</summary><h2>The hidden book and the road ahead</h2><p>Her renewed account confirms the earlier testimony of theft and destruction.</p></details><details><summary>The Hunger of the Gods · 67</summary><h2>Elvar returns to her father&#x27;s hall</h2><p>Elvar directly recognises him alive among Störr&#x27;s iron-collared Berserkir. He looks better than at his capture, but his collar remains and Uspa reacts on seeing him. No reunion or freedom is yet shown.</p></details><details><summary>The Hunger of the Gods · 69</summary><h2>Bargaining for the Berserkir</h2><p>He learns Bjarn is held by Lik-Rifa and asks after him. Störr activates his collar&#x27;s red fire until he falls, then stops it. Still controlled, Berak joins the Berserkir advancing on Elvar; no freedom is secured by her offers.</p></details><details><summary>The Hunger of the Gods · 71</summary><h2>The wolf-god wrecks Störr&#x27;s hall</h2><p>Elvar specifically orders him kept alive. He remains within the collared force until Elvar acquires control and stops it, then reunites in an embrace with Uspa. Reunion does not establish emancipation.</p></details><details><summary>The Fury of the Gods · 23</summary><h2>Hrung’s account and Grend’s secret</h2><p>He escorts the arriving followers, estimates their number at two score or more and stands behind them in mail with a hand on his belt axe. After their departure he stays with Uspa and says he would remain voluntarily if freed. Elvar attributes that to rescuing Bjarn and does not release him or the other thralls. His promise is individual and conditional.</p></details><details><summary>The Fury of the Gods · 38</summary><h2>Following the Falinn to Wolfdales</h2><p>He and a handful of Berserkir land on the ancient Wolfdales pier around Elvar as Gytha’s drengrs search ahead. No new manumission, oath or fight is shown at this landing.</p></details><details><summary>The Fury of the Gods · 40</summary><h2>He guards Elvar at the council and walks beside her afterwards</h2><p>He guards Elvar at the council and walks beside her afterwards. Against Sighvat’s contrast of chosen and thrall duty, he says he would guard her freely because she fights to save his son. This is his stated voluntary loyalty, without collar removal or a new oath.</p></details><details><summary>The Fury of the Gods · 51</summary><h2>Ulfrir’s trust and the roof ward</h2><p>He guards Elvar’s chamber and follows with Sólín, then waits at the trunk when Elvar accepts Ulfrir’s request for privacy. No emancipation, betrayal or knowledge of the later secret words is shown.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>Salvage and a choice about freedom</h2><p>Elvar removes the Berserkir’s collars, naming Berak and Thorguna, and offers a genuine choice to leave or serve voluntarily. Later he follows her as guard and says they are guarding her; Thorguna affirms their oaths freely. No separate magical blood rite is shown for him, and Bjarn remains unrecovered.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>He shadows Elvar, calls her Elvar Chainbreaker and explains that she freed them</h2><p>He shadows Elvar, calls her Elvar Chainbreaker and explains that she freed them. The warbands cheer. He stands behind her front-rank position with Gytha and Sólín; his prediction of everlasting fame remains praise rather than a guaranteed future.</p></details><details><summary>The Fury of the Gods · 63</summary><h2>He accompanies Elvar to the stone doors and inside</h2><p>He accompanies Elvar to the stone doors and inside. No new individual wound or distinct guardian attack is assigned to him.</p></details><details><summary>The Fury of the Gods · 65</summary><h2>Losses and plans after the retreat</h2><p>He reassures Elvar that they will find Bjarn, joins appreciation for freedom and jokes that he would chop off hypothetical Hrung arms if he tried kissing Uspa. No rescue or mutilation is performed; it is banter during her care.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>Leif’s death and the tunnel escape</h2><p>Grend leads a delayed group including Uspa, Berak and Gytha, with Berserkir/drengrs carrying Hrung in sailcloth. Varg alerts Ulfrir, who shelters the party and takes Hrung’s cloth in his jaws to the tunnel entrance; they follow into the passage.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>The survivors’ camp and reunion</h2><p>Gytha and Berak emerge with Elvar’s captains, help Grend/Uspa set Hrung upright and take part in camp after the memorial. The scene confirms their survival without a full wound inventory.</p></details><details><summary>The Fury of the Gods · 87</summary><h2>Biórr returns Bjarn</h2><p>Mail-clad with twin bearded axes and braided beard, he first raises weapons at Biórr/Bjarn, then recognises them and lowers them smiling. After Uspa hugs Bjarn he sweeps wife/son into his arms and spins them; no new paternity revelation or complete battle safety follows.</p></details><details><summary>The Fury of the Gods · 88</summary><h2>Thorkel avenged and the final advance</h2><p>He fights with Glornir and companions defending the flanks of Vol/Uspa’s spell battle, then Orka’s party relieves them. No new complete wound inventory or family separation is shown.</p></details><details><summary>The Fury of the Gods · 90</summary><h2>The last assault on Lik-Rifa</h2><p>He helps carry Hrung in sailcloth with Taras/Sighvat for the throw, then embraces his family in victory. No sole magical/poison authorship is attributed to him.</p></details><details><summary>Illustration · The Fury of the Gods · 87</summary><p><a href="assets/54c50d8382e602.jpg">Open noncanonical illustration</a></p><p>Bjarn’s reunion with his parents.</p></details><details><summary>Illustration · The Fury of the Gods · 75</summary><p><a href="assets/855fc6762a4e54.jpg">Open noncanonical illustration</a></p><p>Ulfrir carrying Hrung’s sailcloth and shielding the delayed party.</p></details></noscript>
