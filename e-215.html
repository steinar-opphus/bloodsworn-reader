      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 9</summary><h2>Introduction</h2><p>Storolf Wartooth welcomes Biórr as “brother” and embraces him. That address is not evidence of biological brotherhood.</p></details><details><summary>The Hunger of the Gods · 9</summary><h2>Story and connections</h2><p>He is a head taller than Biórr and nearly twice as wide, with thickly braided blond hair and beard and a black raven feather in a braid. Some front teeth are missing; the narration links their loss to his biting an enemy’s shield and wrenching it away.</p></details><details><summary>The Hunger of the Gods · 9</summary><h2>Story and connections</h2><p>A meal with Storolf and Red Fain eases Biórr’s unease. Storolf identifies Drekr’s new companions and calls them capable fighters.</p></details><details><summary>The Hunger of the Gods · 14</summary><h2>Crossing Isbrún Bridge</h2><p>The narration identifies him as Red Fain’s son during their exchange about cold and heat. This supplies a family relationship without turning his earlier brotherly address to Biórr into biological kinship.</p></details><details><summary>The Hunger of the Gods · 14</summary><h2>Crossing Isbrún Bridge</h2><p>He helps Fain form the Raven-Feeders’ shield wall as tennúr emerge and leads it towards Lik-Rifa until her command halts the intervention.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>He comments on Biórr’s silence and jokes about Myrk’s earlier southward departure, while Fain asks that Biórr be given time. He joins the acclamation of Lik-Rifa and is sleeping near Biórr at dawn when the runaway is brought back. The joke supplies no return or current sighting of Myrk.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>Nastrandir revealed in the snow</h2><p>He lifts the stuck food barrel for Kráka, his weight sinking a cartwheel into the slush. He eats cheese despite missing teeth and imitates a rooting boar, joking and playing with Kráka and the children. No tusks grow and no transformation, new tooth loss, actual attack or wrestling bout occurs.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>Nastrandir revealed in the snow</h2><p>He says he has Svin in him and assigns Harek the same ancestry. The narration describes him teaching a smaller group of boar-blood children after Lik-Rifa’s lessons. He calls Kalv his brother and anticipates his return as a better teacher, while Fain praises Storolf’s own teaching.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>Nastrandir revealed in the snow</h2><p>Appearance continuity remains unresolved: Fain ruffles his red hair in this chapter, whereas the chapter-9 description explicitly gives him blond hair and beard. Both dated descriptions are preserved; no dye, lighting explanation or identity split is established, and the chapter-9 artwork retains its original scope.</p></details><details><summary>The Hunger of the Gods · 42</summary><h2>Inside Nastrandir&#x27;s great hall</h2><p>He gawps at Nastrandir’s unsettling threshold. Fain nudges him and they step into the dark hall beside Biórr. The scene adds no new hair description, so it does not resolve the earlier blond/red continuity discrepancy.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>At the feast he jokes with a tennúr about the lack of teeth in the food and his own gaps. When the drunken Oleif insults the creature, Storolf insists that a member of Lik-Rifa’s crew is entitled to share the feast. He punches Oleif unconscious after further mockery and silences the man’s companions with a challenge.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>The tennúr gives his name as Tannbursta. Storolf leans beside motionless Oleif; a crack and ripping sound precede his throwing a flesh-streaked tooth to Tannbursta, who grins and crunches it. No death for Oleif or general emancipation follows. The tooth jokes supply no new hair description and leave the earlier blond/red discrepancy unresolved.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>He plays the fallen victim in Biórr’s padded training demonstration, then helps organise and correct the children’s practice. He tells Breca to let go of his implied hostility towards Brák because they are on the same side and predicts the god-blooded children will make good fighters. No actual training death or new hair-colour description occurs.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>Despite the joking he is withdrawn and tearful. He tells Fain of dark dreams about Kalv and says he can no longer feel his brother. Fain shares the worry and embraces him. Biórr interprets the lost kin-sense as probable death, not independently witnessed proof. This does not explicitly identify the brother with the messenger killed in Darl.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>He identifies the arriving frost-spiders and later stands near Biórr, Fain and Ilmur at the war council. The scene does not resolve his earlier blond/red hair discrepancy.</p></details><details><summary>The Hunger of the Gods · 58</summary><h2>Biórr&#x27;s rat senses and a captured message</h2><p>He tends Biórr after the staged blow, supports him physically and defends him against Brák&#x27;s accusation. Biórr conceals that he voluntarily helped Kráka and Bjarn escape.</p></details><details><summary>The Hunger of the Gods · 60</summary><h2>Guðvarr taken into Nastrandir</h2><p>On hearing Kalv is dead, he weeps, shows changing eyes, an enlarged jaw and tusk-like teeth, and threatens Skalk. Fain shares the grief; Guðvarr infers kinship, without a new explicit family identity statement.</p></details><details><summary>The Hunger of the Gods · 62</summary><h2>The army departs for Svelgarth</h2><p>He grieves Kalv as his brother. Biórr encourages vengeance and the end of Tainted servitude, but the political outcome remains an aspiration.</p></details><details><summary>The Hunger of the Gods · 73</summary><h2>Biórr at the siege</h2><p>His grief for Kalv persists. He refuses Tannbursta&#x27;s tooth and wants to join the wall attack, but Fain and Biórr remind him of Rotta&#x27;s guard orders.</p></details><details><summary>The Hunger of the Gods · 75</summary><h2>The rescuers pursued</h2><p>He joins the pursuit, is wounded in the fight with Orka and then charges and tackles her. Rotta approaches them at the chapter end, before their confrontation is resolved.</p></details><details><summary>The Hunger of the Gods · 76</summary><h2>Captives before Rotta</h2><p>The narration explicitly identifies his blood as Svin the boar; tusks, altered jaw and resistant skin are observed. He tends his still-breathing father, then raises an axe over Breca at Rotta&#x27;s command. Spert stings him and he collapses with black veins and swollen black tongue; his final fate is not separately confirmed yet.</p></details><details><summary>The Fury of the Gods · 5</summary><h2>His death is now explicit, after the earlier sting collapse</h2><p>His death is now explicit, after the earlier sting collapse. Ilmur&#x27;s corpse is laid beside him and his father Fain holds his dead hand in grief. Biórr urges Fain to keep fighting so their sacrifice will mean something; that is Biórr&#x27;s argument, not a confirmed consequence.</p></details><details><summary>Illustration · The Hunger of the Gods · 9</summary><p><a href="assets/2bcdeb76840a32.jpg">Open noncanonical illustration</a></p><p>Storolf Wartooth welcoming Biórr back to the camp.</p></details></noscript>
