      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 4</summary><h2>Introduction</h2><p>The woman watching Varg’s trial has silver-grey hair. A white scar runs through a ruined eye. Two wolfhounds are at her feet.</p></details><details><summary>The Shadow of the Gods · 4</summary><h2>Appearance</h2><p>Her hair is knotted like rope; she is lean-muscled, with deep lines around her eyes and mouth. Varg thinks she looks too old to be a warrior, without establishing her age.</p></details><details><summary>The Shadow of the Gods · 4</summary><h2>Story and connections</h2><p>At the trial she wears a brynja and holds a spear, with an axe and seax at her belt. She bites into an apple while watching, then smiles at Varg, who finds no comfort in it.</p></details><details><summary>The Shadow of the Gods · 4</summary><h2>Story and connections</h2><p>She later appears at Varg’s camp with two wolfhounds. The hounds drag one of the pursuers to the ground.</p></details><details><summary>The Shadow of the Gods · 13</summary><h2>A feast interrupted</h2><p>Torvik identifies Edel as the scoutmaster in B01-C013. He says he scouts under her.</p></details><details><summary>The Shadow of the Gods · 13</summary><h2>A feast interrupted</h2><p>The narrator identifies Edel as scoutmaster in B01-C016, confirming Torvik’s earlier identification.</p></details><details><summary>The Shadow of the Gods · 18</summary><h2>New weapons and an attack at the docks</h2><p>During the dockside battle in B01-C018, Edel and her hounds bring down a horse.</p></details><details><summary>The Shadow of the Gods · 30</summary><h2>An abandoned farm and a march inland</h2><p>Edel gives her wolfhounds halves of a tunic to sniff. Edel leads Torvik and the other scouts north through the fields, with the rest following.</p></details><details><summary>The Shadow of the Gods · 47</summary><h2>The Bloodsworn reveal their ancestry</h2><p>She reveals Hundur ancestry and says she recognised wolf blood in Varg at his Liga trial. She explains the Bloodsworn’s secrecy as protection against persecution and a means of establishing trust.</p></details><details><summary>The Shadow of the Gods · 53</summary><h2>The Bloodsworn reach the ruined fortress</h2><p>While tracking Skalk she tells Varg he has the makings of a fine scout, recalling Torvik’s favourable assessment.</p></details><details><summary>The Hunger of the Gods · 7</summary><h2>An offer to return to the Bloodsworn</h2><p>Glornir sends her back towards the Sea-Wolf and assigns her to guide Orka to the mine on her route. She forms a separate party with nine companions, most on foot, two mounted and a provision-laden horse. With her spear and two wolfhounds, she starts towards Grimholt’s gates.</p></details><details><summary>The Hunger of the Gods · 10</summary><h2>The night-hag in the woodland camp</h2><p>Her hounds alert the camp, and she and the escort gather protectively around Orka and Lif after the attack. She rebukes Lif for sleeping on watch, says the hags’ liking for slow deaths saved them, and gives Ingmar the next watch.</p></details><details><summary>The Hunger of the Gods · 10</summary><h2>The night-hag in the woodland camp</h2><p>Her ruined eye is described more precisely as a sunken, puckered hole crossed by a scar, with one good eye remaining. This is a newly supplied detail of the established injury, not a new injury occurring here.</p></details><details><summary>The Hunger of the Gods · 10</summary><h2>The night-hag in the woodland camp</h2><p>While tending porridge she calls Lif a burden and questions what he knows about the Bloodsworn. She and Orka reason that he may deduce the company’s secret. Her suggestion that the hag might better have taken him prompts Orka’s declaration of protection.</p></details><details><summary>The Hunger of the Gods · 10</summary><h2>The night-hag in the woodland camp</h2><p>She challenges Orka’s readiness to defend an untouched man despite having abandoned her blood-sealed oath to the company. Their exchange ends without a complete reconciliation.</p></details><details><summary>The Hunger of the Gods · 18</summary><h2>Training and an encounter in the rain</h2><p>She must leave soon to bring the Sea-Wolf to Darl for Glornir. She says she could get used to Orka’s return, wishes her success finding Breca and avenging Thorkel, and admits a soft spot for him. This is a warmer exchange, not a completed return to the company.</p></details><details><summary>The Hunger of the Gods · 18</summary><h2>Training and an encounter in the rain</h2><p>Her persistent shield advice prompts Orka to train Lif with one. She leaves with the hounds to catch salmon, agreeing to wake Spert at the lake for porridge.</p></details><details><summary>The Hunger of the Gods · 20</summary><h2>Myrk confronted in the glade</h2><p>After the mine battle she stands over a dead warrior and rebukes Orka for what has happened during her short absence. Her hounds stand beside her, red-mawed and panting.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>Wounds tended and seaxes compared</h2><p>She is the only Bloodsworn described as unwounded after the battle and searches the dead warriors’ kit. When Orka beats Myrk, she helps Halja and Revna restrain her.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>Wounds tended and seaxes compared</h2><p>She saw the riders come from the north-west along the Bonebacks. She suggests following that path towards Lake Horndal and Starl, while explicitly not knowing if that was their origin. She cannot accompany Orka because of the Sea-Wolf’s needs, though she says she would if she could; Orka sees tears in her eye.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>Wounds tended and seaxes compared</h2><p>As current crew chief, she authorises Halja, Gunnar and Revna to accompany Orka. She fears a connection between the Raven-Feeders, dragon-born, dreams of Lik-Rifa and Breca, but identifies this as her own sense of events. She tells Orka that deserving has nothing to do with the help offered.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>She meets Glornir at Liga, saying the Sea-Wolf has only just docked and that she has not seen Jaromir. She learns from him that Jaromir has Vol. Later she reports Gunnar, Revna and Halja alive with Orka, with a leg scar expected for Gunnar.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>Her account of the Raven-Feeders at Rotta’s chamber identifies the man Varg struck with his cleaver as Ilska and Myrk’s father. She relays Myrk’s claim that Ilska has Lik-Rifa’s company and considers it useful for Bloodsworn to accompany Orka, noting Halja’s desire for vengeance. These are the reports she brings to Liga, not knowledge of Orka’s current Starl events.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>After the boarding fight she stabs a body pinned by her two hounds. She and the hounds join the landing party and later leave the pool glade on Glornir’s order to search for remaining tongue-eaters. No completed all-clear or individual new injury is reported.</p></details><details><summary>The Hunger of the Gods · 59</summary><h2>New looks on the journey through Ulaz</h2><p>She returns with Sulich and her two hounds, reports Valdai as Jaromir&#x27;s destination and describes unusual traffic and controlled eastern-harbour access in Ulaz. Their reconnaissance does not establish why it is restricted.</p></details><details><summary>The Hunger of the Gods · 63</summary><h2>A shortcut through the mountains</h2><p>She chooses Varg and Røkia as fellow scouts, with Sulich as guide and her hounds alongside. Glornir later sends her along Jaromir&#x27;s road to provide warning.</p></details><details><summary>The Hunger of the Gods · 70</summary><h2>The pursuit into Valdai</h2><p>One hound collapses under arrows during the pursuit, without a separately confirmed fate here. She climbs into Valdai and later spears a warrior trying to take the thrown Vol.</p></details><details><summary>The Fury of the Gods · 1</summary><h2>She weeps beside the stone barrows at Valdai</h2><p>She weeps beside the stone barrows at Valdai. One of her hounds has been buried with the fallen Bloodsworn, while her surviving hound lies across the stones.</p></details><details><summary>The Fury of the Gods · 21</summary><h2>Reunion in the island harbour</h2><p>She brings the rolled parchments to Vol and says Orka and Gunnar found them in Rotta’s chamber and entrusted them to her. Vol identifies copied Raudskinna fragments and thanks her. The transfer concerns copies, not the intact original or every other Galdrabok.</p></details><details><summary>The Fury of the Gods · 27</summary><h2>She joins the counterboarding wall with her hound and returns first to Sea-Wolf when Glornir calls</h2><p>She joins the counterboarding wall with her hound and returns first to Sea-Wolf when Glornir calls. Later she puts her shield before the wounded Glornir, intercepting arrows while Røkia, Varg and Æsa charge the druzhina.</p></details><details><summary>The Fury of the Gods · 29</summary><h2>She fights near Varg aboard the stern drakkar and returns when Vol screams</h2><p>She fights near Varg aboard the stern drakkar and returns when Vol screams. She is among those too far from the wounded Svik to stop the descending sabre, before Orka reaches him. The two casters’ later strike scatters the company in heat and steam.</p></details><details><summary>The Fury of the Gods · 32</summary><h2>She greets Orka and Breca with her hound and initially thinks her escort has returned</h2><p>She greets Orka and Breca with her hound and initially thinks her escort has returned. Orka introduces Sæunn as a friend; Gunnar reports Revna’s death and burial beside the rescue lake. Edel asks Lif how he survived and endorses his battered shield as a friend in battle; Halja confirms his skill.</p></details><details><summary>The Fury of the Gods · 37</summary><h2>Life aboard Sea-Wolf</h2><p>She steps forward to vouch for Varg at the shore ceremony before Glornir’s final assent, joining the company’s acceptance of him as kin through the completed rite.</p></details><details><summary>The Fury of the Gods · 73</summary><h2>She spears a troll in the lower back before Einar kills it</h2><p>She spears a troll in the lower back before Einar kills it. Later she fights Brák’s crew and is cut off from Einar/Svik by the arriving golden-eye warriors.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>Leif’s death and the tunnel escape</h2><p>She mourns Einar while her hound licks his hand and identifies Snaka’s presence, saying she hears him in her soul. This is a direct present perception, not a new measured rule for every listener.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>The survivors’ camp and reunion</h2><p>Edel and Æsa emerge with Røkia/Svik and a little over a score Bloodsworn protecting Refna/the children. Their group later welcomes Glornir’s survivors into the same woodland camp.</p></details><details><summary>The Fury of the Gods · 81</summary><h2>The charge against the gods</h2><p>Her hound knocks a shielded warrior down and she finishes him with a spear while helping clear Yrsa’s defenders alongside Svik/Æsa. The hound remains unnamed here.</p></details><details><summary>The Fury of the Gods · 84</summary><h2>Edel and Æsa help Røkia/Svik tear through Brák’s hunters while Varg reaches Taras</h2><p>Edel and Æsa help Røkia/Svik tear through Brák’s hunters while Varg reaches Taras. They remain with the companions around the confrontation, without a separately named new wound/final kill count.</p></details><details><summary>The Fury of the Gods · 89</summary><h2>Her hound charges Heðin and she plants spear/cuts ankle and knee as the companions circle him</h2><p>Her hound charges Heðin and she plants spear/cuts ankle and knee as the companions circle him. The hound harrying and the group’s attacks help bring him down; the kill is collective. Her hound is still unnamed.</p></details><details><summary>The Fury of the Gods · 92</summary><h2>A home for the Bloodsworn</h2><p>She voices relief at no longer hiding their nature or fearing thrall-collars, then names Rotta as unfinished business. Her hound receives salted cod beside the gathering; it remains unnamed.</p></details><details><summary>Illustration · The Shadow of the Gods · 13</summary><p><a href="assets/2f61e35a4b4e0f.jpg">Open noncanonical illustration</a></p><p>Edel as described at Varg&#x27;s weapons trial, with her ruined eye and wolfhounds.</p></details><details><summary>Illustration · The Fury of the Gods · 27</summary><p><a href="assets/7503b665cb5245.jpg">Open noncanonical illustration</a></p><p>Edel shielding Glornir during the boarding battle.</p></details></noscript>
