      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 8</summary><h2>Oaths at the family steading</h2><p>Spert demands a blood oath, saying blood is binding.</p></details><details><summary>The Shadow of the Gods · 8</summary><h2>Oaths at the family steading</h2><p>Vesli cuts her palm and swears on her life-blood to be faithful to Breca and his guardian.</p></details><details><summary>The Shadow of the Gods · 8</summary><h2>Oaths at the family steading</h2><p>Thorkel says she owes Breca a blood-debt if she survives.</p></details><details><summary>The Shadow of the Gods · 19</summary><h2>Burial and a vow of vengeance</h2><p>In B01-C019, Orka tells Vesli and Spert they are free of their oaths, saying both have earned their freedom. This records her release declaration without establishing a universal mechanism for ending blood oaths.</p></details><details><summary>The Shadow of the Gods · 29</summary><h2>The hidden book and the road ahead</h2><p>Kráka describes the blóð svarið as a binding made with blood, runes and words of power, with death for breaking it. Uspa claims breaking the oath before death makes the oathbreaker&#x27;s blood boil. Uspa carves four runes into a chopping board and identifies them as life, death, blood oath and torment. Uspa, Elvar, Grend, Agnar, Sighvat and Kráka mingle blood over the carved runes. The ritual blood rises, forms runes in the air and merges into a hot cord binding the participants&#x27; hands and wrists.</p></details><details><summary>The Shadow of the Gods · 32</summary><h2>The promise of Oskutreð</h2><p>Agnar publicly promises to recover Uspa&#x27;s son or die trying. Agnar tells even the unmarked crew they are bound by the oath if they follow him; no new magical binding is demonstrated.</p></details><details><summary>The Hunger of the Gods · 2</summary><h2>A burial and a surviving gaoler</h2><p>After Agnar&#x27;s burial, Elvar&#x27;s oath scars burn when she considers abandonment and cool when she recommits; Sighvat experiences a similar punishment. Uspa says thoughts alone can break the binding and that she cannot stop it alive or dead. These broader mechanics remain her explanation, distinguished from the observed reactions.</p></details><details><summary>The Hunger of the Gods · 4</summary><h2>The descent beneath Oskutreð</h2><p>Skuld says she and her sisters were bound by an oath to their father to keep Lik-Rifa confined. She compares her collar and Elvar&#x27;s blood oath as forms of bondage; this comparison is her judgement, not an identical mechanism.</p></details><details><summary>The Hunger of the Gods · 6</summary><h2>The swarm in the depths</h2><p>Elvar says the four oath-takers must attempt Bjarn’s recovery but gives the other Battle-Grim leave to depart. For the added undertaking of trying to free Berak, Uspa accepts Elvar’s word and Grend’s assent rather than another blood oath.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>Orka cuts the heel of her palm with a seax and swears on her son’s life to keep Myrk alive until she finds him, then release her for holmganga. She explicitly seals the promise with blood and Myrk accepts the exchange. The visible ritual is recorded without asserting magical compulsion or completed fulfilment.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>Uspa, Elvar, Sighvat and Grend show coiled white scars around wrist and forearm during the Starl meeting. Uspa cites the oath to recover Bjarn when refusing to leave, while praising Elvar’s plan. No new oath is performed.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>After Elvar challenges Myrk’s directions, Orka imagines killing her but stops because she still needs her knowledge to find Breca. Her blood-sealed promise remains unfulfilled: neither Myrk’s death, release nor the promised holmganga occurs, and no magical enforcement is demonstrated. The agreement to exchange favours with Elvar is verbal reciprocity rather than another blood oath.</p></details><details><summary>The Fury of the Gods · 38</summary><h2>Following the Falinn to Wolfdales</h2><p>Elvar describes the blood oath as knowing thoughts and disallowing even thinking betrayal, contrasting a collar’s ban on committing acts. This is her account of the mechanism while defending trust in Ulfrir, without a new attempted thought-betrayal test or activated punishment.</p></details><details><summary>The Fury of the Gods · 40</summary><h2>Councils and secrets in Wolfdales</h2><p>Grend says he swore an earlier protective blood oath to Elvar’s mother after her birth, shows its pale scar and explains hiding Tainted blood as necessary to avoid Störr’s control. Elvar remembers a matching scar on her mother. The scene adds their account/scars, not a new oath or detected thought punishment.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>Salvage and a choice about freedom</h2><p>Ulfrir voluntarily swears equal justice/protection and no unjust blood-power, invoking death/torment for breach. Uspa officiates using four runes carved in the chair and their mixed blood; the wind and rising strand visibly leave a raw spiral scar. His collar is then removed. Ordinary offered/affirmed service oaths of freed guards remain distinct from this magical rite, and no breach punishment is tested here.</p></details><details><summary>The Fury of the Gods · 65</summary><h2>Losses and plans after the retreat</h2><p>Elvar now explicitly feels white coiled ridges of her own forearm blóð svarið scars beneath her tunic. Ulfrir traces his arm scar and speaks of ongoing fair treatment/justice obligations. These are current marks and acknowledgment, not a new performed oath, punishment test or proof of worldwide legal enforcement.</p></details><details><summary>The Fury of the Gods · 68</summary><h2>Elvar’s white-coiled forearm scar is visible on the fallen body when Glornir identifies her</h2><p>Elvar’s white-coiled forearm scar is visible on the fallen body when Glornir identifies her. This recognition/death does not itself show how the earlier justice oath transfers, ends or affects Ulfrir, and no such consequence is assumed.</p></details><details><summary>Illustration · The Fury of the Gods · 54</summary><p><a href="assets/7ac9be53d16b41.jpg">Open noncanonical illustration</a></p><p>Noncanonical detail of the four carvings prepared for the oath; the glyph shapes are artistic.</p></details></noscript>
