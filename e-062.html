      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 5</summary><h2>Introduction</h2><p>Agnar calls the chained man his Hundur-thrall. He says the man has Berak’s scent.</p></details><details><summary>The Shadow of the Gods · 5</summary><h2>Story and connections</h2><p>Red veins ripple through the collar after Agnar says Hlýða. The thrall sniffs a blood-crusted rag.</p></details><details><summary>The Shadow of the Gods · 5</summary><h2>Story and connections</h2><p>He sniffs a cot and nods when Sighvat asks if it is him.</p></details><details><summary>The Shadow of the Gods · 44</summary><h2>On the road through the Dark-of-Moon Hills</h2><p>Biórr identifies the previously unnamed Hundur-thrall as Ilmur in chapter 44.</p></details><details><summary>The Shadow of the Gods · 52</summary><h2>Betrayal and the dragon&#x27;s release</h2><p>Biórr removes his collar after killing Agnar. Ilmur throws it away.</p></details><details><summary>The Hunger of the Gods · 5</summary><h2>A welcome among the Raven-Feeders</h2><p>Ilmur is without his collar, with scars around his neck. He wears a tattered sealskin cloak and has lank hair and sunken eyes. Kráka says they have been given food and warm clothing.</p></details><details><summary>The Hunger of the Gods · 5</summary><h2>A welcome among the Raven-Feeders</h2><p>He touches the scars while saying they are free; nearby, he nods and grins, although his bearing still gives the impression of a kicked dog. His hair was already described as long and lank at his first appearance.</p></details><details><summary>The Hunger of the Gods · 14</summary><h2>Crossing Isbrún Bridge</h2><p>Walking at Biórr’s heel on the bridge crossing, he thanks him for saving him from Agnar’s collar. He says he is happy with a kind word and hot meal, while Biórr reassures him that he is free and safe. That reassurance is Biórr’s promise, not a guarantee against future danger.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>He helps Kráka organise the entranced children at the evening camp. At dawn he returns with the runaway’s captor, smiling and saying his first job was tracking a runaway. Biórr finds his eagerness subservient, as if the Raven-Feeders were new masters; this does not establish a new collar or formal ownership.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>The child brought back is later named Breca Thorkelsson, and the other man names himself Brák Trolls-Bane. Ilmur’s report does not explain his tracking method or establish that Breca has been released.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>He sits at another fire with Brák, Drekr and others. Biórr worries that their company will not provide the kindness he thinks the long-enslaved Ilmur needs. The observation and concern do not establish a new collar, legal owner, oath or unreported violent act.</p></details><details><summary>The Hunger of the Gods · 73</summary><h2>Biórr at the siege</h2><p>He spends time with Fain and Storolf at the rearguard fire and says he would rather stay with them and Biórr than Brák. He calls Brák cruel and his scent wrong, while denying Brák has hurt him. This does not identify a hidden creature or power.</p></details><details><summary>The Hunger of the Gods · 75</summary><h2>The rescuers pursued</h2><p>With hound speed and sharp teeth, he runs ahead of Biórr to catch the rescuers. Revna blocks his spear and cuts his neck; he collapses bleeding. No separate final death confirmation is supplied here.</p></details><details><summary>The Fury of the Gods · 5</summary><h2>His death is now explicit: Biórr and Skaga carry his corpse to lie beside Storolf</h2><p>His death is now explicit: Biórr and Skaga carry his corpse to lie beside Storolf. This resolves the uncertainty retained after the earlier neck wound; the historical chapter-75 account remains unchanged.</p></details><details><summary>Illustration · The Hunger of the Gods · 5</summary><p><a href="assets/59bb97339c4063.jpg">Open noncanonical illustration</a></p><p>Ilmur touches his scarred neck in camp after the removal of his collar.</p></details></noscript>
