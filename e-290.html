      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>This giant rises from an algae-covered pool near the unnamed island settlement. It is taller and wider than Einar and larger than a bear, a green muscular body slick with mucus and dark veins, small black eyes, many rows of sharp teeth and a thrashing tongue. Its role in the species’ lifecycle is not supplied.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>It swallows an unnamed druzhina whole before Æsa is brought towards it. In the rescue fight it coils round Einar, throws him into a tree and hurls Varg into the pool despite cleaver and spear wounds. Glornir kills it with his axe in its head. Einar survives unconscious with severe injuries; Æsa has a thigh spear wound.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>A surviving captive says the creature infected some victims by filling mouths and noses with slime while swallowing others. This procedure is his report; no queen, parent role, cure or reproductive process is established.</p></details><details><summary>Illustration · The Hunger of the Gods · 53</summary><p><a href="assets/9096661250926d.jpg">Open noncanonical illustration</a></p><p>The giant tungumatur at the island pool, with the surrounding people omitted.</p></details></noscript>
