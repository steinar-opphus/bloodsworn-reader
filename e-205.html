      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 4</summary><h2>The descent beneath Oskutreð</h2><p>Beneath Oskutreð the company sees pallid luminous figures, some bearing wounds or illness, walking with bowed heads in one direction. Uspa calls this the soul road. They pass through the Corpse-Gate.</p></details><details><summary>The Hunger of the Gods · 4</summary><h2>The descent beneath Oskutreð</h2><p>Some figures wear mail and helmets and drag weapons; others limp or stumble in torn tunics. Some are missing limbs or appear emaciated by illness.</p></details><details><summary>The Hunger of the Gods · 4</summary><h2>The descent beneath Oskutreð</h2><p>Skuld says Lik-Rifa learned to feed on souls that did not resist. She says they travel to halls of the dead but admits she does not know where or what those halls are.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>Skuld says Orna found the road and used Lik-Rifa’s fascination with life and death to lure her into Oskutreð. This is a reported role in the ancient imprisonment, not a new present crossing or an assertion that Orna created the road.</p></details><details><summary>Illustration · The Hunger of the Gods · 4</summary><p><a href="assets/3d79c8be26e1f7.jpg">Open noncanonical illustration</a></p><p>A luminous procession passes through the Corpse-Gate in Vergelmir.</p></details></noscript>
