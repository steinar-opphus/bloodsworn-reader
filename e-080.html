      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 8</summary><h2>Introduction</h2><p>Guðvarr addresses the drengr woman as Arild.</p></details><details><summary>The Shadow of the Gods · 8</summary><h2>Story and connections</h2><p>She tells the family that residents of Sigrún’s realm must attend the Althing or find somewhere else to live.</p></details><details><summary>The Hunger of the Gods · 12</summary><h2>Rowing away from Grimholt</h2><p>On the crowded snekke she offers Guðvarr dark bread and goats’ cheese, which he eventually accepts. His belief in her uncritical admiration is his own assessment.</p></details><details><summary>The Hunger of the Gods · 12</summary><h2>Rowing away from Grimholt</h2><p>After he claims the wounded drengr is dead, she helps lift the man by his ankles onto the rail. Guðvarr then throws him overboard. The text does not establish what Arild knew of the man’s remaining signs of life.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>The fugitives reach Darl</h2><p>At Darl Skalk includes her and Guðvarr’s other companions in the group ordered to the tower, exempting Guðvarr. He reassures her and she nods trustingly, while his private thoughts prioritise himself. No later treatment of the tower-bound group is shown.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>The assault on the workroom</h2><p>Guðvarr explicitly identifies her dead body among the contents of a broken barrel in the ruined workroom. It has been broken and folded to fit. His shock gives way to relief at having avoided that fate. The chapter establishes her death but does not identify the exact time, killer or procedure that caused it.</p></details><details><summary>The Hunger of the Gods · 41</summary><h2>Sigrún&#x27;s reckoning with Guðvarr</h2><p>Sigrún now attributes Arild’s death and those of other drengrs to Skalk, treating his conduct as a sign of presumed impunity. This adds an attributed killer claim to the earlier direct discovery of Arild’s corpse; it does not show the killing, establish its procedure or identify every other dead drengr.</p></details></noscript>
