      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 2</summary><h2>Introduction</h2><p>Svik identifies the tattooed woman at the trial as Vol in B01-C002. Varg identifies her as the Seiðr-witch.</p></details><details><summary>The Shadow of the Gods · 2</summary><h2>Appearance</h2><p>She has raven-black hair. Blue tattoos run across her lower jaw and throat. When Varg sees her, she wears an iron collar.</p></details><details><summary>The Shadow of the Gods · 2</summary><h2>Story and connections</h2><p>The stew trader says the Bloodsworn have a Seiðr-witch thrall. Svik says Vol uses her talents only for the Bloodsworn. He refuses to hire her out. He says even a request from Queen Helka would be refused.</p></details><details><summary>The Shadow of the Gods · 4</summary><h2>The trial and the pursuing riders</h2><p>In B01-C004 the narrator refers to Vol as a Seiðr-witch. She has dark eyes.</p></details><details><summary>The Shadow of the Gods · 13</summary><h2>A feast interrupted</h2><p>Vol is present at the feast at the high table, wearing her thrall collar.</p></details><details><summary>The Shadow of the Gods · 16</summary><h2>Training and the price of an akáll</h2><p>Vol speaks softly, and Varg sees confidence and dignity in her manner. She describes the akáll as reliving the last moments of a life and says it is no simple task. Glornir interrupts while she begins explaining what is needed; no invocation is performed in B01-C016.</p></details><details><summary>The Shadow of the Gods · 20</summary><h2>The queen&#x27;s orders</h2><p>On the Sea-Wolf’s departure in B01-C020, Vol takes position at the prow with a hand against it, while Glornir goes to the stern steering oar. No magical action is established by this placement.</p></details><details><summary>The Shadow of the Gods · 26</summary><h2>Oar-dance and weapons practice</h2><p>Vol questions how vaesen could have crossed the Bonebacks past the Grimholt and its guard tower.</p></details><details><summary>The Shadow of the Gods · 34</summary><h2>Cheese, companionship and a troll tale</h2><p>Vol worries that an unnamed woman should already have reached them. Vol wants to search for that woman rather than continue with Skalk.</p></details><details><summary>The Shadow of the Gods · 43</summary><h2>The battle beneath the cliff</h2><p>Vol cuts her hand and traces a rune in blood and flame above the wounded Glornir, stopping the bone sword partway through it. She sustains it with a raised palm and continuing speech despite pain. The swordsman&#x27;s answering words break the rune and throw her into Glornir.</p></details><details><summary>The Shadow of the Gods · 45</summary><h2>Waking among the wounded</h2><p>She heals Varg’s pain and names her missing sister as Uspa. She tells Varg that an akáll needs a link to Frøya, but reserves the decision to Glornir. Skalk knocks her unconscious and has Yrsa carry her away, declaring that he intends to enslave her.</p></details><details><summary>The Shadow of the Gods · 47</summary><h2>The Bloodsworn reveal their ancestry</h2><p>Chapter 47 corrects the earlier public account of her status: Svik says she is not a thrall, and Glornir explicitly names her as his wife. Her earlier collar and the trader’s statement remain historical observations and testimony, rather than proof of actual enslavement.</p></details><details><summary>The Hunger of the Gods · 12</summary><h2>Rowing away from Grimholt</h2><p>She is confirmed aboard Skalk’s snekke, with wrists and ankles bound and an iron collar. Guðvarr first sees her stir after four days on the river; this does not establish what occurred outside his observation. Yrsa removes the gag and forces her to drink, then offers food.</p></details><details><summary>The Hunger of the Gods · 12</summary><h2>Rowing away from Grimholt</h2><p>She offers Skalk a chance to escape the Bloodsworn’s pursuit by releasing her, and insists Glornir will find him even in Darl. Skalk calls her a replaceable thrall and disparages Glornir; those claims do not overturn her previously revealed status.</p></details><details><summary>The Hunger of the Gods · 12</summary><h2>Rowing away from Grimholt</h2><p>She judges Skalk’s power diminished and asks about his missing staff. He threatens a collar of his own crafting that will make her permanently his thrall; Guðvarr notices fear before she calls Skalk brave or foolish. Yrsa strikes and re-gags her. The threatened collar is not yet fitted.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>The fugitives reach Darl</h2><p>She is brought bound before Helka at Darl. Jaromir recognises her and asks after the Bloodsworn. When Skalk accuses them of betrayal she protests through her bonds and Yrsa strikes her to her knees. Skalk calls her Glornir’s thrall and says she will be useful; this hostile characterisation does not overturn her earlier revealed status. No replacement collar is fitted here.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>Secrets in the Galdur tower</h2><p>She is directly shown alive in a tower cell, iron-shackled on a cot, mottled with bruises, one eye swollen shut and a bloody forehead gash. Her lips have been stitched together with blood-caked linen; swollen punctures leak pus. Skalk says she has caused trouble. She staggers up glaring, and apprentices drag her by her chains to the workroom.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>Secrets in the Galdur tower</h2><p>Yrsa chains her to the restraint table. Skalk tells her he intends to carve a staff from the captured Froa, then replace her collar with his own and have the stitches cut. No staff, replacement or removal of stitches is completed here. Guðvarr interprets sadness in her watching eyes when Skalk turns on him.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>The assault on the workroom</h2><p>She remains shackled beside Guðvarr at the start of the attack and is still attached when the table splinters above the fissure. Iva rapidly rusts an iron restraint, letting her fall free of the table and hauling her upright. The source names the touched object a table ring and then calls the crumbling iron a collar; removal of Vol’s enchanted neck collar is therefore not assumed here.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>The assault on the workroom</h2><p>Her lips remain stitched, which Jaromir notices and approves. Iva lifts her over his saddle and he departs with her. This is a transfer into Jaromir’s custody, not a Bloodsworn rescue or voluntary departure. Skalk’s planned new collar has not been fitted.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>The Bloodsworn search the tower without finding her and follow Glornir’s guess about Skalk into Helka’s fortress. Hakon says she predicted Glornir’s pursuit but professes not to know where she or Skalk is. These are search results and testimony, not a new sighting of Vol or a rescue; her last directly shown departure remains with Jaromir.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>Guðvarr tells the hall he witnessed Jaromir carrying her away over his saddle with the chest. This brings the Bloodsworn direct testimony of her departure. Skalk likewise says she is gone and describes Jaromir’s powerful allies.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>Glornir agrees to pursue Jaromir under Helka’s commission, with her recovery as his incentive. The agreement does not recover her or reveal a new location after her earlier departure.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>In Orka’s separate viewpoint, Myrk names Uspa as the Battle-Grim’s captive witch and Orka recognises her as Vol’s sister. This confirms the earlier reported family connection within Orka’s thoughts; Vol is not present or newly located and learns nothing in this scene.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>At Liga Glornir tells Edel Jaromir has her, learns the prince has already sailed and obtains help provisioning the Sea-Wolf. The ship casts off for Iskidan after his report of Jaromir’s fleet and head start. Vol is not directly seen, her present condition is not supplied and no rescue occurs.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>Halja tells Uspa Skalk abducted Vol with the talon and writings, says Glornir is pursuing him and guesses he has probably caught up. Uspa becomes pale and worried. This dates the news received by her sister; it neither reports the reader-known later Jaromir captivity nor establishes a new sighting or recovery of Vol.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>A captured druzhina recognises Glornir’s search and says Jaromir has his woman, then gives Valdai as their destination. He says his own horse-knarr became separated from the prince’s drakkar in mist. Vol is not directly seen; her physical condition, current precise position and recovery remain unknown.</p></details><details><summary>The Hunger of the Gods · 59</summary><h2>New looks on the journey through Ulaz</h2><p>Sulich reports her travelling chained with Jaromir, beaten and with stitched lips, identifying her from witnesses&#x27; description. Valdai is the reported destination; this is intelligence gathered in Ulaz rather than a direct new sighting by the company.</p></details><details><summary>The Hunger of the Gods · 66</summary><h2>Sulich&#x27;s lineage and the ambush</h2><p>Her presence and condition are directly confirmed: iron-shackled wrists, patch-shaved hair, bruised and bloodied face and neck, stitched swollen lips. Her gaze sharpens when it finds Glornir. The chapter does not yet show release or healing.</p></details><details><summary>The Hunger of the Gods · 68</summary><h2>The cavalry charge and the shield wall</h2><p>She remains tied in the saddle while Jaromir leads her horse out through the battle. The local Bloodsworn victory does not release her.</p></details><details><summary>The Hunger of the Gods · 70</summary><h2>The pursuit into Valdai</h2><p>She headbutts Jaromir during his hostage threat and is thrown clear through Ingmar&#x27;s intervention. Glornir finds her alive and removes her lip stitches. She burns off her manacles, incinerates arrows, forces doors and kills Jaromir with flying splinters. Her freedom is directly demonstrated, though weakness remains and no universal collar cure is shown.</p></details><details><summary>The Fury of the Gods · 1</summary><h2>After the battle at Valdai</h2><p>Thin, bruised and marked by the stitching around her swollen lips, she crosses Valdai with Glornir&#x27;s support. She agrees to perform Varg&#x27;s akáll that night. Believing Iva and Taras to have been compelled servants, she removes their collars with keys recovered from Jaromir, cuts their ropes and offers them recovery as free people. Both promise never to stand against the company.</p></details><details><summary>The Fury of the Gods · 6</summary><h2>Warnings and the search for Frøya</h2><p>After Vesli&#x27;s delayed report that Uspa is with Elvar and her son Bjarn has been taken, she reacts in alarm. Later she performs Varg&#x27;s promised akáll, lighting sconces with Logi, drawing sixteen blood lines and end-runes around a torch, invoking Frøya and burning her hair. She explains that Varg is seeing, hearing and feeling through his sister&#x27;s experience; the vision depicts her death.</p></details><details><summary>The Fury of the Gods · 21</summary><h2>She calls Taras a friend when Einar disputes his seat, enabling their friendly introductions</h2><p>She calls Taras a friend when Einar disputes his seat, enabling their friendly introductions. Later Edel gives her the copied runes collected by Orka and Gunnar from Rotta’s chamber. She identifies Raudskinna fragments and calls their spells powerful and terrifying, preferring their possession to Ilska’s dragon-born. She goes to consult Iva, but no ensuing conversation or spell use is shown.</p></details><details><summary>The Fury of the Gods · 25</summary><h2>Preparing to meet the pursuing ships</h2><p>With Iva she sings as the sea serpent rises, which Svik attributes to their summoning; the collared enemy’s song precedes its dive. She then chants from Sea-Wolf’s prow with Iva on the knarr. Their ice circles and projectiles freeze the enemy’s red ward and sea, leading to the first drakkar’s destruction. Exact spell words and an unlimited control law are not supplied.</p></details><details><summary>The Fury of the Gods · 27</summary><h2>He contests the four attackers’ rune-wielders from Sea-Wolf while Iva works on the knarr</h2><p>He contests the four attackers’ rune-wielders from Sea-Wolf while Iva works on the knarr. The caster from the cleared drakkar boards near the prow and fights him with a druzhina escort. Both defending casters look drained to Varg as combat continues; no magical defeat or recovery is confirmed.</p></details><details><summary>The Fury of the Gods · 28</summary><h2>Orlyg joins the sea battle</h2><p>She continues casting near Sea-Wolf’s prow while Einar and a handful of Bloodsworn protect her against boarded druzhina. Fighting remains concentrated at the stern as well; no resolved victory is shown.</p></details><details><summary>The Fury of the Gods · 29</summary><h2>She strains against a red-shielded caster advancing along Sea-Wolf’s deck</h2><p>She strains against a red-shielded caster advancing along Sea-Wolf’s deck. Her frost slows him, and her shield initially holds against his spells. A second male caster boards from the stern attacker and joins him: their red spells brighten to white and strike her ice-shield, filling the ship with sparks, heat and boiling steam. The company is knocked down; her final condition and the shield’s fate remain unshown.</p></details><details><summary>The Fury of the Gods · 30</summary><h2>She survives behind a cracked but intact shield, eyes lit white-blue</h2><p>She survives behind a cracked but intact shield, eyes lit white-blue. Ice-hammer and tendril spells damage both casters’ protection; Orka spears one before Grok and Kló kill him. She uses wind and a sea-wave to strip the other’s shield, then thanks Iva for binding him. Singing, she welcomes a mother serpent aboard, strokes its head and rebukes the captive for killing her friends before gesturing him into its reach. The mother feeds/trains her young on him. One juvenile stays at her feet and climbs to her forearm, where she strokes it; no name or permanent bond is stated.</p></details><details><summary>The Fury of the Gods · 32</summary><h2>Debts, kinship and the voyage onward</h2><p>After Orlyg’s failed purchase offer, she takes Orka’s hands and stops the young serpent tasting the blood on them. Glornir embraces them both. Orka sees white pinprick scars around her mouth, a later scarred state replacing the earlier swollen stitch wounds in the current chronology. When Glornir tells newcomers he has never commanded her, she jokes he would not dare; his secrecy policy offers collars as cover rather than establishing a new actual ownership. She promises the ravens help when possible.</p></details><details><summary>The Fury of the Gods · 37</summary><h2>Life aboard Sea-Wolf</h2><p>With the young serpent over her shoulders, she vouches for Varg and performs the oath’s blood rite: back-of-hand cuts, mingled blood in a leather cup, chant, visible spiralling strands merging in flame. She pours it into Varg’s hands for sealing the shield. The chant’s wolf-son address does not establish a different biological parentage from known wolf-blood ancestry.</p></details><details><summary>The Fury of the Gods · 39</summary><h2>Old oaths and news of the dragon</h2><p>With the young serpent across her shoulders she asks Grok about the dragon’s mode of travel, infers Snakavik from the westward march and offers hungry Grok pickled herring. Kló’s later den report leads her to say the war is close. No exact river name, den interior or enemy timetable reaches the company through these reports.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>Arrival at the wolf-god’s hall</h2><p>Before meeting Elvar she whispers to the young serpent and wraps its tail in a silver-wire-like Seiðr thread; its appearance shifts to a whip. She tells it to sleep and buckles the thick black coils at her belt. No bite/lash ability is demonstrated.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>Arrival at the wolf-god’s hall</h2><p>Inside, she and her sister Uspa run together and embrace, smiling and weeping. The reunion is actual, the relationship already known; Uspa then embraces Glornir.</p></details><details><summary>The Fury of the Gods · 44</summary><h2>She hurries after Glornir and kindles blue flames in response to Skalk’s red staff runes</h2><p>She hurries after Glornir and kindles blue flames in response to Skalk’s red staff runes. He points to her white mouth scars while accusing Skalk of the earlier abduction, sewing and beating. Ulfrir halts the confrontation and Elvar postpones feuds; no new injury or spell impact is described.</p></details><details><summary>The Fury of the Gods · 46</summary><h2>Her red runes reveal a concealed wood-and-stone hatch in the tunnel ceiling</h2><p>Her red runes reveal a concealed wood-and-stone hatch in the tunnel ceiling. Glornir opens it, and she touches emerging shoulders and promises to guide the Bloodsworn back. The mechanism and return remain unshown. Lif and others use her previously taught skuggar skilja words against night-hags, with a successful local result.</p></details><details><summary>The Fury of the Gods · 49</summary><h2>Building defences at the bridge gate</h2><p>She stands with Uspa and Iva behind the gate, punches a red rune-gloved fist into the shallow ditch and kindles the half-circle/spoked channels beneath the gate and along the river wall. Kneeling, she adds both fists as the others join. The combined working visibly flares and fades; Ulfrir’s promised protection is not tested here.</p></details><details><summary>The Fury of the Gods · 52</summary><h2>She calls the belt whip into action against Silrið’s red staff spell</h2><p>She calls the belt whip into action against Silrið’s red staff spell. Its serpent head rises with fangs, bites Silrið’s cheek and tears flesh free when Vol pulls back, disrupting her. This shows actual biting weapon use of the existing creature guise, not venom, a new serpent or a nonliving replacement.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>She uses her own key to remove/drop the collar before Elvar, with Iva and Taras doing the same</h2><p>She uses her own key to remove/drop the collar before Elvar, with Iva and Taras doing the same. Glornir explicitly says they were never thralled to him. This reveals the cover publicly rather than newly granting Vol freedom or rewriting the earlier observed collar into real ownership.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>Freedom and the approaching army</h2><p>Vol, Uspa and Iva combine spoken invocations and runes over the bridge defenders as enemy red/blue runes descend. The spells collide and burst in heat and colour. This successful interception is observed, without proving immunity to every later spell or naming a universal magical limit.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>Vol, Uspa and Iva confer behind the shield wall before the clash</h2><p>Vol, Uspa and Iva confer behind the shield wall before the clash. Later an incantation from behind the line is followed by a wind dispersing the spertus cloud, but that passage does not individually identify its caster; no specific casting is assigned to her on that basis alone.</p></details><details><summary>The Fury of the Gods · 63</summary><h2>The stone doors and the retreat inside</h2><p>Vol, Uspa and Iva are explicitly seen using rune-spells against the hyrndur inside the hall after the doors close. This named interior action does not retroactively identify the unassigned earlier wind or fire-net casters.</p></details><details><summary>The Fury of the Gods · 65</summary><h2>She sits talking with Glornir and Orka as Breca rests on Glornir’s lap with Vesli on his shoulder</h2><p>She sits talking with Glornir and Orka as Breca rests on Glornir’s lap with Vesli on his shoulder. No fresh working or new injury is shown.</p></details><details><summary>The Fury of the Gods · 68</summary><h2>She says the rebels seek to open the doors</h2><p>She says the rebels seek to open the doors. In the fight she casts a blue ice-net that consumes Sturla’s counter-flame, binds/freezes her and at Vol’s next words crushes her into shards. The current named working does not retroactively identify earlier unassigned spells, and no general magic superiority or named shard victims are proven.</p></details><details><summary>The Fury of the Gods · 70</summary><h2>The gods collide and the tree burns</h2><p>She directs frost/ice runes at the tree fire, but the first contact with Rotta’s rune flames bursts to steam. This local failure is distinct from her earlier successful ice-net against Sturla’s fire and does not define a universal elemental ranking.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>She counters Skalk’s frantic Galdur as the companies climb the tree</h2><p>She counters Skalk’s frantic Galdur as the companies climb the tree. No named resolution of their contest, complete extinction of the hall fire or completed return route is given.</p></details><details><summary>The Fury of the Gods · 74</summary><h2>Snaka rises and Wolfdales collapses</h2><p>Her blue rune-flames destroy Skalk’s staff; he is lifted/convulsed and dropped with twisted limbs and a broken neck. She names Snaka as his skull stirs. Glornir takes her wrist during the collapse and they leap hand-in-hand from the cliff; no landing is shown.</p></details><details><summary>The Fury of the Gods · 76</summary><h2>Surviving the plunge into the Falinn</h2><p>Alive at the treeline after the leap, she speaks Seiðr-runes to light Lif’s deadwood fire for the soaked survivors. This is a small warming fire, not a new attack or extinguishing of Wolfdales.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>The survivors’ camp and reunion</h2><p>Vesli brings Glornir’s party to the woodland camp, escorted by Ulfrir’s guards: Glornir leads with Vol and Orka at his shoulders and a score-or-so Bloodsworn behind. The split company actually reunites and Svik/Orlyg welcome them. No new battle or all-missing-allies tally is given.</p></details><details><summary>The Fury of the Gods · 88</summary><h2>Vol and Uspa are explicitly named casting against dragon-born, with Glornir/Berak defending flanks</h2><p>Vol and Uspa are explicitly named casting against dragon-born, with Glornir/Berak defending flanks. Orka’s party breaks the cultists assaulting them. This current named pair does not retrospectively name every earlier unidentified witch.</p></details><details><summary>The Fury of the Gods · 90</summary><h2>Her serpent whip is active in the assault; with Uspa/Iva she helps bind the dragon</h2><p>Her serpent whip is active in the assault; with Uspa/Iva she helps bind the dragon. After the victory she rushes to dying Glornir and weeps across him as Bloodsworn gather. No new marriage/family fact or immediate leadership decision is given.</p></details><details><summary>The Fury of the Gods · 91</summary><h2>She travels on the wagon with Iva, then helps carry Glornir’s body to Thorkel’s barrow</h2><p>She travels on the wagon with Iva, then helps carry Glornir’s body to Thorkel’s barrow. She declined Ulfrir’s offered place beside Elvar and chooses his kin’s homestead for her beloved. Digging begins.</p></details><details><summary>The Fury of the Gods · 92</summary><h2>She places the final barrow stone and joins the toast to Elvar</h2><p>She places the final barrow stone and joins the toast to Elvar. She says Ulfrir will pay the promised silver, but declines chiefship while grieving and mentally exhausted. She supports a home and proposes this steading; Orka approves. The serpent whip at her hip is named Gand.</p></details><details><summary>Illustration · The Fury of the Gods · 1</summary><p><a href="assets/7ad7e1c9d5b97b.jpg">Open noncanonical illustration</a></p><p>Freedom in the courtyard.</p></details><details><summary>Illustration · The Fury of the Gods · 74</summary><p><a href="assets/1ea616eab4309c.jpg">Open noncanonical illustration</a></p><p>Glornir and Vol’s leap, before any landing is shown.</p></details><details><summary>Illustration · The Hunger of the Gods · 25</summary><p><a href="assets/40d56d03b81f76.jpg">Open noncanonical illustration</a></p><p>Jaromir rides away with Vol captive while Ilia follows with the chest.</p></details><details><summary>Illustration · The Fury of the Gods · 77</summary><p><a href="assets/351bb7176446cb.jpg">Open noncanonical illustration</a></p><p>Glornir’s party entering the survivors’ snowy camp.</p></details><details><summary>Illustration · The Fury of the Gods · 25</summary><p><a href="assets/fe5a2430b0dacf.jpg">Open noncanonical illustration</a></p><p>The early counterspell freezing the lead drakkar’s red ward, before the hull breaks.</p></details><details><summary>Illustration · The Fury of the Gods · 49</summary><p><a href="assets/b260375c8f69d9.jpg">Open noncanonical illustration</a></p><p>The combined working at the river gate.</p></details><details><summary>Illustration · The Fury of the Gods · 56</summary><p><a href="assets/9d4fd81ccba6d4.jpg">Open noncanonical illustration</a></p><p>The three casters’ combined defence.</p></details><details><summary>Illustration · The Fury of the Gods · 44</summary><p><a href="assets/2c1a0be95bf6a4.jpg">Open noncanonical illustration</a></p><p>Ulfrir halting the confrontation under Elvar’s rule.</p></details><details><summary>Illustration · The Shadow of the Gods · 21</summary><p><a href="assets/5f5fdee52a4237.jpg">Open noncanonical illustration</a></p><p>Vol during her conversation with Varg before the company sails.</p></details><details><summary>Illustration · The Fury of the Gods · 42</summary><p><a href="assets/6ea1ebcad9ddc8.jpg">Open noncanonical illustration</a></p><p>The sisters’ reunion in Wolfdales.</p></details><details><summary>Illustration · The Fury of the Gods · 30</summary><p><a href="assets/6695f8968a0edf.jpg">Open noncanonical illustration</a></p><p>Vol greeting the mother serpent before the captive is delivered.</p></details><details><summary>Illustration · The Fury of the Gods · 6</summary><p><a href="assets/a40f2b312d755e.jpg">Open noncanonical illustration</a></p><p>Vol prepares the akáll.</p></details><details><summary>Illustration · The Fury of the Gods · 46</summary><p><a href="assets/ac7c1b098d7483.jpg">Open noncanonical illustration</a></p><p>The concealed exit revealed before the sortie.</p></details><details><summary>Illustration · The Fury of the Gods · 68</summary><p><a href="assets/779a02f0c5971d.jpg">Open noncanonical illustration</a></p><p>Vol’s ice-net meeting the counter-flame.</p></details><details><summary>Illustration · The Fury of the Gods · 42</summary><p><a href="assets/2cf641fa68691a.jpg">Open noncanonical illustration</a></p><p>The sleeping serpent’s whip-like disguise.</p></details><details><summary>Illustration · The Fury of the Gods · 52</summary><p><a href="assets/463046cd0df0e8.jpg">Open noncanonical illustration</a></p><p>Noncanonical detail of the serpent end rearing before the strike.</p></details></noscript>
