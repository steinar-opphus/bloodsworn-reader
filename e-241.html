      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 25</summary><h2>Introduction</h2><p>The black-skinned, shaven-headed, hugely muscled man who breaks the tower wall wears a thick iron collar and has two forehead lumps like emerging horns. He snorts and bellows. He later names himself Taras; the narration calls him Taras the Bull. No divine lineage is supplied and he is not merged with the earlier unnamed large arrival.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>Introduction in B02-C025</h2><p>He charges the rune-shield, breaks gaps in it and is badly burned when his tunic catches fire. Iva’s mist extinguishes the flames. She leads him by the hand as he whimpers, and promises care once away; he remains injured when they leave.</p></details><details><summary>The Fury of the Gods · 1</summary><h2>After the battle at Valdai</h2><p>The wounded bull-man fought at Valdai is now explicitly named Taras, resolving the separate E-306 record. Still bandaged from Ingmar&#x27;s broken spear, he protects Iva in the tower. Vol removes their collars and ropes, declaring them free. He promises not to fight the company again and carries Iva outside when she asks to see the sun.</p></details><details><summary>The Fury of the Gods · 1</summary><h2>Identity established - The Fury of the Gods chapter 1</h2><p>Vol names the previously unnamed bull-man Taras. Varg explicitly recalls the wounds inflicted by Ingmar with his broken spear, identifying the chapter-68 opponent as Taras. This resolves E-306 into E-241 at B03-C001; earlier summaries preserve their original knowledge.</p></details><details><summary>The Fury of the Gods · 1</summary><h2>He catches wounded Iva, leaves her beneath trees, swells and charges through the shield wall</h2><p>He catches wounded Iva, leaves her beneath trees, swells and charges through the shield wall. He breaks Ingmar&#x27;s spear, fights Varg, Røkia and Svik and is finally brought down by Ingmar&#x27;s broken spear halves. The narration calls him a Tainted thrall and bull man, without naming a specific god-lineage or establishing a complete animal form.</p></details><details><summary>The Fury of the Gods · 14</summary><h2>The warehouse rescue</h2><p>He throws a man into Sterkur’s crew during the rescue, then boards Sea-Wolf, rocking it with his weight. He beats the rowing rhythm on a shield with knotted rope as the vessels escape Ulaz.</p></details><details><summary>The Fury of the Gods · 21</summary><h2>Reunion in the island harbour</h2><p>He keeps rowing time on a battered shield with knotted rope, lowers and retrieves Sea-Wolf’s anchor stone and resumes the stern barrel-seat. Einar claims the spot. Vol calls Taras a friend and Taras proudly names himself friend of the Bloodsworn. Einar reciprocates, and Taras offers to share the seat and drink. Their height is roughly equal; no formal oath or appointment is created.</p></details><details><summary>The Fury of the Gods · 25</summary><h2>Preparing to meet the pursuing ships</h2><p>Einar has given him battle kit: mail tight across his huge shoulders, nasal helm, two bearded axes, thick-shafted spear and back-slung shield. He exchanges a forearm grip with Einar and promises to see his friends afterwards, then transfers with Iva to Sulich’s knarr. No later personal outcome is shown in this chapter.</p></details><details><summary>The Fury of the Gods · 27</summary><h2>He fights on the knarr during the encirclement, his roar audible to Varg</h2><p>He fights on the knarr during the encirclement, his roar audible to Varg. As attackers press its defenders towards midships, Varg sees him hoist an enemy over his head and throw the warrior overboard.</p></details><details><summary>The Fury of the Gods · 28</summary><h2>Orka sees him near the singing Iva, wearing mail and helm and pierced by many arrows</h2><p>Orka sees him near the singing Iva, wearing mail and helm and pierced by many arrows. He continues bellowing and throwing enemies overboard. The arrow wounds do not establish his later condition, healing or death.</p></details><details><summary>The Fury of the Gods · 30</summary><h2>He is alive and accompanies Iva from the knarr onto Sea-Wolf, looming at her shoulder</h2><p>He is alive and accompanies Iva from the knarr onto Sea-Wolf, looming at her shoulder. This continued movement after the earlier arrows does not establish their removal, healing or his eventual condition.</p></details><details><summary>The Fury of the Gods · 32</summary><h2>Debts, kinship and the voyage onward</h2><p>He brings Iva water, then walks stiffly in blood-marked bandages to the gathering, squeezing Einar’s shoulder. He reassures his worried friend that the arrows did not penetrate deeply and Iva cares for him; this is his assessment, not complete recovery. Glornir lays out secrecy/collar choices before landing, without showing his individual decision. Taras says he likes the ravens after their offer to scout.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>Arrival at the wolf-god’s hall</h2><p>He says he will do as Iva does and chooses collar cover with her, later directly seen wearing one on arrival. Glornir supplies two collar/key pairs to Sulich; the text explicitly addresses Iva’s control and does not narrate a new actual enslavement ritual for either. Some scowl at him and the riders, with motive only Varg’s question.</p></details><details><summary>The Fury of the Gods · 49</summary><h2>Building defences at the bridge gate</h2><p>Elvar perceives him as Iva’s attending guard and Bloodsworn thrall, a viewpoint label distinct from their established chosen cover. He watches the gate working from the walkway and laughs when falling sparks settle on his skin without pain. This does not establish universal resistance to magic or a new binding.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>Salvage and a choice about freedom</h2><p>He removes his own cover collar beside the witches, and Glornir confirms they were never thralled to him. The action publicly resolves Elvar’s earlier mistaken viewpoint label; no new binding or fresh manumission is required for him.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>Freedom and the approaching army</h2><p>At the gate he roars and throws a skull-sized rock, shattering an attacker’s shield and knocking him down. An unattributed spear then topples the man with a scream. The throw is Taras’s; the spear’s caster and final casualty outcome are not supplied.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>Elvar Chainbreaker and the hillside stand</h2><p>He stands near Vol, Uspa and Iva behind the shield front, wearing a steel skull-cap and mail, two hand-axes in his belt. This is current equipment; no new injury or full prior-wound recovery is specified.</p></details><details><summary>The Fury of the Gods · 65</summary><h2>He laughs behind Einar during the arm-wrestle with Sighvat among the mingled companies</h2><p>He laughs behind Einar during the arm-wrestle with Sighvat among the mingled companies. No new duel, oath or injury appears.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>Leif’s death and the tunnel escape</h2><p>He is directly seen running with Sulich’s mounted remnants, carrying Iva in his arms during the hall evacuation. Her being carried does not by itself establish unconsciousness or a new injury. The survivors follow Ulfrir into the tunnels.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>He walks out carrying Iva, whose forehead now has a crusted gash</h2><p>He walks out carrying Iva, whose forehead now has a crusted gash. They are among the actual tunnel survivors; her precise consciousness/medical diagnosis is not given.</p></details><details><summary>The Fury of the Gods · 81</summary><h2>The charge against the gods</h2><p>He tries to reach Iva’s caster opponent but hunters in leather/fur encircle him and stab with spears; Brák moves in behind him. His final wounds/fate and the fight’s outcome are not yet shown.</p></details><details><summary>The Fury of the Gods · 84</summary><h2>Silrið’s defeat and vengeance for Frøya</h2><p>Brák cuts his calf amid many small attacks; Varg’s companions break the hunters’ ring and he calls them cowards. After Iva defeats Silrið he rests his head on Iva’s shoulder. This is support/relief between companions, without a new romantic label or complete wound cure.</p></details><details><summary>The Fury of the Gods · 89</summary><h2>He limps with Iva holding his hand, then they exchange farewells and walk toward the forest</h2><p>He limps with Iva holding his hand, then they exchange farewells and walk toward the forest. Later the narration names Taras again limping in Æsa’s following charge without a return scene. Both are retained as continuity review, without silently replacing the name or inventing a return.</p></details><details><summary>The Fury of the Gods · 90</summary><h2>The last assault on Lik-Rifa</h2><p>He explicitly returns with Iva and Hrung’s handcart, then with Berak/Sighvat carries the sailcloth and grows/strains to hurl Hrung into the dragon’s jaws. This shows partial Tainted strength, not new horns/full bull form. It supplies his current return without silently resolving the previous chapter’s earlier Taras continuity issue.</p></details><details><summary>The Fury of the Gods · 92</summary><h2>At the courtyard discussion Taras says peace sounds good and Iva pats his knee and agrees</h2><p>At the courtyard discussion Taras says peace sounds good and Iva pats his knee and agrees. They join the company’s eventual agreement to a permanent home, without a new oath or marriage being declared.</p></details><details><summary>Illustration · The Fury of the Gods · 1</summary><p><a href="assets/7ad7e1c9d5b97b.jpg">Open noncanonical illustration</a></p><p>Freedom in the courtyard.</p></details><details><summary>Illustration · The Hunger of the Gods · 25</summary><p><a href="assets/85ab51d57f85b9.jpg">Open noncanonical illustration</a></p><p>Skalk and the apprentices raise their flame shields against the workroom assault.</p></details><details><summary>Illustration · The Fury of the Gods · 60</summary><p><a href="assets/cb601eaad1e937.jpg">Open noncanonical illustration</a></p><p>Taras.</p></details><details><summary>Illustration · The Fury of the Gods · 21</summary><p><a href="assets/8ab12f36af7d18.jpg">Open noncanonical illustration</a></p><p>Taras offering Einar a drink and a shared seat.</p></details><details><summary>Illustration · The Fury of the Gods · 90</summary><p><a href="assets/74e707bda99962.jpg">Open noncanonical illustration</a></p><p>Taras throwing Hrung toward the dragon’s open jaws.</p></details><details><summary>Illustration · The Fury of the Gods · 25</summary><p><a href="assets/4eceb5fa8158bb.jpg">Open noncanonical illustration</a></p><p>Taras in Einar’s gifted battle kit before the engagement.</p></details><details><summary>Illustration · The Fury of the Gods · 84</summary><p><a href="assets/840bb77c043759.jpg">Open noncanonical illustration</a></p><p>Taras resting his head on Iva’s shoulder after the fight.</p></details></noscript>
