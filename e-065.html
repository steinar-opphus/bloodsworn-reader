      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 6</summary><h2>A child and an injured vaesen</h2><p>Orka calls the Spertus Spert.</p></details><details><summary>The Shadow of the Gods · 6</summary><h2>A child and an injured vaesen</h2><p>He has a segmented chitinous body and a curved sting over his back. He has a humanlike face.</p></details><details><summary>The Shadow of the Gods · 6</summary><h2>A child and an injured vaesen</h2><p>Breca usually feeds him porridge mixed with blood and spit. Spert claims to protect the family from vaesen. He admits he cannot watch everything all the time.</p></details><details><summary>The Shadow of the Gods · 8</summary><h2>Oaths at the family steading</h2><p>Spert emits black vapour at Vesli’s approach and later sucks it back.</p></details><details><summary>The Shadow of the Gods · 8</summary><h2>Oaths at the family steading</h2><p>Orka caught and bound him years earlier; his food contains her blood and spit.</p></details><details><summary>The Shadow of the Gods · 8</summary><h2>Oaths at the family steading</h2><p>He demands Vesli swear with blood.</p></details><details><summary>The Shadow of the Gods · 15</summary><h2>Grief and the decision to leave</h2><p>After the family’s return from Fellur, Breca placates Spert with twice his usual portion of porridge. Before leaving to visit the Ash Tree, Orka prepares a bowl of her blood and spit and asks him to watch the steading; he agrees.</p></details><details><summary>The Shadow of the Gods · 17</summary><h2>The burning home and the stolen child</h2><p>In B01-C017, Orka finds Spert unnaturally still on his rock, black ichor oozing from a hole in his body. Around him lie about a dozen tennúr that appear dead. His condition is not independently confirmed beyond this observation.</p></details><details><summary>The Shadow of the Gods · 19</summary><h2>Survival and treatment</h2><p>In B01-C019, Spert is confirmed alive and breathing shallowly. His wound has pale stitches and a thick opaque coating; Vesli confirms she stitched it and gives him water from a bandage. He says he killed many vaesen but was speared by a human.</p></details><details><summary>The Shadow of the Gods · 51</summary><h2>Chapter 51 — Flight at Grimholt</h2><p>He reaches Grimholt with Vesli and the giant ravens. His sting is directly observed blackening a warrior’s veins and tongue before she collapses, strengthening the evidence beyond Orka’s earlier inference about a dead intruder.</p></details><details><summary>The Shadow of the Gods · 51</summary><h2>Chapter 51 — Flight at Grimholt</h2><p>His wings buzz as he hovers and darts, directly demonstrating flight.</p></details><details><summary>The Shadow of the Gods · 53</summary><h2>Chapter 53 — After the battle</h2><p>At the Bloodsworn’s arrival he is perched on Orka’s shoulder beside the children on Grimholt’s steps.</p></details><details><summary>The Hunger of the Gods · 1</summary><h2>Rest and restraint in the burned hall</h2><p>He sleeps among the river boulders with his segmented chitinous tail visible, then surfaces and supports Vesli&#x27;s warning that Lik-Rifa is free.</p></details><details><summary>The Hunger of the Gods · 3</summary><h2>Mord&#x27;s burial and a blood feud</h2><p>Varg sees him fly from the river on buzzing wings that tuck under his chitinous body; he is about as long as Varg&#x27;s arm. Orka feeds him porridge mixed with her blood and spit.</p></details><details><summary>The Hunger of the Gods · 7</summary><h2>An offer to return to the Bloodsworn</h2><p>As Orka prepares to leave Grimholt, he lands on her saddle pommel. His wings disappear beneath his segmented outer shell, with his sting arched over one shoulder.</p></details><details><summary>The Hunger of the Gods · 10</summary><h2>The night-hag in the woodland camp</h2><p>Vesli says he is sleeping after the night-hag attack. Later he emerges from the camp’s stream asking for food, interrupting Orka and Edel’s tense exchange.</p></details><details><summary>The Hunger of the Gods · 15</summary><h2>The search through Rotta&#x27;s chamber</h2><p>He wakes on Orka’s saddle hungry, his tail sting moving close to her arm. At the dead he probes wounds with antennae and tastes them with a blue-black tongue, distinguishing human from human-but-not and distinguishing a woman from the old dragon-born. Orka interprets the woman as Tainted but not dragon-born. These are their assessments, not an infallible general bloodline test.</p></details><details><summary>The Hunger of the Gods · 15</summary><h2>The search through Rotta&#x27;s chamber</h2><p>He and Vesli investigate a child-sized mattress; he says Breca was there, confirming Orka’s sense of a trace. It does not establish Breca’s current whereabouts.</p></details><details><summary>The Hunger of the Gods · 20</summary><h2>Myrk confronted in the glade</h2><p>When Orka is being throttled, he lands on her attacker’s shoulder and darts away after a flash of movement. Black veins spread from the man’s cheek, his tongue swells black and he releases her; the passage does not explicitly describe the delivery mechanism. After Myrk falls, Spert checks Orka’s bleeding head with his antennae.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>Wounds tended and seaxes compared</h2><p>He follows Orka on extended legs with his sting curled high, asking for food. Later she gives him porridge mixed with a drop of blood and spit; he eats eagerly while Ingmar puts down his own spoon and looks away.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>He flanks the bound Myrk with sting raised, touches her leg with antennae as she insults the pair. When her eyes flare red and she struggles, his sting hovers close to one eye while Orka and Vesli also threaten her. She stills; no sting, poisoning or injury from him is shown.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>Orka&#x27;s search in Starl</h2><p>Orka bars him and Vesli from Starl because she fears they would be killed, ordering them to find safety near the lake and watch for her boat within a day. He flies north with Vesli, still grumbling about porridge. No attack, meal or reunion is shown.</p></details><details><summary>The Hunger of the Gods · 50</summary><h2>The wolf&#x27;s call across the lake</h2><p>Orka’s whistle brings him dripping from the lake while Vesli comes from the trees. He reminds her they were told to watch the docks; she announces a changed plan and Lif explains the ruse for following Myrk. His twitching antennae and grinding jaws lead Orka to question him, despite his initial denial that anything is wrong.</p></details><details><summary>The Hunger of the Gods · 50</summary><h2>The wolf&#x27;s call across the lake</h2><p>With Vesli he reports a maker’s night call, names Lik-Rifa and says he heard her in his head without knowing how. Vesli says she heard it too and describes a song ordering them to come. Her account allows either direct creation or descent from created kin; it does not independently establish how he was made.</p></details><details><summary>The Hunger of the Gods · 50</summary><h2>The wolf&#x27;s call across the lake</h2><p>Asked why he stayed, he cites his oath and pact with Orka. When she says she released him he replies that he did not agree. Vesli says their pact to find Breca gave them strength to refuse the difficult call. His continued commitment is his stated choice beside an actually observed presence, not a universal law invalidating oath releases or guaranteeing future immunity.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>He finishes porridge with his fat black tongue and identifies Vesli as the better flier when Orka considers a messenger. Later he says the eastward vaesen tracks answer Lik-Rifa’s summons. This is his interpretation, not a new arrival by him at Nastrandir.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>He volunteers when Orka lets him choose whether to fight, his wax-melted face twisting as he promises not to be the one dying. She privately asks him and Vesli to keep Lif alive. He hovers above a twitching, black-veined skraeling after the courtyard fight, but the source does not explicitly identify a sting or cause of the veins. Afterwards he lies at Lif’s feet looking asleep.</p></details><details><summary>The Hunger of the Gods · 64</summary><h2>The hidden doors into Nastrandir</h2><p>He identifies Lik-Rifa&#x27;s hall behind the cliff and opens its concealed doors with Opinn as stone serpents move. He says he felt what to do; Halja&#x27;s Seiðr explanation remains a hypothesis. He distinguishes Vesli from other tooth-eaters and says he misses her.</p></details><details><summary>The Hunger of the Gods · 72</summary><h2>The army gathers below Svelgarth</h2><p>Gunnar opens the iced stream in the preparation camp so Spert can rest in water, a need he has complained of. No healing ability or broader biological rule is inferred from that rest.</p></details><details><summary>The Hunger of the Gods · 76</summary><h2>Captives before Rotta</h2><p>He initially poses as a hostile venom-threatening spertus, then stings Storolf and blows a black cloud into Rotta&#x27;s face, revealing himself by addressing Orka. He guides Breca to safety while Lif cuts Orka&#x27;s web. The cloud is compared to flies, not definitively identified as insects or a universal venom mechanism.</p></details><details><summary>The Fury of the Gods · 7</summary><h2>The chained march and its victims</h2><p>Orka recognises the black veins and swollen black tongue on a dead woman as his handiwork and feels pride and concern that her allies remain nearby. The attack itself is unseen; his exact position, the other killer and Breca&#x27;s presence are not established. This is her source-backed inference, not a directly witnessed new sting.</p></details><details><summary>The Fury of the Gods · 13</summary><h2>Brák brings him back wounded inside the moving sack</h2><p>Brák brings him back wounded inside the moving sack. He explains that he refused his Mother-Maker’s call because he keeps his promise to protect Breca, and names friendship with Orka as his reason. She recognises him as part of her family. Rotta uses his threatened death to force Ulfrir’s destination from her, then kills him anyway. His corpse is explicitly confirmed.</p></details><details><summary>The Fury of the Gods · 17</summary><h2>Escape on Orlyg’s longship</h2><p>Orka removes the spear pinning his corpse and carries him through the battle to the surviving longship. She lays him beside an oar-chest. Sæunn says he was first to insist on staying to save Orka, and she mourns his loyalty and friendship. The body is dead throughout; there is no resurrection.</p></details><details><summary>The Fury of the Gods · 26</summary><h2>Breca asks that his body be taken home to Fellur for burial instead of a sea burial</h2><p>Breca asks that his body be taken home to Fellur for burial instead of a sea burial. Orka agrees and obtains a barrel and salt for preservation, incurring debt to Orlyg. No burial, revival or guaranteed long-term preservation is shown.</p></details><details><summary>The Fury of the Gods · 30</summary><h2>Vesli’s return brings a question about him</h2><p>Vesli’s return brings a question about him. Breca’s trembling, tears and headshake communicate his death; Vesli weeps in response. His body’s planned preservation/burial is not newly shown or changed here.</p></details><details><summary>The Fury of the Gods · 41</summary><h2>Ilska asks about Orka</h2><p>Biórr tells Ilska that the threat to him forced Orka to speak and his killing prompted her attack on Rotta. He disputes Ilska’s assumption that all spertus serve Lik-Rifa. No new account revives him or changes the planned burial.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>Elvar sees Orka and Breca search the wreckage for hours and leave with a barrel</h2><p>Elvar sees Orka and Breca search the wreckage for hours and leave with a barrel. Its contents are not shown to her, so this does not yet identify the barrel as the one holding Spert’s preserved remains or confirm their recovery.</p></details><details><summary>The Fury of the Gods · 91</summary><h2>Return to the ruined homestead</h2><p>His body is explicitly identified in the barrel Taras sets beside Thorkel’s barrow, saved from Orlyg’s shipwreck. This resolves the recovered-remains question without retroactively asserting an earlier observer saw inside the barrel.</p></details><details><summary>The Fury of the Gods · 92</summary><h2>The company now stands around three completed barrows for Thorkel, Glornir and Spert</h2><p>The company now stands around three completed barrows for Thorkel, Glornir and Spert. Varg places a stream-stone on Glornir’s and Vol the final stone before the gathering moves to food and discussion.</p></details><details><summary>Illustration · The Shadow of the Gods · 53</summary><p><a href="assets/73b12afd8cb46a.jpg">Open noncanonical illustration</a></p><p>Spert in an isolated hovering study, rather than a literal reconstruction of the attack.</p></details><details><summary>Illustration · The Shadow of the Gods · 21</summary><p><a href="assets/2211e8b8c01a11.jpg">Open noncanonical illustration</a></p><p>Spert emerging from the stream before being fed.</p></details></noscript>
