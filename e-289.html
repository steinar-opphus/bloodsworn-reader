      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 53</summary><h2>Appearance</h2><p>Sulich names the organism extracted from a Sea-Wolf boarder a tungumatur, or tongue-eater. The observed specimen is long, mucus-coated, hooked along its body and branching into thinner strands, with a bloated toothed mouth and two black eyes. Its host stops moving when Glornir tears it free, and Glornir kills it by crushing.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>Sulich says the young are flea-small and live in stagnant water, enter mouths through water, latch on with hooks and eat and replace the tongue. He describes numbing, food-sharing that sustains the host, growth towards the thought-cage and gradual control followed by short host survival and a search for another. He expressly does not know the control mechanism; the lifecycle is his account rather than wholly observed development.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>He lists shared drinks, kissing and sex among possible spread routes and calls them common in Iskidan. Varg interprets a previous mouth-first lunge as attempted transfer. Individual infected hosts still act after grave wounds; Varg directly destroys mouth parasites in battle, including severing an emerging specimen’s head. No host-saving cure is demonstrated.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>A giant individual at the island pool swallows a captive whole and is killed by Glornir. A surviving captive reports infection through its slime. The giant’s relation to the smaller lifecycle is unexplained. Varg’s shut mouth and held breath after being thrown into its pool do not establish immunity or a completed infection test.</p></details><details><summary>Illustration · The Hunger of the Gods · 53</summary><p><a href="assets/0124dfa487a1f9.jpg">Open noncanonical illustration</a></p><p>An isolated study of the smaller tungumatur specimen.</p></details><details><summary>Illustration · The Hunger of the Gods · 53</summary><p><a href="assets/7ecd9c1271ed48.jpg">Open noncanonical illustration</a></p><p>An imagined adult host infected by a tungumatur; no single event is reconstructed.</p></details></noscript>
