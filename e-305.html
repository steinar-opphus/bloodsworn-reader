      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 66</summary><h2>Appearance</h2><p>Sulich earlier names Rurik as Jaromir&#x27;s twin and says the pair spoke of ruling together. This is Sulich&#x27;s family account, registered before Rurik&#x27;s first direct appearance.</p></details><details><summary>The Fury of the Gods · 10</summary><h2>Sulich identifies him as Jaromir&#x27;s brother when he rides through Ulaz</h2><p>Sulich identifies him as Jaromir&#x27;s brother when he rides through Ulaz. He wears shining lamellar armour, with a shaved head, thick blond braid over his shoulder and dangling blond moustache; his helm and sword hang from the saddle. He crosses the guarded bridge with druzhina and a collared rune-wielder, turning north towards the eastern docks. No statement from him reveals a departure date or current knowledge of Jaromir&#x27;s death.</p></details><details><summary>The Fury of the Gods · 14</summary><h2>After the escape, Varg spots five white-sailed longships marked with a black hawk</h2><p>After the escape, Varg spots five white-sailed longships marked with a black hawk. Svik identifies them as Rurik’s and guesses that they are following. The ships are visible, but an interception or attack is not yet shown.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>Glornir identifies the vast dawn fleets as the invasion Rurik planned with Jaromir</h2><p>Glornir identifies the vast dawn fleets as the invasion Rurik planned with Jaromir. Orka sees multiple approaches but no commander aboard is directly recognised; his location, exact force and the ports’ outcomes remain unshown.</p></details><details><summary>The Fury of the Gods · 92</summary><h2>Gunnar reports him and his fleet’s survivors still riding around Vigrið after the battle</h2><p>Gunnar reports him and his fleet’s survivors still riding around Vigrið after the battle. This does not identify exact numbers, position or further attacks.</p></details><details><summary>Illustration · The Hunger of the Gods · 66</summary><p><a href="assets/5900423d37734c.jpg">Open noncanonical illustration</a></p><p>Noncanonical representative portrait.</p></details></noscript>
