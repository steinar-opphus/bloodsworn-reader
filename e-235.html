      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 19</summary><h2>Scouting beyond the repaired bridge</h2><p>In the distant view beyond the fortress wall, Varg describes the tower as rearing tall “like a black nail into the sky”. This is a visual simile, not a statement of construction material.</p></details><details><summary>The Shadow of the Gods · 31</summary><h2>Rune teaching in the tower</h2><p>The tower was earlier named as a place where Galdurmen learn rune arts.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>The secret approach to the tower</h2><p>A secret timber-braced tunnel from Helka’s chamber area reaches it outside the fortress. An unseen threshold immobilises Guðvarr until Skalk speaks. The high-vaulted entrance has braziers, barred carved oak doors, two mailed spear guards and a rear stairway. Its courtyard is timber-enclosed.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>The secret approach to the tower</h2><p>A corridor of iron-barred cells holds Skapti and Hrolf; Vol is in another cell, severely injured with stitched lips. A door opened by Skalk’s touch and words leads to a circular high-vaulted workroom where people copy the recovered parchments into carved materials beside the chest of bones.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>The secret approach to the tower</h2><p>The room contains shelves of rune materials, jars, marked barrels, cages with animals and a tennúr, a faunir, a pool Skalk identifies as holding a Näcken and a hyrndur nest. A half-embedded chain link stands beside a restraint table; Skalk calls it Ulfrir’s. Here Guðvarr is bound and a hyrndur starts burrowing into his arm.</p></details><details><summary>The Hunger of the Gods · 24</summary><h2>A rescue planned in Darl</h2><p>Glornir’s dispersed bands plan to converge at sunset, concealing mail and weapons, while Helka is expected at her evening feast. The briefing anticipates rune defences, Skalk’s own warriors and apprentices, and difficulty finding Vol without Seiðr support. From a few rows of buildings away, Svik’s band hears a scream, fighting, horses and a concussive explosion. They run, but the chapter shows neither its cause nor their entry.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>The assault on the workroom</h2><p>Jaromir’s mounted archers enter through a breach smashed by the collared Taras. Skalk’s rune-fire, the attacking hyrndur, the hawk’s intervention and Iva’s mist turn the workroom into a battlefield. Iva opens a fissure that swallows Sturla and Skalk, with Yrsa leaping after him, while the restraint table splinters above it.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>The assault on the workroom</h2><p>Jaromir rides out through the breached wall with Vol over his saddle; Ilia follows with the wooden chest.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>The assault on the workroom</h2><p>The room is left shattered and burned, its jars, barrels, cages and furniture scattered. Broken containers expose body parts and Arild’s corpse. The faunir remains caged and the Näcken remains under the pool. Skapti and the other prisoners are still locked up. Fighting fills the courtyard at sunset; Guðvarr escapes by the tunnel without the entrance ward resisting his exit.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>Varg’s close view establishes wooden construction: the tower only looked like polished black stone from a distance. Earlier artwork’s material choices remain noncanonical interpretation, not contrary literary evidence.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>The courtyard battle brings together druzhina, tower guards and the Bloodsworn. Svik’s group crosses the stockade via a flat outbuilding roof. Jökul is killed and his corpse lies at the entrance threshold. The rear entrance-room door leads down planked steps to the torchlit tunnel; a separate spiral stair rises through the tower.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>Glornir’s searchers report no Vol. The company leaves through the tunnel towards Helka’s fortress, rather than recovering her here. This search result does not establish the later fate of the other prisoners or Skalk’s survival.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>The three whose fate below the fissure was unknown are now seen alive in Helka’s hall: Yrsa and Sturla support Skalk, who drags one leg and wears a linen head wrap over the injured eye. No route of escape from the tower is described.</p></details><details><summary>The Hunger of the Gods · 33</summary><h2>A summons after the tower battle</h2><p>Less than two days after the Bloodsworn’s departure, workers repair the charred perimeter and courtyard. Dark ground stains and piled bodies, including horses, remain. Carpenters fit a replacement door towards the cells and Skalk’s chamber. The former prisoners’ cell is open; Guðvarr’s fear of their murder does not establish their fate.</p></details><details><summary>The Hunger of the Gods · 33</summary><h2>A summons after the tower battle</h2><p>A winding stair leads to a higher circular chamber with tools, rolled parchments and barrels, where Skalk has completed his new Froa-derived staff. This is the setting of his explicit hyrndur commands and Guðvarr’s resulting pain, rather than evidence that the earlier ruined workroom has been fully restored.</p></details><details><summary>The Hunger of the Gods · 46</summary><h2>A secret meeting before dawn</h2><p>The former prisoners Skapti and Hrolf are now directly shown alive at The Dead Drengr. Their earlier open cell therefore did not establish their deaths. The chapter gives no release mechanism, route from the tower or new account of the other prisoners.</p></details><details><summary>The Hunger of the Gods · 48</summary><h2>Flight from the breakfast table</h2><p>Guðvarr runs towards its visible gateway seeking Skalk. Near the gate he is struck down and Hrolf raises an axe over him, but a spear kills Hrolf before the blow. Guards run out, with Skalk following and carrying his new staff; the spear thrower is not named.</p></details><details><summary>The Hunger of the Gods · 48</summary><h2>Flight from the breakfast table</h2><p>A fiery net binds the changing Kalv and an estimated eight or ten Galdur-guards surround him with levelled spears. Skalk questions Guðvarr, strikes Kalv limp, and after a spoken phrase the net becomes thin cord. He orders the guards to bring Kalv and Guðvarr to follow. This is the responding group’s estimated size, not a complete garrison count; no subsequent room or interrogation is shown.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>A chamber used for Kalv’s interrogation has a table of saws, tongs, hammers, knives and a small axe, a charcoal brazier heating a narrow knife and a chair bolted to the floor with iron restraints. It is not explicitly equated with the earlier workroom. Sturla smashes Kalv’s toes before the royal party arrives; the room later sees Hakon’s tattoo exposed and Kalv killed by Frek.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>Here Skalk proposes raising Orna from her completed skeleton, binding her with a chain-derived collar and using her against Lik-Rifa. Helka shows interest while he estimates many days of preparation. Guðvarr offers a messenger mission to Nastrandir. Neither ritual, collar forging nor mission departure is shown.</p></details><details><summary>The Fury of the Gods · 8</summary><h2>Lik-Rifa has settled in the tower, reached through the old secret passage</h2><p>Lik-Rifa has settled in the tower, reached through the old secret passage. Hundreds of serpents cover the entrance floor, columns and spiral stairs, while frost-spiders occupy webs in the eaves. A central chair and food-laden table are clear. Her spoken Slepptu Þeim and gesture part a route for Sigrún and Guðvarr. The unimpeded entry does not establish permanent removal of every old ward.</p></details><details><summary>The Fury of the Gods · 24</summary><h2>Rotta returns to Darl</h2><p>The oak-gated courtyard includes barracks, stables, pens, dairy and brewhouse, and the tower is explicitly black-stoned. Lik-Rifa receives the returning force at its entrance. The entrance hall is now a feast chamber with a central fire, tables and benches and serpents across the stone floor; a path opens for Rotta. Her safety assurance is not a tested universal law.</p></details><details><summary>Illustration · The Hunger of the Gods · 25</summary><p><a href="assets/85ab51d57f85b9.jpg">Open noncanonical illustration</a></p><p>Skalk and the apprentices raise their flame shields against the workroom assault.</p></details><details><summary>Illustration · The Hunger of the Gods · 23</summary><p><a href="assets/21404a684d2a66.jpg">Open noncanonical illustration</a></p><p>The Galdur tower above its courtyard in Darl.</p></details><details><summary>Illustration · The Hunger of the Gods · 23</summary><p><a href="assets/90f46a250174ce.jpg">Open noncanonical illustration</a></p><p>Skalk and Guðvarr arrive at the tower workroom doorway.</p></details><details><summary>Illustration · The Hunger of the Gods · 25</summary><p><a href="assets/40d56d03b81f76.jpg">Open noncanonical illustration</a></p><p>Jaromir rides away with Vol captive while Ilia follows with the chest.</p></details><details><summary>Illustration · The Fury of the Gods · 8</summary><p><a href="assets/7652d2bc05b35b.jpg">Open noncanonical illustration</a></p><p>Lik-Rifa’s serpent banquet.</p></details></noscript>
