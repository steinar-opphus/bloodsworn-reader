      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 34</summary><h2>Introduction</h2><p>A Battle-Grim warrior at the Wave-Jarl reunion, Ketil has a wide, flat face and an ironic byname because he rarely stops talking. He gazes at Skuld and Ulfrir with awe and disbelief.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Story and connections</h2><p>He jokes about the company’s dragon, wealth and weakened god, then mocks Elvar’s youth. She offers a holmganga; he declines, disclaims interest in Agnar’s bearskin and accepts her chiefship. He teases Sólín as Spittle and questions the gods about saga accounts, several of which they correct.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Story and connections</h2><p>When an unnamed Froa enters the glade he throws a spear into her chest and then runs at her with a burning branch. Ulfrir transforms, seizes him about the waist, tears him in two and swallows part of him. His death is explicit; Elvar’s later demand and Ulfrir’s promise concern preventing further killings, not restoring him.</p></details><details><summary>Illustration · The Hunger of the Gods · 36</summary><p><a href="assets/31dc15c43cda1f.jpg">Open noncanonical illustration</a></p><p>Ketil in conversation at the Wave-Jarl camp.</p></details></noscript>
