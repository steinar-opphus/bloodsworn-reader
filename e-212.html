      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 8</summary><h2>The great rune and the wolf-god’s return</h2><p>Uspa calls the design she carves around Ulfrir’s remains a Guldurstafir, describing it as a runic-stave to channel and focus the power she will summon. This explanation is hers; it does not establish a universal rule for every magical design.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>The great rune and the wolf-god’s return</h2><p>Her design has eight lines like wheel spokes, with Ulfrir at their centre and runes at the tips. She consults Lik-Rifa’s Galdrabok as she carves. When she applies blood and speaks, flame traces the runes and lines towards the bones.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>The great rune and the wolf-god’s return</h2><p>After the airborne rune settles over the bones and fades, the first veins and arteries rise from the soil around Ulfrir’s still-exposed skeleton.</p></details><details><summary>Illustration · The Hunger of the Gods · 8</summary><p><a href="assets/c1e1851d222f75.jpg">Open noncanonical illustration</a></p><p>The first vessels rise from the earth during Ulfrir&#x27;s restoration.</p></details></noscript>
