      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 36</summary><h2>Introduction</h2><p>Sæunn is the collared woman Orka acquires after negotiating with Haga for a Tainted thrall in Starl. She is tall and emaciated, with mouse-brown hair shaved to stubble, bare feet and a muddy threadbare linen tunic. Her iron collar has left red, weeping blisters. She names herself after Orka introduces herself and Halja. Her bloodline, former history and intended task are not disclosed.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>The Hunger of the Gods - chapter 36</h2><p>Orka buys her a sealskin cloak, wool tunic, linen under-tunic, nålbinding socks, elk-hide turn shoes and grey wool winnigas. At first she carries the gift rather than wearing it. Told to put it on, she undresses publicly, exposing a pale thin body with many old and fresh scars. She apologises when Halja explains she meant a place to change, then dresses at Orka’s direction. The behaviour does not demonstrate magical control, and her collar is not removed.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>The third visitor is explicitly named Sæunn in Orka’s viewpoint. Still collared, she stands meekly and silently behind Orka and Halja. Orka tells her to stay close before boarding the Wave-Jarl under Elvar’s truce. Though Elvar offers the visitors seats, Sæunn stands behind Orka. Her bloodline, intended task and the reason for this behaviour remain unstated; neither freedom nor magical compulsion is established.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>Orka calls her from the shadows after the staged raid; moonlight still gleams on her iron thrall-collar. Her intended task is now disclosed. Orka identifies her as Tainted of Hundur’s hound blood and supplies two strips carrying the blood of Myrk’s horse and Myrk’s fresh neck cut. Sæunn sniffs both deeply and says she can track the horse and rider. No actual trail, range or successful destination is yet demonstrated.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>Orka asks to be called Orka rather than mistress, but Sæunn replies mistress Orka. This is not an explicit emancipation or proof of magical compulsion. Orka plans to delay and follow Myrk to her son rather than recapture her immediately.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>At the barn entrance she answers Orka’s readiness question as mistress Orka and is asked to lead. Eyes closed, she deeply sniffs the two bloodstained rags, then moves off at a loping run with Orka’s mounted group following through Starl. The tracking pursuit now begins, beyond her earlier claim that she can follow the samples. No destination, precise range or rescue is yet shown, and the continued address supplies no emancipation.</p></details><details><summary>The Hunger of the Gods · 50</summary><h2>The wolf&#x27;s call across the lake</h2><p>She continues loping along the track without noticing the party has stopped to look across the lake, then runs back to Orka and the gathered companions. This shows the pursuit temporarily pausing; it does not establish a lost trail, failed ability or arrival at the fugitive’s destination.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>She has now tracked Myrk for two days north along Horndal and then east along the northern Bonebacks. At the meadow edge she examines torn grass, says many creatures made the unfamiliar tracks, smells dew-covered fine hairs and identifies frost-spiders. Tracks of skraeling, trolls and faunir also head east.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>In the next trees she finds bark marks and web traces and says the spiders returned to the canopy. She continues after Orka’s caution while Halja watches ahead with eagle-touched sight. At another meadow she and Halja stop at the view of a smoking stockaded farm. No arrival at Myrk’s destination or reunion with Breca occurs.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>She stays with the horses while the party scouts and attacks. Orka gives her a spare spear; she catches it deftly in one hand, reverses her grip and pledges to guard the mounts with her life. After the fight Gunnar and Revna fetch her and the horses, which are tethered at the pig-pen fence. No renewed pursuit or emancipation is shown.</p></details><details><summary>The Hunger of the Gods · 64</summary><h2>The hidden doors into Nastrandir</h2><p>She sustains Myrk&#x27;s scent trail through heavy snow, warns of spider web and pervasive bad scents, then searches the empty Nastrandir hall and reports finding Myrk&#x27;s onward trail.</p></details><details><summary>The Hunger of the Gods · 74</summary><h2>The gate falls and the children flee</h2><p>Orka unlocks and discards her collar, explicitly emancipating her. Tearfully uncertain what to do, she chooses to move the horses to the southern river-lake rendezvous; Orka offers freedom to leave and supplies rather than another compulsory assignment.</p></details><details><summary>The Fury of the Gods · 15</summary><h2>The attack in the snowy valley</h2><p>She is present behind Breca when he reaches Orka, now without her thrall-collar, clothed in leather and fur and carrying a spear. The narration explicitly identifies her as Hundur-tainted. This current appearance continues the earlier emancipation; it does not establish when she obtained this clothing or weapon.</p></details><details><summary>The Fury of the Gods · 17</summary><h2>Escape on Orlyg’s longship</h2><p>Still calling Orka mistress, she urges departure, helps cut down Dagrun’s attackers and climbs aboard the surviving ship. Afterwards she fiercely says staying was everyone’s choice and Spert first refused to leave Orka. Her address does not undo her established emancipation.</p></details><details><summary>The Fury of the Gods · 26</summary><h2>Lessons, mourning and Spert’s barrel</h2><p>She rows with Gunnar and Halja and returns with them at the horn-signalled change, then shares watered ale as Orka watches the training. No independent change to her established freedom or new magic is shown.</p></details><details><summary>The Fury of the Gods · 28</summary><h2>She and Lif accept Orka’s orders to stay alive and protect Breca</h2><p>She and Lif accept Orka’s orders to stay alive and protect Breca. They flank him during boarding; on the knarr she blocks his first attempt to push past and strikes an enemy with her spear. He later gets through to attack another warrior; his safety remains an ongoing duty.</p></details><details><summary>The Fury of the Gods · 29</summary><h2>The fight aboard the stern drakkar</h2><p>She reaches the group defending Vol with short hair, leather and fur and a slim-shafted spear, beside the mailed Lif and the shield-bearing Breca. Their attack helps cut through the druzhina around Einar and Svik.</p></details><details><summary>The Fury of the Gods · 32</summary><h2>Orka introduces her to Edel as a friend in hard times, drawing a tentative smile</h2><p>Orka introduces her to Edel as a friend in hard times, drawing a tentative smile. She helps Lif, Gunnar and Halja clean recovered ring mail. This welcome does not itself establish a new formal Bloodsworn oath.</p></details><details><summary>The Fury of the Gods · 46</summary><h2>The hidden tunnel raid</h2><p>Wearing scavenged ring mail and a plain chin-strapped steel cap, carrying spear and seax without shield, she insists on guarding Orka’s back. A hag ignores her ordinary spear thrusts and grips her throat; Lif destroys it using Vol’s taught words. Orka pulls her upright and she hoarsely repeats the words. She later stabs in the camp fighting. Survival here is shown, without a claim of complete recovery or a new freeing act.</p></details><details><summary>The Fury of the Gods · 61</summary><h2>The shield line under pressure</h2><p>She holds Orka’s right while Breca and Lif cover the other side and Orka supports Varg with her long-axe. No specific new strike or injury is supplied.</p></details><details><summary>The Fury of the Gods · 62</summary><h2>Lif and Sæunn jointly spear and fling away a spider attacking Breca</h2><p>Lif and Sæunn jointly spear and fling away a spider attacking Breca. At Orka’s order they run beside him toward the gates, Vesli overhead with a short spear, while Orka later turns back to Svik. Their safe entry is not yet shown.</p></details><details><summary>The Fury of the Gods · 70</summary><h2>Lif and Sæunn flank Breca and join the push through the Raven-Feeders alongside Orka/Halja/Glornir</h2><p>Lif and Sæunn flank Breca and join the push through the Raven-Feeders alongside Orka/Halja/Glornir. The account supplies no distinct new wound or individually named victim for either.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>Lif and Sæunn protect Breca a dozen steps behind Orka during the climb</h2><p>Lif and Sæunn protect Breca a dozen steps behind Orka during the climb. No separate new wound or named individual kill is supplied before the hilltop clash.</p></details><details><summary>The Fury of the Gods · 74</summary><h2>Snaka rises and Wolfdales collapses</h2><p>Lif and Sæunn protect Breca amid the hilltop fighting, then try to reach Orka with him as the ground collapses. Orka gathers Breca and the party follows Glornir to the cliff; this passage does not individually narrate every follower’s leap or landing.</p></details><details><summary>The Fury of the Gods · 76</summary><h2>Surviving the plunge into the Falinn</h2><p>Directly present among the surviving Bloodsworn at the treeline beyond the downriver bend with Glornir/Vol, Halja, Gunnar, Lif and Sæunn. The chapter confirms this survival without resolving every missing ally.</p></details><details><summary>The Fury of the Gods · 79</summary><h2>She credits Orka with setting her free and affirms her freedom, without dating the past deed</h2><p>She credits Orka with setting her free and affirms her freedom, without dating the past deed. Halja later suggests she desires Lif; Sæunn returns asking what the looks mean, so the suggestion is not treated as her own confession or a completed relationship.</p></details><details><summary>The Fury of the Gods · 83</summary><h2>Sæunn stays with Breca at Orka’s right, Gunnar/Halja to her left as they advance through the battle</h2><p>Sæunn stays with Breca at Orka’s right, Gunnar/Halja to her left as they advance through the battle. No separate new wound/final fate is given for these companions in this passage.</p></details><details><summary>The Fury of the Gods · 86</summary><h2>Orka and Breca confront Drekr</h2><p>She fights with Gunnar/Halja and remains at Breca’s shoulder as he approaches Orka during the poisoned Drekr’s collapse. The scene does not give her a separate new wound or final individual kill.</p></details><details><summary>The Fury of the Gods · 90</summary><h2>The last assault on Lik-Rifa</h2><p>Lif and Sæunn fight with Orka’s party and help her rise after Glornir’s death while she is hurt in ribs/leg. No new personal wound or additional revenge result is supplied.</p></details><details><summary>Illustration · The Hunger of the Gods · 36</summary><p><a href="assets/484ecfd4c15ece.jpg">Open noncanonical illustration</a></p><p>Sæunn after leaving the thrall-square, before Orka buys her new clothing.</p></details></noscript>
