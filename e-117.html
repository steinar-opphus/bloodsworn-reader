      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 13</summary><h2>Introduction</h2><p>Sergei identifies Prince Jaromir as the Great Khagan’s son.</p></details><details><summary>The Shadow of the Gods · 13</summary><h2>Story and connections</h2><p>Jaromir accuses Sulich of great crimes. He promises to return next day with evidence and witnesses.</p></details><details><summary>The Shadow of the Gods · 18</summary><h2>Mounted druzhina block the docks</h2><p>In B01-C018, Jaromir blocks the Bloodsworn with mounted druzhina, Ilia beside him. He says he intended to present a petition and evidence to Logur, then accuses the Bloodsworn of fleeing because they are guilty. No evidence is presented in this chapter.</p></details><details><summary>The Shadow of the Gods · 18</summary><h2>Mounted druzhina block the docks</h2><p>He demands Sulich and threatens the crew and ship; two torch-bearing riders wait at the pier entrance. When Glornir refuses, Jaromir shoots an arrow, orders a large volley and leads a lance charge. The fighting stops when the three eagle-bannered drakkar appear.</p></details><details><summary>The Shadow of the Gods · 20</summary><h2>A complaint brought before Helka</h2><p>Jaromir introduces himself to Helka as Kirill the Great’s son and complains about Logur denying his request and his warriors’ blood being spilled. Helka takes the grievance to Logur’s hall. No verdict on his allegations is shown in B01-C020.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>The fugitives reach Darl</h2><p>He attends Helka’s private gathering in a green wool-and-silk kaftan, baggy breeches and leg-wraps, his head shaved except for one fair braid and his skin weathered dark by the sun. He recognises Vol and demands the Bloodsworn’s whereabouts.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>The fugitives reach Darl</h2><p>He objects that Skalk’s return without them is not what was promised. Helka explains the intended reckoning when they returned for payment, and conditionally offers to help hunt them. His underlying accusations against Sulich are not adjudicated here.</p></details><details><summary>The Hunger of the Gods · 21</summary><h2>An audience with Queen Helka</h2><p>Guðvarr hears muffled voices behind Helka’s door and thinks he catches the words “give” and “Seiðr-witch”. Jaromir emerges visibly furious and storms away. The conversation’s exact subject, request and outcome remain unestablished; the fragment does not identify a particular witch.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>The assault on the workroom</h2><p>His mounted archers enter the tower through the breach made by Taras. Jaromir arrives in lamellar armour with a curved sword beside the collared tattooed Iva; he whistles the hawk onto his arm. The bird has just badly injured Skalk. Association with the hawk is observed, not a disclosed magical spying ability.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>The assault on the workroom</h2><p>He pauses silhouetted against grey dusk. While waiting for the chest he strokes the hawk’s head; its beak is blood-flecked and its talons red.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>The assault on the workroom</h2><p>He disparages Darl’s rune-work compared with Iskidan’s Seiðr and Tainted thralls, saying he has not brought a necromancer. Iva overcomes the flames and opens a fissure, then at his order frees Vol from the table through rapid rusting. He approves of Vol’s stitched lips and takes her captive over his saddle.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>The assault on the workroom</h2><p>Ilia retrieves the wooden chest. He identifies its contents as the bones of great Hraeg and expects his father to reward them; that provenance remains his claim. He leaves through the breach with Vol and the chest while fighting continues.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>Guðvarr publicly reports his departure with Vol and the chest, including the claimed Hraeg identification. Skalk describes the Seiðr-witch and Tainted thrall he brought as powerful; this remains Skalk’s assessment.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>Helka condemns his assault as an insult from a guest and hires the Bloodsworn to hunt and capture him. Glornir’s accepted terms call for the later delivery of Jaromir or his head. The commission is agreed, not a completed capture or new sighting of him.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>Svik says Jaromir and his druzhina come from northern Iskidan, contrasting them with the southern Bruised Men. This does not establish Sulich’s birthplace or a precise shared skin colour.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>Helka promises another chest of silver for his delivery. As the Bloodsworn leave Darl, Sulich predicts Jaromir will hurry to Iskidan and says his ships are at Liga. The intended interception does not locate Jaromir himself or recover Vol.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>Logur tells Glornir he has already restocked and left Liga. Glornir later reports arrival three days earlier, a wait for two additional druzhina parties and departure two days earlier in three drakkar and two horse-carrying knarr. The Bloodsworn cast off in pursuit towards Iskidan. These are reports and the pursuers’ destination, not a new direct sighting or a completed interception.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>A bound druzhina found at the parasite pool says he was not on their horse-knarr, which separated from his drakkar in sea-mist and was captured among the islands. The witness says Jaromir still has Glornir’s woman and is taking her to Valdai. This adds secondhand fleet and destination information, without a new direct sighting or confirmed arrival.</p></details><details><summary>The Hunger of the Gods · 63</summary><h2>A shortcut through the mountains</h2><p>Sulich now explicitly calls him his half-brother and judges that he will not send scouts so close to Valdai. The company prepares an ambush, but his actual arrival is not yet shown.</p></details><details><summary>The Hunger of the Gods · 66</summary><h2>Sulich&#x27;s lineage and the ambush</h2><p>Sulich identifies him as Kirill&#x27;s son, his own paternal half-brother and Rurik&#x27;s twin, while leaving the motive for hunting Sulich uncertain. Jaromir arrives at the ambush with his hawk and druzhina, threatens the company and orders Iva to clear the road. Vol rides shackled behind her.</p></details><details><summary>The Hunger of the Gods · 68</summary><h2>The cavalry charge and the shield wall</h2><p>His cavalry is disrupted by a hidden ditch and flank ambush. He escapes the melee with Vol&#x27;s tied horse on a lead rope and about a dozen riders; Glornir orders pursuit.</p></details><details><summary>The Hunger of the Gods · 70</summary><h2>The pursuit into Valdai</h2><p>The Bloodsworn pursue Jaromir across the sun-bleached plain towards Valdai, under high hot sun and through the riders&#x27; dust. The company numbers fifty men and women. Vol rides her own horse behind Jaromir, while the mounted Røkia and Sulich pass in among the retreating druzhina before the gates close.</p></details><details><summary>The Hunger of the Gods · 70</summary><h2>The pursuit into Valdai</h2><p>He reaches Valdai with Vol, uses her as a hostage and kills Ingmar while retreating into the hall. Vol pursues and kills him with oak-door splinters; subsequent narration calls him a corpse. His threat of Rurik&#x27;s revenge remains prospective. A Vigrið map and hidden prison are found in his chamber.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>Glornir says the fleets are the invasion he and Rurik planned</h2><p>Glornir says the fleets are the invasion he and Rurik planned. This refers to planning and an attributed fleet identity, not a direct sighting of Jaromir aboard or a new confirmed present fate.</p></details><details><summary>Illustration · The Hunger of the Gods · 70</summary><p><a href="assets/e546af7cc877e5.jpg">Open noncanonical illustration</a></p><p>The Bloodsworn pursue their enemies through the gates of Valdai.</p></details><details><summary>Illustration · The Hunger of the Gods · 25</summary><p><a href="assets/40d56d03b81f76.jpg">Open noncanonical illustration</a></p><p>Jaromir rides away with Vol captive while Ilia follows with the chest.</p></details></noscript>
