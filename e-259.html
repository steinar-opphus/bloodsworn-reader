      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>Under interrogation, Myrk names the coast off the Iskalt Islands as a westward rendezvous planned after the Isbrún crossing. She says Lik-Rifa ordered her to bring her father there and does not explain the god’s purpose.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>Orka feels relief at a destination to aim for but doubts Myrk’s truthfulness. No arrival, present position of Breca or actual rendezvous is shown.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>This reported plural place-name is kept separate from the earlier singular Iskalt Island. Their exact geographic relationship or identity is not established in this account.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>Orka repeats Myrk’s western meeting lead near these islands to Elvar, who calls the prisoner a liar and says the Raven-Feeders’ tracks led east at Isbrún Bridge. Sighvat confirms the track report. This challenges the route Orka has relied on, without proving Myrk’s intent, excluding changed orders or establishing an actual rendezvous here.</p></details></noscript>
