      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 41</summary><h2>The approach to the excavation</h2><p>The site lies near a waterfall valley in the Bonebacks. A path leads to a muddy clearing and a wide, torchlit arched tunnel in a cliff. Ragged, skeletal captives in iron collars haul rubble out in pony-drawn carts, guarded by spear-bearing warriors and skraelings. Its purpose is not yet known.</p></details><details><summary>The Shadow of the Gods · 43</summary><h2>The battle beneath the cliff</h2><p>The Bloodsworn attack the glade, where captives flee and guards force others into the tunnel. A troll and the unnamed bone-sword wielder emerge from the tunnel and counterattack; the battle remains unresolved when Varg loses awareness.</p></details><details><summary>The Shadow of the Gods · 45</summary><h2>Waking among the wounded</h2><p>The survivors occupy an excavated underground catacomb. Torvik reports Vol’s belief that it is Rotta’s chamber, and describes extensive tunnels, barracks, kitchens, horse stabling and hundreds of child-sized mattresses. These descriptions and the chamber identification are his report.</p></details><details><summary>The Shadow of the Gods · 47</summary><h2>The Bloodsworn reveal their ancestry</h2><p>Varg passes a large chamber with a scarred stone slab, chains and four wrist-and-ankle collars. Outside, the troll is dead and Jökul is freeing surviving captives from their iron collars.</p></details><details><summary>The Hunger of the Gods · 15</summary><h2>The search through Rotta&#x27;s chamber</h2><p>Edel’s party returns to a clearing containing decomposed troll, skraeling and human bodies, abandoned carts and four fresh barrows. Orka recognises the old dragon-born’s corpse; his dragon tattoo matches designs she has seen elsewhere, without establishing their wider meaning.</p></details><details><summary>The Hunger of the Gods · 15</summary><h2>The search through Rotta&#x27;s chamber</h2><p>The damp passages contain small side rooms and a large central slab with four chains ending in shattered, very large manacles. Gunnar says excavation is incomplete. He and Revna recount Rotta’s punishment as saga-tales rather than independently observed history.</p></details><details><summary>The Hunger of the Gods · 15</summary><h2>The search through Rotta&#x27;s chamber</h2><p>A damaged writing room holds rolled parchments, ink jars and bone writing implements. Gunnar reads one heading as copies of Rotta’s Galdrabok fragments. Revna says Skalk stole a chest with more scrolls and Orna’s talon; Orka requests the remaining parchments be gathered.</p></details><details><summary>The Hunger of the Gods · 15</summary><h2>The search through Rotta&#x27;s chamber</h2><p>The party directly sees the room of small straw mattresses. Spert and Vesli single out one, and Spert says Breca was there. Orka stays to search, advising camp outside because the underground complex has only one entrance.</p></details><details><summary>The Hunger of the Gods · 18</summary><h2>Training and an encounter in the rain</h2><p>After a rainy morning of training in the nearby woods, Orka’s escort hides as Raven-Feeders enter the clearing. Their unnamed leader grieves over a corpse while companions inspect the site, including two entering the chambers. Orka steps out intending to question her about Breca. The conversation and any fight remain unshown.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>Halja describes the buried tunnels, pitted slab, collar and chains to Ulfrir, while admitting she does not know whether Snaka’s ruin buried the place. Ulfrir identifies it as Rotta’s chamber and claims he himself fixed the punishment chains there and watched serpent venom burn Rotta. This is his historical account; the burial cause, escape mechanism and Rotta’s present fate remain unknown.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>Halja recounts the investigation, liberation of captives and later return with Orka, including the small mattresses. She tentatively identifies copied pages as Raudskinna material, recounts Skalk’s theft of the talon, writings and Vol, and explains the encounter behind Myrk’s capture. These are retrospective reports, not another battle or new current occupation of the site.</p></details></noscript>
