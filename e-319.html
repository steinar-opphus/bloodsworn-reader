      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 8</summary><h2>The gathering in the Galdur tower</h2><p>A grey-skinned, thick-muscled skraeling at Lik-Rifa&#x27;s tower meal, she eats directly from her plate and displays fangs. Guðvarr first doubts her sex, but later narration refers to her as she. Ilska assigns her and her unnamed clan to hunt Estrid and Skalk with Sigrún and Guðvarr, taking any vaesen needed. Lik-Rifa endorses the assignment; the hunt has not begun on-page.</p></details><details><summary>The Fury of the Gods · 18</summary><h2>Her clan and accompanying vaesen lead the hunt west after scouts and a goat farmer’s report</h2><p>Her clan and accompanying vaesen lead the hunt west after scouts and a goat farmer’s report. Sigrún says the pace is hers to decide. At an ash tree Krúsa explains that her kind dislike Froa, attributes their origin to Snaka and lists Lik-Rifa’s children, while saying Froa are powerful and not every ash tree now has one. These are her claims, not a complete universal taxonomy.</p></details><details><summary>The Fury of the Gods · 18</summary><h2>Her clan and accompanying vaesen lead the hunt west after scouts and a goat farmer’s report</h2><p>She shows yellowed fangs and tusks while mocking Guðvarr’s bravery. When a frost-spider enters the tree she shouts a warning, then backs away from the emerging Froa and calls it a mistake. The Froa attacks with vines; Krúsa orders her people away and flees the glade.</p></details><details><summary>The Fury of the Gods · 20</summary><h2>At camp she warms her hands, says she likes fire and introduces the scout Munni</h2><p>At camp she warms her hands, says she likes fire and introduces the scout Munni. She translates Maður as humans and rewards him with teeth for reporting a group ahead. She predicts an encounter soon despite his uncertain count. Later she orders Sigrún’s people to lead, saying they need glory before her Mother-Maker while she does not, and refuses Guðvarr’s protest. Her knowledge of their private plan is not demonstrated.</p></details><details><summary>The Fury of the Gods · 20</summary><h2>At camp she warms her hands, says she likes fire and introduces the scout Munni</h2><p>She and her skraeling enter the boulder glade after Skapti appears; frost-spiders gather at its edge. The source ends at his information offer, without a fight or disclosed bargain.</p></details><details><summary>The Fury of the Gods · 31</summary><h2>The hunters enter Jarnvidr</h2><p>She crosses after Sigrún’s drengrs with Skapti among her skraeling, while frost-spiders spread overhead. Hearing a disturbance, she sends Munni into the woods and draws a dark-iron, thick-bladed weapon with a long two-handed grip. The spiders bring a bitten Faunir. She repeats her Snaka/Lik-Rifa distinction, claims Faunir blood kills spiders and warns killing the captive could provoke unseen companions. Accepting Sigrún’s hostage plan, she resumes the march with the captive carried behind the riders; no promised release occurs yet.</p></details><details><summary>The Fury of the Gods · 34</summary><h2>She cannot keep the hostage gagged and moves away from its insults</h2><p>She cannot keep the hostage gagged and moves away from its insults. Munni reports the opponents’ numbers to her. She learns the wolf-god report, urges that Lik-Rifa wants him, and agrees with Sigrún to carry the proposed service/alliance offer, with tennúr messengers. She warns of the Faunir arrival and retreats with surviving skraeling; Sigrún cuts a Faunir from her shoulders. Her earlier warning of nearby kin is now borne out by an actual attack, but this is not proof of every blood/taxonomy claim.</p></details><details><summary>The Fury of the Gods · 41</summary><h2>She returns from Jarnvidr with reduced forces and explains they fought Faunir</h2><p>She returns from Jarnvidr with reduced forces and explains they fought Faunir. Munni lands on her shoulder with further news from Estrid/Skalk and she relays the wolf’s move to his den. Lik-Rifa praises her and the returning party. No hostage is with them, consistent with its earlier rescue by Faunir.</p></details><details><summary>The Fury of the Gods · 45</summary><h2>At dawn Guðvarr sees her kneeling to kindle a campfire shortly before a tennúr’s warning</h2><p>At dawn Guðvarr sees her kneeling to kindle a campfire shortly before a tennúr’s warning. The warning does not establish an attack or a new injury to her.</p></details><details><summary>The Fury of the Gods · 78</summary><h2>Krúsa and Glunn are among the captains directly back at the shattered enemy camp with Drekr/Sigrún</h2><p>Krúsa and Glunn are among the captains directly back at the shattered enemy camp with Drekr/Sigrún. The others’ absence so far is not a full death list.</p></details><details><summary>The Fury of the Gods · 82</summary><h2>Sigrún falls and Lif confronts Guðvarr</h2><p>She leads skraeling to wounded Sigrún, stands over her and kills an unnamed lean thinning-haired Battle-Grim after breaking his shield. The huge red-haired axeman then decapitates Krúsa and steps over her corpse. Her death is directly observed; the killer’s canonical name remains unassigned.</p></details><details><summary>Illustration · The Fury of the Gods · 8</summary><p><a href="assets/7652d2bc05b35b.jpg">Open noncanonical illustration</a></p><p>Lik-Rifa’s serpent banquet.</p></details><details><summary>Illustration · The Fury of the Gods · 18</summary><p><a href="assets/a3dffdca08899d.jpg">Open noncanonical illustration</a></p><p>The first vines erupting in the ash-tree glade.</p></details></noscript>
