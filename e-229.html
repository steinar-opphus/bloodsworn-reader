      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 16</summary><h2>Introduction</h2><p>Svard is a petty jarl sworn to Helka, present at her private gathering in fine wool and silver ornaments. He and Glunn rule areas of land; their precise territories are not supplied.</p></details><details><summary>The Hunger of the Gods · 41</summary><h2>Sigrún&#x27;s reckoning with Guðvarr</h2><p>Sigrún names him with Glunn and Illur Storm-Crow as petty jarls she believes covet her lands after Orka made her appear weak. The alleged ambition is Sigrún’s assessment, without a new speech or overt action by Svard.</p></details><details><summary>The Fury of the Gods · 2</summary><h2>He is brought under guard before Lik-Rifa at Darl</h2><p>He is brought under guard before Lik-Rifa at Darl. Older, slimmer and taller than Glunn, he declares that Helka&#x27;s death ends his oath without binding him to her children. He offers allegiance to the god, but she orders a contest: Glunn takes the seax and stabs him as he reaches for the axe. He collapses and becomes still; Glunn claims his possessions and followers, who assent.</p></details></noscript>
