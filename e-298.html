      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 57</summary><h2>Introduction</h2><p>Gudleif is the white-haired survivor who introduces himself after the fight at the stockaded farm. Tall, lean and wiry, he limps and has a thick scar through his chin and grief-reddened eyes. He thanks Orka; she credits Lif with the decision to help. No kinship to the other defenders is given.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>Story and connections</h2><p>He explains the residents’ arrangement with the giant ravens: food and a safe place to rest for news and protection. He considers them his best news source despite preferring isolation, and answers Revna’s criticism of their late protection by pointing out that they came. The ravens’ actual intervention is observed, while the ongoing trade is his account.</p></details><details><summary>Illustration · The Hunger of the Gods · 57</summary><p><a href="assets/937c11bf05634c.jpg">Open noncanonical illustration</a></p><p>Gudleif after the fight at the stockaded farm, in a composed character study.</p></details></noscript>
