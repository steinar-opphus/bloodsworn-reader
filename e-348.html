      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 22</summary><h2>The Fury of the Gods - chapter 22</h2><p>A lean straw-haired thrall-guard with a sharp-lined shadowed face stands at Orlyg’s side and is named Tjorvi. Narration identifies him as Úlfhéðnar. He says he and the Tainted rowers he indicates have heard Ulfrir’s call in dreams, but had not told Orlyg because he had not asked. This is their reported experience, not a universal rule of compulsory disclosure or obedience.</p></details><details><summary>The Fury of the Gods · 28</summary><h2>He boards with Orlyg’s company</h2><p>He boards with Orlyg’s company. After Orlyg wounds the last guard on the stern attacker, Tjorvi finishes the man with an axe blow to the head.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>Orlyg frees about twenty collared Tainted followers and offers them ordinary service as drengrs</h2><p>Orlyg frees about twenty collared Tainted followers and offers them ordinary service as drengrs. Tjorvi is not named individually during the ceremony, so the directly recorded outcome is this group action by his established chief.</p></details><details><summary>Illustration · The Fury of the Gods · 22</summary><p><a href="assets/e06e9438bb0882.jpg">Open noncanonical illustration</a></p><p>Orlyg’s stern discussion on the way to the sea.</p></details></noscript>
