      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 9</summary><h2>The serpent and the captive family</h2><p>Grend says Lik-Rifa was trapped beneath Oskutreð, the Ash Tree.</p></details><details><summary>The Shadow of the Gods · 15</summary><h2>Grief and the decision to leave</h2><p>In B01-C015, the narrator describes it as the great tree that stood at the heart of Vigrið during the gods-fall. The local Froa is described as born from one of its seeds. Her local tree has its own location and destruction account.</p></details><details><summary>The Shadow of the Gods · 27</summary><h2>A raid and a stolen child</h2><p>Uspa claims to know the way to Oskutreð; Elvar overhears the whispered disclosure.</p></details><details><summary>The Shadow of the Gods · 29</summary><h2>The hidden book and the road ahead</h2><p>Uspa confirms Elvar&#x27;s account that Oskutreð lies beyond the vaesen pit, Isbrún Bridge and Dark-of-Moon Hills. Uspa says she burned the book to prevent treasure-seekers finding god-remains and provoking new powers and war. Uspa agrees to guide the group to Oskutreð first if all present swear the blóð svarið.</p></details><details><summary>The Shadow of the Gods · 48</summary><h2>Chapter 48 — The stump and guardian</h2><p>In chapter 48 Uspa leads the Battle-Grim to its immense blackened stump on an ash-covered battlefield. A living ash grows beside a huge bolted trapdoor that trembles rhythmically. Vörn emerges from the living tree and prohibits touching the old stump.</p></details><details><summary>The Shadow of the Gods · 48</summary><h2>Chapter 48 — The stump and guardian</h2><p>The stump is wide as a lake, but its jagged remains stand only perhaps two men high.</p></details><details><summary>The Shadow of the Gods · 48</summary><h2>Chapter 48 — The stump and guardian</h2><p>When Sighvat attacks her, she disarms him, strikes him down and binds him with vines rising from the ash-covered ground.</p></details><details><summary>The Shadow of the Gods · 52</summary><h2>Chapter 52 — The ritual at the sealed door</h2><p>Ilska’s followers use a red-hide book, collared children and spilled blood in a rite at the sealed door. It bursts open, freeing Lik-Rifa and scattering combatants. The living guardian’s defence is overcome before the release.</p></details><details><summary>The Hunger of the Gods · 2</summary><h2>A burial and a surviving gaoler</h2><p>The surviving Battle-Grim bury Agnar and search the ash plain for treasure. They hold the red-winged gaoler, now named Skuld, whom Elvar collars. Skuld claims the real treasure is below the shattered tree.</p></details><details><summary>The Hunger of the Gods · 4</summary><h2>The descent beneath Oskutreð</h2><p>Below its shattered opening, a wagon-wide ledge spirals into root-filled caverns with torches, chests, living quarters and a forge. The company loads silver and gold; deeper lies Vergelmir, identified by Skuld, and a rune-protected black book.</p></details><details><summary>The Hunger of the Gods · 4</summary><h2>The descent beneath Oskutreð</h2><p>Huld&#x27;s crossing of the book&#x27;s rune boundary triggers a blast, followed by an unidentified grey slime-covered attacker.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>A collar and the wolf-god&#x27;s return</h2><p>In the forge below, Uspa, Elvar, Grend and Sighvat make the new collar. Above ground the company participates in Ulfrir’s resurrection among his uncovered remains. He rises as a great wolf, then collapses and changes into a wounded man.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>Elvar Chainbreaker and the hillside stand</h2><p>Elvar’s slim-hafted gift axe is again described as from Oskutreð during the hillside stand, repeating the chapter9 provenance rather than newly revealing its origin or demonstrating a new power.</p></details><details><summary>Illustration · The Shadow of the Gods · 53</summary><p><a href="assets/9556c706ab833e.jpg">Open noncanonical illustration</a></p><p>Ilska recites at Oskutreð before the sealed door opens.</p></details><details><summary>Illustration · The Shadow of the Gods · 53</summary><p><a href="assets/7d9135d98b7946.jpg">Open noncanonical illustration</a></p><p>Oskutreð&#x27;s immense ruined stump before its guardian emerges.</p></details><details><summary>Illustration · The Shadow of the Gods · 53</summary><p><a href="assets/eb790d69f84ecc.jpg">Open noncanonical illustration</a></p><p>Vörn binds Sighvat to the ground with growing vines after disarming him.</p></details></noscript>
