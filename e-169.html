      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 29</summary><h2>The Grey Skin and its theft</h2><p>Uspa calls the Graskinna or Grey Skin a Galdrabok of dark magic that gives the way to Oskutreð to those who understand it. Uspa says she destroyed the Graskinna in the fire pool on Iskalt while Berak fought the troll. Uspa says she and Berak stole the Graskinna from the Raven-Feeders, who have hunted them for a long time.</p></details><details><summary>The Shadow of the Gods · 44</summary><h2>On the road through the Dark-of-Moon Hills</h2><p>When asked for a precise remaining distance, Uspa describes the Graskinna as a Galdrabok rather than a map.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>Uspa supplies further context for the earlier theft and destruction testimony: she and Berak had travelled with Ilska, then judged her plans to seek vengeance and death rather than justice. Their aim in destroying the book was to end those plans and save people from enslavement, torture and death. These are Uspa’s stated motives, without merging the Graskinna with the Raudskinna or another Galdrabok.</p></details><details><summary>The Shadow of the Gods · 29</summary><h2>The Grey Skin and its theft</h2><p>Her renewed account confirms the earlier testimony of theft and destruction.</p></details></noscript>
