      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 4</summary><h2>Introduction</h2><p>He drives the pony wagon on the descent beneath Oskutreð. He is tall and willow-slender, with thinning greasy fair hair and a hooked nose.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>A duel for the Battle-Grim</h2><p>He acts as Huld’s second, ready with two spare shields as permitted in the contest, while she waits armed with sword, shield and seax. His already registered tall, slender, greasy-haired appearance is confirmed rather than assigned a new identity.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>During the Wave-Jarl camp’s discussion he describes Lik-Rifa as huge enough to blot out the sun. This is his vivid description to Ketil, not a measured size or a new sighting of the dragon.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The laden ship reaches Starl</h2><p>Elvar selects him with Sighvat and Orv for the sole permitted provisioning party at Starl. The others must stay aboard to keep the hoard and gods secret. The ship docks, but the ensuing confrontation ends the chapter before any purchase or provisioning trip by him is shown.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>Salvage and a choice about freedom</h2><p>He guards Elvar during the bruise inspection and later follows with Berak, Thorguna and Sighvat, whose service is freely affirmed. No new bloodline or individually described collar removal is assigned to him.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>Orv and Urt walk out together among the surviving Battle-Grim/captains</h2><p>Orv and Urt walk out together among the surviving Battle-Grim/captains. No new injury, full roster or individual later assignment is supplied.</p></details></noscript>
