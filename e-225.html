      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 15</summary><h2>The search through Rotta&#x27;s chamber</h2><p>Rolled parchments sit in wall holes in a damaged writing room at the excavation. Gunnar reads one heading as a copy made from fragments of Rotta’s Galdrabok. A complete original is not demonstrated by that heading.</p></details><details><summary>The Hunger of the Gods · 15</summary><h2>The search through Rotta&#x27;s chamber</h2><p>Orka asks Gunnar and Revna to collect the writings for Glornir and Vol. Revna says Skalk stole a chest holding many more scrolls and Orna’s talon. The surviving copies are kept distinct from accounts of the original Raudskinna and from Lik-Rifa’s book.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>The fugitives reach Darl</h2><p>Skalk opens the chest at Darl, revealing scrolls, black-iron tools and grey-white bones. He explicitly calls the manuscripts copies rather than originals, and tentatively identifies their source as Rotta’s Raudskinna. His qualification is retained; the remaining bones are unidentified.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>The assault on the workroom</h2><p>Ilia retrieves the workroom’s wooden chest, which Jaromir identifies by the bones he calls Hraeg’s. He expects his father to reward them and leaves with the chest. This is an attributed identification of its relic contents, not a change to the manuscripts’ earlier copy/source identifications.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>Halja reports the copied pages to the Battle-Grim and says they thought the source might be the Raudskinna. Uspa infers their connection to Lik-Rifa’s release. Halja also recounts Skalk taking some fragments and other items. These are the attributions and history brought to the meeting, not proof of an intact original or a new present transfer.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>Skalk says Helka has seen the copied pages and again tentatively identifies their source as Raudskinna. He claims the fragments discuss resurrection and proposes checking for spell gaps and testing Galdur-runes before attempting Orna’s return. These are his readings and planned work; the copies remain distinct from intact books, and completeness is not established.</p></details></noscript>
