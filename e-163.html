      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 23</summary><h2>Introduction</h2><p>Gytha is Störr&#x27;s champion. Gytha has braided dark hair and a scar through a cheek into her upper lip.</p></details><details><summary>The Shadow of the Gods · 23</summary><h2>Story and connections</h2><p>At her chapter 23 tavern entrance she wears fine war gear, her brynja gleaming as if freshly scrubbed with sand.</p></details><details><summary>The Shadow of the Gods · 25</summary><h2>A choice of loyalties</h2><p>Gytha brushes Grend&#x27;s arm as she passes; no relationship is established by this gesture.</p></details><details><summary>The Hunger of the Gods · 67</summary><h2>Elvar returns to her father&#x27;s hall</h2><p>Störr&#x27;s champion has tightly braided dark hair and a scar through her cheek into her lip. She watches Grend as Elvar&#x27;s group enters; no explanation of that attention is supplied.</p></details><details><summary>The Hunger of the Gods · 69</summary><h2>Bargaining for the Berserkir</h2><p>She demands Grend stand down and says she cannot allow weapons raised against Störr or his oathsworn. She closes in with the drengrs as the Berserkir advance; her earlier glance proves no other relationship.</p></details><details><summary>The Fury of the Gods · 3</summary><h2>The burden of ruling Snakavik</h2><p>She accompanies Grend to the assembly and offers to serve Elvar as she served Störr, recognising birthright and victory. The captains then voice their readiness individually. This is offered allegiance, with no completed oath ceremony shown.</p></details><details><summary>The Fury of the Gods · 19</summary><h2>Mail-clad with dark hair tightly braided, she attends the new council</h2><p>Mail-clad with dark hair tightly braided, she attends the new council. Asked for Grend, she says he left her chambers at dawn and she has not seen him since. This is her limited account, without specifying what occurred there or where he went.</p></details><details><summary>The Fury of the Gods · 33</summary><h2>The tide and the search for Grend</h2><p>She has searched for Grend through the previous night without sleep and says all who can be spared still search. After Elvar accepts Ákveðin, Gytha reaches into her belt pouch for something carrying Grend’s scent; the narration does not identify the object before Hjalmar arrives with him.</p></details><details><summary>The Fury of the Gods · 35</summary><h2>The fleet leaves Snakavik</h2><p>She guards the sail-room entrance, steps aside for Elvar and takes Grend’s mail and weapons from Hjalmar’s returned bundle. She is not shown fitting the collar or offering wound treatment.</p></details><details><summary>The Fury of the Gods · 38</summary><h2>Her horn carries the course change through the fleet</h2><p>Her horn carries the course change through the fleet. At Wolfdales she lands with about twenty drengrs who fan out to search the undergrowth, while Berak and Berserkir form around Elvar. No attack is described during the landing.</p></details><details><summary>The Fury of the Gods · 40</summary><h2>Councils and secrets in Wolfdales</h2><p>She discusses shield walls and boar-snout tactics in the Wolfdales council before Silrið’s magic talk and Ulfrir’s bait plan. No final manoeuvre or battle execution is shown.</p></details><details><summary>The Fury of the Gods · 52</summary><h2>She lunges at Broðir to protect Elvar, but Runa tackles her with sword in hand</h2><p>She lunges at Broðir to protect Elvar, but Runa tackles her with sword in hand. They grapple and fall over the palisade. Gytha survives and pins Runa’s wrist with one foot on the bridge, sword at her throat; Elvar orders the captive alive. No new wound or execution is stated.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>At Elvar’s order she calls reserve drengrs to search Wolfdales for the reportedly fled plotters</h2><p>At Elvar’s order she calls reserve drengrs to search Wolfdales for the reportedly fled plotters. No capture or completed search result is shown.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>Elvar Chainbreaker and the hillside stand</h2><p>She sounds the horn at Elvar’s instruction before the hall doors close, then urges Elvar to reconsider standing in front. Elvar refuses; Gytha says she is honoured to serve and that the jarl is not her father. She takes position behind Elvar with Berak and Sólín.</p></details><details><summary>The Fury of the Gods · 63</summary><h2>The stone doors and the retreat inside</h2><p>She accompanies Elvar and sounds three sharp horn blasts at her instruction before the hall doors reopen after a delay. No separate casting or new injury is attributed to her.</p></details><details><summary>The Fury of the Gods · 65</summary><h2>Losses and plans after the retreat</h2><p>She is with Elvar, Grend, Sólín and Thorguna in the bedchamber, then leaves with Grend by the rear tunnel where her rooms lie. No new romantic/family meaning or complete tunnel map is supplied.</p></details><details><summary>The Fury of the Gods · 67</summary><h2>She and Grend arrive through the rear door with mail/shields/weapons during the attack</h2><p>She and Grend arrive through the rear door with mail/shields/weapons during the attack. The chapter does not name her as the initial spear defender or show her final counterattack/outcome.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>Leif’s death and the tunnel escape</h2><p>Grend leads a delayed group including Uspa, Berak and Gytha, with Berserkir/drengrs carrying Hrung in sailcloth. Varg alerts Ulfrir, who shelters the party and takes Hrung’s cloth in his jaws to the tunnel entrance; they follow into the passage.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>The survivors’ camp and reunion</h2><p>Gytha and Berak emerge with Elvar’s captains, help Grend/Uspa set Hrung upright and take part in camp after the memorial. The scene confirms their survival without a full wound inventory.</p></details><details><summary>The Fury of the Gods · 81</summary><h2>The charge against the gods</h2><p>The captains join the loose charge: Orlyg/Logur lead their warriors, Sighvat the Battle-Grim, and Grend/Gytha Elvar’s drengrs with Berserkir/Úlfhéðnar. This is a renewed allied assault, not its final outcome.</p></details><details><summary>Illustration · The Shadow of the Gods · 23</summary><p><a href="assets/ae23d4029fcd0c.jpg">Open noncanonical illustration</a></p><p>Gytha entering the Snakavik tavern in freshly cleaned war gear.</p></details><details><summary>Illustration · The Fury of the Gods · 75</summary><p><a href="assets/855fc6762a4e54.jpg">Open noncanonical illustration</a></p><p>Ulfrir carrying Hrung’s sailcloth and shielding the delayed party.</p></details></noscript>
