      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 19</summary><h2>Appearance</h2><p>A wool-and-honey trader introduced by Orv, she wears a finely embroidered wool tunic, sealskin cloak, fur-trimmed felt hat and thick mittens. Her physical features are otherwise unspecified. She remains distinct from the earlier same-name person in Brák’s scream report.</p></details><details><summary>The Fury of the Gods · 19</summary><h2>The Fury of the Gods - chapter 19</h2><p>She says she sailed from Darl eight days earlier and reports that the dragon killed Helka and the eagle-god resurrected by Skalk. The council hears it now; Skuld shrieks and Ulfrir howls. This is her report, not a newly witnessed second death scene.</p></details><details><summary>Illustration · The Fury of the Gods · 19</summary><p><a href="assets/8107774f8a5f4d.jpg">Open noncanonical illustration</a></p><p>Svea’s news reaching the new tower council.</p></details><details><summary>Illustration · The Fury of the Gods · 19</summary><p><a href="assets/d360618f7d388f.jpg">Open noncanonical illustration</a></p><p>Svea the trader.</p></details></noscript>
