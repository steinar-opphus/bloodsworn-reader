      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 1</summary><h2>Introduction</h2><p>Breca has played with him on the beach at Fellur.</p></details><details><summary>The Shadow of the Gods · 3</summary><h2>Bodies brought to Fellur</h2><p>Harek is Asgrim’s son. Breca identifies him as Idrun’s son as well.</p></details><details><summary>The Shadow of the Gods · 3</summary><h2>Bodies brought to Fellur</h2><p>The family searches Asgrim’s steading and finds no sign of him. Breca says he has been taken. See his unresolved whereabouts.</p></details><details><summary>The Hunger of the Gods · 74</summary><h2>The camp boy’s identity established</h2><p>Identity review: a broad, fair-haired boy called Harek appears among the captive children beside Breca in Biórr’s viewpoint. He says he feels a boar in Lik-Rifa’s exercise. The passage supplies no parents, home or explicit recognition as Asgrim and Idrun’s son; this is a possible same-name lead, not a confirmed location or identity merge for E-006.</p></details><details><summary>The Hunger of the Gods · 74</summary><h2>The camp boy’s identity established</h2><p>Identity review: the camp boy Harek is now explicitly Breca’s friend, walking beside him and associated by Storolf with Svin’s line. This adds a same-name companionship lead to the earlier exercise scene, but still supplies no parents, home or explicit recognition as Asgrim and Idrun’s son. The camp boy E-266 and this missing boy E-006 remain unmerged.</p></details><details><summary>The Hunger of the Gods · 74</summary><h2>The gate falls and the children flee</h2><p>Orka recognises him as Asgrim&#x27;s boy, establishing the camp identity. He has grown broader and longer-limbed. He refuses Breca&#x27;s call, repeats Lik-Rifa&#x27;s accusation of lying and shouts enemies in the camp, exposing the rescue attempt.</p></details><details><summary>The Hunger of the Gods · 74</summary><h2>Orka recognises Asgrim&#x27;s son</h2><p>Orka explicitly recognises the Harek with Breca in Lik-Rifa&#x27;s camp as Asgrim&#x27;s boy. This identifies the provisional camp Harek E-266 with the earlier E-006. The older ID remains canonical, with E-266 preserved as a former identifier and redirect; the identification is learned in B02-C074, not imposed on earlier summaries.</p></details><details><summary>The Hunger of the Gods · 74</summary><h2>Orka recognises Asgrim&#x27;s son</h2><p>A fair-haired boy, squat and broad enough for Biórr to compare him to a boulder, sits beside Breca and Bjarn. The broad lad is called Harek when he asks Lik-Rifa how to discover his bloodline.</p></details><details><summary>The Hunger of the Gods · 74</summary><h2>Orka recognises Asgrim&#x27;s son</h2><p>He cries during the instruction to remember his abduction, then says yes when Lik-Rifa asks if he feels the beast. Asked which animal, he answers boar. No full transformation or particular inherited ability is demonstrated.</p></details><details><summary>The Hunger of the Gods · 74</summary><h2>Orka recognises Asgrim&#x27;s son</h2><p>Identity review: he shares a name with Asgrim and Idrun’s missing son, but the chapter gives no human parentage, home or explicit recognition connecting them. E-266 remains separate from E-006 pending stronger evidence. The page title distinguishes the encounter and is not another spoken name.</p></details><details><summary>The Hunger of the Gods · 74</summary><h2>The camp boy’s identity established</h2><p>He walks alongside Breca by the carts and is explicitly called his squat friend. He laughs at Storolf’s boar imitation; Storolf says he has Svin’s blood and teaches a group of children assigned that ancestry. No transformation, new human parentage or recognition as Asgrim and Idrun’s missing son is supplied. E-266 remains separate from E-006.</p></details><details><summary>The Hunger of the Gods · 74</summary><h2>The camp boy’s identity established</h2><p>At Nastrandir’s feast he is among the children cheering Lik-Rifa’s declared cause, while Breca glowers beside him. The response supplies no parents or home and does not merge this boy E-266 with E-006. Cheering alone is not proof of voluntary allegiance or general safety.</p></details><details><summary>The Hunger of the Gods · 74</summary><h2>The camp boy’s identity established</h2><p>He watches Biórr and Storolf’s demonstration and answers literally that the seax killed Storolf in the acted display. Breca supplies the shield-opening answer and interprets Biórr’s sword acquisition. This camp child remains E-266, distinct from the other Harek.</p></details><details><summary>The Fury of the Gods · 7</summary><h2>Orka recognises him on a wagon bench beside the white-haired man she mauled</h2><p>Orka recognises him on a wagon bench beside the white-haired man she mauled. Bjarn and other captive Tainted children sit in the wagon bed. The sighting places Harek in the marching column; it does not establish a rescue.</p></details><details><summary>The Fury of the Gods · 16</summary><h2>Grief and pursuit at the river</h2><p>He intervenes as the green-eyed Bloodsworn defender raises an axe over Biórr, knocking the man back and telling him to leave Biórr alone. He stands with fists clenched and feet wide, his eyes yellow and chin/jaw swollen, small tusks showing from the lower jaw. This is a current partial bodily manifestation, not a full boar transformation or completed rescue.</p></details><details><summary>The Fury of the Gods · 17</summary><h2>Orka sees Gunnar beside him and Biórr, then a dying troll falls between them and scatters all three</h2><p>Orka sees Gunnar beside him and Biórr, then a dying troll falls between them and scatters all three. Later Harek tackles Bjarn into the riverbank reeds as the boy runs for the ship; Breca names him and tries to go after them, but Orka stops him. Harek’s and Bjarn’s immediate outcomes remain unseen.</p></details><details><summary>The Fury of the Gods · 24</summary><h2>He is directly alive beside Fain on a wagon as the column returns to Darl</h2><p>He is directly alive beside Fain on a wagon as the column returns to Darl. This resolves his immediate survival after the reeds, but does not explain the intervening escape or establish where Bjarn is.</p></details><details><summary>The Fury of the Gods · 36</summary><h2>The dragon’s host marches out</h2><p>He sits beside Fain on the children’s wagon as Darl prepares to march, alive and still with the group. Another dozen children ride behind; this does not identify Bjarn among them or explain the earlier reeds escape.</p></details><details><summary>The Fury of the Gods · 41</summary><h2>He shield-strikes a sparring partner to the ground during Fain’s supervised dawn training</h2><p>He shield-strikes a sparring partner to the ground during Fain’s supervised dawn training. No new injury or identification of Bjarn among the children is supplied.</p></details><details><summary>The Fury of the Gods · 50</summary><h2>He is directly alive at the children’s fire and worries about Fain</h2><p>He is directly alive at the children’s fire and worries about Fain. He blames Bjarn’s friends for the raid and insults him; Fain forbids fighting. Harek thanks the adults for their help, but his gratitude does not make Bjarn’s confinement voluntary or answer the latter’s challenge.</p></details><details><summary>The Fury of the Gods · 53</summary><h2>He and Bjarn spar fiercely with shield/spear in Fain’s evening training</h2><p>He and Bjarn spar fiercely with shield/spear in Fain’s evening training. Biórr suggests stopping them, but no new injury or removed spear cover is recorded.</p></details><details><summary>The Fury of the Gods · 80</summary><h2>Harek is directly present with Fain and the Tainted children after the battle</h2><p>Harek is directly present with Fain and the Tainted children after the battle. This establishes his survival at camp without individually identifying Bjarn or every other child.</p></details><details><summary>The Fury of the Gods · 87</summary><h2>Biórr returns Bjarn</h2><p>Harek is alive among the sheltered children and climbs to the driver’s bench beside Fain as the wagon leaves. Fain drives with reins; no new Harek driving skill, transformation or confirmed safe arrival is supplied.</p></details><details><summary>Illustration · The Fury of the Gods · 16</summary><p><a href="assets/564ad7c445e163.jpg">Open noncanonical illustration</a></p><p>Noncanonical chapter-bound study of Harek’s yellow eyes and small lower-jaw tusks.</p></details></noscript>
