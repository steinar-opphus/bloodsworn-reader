      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 4</summary><h2>Introduction</h2><p>The blonde woman offers Varg a wooden shield. She has a black shield and wears a brynja at the trial.</p></details><details><summary>The Shadow of the Gods · 4</summary><h2>Story and connections</h2><p>She says she is no one’s thrall to be ordered. She announces him as Varg No-Sense in B01-C004. She announces the challenge as being for a place on the Bloodsworn’s oar-bench and shield wall.</p></details><details><summary>The Shadow of the Gods · 11</summary><h2>The shield-giver receives a name</h2><p>Svik identifies the previously unnamed shield-offering woman as Røkia in B01-C011.</p></details><details><summary>The Shadow of the Gods · 11</summary><h2>The shield-giver receives a name</h2><p>She says Glornir ordered her to train Varg. She says every Bloodsworn must know how to use a shield.</p></details><details><summary>The Shadow of the Gods · 11</summary><h2>The shield-giver receives a name</h2><p>She teaches a gap between shield and torso, weapon use and keeping sight of the opponent. Moving drills cut Varg’s shoulder and finish with her spear at his throat.</p></details><details><summary>The Shadow of the Gods · 16</summary><h2>Demanding spear practice</h2><p>Røkia intentionally nicks Varg with her spear during training. Glornir reports that she considers him fast, balanced and possessed of a warrior’s spirit.</p></details><details><summary>The Shadow of the Gods · 18</summary><h2>Equipment advice and shields at the docks</h2><p>Røkia recommends an axe for Varg and says mail should be won from an enemy in a fight. During the dockside battle she joins Einar and others in shielding Glornir from arrows.</p></details><details><summary>The Shadow of the Gods · 18</summary><h2>Equipment advice and shields at the docks</h2><p>In B01-C018, the narrator explicitly identifies Røkia and Svik as the Bloodsworn warriors accompanying Varg.</p></details><details><summary>The Shadow of the Gods · 26</summary><h2>Training while wet after the oar-dance</h2><p>Røkia requires Varg to train while wet, explaining that enemies will not wait for comfortable conditions. Røkia&#x27;s practice strike is followed by a shield shove and trip that put Varg on the ground. Røkia advises changing grip after a failed strike and continuing to fight after a nonfatal wound.</p></details><details><summary>The Shadow of the Gods · 26</summary><h2>Training while wet after the oar-dance</h2><p>She is tall and blonde, with a sharp-angled face. Her chapter 26 training equipment includes a spear and a linen-wrapped shield. A documented  separates these observations from artistic choices.</p></details><details><summary>The Shadow of the Gods · 47</summary><h2>Røkia reveals the wolf in her blood</h2><p>She identifies herself and Varg as Úlfhéðnar descended from Ulfrir, connecting his red mist to his suppressed god-touched nature. She gives him the slain swordsman’s mail and helm as earned spoils.</p></details><details><summary>The Hunger of the Gods · 3</summary><h2>Mord&#x27;s burial and a blood feud</h2><p>She challenges Orka for abandoning the company. On seeing Varg&#x27;s captured seax beside Orka&#x27;s recovered blades, she suggests they could share a maker; this remains a possibility.</p></details><details><summary>The Hunger of the Gods · 11</summary><h2>Scouting and controlled change — book 2, chapter 11</h2><p>She is now chief scout following Edel’s departure and is ordered to lead the company out. Before departure, she trains Varg with a hand-axe against his spear, telling him to use its reach and learn instinctive weapons craft.</p></details><details><summary>The Hunger of the Gods · 11</summary><h2>Scouting and controlled change — book 2, chapter 11</h2><p>She recalls his bone needles but explains their limits for piercing leather. Her muscles tighten, amber flecks appear in her eyes and her canines lengthen; she bites and twists a new hole in Varg’s helm strap. Her voice rasps before her teeth and eyes return to normal.</p></details><details><summary>The Hunger of the Gods · 11</summary><h2>Scouting and controlled change — book 2, chapter 11</h2><p>She advises releasing the beast in the blood steadily, using a dammed river as an analogy. Varg asks for instruction; the chapter ends before his attempt.</p></details><details><summary>The Hunger of the Gods · 19</summary><h2>Scouting beyond the repaired bridge</h2><p>She scouts across the repaired bridge before signalling the company onward and warns Varg that calling the wolf changes his eyes, exposing his ancestry to the untouched.</p></details><details><summary>The Hunger of the Gods · 19</summary><h2>Scouting beyond the repaired bridge</h2><p>At the camp outside Darl, she joins Einar’s dodge-the-troll game to help him win. Her speed leaves children on the ground and one crying; she reacts incredulously when Einar explains that he has been letting them win to make them happy.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>She reaches the tower alive with a blood-spattered face and spear, Einar behind her, to Varg’s relief. She accompanies the company through the tunnel.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>She spears the blonde chamber guard through her mail and retrieves the spear from the dead woman. Hakon calls for Yana, then sees the guard’s boots. Røkia kicks in the chamber door, levels the spear at him and strikes his jaw before driving him out naked under Glornir’s order.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>At the close she holds Hakon tight in front of her on the dais with a seax at his throat. Helka orders combat stopped. No bargain, escape or killing of the hostage is shown.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>She continues holding Hakon at seax-point through the negotiation. Her arm tenses after a look from Glornir as the prince pleads, without a wound being inflicted.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>Helka and Glornir agree that Hakon remains surety until the company is clear of Darl. She raises the seax a fraction to let Guðvarr wrap the dead drengr’s cloak around his shoulders. Hakon’s clothing changes, but no release is shown.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>She helps restrain Varg while Glornir cauterises his ear, and keeps Hakon at seax-point during the night march to the barracks. She accompanies the morning search for Brimil, identifies the Bruised Men as from Iskidan and pretends to guard the collared Varg.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>At the inn she wounds Brimil’s female guard in the shoulder and holds her at spear-point, later killing her. She helps Varg unlock and remove his disguise collar. She justifies the slaver and guards’ deaths but says his loss of control forced the decision and risks exposing, killing or enslaving the company; that judgment remains hers.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>She returns with the wagon and helps load barrels into the drakkar before the Bloodsworn depart with Hakon and Frek.</p></details><details><summary>The Hunger of the Gods · 32</summary><h2>Children hidden in the barrels</h2><p>While Einar and Varg bring the hidden children out of the barrels and Svik and Sulich provide food, she unstoppers a barrel of mead for the company.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>She advises Varg to stow his mail against the sea’s effect on metal and predicts they will pursue Jaromir towards Iskidan. She points Sulich towards Liga’s traders for a bowstring, then helps him fit the Sea-Wolf’s steering oar before departure.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>She laughs at the seasick Varg and predicts both recovery and a landfall within a day or a day and a half. Asked about Svik, she attributes his quietness to Orka and rejects his fantastical joining tales. She recounts Orka finding him a lash-wounded ten-year-old runaway, admitting him while chief and training him.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>She describes the three-longship attack, the search for Orka and Thorkel and the company’s mistaken presumed loss. She says Svik loved Orka like a mother and explicitly guesses that seeing her alive reopened abandonment and oath-related grief. Her stone-heart advice is challenged by Varg. These are her past account and present interpretations, not Svik’s direct confession or a new account from Orka.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>She strokes Refna’s hair as the girl speaks of Kel, and reacts to Drekr’s name by predicting another crossing of paths with Orka. Following Sulich’s gaze, she points out distant sails to the south and calls Glornir. His weapons order follows without a narrated battle.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>The boarding battle at sea</h2><p>She warns of pirates feeding on Iskidan’s trade and explains why the wind makes flight impractical: tacking would occupy many warriors with sail and ropes. These are her assessments, not a named identification of the approaching force. Varg repeats her mail-drowning warning and Svik explains his own priority choice.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>The boarding battle at sea</h2><p>She pushes Sulich aside to stand next to Varg and tells him to keep his head, growling with sharp teeth showing. She prompts his shield against the arrow, approves his shield-wall stance and orders him to trust his companions behind him.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>The boarding battle at sea</h2><p>When the throat-wounded woman continues attacking, she knocks the spear away and slices the woman’s face. She tells Varg to fight until opponents are down and later stabs a man through the eye. Varg hears her snarl as he is pulled from the line; her final position and condition are not accounted for before his ending howl.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>She joins Glornir and Svik in landing at the island settlement. After the giant is slain she takes over from Varg beside the unconscious Einar, requests water from the Sea-Wolf rather than the island and a bolt of linen, then cuts a strip from her under-tunic to dab his head wound. Ingmar runs for supplies; their delivery and Einar’s recovery are not yet shown.</p></details><details><summary>The Hunger of the Gods · 59</summary><h2>New looks on the journey through Ulaz</h2><p>She adopts Varg&#x27;s newly shaved-back-and-sides hairstyle and teaches him axe craft on the Reka. Her covered-axe demonstration draws his shield down and strikes his face. Her advice distinguishes anticipating a hook from riskier charging or shield-dropping counters.</p></details><details><summary>The Hunger of the Gods · 63</summary><h2>A shortcut through the mountains</h2><p>She teaches Varg not to silhouette himself on a ridge and scouts with him and Edel. At the ambush ground Glornir sends her to examine Valdai.</p></details><details><summary>The Hunger of the Gods · 66</summary><h2>Sulich&#x27;s lineage and the ambush</h2><p>Her blonde braid and shaved sides are observed on return. She reports an estimated fifty spears at Valdai, its timber walls and under-wall stream, then takes the first rank before Varg.</p></details><details><summary>The Hunger of the Gods · 68</summary><h2>The cavalry charge and the shield wall</h2><p>Her hooked shield exposes a target for Varg&#x27;s spear. Later she wounds the huge thrall&#x27;s shoulder but is grabbed by the mail and thrown aside. The chapter supplies no complete injury assessment.</p></details><details><summary>The Hunger of the Gods · 70</summary><h2>The pursuit into Valdai</h2><p>She takes a rider&#x27;s horse and enters Valdai, then protects and raises wounded Varg amid the fighting. She grieves beside Ingmar and agrees with Varg&#x27;s identification of the Vigrið map.</p></details><details><summary>The Fury of the Gods · 6</summary><h2>She welcomes the prospective dragon fight and its songs, unlike Varg&#x27;s fear</h2><p>She welcomes the prospective dragon fight and its songs, unlike Varg&#x27;s fear. Later she offers to accompany him to Vol&#x27;s invocation, stops him snatching at Frøya&#x27;s burning hair, squeezes his hand and steadies him as he experiences the vision of his sister&#x27;s death.</p></details><details><summary>The Fury of the Gods · 10</summary><h2>She scouts since dawn with little outward fatigue, then speaks with Varg above Ulaz</h2><p>She scouts since dawn with little outward fatigue, then speaks with Varg above Ulaz. She says her village killed her Tainted mother before her eyes when she was perhaps nine or ten; over five years she hunted those responsible. Killing them did not ease the loss or bring her mother back, though she says it felt good. She allows Varg to touch her hand. This is her reported childhood history, not a newly witnessed flashback.</p></details><details><summary>The Fury of the Gods · 10</summary><h2>She scouts since dawn with little outward fatigue, then speaks with Varg above Ulaz</h2><p>At the ambush she and Svik reach for weapons as Varg is hooded. He hears her snarl and a man scream, but the chapter does not establish the scream&#x27;s cause, a kill or her final condition.</p></details><details><summary>The Fury of the Gods · 12</summary><h2>The captors reveal their purpose</h2><p>Bound but defiant in Sterkur and Leif&#x27;s custody, she rejects Leif&#x27;s ownership claim and threatens the captors. They blame her for Unlaf&#x27;s surviving facial wounds; blood around her mouth is described as someone else&#x27;s. When the attempt on Svik is disrupted she nudges Varg towards the wall, where he hears an unidentified snuffling growl. No final rescue or new killing by her is shown in the chapter.</p></details><details><summary>The Fury of the Gods · 14</summary><h2>She gnaws through her bonds with enlarged teeth, frees herself and helps Svik regain his weapons</h2><p>She gnaws through her bonds with enlarged teeth, frees herself and helps Svik regain his weapons. She stops Varg pursuing Leif and Sterkur, then frees Sea-Wolf’s mooring and boards. At sea she says her wolf briefly ruled her and Sterkur saw her Tainted eyes. Svik vows to find and silence him; neither Sterkur’s private knowledge nor his death is independently narrated here.</p></details><details><summary>The Fury of the Gods · 25</summary><h2>She fastens her leg-wraps with an iron brooch and continues teaching Varg during the approach</h2><p>She fastens her leg-wraps with an iron brooch and continues teaching Varg during the approach. Seeing the leading drakkar ahead of a wider line, she predicts encirclement and urges swift action against the first ship; its eagerness and glory-seeking are her tactical interpretation.</p></details><details><summary>The Fury of the Gods · 27</summary><h2>After resisting boarders, she head-butts a blonde attacker and jumps onto the enemy deck</h2><p>After resisting boarders, she head-butts a blonde attacker and jumps onto the enemy deck. Varg follows to protect her; she leads their reinforced wall forward before the defenders can form properly. She returns to Sea-Wolf, throws her axe as Edel shields Glornir, and later pulls a dead attacker off Varg and steadies him. She covers herself and the unsteady, shieldless Varg with her shield when they see another drakkar approaching; she speaks of a song about their stand, without knowing the newcomer’s identity.</p></details><details><summary>The Fury of the Gods · 29</summary><h2>She fights aboard the stern attacker near Varg, then follows Glornir back when Vol screams</h2><p>She fights aboard the stern attacker near Varg, then follows Glornir back when Vol screams. She sees Svik threatened but is still too far away when Orka intervenes. The later joint spell strike knocks the company down before a settled reunion can follow.</p></details><details><summary>The Fury of the Gods · 37</summary><h2>Life aboard Sea-Wolf</h2><p>She repairs her mail’s rib tear with new rings, tongs and hammer, initially refuses to watch Einar let children win, then joins despite herself. She admires Breca’s controlled sparring and says she likes the little wolf cub. At Varg’s oath she is the first to step forward and vouch for him.</p></details><details><summary>The Fury of the Gods · 39</summary><h2>She pauses axe sparring with Varg to watch Svik’s confrontation with Orka the day after Varg’s oath</h2><p>She pauses axe sparring with Varg to watch Svik’s confrontation with Orka the day after Varg’s oath. No new wound, ancestry or formal office is introduced.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>She lands with Varg/Svik and names the door guards Berserkir</h2><p>She lands with Varg/Svik and names the door guards Berserkir. Varg believes she hears the waking call, later seeing her grunt, shake her head and scowl when he hears Ulfrir’s private address. The scene does not disclose her exact words or a newly named lineage.</p></details><details><summary>The Fury of the Gods · 48</summary><h2>At the return meal she supports Varg’s hunt for Brák and calls the dragon insane</h2><p>At the return meal she supports Varg’s hunt for Brák and calls the dragon insane. Varg squeezes her hand; she tenses but does not withdraw, and Einar covers both hands. She listens as Varg argues for universal freedom and paid labour. No explicit romance declaration, general abolition or collar removal follows.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>Free and smiling despite the overwhelming enemy host, she flanks Varg beside Svik</h2><p>Free and smiling despite the overwhelming enemy host, she flanks Varg beside Svik. Before combat she takes Varg’s shoulders, tells him to stay alive and gently touches her helm to his, then returns to shield/spear. They fight adjacent ladder-climbers without a new named relationship or exact kill total.</p></details><details><summary>The Fury of the Gods · 61</summary><h2>The shield line under pressure</h2><p>She locks her shield at Varg’s right, slides under the first collision then steadies, and stabs an opponent with her seax. During the later disengagement she grins at him, fierce and blood-spattered; no new named wound is stated.</p></details><details><summary>The Fury of the Gods · 62</summary><h2>The fighting withdrawal</h2><p>Her sword joins Orka’s axe to free Varg from a spider, then she grips his wrist and urges him to live instead of chasing immediate revenge. During Svik’s rescue she cuts the troll’s calf/hamstring, climbs its back and stabs between neck/shoulder before leaping clear. She rolls her eyes at Svik’s joke and runs with the others for the gates.</p></details><details><summary>The Fury of the Gods · 68</summary><h2>She names the hall crisis betrayal as the company reaches Elvar’s fallen body and the door fighting</h2><p>She names the hall crisis betrayal as the company reaches Elvar’s fallen body and the door fighting. No individual new wound or separate kill is supplied here.</p></details><details><summary>The Fury of the Gods · 73</summary><h2>Brák’s hostages and Einar’s fall</h2><p>She fights on Svik’s right in the stone-wolf rescue, then joins the fight around the captive children. Golden-eye warriors cut her, Edel and Æsa off from Einar/Svik; she howls as Brák’s sword pierces Einar’s throat.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>She pulls Varg off dead Leif, mourns Einar beside Svik and reports Brák ran when the ground broke</h2><p>She pulls Varg off dead Leif, mourns Einar beside Svik and reports Brák ran when the ground broke. The tunnel flight does not reveal Brák’s destination or Sterkur’s fate.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>The survivors’ camp and reunion</h2><p>She emerges with the remaining Bloodsworn protecting Refna/children and selects the most suitable least-wounded hunters, taking Varg into the woods to seek food. Glornir’s later arrival rejoins the split company.</p></details><details><summary>The Fury of the Gods · 79</summary><h2>After Halja rejects Lif, she tells Varg she does not prefer women to men and chooses him</h2><p>After Halja rejects Lif, she tells Varg she does not prefer women to men and chooses him. She squeezes his hand, pulls him up and leads him into the trees, out of earshot of Hrung’s disclosure. They kiss reciprocally and she removes his belt as he says he chooses her. Their romantic/sexual choice is explicit now; no later oath/marriage is implied.</p></details><details><summary>The Fury of the Gods · 81</summary><h2>The charge against the gods</h2><p>She fights beside Varg, finishes an unnamed Raven-Feeder he hamstrings, then bursts through Yrsa’s forming line with her shield and kills the male flanker. The cooperation follows their mutual choice, without a new oath or a complete battle outcome.</p></details><details><summary>The Fury of the Gods · 84</summary><h2>Silrið’s defeat and vengeance for Frøya</h2><p>She helps free Taras, identifies Brák’s blood as Væsa the weasel and rings the duel with the others to prevent flight. After Varg pins Brák she whistles the children forward, saying he is not the only person owed vengeance; Refna invokes Einar, and Røkia declares the reprisals have avenged them. These are her actions/statements, without a new oath.</p></details><details><summary>The Fury of the Gods · 89</summary><h2>After Æsa’s sudden death she reaches Heðin first, attacks his calf and joins the coordinated assault</h2><p>After Æsa’s sudden death she reaches Heðin first, attacks his calf and joins the coordinated assault. She retrieves Æsa’s spear from the slain smaller troll and hurls it into Heðin’s open mouth; the group/hound finishes him. She then faces Rotta before the ravens intervene.</p></details><details><summary>The Fury of the Gods · 92</summary><h2>A home for the Bloodsworn</h2><p>She wants a new drakkar and silver, does not deny enjoying raiding, and tells Varg she too wants a child one day. The company’s home plan allows raiding and family life; no pregnancy is established.</p></details><details><summary>Illustration · The Fury of the Gods · 12</summary><p><a href="assets/d0f188333e567f.jpg">Open noncanonical illustration</a></p><p>The companions’ defiance before the execution attempt.</p></details><details><summary>Illustration · The Shadow of the Gods · 43</summary><p><a href="assets/847b845b73bebc.jpg">Open noncanonical illustration</a></p><p>Røkia during training on the grassy fjord bank.</p></details><details><summary>Illustration · The Hunger of the Gods · 59</summary><p><a href="assets/0c6a29de143d9b.jpg">Open noncanonical illustration</a></p><p>Røkia after Svik cuts her hair aboard the Sea-Wolf.</p></details><details><summary>Illustration · The Hunger of the Gods · 26</summary><p><a href="assets/8bfd5328314af6.jpg">Open noncanonical illustration</a></p><p>Røkia holds Hakon hostage during the confrontation with Helka.</p></details><details><summary>Illustration · The Fury of the Gods · 10</summary><p><a href="assets/62d612126a5821.jpg">Open noncanonical illustration</a></p><p>Røkia and Varg’s conversation above Ulaz.</p></details><details><summary>Illustration · The Fury of the Gods · 79</summary><p><a href="assets/b258543c977818.jpg">Open noncanonical illustration</a></p><p>Røkia taking Varg’s hand and declaring her choice.</p></details><details><summary>Illustration · The Fury of the Gods · 56</summary><p><a href="assets/71f9113f3d8959.jpg">Open noncanonical illustration</a></p><p>Røkia’s quiet gesture before combat.</p></details><details><summary>Illustration · The Fury of the Gods · 48</summary><p><a href="assets/2980464da34af5.jpg">Open noncanonical illustration</a></p><p>Einar’s gesture affirming Bloodsworn kinship.</p></details></noscript>
