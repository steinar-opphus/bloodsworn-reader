      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 16</summary><h2>Introduction</h2><p>Glunn is a petty jarl sworn to Helka who attends her gathering dressed in fine wool and silver. When Skalk blames Störr, he rises to call his warriors, overturning his chair; Helka restrains his immediate mobilisation.</p></details><details><summary>The Hunger of the Gods · 41</summary><h2>Sigrún&#x27;s reckoning with Guðvarr</h2><p>Sigrún includes him among Helka’s petty jarls present in Darl whom she believes sense her weakness and want her lands. This is her assessment of his ambitions; he has no new dialogue or demonstrated annexation plan in the scene.</p></details><details><summary>The Hunger of the Gods · 43</summary><h2>The feast and the shield-dance</h2><p>He is fair-haired, young and squat, broad with tree-trunk legs, shorter than Guðvarr but more thickly muscled. His age is only described relative to Guðvarr. He volunteers to race Hakon in the shield-dance.</p></details><details><summary>The Hunger of the Gods · 43</summary><h2>The feast and the shield-dance</h2><p>Guðvarr overtakes him by landing on his shield and stepping around him; Glunn’s attempted grab fails. He remains among the last four racers but misses his footing during Guðvarr’s collision with Estrid. Afterwards he smiles and calls Guðvarr’s move fine. No serious injury or later reprisal is shown.</p></details><details><summary>The Fury of the Gods · 2</summary><h2>The dragon’s assembly in Darl</h2><p>Brought before Lik-Rifa under guard at Darl, he bargains for might, wealth and fame before agreeing to swear allegiance. When the god offers a blade contest with Svard, he takes the seax and fatally stabs him. He calls it a holmganga and claims Svard&#x27;s property and warriors under its laws; the followers assent. Lik-Rifa invites him to eat with her.</p></details><details><summary>The Fury of the Gods · 8</summary><h2>The gathering in the Galdur tower</h2><p>He reports seeing Estrid with Skalk in the courtyard after Orna&#x27;s fall, then guesses they may have fled together. Despite his claim to have sworn Lik-Rifa an oath, Drekr refuses his offer to hunt them because of his former allegiance. Instead he must remain close in Darl and find Helka&#x27;s supporters; he reluctantly accepts.</p></details><details><summary>The Fury of the Gods · 36</summary><h2>He joins Lik-Rifa’s procession on a dark bay, leading a few score mounted drengrs and more on foot</h2><p>He joins Lik-Rifa’s procession on a dark bay, leading a few score mounted drengrs and more on foot. The observation confirms his presence in the marching host, without an exact total for his followers.</p></details><details><summary>The Fury of the Gods · 78</summary><h2>Krúsa and Glunn are among the captains directly back at the shattered enemy camp with Drekr/Sigrún</h2><p>Krúsa and Glunn are among the captains directly back at the shattered enemy camp with Drekr/Sigrún. The others’ absence so far is not a full death list.</p></details><details><summary>Illustration · The Hunger of the Gods · 45</summary><p><a href="assets/90758e65a1cf49.jpg">Open noncanonical illustration</a></p><p>An imagined portrait of Glunn Iron-Grip in fine wool and silver.</p></details></noscript>
