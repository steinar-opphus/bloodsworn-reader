      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 6</summary><h2>A child and an injured vaesen</h2><p>The steading includes a forge and charcoal kiln. A stream flows through it. The stream is fed by a pool above it.</p></details><details><summary>The Shadow of the Gods · 6</summary><h2>A child and an injured vaesen</h2><p>Breca’s cot is empty at dawn in B01-C006. His parents find him by the pool.</p></details><details><summary>The Shadow of the Gods · 15</summary><h2>Grief and the decision to leave</h2><p>Thorkel checks its gate bolts and locks and habitually patrols the stockade. When Orka leaves before dawn, she climbs over the wall so the gate stays locked and asks Spert to watch the steading. The family plans to leave; the move has not yet taken place in B01-C015.</p></details><details><summary>The Shadow of the Gods · 17</summary><h2>The burning hall and ruined protections</h2><p>In B01-C017, the gates stand open, one hanging from a single hinge; the protective rune-post is obliterated and the hall burns. Chickens and goats lie dead in the courtyard, and the hall doors are smashed. Thorkel is mortally wounded, says Breca has been taken and dies after Orka carries him outside. Orka rescues Vesli before the hall collapses.</p></details><details><summary>The Shadow of the Gods · 19</summary><h2>A barrow beside the ruins</h2><p>After the fire, Orka digs up an old chest near the hall’s western tip and builds a timber-and-stone barrow for Thorkel. She asks Vesli to take the surviving Spert away before villagers might come, then leaves to continue her pursuit.</p></details><details><summary>The Fury of the Gods · 91</summary><h2>Return to the ruined homestead</h2><p>The returning company finds a largely collapsed wall, broken gate and the charred, vine-covered frame of the hall under its fallen roof. Barn, forge, woodshed and charcoal kiln survive but need repairs; the overgrown garden still has bees at its hive. Thorkel’s stone barrow is flowered and overgrown. They bring Spert’s remains and Glornir’s wrapped body, then begin digging.</p></details><details><summary>The Fury of the Gods · 92</summary><h2>Three barrows now cover Thorkel, Glornir and Spert</h2><p>Three barrows now cover Thorkel, Glornir and Spert. The company agrees to a permanent home; Vol proposes this steading, citing cleared land/foundations, high views, timber and the fjord below. Sulich notes nearby horse meadows. Orka welcomes the idea. New buds/leaves are seen, but no calendar interval or completed rebuilding is given.</p></details><details><summary>Illustration · The Fury of the Gods · 92</summary><p><a href="assets/fbf45426dd230f.jpg">Open noncanonical illustration</a></p><p>The company sharing food and discussing a lasting home.</p></details><details><summary>Illustration · The Fury of the Gods · 91</summary><p><a href="assets/660a0c42b22bdc.jpg">Open noncanonical illustration</a></p><p>The survivors approaching the overgrown steading.</p></details></noscript>
