      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 13</summary><h2>Introduction</h2><p>Logur hosts the feast with Glornir and Vol at the high table. He embraces Sergei as an old friend.</p></details><details><summary>The Shadow of the Gods · 13</summary><h2>A feast interrupted</h2><p>He demands witnesses and evidence for Jaromir’s accusations and refers the claim to an Althing.</p></details><details><summary>The Shadow of the Gods · 16</summary><h2>Training and the price of an akáll</h2><p>Logur’s wife is Sälla, as established in B01-C016. He welcomes the Bloodsworn at his hearth for a day or a winter and promises provisions for their departure. Sälla says he means that he will ask her to make the arrangements.</p></details><details><summary>The Shadow of the Gods · 18</summary><h2>New weapons and an attack at the docks</h2><p>Torvik says the Bloodsworn’s former chief Skullsplitter gave Logur the rafter relic, which he identifies as a Vackna Horn fragment and credits with making Logur rich. Logur arrives at the dockside with blue-shielded warriors as the fighting stops.</p></details><details><summary>The Shadow of the Gods · 20</summary><h2>The queen&#x27;s orders</h2><p>Logur’s drengrs keep the Bloodsworn and druzhina separated after the battle. Helka admits Logur without his oathmen and directs him to lead the parties to his hall to hear Jaromir’s grievances.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>He arrives during Glornir’s confrontation with Palrun, rebukes his official and welcomes Glornir as a friend. He reports Jaromir has restocked and sailed, offers to seek news, and orders Palrun to oversee provisioning the Sea-Wolf. Helka’s loaned drakkar and Hakon are entrusted to him for later return. His guards escort Hakon away with Frek following; the return to Helka remains unshown.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>Provisions and repair supplies are actually loaded. Svik directs Palrun to send the tally to Logur and says the Bloodsworn are good for it, but no exact total or final settlement is narrated.</p></details><details><summary>The Fury of the Gods · 48</summary><h2>He arrives from Liga with over a hundred warriors bearing blue shields with red sails</h2><p>He arrives from Liga with over a hundred warriors bearing blue shields with red sails. Grey hair and beard braided, barrel-chested and wide-bellied in brass-gilded mail, he wears gold torc and silver arm rings and carries a back shield. Glornir greets and vouches for him; Logur offers friendship and Elvar welcomes him and his oathsworn to eat. Hrung’s speech startles and amuses him, and he jokes at the gods’ family feud. No new oath ritual or named sister is established.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>Orlyg and Logur emerge together with perhaps a hundred combined warband survivors</h2><p>Orlyg and Logur emerge together with perhaps a hundred combined warband survivors. Both sit at council; Orlyg assesses the battle and jokes about Snaka, then welcomes the returning Glornir/Orka as Shieldbreaker/Farmer. The estimate is not a precise split between their forces.</p></details><details><summary>The Fury of the Gods · 81</summary><h2>The charge against the gods</h2><p>The captains join the loose charge: Orlyg/Logur lead their warriors, Sighvat the Battle-Grim, and Grend/Gytha Elvar’s drengrs with Berserkir/Úlfhéðnar. This is a renewed allied assault, not its final outcome.</p></details><details><summary>Illustration · The Fury of the Gods · 48</summary><p><a href="assets/662fe500c45ffa.jpg">Open noncanonical illustration</a></p><p>Jarl Logur.</p></details></noscript>
