      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 48</summary><h2>Introduction</h2><p>She emerges from a living ash beside Oskutreð’s stump and names herself its newborn Froa guardian, daughter of Aska. Her body is tall, ash-grey and wood-grained, with bark and lichen.</p></details><details><summary>The Shadow of the Gods · 48</summary><h2>Chapter 48 — Binding Sighvat</h2><p>She forbids contact with the dead tree, disarms Sighvat and binds him with growing vines. She confirms Lik-Rifa’s imprisonment and names the three sisters as gaolers.</p></details><details><summary>The Shadow of the Gods · 48</summary><h2>Appearance</h2><p>Her hair swirls around her shoulders like roots.</p></details><details><summary>The Shadow of the Gods · 52</summary><h2>Chapter 52 — Defending the tree</h2><p>She and Uspa resist Ilska’s approach, but the combined fire-runes overwhelm her vine defence. She burns and falls, her subsequent condition unshown here.</p></details><details><summary>The Hunger of the Gods · 2</summary><h2>A burial and a surviving gaoler</h2><p>The next day Elvar sees her lying blackened and twisted after the fire. No revival is shown, and the observation does not explicitly pronounce her dead.</p></details><details><summary>Illustration · The Shadow of the Gods · 53</summary><p><a href="assets/eb790d69f84ecc.jpg">Open noncanonical illustration</a></p><p>Vörn binds Sighvat to the ground with growing vines after disarming him.</p></details><details><summary>Illustration · The Shadow of the Gods · 53</summary><p><a href="assets/a9e1e84388e8dc.jpg">Open noncanonical illustration</a></p><p>Vörn after emerging from the living ash, before the confrontation.</p></details></noscript>
