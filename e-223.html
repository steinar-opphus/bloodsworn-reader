      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 15</summary><h2>Introduction</h2><p>Gunnar is a young Bloodsworn who joined after Orka left. He is tall, lean and fair-haired, with a large nose curved like a drakkar prow-beast. He and Revna Hare-Legs are openly lovers.</p></details><details><summary>The Hunger of the Gods · 15</summary><h2>Story and connections</h2><p>He guides Orka through the incompletely excavated chambers, identifies previous uses of rooms and recounts saga-tales about Rotta. He reads the heading on a copied Galdrabok fragment but does not wish to read further; Orka asks him and Revna to gather the parchments.</p></details><details><summary>The Hunger of the Gods · 15</summary><h2>Story and connections</h2><p>While Revna speaks of trust among kin, he reaches out and brushes the back of her hand with his fingertips.</p></details><details><summary>The Hunger of the Gods · 18</summary><h2>Training and an encounter in the rain</h2><p>He offers to spar with Lif amid jokes about his nose and Revna’s wry comments. He sidesteps Lif’s thrust, pulls the spear shaft and touches his chest with his own spear. The lesson prompts Orka to teach Lif shield use.</p></details><details><summary>The Hunger of the Gods · 20</summary><h2>Myrk confronted in the glade</h2><p>After the mine battle he sways and sits in the mud. His eyes return from black to blue, one leg is soaked with blood below the knee, and Revna hurries to him. The extent and outcome of the injury remain unestablished.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>Wounds tended and seaxes compared</h2><p>Revna cuts away his bloody breeches and Vesli treats a gash in his thigh just below the mail shirt. He dislikes the smell and resists before Revna tells Vesli to proceed. This inspected wound is kept distinct from the blood seen below his knee at chapter 20’s close.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>Wounds tended and seaxes compared</h2><p>He is still limping when offered as one of Orka’s three new companions. He jokes that travelling with her beats rowing. Edel says his leg would slow her crew, but Orka sees the excuse: thirty horses and spare mounts would allow fast riding. Orka accepts the volunteers.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>Still limping, he brings Orka a bowl of cheese, pickled onion, rye bread and salted pork, then trades flyting insults with Myrk about his nose and her swollen face. He calls Orka chief despite her denials and agrees with Revna to the information exchange.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>He hears Myrk’s account of the prison-opening rite and hears Uspa named as the bridge-opening witch. Myrk does not establish whether she or the other surviving Battle-Grim are now dead or alive.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>Revna checks his bandaged thigh while his breeches are down. He laughs at Myrk’s humiliation, falls in the stable banter and asks Lif for a song. During the staged raid he and Revna fight shield to shield. He later approaches limping, a continuing condition rather than a separately identified new wound.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>He thinks Glornir will like Elvar’s silver bear-head ring but warns that finding the company may take time: their location is unknown to him, with Darl only a guess. No message is delivered and this uncertainty does not place the main Bloodsworn back in Darl.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>He laughs during the Halja discussion. His assertion about Halja’s partners is disputed by Revna’s Liga anecdote; the claims and her admitted uncertainty are not established biography. He expresses dislike of skraeling after Revna identifies dung on the path. No actual skraeling encounter follows before the farm is seen.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>He argues for attacking the skraeling now to reduce future opposition to Breca’s rescue. He demonstrates weight-bearing on his injured leg and credits Vesli’s spit, without a finding of complete healing. Assigned the stream entrance with Revna, he later intervenes beside Orka with green-glinting eyes, sharp teeth and snarling froth. This display is not a newly identified bloodline. He and Revna then enter the longhouse through its roof hole.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>After the fight he and Revna fetch Sæunn and the horses. He laughs at Gudleif’s raven arrangement, is startled into choking on water by a raven’s speech and jokes that friends normally should be human, which Vesli disputes. He finds the compassionate raven rescue at odds with Orka Skullsplitter’s reputation. These are his reactions and judgments.</p></details><details><summary>The Hunger of the Gods · 74</summary><h2>The gate falls and the children flee</h2><p>He accompanies Orka and Revna into the wagons, helps remove skraeling guards and offers Bjarn passage to Uspa, describing her as sister to his chief&#x27;s wife.</p></details><details><summary>The Hunger of the Gods · 75</summary><h2>The rescuers pursued</h2><p>He guards fallen Revna, then attacks Biórr in grief, disarming him with an axe hook. Rotta and returned guards capture him under a spear, disarm him and force him to kneel. His dark hair, braided beard, long limbs, prominent nose and temporary green-flecked eyes are observed.</p></details><details><summary>The Hunger of the Gods · 76</summary><h2>Captives before Rotta</h2><p>Brought captive beside Orka, he escapes the transformation chaos carrying Revna&#x27;s confirmed-dead body. He vows revenge, but Orka insists they run now.</p></details><details><summary>The Hunger of the Gods · 78</summary><h2>Escape through the river valley</h2><p>He splits away carrying Revna, intending to meet the others at the lake. Orka promises to help him kill their enemies. His arrival at the rendezvous is not shown.</p></details><details><summary>The Fury of the Gods · 15</summary><h2>The attack in the snowy valley</h2><p>He appears mail-clad and helmeted behind Breca at the reunion with Orka, alongside Lif, Halja and Sæunn. Their escape is not yet shown.</p></details><details><summary>The Fury of the Gods · 16</summary><h2>Grief and pursuit at the river</h2><p>The tall fair-haired, braided-bearded black-shield defender is identified contextually through Biórr’s recognition of the woman he killed, the words You killed my Revna, Gunnar’s established relationship and loss, and his named presence with the rescue party in chapter 15. His eyes glow green in combat; this is not a replacement for his earlier natural eye colour or a named ancestry revelation.</p></details><details><summary>The Fury of the Gods · 16</summary><h2>Grief and pursuit at the river</h2><p>He and the other Bloodsworn defend with two spear-bearers until pressure splits them into pairs. Biórr strikes his upper back through mail, but Gunnar fights on, cuts Biórr’s shield arm, disarms and pins him. He names Revna’s worth and raises his axe before Harek knocks him back. His final condition and the confrontation’s outcome remain unstated.</p></details><details><summary>The Fury of the Gods · 17</summary><h2>Orka directly names him beside Harek and Biórr, confirming the preceding contextual identification</h2><p>Orka directly names him beside Harek and Biórr, confirming the preceding contextual identification. A falling troll separates them and Biórr vanishes from view. Halja persuades him to abandon pursuit. He strikes Orka’s wrist chain three times so she can snap it, then helps cut Dagrun free of attackers and boards the surviving ship. His earlier back wound is not declared healed.</p></details><details><summary>The Fury of the Gods · 26</summary><h2>Lessons, mourning and Spert’s barrel</h2><p>He finishes a rowing shift with Halja and Sæunn, then nearly prompts Orka to draw when touching her elbow. He steps back with raised hands, accepts watered ale and remarks that her new mail fits. No threat or new injury is intended by the touch.</p></details><details><summary>The Fury of the Gods · 28</summary><h2>He accepts Orka’s order to attack while Lif and Sæunn guard Breca</h2><p>He accepts Orka’s order to attack while Lif and Sæunn guard Breca. He persuades Orlyg to aid the knarr and promises to remind his chief that this helps the Bloodsworn. Passing Sea-Wolf, he spears an archer aiming at Glornir and shouts their company cry. He later fights on the knarr, then stops Sulich from attacking Orka by naming him.</p></details><details><summary>The Fury of the Gods · 29</summary><h2>His passing spear cast with Halja creates the distraction exploited by Glornir’s charge</h2><p>His passing spear cast with Halja creates the distraction exploited by Glornir’s charge. He then reaches Sea-Wolf with Orka’s rescue group, black shield in hand; Varg recognises him and Halja as they help break through the guards around Einar and Svik.</p></details><details><summary>The Fury of the Gods · 32</summary><h2>He tells Edel that Revna fell at Svelgarth and was buried beside the lake where Breca was recovered</h2><p>He tells Edel that Revna fell at Svelgarth and was buried beside the lake where Breca was recovered. He and Halja reaffirm that following Orka was their choice. He vows vengeance on the rat-blood who killed Revna, and Orka supplies the name Biórr; the vow is not fulfilled here.</p></details><details><summary>The Fury of the Gods · 70</summary><h2>He charges through the gap with Halja as the Bloodsworn push the root-cutters back</h2><p>He charges through the gap with Halja as the Bloodsworn push the root-cutters back. No individual casualty or new injury is identified.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>With Halja he aids Thorguna near Elvar’s chamber</h2><p>With Halja he aids Thorguna near Elvar’s chamber. Outside he asks what the enemy is staring at, before Halja identifies fleets, then follows the continued fight. No new wound or individual final kill count is supplied.</p></details><details><summary>The Fury of the Gods · 76</summary><h2>Surviving the plunge into the Falinn</h2><p>Directly present among the surviving Bloodsworn at the treeline beyond the downriver bend with Glornir/Vol, Halja, Gunnar, Lif and Sæunn. The chapter confirms this survival without resolving every missing ally.</p></details><details><summary>The Fury of the Gods · 79</summary><h2>A night of repairs and choices</h2><p>He jokes for Sæunn to ask Lif about the attention she is receiving and smiles, the first Varg has seen since Gunnar returned without Revna. This is Varg’s observed moment of relief, not erased grief.</p></details><details><summary>The Fury of the Gods · 83</summary><h2>Sæunn stays with Breca at Orka’s right, Gunnar/Halja to her left as they advance through the battle</h2><p>Sæunn stays with Breca at Orka’s right, Gunnar/Halja to her left as they advance through the battle. No separate new wound/final fate is given for these companions in this passage.</p></details><details><summary>The Fury of the Gods · 86</summary><h2>Gunnar, Halja and Sæunn strike the Raven-Feeders behind Drekr as Orka duels him</h2><p>Gunnar, Halja and Sæunn strike the Raven-Feeders behind Drekr as Orka duels him. No separate new wound or final personal outcome is supplied.</p></details><details><summary>The Fury of the Gods · 87</summary><h2>Biórr returns Bjarn</h2><p>The green-eyed Bloodsworn warrior names himself to Biórr after striking his temple and pinning him with a boot, then brings his axe down for Revna. Biórr’s death is strongly implied; no later corpse/aftermath is narrated here.</p></details><details><summary>The Fury of the Gods · 88</summary><h2>He rejoins the group and reports the rat-blood dead in context of his finishing attack on Biórr</h2><p>He rejoins the group and reports the rat-blood dead in context of his finishing attack on Biórr. This is Biórr’s death report, not Rotta’s, and no corpse inspection is added.</p></details><details><summary>The Fury of the Gods · 92</summary><h2>He reports Rurik and the surviving fleet forces still riding around Vigrið</h2><p>He reports Rurik and the surviving fleet forces still riding around Vigrið. He initially calls their drakkar home when Varg proposes a permanent steading, before the company’s eventual agreement.</p></details><details><summary>Illustration · The Hunger of the Gods · 15</summary><p><a href="assets/0cebbca048da15.jpg">Open noncanonical illustration</a></p><p>A joint portrait of Gunnar Prow and Revna Hare-Legs.</p></details></noscript>
