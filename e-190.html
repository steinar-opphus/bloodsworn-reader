      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 45</summary><h2>Waking among the wounded</h2><p>Torvik cites saga-tales placing Rotta’s Galdrabok in his chamber and describing it as rune-carved on the bloodied skin of Orna’s daughter. The remembered account credits it with knowledge of life and death and spells used to sustain Rotta’s torment. No discovery of the Raudskinna is shown in chapter 45.</p></details><details><summary>The Hunger of the Gods · 9</summary><h2>Old companions at the campfire</h2><p>Lik-Rifa identifies the Raudskinna as her brother’s book and asks whether Ilska used it. Ilska answers yes and says they found his chamber, adding a participant’s confirmation after the earlier saga account. Lik-Rifa separately blames her own protected book for Ulfrir’s return; the two books are not merged.</p></details><details><summary>The Hunger of the Gods · 15</summary><h2>The search through Rotta&#x27;s chamber</h2><p>Gunnar recounts the saga of Rotta murdering Valkyrie and carving divine secrets into her flayed skin as Raudskinna. In the writing room he separately reads a parchment heading identifying copies made from fragments of Rotta’s Galdrabok. These observed copies do not establish possession of the intact original or equate it with the books found elsewhere.</p></details><details><summary>The Hunger of the Gods · 15</summary><h2>The search through Rotta&#x27;s chamber</h2><p>Revna says Skalk took a chest containing more scrolls and Orna’s talon. Orka orders the remaining copies gathered for Glornir and Vol.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>Myrk says her company found the Raudskinna and used its description of breaking Lik-Rifa’s prison seal, requiring much Tainted blood. She says children were easier to control through blended Seiðr and Galdur after unspecified failures with older Tainted. This remains her account, not proof of every mechanism or an identity merge with the other books.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>Halja says the chamber held pages copied from a Galdrabok which they thought might be the Raudskinna. Uspa infers that this is where the dragon-born found the means to break Lik-Rifa’s bonds. Halja condemns the book being in Lik-Rifa’s hands and Uspa agrees. The tentative copied-page attribution and her inference do not merge the copies, intact original and Lik-Rifa’s own Galdrabok.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>Halja recounts Skalk taking fragments with the talon and Vol. This is historical information she shares, not proof of the writings’ present location or a second theft.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>Lik-Rifa accuses Rotta of killing and flaying the gaolers’ sister and using her blood to write his Galdrabok; Rotta accepts that they had grounds to hate him. This adds participant testimony beside the earlier Raudskinna account. The book is not named Raudskinna in the exchange, and no new possession or identification of the copied fragments occurs.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>Lik-Rifa separately says she wrote her own Galdrabok while imprisoned and that it fell into the wrong hands. This distinguishes the discussion of her work from Rotta’s book without resolving the earlier differing physical descriptions or naming a current holder here.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>Skalk tentatively identifies his copied pages as Raudskinna material and says they contain resurrection spells. He proposes using them to raise Orna, but must check for gaps and test runes over many days. Hakon’s account of a Galdrabok used to free Lik-Rifa is testimony in the same discussion, not a new merger of manuscripts or proof that Skalk holds an intact original.</p></details><details><summary>The Fury of the Gods · 21</summary><h2>Edel hands Vol the parchment copies she says Orka and Gunnar found in Rotta’s chamber</h2><p>Edel hands Vol the parchment copies she says Orka and Gunnar found in Rotta’s chamber. Vol identifies them as copied Raudskinna fragments, judges their spells powerful and malicious, and goes to consult Iva. This is an expert identification of this copy collection, not a recovered intact original, a demonstrated spell or a merger with Skalk’s separate copies and other divine books.</p></details></noscript>
