      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 14</summary><h2>Blood memories at the oath stone</h2><p>Elvar says she has never seen a dragon-born or heard a trusted report. Agnar argues that lack of sightings does not prove absence and hopes they exist.</p></details><details><summary>The Shadow of the Gods · 17</summary><h2>Thorkel&#x27;s unexplained dying word</h2><p>In B01-C017, the dying Thorkel utters “Dragon-born” after reporting Breca’s abduction. The utterance does not identify a person, explain what he witnessed or independently establish any individual’s ancestry. See the meaning of Thorkel’s utterance.</p></details><details><summary>The Shadow of the Gods · 50</summary><h2>Skrið&#x27;s ancestry identified in the duel</h2><p>The early doubts are overtaken in chapter 50 by Skrið’s red eyes and sudden speed in the duel, followed by Vörn’s explicit identification of dragon-born blood. Elvar extends that identification to Ilska, Drekr and the mounted companions; this broader statement is her conclusion.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>Ilska and other dragon-born stand around Lik-Rifa’s assembly, with roughly another score behind the leaders. They chant in Galdur-tongue while unlocking the children’s collars, then participate in the acclamation. Lik-Rifa calls them her children; this does not assign dragon ancestry to every member of Drekr’s crew or to all gathered followers.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>Myrk’s eyes briefly flare red during a bound struggle after Halja insults her father, then the red fades when she is threatened. No complete transformation occurs. Her later ruined eye is an actual injury caused by Orka’s seax hilt, with no healing demonstrated.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>Ilska demonstrates red eyes, lengthening claws and sharp teeth at Lik-Rifa’s request, then her eye-fire fades. Lik-Rifa calls this a manifestation of her own blood and explains that other bloodlines confer other abilities. The partial change is observed; the general teaching remains her account, and no complete dragon form is shown.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>When flying sounds approach the camp, the dragon-born gather with Ilska and Drekr and kindle rune-fire through spoken words. Lik-Rifa stops their defensive preparations and welcomes the tennúr, so no new battle or injury follows here.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>Nastrandir revealed in the snow</h2><p>Ilska and her kin use Galdur-rune powers to melt a broad path through knee-deep snow for the column, while carts still struggle in the slush. No visible flame, rune design, spell words or exact limit is supplied for this use. Lik-Rifa stays mounted without helping; her reason is not given.</p></details></noscript>
