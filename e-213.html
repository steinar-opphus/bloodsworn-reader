      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 9</summary><h2>Introduction</h2><p>Biórr remembers Red Fain as the first living person to show him kindness when he came to the Raven-Feeders.</p></details><details><summary>The Hunger of the Gods · 9</summary><h2>Appearance</h2><p>He is tall, broad and thick-chested. His white hair is pulled tightly into a crown knot and his white beard is braided into two forks. He raises a large gnarled hand towards Biórr’s cheek, but Biórr pulls away.</p></details><details><summary>The Hunger of the Gods · 9</summary><h2>Story and connections</h2><p>He calls Kalv his son and expects to see him and Myrk again soon.</p></details><details><summary>The Hunger of the Gods · 14</summary><h2>Crossing Isbrún Bridge</h2><p>Biórr says Fain found him after his escape from slavery when very young. During the bridge crossing, the narration explicitly identifies Storolf as Fain’s son; this is distinct from Storolf’s earlier figurative brotherhood with Biórr.</p></details><details><summary>The Hunger of the Gods · 14</summary><h2>Crossing Isbrún Bridge</h2><p>At the tennúr emergence he and Storolf organise the Raven-Feeders into a shield wall, and Fain orders it forward.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>He marches with Biórr and Storolf and prompts Biórr to help make camp. When Storolf comments on Biórr’s silence, Fain signals his son and says to give him time; he does not offer an explicit solution for Biórr’s guilt.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>Nastrandir revealed in the snow</h2><p>He is present with Storolf and Biórr by the carts. When Storolf names Kalv as his brother and a hoped-for better teacher, Fain praises Storolf as as good a teacher as any and affectionately ruffles his hair. Kalv’s return and current location are not shown.</p></details><details><summary>The Hunger of the Gods · 42</summary><h2>Inside Nastrandir&#x27;s great hall</h2><p>At Nastrandir’s threshold Biórr sees Fain gawping alongside Storolf. Fain nudges Storolf and the three enter the dark hall together, amid the pressure of the following column. No separate dialogue or new personal injury is given to Fain.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>He has been training dragon-worshippers when he approaches the grieving Storolf. He shares his son’s fear for Kalv and embraces him. Storolf reports dark dreams and a lost sense of his brother, which Biórr reads as probable death. Kalv is not seen, and no explicit messenger/family identity merger follows. Fain later stands with Storolf, Ilmur and Biórr at the council.</p></details><details><summary>The Hunger of the Gods · 60</summary><h2>Guðvarr taken into Nastrandir</h2><p>He grieves at the report of Kalv&#x27;s death, says he felt something wrong in his blood and threatens Skalk. His response joins Storolf&#x27;s, while the precise kinship to this messenger remains Guðvarr&#x27;s inference in the passage.</p></details><details><summary>The Hunger of the Gods · 73</summary><h2>Biórr at the siege</h2><p>He guards the children and supplies with Storolf and Biórr and invokes Rotta&#x27;s orders against abandoning the post.</p></details><details><summary>The Hunger of the Gods · 75</summary><h2>The rescuers pursued</h2><p>He and Storolf pursue Orka&#x27;s party with Biórr. In combat Orka bites his cheek and jaw; he collapses wheezing and bleeding badly. His condition at this cutoff is grave but not separately confirmed dead.</p></details><details><summary>The Hunger of the Gods · 76</summary><h2>Captives before Rotta</h2><p>He still draws ragged breaths through his face and neck wounds while Storolf cradles him and calls him Papa. This chapter does not independently confirm his death.</p></details><details><summary>The Fury of the Gods · 5</summary><h2>The dead and the choice of revenge</h2><p>He survives with the cheek and jaw wound bandaged, seated at a shattered wagon wheel and beginning to shiver with fever. Holding his dead son Storolf&#x27;s hand, he fears the war&#x27;s cost is beyond him. Biórr urges him to heal and continue fighting; he eventually nods, without demonstrated recovery.</p></details><details><summary>The Fury of the Gods · 7</summary><h2>Orka sees the white-haired man she mauled sitting on a wagon bench beside Harek</h2><p>Orka sees the white-haired man she mauled sitting on a wagon bench beside Harek. The chapter shows continued travel, without demonstrating healing from the previously recorded wound and fever.</p></details><details><summary>The Fury of the Gods · 11</summary><h2>An unseen enemy follows the host</h2><p>His facial cuts are healing into scabs and red swollen skin, though speech still slurs through the swelling. He warns Biórr of danger and says he does not want to lose him as he lost Storolf. He reports keeping close watch on Orka overnight. Orka notices the long-axe he carries during Rotta&#x27;s offer. Later he strikes Dagrun with the butt of his long-axe after the prisoner chuckles; no full recovery or end to fever is independently declared.</p></details><details><summary>The Fury of the Gods · 15</summary><h2>He responds to Rotta’s call to protect him as the warband forms a two-deep shield wall</h2><p>He responds to Rotta’s call to protect him as the warband forms a two-deep shield wall. The attacking Berserkir and Úlfhéðnar fracture that defence; Fain’s individual later outcome is not narrated here.</p></details><details><summary>The Fury of the Gods · 16</summary><h2>Grief and pursuit at the river</h2><p>He strikes the Berserkir threatening Biórr with his long-axe from the second row, helping Biórr finish the attack. He follows Biórr towards Orka’s group, is knocked to one knee by a shield boss, then stands and leads the Raven-Feeders against a black-shield defender. He remains active; no final outcome is supplied.</p></details><details><summary>The Fury of the Gods · 17</summary><h2>As he wrestles a Berserkir, Orka retrieves his dropped long-axe</h2><p>As he wrestles a Berserkir, Orka retrieves his dropped long-axe. His jaw juts and tusks show; a seax wounds his thigh, and he drives the tusks into his opponent’s throat. His subsequent survival or death is not supplied.</p></details><details><summary>The Fury of the Gods · 24</summary><h2>Rotta returns to Darl</h2><p>He survives the valley battle and is back in Darl on a wagon bench, one leg wrapped in a blood-soaked bandage, Harek beside him. The injury remains active; no final recovery, full examination or new fatal wound is established.</p></details><details><summary>The Fury of the Gods · 36</summary><h2>The dragon’s host marches out</h2><p>He favours the injured leg while climbing onto the wagon bench and massages his thigh, with a new long-axe under his feet. Harek sits beside him and another dozen children behind. He hopes the war will spare them thraldom, while Biórr adds vengeance. No complete leg recovery or identification of Bjarn among the children is supplied.</p></details><details><summary>The Fury of the Gods · 41</summary><h2>Ilska asks about Orka</h2><p>He oversees the Tainted children’s dawn sparring in the marching camp, where Harek knocks a partner down with a shield. Supervision does not show his earlier leg wound completely healed.</p></details><details><summary>The Fury of the Gods · 50</summary><h2>He is alive after the wagon attacks, ash-streaked with a long forearm cut, side unspecified</h2><p>He is alive after the wagon attacks, ash-streaked with a long forearm cut, side unspecified. He carries Aila, unconscious but breathing, to Biórr and the children’s fire, reassures Harek and stops a fight with Bjarn. When Bjarn challenges collarless confinement and asks to go, Fain orders him to stop. Biórr asks to inspect his cut; no treatment or full recovery is shown.</p></details><details><summary>The Fury of the Gods · 53</summary><h2>A night march under false campfires</h2><p>Biórr says he still cannot walk properly and his wound is unhealed; Fain wishes for frontline vengeance for Storolf but continues daily instruction with leather-covered spears/shields and practical camp tasks. Biórr likens his role to a father, not literal parentage. At the tennúr order he tells the group to break camp for the night march; no full medical clearance or new freedom is shown.</p></details><details><summary>The Fury of the Gods · 80</summary><h2>Snaka’s heart and the interrupted feast</h2><p>Alive but still injured with Harek/the children at camp, he regrets missing the battle and believes guarding them serves their free future. He is shocked to hear Elvar had freed the Tainted. No full healing, new fight or complete roster of children is supplied.</p></details><details><summary>The Fury of the Gods · 87</summary><h2>Biórr returns Bjarn</h2><p>He guards the children with Biórr, laments Tainted fighting Tainted and initially values freedom/revenge. After Faunir pass the wagon without attack, he agrees to leave the gods’ war. Harek sits beside him as he takes the reins and drives the children away through snow, intending to wait in the woods for Biórr; arrival/safety is not yet shown.</p></details><details><summary>Illustration · The Fury of the Gods · 5</summary><p><a href="assets/14f93446e928c5.jpg">Open noncanonical illustration</a></p><p>Biórr and Fain after the escape.</p></details><details><summary>Illustration · The Fury of the Gods · 16</summary><p><a href="assets/5c77717d0b0b6f.jpg">Open noncanonical illustration</a></p><p>Biórr and Fain during the brief shield-wall respite.</p></details><details><summary>Illustration · The Fury of the Gods · 50</summary><p><a href="assets/0853f7b48aa5cf.jpg">Open noncanonical illustration</a></p><p>Bjarn asking to choose whether to leave.</p></details><details><summary>Illustration · The Fury of the Gods · 11</summary><p><a href="assets/7eef904efccce4.jpg">Open noncanonical illustration</a></p><p>Orka refusing Rotta’s conditional offer.</p></details><details><summary>Illustration · The Hunger of the Gods · 9</summary><p><a href="assets/4efe40df61c500.jpg">Open noncanonical illustration</a></p><p>Red Fain during the camp reunion with Biórr.</p></details></noscript>
