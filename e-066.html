      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 6</summary><h2>A child and an injured vaesen</h2><p>The earlier narration calls Orka’s named companion Spert a Spertus, establishing the existing creature-type record.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>A few spertus now stand along Nastrandir’s hall edges among vaesen gathered to Lik-Rifa, their wax-melted faces still and black-dripping stings curled over their backs. No arriving individual is identified as Spert, and the scene supplies no exact total or new individual names.</p></details><details><summary>The Fury of the Gods · 36</summary><h2>Spertus emerge from streams to join Lik-Rifa’s host outside Darl</h2><p>Spertus emerge from streams to join Lik-Rifa’s host outside Darl. No particular named individual is identified, and this is not a revival of Spert.</p></details><details><summary>The Fury of the Gods · 41</summary><h2>Ilska asks about Orka</h2><p>Ilska generalises that spertus are loyal to Lik-Rifa, but Biórr corrects her with Not all after recounting Orka’s companion. This explicitly contests universal allegiance, without defining every individual’s loyalty.</p></details><details><summary>The Fury of the Gods · 57</summary><h2>Rafts and ladders reach the defences</h2><p>A crowded succession swims down the tributary stream toward the siege river, black-shining chitin, antennae, curved tails and stings visible to Guðvarr. They are swimming spertus, not the deceased individual Spert. Their next destination after reaching the river and any successful entry remain unshown.</p></details><details><summary>The Fury of the Gods · 58</summary><h2>Holding the gate walkway</h2><p>They emerge on the defended riverbank and attack through the ditch, some opening shells to spread wings and fly. Arrows spill black blood and bring many down, but scores reach and cross the palisade with barbed limbs. Their black poison clouds and stings accompany heaps of dead and weakening resistance; no exact toxin mechanism, total or named individual is supplied.</p></details><details><summary>The Fury of the Gods · 59</summary><h2>Across the wall towards the hall</h2><p>One approaches Guðvarr with a bead at its sting, regards his friendship plea and leaves as Sigrún intervenes; no universal allegiance-recognition rule follows. Flying spertus then sting behind a small defender shield wall, one saving Guðvarr from a threatening spearman and others spreading black veins/choking. They pursue retreaters with stings and mouth-spread pestilence. Exact poison properties, kill totals and named victims remain unspecified.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>Archer volleys thin their flying/scuttling approach to roughly a score</h2><p>Archer volleys thin their flying/scuttling approach to roughly a score. One catches its sting in Elvar’s shield and Grend chops it; another exhales a cloud that black-veins a defender. A wind disperses the cloud and defenders spear the flier. Survivors retreat at the enemy horn. No antidote, exact toxicity or total species loss is established.</p></details><details><summary>Illustration · The Fury of the Gods · 57</summary><p><a href="assets/6f5f69946c0541.jpg">Open noncanonical illustration</a></p><p>The spertus crowding the tributary.</p></details><details><summary>Illustration · The Fury of the Gods · 58</summary><p><a href="assets/a6bdbc1d301bcc.jpg">Open noncanonical illustration</a></p><p>The winged spertus reaching the palisade.</p></details><details><summary>Illustration · The Fury of the Gods · 60</summary><p><a href="assets/ce8019951659df.jpg">Open noncanonical illustration</a></p><p>The wind dispersing poison along the shield line.</p></details></noscript>
