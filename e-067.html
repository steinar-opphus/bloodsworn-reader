      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 6</summary><h2>A child and an injured vaesen</h2><p>Breca reports the creature’s name as Vesli. Thorkel identifies her as a tennúr.</p></details><details><summary>The Shadow of the Gods · 6</summary><h2>A child and an injured vaesen</h2><p>She has thin wings, large black eyes and two rows of teeth. She is bleeding beneath one wing when found.</p></details><details><summary>The Shadow of the Gods · 6</summary><h2>A child and an injured vaesen</h2><p>Breca says he gives her a tooth. She shields Breca from Orka.</p></details><details><summary>The Shadow of the Gods · 8</summary><h2>Oaths at the family steading</h2><p>Breca says Vesli was outcast by her pack.</p></details><details><summary>The Shadow of the Gods · 8</summary><h2>Oaths at the family steading</h2><p>Vesli cuts her palm and swears faithfulness to Breca and Spert on her life-blood. Thorkel says she owes a blood-debt if she survives.</p></details><details><summary>The Shadow of the Gods · 15</summary><h2>Grief and the decision to leave</h2><p>Vesli follows Breca throughout the steading, and her wounds seem to be healing well. Orka feeds her ham and onions. At the family meal, Vesli argues that the dead do not need their teeth.</p></details><details><summary>The Shadow of the Gods · 17</summary><h2>The burning home and the stolen child</h2><p>In B01-C017, Orka finds Vesli motionless beneath a woman’s body, her head and face bloody. On returning to retrieve her spear, she discovers Vesli moving and picks her up. Outside the collapsing hall, she lays Vesli beside Thorkel; Vesli is breathing and twitching.</p></details><details><summary>The Shadow of the Gods · 19</summary><h2>Treating wounds and remembering the attack</h2><p>Vesli’s cleaned head wound is a ragged gash from forehead along the crown, with a chewed appearance. She confirms she stitched Spert’s wound and gives him water. She cleans Orka’s wounds and applies a substance after spitting; Orka feels less pain. Vesli’s spit congeals into tendon-like strings when kneaded. She claims Orka will heal faster.</p></details><details><summary>The Shadow of the Gods · 19</summary><h2>Treating wounds and remembering the attack</h2><p>Vesli reports humans and vaesen entering over the wall, including skraeling and oathless tennúr. She says a human-like, red-eyed attacker with two long claws fought Thorkel, agreeing with Orka’s suggested Tainted classification. She says she fought tennúr trying to take Breca and next remembers Orka carrying her outside.</p></details><details><summary>The Shadow of the Gods · 19</summary><h2>Treating wounds and remembering the attack</h2><p>Orka releases Vesli and Spert from their oaths. Vesli helps with Thorkel’s burial and offers to accompany Orka, who instead tells her to stay and help Spert.</p></details><details><summary>The Shadow of the Gods · 51</summary><h2>Flying to Orka&#x27;s aid in Grimholt</h2><p>She reaches Orka in Grimholt’s tower with Spert and the giant ravens, flying among the guards and attacking with Breca’s spear.</p></details><details><summary>The Shadow of the Gods · 53</summary><h2>A half-spear and teeth on the fortress steps</h2><p>At the Bloodsworn’s arrival she sits near Orka on the steps with a half-spear and eats human teeth.</p></details><details><summary>The Hunger of the Gods · 1</summary><h2>Rest and restraint in the burned hall</h2><p>She sleeps under a membranous wing on the riverbank holding Breca&#x27;s small spear, then wakes and warns that Lik-Rifa is free.</p></details><details><summary>The Hunger of the Gods · 3</summary><h2>Mord&#x27;s burial and a blood feud</h2><p>She eats porridge on Orka&#x27;s knee and then a human tooth from a jar. She later reports seeing a mailed woman carrying someone with blue markings on neck and chin; her report supplies no name for the carried person.</p></details><details><summary>The Hunger of the Gods · 10</summary><h2>The night-hag in the woodland camp</h2><p>She reaches Orka and Lif after the night-hag attack, sleepy and holding her spear. She says Spert is sleeping.</p></details><details><summary>The Hunger of the Gods · 15</summary><h2>The search through Rotta&#x27;s chamber</h2><p>She carries Breca’s half-spear at the excavation and smells the dead. She eats teeth from a fair-haired corpse and stores more in a leather belt pouch; at Orka’s command she turns to the old dragon-born’s body.</p></details><details><summary>The Hunger of the Gods · 15</summary><h2>The search through Rotta&#x27;s chamber</h2><p>The slab unsettles her. In the children’s room she joins Spert at a small mattress, pressing her nose to it; Spert says Breca was there. This supplies a reported past trace rather than a current location.</p></details><details><summary>The Hunger of the Gods · 18</summary><h2>Training and an encounter in the rain</h2><p>While the warriors prepare breakfast she eats collected teeth overhead. She later warns of approaching riders, giving the party time to arm and hide before Raven-Feeders reach the glade.</p></details><details><summary>The Hunger of the Gods · 20</summary><h2>Myrk confronted in the glade</h2><p>At the mine Myrk asks whether she ate her father’s teeth; Vesli grins without a verbal admission. During the fight she obeys Orka’s order to help Lif and stabs his attacker’s calf. Orka throws an axe into another warrior’s head as he raises a sword over Vesli. Afterward Vesli says she is happy about all the teeth.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>Wounds tended and seaxes compared</h2><p>She cleans Orka’s forehead and removes broken mail rings from the shoulder bite with her needle-like talons. She kneads regurgitated green material onto both injuries, which become warm and then numb. Later serious wound pain is absent, but this does not establish complete healing.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>Wounds tended and seaxes compared</h2><p>At Orka’s request she helps Gunnar, applying the material to a thigh gash despite his objections about its smell. After she reports helping Orka’s friends, Orka lets her collect teeth. Her outer tooth row is needle-sharp and her inner row flat and broad. She eventually complains that her full pouch needs to be bigger.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>She studies Myrk’s teeth, exposes her own two rows after an insult and joins Spert in guarding her. During the red-eyed struggle she holds her spear-point at Myrk’s heart as Orka and Spert threaten her. No spear wound or removal of teeth occurs.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>Orka&#x27;s search in Starl</h2><p>She flies above the party holding Breca’s spear, a full bag of teeth at her belt. Orka tells her and Spert to remain outside Starl, watch the lake and look for her on the water within a day. She flies north with Spert; the actual lookout and reunion are not shown.</p></details><details><summary>The Hunger of the Gods · 50</summary><h2>The wolf&#x27;s call across the lake</h2><p>She comes from the trees at Orka’s whistle, hovering with Breca’s short spear, while Spert emerges from the lake. She says she feared missing the expected ship and losing Orka again. Lif explains the new pursuit ruse; she grins with her two rows of teeth and praises its cunning.</p></details><details><summary>The Hunger of the Gods · 50</summary><h2>The wolf&#x27;s call across the lake</h2><p>Questioned about their manner, she reports that their maker called in the darkness. Spert identifies Lik-Rifa and describes a voice in his head, which Vesli says she also heard. She says Lik-Rifa made them or the kin who spawned them and that the voice came like a song during sleep, ordering them to come and promising great and terrible deeds. This is her testimony with creation/descent alternatives intact.</p></details><details><summary>The Hunger of the Gods · 50</summary><h2>The wolf&#x27;s call across the lake</h2><p>She says she remained because Orka and Breca saved her when her own kin cast her out. Resisting was hard, but their oath and pact to find Breca gave strength to refuse. Orka recognises the parallel with her own resistance and accepts the pair’s continued presence. The account supplies motives and a reported refusal, not absolute immunity to later summons or a new rescue event.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>Her teeth bag looks lighter than at Rotta’s chamber. Spert names her the better flier and she agrees, joking about his weight. Orka proposes carrying Elvar’s message and silver ring to Glornir. Vesli catches the ring with a hook-clawed foot but dips under its weight; she cannot give a daily carrying range and looks anxious while promising to try. Orka defers the message and takes the ring back. No flight errand is dispatched.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>Gunnar credits her spit while demonstrating improved use of his wounded leg. Given a choice about fighting, she volunteers and fetches her short spear. Orka privately asks her and Spert to keep Lif alive. After the courtyard fight she hammers a dying skraeling’s teeth with the spear butt; no exact tooth collection is counted.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>She tends Lif’s deep cheek gash with stringy mucus, kneading it and holding the skin together to bind, then scolds him for moving when he smiles. This is active treatment, not completed healing. During the raven conversation she disputes Gunnar’s suggestion that friends normally must be human.</p></details><details><summary>The Hunger of the Gods · 64</summary><h2>The hidden doors into Nastrandir</h2><p>She has agreed to travel on a giant raven with Kló and Grok towards Darl to seek Glornir&#x27;s company for Orka&#x27;s bargain with Elvar. She leaves tearfully; no completed delivery is observed here. Lif&#x27;s cheek scar is now healing well after her earlier treatment.</p></details><details><summary>The Fury of the Gods · 1</summary><h2>After the battle at Valdai</h2><p>She arrives at Valdai on one of two giant ravens, dropping down with her wings open and a bag at her waist. She delivers Orka&#x27;s message to Glornir: Elvar wishes to hire the Bloodsworn to slay a dragon. The response to the offer is not shown.</p></details><details><summary>The Fury of the Gods · 6</summary><h2>Warnings and the search for Frøya</h2><p>After permission to feed on the dead druzhina she returns with a bulging bag Varg understands to contain their teeth. She remembers the omitted part of Orka&#x27;s message: Uspa is with Elvar and the dragon-born have taken Bjarn. This is delivered information from Orka&#x27;s earlier knowledge, not a present-day sighting of Bjarn.</p></details><details><summary>The Fury of the Gods · 30</summary><h2>The casters and the mother serpent</h2><p>She returns with her belt bag overflowing with freshly taken teeth and hugs Breca, saying she missed and worried for him. He strokes her head and reciprocates. Perching on his shield rim, she asks for Spert; his tears and headshake make her weep and cry No. The scene conveys the loss without a fresh detailed account of his killing.</p></details><details><summary>The Fury of the Gods · 32</summary><h2>Debts, kinship and the voyage onward</h2><p>She admits she forgot to tell Glornir about Elvar’s collared Ulfrir, despite conveying the important mission news. Glornir’s surprise therefore records his prior ignorance rather than changing the earlier message into a full briefing.</p></details><details><summary>The Fury of the Gods · 39</summary><h2>She sits on Breca’s lap eating teeth from her belt pouch as he imitates Orka’s rowing</h2><p>She sits on Breca’s lap eating teeth from her belt pouch as he imitates Orka’s rowing. No new injury or independent scouting report is given.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>She perches on Breca’s shoulder as the gathered company enters Wolfdales</h2><p>She perches on Breca’s shoulder as the gathered company enters Wolfdales. No new injury or special disguise is supplied for her.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>Freedom and the approaching army</h2><p>Perched at the battlements, she wraps her arms round Breca and kisses his cheek before the siege attack.</p></details><details><summary>The Fury of the Gods · 58</summary><h2>She attacks a skraeling threatening Breca from above, using claws/teeth until it falls from the wall</h2><p>She attacks a skraeling threatening Breca from above, using claws/teeth until it falls from the wall. Later she spears an attacking tennúr during the gate breach. Her actions oppose particular enemies, not all members of her own type.</p></details><details><summary>The Fury of the Gods · 62</summary><h2>She flies above Breca, Lif and Sæunn as they run toward the stone doors, carrying a short spear</h2><p>She flies above Breca, Lif and Sæunn as they run toward the stone doors, carrying a short spear. No new Vesli strike or safe hall entry is shown.</p></details><details><summary>The Fury of the Gods · 65</summary><h2>She sits on Breca’s shoulder while he rests on Glornir’s lap among the talking companions</h2><p>She sits on Breca’s shoulder while he rests on Glornir’s lap among the talking companions. No new injury or flight is narrated.</p></details><details><summary>The Fury of the Gods · 70</summary><h2>She pulls long yellowed teeth from a fallen skraeling with a foot on its jaw</h2><p>She pulls long yellowed teeth from a fallen skraeling with a foot on its jaw. Their intended use is not stated, and no new Vesli attack or injury is shown in this moment.</p></details><details><summary>The Fury of the Gods · 74</summary><h2>She swoops from the sky, small and hairless, intercepting Drekr as he rushes Orka</h2><p>She swoops from the sky, small and hairless, intercepting Drekr as he rushes Orka. Clinging to his head with claws/teeth, she goes with him down the hill and out of sight. Her survival and Drekr’s fate remain unresolved.</p></details><details><summary>The Fury of the Gods · 76</summary><h2>She flies back alive and is embraced by Breca, then accepts Orka’s thanks for intercepting Drekr</h2><p>She flies back alive and is embraced by Breca, then accepts Orka’s thanks for intercepting Drekr. She reports the bad man got away, shows a long tooth as the part that did not and crunches it. Glornir asks her to search for surviving friends/Elvar’s host; she offers to try, without a shown reconnaissance result.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>The survivors’ camp and reunion</h2><p>She arrives at the woodland camp, announces herself so defenders lower their threat and says she brings friends. Guards then escort Glornir/Vol/Orka and their Bloodsworn inside. Svik welcomes her as eyes in the sky; this is an actual successful reunion, without a full search tally.</p></details><details><summary>The Fury of the Gods · 79</summary><h2>A night of repairs and choices</h2><p>She reports the three gods and reduced guards at the riverbank before ruined Wolfdales, landing on Ulfrir’s shoulder. He conditionally promises a mountain of teeth in gratitude; she then sleeps on Breca’s lap. This is a completed enemy-location report, without a new battle or actual reward delivery.</p></details><details><summary>The Fury of the Gods · 91</summary><h2>Return to the ruined homestead</h2><p>She leads the approach excitedly, perches on an iron-chain-bound oak chest in the wagon and eats teeth from a sack. The chest’s contents remain unreported. At the barrow she joins Breca on his shoulder.</p></details><details><summary>Illustration · The Fury of the Gods · 76</summary><p><a href="assets/ab304df5413ea2.jpg">Open noncanonical illustration</a></p><p>Breca embracing Vesli at the riverbank regrouping.</p></details><details><summary>Illustration · The Fury of the Gods · 77</summary><p><a href="assets/351bb7176446cb.jpg">Open noncanonical illustration</a></p><p>Glornir’s party entering the survivors’ snowy camp.</p></details><details><summary>Illustration · The Hunger of the Gods · 18</summary><p><a href="assets/4d9a3ee18664ae.jpg">Open noncanonical illustration</a></p><p>Vesli eats a collected tooth while perched on a pine branch.</p></details><details><summary>Illustration · The Shadow of the Gods · 21</summary><p><a href="assets/cf278bd7678aa1.jpg">Open noncanonical illustration</a></p><p>Vesli bandaged and resting in Breca&#x27;s small handcart.</p></details><details><summary>Illustration · The Fury of the Gods · 1</summary><p><a href="assets/203e711c970de2.jpg">Open noncanonical illustration</a></p><p>Vesli arrives at Valdai.</p></details></noscript>
