      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 59</summary><h2>New looks on the journey through Ulaz</h2><p>The port spans both banks of a river estuary and is crowded with docks, tiled buildings, towers and trees. Colossal bull and scorpion statues stand at the entrance. Svik&#x27;s story describes its legendary beginnings; that account remains separate from observed geography. Edel reports restricted eastern-harbour access whose purpose remains unknown.</p></details><details><summary>The Fury of the Gods · 10</summary><h2>The road to Ulaz</h2><p>Varg approaches from foothills above whitewashed houses and red tile roofs along a sluggish brown river, with green groves and pools among the buildings. Crowded markets include moneylenders with tally sticks, varied wares and fighting pits where bull trolls are made to fight.</p></details><details><summary>The Fury of the Gods · 10</summary><h2>The road to Ulaz</h2><p>A guarded bridge now controls the eastern bank, whose docks hold hundreds of longships and transports. Rurik crosses with druzhina and a rune-wielder; Svik thinks the fleet nearly ready for an invasion. Before reaching the rendezvous, Varg is ambushed by unidentified armed men, some with golden-eye shields. The chapter gives no proof of their affiliation with the fleet.</p></details><details><summary>The Fury of the Gods · 12</summary><h2>The captors reveal their purpose</h2><p>After the street ambush, Varg and his companions are held in a timber building where daylight enters through gaps and waves are audible. He infers a warehouse near the docks, but no address is established. Sterkur identifies himself, Leif asserts his claim and an execution attempt is disrupted by Svik. The final sound at the wall remains unidentified.</p></details><details><summary>The Fury of the Gods · 14</summary><h2>The warehouse rescue</h2><p>The Bloodsworn break their companions out of the warehouse, then withdraw through the alarmed docks to Sea-Wolf and Sulich’s horse transport. Mounted druzhina shoot from the pier, but both ships escape their range and pass the bull and scorpion statues at sunset.</p></details><details><summary>Illustration · The Fury of the Gods · 14</summary><p><a href="assets/298e3ec301f037.jpg">Open noncanonical illustration</a></p><p>The two vessels rowing beyond the pier’s arrows.</p></details><details><summary>Illustration · The Hunger of the Gods · 59</summary><p><a href="assets/01975ff42a823d.jpg">Open noncanonical illustration</a></p><p>Noncanonical establishing view of Ulaz.</p></details></noscript>
