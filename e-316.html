      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 7</summary><h2>Introduction</h2><p>Dagrun is Orlyg’s son and a chained chief among the prisoners at Svelgarth.</p></details><details><summary>The Fury of the Gods · 7</summary><h2>The Fury of the Gods - chapter 7</h2><p>Named as Jarl Orlyg&#x27;s son and a chained chief among the Svelgarth prisoners, he tells Hagal to sit when Myrk threatens the drengr for trying to intervene against the attack on stragglers. He challenges Myrk&#x27;s claim that the victims&#x27; use should comfort the captives; she replies that she hopes it does not.</p></details><details><summary>The Fury of the Gods · 11</summary><h2>He chuckles at Rotta&#x27;s failed offer to Orka and Fain strikes him with a long-axe butt</h2><p>He chuckles at Rotta&#x27;s failed offer to Orka and Fain strikes him with a long-axe butt. When his drengrs react and Biórr approaches with a spear, he orders them to do nothing and they calm.</p></details><details><summary>The Fury of the Gods · 15</summary><h2>At the river attack he cries Father and throws his wrist-binding rope around a cultist’s throat</h2><p>At the river attack he cries Father and throws his wrist-binding rope around a cultist’s throat. Other prisoners turn on their guards. Two longships have approached and warriors with white wolf-marked shields land from one, but his father is not directly named in the observed landing.</p></details><details><summary>The Fury of the Gods · 17</summary><h2>Orka’s group saves him from a throttling skraeling and other attackers</h2><p>Orka’s group saves him from a throttling skraeling and other attackers. Later he offers them passage, runs with his drengrs to the ships and helps a woman and a girl aboard the second. This opportunity provides the reunited group’s escape route.</p></details><details><summary>The Fury of the Gods · 22</summary><h2>Breca’s training and Orlyg’s passengers</h2><p>He invites Orka to the stern and supports her account of saving him, prompting his father’s thanks and passage offer. He reports Svelgarth ruined and its Galdur tower destroyed. He rejects joining the enemy and argues that Elvar is now the enemy of their enemy, helping move the destination towards Snakavik.</p></details><details><summary>The Fury of the Gods · 26</summary><h2>Dark-haired and braided with wind-reddened face, he takes rowing shifts, winning Orka’s approval</h2><p>Dark-haired and braided with wind-reddened face, he takes rowing shifts, winning Orka’s approval. He brings Brynjolf’s mail and helm, reporting his oathsworn man died in the night and claiming ownership to give the gear as his own repayment. Orka accepts, and he offers a spare cap. He whispers that he knows what she is and promises secrecy; the exact knowledge is not specified and he does not expose her here.</p></details><details><summary>The Fury of the Gods · 28</summary><h2>He boards beside his father and Gösta</h2><p>He boards beside his father and Gösta. When Gösta’s net distracts the collared caster and her protection briefly fades, he spears her belly and knocks her overboard into the sea. No final death or subsequent rescue is shown.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>Arrival at the wolf-god’s hall</h2><p>He accompanies Orlyg to the Bloodsworn’s pier with Gösta and the fifty-or-sixty following, then joins the approach behind the company. No new disclosure of Orka’s secret occurs.</p></details><details><summary>The Fury of the Gods · 43</summary><h2>He stands beside Orlyg as the jarl offers his surviving force and receives Elvar’s acceptance</h2><p>He stands beside Orlyg as the jarl offers his surviving force and receives Elvar’s acceptance. He does not disclose Orka’s secret or speak new terms in this exchange.</p></details><details><summary>The Fury of the Gods · 48</summary><h2>Return from the sortie</h2><p>He sits among the wounded at Wolfdales with blood down one side of his face while a scalp wound is cleaned. The side, precise cause and final recovery are not given.</p></details><details><summary>The Fury of the Gods · 52</summary><h2>The choice to hide the beast</h2><p>He confirms to Orka that he saw her beast against Myrk, keeps the secret and asks friendship with reciprocal help rather than more payment. He says deeds matter more than blood and praises her rescue to Breca. No blood-oath, completed favour or public disclosure occurs.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>She stands with Orlyg, his drengrs and Tainted on Elvar’s left flank at the hillside stand</h2><p>She stands with Orlyg, his drengrs and Tainted on Elvar’s left flank at the hillside stand. No new wound or healing of her earlier scalp injury is specified.</p></details><details><summary>The Fury of the Gods · 83</summary><h2>Dagrun is still beside his father Orlyg when the rear attack breaks the line</h2><p>Dagrun is still beside his father Orlyg when the rear attack breaks the line. Drekr’s axe haft strikes his jaw and throws him down; his subsequent survival is not shown.</p></details><details><summary>The Fury of the Gods · 86</summary><h2>Orka and Breca confront Drekr</h2><p>Explicitly Orlyg’s son, he rises alive, split-lipped and swaying after the jaw blow, sees his father dead and moves against Drekr with sword/shield. Orka passes him to intercept. No healed scalp/jaw diagnosis or final battle fate is supplied.</p></details><details><summary>Illustration · The Fury of the Gods · 26</summary><p><a href="assets/ed843c0b7f290d.jpg">Open noncanonical illustration</a></p><p>Dagrun’s armour gift and quiet assurance to Orka.</p></details></noscript>
