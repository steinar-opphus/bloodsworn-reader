      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 4</summary><h2>Introduction</h2><p>Frøya is Varg’s sister. He remembers her as his only friend.</p></details><details><summary>The Shadow of the Gods · 4</summary><h2>Story and connections</h2><p>Kolskegg bought both children. According to what Kolskegg told Varg, their parents sold them for a loaf of bread and twelve duck eggs. In that account Frøya was four winters old.</p></details><details><summary>The Shadow of the Gods · 4</summary><h2>Story and connections</h2><p>Varg’s first fight among the thralls was for an extra bowl of broth for her. She was shivering with fever then.</p></details><details><summary>The Shadow of the Gods · 4</summary><h2>Story and connections</h2><p>Varg thinks of her as dead. He wants to avenge her but does not know how. See the circumstances of her death.</p></details><details><summary>The Hunger of the Gods · 13</summary><h2>News of a missing sister</h2><p>Terna says Frøya was alive when Brimil sold Terna to Njal. She reports that Brimil beat Frøya for repeated escape attempts, and that Frøya spoke of and worried about Varg. This provides a lead through Brimil without establishing the circumstances of her death.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>Under Varg’s violent questioning, Brimil says he remembers her repeated escape attempts, admits punishing her and invokes sexual violence as a way to break defiance. He says he sold her to Brák Trolls-Bane, a trapper and hired hunter who is out of Darl. This supplies a new reported purchaser, not a sighting of Frøya, her later location or the circumstances of her death.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>Glornir promises Varg that Brák will face a reckoning, while insisting they must sail now. The promise is help for a future search, not a completed rescue or revenge.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>The man now explicitly naming himself Brák Trolls-Bane is directly shown with Drekr’s crew in Lik-Rifa’s northern camp, where he abuses Breca. This locates the named man from Brimil’s earlier account without independently confirming Frøya’s sale to him, her later whereabouts or her death’s circumstances. Varg does not learn this location in the chapter.</p></details><details><summary>The Hunger of the Gods · 47</summary><h2>Refna&#x27;s account aboard the Sea-Wolf</h2><p>Varg thinks of her when Refna says her older brother is dead. Refna’s ensuing account names Brák in Kel’s killing and Drekr as chief of her captors, but supplies no new event involving Frøya or explanation of her death. Røkia predicts paths crossing with Orka, not a completed answer or reckoning.</p></details><details><summary>The Fury of the Gods · 6</summary><h2>In the akáll performed for Varg, she runs through snowy woods and is recaptured</h2><p>In the akáll performed for Varg, she runs through snowy woods and is recaptured. An unnamed chief claims she escaped three times; she says she wants to return to her brother, and he orders Brák to make an example of her. She fights back with wolf strength recognised by Varg, but captors overpower her. The vision shows Brák fastening her hands to a tree and killing her with his seax. Her final word is Varg&#x27;s name. This account is explicitly the ritual vision, distinct from earlier reported leads.</p></details><details><summary>The Fury of the Gods · 61</summary><h2>The shield line under pressure</h2><p>Varg’s wish to face her murderer drives him to keep fighting despite two new wounds and offered front-rank rotation. No new fact about Frøya’s death or the murderer’s observed location is revealed.</p></details><details><summary>The Fury of the Gods · 62</summary><h2>The fighting withdrawal</h2><p>Varg names Brák as her murderer when he sees him, but Orka and companions persuade him to survive for a later opportunity. No revenge or newly witnessed death detail is supplied.</p></details><details><summary>The Fury of the Gods · 79</summary><h2>A night of repairs and choices</h2><p>Lif’s song prompts Varg’s childhood memories of sharing stolen honeycomb at Kolskegg’s farm and her laughing after pushing him over an anthill. These memories add their sibling closeness without a new death account.</p></details><details><summary>The Fury of the Gods · 84</summary><h2>Varg recalls her killing and dedicates pinning Brák to the tree to her</h2><p>Varg recalls her killing and dedicates pinning Brák to the tree to her. The ensuing reprisals are declared vengeance; her earlier akáll death account is not rewritten.</p></details></noscript>
