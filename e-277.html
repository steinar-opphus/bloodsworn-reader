      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>Tannbursta is the tennúr who names himself during the table exchange with Storolf at Nastrandir. Biórr thinks he may be chief because he seems the creature who speaks most often to Lik-Rifa. The office is an assumption, and the scene does not explicitly identify him with every earlier unnamed spokesman.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>He folds his wings and inspects the food, pale pink hairless skin marked by dark veins. His hands have long fingers. He complains that there are no teeth to eat. Storolf jokes about his own missing teeth and defends Tannbursta’s place in Lik-Rifa’s crew against Oleif’s insults.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>After knocking Oleif unconscious, Storolf leans beside him and throws Tannbursta a tooth with red flesh attached. Tannbursta catches it, grins and crunches it in his mouth. Oleif’s death, the exact tooth/socket and a general diet rule are not established.</p></details><details><summary>The Hunger of the Gods · 73</summary><h2>Biórr at the siege</h2><p>He offers Storolf a bloodied tooth and eats it after the refusal, demonstrating his own tooth-eating preference without assigning a new rank or authority.</p></details><details><summary>The Fury of the Gods · 41</summary><h2>Biórr recognises him as the tennúr chief among scouts returning over the hill</h2><p>Biórr recognises him as the tennúr chief among scouts returning over the hill. He tells Lik-Rifa the approaching party is Sigrún, Krúsa and the others sent out. This current recognition builds on Biórr’s earlier tentative chief assessment, without merging every unnamed tennúr spokesman with him.</p></details><details><summary>The Fury of the Gods · 47</summary><h2>Lik-Rifa orders her to find the withdrawn attackers, dispatching tennúr through the woods</h2><p>Lik-Rifa orders her to find the withdrawn attackers, dispatching tennúr through the woods. An unnamed returning scout says no one is out there; the speaker is not individually identified as Tannbursta.</p></details><details><summary>The Fury of the Gods · 50</summary><h2>The burned wagons and the captive children</h2><p>At the evening council she estimates two days to the wolf-den, against a food estimate of three/four days. This is scouting/travel prediction, not actual arrival or a proven short siege.</p></details><details><summary>Illustration · The Hunger of the Gods · 45</summary><p><a href="assets/501e855179ae0f.jpg">Open noncanonical illustration</a></p><p>Tannbursta on the table before the gift of the tooth.</p></details></noscript>
