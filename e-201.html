      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 2</summary><h2>Introduction</h2><p>His name reflects his light-footed stealth. At Oskutreð he finds an old silver arm ring and the recurved bow Elvar recognises as the white-winged gaoler&#x27;s. Whether bow or arrows caused the fiery effects remains uncertain.</p></details><details><summary>The Hunger of the Gods · 4</summary><h2>The descent beneath Oskutreð</h2><p>Grend gives him white-feathered arrows from the underground forge. Uspa senses power in them; Skuld says Verdani made them and recognises his bow as her sister&#x27;s, without explicitly naming its owner here.</p></details><details><summary>The Hunger of the Gods · 17</summary><h2>An uneasy bargain with Ulfrir</h2><p>When the tennúr swarm emerges, he shoots from behind the shield wall and brings one creature down before the swarm passes overhead towards Ulfrir’s wagon.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>A duel for the Battle-Grim</h2><p>At the new camp his belt carries a quiver and bow case; he brings oats to the pot. He nominates Sighvat for chief, then urges Elvar and Huld to reconsider their duel because the dragon hunt needs their strength.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>He appears ahead of the southbound company and announces the Wave-Jarl with a grin. The ship is subsequently seen moored to a willow tree, establishing the return rather than merely an intended destination.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The laden ship reaches Starl</h2><p>Elvar names him with Sighvat and Urt as the only people allowed ashore to buy food and ale at Starl, seeking to prevent loose talk about the hoard and gods. The order is given before the boarding-plank confrontation; his actual shopping or return with provisions is not shown.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>He reveals himself among the hooded participants after Orka halts the staged raid, reassuring the unbriefed Lif that they are friends and giving his name. This is a friendly deception to facilitate Myrk’s escape, rather than a hostile raid or new theft by Orv.</p></details><details><summary>The Fury of the Gods · 19</summary><h2>Hidden followers and the missing Grend</h2><p>He brings Svea before Elvar, identifying her as a wool-and-honey trader, and prompts her to repeat her news from Darl. This follows Elvar’s orders to question new arrivals at the docks.</p></details><details><summary>The Fury of the Gods · 38</summary><h2>He watches the western bank and warns of stalking shadows; Elvar identifies wolves</h2><p>He watches the western bank and warns of stalking shadows; Elvar identifies wolves. He distrusts Ulfrir and asks whether collar protection is enough, hearing Elvar’s claims about obedience and inheritance. At the pier he throws Skuld the mooring rope.</p></details><details><summary>The Fury of the Gods · 49</summary><h2>Building defences at the bridge gate</h2><p>On the new gate walkway he points out opportunities for arrows and dropped rocks, with piles of stones ready. His tactical suggestion is not an actual defence or new kill in the scene.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>Elvar Chainbreaker and the hillside stand</h2><p>He asks to use his full quiver with the archers before joining the shield wall; Elvar agrees and he joins Sulich’s crew. His arrows are not shown exhausted and his later return is not yet narrated.</p></details><details><summary>The Fury of the Gods · 63</summary><h2>The stone doors and the retreat inside</h2><p>He stands near Elvar and shoots a blue-glowing arrow from his rune-bow into a troll’s open mouth while Skuld separately attacks from above. No newly named bow or general new rune mechanism is supplied.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>Orv and Urt walk out together among the surviving Battle-Grim/captains</h2><p>Orv and Urt walk out together among the surviving Battle-Grim/captains. No new injury, full roster or individual later assignment is supplied.</p></details></noscript>
