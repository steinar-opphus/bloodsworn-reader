      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 33</summary><h2>A summons after the tower battle</h2><p>Skalk confirms completion of this replacement staff in a higher chamber of Darl’s Galdur tower. It is grey ash-wood with a thicker head retaining faint hair, eyes, nose and mouth. Light ripples across the grain at his touch. Guðvarr recognises it as what remains of the Froa killed by Sturla’s expedition; no personal name or identity with another Froa is established.</p></details><details><summary>The Hunger of the Gods · 33</summary><h2>Appearance</h2><p>When Skalk points it at Guðvarr and commands the hyrndur, its eyes flare green and its mouth seems to shift. The creature’s movement causes internal chest pain and weakness; a second spoken command stops the movement. This is a demonstrated use in the encounter, without proof that the staff alone is sufficient, or that it detects thoughts or betrayal.</p></details><details><summary>The Hunger of the Gods · 33</summary><h2>A summons after the tower battle</h2><p>Skalk boasts that his former attackers would fare differently now that he has a new staff. The chapter provides no rematch or completed use of it to replace Vol’s collar.</p></details><details><summary>The Hunger of the Gods · 48</summary><h2>Flight from the breakfast table</h2><p>Skalk carries his new staff when he emerges behind the tower guards. He strikes Kalv’s head twice with it, slowing him and then leaving him limp in the binding net. This is physical use of the staff; the chapter does not explicitly identify it as the channel of the initial fiery-net casting.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>During Kalv’s interrogation Skalk threatens that his Galdur-staff would cause pain beyond the hammer’s. The staff is not used on Kalv in the scene, so the comparison remains a threat rather than a new demonstration.</p></details></noscript>
