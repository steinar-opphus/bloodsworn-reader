      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 21</summary><h2>Introduction</h2><p>Frek is one of two Úlfhéðnar guarding Helka’s chamber door. Yrsa greets him by name. He is black-haired and dark-eyed, with the guards’ tattooed shaved head-sides and thick central braids. His eyes flicker amber as he steps close to sniff Guðvarr.</p></details><details><summary>The Hunger of the Gods · 21</summary><h2>Introduction in B02-C021</h2><p>He announces Yrsa and Guðvarr, then only stares when Guðvarr insists on also being called a drengr. Estrid later asks Helka to let Frek teach her weapons craft; the request does not establish that a lesson has taken place. He is not identified with an earlier unnamed guard.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>Helka selects him to accompany Hakon aboard the Bloodsworn’s loaned drakkar. In mail and an iron collar, with sword, seax and axe at his belt, he crosses the gangplank and stands beside Hakon and Æsa without answering her friendly greeting. His dark central braid and tattooed shaved sides confirm the earlier appearance; no new eye-change event is shown.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>He is aboard when the ship leaves Darl. Hakon’s return is promised but has not occurred.</p></details><details><summary>The Hunger of the Gods · 32</summary><h2>Children hidden in the barrels</h2><p>He silently follows Hakon at the evening meal. When Glornir refuses release the next day, he calmly advises reconsideration, reaching for no weapon. After Glornir promises release at Liga and no harm unless Hakon escapes, Frek says he is there to protect the prince and see him freed, and will test Glornir’s word. No fight or release occurs.</p></details><details><summary>The Hunger of the Gods · 32</summary><h2>Children hidden in the barrels</h2><p>Glornir points Hakon towards his iron collar while dismissing fairness. Svik later names a black-furred fictional wolf Frek while looking at him; Frek does not blink when Hakon nudges him. The fictional wolf’s fur, beating and rescue are not new facts about the guardian.</p></details><details><summary>The Hunger of the Gods · 32</summary><h2>Children hidden in the barrels</h2><p>At the close Varg sees him in shadow, looking down at hands clenched into fists. The narrative supplies neither his motive nor any subsequent action.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>He follows Hakon when Logur’s guards escort the prince away at Liga. Varg touches his arm and says he once believed he would always be a thrall. Frek pulls away, regards Varg with what Varg reads as despair, then shrugs and follows Hakon. He neither declares his thoughts about Svik’s tale nor becomes free here.</p></details><details><summary>The Hunger of the Gods · 41</summary><h2>Sigrún&#x27;s reckoning with Guðvarr</h2><p>He returns to Darl beside Hakon under an escort of two score royal drengrs and enters Helka’s hall with him. He looks at Guðvarr with flat, dead eyes during the welcome. This is a description of his gaze; he gives no explanation of his response to Svik’s tale, and no emancipation is shown.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>He enters behind Helka and Hakon among the Úlfhéðnar. At the queen’s command he swiftly restrains Hakon and bends him forward for the tattoo inspection. Asked about the dragon, he admits that all of their present group have had dark dreams of a dragon beating a storm with its wings. This is dream testimony, without an identified mechanism.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>When Kalv partly breaks the chair, Helka calls him again. He releases Hakon and crosses the room, leaving Kalv slumped with a cut throat and blood on his seax. Kalv is now dead; no other named person is killed by Frek in this scene.</p></details><details><summary>The Hunger of the Gods · 60</summary><h2>Guðvarr taken into Nastrandir</h2><p>He guides Guðvarr through the northern route, but refuses to approach the guards at Nastrandir, citing the danger of recognition. His smile reveals sharp teeth; he scents something strange and sends Guðvarr towards the peninsula alone.</p></details><details><summary>The Fury of the Gods · 34</summary><h2>A bargain in the forest glade</h2><p>Guðvarr recognises him from the northern mission beside Estrid, lean and wire-muscled with tattooed shaved head-sides, long top hair braided to the crown, axe and seax. Estrid says he thoroughly questioned travellers who supplied news of Störr and the wolf; his exact methods are not shown. He remarks that usefulness is the way of the world. The final withdrawal names Skalk’s party collectively, not an individual fate for every follower.</p></details><details><summary>The Fury of the Gods · 48</summary><h2>Varg sees him at the food bench with an iron collar, recognising Hakon’s former guard</h2><p>Varg sees him at the food bench with an iron collar, recognising Hakon’s former guard. No new owner, transfer, ritual or collar removal is described.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>Estrid collectively frees her Úlfhéðnar</h2><p>Estrid collectively frees her Úlfhéðnar. This is relevant to Frek’s previously observed collared role in her party, although he is not named individually during the release ritual; no new personal oath is narrated.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>He leads Helka’s former Úlfhéðnar up to Elvar without collars</h2><p>He leads Helka’s former Úlfhéðnar up to Elvar without collars. They credit her for their freedom and request oaths to her rather than Ulfrir; she accepts the offer, though the full rite is not narrated. He reports Estrid and Skalk’s messenger dealings, their plot with Broðir/Runa and Hjalmar’s involvement. His group searched to bring them to Elvar but reports they fled. Elvar welcomes them to fight where needed.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>Thorguna and Frek step forward as the chosen captains of the waiting Berserkir/Úlfhéðnar</h2><p>Thorguna and Frek step forward as the chosen captains of the waiting Berserkir/Úlfhéðnar. Elvar reminds them of the plan and orders control of their beasts. The full plan or performed transformation is not yet shown.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>The survivors’ camp and reunion</h2><p>He leads the Úlfhéðnar once thralled to Estrid and now sworn to Elvar out of the tunnel, then joins council. This reaffirms the freed group’s allegiance without inventing a new full oath rite at the camp.</p></details><details><summary>The Fury of the Gods · 79</summary><h2>A night of repairs and choices</h2><p>He joins with shaved sides and braided/tied crown hair, mail/sword/seax, explicitly affirming freedom. Recalling Svik’s freeing-wolf fable, he credits Elvar with choosing to change the world. Svik welcomes him with ale as Frek the Free; this dates the epithet rather than a new liberation rite.</p></details><details><summary>Illustration · The Hunger of the Gods · 21</summary><p><a href="assets/25c9e04e0dd0f2.jpg">Open noncanonical illustration</a></p><p>Frek at the door to Helka&#x27;s chamber.</p></details></noscript>
