      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 21</summary><h2>Introduction</h2><p>Huld is named among Agnar’s companions at Snakavik. Their red shields bear the Battle-Grim’s spear-and-axe sigil.</p></details><details><summary>The Shadow of the Gods · 32</summary><h2>The promise of Oskutreð</h2><p>Huld is the next youngest Battle-Grim warrior after Elvar and wears a bear-claw pendant.</p></details><details><summary>The Hunger of the Gods · 2</summary><h2>A burial and a surviving gaoler</h2><p>She is the youngest Battle-Grim after Elvar and has dark eyes.</p></details><details><summary>The Hunger of the Gods · 6</summary><h2>The swarm in the depths</h2><p>She cuts a creature away from Urt’s face during the swarm attack. Afterwards she argues for taking their treasure and leaving, then asks how a resurrected wolf-god could be controlled.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>A collar and the wolf-god&#x27;s return</h2><p>Lean-muscled, with her expression compared to wolf-hunger, she announces the Battle-Grim’s support for dragon-slaying. Uspa borrows her spear to carve the resurrection design.</p></details><details><summary>The Hunger of the Gods · 17</summary><h2>An uneasy bargain with Ulfrir</h2><p>Sweat has left her jet hair lank. Exhausted, she calls a halt and challenges Elvar’s right to command, proposing a discussion of Agnar’s successor and putting forward her own claim over a spoilt jarl’s daughter. No selection or duel occurs.</p></details><details><summary>The Hunger of the Gods · 17</summary><h2>An uneasy bargain with Ulfrir</h2><p>She yields to the need to reach the bridge. Once across, she calls for camp but accepts Elvar’s warning about the nest. When the tennúr swarm she stands at Elvar’s other side from Grend in the shield wall, their dispute temporarily set aside.</p></details><details><summary>The Hunger of the Gods · 17</summary><h2>An uneasy bargain with Ulfrir</h2><p>During her confrontation with Elvar she juts her chin out, one hand on her sword hilt and the other reaching for her bear-claw pendant.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>A duel for the Battle-Grim</h2><p>At sunrise she calls an Althing for the succession, ties her jet-black hair at the nape and puts herself forward while gripping the bear-claw at her neck. Elvar also stands. Huld refuses to yield and agrees to a duel to the death.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>A duel for the Battle-Grim</h2><p>Urt acts as her second with two reserve shields. Armed with sword, shield and belt-hung seax, she uses fast forceful attacks on Elvar’s shield side. She claims street-fighting experience in Svelgarth and threatens to take Elvar’s gold arm ring; these are her own stated background and taunt.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>A duel for the Battle-Grim</h2><p>She strikes at the apparently weakened shoulder side, but Elvar traps her sword, cuts through her mouth and then kills her with a throat thrust while pinning her wrist. Her death is explicit. Elvar’s first order as chief is to raise a barrow and honour her as a Battle-Grim who fought and died well; the finished burial is not shown.</p></details><details><summary>Illustration · The Hunger of the Gods · 28</summary><p><a href="assets/5b44680d1a5054.jpg">Open noncanonical illustration</a></p><p>Huld presses Elvar&#x27;s shield side during their duel for the Battle-Grim&#x27;s leadership.</p></details><details><summary>Illustration · The Hunger of the Gods · 17</summary><p><a href="assets/d7d2c6392cb34c.jpg">Open noncanonical illustration</a></p><p>Huld during the pause in the Battle-Grim&#x27;s march.</p></details></noscript>
