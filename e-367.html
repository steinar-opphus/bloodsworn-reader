      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 33</summary><h2>The Fury of the Gods - chapter 33</h2><p>Runa Red-Axe calls her Ákveðin and presents her as a gifted Hundur-thrall for Elvar’s search. She has shaved hair and an iron collar, fine embroidered straw-coloured wool tunic, clean wool breeches and good leather turn-shoes. Looking first at Runa before the name is given, she then tells Elvar she can find the friend if supplied a scented item. Runa praises her unswerving nose and Elvar accepts, but Grend’s arrival interrupts before tracking is demonstrated. No prior identity, emancipation or freely chosen service is inferred.</p></details><details><summary>The Fury of the Gods · 52</summary><h2>The choice to hide the beast</h2><p>Breca identifies her as one of those saying the dragon might free Tainted and questioning serving a slaver, still Runa’s Hundur thrall. This is his report of her speech; Runa’s later capture does not itself free Ákveðin or name a new owner.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>Elvar announces release of Tainted as a condition of remaining in her host after Runa’s execution</h2><p>Elvar announces release of Tainted as a condition of remaining in her host after Runa’s execution. Ákveðin is not individually named in the collar ceremonies and no specific key transfer/new owner is assigned to her.</p></details><details><summary>Illustration · The Fury of the Gods · 33</summary><p><a href="assets/3ed5f46e4e3bd7.jpg">Open noncanonical illustration</a></p><p>Ákveðin.</p></details></noscript>
