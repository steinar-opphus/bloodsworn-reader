      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>From the meadow on the eastward trail, Orka’s party looks north down the slope to this unnamed stockaded farm against woodland. Deep horn calls, faint screams and billowing black smoke come from the steading. Neither inhabitants, cause nor attackers are identified.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>Long after midday Halja urges a look and Orka agrees, partly to avoid leaving danger behind the party into the night. The chapter ends before they arrive or intervene.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>Close scouting identifies broken gates, a hacked stream entrance and skraeling attacking a rough pine-stockaded holding with longhouse, barn, pens, charcoal kiln, brewhouse and forge. A giant horn hangs beside bodies and a strange timber mound. Screams come from the longhouse, whose doors and turf roof are breached; the barn burns.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>After initially refusing Lif’s appeal, Orka and her companions attack through the stream entrance and front gate. Seven courtyard skraeling fall before the door/flank/roof assault relieves a few shield-and-boar-spear defenders. Two giant ravens then attack fugitives and save Orka. Bodies carried out so far number fourteen skraeling and seven people, without a final toll or exact survivor count.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>Orka recognises the timber mound as a raven nest, and the barn has burned to a black skeleton. Lif is treated on the steps and the horses are brought inside to the pig-pen fence. Survivor Gudleif Arnesson explains that the residents feed and shelter the two ravens for news and protection. His kinship to other defenders and a proper name for the farm are not supplied. The birds identify themselves as Kló and Grok.</p></details></noscript>
