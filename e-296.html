      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 56</summary><h2>Introduction</h2><p>This unnamed slim, richly dressed woman stands in the prow of an upriver merchant knarr, wearing a fur-trimmed hat and a gold-buckled belt with a gold-tooled pouch. Her vessel avoids the Wave-Jarl until Elvar intercepts it, and a dozen spear-armed, mailed warriors line its side. An arrow falls into the river without an identified archer. Her name, origin and cargo remain unknown.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Story and connections</h2><p>She threatens resistance to boarding. Elvar instead pays for Snakavik news with a silver arm ring, which she picks up, bites and examines. The payment’s supposed cargo-equivalent value is Elvar’s estimate, and the ring is not identified as Orka’s retained bear-head ring.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Story and connections</h2><p>She reports Störr gathering drengrs to attack Helka before a suspected alliance with Orlyg is ready, saying Orlyg is bound for Darl. She explicitly cites drengrs’ whispers to whores as her source. Elvar thanks her and sails on, without a boarding or independently confirmed pact, arrival or battle.</p></details></noscript>
