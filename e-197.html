      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 50</summary><h2>Introduction</h2><p>His hair is dark with shaved sides, and he wears a dark coat of mail before the duel.</p></details><details><summary>The Shadow of the Gods · 50</summary><h2>Story and connections</h2><p>Ilska names him as her brother and champion against Agnar. A huge, long-axe-bearing warrior, he manifests red eyes and sudden speed during the duel. Vörn identifies him as dragon-born. He mortally threatens Agnar but dies when Agnar drives shattered shield splinters through his throat.</p></details><details><summary>The Hunger of the Gods · 5</summary><h2>A welcome among the Raven-Feeders</h2><p>Myrk identifies Skrið as her brother and says she loved him despite his childhood bullying. Drekr now carries Skrið’s long-axe.</p></details><details><summary>Illustration · The Shadow of the Gods · 53</summary><p><a href="assets/7861233d5d67d7.jpg">Open noncanonical illustration</a></p><p>Skrið before the holmganga against Agnar.</p></details></noscript>
