      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 21</summary><h2>Introduction</h2><p>Thrud suffered an arrow wound to the calf on Iskalt. In B01-C021 he still limps and guards the prisoners with Biórr. He is lean, with a scarred, pitted angular face. Agnar gives him coin and orders him to find a tavern large enough for the Battle-Grim.</p></details><details><summary>The Shadow of the Gods · 25</summary><h2>A choice of loyalties</h2><p>Thrud wears a wrist cord with a fragment from a wight skull he took when first joining the Battle-Grim.</p></details><details><summary>The Shadow of the Gods · 27</summary><h2>A raid and a stolen child</h2><p>Thrud is dead with wounds in his throat and back.</p></details><details><summary>The Shadow of the Gods · 52</summary><h2>Betrayal and the dragon&#x27;s release</h2><p>Biórr acknowledges killing Thrud when Elvar accuses him in chapter 52. This reveals responsibility after his earlier expression of guilt, which alone had not established it.</p></details></noscript>
