      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 2</summary><h2>A fugitive at the trial gate</h2><p>Iskidan is described as a land far south across the sea. A dock worker identifies the strangers arriving in Liga as coming from there.</p></details><details><summary>The Shadow of the Gods · 2</summary><h2>A fugitive at the trial gate</h2><p>The arriving strangers wear silver-buckled kaftans and striped blue and orange breeches. Their warrior escorts wear long coats of lamellar plate. The escorts carry curved swords.</p></details><details><summary>The Shadow of the Gods · 2</summary><h2>A fugitive at the trial gate</h2><p>Varg has heard tales of wide rivers and grass plains there. In those tales he has heard of Gravka, the Great City.</p></details><details><summary>The Shadow of the Gods · 10</summary><h2>An Althing and a challenge</h2><p>Sigrún says emperor Kirill rules Iskidan from Gravka.</p></details><details><summary>The Shadow of the Gods · 10</summary><h2>An Althing and a challenge</h2><p>Virk claims Iskidan has more thralls than freedmen and sacrifices children. Sigrún dismisses this as a saga-tale, while Virk claims eyewitness experience.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>Røkia identifies the Bruised Men at Darl’s auction as Iskidan people. Svik places them in the south and Jaromir and his druzhina in the north; he describes blue tongues and light- or water-dependent skin colour. The skin changes are his report, while Varg directly observes very dark skin.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>Svik uses a comic bodily analogy for Iskidan’s great size beside Vigrið and calls Snakavik tiny beside Gravka, the emperor’s city. These are comparative claims, not surveyed dimensions.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>Sulich expects Jaromir to flee back to Iskidan via ships he says are at Liga. The Bloodsworn sail to attempt an interception, not having seen him arrive there.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>Ilska tells Lik-Rifa of Iskidan far south across the Dividing Sea, claiming its unfamiliar gods died in the Guðfalla and that Kirill the Magnificent now rules its vast kingdom. This remains an attributed account; no foreign gods are named or directly observed.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>Røkia predicts Jaromir is running there, and Glornir later declares that they will pursue him home. He reports Jaromir’s fleet departing Liga two days earlier. The Sea-Wolf actually casts off, but arrival at Iskidan and Jaromir’s current position remain unshown.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>Sulich says tungumatur are common there and mentions pirates in the islands between the Sea-Wolf and Iskidan. His distribution and transmission account remains attributed. A captive Iskidan druzhina later names Valdai as Jaromir’s destination, without establishing Valdai’s geography or a new arrival at Iskidan.</p></details><details><summary>The Fury of the Gods · 21</summary><h2>Reunion in the island harbour</h2><p>Sea-Wolf and Sulich’s knarr weave through islands along the northern coast, returning to retrieve Einar, Æsa and the children before entering open sea. Five pursuing vessels reappear from the island channels. Snakavik remains an estimated ten or more days away, dependent on wind and the slower transport.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>A crew member asks if all Iskidan has sailed and Glornir names Rurik/Jaromir’s invasion</h2><p>A crew member asks if all Iskidan has sailed and Glornir names Rurik/Jaromir’s invasion. The narrative also literally says coast of Iskidan from the Wolfdales vantage while naming the known ports/Falinn; this geographical wording is preserved for review rather than silently normalised or accepted as a new map.</p></details></noscript>
