      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 9</summary><h2>Training and the attempted treasury escape</h2><p>Identified by blue shields with a drakkar sail, Ingvild&#x27;s band steals from Elvar&#x27;s treasury after the assembly and fights through the fortress towards its drakkar. Hrung reports thirty to forty thieves and a chest ward that burned some. Guard deaths, sail-marked shields and the crew&#x27;s possession of a sack are documented; no completed oath-breaking ritual is inferred.</p></details><details><summary>The Fury of the Gods · 9</summary><h2>Training and the attempted treasury escape</h2><p>At the docks Ingvild&#x27;s witch creates an illusion, then falls under Uspa&#x27;s mist and Skuld&#x27;s attack. The three-line shield wall breaks beneath the Berserkir; pockets keep fighting until the battle ends, leaving Elvar and Ingvild&#x27;s final duel. The chapter does not enumerate every survivor or declare a total extermination of the band.</p></details></noscript>
