      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 12</summary><h2>Introduction</h2><p>Lif is Virk’s younger son. He says Guðvarr goaded Virk.</p></details><details><summary>The Shadow of the Gods · 15</summary><h2>Grief and the decision to leave</h2><p>The family helps Virk’s sons raise his barrow. Lif sheds constant tears, and he and Mord welcome Orka’s family to their hearth afterwards. They decline Thorkel’s invitation to his steading. Orka says they have a fishing boat and a trade taught by Virk.</p></details><details><summary>The Shadow of the Gods · 22</summary><h2>Captives freed and a name obtained</h2><p>Orka finds the brothers bound at Fellur’s hall. Lif says they tried unsuccessfully to kill Guðvarr and face trial, with outlawry or execution threatened. Orka frees them. They wait in their fishing boat, take Orka aboard and row away at her order to head south for the sea.</p></details><details><summary>The Shadow of the Gods · 24</summary><h2>A bargain with the brothers</h2><p>Lif has crow-dark hair and is tall, slim and lithe. Lif appears to Orka to be no older than seventeen or eighteen winters; his exact age is not established. Lif cleans and rebinds Mord&#x27;s head wound. Lif asks Orka to teach the brothers weapons craft. Orka agrees to teach the brothers what she can in exchange for their rowing her to Darl.</p></details><details><summary>The Shadow of the Gods · 28</summary><h2>The Näcken at the rapids</h2><p>He has dark, wide eyes and a patchy beard with pale skin showing beneath it. During the chapter 28 summer rowing passage, he wears a linen tunic.</p></details><details><summary>The Shadow of the Gods · 28</summary><h2>The Näcken at the rapids</h2><p>Lif helps Orka reach shore with a spear, and the Näcken retreats underwater; its death is not established.</p></details><details><summary>The Shadow of the Gods · 31</summary><h2>Arrival in Darl</h2><p>Mord and Lif are bruised by their weapons lessons; Mord persists despite his more serious wounds. Orka gives Lif money, judging that the brothers&#x27; rowing has earned more than her lessons repaid. Orka again advises the brothers to settle quietly and delay revenge, then leaves to search for Breca.</p></details><details><summary>The Shadow of the Gods · 35</summary><h2>The confrontation at The Dead Drengr</h2><p>Lif and Mord arrive on horses and break into the ring to rescue Orka. Orka climbs behind Lif and escapes down an alley, leaving Drekr alive on the street.</p></details><details><summary>The Shadow of the Gods · 40</summary><h2>Flight towards Grimholt Pass</h2><p>Lif questions the escape route in Orka&#x27;s proposed bait plan. During the subsequent flight he takes a spear thrown by one of Guðvarr&#x27;s drengrs.</p></details><details><summary>The Shadow of the Gods · 46</summary><h2>The broken oath stone</h2><p>He recognises wings on the blood-coated carving. During further training Orka judges him calmer and more receptive than Mord. He has removed the stitches from her back wound.</p></details><details><summary>The Shadow of the Gods · 49</summary><h2>Ravens and frost-spiders</h2><p>In the frost-spider fight near Grimholt he is bitten in the shoulder, turns blue and stiff and collapses convulsing. Orka attempts to carry him out but is struck down before they escape.</p></details><details><summary>The Shadow of the Gods · 51</summary><h2>Captivity and violence at Grimholt</h2><p>He is alive but still shivering and blue-veined when taken into Grimholt. After Guðvarr stabs Mord, Orka breaks free and cuts Lif’s bonds.</p></details><details><summary>The Hunger of the Gods · 1</summary><h2>Rest and restraint in the burned hall</h2><p>He survives into the next morning, pale and blue-lipped from lingering frost-spider venom. He supplies Orka with clean clothes, challenges her secrecy and helps her recover Mord&#x27;s body.</p></details><details><summary>The Hunger of the Gods · 3</summary><h2>Mord&#x27;s burial and a blood feud</h2><p>At Mord&#x27;s burial he cuts his hand and swears a blood feud against Guðvarr and anyone who blocks his revenge. He later reports Skalk&#x27;s shoulder injury and destroyed staff to Glornir.</p></details><details><summary>The Hunger of the Gods · 7</summary><h2>An offer to return to the Bloodsworn</h2><p>Orka asks Glornir to take him to Darl. She says he is not Tainted and trusts him despite his knowledge of her wolf-blood; Glornir conditionally agrees but warns that he might kill Lif if trust fails.</p></details><details><summary>The Hunger of the Gods · 7</summary><h2>An offer to return to the Bloodsworn</h2><p>Lif instead asks to stay with Orka, knowing her western route leads away from Guðvarr. He blames Guðvarr for Mord’s death but says he is not ready for a fair fight, and asks for further weapons training while they seek Breca.</p></details><details><summary>The Hunger of the Gods · 7</summary><h2>An offer to return to the Bloodsworn</h2><p>He rides out wearing belted mail with a seax and hand-axe, a leather helm at his saddle, and Mord’s horse carrying provisions and spears. Before Glornir leaves, Lif asks that Guðvarr be kept alive for his revenge; Glornir nods approvingly.</p></details><details><summary>The Hunger of the Gods · 10</summary><h2>The night-hag in the woodland camp</h2><p>A night-hag chokes him against a tree until Orka disperses it with a spoken axe strike. He recovers his breath and colour, then acknowledges falling asleep on watch. Edel rebukes the danger to the whole party.</p></details><details><summary>The Hunger of the Gods · 10</summary><h2>The night-hag in the woodland camp</h2><p>He later sleeps in his cloak with dark bruises around his throat. Edel calls him a burden and raises the danger to the company’s secret; Orka says she has not told him their collective nature, though the women reason he may infer it. No conclusion is spoken by Lif himself.</p></details><details><summary>The Hunger of the Gods · 10</summary><h2>The night-hag in the woodland camp</h2><p>When Edel suggests it might have been better if the hag had taken him, Orka says he has her protection and that anyone acting against him must go through her.</p></details><details><summary>The Hunger of the Gods · 15</summary><h2>The search through Rotta&#x27;s chamber</h2><p>At the excavation he gags as Vesli eats a corpse’s tooth. Underground he opens a parchment but admits he cannot read. He accompanies Orka into the children’s room, then leaves after asking whether she is coming.</p></details><details><summary>The Hunger of the Gods · 18</summary><h2>Training and an encounter in the rain</h2><p>Orka wakes him for training before breakfast and knocks him down through his spear defence. He reiterates that he wants Guðvarr dead rather than fame, while Halja tells him she lost her brother. Gunnar also defeats him in a quick spear exchange.</p></details><details><summary>The Hunger of the Gods · 18</summary><h2>Training and an encounter in the rain</h2><p>He fetches a grey unmarked round shield with an iron boss, linen-covered linden planks and leather edge; it already bears scrapes, a boss dent and a cut edge. Orka demonstrates its defensive and offensive uses, then spars with Ingmar to let Lif watch. When riders arrive he takes the shield and is told to wear his belt-hung leather cap as a helm.</p></details><details><summary>The Hunger of the Gods · 20</summary><h2>Myrk confronted in the glade</h2><p>He follows Orka into the glade despite being told to go back, visibly afraid. An axewoman drives him back and hacks his shield; at Orka’s request Vesli wounds her calf, and Lif thrusts into her open mouth. After the fighting he remains standing, pale and trembling, with a battered shield and blood on his spear.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>Wounds tended and seaxes compared</h2><p>After the fight he shakes and vomits. He reports only a cut on the back of his spear hand; Orka calls his state shock and advises mead. He credits his battered shield with saving him, and Edel advises replacing it. When he vomits again, Ingmar fetches the mead instead.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>Wounds tended and seaxes compared</h2><p>During departure preparations he looks better, tends his mount and wears a captured sealskin cloak. No journey is completed in this chapter.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>In Guðvarr’s hall viewpoint, Varg says Lif asked him not to kill Guðvarr and sends the warning that Lif is coming. Varg threatens that he may not keep that promise after Jökul’s killing. Lif is not present or newly located here; the warning does not establish a completed revenge.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>He spars with Revna beside a fast stream and is delighted to land a spear-butt strike. She counters and sends him into the water. Later, dripping wet, he receives a wool blanket from Halja and struggles briefly out of his mail to dry it.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>Orka&#x27;s search in Starl</h2><p>He rides with Orka, Gunnar, Revna and the bound Myrk into Starl. At the inn Orka orders the captive watched and announces her intention to restock and buy lake passage. She leaves on those errands with Halja. No new duel, reunion or news of Breca is delivered to him here.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>He cleans rust from his spearhead, then answers Gunnar’s and Revna’s requests with a soft mournful song about two brothers, vengeance, loyalty and loss. Halja watches with tear-bright eyes. The performance has no disclosed title or literal autobiographical identification.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>During the apparent raid he fights with shield and spear and remains pale and trembling when the others stop. Orv identifies himself as a friend and Halja apologises for not briefing Lif. He then offers to saddle horses, but Orka delays the pursuit to follow Myrk rather than recapture her.</p></details><details><summary>The Hunger of the Gods · 50</summary><h2>The wolf&#x27;s call across the lake</h2><p>He is among Orka’s companions gathered on the track when she turns from the lake; Sæunn runs back after continuing ahead. When Spert and Vesli rejoin them, Lif explains the changed plan: Myrk is to think she escaped while the party tracks her instead of accepting the false trail. He credits Orka. This does not show Myrk’s actual destination or private knowledge.</p></details><details><summary>The Hunger of the Gods · 50</summary><h2>The wolf&#x27;s call across the lake</h2><p>He asks how Lik-Rifa called the pair, prompting Spert’s admission that he does not know how but heard her in his head. Revna’s concern about a wider summons leads to Orka’s war conclusion; no battle or change of allegiance is shown.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>He brings Orka the horses, then scans the trees with his spear at the frost-spider traces. Orka tells him Mord stood over him and fought while he was poisoned. He says he remembers none of that before the tower and cries at her praise, having thought she judged Mord cowardly. She explains courage as standing despite fear and later explains the raven rescue through Breca’s example.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>He admits loneliness and seeks comfort beyond Guðvarr’s death, glancing at Halja and explicitly saying he likes her. He worries she thinks him weak. Orka suggests common grief as ground for companionship; Revna says Halja likes his singing and offers help. He blushes while Revna and Gunnar exchange uncertain personal anecdotes. His interest is explicit, but no reciprocal declaration or relationship by Halja is shown.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>He reacts with disgust to the path’s smell, identified by Revna as skraeling dung, and worries at the horn. The group sees smoke and hears screams at a distant farm and agrees to look, without intervening yet.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>He urges rescue at the farm through Breca’s compassion and the earlier raven rescue. Orka initially refuses and blames that intervention for Mord’s death; he presses the hypothetical of someone able to save her own family. She grabs his mail in rage, but he does not resist, and she releases him at Halja’s touch. The companions choose to intervene.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>His hands tremble during preparation. Orka warns him of skraeling strength, sends him to scout and privately asks Spert and Vesli to keep him breathing. After reporting seven in the courtyard, he follows her charge. His shield splinters and his face is clawed; a bloody spear and dying skraeling at his feet show participation without assigning every wound or a confirmed poison source. In the longhouse he spears an attacker dragging Orka by her helm.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>Halja catches him when he drops to one knee. Afterwards he has a deep gash on one cheek and claw marks on the other, with Vesli binding the skin using kneaded mucus. Prompted by Revna, Halja acknowledges that he lives and his enemies lie dead. He blushes and smiles while being scolded for moving. This is favourable acknowledgment, without established romantic reciprocity. Orka credits his appeal when Gudleif thanks her for the rescue.</p></details><details><summary>The Hunger of the Gods · 64</summary><h2>The hidden doors into Nastrandir</h2><p>Orka observes his healing cheek scar below the right eye and increased confidence since the farm fight. Approaching Nastrandir&#x27;s throne causes its serpents to rear; he falls back and Halja raises her shield over him. No attack by the serpents follows.</p></details><details><summary>The Hunger of the Gods · 72</summary><h2>The army gathers below Svelgarth</h2><p>He steadies Orka when she believes Breca is close and tends the horses in their preparation camp. His joke about not killing everyone helps the group laugh before the focused rescue plan.</p></details><details><summary>The Hunger of the Gods · 74</summary><h2>The gate falls and the children flee</h2><p>Orka teaches him Skuggar skilja against night-hags, attributing the words to Uspa&#x27;s earlier teaching. He joins Halja and Spert&#x27;s burning-tent diversion, which draws the wagon guards away.</p></details><details><summary>The Hunger of the Gods · 76</summary><h2>Captives before Rotta</h2><p>He cuts Orka&#x27;s binding web during Rotta&#x27;s transformation while Halja covers them. The thrower of the preceding spear is not identified solely from his presence.</p></details><details><summary>The Hunger of the Gods · 78</summary><h2>Escape through the river valley</h2><p>He leaves with Halja when the fugitives split to confuse pursuit; this chapter does not show their arrival at the lake.</p></details><details><summary>The Fury of the Gods · 15</summary><h2>He is present behind Breca at the reunion with Orka, carrying a shield and bloodied spear</h2><p>He is present behind Breca at the reunion with Orka, carrying a shield and bloodied spear. The first distant man-and-child sighting is not explicitly named, so this later confirmed presence does not retrospectively label that man.</p></details><details><summary>The Fury of the Gods · 17</summary><h2>He guards Halja’s flank with shield and spear and helps kill the skraeling throttling Dagrun</h2><p>He guards Halja’s flank with shield and spear and helps kill the skraeling throttling Dagrun. Orka lifts him onto the surviving longship and he helps pull Breca aboard. He is with the reunited group once the ship leaves the bank.</p></details><details><summary>The Fury of the Gods · 22</summary><h2>Breca’s training and Orlyg’s passengers</h2><p>He joins Gunnar and Halja in finishing Orka’s Be better admonition, then receives his spear back and is told to train Breca. Orka calls him a warrior now because she saw his fighting; this is personal recognition, not a formal oath. He remains uncertain about the distant Bloodsworn’s survival and Vol’s rescue.</p></details><details><summary>The Fury of the Gods · 26</summary><h2>Lessons, mourning and Spert’s barrel</h2><p>He defeats Breca by using shield position and a touch to the back of the neck rather than meeting strength directly. Later he continues practice as Breca improves. Breca credits Biórr for earlier tafl instruction; no new meeting with Biórr occurs.</p></details><details><summary>The Fury of the Gods · 28</summary><h2>He accepts responsibility with Sæunn for protecting Breca and staying alive</h2><p>He accepts responsibility with Sæunn for protecting Breca and staying alive. They flank the boy when boarding and guard the attacking group’s flanks on the knarr; Breca nevertheless slips forward during the fight.</p></details><details><summary>The Fury of the Gods · 29</summary><h2>He joins the rescue on Sea-Wolf in mail with shield and spear beside Sæunn and Breca</h2><p>He joins the rescue on Sea-Wolf in mail with shield and spear beside Sæunn and Breca. Their group breaks through the druzhina around Einar and Svik before the casters renew their attack.</p></details><details><summary>The Fury of the Gods · 32</summary><h2>Debts, kinship and the voyage onward</h2><p>He cleans captured ring mail with Sæunn, Gunnar and Halja and has a new bleeding cut from cheek to jaw, side unspecified. He tentatively credits his shield for survival. Edel praises shield use, Halja says he knows it, and he blushes and says he has had practice. The wound is not shown treated or healed.</p></details><details><summary>The Fury of the Gods · 46</summary><h2>The hidden tunnel raid</h2><p>In mail and a wide-nasal helm with spear and shield, he joins the sortie hoping to find Guðvarr for vengeance. He uses skuggar skilja, taught by Vol, to wound and then shatter a night-hag choking Sæunn, and later blocks a spear meant for Orka before counterattacking. As Orka approaches Drekr he shouts and moves to her right; no meeting with Guðvarr is yet shown.</p></details><details><summary>The Fury of the Gods · 47</summary><h2>Guðvarr explicitly recognises him during their fight</h2><p>Guðvarr explicitly recognises him during their fight. Lif says the cheek wound is for Mord and also wounds shoulder and calf with skilled spear/shield work. Guðvarr tackles and nearly strangles him, but Lif strikes his head with the shield still held and survives gasping. An unnamed short-haired spearwoman pulls him upright; the dragon’s landing interrupts their advance. Their later withdrawal is not individually observed by Guðvarr.</p></details><details><summary>The Fury of the Gods · 61</summary><h2>He stands with Breca at Orka’s left, helping cover the shieldless long-axe fighter</h2><p>He stands with Breca at Orka’s left, helping cover the shieldless long-axe fighter. No separate strike or new wound is narrated.</p></details><details><summary>The Fury of the Gods · 62</summary><h2>Lif and Sæunn jointly spear and fling away a spider attacking Breca</h2><p>Lif and Sæunn jointly spear and fling away a spider attacking Breca. At Orka’s order they run beside him toward the gates, Vesli overhead with a short spear, while Orka later turns back to Svik. Their safe entry is not yet shown.</p></details><details><summary>The Fury of the Gods · 70</summary><h2>Lif and Sæunn flank Breca and join the push through the Raven-Feeders alongside Orka/Halja/Glornir</h2><p>Lif and Sæunn flank Breca and join the push through the Raven-Feeders alongside Orka/Halja/Glornir. The account supplies no distinct new wound or individually named victim for either.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>Lif and Sæunn protect Breca a dozen steps behind Orka during the climb</h2><p>Lif and Sæunn protect Breca a dozen steps behind Orka during the climb. No separate new wound or named individual kill is supplied before the hilltop clash.</p></details><details><summary>The Fury of the Gods · 74</summary><h2>Snaka rises and Wolfdales collapses</h2><p>Lif and Sæunn protect Breca amid the hilltop fighting, then try to reach Orka with him as the ground collapses. Orka gathers Breca and the party follows Glornir to the cliff; this passage does not individually narrate every follower’s leap or landing.</p></details><details><summary>The Fury of the Gods · 76</summary><h2>Surviving the plunge into the Falinn</h2><p>He survives to the treeline at the river bend and chops deadwood that Vol lights for the soaked Bloodsworn. No new wound diagnosis or complete missing-person tally is supplied.</p></details><details><summary>The Fury of the Gods · 79</summary><h2>A night of repairs and choices</h2><p>He sings a mournful love/loss song and looks toward Halja, who gently but directly rejects him while offering esteem/friendship and a place beside her if he joins Bloodsworn. She suggests Sæunn is interested; he blushes, without a confirmed new couple or membership rite.</p></details><details><summary>The Fury of the Gods · 82</summary><h2>Wearing mail/steel cap with shield/spear, he steps before Guðvarr’s attempted flight</h2><p>Wearing mail/steel cap with shield/spear, he steps before Guðvarr’s attempted flight. He vows to kill him for the murder of his father/brother, renewing the established revenge without a duel result yet.</p></details><details><summary>The Fury of the Gods · 85</summary><h2>He challenges Guðvarr’s mercy boast with the deaths of Virk/Mord and cites Orka/Bloodsworn training</h2><p>He challenges Guðvarr’s mercy boast with the deaths of Virk/Mord and cites Orka/Bloodsworn training. He holds sword blows with shield/spear, splits mail rings, then is knocked down by a spider. He returns blue-ichor/shell-covered, apparently having killed it, throws his spear to trip Guðvarr and now fights with bearded axe/shield. No venom bite or axe acquisition is shown.</p></details><details><summary>The Fury of the Gods · 85</summary><h2>He challenges Guðvarr’s mercy boast with the deaths of Virk/Mord and cites Orka/Bloodsworn training</h2><p>He defeats Guðvarr’s high/low feint, pins sword, breaks/hooks shield and strikes the mouth, making him drop his sword and beg forfeit. Lif replies that he wants his father/brother back and brings the axe down. The revenge’s fatal outcome is strongly implied, without explicit post-blow narration.</p></details><details><summary>The Fury of the Gods · 88</summary><h2>Thorkel avenged and the final advance</h2><p>He returns with grim face/blooded axe and answers Aye when Orka asks if it is done, reporting the completion of his Guðvarr revenge. No new direct body scene or full account of his feelings follows.</p></details><details><summary>The Fury of the Gods · 90</summary><h2>The last assault on Lik-Rifa</h2><p>Lif and Sæunn fight with Orka’s party and help her rise after Glornir’s death while she is hurt in ribs/leg. No new personal wound or additional revenge result is supplied.</p></details><details><summary>Illustration · The Shadow of the Gods · 53</summary><p><a href="assets/eef75140999ff6.jpg">Open noncanonical illustration</a></p><p>Lif during the river journey with Orka and Mord.</p></details></noscript>
