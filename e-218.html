      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 10</summary><h2>Introduction</h2><p>Edel previously assigned Ingmar the watch; he was described as hulking, pale-faced and flaxen-haired and called her chief.</p></details><details><summary>The Hunger of the Gods · 18</summary><h2>Training and an encounter in the rain</h2><p>He is now bynamed Ice for his cold battle fury despite having Berser’s blood. Thick-muscled and flat-faced, with nearly white fair hair and blue eyes, he has known Orka since her chiefship. He is broad and long-armed but shorter than her, and she recalls training him fifteen years earlier.</p></details><details><summary>The Hunger of the Gods · 18</summary><h2>Training and an encounter in the rain</h2><p>At the rainy camp he makes the fire and prepares breakfast, jokes during Lif’s lessons and spars with Orka. She conceals a right-hand hook behind the shield and knocks him down. He ruefully recalls her teaching about the unseen blow and accepts her help up.</p></details><details><summary>The Hunger of the Gods · 18</summary><h2>Training and an encounter in the rain</h2><p>At Vesli’s warning he extinguishes the fire. He catches Orka’s wrist as she moves towards the Raven-Feeders, then releases her when she declares her purpose.</p></details><details><summary>The Hunger of the Gods · 20</summary><h2>Myrk confronted in the glade</h2><p>In the mine battle Orka sees him tear away an opponent’s shield and lunge with open jaws, then hears flesh tearing and high screams.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>Wounds tended and seaxes compared</h2><p>When Lif cannot fetch mead because he is vomiting, Ingmar takes over and returns with mead, oats and the pot. Sharing porridge with Orka, he says she has been missed and remembers Thorkel as a good friend. He puts down his spoon when Orka adds blood and spit to Spert’s food.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>He returns with Edel and the Sea-Wolf at Liga. He tells Svik Orka is well while those she fought are not, reassures Varg that he belongs to the company after news of Ilska’s father, and notices the missing ear. At departure he and Einar use spears to push the Sea-Wolf from the pier.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>The boarding battle at sea</h2><p>When the second attacking ship comes alongside, Varg glimpses his mailed back behind him. Røkia tells Varg to face forward and trust the company guarding his rear. This establishes Ingmar’s presence in the rearward line, without an individual combat result.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>He finishes a deck opponent with shield and axe after Varg’s change subsides. Sulich’s lice comparison is met with his explicit denial, without an established infestation. He later arrives behind Glornir at the giant fight and runs to fetch supplies when Røkia takes over Einar’s care.</p></details><details><summary>The Hunger of the Gods · 68</summary><h2>The cavalry charge and the shield wall</h2><p>The huge thrall shatters his spear and crushes him down. He rises with bear traits and fights using the broken halves, finally making the opponent collapse. He survives with bruised throat, a swollen eye and forehead gash, without a recovery yet.</p></details><details><summary>The Hunger of the Gods · 70</summary><h2>The pursuit into Valdai</h2><p>He helps Varg scale Valdai and later crashes into Jaromir&#x27;s horse to free Vol. Jaromir&#x27;s hawk distracts him; sabre blows to the neck and trampling kill him. Varg directly recognises his sightless body as dead, unlike his earlier survived wounds.</p></details><details><summary>The Fury of the Gods · 1</summary><h2>After the battle at Valdai</h2><p>He is buried in the largest of the freshly built stone barrows at Valdai, among fifteen Bloodsworn killed in the previous day&#x27;s battle.</p></details><details><summary>Illustration · The Hunger of the Gods · 18</summary><p><a href="assets/0ed549db3e0619.jpg">Open noncanonical illustration</a></p><p>Ingmar in the rainy morning camp before sparring.</p></details></noscript>
