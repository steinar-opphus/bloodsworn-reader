      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 14</summary><h2>The warehouse rescue</h2><p>This unnamed wider-bellied transport waits beside Sea-Wolf at Ulaz, carrying horses eating hay on its central deck. Sulich’s kin crew it with their lamellar and weapons stowed in oar-chests. Sulich and Kesha board, and he commands its departure behind Sea-Wolf. Both ships escape the mounted druzhina’s arrows and pass the harbour statues. No purchase transaction or formal vessel name is supplied.</p></details><details><summary>The Fury of the Gods · 21</summary><h2>Reunion in the island harbour</h2><p>Now explicitly called Sulich’s knarr, the wider transport follows Sea-Wolf through the northern islands more slowly. Svik thinks its pace may lengthen the voyage to Snakavik; the ships enter open water before the five pursuers reappear. No new cargo change, damage or battle outcome is supplied.</p></details><details><summary>The Fury of the Gods · 25</summary><h2>Preparing to meet the pursuing ships</h2><p>Lashed to Sea-Wolf, the horse transport receives Iva and Taras, keeps five outer rowers working and raises wicker/willow screens over the horses. Sulich’s archers answer the enemy, and Iva casts from its prow. The first attacker sinks; no final horse count, damage report or wider battle outcome is supplied.</p></details><details><summary>The Fury of the Gods · 27</summary><h2>Two enemy drakkars lie fastened at its prow and stern as the battle develops</h2><p>Two enemy drakkars lie fastened at its prow and stern as the battle develops. Iva casts from its deck, Taras fights, and overwhelming numbers press Sulich’s warriors towards midships. It is not shown captured or sunk before another unidentified drakkar approaches Sea-Wolf.</p></details><details><summary>The Fury of the Gods · 28</summary><h2>Orlyg joins the sea battle</h2><p>Orlyg attacks the drakkar at its stern, whose collared female caster is speared overboard after Gösta breaks her guard. Orka’s party crosses to the knarr, passes the wounded and panicking horses behind wicker screens, and attacks the archers from behind. Reinforcements break one of the two boarding crews, but the second remains. Neither a whole-battle victory nor a casualty total is established.</p></details><details><summary>The Fury of the Gods · 30</summary><h2>The casters and the mother serpent</h2><p>Its defenders Iva, Taras and Sulich cross to Sea-Wolf with Orlyg and warriors as the final attacking drakkar withdraws south. The active boarding danger has ended in this scene, but no full casualty count, horse count or repair inventory follows.</p></details><details><summary>The Fury of the Gods · 32</summary><h2>The crew tends wounded survivors and the remaining horses, clears the deck and readies the knarr</h2><p>The crew tends wounded survivors and the remaining horses, clears the deck and readies the knarr. Ten of Sulich’s kin are buried at sea. His surviving warriors come to Sea-Wolf to hear Glornir’s choices for using gifts safely in Vigrið. The knarr remains needed for the voyage; its completed departure is not shown.</p></details><details><summary>The Fury of the Gods · 37</summary><h2>Life aboard Sea-Wolf</h2><p>It anchors beside Sea-Wolf at a south-west coast cove overnight, a few guards aboard while most crews gather ashore for Varg’s oath. The scene records that completed ceremony rather than a new port arrival or damage assessment.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>Arrival at the wolf-god’s hall</h2><p>It comes alongside Sea-Wolf for the choices, then reaches Wolfdales and unloads horses and mounted warriors. Iva/Taras leave it wearing collars as cover. No new loss of horses or ship damage is enumerated.</p></details><details><summary>Illustration · The Fury of the Gods · 14</summary><p><a href="assets/298e3ec301f037.jpg">Open noncanonical illustration</a></p><p>The two vessels rowing beyond the pier’s arrows.</p></details></noscript>
