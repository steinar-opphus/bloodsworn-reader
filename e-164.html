      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 24</summary><h2>A bargain with the brothers</h2><p>Darl is a fortress and town towards the Boneback Mountains.</p></details><details><summary>The Shadow of the Gods · 31</summary><h2>Arrival in Darl</h2><p>Darl is Queen Helka&#x27;s fortress and seat of power. Darl&#x27;s mead hall is surrounded by a giant eagle skeleton with wide wings and a skull above its roof. Darl has a Galdur tower where Galdurmen learn rune arts. Three large drakkars arrive at Darl as horns sound from the fortress.</p></details><details><summary>The Shadow of the Gods · 33</summary><h2>Children freed at the canal</h2><p>Darl has canals branching from the river among ships, boathouses and barns.</p></details><details><summary>The Shadow of the Gods · 35</summary><h2>The confrontation at The Dead Drengr</h2><p>A company of roughly thirty or forty drengrs approaches with shields, spears and a mounted horn-blower.</p></details><details><summary>The Shadow of the Gods · 31</summary><h2>Arrival in Darl</h2><p>The wide, deep brown river is crowded with boats and wooden piers. Tavern buildings climb a gentle hill towards the timber wall and fortress. The eagle’s outspread skeletal wings are each described as the size of a small hill.</p></details><details><summary>The Shadow of the Gods · 40</summary><h2>Flight towards Grimholt Pass</h2><p>Orka&#x27;s scouting finds Helka&#x27;s fortress gates and timber walls heavily guarded; Sigrún&#x27;s drakkar also has the protection of harbour officials and guards.</p></details><details><summary>The Hunger of the Gods · 12</summary><h2>Rowing away from Grimholt</h2><p>The fugitives from Grimholt are approaching by the River Drammur. After four days’ rowing, Skapti estimates one more day to Darl. Skalk expects safety from pursuit there and threatens to fit Vol with his own collar after arrival; neither arrival nor that outcome is shown.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>The fugitives reach Darl</h2><p>The fugitives arrive through busy river traffic. As the Long Day approaches its end, hints of darkness have lengthened over two days. Seven cages of decomposing bodies stand in the market square beneath a sign Skalk reads as dragon-worshippers.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>The fugitives reach Darl</h2><p>Sturla and armed companions escort Skapti, Arild and the others towards the tower at Skalk’s order. The hilltop fortress has a ditch, earthwork ramparts, palisade and torchlit gate tunnel. Its hall uses eagle ribs as supports, with burning torches in the skull’s eye sockets; Orna’s feet hang through the private room’s roof.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>The fugitives reach Darl</h2><p>Skalk magically fits the recovered talon into the skeletal foot. Helka calls Orna complete. The observed reattachment is distinct from any untested further effect.</p></details><details><summary>The Hunger of the Gods · 19</summary><h2>Scouting beyond the repaired bridge</h2><p>From the approach, the Drammur broadens and slows across the plain around the hill town. Buildings extend down towards the riverside and into the plains, with dense ships’ masts along the water. Varg smells fish, rotting vegetables, sweat, urine and smoke.</p></details><details><summary>The Hunger of the Gods · 19</summary><h2>Scouting beyond the repaired bridge</h2><p>His heightened vision distinguishes four quadrangular building groups, each with its own courtyard, evenly arranged around a much larger central longhouse inside the earthworks and palisade. He also sees a tower beyond the fortress wall on the far side of the hill. The Bloodsworn make a temporary camp in hawthorn and spruce outside town.</p></details><details><summary>The Hunger of the Gods · 21</summary><h2>An audience with Queen Helka</h2><p>The audience follows a feast: thralls clear vomit, spilled drink, urine-soaked rushes and ash from Helka’s nearly empty hall. Two unnamed lamellar-clad figures sit there, a man and woman with dark-weathered skin and shaved hair with long braids. Guðvarr compares their hairstyle to Jaromir’s without identifying them.</p></details><details><summary>The Hunger of the Gods · 21</summary><h2>An audience with Queen Helka</h2><p>Two Úlfhéðnar guard Helka’s private door, with tattoos visible through shaved stubble and thick central braids. One is named Frek. In the chamber Helka’s high-backed seat is spread with reindeer furs, with a second chair for Estrid beside it.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>Secrets in the Galdur tower</h2><p>A concealed timber-braced tunnel links the area near Helka’s chamber to the town’s Galdur tower. Guðvarr realises he has passed outside the fortress after seeing its rampart beyond the tower’s timber-enclosed courtyard. The tower contains barred cells and Skalk’s rune-copying and creature-filled workroom; see the tower article.</p></details><details><summary>The Hunger of the Gods · 24</summary><h2>A rescue planned in Darl</h2><p>The Bloodsworn enter covertly in small bands. Western approaches run through canals and tributaries among slaughterhouses and tanneries; the crowded trading quarter forms a ring around the hill’s slopes. Æsa places the thrall-market east near the docks. Beyond the traders’ ring a smithing street smells of iron and charcoal, with steam venting from a doorway.</p></details><details><summary>The Hunger of the Gods · 24</summary><h2>A rescue planned in Darl</h2><p>At twilight the tower rises black before the fortress’s earthworks and summit stockade, with guards and Orna’s skeletal wings visible beyond. Near the tower Svik’s band hears fighting and an explosion, then runs. The disturbance’s source remains unknown.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>The tunnel from the Galdur tower levels out under torches fixed to supporting beams, then climbs to a trapdoor into a wide hall. Glornir breaks the trapdoor and leads the Bloodsworn through fortress corridors; the chapter does not disclose a normal opening mechanism.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>A guarded chamber contains tapestries, a roaring hearth, silver candlesticks and a fur-covered bed. Røkia kills its guard and Hakon is taken from inside. The corridor reaches the dais of the feasting hall beneath Orna’s pale bones.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>Fighting with Helka’s Úlfhéðnar and drengrs ends at a commanded pause when Røkia holds the naked Hakon at seax-point. No hostage settlement or exit from Darl is shown.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>The hall’s hostage confrontation ends in an agreement rather than a resumed battle: Helka commissions pursuit of Jaromir, with Hakon retained as surety until the Bloodsworn are clear of Darl and one Úlfhéðnar to guard him.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>She orders silver, a drakkar and food and drink while the party waits. No longship is named or boarded, payment is not shown received and the company has not left Darl. Her later prohibition on bloodshed ends the immediate threatened fight between Varg and Guðvarr.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>The Bloodsworn spend the night in barracks by the docks rather than inside Helka’s fortress. In the morning their route crosses canals feeding the Drammur and a slave market with a dais and guarded wooden pens of collared captives. Varg’s party finds Brimil at The Dead Drengr.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>Helka’s drakkar is loaded at a pier, where she appoints Frek to accompany the captive Hakon. The Bloodsworn cast off and row into the Drammur. Sulich’s stated plan is to intercept Jaromir at Liga, not an observed arrival there.</p></details><details><summary>The Hunger of the Gods · 33</summary><h2>A summons after the tower battle</h2><p>The Galdur tower is under repair less than two days after the Bloodsworn sailed. Guðvarr later gains entry to the summit fortress after showing Helka’s gold arm ring and walks to a turf-roofed longhouse near its walls, where Sigrún is staying. This is one observed use of the ring for access, not a general rule about its powers or privileges.</p></details><details><summary>The Hunger of the Gods · 41</summary><h2>Sigrún&#x27;s reckoning with Guðvarr</h2><p>Sigrún and Guðvarr speak in a rear chamber of the longhouse Helka supplied, with a single torch and precautions against being overheard. Sigrún says Helka has asked the jarls to stay for Orlyg’s planned meeting; a peace or pact remains speculation.</p></details><details><summary>The Hunger of the Gods · 41</summary><h2>Sigrún&#x27;s reckoning with Guðvarr</h2><p>Horns precede the return of Hakon and Frek, escorted through the fortress by two score royal drengrs. A mixed crowd follows beneath Orna’s skeletal wings into Helka’s mead hall. The queen welcomes her son before announcing a feast for that night. Orlyg has not arrived in this scene.</p></details><details><summary>The Hunger of the Gods · 43</summary><h2>The feast and the shield-dance</h2><p>Hakon’s welcome feast actually takes place in the hot crowded hall beneath Orna’s bones, with roast boar, smoky torches and oil, drinking, wrestling and hounds snapping over scraps. The Úlfhéðnar temper serious violence. Leif petitions Helka amid the feast; her reference to Justice Day identifies a separate occasion for hearing disputes.</p></details><details><summary>The Hunger of the Gods · 43</summary><h2>The feast and the shield-dance</h2><p>The hall is rearranged for a shield-dance: benches pulled back, pairs of warriors holding shields at shoulder height in a loose double circle. Contestants drink ale and leap between the shields. Hakon wins after Guðvarr and Estrid collide and Glunn falls; Helka toasts him. These are temporary feast arrangements, not permanent architecture.</p></details><details><summary>The Hunger of the Gods · 46</summary><h2>A secret meeting before dawn</h2><p>In early daylight after the shield-dance feast, The Dead Drengr hosts Hakon’s pre-opening meeting with Kalv, whose message is attributed to Drekr. Guðvarr overhears and is admitted to the prince’s table; Skapti and Hrolf later enter alive. The city setting and encounter are observed, without disclosing a wider operational timetable or the prisoners’ release route.</p></details><details><summary>The Hunger of the Gods · 48</summary><h2>Flight from the breakfast table</h2><p>Guðvarr’s escape crosses a foul, dark oily canal, with reeds and thick mud on the far bank. Hrolf brings a rowing boat for the pursuers. From the canal-side buildings Guðvarr sees the fortress, Orna’s skeletal wings and the Galdur tower behind them.</p></details><details><summary>The Hunger of the Gods · 48</summary><h2>Flight from the breakfast table</h2><p>The route passes through alleys, a tanner’s yard with skins stretched on frames, over a fence and into a wider planked street climbing around the fortress walls as the town wakes. Near the tower, an intervening trapper is thrown into Kalv and later seen only as a body pushed away beside a red seax. Hrolf is explicitly killed by a spear; Kalv is restrained and ordered carried away by the tower guards.</p></details><details><summary>The Hunger of the Gods · 77</summary><h2>Orna raised and the battle above Darl</h2><p>Orna is briefly raised at a public rune-and-blood ceremony before Lik-Rifa attacks. Infiltrators trigger fighting as Helka is stabbed and Hakon murdered; the two gods wreck the hall and courtyard. Orna is killed again, but the surviving rulers, defenders and city&#x27;s full outcome are not all accounted for.</p></details><details><summary>The Fury of the Gods · 2</summary><h2>The courtyard has been cleared but remains torn by the gods&#x27; battle</h2><p>The courtyard has been cleared but remains torn by the gods&#x27; battle. The hall has broken doors, splintered walls and no roof. Lik-Rifa controls the assembly, declares herself queen and orders Helka&#x27;s bound drengrs massacred. She then forces Glunn and Svard to compete; Glunn kills Svard and claims his following. Her proclaimed sovereignty over all Vigrið extends beyond the control directly shown here.</p></details><details><summary>The Fury of the Gods · 24</summary><h2>Rotta returns to Darl</h2><p>The returning force enters from the east through unusually quiet streets, citizens watching from shutters and alleys. The former market ring is empty and Helka’s fortress is shattered timber, while the blacksmithing district still rings with active forges. These local observations do not establish total evacuation or all commerce ending.</p></details><details><summary>The Fury of the Gods · 36</summary><h2>The dragon’s host marches out</h2><p>Darl’s courtyard, streets and river docks fill with Lik-Rifa’s assembling force, which gathers Tainted and mercenary recruits before actually leaving into meadows and woodland. Sterkur and Leif join at the piers. No full city population, army strength or time synchronisation with the forest/sea viewpoints is supplied.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>The roof ward opens</h2><p>Orka describes one of the immense observed fleets sailing toward Darl; Glornir calls the fleets Rurik’s planned invasion. This is an approach seen/reported from Wolfdales, not a witnessed landing or conquest of the settlement.</p></details><details><summary>The Fury of the Gods · 81</summary><h2>The charge against the gods</h2><p>Yrsa rallies warriors bearing wing emblems identified as Darl’s; nearby shields are also described with eagles. This identifies the current unit’s heraldry, not every Darl faction’s allegiance or a new territorial conquest.</p></details><details><summary>Illustration · The Shadow of the Gods · 35</summary><p><a href="assets/5cc0a1dc18bba4.jpg">Open noncanonical illustration</a></p><p>Darl&#x27;s riverfront as approached by boat.</p></details><details><summary>Illustration · The Fury of the Gods · 2</summary><p><a href="assets/4ee92f89c4ec6f.jpg">Open noncanonical illustration</a></p><p>Lik-Rifa - proclamation at Darl.</p></details><details><summary>Illustration · The Hunger of the Gods · 77</summary><p><a href="assets/dc6ba929023f26.jpg">Open noncanonical illustration</a></p><p>Lik-Rifa and Orna clash in the air above Darl.</p></details><details><summary>Illustration · The Fury of the Gods · 36</summary><p><a href="assets/de0423fd74978e.jpg">Open noncanonical illustration</a></p><p>Lik-Rifa’s departure, just before her voice and face change.</p></details><details><summary>Illustration · The Hunger of the Gods · 77</summary><p><a href="assets/b0d990843850c6.jpg">Open noncanonical illustration</a></p><p>A net of runes descends over Orna&#x27;s skeleton during the resurrection ceremony.</p></details><details><summary>Illustration · The Hunger of the Gods · 26</summary><p><a href="assets/8bfd5328314af6.jpg">Open noncanonical illustration</a></p><p>Røkia holds Hakon hostage during the confrontation with Helka.</p></details></noscript>
