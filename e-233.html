      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 21</summary><h2>Introduction</h2><p>Estrid is Helka’s youngest child. She is introduced as a dark-haired young woman in a deep blue tunic edged with silver-dyed wool; Guðvarr notices a strong frame beneath it. She sits beside Helka and looks contemptuously at him before studying Orna’s suspended claws.</p></details><details><summary>The Hunger of the Gods · 21</summary><h2>Introduction in B02-C021</h2><p>She complains of boredom during the audience and asks to be taught weapons craft by Frek. Helka permits her to leave. Guðvarr’s private thought of a betrothal is speculation; no betrothal or training session is shown.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>She watches the fighting excitedly under the protection of Helka’s Úlfhéðnar. During bargaining over Hakon she smiles, says he should die and claims she would rule better. Helka tells her to be quiet. This is stated rivalry, not an established change to the succession.</p></details><details><summary>The Hunger of the Gods · 43</summary><h2>The feast and the shield-dance</h2><p>She joins Hakon’s shield-dance after braiding her hair, with Helka prompting him to accept her. She proves quick and draws close behind him as the other contestants fall. Guðvarr judges her ready to overtake her brother, then leaps into her as she jumps, sending both to the rush-covered floor.</p></details><details><summary>The Hunger of the Gods · 43</summary><h2>The feast and the shield-dance</h2><p>She hauls Guðvarr up, angrily accuses him of acting on purpose and asks whether Hakon pays him. His private motive invokes Skalk’s hold, while his public answer calls the collision an accident. She stands second beside the victorious Hakon and repeats her suspicion after he teases her. No payment, serious injury or change in succession is established.</p></details><details><summary>The Hunger of the Gods · 77</summary><h2>Orna raised and the battle above Darl</h2><p>At the ceremony she wears a pale-blue fox-fur-edged cloak. After Hakon&#x27;s murder she calls the Úlfhéðnar and fights Guðvarr, using Glunn as an obstacle and skilled sword strokes. The gods&#x27; crash interrupts; Guðvarr cannot find her afterwards, so no death or escape is confirmed here.</p></details><details><summary>The Fury of the Gods · 8</summary><h2>Ilska reports that she escaped Darl with the remaining Úlfhéðnar thralls and some drengrs</h2><p>Ilska reports that she escaped Darl with the remaining Úlfhéðnar thralls and some drengrs. Glunn says he saw her with Skalk after Orna fell, but their present association and route remain guesses. Lik-Rifa orders the pair found and killed; Krúsa, Sigrún and Guðvarr receive the hunt. No new direct sighting or destination is shown.</p></details><details><summary>The Fury of the Gods · 31</summary><h2>The hunters enter Jarnvidr</h2><p>Skapti names her and Skalk as leaders of the band he serves, saying they instructed the hunters to follow the Jarnvidr road to find them. He does not know where or when they will appear. The party’s entry into the forest does not confirm her precise position or a completed meeting.</p></details><details><summary>The Fury of the Gods · 34</summary><h2>A bargain in the forest glade</h2><p>She waits with Skalk in a stream-crossed glade, dark-haired in travel-stained cloak and torn, muddy blue tunic with silver edging, gold-hilted sword at her hip. Frek, Yrsa, Sturla and her hidden warriors attend. She proposes alliance for survival, citing the dragon’s strength; her assumption Orlyg probably died is outdated. She reports Störr dead and Elvar holding the wolf, information from travellers Frek questioned. She and Skalk offer location knowledge and service; Sigrún/Krúsa agree only to forward the offer. The Faunir attack sends her party retreating along its side of the glade; no dragon approval occurs.</p></details><details><summary>The Fury of the Gods · 41</summary><h2>Sigrún reports her and Skalk’s offer to swear to Lik-Rifa and act as eyes/ears in Ulfrir’s camp</h2><p>Sigrún reports her and Skalk’s offer to swear to Lik-Rifa and act as eyes/ears in Ulfrir’s camp. Munni carries further news from them, then independently checks ships and stone wolves at the den. Their intelligence is welcomed, but actual infiltration, completed oaths and a settled formal alliance remain unshown.</p></details><details><summary>The Fury of the Gods · 44</summary><h2>The new arrivals and Grend’s fate</h2><p>She arrives with Skalk and followers and is introduced by Uspa as Queen of Darl, a practical status Elvar disputes inwardly. Elvar recognises her despite the fair-hair wording here, retained as a variation against earlier dark hair rather than a proven disguise. Estrid offers sword, followers and friendship against the dragon. After Ulfrir stops Glornir’s feud she agrees to Elvar’s rules. The prior spy proposal is not renounced, and no new internal report or performed oath is shown.</p></details><details><summary>The Fury of the Gods · 51</summary><h2>Elvar sees her with Silrið, Runa and Hjalmar in a branch-linked upper room</h2><p>Elvar sees her with Silrið, Runa and Hjalmar in a branch-linked upper room. No conversation is overheard and the group is not established as the unnamed enemy contacts. The hair-description variation remains unresolved.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>She joins the chiefs releasing their Tainted, specifically her Úlfhéðnar</h2><p>She joins the chiefs releasing their Tainted, specifically her Úlfhéðnar. This is observed compliance with Elvar’s condition, not proof resolving every suspicion from earlier meetings or retroactive innocence of unnamed contacts.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>Freedom and the approaching army</h2><p>Frek reports to Elvar that Estrid and Skalk sent information through Lik-Rifa’s messengers and joined Broðir/Runa’s plot, with Hjalmar present. He says his group sought to bring them to Elvar but found they had fled; their destination and capture are not shown. Elvar orders a search. These details remain attributed testimony, not a newly witnessed council scene.</p></details><details><summary>The Fury of the Gods · 64</summary><h2>Below the newly bypassed tower ward Rotta calls for Skalk and Estrid</h2><p>Below the newly bypassed tower ward Rotta calls for Skalk and Estrid. One unidentified voice answers Here. This corroborates contact at the stairs without visually confirming both bodies, naming the respondent or placing Hjalmar there.</p></details><details><summary>The Fury of the Gods · 66</summary><h2>The infiltrators descend</h2><p>She and her drengrs are explicitly said to have been sent elsewhere in the tunnels, alongside a separate mention of Hjalmar. This confirms involvement but gives no exact destination, later task or chapter64 reply-speaker identity. Skalk is the one leading Biórr’s current route.</p></details><details><summary>The Fury of the Gods · 68</summary><h2>Elvar’s fall and the rebellion in the hall</h2><p>Her Darl-eagle drengrs are identified among the door rebels, and she stands near Sturla’s staff working. After Vol kills Sturla she calls about a score to her while Fell-Hearted survivors join. Her own final fate is not shown before Rotta opens the gates.</p></details><details><summary>The Fury of the Gods · 71</summary><h2>Guðvarr finds Estrid</h2><p>She joins shields with Sigrún, then lies alive with a forehead cut after the huge attackers break their wall. Guðvarr finds her, deliberately stabs her throat and pins her while pretending to offer comfort. She struggles, weakens and dies; he retrieves his sword and smiles. Her death is his act after the charge, not an attributed kill by the bull-man.</p></details><details><summary>The Fury of the Gods · 78</summary><h2>The shattered enemy camp</h2><p>Guðvarr tells Sigrún she died when the bull-man/Berserkir broke the wall, concealing his deliberate throat murder already recorded. Sigrún nods; this cover account does not replace the observed cause.</p></details><details><summary>Illustration · The Hunger of the Gods · 21</summary><p><a href="assets/da835af16b2a03.jpg">Open noncanonical illustration</a></p><p>Estrid seated at Helka&#x27;s audience.</p></details><details><summary>Illustration · The Fury of the Gods · 34</summary><p><a href="assets/5e38b5ccb5545b.jpg">Open noncanonical illustration</a></p><p>The meeting before the glade is attacked.</p></details><details><summary>Illustration · The Fury of the Gods · 71</summary><p><a href="assets/43824082300f3e.jpg">Open noncanonical illustration</a></p><p>The unnamed attackers breaking the joined shield line.</p></details></noscript>
