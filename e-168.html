      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 26</summary><h2>Oar-dance and weapons practice</h2><p>Vol questions how vaesen could have crossed the Bonebacks past the Grimholt and its guard tower.</p></details><details><summary>The Shadow of the Gods · 40</summary><h2>Flight towards Grimholt Pass</h2><p>Orka sees the Grimholt Pass as a gap in the Boneback Mountains north of Darl and chooses to ride towards it in search of Drekr and Breca.</p></details><details><summary>The Shadow of the Gods · 46</summary><h2>The broken oath stone</h2><p>The fortress guards one of the few passes through the Bonebacks against northern vaesen. Orka describes a hall with walls north and south, and says she saw it long ago.</p></details><details><summary>The Shadow of the Gods · 49</summary><h2>Ravens and frost-spiders</h2><p>Orka’s reconnaissance shows north and south timber walls spanning the valley, with a turf-roofed hall, rear watchtower and service buildings between. A diverted river loop serves its pier. She counts sixteen visible warriors and estimates a larger population, without confirming Drekr is there.</p></details><details><summary>The Shadow of the Gods · 51</summary><h2>Captivity and violence at Grimholt</h2><p>Skapti admits the fortress has allowed Drekr to bring and store goods under Hakon’s orders, with routes north and west. Orka and the brothers are imprisoned and interrogated in its tower before the raven-assisted escape sets the roof ablaze.</p></details><details><summary>The Shadow of the Gods · 53</summary><h2>The Bloodsworn reach the ruined fortress</h2><p>The Bloodsworn arrive after the violence and find the tower burning, many dead and Orka with two vaesen and about twelve to fifteen children on the hall steps.</p></details><details><summary>The Hunger of the Gods · 1</summary><h2>Rest and restraint in the burned hall</h2><p>The next morning the Bloodsworn occupy its burned hall. Most of the tower roof and two walls are gone. Both previously moored twelve-oared snekkes have departed, leaving frayed ropes.</p></details><details><summary>The Hunger of the Gods · 7</summary><h2>An offer to return to the Bloodsworn</h2><p>The Bloodsworn leave with scouts ahead and Einar driving the rescued children’s wagon. Edel assembles a separate escort for Orka’s western mine search; before the departure Orka looks back at the ruined tower and gaps in the hall’s roof.</p></details><details><summary>The Hunger of the Gods · 46</summary><h2>A secret meeting before dawn</h2><p>Skapti and Hrolf are recognised as men from Grimholt when they enter The Dead Drengr in Darl alive. This is a later sighting of the former tower prisoners, not a return to Grimholt or an account of their release, other survivors or the fortress’s current condition.</p></details><details><summary>Illustration · The Shadow of the Gods · 53</summary><p><a href="assets/af713ccde5411c.jpg">Open noncanonical illustration</a></p><p>Grimholt as seen during reconnaissance, before the fire.</p></details></noscript>
