      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 21</summary><h2>Appearance</h2><p>Elvar recognises the Raven-Feeders outside a Snakavik tavern and knows their ruthless reputation. Their leader is Ilska Raven-Feeder, also called Ilska the Cruel. Their warriors wear raven feathers in their hair and carry grey shields with black wings.</p></details><details><summary>The Shadow of the Gods · 27</summary><h2>A raid and a stolen child</h2><p>Elvar identifies the attackers as Ilska&#x27;s Raven-Feeders and the dead blond man as the warrior she saw earlier. Ilska&#x27;s drakkar carries grey shields painted with black wings. Agnar confirms Ilska&#x27;s Raven-Feeders took Bjarn and initially declines a costly pursuit.</p></details><details><summary>The Shadow of the Gods · 29</summary><h2>The hidden book and the road ahead</h2><p>Uspa says she and Berak stole the Graskinna from the Raven-Feeders, who have hunted them for a long time. Uspa says Berak killed Raven-Feeders and others during their escape.</p></details><details><summary>The Shadow of the Gods · 50</summary><h2>A deadly holmganga</h2><p>Their Oskutreð force includes fifteen riders, perhaps sixty marching warriors and twelve covered carts. The carts prove to contain scores of collared children, including the boy Uspa recognises as Bjarn. Skrið is Vörn’s identified dragon-born; Elvar’s wider conclusion about the mounted group remains attributed.</p></details><details><summary>The Shadow of the Gods · 52</summary><h2>Chapter 52 — Shield walls at Oskutreð</h2><p>Over sixty Raven-Feeder infantry approach in lines with raised shields, halting ten paces from the Battle-Grim before charging. At impact their wall is at least three lines deep. Ilska leads her inner group towards the carts and Vörn instead.</p></details><details><summary>The Shadow of the Gods · 52</summary><h2>Chapter 52 — Shield walls at Oskutreð</h2><p>Biórr explicitly declares Ilska a protector of the Tainted. Ilska’s inner group frees Lik-Rifa using the collared children; after the release the warband recovers its carts and child captives and follows the dragon south.</p></details><details><summary>The Hunger of the Gods · 5</summary><h2>A welcome among the Raven-Feeders</h2><p>After almost two days of forced marching from Oskutreð, the warband camps east of Mount Eldrafell and a short march north of the vaesen pit and Isbrún Bridge.</p></details><details><summary>The Hunger of the Gods · 5</summary><h2>A welcome among the Raven-Feeders</h2><p>Myrk identifies a group of untouched warriors as Dragon-Cult members. Close to a hundred Tainted children remain collared; she attributes their subdued condition to a calming Seiðr-spell and promises future release from collars.</p></details><details><summary>The Hunger of the Gods · 9</summary><h2>Old companions at the campfire</h2><p>Myrk leaves south with fifteen warriors and spare mounts. Biórr reunites with Red Fain and Storolf, and Storolf identifies ten or twelve new companions as having come with Drekr.</p></details><details><summary>The Hunger of the Gods · 9</summary><h2>Old companions at the campfire</h2><p>Lik-Rifa kills a guard in the camp after Ilska questions her assertion that Ulfrir lives. Drekr saves Ilska and stands against the dragon; the goddess then orders a hurried journey south to Isbrún Bridge. The camp starts moving after another threat.</p></details><details><summary>The Hunger of the Gods · 14</summary><h2>Crossing Isbrún Bridge</h2><p>The company crosses Isbrún Bridge with wagons of Tainted children. When tennúr rise beyond the bridge, Fain and Storolf organise a shield wall while Ilska and the dragon-born conjure a fire-rune dome. Lik-Rifa stops their attempted intervention and demands they treat the vaesen as allies.</p></details><details><summary>The Hunger of the Gods · 14</summary><h2>Crossing Isbrún Bridge</h2><p>After the creatures return underground and the bridge disappears from Biórr’s sight, the company follows Lik-Rifa east towards Nastrandir. She says the tennúr will join after performing a task; no arrival or task outcome occurs here.</p></details><details><summary>The Hunger of the Gods · 18</summary><h2>Training and an encounter in the rain</h2><p>More than a dozen riders arrive at the mine, each leading a spare horse, with mail, sealskin cloaks and a grey raven-wing shield seen among them. Halja and Orka recognise their affiliation. Their dark-haired female leader has a raven feather bound with silver wire, pale sharp features and dark eyes, with sword, two seaxes, iron helm and saddle shield.</p></details><details><summary>The Hunger of the Gods · 18</summary><h2>Training and an encounter in the rain</h2><p>The leader kneels screaming at one corpse, then rises in tears and fury. Others search the glade and two enter the chambers. Her personal identity, the dead person and their relationship remain unestablished; the chapter does not merge her with a named Raven-Feeder.</p></details><details><summary>The Hunger of the Gods · 20</summary><h2>Myrk confronted in the glade</h2><p>The leader at the mine is explicitly named Myrk Sharp-Claw. Orka counts twelve outside including her and two inside the chamber, a count kept distinct from the earlier departure. Myrk orders Orka and her companions taken, but the confrontation becomes a battle joined by the Bloodsworn. Orka defeats Myrk with an elbow blow and her fire-rune vanishes; her death is not established.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>They march east with Lik-Rifa and Ilska, untouched followers and wagons of children. Ilska ends the march by signal and Drekr’s horn; the company camps in the warm strip beside the vaesen pit, preparing elk, porridge and stockfish. Biórr’s companions praise Agnar’s killing while he privately regrets it.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>Almost a hundred children are assembled. Ilska and the dragon-born chant and remove every collar; Lik-Rifa then intimidates them into silence and demands loyalty. The acclamation includes warriors, Biórr and children, without establishing unconstrained consent.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>At dawn Ilmur returns from a reported tracking job with Brák and a runaway. The boy explicitly identifies himself as Breca Thorkelsson. Brák’s repeated beatings, broken hand and deep cheek cut leave him captive and alive; Biórr’s objections do not free him.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>Orka’s group follows Myrk’s earlier trail north-west towards Lake Horndal. Under interrogation Myrk describes a past northern position, pursuit of the Battle-Grim across the bridge, and a westward rendezvous plan near the Iskalt Islands. These reports do not place the whole company there now or overwrite its directly observed eastward movement.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>The band leaves the warm pit and follows the eastern crags south towards the eastern Bonebacks, with snow ahead. Breca and Bjarn ride with Kráka. No further child has attempted escape since the beating, but Biórr cannot tell whether this signals acceptance or fear; physical collar removal has not established their safety or complete recovery.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>Lik-Rifa gathers the children for a bloodline exercise after Ilska demonstrates claws, red eyes and sharp teeth. The children answer with animals, including Breca’s wolf and bear. Lik-Rifa’s claims to replace their parents remain her address, not proof of free consent.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>At the approaching swarm, Drekr and the dragon-born prepare rune-fire, but Lik-Rifa welcomes the tennúr. After their many-voiced report she declares in rage that her brother has crossed the bridge. No new fight or retaliatory order is shown.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>Orka&#x27;s search in Starl</h2><p>Myrk tells Orka that her group booked a knarr to cross Horndal. Halja finds tracks entering Starl rather than following the shore path. This supports the earlier approach into town, not independently witnessed embarkation, the truth of the whole rendezvous account or a new present location for the main company and captive children.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>Ilska puts the band into a hard training regime from the day after the feast, preparing to march as Lik-Rifa’s apostles. Some teach older Tainted children and dragon-worshippers, others spar. Biórr and Storolf instruct children and Brák defeats an unnamed woman in padded sparring; these are exercises, not new deaths.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>Rotta urges attacks on weak points and the children’s practice becomes more aggressive. At the council Ilska pledges to fight Ulfrir and reports on the three rulers. Lik-Rifa announces the planned sequence of attacks, but the band has not yet marched in this chapter.</p></details><details><summary>The Fury of the Gods · 16</summary><h2>Grief and pursuit at the river</h2><p>A knot of twelve to fifteen holds part of the shield wall, including Biórr and Fain; a fox-tainted member fights beside Biórr. After Myrk’s death they follow Biórr against Orka’s small protective group. Fain and the others force its defence back, but the shield-bearers and spear-bearers split into pairs and fight on.</p></details><details><summary>The Fury of the Gods · 59</summary><h2>Across the wall towards the hall</h2><p>They advance through the river gate after skraeling unbar it, led by Ilska and Drekr, with a host following. The new position is inside the river defences; the hillside entrance remains held by Elvar’s host.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>Their grey shields bear black ravens at the front-centre, Ilska leading and Drekr in the second row</h2><p>Their grey shields bear black ravens at the front-centre, Ilska leading and Drekr in the second row. Spertus surge ahead, then the archer-battered shield wall closes and clashes with Elvar’s host.</p></details><details><summary>The Fury of the Gods · 69</summary><h2>Biórr’s doubts amid the fighting</h2><p>They enter behind vaesen with Ilska at their front-centre, a loose shield formation amid the crowded hall. No exact number or whole-unit fate is established.</p></details><details><summary>The Fury of the Gods · 70</summary><h2>They cut the binding roots to aid the dragon</h2><p>They cut the binding roots to aid the dragon. Their loose shields are not locked before Orka crashes through; Bloodsworn push them back between Gelta’s legs to the trunk. Some die, but no whole-unit destruction or exact casualty count is established.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>The roof ward opens</h2><p>The roughly score-or-so survivors fighting upward are called Tainted, strong/fast, without a uniform named lineage or a statement about every historical member. A red-haired woman hits the roof ward before Rotta opens it. They retreat to the crown, pause at the sea view and reform behind skraeling with Ilska/Drekr/Skalk before the next charge.</p></details><details><summary>The Fury of the Gods · 74</summary><h2>Snaka rises and Wolfdales collapses</h2><p>The Bloodsworn break their shield wall; Vol overcomes Skalk and Glornir cuts Ilska down while Orka fights Drekr. The hill collapses before a full survivor tally or final Drekr outcome is given.</p></details><details><summary>The Fury of the Gods · 83</summary><h2>Skuld’s scissors and the spider’s venom</h2><p>A grey-shield/raven-feather group presses Orlyg while Drekr’s handful attack from behind, breaking the line. No complete roster or final warband outcome is given.</p></details><details><summary>The Fury of the Gods · 86</summary><h2>They slaughter Orlyg’s remaining line until Orka’s Bloodsworn engage</h2><p>They slaughter Orlyg’s remaining line until Orka’s Bloodsworn engage. Drekr’s own duel ends in venom collapse and the family’s finishing strikes, but the complete Raven-Feeder casualty tally is not supplied.</p></details><details><summary>Illustration · The Shadow of the Gods · 53</summary><p><a href="assets/bc7d096c1db406.jpg">Open noncanonical illustration</a></p><p>The opposing shield walls face one another before the Raven-Feeders charge.</p></details><details><summary>Illustration · The Fury of the Gods · 16</summary><p><a href="assets/5c77717d0b0b6f.jpg">Open noncanonical illustration</a></p><p>Biórr and Fain during the brief shield-wall respite.</p></details></noscript>
