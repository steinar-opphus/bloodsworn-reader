      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 21</summary><h2>Appearance</h2><p>Hrung is the giant marble-like head behind Störr’s chair, dark veins seeming to glow in the torchlight. Silrið wakes him with a kick and command; he opens cloudy eyes and says he was dreaming.</p></details><details><summary>The Shadow of the Gods · 21</summary><h2>Blood tested in Snakavik</h2><p>He tastes blood taken from Berak and pronounces it Berser’s blood. Later he announces Elvar’s presence before she pulls back her hood and addresses Störr as her father. His origin and recognition mechanism are not explained in this chapter.</p></details><details><summary>The Shadow of the Gods · 25</summary><h2>A choice of loyalties</h2><p>Gytha says Hrung sleeps longer and more heavily than he used to. Elvar wakes Hrung by flicking mead onto his lips. Hrung says he wishes Störr and Silrið had left him dead in Snaka&#x27;s throat. Hrung attributes his continuing life after decapitation to a fragment of Snaka&#x27;s dying power. Hrung says he spent three hundred years in the deep fjord. Hrung answers Elvar&#x27;s request for guidance with a riddle about whether the sun can be cold, the sea dry or a wolf a lamb.</p></details><details><summary>The Shadow of the Gods · 25</summary><h2>A choice of loyalties</h2><p>Hrung’s long moustache droops while he sleeps during Elvar’s visit.</p></details><details><summary>The Hunger of the Gods · 67</summary><h2>Elvar returns to her father&#x27;s hall</h2><p>His giant head remains on the pedestal in Störr&#x27;s hall, eyes closed and mouth drooping, with audible snoring. No new speech or prophecy occurs here.</p></details><details><summary>The Hunger of the Gods · 71</summary><h2>The wolf-god wrecks Störr&#x27;s hall</h2><p>He wakes and recognises Ulfrir with tears, converses with him and later addresses Elvar as jarl after the succession fight.</p></details><details><summary>The Fury of the Gods · 19</summary><h2>Hidden followers and the missing Grend</h2><p>Moved from the cold broken feast hall to the tower council room, he stands on his pedestal near the central fire pit, with a giant half-buried chain link behind him. He joins the council’s discussion and agrees with Ulfrir that Lik-Rifa cannot be reasoned with, calling her insane; this is his assessment rather than a neutral diagnosis.</p></details><details><summary>The Fury of the Gods · 23</summary><h2>Hrung’s account and Grend’s secret</h2><p>He recounts Snaka eating his entire clan, including his wife and children, and claims he killed the serpent during Guðfalla by filling himself with poison and entering its mouth. He weeps while remembering. He does not know why his head survived, offering alternatives involving Snaka’s power or blood and openly questioning whether his limited existence is truly living. Elvar comforts him and pours mead into his mouth.</p></details><details><summary>The Fury of the Gods · 23</summary><h2>Hrung’s account and Grend’s secret</h2><p>He approves Elvar’s arrangement with the incoming Úlfhéðnar but challenges her treatment of existing thralls as objects, reminding her of Störr’s language. He also recognises Jarnvidr and agrees Uspa’s argument about the growing Tainted issue deserves attention.</p></details><details><summary>The Fury of the Gods · 33</summary><h2>The tide and the search for Grend</h2><p>He urges the importance of the tide with a cheerful remark, is lifted from his pedestal to a small cart drawn by two shaggy ponies, and taken down to the pier. Looking at the fjord, he jokes that three hundred years in its embrace was enough. Elvar orders him loaded carefully onto Wave-Jarl; no separate newly proved survival mechanism is supplied.</p></details><details><summary>The Fury of the Gods · 35</summary><h2>The fleet leaves Snakavik</h2><p>His stone pedestal is secured to Wave-Jarl’s deck with rope and iron rings under the old-sail enclosure. He converses with Hjalmar and laughs that Grend remains a man of few words after the apology. No new knowledge of Grend’s lineage is independently asserted by him.</p></details><details><summary>The Fury of the Gods · 38</summary><h2>Drengrs carry him from his pedestal on thick beams at Wolfdales</h2><p>Drengrs carry him from his pedestal on thick beams at Wolfdales. Looking at the noisy wolves, he jokes they woke him from dreaming of a body and legs. This is a dream and joke, not a restored body.</p></details><details><summary>The Fury of the Gods · 40</summary><h2>He warns Ulfrir against becoming another severed head trophy while the god proposes baiting Lik-Rifa</h2><p>He warns Ulfrir against becoming another severed head trophy while the god proposes baiting Lik-Rifa. This is a grim joke/advice, not a prophecy or new fate for Ulfrir.</p></details><details><summary>The Fury of the Gods · 43</summary><h2>His question about the second raven startles Varg and reveals life to Orka, who thought him a bust</h2><p>His question about the second raven startles Varg and reveals life to Orka, who thought him a bust. Pale swirling eyes and a broad smile accompany recognition of Grok/Kló, whom he jokingly accuses of mischief. He offers friendship despite warning none are safe against a dragon. No new stone material or earlier meeting date is established.</p></details><details><summary>The Fury of the Gods · 48</summary><h2>He startles newly arrived Logur by speaking and proposes hearing the tales about himself over mead</h2><p>He startles newly arrived Logur by speaking and proposes hearing the tales about himself over mead. The friendly exchange does not show a completed drinking session or a restored body.</p></details><details><summary>The Fury of the Gods · 63</summary><h2>A frost-spider clings to his head on the dais pedestal and bites him, making him scream</h2><p>A frost-spider clings to his head on the dais pedestal and bites him, making him scream. It crumples dead before Elvar reaches it; Grend prods the body, without establishing its death’s cause. Hrung complains about their attention to the spider, stammering with two blue cheek lumps and lips starting blue, then eyes glazing with ice. His recovery or death remains unshown, and Grend’s jokes do not prove immunity.</p></details><details><summary>The Fury of the Gods · 65</summary><h2>Still blue after the bite, he wakes, blinks and complains of cold</h2><p>Still blue after the bite, he wakes, blinks and complains of cold. Uspa’s warm hands bring relief, focused eyes and joking conversation, so he is alive and responsive; full recovery is not established. He scowls at the still-dead spider. Elvar hints she wants more than talk from him but her intended role/discussion remains undisclosed.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>Leif’s death and the tunnel escape</h2><p>Grend’s delayed party carries him suspended in sailcloth; Ulfrir lifts that cloth in his jaws and shelters them to the tunnel entrance. No new examination establishes full cure from the spider bite, and Elvar’s hinted plan for him is not disclosed.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>The survivors’ camp and reunion</h2><p>Ulfrir sets his sailcloth down at the tunnel exit; he calls thanks, then Grend/Gytha/Uspa/Berak unwrap and set him upright. He thanks Grend for saving his life and mourns Elvar. Later thoughtful at council, he says Snaka died once and can again. Alive conversation is confirmed, but the earlier bite’s full medical mechanism and Elvar’s hinted plan are not explained.</p></details><details><summary>The Fury of the Gods · 79</summary><h2>After earlier silent thought, he stops Ulfrir’s departure and says Elvar had a plan</h2><p>After earlier silent thought, he stops Ulfrir’s departure and says Elvar had a plan. Varg/Røkia leave earshot before its content; the disclosure begins without revealing the intended role or mechanism to this viewpoint.</p></details><details><summary>The Fury of the Gods · 90</summary><h2>The last assault on Lik-Rifa</h2><p>Carried on handcart then sailcloth, he cries for the moment and Taras hurls him into Lik-Rifa’s open jaws. She swallows, poisons and dies; Ulfrir names ancient Hrung serpent slayer and now dragon slayer, corroborating his earlier poisoning account as a causal claim. A voice from her belly is identified as Hrung: he survives, without extraction shown yet.</p></details><details><summary>Illustration · The Fury of the Gods · 43</summary><p><a href="assets/3c80cc23ff516b.jpg">Open noncanonical illustration</a></p><p>Elvar accepting the ravens as friends and scouts.</p></details><details><summary>Illustration · The Shadow of the Gods · 35</summary><p><a href="assets/2cb8aa9c827365.jpg">Open noncanonical illustration</a></p><p>Hrung awake in Störr&#x27;s mead hall at Snakavik.</p></details><details><summary>Illustration · The Fury of the Gods · 63</summary><p><a href="assets/386a293038e71c.jpg">Open noncanonical illustration</a></p><p>Hrung’s complaint as his eyes glaze with ice.</p></details><details><summary>Illustration · The Fury of the Gods · 23</summary><p><a href="assets/ecb94499b2722e.jpg">Open noncanonical illustration</a></p><p>Elvar comforting Hrung and sharing her mead.</p></details><details><summary>Illustration · The Fury of the Gods · 19</summary><p><a href="assets/8107774f8a5f4d.jpg">Open noncanonical illustration</a></p><p>Svea’s news reaching the new tower council.</p></details><details><summary>Illustration · The Fury of the Gods · 90</summary><p><a href="assets/74e707bda99962.jpg">Open noncanonical illustration</a></p><p>Taras throwing Hrung toward the dragon’s open jaws.</p></details><details><summary>Illustration · The Fury of the Gods · 75</summary><p><a href="assets/855fc6762a4e54.jpg">Open noncanonical illustration</a></p><p>Ulfrir carrying Hrung’s sailcloth and shielding the delayed party.</p></details><details><summary>Illustration · The Fury of the Gods · 65</summary><p><a href="assets/3b68c40c40405f.jpg">Open noncanonical illustration</a></p><p>Uspa warming the awake but still cold Hrung.</p></details></noscript>
