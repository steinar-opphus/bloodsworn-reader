      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 5</summary><h2>Introduction</h2><p>Grend taught Elvar to check that her sword draws freely.</p></details><details><summary>The Shadow of the Gods · 9</summary><h2>The serpent and the captive family</h2><p>Grend has a broad back, grey streaks in his hair and beard, and a creased, dour face. He is described as no longer young, without a precise age.</p></details><details><summary>The Shadow of the Gods · 5</summary><h2>Story and connections</h2><p>He kills the spear-bearing woman attacking Elvar with his axe.</p></details><details><summary>The Shadow of the Gods · 5</summary><h2>Story and connections</h2><p>He breaks a section of the hut wall with his axe. After searching for tracks, he points towards the treeline.</p></details><details><summary>The Shadow of the Gods · 9</summary><h2>The serpent and the captive family</h2><p>Grend says Lik-Rifa survived Guðfalla and is chained beneath Oskutreð.</p></details><details><summary>The Shadow of the Gods · 9</summary><h2>The serpent and the captive family</h2><p>He stabs the sea serpent and drags Elvar and the boy back towards the ship.</p></details><details><summary>The Shadow of the Gods · 21</summary><h2>Blood tested in Snakavik</h2><p>Snakavik was Grend’s home for longer than Elvar has been alive. On this visit he wears mail and carries axe and seax, with a wool hood over black braided hair. He is beside Elvar when she is identified in Störr’s hall and addresses the jarl as her father.</p></details><details><summary>The Shadow of the Gods · 23</summary><h2>Kinship and a proposed marriage</h2><p>Grend remains with Elvar during her meeting with her father. Grend defends Elvar&#x27;s independently earned renown.</p></details><details><summary>The Shadow of the Gods · 25</summary><h2>A choice of loyalties</h2><p>Grend advises taking Störr&#x27;s offer but warns that Störr hides plans within plans. Grend promises to follow Elvar whatever she chooses. Elvar remembers Grend&#x27;s blood oath when she sees the white scar across his palm. Grend grips Biórr&#x27;s wrist while warning that he protects Elvar from concealed intentions. Hrung calls Grend &#x27;Grend the Talker&#x27;.</p></details><details><summary>The Shadow of the Gods · 27</summary><h2>A raid and a stolen child</h2><p>Grend kills the female attacker outside the tavern. Elvar gives Grend a silver arm ring as a gift of friendship. The gifted arm ring has terminals carved as a snarling wolf or hound.</p></details><details><summary>The Shadow of the Gods · 29</summary><h2>The hidden book and the road ahead</h2><p>Grend initially refuses another oath but finally agrees only for Elvar. Grend&#x27;s existing oath to Elvar&#x27;s dead mother drives his sacrifice for Elvar.</p></details><details><summary>The Shadow of the Gods · 38</summary><h2>The bridge over the vaesen pit</h2><p>At the vaesen pit, Grend protects Elvar despite wounds from tennúr and is struck down by a creature carrying a stone. Elvar guards him until Biórr carries him into the shield wall. Elvar subsequently finds his pulse; the chapter leaves him alive but unconscious.</p></details><details><summary>The Shadow of the Gods · 42</summary><h2>Survivors and the family Agnar chose</h2><p>After the crossing, Uspa cleans and dresses Grend&#x27;s head wound and says his skull is not broken. He remains unconscious during transport, but at the next camp he wakes, recognises Elvar, speaks and drinks water before sleeping again. Full recovery is not yet established.</p></details><details><summary>The Shadow of the Gods · 44</summary><h2>On the road through the Dark-of-Moon Hills</h2><p>By chapter 44 he is marching again, nearly two days after waking, with bandaging and scrapes still visible.</p></details><details><summary>The Shadow of the Gods · 52</summary><h2>Betrayal and the dragon&#x27;s release</h2><p>He rallies the Battle-Grim after Agnar’s death, protects Elvar in the shield wall and carries her out after a spear wounds her shoulder. He survives the great blast and crawls back to her.</p></details><details><summary>The Hunger of the Gods · 2</summary><h2>A burial and a surviving gaoler</h2><p>He stitches Elvar&#x27;s shoulder and accepts an ancient bearded axe she finds, with silver wire and wolf knotwork. He retrieves a small-ring mail coat for her. Skuld splits his nose when she awakens; he later tells her her sisters died fighting Lik-Rifa.</p></details><details><summary>The Hunger of the Gods · 6</summary><h2>The swarm in the depths</h2><p>He pulls Elvar up after the creature clinging to her bursts apart and fights at her back with his new axe tracing red arcs in the rune-light. Later he assents when Uspa asks for his and Elvar’s word concerning the attempt to free Berak.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>A collar and the wolf-god&#x27;s return</h2><p>He helps Sighvat hammer the collar, then is the first Battle-Grim to cut himself when Uspa calls for their blood. During Ulfrir’s howl he alone stands motionless while others recoil or drop to their knees.</p></details><details><summary>The Hunger of the Gods · 17</summary><h2>An uneasy bargain with Ulfrir</h2><p>He challenges Ulfrir’s threats against Elvar, then catches her wrist when Huld provokes her, warning that tiredness causes mistakes. At the pit he catches Elvar’s mail as she falls, with Sighvat supporting his wrist, and hauls her to safety.</p></details><details><summary>The Hunger of the Gods · 17</summary><h2>An uneasy bargain with Ulfrir</h2><p>In the shield wall he stands to Elvar’s left and tries to share the weight borne by her wounded shoulder. He follows her back towards Ulfrir’s attacked wagon.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>A duel for the Battle-Grim</h2><p>Returning from last watch, he asks about Elvar’s shoulder. Sighvat proposes him as chief and praises his calm thought and fighting, but he refuses: he is here for Elvar and says he would leave if she leaves or dies. This expresses loyalty, not a newly disclosed family relationship.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>A duel for the Battle-Grim</h2><p>He offers to fight in her place, is refused and serves as her second. He offers his shield and advises ending Huld’s fast violent assault quickly because of Elvar’s shoulder. The advice recalls his earlier teaching beneath her mother’s window at Snakavik.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>A duel for the Battle-Grim</h2><p>He assents to the prohibition on post-duel blood feud or weregild, then gestures to Elvar to think. He enters the square first after her victory and praises her, asking about pain and whether the weakness was a feint. She reports no pain after Uspa’s runes, without a separate medical finding.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>He asks why Elvar seems different and laughs until he must rest a hand on his knee when she describes her leadership worries. He tells Sighvat she is growing up. Elvar later assigns him first watch partly to avoid his recurrent smile.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>Elvar recalls him breaking through a door and lunging at Störr during an assault on her mother. He obeyed the mother’s order to stand down, after which Störr made him watch further beating. This is her memory of a test designed to provoke an offence against his jarl, not a new present confrontation.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>He bursts into the Wave-Jarl camp warning that something approaches, immediately before the unnamed Froa appears.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The laden ship reaches Starl</h2><p>At the three women’s approach he gives a warning sound and rests his hand on his new axe. He quietly backs Sighvat’s proclamation of Elvar’s reputation when Halja dismisses it, saying that she will hear of Elvar.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>Orka sees him guarding the plank with a fine hand-axe, tall and broad with greying black hair and faded white scars on his cheek and hand backs. He is a handspan shorter than her but broader, with a cragged face. He warns he will watch her. Sighvat names him in the introductions, and he stands behind Elvar during the talk.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>With Uspa, Elvar and Sighvat he shows white coiled oath scars when Uspa explains their obligation to recover Bjarn. No new oath or completed rescue occurs.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>Elvar asks why he has seemed tense since meeting Orka. He calls Orka dangerous and says the scent of death rolled from her. His description is an assessment, without a demonstrated new supernatural sensing faculty. He explains that Ulfrir’s thraldom and Lik-Rifa’s departure had left Elvar safe in those encounters; this is his safety judgment, not universal immunity.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>When Elvar asks if he is overprotective, he allows perhaps with a hint of a smile. She jokes about protection across the boarding plank and runs aboard; he follows with his familiar scowl. Her later thought that she likes Orka perhaps because she worried Grend remains Elvar’s private response.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Rowing and a merchant ship intercepted</h2><p>After Elvar’s rowing shift he offers his leather-carved water bottle. Later he points out thirty or forty travellers on the western Hvítá bank approaching a wooden bridge, with ox-drawn provisions and children. When they are identified as dragon-worshippers, he proposes landing to kill them. Elvar refuses in favour of one battle at a time, and the ship passes on without attacking them.</p></details><details><summary>The Hunger of the Gods · 61</summary><h2>The Battle-Grim return to Snakavik</h2><p>He recalls being summoned by Elvar&#x27;s mother to teach her weapons craft at four winters; her first strike allegedly broke three of his toes. He expresses confidence in her cunning, laughs openly and receives an affectionate forehead touch. At landing he carries a small chest and gives her the company shield.</p></details><details><summary>The Hunger of the Gods · 69</summary><h2>Bargaining for the Berserkir</h2><p>He opens the first treasure chest, then draws axe and shield beside Elvar. Gytha demands he stand down; he refuses because each must do what they must. No duel outcome occurs in this chapter.</p></details><details><summary>The Hunger of the Gods · 71</summary><h2>The wolf-god wrecks Störr&#x27;s hall</h2><p>With Sighvat he guards Elvar as Uspa blocks magical attacks, fighting drengrs and controlled Berserkir. No death or final injury assessment is supplied for him here.</p></details><details><summary>The Fury of the Gods · 9</summary><h2>Training and the attempted treasury escape</h2><p>At the snowy weapons court he speaks with Elvar about her mother&#x27;s suffering and the pain that survives Störr&#x27;s death. He gives her a light Oskutreð hand-axe and urges her to learn sword-and-axe fighting, rejecting the Fate-Maker identity. During the treasury pursuit and dock fight he protects her from attackers and receives a forehead cut he calls a scratch.</p></details><details><summary>The Fury of the Gods · 19</summary><h2>Gytha says he left her chambers at dawn and she has not seen him since</h2><p>Gytha says he left her chambers at dawn and she has not seen him since. He is absent from the council at that point; no destination, intimate act or independent disappearance is established.</p></details><details><summary>The Fury of the Gods · 23</summary><h2>He failed to appear for sparring the day after the Darl news</h2><p>He failed to appear for sparring the day after the Darl news. Elvar sent drengrs to search three days before this scene, and even Gytha does not know where he is. No explanation, departure destination or fate is supplied; Elvar remains worried.</p></details><details><summary>The Fury of the Gods · 33</summary><h2>He has been missing five days as Elvar searches and requests a Hundur tracker</h2><p>He has been missing five days as Elvar searches and requests a Hundur tracker. Before Ákveðin can begin, Hjalmar brings him onto the pier alive, bloodied, one eye swollen shut and lips badly damaged, wrists bound and a leather neck leash held by guards. Forced to his knees before Elvar, he is accused by Hjalmar of long deception and being Tainted. His response, capture history, injury side, actual ancestry and Elvar’s decision are not supplied before the ending.</p></details><details><summary>The Fury of the Gods · 35</summary><h2>The fleet leaves Snakavik</h2><p>He is taken aboard Wave-Jarl and remains roped and leashed to its mast under a sail enclosure, one eye swollen shut. Hjalmar alleges that his Hundur-thrall found linen from the earlier forehead cut and identified Hundur blood. He reports Grend resisted, killed two pursuers, fled onto Snaka’s back and caused three further losses before capture. These are Hjalmar’s account, not a shown reconstruction. Asked for an explanation, Grend only apologises and then is silent. Elvar orders an iron collar and binding words; the fitting is not yet narrated.</p></details><details><summary>The Fury of the Gods · 38</summary><h2>Following the Falinn to Wolfdales</h2><p>He now wears the iron collar ordered earlier, with a leather leash attached and wrists still roped, led by Silrið ashore at Wolfdales. His wounds are healing and he can open the previously swollen eye. He says Elvar knows he will not betray her; she says he already has and orders him to follow until they find a gaol. The actual earlier binding words/effects and independent confirmation of Hjalmar’s lineage story remain unshown.</p></details><details><summary>The Fury of the Gods · 40</summary><h2>Councils and secrets in Wolfdales</h2><p>In a cell under Wolfdales, collared and wrist-bound with leash to a wall ring, he hears Elvar’s anger about her authority. He explains his older oath to her mother and explicitly identifies Hundur blood: concealment kept him from Störr’s collar/control so he could protect Elvar. Her mother knew the secret. This adds his own testimony to Hjalmar’s allegation, without a visible transformation.</p></details><details><summary>The Fury of the Gods · 40</summary><h2>Councils and secrets in Wolfdales</h2><p>He recounts being born to an unnamed thrall in her maternal grandfather’s household, friendship with her similarly aged mother, and mutual rescue from outlaws when he was eleven or twelve. The girl kept his Hundur secret and her father freed him. He rose as a drengr, then chose to follow her to Snakavik after Störr married her. After Elvar’s birth and her mother’s mistreatment, he swore protective blood oath and shows the scar. Asked if he fathered Elvar, he explicitly says no, though he loves her as a daughter. Elvar frees his wrists and wall tether; his collar is not stated removed and no new office is conferred.</p></details><details><summary>The Fury of the Gods · 44</summary><h2>The new arrivals and Grend’s fate</h2><p>Silrið raises his unresolved case and reported demands for public punishment, while Elvar explicitly says she has not decided. He is not present in the exchange; no new sentence, collar removal, formal freedom or restored office follows from it.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>At the locked room his wounds are mostly healed but his face looks older and dark hair greyer</h2><p>At the locked room his wounds are mostly healed but his face looks older and dark hair greyer. Elvar unlocks/removes his collar and declares him free, pulls him upright and embraces him, saying she did it for him. This resolves the collar punishment into actual release and renewed affection, without appointing him guard again or changing the previously denied biological paternity.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>He stands mailed beside Elvar, axe at belt</h2><p>He stands mailed beside Elvar, axe at belt. On Frek’s accusation he moves to seek the accused, but Elvar holds his wrist and orders a wider search. This is voluntary protective action after freedom, not a new formal restoration of office or a completed capture.</p></details><details><summary>The Fury of the Gods · 58</summary><h2>Holding the gate walkway</h2><p>Beside Elvar on the gate walkway he uses his hand-axe to chop a climber’s shield apart, wound arm/face and send him falling. This protective fighting follows his freedom; it does not itself explicitly restore his former office or supply his final fate.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>Elvar Chainbreaker and the hillside stand</h2><p>He encourages Elvar before the doors close, then takes her left at Battle-Grim’s front, gives her water and joins the shield rhythm. When a spertus catches its sting in her shield he chops it down. His promise to see her afterward is reassurance, not proof of future survival or a new formal guard appointment.</p></details><details><summary>The Fury of the Gods · 63</summary><h2>He follows Elvar around the ash to Hrung</h2><p>He follows Elvar around the ash to Hrung. The spider falls before her axe lands; Grend prods it and declares it dead. He jokes that Hrung will be too numb to speak and asks whether they can keep one alive. Neither a cure nor a living captive is actually shown.</p></details><details><summary>The Fury of the Gods · 65</summary><h2>Losses and plans after the retreat</h2><p>He takes Elvar’s hand while she still discusses tactics, smiles and grows tearful with pride in her freeing the Tainted. She says his regard matters. He urges sleep and kisses her cheek in a father-like gesture, consistent with the protective bond rather than new biological paternity. He leaves with Gytha by the rear tunnel; his promised dragon killing remains future hope.</p></details><details><summary>The Fury of the Gods · 67</summary><h2>The attack on Elvar’s chamber</h2><p>He and Gytha burst through the rear door mailed, shields/weapons ready, while Thorguna is wounded and Elvar/Biórr fight on the tree stair. Elvar later hears him scream as she falls after the neck assault; no catch, rescue or completed revenge is shown.</p></details><details><summary>The Fury of the Gods · 68</summary><h2>Elvar’s fall and the rebellion in the hall</h2><p>Varg sees him high on the branch screaming at Elvar’s corpse below, while fighting continues behind him on the bedchamber platform. His exact next action or a rescue of her is not shown.</p></details><details><summary>The Fury of the Gods · 69</summary><h2>Biórr’s doubts amid the fighting</h2><p>He charges from the stair with axe/seax, knocks Skalk and the unnamed guide aside and attacks Rotta atop him, driving an axe into the god’s chest. Rotta’s transformation throws him against the ash trunk; he lies stunned and groaning, alive at that last description rather than confirmed dead. His recovery/next attack is unshown.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>Leif’s death and the tunnel escape</h2><p>Grend leads a delayed group including Uspa, Berak and Gytha, with Berserkir/drengrs carrying Hrung in sailcloth. Varg alerts Ulfrir, who shelters the party and takes Hrung’s cloth in his jaws to the tunnel entrance; they follow into the passage.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>The survivors’ camp and reunion</h2><p>He emerges beside Sighvat carrying Elvar, helps set Hrung upright and says Elvar would have wanted him saved. Tear-streaked, he helps Sighvat bind Elvar’s corpse in a cloak. Her hidden plan for Hrung remains undisclosed.</p></details><details><summary>The Fury of the Gods · 81</summary><h2>The charge against the gods</h2><p>The captains join the loose charge: Orlyg/Logur lead their warriors, Sighvat the Battle-Grim, and Grend/Gytha Elvar’s drengrs with Berserkir/Úlfhéðnar. This is a renewed allied assault, not its final outcome.</p></details><details><summary>The Fury of the Gods · 90</summary><h2>The last assault on Lik-Rifa</h2><p>He comes with the captains’ wedge around Hrung and later hears the living head inside the dead dragon. His remark asking to leave Hrung there is a question/joke, not a performed abandonment.</p></details><details><summary>Illustration · The Hunger of the Gods · 71</summary><p><a href="assets/60a169e02eb340.jpg">Open noncanonical illustration</a></p><p>Elvar advances through Störr&#x27;s hall beneath Uspa&#x27;s protective barrier.</p></details><details><summary>Illustration · The Shadow of the Gods · 53</summary><p><a href="assets/3ea9fdfca3920d.jpg">Open noncanonical illustration</a></p><p>Grend in his harbour-arrival equipment before entering Snakavik&#x27;s fortress.</p></details><details><summary>Illustration · The Fury of the Gods · 65</summary><p><a href="assets/2caf7ba6c8e550.jpg">Open noncanonical illustration</a></p><p>Grend telling Elvar he is proud of her.</p></details><details><summary>Illustration · The Fury of the Gods · 63</summary><p><a href="assets/386a293038e71c.jpg">Open noncanonical illustration</a></p><p>Hrung’s complaint as his eyes glaze with ice.</p></details><details><summary>Illustration · The Fury of the Gods · 54</summary><p><a href="assets/75647b2cc968fe.jpg">Open noncanonical illustration</a></p><p>Elvar’s embrace after freeing Grend.</p></details><details><summary>Illustration · The Fury of the Gods · 9</summary><p><a href="assets/3230a389ede6fb.jpg">Open noncanonical illustration</a></p><p>The axe gift at the weapons court, before the treasury alarm.</p></details><details><summary>Illustration · The Fury of the Gods · 77</summary><p><a href="assets/23e1563f8a5e7a.jpg">Open noncanonical illustration</a></p><p>The survivors’ silent memorial for Elvar Chainbreaker.</p></details><details><summary>Illustration · The Fury of the Gods · 75</summary><p><a href="assets/855fc6762a4e54.jpg">Open noncanonical illustration</a></p><p>Ulfrir carrying Hrung’s sailcloth and shielding the delayed party.</p></details></noscript>
