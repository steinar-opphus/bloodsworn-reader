      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 9</summary><h2>Introduction</h2><p>Agnar says Störr is famed for his Berserkir thrall-guard. He plans to take the captives to Snakavik for sale.</p></details><details><summary>The Shadow of the Gods · 21</summary><h2>The jarl tests and buys Berak</h2><p>Störr is tall and slim, with dark greying hair, a neat braided beard, a sharp nose and dark-blue wool clothing. He wears silver and a serpent-fang pendant. His oathsworn hird is housed in garrison longhouses, and collared Berserkirs with axes and iron bear-claw pendants surround him.</p></details><details><summary>The Shadow of the Gods · 21</summary><h2>The jarl tests and buys Berak</h2><p>He says he values Berserkirs and has Silrið obtain Berak’s blood for Hrung to taste. After Hrung identifies Berser’s blood, he offers twice what Agnar would receive elsewhere and orders Berak taken; the handover follows. He promises payment through Silrið.</p></details><details><summary>The Shadow of the Gods · 21</summary><h2>The jarl tests and buys Berak</h2><p>At the end of B01-C021, Hrung identifies Elvar, and she addresses Störr as her father. The relationship becomes explicit at this reading point.</p></details><details><summary>The Shadow of the Gods · 23</summary><h2>Authority, reconciliation and a marriage proposal</h2><p>Störr claims he spilled much blood to restore control after Elvar&#x27;s departure undermined his authority. Störr offers reconciliation and suggests giving Elvar her own drengrs and warband.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>Ilska names Störr of Snakavik with Helka and Orlyg as rulers gathering or absorbing lesser jarls. No new particular annexation or military campaign is shown; this is her political assessment to Lik-Rifa.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>As a new chief, Elvar recognises the burden of his position but refuses to excuse his cruelty. She remembers him beating her mother while Thorun restrained her and Grend attempted to intervene. Her mother stopped Grend, and Störr ordered him to stay and watch more violence. Elvar recalls the episode as a test intended to provoke a capital offence against his jarl; it is not a newly witnessed assault or the cause of her mother’s death.</p></details><details><summary>The Hunger of the Gods · 41</summary><h2>Sigrún&#x27;s reckoning with Guðvarr</h2><p>Sigrún places him on Helka’s western border and Orlyg on her eastern, arguing that either could threaten Helka while she moved against the other. She and Guðvarr speculate about a pact to isolate one enemy. No new campaign by Störr or confirmed pact is reported.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>Ilska says territory west of the Slågen comes under his sway and calls him a deep thinker among the three powers. Lik-Rifa intends to attack him after Orlyg and Helka. The descriptions are her political intelligence and the attack is a plan, without a new meeting or battle involving Störr.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Rowing and a merchant ship intercepted</h2><p>Elvar’s downriver route crosses his realm towards her birthplace. An unnamed merchant says he gathers his drengrs for war against Helka, suspects an alliance because Orlyg is bound for Darl and plans to strike first. She explicitly attributes the story to drengrs’ whispers to whores. This is reported intelligence, not a witnessed muster, confirmed motive, signed pact or launched attack.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Rowing and a merchant ship intercepted</h2><p>Elvar sees dragon-worshippers crossing his land openly, remembers the bodies in Snakavik’s cages and imagines his rage at their defiance. He does not appear or react in this scene. His daughter’s ship ends within distant sight of Snakavik, before a meeting with him.</p></details><details><summary>The Hunger of the Gods · 65</summary><h2>Entry into Störr&#x27;s muster camp</h2><p>His fortress is preparing weapons and mail on a large scale and requires recruits to meet him. Elvar arrives under muster credentials, accompanied into the hall by Grend, Sighvat, Uspa and Ulfrir, but no response from him is yet shown.</p></details><details><summary>The Hunger of the Gods · 67</summary><h2>Elvar returns to her father&#x27;s hall</h2><p>He sits beside his named sons Thorun and Broðir, with Silrið nearby, talking to Hjalmar Peacemaker. He mistakes the hooded Battle-Grim visitors for Agnar and insults his daughter; Elvar then reveals herself. No response to that revelation is shown yet.</p></details><details><summary>The Hunger of the Gods · 69</summary><h2>Bargaining for the Berserkir</h2><p>He reports Helka and Orlyg&#x27;s alliance and plans a first strike. He doubts Elvar&#x27;s dragon account, then considers her treasure. He punishes Berak using Verkir and stops it with Nóg, refuses to transfer collar control, threatens the Wave-Jarl and orders his Berserkir against Elvar.</p></details><details><summary>The Hunger of the Gods · 71</summary><h2>The wolf-god wrecks Störr&#x27;s hall</h2><p>He activates the Berserkir&#x27;s collars against Elvar. Skuld seizes and disarms him and, at Elvar&#x27;s assent, throws him to Ulfrir, who kills him. Thorun then acquires and exercises collar control.</p></details><details><summary>Illustration · The Hunger of the Gods · 71</summary><p><a href="assets/ffd5920d73661e.jpg">Open noncanonical illustration</a></p><p>Skuld hovers with Störr held captive before Ulfrir&#x27;s jaws.</p></details><details><summary>Illustration · The Shadow of the Gods · 53</summary><p><a href="assets/2de8661fb6ad4f.jpg">Open noncanonical illustration</a></p><p>Störr in his hall at Snakavik.</p></details></noscript>
