      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 21</summary><h2>Blood tested in Snakavik</h2><p>The Boneback Mountains begin at their western extremity at Snakavik. The narration describes earth settling around Snaka’s fallen body to form a range across Vigrið; his skull, spine and ribs remain beneath earth and rock.</p></details><details><summary>The Shadow of the Gods · 34</summary><h2>Cheese, companionship and a troll tale</h2><p>In the chapter 34 approach they fill Varg&#x27;s horizon, with snow-capped peaks above dark-green slopes thickly forested with pine. The foothills contain wooded hills, shadowed valleys, sunlit meadows and winding rivers in newly risen sunlight.</p></details><details><summary>The Hunger of the Gods · 11</summary><h2>Learning to control the wolf</h2><p>Three days south of Grimholt the Bloodsworn remain in the high mountains. Their sheltered pinewood camp lies below a grassy training plateau beside a steep drop to a white-foaming river.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>After days of hard riding, Orka’s companions remain in the foothills among ravines, pinewoods and snowmelt streams at sunset. They follow Myrk’s earlier camp traces north-west towards Lake Horndal, rather than having reached the distant rendezvous Myrk later describes.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>Lik-Rifa’s company follows Vigrið’s eastern crags south towards their junction with the mountains’ eastern tip. The Icebound Sea lies beyond the crags and snow lies ahead. This actual route follows the earlier eastward march; it does not establish the westward rendezvous Myrk described or arrival at a hall.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>Orka&#x27;s search in Starl</h2><p>Orka’s ravine opens onto a plain with the white-capped mountains to the east and Lake Horndal to the north-west. Starl occupies the lake’s southern shore. She reaches the town, but her intended lake crossing is not yet booked or undertaken.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>Nastrandir revealed in the snow</h2><p>After the blizzard Biórr sees their steep cliffs and snow-capped peaks. A Galdur-cleared route leads the struggling column through snow towards the serpent-shaped promontory, coastal cliffs and the exposed entrance of Nastrandir. The described wave and mountain scale is comparative rather than a measured map.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>Elvar spots a small line of riders on a track between Lake Horndal’s edge and the tree-shrouded mountain slopes. She identifies Orka’s party and Ulfrir agrees. The riders stop, but neither a reached destination nor their exact intentions is shown.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>Sæunn’s two-day pursuit goes north beside Horndal and east around the northern wooded slopes. Dense pine and needle-covered ground open into green meadows with black boulders, beyond which lie river-cut plains, dark chasms, crags, woods and isolated farms. The narration contrasts the more vaesen-dominated, sparsely settled north with the populous human south.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>Tracks of several vaesen kinds head east, with frost-spider hairs, ice-web and bark traces through the canopy. Halja assesses the spiders as gone from this patch. A later view north from the route shows a stockaded farm with smoke, horns and screams; the party has not yet reached it.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Rowing and a merchant ship intercepted</h2><p>From Elvar’s downstream Hvítá route, the river’s westward turn brings the white-capped Bonebacks closer to view. Grey-green bone breaks through the soil and trees covering the skeleton. This is the landscape of the approach to Snakavik, without a new mountain crossing by the company.</p></details><details><summary>The Fury of the Gods · 11</summary><h2>An unseen enemy follows the host</h2><p>Rotta&#x27;s column has travelled farther south and then west following the curl of the range towards Darl. At a dawn river halt the Bonebacks lie to the north, pine-covered slopes below pink-and-gold snowy peaks. Snow is thinner underfoot, but the earth remains frozen.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>The roof ward opens</h2><p>Its snowy peaks are bright in first dawn as the party emerges from the hill; no journey into the mountains or new surveyed geography is shown.</p></details><details><summary>The Fury of the Gods · 74</summary><h2>Snaka rises and Wolfdales collapses</h2><p>The mountains move under avalanches and eruptions as Snaka rises; the line heaves and sheds snow/rock/earth while tremors spread across Vigrið. Exact geological boundaries and casualties are not measured.</p></details><details><summary>Illustration · The Shadow of the Gods · 53</summary><p><a href="assets/fe08d0e1f533e4.jpg">Open noncanonical illustration</a></p><p>The Boneback Mountains seen from the wooded foothills.</p></details><details><summary>Illustration · The Fury of the Gods · 74</summary><p><a href="assets/9aca3371fbb0bb.jpg">Open noncanonical illustration</a></p><p>Snaka rising from the fjord and shedding the mountain’s rock.</p></details></noscript>
