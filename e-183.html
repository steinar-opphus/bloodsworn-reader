      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 39</summary><h2>A sister&#x27;s hair and an offer of help</h2><p>Yrsa recounts that Lik-Rifa enchanted the chain to bind Ulfrir before her followers killed him, and that Snaka&#x27;s fall scattered its fragments. Skalk says the recovered metal was used to make thrall-collars, and that fortresses grew where fragments were found. These origins remain attributed historical accounts.</p></details><details><summary>The Shadow of the Gods · 48</summary><h2>The guardian of Oskutreð</h2><p>Near the giant wolf skeleton Grend wonders whether a broken iron fragment is a link from Ulfrir’s chain. The identification remains tentative.</p></details><details><summary>The Hunger of the Gods · 6</summary><h2>The swarm in the depths</h2><p>Elvar now treats the links around Ulfrir’s skeleton as the Galdur-chain and proposes forging a new collar from them to control the resurrected wolf-god. This is her plan, following Grend’s earlier tentative identification of a fragment.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>Secrets in the Galdur tower</h2><p>A large black, age-pitted link stands half-embedded in the floor of Skalk’s workroom beside a restraint table. Skalk identifies it as a shard of Ulfrir’s chain and says a shaving is forged into every collar used on the Tainted. The observed object and his claimed identification/recipe are distinct; no universal manufacturing demonstration is shown.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>Skalk claims to possess a link able to enthral any creature of flesh and blood. He proposes using it to bind a resurrected Orna in a collar so Helka can oppose Lik-Rifa. The universal power is his assertion, and the god’s collar is still to be forged; no new test or binding takes place here.</p></details><details><summary>The Fury of the Gods · 19</summary><h2>Hidden followers and the missing Grend</h2><p>A giant half-buried link is observed behind Hrung and the fire pit in Snakavik’s tower; Ulfrir growls at it. Elvar recounts that Lik-Rifa forged the original chain, fragments fell with Snaka and Galdurmen learned at their sites, shaving the metal for collars. Her every-tower claim stays attributed to the skaldic history, not a surveyed fact.</p></details></noscript>
