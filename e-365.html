      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 30</summary><h2>The casters and the mother serpent</h2><p>An unnamed black-scaled juvenile, about an ash spear long among the mother’s young, stays apart from the attack on the captive caster and coils at Vol’s feet. After the mother leaves it climbs her leg and waist to her forearm; she strokes its head. This is an observed attachment in the moment, without a personal name, established permanence or formal magical bond.</p></details><details><summary>The Fury of the Gods · 32</summary><h2>Still coiled around Vol’s forearm, it flicks its tongue towards blood on Orka’s knuckles</h2><p>Still coiled around Vol’s forearm, it flicks its tongue towards blood on Orka’s knuckles. Vol says Not for you and it closes its mouth. No personal name, formal bond or independent attack follows.</p></details><details><summary>The Fury of the Gods · 37</summary><h2>It is draped across Vol’s shoulders during Varg’s oath ceremony while she handles cup and seax</h2><p>It is draped across Vol’s shoulders during Varg’s oath ceremony while she handles cup and seax. No personal name or demonstrated new ability is given.</p></details><details><summary>The Fury of the Gods · 39</summary><h2>It lies across Vol’s shoulders while she strokes its head and questions Grok</h2><p>It lies across Vol’s shoulders while she strokes its head and questions Grok. No name or new power is established.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>Arrival at the wolf-god’s hall</h2><p>Vol calls the changed appearance a deception: the serpent coils in her fist as Seiðr thread wraps its tail like a handle, and Varg sees it resemble a whip. It sleeps buckled to her belt as thick black coils. This is the same living companion in a whip-like guise, not a newly registered nonliving whip, proven material mechanism or performed attack.</p></details><details><summary>The Fury of the Gods · 52</summary><h2>The choice to hide the beast</h2><p>The whip guise is now used in combat: Vol’s words make its serpent end rear and bare fangs, then it bites into Silrið’s cheek and tears away flesh when withdrawn. No venom effect, full-body reversion, second creature or new species is established.</p></details><details><summary>The Fury of the Gods · 90</summary><h2>Vol uses the serpent whip in the assault as it cracks/rips at enemies</h2><p>Vol uses the serpent whip in the assault as it cracks/rips at enemies. This is further observed combat use, without a new venom, transformation or healing rule.</p></details><details><summary>The Fury of the Gods · 92</summary><h2>Vol names the serpent whip at her hip Gand and says the steading has a stream for him to swim in</h2><p>Vol names the serpent whip at her hip Gand and says the steading has a stream for him to swim in. This names the existing companion, not a new serpent or a new power.</p></details><details><summary>Illustration · The Fury of the Gods · 42</summary><p><a href="assets/2cf641fa68691a.jpg">Open noncanonical illustration</a></p><p>The sleeping serpent’s whip-like disguise.</p></details><details><summary>Illustration · The Fury of the Gods · 52</summary><p><a href="assets/463046cd0df0e8.jpg">Open noncanonical illustration</a></p><p>Noncanonical detail of the serpent end rearing before the strike.</p></details></noscript>
