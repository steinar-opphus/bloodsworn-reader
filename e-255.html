      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 29</summary><h2>Introduction</h2><p>Rog is The Dead Drengr’s barkeeper, named while serving Brimil. He is grey-haired and balding, and limps with an ankle dressing in chapter 29. Varg knocks him against a table and leaves him unmoving, with no confirmed death.</p></details><details><summary>The Hunger of the Gods · 46</summary><h2>A secret meeting before dawn</h2><p>In chapter 46 he is directly alive behind the bar, serving Hakon’s meeting. He has thinning grey hair, a straggly beard, a dirty linen bandage around his head and a limp; the head dressing’s cause is not given. He serves Guðvarr ale on a tab and cooks ham and eggs over the hearth griddle, with oatcakes, skyr and honey among the food.</p></details><details><summary>The Hunger of the Gods · 46</summary><h2>A secret meeting before dawn</h2><p>He admits the hooded Skapti and Hrolf and calls them more friends of Hakon. The label is his, not a full explanation of their arrangements or how they left the tower.</p></details><details><summary>Illustration · The Hunger of the Gods · 46</summary><p><a href="assets/43c1b5deabb43f.jpg">Open noncanonical illustration</a></p><p>Rog serving ale behind the bar at The Dead Drengr.</p></details></noscript>
