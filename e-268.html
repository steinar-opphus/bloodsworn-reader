      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 36</summary><h2>Orka&#x27;s search in Starl</h2><p>The Hvítá winds south from Lake Horndal to Snakavik, which stands at its mouth. Ships carry cargo along it as Orka looks towards Starl from the plain. No river voyage by her party is shown in this chapter.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The laden ship reaches Starl</h2><p>Elvar would prefer to sail directly down the river, but the Battle-Grim’s nearly exhausted food and drink require a stop at Starl. The Wave-Jarl docks there; the onward river passage is not completed in this chapter.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>After leaving Starl’s pier, Sighvat steers the Wave-Jarl towards the river mouth on Lake Horndal’s southern edge. Elvar names the Hvítá and then Snakavik as their onward route. Departure from the supply stop is now actual, but entry into or completion of the river passage is not narrated.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Rowing and a merchant ship intercepted</h2><p>The Wave-Jarl’s downstream travel from Starl uses twenty-four oars in rotating shifts. Below Horndal the river widens through plains, dark woods, meadows and settlements in Störr’s realm, then bends west towards the Bonebacks and Snakavik. Grey-green bone shows through the mountain covering. An upriver merchant knarr fights wind and current before Elvar intercepts it for news.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Rowing and a merchant ship intercepted</h2><p>A wooden bridge spans the river ahead of a sweeping bend. Thirty or forty dragon-worshippers cross from the western bank towards the east, with oxen, stores and children. The Wave-Jarl passes beneath them without attacking; beyond the bend Snaka’s skull and Snakavik become visible. No precise distance or destination for the travellers is supplied.</p></details></noscript>
