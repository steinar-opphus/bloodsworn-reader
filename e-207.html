      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 4</summary><h2>The descent beneath Oskutreð</h2><p>A black-bound book rests on a pedestal within an arch and circle of red glowing runes in Vergelmir. Its identity is unknown; it is not equated with any previously named book. Skuld says Lik-Rifa protected it with runes and guards without knowing what it is.</p></details><details><summary>The Hunger of the Gods · 4</summary><h2>The descent beneath Oskutreð</h2><p>Huld crosses the rune boundary, triggering a blast that extinguishes the torches and knocks the company down. A grey slime-covered attacker emerges after Sighvat relights a torch.</p></details><details><summary>The Hunger of the Gods · 6</summary><h2>The swarm in the depths</h2><p>Uspa reads the book and identifies it as a Galdrabok written by Lik-Rifa. She describes its spells as powerful and terrifying and confirms that it speaks of resurrection. This is Uspa’s identification; the book receives no distinct proper title here.</p></details><details><summary>The Hunger of the Gods · 6</summary><h2>The swarm in the depths</h2><p>Uspa claims it will enable her to forge a collar powerful enough to bind a god and restore flesh, blood and life to Ulfrir’s bones. Elvar proposes the undertaking, but no new collar is forged and no god is resurrected within this chapter.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>A collar and the wolf-god&#x27;s return</h2><p>Uspa consults Lik-Rifa’s Galdrabok while carving the eight-spoked resurrection design. The ritual subsequently restores Ulfrir’s body and life, demonstrating this undertaking beyond her earlier proposal.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>A collar and the wolf-god&#x27;s return</h2><p>Later in the ritual Uspa takes a red-skinned book from her belt; Elvar thinks it is made from Skuld’s sister’s skin. The relation of that description to the earlier black binding, and to the separately reported Raudskinna, is left unresolved. No identity merge or new proper title is made from colour and skin descriptions alone.</p></details><details><summary>The Hunger of the Gods · 9</summary><h2>Old companions at the campfire</h2><p>Lik-Rifa attributes Ulfrir’s return to her own book, saying it should have been protected by rune-spells and her children. She claims to have felt her spell used and heard Ulfrir’s breath and howl. This supports her claimed connection to the resurrection text without resolving its differing binding descriptions or equating it with Rotta’s Raudskinna.</p></details><details><summary>Illustration · The Hunger of the Gods · 4</summary><p><a href="assets/68ccbe1caadda1.jpg">Open noncanonical illustration</a></p><p>The party discovers the warded, black-bound book beneath Oskutreð.</p></details></noscript>
