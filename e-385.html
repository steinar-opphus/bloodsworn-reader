      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 38</summary><h2>Following the Falinn to Wolfdales</h2><p>Elvar’s force lands at Wolfdales, with Berak, Gytha’s drengrs, the Battle-Grim and Ulfrir’s followers among those approaching the den. Other ships arrive at the ancient piers.</p></details><details><summary>The Fury of the Gods · 44</summary><h2>The new arrivals and Grend’s fate</h2><p>At Wolfdales the coalition includes Elvar’s earlier force, Bloodsworn, Orlyg’s followers and now publicly welcomed Estrid/Skalk with drengrs and collared Tainted. Training and breakfast cooking occupy the hall, while Silrið reports doubts over Grend. Elvar establishes a rule against internal feuds or fighting across countries/species at least until Lik-Rifa dies. Glornir postpones his feud and the newcomers verbally agree, without a new binding oath or guarantee of future obedience. A raven reports the dragon has reached Jarnvidr.</p></details><details><summary>The Fury of the Gods · 48</summary><h2>Return from the sortie</h2><p>The raiders return to Wolfdales, wounded receive care and Elvar celebrates a limited first strike with food. Logur’s arriving oathsworn are welcomed on Glornir’s endorsement. Varg’s abolition idea remains a private group conversation, while Kló reports fresh enemy Tainted reinforcements.</p></details><details><summary>The Fury of the Gods · 49</summary><h2>Building defences at the bridge gate</h2><p>Elvar sends further groups through the tunnels with orders to burn the approaching host’s supply wagons. These are renewed raids/orders, not confirmed burned stores or a completed second victory. At Wolfdales a combined working prepares the bridge defences against the gods.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>Salvage and a choice about freedom</h2><p>Elvar requires allied jarls to free their Tainted or leave, then physically releases her own Berserkir and receives compliance from Orlyg, the other chiefs and Estrid. Voluntary service with provision is offered; guards later affirm freely given oaths. The Bloodsworn reveal their Tainted nature/cover collars and pledge loyalty. This is a concrete coalition reform, not a demonstrated universal paid-labour law for all people.</p></details><details><summary>The Fury of the Gods · 59</summary><h2>The defenders withdraw from river works in joining shield walls, some archers covering the movement</h2><p>The defenders withdraw from river works in joining shield walls, some archers covering the movement. At the hillside entrance Elvar’s host stands across the road; individual corpses along the river do not supply the host’s final losses or victory.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>Wounded pass inside before the stone doors close behind the remaining host at Elvar’s signal</h2><p>Wounded pass inside before the stone doors close behind the remaining host at Elvar’s signal. Battle-Grim holds centre, Bloodsworn right, Orlyg/Dagrun left, archers behind and controlled Berserkir/Úlfhéðnar in readiness. Elvar stands in front as the host hails her Chainbreaker; volleys and wind resist the spertus before shield walls clash.</p></details><details><summary>The Fury of the Gods · 61</summary><h2>The shield line under pressure</h2><p>The line holds through close combat, exhausted front fighters rotating with third-rank replacements while Varg refuses relief. Enemy horns produce a gap, water and brief cheers; then a new frost-spider/troll wave approaches. No final victory, total losses or hall outcome is supplied.</p></details><details><summary>The Fury of the Gods · 62</summary><h2>The fighting withdrawal</h2><p>Horn signals coordinate a backward retreat and a Berserkir/Úlfhéðnar countercharge through the parted line. Hyrndur press the fleeing host; an unnamed casting forms a flame-net across the road until a troll tears it down. The companions run for the doors, but safe entry and the counterchargers’ final fate remain unshown.</p></details><details><summary>The Fury of the Gods · 63</summary><h2>The shield line is in full retreat while Tainted and guardians cover it</h2><p>The shield line is in full retreat while Tainted and guardians cover it. After three horn blasts and a delay the doors open, most of the host enters, and Ulfrir’s howl closes them after the guardians/Skuld and a troll. The troll kills an unnamed drengr before Ulfrir destroys it; insect/spider fighting persists within, with no exact survivors or completely cleared hall established.</p></details><details><summary>The Fury of the Gods · 68</summary><h2>They face actual internal rebels at the doors and lose Elvar, whose corpse falls into the hall</h2><p>They face actual internal rebels at the doors and lose Elvar, whose corpse falls into the hall. The Bloodsworn intervene, killing Hjalmar/Sturla; other rebel survivors gather toward Estrid. Rotta then opens the doors for night-hags, leaving host leadership/survivors and the wider battle unresolved.</p></details><details><summary>The Fury of the Gods · 71</summary><h2>Guðvarr finds Estrid</h2><p>The hall fight includes mounted archers shooting at the dragon, unnamed Tainted breaking an enemy wall and unnamed frost casters unsuccessfully opposing the Froa fire. Gelta’s binding fails and the gods’ fight continues. These observations do not identify every rider/caster or settle the host’s final fate.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>Leif’s death and the tunnel escape</h2><p>The group is directly present in Ulfrir’s gathering evacuation: Skuld above, both stone wolves alongside, Úlfhéðnar beneath, Battle-Grim/drengrs with Sighvat, Orlyg’s survivors and Sulich’s mounted remnants. The gate is blocked and they turn to the tunnels. This does not establish repaired guardians or a complete survivor tally.</p></details><details><summary>The Fury of the Gods · 76</summary><h2>Glornir asks Vesli to seek survivors of Elvar’s host so the groups can regroup after Wolfdales</h2><p>Glornir asks Vesli to seek survivors of Elvar’s host so the groups can regroup after Wolfdales. No completed search or new discovery is narrated.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>The survivors’ camp and reunion</h2><p>The battered survivors gather in a woodland camp, perhaps five hundred or fewer including Ulfrir’s Úlfhéðnar. They mourn Elvar, ration food, hunt and discuss striking the gods with better information/allies. Glornir’s separate Bloodsworn then rejoin, without an exact new total.</p></details><details><summary>Illustration · The Fury of the Gods · 62</summary><p><a href="assets/8d192bed87ec4f.jpg">Open noncanonical illustration</a></p><p>The countercharge covering the retreat.</p></details><details><summary>Illustration · The Fury of the Gods · 59</summary><p><a href="assets/26216e2f177e2d.jpg">Open noncanonical illustration</a></p><p>The shield wall before the hillside entrance.</p></details><details><summary>Illustration · The Fury of the Gods · 62</summary><p><a href="assets/784e4cd427e9d8.jpg">Open noncanonical illustration</a></p><p>The fire-net before it is torn down.</p></details><details><summary>Illustration · The Fury of the Gods · 61</summary><p><a href="assets/ebf68832f37548.jpg">Open noncanonical illustration</a></p><p>The frost-spiders advancing after the disengagement.</p></details><details><summary>Illustration · The Fury of the Gods · 60</summary><p><a href="assets/ce8019951659df.jpg">Open noncanonical illustration</a></p><p>The wind dispersing poison along the shield line.</p></details></noscript>
