      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 41</summary><h2>Introduction</h2><p>Halja and Vali Horse-Breath are sister and brother in Svik’s group.</p></details><details><summary>The Hunger of the Gods · 15</summary><h2>The search through Rotta&#x27;s chamber</h2><p>In the escort to Rotta’s chamber she is young, with tightly braided red-gold hair and mail. At the site she stands silently by a barrow; the person she mourns is not identified, and is not inferred from her kinship.</p></details><details><summary>The Hunger of the Gods · 18</summary><h2>Training and an encounter in the rain</h2><p>She tells Lif that the person she mourns at the barrow is her brother. After he speaks of losing a loved one, Orka thinks Halja regards him differently. This clarifies the relationship disclosed at chapter 15’s grave scene without assigning a unique named corpse beyond the source.</p></details><details><summary>The Hunger of the Gods · 18</summary><h2>Training and an encounter in the rain</h2><p>At the riders’ arrival she identifies the grey raven-wing shields as Raven-Feeders. The woman leading them remains unnamed in this encounter.</p></details><details><summary>The Hunger of the Gods · 20</summary><h2>Myrk confronted in the glade</h2><p>At the end of the mine battle she stands over a Raven-Feeder and kills him with sword blows to his head.</p></details><details><summary>The Hunger of the Gods · 22</summary><h2>Wounds tended and seaxes compared</h2><p>She helps Edel and Revna restrain Orka’s beating of Myrk, then volunteers to accompany Orka with Gunnar and Revna. She says her brother died here, killed by a troll fighting for the dragon-born, and wants vengeance on those who set the events in motion. This testimony does not supply her brother’s name or the father’s personal identity. Orka accepts the volunteers after warning of the danger.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>She proposes the information trade and taunts Myrk’s father, provoking a red-eyed struggle. She argues that naming the killer is not betrayal because songs will soon tell the deed and Myrk would lose to him. Those are her predictions, not existing songs or a completed duel.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>She gives Lif a wool blanket after his fall and warns him to dry his mail. She hears Myrk’s account of control and blended powers. At the close she names Varg as the father’s killer, prompting Myrk’s threat.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>Orka&#x27;s search in Starl</h2><p>She scouts tracks leading into Starl rather than around the lake and reports them to Orka. She accompanies the town errands, gathers conflicting talk of a northern winged beast or dragon, and suggests buying from several traders to save money. Orka favours speed.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>Orka&#x27;s search in Starl</h2><p>She objects to Orka’s intended Tainted-thrall purchase and follows the subsequent acquisition of Sæunn. She tells Sæunn to put on her new clothes and clarifies that she meant finding somewhere to change. No bloodline, magical compulsion or freedom for Sæunn is demonstrated.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>Orka&#x27;s search in Starl</h2><p>At Orka’s request she recognises the approaching drakkar’s shields as Battle-Grim. She does not name the ship or identify any passenger before the chapter ends.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>Edel reports her alive with Orka and seeking revenge for her brother. Varg recalls Halja’s already known brother Vali Horse-Breath being killed by the troll at Rotta’s chamber. This is news and recollection within the Liga company, not a new event involving Halja at Starl.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The laden ship reaches Starl</h2><p>She walks to the Wave-Jarl with Orka and an unnamed collared companion. She is in mail with a sword at her hip, red hair and a broad flat nose; the comparison to stopping fists does not establish a specific past injury. She asks for Agnar and learns from Elvar that he is dead and she is now chief, then identifies herself as Bloodsworn.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The laden ship reaches Starl</h2><p>She says she has never heard of Elvar after Sighvat introduces her titles. She joins Orka’s demand for Uspa and exchanges threats with Sighvat. At his Skullsplitter joke she briefly glances towards Orka, without publicly identifying her by that title. She and Uspa recognise one another and smile; she invites Uspa to step over and come with them, but no departure is shown.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>She helps persuade Elvar that a conversation about the dragon-born prisoner may benefit both parties, and boards under the truce. She agrees to openness, argues that public dragon talk makes secrecy impractical and trades joking challenges with Sighvat. She tells Uspa she seeks vengeance for Vali; Uspa squeezes her hand and remembers him kindly.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>She describes the buried chamber and admits uncertainty about how it became underground. Ulfrir identifies Rotta’s punishment site and supplies his own account of chaining him. Halja tentatively identifies copied Galdrabok pages as Raudskinna material and recounts Skalk’s theft of writings, a suspected talon and Vol. She tells Uspa Glornir is pursuing Skalk and only guesses he has caught up; she has not reported Jaromir’s involvement.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>After Elvar challenges Myrk’s westward directions and Ulfrir suggests Nastrandir, she proposes that the eastern hall might have survived like Rotta’s buried chamber. This remains a hypothesis, not a visit or known route.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>She stitches a torn tunic seam and watches Lif’s mournful song with tears in her eyes; the emotion is not evidence of romance. During the apparent raid she stands beside Orka with shield and spear and fights several attackers. After the ruse is revealed she apologises to Lif for their lack of opportunity to warn him.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>Before the dawn departure Sighvat makes her a sexual invitation. She mocks his bellies and prospective old age, making both companies and Sighvat himself laugh. An unnamed young rider glares at Sighvat. The exchange is banter, without an actual liaison, established jealousy or identification of the rider. Orka’s group then follows Sæunn out of Starl.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>The narration explicitly gives her Orna’s eagle blood and describes her as the group’s keenest sighted. Her eyes shift to tawny-gold flecks as she looks for frost-spiders; she reports loose webs and concludes the spiders have gone. She rides ahead keeping Sæunn in eagle-touched sight.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>Behind her Lif expresses interest. Revna claims she likes his singing and offers to help him, while Gunnar and Revna trade competing claims about her partners and a killing in Liga, with Revna admitting uncertainty. These are their statements, not a confirmed sexual history, killing motive or reply from Halja to Lif.</p></details><details><summary>The Hunger of the Gods · 55</summary><h2>Tracking the false trail</h2><p>At the meadow she and Sæunn stop overlooking a stockaded farm amid horn calls, smoke and screams. She asks Orka to investigate, and Orka agrees. The cause and any intervention remain unshown.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>She interrupts Orka’s angry confrontation with Lif by touching her shoulder and calling her chief. When asked her choice, she recalls skraeling at Rotta’s chamber and says she will kill them for Vali’s sake. She joins the front-gate team, red hair visible beneath her iron helm as she strikes down a skraeling with a ruined face.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>She helps signal flank attacks in the longhouse, then catches Lif as he drops to one knee. She remains close while Vesli binds his wounded cheek and cleans her weapons on the steps. In response to Revna’s prompting she says Lif still breathes and his enemies lie dead. Her approval is explicit, but she makes no romantic declaration.</p></details><details><summary>The Hunger of the Gods · 64</summary><h2>The hidden doors into Nastrandir</h2><p>She proposes Lik-Rifa&#x27;s Seiðr as the cause of Spert&#x27;s door knowledge, estimates recent troll occupation from dung and shields Lif when the throne&#x27;s serpents move. The magical cause remains her explanation, not independent proof.</p></details><details><summary>The Hunger of the Gods · 72</summary><h2>The army gathers below Svelgarth</h2><p>Her distant sight confirms children with the wagons, without individually recognising Breca. She explicitly says the companions choose to help Orka see the attempt through.</p></details><details><summary>The Hunger of the Gods · 74</summary><h2>The gate falls and the children flee</h2><p>She and Lif create the false Svelgarth counterattack with Spert. Orka thinks the shouted claim is Halja&#x27;s voice; the guards are drawn towards the flames.</p></details><details><summary>The Hunger of the Gods · 78</summary><h2>Escape through the river valley</h2><p>She proposes splitting up to confuse pursuit and leaves the river route with Lif; reunion at the lake has not yet been shown.</p></details><details><summary>The Fury of the Gods · 15</summary><h2>The attack in the snowy valley</h2><p>Mail-clad and helmeted, she stands behind Breca with Lif, Gunnar and Sæunn as he reaches Orka and urges her to come with them. Their actual departure remains beyond this chapter’s ending.</p></details><details><summary>The Fury of the Gods · 17</summary><h2>Escape on Orlyg’s longship</h2><p>She fights Raven-Feeders with Lif guarding her flank, then persuades Gunnar to postpone vengeance and leave. She helps save Dagrun, boards the second longship and gathers around Orka and Breca after the escape. She argues that nowhere in Vigrið is safe now the dragon is free; this remains her judgment.</p></details><details><summary>The Fury of the Gods · 26</summary><h2>She rows beside Gunnar and Sæunn, then shares ale at the changeover</h2><p>She rows beside Gunnar and Sæunn, then shares ale at the changeover. Watching the sky, her eyes flicker gold and she reports two unnaturally large black birds. She then sees sails to the south and thinks one is Sea-Wolf; Orka cannot yet confirm it. The eye colour and reported sight do not establish a named lineage or the birds’ identities.</p></details><details><summary>The Fury of the Gods · 28</summary><h2>She explicitly lets her eagle sharpen her sight during the approach</h2><p>She explicitly lets her eagle sharpen her sight during the approach. Calling Orka chief, she accepts the attack orders, casts a spear while passing Sea-Wolf and joins the rescue on the knarr. Her shield intercepts three arrows aimed at Orka, and she finishes an enemy Breca strikes. She greets Sulich after Gunnar stops his mistaken attack on Orka.</p></details><details><summary>The Fury of the Gods · 29</summary><h2>Her intervention with Gunnar helps open the counterboarding attack</h2><p>Her intervention with Gunnar helps open the counterboarding attack. She then fights beside Orka on Sea-Wolf, black shield in hand, and Varg recognises the returned pair as the rescuers reach Einar and Svik.</p></details><details><summary>The Fury of the Gods · 32</summary><h2>Debts, kinship and the voyage onward</h2><p>She helps clean recovered armour, tells Orka that Revna and the escort chose their risks freely, and endorses Lif’s growing shieldcraft. His blush follows her praise without establishing a new romance.</p></details><details><summary>The Fury of the Gods · 58</summary><h2>Her shield knocks the skraeling Orka wounds off the walkway, where reserve spears meet it</h2><p>Her shield knocks the skraeling Orka wounds off the walkway, where reserve spears meet it. No new injury or final withdrawal route for Halja is supplied.</p></details><details><summary>The Fury of the Gods · 70</summary><h2>The gods collide and the tree burns</h2><p>She follows through Orka’s gap with Gunnar and the other companions, fighting the Raven-Feeders back to the trunk. No separate new wound or named kill is stated.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>She and Gunnar aid the wounded Thorguna near Elvar’s room and fight with her</h2><p>She and Gunnar aid the wounded Thorguna near Elvar’s room and fight with her. Looking down with eagle-eyes she reports the Froa dead and the hall/tree burning, the descending path blocked. She then spots the fleets with gold-flecked eyes and urges the others to look, not claiming only gifted eyes can see them. Her thrown spear hits the braced skraeling threatening the charging Glornir.</p></details><details><summary>The Fury of the Gods · 74</summary><h2>At the cliff edge above Falinn she grins and says wolves behind, a cliff ahead</h2><p>At the cliff edge above Falinn she grins and says wolves behind, a cliff ahead. Glornir orders the jump; her individual landing is not shown.</p></details><details><summary>The Fury of the Gods · 76</summary><h2>She survives with the treeline group and predicts snow under the sinking sun/heavy cloud</h2><p>She survives with the treeline group and predicts snow under the sinking sun/heavy cloud. A snowflake later reaches Orka, confirming its onset.</p></details><details><summary>The Fury of the Gods · 79</summary><h2>A night of repairs and choices</h2><p>Working a notch from her sword, she rejects Lif because men are not for her, while affirming his warrior’s heart, respect and lasting friendship. She would welcome him as a Bloodsworn brother if he chose; no oath is performed. Her suggestion that Sæunn wants him is her reading of Sæunn’s looks, not a confirmed liaison.</p></details><details><summary>The Fury of the Gods · 83</summary><h2>Sæunn stays with Breca at Orka’s right, Gunnar/Halja to her left as they advance through the battle</h2><p>Sæunn stays with Breca at Orka’s right, Gunnar/Halja to her left as they advance through the battle. No separate new wound/final fate is given for these companions in this passage.</p></details><details><summary>The Fury of the Gods · 86</summary><h2>Gunnar, Halja and Sæunn strike the Raven-Feeders behind Drekr as Orka duels him</h2><p>Gunnar, Halja and Sæunn strike the Raven-Feeders behind Drekr as Orka duels him. No separate new wound or final personal outcome is supplied.</p></details><details><summary>Illustration · The Fury of the Gods · 72</summary><p><a href="assets/146eb07fa5bcf1.jpg">Open noncanonical illustration</a></p><p>The fleets seen from the crown of Wolfdales at dawn.</p></details><details><summary>Illustration · The Hunger of the Gods · 20</summary><p><a href="assets/211b1909138d78.jpg">Open noncanonical illustration</a></p><p>A composed portrait of Halja Flat-Nose.</p></details></noscript>
