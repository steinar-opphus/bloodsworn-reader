      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 26</summary><h2>Introduction</h2><p>Yrsa is the female royal guard travelling with Skalk. She is described as proud-faced and thin-lipped. Both royal guards wear dark cloaks pinned with silver eagle-wing brooches. In that chapter-26 appearance, they wear fine brynjas and swords at their hips.</p></details><details><summary>The Shadow of the Gods · 45</summary><h2>Waking among the wounded</h2><p>During Skalk’s betrayal she spears Torvik through the throat, retrieves a chest containing the bone sword and carries unconscious Vol away.</p></details><details><summary>The Hunger of the Gods · 12</summary><h2>Rowing away from Grimholt</h2><p>During the flight by river, she removes Vol’s gag and forces her to drink, then offers bread and salted pork. After Vol’s exchange with Skalk she cuffs the captive and replaces the gag on his order.</p></details><details><summary>The Hunger of the Gods · 21</summary><h2>An audience with Queen Helka</h2><p>She finds Guðvarr at The Dead Drengr and orders him to dress for an immediate audience with Helka. At the queen’s door she greets Frek by name. Before Helka, she testifies that Guðvarr carried Skalk out of Grimholt’s hall, warned her of danger and took him to the escape snekke.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>Secrets in the Galdur tower</h2><p>She closes the hidden passage behind Guðvarr and helps enforce Skalk’s intimidation by blocking retreat. At the tower she chains Vol to the restraint table, then helps seize and bind Guðvarr. She raises his sleeve and mocks his claim of bravery before Skalk places the hyrndur on him.</p></details><details><summary>The Hunger of the Gods · 24</summary><h2>A rescue planned in Darl</h2><p>While approaching the tower, Jökul calls her Skalk’s oathsworn and hopes to avenge Torvik if they meet. She is not encountered in this chapter. Evidence note: Varg’s later recollection says she used a sword at Torvik’s throat, while the earlier direct scene names a spear. Both wordings remain in their source chronology; the earlier observation is not silently revised.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>The assault on the workroom</h2><p>She arms with shield and sword during the assault and intercepts a mounted spearman, deflecting the spear and stabbing the rider in the throat. When Iva’s fissure opens and Skalk falls, Yrsa leaps after him. Her fate below is not shown.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>She appears alive with Sturla, helping the injured Skalk into the hall; her fate after leaping into the fissure is therefore resolved as survival, without a narrated escape mechanism.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>Varg demands that she be handed over too, accusing her of killing Torvik with a sword in Rotta’s chamber. Glornir stops his advance; no surrender or revenge occurs. The sword wording repeats his later recollection and remains distinct from the earlier directly narrated spear attack.</p></details><details><summary>The Hunger of the Gods · 33</summary><h2>A summons after the tower battle</h2><p>With a scabbed, puckered forehead cut, she accompanies Sturla to collect Guðvarr from The Dead Drengr. During Skalk’s commanded hyrndur movement she catches him beneath an arm as his legs weaken, then snorts at his fearful assent to Skalk’s threat.</p></details><details><summary>The Hunger of the Gods · 77</summary><h2>Orna raised and the battle above Darl</h2><p>She escorts Skalk, rallies defenders in the courtyard and knocks Guðvarr down before he attacks him. Her cheek is torn; the gods&#x27; crash interrupts her threatened killing and her final fate remains unshown.</p></details><details><summary>The Fury of the Gods · 34</summary><h2>A bargain in the forest glade</h2><p>She appears fair, in fine mail with sword and seax and a white forehead scar, sneering at Guðvarr during the negotiations. She later holds his gaze until he looks away. No new injury cause or individual outcome in the retreat is supplied.</p></details><details><summary>The Fury of the Gods · 81</summary><h2>Fair-haired and explicitly named as Skalk’s drengr, she rallies Darl’s wing-shield warriors</h2><p>Fair-haired and explicitly named as Skalk’s drengr, she rallies Darl’s wing-shield warriors. Varg remembers her killing Torvik and confronts her; she recognises him and fights skilfully. He deceives her with a slip feint, hooks her ankle, breaks her sword-wrist and chops his axe into her face for Torvik, her limbs flopping afterward. This does not identify any earlier unnamed guide by resemblance.</p></details><details><summary>Illustration · The Fury of the Gods · 81</summary><p><a href="assets/9a85192de9d89f.jpg">Open noncanonical illustration</a></p><p>Varg’s ankle hook before the fatal follow-up.</p></details><details><summary>Illustration · The Hunger of the Gods · 36</summary><p><a href="assets/c5b5d956dc4f9e.jpg">Open noncanonical illustration</a></p><p>Yrsa in a study of her first named appearance, with an invented pose and backdrop.</p></details></noscript>
