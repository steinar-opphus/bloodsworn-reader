      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 25</summary><h2>Appearance</h2><p>This unnamed man on the leading drakkar wears cloak/cowl and iron collar; later he uncovers a gaunt face and black-hollow eyes. His role does not identify him with the previously seen Rurik’s rune-wielder E-328. His song precedes the sea serpent’s retreat, without establishing a universal counter-song rule.</p></details><details><summary>The Fury of the Gods · 25</summary><h2>The Fury of the Gods - chapter 25</h2><p>He cuts his palm, raises a fist and sings interlocking red circles across the prow. The ward destroys some incoming arrows, but others pass. Ice magic freezes and breaks it before the vessel sinks. His individual final fate remains unshown; no death or escape is assigned.</p></details><details><summary>Illustration · The Fury of the Gods · 25</summary><p><a href="assets/fe5a2430b0dacf.jpg">Open noncanonical illustration</a></p><p>The early counterspell freezing the lead drakkar’s red ward, before the hull breaks.</p></details></noscript>
