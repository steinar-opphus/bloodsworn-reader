      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 9</summary><h2>The serpent and the captive family</h2><p>Elvar calls Lik-Rifa a dragon-god. Grend calls Snaka her father.</p></details><details><summary>The Shadow of the Gods · 9</summary><h2>The serpent and the captive family</h2><p>Grend says she survived Guðfalla and was trapped beneath Oskutreð. He says souls must fight her in Vergelmir.</p></details><details><summary>The Shadow of the Gods · 9</summary><h2>The serpent and the captive family</h2><p>Elvar doubts she lives and rejects the tremor as proof of a dragon-god.</p></details><details><summary>The Shadow of the Gods · 13</summary><h2>A feast interrupted</h2><p>Galinn’s saga describes Lik-Rifa chained in a deep chamber beneath Oskutreð.</p></details><details><summary>The Shadow of the Gods · 14</summary><h2>Blood memories at the oath stone</h2><p>Uspa says Lik-Rifa’s paranoia was fuelled by Rotta and that she secretly created the vaesen. She says Orna and her siblings trapped the dragon beneath Oskutreð.</p></details><details><summary>The Shadow of the Gods · 46</summary><h2>The broken oath stone</h2><p>In the highlands Orka finds a fresh blood-coated, fanged and winged carving on a shattered oath stone beneath a slain eagle. She identifies it as worship of Lik-Rifa. Its makers and any connection to Breca’s abduction remain unknown.</p></details><details><summary>The Shadow of the Gods · 48</summary><h2>The guardian of Oskutreð</h2><p>At Oskutreð Vörn confirms Kráka’s assertion that the dragon is still imprisoned beneath the roots and names the three sisters as her gaolers.</p></details><details><summary>The Shadow of the Gods · 52</summary><h2>Chapter 52 — The revealed dragon</h2><p>Chapter 52 directly establishes her survival and release: Ilska’s blood rite opens the door and the dragon emerges. She is emaciated and partly rotten, with pallid scales, feverish red eyes, tattered wings and corpses snagged on her body.</p></details><details><summary>The Shadow of the Gods · 52</summary><h2>Chapter 52 — The revealed dragon</h2><p>Her jaws have teeth longer than spears and rows of pale curling horns crown her head. She has a razored tail, and her immense size is compared to twice Snakavik&#x27;s mead hall.</p></details><details><summary>The Shadow of the Gods · 52</summary><h2>Humanoid form and departure</h2><p>She battles the winged gaolers and kills the white-winged woman. After her followers kneel, she calls them her children and assumes a towering human shape with injured pale skin, black silver-streaked hair and red eyes. She then returns to dragon form and flies south.</p></details><details><summary>The Shadow of the Gods · 52</summary><h2>Humanoid form and departure</h2><p>Her humanoid frame is lean and striated, taller than any man and compared in size to the bull troll. Her face is described as sharply beautiful. She wears a grey tunic with red-woven neck and hem, a gold-studded belt and a dark cloak.</p></details><details><summary>The Shadow of the Gods · 52</summary><h2>Humanoid form and departure</h2><p>She says she wants to return to her hall Nastrandir and hunt after centuries eating corpses in captivity. These durations and her intentions remain her testimony.</p></details><details><summary>The Hunger of the Gods · 4</summary><h2>The descent beneath Oskutreð</h2><p>Skuld says the sisters guarded her because of an oath to their father, trying weapons and starvation without success. She says Lik-Rifa altered life in captivity and fed on passing souls, subterranean creatures and things brought by helpers. These are Skuld&#x27;s accounts, including her blame for the gods&#x27; war.</p></details><details><summary>The Hunger of the Gods · 4</summary><h2>The descent beneath Oskutreð</h2><p>A protected black-bound book is observed in her former chamber; Skuld admits she does not know its nature.</p></details><details><summary>The Hunger of the Gods · 5</summary><h2>A welcome among the Raven-Feeders</h2><p>Lik-Rifa returns carrying an immense bear, eats most of it and changes into a tall dark-haired woman in a grey-ash, red-hemmed tunic. Her body remains pale and scabbed, but Biórr sees her wounds closing and healing extraordinarily quickly.</p></details><details><summary>The Hunger of the Gods · 5</summary><h2>A welcome among the Raven-Feeders</h2><p>She says she needs recovery before her enemies find her and wants her people gathered at Nastrandir before she rules. She insists her hall still stands; Ilska instead suspects ruins buried in ice and snow. Ilska sets guards while she sleeps.</p></details><details><summary>The Hunger of the Gods · 9</summary><h2>Old companions at the campfire</h2><p>She wakes gaunt and pale with flashing red eyes and picks at a half-scabbed throat wound. She speaks of Ulfrir’s jaws at her throat, then insists her brother lives despite Ilska’s denial.</p></details><details><summary>The Hunger of the Gods · 9</summary><h2>Old companions at the campfire</h2><p>In anger she becomes a dragon, uproots trees and kills and swallows a guard. Drekr rescues Ilska and then stands between her and the dragon with his axe. Lik-Rifa resumes human form, praises his loyalty to his sister and threatens him for defiance, shedding a tear and touching his cheek.</p></details><details><summary>The Hunger of the Gods · 9</summary><h2>Old companions at the campfire</h2><p>She says her father ate his creations on whims and promises to try not to resemble him. Her newly demonstrated violence and this promise remain side by side; Biórr privately notices the contradiction.</p></details><details><summary>The Hunger of the Gods · 9</summary><h2>Old companions at the campfire</h2><p>She identifies the Raudskinna as her brother’s book and hears Ilska confirm using it. She says she sensed her own spell restoring Ulfrir and blames the use of her protected book. The sensing and explanation remain her testimony.</p></details><details><summary>The Hunger of the Gods · 9</summary><h2>Old companions at the campfire</h2><p>She orders haste south over Isbrún Bridge, warning that sólstöður’s end will prevent their escape from this side of the vaesen pit. Her threat to eat someone else sets the camp moving; the chapter does not show the crossing.</p></details><details><summary>The Hunger of the Gods · 14</summary><h2>Crossing Isbrún Bridge</h2><p>At the tennúr hill beyond Isbrún Bridge she lands in dragon form and the creatures swarm her without attacking. She stops Ilska’s intervention, calls them her children and changes to human form amid mist and cracking sounds. Tall, gaunt and regal in a grey tunic edged red, she smiles and strokes them.</p></details><details><summary>The Hunger of the Gods · 14</summary><h2>Crossing Isbrún Bridge</h2><p>She claims to have created the vaesen and likens them to her blood-descended children. A tennúr on her arm promises obedience. Ilska’s disgust provokes a threat: Lik-Rifa says she has vowed to try not to eat her surviving children and orders respect for the vaesen as allies. Ilska submits.</p></details><details><summary>The Hunger of the Gods · 14</summary><h2>Crossing Isbrún Bridge</h2><p>She sends the creatures back underground, then places her palm against the bridge boulder and speaks. White veins enter the rock; after steam clears Biórr cannot see the bridge. Permanent destruction is not established. She takes Ilska’s black mare, calms it with whispered words, says the tennúr will follow after a task, and leads the company east to Nastrandir.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>She has remained human for days while riding east and questioning Ilska on the history and politics since the Guðfalla. They camp in the warm northern strip beside the molten river of the vaesen pit. At the assembly Biórr sees her as taller than Drekr, though he is broader, and hears her too-deep voice.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>She orders almost a hundred children’s collars removed. Ilska and the dragon-born chant and unlock them. When the unsettled children do not obey her call for silence, she briefly grows jaws, teeth, scales and wings amid mist and cracking bone, then returns human; the children fall still and silent.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>She calls herself Snaka’s second-born and most favoured child, accuses the children’s parents of lying, and orders them to treat her as family and forget their past. She promises maternal love, protection and provision as queen in return for loyalty, and commands them to love her. Those are her status claims and promises, not demonstrated safety or literal replacement of their kinship.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>She touches children as she walks among them; some move nearer and others away, while Biórr cannot tell whether they are terrified or enraptured. She calls the dragon-born her children and the gathered people her followers, promising to change the world. Warriors and children join the acclamation; freely chosen allegiance is not established.</p></details><details><summary>The Hunger of the Gods · 30</summary><h2>The Raven-Feeders march east</h2><p>The next morning Brák invokes her rejection of parents and past while abusing the recaptured Breca. The boy insists on his full name and remains captive despite the preceding removal of collars; her promise of safety is not borne out as a guarantee of the camp’s treatment.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>Myrk tells Orka’s group that her company freed Lik-Rifa through a Raudskinna rite needing Tainted blood, and threatens that the dragon will eat them. She says children were easier to control than older Tainted using Seiðr mixed with Galdur. These remain her account and threats, without a new appearance of Lik-Rifa or universal magic rules.</p></details><details><summary>The Hunger of the Gods · 31</summary><h2>Following Myrk&#x27;s trail</h2><p>Myrk gives a past northern position and a claimed westward rendezvous plan off the Iskalt Islands, saying Lik-Rifa ordered her to bring her father there. Orka doubts the account. No arrival or current change from the previously observed eastward march is established.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>At Elvar’s camp, Skuld says Orna lured Lik-Rifa into Oskutreð through her fascination with the soul road and the boundary between life and death. She also alleges a hidden vaesen army intended to overwhelm the other gods, exposed by Rotta. These remain Skuld’s accounts of the war, without proving a universal vaesen origin.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>Urt describes her as large enough to blot out the sun, while Ulfrir calls her insane and needing to be killed. Skuld promises help with that aim and later invokes vengeance for Orna while persuading her father to submit to Elvar. These are descriptions, opinions and intentions; no new appearance, battle or defeat occurs here.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>She leads the company south along the eastern crags after leaving the warm pit. At the later camp she addresses the children from a grey boulder, condemns the term Tainted and proposes Fortunate Ones. A brief display of red eyes and growing jaws frightens the children before she settles back into human form. It is not another completed giant-dragon transformation.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>She has Ilska demonstrate a partial change and explains differing god-blood abilities, calling the gods kin. She orders the children to remember their abductions and any parental deaths they saw, then inwardly meet the beast she says emotion awakens. Bjarn answers bear, a camp boy called Harek answers boar, and Breca reports wolf and bear. Her teaching is distinguished from demonstrated changes and the children’s own answers.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>She accuses the parents of lying, tells the children their grief is undeserved and claims to replace their family while promising truth and respect. These remain her accusations and promises, not objective proof of safety or parental motives.</p></details><details><summary>The Hunger of the Gods · 35</summary><h2>Children on the winter march</h2><p>She looks west as a swarm approaches, stops the dragon-born’s preparations and welcomes the tennúr as returning children. They perch on her and speak in voices Biórr cannot decipher. She turns from a smile to rage and declares that her brother crossed Isbrún Bridge. The full message and her next response are not disclosed.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>Nastrandir revealed in the snow</h2><p>She remains on horseback while Ilska and the dragon-born melt a route through snow, without helping them. Since the first lesson she has continued evening instruction, dividing the children into groups assigned to Tainted Raven-Feeder teachers. The tennúr return and swirl about her; Kráka says they found something, but no report content is decoded.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>Nastrandir revealed in the snow</h2><p>At the sea-facing approach to Nastrandir she dismounts and stops Ilska and Drekr following. She fully transforms into dragon form. Scars remain, but Biórr observes they are no longer scabbed or weeping pus and her bones no longer protrude as before; he thinks she looks strong. This is improved visible condition, not proof of total recovery or invulnerability.</p></details><details><summary>The Hunger of the Gods · 40</summary><h2>Nastrandir revealed in the snow</h2><p>Her roar shakes the earth and sends rock into the sea. Calling Nastrandir, she repeats a song; cliffs shimmer and erupt, then dust clears to show enormous silver-edged black-granite doors and moving stone serpents that bow before her. She welcomes the column home. The doors are not shown opening, no interior is inspected and no explicit new retaliation against Ulfrir is ordered.</p></details><details><summary>The Hunger of the Gods · 42</summary><h2>Inside Nastrandir&#x27;s great hall</h2><p>Inside Nastrandir she is human again. Her utterance precedes flame in huge braziers as she walks between serpent-carved pillars. After the company enters and the main doors close, she takes a stone throne whose high back moves into smaller serpents and strokes one of their heads.</p></details><details><summary>The Hunger of the Gods · 42</summary><h2>Inside Nastrandir&#x27;s great hall</h2><p>She promises protection and safety, proposing rest, recovery and planning in the careworn hall. A serpent hovers beside her ear; she appears to listen, then rises with a scowl and declares someone has been there. The interaction does not disclose a message or its mechanism. She marches deeper, with further braziers igniting and tennúr above the followers.</p></details><details><summary>The Hunger of the Gods · 42</summary><h2>Inside Nastrandir&#x27;s great hall</h2><p>After passing the internal pier she roars Opinn before a pair of doors, which are hurled inward. Beyond the food-laden chamber she encounters a grinning man who welcomes her home as sister. She explicitly names him Rotta; he claims to have been looking after Nastrandir. Her response to that claim is not shown.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>She angrily challenges Rotta for failing to come to her aid. He claims escape during Guðfalla and fear of renewed punishment and her gaolers; he shows a damaged face before restoring the handsome one. She accuses him of killing and flaying the gaolers’ sister for his Galdrabok. She reports two gaolers dead and admits not recalling Skuld’s fate; that ignorance does not establish Skuld’s death.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>She tells Rotta that Ulfrir lives and says her own Galdrabok, written during three hundred years underground, is in the wrong hands. Rotta promises support, then embraces her; after initial rigidity she returns it and whispers that she missed him. The reunion resolves the immediate confrontation, without proving perpetual trust.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>At the feast she declares restoration for their bloodlines and death for Ulfrir. After cheers, she says they are too few and sings with a voice that overwhelms Biórr’s senses. He almost sees tendrils of words leaving the chamber. Rotta explains that she has summoned the vaesen she created and bred. Her act and his interpretation are distinct from a demonstrated arrival or universal obedience.</p></details><details><summary>The Hunger of the Gods · 50</summary><h2>The wolf&#x27;s call across the lake</h2><p>Away from her, Spert and Vesli tell Orka’s group that she called them in the night. Both describe hearing her in their heads, though Spert says he does not know how. Vesli describes a song-like voice during sleep, ordering them to come and promising great and terrible deeds. She says Lik-Rifa made them or their spawning kin, preserving the distinction between creation and descent.</p></details><details><summary>The Hunger of the Gods · 50</summary><h2>The wolf&#x27;s call across the lake</h2><p>The pair remain with Orka and explain refusing through gratitude, oath and the pact to find Breca. Vesli calls resistance hard. This identifies two reported hearers and refusals beyond Rotta’s earlier explanation, without proving universal obedience or future immunity. Revna infers a call to all vaesen and Orka concludes war; neither a new arrival at Nastrandir nor a battle is shown here.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>At Darl Hakon and Kalv disclose her release to Helka, while Frek reports dragon dreams and Hakon describes the dragon-born’s book and child-requiring spell. Skalk calls the account plausible by connecting earlier evidence. These are this group’s disclosures, not another release event or new knowledge reaching the dragon.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>Hakon says joining her is safer than opposing her, but Helka refuses to kneel. Skalk proposes raising and binding Orna against her, needing an uncertain many days. Guðvarr offers to seek intelligence at Nastrandir as a replacement messenger. No new alliance, resurrection, mission departure or attack occurs here.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>Her summons now produces observed arrivals at Nastrandir: further frost-spiders join earlier webs, tennúr fly overhead, armed skraeling gather protectively, hyrndur nest on a column, trolls settle around porridge and night-hags receive a dark chamber. She kneels to greet the scarred hairy spiders, whose approach crowds her from view, then calls the council through a skraeling’s horn. Few spertus also stand at the hall edges; the named Spert is not identified among them.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>She reports feeling stronger and rested, celebrates her bloodline followers and Rotta, and briefly shows scales and teeth as rage rises. She declares punishment for wrongs to the gods’ bloodlines. Ulfrir’s location remains unknown to her, so she intends to tear Vigrið apart until he is exposed. Ilska supplies political intelligence and Lik-Rifa rejects Helka’s queenship.</p></details><details><summary>The Hunger of the Gods · 54</summary><h2>Children trained for war</h2><p>She announces the order of attack: Orlyg at Svelgarth first, then Helka, then Störr, freeing Tainted and taking warbands as she goes until she can find and kill Ulfrir. This is her campaign plan; the chapter ends before departure, conquest or liberation.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>At the rescued farm Kló says Lik-Rifa made vaesen while Snaka made the giant ravens, who emphatically deny belonging to that category. Grok describes past service as Snaka’s messengers and spies; Kló adds that Lik-Rifa disliked it. This is the ravens’ origin and history account, without a stated attack, extermination mechanism or full taxonomy.</p></details><details><summary>The Hunger of the Gods · 60</summary><h2>Guðvarr taken into Nastrandir</h2><p>She returns to Nastrandir as a pale scaled dragon with curved horns, red-gold eyes and a whale, then assumes her braided silver-streaked human appearance. She questions the purported Hakon messenger and his tattoo before declaring that those without her mark will soon face death. Guðvarr&#x27;s belief that he has convinced her is his own conclusion.</p></details><details><summary>The Hunger of the Gods · 77</summary><h2>Orna raised and the battle above Darl</h2><p>She attacks newly resurrected Orna above Darl and ultimately kills and mangles the eagle. Guðvarr reports that she earlier exposed the hyrndur in him and removed it after hearing his confession; this is his retrospective report, not a replayed procedure. No final control of every part of Darl is yet established.</p></details><details><summary>The Fury of the Gods · 2</summary><h2>The dragon’s assembly in Darl</h2><p>In the ruined Darl courtyard she appears as a tall, dark-haired woman in ash-grey trimmed red, with fresh wounds and a badly swollen eye. Declaring herself queen of Darl and all Vigrið, she briefly shows a broad fanged maw. The proclamation does not establish control of the entire land.</p></details><details><summary>The Fury of the Gods · 2</summary><h2>The dragon’s assembly in Darl</h2><p>She orders Helka&#x27;s fifty or sixty captive drengrs killed, arguing their oaths remain bound to the royal bloodline. After offering Glunn rewards for service, she forces him and Svard to compete for worthiness; Glunn kills Svard and claims his following. She invites the victor, Sigrún and Guðvarr to a meal, calling Guðvarr Guthlaf.</p></details><details><summary>The Fury of the Gods · 8</summary><h2>The gathering in the Galdur tower</h2><p>In the Galdur tower, she surrounds the banquet with serpents and overhead frost-spiders, saying the snakes are drawn by her presence. She orders Ulfrir found and killed, but accepts Ilska&#x27;s hunt for Estrid and Skalk while choosing to recover and await better knowledge of the wolf&#x27;s location rather than fly out alone. Her fears about his plotting are assumptions, not a demonstrated plan.</p></details><details><summary>The Fury of the Gods · 18</summary><h2>The hunters turn towards the Slågen</h2><p>Krúsa calls skraeling, tennúr, frost-spiders, trolls, night-hags and hyrndur her children and says they share her side. She distinguishes Froa as Snaka’s creations and enemies of her own kind. This attributed allegiance account does not prove every individual’s obedience, as Spert’s contrary loyalty already shows.</p></details><details><summary>The Fury of the Gods · 24</summary><h2>Rotta returns to Darl</h2><p>She receives Rotta and the returning force in human form at the black-stone tower, insisting conquest is incomplete while Ulfrir lives. She turns inside while Ilska and Drekr mourn Myrk. Her feasting hall is still filled with serpents, which she claims are safe to guests who mean no harm.</p></details><details><summary>The Fury of the Gods · 24</summary><h2>Rotta returns to Darl</h2><p>She boasts of killing the resurrected Orna and admits forgetting the planned heart collection, claiming nothing recoverable remains. She dismisses the need for Orna’s power and rejects another unnamed heart-source as too risky. After saying her scouts have brought no word, she receives Snakavik and the Elvar/Battle-Grim connection from Rotta and asks Biórr for details. No attack or heart consumption occurs.</p></details><details><summary>The Fury of the Gods · 36</summary><h2>The dragon’s host marches out</h2><p>She appears in brass-gilded mail, red wool cloak edged in white fox fur, slim sheathed sword and gold-wire-bound dark braid coiled at her shoulder. Mounting a grey gelding, her jaw extends and eyes redden as she roars that the host rides to kill the wolf. The mixed force follows through Darl and out into meadows/woods. Rotta says she refuses to divide it, speculating about risk from Ulfrir; her own private explanation is not supplied. She accepts Sterkur’s service for reward while dismissing his name; no victory or arrival is shown.</p></details><details><summary>The Fury of the Gods · 41</summary><h2>Ilska asks about Orka</h2><p>She claims the approaching Slågen lands as hers, still speaking as if Störr lives until Sigrún reports his death and the wolf collared to Elvar. Surprised with Rotta, Ilska and Biórr, she then receives Munni’s independently checked ships/stone-wolf evidence of Ulfrir’s den. She praises the scouts and interprets homecoming as weakness, promising to kill him soon. That belief is not proof of weakness or an actual attack, and no performed alliance oath follows.</p></details><details><summary>The Fury of the Gods · 44</summary><h2>A raven reports she has reached Jarnvidr</h2><p>A raven reports she has reached Jarnvidr. This is incoming scout news to Elvar’s hall, not an attack at the gates, a precise timetable or a newly described body form.</p></details><details><summary>The Fury of the Gods · 45</summary><h2>She leads the host over Ilska’s northern approach, asks for an arrival estimate and orders it onward</h2><p>She leads the host over Ilska’s northern approach, asks for an arrival estimate and orders it onward. Ilska estimates five days or less and dispatches tennúr scouts; this is not confirmed arrival at Wolfdales.</p></details><details><summary>The Fury of the Gods · 47</summary><h2>Drekr, Lif and the dragon’s counterattack</h2><p>In full dragon form she crashes through the canopy into her own camp, hurling inhabitants aside and calling for Ulfrir. She tears trees during the pursuit, then returns human and orders Tannbursta’s tennúr search. On Rotta’s huge approach she begins another transformation but reverses when he is recognised. She and Rotta report no physical Ulfrir encounter here, without disproving his coordination of the raid.</p></details><details><summary>The Fury of the Gods · 50</summary><h2>The burned wagons and the captive children</h2><p>She hears reports of casualties, desertions, limited food and reinforcements, dismisses siege concerns and promises hunting/rewards while threatening the deserters and Ulfrir. Her human form shows oversized teeth and a serpent-like tongue, not a completed new transformation. Munni’s news of defences provokes another threat. Rotta’s report that unnamed insiders might open the doors if Elvar died makes her ask how; his smile supplies no method.</p></details><details><summary>The Fury of the Gods · 53</summary><h2>A night march under false campfires</h2><p>She confirms the wall’s Seiðr hurt her and boasts of the fleet’s destruction, then debates Ulfrir and conditionally accepts an unnamed dangerous fallback. When the wounded fugitives arrive she explicitly names Broðir’s assigned killing/opening mission and orders them killed for failure. Rotta’s inheritance argument changes her order to tending Broðir’s wounds; both are led away alive. She still demands Elvar dead, with no new method disclosed.</p></details><details><summary>The Fury of the Gods · 55</summary><h2>The siege begins at the river</h2><p>At the dawn siege council she and Rotta discuss Ulfrir while captains settle on ladders/rafts instead of rams. She taunts Rotta about the daughter’s flaying. During timber-cutting she descends in full dragon form to counter Froa attacks, receiving red welts/blood streaks from vines before uprooting/spitting an ash. The local spirit collapses still; Lik-Rifa roars and turns to the next ash, no full forest-clearing or main assault outcome shown.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>Her tree destruction is seen from the gate and Vol interprets the inhuman cries as Froa being killed</h2><p>Her tree destruction is seen from the gate and Vol interprets the inhuman cries as Froa being killed. She does not attend the bridge parley; Rotta delivers the failed offer before the assault begins. No next tree-by-tree outcome or total destruction is supplied.</p></details><details><summary>The Fury of the Gods · 69</summary><h2>Biórr’s doubts amid the fighting</h2><p>She enters in full dragon form, her wing-wind scattering people before she lands and briefly stops the fight. She taunts Ulfrir with a boast about Orna’s death and produces wounded Broðir from a claw. His thrall commands fail because the wolf is free; she calls him useless/lying and bites him away, then leaps at Ulfrir. No completed new god-duel or outcome follows.</p></details><details><summary>The Fury of the Gods · 70</summary><h2>After the collision and shoulder bite she is flung into the trunk, rises and faces Ulfrir</h2><p>After the collision and shoulder bite she is flung into the trunk, rises and faces Ulfrir. Gelta binds legs/neck/body and drags her flight down; she tears roots while the spirit renews them, stone guardians attack her back and followers cut bindings. Rotta’s fire threatens Gelta, but the chapter does not show the dragon finally freed or defeated.</p></details><details><summary>The Fury of the Gods · 71</summary><h2>Guðvarr finds Estrid</h2><p>She remains partly bound while followers/guardians fight around her, then flies free as the burned Froa collapses and roots fall. Ulfrir bites her chest before a collision with the burning tree drops him into flames. She then gathers rat-form Rotta in both claws and spirals upward around the tree. No flight outdoors, full healing or final victory is shown.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>Wounded and carrying the blood-matted rat, she hits the blue roof wall and is knocked back</h2><p>Wounded and carrying the blood-matted rat, she hits the blue roof wall and is knocked back. Rotta opens it with words; she passes outside into the pale sky and is seen retreating north-west toward Snaka’s skull. Actual outside escape is now shown, but arrival, full healing or the next god clash is not.</p></details><details><summary>The Fury of the Gods · 74</summary><h2>She circles the newly risen Snaka’s head, then flies inland toward Wolfdales with him following</h2><p>She circles the newly risen Snaka’s head, then flies inland toward Wolfdales with him following. Orka recognises that she is bringing him to the defenders. The scene does not show the preceding resurrection rite or establish absolute spell control over him.</p></details><details><summary>The Fury of the Gods · 78</summary><h2>The shattered enemy camp</h2><p>She enters human-form behind Snaka, stiff and wounded with new red wounds across head/body and blood crust on one unspecified facial side. She kneels on one knee, bows and calls him father/king. Her injuries remain, and the scene establishes submission rather than a new witnessed control spell.</p></details><details><summary>The Fury of the Gods · 80</summary><h2>Snaka’s heart and the interrupted feast</h2><p>Snaka abuses her for presuming to tell him must, wounding her scalp; she admits fear drove the raising. At the poisoned meal she mocks his kneeling, then pins his hand as he recovers and holds him while Rotta cuts his throat. She demands the removed heart, but a tennúr steals it before consumption. She begins changing as an attack starts.</p></details><details><summary>The Fury of the Gods · 81</summary><h2>She takes dragon form and Ulfrir crashes into her as the allied attack overruns camp</h2><p>She takes dragon form and Ulfrir crashes into her as the allied attack overruns camp. Trolls rush to defend her and Rotta; no final dragon duel or heart recovery is shown.</p></details><details><summary>The Fury of the Gods · 83</summary><h2>Ulfrir tears her shoulder and drags her from half-flight; she lashes his chest with her tail</h2><p>Ulfrir tears her shoulder and drags her from half-flight; she lashes his chest with her tail. Skuld grips horned scales and stabs one eye with scissors, crying for her mother, before being shaken away into darkness. Neither eye side, total blindness nor final god outcome is established.</p></details><details><summary>The Fury of the Gods · 88</summary><h2>Thorkel avenged and the final advance</h2><p>One wing hangs limp from a torn shoulder; one eye glows red while the other is a blackened wound, side unspecified. Her surviving host gathers around her as she faces the wounded wolf, then he leaps again. No healing or final victory/death is shown.</p></details><details><summary>The Fury of the Gods · 90</summary><h2>The last assault on Lik-Rifa</h2><p>Held by Ulfrir and the three witches’ fire/ice ropes, she suffers the jaw joint cut, throws her attackers and breaks free. She mortally strikes Glornir, then swallows hurled Hrung. Ulfrir names him the poison’s source; black veins/froth, collapse and extinguished eye mark her explicit death. Hrung’s voice later sounds from the corpse.</p></details><details><summary>Illustration · The Fury of the Gods · 70</summary><p><a href="assets/8226a3d8f585da.jpg">Open noncanonical illustration</a></p><p>Gelta’s first binding before the counterattack.</p></details><details><summary>Illustration · The Shadow of the Gods · 53</summary><p><a href="assets/bdf06a4d4f38b1.jpg">Open noncanonical illustration</a></p><p>A study of Lik-Rifa&#x27;s revealed dragon form.</p></details><details><summary>Illustration · The Shadow of the Gods · 53</summary><p><a href="assets/f69526aa99599c.jpg">Open noncanonical illustration</a></p><p>Lik-Rifa after her completed transformation into humanoid form.</p></details><details><summary>Illustration · The Fury of the Gods · 2</summary><p><a href="assets/4ee92f89c4ec6f.jpg">Open noncanonical illustration</a></p><p>Lik-Rifa - proclamation at Darl.</p></details><details><summary>Illustration · The Hunger of the Gods · 77</summary><p><a href="assets/dc6ba929023f26.jpg">Open noncanonical illustration</a></p><p>Lik-Rifa and Orna clash in the air above Darl.</p></details><details><summary>Illustration · The Fury of the Gods · 47</summary><p><a href="assets/5529b71048adad.jpg">Open noncanonical illustration</a></p><p>Lik-Rifa breaking through the canopy during the raid.</p></details><details><summary>Illustration · The Fury of the Gods · 71</summary><p><a href="assets/e28796c47f3fa9.jpg">Open noncanonical illustration</a></p><p>The dragon carrying the rat upward inside the hall.</p></details><details><summary>Illustration · The Fury of the Gods · 36</summary><p><a href="assets/de0423fd74978e.jpg">Open noncanonical illustration</a></p><p>Lik-Rifa’s departure, just before her voice and face change.</p></details><details><summary>Illustration · The Fury of the Gods · 55</summary><p><a href="assets/76b7c5c0aeddd9.jpg">Open noncanonical illustration</a></p><p>The ash being uprooted as the local spirit falters.</p></details><details><summary>Illustration · The Fury of the Gods · 8</summary><p><a href="assets/7652d2bc05b35b.jpg">Open noncanonical illustration</a></p><p>Lik-Rifa’s serpent banquet.</p></details><details><summary>Illustration · The Fury of the Gods · 90</summary><p><a href="assets/8ebbc301db92b4.jpg">Open noncanonical illustration</a></p><p>Orka and Glornir climbing the damaged wing before the jaw attack.</p></details><details><summary>Illustration · The Fury of the Gods · 83</summary><p><a href="assets/31ebd0f5cb8649.jpg">Open noncanonical illustration</a></p><p>Skuld drawing her scissors before the eye attack.</p></details><details><summary>Illustration · The Fury of the Gods · 88</summary><p><a href="assets/bb25c389270dd9.jpg">Open noncanonical illustration</a></p><p>Skuld’s horn signal above the exhausted wolf and dragon.</p></details><details><summary>Illustration · The Fury of the Gods · 80</summary><p><a href="assets/37be3fc75eb662.jpg">Open noncanonical illustration</a></p><p>Snaka expelling the poison before the knife attack.</p></details><details><summary>Illustration · The Fury of the Gods · 90</summary><p><a href="assets/74e707bda99962.jpg">Open noncanonical illustration</a></p><p>Taras throwing Hrung toward the dragon’s open jaws.</p></details><details><summary>Illustration · The Fury of the Gods · 72</summary><p><a href="assets/a31ae3fafb144b.jpg">Open noncanonical illustration</a></p><p>The roof ward stopping the dragon before Rotta opens it.</p></details><details><summary>Illustration · The Fury of the Gods · 80</summary><p><a href="assets/b1d8da09570245.jpg">Open noncanonical illustration</a></p><p>The unnamed tennúr’s flight; its stolen cargo is hidden from view.</p></details><details><summary>Illustration · The Fury of the Gods · 69</summary><p><a href="assets/d609fc6ea53452.jpg">Open noncanonical illustration</a></p><p>The free wolf’s refusal, before Broðir’s death.</p></details><
