      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 23</summary><h2>Appearance</h2><p>Also called the Iron Wood, Jarnvidr is a great forest along the southern edge of Elvar’s realm near the Slågen border. Skuld places the Wolfdales close by; Ulfrir says its cover shelters against eyes in the sky. Elvar orders preparations to march here tomorrow, without a completed departure or mapped route.</p></details><details><summary>The Fury of the Gods · 31</summary><h2>A wide wooden bridge crosses the white-spuming Slågen to a road swallowed by a dense tree wall</h2><p>A wide wooden bridge crosses the white-spuming Slågen to a road swallowed by a dense tree wall. Trees stretch north/south/west with hills just visible north; inside, towering trunks and a high dark canopy surround a noisy forest. Sigrún identifies chiefly birch and alder. At a fork the hunters follow Skapti straight rather than north. A Faunir is captured nearby and taken hostage, but no direct meeting with Skalk/Estrid or arrival at Wolfdales occurs. Guðvarr’s sense of being watched and Krúsa’s unseen-kin warning remain impressions/claims.</p></details><details><summary>The Fury of the Gods · 34</summary><h2>A bargain in the forest glade</h2><p>The road reaches a glade crossed diagonally by a stream, with a fallen tree, upturned roots, fire/pot and tethered horses. Estrid and Skalk use it for a negotiation with Sigrún and Krúsa. A Faunir swarm overruns the meeting, freeing its captive and forcing the two parties to withdraw along their respective roads. No exact location or unique official name is given for the glade.</p></details><details><summary>The Fury of the Gods · 38</summary><h2>Following the Falinn to Wolfdales</h2><p>The forest surrounds River Falinn’s estuary and tall banks as Elvar’s fleet travels inward towards Wolfdales. Wolves follow from its western woods and gather on the hill above the den. This route is not equated with the hunters’ road glade or assigned an exact distance from it.</p></details><details><summary>The Fury of the Gods · 39</summary><h2>Kló reports Elvar’s fleet rowing into the Iron Wood and hearing the wolf homecoming</h2><p>Kló reports Elvar’s fleet rowing into the Iron Wood and hearing the wolf homecoming. Glornir asks the ravens to tell Orlyg they will change destination here. The chapter does not show the Bloodsworn entering the forest or disclose the hunters’ separate glade events to them.</p></details><details><summary>The Fury of the Gods · 41</summary><h2>The host sees it beyond the Slågen</h2><p>The host sees it beyond the Slågen. Krúsa reports the Faunir battle inside it; Munni then reports the wolf’s den location and ships/stone guardians. The narrative does not yet show the dragon host crossing the river or entering the forest.</p></details><details><summary>The Fury of the Gods · 44</summary><h2>The new arrivals and Grend’s fate</h2><p>The new raven report places Lik-Rifa in Jarnvidr, without a precise approach route or actual attack on Wolfdales yet. The named bird is not specified.</p></details><details><summary>The Fury of the Gods · 45</summary><h2>The host enters the Iron Wood</h2><p>Ilska’s route crosses Slågen farther north and skirts the north-eastern edge, approaching the den from the north. Dense scrub later stretches the main host along the road while smaller flying/climbing vaesen range deeper. The five-day journey remains an estimate, and the dawn warning identifies no attacker.</p></details><details><summary>The Fury of the Gods · 46</summary><h2>The concealed tunnel exit opens into dawn about fifty paces from campfires</h2><p>The concealed tunnel exit opens into dawn about fifty paces from campfires. Sulich’s flank archers counter spiders and the raiders battle mist-like hags before bursting onto the crowded road. Fire spreads through tents north and south; the full battle outcome is not yet shown.</p></details><details><summary>The Fury of the Gods · 47</summary><h2>Drekr, Lif and the dragon’s counterattack</h2><p>Lik-Rifa’s dragon landing tears the canopy and uproots trees, then pursuit moves through flattened undergrowth. Attackers disappear amid runes at abruptly ending tracks; Rotta infers tunnels. Neither the precise route nor destination is directly exposed in this viewpoint.</p></details><details><summary>The Fury of the Gods · 51</summary><h2>Ulfrir’s trust and the roof ward</h2><p>Ulfrir says the hall tree was the first Oskutreð seed of Jarnvidr and Snaka sowed the surrounding wood for him. From above Elvar sees the dark forest and he points out ash trees across Falinn, predicting Froa hostility to a marching host. No forest-spirit attack or survey map is established.</p></details><details><summary>The Fury of the Gods · 55</summary><h2>The siege begins at the river</h2><p>The besiegers cut timber for ladders/rafts, choosing an elm for Sigrún’s group while nearby work provokes Froa. Roots/vines attack across the wood; Lik-Rifa uproots a nearby ash and the observed spirit collapses still, then she turns to another. The entire forest is not cleared/defeated in the shown passage.</p></details><details><summary>The Fury of the Gods · 57</summary><h2>Rotta, Biórr and about twelve others pass through the shadowed trees away from Guðvarr’s position</h2><p>Rotta, Biórr and about twelve others pass through the shadowed trees away from Guðvarr’s position. The narrated departure does not disclose their destination or a successful hidden route.</p></details><details><summary>The Fury of the Gods · 64</summary><h2>The rat-blood climb the cliff</h2><p>Rotta’s flanking party follows forest around the river curve and climbs to the hill crown, from which Biórr sees the surrounding Iron Wood in moonlight. Their tower approach is hidden movement, not an observed march through the main battlefield.</p></details><details><summary>The Fury of the Gods · 76</summary><h2>Surviving the plunge into the Falinn</h2><p>Its treeline marks the sinking sun behind heavy cloud at the regrouping scene; the riverbank group watches Wolfdales from the forest’s shelter. No new surveyed forest boundary is established.</p></details><details><summary>Illustration · The Fury of the Gods · 34</summary><p><a href="assets/5e38b5ccb5545b.jpg">Open noncanonical illustration</a></p><p>The meeting before the glade is attacked.</p></details><details><summary>Illustration · The Fury of the Gods · 23</summary><p><a href="assets/f00a711b7b8223.jpg">Open noncanonical illustration</a></p><p>The Slågen crossing and Jarnvidr’s forest edge.</p></details><details><summary>Illustration · The Fury of the Gods · 47</summary><p><a href="assets/5529b71048adad.jpg">Open noncanonical illustration</a></p><p>Lik-Rifa breaking through the canopy during the raid.</p></details><details><summary>Illustration · The Fury of the Gods · 55</summary><p><a href="assets/76b7c5c0aeddd9.jpg">Open noncanonical illustration</a></p><p>The ash being uprooted as the local spirit falters.</p></details></noscript>
