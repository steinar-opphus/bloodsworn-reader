      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 5</summary><h2>The landing on Iskalt</h2><p>Agnar steers the Wave-Jarl. Kráka chants magic to keep sea vaesen away from the ship.</p></details><details><summary>The Shadow of the Gods · 9</summary><h2>The serpent and the captive family</h2><p>A sea serpent attacks the goats beneath the awning and knocks the boy overboard. The mother’s song precedes the serpent’s withdrawal.</p></details><details><summary>The Shadow of the Gods · 21</summary><h2>Blood tested in Snakavik</h2><p>In B01-C021, the Wave-Jarl arrives at Snakavik under half a crew of oars. Agnar pays harbour dues and leaves warriors guarding the ship while the party goes ashore.</p></details><details><summary>The Shadow of the Gods · 32</summary><h2>The promise of Oskutreð</h2><p>The Battle-Grim spend two days in Starl restocking provisions and maintaining the Wave-Jarl. The Wave-Jarl crosses Lake Horndal.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>A duel for the Battle-Grim</h2><p>As newly acclaimed chief, Elvar orders the company south, back towards the Wave-Jarl. The ship is the intended destination; this chapter does not show it, establish its exact present condition or complete the return.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>Orv announces the ship on the southward return. At the reunion camp its sleek strakes gleam in moonlight as it lies in a river, moored to a willow tree. The warriors left to guard it question the returning company about Oskutreð. Elvar thinks of it as her ship and of herself as responsible for its crew; no new sailing or lake crossing occurs.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The laden ship reaches Starl</h2><p>The ship actually crosses Horndal to Starl under a cold wind. Approaching the docks, the sail is furled and stowed, mast down and lock-pin in place; the crew rows to Sighvat’s barrel-beat. She sits low and handles sluggishly under Oskutreð gold and silver stored beneath a spare-sail awning.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The laden ship reaches Starl</h2><p>Sólín steers into an empty pier and Sighvat throws walrus rope to the harbour crew. Once moored with the plank in place, the ship is approached by Orka, Halja and an unnamed collared companion. Their demand for Uspa brings Elvar to a standoff at the ramp, interrupted by Ulfrir. No new departure or completed restocking follows.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>Under Elvar’s conditional truce Orka, Halja and Sæunn board. Sea-chests are shifted for a meeting; Sæunn remains standing behind Orka while Grend stands behind Elvar. The conversation exchanges news of the sons, prisoner, writings and Vol, and ends with a promise of reciprocal favours. Uspa is not surrendered and the ship is not shown departing Starl here.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>At Starl a wagon of provisions is unloaded aboard, and all the goods Elvar sent Uspa to purchase are stowed on deck. The crew prepare kit, sea-chests and oars. Elvar assigns Sighvat the tiller; Uspa, Ulfrir and Skuld are at the prow before she orders them back to stern seats.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>At Elvar’s cast-off order the rope is untied and thrown aboard, Sólín leaps onto the top-rail and starboard oars push clear of the pier. The ship gathers speed through ice-bright water and white foam. Elvar stands in the hollow before the carved serpent-head prow while Sighvat steers towards the lake’s southern river mouth, with the Hvítá and Snakavik named as the onward route. No arrival is shown.</p></details><details><summary>The Hunger of the Gods · 50</summary><h2>The wolf&#x27;s call across the lake</h2><p>Orka sees the ship across the lake at Starl, with Ulfrir, Skuld and Uspa at the prow. Ulfrir’s voice enters her head during the pause. She watches the ship moving away with water glittering on its working oars, then turns back to her companions. No new destination or arrival is shown from this viewpoint.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Rowing and a merchant ship intercepted</h2><p>Since Starl she makes good time down the Hvítá under Sighvat’s steering. Two half-crew shifts maintain twenty-four working oars from dawn to night camp, intended to preserve the company’s strength. Elvar takes her old rowing place rather than remaining at the tiller; Ulfrir sits cloaked among stored cargo.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Rowing and a merchant ship intercepted</h2><p>She slows to intercept an upriver merchant knarr, then ships oars while Elvar buys news rather than boarding. Sighvat returns her to course. Later she passes under a wooden bridge carrying eastbound dragon-worshippers; Elvar declines Grend’s proposed attack. Snaka’s skull and the fortress are visible beyond the bend, before any docking.</p></details><details><summary>The Fury of the Gods · 33</summary><h2>The tide and the search for Grend</h2><p>At Snakavik it has been hauled out for repairs: damaged strakes repaired, gaps packed with tarred horsehair, marine growth scraped and hull coated in pine tar/resin. Back at the pier, mast set and sail furled, most Battle-Grim aboard with oars ready, it receives Hrung. Grend is brought to the pier before any actual sailing is shown.</p></details><details><summary>The Fury of the Gods · 35</summary><h2>The fleet leaves Snakavik</h2><p>It leaves Snakavik fjord and turns south along the coast under oars against a south-easterly, leading fifty longships and as many knarr. An old-sail enclosure around the mast gives privacy for Grend’s questioning, with Hrung’s pedestal lashed by rope and iron rings. No destination arrival occurs.</p></details><details><summary>The Fury of the Gods · 38</summary><h2>Following the Falinn to Wolfdales</h2><p>It turns into River Falinn on Ulfrir’s directions, sets sail when the wind shifts behind, then adds half the oars after half a day upriver. Sail and mast are lowered beneath a stone bridge before it docks at Wolfdales; Skuld secures Orv’s rope. The company and collared Grend disembark and Hrung is carried ashore. Other ships arrive at ancient piers, without proof every fleet vessel has completed mooring.</p></details><details><summary>The Fury of the Gods · 91</summary><h2>Return to the ruined homestead</h2><p>Elvar Chainbreaker has been laid to rest in the ship’s hull; no new description of the ship’s condition, location or funeral rite is given.</p></details></noscript>
