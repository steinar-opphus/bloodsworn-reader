      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 19</summary><h2>Earlier report - The Fury of the Gods chapter 19</h2><p>Ulfrir identified the pier defenders as his Úlfhéðnar children and said they stayed hidden nearby for fear of collars. Elvar ordered him to bring them without promising freedom.</p></details><details><summary>The Fury of the Gods · 23</summary><h2>Previously hidden near Snakavik after aiding Ulfrir at the docks, they now follow him into the tower</h2><p>Previously hidden near Snakavik after aiding Ulfrir at the docks, they now follow him into the tower. Berak estimates two score or more. Men and women are lean, wary and hungry-looking; some wear mail and cared-for weapons, most simpler tunics/cloaks with perhaps a seax or axe. No individual name or exact roster is given.</p></details><details><summary>The Fury of the Gods · 23</summary><h2>Previously hidden near Snakavik after aiding Ulfrir at the docks, they now follow him into the tower</h2><p>One haggard man offers oaths if Ulfrir wishes. Uspa proposes oaths to Elvar plus Ulfrir’s command to serve her, he nods and Elvar orders immediate implementation without new collars. The text passes to their departure without exact oath words. Elvar conditionally says the arrangement doubles her Tainted force, not an independently counted total; future loyalty remains untested.</p></details><details><summary>The Fury of the Gods · 33</summary><h2>More arrive and swear, bringing Ulfrir’s gathered wolf-blood warriors close to a hundred</h2><p>More arrive and swear, bringing Ulfrir’s gathered wolf-blood warriors close to a hundred. This is approximate current strength of his following, distinct from earlier counts and the total host. They join the move towards the docks under the noon-departure pressure, without a narrated fleet departure.</p></details><details><summary>The Fury of the Gods · 35</summary><h2>The fleet leaves Snakavik</h2><p>Most are distributed as rowers among Elvar’s ships, with only a handful permitted to remain near Ulfrir and Skuld at the stern. The fleet now sails south, but no Wolfdales arrival is shown.</p></details><details><summary>The Fury of the Gods · 38</summary><h2>Following the Falinn to Wolfdales</h2><p>A handful follow Ulfrir from Wave-Jarl onto the pier and up the stone road to the den, while most remain distributed across the fleet’s crews. No exact shore-party count or new collar status is given.</p></details></noscript>
