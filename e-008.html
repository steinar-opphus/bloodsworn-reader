      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 1</summary><h2>The hunt and the ruined steading</h2><p>Breca calls Snaka a serpent.</p></details><details><summary>The Shadow of the Gods · 1</summary><h2>The hunt and the ruined steading</h2><p>In Thorkel’s tale, Snaka is the father of the gods. He is called Eldest. Thorkel names Eagle, Bear, Wolf and Dragon among his children.</p></details><details><summary>The Shadow of the Gods · 1</summary><h2>The hunt and the ruined steading</h2><p>According to that tale, Snaka is slain by his children. His death shatters the world. The distant mountains are his bones covered with earth.</p></details><details><summary>The Shadow of the Gods · 1</summary><h2>The hunt and the ruined steading</h2><p>Orka says Snaka’s fall opened the vaesen pit. She says creatures from the world below were released into their land.</p></details><details><summary>The Shadow of the Gods · 21</summary><h2>Snakavik and the Boneback Mountains</h2><p>In B01-C021 the narration identifies the colossal skull at Snakavik as Snaka’s and describes his fall there on Guðfalla. It describes the broken ground admitting the sea to form the fjord and earth settling around his body to create the continental mountain range. His skull, spine and ribs remain after the flesh rotted.</p></details><details><summary>The Hunger of the Gods · 24</summary><h2>A rescue planned in Darl</h2><p>Jökul recounts sagas in which Snaka moulds people from the world’s mud and gives them life with Seiðr-breath. He rubs mud into his hands to remember their origin, mortality and fleeting lives, adding that it improves his grip. This is his attributed saga account and ritual explanation, not an independently established creation history.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>Ulfrir names Skuggar as Snaka’s sister, contrasting her preference for shadows with his desire to be watched, and calling him the maker and her the unmaker. The listeners are startled. This is Ulfrir’s disclosure, not a direct appearance or a complete cosmology.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>Orka&#x27;s search in Starl</h2><p>Orka sees a grey-green rib arching above Horndal and feels a pulse in her head. She thinks Snaka’s power lingers, but the sensation intensifies into a wolf-like howl as a Battle-Grim-marked drakkar approaches. The bone is observed; the source of the sensation and any causal link to Snaka are not established.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Rowing and a merchant ship intercepted</h2><p>At the end of Elvar’s passage beneath the Hvítá bridge, Ulfrir says Father while looking ahead. Snaka’s skull stands as a distant black silhouette of fangs and eye sockets with Snakavik fortress on top. This is a new viewpoint of the existing remains, without a living appearance or resurrection.</p></details><details><summary>The Hunger of the Gods · 57</summary><h2>The skraeling attack on the farm</h2><p>The giant ravens Kló and Grok deny being vaesen and claim that Snaka made them as he made giants, Froa and the person addressed. Grok calls their former role messengers and eyes and ears, agreeing with Revna that they were spies, and says there were once more ravens. Kló says Lik-Rifa disliked this. Their testimony does not supply an independently verified creation history, a total population or the exact fate of other ravens.</p></details><details><summary>The Fury of the Gods · 18</summary><h2>The hunters turn towards the Slågen</h2><p>Krúsa attributes the making of Froa, Faunir, Näcken, farmed beasts and humans to Snaka, distinguishing them from the creatures she calls Lik-Rifa’s children. This is her creation account, consistent in part with the earlier ravens’ testimony but not independently verified or exhaustive.</p></details><details><summary>The Fury of the Gods · 23</summary><h2>Hrung’s account and Grend’s secret</h2><p>Hrung claims to have killed Snaka by poisoning his own body and deliberately being swallowed during Guðfalla, after the serpent consumed his entire clan. He speculates that Snaka’s magic or blood explains his continuing life, but explicitly says he does not know. This first-person history and uncertain mechanism are not promoted to a witnessed death scene or fixed bloodline.</p></details><details><summary>The Fury of the Gods · 51</summary><h2>Ulfrir’s trust and the roof ward</h2><p>Ulfrir credits Snaka with planting the Oskutreð-seed tree and Jarnvidr, gifting him its land, singing Gelta asleep and teaching waking words. These are his ancient-history claims, not a newly witnessed act by Snaka.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>The wounded dragon, carrying Rotta, is seen retreating north-west toward the skull’s gaping jaws</h2><p>The wounded dragon, carrying Rotta, is seen retreating north-west toward the skull’s gaping jaws. This is a direction, not a witnessed new arrival or restored living Snaka.</p></details><details><summary>The Fury of the Gods · 74</summary><h2>Snaka rises and Wolfdales collapses</h2><p>His skull stirs as the Bonebacks erupt; amber light fills the sockets and grey-green scales/fresh flesh grow over the bones. A blue-black tongue and muscular neck return, and he explicitly rises from long death. His wordless presence roars in Orka’s mind. The means of resurrection is not witnessed.</p></details><details><summary>The Fury of the Gods · 74</summary><h2>Snaka rises and Wolfdales collapses</h2><p>Shed mountain rock raises a wave that destroys the fleet entering Snakavik fjord. He rears, dives and resurfaces, raising coastal inundation and smashing another fleet; the Bonebacks and land heave. Lik-Rifa circles his head then flies toward Wolfdales and he follows over land, crushing forests/hills. No measured body length, universal fleet destruction or final confrontation is supplied.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>Leif’s death and the tunnel escape</h2><p>His actual arrival breaks through Wolfdales’ far hall wall, revealing a colossal grey-green horned/barbed head, curved fangs and black-blue tongue. He addresses Ulfrir as his son, his voice shaking Varg’s bones and constricting him with pressure. Ulfrir withdraws into a tunnel; no final confrontation is shown.</p></details><details><summary>The Fury of the Gods · 76</summary><h2>Surviving the plunge into the Falinn</h2><p>He strikes into the broken Wolfdales hall, the force felt from the distant riverbank, then lifts his head from the ruin. Orka and Glornir still feel his presence. No final opponent defeat or movement beyond this view is supplied.</p></details><details><summary>The Fury of the Gods · 78</summary><h2>He enters the enemy camp in human form, head-and-shoulders taller than Lik-Rifa/Rotta</h2><p>He enters the enemy camp in human form, head-and-shoulders taller than Lik-Rifa/Rotta. His milk-pale face is scale-mottled, nose sharply ridged, dark hair tied tight at the nape; red-gold fire flickers in his eyes and tooth tips protrude from dark-veined lips. He wears grey wool with gold serpent embroidery/red fur trim and a leather/gold belt.</p></details><details><summary>The Fury of the Gods · 78</summary><h2>He enters the enemy camp in human form, head-and-shoulders taller than Lik-Rifa/Rotta</h2><p>His presence produces fear/awe and a compulsion in Guðvarr to kneel. Rotta kneels and calls him maker/master/king, Lik-Rifa takes one knee as daughter and calls father/king, and Guðvarr follows. This records their submission and acclamation, not a new performed oath or literal universal ownership established by narrative.</p></details><details><summary>The Fury of the Gods · 80</summary><h2>Snaka’s heart and the interrupted feast</h2><p>Biórr feels his presence, kisses his hand and hears him claim creation/ownership through Rotta’s lineage. Long fingers/black nails and a long-dead odour are observed. At the meal he tolerates no command from his daughter, wounds her scalp and claims everything belongs to him; those declarations are not independently proven cosmology. His black-eyed gaze wording is retained for review against the prior red-gold human description.</p></details><details><summary>The Fury of the Gods · 80</summary><h2>Snaka’s heart and the interrupted feast</h2><p>The siblings’ poison spreads black through his veins, but murmured words reverse it and he spits hissing black matter, beginning to rise. Lik-Rifa pins his hand and Rotta slits his throat; he strikes Rotta but slumps to the table as the ground cracks. Rotta removes his heart, then an unnamed tennúr steals it before either sibling eats. The scene does not establish permanent impossibility of another return.</p></details><details><summary>The Fury of the Gods · 81</summary><h2>Varg’s narration now explicitly calls the throat-cutting/heart extraction a murder</h2><p>Varg’s narration now explicitly calls the throat-cutting/heart extraction a murder. Ulfrir warns the siblings must not consume the heart because of its power. This confirms the killing at this cutoff without stating permanent impossibility of resurrection or actual transfer of power.</p></details><details><summary>The Fury of the Gods · 89</summary><h2>Grok/Kló invoke Father-Snaka when seizing/dropping Rotta in revenge for his killing</h2><p>Grok/Kló invoke Father-Snaka when seizing/dropping Rotta in revenge for his killing. No resurrection or further direct act by Snaka is shown.</p></details><details><summary>Illustration · The Fury of the Gods · 89</summary><p><a href="assets/82a301355c5056.jpg">Open noncanonical illustration</a></p><p>Grok and Kló lifting Rotta in revenge for Snaka.</p></details><details><summary>Illustration · The Fury of the Gods · 75</summary><p><a href="assets/6db2783ef006df.jpg">Open noncanonical illustration</a></p><p>Snaka appearing through the shattered hall wall as Ulfrir withdraws.</p></details><details><summary>Illustration · The Fury of the Gods · 80</summary><p><a href="assets/37be3fc75eb662.jpg">Open noncanonical illustration</a></p><p>Snaka expelling the poison before the knife attack.</p></details><details><summary>Illustration · The Fury of the Gods · 78</summary><p><a href="assets/9b5bd529e2431f.jpg">Open noncanonical illustration</a></p><p>Snaka’s human form in the snowy enemy camp.</p></details><details><summary>Illustration · The Fury of the Gods · 74</summary><p><a href="assets/9aca3371fbb0bb.jpg">Open noncanonical illustration</a></p><p>Snaka rising from the fjord and shedding the mountain’s rock.</p></details><details><summary>Illustration · The Fury of the Gods · 80</summary><p><a href="assets/b1d8da09570245.jpg">Open noncanonical illustration</a></p><p>The unnamed tennúr’s flight; its stolen cargo is hidden from view.</p></details></noscript>
