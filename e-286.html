      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 51</summary><h2>The boarding battle at sea</h2><p>This unidentified force attacks the Sea-Wolf from two smaller longships, each estimated at thirty to forty oars. The ships approach under favourable wind, then lower sail and row to opposite flanks. A raven-haired man in furs stands with an axe in the nearer prow, but no leader, ship name, owner or allegiance is established. Røkia’s warning about local pirates remains an assessment.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>The boarding battle at sea</h2><p>The first dozen boarders, with more behind, are men and women mostly in wool and leather, some in tattered mail, carrying shields, spears and axes. They are silent and dead-eyed and advance in a stumbling rush. A woman fights after a spear passes through her neck and later grips Varg’s ankle; another man swings and pulls despite a spear in his chest. The cause of this endurance is unknown.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>The boarding battle at sea</h2><p>One close assailant has thin greasy hair, pockmarked skin, jagged brown teeth and breath like rotted seaweed. His broad slimy tongue moves sinuously and opens at its tip like a small toothed mouth. This unpaged individual is E-288, without an established creature type, parasite or identity with the prow warrior.</p></details><details><summary>The Hunger of the Gods · 51</summary><h2>The boarding battle at sea</h2><p>Varg releases his wolf when surrounded, attacks with claws, teeth and seax and ends standing above corpses with no enemy immediately before him. This does not verify Glornir’s no-survivors intention across both ships, account for all fighters or establish a whole-battle result.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>Chapter 53 identifies the mouth organisms as tungumatur, or tongue-eaters, named by Sulich. Glornir extracts a long hooked and branching specimen from a still-moving wounded host, which then stops. Sulich describes host control and spread, while admitting the mechanism is unknown to him. The parasites are distinct from the human host force and the two ships.</p></details><details><summary>The Hunger of the Gods · 53</summary><h2>The island pool and the tungumatur</h2><p>One attacking ship escapes and is pursued to an island settlement. The hosts continue fighting there and around a pool with a giant tongue-eater and bound druzhina. The giant is killed and individual smaller parasites are destroyed, but Edel’s search is unfinished at the cutoff. Names, original owners and the full infection history of the boarding ships remain unestablished.</p></details></noscript>
