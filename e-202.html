      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Hunger of the Gods · 2</summary><h2>Introduction</h2><p>The surviving gaoler with braided red hair and rust-coloured wings names herself Skuld in book two, chapter 2. This identifies the previously unnamed red-winged member of the existing three-sister group, not a new fourth sister.</p></details><details><summary>The Hunger of the Gods · 2</summary><h2>The Hunger of the Gods - chapter 2</h2><p>She awakens bound, breaks the leather cords and takes Sighvat&#x27;s axe, throwing Grend aside. Elvar knocks her into a wagon, locks a thrall-collar around her neck and forces submission with blood and commands. Elvar declares her a thrall.</p></details><details><summary>The Hunger of the Gods · 2</summary><h2>The Hunger of the Gods - chapter 2</h2><p>Grend tells her her sisters died fighting Lik-Rifa; she grieves and says the real treasure lies below Oskutreð. His report and her treasure claim retain their speakers.</p></details><details><summary>The Hunger of the Gods · 4</summary><h2>The descent beneath Oskutreð</h2><p>She identifies herself as Orna and Ulfrir&#x27;s daughter and compares her collar with Elvar&#x27;s oath. She says the sisters stayed on an oath to their father, sometimes hunting above through vents, and failed to kill or starve Lik-Rifa. Her blame of Lik-Rifa for the war remains her account.</p></details><details><summary>The Hunger of the Gods · 4</summary><h2>The descent beneath Oskutreð</h2><p>She credits Verdani with the recovered arrows, recognises Orv&#x27;s bow as her sister&#x27;s, and says Lik-Rifa fed on passing souls and other subterranean food. She does not know the halls beyond the Corpse-Gate or the protected book&#x27;s nature.</p></details><details><summary>The Hunger of the Gods · 6</summary><h2>The swarm in the depths</h2><p>Her red-glowing collar draws her down at Elvar’s summons. Ordered to fight, she tears apart the creature attacking Elvar and attacks others approaching her and Grend.</p></details><details><summary>The Hunger of the Gods · 6</summary><h2>The swarm in the depths</h2><p>After the battle Elvar forces her to kneel, strikes her and cracks her nose. Her collar burns her flesh as she resists; she gives a curt nod after Elvar threatens her against betrayal.</p></details><details><summary>The Hunger of the Gods · 6</summary><h2>The swarm in the depths</h2><p>She asks for her father’s return, promising eternal faithful service in exchange, and says he has the best chance among the firstborn of defeating Lik-Rifa. She predicts the dragon will seek to rule everywhere.</p></details><details><summary>The Hunger of the Gods · 6</summary><h2>The swarm in the depths</h2><p>She says the forge is functional and that she and her sisters used it to make objects including Orv’s arrowheads. This broader testimony does not erase her earlier specific attribution of the arrows to Verdani.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>A collar and the wolf-god&#x27;s return</h2><p>She warns that her father will dislike the collar but says she wishes him to live. After Ulfrir’s resurrection and collapse into human form, she cradles his head as he recognises her. She tells him her mother and sisters are all dead.</p></details><details><summary>The Hunger of the Gods · 17</summary><h2>An uneasy bargain with Ulfrir</h2><p>Her rust-red wings furled, she tends her father in the wagon, helps him drink and warns him that disobeying Elvar will bring collar-fire. She blames Lik-Rifa and Snaka for their losses. She later supports Ulfrir at the bridge rock.</p></details><details><summary>The Hunger of the Gods · 17</summary><h2>An uneasy bargain with Ulfrir</h2><p>During the tennúr attack she fights with fists and wings beside Ulfrir. After the swarm breaks she is on the ground, then pushes herself to one knee. Her survival is shown; no new death or complete healing is inferred.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>A duel for the Battle-Grim</h2><p>After Uspa treats their wounds, she and Ulfrir sleep through the march and night. She is later awake beside him among the spectators watching Elvar’s duel. No complete recovery is established.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>She offers to help kill Lik-Rifa and corrects Ketil’s saga questions: about five hundred dragon-born rather than a hundred, fifty sea serpents rather than a dozen, and the southern god Krodil rather than Berser as Ulfrir’s swimming rival. These remain her historical accounts, not new witnessed events.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>She credits Orna with finding the soul road and luring Lik-Rifa to Oskutreð through her fascination with life and death. She says Lik-Rifa was secretly building a vaesen army to kill the other gods and that Rotta warned them. The claims do not prove Orna created the road or supply a universal origin for vaesen.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>After Ulfrir kills Ketil and Elvar punishes him, she flies up and urges him to submit. On Elvar’s order she lands and kneels. Commanded to gouge out an eye, she trembles as her collar glows red and a taloned finger moves towards it. Ulfrir tries to intervene and is punished; after his plea Elvar stops her hand. No eye is removed.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>When Elvar ends Ulfrir’s pain she calls this the new world for now, stresses that he lives and recalls their aims of killing Lik-Rifa and avenging Orna. This is a stated priority under coercion, not evidence of permanent willing submission.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The laden ship reaches Starl</h2><p>On approach to Starl she is aboard with Ulfrir and Uspa while Elvar tries to prevent the crew talking about the two gods. When Ulfrir intervenes in the standoff over Uspa, Skuld follows with a wool cloak cast around her wings. Their bulk gives her a hunched, unusually muscled outline; no new transformation or wing loss occurs.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>Ulfrir introduces her as his daughter to Orka’s party, rather than revealing a new relationship to the reader. She sits beside him, watches Orka intently and nods. Orka wonders whether she is the Skuld of the guardian-sister sagas; the hawk comparison describes her gaze, not a new animal change.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>At Halja’s report of Orna’s talon she calls Orna mother and asks whether Elvar could bring her back too. Elvar ignores the question and returns to the prisoner. No agreement, new ritual or demonstrated power to restore Orna follows.</p></details><details><summary>The Hunger of the Gods · 44</summary><h2>Rotta&#x27;s ruined face and restored illusion</h2><p>At Nastrandir Rotta says fear of Skuld and her sisters kept him from Lik-Rifa’s prison. Lik-Rifa reports two gaolers dead but says she cannot recall Skuld’s fate. This records the speakers’ past account and her ignorance, not Skuld’s death or a change to the living Skuld’s established state.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>She stands with Uspa and Ulfrir at the prow looking towards the riders on the shore. When Elvar orders them back to the stern she glares; Elvar privately doubts she will ever become used to orders. This is not a new rebellion or a declaration of willing submission.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>She says she liked Orka. After Ulfrir predicts that they will see Orka again, she follows him down the deck. No alliance, new kinship or arranged meeting is established.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Rowing and a merchant ship intercepted</h2><p>She watches the land while Ulfrir sits cloaked among cargo. During the merchant encounter she invokes being born of Ulfrir and Orna and threatens to kill those raising weapons. Elvar insists that she kill only on command and seeks news instead. No killing or new demonstrated power follows the threat. Later she watches the bridge travellers beside Elvar as Ulfrir identifies their allegiance.</p></details><details><summary>The Hunger of the Gods · 61</summary><h2>The Battle-Grim return to Snakavik</h2><p>Elvar returns her gold-fitted sword and belt, which she fastens over fish-scale brynja. Sword use remains restricted to Elvar&#x27;s command or protection of her people. At Snakavik she conceals her wings under a cloak.</p></details><details><summary>The Hunger of the Gods · 71</summary><h2>The wolf-god wrecks Störr&#x27;s hall</h2><p>She flies through the ruined hall with russet wings, knocks Thorun aside and captures Störr. Silrið singes her feathers, but she brings him before Ulfrir and throws him into his jaws at Elvar&#x27;s nod.</p></details><details><summary>The Fury of the Gods · 9</summary><h2>After Ulfrir disperses the serpent glamour, she rises into the air drawing her sword</h2><p>After Ulfrir disperses the serpent glamour, she rises into the air drawing her sword. While Uspa binds the enemy witch&#x27;s mouth, she descends and strikes the woman, who falls bleeding. The witch&#x27;s final death is not separately established.</p></details><details><summary>The Fury of the Gods · 19</summary><h2>She favours war and says she also wants Lik-Rifa dead</h2><p>She favours war and says she also wants Lik-Rifa dead. At Svea’s report that Helka and the eagle-god were killed, she shrieks; no new action or policy is shown before the chapter ends.</p></details><details><summary>The Fury of the Gods · 23</summary><h2>She accompanies Ulfrir during the followers’ audience and his return to advise Elvar</h2><p>She accompanies Ulfrir during the followers’ audience and his return to advise Elvar. She locates the Wolfdales near Jarnvidr, her wings twitching, then leaves with him in a swirl of red feathers. No separate emancipation or new mission is shown.</p></details><details><summary>The Fury of the Gods · 35</summary><h2>The fleet leaves Snakavik</h2><p>At sea she reluctantly asks Elvar for silver-wrought scissors from the Oskutreð forge, saying they were her mother’s. Elvar retrieves the large, light, finely made pair with rune-carved silver handles and gives them to her. She accepts almost reverently, thanks Elvar, attaches them by leather loop to her belt and smiles at Ulfrir. The mother is already identified in earlier evidence as Orna; the scissors’ power remains unproved.</p></details><details><summary>The Hunger of the Gods · 4</summary><h2>The family of the wolf-god</h2><p>Earlier relationship context: Skuld identifies herself as Orna and Ulfrir’s daughter, establishing the mother meant in the keepsake claim.</p></details><details><summary>The Fury of the Gods · 38</summary><h2>Following the Falinn to Wolfdales</h2><p>She spreads her wings from Wave-Jarl, circles and lands on the ancient pier to take Orv’s rope and secure it to a mooring stone. She then accompanies Ulfrir ashore and along the road as he reveals the den and wakes its guardians. The chapter adds no new use of her scissors.</p></details><details><summary>The Fury of the Gods · 40</summary><h2>Councils and secrets in Wolfdales</h2><p>Her wings shudder when Ulfrir speaks of Lik-Rifa killing his wife and predicts she will attack him too. No new transformation or personal decision by Skuld is narrated.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>She stands near Ulfrir in fine mail, red hair and rust-coloured wings</h2><p>She stands near Ulfrir in fine mail, red hair and rust-coloured wings. Varg first mistakes the shape above her shoulders for armour, then sees the wings when she turns and whispers to Ulfrir. No new wing growth or transformation occurs.</p></details><details><summary>The Fury of the Gods · 43</summary><h2>Beside Ulfrir she initially rejects the report that Rotta lives freely</h2><p>Beside Ulfrir she initially rejects the report that Rotta lives freely. The god recalls his chains; Orlyg and Orka confirm seeing him. This records Skuld’s earlier ignorance, not a new return from death or confirmed still-chained state for the rat.</p></details><details><summary>The Fury of the Gods · 49</summary><h2>She hovers over the bridge gateway during the combined working, echoing Ulfrir’s chant</h2><p>She hovers over the bridge gateway during the combined working, echoing Ulfrir’s chant. Like him she cuts a palm and casts blood, which becomes bright falling sparks and feeds the channels. Side of the cut and an actual attack against the claimed protection remain unshown.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>Elvar physically removes her collar and declares her free without a separate oath</h2><p>Elvar physically removes her collar and declares her free without a separate oath. Asked why, Elvar invokes her already known father Ulfrir and relies on his justice oath if she abuses power. Skuld understands and thanks her. Her freedom is actual, not merely a proposal.</p></details><details><summary>The Fury of the Gods · 63</summary><h2>The stone doors and the retreat inside</h2><p>She swoops out as the doors reopen, red hair/wings in the sinking sunlight, and arrows bring trolls down while the stone guardians are surrounded. She skims above both wolves through the closing doors. The specifically blue-glowing arrow in the fight is traced to Orv rather than her.</p></details><details><summary>The Fury of the Gods · 65</summary><h2>Losses and plans after the retreat</h2><p>She stands at Ulfrir’s shoulder after the fight with a cut beneath one eye, side unspecified, otherwise returned uninjured. She joins his thanks to Elvar for freedom, then leaves with him. No full healing of the new cut is shown.</p></details><details><summary>The Fury of the Gods · 68</summary><h2>She flies behind Ulfrir as he reaches the hall, with stone guardians and Úlfhéðnar following</h2><p>She flies behind Ulfrir as he reaches the hall, with stone guardians and Úlfhéðnar following. No new Skuld wound, healing of her under-eye cut or separate arrow shot is narrated here.</p></details><details><summary>The Fury of the Gods · 69</summary><h2>Biórr’s doubts amid the fighting</h2><p>She misses Rotta with an arrow that hits the tree, then shoots while Ulfrir chases him and hits an unspecified back leg. His fall lets Ulfrir pin the tail before Biórr frees him. No new Skuld injury or full healing of the under-eye cut is stated.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>Leif’s death and the tunnel escape</h2><p>The group is directly present in Ulfrir’s gathering evacuation: Skuld above, both stone wolves alongside, Úlfhéðnar beneath, Battle-Grim/drengrs with Sighvat, Orlyg’s survivors and Sulich’s mounted remnants. The gate is blocked and they turn to the tunnels. This does not establish repaired guardians or a complete survivor tally.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>She flies into the woodland branches after emergence and later joins Ulfrir</h2><p>She flies into the woodland branches after emergence and later joins Ulfrir. She offers to scout but he refuses to risk her because she is too conspicuous/recognisable; no scouting sortie is performed here.</p></details><details><summary>The Fury of the Gods · 81</summary><h2>She flies above the charge and drives a spear into Rotta’s back as he attacks Ulfrir’s haunches</h2><p>She flies above the charge and drives a spear into Rotta’s back as he attacks Ulfrir’s haunches. The stone wolves then hit him; her final condition and the god battle’s outcome are unshown.</p></details><details><summary>The Fury of the Gods · 83</summary><h2>Skuld’s scissors and the spider’s venom</h2><p>She draws the long-bladed scissors at her belt, flies onto Lik-Rifa’s head and stabs one eye while crying For my mother. The dragon throws her into darkness; the following scene does not establish Skuld’s landing or survival. This uses the scissors as a weapon without proving another magical purpose.</p></details><details><summary>The Fury of the Gods · 87</summary><h2>Biórr returns Bjarn</h2><p>She is directly alive and flying again, climbs above the battle and sounds a horn echoing Ulfrir’s howl just before Faunir arrive. This resolves her survival from the earlier throw without a newly inspected injury/cure or explicit negotiation with the forest folk.</p></details><details><summary>The Fury of the Gods · 88</summary><h2>Thorkel avenged and the final advance</h2><p>She hovers above Ulfrir and blows the horn as the gods separate, prompting Glornir/Orka’s agreement that it is time. Her survival is direct; no new scissors location or hidden plan explanation is provided.</p></details><details><summary>The Fury of the Gods · 89</summary><h2>She swoops at Rotta with a bright sword while the last guardian clings to him</h2><p>She swoops at Rotta with a bright sword while the last guardian clings to him. This is a sword sighting, not a confirmed recovery/location of her scissors.</p></details><details><summary>The Fury of the Gods · 90</summary><h2>She survives at the field’s end, supports wounded human Ulfrir with his arm across her shoulder</h2><p>She survives at the field’s end, supports wounded human Ulfrir with his arm across her shoulder. Her scissors’ location remains unshown; no new wound/healing is diagnosed.</p></details><details><summary>Illustration · The Fury of the Gods · 87</summary><p><a href="assets/ad63c782561464.jpg">Open noncanonical illustration</a></p><p>Faunir emerging from the forest at dawn.</p></details><details><summary>Illustration · The Hunger of the Gods · 5</summary><p><a href="assets/7d308766f29cc8.jpg">Open noncanonical illustration</a></p><p>Skuld rises as her leather bonds break, before taking Sighvat&#x27;s axe.</p></details><details><summary>Illustration · The Hunger of the Gods · 5</summary><p><a href="assets/5a0fa80bfc7cde.jpg">Open noncanonical illustration</a></p><p>Skuld after naming herself, wearing Elvar&#x27;s thrall-collar.</p></details><details><summary>Illustration · The Hunger of the Gods · 71</summary><p><a href="assets/ffd5920d73661e.jpg">Open noncanonical illustration</a></p><p>Skuld hovers with Störr held captive before Ulfrir&#x27;s jaws.</p></details><details><summary>Illustration · The Fury of the Gods · 83</summary><p><a href="assets/31ebd0f5cb8649.jpg">Open noncanonical illustration</a></p><p>Skuld drawing her scissors before the eye attack.</p></details><details><summary>Illustration · The Fury of the Gods · 35</summary><p><a href="assets/865127e7180af1.jpg">Open noncanonical illustration</a></p><p>The silver scissors returned to Skuld.</p></details><details><summary>Illustration · The Fury of the Gods · 88</summary><p><a href="assets/bb25c389270dd9.jpg">Open noncanonical illustration</a></p><p>Skuld’s horn signal above the exhausted wolf and dragon.</p></details><details><summary>Illustration · The Fury of the Gods · 49</summary><p><a href="assets/b260375c8f69d9.jpg">Open noncanonical illustration</a></p><p>The combined working at the river gate.</p></details><details><summary>Illustration · The Fury of the Gods · 63</summary><p><a href="assets/17a8a49cddc3be.jpg">Open noncanonical illustration</a></p><p>The two guardians returning, one visibly damaged.</p></details></noscript>
