      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 6</summary><h2>A child and an injured vaesen</h2><p>Thorkel thinks he smells Näcken at the pool above the family steading.</p></details><details><summary>The Shadow of the Gods · 6</summary><h2>A child and an injured vaesen</h2><p>Orka thinks a Näcken should not be so far from its mountain river.</p></details><details><summary>The Shadow of the Gods · 28</summary><h2>The Näcken at the rapids</h2><p>A melody near the rapids draws Orka into memories and leaves Lif frozen at his oar. The Näcken has reed-like hair, jade-dark eyes and a distended mouth with needle-long teeth. The lulling music ceases for Orka underwater and returns when she breaks the surface. A large lyre with rotted-gut strings rests on mixed human and animal bones beneath the Näcken. The Näcken releases Mord after Orka&#x27;s first wound, then grabs her ankle as she pushes Mord towards shore. The Näcken&#x27;s shriek exerts pressure through the water and hurls Orka away. Lif helps Orka reach shore with a spear, and the Näcken retreats underwater; its death is not established. Orka plants iron blades in the bank and says Näcken dislike iron and sense it through the earth.</p></details><details><summary>The Shadow of the Gods · 28</summary><h2>The Näcken at the rapids</h2><p>The encountered river Näcken has a man-shaped outline with thick, slime-covered green arms and green-scaled wrists. Sunken branches frame its bone lair.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>Secrets in the Galdur tower</h2><p>In Skalk’s tower workroom something moves under an oily black pool. Skalk warns Guðvarr away and identifies its inhabitant as a Näcken; the creature’s form is not exposed.</p></details><details><summary>The Hunger of the Gods · 25</summary><h2>The assault on the workroom</h2><p>During the attack, slime-covered tentacles seize a horse’s legs beside the workroom pool and pull horse and rider underwater despite arrows. Movement remains under the pool after the room is wrecked. No human-like full body or wider power is established by this encounter.</p></details><details><summary>Illustration · The Shadow of the Gods · 35</summary><p><a href="assets/9e09b77b25c69b.jpg">Open noncanonical illustration</a></p><p>The Näcken in its river lair during the rapids encounter.</p></details></noscript>
