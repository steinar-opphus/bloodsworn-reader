      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 20</summary><h2>Scouts report the fugitives</h2><p>A tennúr scout perches on Krúsa’s shoulder and reports humans and iron-collared wolf-bloods roughly west of the camp. His mouth has two rows of teeth, needle-sharp in front and broad/flat behind; his hands each show five long fingers and a stunted thumb with claw-like nails. His other physical traits are not individually described.</p></details><details><summary>The Fury of the Gods · 20</summary><h2>Scouts report the fugitives</h2><p>He estimates a day or less to the group and thinks they can be caught before the big river. Guðvarr reads his three hand-counting rounds as thirty-six, but he says perhaps more or fewer and admits being bad with numbers. Krúsa rewards him twice with teeth from her pouch, with no donor identified. No named fugitive sighting or exact count is established.</p></details><details><summary>The Fury of the Gods · 31</summary><h2>The hunters enter Jarnvidr</h2><p>He hovers over Skapti during the march, then investigates a woodland disturbance at Krúsa’s hand signal. Returning, he announces a prisoner as frost-spiders bring the bound Faunir onto the road. No independent claim that he captured it himself is made.</p></details><details><summary>The Fury of the Gods · 34</summary><h2>A bargain in the forest glade</h2><p>He scouts the negotiation glade and whispers to Krúsa, whose count is fifteen Úlfhéðnar and twenty-two drengrs. The negotiators agree Munni or his people will provide future communication with Estrid/Skalk. Other tennúr warn of Faunir before the attack; the text does not assign every cry to Munni personally.</p></details><details><summary>The Fury of the Gods · 41</summary><h2>Ilska asks about Orka</h2><p>He returns to Krúsa’s shoulder and relays fresh news from Estrid/Skalk that the wolf has moved to his Jarnvidr den. He says he checked independently, seeing many ships on the river and stone wolves at the doors, and concludes Ulfrir is there. No explicit direct sight of the god or interior entry is claimed. Lik-Rifa praises him.</p></details><details><summary>The Fury of the Gods · 45</summary><h2>Guðvarr wonders whether the dawn messenger is Munni, but the tennúr is not named with certainty</h2><p>Guðvarr wonders whether the dawn messenger is Munni, but the tennúr is not named with certainty. The warning alone cannot establish Munni’s presence or the approaching force’s identity.</p></details><details><summary>The Fury of the Gods · 50</summary><h2>He is explicitly identified as the tennúr who whispers news to Rotta at the evening council</h2><p>He is explicitly identified as the tennúr who whispers news to Rotta at the evening council. Rotta attributes reports of defences and disaffected Wolfdales insiders to his contact. The insiders remain unnamed and their conditional offer unverified; this does not retroactively identify the uncertain dawn warning messenger.</p></details><details><summary>The Fury of the Gods · 53</summary><h2>A night march under false campfires</h2><p>Rotta attributes intelligence about enemy aerial observers to Munni and bases his night deception on it. The observers are not individually named in this report, and successful deception is not yet shown.</p></details><details><summary>Illustration · The Fury of the Gods · 20</summary><p><a href="assets/6aafddecaebc3a.jpg">Open noncanonical illustration</a></p><p>Munni; unspecified traits are artistic choices.</p></details></noscript>
