      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 51</summary><h2>Ulfrir’s trust and the roof ward</h2><p>An open canopy at the hilltop admits light, wind and sound, while an invisible dome stops Elvar’s hand with blue ripples and supports her weight. Ulfrir says no flesh/bone can pass without the words; he demonstrates Úlfavinur, opinn to open and Úlfavinur, náinn to close, and Elvar passes with him. He says he made it for Orna and trusts Elvar as the only hearer outside his family. These claims do not amount to an attack test or proof no secret has leaked.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>The top ward stops an unnamed Raven-Feeder and knocks the dragon back, blue across the ceiling</h2><p>The top ward stops an unnamed Raven-Feeder and knocks the dragon back, blue across the ceiling. Rotta’s Úlfavinur, opinn makes the domed spell fade, allowing the gods and fleeing forces through into daylight. The stair ends at the grassy hill crown, where fleets are seen; no smashed physical roof or complete map is supplied.</p></details><details><summary>Illustration · The Fury of the Gods · 72</summary><p><a href="assets/146eb07fa5bcf1.jpg">Open noncanonical illustration</a></p><p>The fleets seen from the crown of Wolfdales at dawn.</p></details><details><summary>Illustration · The Fury of the Gods · 72</summary><p><a href="assets/a31ae3fafb144b.jpg">Open noncanonical illustration</a></p><p>The roof ward stopping the dragon before Rotta opens it.</p></details><details><summary>Illustration · The Fury of the Gods · 51</summary><p><a href="assets/e4846375734133.jpg">Open noncanonical illustration</a></p><p>Elvar testing the firm surface of the rooftop ward.</p></details></noscript>
