      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 77</summary><h2>The survivors’ camp and reunion</h2><p>The tunnel survivors clear snowy woodland at last daylight, find water, tend wounds and set Hrung upright. Sighvat/Grend bind Elvar’s corpse and the camp honours her. Food is scarce; hunters return and a fire is screened by woven branches. Ulfrir’s council seeks information/allies, then Vesli brings the river-party Bloodsworn to join them. Exact location, layout and complete survivor count remain unspecified.</p></details><details><summary>The Fury of the Gods · 79</summary><h2>Late snowy night finds the reunited warriors cleaning kit and council seeking a plan</h2><p>Late snowy night finds the reunited warriors cleaning kit and council seeking a plan. Vesli reports the gods’ riverbank camp, then rests with Breca; Frek/Sæunn reflect on freedom. Halja clarifies friendship and Røkia/Varg choose each other. Hrung begins to raise Elvar’s plan before Ulfrir can leave for an ally, without its contents yet disclosed.</p></details><details><summary>Illustration · The Fury of the Gods · 79</summary><p><a href="assets/b258543c977818.jpg">Open noncanonical illustration</a></p><p>Røkia taking Varg’s hand and declaring her choice.</p></details><details><summary>Illustration · The Fury of the Gods · 77</summary><p><a href="assets/351bb7176446cb.jpg">Open noncanonical illustration</a></p><p>Glornir’s party entering the survivors’ snowy camp.</p></details><details><summary>Illustration · The Fury of the Gods · 77</summary><p><a href="assets/23e1563f8a5e7a.jpg">Open noncanonical illustration</a></p><p>The survivors’ silent memorial for Elvar Chainbreaker.</p></details></noscript>
