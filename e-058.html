      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 5</summary><h2>The landing on Iskalt</h2><p>Sighvat names the warband the Battle-Grim. He calls them hunters of the Tainted.</p></details><details><summary>The Shadow of the Gods · 5</summary><h2>The landing on Iskalt</h2><p>Agnar is Elvar’s chief. Elvar is the youngest of his warband.</p></details><details><summary>The Shadow of the Gods · 5</summary><h2>The landing on Iskalt</h2><p>They face villagers who attack after Agnar wounds Hrut.</p></details><details><summary>The Shadow of the Gods · 7</summary><h2>The troll beside the molten pool</h2><p>A dozen villagers fell at the Iskalt village and Thrud was wounded in the calf. Twenty-six warriors followed Agnar into the hills.</p></details><details><summary>The Shadow of the Gods · 7</summary><h2>The troll beside the molten pool</h2><p>They encounter a troll and lose warriors to its attacks. They capture the woman and child.</p></details><details><summary>The Shadow of the Gods · 9</summary><h2>The serpent and the captive family</h2><p>Agnar gives warriors kill-trophies when he thinks they have earned them. They store butchered troll parts for sale.</p></details><details><summary>The Shadow of the Gods · 21</summary><h2>Blood tested in Snakavik</h2><p>Huld and Sólín carry red shields with a painted spear and axe, identified in B01-C021 as the Battle-Grim sigil. Störr addresses their chief as Agnar Broksson. At Snakavik, Thrud is sent to find lodgings while the chief’s party presents Berak for sale; Agnar accepts the offer and Berak is handed over.</p></details><details><summary>The Shadow of the Gods · 27</summary><h2>A raid and a stolen child</h2><p>Thrud is dead with wounds in his throat and back. The tavern&#x27;s loft hatch has been wedged shut with its ladder, trapping the Battle-Grim above. Sighvat breaks through the roof and Grend releases the hatch. Agnar and the Battle-Grim pursue the attackers to the docks but arrive after their ship has departed.</p></details><details><summary>The Shadow of the Gods · 32</summary><h2>The promise of Oskutreð</h2><p>Twelve days have passed since the blood oath, and the Battle-Grim have rowed almost a hundred leagues. The Battle-Grim land after midday on their second day on the lake and assemble their wagons in a secluded inlet. The crew answers Agnar&#x27;s request to follow with cheers and oaths.</p></details><details><summary>The Shadow of the Gods · 42</summary><h2>Survivors and the family Agnar chose</h2><p>The tally after the Isbrún crossing records three warriors killed, a wagon and two ponies lost, and almost everyone injured. The survivors treat their wounds and camp again after roughly half a day&#x27;s march; Agnar orders rest according to fatigue rather than darkness during the perpetual day.</p></details><details><summary>The Shadow of the Gods · 48</summary><h2>The guardian of Oskutreð</h2><p>Forty mailed warriors and four pony-drawn carts reach Oskutreð. Agnar promises to avoid the dead tree and the company collects relics from the plain. Ilska’s company arrives while they work.</p></details><details><summary>The Shadow of the Gods · 52</summary><h2>Chapter 52 — Facing the Raven-Feeders</h2><p>After Agnar’s death Grend rallies the company. Their shield wall holds and drives the Raven-Feeders back until the rupture beneath Oskutreð scatters the battle. Elvar and Grend are among the survivors.</p></details><details><summary>The Shadow of the Gods · 52</summary><h2>Chapter 52 — Facing the Raven-Feeders</h2><p>Before the charge the Battle-Grim overlap their shields at Grend&#x27;s command; the Raven-Feeders halt ten paces away.</p></details><details><summary>The Hunger of the Gods · 2</summary><h2>A burial and a surviving gaoler</h2><p>Little more than thirty remain after burying Agnar. Sighvat agrees that wearable finds stay with their finders and wagon treasure is shared equally. Elvar plans to seek the company&#x27;s help recovering Bjarn after the looting.</p></details><details><summary>The Hunger of the Gods · 2</summary><h2>A burial and a surviving gaoler</h2><p>Elvar subdues and collars the surviving gaoler, who names herself Skuld and says the real treasure is below Oskutreð.</p></details><details><summary>The Hunger of the Gods · 4</summary><h2>The descent beneath Oskutreð</h2><p>Twenty descend beneath Oskutreð with a pony wagon while ten guard the surface treasure. They load chests of precious metal, encounter the soul-road procession and reach a rune-protected black book. Huld triggers a blast at its boundary and an attacker emerges.</p></details><details><summary>The Hunger of the Gods · 6</summary><h2>The swarm in the depths</h2><p>A swarm attacks the company in Vergelmir. Orv’s arrows produce white-hot flame on impact, while Uspa’s bright light kills or drives back the creatures. Some Battle-Grim are dead after the fighting.</p></details><details><summary>The Hunger of the Gods · 6</summary><h2>The swarm in the depths</h2><p>Urt describes the company as fewer than forty spears. Huld wants to leave with the treasure, and Orv argues against raising another god. Elvar offers those outside her oath the freedom to leave, but appeals to the fame of slaying Lik-Rifa; the company has not reached a final decision at the chapter’s end.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>A collar and the wolf-god&#x27;s return</h2><p>They remain above ground and announce their support for dragon-slaying through Huld, with Sólín invoking vengeance for Agnar. Their wagons carry weapons, mail, precious metal, jewellery and bones, including a huge tusk whose possible connection to Svin is only Elvar’s question.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>A collar and the wolf-god&#x27;s return</h2><p>They have uncovered Ulfrir’s bones and join Uspa’s blood ritual. The wolf-god regains a body and life, then collapses and becomes a wounded man. The company’s willingness is now established, but his capacity to fight Lik-Rifa remains uncertain.</p></details><details><summary>The Hunger of the Gods · 17</summary><h2>An uneasy bargain with Ulfrir</h2><p>Four loaded wagons slow the exhausted company. Huld challenges Elvar’s authority and seeks rest and a successor to Agnar. Elvar recalls the custom of candidates and, if contested, holmganga. The succession remains undecided; Uspa’s bridge warning wins agreement to continue.</p></details><details><summary>The Hunger of the Gods · 17</summary><h2>An uneasy bargain with Ulfrir</h2><p>The bridge first fails to support Elvar and Uspa cannot restore it. Ulfrir’s blood and words bring it back; every warrior and all four carts reach the far plain. The nest’s tennúr bypass their three-row shield wall to attack Ulfrir’s wagon. The god, Skuld, Uspa and the warriors survive and scatter the swarm, with only a handful fleeing.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>A duel for the Battle-Grim</h2><p>They camp away from the tennúr hill after marching until dark. At Huld’s sunrise Althing, Sighvat and Grend decline leadership and Huld and Elvar become the candidates. Elvar acknowledges needing the company for her oath while rejecting treating them as expendable.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>A duel for the Battle-Grim</h2><p>A spear-bounded holmganga replaces unavailable hazel rods. Grend seconds Elvar and Urt seconds Huld; both candidates choose death. Elvar kills Huld and the company acclaims Elvar Fire-Fist as chief under Agnar’s bearskin cloak.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>A duel for the Battle-Grim</h2><p>The new chief orders a barrow for Huld and a southward return towards the Wave-Jarl. She judges the force fewer than forty spears and Ulfrir far from healed. Neither burial, departure, arrival nor rescue of Bjarn is completed in this chapter.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>The southward march reaches the Wave-Jarl and the warriors left to guard it, who ask about Oskutreð. Elvar regards feeding and rewarding the crew as her responsibility. Her conversational reference to forty warriors is not an exact reconciled muster. Ketil declines a fresh holmganga and accepts her chiefship; Sólín gains the teasing name Spittle in the fireside banter.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>Some warriors attack a visiting Froa: Ketil throws a spear into her chest and takes up a burning branch, while others hack at her root-like legs. She flings several aside. Ulfrir transforms, kills and partly eats Ketil, then forbids further harm to the Froa. No deaths among those thrown aside are established.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>Elvar punishes Ulfrir through the collar, then coerces him further by ordering Skuld to gouge out an eye and stopping her only after his plea. Skuld retains both eyes; Ulfrir promises to eat no more Battle-Grim. The company has returned to its ship, but no new voyage, rescue or dragon fight occurs.</p></details><details><summary>The Hunger of the Gods · 36</summary><h2>Orka&#x27;s search in Starl</h2><p>In Orka’s separate viewpoint a newly pitched serpent-prowed drakkar approaches Starl, lowers its sail and mast and takes to oars. Its hull lies deep as if carrying heavy cargo, a visual inference. Orka points out black crossed spear-and-axe shields on red and Halja recognises the Battle-Grim. The vessel is not explicitly named Wave-Jarl, no individual passenger is recognised and no meeting takes place before the chapter ends.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The laden ship reaches Starl</h2><p>Under Elvar’s command they cross Horndal in the Wave-Jarl with Oskutreð treasure, the heavy load making the ship sit low and move sluggishly. Short supplies force a Starl stop. Only Sighvat, Orv and Urt may go ashore, to prevent talk of the hoard and the two gods; no actual supply purchase is shown.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The laden ship reaches Starl</h2><p>Halja and Orka demand Uspa at the boarding plank. Elvar announces Agnar’s death and her succession, refuses to yield Uspa and prepares her sword arm as Orka raises her axe. Sighvat’s claim of forty crew is a spoken boast rather than a reconciled muster. Ulfrir interrupts and greets Orka as wolf-child, with the outcome still open.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>Elvar grants a conditional truce to Orka’s party in exchange for prisoner intelligence and admits the god’s resurrection and thralldom. Uspa refuses to leave, citing the rescue oath and her confidence in Elvar’s plan; the four oath-takers show their white scars. No new blood oath or merger with the Bloodsworn is made.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>They hear Halja’s excavation and Vol reports and Orka’s account of Myrk. Elvar and Sighvat challenge the western rendezvous with eastward tracks. Ulfrir proposes Nastrandir as a refuge, but they lack its location. Elvar and Orka agree to return a favour for help, leaving the services and any further shared course undisclosed.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>Elvar, Sighvat, Orv and Grend are revealed among the friendly hooded raiders at Starl’s stable. The staged clash gives Myrk a chance to escape for Orka’s planned pursuit. Sighvat takes real blows; Lif in Orka’s group had not been briefed.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>Afterward Elvar asks Orka to convey a double-price hiring offer and silver ring to Glornir, with Snakavik as a proposed meeting point. She says her side of the favour bargain is kept; no communication, acceptance or new joint company is completed.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>Elvar’s group spends the rest of the night talking with Orka’s companions before the first-light farewell. Sighvat’s sexual banter with Halja ends in shared laughter; he later says he would welcome the departing warriors in a shield wall. Elvar accepts Orka’s reminder that the Bloodsworn choose whether to take up the offer; no hiring is concluded.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>Uspa’s stores are stowed on the Wave-Jarl, and the company prepare equipment and oars. Elvar feels herself settling into chiefship, assigns Sighvat the tiller and orders cast-off. The ship leaves the pier and heads towards the southern river mouth, with the Hvítá and Snakavik ahead. No arrival or meeting with Elvar’s father occurs in the chapter.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Rowing and a merchant ship intercepted</h2><p>Some react with surprise when their chief resumes her old oar-chest. Sighvat handles steering and alternating half-crews keep twenty-four oars at work until night camp, giving good progress from Starl without exhausting them before Snakavik. Elvar restrains Skuld during a guarded merchant encounter and buys information instead of plundering.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Rowing and a merchant ship intercepted</h2><p>The merchant’s news alleges Störr’s muster and intended pre-emptive war against Helka over a suspected Orlyg alliance, with gossip explicitly named as its source. They return to the Snakavik course, pass dragon-worshippers crossing east over a bridge after Elvar rejects an attack, and see the fortress on Snaka’s skull in the distance. No landing or new battle occurs.</p></details><details><summary>The Hunger of the Gods · 61</summary><h2>The Battle-Grim return to Snakavik</h2><p>The company obtains a muster pass covering everyone and is directed to the fortress because the inns are full. They disembark armed while Uspa wards the treasure left aboard, then follow Elvar towards her father&#x27;s hall.</p></details><details><summary>The Hunger of the Gods · 65</summary><h2>Entry into Störr&#x27;s muster camp</h2><p>The crew presents itself as muster recruits. Syr escorts them into the fortress, but only Elvar, Grend, Sighvat, Uspa and Ulfrir enter the hall at this point. Admission does not establish allegiance or the jarl&#x27;s acceptance.</p></details><details><summary>The Hunger of the Gods · 71</summary><h2>The wolf-god wrecks Störr&#x27;s hall</h2><p>The crew joins the hall fight, with Orv shooting, Sólín carrying shield and longseax and Urt using a spear. Urt is pinned but no death is shown. They acclaim Elvar as jarl after she stops the Berserkir; wider mustered support remains incompletely established.</p></details><details><summary>The Fury of the Gods · 24</summary><h2>Rotta returns to Darl</h2><p>Rotta exposes the company’s connection to Ulfrir and Elvar at Snakavik, then identifies Biórr as someone who knows it intimately. Lik-Rifa asks for details. His answer and any attack remain beyond the ending; the company is not shown learning of the disclosure.</p></details><details><summary>The Fury of the Gods · 33</summary><h2>The tide and the search for Grend</h2><p>The company has searched Snakavik’s docks for Grend and most are now aboard the repaired Wave-Jarl with oars ready. Hrung is loaded as the larger host provisions, but Hjalmar’s arrival with Grend interrupts preparations before a completed departure.</p></details><details><summary>The Fury of the Gods · 35</summary><h2>They row south aboard Wave-Jarl as Elvar’s larger fleet leaves Snakavik</h2><p>They row south aboard Wave-Jarl as Elvar’s larger fleet leaves Snakavik. Grend’s private questioning occurs under a sail enclosure while most wolf-blood followers row across the crews. No Wolfdales arrival or Bloodsworn reunion is shown.</p></details><details><summary>The Fury of the Gods · 38</summary><h2>Following the Falinn to Wolfdales</h2><p>They travel upriver on Wave-Jarl to Wolfdales and disembark among Elvar’s guards, with Hrung carried on beams and Grend led ashore collared. They follow Ulfrir towards the gate opening; no completed occupation or interior layout is described.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>Elvar Chainbreaker and the hillside stand</h2><p>They stand two rows deep at the front and centre, Elvar joining between Grend and Sighvat, with more drengrs three deep behind. The stand follows the hall doors closing, and the enemy wall crashes into them before the outcome is given.</p></details><details><summary>The Fury of the Gods · 63</summary><h2>The stone doors and the retreat inside</h2><p>They accompany Elvar to the stone doors as the outside line breaks; she and her guards then enter before the closure. No individual new Battle-Grim casualty roll is supplied.</p></details><details><summary>The Fury of the Gods · 65</summary><h2>Losses and plans after the retreat</h2><p>The Bloodsworn and Battle-Grim sit together after the retreat, sharing food/talk while Sighvat and Einar arm-wrestle to encouragement and wagers. These immediate survivors do not supply an exact casualty roll or final battle victory.</p></details><details><summary>The Fury of the Gods · 73</summary><h2>Brák’s hostages and Einar’s fall</h2><p>Sighvat’s Battle-Grim and Orlyg’s warband fight together, pushing skraeling away from the dais toward the open doors while the hall burns. This is an ongoing local advance, without a final casualty tally or completed evacuation.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>Leif’s death and the tunnel escape</h2><p>The group is directly present in Ulfrir’s gathering evacuation: Skuld above, both stone wolves alongside, Úlfhéðnar beneath, Battle-Grim/drengrs with Sighvat, Orlyg’s survivors and Sulich’s mounted remnants. The gate is blocked and they turn to the tunnels. This does not establish repaired guardians or a complete survivor tally.</p></details><details><summary>The Fury of the Gods · 82</summary><h2>Their red shields bear black axe/spear emblems, and Sigrún names the group</h2><p>Their red shields bear black axe/spear emblems, and Sigrún names the group. Three front warriors remain unnamed by this viewpoint; the older one breaks Guðvarr’s shield and the line opens. The huge red-bearded axeman wounds Sigrún/kills Krúsa, while a lean thinning-haired comrade is killed by Krúsa. No physical resemblance is promoted into a named identity.</p></details><details><summary>Illustration · The Shadow of the Gods · 53</summary><p><a href="assets/bc7d096c1db406.jpg">Open noncanonical illustration</a></p><p>The opposing shield walls face one another before the Raven-Feeders charge.</p></details><details><summary>Illustration · The Hunger of the Gods · 28</summary><p><a href="assets/146336e987757a.jpg">Open noncanonical illustration</a></p><p>Sighvat fastens Agnar&#x27;s bearskin cloak around Elvar before proclaiming her chief.</p></details><details><summary>Illustration · The Hunger of the Gods · 28</summary><p><a href="assets/5b44680d1a5054.jpg">Open noncanonical illustration</a></p><p>Huld presses Elvar&#x27;s shield side during their duel for the Battle-Grim&#x27;s leadership.</p></details></noscript>
