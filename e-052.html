      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 5</summary><h2>Introduction</h2><p>Elvar is the youngest member of Agnar&#x27;s warband.</p></details><details><summary>The Shadow of the Gods · 5</summary><h2>Appearance</h2><p>She has blonde hair. At her first disembarkation she carries a sword, seax and axe, and a red shield bearing a crossed sword, axe and spear.</p></details><details><summary>The Shadow of the Gods · 9</summary><h2>Earning her place</h2><p>Elvar scouts with Grend and Biórr and helps kill a troll by finding its thigh artery with her sword. She has sailed with the Battle-Grim for a little over three years and holds a front-row shield-wall place. Agnar gives her a troll-tusk necklace, and later rewards her rescue of Berak&#x27;s son from the sea with a gold arm ring.</p></details><details><summary>The Shadow of the Gods · 21</summary><h2>Störr revealed as her father</h2><p>Returning to Snakavik brings back the insignificance Elvar once felt there. At the fortress she pulls back her hood and addresses Störr as her father. The relationship becomes known at this meeting; her earlier rejection of Biórr&#x27;s suggestion that Grend was her father remains a separate exchange.</p></details><details><summary>The Shadow of the Gods · 25</summary><h2>A marriage bargain she rejects</h2><p>Störr&#x27;s plans would marry her to Hakon and use her children to extend his rule. Elvar wants to earn a reputation of her own, rather than serve as a piece in her father&#x27;s plans. She seeks Hrung&#x27;s advice, but leaves as Störr approaches without a direct answer.</p></details><details><summary>The Shadow of the Gods · 32</summary><h2>Choosing the Battle-Grim</h2><p>She chooses the Battle-Grim over her father. Her judgement of the blond attacker as Tainted remains uncertain: she later points out that the fight was dark and brief. She gives Grend a silver arm ring as a gift of friendship.</p></details><details><summary>The Shadow of the Gods · 42</summary><h2>Protecting Grend and her shield-sisters</h2><p>During the ambush at the vaesen pit, Elvar defends the fallen Grend, covers Biórr as he carries him out and rescues Sólín on the return to the shield wall. Afterwards she tends Grend until he wakes. Sólín thanks her as a rescuer and shield-sister, while Elvar&#x27;s gratitude to Biórr leads to a kiss and a private encounter beneath a willow.</p></details><details><summary>The Shadow of the Gods · 48</summary><h2>Chosen kin and the bones at Oskutreð</h2><p>Her relationship with Biórr continues. She still values battle-fame, but calls Grend and her chosen companions better kin than her blood family. At Oskutreð she identifies the immense wolf skeleton as Ulfrir and joins Grend in uncovering ancient remains and weapons.</p></details><details><summary>The Shadow of the Gods · 52</summary><h2>The breaking of the shield wall</h2><p>Elvar watches Agnar defeat Skrið, only for Biórr to spear the wounded chief. Grend prevents her from pursuing Biórr alone and takes her back to the shield wall. A spear wounds her shoulder; he carries her behind the line and advises fighting left-handed, something she remembers practising.</p></details><details><summary>The Shadow of the Gods · 52</summary><h2>The breaking of the shield wall</h2><p>She witnesses the blood ritual, the opening of Oskutreð and Lik-Rifa&#x27;s release. She and Grend survive the blast, but cannot stop Ilska&#x27;s company leaving with the children.</p></details><details><summary>The Hunger of the Gods · 2</summary><h2>A burial and a surviving gaoler</h2><p>After Agnar&#x27;s burial she vows to kill Biórr. Thoughts of abandoning the Bjarn oath make her scars burn; recommitting stops the pain. She decides to seek the company&#x27;s help after its treasure search.</p></details><details><summary>The Hunger of the Gods · 2</summary><h2>A burial and a surviving gaoler</h2><p>Grend has cleaned and stitched her shoulder. He recovers replacement mail with brass-ring borders, and she gives him an ancient wolf-decorated axe.</p></details><details><summary>The Hunger of the Gods · 2</summary><h2>A burial and a surviving gaoler</h2><p>She collars the awakened red-winged gaoler and uses blood and spoken commands to force her obedience. The captive names herself Skuld, and Elvar declares her a thrall. Her general distrust of Tainted people remains her prejudiced conclusion.</p></details><details><summary>The Hunger of the Gods · 4</summary><h2>The descent beneath Oskutreð</h2><p>She explains that she overheard binding words in Störr&#x27;s hall. She claims Skuld&#x27;s collar obeys only her, punishes attacks and hears distant commands; these limits are her explanation. Her injured shoulder prevents her putting on her new mail.</p></details><details><summary>The Hunger of the Gods · 4</summary><h2>The descent beneath Oskutreð</h2><p>During the descent beneath Oskutreð she witnesses the mist procession and rune-protected book. Huld&#x27;s crossing triggers a blast, and an attacker emerges as Sighvat relights a torch.</p></details><details><summary>The Hunger of the Gods · 6</summary><h2>A god against a god</h2><p>Grend pulls Elvar up after a creature clings to her neck and torso; another attacker wounds her through her torn tunic. She summons Skuld and orders her to fight. After the battle she forces Skuld to kneel, beats her and threatens her against another betrayal.</p></details><details><summary>The Hunger of the Gods · 6</summary><h2>A god against a god</h2><p>Elvar proposes raising Ulfrir to face Lik-Rifa and recover Bjarn, then controlling the wolf-god with a collar forged from his old chain. Uspa agrees to help, accepting Elvar’s promise to try to free Berak and Grend’s assent. The book’s ability to restore Ulfrir and enable a god-binding collar remains Uspa’s claim.</p></details><details><summary>The Hunger of the Gods · 6</summary><h2>A god against a god</h2><p>Huld wants to leave with the treasure, while Orv argues that the dead gods should remain dead. Elvar permits those outside the oath to depart but appeals to the fame of slaying Lik-Rifa. The company’s final decision is not shown.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>A collar and the wolf-god&#x27;s return</h2><p>She works the bellows while Uspa directs Grend and Sighvat in forging the collar. She and Uspa add blood; her spoken commands open and close it, and later make it expand around Ulfrir’s skeleton. She recalls overhearing Silrið teach her father the binding words.</p></details><details><summary>The Hunger of the Gods · 8</summary><h2>A collar and the wolf-god&#x27;s return</h2><p>Above ground Huld announces the company’s support. Elvar joins the Battle-Grim in giving blood to Uspa’s resurrection ritual and witnesses Ulfrir regain flesh, begin breathing and stand. He then collapses and changes into a wounded man; his capacity to defeat Lik-Rifa is still untested.</p></details><details><summary>The Hunger of the Gods · 17</summary><h2>An uneasy bargain with Ulfrir</h2><p>She proposes common cause against Lik-Rifa to the weakened Ulfrir, while Huld challenges her authority over the company. Elvar has not been chosen chief and privately doubts she wants the role, but resents the insult. Grend prevents her drawing steel, and Uspa persuades the company to continue towards the bridge.</p></details><details><summary>The Hunger of the Gods · 17</summary><h2>An uneasy bargain with Ulfrir</h2><p>Stepping into the apparent crossing, she falls until Grend catches her mail and Sighvat anchors his wrist. She cuts Ulfrir’s palm for his attempt after Uspa’s fails. Ulfrir restores the bridge and the whole party crosses.</p></details><details><summary>The Hunger of the Gods · 17</summary><h2>An uneasy bargain with Ulfrir</h2><p>When tennúr emerge, she puts on her helm and forms a three-row shield wall. Her shoulder remains painful, and Grend helps support her shield. Seeing the swarm target Ulfrir’s wagon, she runs back and fights alongside Uspa and the god.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>A duel for the Battle-Grim</h2><p>At the new camp she relights the fire before dawn, boils stream water, wakes and thanks Uspa, and sharpens her sword with the whetstone kept on her scabbard. She remembers the previous day’s shoulder pain and tells Grend it is well enough.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>A duel for the Battle-Grim</h2><p>Huld calls for Agnar’s successor. After Sighvat and Grend decline, she puts herself forward, weighing independent fame against the need to fulfil the oath to rescue Uspa’s son without treating the company as expendable. Huld’s spoiled-daughter insult remains a spur. She refuses Grend’s offer to fight for her, instead tightening her weapons belt to ease the mail’s weight on her shoulder.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>A duel for the Battle-Grim</h2><p>Grend is her second in the spear-bounded square. Both she and Huld agree to death; she grips Agnar’s troll-tusk, salutes Grend with her sword and kisses its flat as he urges her to think. Huld attacks the shield side, splintering the linden wood and seeking the apparent shoulder weakness.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>A duel for the Battle-Grim</h2><p>She raises the shield easily, redirects and pins Huld’s sword, then strikes through the mouth. When Huld falls, she pins the wrist and thrusts through the throat, killing her. Grend praises the victory. Elvar reports that she felt no pain after Uspa’s Seiðr-runes before dawn; this is pain relief as reported, not proof of permanent complete healing.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>A duel for the Battle-Grim</h2><p>Her relief is followed by trembling as she wipes the blade on Huld’s cloak. Sighvat gives her Agnar’s bearskin cloak, pins it with a gold brooch and raises her arm, proclaiming Elvar Fire-Fist, chief of the Battle-Grim. The company acclaims her and Ulfrir smiles and dips his head. The new epithet is introduced here; it does not belong to her earlier career.</p></details><details><summary>The Hunger of the Gods · 28</summary><h2>A duel for the Battle-Grim</h2><p>She orders a barrow for Huld, honouring her as Battle-Grim. Weighing the god’s incomplete healing and a force she considers fewer than forty spears, she orders south towards the Wave-Jarl rather than straight after the earlier eastward tracks. The burial and journey are not shown, and her rescue oath is not revoked.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>On the southward return she admits that she enjoyed deceiving and killing Huld, but now feels increasing unease. She tells Grend that command fills her mind with daily questions of food, water, route, scouts and protection rather than personal fame. His response is rare, prolonged laughter and the judgment that she is growing up.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>At the Wave-Jarl she thinks of herself as the crew’s gold-giver, charged with feeding and rewarding those who may die for her. Recognising her father’s responsibility does not excuse him: she remembers Thorun holding her back and laughing while Störr beat her mother, and Grend being ordered to watch after she stopped his intervention. She also renews an under-breath threat to kill Biórr if they meet again.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>She cleans her sword with sand and linen at the camp. Uspa brings food and praises her leadership, then explains her former association with Ilska and challenges the Battle-Grim’s enslavement of her family. Elvar cannot voice the apology she feels and invokes the way of the world. Uspa argues for chosen justice and peaceful coexistence; Elvar protests that leading forty warriors is already difficult. No emancipation or reform programme follows.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>When Ketil mocks her youth she offers another holmganga; he declines and accepts her chiefship. She publicly expresses faith in Ulfrir despite private doubt. She hears the gods correct Ketil’s saga accounts and Ulfrir disclose the reported sister Skuggar, without directly witnessing those ancient events.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>After Ulfrir kills Ketil while defending a visiting Froa, she asserts that the Battle-Grim are her crew. Her Eldsverkur command heats his collar and causes pain; he returns to human form and kneels, but still glares defiantly. She demands obedience and forbids eating the crew.</p></details><details><summary>The Hunger of the Gods · 34</summary><h2>Return to the Wave-Jarl</h2><p>She commands Skuld to kneel and then gouge out an eye. The red collar compels a taloned finger towards it. When Ulfrir tries to intervene she uses Sársauki, then halts Skuld’s hand after he pleads; no eye is removed. Sársauki endar dulls his collar to black iron. He finally promises to eat no more Battle-Grim. Her demonstrated coercion does not establish willing loyalty or completed vengeance against Lik-Rifa.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The laden ship reaches Starl</h2><p>On the Wave-Jarl’s crossing to Starl she feels a burden lifted by knowing her obligations and believes she has a course towards success while keeping her company alive. Her hope of removing the Seiðr in her blood remains a hope. She recalls the existing promise to try to free Berak; no liberation or second oath occurs.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The laden ship reaches Starl</h2><p>She wears Agnar’s bearskin against the cold wind and the mail recovered at Oskutreð. Its comfortable fit becomes her comparison for feeling that chiefship is hers, a feeling she dates to bringing Ulfrir to heel. This describes her experience, not proof of enchanted armour or complete shoulder healing.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The laden ship reaches Starl</h2><p>With food and drink nearly gone, she stops at Starl rather than continuing directly down the Hvítá. She permits only Sighvat, Orv and Urt ashore, fearing that tavern talk would expose the hidden treasure and two gods. The ship actually docks, but restocking is not completed.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The laden ship reaches Starl</h2><p>She faces Halja, an older mailed warrior and their unnamed collared companion. She announces Agnar’s death and her own chiefship, and hears Halja name herself as Bloodsworn. She knows their reputations, but Sighvat’s proclamation of her titles draws Halja’s claim never to have heard of her. The older woman’s grey-green stare strikes Elvar as a killer’s and makes her skin prickle.</p></details><details><summary>The Hunger of the Gods · 38</summary><h2>The laden ship reaches Starl</h2><p>When Uspa names the older woman Orka, the name stirs only a dim memory in Elvar; full recognition of Skullsplitter is not stated. Elvar refuses Orka’s demand for Uspa, frees her right arm and sword and faces the raised long-axe. Ulfrir interrupts and greets Orka as wolf-child, leaving the standoff unresolved.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>She asserts her authority over invitations and safety, refusing to give up Uspa, then agrees to a truce when the visitors offer intelligence from their dragon-born prisoner. The promised safety is conditional on keeping the truce. Orka, Halja and Sæunn board, with Grend remaining watchful.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>She confirms the resurrection and thralldom of Ulfrir. After Uspa vouches for the visitors, the parties agree to share information. Uspa, Elvar, Sighvat and Grend show the coiled white oath scars, and Uspa declines Orka’s request to leave, expressing confidence in Elvar’s plan. Skuld later asks Elvar to bring Orna back too; Elvar ignores the request.</p></details><details><summary>The Hunger of the Gods · 39</summary><h2>A meeting with the wolf-god</h2><p>She rejects Orka’s western rendezvous lead, saying Myrk is lying, and reports eastward tracks at Isbrún Bridge, with Sighvat’s confirmation. She points out that they lack Nastrandir’s location despite Ulfrir’s prediction and calls Orka’s western trail dead. When Orka asks for help she requires a favour in return, which Orka accepts. Neither specific service or a completed alliance is supplied.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>She participates in the staged stable raid that lets Myrk escape, appearing with fair hair tightly braided and Grend at her shoulder. Orka thanks her for the help; Elvar says she has fulfilled her side of their bargain.</p></details><details><summary>The Hunger of the Gods · 45</summary><h2>An escape staged in the stable</h2><p>Her requested return favour is a message to Glornir offering to hire the Bloodsworn at double their asking price and requesting a meeting at Snakavik. She presents a thick twisted pure-silver ring with snarling bear-head terminals as a token of regard, claiming Battle-Plain provenance and tentatively suggesting Berser ownership. Neither that provenance nor the hiring is independently established; the message and gift have not reached Glornir.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>At first light she ends the night’s conversation with Orka’s group and relays Ulfrir’s good-hunting message and prediction of another meeting. She finds the pair unsettling and later tells Ulfrir that Orka gave no answer. Before Orka leaves she reminds her of the hiring bargain and accepts that the Bloodsworn must make their own choice.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>Back at the Wave-Jarl she sees Uspa’s provisions stowed and feels chiefship becoming more natural. She questions Grend’s tension over Orka; his talk of danger and death scent is his judgment. He explains his concern through her safety and admits he may be overprotective, prompting her joke about guarding the boarding plank.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>She puts Sighvat at the tiller, commends Uspa’s purchases and learns that Uspa once ran a farm. She orders Uspa, Ulfrir and Skuld back to the stern; Skuld’s glare prompts her private doubt that Skuld will ever accept orders. Skuld says she liked Orka and Elvar privately agrees, thinking she would not want her as an enemy.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>She recognises Orka’s riders on the lakeshore track, with Ulfrir confirming the identification. When they stop she feels they are looking back, but no communication is narrated. She believes Ulfrir’s prediction that they will see Orka again.</p></details><details><summary>The Hunger of the Gods · 49</summary><h2>Farewells at first light</h2><p>She orders cast-off and stands by the carved serpent-head prow as the ship gathers speed. Sighvat steers towards the southern river mouth; she names the Hvítá and Snakavik ahead and thinks of her father. No arrival or encounter with him is shown.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Rowing and a merchant ship intercepted</h2><p>She returns to her old oar-chest, finding rowing absorbing where the tiller leaves her isolated with worry about Lik-Rifa, her oath and the coming encounter. Sighvat steers while two half-crews keep twenty-four oars working through the day, preserving strength for Snakavik. After drinking from Grend’s carved leather bottle she wraps herself in the bear-cloak and privately claims it as hers.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Rowing and a merchant ship intercepted</h2><p>On the widened Hvítá she intercepts an avoiding merchant knarr. Armed guards and an arrow do not provoke a boarding: she checks Skuld’s threat and asks for news. She pays the unnamed merchant a silver arm ring, whose estimated cargo-equivalent value is her own guess; it is not identified as the bear-head ring left with Orka. The woman reports Störr’s muster and intended first strike against Helka over a suspected Orlyg alliance, explicitly citing drengrs’ gossip. Elvar resumes the Snakavik course with war in mind.</p></details><details><summary>The Hunger of the Gods · 56</summary><h2>Rowing and a merchant ship intercepted</h2><p>Grend points out a mixed crowd crossing east over a bridge, with provision wagons and children. Its shabby arms and dragon shields identify the local worshippers to her, while Ulfrir says they serve his sister. She remembers Snakavik’s cages and imagines her father’s anger, but rejects Grend’s offer to kill them: one battle at a time. Snaka’s skull and Snakavik appear in the distance; no landing or audience follows here.</p></details><details><summary>The Hunger of the Gods · 61</summary><h2>The Battle-Grim return to Snakavik</h2><p>At Snakavik she returns Skuld&#x27;s sword but limits its use. Grend&#x27;s account of training her from four winters old reassures her. She presents the company as muster recruits, receives a crew-wide pass and leads them towards her father&#x27;s fortress to recover Uspa&#x27;s husband; success is not yet shown.</p></details><details><summary>The Hunger of the Gods · 61</summary><h2>The Battle-Grim return to Snakavik</h2><p>Her current equipment includes god-made brynja, bearskin cloak, red spear-and-axe shield, seax belt, baldric sword and troll-tusk necklace.</p></details><details><summary>The Hunger of the Gods · 65</summary><h2>Entry into Störr&#x27;s muster camp</h2><p>She gains entry using the muster tablet and her claimed recruiting credentials. Syr escorts the company past crowded camps, barracks and working forges. Masking apprehension, Elvar selects Grend, Sighvat, Uspa and Ulfrir to enter her father&#x27;s hall; the meeting has not yet occurred.</p></details><details><summary>The Hunger of the Gods · 67</summary><h2>Elvar returns to her father&#x27;s hall</h2><p>The hall recalls her mother&#x27;s death when she was twelve and Grend&#x27;s grief. She finds her brothers Thorun and Broðir beside Störr and Berak alive among his collared Berserkir. After Störr mistakes the company for Agnar&#x27;s, she reveals herself, announces Agnar&#x27;s death and the change of chief, and greets her father.</p></details><details><summary>The Hunger of the Gods · 69</summary><h2>Bargaining for the Berserkir</h2><p>She offers to buy Berak and hire the Berserkir with Oskutreð treasure for Bjarn&#x27;s rescue. Störr rejects transferring collar power, proposes alliance and threatens her ship&#x27;s wealth. She refuses and calls Ulfrir as the jarl orders capture; neither purchase nor seizure is completed at this cutoff.</p></details><details><summary>The Hunger of the Gods · 71</summary><h2>The wolf-god wrecks Störr&#x27;s hall</h2><p>She publicly reveals Ulfrir, orders Berak spared and authorises Störr&#x27;s killing with a nod to Skuld. After Thorun inherits collar control she kills him, then demonstrates her own control by stopping the Berserkir. She spares Broðir&#x27;s submission and is acclaimed Jarl Elvar by the Battle-Grim and addressed as such by Silrið and Hrung. No general emancipation is shown.</p></details><details><summary>The Hunger of the Gods · 71</summary><h2>The wolf-god wrecks Störr&#x27;s hall</h2><p>Uspa advances beside Elvar, holding a forward sheet of red Seiðr-runes against Silrið&#x27;s fire from the dais. Grend and Sighvat guard the flanks with axes and shields, fighting drengrs who move around the barrier while Ulfrir battles the Berserkir.</p></details><details><summary>The Fury of the Gods · 3</summary><h2>At Snakavik she holds court in snow falling through the ruined hall</h2><p>At Snakavik she holds court in snow falling through the ruined hall. Though she controls the Berserkir, her father&#x27;s death leaves her numb. She spares the surrendered Broðir despite fearing the power he could gain by killing her. She delays moving the treasure into the treasury so she can use it in the assembly; Sighvat persuades her to eat.</p></details><details><summary>The Fury of the Gods · 3</summary><h2>At Snakavik she holds court in snow falling through the ruined hall</h2><p>Gytha, the captains and Runa offer allegiance, but she postpones formal oaths while declaring war on Lik-Rifa rather than continuing Störr&#x27;s campaign. After Ingvild demands pay and a chance of survival, she opens the treasure and promises wealth to survivors. Hjalmar leads the room in acclaiming her; a completed oath ceremony remains unshown.</p></details><details><summary>The Fury of the Gods · 9</summary><h2>Training and the attempted treasury escape</h2><p>Training with Grend brings a brief respite from ruling, but her father&#x27;s death does not remove her grief. Grend gives her a distinctive hand-axe and encourages practice with sword and axe. Later she wakes to Hrung&#x27;s alarm and finds guards dead and treasure stolen; one Oskutreð chest remains while the other and her father&#x27;s stored wealth are gone.</p></details><details><summary>The Fury of the Gods · 9</summary><h2>Training and the attempted treasury escape</h2><p>She follows the Wave-Roamers to their ship. After Ulfrir dismisses the serpent glamour, Uspa binds the witch&#x27;s mouth and Skuld strikes her, her Berserkir break the shield wall. Ingvild disarms her of her shield; she insists on finishing the duel herself, using sword and the new axe to overcome Ingvild before repeatedly striking her fallen opponent. Her mail stops a rib strike, and Grend receives a forehead wound while helping her.</p></details><details><summary>The Fury of the Gods · 19</summary><h2>Hidden followers and the missing Grend</h2><p>She questions the pier defenders and hears Ulfrir call them his hidden Úlfhéðnar children, afraid of collars. She does not promise freedom from collars, but orders him to bring them and says she will think. Her claim that fear is safer recalls her father and makes her question whether she is becoming like him. Ulfrir challenges her reliance on paid mercenaries.</p></details><details><summary>The Fury of the Gods · 19</summary><h2>Hidden followers and the missing Grend</h2><p>She moves the council to the tower’s circular chamber with Hrung, her father’s chair, the fire pit, chain link and cold forge. She hears proposals for stealth, force and an alliance with Helka, while the council lacks Bjarn’s and Lik-Rifa’s current locations. She has sent Battle-Grim to question traders, orders departure preparations and refuses to leave without intelligence. Orv then brings Svea’s report that Helka and the eagle-god are dead, ending the proposed alliance’s premise without a new plan yet.</p></details><details><summary>The Fury of the Gods · 23</summary><h2>Hrung’s account and Grend’s secret</h2><p>Overwhelmed by the war and Grend’s absence, she has had searchers looking for three days after he missed sparring. Hrung tells her he killed Snaka with his own poisoned body and lost his whole clan. She strokes his cheek, gives him mead and says she is glad he lives, without resolving his speculative survival mechanism.</p></details><details><summary>The Fury of the Gods · 23</summary><h2>Hrung’s account and Grend’s secret</h2><p>She admits Ulfrir’s wary followers and chooses oaths plus his command over imposing new collars. She orders it done immediately; the exact oath text is omitted. She still treats her existing Berserkir as possessions despite Hrung’s objection. Asking Ulfrir where to fight, she hears his Wolfdales proposal and its concealment advantages.</p></details><details><summary>The Fury of the Gods · 23</summary><h2>Hrung’s account and Grend’s secret</h2><p>She rejects Uspa’s proposal to free her Tainted and proclaim it publicly, despite Berak’s promise to stay. She fears losing Ulfrir, the force needed to win and ultimately Bjarn, displaying her white oath scars. Uspa calls the enslavement wrong; Elvar repeats her father’s maxim uncomfortably and ends the debate. She orders preparation to march for Jarnvidr tomorrow, not an immediate departure.</p></details><details><summary>The Fury of the Gods · 24</summary><h2>Rotta returns to Darl</h2><p>At Darl, Rotta names Elvar and the Battle-Grim to Lik-Rifa as Ulfrir’s companions at Snakavik, using information extracted from Orka. Lik-Rifa turns to Biórr for inside knowledge of the company. This is hostile intelligence reaching Darl, not news shown reaching Elvar or a fresh observation of her current position.</p></details><details><summary>The Fury of the Gods · 33</summary><h2>The tide and the search for Grend</h2><p>At dawn she wears gleaming mail, belt-hung spectacled helm, sword, Grend’s axe, arm rings and a gold rope-twist torc with serpent-head terminals. Grend has been missing five days; she has searched for two and sought a Hundur tracker since yesterday. After Uspa and Ulfrir press for noon departure, she puts on a bearskin cloak and descends to the docks through the Bone Tunnel, still tugging her troll-tusk pendant and hoping to see him. The host provisions ships; Wave-Jarl is repaired and Hrung loaded, but the fleet has not yet sailed.</p></details><details><summary>The Fury of the Gods · 33</summary><h2>The tide and the search for Grend</h2><p>Broðir brings Runa’s gifted Hundur-thrall, named Ákveðin, who promises to find a person given their scent. She accepts and calls on Gytha for something of Grend’s. Before the search begins, Hjalmar brings Grend alive but badly beaten, wrists roped and neck leashed. She reaches for her sword and demands what happened; Hjalmar alleges years of deception and Tainted blood. The accusation is not yet independently confirmed, and her judgment is unshown.</p></details><details><summary>The Fury of the Gods · 34</summary><h2>A bargain in the forest glade</h2><p>Estrid and Skalk trade news of her collared wolf-god to Sigrún and Krúsa, claiming knowledge of his location and offering further service to Lik-Rifa. They cite travellers questioned by Frek. This spreads enemy intelligence without implying Elvar knows of the meeting or fixing her current location at the same moment.</p></details><details><summary>The Fury of the Gods · 35</summary><h2>The fleet leaves Snakavik</h2><p>Her fleet actually leaves Snakavik: fifty longships and as many knarr follow, rowing south into a south-easterly. She has distributed most of Ulfrir’s followers as rowers. He reports the epithet Wolf-Tamer while denying he is tame, urges her to face the delayed task and assures her he can find Wolfdales. Skuld asks for her mother’s silver scissors; Elvar takes the large, light rune-handled pair from Oskutreð treasure and gives them back, suspecting but not proving Seiðr power.</p></details><details><summary>The Fury of the Gods · 35</summary><h2>The fleet leaves Snakavik</h2><p>She enters the old-sail enclosure ordered for privacy around captive Grend. Hjalmar reports a blood-scent discovery by his Hundur-thrall, alleges Hundur ancestry and recounts pursuit/deaths. She hands Grend’s returned equipment to Gytha and promises compensation. His only apology hurts her after fifteen years of mentorship; she restrains a slap, orders Silrið to collar him and leaves hiding tears. The fitting is not shown, nor does his apology explicitly explain the lineage/motives.</p></details><details><summary>The Fury of the Gods · 38</summary><h2>Following the Falinn to Wolfdales</h2><p>She follows Ulfrir’s directions into the River Falinn, has Sighvat turn and Gytha signal the fleet, then sails upstream before adding half the oars as wind drops. To Orv she describes collar protection and thought-detecting blood oaths as her insurance, and expects Broðir to inherit control if she dies; these are her claims, not new universal tests. She sees wolves gathering over the ancient hill and lands at Wolfdales with guards.</p></details><details><summary>The Fury of the Gods · 38</summary><h2>Following the Falinn to Wolfdales</h2><p>Grend is now actually iron-collared, leashed and wrist-bound. She orders him to follow until a gaol can be found. He says he will not betray her; she sees his wounds healing and swollen eye opening but replies he already has. Following Ulfrir up the stone road, she witnesses vine-stripping wind, animated stone wolves, his giant wolf transformation and the opening of the doors. No interior survey or final judgment of Grend follows.</p></details><details><summary>The Fury of the Gods · 40</summary><h2>Councils and secrets in Wolfdales</h2><p>Two days after entering Wolfdales she occupies Ulfrir’s high seat while council debates baiting the dragon with him and fighting its host. Scouts have secured tunnel entrances and she organises living/training space, but needs enemy intelligence and cannot think clearly over Grend. She leaves through the glowing-tree hall; Sighvat insists on chosen guard duty, and Berak says he too would choose to protect her for Bjarn. She makes both remain outside Grend’s guarded cell.</p></details><details><summary>The Fury of the Gods · 40</summary><h2>Councils and secrets in Wolfdales</h2><p>She tells Grend his secret undermines her authority, then hears his earlier blood oath to her mother, who knew his Hundur ancestry. His account explains childhood friendship, rescue, freedom and choosing her mother’s service over captaincy. Elvar asks if he is her father; he denies biological parentage but says she is his daughter in all else, and that she is morally unlike Störr. Fearing becoming her father, she cuts his wrist ropes with his gifted axe and releases the wall tether. She leaves silently; collar removal, formal freedom or a restored role are not stated.</p></details><details><summary>The Fury of the Gods · 41</summary><h2>Her control of Ulfrir is reported to Lik-Rifa, Rotta, Ilska and Biórr and surprises them</h2><p>Her control of Ulfrir is reported to Lik-Rifa, Rotta, Ilska and Biórr and surprises them. Her offered silver to the Bloodsworn is already known to Sterkur/Ilska. The enemy now receives den intelligence and a proposed spy service, without any new warning to Elvar or proof the spies entered her camp.</p></details><details><summary>The Fury of the Gods · 42</summary><h2>Arrival at the wolf-god’s hall</h2><p>She receives the arriving Bloodsworn at the oversized high seat, in gilded mail, black bearskin cloak, gold rings and troll-tusk cord with sword across her lap. After Vol/Uspa’s reunion, Glornir explicitly offers dragon-fighting at her request. She welcomes the accepted offer and asks whether Orka came; no reply, payment or full military council is yet shown.</p></details><details><summary>The Fury of the Gods · 43</summary><h2>Allies meet and old loyalties surface</h2><p>Orka sees her as sharper-lined and weary beyond her years, a perception of burden rather than a new exact age. She welcomes Orka, hears Breca recovered, Myrk dead and Drekr alive, and accepts Orlyg’s offered force after his Rotta news. Ulfrir’s private correction that the hall is his is not a public command change.</p></details><details><summary>The Fury of the Gods · 43</summary><h2>Allies meet and old loyalties surface</h2><p>She receives the enemy-march report and sees the giant ravens. Ulfrir calls them Snaka’s former spies and questions trust; Orka vouches, and the birds describe needing friends. Without a precise timetable she asks them to watch Lik-Rifa and warn of proximity, calling them friends. She offers the allies rooms, food and ale; payment, actual lodging and new oath rites are not shown.</p></details><details><summary>The Fury of the Gods · 44</summary><h2>She wakes from anxious dreams to the single horn for oath-seekers, not a confirmed dragon attack</h2><p>She wakes from anxious dreams to the single horn for oath-seekers, not a confirmed dragon attack. Sólín’s praise encourages her. Occupying Ulfrir’s high bedchamber as a power symbol, she regrets the dizzying platform and descends a branch stair into the trunk’s spiral route. Silrið presses a public decision on Grend and reports doubts among the host; Elvar says she has made none and resists the pressure, citing deeds and wealth.</p></details><details><summary>The Fury of the Gods · 44</summary><h2>She wakes from anxious dreams to the single horn for oath-seekers, not a confirmed dragon attack</h2><p>She recognises Estrid and Skalk from earlier court visits and hears Estrid’s public offer. When Glornir advances for vengeance she commands Ulfrir to stop it; his wolf form halts the parties. She understands the grievance but imposes no infighting until the dragon dies, applicable to all origins/species. Estrid/Skalk accept her welcome verbally. A raven’s news that the dragon reached Jarnvidr ends the scene; no new formal oath or Grend sentence follows.</p></details><details><summary>The Fury of the Gods · 48</summary><h2>She visits wounded allies with a dirty bloodstained bandage around one forearm, side/cause unstated</h2><p>She visits wounded allies with a dirty bloodstained bandage around one forearm, side/cause unstated. She praises Glornir’s complete return and offers food/rest, celebrating a limited raid rather than a won war. On Glornir’s word she welcomes Logur’s friendship and oathsworn, then asks Kló for news before food. The raven reports enemy losses and new Tainted reinforcements.</p></details><details><summary>The Fury of the Gods · 49</summary><h2>Building defences at the bridge gate</h2><p>She inspects the bridge gate and riverbank works with her guards and magic-workers, having sent more tunnel raiders to burn supplies. She sees a strong infantry chokepoint but fears the dragon could destroy it, citing Glornir, Estrid and Skalk’s accounts. She watches the combined rune/blood working and feels its falling sparks as warm. Ulfrir declares it complete and protective; she thanks him, without a siege test or confirmed burned wagons.</p></details><details><summary>The Fury of the Gods · 50</summary><h2>The burned wagons and the captive children</h2><p>Biórr describes her to the dragon as ambitious, skilled and unexpectedly cunning, comparing her with Störr’s court traits. Rotta reports unnamed followers disappointed in her leadership and a conditional suggestion that her death might open Wolfdales. This is enemy-side intelligence, no established named betrayal or actual death.</p></details><details><summary>The Fury of the Gods · 51</summary><h2>She accepts Ulfrir’s private invitation above the hall, leaving Berak/Sólín at the trunk</h2><p>She accepts Ulfrir’s private invitation above the hall, leaving Berak/Sólín at the trunk. A glimpse of Silrið, Runa, Hjalmar and Estrid prompts an unconfirmed assumption about Grend. She feels sympathy for Ulfrir’s Orna grief and learns the dome’s secret words, physically testing its resistance and walking on its surface. He warns of possible spies without naming them. She explains her changed ambitions and oath-driven need to retrieve Bjarn. He shares alternate-entrance security and Gelta’s story, then begins singing; no awakening or Grend sentence occurs.</p></details><details><summary>The Fury of the Gods · 52</summary><h2>At dawn she opens the stone doors and finds the bridge defences intact but the fleet destroyed</h2><p>At dawn she opens the stone doors and finds the bridge defences intact but the fleet destroyed. Silrið interprets this as preventing flight and Ulfrir as rage after failure against the gate; neither explanation directly reveals the dragon’s thoughts.</p></details><details><summary>The Fury of the Gods · 52</summary><h2>At dawn she opens the stone doors and finds the bridge defences intact but the fleet destroyed</h2><p>While she looks at the wrecks, Broðir attacks with seax/fist and Runa’s drengrs block guards; Silrið raises a staff spell at them. Elvar grips his wrist and head-butts him after Orka’s axe strike. She survives with pain/possible injury at the waist, severity unexamined, and orders the captured Runa kept alive. Broðir and Silrið’s river fates remain unknown.</p></details><details><summary>The Fury of the Gods · 53</summary><h2>Lik-Rifa explicitly identifies Broðir’s failed assignment as killing Elvar and opening Wolfdales</h2><p>Lik-Rifa explicitly identifies Broðir’s failed assignment as killing Elvar and opening Wolfdales. Rotta now claims her death from any cause would pass control of Ulfrir to Broðir, preserving the conspirator’s value; Elvar is alive and no transfer occurs. The gods retain lethal intent, with Rotta’s next method undisclosed.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>She sees a waist bruise and refuses to punish Thorguna for the attack</h2><p>She sees a waist bruise and refuses to punish Thorguna for the attack. Salvage finds three repairable hulls. She executes the captured Runa for oath-breaking after a hostile explanation and incomplete denial of allies, then acts on the danger of Broðir inheriting control if she dies.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>She sees a waist bruise and refuses to punish Thorguna for the attack</h2><p>She replaces Ulfrir’s collar with a voluntary oath of equal protection, fairness and justice, officiated by Uspa through four runes carved in the chair and blood. She physically frees him, Skuld and all her Berserkir and offers genuine choice with provision for voluntary drengr service. Her remaining-alliance condition is release of Tainted, which Orlyg and other chiefs including Estrid carry out. It is not a shown worldwide or all-person abolition.</p></details><details><summary>The Fury of the Gods · 54</summary><h2>She sees a waist bruise and refuses to punish Thorguna for the attack</h2><p>Glornir’s group reveals Vol/Iva/Taras were never his thralls and all the current company are Tainted, pledging loyalty. Her released guards freely follow. She then removes Grend’s collar and embraces him, saying he is the personal reason alongside practical/ethical arguments; no new appointment or blood-paternity claim is made.</p></details><details><summary>The Fury of the Gods · 56</summary><h2>Collar-free Frek’s group asks to swear to her, explicitly crediting her for their freedom</h2><p>Collar-free Frek’s group asks to swear to her, explicitly crediting her for their freedom. She agrees to receive them. At his report of Estrid/Skalk/Hjalmar’s plot and flight, she stops Grend leaving alone and sends Gytha to search Wolfdales. She rejects Rotta’s demand for Ulfrir because she has freed him, declares opposition to ruling gods, and the parley fails.</p></details><details><summary>The Fury of the Gods · 58</summary><h2>Holding the gate walkway</h2><p>She fights at the gate with shield/sword and Grend beside her, calls readiness during a lull and finally orders the defenders to fall back after the embankment and walkway are breached. Her exact withdrawal route and the full battle outcome are not shown.</p></details><details><summary>The Fury of the Gods · 59</summary><h2>Across the wall towards the hall</h2><p>At the end of Guðvarr’s advance she and her host hold a shield wall across the road before the huge arched hillside entrance, following the retreat from the river works. No new speech, duel, surrender or final loss of the hall is shown.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>Elvar Chainbreaker and the hillside stand</h2><p>She orders the hillside stand as wounded enter the hall, then has Gytha sound the signal and the stone doors close behind the host. She trusts Ulfrir despite being shut outside. Berak hails her as Chainbreaker because she freed them, and the host cheers. She takes a replacement shield from Ulfrir’s chamber and refuses Gytha’s advice to avoid the front, accepting the captain’s declaration that she is not her father.</p></details><details><summary>The Fury of the Gods · 60</summary><h2>Elvar Chainbreaker and the hillside stand</h2><p>She joins Battle-Grim between Grend on her left and Sighvat on her right, drinks Grend’s water and starts the shield rhythm with her slim axe described as from Oskutreð. Biórr is absent from her view. A spertus sting catches in her shield; Grend chops it and she cuts the sting free. A wind after an unidentified incantation disperses poison before the shield walls clash. Her fear and battle-joy do not settle the final outcome.</p></details><details><summary>The Fury of the Gods · 62</summary><h2>The fighting withdrawal</h2><p>Her shout and horn begin a rhythmic withdrawal; later horn signals speed it and part the line for the Tainted countercharge. The full plan and safe return behind the stone doors are still not shown.</p></details><details><summary>The Fury of the Gods · 63</summary><h2>The stone doors and the retreat inside</h2><p>At the stone doors she has Gytha sound three blasts, then demands and pleads with Ulfrir as they remain closed. They open at last, Skuld flies out and the host pours inside while stone wolves and Tainted cover them. She orders her guards in despite Sighvat asking after the guardians; both subsequently return through the closing doors. No deliberate betrayal is established by the delay.</p></details><details><summary>The Fury of the Gods · 63</summary><h2>The stone doors and the retreat inside</h2><p>Ulfrir closes the doors with his howl and destroys the troll that enters behind the guardians, after it kills a drengr. Elvar then rushes to Hrung, whom a spider bites, but it falls dead before her axe reaches it. Hrung stammers with blue cheek lumps/lips and icing eyes; she has not yet seen him recover or die.</p></details><details><summary>The Fury of the Gods · 65</summary><h2>Losses and plans after the retreat</h2><p>She now uses a more comfortable small dais chair while Ulfrir has his own back, relying on the justice oath rather than that power symbol. She has a shield-rim jaw bruise and feels responsibility for the dead outside. Ulfrir’s confident next-day lure is prospective: shields, feigned flight and longer-open doors to draw the dragon in. Her white coiled forearm oath scars are now explicitly felt, side unknown; the raven search still gives her no Bjarn news.</p></details><details><summary>The Fury of the Gods · 65</summary><h2>Losses and plans after the retreat</h2><p>She sees Hrung awake and relieved by Uspa’s warmth, hints at a further discussion and passes the companions socialising. Back in her chamber she sets aside cloak/weapons but keeps planning dawn tactics. Grend’s tearful pride matters to her; his cheek kiss is father-like affection, not biological identity or romance. He and Gytha leave by the rear tunnel, and Sólín/Thorguna guard as she sleeps.</p></details><details><summary>The Fury of the Gods · 66</summary><h2>She is Rotta/Biórr’s declared assassination target</h2><p>She is Rotta/Biórr’s declared assassination target. Skalk says she is in the bedchamber; Biórr recognises her adopted bearskin and sees a blonde-braided, mailed bed figure, but this chapter does not explicitly name that figure or show a strike. An unnamed spear defender intervenes. Biórr’s slaver accusation is his viewpoint, not a reversal of the freedom already enacted.</p></details><details><summary>The Fury of the Gods · 67</summary><h2>The attack on Elvar’s chamber</h2><p>She wakes as Sólín defends the rear door, takes sword/Grend’s axe and joins Thorguna against the infiltrators. Sólín is killed by an unnamed sword wielder. Elvar recognises Biórr and duels him, cutting his cheek/neck while Thorguna holds others. A staff working after the order to Skalk throws the doorway melee inward; Skalk and Rotta enter, Biórr pressing her onto the carved tree stair. Her brynja stops blade penetration at shoulder/arm and belly, but not the force of the blows.</p></details><details><summary>The Fury of the Gods · 67</summary><h2>The attack on Elvar’s chamber</h2><p>Trusting the Oskutreð brynja, she closes with Biórr despite a rib cracking, perhaps two, side unstated. She traps his sword arm, head-butts his nose and cuts behind an unspecified leg with the axe, sends his sword off the branch and holds him at sword point. He is shocked to learn she freed Ulfrir and the Tainted. An unidentified assailant then grips/twists her head, impacts her neck and pushes her off the stair as she chokes blood. The weapon, landing and final fate are unshown.</p></details><details><summary>The Fury of the Gods · 68</summary><h2>Elvar’s fall and the rebellion in the hall</h2><p>Her body falls from the tree branch to the hall floor, blonde braids/mail and white coiled forearm scar visible. Glornir identifies her and the narration explicitly calls her corpse, confirming death at this later cutoff rather than retroactively changing chapter67’s unknown landing. Ulfrir sniffs/whines over her before confronting the descending Rotta party. The prior neck assailant’s identity is not directly stated by this passage.</p></details><details><summary>The Fury of the Gods · 69</summary><h2>Biórr’s doubts amid the fighting</h2><p>Biórr initially doubts the freedom statement but sees the collarless wolf reject Broðir’s control and openly credit her with release. He finally accepts she told the truth. Her corpse remains below the tree; the chapter supplies no reversal of death or completed justice-oath consequence.</p></details><details><summary>The Fury of the Gods · 75</summary><h2>Leif’s death and the tunnel escape</h2><p>Sighvat retrieves her corpse from the burning chamber and returns carrying her with tears on his face. The evacuation begins toward the tunnels, without a burial or reversal of her death.</p></details><details><summary>The Fury of the Gods · 77</summary><h2>Sighvat carries her from the tunnel and with Grend binds her corpse in a cloak/leather strips</h2><p>Sighvat carries her from the tunnel and with Grend binds her corpse in a cloak/leather strips. Ulfrir honours her for thralling then freeing him and many others, and the camp echoes her already established epithet Chainbreaker. Uspa says she cannot raise her or Einar; this is a memorial without burial or revival.</p></details><details><summary>The Fury of the Gods · 79</summary><h2>Hrung tells Ulfrir she had a plan, stopping the proposed ally search</h2><p>Hrung tells Ulfrir she had a plan, stopping the proposed ally search. The chapter ends without revealing its content, retaining the uncertainty of her earlier hints.</p></details><details><summary>The Fury of the Gods · 80</summary><h2>Snaka’s heart and the interrupted feast</h2><p>Biórr’s memories of her words trouble him; Rotta now admits she told him about freedom on the bridge, while claiming he disbelieved it. Her axe remains at Biórr’s belt. This does not explicitly identify the unnamed assailant who struck her neck.</p></details><details><summary>The Fury of the Gods · 90</summary><h2>The last assault on Lik-Rifa</h2><p>Hrung had credited her with a plan; the coordinated jaw attack and swallowed poison-bearing head now reveal his functional role in the dragon’s defeat. Connecting the whole tactic to that hint is a retrospective inference, since the earlier discussion and authorship of each detail are not recounted.</p></details><details><summary>The Fury of the Gods · 91</summary><h2>She has been laid to rest in the hull of her beloved Wave-Jarl among the fallen heroes</h2><p>She has been laid to rest in the hull of her beloved Wave-Jarl among the fallen heroes. Ulfrir offered Glornir the place of honour beside her, but Vol declined in favour of his brother’s homestead.</p></details><details><summary>The Fury of the Gods · 92</summary><h2>The company drinks in her honour as Elvar Chainbreaker</h2><p>The company drinks in her honour as Elvar Chainbreaker. Vol says Ulfrir will pay the silver she promised, but no completed payment is shown.</p></details><details><summary>The Shadow of the Gods · 5</summary><h2>Personality</h2><p>Elvar regards bows as cowardly weapons. Grend has taught her to check that her sword draws freely before trouble begins.</p></details><details><summary>Illustration · The Hunger of the Gods · 71</summary><p><a href="assets/60a169e02eb340.jpg">Open noncanonical illustration</a></p><p>Elvar advances through Störr&#x27;s hall beneath Uspa&#x27;s protective barrier.</p></details><details><summary>Illustration · The Hunger of the Gods · 28</summary><p><a href="assets/146336e987757a.jpg">Open noncanonical illustration</a></p><p>Sighvat fastens Agnar&#x27;s bearskin cloak around Elvar before proclaiming her chief.</p></details><details><summary>Illustration · The Shadow of the Gods · 35</summary><p><a href="assets/91d3355cbe7499.jpg">Open noncanonical illustration</a></p><p>Elvar in Agnar&#x27;s rewards at the Snakavik tavern, before the blood oath.</p></details><details><summary>Illustration · The Shadow of the Gods · 21</summary><p><a href="assets/083c8ff0642a62.jpg">Open noncanonical illustration</a></p><p>Elvar in the weapons and equipment worn for the landing on Iskalt.</p></details><details><summary>Illustration · The Hunger of the Gods · 28</summary><p><a href="assets/5b44680d1a5054.jpg">Open noncanonical illustration</a></p><p>Huld presses Elvar&#x27;s shield side during their duel for the Battle-Grim&#x27;s leadership.</p></details><details><summary>Illustration · The Fury of the Gods · 43</summary><p><a href="assets/3c80cc23ff516b.jpg">Open noncanonical illustration</a></p><p>Elvar accepting the ravens as friends and scouts.</p></details><details><summary>Illustration · The Fury of the Gods · 33</summary><p><a href="assets/ec66d69afcc64e.jpg">Open noncanonical illustration</a></p><p>Elvar descending the Bone Tunnel towards Snakavik.</p></details><details><summary>Illustration · The Fury of the Gods · 44</summary><p><a href="assets/cb33c87828879a.jpg">Open noncanonical illustration</a></p><p>The descent from Ulfrir’s former chamber.</p></details><details><summary>Illustration · The Fury of the Gods · 3</summary><p><a href="assets/bbc4e8e9ba8b3b.jpg">Open noncanonical illustration</a></p><p>Elvar opens the treasure.</p></details><details><summary>Illustration · The Fury of the Gods · 67</summary><p><a href="assets/6dd2b44918ef5a.jpg">Open noncanonical illustration</a></p><p>Elvar overcoming Biórr before the later attack.</p></details><details><summary>Illustration · The Fury of the Gods · 59</summary><p><a href="assets/26216e2f177e2d.jpg">Open noncanonical illustration</a></p><p>The shield wall before the hillside entrance.</p></details><details><summary>Illustration · The Fury of the Gods · 65</summary><p><a href="assets/2caf7ba6c8e550.jpg">Open noncanonical illustration</a></p><p>Grend telling Elvar he is proud of her.</p></details><details><summary>Illustration · The Fury of the Gods · 63</summary><p><a href="assets/386a293038e71c.jpg">Open noncanonical illustration</a></p><p>Hrung’s complaint as his eyes glaze with ice.</p></details><details><summary>Illustration · The Fury of the Gods · 54</summary><p><a href="assets/75647b2cc968fe.jpg">Open noncanonical illustration</a></p><p>Elvar’s embrace after freeing Grend.</p></details><details><summ
