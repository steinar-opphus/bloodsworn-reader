      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 2</summary><h2>Introduction</h2><p>Kolskegg was Varg’s master. Varg remembers thirty winters and summers shackled to his farm.</p></details><details><summary>The Shadow of the Gods · 2</summary><h2>Story and connections</h2><p>The farm lies twenty leagues north-east of Liga along the river. Failure to obey commands there brought a blow or the lash.</p></details><details><summary>The Shadow of the Gods · 2</summary><h2>Story and connections</h2><p>A local drengr visited the farm to collect tax due to Queen Helka.</p></details><details><summary>The Shadow of the Gods · 4</summary><h2>The trial and the pursuing riders</h2><p>Kolskegg bought Varg and Frøya when they were children. He told Varg their parents sold them for a loaf of bread and twelve duck eggs. In his account Varg was five winters old and Frøya four.</p></details><details><summary>The Shadow of the Gods · 4</summary><h2>The trial and the pursuing riders</h2><p>Kolskegg put Varg into bouts against other landed men’s champions. Varg earned him a chest of silver.</p></details><details><summary>The Shadow of the Gods · 20</summary><h2>The queen&#x27;s orders</h2><p>In B01-C020, Varg remembers seeing Kolskegg dead with a ragged wound where his throat had been torn out, after Varg regained awareness. The recollection does not identify who inflicted that wound.</p></details><details><summary>The Hunger of the Gods · 13</summary><h2>News of a missing sister</h2><p>When Terna asks how he left the farm, Varg says he killed Kolskegg and ran. This new attributed admission is preserved alongside the earlier account of his missing memory; it does not supply a witnessed reconstruction of the killing.</p></details><details><summary>The Fury of the Gods · 84</summary><h2>Silrið’s defeat and vengeance for Frøya</h2><p>Varg recalls Kolskegg wearing down a troll with circling small wounds on the farm boundary, recognising the same tactic against Taras. This is a remembered episode, not a present-day sighting or quantified medical rule.</p></details></noscript>
