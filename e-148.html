      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 20</summary><h2>Appearance</h2><p>Twelve mail-clad warriors with thrall collars form Helka’s forward guard. They have shaved sides to their heads, tattoos and fur-edged grey wool cloaks. Varg sees fluid coordination in their movement and misery in one guard’s eyes; both descriptions are his impressions.</p></details><details><summary>The Shadow of the Gods · 20</summary><h2>The queen&#x27;s orders</h2><p>Svik calls them Helka’s wolf-pack and says they are Úlfhéðnar descended from Ulfrir, well-treated but still enslaved. These descriptions of ancestry and treatment retain his attribution. The guards control access to Helka.</p></details><details><summary>The Hunger of the Gods · 21</summary><h2>An audience with Queen Helka</h2><p>Two Úlfhéðnar guard Helka’s chamber, with tattooed shaved head-sides and central braids. One, Frek, has black hair and dark eyes that flicker amber as he sniffs Guðvarr. Helka describes Vafri as pack to her Úlfhéðnar. The new observation does not establish a new guard count for the entire pack or a collar on Frek.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>Varg recognises the collared dais guards as Úlfhéðnar and feels both rival-pack challenge and sorrow. Glornir’s attack brings a dozen forward; one amber-eyed woman uses two seaxes against Varg, tears off his ear and dies. Einar’s separate wounded opponent is not established dead.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>They gain the upper hand as reinforcements crowd the dais, then immediately disengage at Helka’s command. One knocks down a drengr who ignores her. This demonstrates this command response, not a newly defined universal collar mechanism.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>A handful protect Helka and Estrid during the confrontation. In the bargain the queen requires one Úlfhéðnar to accompany Hakon as guardian, and Glornir accepts. No guard is chosen by name and no departure is shown.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>A dozen Úlfhéðnar accompany Helka to the departing ship. She names Frek as the guardian to travel with Hakon, and he boards in mail and an iron collar with sword, seax and axe.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>The Úlfhéðnar accompany Helka and Hakon into the tower chamber, with Frek identified. He restrains the prince for tattoo inspection and later kills Kalv at Helka’s command. When challenged about the dragon, he reports dark dreams shared by all of their present group. Their discomfort and dream account do not establish a witnessed dragon appearance or a universal dream power.</p></details></noscript>
