      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Shadow of the Gods · 20</summary><h2>Introduction</h2><p>Svik identifies the young man following Helka as her son Hakon. He is tall, broad and black-haired, with fine clothing and silver ornaments rather than Helka’s gold.</p></details><details><summary>The Shadow of the Gods · 22</summary><h2>Captives freed and a name obtained</h2><p>In B01-C022, Vafri identifies Hakon as her master. She says she was ordered to report signs of the Tainted and names Drekr as the recipient; this remains her testimony under threat.</p></details><details><summary>The Shadow of the Gods · 35</summary><h2>The confrontation at The Dead Drengr</h2><p>The hooded young man at Drekr&#x27;s table is Hakon, whom Orka recognises from the docks. Hakon orders his guarding drengr to kill Orka. Hakon flees with his guard as the drengrs approach.</p></details><details><summary>The Shadow of the Gods · 51</summary><h2>Captivity and violence at Grimholt</h2><p>Skapti admits that Hakon ordered Grimholt to permit Drekr to bring and store goods and move freely north or west. This testimony adds a specific arrangement to the earlier observed meeting in Darl; the prince’s complete purpose remains undisclosed.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>The fugitives reach Darl</h2><p>At Helka’s gathering he is identified as her eldest son, dark-haired, fine-boned and muscular, with silver ornaments. He becomes alert at Skalk’s arrival and later offers to hunt the Bloodsworn.</p></details><details><summary>The Hunger of the Gods · 16</summary><h2>The fugitives reach Darl</h2><p>Before entering, Skalk prevents Skapti from reporting to him, saying he wants to conceal his own knowledge of Hakon’s dealings with Drekr. Hakon’s complete purpose remains undisclosed.</p></details><details><summary>The Hunger of the Gods · 23</summary><h2>Secrets in the Galdur tower</h2><p>In the prince’s absence, Skalk orders Guðvarr to befriend him and discover what he conceals from Helka, alleging a risk to the realm. He chooses Guðvarr as an unfamiliar ambitious warrior with a powerful female relative, expecting common ground. No meeting, disclosure or betrayal by Hakon occurs in this chapter.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>The Bloodsworn interrupt him having sex with an unnamed woman in a richly furnished chamber. His beard is oiled, braided and bound with silver. He calls for Yana and invokes his mother’s vengeance, then sees the dead guard and recognises Glornir.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>He says Vol predicted Glornir’s pursuit of Skalk, and that Skalk did not believe her. Asked where the pair are, he guesses the tower and then claims ignorance when told it has been searched. The truthfulness and limits of his professed ignorance are not established.</p></details><details><summary>The Hunger of the Gods · 26</summary><h2>The battle for Vol</h2><p>At Glornir’s order Røkia takes him, striking his jaw until it purples and forcing him naked into the corridor. At the chapter’s close she holds him before her with a seax at his throat, causing Helka to halt the battle; his eventual release or fate is unknown.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>He remains at seax-point while Glornir demands Vol or Skalk. Helka’s claim to have a spare frightens him into pleading; Estrid says he should die and that she would rule better. He complains of cold while an unnamed Bloodsworn woman mocks his nakedness and interrupted sex.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>The agreement retains him as the Bloodsworn’s surety until they leave Darl; Glornir promises release once clear, and Helka requires one of her Úlfhéðnar as guardian. No guardian is selected and he is not released in this chapter.</p></details><details><summary>The Hunger of the Gods · 27</summary><h2>A hostage ends the confrontation</h2><p>With permission, Guðvarr takes a cloak from a dead drengr and puts it around his shoulders while Røkia lifts her seax slightly. He thanks Guðvarr. This is a witnessed gesture, not proof of trust or friendship.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>Røkia holds him at seax-point during the night march to the dockside barracks; Æsa watches him while Varg’s party goes out. At departure he is seated in the drakkar’s prow beside Æsa’s spear, and Glornir tells Helka he has been fed and clothed.</p></details><details><summary>The Hunger of the Gods · 29</summary><h2>Brimil questioned at The Dead Drengr</h2><p>Frek joins him as Helka’s appointed guardian. Helka demands his prompt unharmed return and Glornir repeats his word, but the ship departs with Hakon still aboard. A completed release is not shown.</p></details><details><summary>The Hunger of the Gods · 32</summary><h2>Children hidden in the barrels</h2><p>He demands hot food, with Frek following silently and Æsa mocking his complaints. He expects release the next day, but Glornir instead promises Liga, claiming pursuers whom Hakon has not seen. Glornir denies him a say, dismisses fairness and directs him towards Frek’s iron collar. Hakon takes the cold herring and bread while muttering that it is an outrage.</p></details><details><summary>The Hunger of the Gods · 32</summary><h2>Children hidden in the barrels</h2><p>During Svik’s tale he jokes that the pleading widow does not resemble his mother and enjoys the company’s laughter. He nudges Frek when the fictional wolf receives his name, then objects to the story’s unfairness. The ending’s fictional boy Hakon rescues the wolf, but the real prince says he does not understand. Neither that rescue nor the boy’s stated age is added to his biography.</p></details><details><summary>The Hunger of the Gods · 33</summary><h2>A summons after the tower battle</h2><p>While he is absent, Skalk tells Guðvarr to use the gratitude he predicts from the cloak gesture when the prince returns. Skalk also reports inquiries indicating repeated visits to The Dead Drengr at night or before opening, and instructs Guðvarr to get closer to him there. No return, new meeting, friendship or revelation of his secrets occurs in this chapter.</p></details><details><summary>The Hunger of the Gods · 37</summary><h2>The Bloodsworn return to Liga</h2><p>At Liga Glornir entrusts him to Logur for later return to Helka with her longship. Logur agrees, and four guards escort him away at the jarl’s request while Frek follows. One spokeswoman has auburn hair and a scar beneath her left eye. Hakon no longer sails with the departing Bloodsworn here; his arrival back with Helka is not shown.</p></details><details><summary>The Hunger of the Gods · 41</summary><h2>Sigrún&#x27;s reckoning with Guðvarr</h2><p>He returns to Darl with Frek, escorted by two score of Helka’s drengrs. Guðvarr judges him better-looking than at their last encounter; he is clothed and still wearing the cloak Guðvarr gave him. He answers Guðvarr’s welcome with a curt nod. Recognition remains Guðvarr’s impression, rather than proof of trust or completed spying.</p></details><details><summary>The Hunger of the Gods · 41</summary><h2>Sigrún&#x27;s reckoning with Guðvarr</h2><p>The procession reaches Helka’s hall, where she leaves her merchant audience and welcomes him as her son. He kisses her hand and she announces a feast that night for his safe return. His reunion with Helka is now directly shown; no return voyage or arrival of the loaned drakkar is described.</p></details><details><summary>The Hunger of the Gods · 43</summary><h2>The feast and the shield-dance</h2><p>At his welcome feast he chooses the shield-dance and selects competitors. Guðvarr calls out, Hakon touches his cloak, then points to choose him. Hakon objects to Estrid choosing herself, but Helka’s look prompts her acceptance. No payment or explicit plan for Guðvarr to sabotage her is shown.</p></details><details><summary>The Hunger of the Gods · 43</summary><h2>The feast and the shield-dance</h2><p>He drinks and leaps around the shoulder-held shield course, pushing another contestant off. Estrid closes on him before Guðvarr’s collision removes her; Hakon crosses the finish and wins, with Estrid later standing second. He teases her and accepts Guðvarr’s flattery. Helka toasts him and he grins at the anonymous Hakon the Humper shout. The sobriquet is a feast joke, not an official title.</p></details><details><summary>The Hunger of the Gods · 43</summary><h2>The feast and the shield-dance</h2><p>Guðvarr wonders whether he will go to The Dead Drengr that night. This is anticipation only; no such visit, new confidence or disclosure of secrets occurs in the chapter.</p></details><details><summary>The Hunger of the Gods · 46</summary><h2>A secret meeting before dawn</h2><p>Before The Dead Drengr opens, he meets a messenger named Kalv, with Gudrun guarding the room. His black hair is tied low with leather. Kalv says Drekr requires proof before a message; Hakon lifts the back of his hair. Guðvarr sees short regrowth and a shadow like Úlfhéðnar tattoo lines, not a fully identified mark, ancestry or demonstrated power.</p></details><details><summary>The Hunger of the Gods · 46</summary><h2>A secret meeting before dawn</h2><p>Kalv reports that Drekr’s job is done and the day is coming. Hakon pales, asks whether she is free and receives agreement. Neither she nor the job is named in the exchange. His timing question is answered by an unnarrated whisper.</p></details><details><summary>The Hunger of the Gods · 46</summary><h2>A secret meeting before dawn</h2><p>He recognises Guðvarr from the shield-dance and cloak gift, orders Gudrun to sheath her sword, and invites him to drink and eat. He asks about Skalk and recalls Guðvarr carrying the talon for him before offering possible friendship. Rog subsequently calls the arriving Skapti and Hrolf more friends of the prince; that label and Hakon’s chance-meeting description do not establish the entire arrangement or its outcome.</p></details><details><summary>The Hunger of the Gods · 48</summary><h2>Flight from the breakfast table</h2><p>Skapti addresses him with a warning that Skalk is up to dark deeds. Guðvarr abruptly overturns the table into him, spilling hot food into his lap, and flees while Kalv draws his seax. No pursuit or killing order from Hakon is spoken in this chapter.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>Entering with Helka, he pales at the interrogation, denies knowing Kalv and calls Guðvarr a liar. He threatens flaying and a skull cup. At Guðvarr’s challenge he moves towards the door, hand twitching to his seax, but Frek restrains him. Helka shaves the regrown patch beneath his long black hair, exposing a fresh green-black, cracked and peeling dragon tattoo matching Kalv’s. The tattoo is evidence of the matching design, without establishing ancestry.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>Under the heated-knife threat, which singes hairs without a narrated skin wound, he says he fears Drekr and reveals Lik-Rifa’s release. He claims to have seen Drekr and other dragon-born and describes the chamber, book, spell and Tainted children. After Kalv is killed he relays Nastrandir’s location from him: the north-eastern Bonebacks, three days north of Svelgarth. These are his disclosures under threat, with location secondhand.</p></details><details><summary>The Hunger of the Gods · 52</summary><h2>Interrogation in the tower</h2><p>He explains joining Lik-Rifa through fear of the new power and concealing it through fear of Helka’s hatred of god-worshippers. He proposes joining her, but Helka refuses. Guðvarr later volunteers to pose as his replacement messenger; no actual appointment by Hakon or departure follows.</p></details><details><summary>The Hunger of the Gods · 77</summary><h2>Orna raised and the battle above Darl</h2><p>He accuses Guðvarr of the false attack timetable. After Helka falls he commands the Úlfhéðnar against Sigrún, but Guðvarr cuts his throat and the narration explicitly calls him a corpse. Estrid then calls the pack to her.</p></details><details><summary>Illustration · The Hunger of the Gods · 26</summary><p><a href="assets/8bfd5328314af6.jpg">Open noncanonical illustration</a></p><p>Røkia holds Hakon hostage during the confrontation with Helka.</p></details></noscript>
