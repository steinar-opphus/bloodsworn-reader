      <noscript><h1>Reading companion</h1><p>JavaScript is off. All narrative stays inside closed chapter disclosures.</p><details><summary>The Fury of the Gods · 51</summary><h2>Appearance</h2><p>Ulfrir names her as the hall tree’s Froa and says she resisted building/carving, so Snaka sang her asleep at his request. Elvar sees a huge hard woman’s face in the trunk, vine-like hair and knotted wooden limbs winding round it. Ulfrir says he knows the waking words and wants her to know Elvar means no harm. He begins singing, but the chapter shows no waking, answer, consent or new action by Gelta.</p></details><details><summary>The Fury of the Gods · 70</summary><h2>The gods collide and the tree burns</h2><p>At Ulfrir’s call she tears away from the trunk as a mead-hall-tall grey female Froa, knotted/hollow-lined face, vine-like hair and swirling green/amber eyes. She denounces the dragon and raises tree-thick roots that bind legs/neck/body and drag her attempted flight down. This is her actual waking/action, not the separate siege-ash spirit’s return or a new thrall oath.</p></details><details><summary>The Fury of the Gods · 70</summary><h2>The gods collide and the tree burns</h2><p>She renews roots as the dragon tears them and Raven-Feeders chop them, the fight passing between her legs toward the trunk. Rotta sets the tree alight; she lashes at him and beats the flames, but her vines catch, char and make her scream. Neither her death, full destruction of the tree nor final release/defeat of the dragon is yet shown.</p></details><details><summary>The Fury of the Gods · 71</summary><h2>Guðvarr finds Estrid</h2><p>Still partly restraining the dragon, she burns on arm/torso while two unnamed frost casters fail to extinguish the fire. She collapses to knees then ground in burning vines/hair and smoke; the binding roots fall away and the dragon flies free. The collapse/binding failure are observed, but the chapter does not explicitly settle her final death or recovery.</p></details><details><summary>The Fury of the Gods · 72</summary><h2>The roof ward opens</h2><p>Halja looks down with eagle-eyes and reports the Froa dead amid the burning tree/hall, after the preceding collapse and binding failure. This is a named witness report at this cutoff; no later recovery, body examination or new universal spirit rule is provided.</p></details><details><summary>The Fury of the Gods · 73</summary><h2>Brák’s hostages and Einar’s fall</h2><p>Varg sees the fallen Froa-spirit spread across the floor, its body consumed by fire after Halja’s report of death. No recovery or new universal rule about all Froa is shown.</p></details><details><summary>Illustration · The Fury of the Gods · 51</summary><p><a href="assets/d79e07ae4dafdc.jpg">Open noncanonical illustration</a></p><p>Gelta’s dormant form before any waking response is shown.</p></details><details><summary>Illustration · The Fury of the Gods · 70</summary><p><a href="assets/8226a3d8f585da.jpg">Open noncanonical illustration</a></p><p>Gelta’s first binding before the counterattack.</p></details><details><summary>Illustration · The Fury of the Gods · 70</summary><p><a href="assets/0bd7a42f24bf1f.jpg">Open noncanonical illustration</a></p><p>Rotta’s fire spreading over the hall tree.</p></details></noscript>
